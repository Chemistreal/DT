<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemistreal 채점·진단 (프로토타입)</title>
<style>
  :root{ --ink:#1a2230; --sub:#5b6677; --line:#e2e6ec; --bg:#f6f7f9; --card:#fff;
    --ok:#1f8a4c; --okbg:#e8f6ed; --no:#c0392b; --nobg:#fdecea; --accent:#2f5fe0; --accentbg:#eef2fd; --warn:#b8860b; }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; -webkit-text-size-adjust:100%}
  .wrap{max-width:760px; margin:0 auto; padding:16px 14px 80px}
  header{position:sticky; top:0; background:rgba(246,247,249,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); z-index:10}
  .hd{max-width:760px; margin:0 auto; padding:10px 14px; display:flex; align-items:center; gap:10px}
  .hd b{font-size:15px} .hd .proto{font-size:11.5px; color:var(--sub); border:1px solid var(--line); border-radius:20px; padding:2px 8px}
  .testbadge{margin-left:auto; font-size:11.5px; color:#fff; background:var(--warn); border-radius:20px; padding:2px 9px; display:none}
  .steps{display:flex; gap:4px; max-width:760px; margin:0 auto; padding:0 14px 8px; flex-wrap:wrap}
  .steps span{font-size:11.5px; color:var(--sub); padding:2px 7px; border-radius:20px; background:#eef0f3}
  .steps span.on{background:var(--accent); color:#fff}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:12px 0; box-shadow:0 1px 2px rgba(20,30,50,.03)}
  h1{font-size:19px; margin:.2em 0 .5em} h2{font-size:15px; margin:1.1em 0 .4em; color:var(--ink)}
  p.sub{color:var(--sub); font-size:13.5px; margin:.2em 0 1em}
  label{display:block; font-size:12.5px; color:var(--sub); margin:10px 0 4px}
  input,select{width:100%; padding:11px 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--accentbg); border-color:var(--accent)}
  .row2{display:flex; gap:10px} .row2>div{flex:1}
  button{font-family:inherit; cursor:pointer; border:0; border-radius:10px; font-size:15px; padding:12px 16px; background:var(--accent); color:#fff; font-weight:600}
  button.ghost{background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:500}
  button.ok{background:var(--ok)} button:disabled{opacity:.4; cursor:not-allowed}
  .btnrow{display:flex; gap:10px; margin-top:16px} .btnrow button{flex:1}
  .toggle{display:flex; align-items:center; gap:10px; margin-top:14px; padding:10px 12px; border:1px dashed var(--line); border-radius:10px; font-size:13px; color:var(--sub)}
  .toggle input{width:auto}
  .pill{display:inline-block; font-size:12px; padding:3px 10px; border-radius:20px; background:#eef0f3; color:var(--sub); margin:2px 4px 2px 0}
  .pdfbtn{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:500; margin:8px 0}
  .pdfbtn .ic{width:34px;height:34px;border-radius:8px;background:var(--accentbg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  /* 채점/재시 입력 */
  .qprog{position:sticky; top:86px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; color:var(--sub); display:flex; align-items:center; gap:10px; z-index:5}
  .bar{flex:1; height:6px; background:#eef0f3; border-radius:6px; overflow:hidden} .bar i{display:block; height:100%; background:var(--accent); width:0}
  .qitem{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line)}
  .qitem.cur{background:var(--accentbg); margin:0 -10px; padding:10px; border-radius:8px; border-bottom:0}
  .qn{font-weight:700; font-size:13px; color:var(--sub); min-width:34px; padding-top:2px}
  .qs{flex:1; font-size:14px}
  .qbtns{display:flex; gap:6px} .qbtns button{padding:7px 0; width:46px; font-size:15px; font-weight:700; background:#fff; color:var(--sub); border:1px solid var(--line)}
  .qbtns button.selO{background:var(--okbg); color:var(--ok); border-color:var(--ok)}
  .qbtns button.selX{background:var(--nobg); color:var(--no); border-color:var(--no)}
  .hint{font-size:12px; color:var(--sub); text-align:center; margin:10px 0}
  /* 리포트 */
  .score{display:flex; align-items:baseline; gap:12px} .score .big{font-size:46px; font-weight:800; line-height:1}
  .verdict{font-size:14px; font-weight:700; padding:4px 12px; border-radius:20px}
  .verdict.p{background:var(--okbg); color:var(--ok)} .verdict.f{background:var(--nobg); color:var(--no)}
  .meter{height:8px; background:#eef0f3; border-radius:8px; overflow:hidden; margin:12px 0} .meter i{display:block;height:100%}
  .kv{display:flex; justify-content:space-between; font-size:13.5px; padding:7px 0; border-bottom:1px solid var(--line)}
  .kv .r{color:var(--sub)} .tag{font-size:11.5px; padding:2px 8px; border-radius:6px; background:#eef0f3; color:var(--sub); margin-left:6px}
  .axis{font-size:13px; padding:8px 10px; border-radius:8px; background:var(--bg); margin:6px 0}
  /* 게이트 */
  .gate{border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0}
  .gate.done{border-color:var(--ok); background:var(--okbg)}
  .gate h3{font-size:14px; margin:0 0 6px} .gate .reading{font-size:13px; color:#33404f; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; margin:8px 0}
  .gate .reading b{color:var(--ink)} .gate .lab{font-size:11.5px; color:var(--accent); font-weight:700; letter-spacing:.02em}
  .lock{font-size:12px; color:var(--sub)} .unlocked{font-size:12px; color:var(--ok); font-weight:700}
  .done-hero{text-align:center; padding:24px 0}
  .done-hero .mark{font-size:40px; color:var(--ok)} .done-hero h1{font-size:24px}
  .muted{color:var(--sub); font-size:12.5px}
</style></head>
<body>
<header>
  <div class="hd"><b>Chemistreal 채점·진단</b><span class="proto">프로토타입 · 흐름 검증</span><span class="testbadge" id="testBadge">테스트 모드</span></div>
  <div class="steps" id="steps"></div>
</header>
<div class="wrap"><div id="app"></div></div>

<script>/* ============================================================
   Chemistreal 채점·진단·재시 로직 엔진 (Phase 2)
   - 순수 함수만. DOM·네트워크 없음. Node와 브라우저에서 동일 동작.
   - 여기서 테스트 통과한 코드가 그대로 앱(Phase 4)에 들어간다.
   ============================================================ */
(function (root) {
  'use strict';

  // ---------- 공통 유틸 ----------
  function norm(s) {            // 문장 정규화(공백·괄호 미세차 흡수) → 중복 판별용
    return (s || '').replace(/\s+/g, '').replace(/（/g, '(').replace(/）/g, ')').trim();
  }
  function cleanName(s) { return (s || '').replace(/\s+/g, '').trim(); }

  // ---------- 1) 학생키: 이름+학교 (학년은 키에서 제외, 속성으로만) ----------
  function studentKey(name, school) {
    return cleanName(school) + '-' + cleanName(name);   // 예: 휘문중-조준모
  }

  // ---------- 2) 5대 통합축 매핑 (보너스 진단층; 단원·오개념 그룹이 본체) ----------
  // unit + mis 텍스트를 함께 스캔. 매칭 없으면 null (리포트는 단원/오개념으로 폴백).
  var AXES = [
    { key: 'A1', name: '에너지·자발성·평형 (ΔG=ΔH−TΔS=−nFE°=−RT ln K)',
      kw: ['열역학','자발','엔트로피','전기화학','화학평형','평형','엔탈피','깁스','헤스','전지','전기분해','반응열'] },
    { key: 'A3', name: '결합·극성·산화수 (전기음성도 장부)',
      kw: ['전기음성도','산화수','산화','환원','결합','극성','루이스','이온화에너지'] },
    { key: 'A5', name: '원자구조→주기율표 (파울리→부껍질 용량)',
      kw: ['양자','오비탈','전자배치','전자 배치','주기율','부껍질','바닥상태','들뜬','원자 모형','원자모형'] },
    { key: 'A2', name: '분자 운동·반응 속도 (볼츠만 분포)',
      kw: ['반응속도','반응 속도','속도','활성화','촉매','충돌','기체','이상기체','실제기체','분압','분자 운동','확산'] },
    { key: 'A4', name: '동적 평형·상·용액 (증발↔응축↔용해)',
      kw: ['증기압','증발','액체','고체','총괄성','용해','농도','분자간','분자 간','상평형','포화'] }
  ];
  function axisOf(unit, mis) {
    var hay = (unit || '') + ' ' + (mis || '');
    for (var i = 0; i < AXES.length; i++) {
      for (var j = 0; j < AXES[i].kw.length; j++) {
        if (hay.indexOf(AXES[i].kw[j]) !== -1) return AXES[i];
      }
    }
    return null;
  }
  function axisName(key) { for (var i=0;i<AXES.length;i++) if (AXES[i].key===key) return AXES[i].name; return key; }

  // ---------- 3) 채점 ----------
  // studentAnswers: ['O'|'X'|''] 길이 = keyItems.length (보통 60)
  // keyItems: 정시 items [{n,u,mis,a,s,f,w,lvl,c}]
  // scoring: {per, max, pass}
  function gradeAttempt(studentAnswers, keyItems, scoring) {
    var per = (scoring && scoring.per) || (100 / keyItems.length);
    var passScore = (scoring && scoring.pass) != null ? scoring.pass : 80;
    var perItem = [], correct = 0, blank = 0;
    for (var i = 0; i < keyItems.length; i++) {
      var it = keyItems[i];
      var sa = (studentAnswers[i] || '').toUpperCase();
      var isBlank = (sa !== 'O' && sa !== 'X');
      var ok = (!isBlank && sa === String(it.a).toUpperCase());
      if (ok) correct++;
      if (isBlank) blank++;
      perItem.push({
        idx: i, id: it.n, c: it.c || null, unit: it.u, mis: it.mis,
        lvl: it.lvl || 1, studentAns: isBlank ? '' : sa, correctAns: it.a,
        ok: ok, blank: isBlank, f: it.f, w: it.w
      });
    }
    var scoreRaw = correct * per;
    var score = Math.round(scoreRaw * 10) / 10;       // 표시용 소수1
    var pass = scoreRaw >= passScore - 1e-6;
    return {
      n: keyItems.length, correctCount: correct, blankCount: blank,
      wrongCount: keyItems.length - correct - blank,
      score: score, scoreInt: Math.round(scoreRaw), max: (scoring && scoring.max) || 100,
      passScore: passScore, pass: pass, perItem: perItem
    };
  }

  // 채점결과 → 교정 필요 개념(틀림 또는 미기입). cid 없으면 문항 자체 정보로 폴백.
  function notCorrectConcepts(graded) {
    var seenCid = {}, out = [];
    graded.perItem.forEach(function (p) {
      if (p.ok) return;                         // 맞은 건 제외
      var keyC = p.c || ('NOID:' + p.idx);      // cid 없으면 문항별 폴백키
      if (seenCid[keyC]) { seenCid[keyC].count++; return; }
      var rec = { c: p.c || null, unit: p.unit, mis: p.mis, lvl: p.lvl,
                  f: p.f, w: p.w, count: 1, blank: p.blank };
      seenCid[keyC] = rec; out.push(rec);
    });
    return out;
  }

  // ---------- 4) 진단 (단발 1회차) ----------
  function diagnose(graded, formsBank) {
    formsBank = formsBank || {};
    var byUnit = {}, byMis = {}, byAxis = {};
    graded.perItem.forEach(function (p) {
      // 단원별
      var u = byUnit[p.unit] || (byUnit[p.unit] = { unit: p.unit, total: 0, wrong: 0 });
      u.total++; if (!p.ok) u.wrong++;
      // 축별
      var ax = axisOf(p.unit, p.mis);
      if (ax) {
        var a = byAxis[ax.key] || (byAxis[ax.key] = { key: ax.key, name: ax.name, total: 0, wrong: 0 });
        a.total++; if (!p.ok) a.wrong++;
      }
      // 오개념별 (틀린 것만 집계)
      if (!p.ok) {
        var m = byMis[p.mis] || (byMis[p.mis] = { mis: p.mis, unit: p.unit, count: 0, cids: [] });
        m.count++; if (p.c && m.cids.indexOf(p.c) === -1) m.cids.push(p.c);
      }
    });
    // 교정 개념 + 강의록 부착
    var wrongConcepts = notCorrectConcepts(graded).map(function (w) {
      var reading = (w.c && formsBank[w.c] && formsBank[w.c].reading) ? formsBank[w.c].reading : null;
      return { c: w.c, unit: w.unit, mis: w.mis, lvl: w.lvl, blank: w.blank,
               reading: reading, fix: w.f, why: w.w,
               hasReading: !!(reading && (reading.oneline || reading.core)) };
    });
    function toSortedArr(obj, rateBase) {
      return Object.keys(obj).map(function (k) {
        var o = obj[k]; if (rateBase) o.rate = o.total ? Math.round(100 * o.wrong / o.total) : 0; return o;
      }).sort(function (a, b) { return (b.wrong||b.count) - (a.wrong||a.count); });
    }
    return {
      score: graded.score, pass: graded.pass, passScore: graded.passScore,
      correctCount: graded.correctCount, wrongCount: graded.wrongCount, blankCount: graded.blankCount,
      byUnit: toSortedArr(byUnit, true),
      byMisconception: toSortedArr(byMis, false),
      byAxis: toSortedArr(byAxis, true),
      wrongConcepts: wrongConcepts
    };
  }

  // ---------- 5) 읽음 확인 게이트 ----------
  // wrongConcepts: diagnose의 wrongConcepts
  // 각 개념: 강의록(있으면) + 확인질문(아직 안 본 다른 form O/X) 1개. 없으면 폴백(옳은문장 재확인).
  function buildGate(wrongConcepts, formsBank, seenStatements) {
    formsBank = formsBank || {}; seenStatements = seenStatements || {};
    var gates = [];
    wrongConcepts.forEach(function (w) {
      var check = null, fallback = false;
      if (w.c && formsBank[w.c] && formsBank[w.c].forms) {
        var fresh = formsBank[w.c].forms.filter(function (fm) { return !seenStatements[norm(fm.s)]; });
        var pick = fresh[0] || formsBank[w.c].forms[0];
        if (pick) { check = { s: pick.s, a: pick.a, f: pick.f, w: pick.w }; seenStatements[norm(pick.s)] = 1; }
      }
      if (!check) {                       // 폴백: cid 없거나 form 없음 → 옳은 문장 재확인(정답 O)
        fallback = true;
        check = { s: w.fix || w.mis, a: 'O', f: w.fix, w: w.why };
        seenStatements[norm(check.s)] = 1;
      }
      gates.push({
        c: w.c, unit: w.unit, mis: w.mis,
        reading: w.reading || null, hasReading: w.hasReading,
        check: check, fallback: fallback
      });
    });
    return { gates: gates, seenStatements: seenStatements };
  }

  // ---------- 6) 재시 생성 (점점 쉽게 + 개별화) ----------
  // attemptNo: 2=재시, 3=재재시  (정시=1)
  // cbandVersions: round.retakeC = [{v,items:[{c,u,a,s,f,w}]}...] (C=기본, 더 쉬움)
  // wrongCids: 직전 시도에서 틀린 개념 cid 집합(객체/배열)
  // formsBank: 개별화용 대체 form 소스
  // seenStatements: 이미 학생이 본 문장(중복 방지) — 갱신해서 반환
  function buildRetake(attemptNo, cbandVersions, wrongCids, formsBank, seenStatements) {
    formsBank = formsBank || {}; seenStatements = seenStatements || {};
    var wrong = {};
    (Array.isArray(wrongCids) ? wrongCids : Object.keys(wrongCids || {})).forEach(function (c) { if (c) wrong[c] = 1; });
    if (!cbandVersions || !cbandVersions.length) return { items: [], seenStatements: seenStatements };
    // 재시→C v1(index0), 재재시→C v2(index1) ... 없으면 마지막 버전 재사용
    var base = cbandVersions[Math.min(attemptNo - 2, cbandVersions.length - 1)].items;

    function freshForm(cid, avoidStmt) {
      var fb = formsBank[cid];
      if (!fb || !fb.forms) return null;
      var cand = fb.forms.filter(function (fm) {
        return !seenStatements[norm(fm.s)] && norm(fm.s) !== norm(avoidStmt);
      });
      return cand[0] || null;
    }

    var items = base.map(function (it) {
      var stmt = it.s, ans = it.a, fix = it.f, why = it.w, swapped = false;
      var needFresh = wrong[it.c] || seenStatements[norm(it.s)];  // 틀린 개념이거나 이미 본 문장이면 교체 시도
      if (needFresh) {
        var nf = freshForm(it.c, it.s);
        if (nf) { stmt = nf.s; ans = nf.a; fix = nf.f; why = nf.w; swapped = true; }
      }
      seenStatements[norm(stmt)] = 1;
      var mis = (formsBank[it.c] && formsBank[it.c].m) || '';
      return { c: it.c, u: it.u, mis: mis, a: ans, s: stmt, f: fix, w: why,
               targeted: !!wrong[it.c], swapped: swapped };
    });
    return { items: items, seenStatements: seenStatements, n: items.length };
  }

  // ---------- 7) 누적 (학생 단위, 미응시는 생략, null-safe) ----------
  // rows: 제출 기록 배열. 각 row:
  //   {studentKey, name, school, year, course, round, attempt('정시'|'재시'|'재재시'),
  //    score, pass(bool), date, wrongMis:[..], wrongAxes:{key:count}, isTest(bool)}
  // 반환: {studentKey: {info, trend[], chronicMis[], axisWeak[], roundsTaken[], coverageRound, attemptsTotal}}
  function cumulative(rows) {
    rows = rows || [];
    var byStu = {};
    rows.forEach(function (r) {
      var k = r.studentKey || studentKey(r.name, r.school);
      (byStu[k] || (byStu[k] = [])).push(r);
    });

    var out = {};
    Object.keys(byStu).forEach(function (k) {
      var rs = byStu[k];
      // 회차별 묶기 (course+round)
      var rounds = {};
      rs.forEach(function (r) {
        var rk = r.course + '#' + r.round;
        (rounds[rk] || (rounds[rk] = { course: r.course, round: r.round, attempts: [] })).attempts.push(r);
      });
      // trend: 실제로 본 회차만, round 순. (미응시 회차는 애초에 키가 없어 자동 생략)
      var trend = Object.keys(rounds).map(function (rk) {
        var R = rounds[rk];
        R.attempts.sort(function (a, b) { return order(a.attempt) - order(b.attempt); });
        var jeong = R.attempts.find(function (a) { return a.attempt === '정시'; });
        var last = R.attempts[R.attempts.length - 1];
        var passedAny = R.attempts.some(function (a) { return a.pass; });
        return {
          course: R.course, round: R.round,
          jeongsiScore: jeong ? jeong.score : null,
          finalScore: last ? last.score : null,
          finalAttempt: last ? last.attempt : null,
          attemptsCount: R.attempts.length,
          passed: passedAny,
          date: last ? last.date : null
        };
      }).sort(function (a, b) {
        if (a.course !== b.course) return a.course < b.course ? -1 : 1;
        return a.round - b.round;
      });

      // 고질 오개념: 서로 다른 회차에서 반복해서 틀린 것 (≥2회차)
      var misRounds = {};
      rs.forEach(function (r) {
        (r.wrongMis || []).forEach(function (m) {
          (misRounds[m] || (misRounds[m] = {}))[r.course + '#' + r.round] = 1;
        });
      });
      var chronic = Object.keys(misRounds).map(function (m) {
        return { mis: m, rounds: Object.keys(misRounds[m]).length };
      }).filter(function (x) { return x.rounds >= 2; })

의 종류에 따라 정해지는 값**이다. 같은 용매라면 용질이 달라도 Kb, Kf는 같다.", "kill": "\"Kb, Kf가 용질의 종류(또는 농도)에 따라 정해진다\"거나 \"모든 용매에서 같다\"는 착각이다. Kb, Kf는 **용매 고유**의 값이라, 물은 물의 Kb·Kf, 다른 용매는 그 용매의 Kb·Kf를 가진다. 용질이 무엇이든 같은 용매면 같은 값이다.", "oneline": "**Kb, Kf = 용매 고유의 값**(용질 종류와 무관)."}}, "CH2-143": {"m": "반트호프 인자", "t": "B", "forms": [{"a": "O", "s": "CaCl2는 물에서 입자 수가 약 3배가 된다(i≈3).", "f": "CaCl2는 물에서 입자 수가 약 3배가 된다(i≈3).", "w": "이온 3개로 나뉜다."}, {"a": "O", "s": "반트호프 인자 i는 용질 1개가 내놓는 입자 수를 반영한다.", "f": "반트호프 인자 i는 용질 1개가 내놓는 입자 수를 반영한다.", "w": "이온화 정도를 반영한다."}, {"a": "O", "s": "NaCl은 물에서 입자 수가 약 2배가 된다(i≈2).", "f": "NaCl은 물에서 입자 수가 약 2배가 된다(i≈2).", "w": "이온 2개로 나뉜다."}, {"a": "O", "s": "비전해질인 포도당은 이온화하지 않아 i≈1이다.", "f": "비전해질인 포도당은 이온화하지 않아 i≈1이다.", "w": "이온화하지 않는다."}, {"a": "O", "s": "총괄성 계산에서 전해질은 반트호프 인자 i를 곱해야 한다.", "f": "총괄성 계산에서 전해질은 반트호프 인자 i를 곱해야 한다.", "w": "입자 수가 늘어난다."}, {"a": "O", "s": "반트호프 인자가 클수록 같은 몰랄 농도에서 총괄성이 크다.", "f": "반트호프 인자가 클수록 같은 몰랄 농도에서 총괄성이 크다.", "w": "입자 수가 많다."}, {"a": "X", "s": "NaCl은 물에서 이온화하지 않아 입자 수가 그대로이다.", "f": "NaCl은 물에서 이온화하여 입자 수가 약 2배가 된다.", "w": "이온 2개로 나뉜다."}, {"a": "X", "s": "포도당은 전해질이라 물에서 이온화한다.", "f": "포도당은 비전해질이라 물에서 이온화하지 않는다.", "w": "이온화하지 않는다."}, {"a": "X", "s": "반트호프 인자는 모든 용질에서 1이다.", "f": "반트호프 인자는 전해질에서 1보다 크다.", "w": "이온화로 입자 수가 는다."}, {"a": "X", "s": "NaCl의 반트호프 인자는 약 1이다.", "f": "NaCl의 반트호프 인자는 약 2이다.", "w": "이온 2개로 나뉜다."}], "reading": {"core": "반트호프 인자(i)는 **용질 1개가 물에서 내놓는 입자 수**를 반영한다. NaCl은 i≈2(Na⁺ + Cl⁻), CaCl₂는 i≈3(Ca²⁺ + 2Cl⁻), 비전해질 포도당은 i≈1이다. 총괄성 계산에서 전해질은 i를 곱한다.", "kill": "\"모든 용질의 반트호프 인자가 1\"이라거나 \"NaCl의 i가 약 1\"이라는 착각이다. 전해질은 이온화로 입자 수가 늘어 i가 1보다 크다(NaCl≈2, CaCl₂≈3). i가 클수록 같은 몰랄 농도에서 총괄성이 크다.", "oneline": "**i = 입자 수**(NaCl≈2, CaCl₂≈3, 포도당≈1). 총괄성은 입자 수만 세므로 전해질은 i배가 되고, 실제 i는 이온 쌍 탓에 정수보다 살짝 작다."}}, "CH2-048": {"m": "그레이엄 법칙", "t": "A", "forms": [{"a": "O", "s": "기체의 확산 속도는 분자량의 제곱근에 반비례한다.", "f": "기체의 확산 속도는 분자량의 제곱근에 반비례한다.", "w": "그레이엄 법칙이다."}, {"a": "O", "s": "그레이엄 법칙을 이용하면 두 기체의 확산 속도 비로부터 분자량 비를 구할 수 있다.", "f": "그레이엄 법칙을 이용 분자는 분자 간 힘이 전혀 없다.", "f": "무극성 분자에서도 분산력이 작용한다.", "w": "분산력은 모든 분자에 작용한다."}, {"a": "X", "s": "CO2는 극성 분자라 쌍극자-쌍극자 힘이 작용한다.", "f": "CO2는 무극성 분자라 분산력만 작용한다.", "w": "대칭이라 무극성이다."}, {"a": "X", "s": "무극성 분자는 수소 결합을 한다.", "f": "무극성 분자는 수소 결합을 하지 않는다.", "w": "조건을 갖추지 못한다."}], "reading": {"core": "무극성 분자에서는 **분산력만** 작용한다. CH₄, CO₂ 같은 무극성 분자는 영구 쌍극자가 없어 쌍극자-쌍극자 힘이 없고, 분산력의 크기로 끓는점이 정해진다.", "kill": "\"무극성 분자에서도 쌍극자-쌍극자 힘이 작용한다\"거나 \"CO₂가 극성이라 쌍극자-쌍극자 힘이 작용한다\"는 착각이다. CO₂는 대칭 구조라 무극성이고, 무극성 분자는 영구 쌍극자가 없어 분산력만 가진다(분산력은 모든 분자에 작용하므로 \"힘이 전혀 없다\"도 틀림).", "oneline": "**무극성 분자 = 분산력만 작용**(CH₄, CO₂). 영구 쌍극자가 없어 쌍극자-쌍극자 힘은 없지만, 분산력은 모든 분자에 작용한다."}}, "CH2-064": {"m": "분압-몰분율", "t": "A", "forms": [{"a": "O", "s": "어떤 기체의 부분 압력은 전체 압력에 그 기체의 몰분율을 곱한 값이다.", "f": "어떤 기체의 부분 압력은 전체 압력에 그 기체의 몰분율을 곱한 값이다.", "w": "분압 = 전체 압력 × 몰분율이다."}, {"a": "O", "s": "전체 압력이 일정하면 몰분율이 큰 성분일수록 분압이 크다.", "f": "전체 압력이 일정하면 몰분율이 큰 성분일수록 분압이 크다.", "w": "분압이 몰분율에 비례한다."}, {"a": "O", "s": "분압 = 전체 압력 × 몰분율이다.", "f": "분압 = 전체 압력 × 몰분율이다.", "w": "정의 관계이다."}, {"a": "O", "s": "몰분율이 0.3인 성분의 분압은 전체 압력의 0.3배이다.", "f": "몰분율이 0.3인 성분의 분압은 전체 압력의 0.3배이다.", "w": "몰분율을 곱한다."}, {"a": "O", "s": "전체 압력이 같으면 분압은 몰분율에 비례한다.", "f": "전체 압력이 같으면 분압은 몰분율에 비례한다.", "w": "분압 = 전체 압력 × 몰분율이다."}, {"a": "O", "s": "분압이 큰 성분일수록 몰분율도 크다.", "f": "분압이 큰 성분일수록 몰분율도 크다.", "w": "비례 관계이다."}, {"a": "O", "s": "몰분율을 알면 전체 압력에서 각 성분의 분압을 구할 수 있다.", "f": "몰분율을 알면 전체 압력에서 각 성분의 분압을 구할 수 있다.", "w": "곱으로 구한다."}, {"a": "O", "s": "분압과 전체 압력의 비는 그 성분의 몰분율과 같다.", "f": "분압과 전체 압력의 비는 그 성분의 몰분율과 같다.", "w": "분압/전체 압력 = 몰분율이다."}, {"a": "O", "s": "두 기체의 분압비는 몰분율비와 같다.", "f": "두 기체의 분압비는 몰분율비와 같다.", "w": "분압이 몰분율에 비례한다."}, {"a": "X", "s": "분압은 전체 압력에 몰분율을 곱한 값과 다르다.", "f": "분압은 전체 압력에 몰분율을 곱한 값이다.", "w": "정의 관계이다."}, {"a": "X", "s": "전체 압력이 일정할 때 분압이 큰 성분일수록 몰분율이 작다.", "f": "전체 압력이 일정할 때 분압이 큰 성분일수록 몰분율이 크다.", "w": "비례 관계이다."}, {"a": "X", "s": "분압은 전체 압력을 몰분율로 나눈 값이다.", "f": "분압은 전체 압력에 몰분율을 곱한 값이다.", "w": "곱한다."}, {"a": "X", "s": "몰분율이 작은 성분일수록 분압이 크다.", "f": "몰분율이 큰 성분일수록 분압이 크다.", "w": "비례 관계이다."}, {"a": "X", "s": "분압은 몰분율과 무관하다.", "f": "분압은 몰분율에 비례한다.", "w": "분압 = 전체 압력 × 몰분율이다."}, {"a": "X", "s": "전체 압력에 몰분율을 더하면 분압이 된다.", "f": "전체 압력에 몰분율을 곱하면 분압이 된다.", "w": "곱한다."}], "reading": {"core": "어떤 기체의 분압은 **전체 압력 × 그 기체의 몰분율**이다. 전체 압력이 일정하면 분압은 몰분율에 **비례**하므로, 몰분율이 큰 성분일수록 분압이 크다.", "kill": "\"분압이 전체 압력을 몰분율로 나눈 값\"이라거나 \"전체 압력에 몰분율을 더한 값\"이라거나 \"몰분율과 무관\"이라는 착각이다. 분압 = 전체 압력 × 몰분율(곱셈)이고, 분압과 전체 압력의 비가 곧 몰분율이다.", "oneline": "**분압 = 전체 압력 × 몰분율**(P ∝ n에서 나옴). 분압/전체압력 = 몰분율이고, 이상 기체는 몰분율·부피분율·압력분율이 모두 같다."}}};

<script>
const $=s=>document.querySelector(s);
const STEPS=[['id','학생'],['select','회차'],['pdf','시험지'],['grade','정시 채점'],['report','진단'],['gate','강의록'],['retake','재시'],['done','완료']];
let S={ view:'id', name:'', school:'', grade:'', isTest:false,
        round:ROUND, attemptNo:1, attempts:[], keyItems:[], answers:[], cur:0,
        graded:null, dx:null, gate:null, seen:{} };

function renderSteps(){
  const order={id:0,select:1,pdf:2,grade:3,report:4,gate:5,retake:6,done:7};
  const活=S.view==='retake'?(S.attemptNo>=2?6:6):order[S.view];
  $('#steps').innerHTML=STEPS.map((s,i)=>`<span class="${i===order[S.view]?'on':''}">${s[1]}</span>`).join('');
  $('#testBadge').style.display=S.isTest?'inline-block':'none';
}
function go(v){ S.view=v; render(); window.scrollTo(0,0); }

// ---------- 채점/재시 공용 입력 컴포넌트 ----------
function setAns(i,v){ S.answers[i]=v; if(i===S.cur){ const n=S.answers.findIndex((a,j)=>j>i&&!a); S.cur=n>=0?n:i; } render(); }
function keyHandler(e){
  if(S.view!=='grade'&&S.view!=='retake') return;
  const k=e.key.toLowerCase();
  if(k==='o'||k==='ㅐ'){ setAns(S.cur,'O'); }
  else if(k==='x'||k==='ㅌ'){ setAns(S.cur,'X'); }
  else if(e.key==='ArrowDown'){ S.cur=Math.min(S.cur+1,S.keyItems.length-1); render(); }
  else if(e.key==='ArrowUp'){ S.cur=Math.max(S.cur-1,0); render(); }
}
document.addEventListener('keydown',keyHandler);

function inputScreen(title,subtitle,submitLabel,onSubmit,showStmt){
  const done=S.answers.filter(a=>a==='O'||a==='X').length, n=S.keyItems.length;
  const rows=S.keyItems.map((it,i)=>`
    <div class="qitem ${i===S.cur?'cur':''}" onclick="S.cur=${i};render()">
      <div class="qn">${it.n||(i+1)}</div>
      ${showStmt?`<div class="qs">${it.s}</div>`:`<div class="qs muted">문항 ${i+1} · OMR 표기 입력</div>`}
      <div class="qbtns">
        <button class="${S.answers[i]==='O'?'selO':''}" onclick="event.stopPropagation();setAns(${i},'O')">O</button>
        <button class="${S.answers[i]==='X'?'selX':''}" onclick="event.stopPropagation();setAns(${i},'X')">X</button>
      </div></div>`).join('');
  return `<div class="card">
    <h1>${title}</h1><p class="sub">${subtitle}</p>
    <div class="qprog"><span>${done}/${n}</span><div class="bar"><i style="width:${100*done/n}%"></i></div></div>
    ${rows}
    <p class="hint">키보드 <b>O</b> 또는 <b>X</b>로 입력하면 다음 문항으로 자동 이동</p>
    <div class="btnrow"><button ${done<n?'':''} onclick="(${onSubmit.name})()">${submitLabel}${done<n?` (${n-done}개 남음 — 미기입은 오답)`:''}</button></div>
  </div>`;
}

// ---------- 흐름 ----------
function startGrade(items,attemptNo){ S.keyItems=items; S.answers=new Array(items.length).fill(''); S.cur=0; S.attemptNo=attemptNo; }
function submitJeongsi(){ doGrade(); }
function submitRetake(){ doGrade(); }
function doGrade(){
  const g=ChemEngine.gradeAttempt(S.answers,S.keyItems,S.round.scoring);
  const dx=ChemEngine.diagnose(g,BANK);
  S.graded=g; S.dx=dx;
  const att=S.attemptNo===1?'정시':S.attemptNo===2?'재시':'재재시';
  S.attempts.push({attempt:att,score:g.score,pass:g.pass});
  // 본 문장 seen 처리
  S.keyItems.forEach(it=>{ S.seen[ChemEngine.norm(it.s)]=1; });
  go('report');
}
function afterReport(){
  if(S.graded.pass){ go('done'); return; }
  // 게이트 생성
  S.gate=ChemEngine.buildGate(S.dx.wrongConcepts,BANK,S.seen);
  S.gate.gates.forEach(g=>g._unlocked=false);
  go('gate');
}
function answerCheck(i,v){
  const g=S.gate.gates[i];
  g._answered=v; g._unlocked=(v===g.check.a);
  render();
}
function allUnlocked(){ return S.gate.gates.every(g=>g._unlocked); }
function startRetake(){
  const wrongCids=S.dx.wrongConcepts.map(w=>w.c).filter(Boolean);
  const next=S.attemptNo+1; // 정시(1)→재시(2)→재재시(3)
  const rt=ChemEngine.buildRetake(next,S.round.retakeC,wrongCids,BANK,S.seen);
  S.seen=rt.seenStatements;
  startGrade(rt.items,next);
  go('retake');
}

// ---------- 렌더 ----------
function render(){
  renderSteps();
  const v=S.view; let h='';
  if(v==='id'){
    h=`<div class="card"><h1>학생 정보</h1><p class="sub">이름과 학교로 학생을 식별합니다. 학년은 응시 시점 기록용입니다.</p>
      <label for="f_name">이름</label><input id="f_name" value="${S.name}" placeholder="예: 조준모">
      <div class="row2"><div><label for="f_school">학교</label><input id="f_school" value="${S.school}" placeholder="예: 휘문중"></div>
      <div><label for="f_grade">학년</label><input id="f_grade" value="${S.grade}" placeholder="예: 2"></div></div>
      <div class="toggle"><input type="checkbox" id="f_test" ${S.isTest?'checked':''}><label for="f_test" style="margin:0;color:inherit">테스트 모드 — 예시 학생으로 전 과정 점검 (시트에 테스트로 기록)</label></div>
      <div class="btnrow"><button onclick="saveId()">이 학생 시작</button></div></div>`;
  }
  else if(v==='select'){
    h=`<div class="card"><h1>시험 선택</h1><p class="sub">${S.name} · ${S.school} ${S.grade?S.grade+'학년':''}</p>
      <div class="card" style="margin:0;border-color:var(--accent)"><h2 style="margin:0">${S.round.title}</h2>
      <p class="muted">정시 ${S.round.jeongsi.n}문항 · 통과 ${S.round.scoring.pass}점 · 누적 범위</p></div>
      <p class="muted" style="margin-top:10px">프로토타입은 이 1개 회차로 흐름을 점검합니다. 실제 앱은 화학1·2·일반화학 46회차 전체.</p>
      <div class="btnrow"><button class="ghost" onclick="go('id')">뒤로</button><button onclick="go('pdf')">이 회차로 진행</button></div></div>`;
  }
  else if(v==='pdf'){
    h=`<div class="card"><h1>시험지 인쇄</h1><p class="sub">PDF를 내려받아 인쇄하고 학생에게 응시시킵니다. 응시가 끝나면 OMR을 걷어 채점하세요.</p>
      <button class="pdfbtn"><span class="ic">시험</span><span>시험지 PDF 받기<br><span class="muted">${S.round.title} · 60문항</span></span></button>
      <button class="pdfbtn"><span class="ic">OMR</span><span>OMR 답안지 PDF 받기<br><span class="muted">60칸 세로 배열</span></span></button>
      <p class="muted">(프로토타입에서는 실제 다운로드 대신 자리표시입니다. 실제 앱은 회차별 PDF로 연결.)</p>
      <div class="btnrow"><button class="ghost" onclick="go('select')">뒤로</button><button onclick="startGrade(S.round.jeongsi.items,1);go('grade')">채점 시작</button></div></div>`;
  }
  else if(v==='grade'){
    h=inputScreen('정시 채점','OMR을 보고 각 문항을 O 또는 X로 입력하세요.','채점 완료',submitJeongsi,false);
  }
  else if(v==='report'){
    const g=S.graded,dx=S.dx, att=S.attempts[S.attempts.length-1].attempt;
    const col=g.pass?'var(--ok)':'var(--no)';
    h=`<div class="card">
      <h1>성적 진단 <span class="muted" style="font-weight:400">· ${att}</span></h1>
      <div class="score"><div class="big" style="color:${col}">${g.score}</div><div class="muted">/ ${g.max}점</div>
        <div class="verdict ${g.pass?'p':'f'}">${g.pass?'통과':'미달 (기준 '+g.passScore+')'}</div></div>
      <div class="meter"><i style="width:${g.score}%;background:${col}"></i></div>
      <div class="kv"><span>맞음 ${g.correctCount}</span><span class="r">틀림 ${g.wrongCount} · 미기입 ${g.blankCount}</span></div>
      <h2>흔들린 5대 축</h2>
      ${dx.byAxis.length?dx.byAxis.map(a=>`<div class="axis"><b>${a.key}</b> ${a.name.split('(')[0]} <span class="tag">${a.wrong}/${a.total} 오답</span></div>`).join(''):'<p class="muted">축 매핑 해당 없음</p>'}
      <h2>오개념 (틀린 항목)</h2>
      ${dx.byMisconception.slice(0,8).map(m=>`<div class="kv"><span>${m.mis}</span><span class="r">${m.unit} · ${m.count}회</span></div>`).join('')||'<p class="muted">없음</p>'}
      <h2>단원별 정답률</h2>
      ${dx.byUnit.map(u=>`<div class="kv"><span>${u.unit}</span><span class="r">${u.total-u.wrong}/${u.total} (${100-u.rate}%)</span></div>`).join('')}
      <div class="btnrow">${g.pass
        ? `<button class="ok" onclick="go('done')">통과 화면으로</button>`
        : `<button onclick="afterReport()">강의록 학습 후 재시 준비</button>`}</div>
      <p class="muted" style="margin-top:8px">이 화면은 뼈대입니다. 인포그래픽 고급 리포트는 Phase 5에서.</p>
    </div>`;
  }
  else if(v==='gate'){
    const gs=S.gate.gates;
    h=`<div class="card"><h1>강의록 확인</h1><p class="sub">틀린 개념의 강의록을 읽고, 확인 문제를 맞히면 잠금이 풀립니다. 모두 풀면 재시를 볼 수 있습니다.</p>
      ${gs.map((g,i)=>`<div class="gate ${g._unlocked?'done':''}">
        <h3>${g.mis} <span class="muted" style="font-weight:400">· ${g.unit}</span> ${g._unlocked?'<span class="unlocked">✓ 해제됨</span>':'<span class="lock">잠김</span>'}</h3>
        ${g.hasReading&&g.reading?`<div class="reading"><span class="lab">한 줄 정리</span><br>${g.reading.oneline||g.reading.core}</div>`
          :`<div class="reading"><span class="lab">교정 포인트</span><br><b>옳은 설명:</b> ${g.check.f||g.mis}<br><span class="muted">${g.check.w||''}</span></div>`}
        <div style="font-size:13.5px;margin:8px 0 6px"><b>확인 문제.</b> ${g.check.s}</div>
        <div class="qbtns">
          <button class="${g._answered==='O'?(g.check.a==='O'?'selO':'selX'):''}" onclick="answerCheck(${i},'O')">O</button>
          <button class="${g._answered==='X'?(g.check.a==='X'?'selO':'selX'):''}" onclick="answerCheck(${i},'X')">X</button>
          ${g._answered&&!g._unlocked?'<span class="lock" style="align-self:center;margin-left:8px">다시 — 강의록을 보고 고르세요</span>':''}
        </div></div>`).join('')}
      <div class="btnrow"><button ${allUnlocked()?'':'disabled'} onclick="startRetake()">${allUnlocked()?'재시 시작':'모든 개념을 해제하면 재시 시작'}</button></div></div>`;
  }
  else if(v==='retake'){
    const label=S.attemptNo===2?'재시 (기본 난이도)':'재재시 (기본 난이도 · 더 직설적)';
    h=inputScreen(label,'강의록을 학습했으니, 같은 범위를 다시 풉니다. 틀렸던 개념은 다른 문장으로 나옵니다.', S.attemptNo===2?'재시 제출':'재재시 제출', submitRetake, true);
  }
  else if(v==='done'){
    const last=S.attempts[S.attempts.length-1];
    h=`<div class="card done-hero"><div class="mark">✓</div>
      <h1>통과했습니다</h1>
      <p class="sub">${S.name} · ${last.attempt} ${last.score}점</p>
      <p>잘했습니다. 다음 수업에서 봅시다.</p>
      <div style="margin-top:14px">${S.attempts.map(a=>`<span class="pill">${a.attempt} ${a.score}${a.pass?' ✓':''}</span>`).join('')}</div>
      <div class="btnrow" style="max-width:320px;margin:18px auto 0"><button class="ghost" onclick="resetAll()">처음부터 다시</button></div>
      <p class="muted" style="margin-top:10px">실제 앱은 여기서 결과를 시트에 기록하고 학부모 리포트 URL을 만듭니다 (Phase 4).</p></div>`;
  }
  $('#app').innerHTML=h;
}
function saveId(){
  S.name=$('#f_name').value.trim()||'학생'; S.school=$('#f_school').value.trim()||'학교';
  S.grade=$('#f_grade').value.trim(); S.isTest=$('#f_test').checked; go('select');
}
function resetAll(){ S={ view:'id', name:'', school:'', grade:'', isTest:false, round:ROUND, attemptNo:1, attempts:[], keyItems:[], answers:[], cur:0, graded:null, dx:null, gate:null, seen:{} }; render(); }
render();
</script>
</body></html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개념 지도 · 다원교육 영재관 조준모T</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --ink:#17171C;--ink-soft:#5C5C66;--ink-faint:#706E66;
  --paper:#F4F1EA;--panel:#FFFFFF;--line:#E2DBCD;--line-strong:#D2C8B5;
  --brass:#A8824C;--brass-deep:#8A6A38;--slate:#41595A;--plum:#7A5C8A;
  --serif:"Gowun Batang",serif;--sans:"Pretendard",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,28px)}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.title-blk{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.title{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:.01em;margin:0}
.subtitle{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em}
.brand{display:flex;align-items:center;gap:0}
.dawon-logo{height:30px;width:auto;display:block;opacity:.95}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;font-family:var(--sans);font-size:14px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:3px;background:#FCFBF8;color:var(--ink);outline:none}
.search input:focus{border-color:var(--brass)}
.results{position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--panel);border:1px solid var(--line-strong);border-top:none;max-height:280px;overflow:auto;display:none}
.results.on{display:block}
.results div{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}
.results div:hover{background:#F7F4EE}
.results .rid{color:var(--ink-faint);font-size:11.5px;margin-left:6px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.seg button{font-family:var(--sans);font-size:12.5px;padding:8px 12px;background:#FCFBF8;border:none;border-right:1px solid var(--line);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;user-select:none;padding:0 4px}
.chk input{accent-color:var(--brass)}
.stage{display:grid;grid-template-columns:1fr 296px;gap:14px}
.canvas-wrap{background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative;min-height:520px}
svg{display:block;width:100%;height:auto;touch-action:none}
.hint{position:absolute;bottom:10px;left:12px;font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:18px;align-self:start}
.p-name{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.3}
.p-id{font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em;margin-top:3px}
.p-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:20px;letter-spacing:.02em;border:1px solid var(--line-strong);color:var(--ink-soft)}
.tag.key{background:var(--brass);border-color:var(--brass);color:#fff}
.tag.course{color:#fff;border:none}
.p-stat{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.p-stat div .n{font-family:var(--serif);font-size:21px;font-weight:700}
.p-stat div .l{font-size:11.5px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.p-sec{margin-top:16px}
.p-sec h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
.p-list{display:flex;flex-direction:column;gap:3px}
.p-list a{font-size:13px;color:var(--slate);cursor:pointer;padding:3px 0;text-decoration:none;border-bottom:1px dotted transparent}
.p-list a:hover{border-bottom-color:var(--slate)}
.p-empty{font-size:12.5px;color:var(--ink-faint)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--ink-soft);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.foot .cred{font-family:var(--serif);font-size:13.5px;letter-spacing:.12em;color:var(--ink)}
.foot .cred .sep{color:var(--brass);margin:0 8px;font-weight:700}
.node{cursor:pointer}
.node text{font-family:var(--sans);pointer-events:none}
.edge{fill:none;stroke:var(--line-strong);stroke-width:1}
.edge.up{stroke:#C7B68F}.edge.down{stroke:#A9B7B5}
@media(max-width:820px){.stage{grid-template-columns:1fr}.panel{order:-1}}
</style>
</head>

const N=D.nodes, FAM=D.fam;
const deps={}; for(const id in N) deps[id]=[];
for(const id in N) for(const p of N[id][7]) if(deps[p]) deps[p].push(id);
const COURSE=['일반화학','화학1','화학2'], CCOL=['#41595A','#A8824C','#7A5C8A'];
const KEY=20;
const F=id=>{const a=N[id];return{name:a[0],course:a[1],unit:a[2],tier:a[3],depth:a[4],reach:a[5],fam:a[6],pre:a[7]};};
let sel='CH1-120', courseFilter=-1, keyOnly=false;

// transitive counts
function countUp(id){const seen=new Set();const st=[...N[id][7]];while(st.length){const x=st.pop();if(seen.has(x))continue;seen.add(x);for(const p of N[x][7])st.push(p);}return seen.size;}
function countDown(id){const seen=new Set();const st=[...deps[id]];while(st.length){const x=st.pop();if(seen.has(x))continue;seen.add(x);for(const c of deps[x])st.push(c);}return seen.size;}

function neighborhood(s,up,down){
  const layer={}; layer[s]=0;
  let fr=[s];
  for(let d=1;d<=up;d++){const nx=[];for(const id of fr)for(const p of N[id][7]){if(!(p in layer)){layer[p]=-d;nx.push(p);}}fr=nx;}
  fr=[s];
  for(let d=1;d<=down;d++){const nx=[];for(const id of fr)for(const c of deps[id]){if(!(c in layer)){layer[c]=d;nx.push(c);}}fr=nx;}
  return layer;
}

const svg=document.getElementById('svg');
const W=900,H=560,PAD=54;
function draw(){
  const layer=neighborhood(sel,2,2);
  // group by layer, cap width
  const groups={};
  for(const id in layer){(groups[layer[id]]=groups[layer[id]]||[]).push(id);}
  const layers=Object.keys(groups).map(Number).sort((a,b)=>a-b);
  // cap each layer to 9 nodes by reach (keep sel)
  for(const L of layers){
    let arr=groups[L];
    arr.sort((a,b)=>N[b][5]-N[a][5]);
    if(arr.length>9){groups[L]=arr.slice(0,9);groups[L]._more=arr.length-9;}
  }
  const rowH=(H-2*PAD)/Math.max(1,(layers.length-1));
  const pos={};
  layers.forEach((L,li)=>{
    const arr=groups[L]; const y=PAD+li*rowH;
    const n=arr.length; const span=W-2*PAD; const step=n>1?span/(n-1):0;
    arr.forEach((id,i)=>{pos[id]={x:n>1?PAD+i*step:W/2,y};});
  });
  // build svg
  let edges='',nodes='';
  const vis=new Set(Object.keys(pos));
  for(const id in pos){
    for(const p of N[id][7]){ if(vis.has(p)){ // p is prereq (up), id depends
      const a=pos[p],b=pos[id]; const cls=(layer[p]<layer[id])?'down':'up';
      edges+=`<path class="edge ${layer[id]<0?'up':'down'}" d="M${a.x} ${a.y} C ${a.x} ${(a.y+b.y)/2}, ${b.x} ${(a.y+b.y)/2}, ${b.x} ${b.y}"/>`;
    }}
  }
  for(const id in pos){
    const a=F(id),p=pos[id],isSel=id===sel,isKey=a.reach>=KEY;
    const r=isSel?13:Math.max(4.5,Math.min(12,4.5+Math.sqrt(a.reach)*0.9));
    const dim=(courseFilter>=0&&a.course!==courseFilter)||(keyOnly&&!isKey&&!isSel);
    const col=CCOL[a.course];
    const op=dim?0.18:1;
    let circle;
    if(isKey&&!isSel){circle=`<circle r="${r}" fill="#FFFEFB" stroke="${col}" stroke-width="2.4" opacity="${op}"/>`;}
    else{circle=`<circle r="${r}" fill="${col}" opacity="${op}"/>`;}
    if(isSel)circle=`<circle r="${r+5}" fill="none" stroke="${col}" stroke-width="1.5" opacity="0.4"/>`+`<circle r="${r}" fill="${col}"/>`;
    const lbl=a.name.length>9?a.name.slice(0,8)+'…':a.name;
    const fs=isSel?13:11;
    const ty=p.y< H/2 ? -(r+6) : (r+14);
    nodes+=`<g class="node" transform="translate(${p.x},${p.y})" data-id="${id}" opacity="${dim?0.3:1}">${circle}<text text-anchor="middle" y="${ty}" font-size="${fs}" fill="${isSel?'#17171C':'#5C5C66'}" font-weight="${isSel?700:400}">${lbl}</text></g>`;
  }
  svg.innerHTML=edges+nodes;
  svg.querySelectorAll('.node').forEach(g=>g.addEventListener('click',()=>{sel=g.dataset.id;render();}));
}

  const a=F(sel),isKey=a.reach>=KEY;

  const pre=a.pre, dep=deps[sel];
  const link=id=>`<a data-id="${id}">${N[id][0]} <span style="color:#9A968C;font-size:11.5px">${N[id][5]}</span></a>`;
  document.getElementById('panel').innerHTML=`

    <div class="p-id">${sel} · ${a.unit||'-'}</div>
    <div class="p-tags">
      <span class="tag course" style="background:${CCOL[a.course]}">${COURSE[a.course]}</span>
      <span class="tag">난이도 ${a.tier}</span>
      ${isKey?'<span class="tag key">키스톤</span>':''}
      <span class="tag">${a.fam||''} ${famName}</span>
    </div>
    <div class="p-stat">
      <div><div class="n">${a.reach}</div><div class="l">파급(하류)</div></div>
      <div><div class="n">${a.depth}</div><div class="l">깊이</div></div>
      <div><div class="n">${up}/${down}</div><div class="l">상류/하류 전체</div></div>
    </div>
    <div class="p-sec"><h4>선수 개념 (토대) · ${pre.length}</h4><div class="p-list">${pre.length?pre.map(link).join(''):'<span class="p-empty">없음 (뿌리 개념)</span>'}</div></div>
    <div class="p-sec"><h4>직접 의존 개념 · ${dep.length}</h4><div class="p-list">${dep.length?dep.slice(0,12).map(link).join(''):'<span class="p-empty">없음 (말단 개념)</span>'}${dep.length>12?`<span class="p-empty">외 ${dep.length-12}개</span>`:''}</div></div>
  `;
  document.getElementById('panel').querySelectorAll('a[data-id]').forEach(x=>x.addEventListener('click',()=>{sel=x.dataset.id;render();}));
}

function render(){draw();panel();}

// search
const q=document.getElementById('q'),results=document.getElementById('results');
function search(v){
  v=v.trim().toLowerCase(); results.innerHTML='';
  if(!v){results.classList.remove('on');return;}
  const hits=[];
  for(const id in N){if(id.toLowerCase().includes(v)||N[id][0].toLowerCase().includes(v)){hits.push(id);if(hits.length>=40)break;}}
  hits.sort((a,b)=>N[b][5]-N[a][5]);
  results.innerHTML=hits.slice(0,30).map(id=>`<div data-id="${id}">${N[id][0]}<span class="rid">${id}</span></div>`).join('');
  results.classList.toggle('on',hits.length>0);
  results.querySelectorAll('div[data-id]').forEach(d=>d.addEventListener('click',()=>{sel=d.dataset.id;q.value='';results.classList.remove('on');render();}));
}
q.addEventListener('input',e=>search(e.target.value));
document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.classList.remove('on');});

document.getElementById('courseSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('#courseSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); courseFilter=+b.dataset.c; draw();
});
document.getElementById('keyOnly').addEventListener('change',e=>{keyOnly=e.target.checked;draw();});

render();
</script>
</body>
</html>

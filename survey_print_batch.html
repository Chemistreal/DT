<title>돌아보기 보고서 일괄 인쇄</title>
<style>
:root{--pv-bg:#E6EBE8;--pv-ink:#1F2A26;--pv-sub:#4A5651;--pv-green:#0E5A4C;--pv-line:#D7DDD9}
html,body{margin:0}
body{background:var(--pv-bg);color:var(--pv-ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","DejaVu Sans","WenQuanYi Zen Hei",sans-serif}
.pv-bar{position:sticky;top:0;z-index:20;background:#0B3B30;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pv-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pv-in h1{font-size:15px;margin:0;font-weight:800;flex:1;min-width:200px}
.pv-in h1 small{display:block;font-size:12px;font-weight:600;color:#D9C79A;letter-spacing:.04em}
.pv-btn{background:#D9C79A;color:#0B3B30;border:0;border-radius:9px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.pv-btn.ghost{background:#fff;color:var(--pv-green);border:1.5px solid var(--pv-green)}
.pv-btn:disabled{opacity:.5;cursor:default}
.pv-wrap{max-width:1080px;margin:14px auto;padding:0 16px}
.pv-card{background:#fff;border:1px solid var(--pv-line);border-radius:12px;padding:14px 16px;margin:0 0 12px;font-size:13.5px;line-height:1.6;color:var(--pv-sub)}
.pv-card b{color:var(--pv-ink)}
.pv-card h2{font-size:15px;margin:0 0 6px;color:#0B3B30}
.pv-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.pv-row label{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--pv-ink)}
.pv-row input,.pv-row select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--pv-line);border-radius:7px}
table.pv-t{width:100%;border-collapse:collapse;font-size:13px}
table.pv-t th{background:#0E5A4C;color:#fff;text-align:left;padding:7px 8px;font-weight:700;white-space:nowrap}
table.pv-t td{padding:6px 8px;border-bottom:1px solid #EEF0EA;vertical-align:top}
table.pv-t select{font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--pv-line);border-radius:6px;max-width:260px}
table.pv-t tr.need td{background:#FFFBF1}
.pv-st{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;margin-bottom:3px}
.pv-st.sure{background:#E5F3EB;color:#17663F}.pv-st.maybe{background:#FAF2DF;color:#7F6118}.pv-st.none{background:#EEF1EF;color:#56605C}.pv-st.fail{background:#FBECE5;color:#A6441F}
.pv-src{display:inline-block;margin-right:12px}
.pv-dim{color:#5E6A65;font-size:12.5px}
a{color:var(--pv-green);font-weight:700}
@media print{.pv-bar,.pv-wrap{display:none!important}body{background:#fff}@page{size:A4;margin:0}}
</style>

const QS=new URLSearchParams(location.search);
function lsGet(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function admTok(){ return lsGet('dt_admtok').trim(); }
function admReset(){ try{ localStorage.removeItem('dt_admtok'); }catch(e){} }
const esc=SurveyRender.esc;
function $(s){ return document.querySelector(s); }
async function getJSON(u){ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error(String(r.status)); return await r.json(); }
let C=null, SROWS=[], ALL=[], EX=null, KM=null, MATCH={}, PICK={}, showTest=QS.get('test')==='1', school='';
lsSet('sp_admin','1');   /* 이 기기를 선생님 기기로 기억 — 개인 보고서(survey_print.html?admin=1)가 이것을 본다 */

async function boot(){
  try{ C=await SurveyRender.loadCommon(); }catch(e){ $('#pvSrc').innerHTML='<h2>세 곳의 기록</h2><b>설문 파일을 읽지 못했습니다.</b>'; return; }
  const t=encodeURIComponent(admTok());
  let dtErr='';
  const dt=(async()=>{
    for(let i=0;i<3;i++){
      try{
        const a=await getJSON(SAVE_URL+'?action=survey&survey='+encodeURIComponent(C.doc.id)+'&token='+t+'&t='+Date.now());
        if(a&&a.ok===false){ if(a.error==='auth'){ admReset(); dtErr='관리자 코드가 맞지 않습니다. 새로고침한 뒤 다시 입력해 주세요.'; } else dtErr='설문 기록을 못 읽었습니다.'; return; }
        SROWS=(a&&a.rows)||[];
        const b=await getJSON(SAVE_URL+'?all=1&token='+t+'&t='+Date.now());
        ALL=(b&&b.rows)||[]; dtErr=''; return;
      }catch(e){ dtErr='DT 서버에 닿지 못했습니다.'; await new Promise(z=>setTimeout(z,700*(i+1))); }
    }
  })();
  const ex=SurveySources.loadExam(lsGet('sp_examtok')).then(x=>{EX=x;});
  const km=SurveySources.loadKm().then(x=>{KM=x;});
  await Promise.all([dt,ex,km]);
  srcCard(dtErr);
  pair();
}
function stChip(st){ const t={sure:'확실',maybe:'애매',none:'없음',fail:'불러오지 못함',locked:'열쇠 필요',ok:'불러옴',off:'꺼짐'}[st]||st; return '<span class="pv-st '+(st==='sure'||st==='ok'?'sure':st==='maybe'?'maybe':st==='none'?'none':'fail')+'">'+t+'</span>'; }
function srcCard(dtErr){
  const n=SROWS.filter(r=>showTest||!r.isTest).length;
  $('#pvSrc').innerHTML='<h2>세 곳의 기록</h2>'+
    '<span class="pv-src"><b>DT</b> '+(dtErr?stChip('fail')+' '+esc(dtErr):stChip('ok')+' 설문 '+n+'명 · 시험 행 '+ALL.length+'줄')+'</span>'+
    '<span class="pv-src"><b>모의시험(exam)</b> '+stChip(EX.status)+(EX.status==='ok'?' '+EX.rows.length+'줄':'')+'</span>'+
    '<span class="pv-src"><b>KMChC 학습진단</b> '+stChip(KM.status)+(KM.status==='ok'?' '+KM.students.length+'명':'')+'</span>'+
    '<div class="pv-row"><label for="pvTok">exam 관리 열쇠</label><input id="pvTok" type="password" aria-label="exam 관리 열쇠" value="'+esc(lsGet('sp_examtok'))+'"><button class="pv-btn ghost" type="button" style="padding:6px 12px;font-size:13px" onclick="retryExam()">열쇠로 다시 불러오기</button>'+
    '<span class="pv-dim">exam 에 ADMIN_TOKEN 이 켜져 있을 때만 필요합니다. 이 브라우저에만 기억합니다.</span></div>'+
    '<div class="pv-dim">불러오지 못한 곳이 있어도 보고서는 그립니다 — 그 절만 «자료를 불러오지 못했습니다»로 둡니다. 다른 학생과의 순위·등급은 어느 곳에서 오든 싣지 않습니다.</div>';
}
async function retryExam(){ const v=$('#pvTok').value.trim(); lsSet('sp_examtok',v); EX=await SurveySources.loadExam(v); srcCard(''); pair(); }
function students(){
  return SROWS.filter(r=>(showTest||!r.isTest)&&(!school||r.school===school)).map(r=>({ key:r.code||r.studentKey, code:r.code, studentKey:r.studentKey, name:r.name, school:r.school, year:r.year, row:r }));
}
function pair(){
  const ss=students();
  MATCH=SurveySources.matchAll(ss, EX&&EX.status==='ok'?EX.rows:[], KM&&KM.status==='ok'?KM.students:[]);
  ss.forEach(s=>{
    const m=MATCH[s.key], sv=JSON.parse(lsGet('sp_pick_'+s.code)||'null');
    if(!PICK[s.key]) PICK[s.key]={ on:true, exam: sv&&sv.exam!==undefined?sv.exam:m.exam.pick, km: sv&&sv.km!==undefined?sv.km:m.km.pick };
  });
  const schools=[...new Set(SROWS.map(r=>r.school).filter(Boolean))].sort();
  const need=ss.filter(s=>MATCH[s.key].exam.status==='maybe'||MATCH[s.key].km.status==='maybe').length;
  let h='<h2>인쇄 전 짝 확인</h2><div class="pv-dim">«확실»은 이름·학교·학년이 맞고 후보가 하나뿐인 경우입니다(KMChC 는 학교 열이 없어 같은 이름이 하나뿐일 때만). «애매»는 <b>붙이지 않은 채로</b> 두었습니다 — 같은 학생이 맞으면 골라 주세요. 남의 기록이 붙지 않게 하려는 것입니다.</div>'+
    '<div class="pv-row"><label for="pvSchool">학교</label><select id="pvSchool" aria-label="학교 거르기" onchange="school=this.value;pair()"><option value="">전체</option>'+schools.map(x=>'<option'+(x===school?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'+
    '<label><input type="checkbox" id="pvTest" aria-label="테스트 행 포함" '+(showTest?'checked':'')+' onchange="showTest=this.checked;pair()"> 테스트 행 포함</label>'+
    '<button class="pv-btn ghost" type="button" style="padding:6px 12px;font-size:13px" onclick="allOn(true)">모두 고르기</button><button class="pv-btn ghost" type="button" style="padding:6px 12px;font-size:13px" onclick="allOn(false)">모두 빼기</button>'+
    '<span class="pv-dim">학생 '+ss.length+'명 · 확인이 필요한 학생 '+need+'명</span></div>';
  h+='<table class="pv-t"><thead><tr><th scope="col">인쇄</th><th scope="col">DT 학생</th><th scope="col">모의시험(exam) 짝</th><th scope="col">KMChC 학습진단 짝</th><th scope="col">개인 보고서</th></tr></thead><tbody>'+
    ss.map(s=>{
      const m=MATCH[s.key], p=PICK[s.key], k=esc(s.key);
      const exSel='<select aria-label="모의시험 짝" onchange="setPick(\''+k+'\',\'exam\',this.value)"><option value="">붙이지 않음</option>'+m.exam.options.map(o=>'<option value="'+esc(o.pid)+'"'+(p.exam===o.pid?' selected':'')+'>'+esc(o.name)+' · '+esc(o.school||'학교 모름')+' · '+esc(o.grade||'?')+'학년 · '+o.n+'회 ('+esc(o.why)+')</option>').join('')+'</select>';
      const kmSel='<select aria-label="학습진단 짝" onchange="setPick(\''+k+'\',\'km\',this.value)"><option value="">붙이지 않음</option>'+m.km.options.map(o=>'<option value="'+esc(o.id)+'"'+(p.km===o.id?' selected':'')+'>'+esc(o.name)+' · '+esc(o.grade||'?')+'학년 · '+(o.ts?new Date(o.ts).toLocaleDateString('ko-KR'):'날짜 모름')+'</option>').join('')+'</select>';
      const needCls=(m.exam.status==='maybe'&&!p.exam)||(m.km.status==='maybe'&&!p.km);
      return '<tr class="'+(needCls?'need':'')+'" data-key="'+k+'"><td><input type="checkbox" aria-label="인쇄할 학생" '+(p.on?'checked':'')+' onchange="setPick(\''+k+'\',\'on\',this.checked)"></td>'+
        '<td><b>'+esc(s.name)+'</b><br><span class="pv-dim">'+esc(s.school||'')+' '+esc(s.year||'')+(s.row.isTest?' · 테스트':'')+'</span></td>'+
        '<td>'+stChip(EX.status==='ok'?m.exam.status:EX.status)+'<br>'+(EX.status==='ok'?exSel:'')+'</td>'+
        '<td>'+stChip(KM.status==='ok'?m.km.status:KM.status)+'<br>'+(KM.status==='ok'?kmSel:'')+'</td>'+
        '<td>'+(s.code?'<a href="survey_print.html?student='+encodeURIComponent(s.code)+'&amp;admin=1" target="_blank" rel="noopener">한 명 열기</a>':'—')+'</td></tr>';
    }).join('')+'</tbody></table>';
  $('#pvPairs').innerHTML=h;
  $('#pvMake').disabled=!ss.length;
}
function setPick(key,f,v){
  const p=PICK[key]; if(!p) return;
  p[f]=f==='on'?!!v:(v||null);
  const s=students().filter(x=>x.key===key)[0];
  if(s&&s.code&&f!=='on') lsSet('sp_pick_'+s.code, JSON.stringify({exam:p.exam,km:p.km}));
}
function allOn(v){ Object.keys(PICK).forEach(k=>PICK[k].on=v); pair(); }
async function makeAll(){
  const ss=students().filter(s=>PICK[s.key]&&PICK[s.key].on);
  $('#pvMake').disabled=true; $('#pvPrint').disabled=true;
  const host=$('#pvReports'); host.innerHTML='';
  let pages=0, i=0;
  for(const s of ss){
    i++; $('#pvMake').textContent='만드는 중 '+i+' / '+ss.length;
    const rows=ALL.filter(r=>r.studentKey===s.studentKey);
    const rounds=await SurveyRender.loadRounds(rows);
    const external=await SurveySources.externalFor({exam:PICK[s.key].exam, km:PICK[s.key].km}, EX, KM);
    const box=document.createElement('div'); box.className='pv-one'; host.appendChild(box);
    const out=SurveyRender.render({ host:box, doc:C.doc, ans:s.row.ans, ms:s.row.ms, rows:rows, roundsByCourse:rounds, bank:C.bank, link:C.link,
      external:external, name:s.name, school:s.school, year:s.year, surveyDate:s.row.date, logo:LOGO });
    pages+=out.pages;
    await new Promise(z=>setTimeout(z,0));
  }
  SurveyRender.fitScreen(document);
  $('#pvMake').textContent='선택한 학생 보고서 만들기'; $('#pvMake').disabled=false; $('#pvPrint').disabled=!pages;
  window.__SP_PAGES=pages; window.__SP_N=ss.length; window.__SP_READY=true;
}
window.addEventListener('resize',()=>SurveyRender.fitScreen(document));
window.addEventListener('beforeprint',()=>{ document.querySelectorAll('.sp-sheets').forEach(s=>s.style.zoom=''); });
window.addEventListener('afterprint',()=>SurveyRender.fitScreen(document));
boot().catch(e=>{ window.__SP_ERR=String(e&&e.stack||e); $('#pvSrc').innerHTML='<h2>세 곳의 기록</h2><b>불러오지 못했습니다.</b> '+esc(String(e&&e.message||e)); });
</script>
</body></html>

연결하라.", "f": "B2", "rk": 856, "d": 12, "rh": 0, "pre": ["CH1-337"], "tr": "일상 중화 예가 막연해, 위산 중화제·제산처럼 쓴다는 게 빠진다.", "an": "위산 중화제·제산처럼 쓴다.", "rd": "위산을 약으로 중화하는 식으로 일상에 쓰인다.", "tf": "위산을 중화하는 약은? (제산제)"}, "CH1-349": {"n": "양적관계 기본", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화에서 H⁺ + OH⁻ → H₂O로 1:1 반응한다는 기본을 놓친 경우다. 이 1:1 골격이 약하면 가수·농도 보정을 얹을 토대가 사라진다.", "fx": "'중화는 H⁺ + OH⁻ → H₂O로 1:1 반응'함을 골격으로 못 박는다. 이 1:1 위에 가수·농도 보정을 얹어 양적관계를 풀어라.", "f": "D3", "rk": 871, "d": 13, "rh": 0, "pre": ["CH1-340"], "tr": "중화 기본이 막연해, H⁺+OH⁻→H₂O로 1:1 반응한다는 게 빠진다.", "an": "H⁺+OH⁻→H₂O로 1:1 반응한다.", "rd": "H⁺+OH⁻→H₂O로 1:1 반응한다.", "tf": "중화의 기본 반응비는? (1:1)"}, "CH1-350": {"n": "가수 양적관계", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "2가 산·염기가 1몰당 H⁺·OH⁻ 2몰을 내놓는다는 점을 양적관계에 반영하는 게 흔들린 경우다. 가수 배수를 빼먹으면 중화량 계산이 어긋난다.", "fx": "'2가 산·염기는 1몰당 H⁺·OH⁻ 2몰을 내놓음'을 양적관계에 반영한다. 가수 배수를 빼먹지 않게 곱해 중화량을 셈하라.", "f": "D3", "rk": 886, "d": 14, "rh": 0, "pre": ["CH1-342"], "tr": "2가 산·염기를 1몰로 셀 것 같아, 1몰당 H⁺·OH⁻ 2몰을 내는 가수를 반영한다는 게 빠진다.", "an": "2가 산·염기는 1몰당 H⁺·OH⁻ 2몰을 낸다.", "rd": "2가 산·염기는 1몰당 H⁺·OH⁻를 2몰 낸다. 그만큼 반영한다.", "tf": "2가 염기 1몰은 OH⁻를 몇 몰? (2)"}, "CH1-351": {"n": "중화점 전후", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화점 전엔 한쪽 이온이 남고 지나면 다른 쪽이 남는다는 점을 놓친 경우다. 이 전후 구분이 약하면 적정 곡선의 pH 변화를 못 읽는다.", "fx": "'중화점 전엔 한쪽 이온이 남고 지나면 다른 쪽이 남음'을 못 박는다. 이 전후 구분으로 적정 곡선의 pH 변화를 읽어라.", "f": "B2", "rk": 872, "d": 13, "rh": 0, "pre": ["CH1-340"], "tr": "중화점 전후가 막연해, 전엔 한쪽·지나면 다른 쪽 이온이 남는다는 게 빠진다.", "an": "전엔 한쪽, 지나면 다른 쪽 이온이 남는다.", "rd": "중화점 전엔 한쪽이, 지나면 다른 쪽이 남는다.", "tf": "중화점을 지나면 무엇이 남나? (다른 쪽 이온)"}, "CH1-352": {"n": "중화 생성물", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화 반응의 생성물이 물과 염이라는 점을 놓친 경우다(산이 더 생기는 게 아님). 생성물이 흐리면 반응 결과를 잘못 쓴다.", "fx": "'중화 반응의 생성물은 물과 염'임을 못 박는다(산이 더 생기는 게 아님). 생성물을 물과 염으로 잡아 반응 결과를 써라.", "f": "B2", "rk": 857, "d": 12, "rh": 0, "pre": ["CH1-337"], "tr": "중화로 산이 더 생길 것 같아, 생성물이 물과 염이라는 게 빠진다.", "an": "생성물은 물과 염이다.", "rd": "생성물은 물과 염이다.", "tf": "중화의 생성물 두 가지는? (물과 염)"}, "CH1-353": {"n": "물 생성", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화에서 H⁺와 OH⁻가 결합해 물이 생기고 구경꾼 이온은 반응하지 않는다는 점을 놓친 경우다. 물이 생기는 핵심 반응을 못 짚으면 알짜식이 어긋난다.", "fx": "'중화에서 H⁺와 OH⁻가 결합해 물이 생기고 구경꾼 이온은 반응 안 함'을 못 박는다. 물이 생기는 핵심 반응을 짚어 알짜식을 잡아라.", "f": "B2", "rk": 873, "d": 13, "rh": 0, "pre": ["CH1-338"], "tr": "중화에서 모든 이온이 반응할 것 같아, H⁺·OH⁻만 결합해 물이 되고 구경꾼은 안 한다는 게 빠진다.", "an": "H⁺·OH⁻만 결합해 물이 되고 구경꾼은 안 한다.", "rd": "H⁺와 OH⁻만 결합해 물이 된다. 구경꾼은 안 한다.", "tf": "물을 만드는 두 이온은? (H⁺와 OH⁻)"}, "CH1-354": {"n": "표준 용액", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "표준 용액이 농도를 정확히 아는 기준 용액이라는 점을 놓친 경우다. 기준이 되는 까닭이 약하면 적정에서 미지 농도를 못 구한다.", "fx": "표준 용액을 '농도를 정확히 아는 기준 용액'으로 못 박는다. 기준이 되는 까닭을 잡아 적정에서 미지 농도를 구하라.", "f": "D2", "rk": 442, "d": 4, "rh": 0, "pre": ["CH1-296"], "tr": "표준 용액이 막연해, 농도를 정확히 아는 기준 용액이라는 게 빠진다.", "an": "농도를 정확히 아는 기준 용액이다.", "rd": "농도를 정확히 아는 기준 용액이다.", "tf": "농도를 정확히 아는 용액은? (표준 용액)"}, "CH1-355": {"n": "완전 중화", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "완전 중화가 H⁺와 OH⁻가 모두 반응해 남는 이온이 없는 상태라는 점을 놓친 경우다. 이 조건이 약하면 당량점·중화점 판정이 어긋난다.", "fx": "완전 중화를 'H⁺와 OH⁻가 모두 반응해 남는 이온이 없는 상태'로 못 박는다. 이 조건으로 당량점·중화점을 판정하라.", "f": "B2", "rk": 874, "d": 13, "rh": 0, "pre": ["CH1-340"], "tr": "완전 중화가 막연해, H⁺·OH⁻가 모두 반응해 남는 이온이 없는 상태라는 게 빠진다.", "an": "H⁺·OH⁻가 모두 반응해 남는 이온이 없는 상태다.", "rd": "H⁺와 OH⁻가 모두 반응해 남는 게 없는 상태다.", "tf": "H⁺와 OH⁻가 다 반응한 상태는? (완전 중화)"}, "CH1-356": {"n": "화학식량", "c": "ch1", "u": "부록", "t": "C", "dx": "화학식량이 화학식 속 모든 원자 원자량의 합이라는 점을 놓친 경우다. 합으로 구한다는 점이 약하면 몰질량과 그 위에 선 양적관계가 통째로 어긋난다.", "fx": "화학식량을 '화학식 속 모든 원자 원자량의 합'으로 못 박는다. 합으로 구함을 잡아 몰질량·양적관계의 기준으로 삼아라.", "f": "D3", "rk": 443, "d": 4, "rh": 0, "pre": ["CH1-038"], "tr": "화학식량이 막연해, 화학식 속 모든 원자량의 합이라는 게 빠진다.", "an": "화학식 속 모든 원자량의 합이다.", "rd": "화학식 속 모든 원자의 원자량을 더한 값이다.", "tf": "화학식 속 원자량을 다 더한 것은? (화학식량)"}, "CH1-357": {"n": "분자량", "c": "ch1", "u": "부록", "t": "C", "dx": "분자량을 구성 원자 원자량의 합으로 정확히 셈하는 게 흔들린 경우다(예: H₂O는 1×2 + 16 = 18). 첨자만큼 원자량을 곱해 더하지 못하면 몰질량이 어긋난다.", "fx": "분자량을 '구성 원자 원자량을 첨자만큼 곱해 더한 합'으로 못 박는다. H₂O를 1×2 + 16 = 18로 직접 계산해 굳혀라.", "f": "D3", "rk": 444, "d": 4, "rh": 4, "pre": ["CH1-038"], "tr": "분자량 계산이 막막해, 구성 원자량의 합(H₂O는 1×2+16=18)이라는 게 빠진다.", "an": "구성 원자량의 합: H₂O는 1×2+16=18.", "rd": "구성 원자량을 더해 구한다. H₂O는 1×2+16=18이다.", "tf": "CO₂의 분자량은? (44: 12+16×2)"}, "CH1-358": {"n": "질량비", "c": "ch1", "u": "부록", "t": "C", "dx": "성분 질량비를 원자 수의 비로 보고, (원자 수 × 원자량)의 비라는 점을 놓친 경우다(물에서 H:O = 2:16 = 1:8). 원자량을 곱하는 단계를 빼면 질량비가 어긋난다.", "fx": "성분 질량비를 '(원자 수 × 원자량)의 비'로 못 박는다(원자 수비가 아님). 물에서 H:O = 2:16 = 1:8을 원자량 곱해 구하라.", "f": "D3", "rk": 609, "d": 5, "rh": 1, "pre": ["CH1-357"], "tr": "질량비가 원자 수 비 같아, (원자 수×원자량)의 비(물에서 H:O=2:16=1:8)라는 게 빠진다.", "an": "(원자 수×원자량)의 비: 물에서 H:O=2:16=1:8.", "rd": "각 원소의 (원자 수×원자량) 비다. 물에서 H:O=2:16=1:8이다.", "tf": "물에서 H:O 질량비는? (1:8)"}, "CH1-359": {"n": "질량 백분율", "c": "ch1", "u": "부록", "t": "C", "dx": "성분의 질량 백분율을 (성분 질량 ÷ 전체 화학식량 × 100)으로 구하는 게 흔들린 경우다. 분모를 전체 화학식량으로 잡지 못하면 조성 분석이 어긋난다.", "fx": "질량 백분율을 '(성분 질량 ÷ 전체 화학식량 × 100)'으로 못 박는다. 분모를 전체 화학식량으로 잡아 조성을 분석하라.", "f": "D3", "rk": 681, "d": 6, "rh": 0, "pre": ["CH1-358"], "tr": "질량 백분율이 막막해, (성분÷전체×100)이라는 게 빠진다.", "an": "성분÷전체×100이다.", "rd": "성분 질량을 전체로 나눠 100을 곱한다.", "tf": "성분 질량 백분율=성분÷전체 곱하기? (100)"}, "CH1-360": {"n": "실험식 정의", "c": "ch1", "u": "부록", "t": "C", "dx": "실험식이 원자 수의 가장 간단한 정수비라는 점을 놓친 경우다(실제 원자 수는 분자식). 가장 간단한 비라는 정의가 흐리면 실험식을 못 구한다.", "fx": "실험식을 '원자 수의 가장 간단한 정수비'로 못 박는다(실제 원자 수는 분자식). 가장 간단한 비라는 정의로 실험식을 구하라.", "f": "D3", "rk": 445, "d": 4, "rh": 7, "pre": ["CH1-006"], "tr": "실험식이 실제 원자 수 같아, 가장 간단한 정수비(실제는 분자식)라는 게 흔들린다.", "an": "가장 간단한 정수비: 실제 원자 수는 분자식이다.", "rd": "원자 수의 가장 간단한 정수비가 실험식이다. 실제 개수는 분자식이다.", "tf": "원자 수의 가장 간단한 정수비는? (실험식)"}, "CH1-361": {"n": "분자식 정의", "c": "ch1", "u": "부록", "t": "C", "dx": "분자식이 분자 속 실제 원자 수이고 실험식과 같을 수도(H₂O), 정수배일 수도 있다는 점을 놓친 경우다. 둘의 관계가 흐리면 분자식과 실험식을 혼동한다.", "fx": "분자식을 '분자 속 실제 원자 수(실험식과 같을 수도, 정수배일 수도)'로 못 박는다. 둘의 관계를 잡아 분자식과 실험식을 혼동하지 마라.", "f": "D3", "rk": 610, "d": 5, "rh": 2, "pre": ["CH1-360"], "tr": "분자식이 막연해, 분자 속 실제 원자 수이고 실험식과 같거나 정수배라는 게 빠진다.", "an": "분자 속 실제 원자 수, 실험식과 같거나 정수배다.", "rd": "분자 속 실제 원자 수다. 실험식과 같거나 정수배다.", "tf": "분자 속 실제 원자 수는? (분자식)"}, "CH1-362": {"n": "실험식 구하기", "c": "ch1", "u": "부록", "t": "C", "dx": "성분 원자 수를 공약수로 나눠 가장 간단한 정수비로 줄이는 게 흔들린 경우다(6:12:6을 1:2:1로). 약분이 약하면 실험식을 못 잡는다.", "fx": "실험식을 '성분 원자 수를 공약수로 나눠 가장 간단한 정수비로 줄여' 구한다. 6:12:6을 1:2:1로 약분해 실험식을 잡아라.", "f": "D3", "rk": 611, "d": 5, "rh": 1, "pre": ["CH1-360"], "tr": "실험식 구하기가 막막해, 공약수로 나눠 간단한 정수비로 줄인다(6:12:6→1:2:1)는 게 빠진다.", "an": "공약수로 나눠 간단한 정수비로: 6:12:6→1:2:1.", "rd": "원자 수 비를 공약수로 나눠 간단한 정수비로 줄인다.", "tf": "C₂H₄의 실험식은? (CH₂)"}, "CH1-363": {"n": "실험식·분자식 관계", "c": "ch1", "u": "부록", "t": "C", "dx": "분자식이 실험식의 정수배이고 그 배수가 1이 아닐 수 있다는 점을 놓친 경우다. 배수가 늘 1이라 여기면 분자식을 실험식과 같게 잘못 쓴다.", "fx": "'분자식은 실험식의 정수배이고 그 배수가 1이 아닐 수 있음'을 못 박는다. 배수가 늘 1이라 여기지 말고 분자식을 따로 확정하라.", "f": "D3", "rk": 682, "d": 6, "rh": 1, "pre": ["CH1-361"], "tr": "실험식이 같으면 분자식도 같을 것 같아, 정수배이고 배수가 1이 아닐 수 있다는 게 빠진다.", "an": "정수배이고 배수가 1이 아닐 수 있다.", "rd": "분자식은 실험식의 정수배다. 배수가 1이 아닐 수 있다.", "tf": "분자식은 실험식의? (정수배)"}, "CH1-364": {"n": "실험식→분자식", "c": "ch1", "u": "부록", "t": "C", "dx": "분자량 ÷ 실험식량 = 배수로 실험식에서 분자식을 구하는 게 흔들린 경우다(180/30 = 6배). 이 배수 계산이 약하면 분자식을 확정하지 못한다.", "fx": "'분자량 ÷ 실험식량 = 배수'로 실험식에서 분자식을 구한다. 180/30 = 6배처럼 배수를 구해 분자식을 확정하라.", "f": "D3", "rk": 724, "d": 7, "rh": 0, "pre": ["CH1-363", "CH1-357"], "tr": "실험식에서 분자식 구하기가 막막해, 분자량÷실험식량=배수(180/30=6)라는 게 빠진다.", "an": "분자량÷실험식량=배수: 180/30=6.", "rd": "분자량÷실험식량이 배수다. 180/30=6이다.", "tf": "분자량÷실험식량은? (배수)"}, "CH1-365": {"n": "조성 분석", "c": "ch1", "u": "부록", "t": "C", "dx": "성분 질량(%)을 원자량으로 나눠 몰수비로 환산해야 실험식이 나온다는 점을 놓친 경우다(분자식엔 분자량도 필요). 질량비를 바로 원자 수비로 쓰면 실험식이 어긋난다.", "fx": "조성 분석을 '성분 질량(%)을 원자량으로 나눠 몰수비로 환산해 실험식을 구함(분자식엔 분자량도 필요)'으로 못 박는다. 질량비를 바로 원자 수비로 쓰지 마라.", "f": "D3", "rk": 683, "d": 6, "rh": 0, "pre": ["CH1-362", "CH1-045"], "tr": "조성에서 실험식 구하기가 막막해, 질량(%)을 원자량으로 나눠 몰수비로 환산한다(분자식엔 분자량도 필요)는 게 빠진다.", "an": "질량(%)을 원자량으로 나눠 몰수비로: 분자식엔 분자량도 필요하다.", "rd": "질량(%)을 원자량으로 나누면 몰수비(실험식)가 나온다. 분자식엔 분자량도 필요하다.", "tf": "질량(%)을 원자량으로 나누면? (몰수비)"}, "CH1-366": {"n": "실험식 적용", "c": "ch1", "u": "부록", "t": "C", "dx": "이온 결합 물질처럼 분자가 없는 물질은 분자식이 아니라 실험식으로 나타낸다는 점을 놓친 경우다. 이 적용이 약하면 NaCl 같은 물질에 분자식을 잘못 붙인다.", "fx": "'분자가 없는 이온 결합 물질은 분자식이 아니라 실험식으로 나타냄'을 못 박는다. NaCl 같은 물질에 분자식을 붙이지 않게 가려라.", "f": "B2", "rk": 962, "d": 28, "rh": 0, "pre": ["CH1-360", "CH1-172"], "tr": "모든 물질을 분자식으로 쓸 것 같아, 분자 없는 물질(이온결합)은 실험식으로 쓴다는 게 빠진다.", "an": "분자 없는 물질(이온결합)은 실험식으로 쓴다.", "rd": "분자가 없는 이온결합 물질은 실험식으로 쓴다.", "tf": "이온결합 물질은 무슨 식으로? (실험식)"}, "CH1-367": {"n": "일정 성분비", "c": "ch1", "u": "부록", "t": "C", "dx": "한 화합물의 성분 질량비가 항상 일정하다는 일정 성분비 법칙을 놓친 경우다(혼합물은 비가 자유로움). 이 법칙이 약하면 화합물과 혼합물을 가르지 못한다.", "fx": "'한 화합물의 성분 질량비는 항상 일정(혼합물은 자유)'이라는 일정 성분비 법칙을 못 박는다. 이 법칙으로 화합물과 혼합물을 가려라.", "f": "B2", "rk": 612, "d": 5, "rh": 0, "pre": ["CH1-058"], "tr": "성분비가 자유일 것 같아, 한 화합물은 항상 일정하다(혼합물은 자유)는 게 빠진다.", "an": "한 화합물은 항상 일정, 혼합물은 자유다.", "rd": "한 화합물은 조성이 정해져 비가 일정하다. 혼합물은 자유다.", "tf": "한 화합물의 성분비는? (일정)"}, "CH1-368": {"n": "실험식량", "c": "ch1", "u": "부록", "t": "C", "dx": "실험식량이 실험식 속 원자 원자량의 합이고 분자량과 같지 않을 수 있다는 점을 놓친 경우다. 실험식량을 분자량과 혼동하면 분자식 배수 계산이 어긋난다.", "fx": "실험식량을 '실험식 속 원자 원자량의 합(분자량과 같지 않을 수 있음)'으로 못 박는다. 분자량과 혼동하지 말고 분자식 배수 계산에 써라.", "f": "D3", "rk": 613, "d": 5, "rh": 0, "pre": ["CH1-360", "CH1-357"], "tr": "실험식량이 분자량 같아, 실험식 속 원자량의 합이고 분자량과 같지 않을 수 있다는 게 빠진다.", "an": "실험식 속 원자량의 합: 분자량과 같지 않을 수 있다.", "rd": "실험식 속 원자량의 합이다. 분자량과 같지 않을 수 있다.", "tf": "실험식 속 원자량의 합은? (실험식량)"}, "CH1-224": {"n": "엔탈피 정의", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "엔탈피를 질량 같은 양으로 오해하거나 절대값으로 다루려 한 경우다. 엔탈피가 일정 압력에서의 열함량이고 절대값 대신 변화량(ΔH)으로 다룬다는 점이 약하면 반응열 계산이 막힌다.", "fx": "엔탈피를 '일정 압력에서의 열함량이고 절대값 대신 변화량(ΔH)으로 다룸'으로 못 박는다. 절대값을 구하려 말고 ΔH로 반응열을 계산하라.", "f": "B2", "rk": 7, "d": 0, "rh": 30, "pre": [], "tr": "엔탈피가 질량 같은 양 같아, 절대값을 못 다루고 변화량(ΔH)으로 본다는 게 흐려진다.", "an": "엔탈피는 절대값을 못 다루고 변화량(ΔH)으로 본다.", "rd": "엔탈피 절대값은 못 재고 변화량 ΔH만 다룬다.", "tf": "엔탈피는 절대값과 변화량 중 무엇을 다루나? (변화량)"}, "CH1-225": {"n": "반응엔탈피 정의", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "반응엔탈피가 (생성물 엔탈피 − 반응물 엔탈피)이고 처음·끝 상태로만 정해진다는 점을 놓친 경우다. 이 정의가 약하면 경로와 무관하다는 헤스 법칙으로 이어지지 못한다.", "fx": "반응엔탈피를 '(생성물 엔탈피 − 반응물 엔탈피), 처음·끝 상태로만 정해짐'으로 못 박는다. 경로와 무관함을 잡아 헤스 법칙으로 이어라.", "f": "B2", "rk": 48, "d": 1, "rh": 29, "pre": ["CH1-224"], "tr": "반응엔탈피가 막연해, (생성물-반응물)이고 처음·끝 상태로만 정해진다는 게 빠진다.", "an": "(생성물-반응물)이고 처음·끝 상태로만 정해진다.", "rd": "(생성물-반응물) 엔탈피이고 처음·끝 상태로만 정해진다.", "tf": "반응엔탈피는 생성물에서 무엇을 뺀 것? (반응물)"}, "CH1-226": {"n": "발열 ΔH 부호", "c": "ch1", "u": "엔탈피", "t": "B", "dx": "발열 반응이 에너지를 방출해 엔탈피가 줄어 ΔH<0이라는 점을 놓친 경우다. 방출=음의 부호라는 약속이 흔들리면 열화학 반응식의 부호가 어긋난다.", "fx": "'발열은 에너지를 방출해 엔탈피가 줄어 ΔH<0'을 못 박는다. 방출 = 음의 부호라는 약속으로 열화학 반응식 부호를 잡아라.", "f": "C2", "rk": 148, "d": 2, "rh": 13, "pre": ["CH1-225"], "tr": "발열이면 ΔH가 +일 것 같아, 에너지를 방출해 줄어 ΔH<0이라는 게 흔들린다.", "an": "발열은 에너지를 내놓아 줄어 ΔH<0이다.", "rd": "발열은 에너지를 내놓아 엔탈피가 줄어 ΔH<0이다.", "tf": "발열의 ΔH 부호는? (음)"}, "CH1-227": {"n": "흡열 ΔH 부호", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "흡열 반응이 에너지를 흡수해 엔탈피가 늘어 ΔH>0이라는 점을 놓친 경우다. 흡수=양의 부호라는 약속이 약하면 흡열 반응의 ΔH를 잘못 적는다.", "fx": "'흡열은 에너지를 흡수해 엔탈피가 늘어 ΔH>0'을 못 박는다. 흡수 = 양의 부호라는 약속으로 흡열 ΔH를 적어라.", "f": "C2", "rk": 149, "d": 2, "rh": 6, "pre": ["CH1-225"], "tr": "흡열이면 ΔH가 -일 것 같아, 흡수해 늘어 ΔH>0이라는 게 흔들린다.", "an": "흡열은 흡수해 늘어 ΔH>0이다.", "rd": "흡열은 흡수해 엔탈피가 늘어 ΔH>0이다.", "tf": "흡열의 ΔH 부호는? (양)"}, "CH1-228": {"n": "발열 온도 변화", "c": "ch1", "u": "엔탈피", "t": "B", "dx": "발열 반응이 열을 방출해 주위 온도를 올린다는 점을 놓친 경우다. 방출과 온도 상승의 연결이 약하면 온도 변화로 발열을 판단하지 못한다.", "fx": "'발열은 열을 방출해 주위 온도를 올림'을 못 박는다. 방출과 온도 상승을 이어 온도 변화로 발열을 판단하라.", "f": "A1", "rk": 269, "d": 3, "rh": 2, "pre": ["CH1-226"], "tr": "발열이 주위를 식힐 것 같기도 해, 열을 방출해 주위 온도를 올린다는 게 흔들린다.", "an": "발열은 열을 방출해 주위 온도를 올린다.", "rd": "발열은 열을 방출하니 주위 온도가 오른다.", "tf": "발열 반응에서 주위 온도는? (오름)"}, "CH1-229": {"n": "흡열 온도 변화", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "흡열 반응이 열을 흡수해 주위 온도를 내린다는 점을 놓친 경우다. 흡수와 온도 하강의 연결이 약하면 온도 변화로 흡열을 판단하지 못한다.", "fx": "'흡열은 열을 흡수해 주위 온도를 내림'을 못 박는다. 흡수와 온도 하강을 이어 온도 변화로 흡열을 판단하라.", "f": "A1", "rk": 270, "d": 3, "rh": 3, "pre": ["CH1-227"], "tr": "흡열이 주위를 데울 것 같기도 해, 흡수해 주위 온도를 내린다는 게 흔들린다.", "an": "흡열은 흡수해 주위 온도를 내린다.", "rd": "흡열은 열을 흡수하니 주위 온도가 내린다.", "tf": "흡열 반응에서 주위 온도는? (내림)"}, "CH1-230": {"n": "열화학 반응식", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "열화학 반응식이 반응식에 ΔH를 함께 쓰고 그 값이 물질의 양(계수)에 비례한다는 점을 놓친 경우다. 양에 비례한다는 점이 약하면 두 배 반응의 열량을 못 구한다.", "fx": "열화학 반응식을 '반응식에 ΔH를 함께 쓰고 그 값이 물질의 양(계수)에 비례'로 못 박는다. 계수를 두 배로 하면 ΔH도 두 배임을 셈하라.", "f": "B2", "rk": 427, "d": 4, "rh": 2, "pre": ["CH1-225", "CH1-055"], "tr": "열화학식이 보통 반응식 같아, ΔH를 함께 쓰고 그 값이 양(계수)에 비례한다는 게 빠진다.", "an": "ΔH를 함께 쓰고 그 값이 계수에 비례한다.", "rd": "ΔH가 양에 비례하니 반응식에 계수와 함께 ΔH를 쓴다.", "tf": "열화학 반응식에 함께 쓰는 것은? (ΔH)"}, "CH1-231": {"n": "열화학 반응식 상태", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "물질의 상태(기체·액체·고체)가 ΔH를 바꾸므로 상태를 표기해야 한다는 점을 놓친 경우다. 상태가 같은 물질도 엔탈피가 다르다는 점이 약하면 ΔH가 어긋난다.", "fx": "'물질의 상태(기체·액체·고체)가 ΔH를 바꾸므로 상태를 표기'함을 못 박는다. 상태가 같은 물질도 엔탈피가 다름을 잡아 ΔH를 맞춰라.", "f": "A3", "rk": 600, "d": 5, "rh": 1, "pre": ["CH1-230"], "tr": "상태 표기가 사소할 것 같아, 상태가 ΔH를 바꿔 표기해야 한다는 게 빠진다.", "an": "상태가 ΔH를 바꿔 상태 표기가 필수다.", "rd": "상태가 다르면 ΔH가 다르다. 그래서 상태를 표기해야 한다.", "tf": "ΔH가 상태에 따라 변하니 무엇을 표기? (상태)"}, "CH1-232": {"n": "발열 반응 예", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "연소·중화 같은 발열 반응이 열을 방출해 주위가 따뜻해진다는 점을 놓친 경우다. 발열 예를 흡열로 오해하면 반응 분류가 어긋난다.", "fx": "'연소·중화 같은 반응은 발열이라 주위가 따뜻해짐'을 못 박는다. 발열 예를 흡열로 오해하지 말고 반응을 분류하라.", "f": "B2", "rk": 428, "d": 4, "rh": 0, "pre": ["CH1-228"], "tr": "발열 예가 막연해, 연소·중화가 열을 내 주위가 따뜻해진다는 게 빠진다.", "an": "연소·중화가 열을 내 주위가 따뜻하다.", "rd": "연소·중화는 열을 내 주위가 따뜻해진다.", "tf": "연소는 발열인가 흡열인가? (발열)"}, "CH1-233": {"n": "흡열 반응 예", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "광합성·물의 분해 같은 흡열 반응이 에너지를 흡수한다는 점을 놓친 경우다. 흡열 예를 못 짚으면 반응을 발열·흡열로 가르지 못한다.", "fx": "'광합성·물의 분해 같은 반응은 흡열이라 에너지를 흡수'함을 못 박는다. 흡열 예를 짚어 반응을 발열·흡열로 가려라.", "f": "B2", "rk": 429, "d": 4, "rh": 0, "pre": ["CH1-229"], "tr": "흡열 예가 막연해, 광합성·물 분해가 에너지를 흡수한다는 게 빠진다.", "an": "광합성·물 분해가 에너지를 흡수한다.", "rd": "광합성·물 분해는 에너지를 흡수한다.", "tf": "광합성은 발열인가 흡열인가? (흡열)"}, "CH1-234": {"n": "발열과 엔탈피", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "발열 반응에서 엔탈피가 줄어든다(ΔH<0)는 점을 놓친 경우다. 방출과 엔탈피 감소의 연결이 약하면 부호 판단이 어긋난다.", "fx": "'발열 반응은 엔탈피가 줄어듦(ΔH<0)'을 못 박는다. 방출과 엔탈피 감소를 이어 부호를 판단하라.", "f": "C2", "rk": 271, "d": 3, "rh": 0, "pre": ["CH1-226"], "tr": "발열이면 엔탈피가 늘 것 같아, 준다(ΔH<0)는 게 흔들린다.", "an": "발열이면 엔탈피가 준다(ΔH<0).", "rd": "발열은 에너지를 내놓아 엔탈피가 준다(ΔH<0).", "tf": "발열이면 엔탈피는? (감소)"}, "CH1-235": {"n": "흡열과 엔탈피", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "흡열 반응에서 엔탈피가 늘어난다(ΔH>0)는 점을 놓친 경우다. 흡수와 엔탈피 증가의 연결이 약하면 부호 판단이 어긋난다.", "fx": "'흡열 반응은 엔탈피가 늘어남(ΔH>0)'을 못 박는다. 흡수와 엔탈피 증가를 이어 부호를 판단하라.", "f": "C2", "rk": 272, "d": 3, "rh": 0, "pre": ["CH1-227"], "tr": "흡열이면 엔탈피가 줄 것 같아, 는다(ΔH>0)는 게 흔들린다.", "an": "흡열이면 엔탈피가 는다(ΔH>0).", "rd": "흡열은 흡수해 엔탈피가 는다(ΔH>0).", "tf": "흡열이면 엔탈피는? (증가)"}, "CH1-236": {"n": "정·역반응", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "정반응과 역반응이 에너지 출입 방향이 반대라는 점을 놓친 경우다. 이 대칭이 약하면 역반응 ΔH의 부호를 못 잡는다.", "fx": "'정반응과 역반응은 에너지 출입 방향이 반대'임을 못 박는다. 이 대칭으로 역반응 ΔH의 부호를 잡아라.", "f": "A1", "rk": 150, "d": 2, "rh": 2, "pre": ["CH1-225"], "tr": "정·역반응 에너지가 같은 방향일 것 같아, 출입 방향이 반대라는 게 빠진다.", "an": "정·역반응은 에너지 출입 방향이 반대다.", "rd": "같은 경로를 거꾸로 가니 에너지 출입 방향이 반대다.", "tf": "정반응이 발열이면 역반응은? (흡열)"}, "CH1-237": {"n": "정·역반응 ΔH", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "역반응의 ΔH가 정반응과 크기는 같고 부호만 반대라는 점을 놓친 경우다. 이 관계가 약하면 헤스 법칙으로 반응을 조합할 때 부호를 틀린다.", "fx": "'역반응의 ΔH는 정반응과 크기는 같고 부호만 반대'임을 못 박는다. 이 관계로 헤스 법칙에서 반응을 뒤집을 때 부호를 바꿔라.", "f": "C2", "rk": 273, "d": 3, "rh": 0, "pre": ["CH1-236"], "tr": "역반응 ΔH가 다를 것 같아, 크기 같고 부호만 반대라는 게 빠진다.", "an": "역반응 ΔH는 크기 같고 부호만 반대다.", "rd": "처음·끝이 뒤바뀌니 ΔH는 크기 같고 부호만 반대다.", "tf": "역반응 ΔH는 정반응과? (부호 반대)"}, "CH1-238": {"n": "헤스 법칙", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "반응엔탈피가 경로와 무관하게 처음·끝 상태로만 정해진다는 헤스 법칙을 놓친 경우다. 경로 독립성이 약하면 여러 단계로 ΔH를 구하는 계산이 막힌다.", "fx": "헤스 법칙을 '반응엔탈피는 경로와 무관하게 처음·끝 상태로만 정해짐'으로 못 박는다. 경로 독립성을 잡아 여러 단계로 ΔH를 구하라.", "f": "A3", "rk": 151, "d": 2, "rh": 4, "pre": ["CH1-225"], "tr": "반응엔탈피가 경로에 달릴 것 같아, 처음·끝 상태로만 정해진다(헤스)는 게 빠진다.", "an": "처음·끝 상태로만 정해져 경로와 무관: 어느 등산로든 정상 높이는 같다.", "rd": "엔탈피는 상태 함수라 경로 무관이다. 그래서 단계로 쪼개 ΔH를 더해도 같다.", "tf": "경로가 달라도 ΔH가 같은 법칙은? (헤스)"}, "CH1-239": {"n": "헤스 법칙 적용", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "여러 반응의 ΔH를 더하거나 빼서(평균이 아니라 합) 목표 반응의 ΔH를 구하는 게 흔들린 경우다. 반응을 뒤집거나 배수할 때 ΔH도 함께 바꾸지 못하면 계산이 어긋난다.", "fx": "'여러 반응의 ΔH를 더하거나 빼서(평균이 아니라 합) 목표 ΔH를 구함'을 못 박는다. 반응을 뒤집으면 부호 반대, 배수하면 함께 곱해 계산하라.", "f": "D3", "rk": 274, "d": 3, "rh": 0, "pre": ["CH1-238"], "tr": "여러 ΔH를 평균낼 것 같아, 더하거나 빼는(합) 거라는 게 빠진다.", "an": "여러 ΔH를 더하거나 빼서 구한다.", "rd": "목표 반응이 되도록 단계 ΔH를 더하거나 뺀다.", "tf": "여러 ΔH로 목표 반응을 구하려면? (더하거나 뺌)"}, "CH1-240": {"n": "결합 에너지", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "결합을 끊는 데 에너지가 필요(흡열)하고 결합을 만들 때 방출(발열)된다는 점을 놓친 경우다. 끊음·만듦의 부호가 흔들리면 결합 에너지로 ΔH를 못 구한다.", "fx": "'결합을 끊는 데 에너지가 필요(흡열), 만들 때 방출(발열)'을 못 박는다. 끊음·만듦의 부호를 잡아 결합 에너지로 ΔH를 구하라.", "f": "A1", "rk": 275, "d": 3, "rh": 2, "pre": ["CH1-226"], "tr": "결합을 끊으면 에너지가 나올 것 같아, 끊는 데 필요(흡열)하고 만들 때 방출(발열)이라는 게 거꾸로 느껴진다.", "an": "끊는 데 흡열, 만들 때 발열: 자석 떼면 힘 들고 붙으면 에너지 나온다.", "rd": "결합은 낮은 에너지 상태다. 끊으려면 넣어야(흡열) 하고 만들면 나온다(발열).", "tf": "결합을 만드는 건 발열인가 흡열인가? (발열)"}, "CH1-241": {"n": "결합 에너지로 ΔH", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "반응엔탈피를 (끊은 결합 에너지 합 − 만든 결합 에너지 합)으로 구한다는 점을 놓친 경우다. 양쪽 결합 에너지를 모두 보지 않으면 ΔH가 어긋난다.", "fx": "반응엔탈피를 '(끊은 결합 에너지 합 − 만든 결합 에너지 합)'으로 못 박는다. 양쪽 결합 에너지를 모두 넣어 ΔH를 구하라.", "f": "D3", "rk": 430, "d": 4, "rh": 1, "pre": ["CH1-240", "CH1-238"], "tr": "결합 에너지로 ΔH를 어떻게 구하는지 막막해, (끊은 합-만든 합)이라는 게 빠진다.", "an": "ΔH=(끊은 합-만든 합)이다.", "rd": "끊은 결합 에너지 합에서 만든 결합 에너지 합을 뺀다.", "tf": "ΔH=끊은 합에서 무엇을 뺀 것? (만든 합)"}, "CH1-242": {"n": "결합 에너지 적용", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "만드는 결합이 끊는 결합보다 강해 방출 에너지가 더 크면 발열이라는 점을 놓친 경우다. 양쪽 결합 세기 비교가 약하면 반응의 발열·흡열을 못 가린다.", "fx": "'만드는 결합이 끊는 결합보다 강해 방출 에너지가 더 크면 발열'임을 못 박는다. 양쪽 결합 세기를 비교해 발열·흡열을 가려라.", "f": "C1", "rk": 601, "d": 5, "rh": 0, "pre": ["CH1-241"], "tr": "만든 결합·끊은 결합 비교가 막막해, 만든 게 더 강하면(방출 큼) 발열이라는 게 빠진다.", "an": "만든 결합이 더 강하면(방출 큼) 발열이다.", "rd": "만든 결합이 더 강하면 방출이 흡수보다 커 발열이다.", "tf": "만든 결합이 더 강하면 반응은? (발열)"}, "CH1-243": {"n": "상태와 ΔH", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "같은 물질도 상태에 따라 엔탈피가 달라 ΔH가 바뀐다는 점을 놓친 경우다(물의 증발열처럼). 상태 의존을 빼면 ΔH가 어긋난다.", "fx": "'같은 물질도 상태에 따라 엔탈피가 달라 ΔH가 바뀜(물의 증발열처럼)'을 못 박는다. 상태 의존을 빼지 말고 ΔH를 맞춰라.", "f": "A3", "rk": 676, "d": 6, "rh": 0, "pre": ["CH1-231"], "tr": "같은 물질이면 ΔH가 같을 것 같아, 상태에 따라 달라진다(증발열)는 게 빠진다.", "an": "같은 물질도 상태에 따라 ΔH가 다르다(증발열).", "rd": "같은 물질도 상태가 다르면 엔탈피가 다르다. 그래서 ΔH가 달라진다.", "tf": "같은 물질도 상태가 다르면 ΔH는? (다름)"}, "CH1-244": {"n": "흡열 과정 예", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "융해·기화·물의 분해 같은 흡열 과정이 열을 흡수한다는 점을 놓친 경우다. 흡열 과정을 발열로 오해하면 상변화·반응 분류가 어긋난다.", "fx": "'융해·기화·물의 분해 같은 과정은 흡열이라 열을 흡수'함을 못 박는다. 흡열 과정을 발열로 오해하지 말고 상변화를 분류하라.", "f": "B2", "rk": 431, "d": 4, "rh": 0, "pre": ["CH1-229"], "tr": "흡열 과정 예가 막연해, 융해·기화·물 분해가 열을 흡수한다는 게 빠진다.", "an": "융해·기화·물 분해가 열을 흡수한다.", "rd": "융해·기화·물 분해는 에너지를 흡수한다.", "tf": "기화는 발열인가 흡열인가? (흡열)"}, "CH1-245": {"n": "발열 ΔH 표기", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "발열 반응의 ΔH를 음의 값으로 표기한다는 점을 놓친 경우다. 방출인데 양수로 적으면 열화학 반응식의 부호가 뒤집힌다.", "fx": "'발열 반응의 ΔH는 음의 값으로 표기'함을 못 박는다. 방출인데 양수로 적지 않게 부호를 음으로 맞춰라.", "f": "C2", "rk": 276, "d": 3, "rh": 0, "pre": ["CH1-226"], "tr": "발열 ΔH를 +로 쓸 것 같아, 음의 값으로 쓴다는 게 흔들린다.", "an": "발열 ΔH는 음의 값으로 쓴다.", "rd": "발열은 엔탈피가 줄어 ΔH를 음의 값으로 쓴다.", "tf": "발열 ΔH는 어떤 부호로? (음)"}, "CH1-246": {"n": "발열·흡열 판단", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "온도 변화로 발열·흡열을 판단하는 게 흔들린 경우다(온도 오르면 발열, 내리면 흡열). 이 판단이 약하면 실험에서 반응의 열 성격을 못 읽는다.", "fx": "'온도가 오르면 발열, 내리면 흡열'로 판단함을 못 박는다. 실험에서 온도 변화로 반응의 열 성격을 읽어라.", "f": "A1", "rk": 432, "d": 4, "rh": 0, "pre": ["CH1-228", "CH1-229"], "tr": "온도로 발열·흡열을 어떻게 가리는지 막막해, 오르면 발열·내리면 흡열이라는 게 빠진다.", "an": "온도 오르면 발열, 내리면 흡열이다.", "rd": "주위 온도가 오르면 발열, 내리면 흡열이다.", "tf": "주위 온도가 내리면 무슨 반응? (흡열)"}, "CH1-247": {"n": "상태 함수", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "엔탈피가 경로와 무관하게 상태로만 정해지는 상태 함수라는 점을 놓친 경우다. 상태 함수라는 본질이 약하면 헤스 법칙이 왜 성립하는지 근거가 사라진다.", "fx": "엔탈피를 '경로와 무관하게 상태로만 정해지는 상태 함수'로 못 박는다. 이 본질이 헤스 법칙의 근거임을 짚어라.", "f": "A3", "rk": 277, "d": 3, "rh": 0, "pre": ["CH1-238"], "tr": "엔탈피가 경로에 달릴 것 같아, 상태로만 정해지는 상태 함수라는 게 빠진다.", "an": "엔탈피는 경로와 무관한 상태 함수다.", "rd": "엔탈피는 처음·끝 상태로만 정해지는 상태 함수다.", "tf": "엔탈피는 경로에 의존하나? (안 함: 상태 함수)"}, "CH1-293": {"n": "흡열 ΔH 표기", "c": "ch1", "u": "엔탈피", "t": "C", "dx": "흡열 반응의 ΔH를 양의 값으로 표기한다는 점을 놓친 경우다. 흡수인데 음수로 적으면 열화학 반응식의 부호가 뒤집힌다.", "fx": "'흡열 반응의 ΔH는 양의 값으로 표기'함을 못 박는다. 흡수인데 음수로 적지 않게 부호를 양으로 맞춰라.", "f": "C2", "rk": 278, "d": 3, "rh": 0, "pre": ["CH1-227"], "tr": "흡열 ΔH를 -로 쓸 것 같아, 양의 값으로 쓴다는 게 흔들린다.", "an": "흡열 ΔH는 양의 값으로 쓴다.", "rd": "흡열은 엔탈피가 늘어 ΔH를 양의 값으로 쓴다.", "tf": "흡열 ΔH는 어떤 부호로? (양)"}, "CH2-251": {"n": "아레니우스 정의", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "아레니우스 정의에서 산이 물에서 H⁺를, 염기가 OH⁻를 내놓는다는 점을 놓친 경우다. 이 기본 정의가 흐리면 브뢴스테드로 확장하는 흐름을 못 짚는다.", "fx": "아레니우스 정의를 '산은 물에서 H⁺를, 염기는 OH⁻를 내놓음'으로 못 박는다. 이 기본 정의에서 브뢴스테드로 확장하는 흐름으로 이어라.", "f": "B1", "rk": 19, "d": 0, "rh": 67, "pre": [], "tr": "산·염기가 그냥 성질 같아, 물에서 산은 H⁺를·염기는 OH⁻를 내놓는다는 정의가 흐려진다.", "an": "물에서 산은 H⁺를, 염기는 OH⁻를 내놓는다.", "rd": "물에서 H⁺를 내면 산, OH⁻를 내면 염기로 정의한다.", "tf": "물에서 OH⁻를 내면 산인가 염기인가? (염기)"}, "CH2-252": {"n": "브뢴스테드 정의", "c": "ch2", "u": "산염기세기", "t": "B", "dx": "브뢴스테드 정의에서 산이 양성자(H⁺) 주개, 염기가 양성자 받개라는 점을 놓친 경우다. 양성자 이동으로 산·염기를 보는 관점이 약하면 짝산-짝염기 개념이 안 선다.", "fx": "브뢴스테드 정의를 '산은 양성자(H⁺) 주개, 염기는 양성자 받개'로 못 박는다. 양성자 이동으로 보는 관점으로 짝산-짝염기 개념을 세워라.", "f": "B1", "rk": 93, "d": 1, "rh": 28, "pre": ["CH2-251"], "tr": "산·염기가 고정된 꼬리표 같아, H⁺를 주면 산·받으면 염기라는 역할 기준이 안 잡힌다.", "an": "산은 H⁺를 주는 사람, 염기는 받는 사람이다.", "rd": "H⁺ 주고받음으로 정의한다. 주면 산, 받으면 염기다.", "tf": "H⁺를 받으면 산인가 염기인가? (염기)"}, "CH2-253": {"n": "짝산-짝염기", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "짝산-짝염기가 H⁺ 하나 차이로 이어진 쌍(산이 H⁺를 잃으면 짝염기)이라는 점을 놓친 경우다. 이 관계가 약하면 산 세기와 짝염기 세기의 반비례를 못 짚는다.", "fx": "짝산-짝염기를 'H⁺ 하나 차이로 이어진 쌍(산이 H⁺를 잃으면 짝염기)'으로 못 박는다. 이 관계로 산 세기와 짝염기 세기의 반비례를 짚어라.", "f": "B2", "rk": 202, "d": 2, "rh": 11, "pre": ["CH2-252"], "tr": "짝 관계가 막연해, H⁺ 하나 차이로 산이 H⁺를 잃으면 짝염기가 된다는 게 빠진다.", "an": "산이 H⁺ 하나를 잃으면 짝염기: H⁺ 하나 차이다.", "rd": "산이 H⁺를 잃으면 짝염기가 된다. H⁺ 하나 차이다.", "tf": "산이 H⁺를 잃으면? (짝염기)"}, "CH2-254": {"n": "양쪽성", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "양쪽성 물질이 산으로도 염기로도 작용할 수 있다는(물이 대표적) 점을 놓친 경우다. 양쪽성이 약하면 물의 자동 이온화처럼 같은 물질이 양쪽으로 행동하는 경우를 설명하지 못한다.", "fx": "양쪽성 물질을 '산으로도 염기로도 작용할 수 있음(물이 대표)'으로 못 박는다. 양쪽성으로 물의 자동 이온화처럼 같은 물질이 양쪽으로 행동하는 경우를 설명하라.", "f": "B2", "rk": 203, "d": 2, "rh": 0, "pre": ["CH2-252"], "tr": "물질은 산이면 산일 것 같아, 물처럼 조건 따라 둘 다 되는 양쪽성이 예외처럼 다가온다.", "an": "물은 상대에 따라 산도 염기도 되는 양손잡이다.", "rd": "물은 상대에 따라 H⁺를 주거나 받는다. 그래서 산도 염기도 된다.", "tf": "물이 산도 염기도 되는 이유는? (상대 따라 H⁺ 주고받음)"}, "CH2-255": {"n": "산 세기", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "산의 세기를 농도와 같은 것으로 본 경우다. 세기가 이온화하는 정도이고 농도(얼마나 많이 녹았나)와는 다른 개념이라는 점을 놓치면 묽은 강산과 진한 약산을 혼동한다.", "fx": "산의 세기를 '이온화하는 정도(농도와 다른 개념)'로 못 박는다. 세기와 농도를 갈라 묽은 강산과 진한 약산을 혼동하지 마라.", "f": "B2", "rk": 94, "d": 1, "rh": 28, "pre": ["CH2-251"], "tr": "진하면 센 산 같아, 세기는 농도가 아니라 이온화 정도라는 게 흐려진다.", "an": "산 세기는 농도가 아니라 이온화 정도다.", "rd": "세기는 진하기가 아니라 얼마나 이온화하나다.", "tf": "산 세기는 농도인가 이온화 정도인가? (이온화 정도)"}, "CH2-256": {"n": "강산", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "강산이 물에서 거의 완전히 이온화하는 산이라는 점을 놓친 경우다. 거의 다 이온화한다는 점이 약하면 강산 용액의 [H⁺]를 잘못 잡는다.", "fx": "강산을 '물에서 거의 완전히 이온화하는 산'으로 못 박는다. 거의 다 이온화함을 잡아 강산 용액의 [H⁺]를 맞춰라.", "f": "B2", "rk": 204, "d": 2, "rh": 10, "pre": ["CH2-255"], "tr": "강산이 막연해, 물에서 거의 완전히 이온화하는 산이라는 게 빠진다.", "an": "강산은 물에서 거의 완전히 이온화한다.", "rd": "강산은 물에서 거의 완전히 이온화한다.", "tf": "강산은 물에서 얼마나 이온화? (거의 완전)"}, "CH2-257": {"n": "강산 예", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "HCl·HNO₃·H₂SO₄처럼 거의 완전히 이온화하는 산이 강산이라는 점을 놓친 경우다. 강산 예를 약산과 혼동하면 산 세기 분류가 어긋난다.", "fx": "'HCl·HNO₃·H₂SO₄처럼 거의 완전히 이온화하는 산이 강산'임을 못 박는다. 강산 예를 약산과 혼동하지 말고 분류하라.", "f": "B2", "rk": 339, "d": 3, "rh": 0, "pre": ["CH2-256"], "tr": "어떤 게 강산인지 막연해, HCl·HNO₃·H₂SO₄가 거의 완전히 이온화한다는 게 빠진다.", "an": "HCl·HNO₃·H₂SO₄가 거의 완전히 이온화한다.", "rd": "HCl·HNO₃·H₂SO₄가 거의 완전히 이온화한다.", "tf": "HCl은 강산인가 약산인가? (강산)"}, "CH2-258": {"n": "약산 예", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "아세트산(CH₃COOH)·탄산처럼 일부만 이온화하는 산이 약산이라는 점을 놓친 경우다. 약산 예를 강산과 혼동하면 산 세기 분류가 어긋난다.", "fx": "'아세트산(CH₃COOH)·탄산처럼 일부만 이온화하는 산이 약산'임을 못 박는다. 약산 예를 강산과 혼동하지 말고 분류하라.", "f": "B2", "rk": 340, "d": 3, "rh": 0, "pre": ["CH2-259"], "tr": "어떤 게 약산인지 막연해, 아세트산·탄산이 일부만 이온화한다는 게 빠진다.", "an": "아세트산·탄산이 일부만 이온화한다.", "rd": "아세트산·탄산이 일부만 이온화한다.", "tf": "아세트산은 강산인가 약산인가? (약산)"}, "CH2-259": {"n": "약산", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "약산이 물에서 일부만 이온화해 이온화 평형을 이룬다는 점을 놓친 경우다. 일부만 이온화한다는 점이 약하면 이온화 상수로 세기를 다루는 단계로 이어지지 못한다.", "fx": "약산을 '물에서 일부만 이온화해 이온화 평형을 이룸'으로 못 박는다. 일부만 이온화함을 잡아 이온화 상수로 세기를 다루는 단계로 이어라.", "f": "B2", "rk": 205, "d": 2, "rh": 22, "pre": ["CH2-255"], "tr": "약산이 막연해, 물에서 일부만 이온화해 평형을 이룬다는 게 빠진다.", "an": "약산은 물에서 일부만 이온화해 평형이다.", "rd": "약산은 물에서 일부만 이온화해 평형을 이룬다.", "tf": "약산은 물에서 얼마나 이온화? (일부)"}, "CH2-260": {"n": "강염기 예", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "NaOH·KOH처럼 거의 완전히 이온화하는 염기가 강염기라는 점을 놓친 경우다. 강염기 예를 약염기와 혼동하면 염기 세기 분류가 어긋난다.", "fx": "'NaOH·KOH처럼 거의 완전히 이온화하는 염기가 강염기'임을 못 박는다. 강염기 예를 약염기와 혼동하지 말고 분류하라.", "f": "B2", "rk": 341, "d": 3, "rh": 2, "pre": ["CH2-256"], "tr": "어떤 게 강염기인지 막연해, NaOH·KOH가 거의 완전히 이온화한다는 게 빠진다.", "an": "NaOH·KOH가 거의 완전히 이온화한다.", "rd": "NaOH·KOH가 거의 완전히 이온화한다.", "tf": "NaOH는 강염기인가 약염기인가? (강염기)"}, "CH2-261": {"n": "약염기 예", "c": "ch2", "u": "산염기세기", "t": "B", "dx": "암모니아(NH₃)처럼 일부만 이온화하는 염기가 약염기라는 점을 놓친 경우다. 약염기 예를 강염기와 혼동하면 염기 세기 분류가 어긋난다.", "fx": "'암모니아(NH₃)처럼 일부만 이온화하는 염기가 약염기'임을 못 박는다. 약염기 예를 강염기와 혼동하지 말고 분류하라.", "f": "B2", "rk": 342, "d": 3, "rh": 1, "pre": ["CH2-259"], "tr": "어떤 게 약염기인지 막연해, 암모니아가 일부만 이온화한다는 게 빠진다.", "an": "암모니아가 일부만 이온화한다.", "rd": "암모니아가 일부만 이온화한다.", "tf": "암모니아는 강염기인가 약염기인가? (약염기)"}, "CH2-262": {"n": "이온화 상수", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "이온화 상수가 산의 이온화 평형 상수라 농도와 무관하게(온도에만 의존) 물질 고유 값이라는 점을 놓친 경우다. 평형 상수라는 점이 약하면 Kₐ를 농도와 헷갈린다.", "fx": "이온화 상수를 '산의 이온화 평형 상수라 농도와 무관하게(온도에만 의존) 물질 고유 값'으로 못 박는다. 평형 상수임을 잡아 Kₐ를 농도와 헷갈리지 마라.", "f": "A3", "rk": 343, "d": 3, "rh": 8, "pre": ["CH2-259"], "tr": "이온화 상수가 농도 따라 변할 것 같아, 온도에만 의존하는 물질 고유값이라는 게 빠진다.", "an": "온도에만 의존하는 물질 고유값: 농도 무관이다.", "rd": "이온화 평형 상수라 온도에만 의존한다. 농도와 무관하다.", "tf": "이온화 상수는 무엇에만 의존? (온도)"}, "CH2-263": {"n": "Ka와 세기", "c": "ch2", "u": "산염기세기", "t": "A", "dx": "이온화 상수 Kₐ가 클수록 이온화가 잘 돼(이온 쪽으로 치우쳐) 더 강한 산이라는 점을 놓친 경우다. Kₐ가 세기의 척도라는 점이 약하면 두 산의 세기를 비교하지 못한다.", "fx": "'이온화 상수 Kₐ가 클수록 이온화가 잘 돼(이온 쪽으로 치우쳐) 더 강한 산'임을 못 박는다. Kₐ가 세기의 척도임을 잡아 두 산의 세기를 비교하라.", "f": "C1", "rk": 499, "d": 4, "rh": 4, "pre": ["CH2-262"], "tr": "Kₐ가 크면 약한 산 같기도 해, 클수록 이온화가 잘 돼 강한 산이라는 게 흔들린다.", "an": "Ka가 클수록 잘 이온화하는 강한 산이다.", "rd": "Ka가 크면 평형이 이온 쪽이다. 그래서 강한 산이다.", "tf": "Ka가 크면 산은? (셈)"}, "CH2-264": {"n": "Ka 해석", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "Kₐ가 크면 이온화 평형이 이온 쪽으로 치우쳐 이온화가 많이 된 것이라는 해석을 놓친 경우다. Kₐ의 대소로 이온화 정도를 못 읽으면 산 세기 해석이 어긋난다.", "fx": "'Kₐ가 크면 이온화 평형이 이온 쪽으로 치우쳐 이온화가 많이 된 것'으로 못 박는다. Kₐ의 대소로 이온화 정도를 읽어 산 세기를 해석하라.", "f": "C1", "rk": 633, "d": 5, "rh": 0, "pre": ["CH2-263"], "tr": "Kₐ 값이 그냥 숫자 같아, 크면 평형이 이온 쪽으로 치우쳐 많이 이온화한 것이라는 게 빠진다.", "an": "Ka가 크면 평형이 이온 쪽으로 치우쳐 많이 이온화한다.", "rd": "Ka가 크면 이온 쪽으로 치우쳐 많이 이온화한 것이다.", "tf": "Ka가 크면 이온화는? (많이)"}, "CH2-265": {"n": "Ka·Kb 관계", "c": "ch2", "u": "산염기세기", "t": "A", "dx": "산의 이온화 상수 Kₐ와 그 짝염기의 이온화 상수를 곱하면 물 이온곱 상수(10⁻¹⁴)가 된다는 짝 관계를 놓친 경우다. 이 관계가 약하면 산이 강할수록 짝염기가 약하다는 결론을 못 끌어낸다.", "fx": "'산의 Kₐ와 그 짝염기의 이온화 상수를 곱하면 물 이온곱 상수(10⁻¹⁴)'임을 못 박는다. 이 곱 관계로 산이 강할수록 짝염기가 약하다는 결론을 끌어내라.", "f": "D3", "rk": 500, "d": 4, "rh": 0, "pre": ["CH2-262", "CH2-269"], "tr": "Kₐ와 짝염기 상수가 따로 놀 것 같아, 둘의 곱이 물 이온곱(10⁻¹⁴)이라는 게 빠진다.", "an": "산의 Ka와 짝염기 Kb는 곱이 물 이온곱(10⁻¹⁴)이다.", "rd": "짝산-짝염기에서 Ka×Kb=Kw=10⁻¹⁴다.", "tf": "Ka와 짝염기 Kb의 곱은? (Kw)"}, "CH2-266": {"n": "짝염기 세기", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "산의 Kₐ가 클수록 짝염기의 이온화 상수는 작아 짝염기가 약하다는 반비례를 놓친 경우다. 산 세기와 짝염기 세기의 반대 관계가 약하면 짝 관계 문제가 어긋난다.", "fx": "'산의 Kₐ가 클수록 짝염기의 이온화 상수는 작아 짝염기가 약함(반비례)'을 못 박는다. 산 세기와 짝염기 세기의 반대 관계로 짝 관계 문제를 풀어라.", "f": "A1", "rk": 634, "d": 5, "rh": 0, "pre": ["CH2-263", "CH2-253"], "tr": "센 산의 짝염기도 셀 것 같은데, Kₐ가 클수록 짝염기가 약하다는 반비례가 거꾸로 느껴진다.", "an": "Ka가 클수록 짝염기가 약하다: 센 산일수록 짝염기가 약, 거꾸로 느껴진다.", "rd": "산이 H⁺를 잘 낼수록 짝염기는 H⁺를 잘 안 붙든다. 그래서 Ka가 크면 짝염기가 약하다.", "tf": "강산의 짝염기는 센가 약한가? (약함)"}, "CH2-267": {"n": "강산 vs 약산", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "강산과 약산의 차이가 이온화하는 정도(강산은 거의 완전, 약산은 일부)라는 점을 놓친 경우다. 이 기준이 약하면 같은 농도라도 [H⁺]가 다른 까닭을 못 짚는다.", "fx": "'강산과 약산의 차이는 이온화하는 정도(강산은 거의 완전, 약산은 일부)'임을 못 박는다. 이 기준으로 같은 농도라도 [H⁺]가 다른 까닭을 짚어라.", "f": "B2", "rk": 344, "d": 3, "rh": 2, "pre": ["CH2-256", "CH2-259"], "tr": "강산·약산 차이가 막연해, 이온화 정도(거의 완전 vs 일부)라는 게 빠진다.", "an": "강산·약산 차이는 이온화 정도(거의 완전 vs 일부)다.", "rd": "차이는 이온화 정도다. 거의 완전이냐 일부냐다.", "tf": "강산과 약산의 차이는? (이온화 정도)"}, "CH2-268": {"n": "pKa", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "pKₐ가 Kₐ의 음의 로그라 pKₐ가 작을수록(Kₐ가 클수록) 강한 산이라는 점을 놓친 경우다. pKₐ와 세기의 반대 관계가 약하면 pKₐ 값으로 세기를 잘못 비교한다.", "fx": "pKₐ를 'Kₐ의 음의 로그라 pKₐ가 작을수록(Kₐ가 클수록) 강한 산'으로 못 박는다. pKₐ와 세기의 반대 관계로 pKₐ 값으로 세기를 비교하라.", "f": "A1", "rk": 635, "d": 5, "rh": 1, "pre": ["CH2-263"], "tr": "pKₐ가 크면 센 산 같아, 음의 로그라 작을수록 강하다는 역방향이 흔들린다.", "an": "pKa는 작을수록 센 산: -log라 역방향이다.", "rd": "pKa=-log Ka다. Ka가 크면(강산) pKa가 작다.", "tf": "pKa가 작은 산은? (셈)"}, "CH2-269": {"n": "물 이온곱", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "물 이온곱이 [H⁺]와 [OH⁻]의 곱으로 25°C에서 10⁻¹⁴인 매우 작은 값이라는 점을 놓친 경우다. 이 값이 약하면 pH 계산과 Kₐ·짝염기 상수의 곱 관계가 흔들린다.", "fx": "물 이온곱을 '[H⁺]와 [OH⁻]의 곱으로 25°C에서 10⁻¹⁴인 매우 작은 값'으로 못 박는다. 이 값으로 pH 계산과 Kₐ·짝염기 상수의 곱 관계를 잡아라.", "f": "D3", "rk": 95, "d": 1, "rh": 26, "pre": ["CH2-251"], "tr": "물 이온곱이 합일 것 같아, [H⁺]와 [OH⁻]의 곱(10⁻¹⁴)이라는 게 빠진다.", "an": "[H⁺]와 [OH⁻]의 곱(10⁻¹⁴)이다.", "rd": "자동이온화 평형에서 [H⁺][OH⁻]=10⁻¹⁴다.", "tf": "[H⁺][OH⁻]는? (10⁻¹⁴)"}, "CH2-270": {"n": "이온화도", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "이온화도가 녹은 산·염기 중 실제로 이온화한 비율이고 강산은 1에 가깝고 약산은 작다는 점을 놓친 경우다. 이온화도가 약하면 세기를 정량적으로 비교하지 못한다.", "fx": "이온화도를 '녹은 산·염기 중 실제로 이온화한 비율, 강산은 1에 가깝고 약산은 작음'으로 못 박는다. 이온화도로 세기를 정량적으로 비교하라.", "f": "B2", "rk": 345, "d": 3, "rh": 1, "pre": ["CH2-256", "CH2-259"], "tr": "이온화도가 막연해, 녹은 것 중 실제 이온화한 비율이고 강산은 1에 가깝다는 게 빠진다.", "an": "녹은 것 중 실제 이온화한 비율: 강산은 1에 가깝다.", "rd": "녹은 것 중 이온화한 비율이다. 강산은 1에 가깝다.", "tf": "녹은 것 중 이온화한 비율은? (이온화도)"}, "CH2-271": {"n": "전기 전도성", "c": "ch2", "u": "산염기세기", "t": "C", "dx": "이온이 많을수록 전류를 잘 날라 전기 전도성이 크다는 점을 놓친 경우다(같은 농도면 강산·강염기가 약산·약염기보다 잘 통함). 이온 수와 전도성의 연결이 약하면 전도도로 산·염기 세기를 판별하지 못한다.", "fx": "'이온이 많을수록 전류를 잘 날라 전기 전도성이 큼(같은 농도면 강산·강염기가 약산·약염기보다 잘 통함)'을 못 박는다. 이온 수와 전도성을 이어 전도도로 산·염기 세기를 판별하라.", "f": "B3", "rk": 501, "d": 4, "rh": 0, "pre": ["CH2-270"], "tr": "전도성이 농도만 따를 것 같아, 이온이 많을수록 잘 통해 같은 농도면 강산·강염기가 더 잘 통한다는 게 빠진다.", "an": "이온이 많을수록 잘 통해 같은 농도면 강산·강염기가 더 잘 통한다.", "rd": "이온이 많을수록 잘 통한다. 그래서 같은 농도면 강산·강염기가 더 잘 통한다.", "tf": "같은 농도면 강산과 약산 중 잘 통하는 건? (강산)"}, "CH2-272": {"n": "pH 정의", "c": "ch2", "u": "완충", "t": "B", "dx": "pH가 [H⁺]의 음의 로그라 농도가 10배 변할 때 1씩 변하는 로그 척도라는 점을 놓친 경우다. 정의와 척도가 약하면 산·염기 정량과 완충 계산의 출발이 흔들린다.", "fx": "pH를 '[H⁺]의 음의 로그라 농도 10배에 1씩 변하는 로그 척도'로 못 박는다. 정의와 척도를 잡아 산·염기 정량·완충 계산의 출발로 삼아라.", "f": "D3", "rk": 206, "d": 2, "rh": 22, "pre": ["CH2-269"], "tr": "pH가 막연해, [H⁺]의 음의 로그라 농도 10배에 1씩 변하는 척도라는 게 빠진다.", "an": "pH=-log[H⁺]: 농도 10배에 1씩 변하는 척도다.", "rd": "[H⁺]가 거듭제곱으로 변하니 -log를 취한다. 농도 10배에 1씩 변한다.", "tf": "pH는 무엇의 -log? ([H⁺])"}, "CH2-273": {"n": "pOH 정의", "c": "ch2", "u": "완충", "t": "C", "dx": "pOH가 [OH⁻]의 음의 로그라는 정의를 놓친 경우다. pH와 짝을 이루는 이 정의가 약하면 염기성 용액의 정량 계산이 막힌다.", "fx": "pOH를 '[OH⁻]의 음의 로그'로 못 박는다. pH와 짝지어 염기성 용액의 정량 계산에 써라.", "f": "D3", "rk": 207, "d": 2, "rh": 2, "pre": ["CH2-269"], "tr": "pOH가 막연해, [OH⁻]의 음의 로그라는 게 빠진다.", "an": "pOH=-log[OH⁻]다.", "rd": "[OH⁻]에 -log를 취한 것이 pOH다.", "tf": "pOH는 무엇의 -log? ([OH⁻])"}, "CH2-274": {"n": "pH+pOH", "c": "ch2", "u": "완충", "t": "C", "dx": "25°C에서 pH + pOH = 14라는 관계를 놓친 경우다. 한쪽에서 다른 쪽을 환산하는 이 식이 약하면 산·염기 계산이 끊긴다.", "fx": "'25°C에서 pH + pOH = 14'를 못 박는다. 한쪽에서 다른 쪽을 14에서 빼 환산하라.", "f": "D3", "rk": 346, "d": 3, "rh": 0, "pre": ["CH2-272", "CH2-273"], "tr": "pH+pOH=14가 외울 공식 같아, 물 이온곱에서 나온다는 게 빠진다.", "an": "pH+pOH=14는 물 이온곱에서 나온다.", "rd": "[H⁺][OH⁻]=10⁻¹⁴에 -log를 취하면 pH+pOH=14다.", "tf": "pH+pOH는? (14)"}, "CH2-275": {"n": "중성 pH", "c": "ch2", "u": "완충", "t": "C", "dx": "중성에서 [H⁺]=[OH⁻]라 25°C에서 pH가 7이라는 점을 놓친 경우다. 중성 기준이 흐리면 산성·염기성과의 경계를 못 잡는다.", "fx": "'중성은 [H⁺]=[OH⁻]라 25°C에서 pH 7'임을 못 박는다. 중성 기준으로 산성·염기성과의 경계를 잡아라.", "f": "B2", "rk": 347, "d": 3, "rh": 2, "pre": ["CH2-269", "CH2-272"], "tr": "중성이 막연해, [H⁺]=[OH⁻]라 25°C에서 pH 7이라는 게 빠진다.", "an": "중성은 [H⁺]=[OH⁻]라 25℃에서 pH 7이다.", "rd": "중성은 [H⁺]=[OH⁻]라 25℃에서 pH 7이다.", "tf": "25℃ 중성 pH는? (7)"}, "CH2-276": {"n": "산성 pH", "c": "ch2", "u": "완충", "t": "B", "dx": "산성이 [H⁺]가 많아 pH가 7보다 작은 상태라는 점을 놓친 경우다. pH와 액성의 대응이 약하면 pH 값으로 산성을 못 가린다.", "fx": "'산성은 [H⁺]가 많아 pH가 7보다 작음'을 못 박는다. pH와 액성의 대응으로 pH 값으로 산성을 가려라.", "f": "B2", "rk": 502, "d": 4, "rh": 0, "pre": ["CH2-275"], "tr": "산성이 막연해, [H⁺]가 많아 pH가 7보다 작다는 게 빠진다.", "an": "[H⁺]가 많아 pH가 7보다 작다.", "rd": "산성은 [H⁺]가 많아 pH가 7보다 작다.", "tf": "산성의 pH는 7보다? (작음)"}, "CH2-277": {"n": "염기성 pH", "c": "ch2", "u": "완충", "t": "C", "dx": "염기성이 [OH⁻]가 많아 pH가 7보다 큰 상태라는 점을 놓친 경우다. pH와 액성의 대응이 약하면 pH 값으로 염기성을 못 가린다.", "fx": "'염기성은 [OH⁻]가 많아 pH가 7보다 큼'을 못 박는다. pH와 액성의 대응으로 pH 값으로 염기성을 가려라.", "f": "B2", "rk": 503, "d": 4, "rh": 0, "pre": ["CH2-275"], "tr": "염기성이 막연해, [OH⁻]가 많아 pH가 7보다 크다는 게 빠진다.", "an": "[OH⁻]가 많아 pH가 7보다 크다.", "rd": "염기성은 [OH⁻]가 많아 pH가 7보다 크다.", "tf": "염기성의 pH는 7보다? (큼)"}, "CH2-278": {"n": "pH와 농도", "c": "ch2", "u": "완충", "t": "C", "dx": "pH가 [H⁺]의 음의 로그라 농도가 진할수록 pH가 작아진다는 반대 관계를 놓친 경우다. 이 방향이 약하면 농도에서 pH를 못 구한다.", "fx": "'pH는 [H⁺]의 음의 로그라 농도가 진할수록 pH가 작아짐'을 못 박는다. 이 반대 방향으로 농도에서 pH를 구하라.", "f": "A1", "rk": 348, "d": 3, "rh": 0, "pre": ["CH2-272"], "tr": "농도가 진하면 pH도 클 것 같아, 음의 로그라 진할수록 pH가 작아진다는 게 거꾸로 느껴진다.", "an": "진할수록 pH가 작아진다: 음의 로그라 거꾸로다.", "rd": "pH=-log[H⁺]라 진할수록 pH가 작아진다. 거꾸로다.", "tf": "진할수록 pH는? (작음)"}, "CH2-279": {"n": "pH 척도", "c": "ch2", "u": "완충", "t": "C", "dx": "pH가 로그 척도라 pH 차이 1이 [H⁺] 10배 차이라는 점을 놓친 경우다. 척도 감각이 약하면 pH 차를 농도 비로 환산하지 못한다.", "fx": "'pH는 로그 척도라 차이 1이 [H⁺] 10배'임을 못 박는다. 척도 감각으로 pH 차를 농도 비로 환산하라.", "f": "A2", "rk": 349, "d": 3, "rh": 0, "pre": ["CH2-272"], "tr": "pH 차이가 비례할 것 같아, 로그라 차이 1이 [H⁺] 10배라는 게 의외다.", "an": "pH 차이 1이 [H⁺] 10배: 로그라 비례가 아니다.", "rd": "로그라 pH 차이 1이 [H⁺] 10배다. 비례가 아니다.", "tf": "pH 차이 1은 [H⁺] 몇 배? (10배)"}, "CH2-280": {"n": "강산 pH", "c": "ch2", "u": "완충", "t": "C", "dx": "강산이 거의 완전히 이온화해 [H⁺]가 산의 농도와 거의 같다는 점을 놓친 경우다. 이 근사가 약하면 강산 용액의 pH를 못 구한다.", "fx": "'강산은 거의 완전히 이온화해 [H⁺]가 산의 농도와 거의 같음'을 못 박는다. 이 근사로 강산 용액의 pH를 구하라.", "f": "B2", "rk": 350, "d": 3, "rh": 0, "pre": ["CH2-256", "CH2-272"], "tr": "강산 [H⁺]가 막연해, 거의 완전히 이온화해 산의 농도와 거의 같다는 게 빠진다.", "an": "강산은 거의 완전히 이온화해 [H⁺]가 산의 농도와 거의 같다.", "rd": "강산은 거의 완전히 이온화한다. 그래서 [H⁺]가 산의 농도와 거의 같다.", "tf": "강산의 [H⁺]는 산의 농도와? (거의 같음)"}, "CH2-281": {"n": "강염기 pOH", "c": "ch2", "u": "완충", "t": "C", "dx": "강염기가 거의 완전히 이온화해 [OH⁻]가 염기의 농도와 거의 같다는 점을 놓친 경우다. 이 근사가 약하면 강염기의 pOH·pH를 못 구한다.", "fx": "'강염기는 거의 완전히 이온화해 [OH⁻]가 염기의 농도와 거의 같음'을 못 박는다. 이 근사로 강염기의 pOH·pH를 구하라.", "f": "B2", "rk": 504, "d": 4, "rh": 0, "pre": ["CH2-260", "CH2-273"], "tr": "강염기 [OH⁻]가 막연해, 거의 완전히 이온화해 염기의 농도와 거의 같다는 게 빠진다.", "an": "강염기는 거의 완전히 이온화해 [OH⁻]가 염기의 농도와 거의 같다.", "rd": "강염기는 거의 완전히 이온화한다. 그래서 [OH⁻]가 염기의 농도와 거의 같다.", "tf": "강염기의 [OH⁻]는 염기의 농도와? (거의 같음)"}, "CH2-282": {"n": "약산 근사", "c": "ch2", "u": "완충", "t": "C", "dx": "약산은 일부만 이온화해 [H⁺]가 √(Kₐ·C)로 근사된다는 점을 놓친 경우다. 강산처럼 농도를 그대로 [H⁺]로 쓰면 약산 pH가 어긋난다.", "fx": "'약산은 일부만 이온화해 [H⁺]가 √(Kₐ·C)로 근사됨'을 못 박는다. 강산처럼 농도를 그대로 [H⁺]로 쓰지 말고 이 근사로 약산 pH를 구하라.", "f": "D3", "rk": 505, "d": 4, "rh": 0, "pre": ["CH2-262", "CH2-272"], "tr": "약산 [H⁺]가 막연해, 일부만 이온화해 √(Kₐ·C)로 근사된다는 게 빠진다.", "an": "약산 [H⁺]는 일부만 이온화해 √(Ka·C)로 근사한다.", "rd": "약산은 일부만 이온화한다. 그래서 [H⁺]를 √(Ka·C)로 근사한다.", "tf": "약산 [H⁺]를 어떻게 근사? (√(Ka·C))"}, "CH2-283": {"n": "약산 vs 강산 pH", "c": "ch2", "u": "완충", "t": "C", "dx": "같은 농도라도 약산은 일부만 이온화해 [H⁺]가 적어 강산보다 pH가 높다는 점을 놓친 경우다. 이온화 정도 차이가 약하면 두 산의 pH를 잘못 비교한다.", "fx": "'같은 농도라도 약산은 일부만 이온화해 [H⁺]가 적어 강산보다 pH가 높음'을 못 박는다. 이온화 정도 차이로 두 산의 pH를 비교하라.", "f": "C1", "rk": 506, "d": 4, "rh": 0, "pre": ["CH2-267", "CH2-272"], "tr": "같은 농도면 pH도 같을 것 같아, 약산은 일부만 이온화해 [H⁺]가 적어 pH가 더 높다는 게 빠진다.", "an": "같은 농도면 약산이 [H⁺]가 적어 pH가 더 높다.", "rd": "약산은 일부만 이온화해 [H⁺]가 적다. 그래서 같은 농도면 pH가 더 높다.", "tf": "같은 농도면 약산과 강산 중 pH가 높은 건? (약산)"}, "CH2-284": {"n": "약산 이온화", "c": "ch2", "u": "완충", "t": "C", "dx": "약산이 물에서 일부만 이온화해 이온화 평형을 이룬다는 점을 놓친 경우다. 일부만 이온화한다는 점이 약하면 완충·가수분해로 이어지지 못한다.", "fx": "'약산은 물에서 일부만 이온화해 이온화 평형을 이룸'을 못 박는다. 일부만 이온화함을 잡아 완충·가수분해로 이어라.", "f": "B2", "rk": 351, "d": 3, "rh": 0, "pre": ["CH2-259"], "tr": "약산 이온화가 막연해, 물에서 일부만 이온화해 평형을 이룬다는 게 빠진다.", "an": "약산은 물에서 일부만 이온화해 평형이다.", "rd": "약산은 물에서 일부만 이온화해 평형이다.", "tf": "약산은 물에서 얼마나 이온화? (일부)"}, "CH2-285": {"n": "완충 용액 구성", "c": "ch2", "u": "완충", "t": "A", "dx": "완충 용액이 약산과 그 짝염기(또는 약염기와 짝산)가 함께 들어 있는 용액이라는 점을 놓친 경우다. 두 성분이 함께 있어야 산·염기 양쪽을 중화할 수 있다는 점이 약하면 완충의 구성을 잘못 잡는다.", "fx": "완충 용액을 '약산과 그 짝염기(또는 약염기와 짝산)가 함께 든 용액'으로 못 박는다. 두 성분이 함께 있어야 산·염기 양쪽을 중화함을 잡아 구성을 바로 잡아라.", "f": "B2", "rk": 352, "d": 3, "rh": 4, "pre": ["CH2-253", "CH2-259"], "tr": "완충이 약산만 있으면 될 것 같아, 약산과 짝염기가 함께 있어야 한다는 게 빠진다.", "an": "완충은 약산과 짝염기가 함께 있어야 작동한다.", "rd": "가해진 산·염기를 둘 다 받으려면 약산과 짝염기가 함께 있어야 한다.", "tf": "완충에 필요한 두 가지는? (약산과 짝염기)"}, "CH2-286": {"n": "완충 작용", "c": "ch2", "u": "완충", "t": "C", "dx": "완충 작용이 산을 넣으면 짝염기가, 염기를 넣으면 약산이 중화해 pH를 거의 일정하게 유지하는 것이라는 점을 놓친 경우다. 두 성분의 역할 분담이 약하면 왜 pH가 안 변하는지 설명하지 못한다.", "fx": "완충 작용을 '산을 넣으면 짝염기가, 염기를 넣으면 약산이 중화해 pH를 거의 일정하게 유지'로 못 박는다. 두 성분의 역할 분담으로 왜 pH가 안 변하는지 설명하라.", "f": "B3", "rk": 507, "d": 4, "rh": 1, "pre": ["CH2-285"], "tr": "완충이 어떻게 pH를 지키는지 막막해, 산엔 짝염기가·염기엔 약산이 중화해서라는 게 빠진다.", "an": "산엔 짝염기가, 염기엔 약산이 중화: 양쪽 충격 흡수기다.", "rd": "산이 들어오면 짝염기가, 염기가 들어오면 약산이 받는다. 그래서 pH가 거의 안 변한다.", "tf": "완충에 산을 넣으면 무엇이 받나? (짝염기)"}, "CH2-287": {"n": "헨더슨-하셀바흐", "c": "ch2", "u": "완충", "t": "C", "dx": "헨더슨-하셀바흐 식이 pH = pKₐ + log([짝염기]/[약산])이고 둘이 같으면 log 1 = 0이라 pH = pKₐ가 된다는 점을 놓친 경우다. 이 식이 약하면 완충 용액의 pH를 못 구한다.", "fx": "헨더슨-하셀바흐를 'pH = pKₐ + log([짝염기]/[약산]), 둘이 같으면 log 1 = 0이라 pH = pKₐ'로 못 박는다. 이 식으로 완충 용액의 pH를 구하라.", "f": "D3", "rk": 691, "d": 6, "rh": 0, "pre": ["CH2-285", "CH2-268"], "tr": "식 형태가 헷갈려, pH=pKₐ+log([짝염기]/[약산])이고 둘이 같으면 pH=pKₐ라는 게 빠진다.", "an": "pH=pKa+log([짝염기]/[약산]): 둘이 같으면 pH=pKa다.", "rd": "Ka 식 [H⁺]=Ka[약산]/[짝염기]에 -log를 취하면 pH=pKa+log([짝염기]/[약산])이다.", "tf": "[짝염기]=[약산]이면 pH는? (pKa)"}, "CH2-288": {"n": "공통 이온 효과", "c": "ch2", "u": "완충", "t": "C", "dx": "짝염기(공통 이온)를 더하면 약산의 이온화 평형이 분자 쪽으로 밀려 이온화가 억제된다는 공통 이온 효과를 놓친 경우다. 이 효과가 약하면 완충 용액에서 약산이 왜 덜 이온화하는지 못 짚는다.", "fx": "공통 이온 효과를 '짝염기(공통 이온)를 더하면 약산의 이온화 평형이 분자 쪽으로 밀려 이온화가 억제됨'으로 못 박는다. 이 효과로 완충 용액에서 약산이 왜 덜 이온화하는지 짚어라.", "f": "A1", "rk": 508, "d": 4, "rh": 0, "pre": ["CH2-262", "CH2-253"], "tr": "짝염기를 넣어도 별일 없을 것 같은데, 평형이 분자 쪽으로 밀려 이온화가 억제된다는 게 빠진다.", "an": "짝염기를 넣으면 평형이 분자 쪽으로 밀려 이온화가 억제된다.", "rd": "짝염기를 넣으면 평형이 분자 쪽으로 밀린다. 그래서 이온화가 억제된다.", "tf": "짝염기를 넣으면 이온화는? (억제)"}, "CH2-289": {"n": "염 가수분해", "c": "ch2", "u": "완충", "t": "A", "dx": "약산·약염기에서 온 이온이 물과 반응(가수분해)해 용액이 중성이 아니게 된다는 점을 놓친 경우다(약산의 짝염기는 염기성, 약염기의 짝산은 산성). 가수분해를 놓치면 당량점이 왜 중성이 아닌지 설명하지 못한다.", "fx": "'약산·약염기에서 온 이온이 물과 반응(가수분해)해 용액이 중성이 아님(약산의 짝염기는 염기성, 약염기의 짝산은 산성)'을 못 박는다. 가수분해로 당량점이 왜 중성이 아닌지 설명하라.", "f": "B3", "rk": 353, "d": 3, "rh": 3, "pre": ["CH2-253"], "tr": "염은 다 중성일 것 같아, 약산·약염기에서 온 이온이 물과 반응해 액성이 갈린다는 게 빠진다.", "an": "염도 부모(약산·약염기)를 닮아 액성이 갈린다: 늘 중성이 아니다.", "rd": "약산·약염기에서 온 이온이 물과 반응한다. 그래서 염의 액성이 갈린다.", "tf": "약산에서 온 염은 액성이? (염기성)"}, "CH2-290": {"n": "가수분해 정의", "c": "ch2", "u": "완충-d", "t": "C", "dx": "가수분해가 단순 용해가 아니라 약한 산·염기에서 온 이온이 물과 반응해 H⁺나 OH⁻를 내놓는 것이라는 점을 놓친 경우다. 어떤 이온이 가수분해하는지가 약하면 염 용액의 액성을 못 가린다.", "fx": "가수분해를 '단순 용해가 아니라 약한 산·염기에서 온 이온이 물과 반응해 H⁺나 OH⁻를 내놓는 것'으로 못 박는다. 어떤 이온이 가수분해하는지로 염 용액의 액성을 가려라.", "f": "B2", "rk": 509, "d": 4, "rh": 0, "pre": ["CH2-289"], "tr": "가수분해가 그냥 용해 같아, 약한 산·염기 이온이 물과 반응해 H⁺·OH⁻를 내놓는 것이라는 게 빠진다.", "an": "약한 산·염기 이온이 물과 반응해 H⁺·OH⁻를 내놓는 것이다.", "rd": "약한 산·염기 이온이 물과 반응해 H⁺나 OH⁻를 내놓는 것이다.", "tf": "이온이 물과 반응해 H⁺·OH⁻를 내는 건? (가수분해)"}, "CH2-291": {"n": "완충 응용", "c": "ch2", "u": "완충-d", "t": "C", "dx": "완충 용액이 외부에서 산·염기가 들어와도 pH를 일정하게 유지해 혈액 같은 생체 환경을 지킨다는 응용을 놓친 경우다. 완충과 생체의 연결이 약하면 응용 맥락을 못 짚는다.", "fx": "'완충 용액은 외부에서 산·염기가 들어와도 pH를 일정하게 유지해 혈액 같은 생체 환경을 지킴'을 못 박는다. 완충과 생체의 연결로 응용 맥락을 짚어라.", "f": "B2", "rk": 636, "d": 5, "rh": 0, "pre": ["CH2-286"], "tr": "완충이 교과서 속 개념 같아, 혈액처럼 생체 pH를 지킨다는 응용이 빠진다.", "an": "혈액처럼 생체 pH를 지킨다.", "rd": "완충이 pH 변화를 막는다. 그래서 혈액 등 생체 pH를 지킨다.", "tf": "혈액의 pH를 지키는 건? (완충)"}, "CH2-292": {"n": "pH 측정", "c": "ch2", "u": "완충-d", "t": "C", "dx": "지시약이 수치가 아니라 색 변화로 대략의 pH를 알려준다는 점을 놓친 경우다(정확한 값은 pH 측정기). 측정 방식의 차이가 약하면 지시약으로 정확한 pH를 읽으려는 오류를 범한다.", "fx": "'지시약은 수치가 아니라 색 변화로 대략의 pH를 알려줌(정확한 값은 pH 측정기)'을 못 박는다. 측정 방식의 차이를 잡아 지시약으로 정확한 pH를 읽으려는 오류를 피하라.", "f": "B2", "rk": 354, "d": 3, "rh": 0, "pre": ["CH2-272"], "tr": "지시약이 정확한 수치를 줄 것 같아, 색으로 대략의 pH만 알려준다(정확한 값은 측정기)는 게 빠진다.", "an": "지시약은 색으로 대략의 pH만: 정확한 값은 측정기다.", "rd": "지시약은 색으로 대략을 알린다. 정확한 값은 측정기로 잰다.", "tf": "정확한 pH는 무엇으로? (측정기)"}, "CH2-293": {"n": "강염기 vs 약염기", "c": "ch2", "u": "완충-d", "t": "C", "dx": "같은 농도라도 강염기는 거의 완전히 이온화해 [OH⁻]가 많아 약염기보다 pH가 높다는 점을 놓친 경우다. 이온화 정도 차이가 약하면 두 염기의 pH를 잘못 비교한다.", "fx": "'같은 농도라도 강염기는 거의 완전히 이온화해 [OH⁻]가 많아 약염기보다 pH가 높음'을 못 박는다. 이온화 정도 차이로 두 염기의 pH를 비교하라.", "f": "C1", "rk": 510, "d": 4, "rh": 0, "pre": ["CH2-260", "CH2-261"], "tr": "같은 농도면 pH도 같을 것 같아, 강염기가 [OH⁻]가 많아 pH가 더 높다는 게 빠진다.", "an": "같은 농도면 강염기가 [OH⁻]가 많아 pH가 더 높다.", "rd": "강염기는 [OH⁻]가 많다. 그래서 같은 농도면 pH가 더 높다.", "tf": "같은 농도면 강염기와 약염기 중 pH가 높은 건? (강염기)"}, "CH2-294": {"n": "물의 pH", "c": "ch2", "u": "완충-d", "t": "C", "dx": "순수한 물이 자동 이온화해 [H⁺]=[OH⁻]라 25°C에서 pH가 7이라는 점을 놓친 경우다. 물의 중성 기준이 흐리면 산·염기 판정의 기준점이 사라진다.", "fx": "'순수한 물은 자동 이온화해 [H⁺]=[OH⁻]라 25°C에서 pH 7'임을 못 박는다. 물의 중성 기준을 산·염기 판정의 기준점으로 삼아라.", "f": "B2", "rk": 355, "d": 3, "rh": 0, "pre": ["CH2-269", "CH2-272"], "tr": "순수한 물이 막연해, 자동 이온화로 [H⁺]=[OH⁻]라 pH 7이라는 게 빠진다.", "an": "순수한 물은 자동 이온화로 [H⁺]=[OH⁻]라 pH 7이다.", "rd": "순수한 물은 자동이온화로 [H⁺]=[OH⁻]라 pH 7이다.", "tf": "순수한 물의 pH는? (7)"}, "CH2-295": {"n": "강산 vs 약산", "c": "ch2", "u": "완충-d", "t": "C", "dx": "같은 농도라도 강산은 거의 완전히 이온화해 [H⁺]가 많아 약산보다 pH가 낮다는 점을 놓친 경우다. 이온화 정도 차이가 약하면 두 산의 pH를 잘못 비교한다.", "fx": "'같은 농도라도 강산은 거의 완전히 이온화해 [H⁺]가 많아 약산보다 pH가 낮음'을 못 박는다. 이온화 정도 차이로 두 산의 pH를 비교하라.", "f": "C1", "rk": 511, "d": 4, "rh": 0, "pre": ["CH2-267"], "tr": "같은 농도면 pH도 같을 것 같아, 강산이 [H⁺]가 많아 pH가 더 낮다는 게 빠진다.", "an": "같은 농도면 강산이 [H⁺]가 많아 pH가 더 낮다.", "rd": "강산은 [H⁺]가 많다. 그래서 같은 농도면 pH가 더 낮다.", "tf": "같은 농도면 강산과 약산 중 pH가 낮은 건? (강산)"}, "CH2-358": {"n": "탄소화합물 정의", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "탄소화합물이 탄소를 중심으로 수소 등이 결합한 화합물이고 CO₂·탄산염 같은 무기 탄소 화합물은 제외한다는 점을 놓친 경우다. 이 경계가 흐리면 무엇이 탄소화합물인지 못 가린다.", "fx": "탄소화합물을 '탄소를 중심으로 수소 등이 결합한 화합물, CO₂·탄산염 같은 무기 탄소 화합물은 제외'로 못 박는다. 이 경계로 무엇이 탄소화합물인지 가려라.", "f": "B2", "rk": 21, "d": 0, "rh": 25, "pre": [], "tr": "탄소가 든 건 다 탄소화합물 같아, CO₂·탄산염 같은 무기 탄소는 제외라는 게 흐려진다.", "an": "탄소가 든 유기 화합물: CO₂·탄산염 같은 무기 탄소는 제외한다.", "rd": "탄소가 든 유기 화합물이다. CO₂·탄산염 같은 무기 탄소는 뺀다.", "tf": "CO₂는 유기 화합물인가? (아니다: 무기)"}, "CH2-359": {"n": "탄소의 결합", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "탄소가 원자가 4라 최대 4개 원자와 결합하고 탄소끼리도 이어진다는 점을 놓친 경우다. 결합 손이 4개라는 점이 약하면 탄소 골격의 다양성을 설명하지 못한다.", "fx": "'탄소는 원자가 4라 최대 4개 원자와 결합하고 탄소끼리도 이어짐'을 못 박는다. 결합 손이 4개임을 잡아 탄소 골격의 다양성을 설명하라.", "f": "B2", "rk": 99, "d": 1, "rh": 3, "pre": ["CH2-358"], "tr": "탄소가 몇 개와 결합할지 막연해, 원자가 4라 최대 4개와 결합하고 탄소끼리도 잇는다는 게 빠진다.", "an": "탄소는 원자가 4라 최대 4개와 결합하고 탄소끼리도 잇는다.", "rd": "탄소는 원자가 4라 최대 4개와 결합한다. 탄소끼리도 이어 사슬을 만든다.", "tf": "탄소는 최대 몇 개와 결합? (4)"}, "CH2-360": {"n": "탄소 골격", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "탄소 골격이 사슬·고리, 곧은 사슬·가지 사슬 등 다양한 모양을 이룰 수 있다는 점을 놓친 경우다. 골격 다양성이 약하면 이성질체가 왜 생기는지 못 짚는다.", "fx": "'탄소 골격이 사슬·고리, 곧은 사슬·가지 사슬 등 다양한 모양을 이룸'을 못 박는다. 골격 다양성으로 이성질체가 왜 생기는지 짚어라.", "f": "B2", "rk": 214, "d": 2, "rh": 2, "pre": ["CH2-359"], "tr": "탄소 골격이 곧은 사슬뿐일 것 같아, 사슬·고리·가지로 다양하다는 게 빠진다.", "an": "탄소 골격은 사슬·고리·가지로 다양: 곧은 사슬뿐이 아니다.", "rd": "탄소가 다양하게 이어진다. 그래서 사슬·고리·가지 골격이 된다.", "tf": "탄소 골격은 사슬만 있나? (아니다: 고리·가지도)"}, "CH2-361": {"n": "작용기 정의", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "작용기가 분자의 특징적 성질을 결정하는 원자단이라는 점을 놓친 경우다. 작용기가 성질을 가른다는 점이 약하면 같은 작용기끼리 비슷한 성질을 보이는 까닭을 못 짚는다.", "fx": "작용기를 '분자의 특징적 성질을 결정하는 원자단'으로 못 박는다. 작용기가 성질을 가름을 잡아 같은 작용기끼리 비슷한 ": "C", "dx": "카복실산이 -COOH의 수소를 H⁺로 내놓아 산성을 띠고 극성이라는 점을 놓친 경우다. 산성의 근원이 카복실기라는 점이 약하면 알코올과의 산성 차이를 못 짚는다.", "fx": "'카복실산은 -COOH의 수소를 H⁺로 내놓아 산성을 띠고 극성'임을 못 박는다. 산성의 근원이 카복실기임을 잡아 알코올과의 산성 차이를 짚어라.", "f": "B2", "rk": 365, "d": 3, "rh": 2, "pre": ["CH2-364"], "tr": "카복실산이 왜 산성인지 막연해, -COOH의 수소를 H⁺로 내놓아 산성·극성이라는 게 빠진다.", "an": "-COOH의 수소를 H⁺로 내놓아 산성·극성이다.", "rd": "-COOH의 수소를 H⁺로 내놓는다. 그래서 산성·극성이다.", "tf": "카복실산이 산성인 이유는? (-COOH가 H⁺ 냄)"}, "CH2-367": {"n": "아민", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "아미노기(-NH₂)를 가진 화합물이 아민이고 H⁺를 받아 염기성을 띤다는 점을 놓친 경우다. 작용기 -NH₂가 아민의 정체라는 점이 약하면 그 염기성을 설명하지 못한다.", "fx": "'아미노기(-NH₂)를 가진 화합물이 아민이고 H⁺를 받아 염기성'임을 못 박는다. 작용기 -NH₂가 아민의 정체임을 잡아 그 염기성을 설명하라.", "f": "B2", "rk": 217, "d": 2, "rh": 0, "pre": ["CH2-361"], "tr": "아민이 막연해, 아미노기(-NH₂)를 가져 H⁺를 받아 염기성이라는 게 빠진다.", "an": "아미노기(-NH₂)를 가져 H⁺를 받아 염기성이다.", "rd": "아미노기(-NH₂)가 H⁺를 받는다. 그래서 염기성이다.", "tf": "-NH₂를 가져 염기성인 건? (아민)"}, "CH2-368": {"n": "알데하이드", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "알데하이드기(-CHO)를 가진 화합물이 알데하이드라는 점을 놓친 경우다. 이 작용기가 약하면 알코올 산화로 알데하이드가 생기는 흐름을 못 짚는다.", "fx": "'알데하이드기(-CHO)를 가진 화합물이 알데하이드'임을 못 박는다. 이 작용기를 잡아 알코올 산화로 알데하이드가 생기는 흐름을 짚어라.", "f": "B2", "rk": 218, "d": 2, "rh": 2, "pre": ["CH2-361"], "tr": "알데하이드가 막연해, 알데하이드기(-CHO)를 가진 화합물이라는 게 빠진다.", "an": "알데하이드기(-CHO)를 가진 화합물이다.", "rd": "알데하이드기(-CHO)를 가진 화합물이 알데하이드다.", "tf": "-CHO를 가진 화합물은? (알데하이드)"}, "CH2-369": {"n": "케톤", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "케톤이 카보닐기(C=O)를 두 탄소 사이(분자 가운데)에 가진 화합물이라는 점을 놓친 경우다. 카보닐기의 위치가 약하면 알데하이드와 케톤을 구분하지 못한다.", "fx": "'케톤은 카보닐기(C=O)를 두 탄소 사이(분자 가운데)에 가진 화합물'임을 못 박는다. 카보닐기의 위치로 알데하이드와 케톤을 구분하라.", "f": "B2", "rk": 219, "d": 2, "rh": 1, "pre": ["CH2-361"], "tr": "케톤이 막연해, 카보닐기(C=O)를 두 탄소 사이에 가진 화합물이라는 게 빠진다.", "an": "카보닐기(C=O)를 두 탄소 사이에 가진 화합물이다.", "rd": "카보닐기(C=O)를 두 탄소 사이에 가진 화합물이 케톤이다.", "tf": "C=O를 두 탄소 사이에 가진 건? (케톤)"}, "CH2-370": {"n": "에스터", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "에스터가 카복실산과 알코올이 결합해 생기고 -COO- 결합을 가진 화합물이라는 점을 놓친 경우다. 어디서 오는지가 약하면 에스터화 반응을 설명하지 못한다.", "fx": "'에스터는 카복실산과 알코올이 결합해 생기고 -COO- 결합을 가짐'을 못 박는다. 어디서 오는지를 잡아 에스터화 반응을 설명하라.", "f": "B2", "rk": 366, "d": 3, "rh": 2, "pre": ["CH2-364", "CH2-362"], "tr": "에스터가 막연해, 카복실산과 알코올이 결합해 -COO-를 가진 화합물이라는 게 빠진다.", "an": "카복실산과 알코올이 결합해 -COO-를 가진 화합물이다.", "rd": "카복실산과 알코올이 결합해 -COO-를 가진 화합물이 에스터다.", "tf": "카복실산과 알코올이 결합한 건? (에스터)"}, "CH2-371": {"n": "에스터화", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "에스터화가 카복실산과 알코올이 반응해 에스터와 함께 물이 생기는 반응이라는 점을 놓친 경우다. 물이 함께 생긴다는 점이 약하면 에스터화 반응식을 잘못 쓴다.", "fx": "에스터화를 '카복실산과 알코올이 반응해 에스터와 함께 물이 생기는 반응'으로 못 박는다. 물이 함께 생김을 잡아 에스터화 반응식을 바로 써라.", "f": "B2", "rk": 528, "d": 4, "rh": 0, "pre": ["CH2-370"], "tr": "에스터화가 막연해, 카복실산과 알코올이 반응해 에스터와 물이 생긴다는 게 빠진다.", "an": "카복실산과 알코올이 반응해 에스터와 물이 생긴다.", "rd": "카복실산과 알코올이 반응하면 에스터와 물이 생긴다.", "tf": "카복실산+알코올의 생성물은? (에스터와 물)"}, "CH2-372": {"n": "에스터 성질", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "에스터가 향기가 나고 중성이라는 점을 놓친 경우다(과일 향의 원인). 에스터의 성질이 약하면 카복실산·알코올과 구분하지 못한다.", "fx": "'에스터는 향기가 나고 중성(과일 향의 원인)'임을 못 박는다. 에스터의 성질로 카복실산·알코올과 구분하라.", "f": "B2", "rk": 529, "d": 4, "rh": 0, "pre": ["CH2-370"], "tr": "에스터가 막연해, 향기가 나고 중성이라는(과일 향) 게 빠진다.", "an": "에스터는 향기가 나고 중성: 과일 향이다.", "rd": "에스터는 향기가 나고 중성이다(과일 향).", "tf": "에스터의 특징은? (향기, 중성)"}, "CH2-373": {"n": "알코올 산화", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "알코올이 산화되면 알데하이드를 거쳐 카복실산으로 간다는 점을 놓친 경우다(단계적 산화). 이 산화 순서가 약하면 산화 생성물을 잘못 잡는다.", "fx": "'알코올이 산화되면 알데하이드를 거쳐 카복실산으로 감(단계적 산화)'을 못 박는다. 이 산화 순서로 산화 생성물을 바로 잡아라.", "f": "B2", "rk": 367, "d": 3, "rh": 1, "pre": ["CH2-362", "CH2-368"], "tr": "알코올 산화가 한 번에 갈 것 같아, 알데하이드를 거쳐 카복실산으로 단계적으로 간다는 게 빠진다.", "an": "알코올은 알데하이드를 거쳐 카복실산으로 단계적으로 산화한다.", "rd": "알코올은 단계적으로 산화돼 알데하이드를 거쳐 카복실산이 된다.", "tf": "알코올을 산화하면 무엇을 거쳐? (알데하이드)"}, "CH2-374": {"n": "산화 방향", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "알코올 산화의 방향이 알데하이드를 거쳐 카복실산에서 끝난다는 점을 놓친 경우다. 산화의 끝이 카복실산이라는 점이 약하면 산화·환원 방향을 거꾸로 잡는다.", "fx": "'알코올 산화의 방향이 알데하이드를 거쳐 카복실산에서 끝남'을 못 박는다. 산화의 끝이 카복실산임을 잡아 산화·환원 방향을 거꾸로 잡지 마라.", "f": "A1", "rk": 530, "d": 4, "rh": 0, "pre": ["CH2-373"], "tr": "알코올 산화가 어디서 끝나는지 막연해, 알데하이드를 거쳐 카복실산에서 멈춘다는 게 빠진다.", "an": "알코올 산화는 알데하이드를 거쳐 카복실산에서 멈춘다.", "rd": "알코올 산화는 알데하이드를 거쳐 카복실산에서 멈춘다.", "tf": "알코올 산화는 어디서 멈추나? (카복실산)"}, "CH2-375": {"n": "작용기와 성질", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "작용기가 같으면 탄소 사슬이 달라도 비슷한 화학적 성질을 보인다는 점을 놓친 경우다. 작용기가 성질을 묶는다는 원리가 약하면 화합물을 작용기로 분류하지 못한다.", "fx": "'작용기가 같으면 탄소 사슬이 달라도 비슷한 화학적 성질'임을 못 박는다. 작용기가 성질을 묶음을 잡아 화합물을 작용기로 분류하라.", "f": "B2", "rk": 220, "d": 2, "rh": 1, "pre": ["CH2-361"], "tr": "사슬이 다르면 성질도 다를 것 같아, 작용기가 같으면 비슷한 성질을 보인다는 게 빠진다.", "an": "작용기가 같으면 사슬이 달라도 비슷한 성질이다.", "rd": "작용기가 같으면 사슬이 달라도 비슷한 성질을 보인다.", "tf": "작용기가 같으면 성질은? (비슷)"}, "CH2-376": {"n": "이성질체", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "이성질체가 분자식은 같지만 구조가 달라 성질이 다른 화합물이라는 점을 놓친 경우다. 같은 분자식이라도 구조가 다르면 다른 물질이라는 점이 약하면 이성질체를 같은 물질로 오해한다.", "fx": "이성질체를 '분자식은 같지만 구조가 달라 성질이 다른 화합물'로 못 박는다. 같은 분자식이라도 구조가 다르면 다른 물질임을 잡아 같은 물질로 오해하지 마라.", "f": "B2", "rk": 368, "d": 3, "rh": 0, "pre": ["CH2-360"], "tr": "분자식이 같으면 같은 물질 같아, 구조가 달라 성질이 다른 이성질체라는 게 빠진다.", "an": "분자식이 같아도 구조가 달라 성질이 다른 이성질체다.", "rd": "분자식이 같아도 구조가 다르면 성질이 다르다. 그것이 이성질체다.", "tf": "분자식 같고 구조 다른 건? (이성질체)"}, "CH2-377": {"n": "같은 작용기", "c": "ch2", "u": "탄소화합물", "t": "C", "dx": "같은 작용기를 가진 화합물끼리 특징적인 반응을 공유한다는 점을 놓친 경우다(둘 다 -OH면 알코올의 성질). 이 점이 약하면 작용기로 성질을 예측하지 못한다.", "fx": "'같은 작용기를 가진 화합물끼리 특징적인 반응을 공유함(둘 다 -OH면 알코올의 성질)'을 못 박는다. 이로써 작용기로 성질을 예측하라.", "f": "B2", "rk": 369, "d": 3, "rh": 0, "pre": ["CH2-375"], "tr": "작용기가 같아도 반응이 다를 것 같아, 같은 작용기끼리 특징적 반응을 공유한다는 게 빠진다.", "an": "같은 작용기끼리 특징적 반응을 공유한다.", "rd": "같은 작용기끼리 특징적 반응을 공유한다.", "tf": "같은 작용기끼리 무엇을 공유? (특징적 반응)"}, "CH2-378": {"n": "카복실산 반응", "c": "ch2", "u": "탄소화합물-d", "t": "C", "dx": "카복실산이 산이라 금속과 반응해 수소 기체를 내놓는다는 점을 놓친 경우다. 카복실산이 산으로 행동한다는 점이 약하면 그 반응을 예측하지 못한다.", "fx": "'카복실산은 산이라 금속과 반응해 수소 기체를 내놓음'을 못 박는다. 카복실산이 산으로 행동함을 잡아 그 반응을 예측하라.", "f": "B2", "rk": 531, "d": 4, "rh": 0, "pre": ["CH2-366"], "tr": "카복실산이 금속과 반응 안 할 것 같아, 산이라 금속과 반응해 수소 기체를 낸다는 게 빠진다.", "an": "산이라 금속과 반응해 수소 기체를 낸다.", "rd": "카복실산은 산이라 금속과 반응해 수소 기체를 낸다.", "tf": "카복실산이 금속과 반응하면? (수소 기체)"}, "CH2-379": {"n": "에터", "c": "ch2", "u": "탄소화합물-d", "t": "C", "dx": "에터가 산소가 두 탄소 사이에 낀(C-O-C) 구조라는 점을 놓친 경우다. 산소의 위치가 약하면 에터를 알코올 등과 구분하지 못한다.", "fx": "에터를 '산소가 두 탄소 사이에 낀(C-O-C) 구조'로 못 박는다. 산소의 위치로 에터를 알코올 등과 구분하라.", "f": "B2", "rk": 221, "d": 2, "rh": 0, "pre": ["CH2-361"], "tr": "에터가 막연해, 산소가 두 탄소 사이에 낀(C-O-C) 구조라는 게 빠진다.", "an": "산소가 두 탄소 사이에 낀(C-O-C) 구조다.", "rd": "산소가 두 탄소 사이에 낀(C-O-C) 구조가 에터다.", "tf": "C-O-C 구조를 가진 건? (에터)"}, "CH2-380": {"n": "알코올 수소 결합", "c": "ch2", "u": "탄소화합물-d", "t": "C", "dx": "알코올이 -OH 때문에 분자끼리 수소 결합을 해 끓는점이 높다는 점을 놓친 경우다. -OH와 수소 결합의 연결이 약하면 알코올이 비슷한 탄화수소보다 끓는점이 높은 까닭을 못 짚는다.", "fx": "'알코올은 -OH 때문에 분자끼리 수소 결합을 해 끓는점이 높음'을 못 박는다. -OH와 수소 결합의 연결로 알코올이 비슷한 탄화수소보다 끓는점이 높은 까닭을 짚어라.", "f": "B3", "rk": 370, "d": 3, "rh": 0, "pre": ["CH2-362", "CH2-014"], "tr": "알코올 끓는점이 그냥 보통일 것 같아, -OH 수소 결합으로 높다는 게 빠진다.", "an": "-OH 수소 결합으로 끓는점이 높다.", "rd": "-OH가 수소 결합을 한다. 그래서 끓는점이 높다.", "tf": "알코올의 끓는점이 높은 이유는? (수소 결합)"}, "CH2-381": {"n": "끓는점 경향", "c": "ch2", "u": "탄소화합물-d", "t": "C", "dx": "같은 계열에서 탄소 수가 많아 분자가 클수록 분산력이 커져 끓는점이 높아진다는 점을 놓친 경우다. 이 경향이 약하면 탄화수소의 끓는점 순서를 못 잡는다.", "fx": "'같은 계열에서 탄소 수가 많아 분자가 클수록 분산력이 커져 끓는점이 높아짐'을 못 박는다. 이 경향으로 탄화수소의 끓는점 순서를 잡아라.", "f": "B3", "rk": 532, "d": 4, "rh": 0, "pre": ["CH2-360", "CH2-008"], "tr": "탄소 수가 끓는점과 무관할 것 같아, 클수록 분산력이 커져 높아진다는 게 빠진다.", "an": "탄소 수가 클수록 분산력이 커져 끓는점이 높다.", "rd": "탄소 수가 클수록 전자가 많아 분산력이 크다. 그래서 끓는점이 높다.", "tf": "탄소 수가 크면 끓는점은? (높음: 분산력)"}, "CH2-382": {"n": "케톤 예", "c": "ch2", "u": "탄소화합물-d", "t": "C", "dx": "아세톤처럼 카보닐기를 분자 가운데 가진 화합물이 케톤이라는 점을 놓친 경우다. 예를 알데하이드와 혼동하면 분류가 어긋난다.", "fx": "'아세톤처럼 카보닐기를 분자 가운데 가진 화합물이 케톤'임을 못 박는다. 예를 알데하이드와 혼동하지 말고 분류하라.", "f": "B2", "rk": 371, "d": 3, "rh": 0, "pre": ["CH2-369"], "tr": "어떤 게 케톤인지 막연해, 아세톤이 카보닐기를 분자 가운데 가진다는 게 빠진다.", "an": "아세톤이 카보닐기를 분자 가운데 가진다.", "rd": "아세톤이 카보닐기를 분자 가운데 가진다.", "tf": "아세톤의 작용기는? (카보닐기 C=O)"}, "CH2-383": {"n": "산성 비교", "c": "ch2", "u": "탄소화합물-d", "t": "C", "dx": "카복실산은 카복실기가 H⁺를 잘 내놓아 산성인 반면 알코올은 -OH의 수소를 거의 내놓지 않아 중성에 가깝다는 점을 놓친 경우다. 둘 다 산소-수소 결합이 있어도 산성이 갈린다는 점이 약하면 산성 비교가 어긋난다.", "fx": "'카복실산은 카복실기가 H⁺를 잘 내놓아 산성, 알코올은 -OH의 수소를 거의 내놓지 않아 중성에 가까움'을 못 박는다. 둘 다 산소-수소 결합이 있어도 산성이 갈림을 잡아 산성을 비교하라.", "f": "B2", "rk": 533, "d": 4, "rh": 0, "pre": ["CH2-366", "CH2-362"], "tr": "알코올도 -OH라 산성일 것 같아, 카복실산만 H⁺를 잘 내고 알코올은 거의 안 내 중성에 가깝다는 게 빠진다.", "an": "카복실산만 H⁺를 잘 내고 알코올은 거의 안 내 중성에 가깝다: 둘 다 -OH라도 다르다.", "rd": "카복실산만 안정한 짝염기로 H⁺를 잘 낸다. 알코올은 거의 안 내 중성에 가깝다.", "tf": "카복실산과 알코올 중 산성이 강한 건? (카복실산)"}, "CH2-136": {"n": "총괄성 정의", "c": "ch2", "u": "총괄성", "t": "A", "dx": "총괄성이 용질의 종류·질량·크기와 무관하게 오직 녹아 있는 입자 수에만 의존하는 성질이라는 점을 놓친 경우다. 이 핵심이 흔들리면 증기압 내림·끓는점 오름·어는점 내림을 한 원리로 꿰지 못한다.", "fx": "총괄성을 '용질의 종류·질량·크기와 무관하게 오직 녹아 있는 입자 수에만 의존하는 성질'로 못 박는다. 이 핵심으로 증기압 내림·끓는점 오름·어는점 내림을 한 원리로 꿰어라.", "f": "A3", "rk": 185, "d": 2, "rh": 35, "pre": ["CH2-129"], "tr": "총괄성이 용질 종류에 달렸을 것 같아, 오직 입자 수에만 의존한다는 게 빠진다.", "an": "총괄성은 머릿수 정치: 용질 종류가 아니라 입자 수만 따진다.", "rd": "용질 입자가 용매 거동을 방해하는 효과다. 방해는 입자 수에 달려 종류와 무관하다.", "tf": "총괄성은 용질 종류와 입자 수 중 무엇에 의존? (입자 수)"}, "CH2-137": {"n": "증기압 내림", "c": "ch2", "u": "총괄성", "t": "B", "dx": "비휘발성 용질을 녹이면 용매가 증발할 자리를 차지해 용액의 증기압이 순용매보다 낮아진다는 점을 놓친 경우다. 증기압 내림이 약하면 그 결과인 끓는점 오름으로 이어지지 못한다.", "fx": "'비휘발성 용질을 녹이면 용매가 증발할 자리를 차지해 용액의 증기압이 순용매보다 낮아짐'을 못 박는다. 증기압 내림을 그 결과인 끓는점 오름으로 이어라.", "f": "B3", "rk": 314, "d": 3, "rh": 5, "pre": ["CH2-136", "CH2-070"], "tr": "용질을 녹여도 증기압이 그대로일 것 같아, 용매가 증발할 자리를 용질이 차지해 낮아진다는 게 빠진다.", "an": "표면에 용질이 끼면 용매가 나갈 자리가 줄어 증기압이 준다.", "rd": "표면 일부를 용질이 차지하면 용매가 증발할 자리가 준다. 그래서 증기압이 내린다.", "tf": "용질이 녹으면 증기압은? (내림)"}, "CH2-138": {"n": "라울 법칙", "c": "ch2", "u": "총괄성", "t": "C", "dx": "용액의 증기압이 (순용매 증기압 × 용매 몰분율)이라는 라울 법칙을 놓친 경우다. 용매 몰분율이 1보다 작아 증기압이 내려간다는 점이 약하면 증기압을 정량적으로 못 구한다.", "fx": "라울 법칙을 '용액의 증기압 = 순용매 증기압 × 용매 몰분율'로 못 박는다. 용매 몰분율이 1보다 작아 증기압이 내려감을 잡아 정량 계산하라.", "f": "A2", "rk": 471, "d": 4, "rh": 0, "pre": ["CH2-137", "CH2-113"], "tr": "증기압이 얼마나 줄지 막연해, (순용매 증기압×용매 몰분율)이라는 게 빠진다.", "an": "증기압=순용매 증기압×용매 몰분율이다.", "rd": "증발은 표면 용매가 한다. 그래서 증기압=순용매 증기압×용매 몰분율이다.", "tf": "증기압=순용매 증기압 곱하기 무엇? (용매 몰분율)"}, "CH2-139": {"n": "끓는점 오름", "c": "ch2", "u": "총괄성", "t": "C", "dx": "끓는점 오름이 증기압 내림 때문에 일어나고 그 크기가 몰랄 농도에 비례(식에 m이 들어감)한다는 점을 놓친 경우다. 농도와의 비례가 약하면 끓는점 오름을 계산하지 못한다.", "fx": "끓는점 오름을 '증기압 내림 때문에 일어나고 크기가 몰랄 농도에 비례'로 못 박는다. 농도와의 비례로 끓는점 오름을 계산하라.", "f": "A2", "rk": 472, "d": 4, "rh": 3, "pre": ["CH2-137", "CH2-112"], "tr": "끓는점이 왜 오르는지 막막해, 증기압 내림 때문이고 몰랄 농도에 비례한다는 게 빠진다.", "an": "증기압이 줄어 끓이기 더 어렵다: 몰랄 농도에 비례한다.", "rd": "증기압이 내렸으니 외부 압력에 닿으려면 더 데워야 한다. 그래서 끓는점이 몰랄에 비례해 오른다.", "tf": "용질이 녹으면 끓는점은? (오름)"}, "CH2-140": {"n": "어는점 내림", "c": "ch2", "u": "총괄성", "t": "A", "dx": "어는점 내림이 용질 입자 수(몰랄 농도)에 비례해 일어나는 총괄성이고 용질 종류와 무관하다는 점을 놓친 경우다. 농도 비례가 약하면 제설제·부동액 같은 응용과 어는점 내림 계산을 못 잡는다.", "fx": "어는점 내림을 '용질 입자 수(몰랄 농도)에 비례해 일어나는 총괄성, 용질 종류 무관'으로 못 박는다. 농도 비례로 제설제·부동액 응용과 계산을 잡아라.", "f": "A2", "rk": 315, "d": 3, "rh": 4, "pre": ["CH2-136", "CH2-112"], "tr": "어는점 내림이 용질 종류에 달렸을 것 같아, 입자 수(몰랄)에만 비례하는 총괄성이라는 게 빠진다.", "an": "입자 수(몰랄)에만 비례하는 총괄성이다.", "rd": "용질이 결정 형성을 방해한다. 그래서 더 식혀야 얼어 입자 수(몰랄)에 비례해 내린다.", "tf": "어는점 내림은 무엇에 비례? (몰랄/입자 수)"}, "CH2-141": {"n": "몰랄 오름 상수", "c": "ch2", "u": "총괄성", "t": "C", "dx": "끓는점 오름·어는점 내림의 비례 상수가 용매마다 정해진 고유 값이고 농도와 무관하다는 점을 놓친 경우다. 상수의 성격이 약하면 용매가 바뀔 때 계산이 어긋난다.", "fx": "'끓는점 오름·어는점 내림의 비례 상수는 용매마다 정해진 고유 값이고 농도와 무관'함을 못 박는다. 상수가 용매에 달림을 잡아 용매가 바뀔 때 계산을 맞춰라.", "f": "A3", "rk": 618, "d": 5, "rh": 1, "pre": ["CH2-139", "CH2-140"], "tr": "비례 상수가 용질에 따를 것 같아, 용매마다 정해진 고유값(농도 무관)이라는 게 빠진다.", "an": "비례 상수는 용매마다 정해진 고유값(농도 무관)이다.", "rd": "상수는 용매 성질로만 정해진다. 그래서 용질·농도와 무관한 고유값이다.", "tf": "오름 상수는 용질에 따라 변하나? (안 변함)"}, "CH2-142": {"n": "전해질", "c": "ch2", "u": "총괄성", "t": "C", "dx": "전해질이 물에서 이온으로 나뉘어 화학식 단위보다 입자 수가 늘어난다는 점을 놓친 경우다(NaCl 1몰이 이온 2몰로). 이온화로 입자가 는다는 점이 약하면 전해질 총괄성을 과소평가한다.", "fx": "'전해질은 물에서 이온으로 나뉘어 화학식 단위보다 입자 수가 늘어남(NaCl 1몰이 이온 2몰로)'을 못 박는다. 이온화로 입자가 늚을 잡아 전해질 총괄성을 과소평가 마라.", "f": "B2", "rk": 316, "d": 3, "rh": 6, "pre": ["CH2-136"], "tr": "전해질 1몰이 입자 1몰일 것 같아, 이온으로 나뉘어 입자 수가 는다(NaCl→2몰)는 게 빠진다.", "an": "소금 1 알이 물에서 2조각(Na⁺·Cl⁻): 입자 수가 는다.", "rd": "전해질은 물에서 이온으로 쪼개진다. 그래서 입자 수가 는다.", "tf": "소금 1알은 물에서 몇 조각? (2)"}, "CH2-143": {"n": "반트호프 인자", "c": "ch2", "u": "총괄성", "t": "B", "dx": "반트호프 인자 i가 화학식 단위 하나가 내놓는 입자 수라는 점을 놓친 경우다(NaCl은 약 2, 비전해질은 1). i를 모르면 전해질의 총괄성 크기를 잘못 잡는다.", "fx": "반트호프 인자 i를 '화학식 단위 하나가 내놓는 입자 수(NaCl은 약 2, 비전해질은 1)'로 못 박는다. i를 잡아 전해질의 총괄성 크기를 맞춰라.", "f": "D3", "rk": 473, "d": 4, "rh": 5, "pre": ["CH2-142"], "tr": "i가 알 수 없는 보정 같아, 화학식 단위 하나가 내놓는 입자 수(NaCl 약 2)라는 게 빠진다.", "an": "i는 화학식 단위 하나가 내놓는 입자 수: 소금은 약 2다.", "rd": "용질 한 단위가 내놓는 입자 수가 i다. 소금은 약 2다.", "tf": "NaCl의 i는 대략? (2)"}, "CH2-144": {"n": "전해질 총괄성", "c": "ch2", "u": "총괄성", "t": "C", "dx": "전해질이 이온화로 입자 수가 늘어 같은 몰랄 농도라도 총괄성이 더 크게 나타난다는 점을 놓친 경우다. 입자 수 증가가 약하면 전해질과 비전해질의 총괄성 차이를 못 짚는다.", "fx": "'전해질은 이온화로 입자 수가 늘어 같은 몰랄 농도라도 총괄성이 더 크게 나타남'을 못 박는다. 입자 수 증가로 전해질과 비전해질의 총괄성 차이를 짚어라.", "f": "B3", "rk": 619, "d": 5, "rh": 1, "pre": ["CH2-143"], "tr": "같은 몰랄이면 총괄성도 같을 것 같아, 전해질은 이온화로 입자가 늘어 더 크다는 게 빠진다.", "an": "같은 몰랄이라도 전해질은 입자가 많아 총괄성이 크다.", "rd": "전해질은 이온화로 입자가 많다. 그래서 같은 몰랄이라도 총괄성이 크다.", "tf": "같은 몰랄에서 전해질의 총괄성은? (큼)"}, "CH2-145": {"n": "전해질 계산", "c": "ch2", "u": "총괄성", "t": "C", "dx": "전해질의 총괄성을 계산할 때 반트호프 인자 i를 곱해 늘어난 입자 수를 반영해야 한다는 점을 놓친 경우다. i를 빼먹으면 전해질의 끓는점 오름·어는점 내림이 과소평가된다.", "fx": "'전해질의 총괄성은 반트호프 인자 i를 곱해 늘어난 입자 수를 반영'함을 못 박는다. i를 빼먹지 말고 끓는점 오름·어는점 내림을 계산하라.", "f": "D3", "rk": 620, "d": 5, "rh": 0, "pre": ["CH2-143"], "tr": "전해질 총괄성을 그냥 계산할 것 같아, i를 곱해 늘어난 입자 수를 반영해야 한다는 게 빠진다.", "an": "i를 곱해 늘어난 입자 수를 반영한다.", "rd": "늘어난 입자 수를 반영하려 i를 곱한다.", "tf": "전해질 총괄성에 무엇을 곱하나? (i)"}, "CH2-146": {"n": "전해질 비교", "c": "ch2", "u": "총괄성", "t": "C", "dx": "같은 몰랄 농도라도 내놓는 입자 수가 많은 전해질일수록 총괄성이 크다는 점을 놓친 경우다(NaCl이 포도당보다 큼). 입자 수로 비교하지 못하면 총괄성 순서가 어긋난다.", "fx": "'같은 몰랄 농도라도 내놓는 입자 수가 많은 전해질일수록 총괄성이 큼(NaCl이 포도당보다 큼)'을 못 박는다. 입자 수로 총괄성 순서를 잡아라.", "f": "C1", "rk": 684, "d": 6, "rh": 0, "pre": ["CH2-144"], "tr": "같은 몰랄이면 다 같을 것 같아, 내놓는 입자가 많은 전해질일수록 총괄성이 크다는 게 빠진다.", "an": "내놓는 입자가 많은 전해질일수록 총괄성이 크다.", "rd": "내놓는 입자가 많을수록 총괄성이 크다.", "tf": "입자를 많이 내는 전해질의 총괄성은? (큼)"}, "CH2-147": {"n": "응용", "c": "ch2", "u": "총괄성", "t": "C", "dx": "어는점 내림을 도로 제설제·자동차 부동액에 이용한다는 응용을 놓친 경우다. 총괄성과 실생활의 연결이 약하면 응용 문제를 못 잡는다.", "fx": "'어는점 내림을 도로 제설제·자동차 부동액에 이용'함을 못 박는다. 총괄성과 실생활의 연결로 응용 문제를 잡아라.", "f": "B2", "rk": 474, "d": 4, "rh": 0, "pre": ["CH2-140"], "tr": "어는점 내림이 교과서 속 개념 같아, 제설제·부동액에 쓰인다는 응용이 빠진다.", "an": "어는점 내림은 제설제·부동액에 쓰인다.", "rd": "어는점 내림으로 더 식혀야 언다. 그래서 제설제·부동액에 쓰인다.", "tf": "어는점 내림을 쓰는 예는? (제설제)"}, "CH2-148": {"n": "총괄성 관계", "c": "ch2", "u": "총괄성", "t": "C", "dx": "증기압 내림·끓는점 오름·어는점 내림·삼투압이 모두 같은 입자 수에 따라 함께 변한다는 점을 놓친 경우다. 네 성질이 한 원인(입자 수)에서 나온다는 점이 약하면 총괄성을 따로따로 외우게 된다.", "fx": "'증기압 내림·끓는점 오름·어는점 내림·삼투압이 모두 같은 입자 수에 따라 함께 변함'을 못 박는다. 네 성질이 한 원인(입자 수)에서 나옴을 잡아 따로따로 외우지 마라.", "f": "B2", "rk": 621, "d": 5, "rh": 0, "pre": ["CH2-137", "CH2-139", "CH2-140"], "tr": "네 총괄성이 따로 놀 것 같아, 같은 입자 수에 따라 함께 변한다는 게 빠진다.", "an": "네 총괄성이 같은 입자 수에 따라 함께 변한다.", "rd": "네 총괄성이 모두 입자 수에 비례한다. 그래서 함께 변한다.", "tf": "네 총괄성은 무엇에 따라 함께 변하나? (입자 수)"}, "CH2-149": {"n": "총괄성 크기", "c": "ch2", "u": "총괄성", "t": "C", "dx": "총괄성의 크기가 녹아 있는 입자 수에 비례한다는 점을 놓친 경우다. 입자 수가 많을수록 효과가 크다는 비례가 약하면 총괄성 크기 비교가 어긋난다.", "fx": "'총괄성의 크기는 녹아 있는 입자 수에 비례'함을 못 박는다. 입자 수가 많을수록 효과가 큼을 잡아 총괄성 크기를 비교하라.", "f": "A3", "rk": 317, "d": 3, "rh": 0, "pre": ["CH2-136"], "tr": "총괄성 크기가 막연해, 녹은 입자 수에 비례한다는 게 빠진다.", "an": "녹은 입자 수에 비례한다.", "rd": "녹은 입자 수에 비례한다.", "tf": "총괄성은 무엇에 비례? (입자 수)"}, "CH2-150": {"n": "비전해질 비교", "c": "ch2", "u": "총괄성", "t": "C", "dx": "둘 다 비전해질이면 같은 몰랄 농도에서 내놓는 입자 수가 같아 총괄성이 같다는 점을 놓친 경우다. 비전해질은 종류와 무관하게 입자 수가 같다는 점이 약하면 총괄성을 잘못 비교한다.", "fx": "'둘 다 비전해질이면 같은 몰랄 농도에서 내놓는 입자 수가 같아 총괄성이 같음'을 못 박는다. 비전해질은 종류 무관하게 입자 수가 같음을 잡아 비교하라.", "f": "C1", "rk": 318, "d": 3, "rh": 0, "pre": ["CH2-136"], "tr": "비전해질도 종류 따라 다를 것 같아, 같은 몰랄이면 입자 수가 같아 총괄성도 같다는 게 빠진다.", "an": "비전해질은 같은 몰랄이면 입자 수가 같아 총괄성도 같다.", "rd": "비전해질은 안 쪼개진다. 그래서 같은 몰랄이면 입자 수가 같아 총괄성도 같다.", "tf": "같은 몰랄 비전해질끼리 총괄성은? (같음)"}, "CH2-151": {"n": "몰랄 상수", "c": "ch2", "u": "총괄성", "t": "C", "dx": "몰랄 오름·내림 상수가 용매마다 고유하게 정해진 값이라는 점을 놓친 경우다. 용매가 정하는 상수라는 점이 약하면 다른 용매로 바뀔 때 총괄성 계산이 어긋난다.", "fx": "'몰랄 오름·내림 상수는 용매마다 고유하게 정해진 값'임을 못 박는다. 용매가 정하는 상수임을 잡아 다른 용매로 바뀔 때 계산을 맞춰라.", "f": "A3", "rk": 685, "d": 6, "rh": 0, "pre": ["CH2-141"], "tr": "몰랄 상수가 막연해, 용매마다 고유하게 정해진 값이라는 게 빠진다.", "an": "몰랄 상수는 용매마다 고유한 값이다.", "rd": "몰랄 상수는 용매마다 고유한 값이다.", "tf": "몰랄 상수는 무엇마다 고유? (용매)"}, "CH2-112": {"n": "몰랄 농도 정의", "c": "ch2", "u": "농도", "t": "A", "dx": "몰랄 농도가 용매 질량(kg)당 용질 몰수라는 정의를 놓친 경우다(용액 부피나 용액 질량이 아님). 분모가 용매 질량이라는 점이 약하면 총괄성 계산에서 농도를 잘못 잡는다.", "fx": "몰랄 농도를 '용매 질량(kg)당 용질 몰수'로 못 박는다(용액 부피·질량이 아님). 분모가 용매 질량임을 잡아 총괄성 계산에 써라.", "f": "D3", "rk": 10, "d": 0, "rh": 12, "pre": [], "tr": "몰랄이 용액 부피로 나눈 것 같아, 용매 질량(kg)당 용질 몰수라는 게 흔들린다.", "an": "몰랄=용매 질량(kg)당 용질 몰수: 분모가 용매 무게다.", "rd": "온도에 안 변하는 기준이 필요해 용매 질량(kg)당 용질 몰수로 정의한다.", "tf": "몰랄의 분모는? (용매 질량 kg)"}, "CH2-113": {"n": "몰분율 정의", "c": "ch2", "u": "농도", "t": "C", "dx": "몰분율이 한 성분의 몰수를 전체 몰수로 나눈 비라는 정의를 놓친 경우다. 몰수 기준이라는 점이 약하면 라울 법칙(용매 몰분율) 적용이 막힌다.", "fx": "몰분율을 '한 성분의 몰수를 전체 몰수로 나눈 비'로 못 박는다. 몰수 기준임을 잡아 라울 법칙(용매 몰분율) 적용에 써라.", "f": "D3", "rk": 11, "d": 0, "rh": 4, "pre": [], "tr": "몰분율이 막연해, 한 성분 몰수를 전체 몰수로 나눈 비라는 게 빠진다.", "an": "몰분율=한 성분 몰수÷전체 몰수다.", "rd": "한 성분 몰수를 전체 몰수로 나눈 비가 몰분율이다.", "tf": "한 성분 몰수÷전체 몰수는? (몰분율)"}, "CH2-114": {"n": "퍼센트 농도 정의", "c": "ch2", "u": "농도", "t": "C", "dx": "퍼센트 농도가 용액 질량에 대한 용질 질량의 백분율이라는 정의를 놓친 경우다. 분모가 용액 질량이라는 점이 약하면 다른 농도로의 환산이 어긋난다.", "fx": "퍼센트 농도를 '용액 질량에 대한 용질 질량의 백분율'로 못 박는다. 분모가 용액 질량임을 잡아 다른 농도로의 환산을 맞춰라.", "f": "D3", "rk": 12, "d": 0, "rh": 4, "pre": [], "tr": "퍼센트 분모가 용매일 것 같아, 용액 질량에 대한 용질의 백분율이라는 게 흔들린다.", "an": "퍼센트=용액 질량에 대한 용질의 백분율: 분모는 용액이다.", "rd": "용액 전체에서 용질이 차지하는 질량 비율이다.", "tf": "퍼센트 농도의 분모는? (용액 질량)"}, "CH2-115": {"n": "몰농도 정의", "c": "ch2", "u": "농도", "t": "C", "dx": "몰농도가 용액 부피(L)당 용질 몰수라는 정의를 놓친 경우다. 부피 기준이라는 점이 약하면 온도에 따라 값이 변하는 성질과 환산이 흔들린다.", "fx": "몰농도를 '용액 부피(L)당 용질 몰수'로 못 박는다. 부피 기준임을 잡아 온도에 따라 값이 변하는 성질과 환산을 따져라.", "f": "D3", "rk": 13, "d": 0, "rh": 14, "pre": [], "tr": "몰농도가 용매로 나눈 것 같아, 용액 부피(L)당 용질 몰수라는 게 흔들린다.", "an": "몰농도=용액 부피(L)당 용질 몰수: 분모가 용액 부피다.", "rd": "부피로 재기 쉬워 용액 부피(L)당 용질 몰수로 정의한다.", "tf": "몰농도의 분모는? (용액 부피 L)"}, "CH2-116": {"n": "몰랄 농도 온도", "c": "ch2", "u": "농도", "t": "C", "dx": "몰랄 농도가 질량 기준이라 온도가 변해도 값이 변하지 않는다는 점을 놓친 경우다. 온도 무관이라는 점이 약하면 총괄성 식에 왜 몰농도가 아닌 몰랄 농도를 쓰는지 못 짚는다.", "fx": "'몰랄 농도는 질량 기준이라 온도가 변해도 값이 변하지 않음'을 못 박는다. 온도 무관임을 잡아 총괄성 식에 몰농도가 아닌 몰랄 농도를 쓰는 까닭을 짚어라.", "f": "A3", "rk": 67, "d": 1, "rh": 1, "pre": ["CH2-112"], "tr": "몰랄이 온도 따라 변할 것 같아, 질량 기준이라 온도와 무관하다는 게 빠진다.", "an": "몰랄은 질량 기준이라 온도와 무관하다.", "rd": "몰랄은 질량 기준이다. 질량은 온도에 안 변해 무관하다.", "tf": "몰랄은 온도에 변하나? (안 변함: 질량 기준)"}, "CH2-117": {"n": "몰농도 온도", "c": "ch2", "u": "농도", "t": "A", "dx": "몰농도가 부피 기준이라 온도가 오르면 부피가 늘어(분모가 커져) 값이 작아진다는 점을 놓친 경우다. 온도 의존이 약하면 온도가 다른 조건에서 몰농도를 그대로 쓰는 오류를 범한다.", "fx": "'몰농도는 부피 기준이라 온도가 오르면 부피가 늘어(분모가 커져) 값이 작아짐'을 못 박는다. 온도가 다른 조건에서 몰농도를 그대로 쓰지 마라.", "f": "A3", "rk": 68, "d": 1, "rh": 1, "pre": ["CH2-115"], "tr": "몰농도가 온도와 무관할 것 같아, 부피 기준이라 온도 오르면 작아진다는 게 빠진다.", "an": "몰농도는 부피 기준이라 온도 오르면 작아진다.", "rd": "몰농도는 부피 기준이다. 온도가 오르면 부피가 늘어 작아진다.", "tf": "몰농도는 온도가 오르면? (작아짐)"}, "CH2-118": {"n": "농도 근사", "c": "ch2", "u": "농도", "t": "A", "dx": "묽은 수용액에서 용질이 적어 부피(L)와 질량(kg)이 거의 같을 때만 몰농도와 몰랄 농도가 근사적으로 같다는 점을 놓친 경우다. 이 근사가 용질이 많으면 깨진다는 한계가 약하면 진한 용액에서 잘못 쓴다.", "fx": "'묽은 수용액에서 용질이 적어 부피(L)와 질량(kg)이 거의 같을 때만 몰농도와 몰랄 농도가 근사적으로 같음'을 못 박는다. 진한 용액에선 이 근사가 깨짐을 잡아라.", "f": "D2", "rk": 69, "d": 1, "rh": 0, "pre": ["CH2-112", "CH2-115"], "tr": "몰농도와 몰랄이 늘 같을 것 같아, 묽은 수용액서 부피(L)≈질량(kg)일 때만 근사된다는 게 빠진다.", "an": "묽은 수용액에서 부피(L)≈질량(kg)일 때만 몰농도와 몰랄이 근사한다.", "rd": "묽은 수용액은 부피(L)≈질량(kg)이다. 그때만 몰농도와 몰랄이 근사한다.", "tf": "몰농도와 몰랄이 근사한 경우는? (묽은 수용액)"}, "CH2-119": {"n": "몰분율 합", "c": "ch2", "u": "농도", "t": "C", "dx": "모든 성분의 몰분율을 더하면 1이 된다는(백분율이 아님) 점을 놓친 경우다. 합이 1이라는 점이 약하면 한 성분 몰분율에서 나머지를 구하지 못한다.", "fx": "'모든 성분의 몰분율을 더하면 1(백분율 아님)'임을 못 박는다. 합이 1임을 잡아 한 성분에서 나머지 몰분율을 구하라.", "f": "D3", "rk": 70, "d": 1, "rh": 0, "pre": ["CH2-113"], "tr": "몰분율 합이 100일 것 같아, 비율이라 합이 1이라는 게 빠진다.", "an": "몰분율은 비율이라 합이 1이다.", "rd": "몰분율은 전체에 대한 비라 다 더하면 1이다.", "tf": "몰분율의 합은? (1)"}, "CH2-120": {"n": "몰분율 단위", "c": "ch2", "u": "농도", "t": "B", "dx": "몰분율이 몰수의 비라 단위가 없는 값이라는 점을 놓친 경우다. 무차원이라는 점이 약하면 몰분율을 다른 농도 단위와 섞어 쓴다.", "fx": "몰분율을 '몰수의 비라 단위가 없는 값'으로 못 박는다. 무차원임을 잡아 다른 농도 단위와 섞어 쓰지 마라.", "f": "D3", "rk": 71, "d": 1, "rh": 0, "pre": ["CH2-113"], "tr": "몰분율에 단위가 붙을 것 같아, 몰수의 비라 단위가 없다는 게 빠진다.", "an": "몰분율은 몰수의 비라 단위가 없다.", "rd": "몰수의 비라 단위가 없다.", "tf": "몰분율의 단위는? (없음)"}, "CH2-121": {"n": "퍼센트 농도 온도", "c": "ch2", "u": "농도", "t": "C", "dx": "퍼센트 농도가 질량 기준이라 온도에 무관하다는 점을 놓친 경우다. 몰농도와 달리 온도로 안 변한다는 대비가 약하면 농도 비교를 잘못한다.", "fx": "'퍼센트 농도는 질량 기준이라 온도에 무관'함을 못 박는다. 몰농도와 달리 온도로 안 변함을 대비해 농도 비교에 써라.", "f": "A3", "rk": 72, "d": 1, "rh": 1, "pre": ["CH2-114"], "tr": "퍼센트가 온도 따라 변할 것 같아, 질량 기준이라 무관하다는 게 빠진다.", "an": "퍼센트는 질량 기준이라 온도에 무관하다.", "rd": "퍼센트는 질량 기준이라 온도에 무관하다.", "tf": "퍼센트 농도는 온도에 변하나? (안 변함)"}, "CH2-122": {"n": "용액 구성", "c": "ch2", "u": "농도", "t": "C", "dx": "용액이 용매에 용질이 녹아 고르게 섞인 혼합물이라는 점을 놓친 경우다. 용매·용질 구성이 흐리면 농도의 분자·분모를 잘못 잡는다.", "fx": "용액을 '용매에 용질이 녹아 고르게 섞인 혼합물'로 못 박는다. 용매·용질 구성을 잡아 농도의 분자·분모를 맞춰라.", "f": "B2", "rk": 14, "d": 0, "rh": 59, "pre": [], "tr": "용액이 막연해, 용매에 용질이 녹아 고르게 섞인 혼합물이라는 게 빠진다.", "an": "용매에 용질이 녹아 고르게 섞인 혼합물이다.", "rd": "용매에 용질이 녹아 고르게 섞인 혼합물이다.", "tf": "용질이 용매에 섞인 것은? (용액)"}, "CH2-123": {"n": "용질·용매", "c": "ch2", "u": "농도", "t": "C", "dx": "용질(녹는 것)과 용매(녹이는 것, 보통 양이 많은 쪽)의 역할을 가르지 못한 경우다. 둘을 뒤바꾸면 농도 정의가 어긋난다.", "fx": "'용질 = 녹는 것, 용매 = 녹이는 것(보통 양이 많은 쪽)'으로 역할을 갈라 둔다. 둘을 뒤바꾸지 말고 농도 정의에 써라.", "f": "B2", "rk": 73, "d": 1, "rh": 0, "pre": ["CH2-122"], "tr": "용질·용매가 헷갈려, 녹는 것(용질)과 녹이는 것(용매, 보통 많은 쪽) 역할이 섞인다.", "an": "녹는 것이 용질, 녹이는 것(보통 많은 쪽)이 용매다.", "rd": "녹는 것이 용질, 녹이는 것(보통 많은 쪽)이 용매다.", "tf": "보통 많은 쪽은 용질인가 용매인가? (용매)"}, "CH2-124": {"n": "몰랄 농도 의미", "c": "ch2", "u": "농도", "t": "C", "dx": "몰랄 농도가 용매 질량(kg)당 용질을 몰수로 센 값이라는 의미를 놓친 경우다. 용질을 질량이 아니라 몰수로 센다는 점이 약하면 몰랄 농도를 잘못 계산한다.", "fx": "몰랄 농도를 '용매 질량(kg)당 용질을 몰수로 센 값'으로 못 박는다. 용질을 질량이 아니라 몰수로 셈을 잡아 바로 계산하라.", "f": "D3", "rk": 74, "d": 1, "rh": 0, "pre": ["CH2-112"], "tr": "몰랄 의미가 막연해, 용매 질량(kg)당 용질을 몰수로 센 값이라는 게 빠진다.", "an": "용매 질량(kg)당 용질을 몰수로 센 값이다.", "rd": "용매 질량(kg)당 용질을 몰수로 센 값이다.", "tf": "용매 kg당 용질 몰수는? (몰랄)"}, "CH2-125": {"n": "농도 환산", "c": "ch2", "u": "농도", "t": "C", "dx": "농도 단위를 환산할 때 밀도가 부피와 질량을 잇는 다리라는 점을 놓친 경우다. 밀도를 빼먹으면 몰농도와 몰랄·퍼센트 사이 환산이 막힌다.", "fx": "농도 환산에서 '밀도가 부피와 질량을 잇는 다리'임을 못 박는다. 몰농도와 몰랄·퍼센트 사이를 밀도로 건너 환산하라.", "f": "D3", "rk": 75, "d": 1, "rh": 0, "pre": ["CH2-115", "CH2-114"], "tr": "농도 환산이 막막해, 밀도가 부피와 질량을 잇는 다리라는 게 빠진다.", "an": "밀도가 부피와 질량을 잇는 다리다.", "rd": "질량과 부피는 밀도로 잇는다.", "tf": "부피와 질량을 잇는 것은? (밀도)"}, "CH2-126": {"n": "몰랄 농도 계산", "c": "ch2", "u": "농도", "t": "C", "dx": "몰랄 농도를 (용질 몰수 ÷ 용매 kg)으로 셈하는 게 흔들린 경우다. 분모를 용액이 아니라 용매 질량으로 잡지 못하면 총괄성 계산이 어긋난다.", "fx": "몰랄 농도를 '용질 몰수 ÷ 용매 kg'으로 셈한다. 분모를 용액이 아니라 용매 질량으로 잡아 총괄성 계산을 맞춰라.", "f": "D3", "rk": 76, "d": 1, "rh": 0, "pre": ["CH2-112"], "tr": "몰랄 계산이 막막해, (용질 몰수÷용매 kg)이라는 게 흔들린다.", "an": "몰랄=용질 몰수÷용매 kg이다.", "rd": "용질 몰수를 용매 kg으로 나눈다.", "tf": "몰랄=용질 몰수÷무엇? (용매 kg)"}, "CH2-127": {"n": "ppm", "c": "ch2", "u": "농도", "t": "C", "dx": "ppm이 100만분의 1을 나타내 퍼센트보다 훨씬 작은 미량 농도 단위라는 점을 놓친 경우다. 척도 감각이 약하면 미량 성분의 농도를 잘못 읽는다.", "fx": "ppm을 '100만분의 1을 나타내 퍼센트보다 훨씬 작은 미량 농도 단위'로 못 박는다. 척도 감각을 잡아 미량 성분의 농도를 읽어라.", "f": "D3", "rk": 77, "d": 1, "rh": 0, "pre": ["CH2-114"], "tr": "ppm이 퍼센트와 비슷할 것 같아, 100만분의 1이라 훨씬 작은 미량 단위라는 게 빠진다.", "an": "ppm은 100만분의 1: 퍼센트보다 훨씬 작은 미량 단위다.", "rd": "매우 작은 농도라 100만분율로 나타낸다. 퍼센트보다 훨씬 작다.", "tf": "100만분율 단위는? (ppm)"}, "CH2-128": {"n": "온도 무관 농도", "c": "ch2", "u": "농도", "t": "C", "dx": "질량·몰수 기준 농도(몰랄·몰분율·퍼센트)는 온도에 무관하고 부피 기준 몰농도만 변한다는 점을 놓친 경우다. 무엇이 기준인지로 온도 의존이 갈린다는 점이 약하면 온도 문제에서 농도를 잘못 고른다.", "fx": "'질량·몰수 기준 농도(몰랄·몰분율·퍼센트)는 온도 무관, 부피 기준 몰농도만 변함'을 못 박는다. 무엇이 기준인지로 온도 의존이 갈림을 잡아 온도 문제에서 농도를 골라라.", "f": "A3", "rk": 183, "d": 2, "rh": 0, "pre": ["CH2-116", "CH2-117", "CH2-121"], "tr": "모든 농도가 온도 따라 변할 것 같아, 질량·몰수 기준은 무관하고 부피 기준 몰농도만 변한다는 게 빠진다.", "an": "질량·몰수 기준은 온도에 무관, 부피 기준 몰농도만 변한다.", "rd": "질량·몰수 기준은 온도에 안 변한다. 부피 기준 몰농도만 변한다.", "tf": "온도에 변하는 농도는? (몰농도)"}, "CH2-129": {"n": "농도 의미", "c": "ch2", "u": "농도", "t": "C", "dx": "농도가 용액(또는 용매) 일정량에 용질이 얼마나 녹아 있는지를 나타낸다는 점을 놓친 경우다. 농도가 용질 양을 반영한다는 감각이 약하면 진하고 묽음을 잘못 판단한다.", "fx": "농도를 '용액(또는 용매) 일정량에 용질이 얼마나 녹아 있는지'로 못 박는다. 농도가 용질 양을 반영함을 잡아 진하고 묽음을 판단하라.", "f": "B2", "rk": 78, "d": 1, "rh": 37, "pre": ["CH2-122"], "tr": "농도가 막연해, 일정량에 용질이 얼마나 녹았는지를 나타낸다는 게 빠진다.", "an": "농도는 일정량에 용질이 얼마나 녹았는지를 나타낸다.", "rd": "일정량에 용질이 얼마나 녹았는지를 나타낸다.", "tf": "일정량에 용질이 얼마나 녹았나는? (농도)"}, "CH2-130": {"n": "농도 세기 성질", "c": "ch2", "u": "농도", "t": "C", "dx": "농도가 용액 양과 무관한 세기 성질이라는 점을 놓친 경우다. 용액을 더 떠도 농도는 그대로라는 점이 약하면 양에 따라 농도가 변한다고 잘못 본다.", "fx": "농도를 '용액 양과 무관한 세기 성질(더 떠도 농도는 그대로)'로 못 박는다. 양에 따라 농도가 변한다고 보지 마라.", "f": "A3", "rk": 184, "d": 2, "rh": 0, "pre": ["CH2-129"], "tr": "용액이 많으면 농도도 클 것 같아, 양과 무관한 세기 성질이라는 게 빠진다.", "an": "농도는 양과 무관한 세기 성질이다.", "rd": "농도는 비율이라 양과 무관하다. 그래서 세기 성질이다.", "tf": "농도는 양에 의존하나? (안 함: 세기 성질)"}, "CH2-131": {"n": "몰농도 의미", "c": "ch2", "u": "농도", "t": "C", "dx": "몰농도가 용액 1 L당 몰수의 비라 부피가 꼭 1 L가 아니어도 정의된다는 점을 놓친 경우다. 부피가 1 L여야 한다고 오해하면 다른 부피의 농도 계산이 막힌다.", "fx": "몰농도를 '용액 1 L당 몰수의 비라 부피가 꼭 1 L가 아니어도 정의됨'으로 못 박는다. 부피가 1 L여야 한다고 오해 말고 다른 부피의 농도를 계산하라.", "f": "B2", "rk": 79, "d": 1, "rh": 0, "pre": ["CH2-115"], "tr": "몰농도가 꼭 1 L여야 정의될 것 같아, 1 L당 몰수의 비라 부피가 달라도 정의된다는 게 빠진다.", "an": "몰농도는 1 L당 몰수의 비라 부피가 달라도 정의된다.", "rd": "몰농도는 1 L당 몰수의 비다. 그래서 부피가 달라도 정의된다.", "tf": "1 L당 몰수는? (몰농도)"}, "CH2-132": {"n": "묽힘", "c": "ch2", "u": "농도", "t": "C", "dx": "묽힘이 용매만 더해 용질 몰수는 그대로이고 농도만 낮추는 것이라는 점을 놓친 경우다. 용질 몰수 보존이 약하면 묽힘 후 농도를 못 구한다.", "fx": "묽힘을 '용매만 더해 용질 몰수는 그대로이고 농도만 낮춤'으로 못 박는다. 용질 몰수 보존을 잡아 묽힘 후 농도를 구하라.", "f": "D3", "rk": 80, "d": 1, "rh": 0, "pre": ["CH2-115"], "tr": "묽히면 용질도 줄 것 같아, 용매만 더해 용질 몰수는 그대로이고 농도만 낮춘다는 게 빠진다.", "an": "용매만 더해 용질 몰수는 그대로이고 농도만 낮춘다.", "rd": "용매만 더하니 용질 몰수는 그대로다. 그래서 농도만 낮춘다.", "tf": "묽히면 용질 몰수는? (그대로)"}, "CH2-133": {"n": "몰분율 해석", "c": "ch2", "u": "농도", "t": "C", "dx": "몰분율을 입자 수로 따진 성분의 비율로 읽지 못한 경우다. 비율이라는 해석이 약하면 라울 법칙에서 용매 몰분율이 증기압 내림으로 이어지는 흐름을 못 짚는다.", "fx": "몰분율을 '입자 수로 따진 성분의 비율'로 못 박는다. 비율임을 잡아 라울 법칙에서 용매 몰분율이 증기압 내림으로 이어지는 흐름을 짚어라.", "f": "B2", "rk": 81, "d": 1, "rh": 0, "pre": ["CH2-113"], "tr": "몰분율이 막연해, 입자 수로 따진 성분 비율이라는 게 빠진다.", "an": "몰분율은 입자 수로 따진 성분 비율이다.", "rd": "입자 수로 따진 성분 비율이 몰분율이다.", "tf": "입자 수로 따진 성분 비율은? (몰분율)"}, "CH2-134": {"n": "농도 비교", "c": "ch2", "u": "농도", "t": "C", "dx": "서로 다른 농도 단위는 기준(부피·질량·몰수)이 달라 직접 비교하려면 몰수 = 질량/분자량 등으로 통일해야 한다는 점을 놓친 경우다. 기준 차이를 무시하면 농도 비교가 어긋난다.", "fx": "'서로 다른 농도 단위는 기준(부피·질량·몰수)이 달라, 비교하려면 몰수 = 질량/분자량 등으로 통일'함을 못 박는다. 기준 차이를 무시 말고 통일해 비교하라.", "f": "D3", "rk": 82, "d": 1, "rh": 0, "pre": ["CH2-115", "CH2-112"], "tr": "다른 농도 단위를 바로 비교할 것 같아, 기준이 달라 몰수=질량/분자량 등으로 통일해야 한다는 게 빠진다.", "an": "기준이 다른 농도는 몰수=질량/분자량 등으로 통일해 비교한다.", "rd": "기준이 다르면 몰수=질량/분자량 등으로 통일해 비교한다.", "tf": "기준 다른 농도를 비교하려면? (단위 통일)"}, "CH2-135": {"n": "농도와 총괄성", "c": "ch2", "u": "농도", "t": "C", "dx": "총괄성이 용질 입자 수에 비례해 농도(입자 수 기준)가 그 크기를 정한다는 점을 놓친 경우다. 입자 수와 총괄성의 연결이 약하면 다음 단원 총괄성 계산이 흔들린다.", "fx": "'총괄성은 용질 입자 수에 비례해 농도(입자 수 기준)가 그 크기를 정함'을 못 박는다. 입자 수와 총괄성의 연결을 다음 단원의 바탕으로 삼아라.", "f": "A3", "rk": 313, "d": 3, "rh": 0, "pre": ["CH2-136", "CH2-129"], "tr": "농도와 총괄성이 무관할 것 같아, 총괄성이 입자 수에 비례해 농도가 그 크기를 정한다는 게 빠진다.", "an": "총괄성이 입자 수에 비례해 농도가 그 크기를 정한다.", "rd": "총괄성이 입자 수에 비례한다. 그래서 농도가 그 크기를 정한다.", "tf": "총괄성의 크기를 정하는 것은? (농도/입자 수)"}, "CH2-211": {"n": "용해 정의", "c": "ch2", "u": "용해", "t": "C", "dx": "용해가 새 물질을 만들지 않고 용질이 용매에 고르게 섞이는(층을 이루지 않는) 현상이라는 점을 놓친 경우다. 용해를 화학 반응과 혼동하면 용해 과정의 본질을 잘못 잡는다.", "fx": "용해를 '새 물질을 만들지 않고 용질이 용매에 고르게 섞이는(층을 이루지 않는) 현상'으로 못 박는다. 화학 반응과 혼동 말고 용해의 본질을 잡아라.", "f": "B2", "rk": 89, "d": 1, "rh": 19, "pre": ["CH2-122"], "tr": "용해가 새 물질을 만드는 것 같아, 용질이 용매에 고르게 섞이는(층 없이) 현상이라는 게 빠진다.", "an": "용해는 용질이 용매에 고르게 섞이는 현상: 새 물질을 만드는 게 아니다.", "rd": "용질이 용매에 고르게 섞이는 것이 용해다. 새 물질을 만드는 게 아니다.", "tf": "용질이 용매에 고르게 섞이는 건? (용해)"}, "CH2-212": {"n": "용해 단계", "c": "ch2", "u": "용해", "t": "C", "dx": "용해가 용질·용매 사이 기존 인력을 끊고(흡열) 용질-용매 새 인력을 만드는(발열) 단계로 이뤄진다는 점을 놓친 경우다. 이 단계 구분이 약하면 용해 엔탈피의 부호를 설명하지 못한다.", "fx": "용해를 '용질·용매 사이 기존 인력을 끊고(흡열) 용질-용매 새 인력을 만드는(발열) 단계'로 못 박는다. 이 단계 구분으로 용해 엔탈피의 부호를 설명하라.", "f": "B2", "rk": 194, "d": 2, "rh": 2, "pre": ["CH2-211", "CH2-001"], "tr": "용해가 한 과정 같아, 기존 인력을 끊고(흡열) 새 인력을 만드는(발열) 단계라는 게 빠진다.", "an": "기존 인력을 끊고(흡열) 새 인력을 만드는(발열) 단계의 합이다.", "rd": "기존 인력을 끊고(흡열) 새 인력을 만든다(발열). 용해는 그 합이다.", "tf": "용해는 인력을 끊고 무엇을? (새 인력 만듦)"}, "CH2-213": {"n": "용해 엔탈피", "c": "ch2", "u": "용해", "t": "C", "dx": "용해 엔탈피가 인력을 끊는 흡열과 새 인력을 만드는 발열의 합이라 물질에 따라 발열일 수도 흡열일 수도 있다는 점을 놓친 경우다. 이 수지가 약하면 용해 시 온도 변화를 예측하지 못한다.", "fx": "용해 엔탈피를 '인력을 끊는 흡열과 새 인력을 만드는 발열의 합이라 물질에 따라 발열일 수도 흡열일 수도 있음'으로 못 박는다. 이 수지로 용해 시 온도 변화를 예측하라.", "f": "B2", "rk": 329, "d": 3, "rh": 1, "pre": ["CH2-212"], "tr": "용해가 늘 발열일 것 같아, 흡열·발열의 합이라 물질 따라 흡열일 수도 있다는 게 빠진다.", "an": "흡열·발열의 합이라 물질 따라 흡열일 수도 있다.", "rd": "흡열·발열의 합이라 물질에 따라 흡열일 수도 있다.", "tf": "용해는 발열만 있나? (아니다: 흡열도)"}, "CH2-214": {"n": "용해 자발성", "c": "ch2", "u": "용해", "t": "C", "dx": "용해가 흡열이어도 입자가 흩어져 엔트로피가 커지면(TΔS 항) 자발적일 수 있다는 점을 놓친 경우다. ΔG = ΔH − TΔS를 용해에 적용하지 못하면 흡열 용해가 왜 일어나는지 설명하지 못한다.", "fx": "'용해가 흡열이어도 입자가 흩어져 엔트로피가 커지면(TΔS 항) 자발적일 수 있음'을 못 박는다. ΔG = ΔH − TΔS를 용해에 적용해 흡열 용해가 왜 일어나는지 설명하라.", "f": "A4", "rk": 487, "d": 4, "rh": 0, "pre": ["CH2-213", "CH2-210"], "tr": "흡열이면 안 녹을 것 같은데, 입자가 흩어져 엔트로피가 커지면 자발적일 수 있다는 게 의외다.", "an": "흡열이어도 입자가 흩어져 엔트로피가 커지면 자발적일 수 있다.", "rd": "흡열이어도 입자가 흩어져 엔트로피가 크게 늘면 ΔG가 음일 수 있다. 그래서 자발적일 수 있다.", "tf": "흡열 용해가 자발일 수 있는 이유는? (엔트로피 증가)"}, "CH2-215": {"n": "용해성 규칙", "c": "ch2", "u": "용해", "t": "C", "dx": "비슷한 성질끼리 잘 녹는다(극성은 극성에, 무극성은 무극성에)는 용해성 규칙을 놓친 경우다. 이 규칙이 약하면 어떤 용질이 어떤 용매에 녹는지 예측하지 못한다.", "fx": "'비슷한 성질끼리 잘 녹음(극성은 극성에, 무극성은 무극성에)'을 용해성 규칙으로 못 박는다. 이 규칙으로 어떤 용질이 어떤 용매에 녹는지 예측하라.", "f": "B2", "rk": 195, "d": 2, "rh": 1, "pre": ["CH2-211"], "tr": "무엇이 무엇에 녹는지 막막해, 비슷한 성질끼리 잘 녹는다는 규칙이 빠진다.", "an": "비슷한 성질끼리 잘 녹는다.", "rd": "비슷한 분자 간 힘이라야 서로 대신한다. 그래서 비슷한 성질끼리 녹는다.", "tf": "무엇끼리 잘 녹나? (비슷한 성질)"}, "CH2-216": {"n": "용해성", "c": "ch2", "u": "용해", "t": "C", "dx": "극성 물질은 극성 용매에, 무극성 물질은 무극성 용매에 잘 녹는다는 점을 놓친 경우다. 분자 간 힘의 닮음이 용해를 정한다는 점이 약하면 기름이 물에 안 섞이는 까닭을 못 짚는다.", "fx": "'극성 물질은 극성 용매에, 무극성 물질은 무극성 용매에 잘 녹음'을 못 박는다. 분자 간 힘의 닮음이 용해를 정함을 잡아 기름이 물에 안 섞이는 까닭을 짚어라.", "f": "B2", "rk": 330, "d": 3, "rh": 0, "pre": ["CH2-215"], "tr": "극성·무극성이 막 섞일 것 같아, 극성은 극성에·무극성은 무극성에 녹는다는 게 빠진다.", "an": "극성은 극성에, 무극성은 무극성에 녹는다: 기름과 물은 안 섞인다.", "rd": "극성은 극성과, 무극성은 무극성과 인력이 맞는다. 그래서 끼리끼리 녹는다.", "tf": "기름은 물과 섞이나? (안 섞임: 극성 안 맞음)"}, "CH2-217": {"n": "용해도 정의", "c": "ch2", "u": "용해", "t": "C", "dx": "용해도가 일정 온도에서 녹을 수 있는 최대량이고 물질·온도마다 다르다는 점을 놓친 경우다. 용해도 정의가 흐리면 포화·불포화 판정이 어긋난다.", "fx": "용해도를 '일정 온도에서 녹을 수 있는 최대량이고 물질·온도마다 다름'으로 못 박는다. 이 정의로 포화·불포화를 판정하라.", "f": "B2", "rk": 196, "d": 2, "rh": 13, "pre": ["CH2-211"], "tr": "용해도가 막연해, 일정 온도에서 녹는 최대량이고 물질·온도마다 다르다는 게 빠진다.", "an": "일정 온도에서 녹는 최대량, 물질·온도마다 다르다.", "rd": "일정 온도에서 녹는 최대량이다. 물질·온도마다 다르다.", "tf": "일정 온도의 최대 용해량은? (용해도)"}, "CH2-218": {"n": "포화 용액", "c": "ch2", "u": "용해", "t": "C", "dx": "포화 용액이 용해도만큼 녹아 용해와 석출이 동적 평형을 이룬 상태라는 점을 놓친 경우다. 동적 평형이라는 점이 약하면 포화를 '더는 아무 일 없는' 상태로 오해한다.", "fx": "포화 용액을 '용해도만큼 녹아 용해와 석출이 동적 평형을 이룬 상태'로 못 박는다. 동적 평형임을 잡아 포화를 '아무 일 없는' 상태로 오해 마라.", "f": "E1", "rk": 331, "d": 3, "rh": 3, "pre": ["CH2-217", "CH2-075"], "tr": "포화면 용해가 멈춘 것 같아, 용해·석출이 같은 속도인 동적 평형이라는 게 빠진다.", "an": "포화는 용해·석출이 같은 속도인 동적 평형이다.", "rd": "포화는 용해와 석출 속도가 같아진 동적 평형이다.", "tf": "용해·석출이 같은 속도인 용액은? (포화)"}, "CH2-219": {"n": "불포화 용액", "c": "ch2", "u": "용해", "t": "C", "dx": "불포화 용액이 용해도보다 적게 녹아 더 녹을 수 있는 상태라는 점을 놓친 경우다. 포화와의 대비가 약하면 용액 상태를 가리지 못한다.", "fx": "불포화 용액을 '용해도보다 적게 녹아 더 녹을 수 있는 상태'로 못 박는다. 포화와 대비해 용액 상태를 가려라.", "f": "B2", "rk": 488, "d": 4, "rh": 0, "pre": ["CH2-218"], "tr": "불포화가 막연해, 용해도보다 적게 녹아 더 녹을 수 있는 상태라는 게 빠진다.", "an": "용해도보다 적게 녹아 더 녹을 수 있는 상태다.", "rd": "용해도보다 적게 녹아 더 녹을 수 있는 상태다.", "tf": "더 녹을 수 있는 용액은? (불포화)"}, "CH2-220": {"n": "고체 용해도와 온도", "c": "ch2", "u": "용해", "t": "C", "dx": "대부분의 고체가 온도가 높을수록 용해도가 커진다는 점을 놓친 경우다. 이 경향이 약하면 온도를 내릴 때 석출되는 재결정 현상을 설명하지 못한다.", "fx": "'대부분의 고체는 온도가 높을수록 용해도가 커짐'을 못 박는다. 온도를 내릴 때 석출되는 재결정 현상을 이로 설명하라.", "f": "A1", "rk": 332, "d": 3, "rh": 0, "pre": ["CH2-217"], "tr": "고체 용해도가 온도와 무관할 것 같아, 대부분 높을수록 커진다는 게 빠진다.", "an": "고체는 대부분 온도 높을수록 더 녹는다.", "rd": "고체 용해는 대개 흡열이라 온도가 높으면 더 녹는다.", "tf": "고체는 온도가 높으면 보통? (더 녹음)"}, "CH2-221": {"n": "기체 용해도와 온도", "c": "ch2", "u": "용해", "t": "B", "dx": "기체 용해가 발열이라 온도가 높을수록 용해도가 작아진다는(고체와 반대) 점을 놓친 경우다. 이 반대 경향이 약하면 따뜻한 물에서 기체가 덜 녹는 까닭을 못 짚는다.", "fx": "'기체 용해는 발열이라 온도가 높을수록 용해도가 작아짐(고체와 반대)'을 못 박는다. 이 반대 경향으로 따뜻한 물에서 기체가 덜 녹는 까닭을 짚어라.", "f": "A1", "rk": 333, "d": 3, "rh": 1, "pre": ["CH2-217"], "tr": "기체도 온도 높으면 더 녹을 것 같아, 용해가 발열이라 높을수록 덜 녹는다(고체와 반대)는 게 의외다.", "an": "용해가 발열이라 온도 높을수록 덜 녹는다: 데우면 더 녹을 것 같지만 고체와 반대다.", "rd": "기체 용해는 발열이라 온도가 높으면 덜 녹는다. 고체와 반대다.", "tf": "기체는 온도가 높으면? (덜 녹음: 고체와 반대)"}, "CH2-222": {"n": "헨리 법칙", "c": "ch2", "u": "용해", "t": "A", "dx": "헨리 법칙이 일정 온도에서 기체 용해도가 그 기체 분압에 정비례한다는 법칙이라는 점을 놓친 경우다. 압력과 용해도의 정비례가 약하면 압력 변화에 따른 기체 용해량을 못 구한다.", "fx": "헨리 법칙을 '일정 온도에서 기체 용해도가 그 기체 분압에 정비례'로 못 박는다. 압력과 용해도의 정비례로 압력 변화에 따른 기체 용해량을 구하라.", "f": "A2", "rk": 334, "d": 3, "rh": 4, "pre": ["CH2-217"], "tr": "기체 용해도가 압력과 막연히 관련될 것 같아, 분압에 정비례한다(헨리)는 게 빠진다.", "an": "기체 용해도가 분압에 정비례: 누를수록 더 녹는다.", "rd": "압력이 높으면 기체가 액면을 더 때린다. 그래서 용해도가 분압에 비례한다.", "tf": "기체 용해도는 분압에? (비례)"}, "CH2-223": {"n": "헨리 응용", "c": "ch2", "u": "용해", "t": "C", "dx": "압력이 낮아지면 녹아 있던 기체가 빠져나온다는(탄산음료를 열면 거품, 잠수병) 헨리 법칙 응용을 놓친 경우다. 압력 변화와 기체 방출을 못 이으면 응용 현상을 설명하지 못한다.", "fx": "'압력이 낮아지면 녹아 있던 기체가 빠져나옴(탄산음료를 열면 거품, 잠수병)'을 못 박는다. 압력 변화와 기체 방출을 이어 응용 현상을 설명하라.", "f": "A1", "rk": 489, "d": 4, "rh": 0, "pre": ["CH2-222"], "tr": "탄산음료 거품이 왜 나는지 막막해, 압력이 낮아지면 녹았던 기체가 빠져나와서라는 게 빠진다.", "an": "탄산음료 뚜껑을 열면 압력이 낮아져 녹았던 기체가 거품으로 빠진다.", "rd": "뚜껑을 열면 압력이 낮아져 용해도가 준다. 그래서 녹았던 기체가 거품으로 빠진다.", "tf": "탄산음료 뚜껑을 열면 거품이 나는 이유는? (압력 낮아져 용해도 감소)"}, "CH2-224": {"n": "헨리 법칙 계산", "c": "ch2", "u": "용해", "t": "C", "dx": "기체 용해도가 분압에 정비례한다는 헨리 법칙으로 용해량을 계산하는 게 흔들린 경우다. 압력을 두 배로 하면 용해량도 두 배라는 비례가 약하면 계산이 어긋난다.", "fx": "'기체 용해도가 분압에 정비례'함을 헨리 법칙으로 계산한다. 압력을 두 배로 하면 용해량도 두 배임을 잡아 용해량을 구하라.", "f": "A2", "rk": 490, "d": 4, "rh": 0, "pre": ["CH2-222"], "tr": "용해량 계산이 막막해, 분압에 정비례한다는 헨리로 구한다는 게 흔들린다.", "an": "분압에 정비례한다는 헨리로 용해량을 구한다.", "rd": "용해도가 분압에 비례한다는 헨리로 용해량을 구한다.", "tf": "용해량을 구하는 법칙은? (헨리)"}, "CH2-225": {"n": "압력과 고체 용해도", "c": "ch2", "u": "용해", "t": "C", "dx": "고체·액체의 용해도가 압력에 거의 영향받지 않는다는 점을 놓친 경우다. 압력이 기체 용해도에만 크게 작용한다는 점이 약하면 헨리 법칙을 고체에까지 잘못 적용한다.", "fx": "'고체·액체의 용해도는 압력에 거의 영향받지 않음'을 못 박는다. 압력이 기체 용해도에만 크게 작용함을 잡아 헨리 법칙을 고체에 잘못 적용 마라.", "f": "A3", "rk": 335, "d": 3, "rh": 0, "pre": ["CH2-217"], "tr": "고체도 압력 따라 더 녹을 것 같아, 고체·액체는 압력에 거의 영향 안 받는다는 게 빠진다.", "an": "고체·액체는 압력에 거의 영향 안 받는다.", "rd": "고체·액체는 부피 변화가 작아 압력에 거의 안 변한다.", "tf": "고체 용해도는 압력에? (거의 무관)"}, "CH2-226": {"n": "압력과 기체 용해도", "c": "ch2", "u": "용해", "t": "C", "dx": "기체 용해도가 압력이 높을수록 커진다는(헨리 법칙) 점을 놓친 경우다. 압력이 기체를 용액에 밀어 넣는다는 그림이 약하면 압력-기체 용해도 관계가 어긋난다.", "fx": "'기체 용해도는 압력이 높을수록 커짐(헨리 법칙)'을 못 박는다. 압력이 기체를 용액에 밀어 넣는 그림으로 압력-기체 용해도 관계를 잡아라.", "f": "A1", "rk": 491, "d": 4, "rh": 0, "pre": ["CH2-222"], "tr": "기체 용해도가 압력과 무관할 것 같아, 높을수록 커진다(헨리)는 게 빠진다.", "an": "기체 용해도는 압력 높을수록 커진다(헨리).", "rd": "기체는 압력이 높으면 액면을 더 때려 더 녹는다(헨리).", "tf": "기체 용해도는 압력이 높으면? (큼)"}, "CH2-227": {"n": "과포화 용액", "c": "ch2", "u": "용해", "t": "C", "dx": "과포화 용액이 용해도를 넘게 녹은 불안정한 상태라 작은 자극에도 쉽게 석출된다는 점을 놓친 경우다. 이 불안정성이 약하면 과포화를 그냥 진한 용액으로 오해한다.", "fx": "과포화 용액을 '용해도를 넘게 녹은 불안정한 상태라 작은 자극에도 쉽게 석출됨'으로 못 박는다. 그냥 진한 용액으로 오해 마라.", "f": "B2", "rk": 492, "d": 4, "rh": 0, "pre": ["CH2-218"], "tr": "과포화가 막연해, 용해도를 넘게 녹은 불안정한 상태라 자극에 석출된다는 게 빠진다.", "an": "용해도를 넘게 녹은 불안정한 상태: 자극에 석출한다.", "rd": "용해도를 넘게 녹은 불안정한 상태라 자극에 석출한다.", "tf": "용해도를 넘게 녹은 용액은? (과포화)"}, "CH2-228": {"n": "헨리 법칙 한계", "c": "ch2", "u": "용해", "t": "C", "dx": "헨리 법칙이 물에 잘 녹거나 반응하는 기체(HCl·NH₃)에는 잘 맞지 않는다는 한계를 놓친 경우다. 법칙이 이상적

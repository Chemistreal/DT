지와 다르다.", "rd": "결합 전자를 당기는 힘이다. 이온화 에너지와 다른 개념이다.", "tf": "결합 전자를 당기는 힘은? (전기음성도)"}, "CH1-154": {"n": "전기음성도 주기성", "c": "ch1", "u": "Ⅱ-4", "t": "B", "dx": "전기음성도가 같은 주기에서 오른쪽으로 커지고 같은 족에서 아래로 작아진다는 방향을 놓친 경우다. 이 경향이 흔들리면 두 원자 중 누가 전자쌍을 당기는지(결합 극성)를 못 가른다.", "fx": "전기음성도를 '주기 오른쪽으로 커짐, 족 아래로 작아짐'으로 못 박는다. 두 원자 중 누가 전자쌍을 더 당기는지(결합 극성)를 이 방향으로 가려라.", "f": "A1", "rk": 924, "d": 25, "rh": 3, "pre": ["CH1-153", "CH1-146"], "tr": "방향이 헷갈려, 오른쪽으로 커지고 아래로 작아진다는 게 흔들린다.", "an": "오른쪽으로 커지고 아래로 작아진다.", "rd": "유효 핵전하가 큰 오른쪽일수록 크고, 반지름이 큰 아래일수록 작다.", "tf": "같은 주기 오른쪽으로 전기음성도는? (증가)"}, "CH1-155": {"n": "전기음성도 최대", "c": "ch1", "u": "Ⅱ-4", "t": "A", "dx": "전기음성도가 플루오린(F)에서 최대이고 산소가 그다음, 세슘 같은 금속은 매우 작다는 순위를 놓친 경우다. 최대·최소 기준이 흐리면 어떤 결합이 더 극성인지 비교가 어긋난다.", "fx": "전기음성도를 '플루오린(F) 최대, 산소가 그다음, 세슘 같은 금속은 매우 작음'으로 기준점을 못 박는다. 이 순위로 어느 결합이 더 극성인지 비교하라.", "f": "C1", "rk": 930, "d": 26, "rh": 0, "pre": ["CH1-154"], "tr": "최대가 막연해, F에서 최대·산소가 다음·세슘은 매우 작다는 순위가 빠진다.", "an": "F가 최대, 산소가 다음: 세슘은 매우 작다.", "rd": "유효 핵전하가 크고 반지름이 작은 F가 최대다.", "tf": "전기음성도가 가장 큰 원소는? (F)"}, "CH1-156": {"n": "금속성", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "금속성이 전자를 잃어 양이온이 되려는 성질이고 주기율표 왼쪽 아래에서 크다는 점을 놓친 경우다. 금속성의 방향이 흐리면 이온 형성·결합 종류 판정이 어긋난다.", "fx": "금속성을 '전자를 잃어 양이온이 되려는 성질, 주기율표 왼쪽 아래에서 큼'으로 못 박는다. 이 방향으로 이온 형성·결합 종류를 판정하라.", "f": "A1", "rk": 919, "d": 24, "rh": 5, "pre": ["CH1-150"], "tr": "금속성이 막연해, 전자를 잃어 양이온이 되려는 성질이고 왼쪽 아래에서 크다는 게 흐려진다.", "an": "전자를 잃어 양이온이 되려는 성질: 왼쪽 아래에서 크다.", "rd": "전자를 잃어 양이온이 되려는 성질이다. 이온화 에너지가 작은 왼쪽 아래에서 크다.", "tf": "전자를 잃으려는 성질은 어디서 큰가? (왼쪽 아래)"}, "CH1-157": {"n": "비금속성", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "비금속성이 전자를 얻어 음이온이 되고 전자쌍을 강하게 당기는 성질이며 오른쪽 위에서 크다는 점을 놓친 경우다. 비금속성의 방향이 흐리면 결합 극성·음이온 형성 판단이 어긋난다.", "fx": "비금속성을 '전자를 얻어 음이온이 되고 전자쌍을 강하게 당기는 성질, 오른쪽 위에서 큼'으로 못 박는다. 이 방향으로 결합 극성·음이온 형성을 판단하라.", "f": "A1", "rk": 925, "d": 25, "rh": 2, "pre": ["CH1-153"], "tr": "비금속성이 막연해, 전자를 얻고 전자쌍을 당기며 오른쪽 위에서 크다는 게 흐려진다.", "an": "전자를 얻고 전자쌍을 당기는 성질: 오른쪽 위에서 크다.", "rd": "전자를 얻으려는 성질이다. 전기음성도가 큰 오른쪽 위에서 크다.", "tf": "전자를 얻으려는 성질은 어디서 큰가? (오른쪽 위)"}, "CH1-158": {"n": "알칼리 금속", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "알칼리 금속이 원자가전자 1개라 전자를 잃기 쉽고 아래로 갈수록 이온화 에너지가 작아져 더 잘 잃는다는 점을 놓친 경우다. 이 경향이 약하면 1족 반응성 순서를 못 잡는다.", "fx": "알칼리 금속을 '원자가전자 1개라 전자를 잃기 쉽고, 아래로 갈수록 이온화 에너지가 작아 더 잘 잃음'으로 못 박는다. 1족을 위아래로 늘어놓고 반응성 순서를 잡아라.", "f": "A1", "rk": 931, "d": 26, "rh": 0, "pre": ["CH1-151", "CH1-156"], "tr": "알칼리 금속이 위로 갈수록 잘 잃을 것 같아, 아래로 갈수록 이온화 에너지가 작아 더 잘 잃는다는 게 흔들린다.", "an": "아래로 갈수록 이온화 에너지가 작아 더 잘 잃는다.", "rd": "아래로 갈수록 반지름이 커져 이온화 에너지가 작다. 그래서 더 잘 잃는다.", "tf": "1족에서 아래로 갈수록 반응성은? (증가)"}, "CH1-159": {"n": "할로젠", "c": "ch1", "u": "Ⅱ-4", "t": "B", "dx": "할로젠이 전자 1개를 얻어 음이온이 되기 쉽고 아래로 갈수록 그 힘이 약해진다(위쪽이 더 반응성)는 점을 놓친 경우다. 이 경향이 흔들리면 17족 반응성 순서가 어긋난다.", "fx": "할로젠을 '전자 1개를 얻어 음이온이 되기 쉽고, 아래로 갈수록 그 힘이 약해짐(위쪽이 더 반응성)'으로 못 박는다. 17족 반응성 순서를 위아래로 가려라.", "f": "A1", "rk": 932, "d": 26, "rh": 0, "pre": ["CH1-154", "CH1-157"], "tr": "할로젠이 아래로 갈수록 반응성 클 것 같아, 위쪽이 더 반응성이라는 게 거꾸로 느껴진다.", "an": "위쪽 할로젠이 더 반응성: 아래로 갈수록 약해진다(거꾸로).", "rd": "위로 갈수록 전자를 당기는 힘이 세다. 그래서 위쪽이 더 반응성이다.", "tf": "할로젠은 위아래 중 어디가 더 반응성? (위)"}, "CH1-160": {"n": "비활성 기체", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "비활성 기체가 안정한 전자 배치(옥텟)라 반응성이 작고 이온화 에너지가 크다는 점을 놓친 경우다. 이 안정 배치가 다른 원자들이 결합으로 닮으려는 목표라는 다음 개념과 직결된다.", "fx": "비활성 기체를 '안정한 옥텟 배치라 반응성이 작고 이온화 에너지가 큼'으로 못 박는다. 이 안정 배치가 다른 원자들이 결합으로 닮으려는 목표임을 이어 짚어라.", "f": "B2", "rk": 920, "d": 24, "rh": 53, "pre": ["CH1-150"], "tr": "비활성 기체가 막연해, 안정한 옥텟이라 반응성이 작고 이온화 에너지가 크다는 게 흐려진다.", "an": "안정한 옥텟이라 반응성이 작고 이온화 에너지가 크다.", "rd": "바깥 8전자가 안정해 반응성이 작고 이온화 에너지가 크다.", "tf": "비활성 기체의 반응성이 작은 이유는? (안정한 옥텟)"}, "CH1-161": {"n": "전자 친화도", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "전자 친화도를 이온화 에너지와 헷갈린 경우다. 전자 친화도가 '원자가 전자를 얻을 때의 에너지 변화'라는 점을 놓치면 비금속이 왜 음이온이 되기 쉬운지 설명이 막힌다.", "fx": "전자 친화도를 '원자가 전자를 얻을 때의 에너지 변화'로 못 박는다(이온화 에너지와 구분). 이로써 비금속이 음이온이 되기 쉬운 까닭을 설명하라.", "f": "B2", "rk": 921, "d": 24, "rh": 0, "pre": ["CH1-150"], "tr": "전자 친화도가 이온화 에너지 같아, 둘이 섞인다.", "an": "전자 친화도는 전자를 받을 때의 에너지: 이온화 에너지와 다르다.", "rd": "전자를 받을 때 출입하는 에너지다. 이온화 에너지와 다르다.", "tf": "전자를 받을 때의 에너지는? (전자 친화도)"}, "CH1-162": {"n": "금속 이온화", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "금속이 이온화 에너지가 작아 전자를 잃고 양이온이 되기 쉽다는 점을 놓친 경우다. 이 경향이 약하면 금속이 이온 결합에서 양이온이 되는 까닭을 못 짚는다.", "fx": "금속을 '이온화 에너지가 작아 전자를 잃고 양이온이 되기 쉬움'으로 못 박는다. 그래서 이온결합에서 금속이 양이온이 됨을 이어 짚어라.", "f": "B3", "rk": 926, "d": 25, "rh": 0, "pre": ["CH1-150", "CH1-156"], "tr": "금속이 왜 양이온이 되는지 막막해, 이온화 에너지가 작아 전자를 잃기 쉽다는 게 빠진다.", "an": "금속은 이온화 에너지가 작아 전자를 잘 잃어 양이온이다.", "rd": "금속은 이온화 에너지가 작아 전자를 잘 잃는다. 그래서 양이온이 된다.", "tf": "금속이 양이온이 되는 이유는? (이온화 에너지 작음)"}, "CH1-163": {"n": "비금속 전기음성도", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "비금속이 전기음성도가 커 전자를 강하게 당겨 음이온이 되기 쉽다는 점을 놓친 경우다. 이 경향이 약하면 비금속이 이온 결합에서 음이온이 되는 까닭을 못 짚는다.", "fx": "비금속을 '전기음성도가 커 전자를 강하게 당겨 음이온이 되기 쉬움'으로 못 박는다. 그래서 이온결합에서 비금속이 음이온이 됨을 이어 짚어라.", "f": "B3", "rk": 933, "d": 26, "rh": 0, "pre": ["CH1-153", "CH1-157"], "tr": "비금속이 왜 음이온이 되는지 막막해, 전기음성도가 커 전자를 당긴다는 게 빠진다.", "an": "비금속은 전기음성도가 커 전자를 당겨 음이온이다.", "rd": "비금속은 전기음성도가 커 전자를 당긴다. 그래서 음이온이 된다.", "tf": "비금속이 음이온이 되는 이유는? (전기음성도 큼)"}, "CH1-164": {"n": "이온화 에너지 비교", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "주기율표 위치로 이온화 에너지를 비교하는 게 흔들린 경우다(오른쪽·위일수록 큼, 1족이 가장 작음). 위치 감각이 약하면 두 원소 중 누가 전자를 더 잘 잃는지 못 가린다.", "fx": "이온화 에너지를 '주기율표 오른쪽·위일수록 크고 1족이 가장 작음'으로 비교한다. 두 원소의 위치로 누가 전자를 더 잘 잃는지 가려라.", "f": "A1", "rk": 934, "d": 26, "rh": 0, "pre": ["CH1-151"], "tr": "위치로 비교가 막막해, 오른쪽·위일수록 크고 1족이 가장 작다는 게 흔들린다.", "an": "오른쪽·위일수록 크고 1족이 가장 작다.", "rd": "유효 핵전하가 큰 오른쪽·위일수록 크고 1족이 가장 작다.", "tf": "이온화 에너지가 가장 작은 족은? (1족)"}, "CH1-165": {"n": "전기음성도 비교", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "주기율표 위치로 전기음성도를 비교하는 게 흔들린 경우다(오른쪽·위일수록 큼, F가 위). 비교가 약하면 결합에서 어느 쪽이 부분 음전하인지 못 정한다.", "fx": "전기음성도를 '오른쪽·위일수록 크고 F가 가장 큼'으로 비교한다. 결합에서 어느 원자가 부분 음전하인지 위치로 정하라.", "f": "A1", "rk": 935, "d": 26, "rh": 0, "pre": ["CH1-154"], "tr": "위치로 비교가 막막해, 오른쪽·위일수록 크고 F가 위라는 게 흔들린다.", "an": "오른쪽·위일수록 크고 F가 위다.", "rd": "오른쪽·위일수록 크고 F가 위다.", "tf": "전기음성도가 가장 큰 곳은? (오른쪽 위)"}, "CH1-166": {"n": "원자 반지름 비교", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "주기율표 위치로 원자 반지름을 비교하는 게 흔들린 경우다(왼쪽·아래일수록 큼). 비교가 약하면 결합 길이·이온 크기 문제에서 어긋난다.", "fx": "원자 반지름을 '주기율표 왼쪽·아래일수록 큼'으로 비교한다. 위치로 결합 길이·이온 크기 문제를 풀어라.", "f": "A1", "rk": 936, "d": 26, "rh": 0, "pre": ["CH1-147"], "tr": "위치로 비교가 막막해, 왼쪽·아래일수록 크다는 게 흔들린다.", "an": "왼쪽·아래일수록 크다.", "rd": "껍질 많고 유효 핵전하 작은 왼쪽·아래일수록 크다.", "tf": "반지름이 가장 큰 곳은? (왼쪽 아래)"}, "CH1-167": {"n": "결합 형성 이유", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "원자가 비활성 기체 같은 안정한 전자 배치에 이르려 결합한다는 동기를 놓친 경우다. 결합이 '안정해지려는 것'이라는 이유가 약하면 이온·공유 결합의 형성을 통째로 설명하지 못한다.", "fx": "결합의 동기를 '비활성 기체 같은 안정한 전자 배치에 이르려는 것'으로 못 박는다. 이 이유에서 이온·공유 결합이 모두 나옴을 짚어라.", "f": "B3", "rk": 927, "d": 25, "rh": 52, "pre": ["CH1-160"], "tr": "원자가 왜 결합하는지 막막해, 비활성 기체 같은 안정한 배치에 이르려는 동기가 빠진다.", "an": "비활성 기체 같은 안정한 배치에 이르려고 결합한다.", "rd": "결합하면 비활성 기체 같은 안정한 배치에 가까워진다. 그래서 결합한다.", "tf": "원자가 결합하는 이유는? (안정한 배치)"}, "CH1-168": {"n": "결합과 에너지", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "결합 형성을 흡열로 본 경우다. 결합이 만들어질 때 에너지를 방출해(발열) 더 안정해진다는 점을 놓치면 결합 에너지 부호와 안정성 논리가 뒤집힌다.", "fx": "'결합이 만들어질 때 에너지를 방출해(발열) 더 안정해진다'를 못 박는다(흡열 아님). 결합 에너지 부호와 안정성을 이 방향으로 잡아라.", "f": "A1", "rk": 937, "d": 26, "rh": 2, "pre": ["CH1-167"], "tr": "결합 형성이 흡열일 것 같아, 발열(안정해짐)이라는 게 거꾸로 느껴진다.", "an": "결합이 생기면 안정해져 에너지를 내놓는다(발열): 흡열이 아니다.", "rd": "결합이 생기면 에너지가 낮아져 안정해진다. 그 차이를 방출하므로 발열이다.", "tf": "결합이 생기면 에너지를? (방출: 발열)"}, "CH1-169": {"n": "이온결합", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "이온결합이 금속이 잃고 비금속이 얻어 생긴 반대 전하 이온의 정전기적 인력이라는 점을 놓친 경우다. 이 정의가 흐리면 이온 결정의 구조·성질로 이어지지 못한다.", "fx": "이온결합을 '금속이 잃고 비금속이 얻어 생긴 반대 전하 이온의 정전기적 인력'으로 못 박는다. 이 정의에서 이온 결정의 구조·성질로 이어라.", "f": "B2", "rk": 938, "d": 26, "rh": 8, "pre": ["CH1-016", "CH1-167"], "tr": "이온결합이 막연해, 금속이 잃고 비금속이 얻은 반대 전하 이온의 정전기 인력이라는 게 흐려진다.", "an": "반대 전하 이온의 정전기 인력: +와 -가 끌어당겨 묶인다.", "rd": "금속이 잃고 비금속이 얻은 +,- 이온의 정전기 인력이 이온결합이다.", "tf": "+와 -이온의 인력으로 된 결합은? (이온결합)"}, "CH1-170": {"n": "공유결합", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "공유결합이 비금속끼리 전자쌍을 '공유'하는 결합이라는 점을, 전자를 주고받는 이온결합과 헷갈려 놓친 경우다. 공유와 이동의 구분이 약하면 분자 개념·결합 종류 판정이 어긋난다.", "fx": "공유결합을 '비금속끼리 전자쌍을 공유하는 결합'으로 못 박는다(전자를 주고받는 이온결합과 구분). 공유와 이동을 갈라 결합 종류를 판정하라.", "f": "B2", "rk": 939, "d": 26, "rh": 41, "pre": ["CH1-167"], "tr": "공유결합이 이온결합 같아, 전자쌍을 \"공유\"한다는(주고받음이 아니라) 게 흔들린다.", "an": "전자쌍을 나눠 갖는 것: 주고받음(이온)이 아니다.", "rd": "두 비금속이 전자쌍을 나눠 가져 묶인다. 완전히 주고받지 않는다.", "tf": "전자쌍을 나눠 갖는 결합은? (공유)"}, "CH1-171": {"n": "금속결합", "c": "ch1", "u": "Ⅱ-5", "t": "B", "dx": "금속결합을 양이온과 자유전자(전자 바다) 사이의 결합으로 보지 못하고 음이온 등으로 오해한 경우다. 자유전자라는 핵심이 흔들리면 금속의 전도성·전성·연성이 설명되지 않는다.", "fx": "금속결합을 '양이온과 자유전자(전자 바다) 사이의 결합'으로 못 박는다. 자유전자라는 핵심에서 전도성·전성·연성이 나옴을 짚어라.", "f": "B2", "rk": 928, "d": 25, "rh": 2, "pre": ["CH1-156"], "tr": "금속결합이 막연해, 양이온과 자유전자(전자 바다) 사이라는 게 안 잡힌다.", "an": "양이온이 자유전자 바다에 잠긴 구조다.", "rd": "양이온과 자유전자(전자 바다)의 인력이 금속결합이다.", "tf": "양이온과 자유전자의 결합은? (금속결합)"}, "CH1-172": {"n": "이온결정", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "이온결정에 독립된 분자가 있다고 본 경우다. 이온이 격자로 무한히 이어져 독립 분자가 없다는 점을 놓치면 이온 화합물을 분자식으로 잘못 쓴다.", "fx": "이온결정을 '이온이 격자로 무한히 이어져 독립 분자가 없음'으로 못 박는다. 그래서 이온 화합물은 분자식이 아니라 실험식으로 씀을 확인하라.", "f": "B2", "rk": 943, "d": 27, "rh": 6, "pre": ["CH1-169"], "tr": "이온결정에 분자가 있을 것 같아, 독립 분자가 없다는 게 빠진다.", "an": "이온결정엔 독립 분자가 없다: 격자 전체가 한 덩어리다.", "rd": "이온이 격자로 무한히 이어져 독립 분자가 없다.", "tf": "이온결정에 독립 분자가 있나? (없다: 격자)"}, "CH1-173": {"n": "공유결합 종류", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "공유결합을 공유 전자쌍 수(단일 1·이중 2·삼중 3쌍)로 가리는 게 흔들린 경우다. 결합 차수를 잘못 세면 결합 길이·세기, 나아가 분자 구조 판정이 어긋난다.", "fx": "공유결합을 '공유 전자쌍 수(단일 1·이중 2·삼중 3쌍)'로 가린다. 결합 차수를 바로 세어 결합 길이·세기·분자 구조 판정에 써라.", "f": "B2", "rk": 944, "d": 27, "rh": 32, "pre": ["CH1-170"], "tr": "결합이 다 같을 것 같아, 공유 전자쌍 수(단일1·이중2·삼중3)로 갈린다는 게 빠진다.", "an": "공유 전자쌍 수로 단일1·이중2·삼중3이다.", "rd": "공유 전자쌍 수로 단일1·이중2·삼중3이다.", "tf": "공유 전자쌍 2쌍인 결합은? (이중)"}, "CH1-174": {"n": "결합 에너지 곡선", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "두 원자가 가까워질 때 인력과 핵 사이 반발이 균형을 이루는 거리에서 에너지가 최소(가장 안정)가 된다는 곡선을 못 읽은 경우다. 이 곡선이 약하면 결합 길이의 의미를 못 짚는다.", "fx": "'두 원자가 가까워질 때 인력과 핵 사이 반발이 균형을 이루는 거리에서 에너지가 최소(가장 안정)'임을 못 박는다. 곡선의 최저점이 결합 길이임을 읽어라.", "f": "B2", "rk": 945, "d": 27, "rh": 1, "pre": ["CH1-170", "CH1-168"], "tr": "가까울수록 안정할 것 같아, 인력과 반발이 균형인 거리에서 에너지가 최소라는 게 빠진다.", "an": "인력과 반발이 균형인 거리에서 에너지 최소: 너무 가까우면 오히려 반발한다.", "rd": "너무 가까우면 핵끼리 반발, 멀면 인력이 약하다. 둘이 균형인 거리에서 에너지가 최소다.", "tf": "에너지가 최소인 거리가 무엇? (결합 길이)"}, "CH1-175": {"n": "결합 길이", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "결합 길이가 에너지가 가장 낮은(가장 안정한) 핵 사이 거리이고 결합 차수가 클수록 짧아진다는 점을 놓친 경우다. 이 관계가 약하면 결합 세기·길이 비교가 어긋난다.", "fx": "결합 길이를 '에너지가 가장 낮은 핵 사이 거리이고 결합 차수가 클수록 짧아짐'으로 못 박는다. 단일·이중·삼중을 길이 순으로 비교하라.", "f": "A3", "rk": 950, "d": 28, "rh": 0, "pre": ["CH1-174", "CH1-173"], "tr": "결합 길이가 막연해, 에너지가 가장 낮은 거리이고 차수가 클수록 짧다는 게 빠진다.", "an": "에너지가 가장 낮은 거리, 차수 클수록 짧다.", "rd": "에너지가 최저인 거리가 결합 길이다. 차수가 크면 더 당겨 짧다.", "tf": "차수가 크면 결합 길이는? (짧음)"}, "CH1-176": {"n": "이온결정 성질", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "이온결정이 외력에 층이 밀리면 같은 전하 이온이 만나 반발해 부서진다는 메커니즘을 놓친 경우다(인력이 강해 단단하지만 동시에 잘 쪼개짐). 이 둘을 함께 못 잡으면 이온결정 물성을 설명하지 못한다.", "fx": "이온결정을 '인력이 강해 단단하지만, 층이 밀리면 같은 전하가 만나 반발해 쪼개짐(취성)'으로 두 성질을 함께 잡는다. 단단함과 부서짐을 한 그림으로 새겨라.", "f": "B3", "rk": 951, "d": 28, "rh": 0, "pre": ["CH1-172"], "tr": "단단하니 안 깨질 것 같은데, 층이 밀리면 같은 전하가 만나 부서진다는 게 의외다.", "an": "망치로 치면 층이 밀려 같은 전하가 만나 쪼개진다: 단단해도 깨진다.", "rd": "층이 밀려 같은 전하가 만나면 강하게 반발한다. 그래서 단단해도 충격에 깨진다.", "tf": "이온결정이 충격에 깨지는 이유는? (층 밀려 같은 전하 반발)"}, "CH1-177": {"n": "이온결정 전도성", "c": "ch1", "u": "Ⅱ-5", "t": "A", "dx": "이온결정이 고체에서는 이온이 고정돼 전기가 안 통하고 녹거나 물에 녹으면 이온이 움직여 통한다는 조건 차이를 놓친 경우다. 이 구분이 약하면 전해질·전기분해 단원이 흔들린다.", "fx": "이온결정을 '고체는 이온이 고정돼 안 통하고, 녹거나 물에 녹으면 이온이 움직여 통함'으로 못 박는다. 이 조건 차이를 전해질·전기분해의 출발로 삼아라.", "f": "D2", "rk": 952, "d": 28, "rh": 0, "pre": ["CH1-172"], "tr": "이온결정이 늘 전기를 통할 것 같아, 고체는 안 통하고 녹거나 녹으면 통한다는 조건 차이가 빠진다.", "an": "고체는 안 통하고 녹거나 녹으면 통한다: 이온이 풀려야 한다.", "rd": "전기는 전하 운반자가 자유로워야 통한다. 고체는 이온이 묶여 안 통하고 녹으면 통한다.", "tf": "이온결정은 언제 전기가 통하나? (녹거나 녹였을 때)"}, "CH1-178": {"n": "금속 전도성", "c": "ch1", "u": "Ⅱ-5", "t": "B", "dx": "금속이 자유전자 덕분에 전기·열을 잘 통한다는 점을 놓친 경우다. 자유전자가 전하를 나른다는 그림이 약하면 금속 전도성·열전도를 설명하지 못한다.", "fx": "금속 전도성을 '자유전자가 전하를 날라 전기·열을 잘 통함'으로 못 박는다. 자유전자가 주체라는 그림을 열전도까지 이어라.", "f": "B3", "rk": 940, "d": 26, "rh": 0, "pre": ["CH1-171"], "tr": "금속이 왜 전기를 통하는지 막막해, 자유전자 덕분이라는 게 빠진다.", "an": "자유전자 덕에 전기가 통한다.", "rd": "자유전자가 전하를 나른다. 그래서 금속이 전기를 통한다.", "tf": "금속이 전기를 통하는 이유는? (자유전자)"}, "CH1-179": {"n": "금속 성질", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "자유전자가 양이온 사이를 옮겨 다니며 결합을 유지해, 금속이 두드리면 펴지는(전성·연성) 점을 놓친 경우다. 이 메커니즘이 약하면 금속이 왜 깨지지 않고 변형되는지 설명하지 못한다.", "fx": "'자유전자가 양이온 사이를 옮겨 다니며 결합을 유지해 두드리면 펴짐(전성·연성)'을 못 박는다. 이 메커니즘으로 금속이 깨지지 않고 변형됨을 설명하라.", "f": "B3", "rk": 941, "d": 26, "rh": 0, "pre": ["CH1-171"], "tr": "금속이 왜 펴지는지 막막해, 자유전자가 양이온 사이를 옮겨 결합을 유지해서라는 게 빠진다.", "an": "자유전자가 양이온 사이를 옮겨 결합을 유지해 두드리면 펴진다.", "rd": "두드려 위치가 밀려도 자유전자가 결합을 유지한다. 그래서 펴진다.", "tf": "금속을 두드리면 펴지는 이유는? (자유전자가 결합 유지)"}, "CH1-180": {"n": "공유결정", "c": "ch1", "u": "Ⅱ-5", "t": "A", "dx": "공유결정이 원자들이 그물처럼 연속으로 공유결합해 독립 분자가 없고 녹는점이 매우 높다는 점을 놓친 경우다. 이 구조가 약하면 다이아몬드·석영의 높은 녹는점과 결정 비교가 어긋난다.", "fx": "공유결정을 '원자가 그물처럼 연속으로 공유결합해 독립 분자가 없고 녹는점이 매우 높음'으로 못 박는다. 다이아몬드·석영으로 높은 녹는점과 결정 비교를 확인하라.", "f": "B2", "rk": 946, "d": 27, "rh": 1, "pre": ["CH1-170"], "tr": "공유결정에 분자가 있을 것 같아, 그물처럼 연속 결합해 독립 분자가 없고 녹는점이 매우 높다는 게 빠진다.", "an": "그물처럼 연속 결합해 독립 분자 없이 녹는점이 매우 높다: 다이아몬드.", "rd": "그물처럼 연속 공유 결합이라 끊을 게 많아 녹는점이 매우 높다.", "tf": "다이아몬드의 녹는점이 매우 높은 이유는? (연속 공유결합)"}, "CH1-181": {"n": "흑연", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "흑연이 탄소끼리 공유결합한 층 구조이고 남은 일부 전자가 자유로워 전기가 통한다(다이아몬드엔 자유전자가 없음)는 점을 놓친 경우다. 이 대비가 약하면 같은 탄소인데 전도성이 갈리는 까닭을 못 짚는다.", "fx": "흑연을 '탄소끼리 공유결합한 층 구조이고 남은 일부 전자가 자유로워 전기가 통함'으로 못 박는다. 다이아몬드엔 자유전자가 없음과 대비해 전도성 차이를 짚어라.", "f": "B2", "rk": 953, "d": 28, "rh": 0, "pre": ["CH1-180"], "tr": "흑연이 왜 전기를 통하는지 막막해, 층 구조에 남은 전자가 자유로워서라는(다이아몬드엔 없음) 게 빠진다.", "an": "흑연은 층에 남은 전자가 자유로워 전기가 통한다: 다이아몬드엔 없다.", "rd": "흑연은 결합에 안 쓰인 전자가 층을 따라 자유롭다. 그래서 전기가 통한다.", "tf": "흑연이 전기를 통하는 이유는? (자유로운 전자)"}, "CH1-182": {"n": "분자결정", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "분자결정이 분자 사이 약한 인력으로 모인 결정이라 녹는점이 낮다는 점을 놓친 경우다. 끊기는 게 결합이 아니라 분자 간 힘이라는 점이 약하면 화학Ⅱ 분자 간 힘 단원이 흔들린다.", "fx": "분자결정을 '분자 사이 약한 인력으로 모인 결정이라 녹는점이 낮음'으로 못 박는다. 끊기는 게 결합이 아니라 분자 간 힘임을 화학Ⅱ로 이어라.", "f": "B3", "rk": 954, "d": 28, "rh": 1, "pre": ["CH1-173"], "tr": "분자결정이 막연해, 분자 사이 약한 인력으로 모여 녹는점이 낮다는 게 흐려진다.", "an": "분자 사이 약한 인력으로 모여 녹는점이 낮다.", "rd": "분자 사이는 약한 분자 간 힘이라 끊기 쉬워 녹는점이 낮다.", "tf": "분자결정의 녹는점이 낮은 이유는? (약한 분자 간 힘)"}, "CH1-183": {"n": "분자결정 비교", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "분자결정끼리는 분자 간 힘이 약할수록 녹는점이 낮다는 비교를 놓친 경우다. 결정 유형이 같을 땐 분자 간 힘 세기가 녹는점을 가른다는 기준이 약하면 비교가 어긋난다.", "fx": "분자결정끼리는 '분자 간 힘이 약할수록 녹는점이 낮음'으로 비교한다. 결정 유형이 같을 땐 분자 간 힘 세기가 녹는점을 가름을 기준으로 써라.", "f": "C1", "rk": 963, "d": 29, "rh": 0, "pre": ["CH1-182"], "tr": "분자결정 녹는점 비교가 막막해, 분자 간 힘이 약할수록 낮다는 게 빠진다.", "an": "분자 간 힘이 약할수록 녹는점이 낮다.", "rd": "분자 간 힘이 약할수록 녹는점이 낮다.", "tf": "분자 간 힘이 약할수록 녹는점은? (낮음)"}, "CH1-184": {"n": "이온결정 녹는점", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "이온결정이 강한 정전기적 인력 때문에 녹는점이 높다는 점을 놓친 경우다. 인력 세기가 녹는점을 정한다는 감각이 약하면 격자 에너지 비교로 이어지지 못한다.", "fx": "이온결정을 '강한 정전기적 인력 때문에 녹는점이 높음'으로 못 박는다. 인력 세기가 녹는점을 정함을 격자 에너지 비교로 이어라.", "f": "B3", "rk": 955, "d": 28, "rh": 0, "pre": ["CH1-172"], "tr": "이온결정 녹는점이 막연해, 강한 정전기 인력 때문에 높다는 게 빠진다.", "an": "강한 정전기 인력 때문에 녹는점이 높다.", "rd": "정전기 인력이 강해 끊으려면 큰 에너지가 든다. 그래서 녹는점이 높다.", "tf": "이온결정의 녹는점이 높은 이유는? (강한 정전기 인력)"}, "CH1-185": {"n": "결합 극성", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "전기음성도 차이가 있으면 공유 전자쌍이 한쪽으로 치우쳐 극성 결합이 된다는 점을 놓친 경우다. 결합 극성을 못 잡으면 다음 단원 분자 극성·쌍극자 판단이 막힌다.", "fx": "'전기음성도 차이가 있으면 공유 전자쌍이 한쪽으로 치우쳐 극성 결합'임을 못 박는다. 결합 극성을 다음 단원 분자 극성·쌍극자의 출발로 삼아라.", "f": "A3", "rk": 947, "d": 27, "rh": 13, "pre": ["CH1-153", "CH1-170"], "tr": "결합 극성이 느낌 같아, 전기음성도 차이가 있으면 전자쌍이 치우쳐 극성이라는 게 흐려진다.", "an": "전기음성도 차이가 있으면 전자쌍이 치우쳐 극성이다.", "rd": "전기음성도 차가 있으면 전자쌍이 치우쳐 극성이다.", "tf": "전기음성도 차가 있으면 결합은? (극성)"}, "CH1-186": {"n": "격자 에너지", "c": "ch1", "u": "Ⅱ-5", "t": "A", "dx": "격자 에너지가 이온 사이 정전기적 인력이 강할수록(전하가 크고 거리가 가까울수록) 커진다는 점을 놓친 경우다. 이 결정 인자가 약하면 이온결정 녹는점의 정밀 비교가 어긋난다.", "fx": "격자 에너지를 '이온 전하가 크고 이온 사이 거리가 가까울수록 큼'으로 못 박는다. 이 두 인자로 이온결정 녹는점을 정밀 비교하라.", "f": "A3", "rk": 956, "d": 28, "rh": 0, "pre": ["CH1-172"], "tr": "격자 에너지가 막연해, 인력이 강할수록(전하 크고 거리 가까울수록) 크다는 게 빠진다.", "an": "전하 크고 거리 가까울수록 격자 에너지가 크다.", "rd": "전하가 크고 거리가 가까울수록 정전기 인력이 강하다. 그래서 격자 에너지가 크다.", "tf": "전하가 크고 거리가 가까우면 격자 에너지는? (큼)"}, "CH1-187": {"n": "이온결합 판정", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "금속과 비금속의 조합을 이온결합으로 판정하는 게 흔들린 경우다(두 비금속이면 공유결합). 구성 원소로 결합 종류를 못 가리면 물질의 성질 예측이 막힌다.", "fx": "'금속 + 비금속 = 이온결합, 비금속끼리 = 공유결합'으로 판정한다. 구성 원소를 보고 결합 종류를 가려 성질을 예측하라.", "f": "B2", "rk": 948, "d": 27, "rh": 0, "pre": ["CH1-169"], "tr": "결합 종류 판정이 막막해, 금속+비금속이면 이온(두 비금속이면 공유)이라는 게 흔들린다.", "an": "금속+비금속이면 이온이다.", "rd": "금속+비금속이면 전자를 완전히 주고받아 이온결합이다.", "tf": "금속+비금속이면 무슨 결합? (이온)"}, "CH1-188": {"n": "이온결정 배열", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "이온결정이 반대 전하가 번갈아 규칙 배열된 격자(같은 전하는 서로 멀리)라는 점을 놓친 경우다. 배열 규칙이 약하면 이온결정의 구조·안정성을 이해하지 못한다.", "fx": "이온결정을 '반대 전하가 번갈아 규칙 배열된 격자(같은 전하는 서로 멀리)'로 못 박는다. 이 배열이 정전기적으로 안정한 까닭을 짚어라.", "f": "B2", "rk": 957, "d": 28, "rh": 0, "pre": ["CH1-172"], "tr": "이온이 아무렇게나 모일 것 같아, 반대 전하가 번갈아 규칙 배열(같은 전하는 멀리)이라는 게 빠진다.", "an": "반대 전하가 번갈아 규칙 배열: 같은 전하는 멀리다.", "rd": "같은 전하는 밀고 반대 전하는 끌린다. 그래서 번갈아 규칙 배열한다.", "tf": "이온결정에서 같은 전하끼리는? (멀리 배열)"}, "CH1-189": {"n": "공유결합 판정", "c": "ch1", "u": "Ⅱ-5", "t": "C", "dx": "두 비금속의 조합을 공유결합으로 판정하는 게 흔들린 경우다(전자를 주고받는 게 아니라 공유함). 구성 원소로 결합 종류를 못 가리면 분자·이온 구분이 어긋난다.", "fx": "'두 비금속 = 공유결합'으로 판정한다(전자를 주고받는 게 아니라 공유). 구성 원소로 분자·이온을 갈라 결합 종류를 정하라.", "f": "B2", "rk": 949, "d": 27, "rh": 0, "pre": ["CH1-170"], "tr": "결합 종류 판정이 막막해, 두 비금속이면 공유(주고받음이 아니라 공유)라는 게 흔들린다.", "an": "두 비금속이면 공유다.", "rd": "두 비금속이면 전자를 나눠 공유결합이다.", "tf": "두 비금속이면 무슨 결합? (공유)"}, "CH1-190": {"n": "VSEPR 원리", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "중심 원자 둘레 전자쌍이 서로 반발을 최소화하려 가장 멀리 벌어진다는 VSEPR 원리를 놓친 경우다. 전자쌍 수가 배치를 정한다는 출발점이 흔들리면 분자 모양 예측 전체가 무너진다.", "fx": "VSEPR를 '중심 원자 둘레 전자쌍이 반발을 최소화하려 가장 멀리 벌어진다'로 못 박는다. 전자쌍 수를 세는 것이 모양 예측의 출발임을, 한 분자로 직접 적용하라.", "f": "B2", "rk": 958, "d": 28, "rh": 21, "pre": ["CH1-173"], "tr": "전자쌍 배치가 임의 같아, 반발을 최소화하려 가장 멀리 벌어진다는 원리가 빠진다.", "an": "전자쌍은 서로 밀어 최대한 멀어진다: 풍선 묶음이다.", "rd": "전자쌍은 같은 (-)라 서로 민다. 최대한 멀어진 배치가 모양을 정한다.", "tf": "전자쌍이 배치되는 원리는? (반발 최소)"}, "CH1-191": {"n": "공유 전자쌍", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "공유 전자쌍(두 원자가 함께 쓰는 결합 전자쌍)과 결합에 안 쓰인 고립 전자쌍을 가르지 못한 경우다. 이 구분이 약하면 결합각과 분자 모양을 정하는 단계에서 막힌다.", "fx": "'공유 전자쌍(두 원자가 함께 씀)과 고립 전자쌍(결합에 안 쓰임)'을 갈라 둔다. 한 분자에서 둘을 각각 세어 결합각·모양 판정에 써라.", "f": "B2", "rk": 959, "d": 28, "rh": 9, "pre": ["CH1-173"], "tr": "전자쌍이 다 같을 것 같아, 공유(결합) 전자쌍과 고립 전자쌍이 다르다는 게 빠진다.", "an": "공유(결합) 전자쌍과 고립 전자쌍은 다르다.", "rd": "결합에 쓰인 공유 전자쌍과 안 쓰인 고립 전자쌍은 다르다.", "tf": "결합에 안 쓰인 전자쌍은? (고립/비공유)"}, "CH1-192": {"n": "전자쌍 배치", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "전자쌍 수에 따른 기본 배치 각도(2개 180°·3개 120°·4개 약 109.5°)를 잘못 짝지은 경우다. 이 각도-개수 대응이 흔들리면 모든 분자의 골격 각도가 어긋난다.", "fx": "전자쌍 수와 기본 각도를 '2개 180°, 3개 120°, 4개 약 109.5°'로 짝지어 못 박는다. 영역 수를 세어 골격 각도를 바로 떠올리는 연습을 하라.", "f": "B2", "rk": 964, "d": 29, "rh": 19, "pre": ["CH1-190"], "tr": "전자쌍 수와 각도가 막막해, 2개 180°·3개 120°·4개 약 109.5°라는 짝이 빠진다.", "an": "영역 2개 180°·3개 120°·4개 약 109.5°다.", "rd": "영역이 멀어지는 각이 2개 180°, 3개 120°, 4개 약 109.5°다.", "tf": "전자 영역 4개의 각도는? (약 109.5°)"}, "CH1-193": {"n": "전자쌍 각도", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "전자쌍 배치에 맞는 입체 이름(직선형·평면 삼각형·정사면체)을 잘못 붙인 경우다. 배치와 이름의 대응이 흔들리면 분자 구조를 말로 옮기지 못한다.", "fx": "전자쌍 배치의 입체 이름을 '직선형·평면 삼각형·정사면체'로 짝지어 못 박는다. 영역 수에서 이름을 바로 떠올려 구조를 말로 옮겨라.", "f": "B2", "rk": 969, "d": 30, "rh": 14, "pre": ["CH1-192"], "tr": "배치와 이름이 막막해, 직선형·평면 삼각형·정사면체라는 이름이 빠진다.", "an": "직선형·평면 삼각형·정사면체다.", "rd": "각도에 맞춰 직선형·평면 삼각형·정사면체로 펼친다.", "tf": "전자 영역 3개의 골격은? (평면 삼각형)"}, "CH1-194": {"n": "다중결합 취급", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "이중·삼중 결합을 여러 방향으로 세고, VSEPR에서는 하나의 전자 영역(한 방향)으로 묶는다는 점을 놓친 경우다. 이걸 놓치면 CO₂처럼 다중 결합이 있는 분자의 모양을 잘못 잡는다.", "fx": "'이중·삼중 결합도 VSEPR에선 하나의 전자 영역(한 방향)으로 묶는다'를 못 박는다. CO₂를 영역 2개로 세어 직선형이 나옴을 확인하라.", "f": "B2", "rk": 965, "d": 29, "rh": 0, "pre": ["CH1-190", "CH1-173"], "tr": "이중·삼중을 여러 방향으로 셀 것 같아, VSEPR에선 하나의 전자 영역으로 묶는다는 게 빠진다.", "an": "VSEPR에선 이중·삼중을 하나의 전자 영역으로 묶는다.", "rd": "이중·삼중은 한 방향에 묶여 있어 하나의 전자 영역으로 센다.", "tf": "이중결합은 전자 영역 몇 개로 세나? (1)"}, "CH1-195": {"n": "분자 모양", "c": "ch1", "u": "Ⅱ-6a", "t": "A", "dx": "분자 모양을 전자쌍 배치 그대로 보고, 비공유 전자쌍이 있으면 모양이 달라진다는 점을 놓친 경우다. 전자쌍 배치와 분자 모양을 같은 것으로 보면 굽은형·삼각뿔 같은 실제 모양과 극성 판단이 어긋난다.", "fx": "'전자쌍 배치와 분자 모양은 다르다, 비공유 전자쌍이 있으면 모양이 달라진다'를 못 박는다. 전자 배치는 정사면체라도 비공유 전자쌍이 있으면 굽은형·삼각뿔이 됨을 직접 그려라.", "f": "B2", "rk": 975, "d": 31, "rh": 11, "pre": ["CH1-193"], "tr": "전자쌍 배치가 곧 분자 모양 같아, 비공유 전자쌍이 있으면 모양이 달라진다는 게 빠진다.", "an": "비공유 전자쌍이 있으면 전자쌍 배치와 분자 모양이 달라진다.", "rd": "비공유 전자쌍이 있으면 자리가 비어 전자쌍 배치와 분자 모양이 달라진다.", "tf": "비공유쌍이 있으면 분자 모양과 전자쌍 배치는? (다름)"}, "CH1-196": {"n": "분자 루이스 구조", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "분자의 루이스 구조에서 공유 전자쌍과 결합 상대를 잘못 그린 경우다. 루이스 구조가 틀어지면 거기서 읽는 전자쌍 수와 분자 모양이 통째로 어긋난다.", "fx": "루이스 구조를 '공유 전자쌍과 결합 상대를 정확히 그리는 것'으로 못 박는다. 옥텟을 맞춰 구조를 그린 뒤 거기서 전자쌍 수와 모양을 읽어라.", "f": "D3", "rk": 966, "d": 29, "rh": 0, "pre": ["CH1-191"], "tr": "루이스 구조를 막 그릴 것 같아, 공유 전자쌍과 결합 상대를 정확히 그린다는 게 흐려진다.", "an": "공유 전자쌍과 결합 상대를 정확히 그린다.", "rd": "공유 전자쌍과 결합 상대를 정확히 그려야 영역 수가 나온다.", "tf": "모양을 보려면 무엇부터? (루이스 구조)"}, "CH1-197": {"n": "비공유 전자쌍", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "중심 원자의 전자쌍 중 결합에 안 쓰인 비공유 전자쌍 수를 잘못 센 경우다(전자쌍 4개 중 1개냐 2개냐). 비공유 전자쌍 수가 어긋나면 결합각과 모양이 함께 틀어진다.", "fx": "중심 원자의 '결합에 안 쓰인 비공유 전자쌍 수'를 정확히 센다(전자쌍 4개 중 1개냐 2개냐). 이 수로 결합각·모양이 함께 정해짐을 확인하라.", "f": "D3", "rk": 967, "d": 29, "rh": 7, "pre": ["CH1-191"], "tr": "비공유 전자쌍 수가 막연해, 전자쌍 4개 중 몇 개냐를 정확히 센다는 게 흔들린다.", "an": "전자쌍 4개 중 비공유가 몇 개인지 정확히 센다.", "rd": "전체 전자쌍에서 결합에 쓰인 것을 빼면 비공유 전자쌍 수다.", "tf": "전체 전자쌍에서 결합쌍을 빼면? (비공유쌍)"}, "CH1-198": {"n": "결합각", "c": "ch1", "u": "Ⅱ-6a", "t": "B", "dx": "비공유 전자쌍의 반발로 결합각이 이상값보다 작아진다는 점을 놓친 경우다. 정사면체 109.5°에서 비공유 전자쌍 수만큼 각이 좁아진다는 감각이 없으면 결합각 문제가 어긋난다.", "fx": "'비공유 전자쌍의 반발로 결합각이 이상값보다 작아진다'를 못 박는다. 정사면체 109.5°에서 비공유 전자쌍 수만큼 각이 좁아짐을 NH₃·H₂O로 확인하라.", "f": "B3", "rk": 976, "d": 31, "rh": 1, "pre": ["CH1-197", "CH1-193"], "tr": "결합각이 이상값 그대로일 것 같아, 비공유 전자쌍 반발로 작아진다는 게 빠진다.", "an": "비공유쌍 반발로 결합각이 이상값보다 작아진다.", "rd": "비공유쌍이 더 세게 밀어 결합각이 이상값보다 작아진다.", "tf": "비공유쌍이 있으면 결합각은? (작아짐)"}, "CH1-199": {"n": "비공유 전자쌍 반발", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "비공유 전자쌍이 한 원자에만 매여 더 넓게 퍼져 공유 전자쌍보다 강하게 반발한다는 점을 놓친 경우다. 이 반발의 세기 차가 약하면 결합각이 왜 좁아지는지 근거가 사라진다.", "fx": "'비공유 전자쌍은 한 원자에만 매여 더 넓게 퍼져 공유 전자쌍보다 강하게 반발'함을 못 박는다. 이 세기 차가 결합각을 좁히는 근거임을 짚어라.", "f": "B3", "rk": 970, "d": 30, "rh": 2, "pre": ["CH1-197"], "tr": "비공유쌍도 똑같이 밀 것 같아, 한 원자에만 매여 더 퍼져 세게 민다는 게 빠진다.", "an": "비공유쌍은 한 원자에만 매여 더 퍼져 세게 민다.", "rd": "비공유쌍은 한 원자에만 묶여 더 퍼진다. 그래서 더 세게 민다.", "tf": "비공유쌍이 더 세게 미는 이유는? (한 원자에만 묶임)"}, "CH1-200": {"n": "결합각 비교", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "비공유 전자쌍이 많을수록 결합각이 더 작아진다는 비교를 놓친 경우다(CH₄ > NH₃ > H₂O). 이 순서를 못 잡으면 비슷한 분자들의 결합각 대소를 가리지 못한다.", "fx": "'비공유 전자쌍이 많을수록 결합각이 더 작음'을 못 박는다. CH₄ > NH₃ > H₂O 순으로 결합각을 늘어놓아 대소를 직접 가려라.", "f": "C1", "rk": 980, "d": 32, "rh": 0, "pre": ["CH1-198", "CH1-199"], "tr": "결합각 비교가 막막해, 비공유쌍 많을수록 더 작아진다(CH₄>NH₃>H₂O)는 게 빠진다.", "an": "비공유쌍 많을수록 더 작다: CH₄>NH₃>H₂O.", "rd": "비공유쌍이 많을수록 더 좁힌다. 그래서 CH₄>NH₃>H₂O다.", "tf": "CH₄, NH₃, H₂O 중 결합각이 가장 작은 건? (H₂O)"}, "CH1-201": {"n": "결합각 원인", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "결합각이 작아지는 원인을 비공유 전자쌍이 공유 전자쌍을 더 세게 밀어서라고 짚지 못한 경우다. 원인이 흐리면 결합각 변화를 설명하는 문제에서 막힌다.", "fx": "결합각이 좁아지는 원인을 '비공유 전자쌍이 공유 전자쌍을 더 세게 밀어서'로 못 박는다. 이 원인으로 결합각 변화 문제를 설명하라.", "f": "B3", "rk": 977, "d": 31, "rh": 0, "pre": ["CH1-199"], "tr": "결합각이 왜 작아지는지 막막해, 비공유쌍이 공유쌍을 더 세게 밀어서라는 게 빠진다.", "an": "비공유쌍이 공유쌍을 더 세게 밀어 각이 작아진다.", "rd": "비공유쌍이 공유쌍보다 세게 밀어 각이 작아진다.", "tf": "결합각이 작아지는 이유는? (비공유쌍 반발)"}, "CH1-202": {"n": "옥텟 규칙", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "대부분의 원자가 결합으로 최외각 전자 8개(옥텟, 수소는 헬륨처럼 2개)를 채운다는 규칙을 놓친 경우다. 옥텟이 약하면 루이스 구조와 결합 수를 정하는 기준이 사라진다.", "fx": "옥텟을 '대부분의 원자가 결합으로 최외각 8개(수소는 2개)를 채움'으로 못 박는다. 이를 루이스 구조와 결합 수를 정하는 기준으로 삼아라.", "f": "B2", "rk": 675, "d": 6, "rh": 0, "pre": ["CH1-012"], "tr": "옥텟이 막연해, 대부분 결합으로 최외각 8개(수소는 2개)를 채운다는 게 흐려진다.", "an": "대부분 결합으로 최외각 8개(수소는 2개)를 채운다.", "rd": "대부분 결합으로 바깥 8전자(수소는 2)를 채워 안정해진다.", "tf": "결합으로 채우는 바깥 전자(수소 제외)는? (8)"}, "CH1-203": {"n": "분자 모양 결정", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "분자 모양이 공유 전자쌍만이 아니라 비공유 전자쌍까지 함께 정해진다는 점을 놓친 경우다(질량은 모양과 무관). 비공유 전자쌍을 빼고 모양을 잡으면 실제 구조·극성이 어긋난다.", "fx": "분자 모양을 '공유 전자쌍과 비공유 전자쌍을 함께 보고 정함(질량 무관)'으로 못 박는다. 비공유 전자쌍을 빼지 말고 모양·극성을 잡아라.", "f": "A4", "rk": 981, "d": 32, "rh": 0, "pre": ["CH1-195", "CH1-197"], "tr": "분자 모양이 공유쌍만으로 정해질 것 같아, 비공유쌍까지 함께 정한다(질량 무관)는 게 빠진다.", "an": "공유쌍과 비공유쌍이 함께 모양을 정한다.", "rd": "공유쌍과 비공유쌍이 함께 반발해 모양을 정한다.", "tf": "분자 모양을 정하는 두 전자쌍은? (공유와 비공유)"}, "CH1-204": {"n": "정사면체", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "전자쌍 4개가 모두 결합이면 정사면체로 3차원 대칭을 이룬다는 점을 놓친 경우다. 이 대칭 구조를 못 잡으면 CH₄ 같은 분자가 왜 무극성인지로 이어지지 못한다.", "fx": "'전자쌍 4개가 모두 결합이면 정사면체로 3차원 대칭'임을 못 박는다. 이 대칭이 CH₄가 무극성인 까닭으로 이어짐을 짚어라.", "f": "B2", "rk": 971, "d": 30, "rh": 0, "pre": ["CH1-192"], "tr": "전자쌍 4개가 평면일 것 같아, 모두 결합이면 정사면체로 3차원 대칭이라는 게 빠진다.", "an": "전자쌍 4개가 모두 결합이면 평면이 아니라 정사면체다.", "rd": "전자쌍 4개가 평면이면 반발이 크다. 사면체로 3차원으로 펼쳐야 최소다.", "tf": "전자쌍 4개가 다 결합이면 모양은? (정사면체)"}, "CH1-205": {"n": "다중 결합", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "공유 전자쌍 수로 단일·이중·삼중 결합을 가리는 게 흔들린 경우다. 결합 차수를 잘못 세면 결합 길이·세기와 VSEPR 영역 수가 어긋난다.", "fx": "단일·이중·삼중 결합을 '공유 전자쌍 수'로 가린다. 결합 차수를 바로 세어 결합 길이·세기와 VSEPR 영역 수에 써라.", "f": "B2", "rk": 960, "d": 28, "rh": 0, "pre": ["CH1-173"], "tr": "결합이 다 같을 것 같아, 공유 전자쌍 수로 단일·이중·삼중이 갈린다는 게 빠진다.", "an": "공유 전자쌍 수로 단일·이중·삼중이다.", "rd": "공유 전자쌍 수로 단일·이중·삼중이 갈린다.", "tf": "공유 전자쌍 3쌍인 결합은? (삼중)"}, "CH1-263": {"n": "고립 전자쌍", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "고립(비공유) 전자쌍이 한 원자에만 속하고 분자 모양·결합각을 바꾼다는 점을 놓친 경우다. 고립 전자쌍의 역할이 약하면 실제 분자 모양과 결합각을 잘못 잡는다.", "fx": "고립(비공유) 전자쌍을 '한 원자에만 속하고 분자 모양·결합각을 바꾼다'로 못 박는다. 고립 전자쌍을 세어 실제 모양과 결합각을 잡아라.", "f": "B2", "rk": 974, "d": 30, "rh": 0, "pre": ["CH1-197"], "tr": "고립 전자쌍이 막연해, 한 원자에만 속하고 모양·결합각을 바꾼다는 게 빠진다.", "an": "고립 전자쌍은 한 원자에만 속해 모양·결합각을 바꾼다.", "rd": "고립 전자쌍은 한 원자에만 속해 더 세게 밀어 모양·결합각을 바꾼다.", "tf": "고립 전자쌍이 영향을 주는 것은? (모양·결합각)"}, "CH1-206": {"n": "결합 극성", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "전기음성도 차이가 있어야 공유 전자쌍이 치우쳐 극성 결합이 되고, 차이가 없으면 무극성 결합이라는 점을 놓친 경우다. 결합 극성의 기준이 흐리면 분자 극성 판단으로 이어지지 못한다.", "fx": "'전기음성도 차이가 있으면 극성 결합, 없으면(같은 원자) 무극성 결합'을 못 박는다. 결합마다 전기음성도 차로 극성을 가려 분자 극성의 출발로 삼아라.", "f": "A3", "rk": 961, "d": 28, "rh": 12, "pre": ["CH1-185"], "tr": "결합 극성이 느낌 같아, 전기음성도 차이가 있어야 치우쳐 극성·없으면 무극성이라는 게 흐려진다.", "an": "전기음성도 차이가 있어야 극성: 없으면 무극성이다.", "rd": "전기음성도 차가 있어야 전자쌍이 치우쳐 극성이다. 없으면 무극성이다.", "tf": "전기음성도 차가 없으면 결합은? (무극성)"}, "CH1-207": {"n": "부분 전하", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "전기음성도가 큰 쪽(예: Cl)으로 전자쌍이 치우쳐 그쪽이 부분 음전하를 띤다는 점을 놓친 경우다. 부분 전하의 방향이 흐리면 쌍극자 방향·분자 극성이 어긋난다.", "fx": "'전기음성도가 큰 쪽으로 전자쌍이 치우쳐 그쪽이 부분 음전하'임을 못 박는다. 부분 전하의 방향(쌍극자 방향)을 각 결합에 표시하라.", "f": "B3", "rk": 968, "d": 29, "rh": 4, "pre": ["CH1-206"], "tr": "부분 전하가 어디에 생길지 막막해, 전기음성도 큰 쪽(Cl 등)이 부분 음전하라는 게 빠진다.", "an": "전기음성도 큰 쪽이 부분 음전하다.", "rd": "전기음성도 큰 쪽이 전자를 당겨 부분 음전하가 된다.", "tf": "전기음성도 큰 쪽이 띠는 전하는? (부분 음전하)"}, "CH1-208": {"n": "쌍극자 모멘트", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "쌍극자 모멘트가 크기와 방향을 가진 벡터라 결합 쌍극자들이 합쳐지거나 상쇄된다는 점을 놓친 경우다. 벡터라는 점이 약하면 대칭 분자에서 쌍극자가 왜 사라지는지 설명하지 못한다.", "fx": "쌍극자 모멘트를 '크기와 방향을 가진 벡터라 결합 쌍극자들이 합쳐지거나 상쇄됨'으로 못 박는다. 대칭 분자에서 벡터가 상쇄돼 0이 됨을 화살표로 그려 확인하라.", "f": "B2", "rk": 972, "d": 30, "rh": 3, "pre": ["CH1-207"], "tr": "쌍극자가 그냥 크기 같아, 방향을 가진 벡터라 합쳐지거나 상쇄된다는 게 빠진다.", "an": "쌍극자는 방향 있는 벡터: 합쳐지거나 상쇄된다.", "rd": "쌍극자는 크기와 방향을 가진 벡터다. 그래서 합쳐지거나 상쇄된다.", "tf": "쌍극자는 크기만 있나 방향도 있나? (벡터: 방향도)"}, "CH1-209": {"n": "극성결합 vs 극성분자", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "극성 결합이 있으면 무조건 극성 분자라고 본 경우다. 결합이 극성이라도 대칭 구조면 쌍극자가 상쇄돼 무극성이 된다는 점(분자 모양까지 봐야 함)을 놓치면 CO₂ 같은 분자를 잘못 판정한다.", "fx": "'극성 결합이 있어도 대칭 구조면 쌍극자가 상쇄돼 무극성'임을 못 박는다(분자 모양까지 봐야 함). CO₂가 극성 결합인데 무극성 분자임을 직접 판정하라.", "f": "D1", "rk": 982, "d": 32, "rh": 6, "pre": ["CH1-206", "CH1-195"], "tr": "극성 결합이 있으면 극성 분자 같아, 모양에 따라 다르다는 게 빠진다.", "an": "극성 결합이 있어도 모양 따라 분자는 무극성일 수 있다.", "rd": "결합 쌍극자를 벡터로 더한다. 대칭이면 상쇄돼 무극성일 수 있다.", "tf": "극성 결합이 있어도 분자가 무극성일 수 있나? (있다: 대칭)"}, "CH1-210": {"n": "무극성 분자", "c": "ch1", "u": "Ⅱ-6b", "t": "A", "dx": "무극성 분자가 같은 원자라 전기음성도 차가 없거나, 극성 결합이라도 대칭 구조(직선·평면 삼각·정사면체)로 상쇄돼 생긴다는 두 길을 놓친 경우다. 이 둘이 약하면 분자 극성 판정이 통째로 어긋난다.", "fx": "무극성 분자를 '같은 원자라 전기음성도 차가 없거나, 극성 결합이라도 대칭 구조로 상쇄' 두 길로 못 박는다. 분자마다 어느 길인지 가려 극성을 판정하라.", "f": "A4", "rk": 984, "d": 33, "rh": 1, "pre": ["CH1-209", "CH1-208"], "tr": "무극성이 막연해, 전기음성도 차가 없거나 대칭 구조로 상쇄돼 생긴다는 두 길이 빠진다.", "an": "전기음성도 차가 없거나 대칭으로 상쇄돼 무극성: 두 가지 길이다.", "rd": "전기음성도 차가 없거나 대칭으로 상쇄되면 무극성이다. 두 길이 있다.", "tf": "무극성이 되는 두 경우는? (차 없음 또는 대칭 상쇄)"}, "CH1-211": {"n": "무극성 원인", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "결합 자체는 극성인데 방향이 반대라 상쇄돼 분자가 무극성이 된다는 메커니즘을 놓친 경우다(CO₂가 그 예). 이 상쇄 논리가 약하면 무극성의 까닭을 설명하지 못한다.", "fx": "'결합은 극성인데 방향이 반대라 상쇄돼 분자가 무극성'이라는 메커니즘을 못 박는다. CO₂의 두 결합 쌍극자가 반대로 상쇄됨을 그려 확인하라.", "f": "B3", "rk": 988, "d": 34, "rh": 0, "pre": ["CH1-210"], "tr": "결합이 극성인데 왜 무극성인지 막막해, 방향이 반대라 상쇄돼서(CO₂)라는 게 빠진다.", "an": "결합이 극성이라도 방향이 반대라 상쇄된다(CO₂).", "rd": "결합이 극성이라도 방향이 반대면 벡터합이 0이다. 그래서 무극성(CO₂)이다.", "tf": "CO₂가 무극성인 이유는? (대칭이라 상쇄)"}, "CH1-212": {"n": "극성 분자", "c": "ch1", "u": "Ⅱ-6b", "t": "B", "dx": "극성 분자가 전기음성도 차가 있고 굽은형·삼각뿔 같은 비대칭 구조라 쌍극자가 남아 생긴다는 점을 놓친 경우다. 비대칭이 극성을 만든다는 감각이 약하면 H₂O·NH₃의 극성을 못 짚는다.", "fx": "극성 분자를 '전기음성도 차가 있고 굽은형·삼각뿔 같은 비대칭 구조라 쌍극자가 남음'으로 못 박는다. H₂O·NH₃에서 쌍극자가 안 상쇄됨을 그려 극성을 짚어라.", "f": "A4", "rk": 985, "d": 33, "rh": 3, "pre": ["CH1-209"], "tr": "극성 분자가 막연해, 전기음성도 차가 있고 비대칭 구조라 쌍극자가 남아 생긴다는 게 빠진다.", "an": "전기음성도 차가 있고 비대칭이라 쌍극자가 남으면 극성이다.", "rd": "전기음성도 차가 있고 비대칭이면 쌍극자가 남아 극성이다.", "tf": "극성이 되려면? (전기음성도 차+비대칭)"}, "CH1-213": {"n": "극성 원인", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "비대칭 구조라 결합 쌍극자가 상쇄되지 못하고 남은 것이 분자 극성의 원인이라는 점을 놓친 경우다. 대칭이면 상쇄된다는 짝까지 잡아야 극성·무극성을 가른다.", "fx": "'비대칭 구조라 결합 쌍극자가 상쇄되지 못하고 남은 것이 분자 극성의 원인'임을 못 박는다. 대칭이면 상쇄된다는 짝까지 잡아 극성·무극성을 가려라.", "f": "B3", "rk": 989, "d": 34, "rh": 0, "pre": ["CH1-212"], "tr": "왜 극성인지 막막해, 비대칭이라 쌍극자가 상쇄 못 되고 남아서라는 게 빠진다.", "an": "비대칭이라 쌍극자가 상쇄 못 되고 남는다.", "rd": "비대칭이라 쌍극자가 상쇄 못 되고 남는다.", "tf": "쌍극자가 남는 이유는? (비대칭)"}, "CH1-214": {"n": "분자 극성 판단", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "분자 극성을 판단할 때 결합 극성과 분자 모양을 함께 봐야 한다는 점을 놓친 경우다. 한쪽만 보면 극성 결합인데 무극성 분자인 경우를 놓쳐 판정이 어긋난다.", "fx": "분자 극성을 '결합 극성과 분자 모양을 함께 보고' 판단한다. 한쪽만 보지 말고, 극성 결합이지만 무극성 분자인 경우를 놓치지 않게 둘 다 확인하라.", "f": "A4", "rk": 983, "d": 32, "rh": 2, "pre": ["CH1-206", "CH1-195"], "tr": "분자 극성을 한 가지로 판단할 것 같아, 결합 극성과 분자 모양을 함께 봐야 한다는 게 빠진다.", "an": "결합 극성과 분자 모양을 함께 봐야 한다.", "rd": "결합 극성과 분자 모양(대칭성)을 함께 봐야 한다.", "tf": "분자 극성을 보려면 무엇 둘? (결합 극성과 모양)"}, "CH1-215": {"n": "대칭과 극성", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "대칭 구조면 쌍극자가 상쇄돼 무극성, 비대칭이면 쌍극자가 남아 극성이라는 대응을 놓친 경우다. 이 대칭-극성 짝이 약하면 분자 극성을 빠르게 가리지 못한다.", "fx": "'대칭이면 상쇄돼 무극성, 비대칭이면 남아 극성'을 짝으로 못 박는다. 분자 모양의 대칭 여부로 극성을 빠르게 가리는 연습을 하라.", "f": "B2", "rk": 986, "d": 33, "rh": 0, "pre": ["CH1-214", "CH1-208"], "tr": "대칭·극성 관계가 막막해, 대칭이면 상쇄(무극성)·비대칭이면 남음(극성)이라는 대응이 빠진다.", "an": "대칭이면 상쇄(무극성), 비대칭이면 남음(극성)이다.", "rd": "대칭이면 벡터합이 0(무극성), 비대칭이면 남는다(극성).", "tf": "대칭 분자의 극성은? (무극성)"}, "CH1-216": {"n": "혼성 오비탈", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "전자 영역 수에 따라 혼성이 정해진다(영역 2개 sp·3개 sp²·4개 sp³)는 대응을 놓친 경우다. 영역 수와 혼성의 짝이 흔들리면 분자 구조를 혼성으로 설명하지 못한다.", "fx": "혼성을 '전자 영역 수에 따라 영역 2개 sp, 3개 sp², 4개 sp³'로 짝지어 못 박는다. 영역 수를 세어 혼성을 바로 정하는 연습을 하라.", "f": "B2", "rk": 973, "d": 30, "rh": 2, "pre": ["CH1-192"], "tr": "혼성이 임의 같아, 전자 영역 수에 따라(2 sp·3 sp²·4 sp³) 정해진다는 게 빠진다.", "an": "전자 영역 수에 따라 sp·sp²·sp³다.", "rd": "전자 영역 수에 맞게 오비탈을 섞는다. 2·3·4개면 sp·sp²·sp³다.", "tf": "전자 영역 3개의 혼성은? (sp²)"}, "CH1-217": {"n": "혼성 적용", "c": "ch1", "u": "Ⅱ-6b", "t": "A", "dx": "중심 원자의 전자 영역 수를 잘못 세 혼성을 잘못 정한 경우다. 영역 수가 어긋나면 sp·sp²·sp³ 판정과 그에 따른 구조가 통째로 틀어진다.", "fx": "중심 원자의 '전자 영역 수를 정확히 세어' 혼성을 정한다. 비공유 전자쌍까지 포함해 영역을 세고 sp·sp²·sp³와 구조를 잡아라.", "f": "D3", "rk": 978, "d": 31, "rh": 0, "pre": ["CH1-216"], "tr": "혼성을 어떻게 정하는지 막막해, 전자 영역 수를 세서라는 게 흔들린다.", "an": "전자 영역 수를 세어 혼성을 정한다.", "rd": "중심 원자의 전자 영역 수를 세어 혼성을 정한다.", "tf": "혼성을 정하려면 무엇을 세나? (전자 영역 수)"}, "CH1-218": {"n": "혼성 수", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "혼성 오비탈 수가 전자 영역(전자쌍) 수와 같고 비공유 전자쌍도 센다는 점을 놓친 경우다. 비공유 전자쌍을 빼고 세면 혼성 수가 어긋난다.", "fx": "'혼성 오비탈 수 = 전자 영역(전자쌍) 수, 비공유 전자쌍도 셈'을 못 박는다. 비공유 전자쌍을 빼지 말고 영역을 세어 혼성 수를 맞춰라.", "f": "D3", "rk": 979, "d": 31, "rh": 0, "pre": ["CH1-216", "CH1-197"], "tr": "혼성 수가 막연해, 전자 영역(전자쌍) 수와 같고 비공유쌍도 센다는 게 빠진다.", "an": "혼성 수=전자 영역 수, 비공유쌍도 센다.", "rd": "혼성 수=전자 영역 수다. 비공유쌍도 한 영역으로 센다.", "tf": "혼성 수에 비공유쌍을 세나? (센다)"}, "CH1-219": {"n": "극성과 용해", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "극성은 극성끼리, 무극성은 무극성끼리 잘 녹는다(비슷한 극성끼리 섞임)는 점을 놓친 경우다. 이 규칙이 약하면 화학Ⅱ 용해성 단원의 핵심 판단이 막힌다.", "fx": "'극성은 극성끼리, 무극성은 무극성끼리 잘 녹는다(비슷한 극성끼리 섞임)'를 못 박는다. 이 규칙을 화학Ⅱ 용해성 판단의 핵심으로 삼아라.", "f": "B2", "rk": 987, "d": 33, "rh": 0, "pre": ["CH1-214"], "tr": "무엇이 무엇에 녹는지 막막해, 비슷한 극성끼리 섞인다는 게 빠진다.", "an": "비슷한 극성끼리 녹는다.", "rd": "비슷한 분자 간 힘이라야 섞인다. 그래서 비슷한 극성끼리 녹는다.", "tf": "극성은 어떤 용매에 녹나? (극성)"}, "CH1-220": {"n": "전기장 배열", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "극성 분자가 부분 전하를 가져 전기장 속에서 정렬된다는 점을 놓친 경우다. 무극성 분자는 부분 전하가 없어 정렬되지 않는다는 대비까지 잡아야 극성의 의미가 산다.", "fx": "'극성 분자는 부분 전하가 있어 전기장 속에서 정렬되고, 무극성은 안 됨'을 짝으로 못 박는다. 이 대비로 극성의 의미(부분 전하)를 새겨라.", "f": "B2", "rk": 990, "d": 34, "rh": 0, "pre": ["CH1-212"], "tr": "극성 분자가 전기장에서 가만있을 것 같아, 부분 전하로 정렬한다는 게 빠진다.", "an": "극성 분자는 전기장에서 부분 전하로 정렬한다.", "rd": "극성 분자는 부분 전하가 있어 전기장에서 정렬한다.", "tf": "극성 분자가 전기장에서? (정렬)"}, "CH1-221": {"n": "극성과 끓는점", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "극성 분자가 쌍극자-쌍극자 인력 때문에 비슷한 크기의 무극성 분자보다 끓는점이 높다는 점을 놓친 경우다. 이 연결이 약하면 화학Ⅱ 분자 간 힘·끓는점 비교가 흔들린다.", "fx": "'극성 분자는 쌍극자-쌍극자 인력 때문에 비슷한 크기의 무극성보다 끓는점이 높음'을 못 박는다. 이 연결을 화학Ⅱ 분자 간 힘·끓는점 비교의 바탕으로 삼아라.", "f": "B3", "rk": 991, "d": 34, "rh": 0, "pre": ["CH1-212"], "tr": "극성·무극성 끓는점이 비슷할 것 같아, 극성이 쌍극자 인력으로 더 높다는 게 빠진다.", "an": "극성이 쌍극자 인력으로 무극성보다 끓는점이 높다.", "rd": "극성은 쌍극자 인력이 더해져 끓는점이 높다.", "tf": "크기 같으면 극성이 끓는점이 더? (높음)"}, "CH1-222": {"n": "분산력", "c": "ch1", "u": "Ⅱ-6b", "t": "C", "dx": "분산력이 무극성 분자에도 작용하고(순간 쌍극자 때문) 전자가 많을수록 커진다는 점을 놓친 경우다. 분산력의 보편성이 약하면 화학Ⅱ 분자 간 힘의 출발이 흔들린다.", "fx": "'분산력은 무극성 분자에도 작용하고(순간 쌍극자) 전자가 많을수록 큼'을 못 박는다. 분산력의 보편성을 화학Ⅱ 분자 간 힘의 출발로 새겨라.", "f": "B2", "rk": 6, "d": 0, "rh": 0, "pre": [], "tr": "분산력이 극성에만 작용할 것 같아, 무극성에도(순간 쌍극자) 작용하고 전자 많을수록 크다는 게 빠진다.", "an": "무극성에도(순간 쌍극자) 작용하고 전자 많을수록 크다.", "rd": "무극성에도 순간 쌍극자로 분산력이 있고, 전자가 많을수록 크다.", "tf": "무극성에도 작용하는 힘은? (분산력)"}, "CH1-248": {"n": "가역 반응", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "가역 반응이 정반응과 역반응이 모두 일어나 완전히 한쪽으로 끝나지 않는 반응이라는 점을 놓친 경우다. 양방향이 함께 간다는 전제가 없으면 동적 평형 개념 자체가 서지 못한다.", "fx": "가역 반응을 '정반응과 역반응이 모두 일어나 완전히 한쪽으로 끝나지 않는 반응'으로 못 박는다. 양방향이 함께 감을 동적 평형 개념의 전제로 삼아라.", "f": "B2", "rk": 433, "d": 4, "rh": 86, "pre": ["CH1-055"], "tr": "반응이 한쪽으로 끝날 것 같아, 정·역이 모두 일어나 완전히 안 끝나는(가역) 게 빠진다.", "an": "정·역이 모두 일어나 완전히 안 끝나는 반응: 양방향이다.", "rd": "정·역이 다 일어나 한쪽으로 완전히 안 끝난다. 그래서 가역이다.", "tf": "정·역이 다 일어나는 반응은? (가역)"}, "CH1-249": {"n": "동적 평형 개념", "c": "ch1", "u": "Ⅲ-1", "t": "B", "dx": "동적 평형을 반응이 멈춘 정적 상태로 본 경우다. 정반응과 역반응이 같은 속도로 계속 일어나 겉보기만 멈춰 보인다는 점을 놓치면 평형의 모든 해석이 어긋난다.", "fx": "동적 평형을 '멈춘 게 아니라 정반응·역반응이 같은 속도로 계속 일어나 겉보기만 멈춰 보이는 상태'로 못 박는다. '멈춤'으로 그리지 않도록 두 화살표가 계속 도는 그림을 새겨라.", "f": "E1", "rk": 602, "d": 5, "rh": 84, "pre": ["CH1-248"], "tr": "농도가 안 변하면 멈춘 것 같아, 동적이라 계속 일어난다는 게 빠진다.", "an": "농도가 안 변해도 반응은 계속: 동적이다.", "rd": "정·역 속도가 같아 농도가 안 변할 뿐 반응은 계속된다. 그래서 동적이다.", "tf": "평형에서 반응이 멈췄나? (아니다: 동적)"}, "CH1-250": {"n": "동적 평형 정의", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "동적 평형에서 정반응·역반응 속도가 같고 두 반응이 계속 일어난다는 정의를 놓친 경우다. '속도가 같다'와 '계속 일어난다'를 함께 잡지 못하면 평형을 멈춤으로 오해한다.", "fx": "동적 평형을 '정·역 속도가 같고, 두 반응이 계속 일어남' 두 조건으로 못 박는다. '같다'와 '계속'을 함께 잡아 평형을 멈춤으로 오해하지 않게 하라.", "f": "E1", "rk": 677, "d": 6, "rh": 82, "pre": ["CH1-249"], "tr": "평형이 정지 같아, 정·역 속도가 같고 두 반응이 계속된다는 정의가 빠진다.", "an": "정·역 속도가 같고 두 반응이 계속되는 상태: 양방향 에스컬레이터다.", "rd": "정·역 속도가 같아진 상태다. 두 반응이 멈추지 않고 계속된다.", "tf": "동적 평형은 무엇이 같아진 상태? (정·역 속도)"}, "CH1-251": {"n": "평형 농도", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "평형에서 농도가 일정할 뿐 반응물과 생성물 농도가 서로 같은 건 아니라는 점을 놓친 경우다. '일정'과 '같음'을 혼동하면 평형 상수 해석이 어긋난다.", "fx": "'평형에서 농도는 일정할 뿐, 반응물·생성물 농도가 서로 같은 건 아님'을 못 박는다. '일정'과 '같음'을 갈라 평형 상수 해석에 써라.", "f": "B2", "rk": 716, "d": 7, "rh": 0, "pre": ["CH1-250"], "tr": "평형이면 반응물·생성물 농도가 같을 것 같아, 일정할 뿐 서로 같진 않다는 게 빠진다.", "an": "평형이어도 반응물·생성물 농도가 같진 않다: 일정할 뿐이다.", "rd": "평형은 농도가 일정할 뿐이다. 반응물과 생성물 농도가 같다는 뜻은 아니다.", "tf": "평형에서 반응물과 생성물 농도가 같나? (아니다: 일정할 뿐)"}, "CH1-252": {"n": "평형의 겉보기", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "농도가 변하지 않아 멈춘 것처럼 보여도 실제로는 동적 상태라는 점을 놓친 경우다. 겉보기와 실제를 가르지 못하면 평형을 정적인 것으로 잘못 그린다.", "fx": "'농도가 안 변해 멈춘 듯 보여도 실제로는 동적 상태'임을 못 박는다. 겉보기와 실제를 갈라 평형을 정적으로 그리지 마라.", "f": "E1", "rk": 717, "d": 7, "rh": 0, "pre": ["CH1-250"], "tr": "안 변하니 멈춘 것 같아, 겉보기일 뿐 동적 상태라는 게 빠진다.", "an": "안 변하니 멈춘 듯 보일 뿐 동적 상태다.", "rd": "농도가 안 변해 멈춘 듯 보일 뿐 실제는 동적이다.", "tf": "농도가 안 변하니 멈춘 듯 보이나 실제는? (동적)"}, "CH1-253": {"n": "평형 상수 식", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "평형 상수가 (생성물 농도 곱)/(반응물 농도 곱)이고 계수가 지수로 올라간다는 식을 놓친 경우다. 생성물을 분자에, 계수를 지수로 두는 형식이 흔들리면 K 계산이 통째로 어긋난다.", "fx": "평형 상수를 '(생성물 농도 곱)/(반응물 농도 곱), 계수는 지수로'로 못 박는다. 한 반응식으로 생성물을 분자에, 계수를 지수로 올려 K 식을 직접 써라.", "f": "D3", "rk": 718, "d": 7, "rh": 10, "pre": ["CH1-250"], "tr": "평형 상수 식이 막막해, (생성물 곱)/(반응물 곱)이고 계수가 지수라는 게 빠진다.", "an": "(생성물 곱)/(반응물 곱), 계수가 지수다.", "rd": "(생성물 곱)/(반응물 곱)에 계수를 지수로 한 값이 일정하다.", "tf": "평형상수에서 생성물은 어디에? (분자)"}, "CH1-254": {"n": "평형 상수 해석", "c": "ch1", "u": "Ⅲ-1", "t": "B", "dx": "평형 상수가 크면 분자(생성물) 쪽이 많아 정반응으로 치우친 평형, 작으면 반응물 쪽이라는 해석을 놓친 경우다. K의 대소로 평형 위치를 읽지 못하면 반응이 어디로 치우쳤는지 못 가린다.", "fx": "'K가 크면 생성물 쪽으로 치우친 평형, 작으면 반응물 쪽'으로 못 박는다. K 값의 대소로 평형이 어디로 치우쳤는지 읽는 연습을 하라.", "f": "C1", "rk": 743, "d": 8, "rh": 0, "pre": ["CH1-253"], "tr": "K 값이 그냥 숫자 같아, 크면 생성물·작으면 반응물 쪽이라는 게 빠진다.", "an": "K가 크면 생성물 쪽, 작으면 반응물 쪽이다.", "rd": "K가 크면 생성물 쪽, 작으면 반응물 쪽으로 치우친 것이다.", "tf": "K가 크면 어느 쪽? (생성물)"}, "CH1-255": {"n": "평형 상수와 온도", "c": "ch1", "u": "Ⅲ-1", "t": "B", "dx": "평형 상수가 온도에만 의존하고 농도·촉매로는 변하지 않는다는 점을 놓친 경우다. K를 바꾸는 게 온도뿐이라는 점이 약하면 르샤틀리에에서 평형 이동과 K 변화를 뒤섞는다.", "fx": "'평형 상수는 온도에만 의존하고 농도·촉매로는 안 변함'을 못 박는다. K를 바꾸는 게 온도뿐임을, 르샤틀리에에서 이동과 K 변화를 안 섞이게 새겨라.", "f": "A3", "rk": 744, "d": 8, "rh": 4, "pre": ["CH1-253"], "tr": "농도·촉매가 K를 바꿀 것 같아, 온도에만 의존한다는 게 빠진다.", "an": "농도·촉매가 아니라 온도만 K를 바꾼다.", "rd": "K는 정·역 속도상수의 비다. 그래서 온도에만 의존한다.", "tf": "K를 바꾸는 건? (온도)"}, "CH1-256": {"n": "반응 지수", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "반응 지수 Q가 평형 전 임의 시점의 농도로 계산하는, K와 같은 꼴의 값이라는 점을 놓친 경우다. Q가 농도에 따라 변하는 '현재 상태값'이라는 감각이 없으면 방향 판단으로 못 잇는다.", "fx": "반응 지수 Q를 '평형 전 임의 시점의 농도로 계산하는, K와 같은 꼴의 현재 상태값'으로 못 박는다. Q가 농도 따라 변함을 잡아 방향 판단의 재료로 삼아라.", "f": "B2", "rk": 745, "d": 8, "rh": 2, "pre": ["CH1-253"], "tr": "Q가 막연해, 평형 전 임의 시점 농도로 계산하는 K와 같은 꼴이라는 게 빠진다.", "an": "Q는 평형 전 임의 시점 농도로 계산하는 K와 같은 꼴이다.", "rd": "Q는 평형식에 임의 시점 농도를 넣은 값이다. K와 같은 꼴이다.", "tf": "임의 시점 농도로 계산한 값은? (Q)"}, "CH1-257": {"n": "반응 지수 방향", "c": "ch1", "u": "Ⅲ-1", "t": "A", "dx": "Q와 K를 비교해 진행 방향을 정하는 규칙을 놓친 경우다. Q<K면 생성물이 부족해 정반응, Q>K면 생성물이 과해 역반응으로 간다는 판단이 흔들리면 평형이 아닌 상태의 거동을 못 읽는다.", "fx": "'Q<K면 생성물이 부족해 정반응, Q>K면 생성물이 과해 역반응'으로 방향을 못 박는다. Q와 K를 견줘 평형이 아닌 상태가 어디로 갈지 판단하라.", "f": "C1", "rk": 772, "d": 9, "rh": 1, "pre": ["CH1-256"], "tr": "Q로 방향을 어떻게 아는지 막막해, K와 비교해 정한다는 게 빠진다.", "an": "Q를 K와 비교해 진행 방향을 안다.", "rd": "Q를 K와 비교해 어느 쪽으로 반응할지 안다.", "tf": "Q와 K를 비교해 무엇을? (진행 방향)"}, "CH1-258": {"n": "비가역 반응", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "비가역 반응이 역반응이 거의 없어 한 방향으로만 진행하는 반응이라는 점을 놓친 경우다. 가역과의 대비가 약하면 어떤 반응이 평형에 이르는지 가리지 못한다.", "fx": "비가역 반응을 '역반응이 거의 없어 한 방향으로만 진행'으로 못 박는다. 가역과 대비해 어떤 반응이 평형에 이르는지 가려라.", "f": "B2", "rk": 603, "d": 5, "rh": 0, "pre": ["CH1-248"], "tr": "비가역이 막연해, 역반응이 거의 없어 한 방향으로만 간다는 게 빠진다.", "an": "역반응이 거의 없어 한 방향으로만 간다.", "rd": "역반응이 거의 없어 한 방향으로만 간다.", "tf": "한 방향으로만 가는 반응은? (비가역)"}, "CH1-259": {"n": "평형 도달", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "처음엔 정반응이 빠르다가 역반응이 점점 빨라져 두 속도가 같아질 때 평형에 이른다는 과정을 놓친 경우다. 이 속도 변화 그림이 약하면 평형이 왜 동적인지 이해하지 못한다.", "fx": "평형 도달을 '처음엔 정반응이 빠르다가 역반응이 점점 빨라져 두 속도가 같아질 때'로 못 박는다. 이 속도 변화 그림으로 평형이 동적인 까닭을 새겨라.", "f": "B2", "rk": 719, "d": 7, "rh": 0, "pre": ["CH1-250"], "tr": "평형에 어떻게 이르는지 막막해, 정반응이 빠르다 역반응이 빨라져 같아질 때라는 게 빠진다.", "an": "정반응이 빠르다가 역반응이 빨라져 같아질 때 평형이다.", "rd": "처음엔 정반응이 빠르다 역반응이 빨라져 같아지면 평형이다.", "tf": "언제 평형인가? (정·역 속도가 같을 때)"}, "CH1-260": {"n": "평형 상수 단위", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "평형 상수를 보통 무차원으로 다룬다는 점을 놓친 경우다. 단위 처리가 흔들리면 계수에 따라 단위가 달라지는 줄 알고 K를 잘못 표기한다.", "fx": "평형 상수를 '보통 무차원으로 다룸'으로 못 박는다. 계수에 따라 단위가 달라진다고 오해하지 않도록 K를 단위 없이 표기하라.", "f": "D3", "rk": 746, "d": 8, "rh": 0, "pre": ["CH1-253"], "tr": "K에 단위가 붙을 것 같아, 보통 무차원으로 다룬다는 게 빠진다.", "an": "K는 보통 무차원으로 다룬다.", "rd": "활동도로 다루면 무차원이라 K는 보통 단위가 없다.", "tf": "평형상수는 보통 단위가? (없음)"}, "CH1-261": {"n": "반응 지수 활용", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "반응 지수를 쓸 때 K와의 대소 비교로 진행 방향을 판단한다는 점을 놓친 경우다. Q만 구하고 K와 견주지 않으면 방향 예측이 안 선다.", "fx": "'반응 지수는 K와의 대소 비교로 진행 방향을 판단'함을 못 박는다. Q만 구하지 말고 반드시 K와 견줘 방향을 정하라.", "f": "C1", "rk": 801, "d": 10, "rh": 0, "pre": ["CH1-257"], "tr": "Q를 어떻게 쓰는지 막막해, K와 대소 비교로 방향을 판단한다는 게 빠진다.", "an": "Q와 K의 대소로 방향을 판단한다.", "rd": "Q와 K의 대소로 진행 방향을 판단한다.", "tf": "Q와 K의 대소로 무엇을 판단? (방향)"}, "CH1-262": {"n": "정·역반응 열", "c": "ch1", "u": "Ⅲ-1", "t": "C", "dx": "정반응이 발열이면 역반응은 흡열로 에너지 출입 방향이 반대라는 점을 놓친 경우다. 이 대칭이 약하면 온도 변화에 따른 평형 이동 방향을 못 잡는다.", "fx": "'정반응이 발열이면 역반응은 흡열로 에너지 출입이 반대'임을 못 박는다. 이 대칭으로 온도 변화에 따른 평형 이동 방향을 잡아라.", "f": "A1", "rk": 678, "d": 6, "rh": 0, "pre": ["CH1-236", "CH1-249"], "tr": "정·역반응 열이 같은 방향일 것 같아, 정반응 발열이면 역반응 흡열이라는 게 빠진다.", "an": "정반응이 발열이면 역반응은 흡열이다.", "rd": "정반응이 발열이면 거꾸로인 역반응은 흡열이다.", "tf": "정반응이 흡열이면 역반응은? (발열)"}, "CH1-264": {"n": "르샤틀리에 정의", "c": "ch1", "u": "Ⅲ-2", "t": "C", "dx": "르샤틀리에 원리가 평형에 가한 변화를 '완화하는' 방향으로 평형이 이동한다는 점을 놓친 경우다. 변화에 거스르는 쪽으로 간다는 핵심이 흔들리면 모든 이동 예측이 어긋난다.", "fx": "르샤틀리에를 '평형에 가한 변화를 완화하는(거스르는) 방향으로 이동'으로 못 박는다. 이 한 줄을 농도·온도·압력 변화 모두에 적용하는 출발로 삼아라.", "f": "A1", "rk": 720, "d": 7, "rh": 11, "pre": ["CH1-250"], "tr": "평형이 어떻게 반응할지 막막해, 가한 변화를 \"완화하는\" 방향으로 이동한다는 게 빠진다.", "an": "가한 변화를 완화하는 쪽으로 이동: 찌르면 피하는 청개구리다.", "rd": "평형이 깨지면 그 변화를 줄이는 쪽으로 이동해 다시 균형을 찾는다.", "tf": "평형이 변화를 받으면 어느 쪽으로? (완화하는 쪽)"}, "CH1-265": {"n": "농도 변화", "c": "ch1", "u": "Ⅲ-2", "t": "C", "dx": "반응물을 넣으면 그것을 소모하려 정반응, 생성물을 넣으면 역반응으로 이동한다는 점을 놓친 경우다. '넣은 것을 줄이는 쪽'이라는 방향이 약하면 농도 변화 문제가 어긋난다.", "fx": "'반응물을 넣으면 정반응, 생성물을 넣으면 역반응(넣은 것을 줄이는 쪽)'으로 못 박는다. 무엇을 더했는지 보고 이동 방향을 바로 정하라.", "f": "A1", "rk": 747, "d": 8, "rh": 1, "pre": ["CH1-264"], "tr": "농도 바꾸면 어디로 갈지 헷갈려, 반응물 넣으면 정반응·생성물 넣으면 역반응이라는 게 흔들린다.", "an": "반응물 넣으면 정반응, 생성물 넣으면 역반응이다.", "rd": "반응물을 넣으면 정반응, 생성물을 넣으면 역반응으로 이동한다.", "tf": "생성물을 넣으면 어느 방향? (역반응)"}, "CH1-266": {"n": "온도 변화", "c": "ch1", "u": "Ⅲ-2", "t": "B", "dx": "온도를 올리면 흡열 반응 쪽, 내리면 발열 반응 쪽으로 이동한다는 점을 놓친 경우다(가한 열을 흡수하거나 보충하는 쪽). 이 방향이 흔들리면 온도 문제에서 평형 이동을 잘못 잡는다.", "fx": "'온도를 올리면 흡열 반응 쪽, 내리면 발열 반응 쪽(가한 열을 흡수·보충하는 쪽)'으로 못 박는다. 반응의 발열·흡열을 보고 온도 이동을 잡아라.", "f": "A1", "rk": 748, "d": 8, "rh": 3, "pre": ["CH1-264", "CH1-226"], "tr": "온도 바꾸면 어디로 갈지 헷갈려, 올리면 흡열 쪽·내리면 발열 쪽이라는 게 흔들린다.", "an": "올리면 흡열 쪽, 내리면 발열 쪽이다.", "rd": "온도를 올리면 흡열 쪽, 내리면 발열 쪽으로 이동한다.", "tf": "온도를 내리면 어느 쪽으로? (발열 쪽)"}, "CH1-267": {"n": "온도와 평형 상수", "c": "ch1", "u": "Ⅲ-2", "t": "C", "dx": "온도 변화만 평형 상수를 바꾸고 그래서 평형이 이동한다는 점을 놓친 경우다. 농도·압력은 K를 안 바꾼다는 대비가 약하면 K 변화와 단순 이동을 혼동한다.", "fx": "'온도 변화만 평형 상수를 바꿔 평형이 이동'함을 못 박는다. 농도·압력은 K를 안 바꿈을 대비해 K 변화와 단순 이동을 갈라라.", "f": "A3", "rk": 773, "d": 9, "rh": 0, "pre": ["CH1-255", "CH1-266"], "tr": "평형 이동에 K가 늘 변할 것 같아, 온도 변화만 K를 바꿔 이동한다는 게 흐려진다.", "an": "온도 변화만 K를 바꿔 이동한다.", "rd": "온도만 K를 바꾼다. 그래서 온도 변화는 이동과 함께 K도 바꾼다.", "tf": "온도 변화는 이동과 함께 무엇도 바꾸나? (K)"}, "CH1-268": {"n": "압력 변화", "c": "ch1", "u": "Ⅲ-2", "t": "A", "dx": "압력을 높이면 기체 분자 수가 적은 쪽으로 평형이 이동하고, 양변 분자 수가 같으면 이동하지 않는다는 점을 놓친 경우다. 압력 변화를 완화할 차이(분자 수 차)가 있어야 이동한다는 점이 약하면 압력 문제가 어긋난다.", "fx": "'압력을 높이면 기체 분자 수가 적은 쪽으로 이동, 양변 분자 수가 같으면 안 움직임'을 못 박는다. 양변 기체 계수를 세어 이동 여부를 정하라.", "f": "A1", "rk": 749, "d": 8, "rh": 3, "pre": ["CH1-264"], "tr": "압력 올리면 어디로 갈지 헷갈려, 기체 분자 수 적은 쪽(같으면 이동 없음)이라는 게 흔들린다.", "an": "압력 올리면 기체 분자 수 적은 쪽: 같으면 이동 없음이다.", "rd": "압력을 올리면 기체 분자 수가 적은 쪽으로 이동한다. 같으면 이동이 없다.", "tf": "압력을 높이면 기체 몰수 어느 쪽? (적은 쪽)"}, "CH1-269": {"n": "비활성 기체와 평형", "c": "ch1", "u": "Ⅲ-2", "t": "C", "dx": "부피 고정에서 비활성 기체를 넣어도 각 반응 기체의 농도(분압)가 그대로라 평형이 이동하지 않는다는 점을 놓친 경우다. 전체 압력만 보고 이동을 판단하면 이 함정에 걸린다.", "fx": "'부피 고정에서 비활성 기체를 넣어도 반응 기체의 분압이 그대로라 평형이 이동하지 않음'을 못 박는다. 전체 압력만 보고 판단하는 함정에 걸리지 마라.", "f": "A3", "rk": 774, "d": 9, "rh": 0, "pre": ["CH1-268"], "tr": "기체 넣으면 이동할 것 같아, 부피 고정에서 농도(분압)가 그대로라 이동 없다는 게 의외다.", "an": "부피 고정에서 기체를 넣어도 농도(분압)가 그대로라 이동 없음이다.", "rd": "부피 고정에서 불활성 기체를 넣어도 반응 기체 농도가 그대로다. 그래서 이동이 없다.", "tf": "부피 고정에서 불활성 기체를 넣으면? (이동 없음)"}, "CH1-270": {"n": "촉매", "c": "ch1", "u": "Ⅲ-2", "t": "A", "dx": "촉매가 정·역반응을 똑같이 빠르게 해 평형 도달만 앞당기고 평형 위치는 안 바꾼다는 점을 놓친 경우다. 촉매가 K나 평형 위치를 바꾼다고 오해하면 평형과 속도를 뒤섞는다.", "fx": "'촉매는 정·역반응을 똑같이 빠르게 해 평형 도달만 앞당기고 위치는 안 바꿈'을 못 박는다. 촉매가 K나 평형 위치를 바꾼다고 오해하지 마라.", "f": "A3", "rk": 750, "d": 8, "rh": 0, "pre": ["CH1-264"], "tr": "촉매가 평형을 옮길 것 같아, 도달만 앞당기고 위치는 안 바꾼다는 게 빠진다.", "an": "촉매는 도달만 앞당기고 평형 위치는 안 바꾼다.", "rd": "촉매는 정·역을 똑같이 빠르게 한다. 그래서 도달만 앞당기고 위치는 그대로다.", "tf": "촉매가 평형 위치를 바꾸나? (안 바꿈)"}, "CH1-271": {"n": "압력 적용", "c": "ch1", "u": "Ⅲ-2", "t": "C", "dx": "압력 변화에 따른 이동을 양변 기체 분자 수 비교로 정하는 적용이 흔들린 경우다. 고압이면 분자 수가 적은 쪽이 유리하다는 셈이 약하면 문제 적용이 어긋난다.", "fx": "압력 이동을 '양변 기체 분자 수 비교'로 적용한다. 고압이면 분자 수가 적은 쪽이 유리함을 계수로 셈해 문제에 써라.", "f": "A1", "rk": 775, "d": 9, "rh": 0, "pre": ["CH1-268"], "tr": "압력 이동을 어떻게 정하는지 막막해, 양변 기체 분자 수 비교라는 게 빠진다.", "an": "양변 기체 분자 수를 비교해 압력 이동을 정한다.", "rd": "양변의 기체 분자 수를 비교해 적은 쪽으로 압력 이동을 정한다.", "tf": "압력 이동을 정하려면 무엇을 비교? (양변 기체 몰수)"}, "CH1-272": {"n": "온도 적용", "c": "ch1", "u": "Ⅲ-2", "t": "C", "dx": "온도 변화에 따른 이동을 반응의 발열·흡열 방향으로 정하는 적용이 흔들린 경우다. 발열 정반응이면 저온이 유리하다는 판단이 약하면 온도 문제 적용이 어긋난다.", "fx": "온도 이동을 '반응의 발열·흡열 방향'으로 적용한다. 발열 정반응이면 저온이 유리함을 판단해 문제에 써라.", "f": "A1", "rk": 776, "d": 9, "rh": 0, "pre": ["CH1-266"], "tr": "온도 이동을 어떻게 정하는지 막막해, 발열·흡열 방향이라는 게 빠진다.", "an": "발열·흡열 방향으로 온도 이동을 정한다.", "rd": "발열·흡열 방향을 따져 온도 이동을 정한다.", "tf": "온도 이동을 정하려면? (발열·흡열 방향)"}, "CH1-273": {"n": "평형 이동과 K", "c": "ch1", "u": "Ⅲ-2", "t": "C", "dx": "농도·압력 변화는 평형을 이동시켜도 평형 상수는 그대로이고 온도만 K를 바꾼다는 점을 놓친 경우다. 이 원칙이 약하면 이동이 일어났으니 K도 변했다고 잘못 본다.", "fx": "'농도·압력 변화는 평형을 이동시켜도 K는 그대로, 온도만 K를 바꿈'을 못 박는다. 이동이 일어났으니 K도 변했다고 잘못 보지 마라.", "f": "A3", "rk": 777, "d": 9, "rh": 0, "pre": ["CH1-255", "CH1-264"], "tr": "농도·압력 이동에 K가 변할 것 같아, K는 그대로이고 온도만 바꾼다는 게 빠진다.", "an": "농도·압력 이동에 K는 그대로, 온도만 바꾼다.", "rd": "농도·압력 이동은 K를 안 바꾼다. 오직 온도만 바꾼다.", "tf": "농도·압력 이동은 K를? (안 바꿈)"}, "CH1-274": {"n": "르샤틀리에 활용", "c": "ch1", "u": "Ⅲ-2", "t": "C", "dx": "여러 조건 변화에 르샤틀리에 원리를 적용해 이동 방향을 종합 판단하는 게 흔들린 경우다. '변화를 완화하는 쪽'이라는 한 줄로 농도·온도·압력을 꿰지 못하면 복합 문제가 막힌다.", "fx": "여러 조건 변화를 '변화를 완화하는 쪽'이라는 한 줄로 종합 판단한다. 농도·온도·압력을 이 한 원리로 꿰어 복합 문제를 풀어라.", "f": "A1", "rk": 778, "d": 9, "rh": 0, "pre": ["CH1-265", "CH1-266", "CH1-268"], "tr": "여러 조건을 한꺼번에 판단하기 막막해, 르샤틀리에로 종합한다는 게 흔들린다.", "an": "여러 조건을 르샤틀리에로 종합한다.", "rd": "여러 조건을 변화를 줄이는 방향 원리로 종합한다.", "tf": "여러 조건을 무슨 원리로 종합? (르샤틀리에)"}, "CH1-275": {"n": "평형 재도달", "c": "ch1", "u": "Ⅲ-2", "t": "C", "dx": "평형이 깨진 뒤 정·역반응 속도가 다시 같아지며 새 동적 평형에 이른다는 점을 놓친 경우다. 이 재형성 그림이 약하면 평형 이동을 '한 번 가고 끝'으로 오해한다.", "fx": "'평형이 깨진 뒤 정·역 속도가 다시 같아지며 새 동적 평형에 이름'을 못 박는다. 이동을 '한 번 가고 끝'이 아니라 새 평형의 재형성으로 그려라.", "f": "E1", "rk": 751, "d": 8, "rh": 0, "pre": ["CH1-264", "CH1-250"], "tr": "평형이 깨지면 끝일 것 같아, 다시 같아지며 새 동적 평형에 이른다는 게 빠진다.", "an": "평형이 깨져도 다시 같아지며 새 동적 평형에 이른다.", "rd": "평형이 깨져도 정·역이 다시 같아지며 새 평형에 이른다.", "tf": "평형이 깨지면? (새 평형에 도달)"}, "CH1-276": {"n": "증발·응축 평형", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "밀폐 용기에서 증발과 응축이 같은 속도로 일어나는 동적 평형 상태라는 점을 놓친 경우다. 이 평형이 약하면 증기압이 무엇의 압력인지 정의가 흐려진다.", "fx": "'밀폐 용기에서 증발과 응축이 같은 속도로 일어나는 동적 평형'을 못 박는다. 이 평형이 증기압의 정의(무엇의 압력인지)임을 짚어라.", "f": "E1", "rk": 721, "d": 7, "rh": 7, "pre": ["CH1-250"], "tr": "밀폐에서 증발만 일어날 것 같아, 증발·응축이 같은 속도인 동적 평형이라는 게 빠진다.", "an": "밀폐에서 증발·응축이 같은 속도인 동적 평형이다.", "rd": "밀폐에서 증발과 응축 속도가 같아진 동적 평형이다.", "tf": "밀폐 용기의 증발·응축이 같아지면? (동적 평형)"}, "CH1-277": {"n": "증기압", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "증기압이 액체 양과 무관한 세기 성질이고 온도가 높을수록·휘발성이 클수록 커진다는 점을 놓친 경우다. 증기압의 성격이 흐리면 끓는점·휘발성 비교가 어긋난다.", "fx": "증기압을 '액체 양과 무관한 세기 성질이고 온도가 높을수록·휘발성이 클수록 큼'으로 못 박는다. 양에 안 변함을 잡아 끓는점·휘발성 비교에 써라.", "f": "A3", "rk": 752, "d": 8, "rh": 3, "pre": ["CH1-276"], "tr": "증기압이 액체 양에 따를 것 같아, 양과 무관한 세기 성질이고 온도·휘발성에 따른다는 게 빠진다.", "an": "증기압은 양과 무관한 세기 성질, 온도·휘발성에 따른다.", "rd": "증기압은 양과 무관한 세기 성질이고 온도·휘발성으로 정해진다.", "tf": "증기압은 양에 의존하나? (안 함: 세기 성질)"}, "CH1-278": {"n": "증기압과 온도", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "온도가 높을수록 증발이 활발해져 증기압이 커진다는 점을 놓친 경우다. 온도와 증기압의 방향이 흔들리면 증기압 곡선·끓음 조건 해석이 어긋난다.", "fx": "'온도가 높을수록 증발이 활발해져 증기압이 커짐'을 못 박는다. 이 방향으로 증기압 곡선과 끓음 조건을 해석하라.", "f": "A1", "rk": 779, "d": 9, "rh": 0, "pre": ["CH1-277"], "tr": "온도가 증기압과 무관할 것 같아, 높을수록 증발이 활발해 커진다는 게 빠진다.", "an": "온도 높을수록 증발이 활발해 증기압이 크다.", "rd": "온도가 높으면 증발이 활발해 증기압이 크다.", "tf": "온도가 높으면 증기압은? (큼)"}, "CH1-279": {"n": "증기압 평형", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "증기압이 증발 속도와 응축 속도가 같아진 동적 평형에서의 증기 압력이라는 점을 놓친 경우다. 평형과 증기압의 연결이 약하면 증기압을 단순 '증발한 양'으로 오해한다.", "fx": "증기압을 '증발 속도와 응축 속도가 같아진 동적 평형에서의 증기 압력'으로 못 박는다. 단순 '증발한 양'이 아님을 잡아라.", "f": "E1", "rk": 753, "d": 8, "rh": 0, "pre": ["CH1-276"], "tr": "증기압이 막연해, 증발·응축 속도가 같아진 동적 평형의 압력이라는 게 빠진다.", "an": "증발·응축 속도가 같아진 동적 평형의 압력이다.", "rd": "증발·응축 속도가 같아진 동적 평형에서의 압력이다.", "tf": "증발·응축이 같아진 압력은? (증기압)"}, "CH1-280": {"n": "끓음", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "끓음이 증기압이 외부 압력과 같아질 때 액체 내부 전체에서 기화가 일어나는 현상이라는 점을 놓친 경우다. 표면 증발과의 차이가 약하면 끓는점 조건을 못 잡는다.", "fx": "끓음을 '증기압이 외부 압력과 같아질 때 액체 내부 전체에서 기화가 일어나는 현상'으로 못 박는다. 표면 증발과의 차이로 끓는점 조건을 잡아라.", "f": "B2", "rk": 780, "d": 9, "rh": 1, "pre": ["CH1-277"], "tr": "끓음이 막연해, 증기압이 외부 압력과 같아질 때 내부에서 기화하는 현상이라는 게 빠진다.", "an": "증기압이 외부 압력과 같아질 때 내부에서 기화하는 현상이다.", "rd": "증기압이 외부 압력과 같아지면 내부에서도 기화한다. 그것이 끓음이다.", "tf": "증기압이 외부 압력과 같아지면? (끓음)"}, "CH1-281": {"n": "끓는점과 압력", "c": "ch1", "u": "Ⅲ-3", "t": "B", "dx": "외부 압력이 낮으면 더 낮은 증기압에서도 같아져 더 낮은 온도에서 끓는다는 점을 놓친 경우다. 압력과 끓는점의 관계가 흔들리면 높은 산에서 끓는점이 낮은 까닭을 못 짚는다.", "fx": "'외부 압력이 낮으면 더 낮은 증기압에서도 같아져 더 낮은 온도에서 끓음'을 못 박는다. 높은 산에서 끓는점이 낮은 까닭을 이로 설명하라.", "f": "A1", "rk": 802, "d": 10, "rh": 0, "pre": ["CH1-280"], "tr": "끓는점이 고정값 같아, 외부 압력이 낮으면 더 낮은 온도에서 끓는다는 게 빠진다.", "an": "외부 압력이 낮으면 더 낮은 온도에 끓는다.", "rd": "외부 압력이 낮으면 더 낮은 증기압에서 같아져 끓는점이 낮다.", "tf": "외부 압력이 낮으면 끓는점은? (낮음)"}, "CH1-282": {"n": "승화", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "승화가 액체를 거치지 않고 고체에서 바로 기체로(또는 반대로) 변하는 상변화라는 점을 놓친 경우다. 이 경로가 약하면 드라이아이스 같은 예를 상변화로 분류하지 못한다.", "fx": "승화를 '액체를 거치지 않고 고체에서 바로 기체로(또는 반대로) 변하는 상변화'로 못 박는다. 드라이아이스를 예로 상변화로 분류하라.", "f": "B2", "rk": 754, "d": 8, "rh": 0, "pre": ["CH1-276"], "tr": "승화가 막연해, 고체에서 바로 기체로(또는 반대) 변하는 상변화라는 게 빠진다.", "an": "고체에서 바로 기체로(또는 반대) 변하는 상변화다.", "rd": "고체에서 바로 기체로(또는 반대) 변하는 상변화다.", "tf": "고체가 바로 기체로 변하는 건? (승화)"}, "CH1-283": {"n": "용해·석출 평형", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "포화 용액에서 용해와 석출이 같은 속도로 일어나는 동적 평형이라는 점을 놓친 경우다. 두 속도가 같다는 점이 약하면 포화 상태를 '더는 아무 일도 없는 상태'로 오해한다.", "fx": "'포화 용액에서 용해와 석출이 같은 속도로 일어나는 동적 평형'을 못 박는다. 두 속도가 같음을 잡아 포화를 '아무 일 없는 상태'로 오해하지 마라.", "f": "E1", "rk": 722, "d": 7, "rh": 9, "pre": ["CH1-250"], "tr": "포화에서 용해만 멈출 것 같아, 용해·석출이 같은 속도인 동적 평형이라는 게 빠진다.", "an": "포화에서 용해·석출이 같은 속도인 동적 평형이다.", "rd": "포화에서 용해와 석출 속도가 같아진 동적 평형이다.", "tf": "포화에서 용해·석출이 같아지면? (동적 평형)"}, "CH1-284": {"n": "포화 용액", "c": "ch1", "u": "Ⅲ-3", "t": "B", "dx": "포화 용액을 용해가 멈춘 상태로 보고, 용해와 석출이 같은 속도로 계속되는 동적 상태라는 점을 놓친 경우다. 이 동적 본질이 약하면 온도 변화에 따른 평형 이동을 설명하지 못한다.", "fx": "포화 용액을 '용해가 멈춘 게 아니라 용해·석출이 같은 속도로 계속되는 동적 상태'로 못 박는다. 이 동적 본질로 온도 변화에 따른 이동을 설명하라.", "f": "E1", "rk": 755, "d": 8, "rh": 2, "pre": ["CH1-283"], "tr": "포화면 용해가 멈춘 것 같아, 용해·석출이 같은 속도로 계속되는 동적 상태라는 게 빠진다.", "an": "포화면 용해·석출이 같은 속도로 계속되는 동적 상태다.", "rd": "포화는 용해·석출이 같은 속도로 계속되는 동적 상태다.", "tf": "용해·석출이 같은 속도인 용액은? (포화)"}, "CH1-285": {"n": "불포화 용액", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "불포화 용액이 아직 포화에 못 미쳐 용해가 우세하게 더 녹는 중인 상태라는 점을 놓친 경우다. 포화와의 대비가 약하면 용액 상태를 가리지 못한다.", "fx": "불포화 용액을 '아직 포화에 못 미쳐 용해가 우세하게 더 녹는 중'으로 못 박는다. 포화와 대비해 용액 상태를 가려라.", "f": "B2", "rk": 781, "d": 9, "rh": 0, "pre": ["CH1-284"], "tr": "불포화가 막연해, 아직 포화에 못 미쳐 용해가 우세하게 더 녹는 중이라는 게 빠진다.", "an": "아직 포화에 못 미쳐 더 녹는 중이다.", "rd": "아직 포화에 못 미쳐 용해가 우세해 더 녹는다.", "tf": "더 녹을 수 있는 용액은? (불포화)"}, "CH1-286": {"n": "과포화 용액", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "과포화 용액이 용해도를 넘게 녹은 불안정한 상태라 작은 자극에도 석출된다는 점을 놓친 경우다. 이 불안정성이 약하면 과포화를 그냥 진한 용액으로 오해한다.", "fx": "과포화 용액을 '용해도를 넘게 녹은 불안정한 상태라 작은 자극에도 석출됨'으로 못 박는다. 그냥 진한 용액으로 오해하지 마라.", "f": "B2", "rk": 782, "d": 9, "rh": 0, "pre": ["CH1-284"], "tr": "과포화가 막연해, 용해도를 넘게 녹은 불안정한 상태라 자극에 석출된다는 게 빠진다.", "an": "용해도를 넘게 녹은 불안정한 상태: 자극에 석출한다.", "rd": "용해도를 넘게 녹은 불안정한 상태라 자극에 석출한다.", "tf": "용해도를 넘게 녹은 용액은? (과포화)"}, "CH1-287": {"n": "용해도", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "용해도가 일정 온도에서 녹을 수 있는 최대량이고 물질·온도마다 다르다는 점을 놓친 경우다. 용해도의 정의가 흐리면 용해도 곡선·포화 판정이 어긋난다.", "fx": "용해도를 '일정 온도에서 녹을 수 있는 최대량이고 물질·온도마다 다름'으로 못 박는다. 이 정의로 용해도 곡선·포화 판정을 잡아라.", "f": "B2", "rk": 756, "d": 8, "rh": 3, "pre": ["CH1-283"], "tr": "용해도가 막연해, 일정 온도에서 녹는 최대량이고 물질·온도마다 다르다는 게 빠진다.", "an": "일정 온도에서 녹는 최대량, 물질·온도마다 다르다.", "rd": "일정 온도에서 녹는 최대량이다. 물질·온도마다 다르다.", "tf": "일정 온도에서 녹는 최대량은? (용해도)"}, "CH1-288": {"n": "고체 용해도와 온도", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "대부분의 고체가 온도가 높을수록 용해도가 커진다는 경향을 놓친 경우다. 이 경향이 약하면 온도를 내릴 때 석출되는(재결정) 현상을 설명하지 못한다.", "fx": "'대부분의 고체는 온도가 높을수록 용해도가 커짐'을 못 박는다. 온도를 내릴 때 석출되는(재결정) 현상을 이로 설명하라.", "f": "A1", "rk": 783, "d": 9, "rh": 0, "pre": ["CH1-287"], "tr": "고체 용해도가 온도와 무관할 것 같아, 대부분 높을수록 커진다는 게 빠진다.", "an": "대부분 온도 높을수록 커진다.", "rd": "고체는 대부분 온도가 높을수록 더 녹는다.", "tf": "고체는 온도가 높으면 보통 더? (녹음)"}, "CH1-289": {"n": "기체 용해도와 온도", "c": "ch1", "u": "Ⅲ-3", "t": "B", "dx": "기체는 온도가 높을수록 입자가 빠져나가 용해도가 작아진다는(고체와 반대) 점을 놓친 경우다. 이 반대 경향이 약하면 따뜻한 탄산음료가 김 빠지는 까닭, 화학Ⅱ 용해 단원이 흔들린다.", "fx": "'기체는 온도가 높을수록 빠져나가 용해도가 작아짐(고체와 반대)'을 못 박는다. 따뜻한 탄산음료가 김 빠지는 까닭을 이로 설명하고 화학Ⅱ로 이어라.", "f": "A1", "rk": 784, "d": 9, "rh": 0, "pre": ["CH1-287"], "tr": "기체도 온도 높으면 더 녹을 것 같아, 빠져나가 덜 녹는다(고체와 반대)는 게 의외다.", "an": "온도 높을수록 빠져나가 덜 녹는다: 고체와 반대다.", "rd": "기체 용해는 발열이라 온도가 높으면 덜 녹는다. 고체와 반대다.", "tf": "기체는 온도가 높으면? (덜 녹음: 고체와 반대)"}, "CH1-290": {"n": "기체 용해도와 압력", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "기체 용해도가 압력이 높을수록 커진다는(헨리 법칙) 점을 놓친 경우다. 이 압력 의존이 약하면 화학Ⅱ 헨리 법칙으로 이어지지 못한다.", "fx": "'기체 용해도는 압력이 높을수록 커짐(헨리 법칙)'을 못 박는다. 이 압력 의존을 화학Ⅱ 헨리 법칙의 출발로 삼아라.", "f": "A1", "rk": 785, "d": 9, "rh": 0, "pre": ["CH1-287"], "tr": "기체 용해도가 압력과 무관할 것 같아, 높을수록 커진다(헨리)는 게 빠진다.", "an": "압력 높을수록 커진다(헨리).", "rd": "압력이 높으면 기체가 액면을 더 때려 더 녹는다(헨리).", "tf": "기체는 압력이 높으면? (더 녹음)"}, "CH1-291": {"n": "용해 평형", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "용해 평형에서 용해와 석출 속도가 같아 겉보기 농도가 일정한 동적 상태라는 점을 놓친 경우다. 이 평형의 동적 본질이 약하면 포화 용액의 거동을 잘못 그린다.", "fx": "용해 평형을 '용해와 석출 속도가 같아 겉보기 농도가 일정한 동적 상태'로 못 박는다. 이 동적 본질로 포화 용액의 거동을 그려라.", "f": "E1", "rk": 757, "d": 8, "rh": 0, "pre": ["CH1-283"], "tr": "용해 평형이 막연해, 용해·석출 속도가 같아 농도 일정한 동적 상태라는 게 빠진다.", "an": "용해·석출 속도가 같아 농도 일정한 동적 상태다.", "rd": "용해·석출 속도가 같아 농도가 일정한 동적 상태다.", "tf": "용해·석출이 같아 농도 일정한 상태는? (용해 평형)"}, "CH1-292": {"n": "동적 평형 예", "c": "ch1", "u": "Ⅲ-3", "t": "C", "dx": "증발·응축, 용해·석출 같은 동적 평형의 예가 멈춘 게 아니라 양방향이 계속 일어나는 상태라는 점을 놓친 경우다. 여러 예를 멈춤으로 오해하면 동적 평형 개념 전체가 흔들린다.", "fx": "증발·응축, 용해·석출 같은 예를 '멈춘 게 아니라 양방향이 계속 일어나는 동적 평형'으로 못 박는다. 여러 예를 멈춤으로 오해하지 않게 양방향 그림을 새겨라.", "f": "E1", "rk": 758, "d": 8, "rh": 0, "pre": ["CH1-276", "CH1-283"], "tr": "평형 예가 멈춘 상태 같아, 증발·응축, 용해·석출이 양방향 계속이라는 게 빠진다.", "an": "증발·응축, 용해·석출이 양방향 계속이다.", "rd": "증발·응축, 용해·석출이 양방향으로 계속되는 예다.", "tf": "증발·응축, 용해·석출은 무슨 평형? (동적)"}, "CH1-294": {"n": "용액 구성", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "용질(녹는 물질)과 용매(녹이는 물질)의 역할을 가르지 못한 경우다. 둘을 뒤바꾸면 농도 정의의 분자·분모가 어긋나 모든 농도 계산이 틀어진다.", "fx": "'용질 = 녹는 물질, 용매 = 녹이는 물질'로 역할을 갈라 둔다. 소금물에서 소금(용질)·물(용매)을 짚어 농도 정의의 분자·분모를 맞춰라.", "f": "B2", "rk": 152, "d": 2, "rh": 20, "pre": ["CH1-019"], "tr": "용질·용매가 헷갈려, 녹는 물질(용질)과 녹이는 물질(용매) 역할이 섞인다.", "an": "녹는 물질이 용질, 녹이는 물질이 용매다.", "rd": "녹는 물질이 용질, 녹이는 물질이 용매다.", "tf": "녹이는 물질은 용질인가 용매인가? (용매)"}, "CH1-295": {"n": "퍼센트 농도", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "퍼센트 농도의 분모가 용질이 아니라 용액 전체 질량이라는 점을 놓친 경우다. 분모를 잘못 잡으면 질량 백분율이 어긋나 농도 환산이 막힌다.", "fx": "퍼센트 농도를 '용액 전체 질량에 대한 용질 질량의 백분율'로 못 박는다. 분모가 용질이 아니라 용액임을 확인하고 질량 백분율을 계산하라.", "f": "D3", "rk": 279, "d": 3, "rh": 2, "pre": ["CH1-294"], "tr": "퍼센트 분모가 용질일 것 같아, 용액 전체 질량이라는 게 흔들린다.", "an": "분모는 용액 전체 질량: 용질이 아니다.", "rd": "용액 전체에서 용질이 차지하는 질량 비율이다. 분모는 용액이다.", "tf": "퍼센트 농도의 분모는? (용액 질량)"}, "CH1-296": {"n": "몰농도 정의", "c": "ch1", "u": "Ⅳ-1", "t": "B", "dx": "몰농도가 용질의 질량이 아니라 몰수를, 용매가 아니라 용액 부피로 나눈 값이라는 정의를 놓친 경우다. 이 정의가 흔들리면 몰농도 계산의 분자·분모가 모두 어긋난다.", "fx": "몰농도를 '용질 몰수 ÷ 용액 부피'로 못 박는다(질량·용매가 아님). 분자에 몰수, 분모에 용액 부피를 두고 계산해 굳혀라.", "f": "D3", "rk": 280, "d": 3, "rh": 17, "pre": ["CH1-294", "CH1-039"], "tr": "몰농도가 질량을 용매로 나눈 것 같아, 몰수를 용액 부피로 나눈다는 게 흐려진다.", "an": "몰수를 용액 부피로 나눈 것: 용매가 아니다.", "rd": "몰농도=용질 몰수÷용액 부피다. 용매가 아니라 용액 부피다.", "tf": "몰농도의 분모는 용매인가 용액 부피인가? (용액 부피)"}, "CH1-297": {"n": "몰농도 단위", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "몰농도 단위가 용액 부피(L)당 몰수(mol/L)라는 점을 놓친 경우다. 단위 감각이 흐리면 질량 기준 농도와 섞어 쓴다.", "fx": "몰농도 단위를 '용액 부피(L)당 몰수(mol/L)'로 못 박는다. 단위로 질량 기준 농도와 안 섞이게 mol/L를 늘 붙여라.", "f": "D3", "rk": 434, "d": 4, "rh": 0, "pre": ["CH1-296"], "tr": "몰농도 단위가 막연해, 용액 부피(L)당 몰수(mol/L)라는 게 빠진다.", "an": "용액 부피(L)당 몰수(mol/L)다.", "rd": "용액 부피(L)당 몰수라 mol/L다.", "tf": "몰농도의 단위는? (mol/L)"}, "CH1-298": {"n": "몰농도 계산", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "몰농도를 (용질 몰수 ÷ 용액 부피)로 셈하는 게 흔들린 경우다. 어느 쪽을 나누는지 헷갈리면 농도 값이 뒤집힌다.", "fx": "몰농도를 '용질 몰수 ÷ 용액 부피'로 셈한다. 어느 쪽을 나누는지 헷갈리지 않게 분자·분모를 적고 계산하라.", "f": "D3", "rk": 435, "d": 4, "rh": 3, "pre": ["CH1-296"], "tr": "몰농도 계산이 막막해, (용질 몰수÷용액 부피)라는 게 빠진다.", "an": "몰농도=용질 몰수÷용액 부피다.", "rd": "용질 몰수를 용액 부피로 나눈다.", "tf": "몰농도=몰수를 무엇으로 나눔? (용액 부피)"}, "CH1-299": {"n": "용액 제조", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "정해진 몰농도 용액을 만들 때 용질을 녹인 뒤 용액의 최종 부피를 맞춘다는 절차를 놓친 경우다. 부피가 기준이라는 점이 약하면 농도가 맞지 않게 제조한다.", "fx": "용액 제조를 '용질을 녹인 뒤 용액의 최종 부피를 맞춤(부피가 기준)'으로 못 박는다. 부피 플라스크로 정해진 부피까지 채우는 절차를 따라가라.", "f": "D3", "rk": 436, "d": 4, "rh": 1, "pre": ["CH1-296"], "tr": "용매 부피를 맞출 것 같아, 용질을 녹인 뒤 용액의 최종 부피를 맞춘다는 게 빠진다.", "an": "용질을 녹인 뒤 용액의 최종 부피를 맞춘다.", "rd": "용질을 녹인 뒤 용액의 최종 부피를 맞춘다.", "tf": "용질을 녹인 뒤 무엇을 맞추나? (최종 부피)"}, "CH1-300": {"n": "몰농도 기준 부피", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "몰농도의 기준이 용매가 아니라 용질까지 포함한 용액 전체 부피라는 점을 놓친 경우다. 용매 부피로 잡으면 농도가 어긋난다.", "fx": "몰농도의 기준을 '용매가 아니라 용질까지 포함한 용액 전체 부피'로 못 박는다. 용매 부피로 잡지 않도록 '용액 부피'를 분모로 써라.", "f": "D3", "rk": 437, "d": 4, "rh": 2, "pre": ["CH1-296"], "tr": "기준이 용매 부피일 것 같아, 용질까지 포함한 용액 전체 부피라는 게 흔들린다.", "an": "기준은 용질까지 포함한 용액 전체 부피다.", "rd": "기준은 용질까지 포함한 용액 전체 부피다.", "tf": "몰농도 기준은 무슨 부피? (용액 전체)"}, "CH1-301": {"n": "희석", "c": "ch1", "u": "Ⅳ-1", "t": "B", "dx": "희석이 용매만 더해 부피를 늘리는 것이고 용질 몰수는 그대로라는 점을 놓친 경우다. 몰수 보존을 놓치면 희석 후 농도를 못 구한다.", "fx": "희석을 '용매만 더해 부피를 늘리고 용질 몰수는 그대로'로 못 박는다. 몰수 보존을 잡아 희석 후 농도를 구하라.", "f": "D3", "rk": 438, "d": 4, "rh": 2, "pre": ["CH1-296"], "tr": "희석이 막연해, 용매만 더해 부피를 늘리고 용질 몰수는 그대로라는 게 빠진다.", "an": "용매만 더해 부피를 늘리고 용질 몰수는 그대로다.", "rd": "용매만 더해 부피를 늘리니 용질 몰수는 그대로이고 농도만 준다.", "tf": "희석하면 용질 몰수는? (그대로)"}, "CH1-302": {"n": "희석 계산", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "희석에서 용질 몰수가 보존돼 (처음 농도 × 부피 = 나중 농도 × 부피)라는 관계를 놓친 경우다. 이 식이 약하면 희석 농도 계산이 어긋난다.", "fx": "희석을 '처음 농도 × 부피 = 나중 농도 × 부피(용질 몰수 보존)'로 못 박는다. 이 식에 값을 넣어 희석 농도를 직접 구하라.", "f": "D3", "rk": 604, "d": 5, "rh": 0, "pre": ["CH1-301"], "tr": "희석 계산이 막막해, 용질 몰수 보존(처음 농도×부피=나중)이라는 게 빠진다.", "an": "처음 농도×부피=나중 농도×부피(용질 몰수 보존).", "rd": "용질 몰수가 보존되니 처음 농도×부피=나중 농도×부피다.", "tf": "희석에서 보존되는 것은? (용질 몰수)"}, "CH1-303": {"n": "농도 환산", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "농도 단위를 환산할 때 밀도가 질량과 부피를 잇는 다리라는 점을 놓친 경우다. 밀도를 빼먹으면 퍼센트 농도와 몰농도 사이 환산이 막힌다.", "fx": "농도 환산에서 '밀도가 질량과 부피를 잇는 다리'임을 못 박는다. 퍼센트 농도와 몰농도 사이를 밀도로 건너 환산하라.", "f": "D3", "rk": 439, "d": 4, "rh": 0, "pre": ["CH1-296", "CH1-295"], "tr": "농도 환산이 막막해, 밀도가 질량과 부피를 잇는 다리라는 게 빠진다.", "an": "밀도가 질량과 부피를 잇는 다리다.", "rd": "질량과 부피는 밀도로 잇는다.", "tf": "질량과 부피를 잇는 것은? (밀도)"}, "CH1-304": {"n": "몰농도와 온도", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "몰농도가 부피 기준이라 온도가 오르면 부피가 늘어 값이 작아진다는 점(용질 몰수는 그대로)을 놓친 경우다. 이걸 놓치면 온도가 다른 용액의 농도 비교가 어긋난다.", "fx": "'몰농도는 부피 기준이라 온도가 오르면 부피가 늘어 값이 작아짐(용질 몰수는 그대로)'을 못 박는다. 온도가 다른 용액을 비교할 때 이를 반영하라.", "f": "A3", "rk": 605, "d": 5, "rh": 0, "pre": ["CH1-300"], "tr": "몰농도가 온도와 무관할 것 같아, 부피 기준이라 온도 오르면 작아진다는 게 빠진다.", "an": "부피 기준이라 온도 오르면 작아진다.", "rd": "몰농도는 부피 기준이라 온도가 오르면 부피가 늘어 작아진다.", "tf": "몰농도는 온도가 오르면? (작아짐: 부피 늘음)"}, "CH1-305": {"n": "퍼센트 농도와 온도", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "퍼센트 농도가 질량 기준이라 온도에 무관하다는 점을 놓친 경우다. 몰농도와 달리 온도로 안 변한다는 대비가 약하면 농도 비교를 잘못한다.", "fx": "'퍼센트 농도는 질량 기준이라 온도에 무관'함을 못 박는다. 몰농도와 달리 온도로 안 변함을 대비해 농도 비교에 써라.", "f": "A3", "rk": 440, "d": 4, "rh": 0, "pre": ["CH1-295"], "tr": "퍼센트가 온도에 따를 것 같아, 질량 기준이라 무관하다는 게 빠진다.", "an": "질량 기준이라 온도에 무관하다.", "rd": "퍼센트는 질량 기준이라 온도와 무관하다.", "tf": "퍼센트 농도는 온도에 의존하나? (안 함)"}, "CH1-306": {"n": "몰수와 부피", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "같은 농도에서 용질 몰수가 용액 부피에 비례한다는 점을 놓친 경우다. 부피를 두 배로 하면 몰수도 두 배라는 감각이 약하면 양 계산이 어긋난다.", "fx": "'같은 농도에서 용질 몰수는 용액 부피에 비례'함을 못 박는다. 부피를 두 배로 하면 몰수도 두 배임을 잡아 양을 계산하라.", "f": "A2", "rk": 441, "d": 4, "rh": 0, "pre": ["CH1-296"], "tr": "몰수와 부피가 무관할 것 같아, 같은 농도면 비례한다는 게 빠진다.", "an": "같은 농도면 몰수가 부피에 비례한다.", "rd": "같은 농도면 몰수가 부피에 비례한다.", "tf": "같은 농도면 몰수는 부피에? (비례)"}, "CH1-307": {"n": "몰수 계산", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "용질 몰수를 (몰농도 × 부피)로 셈하는 게 흔들린 경우다. 곱으로 구한다는 점이 약하면 용액 속 용질 양을 못 구한다.", "fx": "용질 몰수를 '몰농도 × 부피'로 셈한다. 곱으로 구함을 잡아 용액 속 용질 양을 직접 구하라.", "f": "D3", "rk": 606, "d": 5, "rh": 0, "pre": ["CH1-298"], "tr": "몰수 계산이 막막해, (몰농도×부피)라는 게 빠진다.", "an": "몰수=몰농도×부피다.", "rd": "몰수=몰농도×부피다.", "tf": "몰수=몰농도 곱하기 무엇? (부피)"}, "CH1-308": {"n": "몰수 환산", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "몰수를 (질량 ÷ 몰질량)으로 환산하는 게 흔들린 경우다. 나누는 방향이 헷갈리면 질량과 몰수를 못 잇는다.", "fx": "몰수를 '질량 ÷ 몰질량'으로 환산한다. 나누는 방향을 헷갈리지 않게 질량을 몰질량으로 나눠 몰수를 이으라.", "f": "D3", "rk": 679, "d": 6, "rh": 0, "pre": ["CH1-045"], "tr": "몰수 환산이 막막해, (질량÷몰질량)이라는 게 빠진다.", "an": "몰수=질량÷몰질량이다.", "rd": "몰수=질량÷몰질량이다.", "tf": "몰수=질량을 무엇으로 나눔? (몰질량)"}, "CH1-309": {"n": "농도 비교", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "같은 질량·부피라도 몰질량이 다르면 몰농도가 다르다는 점을 놓친 경우다. 농도를 단순 양 비례로만 보면 서로 다른 물질의 농도 비교가 어긋난다.", "fx": "'같은 질량·부피라도 몰질량이 다르면 몰농도가 다름'을 못 박는다. 농도를 단순 양 비례로 보지 말고 몰질량을 반영해 비교하라.", "f": "C1", "rk": 680, "d": 6, "rh": 0, "pre": ["CH1-296", "CH1-047"], "tr": "같은 질량·부피면 농도도 같을 것 같아, 몰질량이 다르면 몰농도가 다르다는 게 빠진다.", "an": "몰질량이 다르면 같은 질량·부피라도 몰농도가 다르다.", "rd": "몰질량이 다르면 같은 질량·부피라도 몰수가 달라 농도가 다르다.", "tf": "같은 질량·부피라도 농도가 다른 이유는? (몰질량 차이)"}, "CH1-310": {"n": "실험 기구", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "정확한 부피 측정에 비커가 아니라 부피 플라스크·피펫 같은 정밀 기구를 써야 한다는 점을 놓친 경우다. 기구 선택이 약하면 제조한 농도의 정확도가 떨어진다.", "fx": "정확한 부피 측정에 '비커가 아니라 부피 플라스크·피펫 같은 정밀 기구'를 써야 함을 못 박는다. 제조 농도의 정확도를 위해 기구를 가려 쓰라.", "f": "B2", "rk": 607, "d": 5, "rh": 0, "pre": ["CH1-299"], "tr": "비커로 부피를 잴 것 같아, 부피 플라스크·피펫 같은 정밀 기구를 써야 한다는 게 빠진다.", "an": "부피 플라스크·피펫 같은 정밀 기구를 쓴다: 비커는 부정확하다.", "rd": "정확한 부피가 필요해 부피 플라스크·피펫을 쓴다. 비커는 부정확하다.", "tf": "정확한 부피에 쓰는 기구는? (부피 플라스크)"}, "CH1-311": {"n": "용액 부피", "c": "ch1", "u": "Ⅳ-1", "t": "C", "dx": "용질이 녹으면 부피가 달라질 수 있어 용매 부피가 아니라 용액 부피를 따로 맞춰야 한다는 점을 놓친 경우다. 이걸 놓치면 몰농도가 어긋난다.", "fx": "'용질이 녹으면 부피가 달라질 수 있어 용매 부피가 아니라 용액 부피를 따로 맞춤'을 못 박는다. 용액 부피를 기준으로 제조해 몰농도를 맞춰라.", "f": "D3", "rk": 608, "d": 5, "rh": 0, "pre": ["CH1-300"], "tr": "용매 부피를 맞출 것 같아, 용질이 녹으면 부피가 변해 용액 부피를 따로 맞춘다는 게 빠진다.", "an": "용질이 녹으면 부피가 변해 용액 부피를 따로 맞춘다.", "rd": "용질이 녹으면 부피가 변하니 용액 부피를 따로 맞춘다.", "tf": "용질이 녹으면 무엇이 변하나? (부피)"}, "CH1-312": {"n": "자동이온화", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "물이 스스로 H⁺와 OH⁻로 조금 갈라지는(자동 이온화) 1:1 평형이라는 점을 놓친 경우다. 이 자동 이온화가 약하면 물 이온곱·pH의 토대가 사라진다.", "fx": "'물이 스스로 H⁺와 OH⁻로 조금 갈라지는(자동 이온화) 1:1 평형'을 못 박는다. 이 자동 이온화를 물 이온곱·pH의 토대로 삼아라.", "f": "B2", "rk": 723, "d": 7, "rh": 42, "pre": ["CH1-250"], "tr": "물이 안 갈라질 것 같아, 스스로 H⁺와 OH⁻로 조금 갈라지는 1:1 평형이라는 게 빠진다.", "an": "물도 스스로 H⁺와 OH⁻로 조금 갈라진다: 1:1이다.", "rd": "물도 일부가 H⁺와 OH⁻로 갈라진다. 1:1로 갈라져 평형을 이룬다.", "tf": "물도 스스로 무엇으로 갈라지나? (H⁺와 OH⁻)"}, "CH1-313": {"n": "물의 이온곱", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "물 이온곱이 [H⁺]와 [OH⁻]의 곱이고 25°C에서 10⁻¹⁴이라는 점을 놓친 경우다. 이 곱이 흔들리면 한쪽 농도로 다른 쪽을 구하는 모든 계산이 막힌다.", "fx": "물 이온곱을 '[H⁺]와 [OH⁻]의 곱으로 25°C에서 10⁻¹⁴'로 못 박는다. 이 곱으로 한쪽 농도에서 다른 쪽을 구하는 데 써라.", "f": "D3", "rk": 759, "d": 8, "rh": 41, "pre": ["CH1-312"], "tr": "물 이온곱이 합일 것 같아, [H⁺]와 [OH⁻]의 곱(25°C 10⁻¹⁴)이라는 게 빠진다.", "an": "[H⁺]와 [OH⁻]의 곱(25°C 10⁻¹⁴)이다.", "rd": "자동이온화 평형 상수가 [H⁺][OH⁻]=Kw=10⁻¹⁴(25℃)다.", "tf": "[H⁺][OH⁻]의 값(25℃)은? (10⁻¹⁴)"}, "CH1-314": {"n": "중성 농도", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "25°C 중성에서 [H⁺]=[OH⁻]=10⁻⁷ mol/L이라는 기준값을 놓친 경우다. 이 값이 흐리면 산성·염기성을 가르는 기준이 사라진다.", "fx": "'25°C 중성에서 [H⁺]=[OH⁻]=10⁻⁷ mol/L'를 기준값으로 못 박는다. 이 값을 산성·염기성을 가르는 기준으로 삼아라.", "f": "D2", "rk": 786, "d": 9, "rh": 28, "pre": ["CH1-313"], "tr": "중성 농도가 막연해, 25°C에서 [H⁺]=[OH⁻]=10⁻⁷이라는 기준값이 빠진다.", "an": "25°C 중성은 [H⁺]=[OH⁻]=10⁻⁷이다.", "rd": "중성은 [H⁺]=[OH⁻]다. Kw에 넣으면 각 10⁻⁷이다.", "tf": "25℃ 중성의 [H⁺]는? (10⁻⁷)"}, "CH1-315": {"n": "순수한 물", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "순수한 물이 [H⁺]=[OH⁻]라 중성이라는 점을 놓친 경우다. 두 이온이 같다는 중성 조건이 약하면 액성 판정이 어긋난다.", "fx": "'순수한 물은 [H⁺]=[OH⁻]라 중성'임을 못 박는다. 두 이온이 같다는 중성 조건으로 액성을 판정하라.", "f": "B2", "rk": 803, "d": 10, "rh": 0, "pre": ["CH1-314"], "tr": "순수한 물이 막연해, [H⁺]=[OH⁻]라 중성이라는 게 빠진다.", "an": "[H⁺]=[OH⁻]라 중성이다.", "rd": "순수한 물은 [H⁺]=[OH⁻]라 중성이다.", "tf": "순수한 물은 산성인가 중성인가? (중성)"}, "CH1-316": {"n": "Kw와 온도", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "물 이온곱 상수가 평형 상수라 온도에만 의존한다는 점을 놓친 경우다. 온도가 바뀌면 10⁻¹⁴도 달라진다는 점이 약하면 비표준 온도 문제가 어긋난다.", "fx": "'물 이온곱 상수는 평형 상수라 온도에만 의존'함을 못 박는다. 온도가 바뀌면 10⁻¹⁴도 달라짐을 비표준 온도 문제에 반영하라.", "f": "A3", "rk": 787, "d": 9, "rh": 1, "pre": ["CH1-313", "CH1-255"], "tr": "Kw가 늘 일정할 것 같아, 평형 상수라 온도에만 의존한다는 게 빠진다.", "an": "Kw는 평형상수라 온도에만 의존한다.", "rd": "Kw는 평형 상수라 온도에만 의존한다.", "tf": "Kw를 바꾸는 것은? (온도)"}, "CH1-317": {"n": "pH 정의", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "pH가 [H⁺]의 음의 로그(-log[H⁺])라는 정의를 놓친 경우다. 정의가 흔들리면 농도에서 pH를 못 구한다.", "fx": "pH를 '[H⁺]의 음의 로그(-log[H⁺])'로 못 박는다. 이 정의로 농도에서 pH를 직접 구하라.", "f": "D3", "rk": 788, "d": 9, "rh": 8, "pre": ["CH1-313"], "tr": "pH가 log인지 -log인지 헷갈려, [H⁺]의 음의 로그라는 게 흔들린다.", "an": "pH=-log[H⁺]다.", "rd": "[H⁺]가 거듭제곱으로 변하니 -log를 취한다. pH=-log[H⁺]다.", "tf": "pH는 무엇의 -log? ([H⁺])"}, "CH1-318": {"n": "pOH 정의", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "pOH가 [OH⁻]의 음의 로그라는 정의를 놓친 경우다. pH와 짝을 이루는 이 정의가 약하면 염기성 정량 계산이 막힌다.", "fx": "pOH를 '[OH⁻]의 음의 로그'로 못 박는다. pH와 짝지어 염기성 용액의 정량 계산에 써라.", "f": "D3", "rk": 789, "d": 9, "rh": 2, "pre": ["CH1-313"], "tr": "pOH가 막연해, [OH⁻]의 음의 로그라는 게 빠진다.", "an": "pOH=-log[OH⁻]다.", "rd": "[OH⁻]에 -log를 취한 것이 pOH다.", "tf": "pOH는 무엇의 -log? ([OH⁻])"}, "CH1-319": {"n": "pH+pOH", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "25°C에서 물 이온곱 10⁻¹⁴로부터 pH + pOH = 14가 나온다는 점을 놓친 경우다. 이 관계가 약하면 pH와 pOH를 서로 환산하지 못한다.", "fx": "'25°C에서 pH + pOH = 14(물 이온곱 10⁻¹⁴에서 나옴)'를 못 박는다. 한쪽에서 다른 쪽을 14에서 빼 환산하라.", "f": "D3", "rk": 804, "d": 10, "rh": 1, "pre": ["CH1-317", "CH1-318"], "tr": "pH+pOH=14가 외울 공식 같아, 물 이온곱 10⁻¹⁴에서 나온다는 게 빠진다.", "an": "pH+pOH=14는 물 이온곱(10⁻¹⁴)에서 나온다.", "rd": "[H⁺][OH⁻]=10⁻¹⁴에 -log를 취하면 pH+pOH=14다.", "tf": "pH+pOH는? (14)"}, "CH1-320": {"n": "산성 판정", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "산성이 [H⁺]가 [OH⁻]보다 많은(중성 10⁻⁷보다 큰) 상태라는 점을 놓친 경우다. 두 이온의 대소로 산성을 가르지 못하면 액성 판정이 어긋난다.", "fx": "'산성 = [H⁺]가 [OH⁻]보다 많음(중성 10⁻⁷보다 큼)'을 못 박는다. 두 이온의 대소로 산성을 가려라.", "f": "C1", "rk": 805, "d": 10, "rh": 22, "pre": ["CH1-314"], "tr": "산성이 막연해, [H⁺]가 [OH⁻]보다 많은(10⁻⁷보다 큰) 상태라는 게 빠진다.", "an": "[H⁺]가 [OH⁻]보다 많아 10⁻⁷보다 큰 상태다.", "rd": "산성은 [H⁺]가 [OH⁻]보다 많아 10⁻⁷보다 크다.", "tf": "[H⁺]가 10⁻⁷보다 크면? (산성)"}, "CH1-321": {"n": "중성 판정", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "중성이 [H⁺]=[OH⁻]인 상태라는 점을 놓친 경우다(pH 0은 강산성이지 중성이 아님). 중성 조건이 흐리면 산성·염기성과의 경계를 못 잡는다.", "fx": "'중성 = [H⁺]=[OH⁻]'를 못 박는다(pH 0은 강산성이지 중성 아님). 중성 조건으로 산성·염기성과의 경계를 잡아라.", "f": "B2", "rk": 806, "d": 10, "rh": 1, "pre": ["CH1-314"], "tr": "중성이 그냥 pH 7 같아, [H⁺]=[OH⁻]라는 정의가 빠진다(pH 0은 강산성).", "an": "중성은 [H⁺]=[OH⁻]: pH 0은 강산성이다.", "rd": "중성은 [H⁺]=[OH⁻]다. pH 0은 [H⁺]가 큰 강산성이다.", "tf": "pH 0은 중성인가 강산성인가? (강산성)"}, "CH1-322": {"n": "염기성 판정", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "염기성이 [OH⁻]가 [H⁺]보다 많은 상태라는 점을 놓친 경우다. 두 이온의 대소로 염기성을 가르지 못하면 액성 판정이 어긋난다.", "fx": "'염기성 = [OH⁻]가 [H⁺]보다 많음'을 못 박는다. 두 이온의 대소로 염기성을 가려라.", "f": "C1", "rk": 807, "d": 10, "rh": 22, "pre": ["CH1-314"], "tr": "염기성이 막연해, [OH⁻]가 [H⁺]보다 많은 상태라는 게 빠진다.", "an": "[OH⁻]가 [H⁺]보다 많은 상태다.", "rd": "염기성은 [OH⁻]가 [H⁺]보다 많다.", "tf": "[OH⁻]가 [H⁺]보다 많으면? (염기성)"}, "CH1-323": {"n": "산성 이온 농도", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "산성에서 [H⁺]가 중성 농도(10⁻⁷)보다 크다는 점을 놓친 경우다. 기준 농도와의 비교가 약하면 농도값으로 액성을 못 가린다.", "fx": "'산성에서 [H⁺]가 중성 농도(10⁻⁷)보다 큼'을 못 박는다. 기준 농도와 견줘 농도값으로 액성을 가려라.", "f": "C1", "rk": 828, "d": 11, "rh": 1, "pre": ["CH1-320"], "tr": "산성 농도가 막연해, [H⁺]가 중성(10⁻⁷)보다 크다는 게 빠진다.", "an": "[H⁺]가 중성(10⁻⁷)보다 크다.", "rd": "산성은 [H⁺]가 중성(10⁻⁷)보다 크다.", "tf": "산성의 [H⁺]는 10⁻⁷보다? (큼)"}, "CH1-324": {"n": "염기성 이온 농도", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "염기성에서 [OH⁻]가 중성 농도보다 크다는 점을 놓친 경우다. 기준과의 비교가 약하면 농도값으로 염기성을 못 가린다.", "fx": "'염기성에서 [OH⁻]가 중성 농도보다 큼'을 못 박는다. 기준과 견줘 농도값으로 염기성을 가려라.", "f": "C1", "rk": 829, "d": 11, "rh": 1, "pre": ["CH1-322"], "tr": "염기성 농도가 막연해, [OH⁻]가 중성보다 크다는 게 빠진다.", "an": "[OH⁻]가 중성보다 크다.", "rd": "염기성은 [OH⁻]가 중성보다 크다.", "tf": "염기성의 [OH⁻]는 10⁻⁷보다? (큼)"}, "CH1-325": {"n": "pH-농도 관계", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "pH가 [H⁺]의 음의 로그라 농도가 클수록 pH가 작아진다는 반대 관계를 놓친 경우다. 이 방향이 흔들리면 어느 용액이 더 산성인지 못 가린다.", "fx": "'pH는 [H⁺]의 음의 로그라 농도가 클수록 pH가 작아짐'을 못 박는다. 이 반대 방향으로 어느 용액이 더 산성인지 가려라.", "f": "A1", "rk": 808, "d": 10, "rh": 3, "pre": ["CH1-317"], "tr": "농도가 크면 pH도 클 것 같아, 음의 로그라 농도 크면 pH가 작아진다는 게 거꾸로 느껴진다.", "an": "농도가 크면 pH가 작아진다: 음의 로그라 거꾸로다.", "rd": "pH=-log[H⁺]라 농도가 크면 pH가 작아진다. 음의 로그라 거꾸로다.", "tf": "[H⁺]가 크면 pH는? (작음)"}, "CH1-326": {"n": "pH 비교", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "pH가 로그 척도라 pH 차이 1이 [H⁺] 10배(차이 2면 100배)라는 점을 놓친 경우다. 척도 감각이 없으면 pH 차이를 농도 비로 환산하지 못한다.", "fx": "'pH는 로그 척도라 차이 1이 [H⁺] 10배(차이 2면 100배)'임을 못 박는다. pH 차를 농도 비로 환산하는 연습을 하라.", "f": "A2", "rk": 809, "d": 10, "rh": 0, "pre": ["CH1-317"], "tr": "pH 차이가 비례할 것 같아, 로그라 차이 1이 [H⁺] 10배(2면 100배)라는 게 의외다.", "an": "pH 차이 1이 [H⁺] 10배, 2면 100배: 로그라 비례가 아니다.", "rd": "로그라 pH 차이 1이 [H⁺] 10배다. 비례가 아니다.", "tf": "pH 차이 2면 [H⁺]는 몇 배? (100배)"}, "CH1-327": {"n": "pH 계산", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "[H⁺]에서 pH = -log[H⁺]로 계산하는 게 흔들린 경우다. 10의 거듭제곱 농도에서 지수를 pH로 옮기는 셈이 약하면 답이 어긋난다.", "fx": "[H⁺]에서 'pH = -log[H⁺]'로 계산한다. 10의 거듭제곱 농도에서 지수를 pH로 옮기는 셈을 직접 해 보라.", "f": "D3", "rk": 810, "d": 10, "rh": 0, "pre": ["CH1-317"], "tr": "pH 계산이 막막해, [H⁺]에서 -log[H⁺]라는 게 빠진다.", "an": "[H⁺]에서 -log[H⁺]다.", "rd": "[H⁺]에 -log를 취해 pH를 구한다.", "tf": "[H⁺]=10⁻³이면 pH는? (3)"}, "CH1-328": {"n": "pH-pOH 계산", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "pH = 14 - pOH(25°C)로 환산하는 게 흔들린 경우다. 한쪽을 구해 14에서 빼는 셈이 약하면 산·염기 정량이 막힌다.", "fx": "'pH = 14 - pOH(25°C)'로 환산한다. 한쪽을 구해 14에서 빼는 셈으로 산·염기 정량을 이으라.", "f": "D3", "rk": 830, "d": 11, "rh": 0, "pre": ["CH1-319"], "tr": "pH·pOH 환산이 막막해, pH=14-pOH(25°C)라는 게 빠진다.", "an": "pH=14-pOH(25°C)다.", "rd": "pH+pOH=14라 pH=14-pOH(25℃)다.", "tf": "pOH 4면 pH는? (10)"}, "CH1-329": {"n": "지시약", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "지시약이 액성에 따라 색이 변한다는 점을 놓친 경우다(예: 페놀프탈레인은 염기성에서 붉어짐). 지시약의 변색 방향이 흐리면 색으로 액성을 못 읽는다.", "fx": "'지시약은 액성에 따라 색이 변함'을 못 박는다(페놀프탈레인은 염기성에서 붉어짐). 변색 방향으로 색을 보고 액성을 읽어라.", "f": "B2", "rk": 831, "d": 11, "rh": 0, "pre": ["CH1-320", "CH1-322"], "tr": "지시약이 막연해, 액성에 따라 색이 변한다(페놀프탈레인은 염기성서 붉음)는 게 빠진다.", "an": "액성에 따라 색이 변한다: 페놀프탈레인은 염기성서 붉다.", "rd": "지시약은 액성에 따라 색이 변한다. 페놀프탈레인은 염기성서 붉다.", "tf": "페놀프탈레인은 염기성에서? (붉음)"}, "CH1-330": {"n": "산성 세기", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "[H⁺]가 클수록 더 강한 산성이고 그만큼 pH가 작다는 점을 놓친 경우다. 농도와 세기·pH의 연결이 약하면 산성 세기 비교가 어긋난다.", "fx": "'[H⁺]가 클수록 더 강한 산성이고 그만큼 pH가 작음'을 못 박는다. 농도·세기·pH를 이어 산성 세기를 비교하라.", "f": "C1", "rk": 849, "d": 12, "rh": 0, "pre": ["CH1-323", "CH1-325"], "tr": "산성 세기가 막연해, [H⁺]가 클수록 강한 산성이고 pH가 작다는 게 빠진다.", "an": "[H⁺]가 클수록 강한 산성, pH가 작다.", "rd": "[H⁺]가 클수록 강한 산성이라 pH가 작다.", "tf": "[H⁺]가 클수록 pH는? (작음)"}, "CH1-331": {"n": "염기성 세기", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "[OH⁻]가 클수록 더 강한 염기성이고 그만큼 pH가 크다는 점을 놓친 경우다. 농도와 세기·pH의 연결이 약하면 염기성 세기 비교가 어긋난다.", "fx": "'[OH⁻]가 클수록 더 강한 염기성이고 그만큼 pH가 큼'을 못 박는다. 농도·세기·pH를 이어 염기성 세기를 비교하라.", "f": "C1", "rk": 850, "d": 12, "rh": 0, "pre": ["CH1-324", "CH1-325"], "tr": "염기성 세기가 막연해, [OH⁻]가 클수록 강한 염기성이고 pH가 크다는 게 빠진다.", "an": "[OH⁻]가 클수록 강한 염기성, pH가 크다.", "rd": "[OH⁻]가 클수록 강한 염기성이라 pH가 크다.", "tf": "[OH⁻]가 클수록 pH는? (큼)"}, "CH1-332": {"n": "희석과 pH", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "산을 물로 희석하면 [H⁺]가 줄어 pH가 7에 가까워진다는 점을 놓친 경우다. 희석이 액성을 중성 쪽으로 미는 효과가 약하면 희석 문제가 어긋난다.", "fx": "'산을 물로 희석하면 [H⁺]가 줄어 pH가 7에 가까워짐'을 못 박는다. 희석이 액성을 중성 쪽으로 미는 효과를 문제에 반영하라.", "f": "A1", "rk": 832, "d": 11, "rh": 0, "pre": ["CH1-325", "CH1-301"], "tr": "산을 희석하면 pH가 더 작아질 것 같아, [H⁺]가 줄어 7에 가까워진다는 게 거꾸로 느껴진다.", "an": "산을 희석하면 [H⁺]가 줄어 pH가 7에 가까워진다: 더 작아지는 게 아니다.", "rd": "산을 희석하면 [H⁺]가 줄어 pH가 7에 가까워진다. 더 작아지지 않는다.", "tf": "산을 희석하면 pH는 어디로? (7에 가까워짐)"}, "CH1-333": {"n": "Kw 적용", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "[H⁺]와 [OH⁻]의 곱이 10⁻¹⁴(25°C)로 일정해 한쪽 농도로 다른 쪽을 구한다는 적용을 놓친 경우다. 이 곱을 안 쓰면 [OH⁻]에서 [H⁺]로 못 넘어간다.", "fx": "'[H⁺]와 [OH⁻]의 곱이 10⁻¹⁴(25°C)로 일정'함을 못 박는다. 이 곱으로 [OH⁻]에서 [H⁺]를 구하는 환산을 하라.", "f": "D3", "rk": 790, "d": 9, "rh": 0, "pre": ["CH1-313"], "tr": "한쪽 농도로 다른 쪽을 못 구할 것 같아, 곱이 10⁻¹⁴로 일정해 구한다는 게 빠진다.", "an": "곱이 10⁻¹⁴로 일정해 한쪽으로 다른 쪽을 구한다.", "rd": "[H⁺][OH⁻]=10⁻¹⁴라 한쪽을 알면 다른 쪽이 나온다.", "tf": "[H⁺]를 알면 [OH⁻]를 어떻게? (10⁻¹⁴를 나눔)"}, "CH1-334": {"n": "Kw 일정성", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "물 이온곱이 산성이든 염기성이든 액성과 무관하게 일정(온도에만 의존)하다는 점을 놓친 경우다. 산성이면 곱이 커진다고 오해하면 정량이 어긋난다.", "fx": "'물 이온곱은 산성이든 염기성이든 액성과 무관하게 일정(온도에만 의존)'함을 못 박는다. 산성이면 곱이 커진다고 오해하지 마라.", "f": "A3", "rk": 811, "d": 10, "rh": 0, "pre": ["CH1-316"], "tr": "Kw가 액성에 따를 것 같아, 산성이든 염기성이든 일정(온도에만)하다는 게 빠진다.", "an": "산성이든 염기성이든 Kw는 일정(온도에만)하다.", "rd": "Kw는 온도에만 의존한다. 그래서 산성이든 염기성이든 일정하다.", "tf": "Kw는 산성·염기성에서? (일정)"}, "CH1-335": {"n": "산중염 판정", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "[H⁺]와 [OH⁻]의 대소로 산성·중성·염기성을 가리는 게 흔들린 경우다([H⁺]가 크면 산성 등). 이 기준이 약하면 농도만 주어진 용액의 액성을 못 정한다.", "fx": "'[H⁺]와 [OH⁻]의 대소로 산성·중성·염기성을 가림([H⁺]가 크면 산성 등)'을 못 박는다. 농도만 주어진 용액의 액성을 이 기준으로 정하라.", "f": "C1", "rk": 833, "d": 11, "rh": 0, "pre": ["CH1-320", "CH1-322"], "tr": "액성 판정이 막막해, [H⁺]·[OH⁻] 대소로 가린다는 게 빠진다.", "an": "[H⁺]·[OH⁻] 대소로 액성을 가린다.", "rd": "[H⁺]와 [OH⁻]의 대소로 액성을 가린다.", "tf": "액성을 가리는 비교는? ([H⁺]와 [OH⁻])"}, "CH1-336": {"n": "Kw", "c": "ch1", "u": "Ⅳ-2", "t": "C", "dx": "물 이온곱이 10⁻¹⁴라 중성에서 각 이온 농도가 10⁻⁷이 된다는 점을 놓친 경우다. 곱과 중성 농도의 연결이 약하면 액성 기준이 흐려진다.", "fx": "'물 이온곱이 10⁻¹⁴라 중성에서 각 이온 농도가 10⁻⁷'임을 못 박는다. 곱과 중성 농도를 이어 액성 기준을 세워라.", "f": "D3", "rk": 791, "d": 9, "rh": 0, "pre": ["CH1-313"], "tr": "Kw가 막연해, 10⁻¹⁴라 중성에서 각 이온이 10⁻⁷이라는 게 빠진다.", "an": "Kw=10⁻¹⁴라 중성에서 각 이온이 10⁻⁷이다.", "rd": "Kw=10⁻¹⁴라 중성에서 각 이온이 10⁻⁷이다.", "tf": "중성에서 각 이온 농도는? (10⁻⁷)"}, "CH1-337": {"n": "중화 정의", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화 반응이 산과 염기가 만나 물과 염을 만드는 반응이라는 점을 놓친 경우다(염도 함께 생김). 생성물이 흐리면 중화 반응식을 잘못 쓴다.", "fx": "중화 반응을 '산과 염기가 만나 물과 염을 만드는 반응(염도 함께 생김)'으로 못 박는다. 생성물을 물과 염으로 잡아 반응식을 써라.", "f": "B2", "rk": 834, "d": 11, "rh": 17, "pre": ["CH1-320", "CH1-322"], "tr": "중화가 그냥 산+염기 같아, 물과 염을 만든다(염도 함께)는 게 빠진다.", "an": "산+염기가 물과 염을 만든다: 염도 함께다.", "rd": "산의 H⁺와 염기의 OH⁻가 만나 물을 만든다. 그때 염도 함께 생긴다.", "tf": "산+염기가 물과 무엇을? (염)"}, "CH1-338": {"n": "알짜 이온 반응식", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화의 알짜 이온 반응식이 H⁺ + OH⁻ → H₂O이고 반응에 참여 안 하는 구경꾼 이온은 뺀다는 점을 놓친 경우다. 구경꾼을 빼는 규칙이 약하면 알짜식을 못 쓴다.", "fx": "중화 알짜 이온식을 'H⁺ + OH⁻ → H₂O(구경꾼 이온은 뺌)'로 못 박는다. 반응에 참여 안 하는 이온을 지워 알짜식을 써라.", "f": "B2", "rk": 851, "d": 12, "rh": 2, "pre": ["CH1-337"], "tr": "알짜식에 모든 이온을 넣을 것 같아, H⁺+OH⁻→H₂O이고 구경꾼은 뺀다는 게 빠진다.", "an": "알짜는 H⁺+OH⁻→H₂O, 구경꾼은 뺀다.", "rd": "실제 반응한 H⁺+OH⁻→H₂O만 알짜다. 구경꾼은 뺀다.", "tf": "중화의 알짜 반응은? (H⁺+OH⁻→H₂O)"}, "CH1-339": {"n": "구경꾼 이온", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "구경꾼 이온이 반응에 참여하지 않고 그대로 남아 알짜 이온식에서 빠진다는 점을 놓친 경우다. 무엇이 구경꾼인지 못 가리면 알짜식이 어긋난다.", "fx": "'구경꾼 이온은 반응에 참여 안 하고 그대로 남아 알짜식에서 빠짐'을 못 박는다. 무엇이 구경꾼인지 가려 알짜식을 잡아라.", "f": "B2", "rk": 867, "d": 13, "rh": 0, "pre": ["CH1-338"], "tr": "모든 이온이 반응할 것 같아, 구경꾼은 참여 안 해 알짜식에서 빠진다는 게 빠진다.", "an": "구경꾼은 참여 안 해 알짜식에서 빠진다.", "rd": "반응 전후 그대로인 이온은 반응에 안 끼니 알짜식에서 빠진다.", "tf": "반응에 안 끼는 이온은? (구경꾼)"}, "CH1-340": {"n": "중화점 양적관계", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화점에서 H⁺와 OH⁻가 1:1로 반응해 몰수가 같아진다는 점을 놓친 경우다. 이 1:1 비가 약하면 중화 양적관계가 어긋난다.", "fx": "'중화점에서 H⁺와 OH⁻가 1:1로 반응해 몰수가 같아짐'을 못 박는다. 이 1:1 비를 중화 양적관계의 바탕으로 삼아라.", "f": "D3", "rk": 852, "d": 12, "rh": 8, "pre": ["CH1-337", "CH1-067"], "tr": "중화점에서 양이 막연해, H⁺와 OH⁻가 1:1로 반응해 몰수가 같아진다는 게 빠진다.", "an": "H⁺와 OH⁻가 1:1로 반응해 몰수가 같아진다.", "rd": "H⁺와 OH⁻가 1:1로 반응한다. 그래서 둘의 몰수가 같아진다.", "tf": "H⁺와 OH⁻는 몇 대 몇으로 반응? (1:1)"}, "CH1-341": {"n": "양적관계 식", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화 양적관계를 (산이 낸 H⁺ 몰수 = 염기가 낸 OH⁻ 몰수)로, 몰수를 농도 × 부피로 잡는 게 흔들린 경우다. 이 식이 약하면 적정 계산이 막힌다.", "fx": "중화 양적관계를 '산이 낸 H⁺ 몰수 = 염기가 낸 OH⁻ 몰수, 몰수 = 농도 × 부피'로 못 박는다. 이 식에 값을 넣어 적정 계산을 하라.", "f": "D3", "rk": 868, "d": 13, "rh": 1, "pre": ["CH1-340", "CH1-298"], "tr": "중화 양적관계 식이 막막해, (H⁺ 몰수=OH⁻ 몰수), 몰수=농도×부피라는 게 빠진다.", "an": "H⁺ 몰수=OH⁻ 몰수, 몰수=농도×부피다.", "rd": "H⁺ 몰수=OH⁻ 몰수, 몰수=농도×부피다.", "tf": "몰수=농도 곱하기 무엇? (부피)"}, "CH1-342": {"n": "가수", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "산·염기가 가수만큼 H⁺·OH⁻를 내놓아 양적관계에 가수를 반영해야 한다는 점을 놓친 경우다(2가 산은 H⁺ 2몰). 가수를 빼먹으면 중화 양론이 어긋난다.", "fx": "'산·염기는 가수만큼 H⁺·OH⁻를 내놓아 양적관계에 가수를 반영(2가 산은 H⁺ 2몰)'함을 못 박는다. 가수를 곱해 중화량을 셈하라.", "f": "D3", "rk": 869, "d": 13, "rh": 1, "pre": ["CH1-340"], "tr": "가수를 안 따질 것 같아, 가수만큼 H⁺·OH⁻를 내 반영해야 한다(2가 산은 2몰)는 게 빠진다.", "an": "가수만큼 H⁺·OH⁻를 내 반영: 2가 산은 2몰이다.", "rd": "1몰이 내는 H⁺·OH⁻가 가수만큼이다. 2가 산은 2몰을 낸다.", "tf": "2가 산 1몰은 H⁺를 몇 몰? (2)"}, "CH1-343": {"n": "중화열", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화 반응이 발열이라 열을 방출한다는 점을 놓친 경우다. 중화가 발열이라는 점이 약하면 중화열·열화학 연결이 흔들린다.", "fx": "'중화 반응은 발열이라 열을 방출'함을 못 박는다. 중화가 발열임을 중화열·열화학 연결에 써라.", "f": "B2", "rk": 853, "d": 12, "rh": 0, "pre": ["CH1-337", "CH1-226"], "tr": "중화가 흡열일 것 같기도 해, 발열이라 열을 방출한다는 게 흔들린다.", "an": "중화는 발열이라 열을 방출한다.", "rd": "중화는 H⁺+OH⁻→H₂O로 안정해진다. 그래서 발열이다.", "tf": "중화는 발열인가 흡열인가? (발열)"}, "CH1-344": {"n": "중화적정", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "중화적정이 농도를 아는 표준 용액으로 모르는 산·염기 농도를 양적관계로 구하는 방법이라는 점을 놓친 경우다. 이 원리가 약하면 화학Ⅱ 적정 단원이 흔들린다.", "fx": "중화적정을 '농도를 아는 표준 용액으로 모르는 산·염기 농도를 양적관계로 구하는 방법'으로 못 박는다. 이 원리를 화학Ⅱ 적정의 바탕으로 삼아라.", "f": "B2", "rk": 870, "d": 13, "rh": 0, "pre": ["CH1-340"], "tr": "적정이 막연해, 농도 아는 표준 용액으로 모르는 농도를 양적관계로 구한다는 게 빠진다.", "an": "농도 아는 표준 용액으로 모르는 농도를 양적관계로 구한다.", "rd": "농도 아는 표준 용액으로 미지 농도를 양적관계로 구한다.", "tf": "표준 용액으로 미지 농도를 구하는 건? (적정)"}, "CH1-345": {"n": "양적관계 계산", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "완전 중화에서 H⁺ 몰수 = OH⁻ 몰수로 미지의 농도·부피를 구하는 게 흔들린 경우다. 양변 몰수를 맞추는 셈이 약하면 적정 계산이 어긋난다.", "fx": "'완전 중화에서 H⁺ 몰수 = OH⁻ 몰수'로 미지의 농도·부피를 구한다. 양변 몰수를 맞추는 셈으로 적정 계산을 하라.", "f": "D3", "rk": 885, "d": 14, "rh": 0, "pre": ["CH1-341"], "tr": "미지 농도 계산이 막막해, H⁺ 몰수=OH⁻ 몰수로 구한다는 게 빠진다.", "an": "H⁺ 몰수=OH⁻ 몰수로 미지 농도를 구한다.", "rd": "H⁺ 몰수=OH⁻ 몰수에서 미지 농도를 푼다.", "tf": "미지 농도를 구하는 등식은? (H⁺ 몰수=OH⁻ 몰수)"}, "CH1-346": {"n": "중화점 pH", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "강산-강염기 중화점이 남는 이온이 없어 중성(pH 7)이라는 점을 놓친 경우다. 이 기준이 약하면 약산·약염기가 섞일 때 당량점이 왜 중성이 아닌지(화학Ⅱ)로 이어지지 못한다.", "fx": "'강산-강염기 중화점은 남는 이온이 없어 중성(pH 7)'임을 못 박는다. 이 기준에서 약산·약염기가 섞이면 왜 중성이 아닌지(화학Ⅱ)로 이어라.", "f": "B2", "rk": 854, "d": 12, "rh": 0, "pre": ["CH1-337", "CH1-321"], "tr": "강산-강염기 중화점이 막연해, 남는 이온이 없어 중성(pH 7)이라는 게 빠진다.", "an": "강산-강염기 중화점은 남는 이온이 없어 중성(pH 7)이다.", "rd": "강산-강염기는 생긴 염이 가수분해 안 해 중성(pH 7)이다.", "tf": "강산-강염기 중화점 pH는? (7)"}, "CH1-347": {"n": "염", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "염이 산의 음이온과 염기의 양이온이 결합한 물질이라는 점을 놓친 경우다. 염의 구성이 흐리면 염 가수분해로 인한 액성 변화(화학Ⅱ)를 이해하지 못한다.", "fx": "염을 '산의 음이온과 염기의 양이온이 결합한 물질'로 못 박는다. 염의 구성을 잡아 화학Ⅱ 염 가수분해·액성 변화로 이어라.", "f": "B2", "rk": 855, "d": 12, "rh": 0, "pre": ["CH1-337"], "tr": "염이 막연해, 산의 음이온과 염기의 양이온이 결합한 물질이라는 게 빠진다.", "an": "산의 음이온과 염기의 양이온이 결합한 물질이다.", "rd": "산의 음이온과 염기의 양이온이 결합한 물질이 염이다.", "tf": "산의 음이온과 염기의 양이온이 결합한 것은? (염)"}, "CH1-348": {"n": "일상의 중화", "c": "ch1", "u": "Ⅳ-3", "t": "C", "dx": "위산 중화제·제산처럼 일상에서 산을 염기로(또는 반대로) 중화하는 예를 놓친 경우다. 중화의 실제 쓰임이 약하면 응용 문제를 못 잡는다.", "fx": "'위산 중화제·제산처럼 일상에서 산을 염기로(또는 반대로) 중화'함을 못 박는다. 중화의 실제 쓰임을 응용 문제에

<style>
:root{--ink:#17171C;--ink-soft:#5C5C66;--ink-faint:#706E66;--paper:#F4F1EA;--panel:#FFF;--line:#E2DBCD;--line-strong:#D2C8B5;--brass:#A8824C;--brass-deep:#8A6A38;--slate:#41595A;--rose:#9C5B57;--serif:"Gowun Batang",serif;--sans:"Pretendard",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding:clamp(16px,4vw,40px) 14px}
.sheet{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:0 24px 60px -42px rgba(23,23,28,.3);padding:clamp(24px,5vw,52px)}
.mast{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.dawon-logo{height:36px;width:auto;display:block}
.doc-id{text-align:right}.doc-type{font-family:var(--serif);font-size:20px;font-weight:700}.byline{margin-top:5px;font-size:12px;color:var(--ink-soft);letter-spacing:.06em}.byline .dot{color:var(--line-strong);margin:0 6px}
.rule{height:1px;background:var(--line);margin:20px 0}
.input-card{background:#FCFAF6;border:1px solid var(--line);border-radius:3px;padding:18px;margin-top:18px}
.input-card h1,h3{font-size:12.5px;letter-spacing:.08em;color:var(--brass-deep);text-transform:uppercase;margin:1em 0 10px}
.input-card textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:3px;background:#fff;resize:vertical;outline:none;color:var(--ink);line-height:1.6}
.input-card textarea:focus{border-color:var(--brass)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:9px 18px;border:none;border-radius:3px;cursor:pointer;letter-spacing:.02em}
.btn-go{background:var(--ink);color:#fff}.btn-go:hover{background:#000}
.btn-demo{background:transparent;color:var(--slate);border:1px solid var(--line-strong)}.btn-demo:hover{background:#F7F4EE}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.6}
#report{margin-top:8px}.empty{font-size:13px;color:var(--ink-faint);text-align:center;padding:40px 0}
.kpis{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px}
.kpis div .n{font-family:var(--serif);font-size:26px;font-weight:700}.kpis div .l{font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;gap:11px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.sec-n{font-family:var(--serif);font-size:13px;color:var(--brass);font-weight:700}.sec-t{font-size:16px;font-weight:700}.sec-sub{margin-left:auto;font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em}
.sec>p{margin-top:12px;font-size:14px;color:#2A2A30;line-height:1.8}
.barlist{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:150px 1fr 52px;align-items:center;gap:12px}
.bname{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bname .code{color:var(--brass-deep);font-size:11.5px;margin-right:5px}
.btrack{height:9px;background:#EFE9DD;border-radius:5px;overflow:hidden}.bfill{height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-deep));border-radius:5px}
.bfill.slate{background:linear-gradient(90deg,#5E7A78,var(--slate))}
.bval{font-size:11.5px;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums}
.plan{margin-top:16px}
.prow{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F0EBE0}.prow:last-child{border-bottom:none}
.pn{font-family:var(--serif);font-size:13px;color:var(--brass-deep);font-weight:700;text-align:center}
.pname{font-size:14px;font-weight:600}.pname .root{font-size:11.5px;color:#fff;background:var(--brass);padding:1px 6px;border-radius:10px;margin-left:7px}.pname .key{font-size:11.5px;color:var(--brass-deep);border:1px solid var(--brass);padding:1px 6px;border-radius:10px;margin-left:6px}
.pmeta{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.pfreq{font-size:12px;color:var(--ink);white-space:nowrap;text-align:right}.pfreq b{font-family:var(--serif);font-size:15px}
.students{margin-top:16px;display:flex;flex-direction:column;gap:0}
.srow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #F0EBE0;font-size:13px}.srow:last-child{border-bottom:none}
.sname{font-weight:600;white-space:nowrap}.sdiag{color:var(--ink-soft);text-align:right}
.colophon{margin-top:42px;padding-top:24px;border-top:1px solid var(--line);text-align:center}
.cred{font-family:var(--serif);font-size:14px;letter-spacing:.12em}.cred .sep{color:var(--brass);margin:0 8px;font-weight:700}
.fine{margin-top:10px;font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em}
@media print{body{background:#fff;padding:0}.sheet{box-shadow:none;border:none}.input-card{display:none}}
@media(max-width:560px){.doc-id{text-align:left}.brow{grid-template-columns:108px 1fr 44px;gap:9px}}

const N={"CH1-001": {"n": "원소·원자·분자 정의", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "원소(성분)·원자(입자)·분자(성질 단위)의 층위를 뭉뚱그린 경우다. 이 구분이 흔들리면 화학식 읽기와 몰 계산까지 전부 헛디딘다.", "fx": "원소(종류)·원자(낱개 입자)·분자(둘 이상 원자가 결합한 성질 단위)를 세 칸으로 분리해 외운다. 물(H₂O)로 '원소 2종·원자 3개·분자 1개'를 직접 세어 층위를 굳혀라.", "f": "B2", "rk": 0, "d": 0, "rh": 325, "pre": [], "tr": "원소·원자·분자가 다 \"물질을 이루는 작은 것\"으로 뭉뚱그려져, 성분/입자/단위라는 층위 구분이 흐려진다.", "an": "원소(재료 종류)·원자(레고 블록 한 개)·분자(블록을 조립한 작품): 층위가 다르다.", "rd": "물질을 이루는 층위가 다르다. 종류가 원소, 그 한 알이 원자, 원자가 묶인 단위가 분자다.", "tf": "물 분자를 이루는 원소는 몇 종류? (2: 수소·산소)"}, "CH1-002": {"n": "분자 종류", "c": "ch1", "u": "Ⅰ-1", "t": "A", "dx": "분자식에서 원자의 종류와 개수를 읽어내지 못한 경우다(HCl은 H·Cl 각 1개). 화학식 해석이 안 되면 몰질량·양적관계가 모두 막힌다.", "fx": "분자식은 '원소 기호 = 종류, 첨자 = 개수'로 분해해 읽는다. HCl·H₂O·CO₂를 종류와 개수로 적어 보며 첨자가 없으면 1개임을 확인하라.", "f": "D3", "rk": 36, "d": 1, "rh": 135, "pre": ["CH1-001"], "tr": "분자식이 그냥 이름 같아, 거기서 원자의 종류와 개수를 읽어낸다는 게 안 떠오른다.", "an": "분자식은 조립 설명서: H₂O면 수소 2개·산소 1개가 적혀 있다.", "rd": "분자식은 어떤 원자가 몇 개인지 적은 것이다. 첨자를 읽으면 구성이 나온다.", "tf": "CO₂ 한 분자엔 원자가 몇 개? (3)"}, "CH1-003": {"n": "원소 수 세기", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "화학식에서 원소(종류) 수와 원자(개수) 수를 같은 것으로 본 경우다. 종류와 개수를 섞으면 조성·실험식 계산이 어긋난다.", "fx": "'원소 수 = 서로 다른 기호의 가짓수, 원자 수 = 첨자까지 더한 낱개 수'로 두 셈을 분리한다. H₂SO₄로 원소 3종·원자 7개를 따로 세어 구분하라.", "f": "B2", "rk": 37, "d": 1, "rh": 0, "pre": ["CH1-001"], "tr": "원소든 원자든 다 \"몇 개\"라, 종류 수(원소)와 개수(원자)가 같은 셈처럼 보인다.", "an": "원소 수는 재료 가짓수, 원자 수는 블록 총 개수: 다른 셈이다.", "rd": "원소는 종류, 원자는 개수다. 종류를 세면 원소 수, 알을 세면 원자 수다.", "tf": "H₂O에서 원소 수와 원자 수는? (원소 2, 원자 3)"}, "CH1-004": {"n": "원자 수 세기", "c": "ch1", "u": "Ⅰ-1", "t": "B", "dx": "첨자와 계수를 빠뜨리고 원자 수를 센 경우다. 이 셈이 흔들리면 질량 보존·양적관계가 무너진다.", "fx": "원자 수는 '계수 × 각 첨자'를 빠짐없이 곱해 센다. 2H₂O에서 H 4개·O 2개처럼 계수와 첨자를 둘 다 반영해 직접 세어 보라.", "f": "D3", "rk": 38, "d": 1, "rh": 0, "pre": ["CH1-001"], "tr": "화학식을 훑으면 큰 글자만 눈에 들어와, 첨자와 계수를 빠뜨리고 센다.", "an": "화학식의 첨자와 계수가 곱셈표: 2H₂O는 H 4개·O 2개, 큰 글자만 보면 틀린다.", "rd": "계수는 분자 전체에, 첨자는 그 원소에 곱한다. 둘을 곱해 더해야 원자 수가 나온다.", "tf": "2H₂O엔 수소 원자가 몇 개? (4)"}, "CH1-005": {"n": "화학식 종류", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "분자식·실험식·구조식·시성식의 쓰임을 구분 못 한 경우다. 이온 물질을 분자식으로 쓰려 하면 화학식 자체가 틀어진다.", "fx": "분자식(실제 원자 수)·실험식(가장 간단한 정수비)·구조식(결합)·시성식(작용기)의 쓰임을 한 줄씩 정리한다. 이온 물질은 분자가 없어 실험식으로 쓴다는 규칙을 NaCl로 확인하라.", "f": "B2", "rk": 130, "d": 2, "rh": 10, "pre": ["CH1-002"], "tr": "분자식·실험식·구조식이 같은 걸 다르게 쓴 것 같아, 각자 쓰임이 다르다는 게 안 잡힌다.", "an": "분자식·실험식·구조식은 사진·요약·설계도: 같은 물질을 다른 목적으로 적는다.", "rd": "목적이 다르면 표기도 다르다. 실제 개수는 분자식, 비율은 실험식, 연결은 구조식이다.", "tf": "실제 원자 개수를 보려면 무슨 식? (분자식)"}, "CH1-006": {"n": "실험식 도출", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "실험식이 원자 수의 가장 간단한 정수비라는 점을 놓친 경우다. 약분 개념이 없으면 조성 분석에서 분자식을 못 잡는다.", "fx": "실험식은 원자 수비를 최대공약수로 약분한 가장 간단한 정수비다. C₆H₁₂O₆를 CH₂O로 줄이는 약분을 직접 해 보며 분자식과의 차이를 확인하라.", "f": "D3", "rk": 252, "d": 3, "rh": 9, "pre": ["CH1-005"], "tr": "실험식이 그냥 또 다른 식 같아, 원자 수의 가장 간단한 정수비라는 핵심이 묻힌다.", "an": "실험식은 비율을 가장 간단히 줄인 것: 6:12:6을 1:2:1로.", "rd": "원자 수 비를 가장 작은 정수로 줄이면 실험식이다. 공약수로 나눠 구한다.", "tf": "C₆H₁₂O₆의 실험식은? (CH₂O)"}, "CH1-007": {"n": "원자 구조", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "원자를 (+)핵과 (−)전자가 균형 잡힌 중성 입자로 보지 못한 경우다. 이 그림이 약하면 이온 형성·전기적 성질 전체가 흔들린다.", "fx": "원자를 '가운데 (+)핵, 둘레 (−)전자, 둘이 같아 전체 중성'으로 그린다. 양성자 수와 전자 수를 맞춰 중성을 확인하고, 전자가 빠지면 이온이 됨을 이어 짚어라.", "f": "B2", "rk": 39, "d": 1, "rh": 198, "pre": ["CH1-001"], "tr": "원자를 알갱이 하나로 떠올려, (+)핵과 (-)전자가 균형 잡힌 중성 입자라는 그림이 약하다.", "an": "원자는 (+)핵과 (-)전자가 균형 잡힌, 태양계를 닮은 작은 중성 알갱이다.", "rd": "(+)핵과 (-)전자가 상쇄돼 중성이다. 핵은 무거워 가운데, 전자는 그 둘레다.", "tf": "원자가 중성인 이유는? (양성자와 전자 수가 같음)"}, "CH1-008": {"n": "입자 질량비", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "전자가 핵자보다 약 1840배 가볍다는 질량 차를 놓친 경우다. 그래서 원자 질량이 사실상 핵에 몰려 있다는 다음 개념이 약해진다.", "fx": "'양성자≈중성자, 전자는 약 1840배 가벼움'을 기준으로 삼는다. 그래서 원자 질량이 사실상 핵에 다 몰린다는 결론까지 한 문장으로 이어 적어라.", "f": "C1", "rk": 131, "d": 2, "rh": 0, "pre": ["CH1-007"], "tr": "셋 다 입자라 무게도 비슷할 것 같아, 전자만 약 1840배 가볍다는 비대칭이 의외다.", "an": "양성자·중성자는 볼링공, 전자는 깃털: 무게 1840배 차이다.", "rd": "양성자·중성자는 핵자라 무겁고 전자는 약 1/1840이다. 그래서 질량은 핵자가 정한다.", "tf": "전자와 양성자 중 가벼운 건? (전자: 1/1840)"}, "CH1-009": {"n": "입자 전하비", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "양성자 +1·전자 −1·중성자 0이라는 전하 배분을 놓친 경우다. 전하의 기준이 흔들리면 이온·핵전하 해석이 어긋난다.", "fx": "세 입자 전하를 '양성자 +1, 전자 −1, 중성자 0'으로 못 박는다. 이 값으로 중성 원자의 전하 합이 0이 됨을 직접 확인하라.", "f": "B2", "rk": 132, "d": 2, "rh": 9, "pre": ["CH1-007"], "tr": "어느 입자가 +이고 -인지 외울 목록 같아, 양성자 +1·전자 -1·중성자 0이 섞인다.", "an": "양성자(+1)·전자(-1)·중성자(0): +카드·-카드·백지다.", "rd": "양성자 +1, 전자 -1, 중성자 0의 약속에서 나온다.", "tf": "전하가 없는 입자는? (중성자)"}, "CH1-010": {"n": "원자 중성", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "원자가 양성자 수 = 전자 수라서 중성이라는 균형을 놓친 경우다. 이 균형이 깨질 때가 곧 이온이라는 다음 개념과 직결된다.", "fx": "중성의 조건은 '양성자 수 = 전자 수'임을 기준으로 삼는다. 이 균형이 깨져 전자가 줄거나 늘면 이온이 됨을, 전자 수만 바꿔 직접 확인하라.", "f": "D3", "rk": 253, "d": 3, "rh": 7, "pre": ["CH1-007", "CH1-009"], "tr": "중성인데 양성자·전자 수는 달라도 될 것 같아, 둘이 같아야 중성이라는 균형이 흐려진다.", "an": "중성 원자는 +와 -가 같은 수라 잔액 0인 통장이다.", "rd": "중성이려면 (+)와 (-)가 같아야 한다. 그래서 양성자 수=전자 수다.", "tf": "양성자 8, 전자 8이면 전하는? (0: 중성)"}, "CH1-011": {"n": "원자핵 구성", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "핵(양성자·중성자)과 핵 바깥 전자라는 공간 배치를 놓친 경우다. 핵의 위치를 잘못 잡으면 원자번호·질량수 정의가 흔들린다.", "fx": "'핵 안에 양성자·중성자, 핵 밖에 전자'라는 공간 배치를 그림으로 고정한다. 이 위치에서 원자번호(양성자 수)와 질량수(양성자+중성자)를 직접 읽어 보라.", "f": "B2", "rk": 133, "d": 2, "rh": 1, "pre": ["CH1-007"], "tr": "원자 속이 골고루 섞인 것 같아, 핵(양성자·중성자)과 핵 바깥 전자라는 공간 배치가 안 잡힌다.", "an": "핵 안엔 양성자·중성자, 핵 밖엔 전자: 안과 밖이 갈린다.", "rd": "무거운 양성자·중성자는 핵에 뭉치고 가벼운 전자는 핵 밖이다. 그래서 안과 밖이 갈린다.", "tf": "전자는 핵 안에 있나? (아니다: 핵 밖)"}, "CH1-012": {"n": "옥텟규칙", "c": "ch1", "u": "Ⅰ-1", "t": "B", "dx": "옥텟 규칙이 원자 혼자가 아니라 결합한 뒤의 안정 상태 기준이라는 점을 놓친 경우다. 이걸 놓치면 결합이 왜 일어나는지 설명이 막힌다.", "fx": "옥텟은 '원자가 결합으로 최외각 8개(수소는 2개)를 채워 안정해지는 것'으로 이해한다. 결합이 일어나는 이유가 이 안정화임을 NaCl·H₂O로 확인하라.", "f": "B2", "rk": 575, "d": 5, "rh": 1, "pre": ["CH1-013"], "tr": "옥텟이 원자 혼자의 성질 같아, 결합한 뒤의 안정 상태 기준이라는 게 흐려진다.", "an": "옥텟은 바깥 전자 8개면 만족: 결합으로 그 상태를 노린다.", "rd": "비활성 기체의 바깥 8전자가 안정하다. 그래서 원자가 결합으로 그 상태를 노린다.", "tf": "원자가 결합으로 노리는 바깥 전자 수는? (8)"}, "CH1-013": {"n": "루이스 전자점식", "c": "ch1", "u": "Ⅰ-1", "t": "A", "dx": "루이스 전자점식이 원자가 전자만 그린다(안쪽 껍질 제외)는 점을 놓친 경우다. 점 수를 잘못 세면 결합 수·분자 구조가 어긋난다.", "fx": "전자점식은 '안쪽 껍질 빼고 최외각(원자가) 전자만' 점으로 그린다. 2주기 원소의 원자가 전자 수를 세어 점을 찍어 보며 결합 손 수를 확인하라.", "f": "D3", "rk": 407, "d": 4, "rh": 4, "pre": ["CH1-015"], "tr": "점을 다 그려야 할 것 같아, 원자가 전자만(안쪽 껍질 제외) 그린다는 게 빠진다.", "an": "점은 바깥(원자가) 전자만 찍는다: 안쪽 껍질은 안 그린다.", "rd": "결합은 바깥 전자만 한다. 그래서 원자가 전자만 점으로 그린다.", "tf": "점으로 그리는 전자는? (바깥/원자가 전자)"}, "CH1-014": {"n": "주기율표 기초", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "족(원자가 전자 수)과 주기(전자껍질 수)의 의미를 뒤섞은 경우다. 이 두 축이 흔들리면 주기성·결합 예측의 토대가 무너진다.", "fx": "'세로 족 = 원자가 전자 수, 가로 주기 = 전자껍질 수' 두 축을 분리해 외운다. 임의 원소의 위치에서 두 값을 읽어 보며 축을 구분하라.", "f": "B2", "rk": 134, "d": 2, "rh": 17, "pre": ["CH1-007"], "tr": "족·주기가 둘 다 표의 칸 같아, 어느 쪽이 원자가 전자 수이고 어느 쪽이 껍질 수인지 뒤섞인다.", "an": "가로(주기)=껍질 층수, 세로(족)=바깥 전자 수: 좌석표 두 축이다.", "rd": "같은 족은 바깥 전자 수가 같고, 같은 주기는 껍질 수가 같다. 가로·세로가 그 두 축이다.", "tf": "세로줄(족)은 무엇이 같나? (바깥 전자 수)"}, "CH1-015": {"n": "족 판정", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "전자 배치(원자가 전자 수)로 족을 읽어내는 게 흔들린 경우다. 족을 못 잡으면 반응성·이온 전하 예측이 어긋난다.", "fx": "족은 전자 배치의 최외각 전자 수로 판정한다. 전자 배치를 쓰고 원자가 전자 수를 세어 족을 매겨 보며, 그 수로 이온 전하를 예측하라.", "f": "B2", "rk": 254, "d": 3, "rh": 16, "pre": ["CH1-014"], "tr": "족이 위치로만 정해질 것 같아, 전자 배치(원자가 전자 수)로 읽힌다는 게 안 잡힌다.", "an": "족은 위치가 아니라 바깥 전자 수로 읽는다: 같은 세로줄은 바깥 전자가 같다.", "rd": "같은 족은 바깥 전자 수가 같다. 그래서 바깥 전자 수로 족을 읽는다.", "tf": "바깥 전자 6개인 원소는 몇 족? (16족)"}, "CH1-016": {"n": "이온형성 방향", "c": "ch1", "u": "Ⅰ-1", "t": "B", "dx": "금속은 잃어 양이온, 비금속은 얻어 음이온이라는 방향을 놓친 경우다. 방향을 뒤집으면 이온식·결합 판정이 전부 틀어진다.", "fx": "'금속 = 전자 잃어 양이온, 비금속 = 전자 얻어 음이온' 방향을 못 박는다. Na⁺·Cl⁻처럼 대표 원소로 방향과 전하를 직접 적어 굳혀라.", "f": "A1", "rk": 408, "d": 4, "rh": 12, "pre": ["CH1-015"], "tr": "금속·비금속이 어느 쪽으로 변할지 헷갈려, 금속은 잃어 양이온·비금속은 얻어 음이온이라는 방향이 흔들린다.", "an": "금속은 전자를 잃어 양이온, 비금속은 얻어 음이온: 주거나 받거나다.", "rd": "금속은 바깥 전자가 적어 잃기 쉽고 비금속은 채우려 받는다. 그래서 양이온·음이온이 된다.", "tf": "금속은 전자를 잃나 얻나? (잃음: 양이온)"}, "CH1-017": {"n": "이온 전하", "c": "ch1", "u": "Ⅰ-1", "t": "B", "dx": "잃거나 얻은 전자 수가 곧 이온 전하라는 점을 놓친 경우다. 전하 크기를 못 잡으면 이온 화합물의 화학식이 어긋난다.", "fx": "이온 전하는 '잃거나 얻은 전자 수'와 같다. Mg는 2개 잃어 Mg²⁺, O는 2개 얻어 O²⁻처럼 전자 수와 전하를 맞춰 적어 보라.", "f": "D3", "rk": 576, "d": 5, "rh": 0, "pre": ["CH1-016"], "tr": "이온 전하가 임의 같아, 잃거나 얻은 전자 수가 곧 전하라는 게 안 잡힌다.", "an": "잃거나 얻은 전자 수가 곧 이온 전하: 2개 잃으면 +2다.", "rd": "잃거나 얻은 전자 수만큼 전하 불균형이 생긴다. 그래서 그 수가 곧 이온 전하다.", "tf": "전자 2개를 잃으면 이온 전하는? (+2)"}, "CH1-018": {"n": "결합 기초", "c": "ch1", "u": "Ⅰ-1", "t": "A", "dx": "금속+비금속(이온)·비금속끼리(공유)·금속끼리(금속)라는 결합 분류를 놓친 경우다. 결합 종류를 못 가리면 물질의 성질 예측이 막힌다.", "fx": "결합을 '금속+비금속 = 이온, 비금속+비금속 = 공유, 금속+금속 = 금속'으로 분류한다. 예시 물질을 종류별로 하나씩 적어 보며 구성 원소로 결합을 가려라.", "f": "B2", "rk": 577, "d": 5, "rh": 1, "pre": ["CH1-016", "CH1-013"], "tr": "결합 종류가 다 비슷한 것 같아, 금속+비금속(이온)·비금속끼리(공유)·금속끼리(금속) 분류가 흐려진다.", "an": "금속+비금속=이온, 비금속끼리=공유, 금속끼리=금속: 만나는 짝으로 정해진다.", "rd": "전자를 주고받으면 이온, 나누면 공유, 자유전자로 묶이면 금속이다. 만나는 짝이 종류를 정한다.", "tf": "금속과 비금속이 만나면 무슨 결합? (이온)"}, "CH1-019": {"n": "물질 분류", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "순물질(홑원소·화합물)과 혼합물의 갈래를 놓친 경우다. 분류 틀이 약하면 일정 성분비·끓는점 같은 성질 해석이 흔들린다.", "fx": "물질을 '순물질(홑원소·화합물) 대 혼합물'로 가른다. 산소·물·공기를 각 칸에 넣어 보며 분류 틀을 굳혀라.", "f": "B2", "rk": 40, "d": 1, "rh": 24, "pre": ["CH1-001"], "tr": "물질 갈래가 막연해, 순물질(홑원소·화합물)과 혼합물의 가지가 안 잡힌다.", "an": "물질은 순물질(홑원소·화합물)과 혼합물로 갈리는 나무: 가지를 따라간다.", "rd": "한 종류로만 이뤄졌나(순물질) 섞였나(혼합물)로 먼저 가른다. 순물질은 다시 홑원소·화합물로 갈린다.", "tf": "소금물은 순물질인가 혼합물인가? (혼합물)"}, "CH1-020": {"n": "순물질·혼합물 경계", "c": "ch1", "u": "Ⅰ-1", "t": "B", "dx": "화학결합이 있으면 화합물, 단지 섞이면 혼합물이라는 경계를 놓친 경우다. 이 선이 흐리면 화합물의 일정 조성을 설명 못 한다.", "fx": "'화학결합으로 묶이면 화합물, 그냥 섞이면 혼합물'을 경계로 삼는다. 물(화합물)과 소금물(혼합물)을 비교하며 결합 유무로 가려라.", "f": "B2", "rk": 135, "d": 2, "rh": 2, "pre": ["CH1-019"], "tr": "섞이면 다 혼합물 같아, 화학결합이 있으면 화합물·단지 섞이면 혼합물이라는 경계가 흐려진다.", "an": "화학결합으로 묶이면 화합물, 그냥 섞이면 혼합물: 소금물(혼합물) vs 물(화합물).", "rd": "화학결합이 있으면 정해진 조성의 화합물, 그냥 섞이면 비율 자유인 혼합물이다.", "tf": "물(H₂O)은 화합물인가 혼합물인가? (화합물)"}, "CH1-021": {"n": "물질 분류 판정", "c": "ch1", "u": "Ⅰ-1", "t": "A", "dx": "한 종류 원소면 홑원소, 여러 원소 결합이면 화합물이라는 판정을 놓친 경우다. 판정이 흔들리면 화학식·조성 해석이 어긋난다.", "fx": "'한 종류 원소 = 홑원소, 여러 원소 결합 = 화합물'로 판정한다. 화학식을 보고 원소 가짓수로 홑원소·화합물을 직접 가려 보라.", "f": "B2", "rk": 255, "d": 3, "rh": 0, "pre": ["CH1-019", "CH1-020"], "tr": "원소가 여럿이면 다 화합물 같아, 한 종류면 홑원소·결합하면 화합물이라는 판정이 흔들린다.", "an": "한 종류 원소면 홑원소, 결합한 원소면 화합물: 종류 수가 아니라 결합 여부다.", "rd": "한 종류 원소면 홑원소, 결합한 원소면 화합물이다. 종류 수가 아니라 결합 여부로 가른다.", "tf": "한 종류 원소로 된 물질은? (홑원소)"}, "CH1-022": {"n": "물리·화학변화", "c": "ch1", "u": "Ⅰ-1", "t": "B", "dx": "상태만 변하는 물리 변화와 새 물질이 생기는 화학 변화를 구분 못 한 경우다. 이 구분이 약하면 반응식·질량 보존 단원이 흔들린다.", "fx": "'새 물질이 생기면 화학 변화, 상태·모양만 바뀌면 물리 변화'를 기준으로 삼는다. 얼음이 녹음(물리)과 나무가 탐(화학)을 비교해 가려라.", "f": "B2", "rk": 41, "d": 1, "rh": 2, "pre": ["CH1-001"], "tr": "변하면 다 같은 변화 같아, 상태만 변하는(물리)과 새 물질이 생기는(화학) 구분이 흐려진다.", "an": "얼음이 물 되는 건 물리(모습만), 나무가 타는 건 화학(새 물질): 정체가 바뀌나로 가른다.", "rd": "새 물질이 생기나로 가른다. 모습만 변하면 물리, 정체가 변하면 화학이다.", "tf": "얼음이 녹는 건 물리인가 화학인가? (물리)"}, "CH1-023": {"n": "물리·화학적 성질", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "반응 없이 관찰하는 물리적 성질과 반응성인 화학적 성질을 뒤섞은 경우다. 성질의 갈래가 흐리면 반응 예측의 기준이 무너진다.", "fx": "'반응 없이 관찰하면 물리적 성질, 반응성을 보면 화학적 성질'로 가른다. 색·끓는점(물리)과 가연성·반응성(화학)을 분류해 보라.", "f": "B2", "rk": 136, "d": 2, "rh": 0, "pre": ["CH1-022"], "tr": "성질이 다 같은 성질 같아, 반응 없이 보는(물리적)과 반응성(화학적)이 섞인다.", "an": "색·녹는점(물리)은 안 변해도 보이고, 가연성(화학)은 반응해야 드러난다.", "rd": "반응 없이 보이면 물리적, 반응해야 드러나면 화학적 성질이다.", "tf": "가연성은 물리적인가 화학적 성질인가? (화학적)"}, "CH1-024": {"n": "분자 판정", "c": "ch1", "u": "Ⅰ-1", "t": "A", "dx": "공유결합 물질만 분자이고 이온결합 물질은 분자가 아니라는 구분을 놓친 경우다. 이 선이 흐리면 분자식·실험식 표기가 어긋난다.", "fx": "'공유결합 물질만 분자, 이온결합 물질은 분자 아님'을 기준으로 삼는다. CO₂(분자)와 NaCl(이온, 실험식)을 비교해 표기 방식을 확인하라.", "f": "B2", "rk": 669, "d": 6, "rh": 0, "pre": ["CH1-018"], "tr": "물질이면 다 분자로 이뤄진 것 같아, 공유결합만 분자이고 이온결합은 분자가 아니라는 게 빠진다.", "an": "공유결합 물질만 분자로 셈: 소금(이온결합)은 분자가 아니다.", "rd": "공유결합 물질만 독립 분자를 이룬다. 이온결합은 격자라 분자가 아니다.", "tf": "소금(NaCl)은 분자인가? (아니다: 이온결합)"}, "CH1-025": {"n": "물질 상태", "c": "ch1", "u": "Ⅰ-1", "t": "C", "dx": "녹는점·끓는점을 경계로 온도에 따른 상태를 판정하는 게 흔들린 경우다. 상태 판정이 약하면 기체 법칙·상태 변화 단원이 흔들린다.", "fx": "녹는점·끓는점을 경계로 '그보다 낮으면 고체, 사이면 액체, 높으면 기체'로 판정한다. 한 물질의 두 점과 주어진 온도를 비교해 상태를 정해 보라.", "f": "B2", "rk": 137, "d": 2, "rh": 0, "pre": ["CH1-022"], "tr": "상태가 그냥 정해진 것 같아, 녹는점·끓는점을 경계로 온도에 따라 갈린다는 게 흔들린다.", "an": "녹는점·끓는점이 상태의 경계선: 온도가 그 선을 넘으면 상태가 바뀐다.", "rd": "녹는점·끓는점이 상태가 바뀌는 경계 온도다. 그 선을 기준으로 상태가 갈린다.", "tf": "온도가 끓는점을 넘으면 상태는? (기체)"}, "CH1-026": {"n": "불의 이용", "c": "ch1", "u": "Ⅰ-2", "t": "C", "dx": "불(연소)이 조리·난방·제련을 열어 문명을 바꿨다는 맥락을 놓친 경우다. 고온 제련이라는 고리가 약하면 금속 사용 시기 논리로 이어지지 못한다.", "fx": "불을 '조리·난방을 넘어 고온 제련을 가능케 해 금속 시대를 연 열쇠'로 자리매김한다. 불에서 고온, 제련, 금속 사용으로 이어지는 고리를 한 줄로 적어라.", "f": "B2", "rk": 1, "d": 0, "rh": 2, "pre": [], "tr": "불이 그냥 따뜻한 것 같아, 연소가 조리·난방·제련을 열어 문명을 바꿨다는 맥락이 빠진다.", "an": "불(연소)은 조리·난방·제련을 연 인류의 첫 화학 도구다.", "rd": "연소는 열을 내는 화학반응이다. 그래서 조리·난방·제련을 가능케 했다.", "tf": "인류 최초로 쓴 화학반응은? (연소/불)"}, "CH1-027": {"n": "금속 반응성·사용시기", "c": "ch1", "u": "Ⅰ-2", "t": "A", "dx": "반응성이 작아 제련이 쉬운 금속이 먼저 쓰였다는 인과를 놓친 경우다. 반응성↔제련 난이도의 연결이 약하면 사용 시기 순서를 못 잡는다.", "fx": "'반응성이 작은 금속일수록 제련이 쉬워 먼저 쓰였다'는 인과를 기준으로 삼는다. 구리·철·알루미늄을 반응성 순으로 늘어놓고 사용 시기와 맞춰 보라.", "f": "B3", "rk": 42, "d": 1, "rh": 1, "pre": ["CH1-026"], "tr": "좋은 금속이 먼저 쓰였을 것 같은데, 반응성이 작아 제련이 쉬운 금속이 먼저였다는 인과가 거꾸로 느껴진다.", "an": "반응성이 작아 캐기 쉬운 금속이 먼저 쓰였다: 좋아서가 아니라 뽑기 쉬워서다.", "rd": "반응성이 작은 금속은 광석에서 분리가 쉽다. 그래서 그런 금속이 먼저 쓰였다.", "tf": "반응성 큰 금속과 작은 금속 중 먼저 쓰인 건? (작은 쪽: 분리 쉬움)"}, "CH1-028": {"n": "금속 사용시기", "c": "ch1", "u": "Ⅰ-2", "t": "C", "dx": "구리가 철보다 반응성이 작아 먼저 쓰였다는 순서를 놓친 경우다. 반응성 비교가 흔들리면 금속 활용사 전체가 뒤집힌다.", "fx": "'구리는 철보다 반응성이 작아 더 일찍 쓰였다'는 순서를 외운다. 청동기에서 철기로 가는 순서를 반응성 비교로 설명해 보라.", "f": "B3", "rk": 138, "d": 2, "rh": 0, "pre": ["CH1-027"], "tr": "철이 더 흔하니 먼저 쓰였을 것 같아, 구리가 반응성이 작아 먼저였다는 순서가 빠진다.", "an": "구리가 철보다 먼저: 반응성이 작아 광석에서 분리가 쉬웠다.", "rd": "구리는 철보다 반응성이 작아 분리가 쉬웠다. 그래서 구리가 먼저다.", "tf": "구리와 철 중 먼저 쓰인 건? (구리)"}, "CH1-029": {"n": "지각 구성원소", "c": "ch1", "u": "Ⅰ-2", "t": "A", "dx": "지각 구성 1위 산소·2위 규소라는 순위를 놓친 경우다. 지각과 인체의 구성 원소 비교가 흔들린다.", "fx": "지각 구성은 '1위 산소, 2위 규소'로 못 박는다. 인체 구성(산소 1위)과 나란히 두고 지각·인체의 상위 원소를 비교해 외워라.", "f": "C1", "rk": 2, "d": 0, "rh": 0, "pre": [], "tr": "흔한 원소가 막연해, 지각 1위 산소·2위 규소라는 순위가 안 외워진다.", "an": "지각 1위 산소·2위 규소: 발밑 흙의 대부분이 둘이다.", "rd": "측정값으로 지각은 산소가 1위, 규소가 2위다.", "tf": "지각에서 가장 많은 원소는? (산소)"}, "CH1-030": {"n": "인체 구성원소", "c": "ch1", "u": "Ⅰ-2", "t": "A", "dx": "인체 구성이 질량비로는 산소, 개수비로는 수소가 1위라는 기준 차이를 놓친 경우다. 질량비와 개수비를 섞으면 순위 자체가 어긋난다.", "fx": "인체 구성은 '질량비 1위 산소, 개수비 1위 수소'로 기준을 나눠 외운다. 같은 대상도 질량 기준이냐 개수 기준이냐로 순위가 갈림을 확인하라.", "f": "D2", "rk": 3, "d": 0, "rh": 0, "pre": [], "tr": "인체 1위 원소가 하나일 것 같아, 질량비로는 산소·개수비로는 수소라는 기준 차이가 빠진다.", "an": "질량으로는 산소 1위, 개수로는 수소 1위: 잣대 따라 1위가 다르다(물이 H₂O).", "rd": "잣대가 다르면 1위가 다르다. 질량은 산소, 개수는 (가벼운) 수소가 1위다.", "tf": "인체에서 질량 1위 원소는? (산소)"}, "CH1-031": {"n": "질소", "c": "ch1", "u": "Ⅰ-2", "t": "C", "dx": "질소가 공기의 약 78%이자 단백질·DNA 구성 원소라는 점을 놓친 경우다. 질소 고정·하버보슈로 이어지는 맥락이 약해진다.", "fx": "질소를 '공기의 약 78%이자 단백질·DNA의 필수 구성 원소'로 기억한다. 공기 질소는 안정해 쓰기 어렵다는 점을 다음 개념(질소 고정)으로 이어라.", "f": "B2", "rk": 4, "d": 0, "rh": 2, "pre": [], "tr": "질소가 그냥 공기 성분 같아, 78%이자 단백질·DNA 구성 원소라는 게 묻힌다.", "an": "질소는 공기 78%이자 단백질·DNA의 핵심 원소다.", "rd": "질소는 공기의 약 78%이자 단백질·DNA를 이루는 원소다.", "tf": "공기의 약 78%를 차지하는 원소는? (질소)"}, "CH1-032": {"n": "질소 안정성", "c": "ch1", "u": "Ⅰ-2", "t": "A", "dx": "질소 분자(N₂)의 삼중결합이 강해 반응성이 작다는 점을 놓친 경우다. 이걸 놓치면 왜 질소 고정에 큰 에너지가 드는지 설명이 막힌다.", "fx": "질소 분자의 반응성이 작은 이유를 'N₂의 강한 삼중결합'으로 못 박는다. 그래서 질소 고정에 큰 에너지가 든다는 결론까지 한 문장으로 이어 적어라.", "f": "B3", "rk": 43, "d": 1, "rh": 1, "pre": ["CH1-031"], "tr": "질소가 반응을 잘할 것 같아, N₂ 삼중결합이 강해 반응성이 작다는 게 의외다.", "an": "N₂의 삼중결합이 너무 단단해 잘 안 반응: 공기 대부분이 그대로 떠 있다.", "rd": "N₂는 삼중결합이 매우 강해 끊기 어렵다. 그래서 반응성이 작다.", "tf": "N₂가 잘 반응 안 하는 이유는? (삼중결합이 강함)"}, "CH1-033": {"n": "하버보슈", "c": "ch1", "u": "Ⅰ-2", "t": "A", "dx": "하버-보슈가 질소(N₂)와 수소(H₂)로 암모니아를 합성한다는 점을 놓친 경우다. 원료를 잘못 잡으면 비료·질소 순환 맥락이 흔들린다.", "fx": "하버-보슈의 원료와 산물을 'N₂ + H₂에서 NH₃'로 못 박는다. 반응식 N₂ + 3H₂ → 2NH₃를 직접 써 보며 원료를 확인하라.", "f": "B2", "rk": 139, "d": 2, "rh": 0, "pre": ["CH1-032"], "tr": "암모니아가 어디서 오는지 막연해, N₂와 H₂로 합성한다는 게 빠진다.", "an": "공기 질소(N₂)와 수소로 암모니아를 합성: 비료의 출발점이다.", "rd": "공기의 N₂와 H₂를 반응시켜 암모니아를 만든다. 그것이 비료의 출발이다.", "tf": "공기 질소로 암모니아를 만드는 공정은? (하버보슈)"}, "CH1-034": {"n": "원자량 정의", "c": "ch1", "u": "Ⅰ-3", "t": "B", "dx": "원자량을 절대 질량으로 본 경우다. ¹²C 기준의 상대 비라는 점이 흔들리면 평균 원자량·몰 계산이 어긋난다.", "fx": "원자량을 '¹²C를 12로 둔 상대적 질량 비'로 정의한다. 절대 질량(g)이 아니라 비라는 점을, 평균 원자량 계산에 앞서 한 번 적어 확인하라.", "f": "B2", "rk": 140, "d": 2, "rh": 38, "pre": ["CH1-007"], "tr": "원자량이 그 원자의 실제 질량(g) 같아, 상대 비라는 정체가 안 잡힌다.", "an": "원자량은 실제 무게가 아니라 기준 원자와의 비율: 상대 저울 눈금이다.", "rd": "원자 하나는 너무 가벼워 기준과의 비로 나타낸다. 그것이 원자량이다.", "tf": "원자량에 단위가 없는 이유는? (기준과의 비율)"}, "CH1-035": {"n": "원자량 단위", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "원자량이 상대 비라 단위가 없다는 점을 놓친 경우다. 단위 감각이 흐리면 몰질량(g/mol)과 헷갈린다.", "fx": "'원자량은 상대 비라 단위가 없고, 몰질량은 g/mol'로 둘을 갈라 외운다. 같은 수치라도 단위가 붙는지로 원자량과 몰질량을 구분하라.", "f": "D3", "rk": 256, "d": 3, "rh": 0, "pre": ["CH1-034"], "tr": "질량이니 단위가 붙을 것 같아, 상대 비라 단위가 없다는 게 의외다.", "an": "비율이라 단위가 없다: \"몇 배\"엔 단위가 안 붙는다.", "rd": "비율이라 단위가 없다. 몇 배에는 단위가 안 붙는다.", "tf": "원자량 12에 단위가 붙나? (안 붙음: 비율)"}, "CH1-036": {"n": "평균 원자량", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "평균 원자량을 단순 평균으로 본 경우다. 존재비로 가중한다는 점이 약하면 동위원소 문제에서 값이 어긋난다.", "fx": "평균 원자량은 '각 동위원소 질량 × 존재비'의 합(가중 평균)으로 구한다. 염소(³⁵Cl 75%, ³⁷Cl 25%)로 35.5가 나오는 계산을 직접 해 보라.", "f": "D3", "rk": 257, "d": 3, "rh": 1, "pre": ["CH1-034"], "tr": "동위원소 질량을 그냥 평균낼 것 같아, 존재 비로 가중한다는 게 빠진다.", "an": "동위원소를 존재 비율로 섞은 평균: 반 평균 키다.", "rd": "동위원소를 존재 비율로 곱해 더한 가중 평균이다.", "tf": "동위원소가 섞인 원소의 원자량은? (가중 평균)"}, "CH1-037": {"n": "동위원소", "c": "ch1", "u": "Ⅰ-3", "t": "B", "dx": "동위원소가 양성자 수는 같고 중성자 수만 달라 화학적 성질이 같다는 점을 놓친 경우다. 이 틀이 약하면 평균 원자량·질량수 계산이 흔들린다.", "fx": "동위원소를 '양성자 수 같음(같은 원소·같은 성질), 중성자 수만 다름(질량만 다름)'으로 두 축에 정리한다. 수소의 ¹H·²H·³H로 두 축을 확인하라.", "f": "B2", "rk": 258, "d": 3, "rh": 0, "pre": ["CH1-011"], "tr": "동위원소면 성질도 다를 것 같아, 양성자 같고 중성자만 달라 화학적 성질이 같다는 게 안 잡힌다.", "an": "양성자 같고 중성자만 다른 형제: 정체가 같아 화학적 성질이 같다.", "rd": "양성자가 같아 화학적 성질이 같다. 중성자만 달라 질량이 다를 뿐이다.", "tf": "동위원소끼리 화학적 성질은? (같음)"}, "CH1-038": {"n": "분자량·화학식량", "c": "ch1", "u": "Ⅰ-3", "t": "B", "dx": "분자량을 원자량의 곱으로 오인한 경우다. 합이라는 점이 흔들리면 몰질량·양적관계가 전부 어긋난다.", "fx": "분자량은 '구성 원자 원자량의 합'임을 못 박는다. H₂O를 1×2 + 16 = 18로, 곱이 아니라 합으로 계산해 굳혀라.", "f": "D3", "rk": 259, "d": 3, "rh": 34, "pre": ["CH1-034", "CH1-002"], "tr": "분자량이 원자량의 곱일 것 같아, 합이라는 게 흔들린다.", "an": "구성 원자량을 더한 합: 곱이 아니라 합이다.", "rd": "구성 원자의 원자량을 모두 더한 합이다.", "tf": "H₂O의 분자량은? (18: 1×2+16)"}, "CH1-039": {"n": "몰 정의", "c": "ch1", "u": "Ⅰ-3", "t": "A", "dx": "1몰이 입자 6.02×10²³개라는 기준 수를 놓친 경우다. 몰의 정의가 흔들리면 입자 수·질량·부피 환산이 모두 막힌다.", "fx": "'1몰 = 입자 6.02×10²³개'를 기준 수로 못 박는다. 이 수가 입자 수·질량·부피 환산의 공통 다리임을, 한 물질로 세 환산을 이어 적어 확인하라.", "f": "D3", "rk": 5, "d": 0, "rh": 50, "pre": [], "tr": "몰이 막연한 묶음 같아, 입자 6.02×10²³개라는 기준 수가 안 잡힌다.", "an": "몰은 입자 6.02×10²³개 묶음: 12개를 한 다스라 부르듯, 정해진 개수 단위다.", "rd": "다루기 쉬운 묶음이 필요해 6.02×10²³개를 1몰로 약속한다.", "tf": "1몰은 입자 몇 개? (6.02×10²³)"}, "CH1-040": {"n": "몰질량", "c": "ch1", "u": "Ⅰ-3", "t": "A", "dx": "몰질량(g/mol)이 분자량·화학식량과 수치가 같다는 다리를 놓친 경우다. 이 연결이 약하면 질량↔몰 환산이 막힌다.", "fx": "'몰질량(g/mol) = 분자량과 같은 수치'라는 다리를 못 박는다. H₂O 분자량 18이 곧 몰질량 18 g/mol임을 확인하고 질량과 몰을 환산하라.", "f": "D3", "rk": 409, "d": 4, "rh": 20, "pre": ["CH1-039", "CH1-038"], "tr": "몰질량과 분자량이 별개 수 같아, 수치가 같다는 다리가 안 놓인다.", "an": "몰질량(g)과 분자량은 수치가 같다: 분자량 18이면 1몰이 18 g.", "rd": "1몰의 질량은 원자량·분자량 수치에 g을 붙인 값이다. 그래서 수치가 같다.", "tf": "분자량 44인 CO₂ 1몰의 질량은? (44 g)"}, "CH1-041": {"n": "기체 몰부피", "c": "ch1", "u": "Ⅰ-3", "t": "A", "dx": "표준 상태 기체 1몰이 종류와 무관하게 22.4 L라는 점을 놓친 경우다. 이 상수가 흔들리면 기체 양적관계가 전부 어긋난다.", "fx": "'표준 상태(0°C, 1기압) 기체 1몰 = 종류 무관 22.4 L'를 상수로 못 박는다. 부피를 22.4로 나눠 몰을 구하는 환산을 직접 해 보라.", "f": "D3", "rk": 44, "d": 1, "rh": 3, "pre": ["CH1-039"], "tr": "기체마다 부피가 다를 것 같아, 표준 상태 1몰이 종류 무관 22.4 L라는 게 의외다.", "an": "표준 상태 기체 1몰은 종류 무관 22.4 L: 무겁든 가볍든 같은 부피다.", "rd": "같은 조건이면 기체 1몰 부피가 종류와 무관하다. 표준 상태에서 22.4 L다.", "tf": "표준 상태 기체 1몰의 부피는? (22.4 L)"}, "CH1-042": {"n": "아보가드로 법칙", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "같은 온도·압력·부피에 같은 분자 수가 든다(질량 무관)는 법칙을 놓친 경우다. 이 원리가 약하면 부피비=몰비라는 양적관계의 토대가 무너진다.", "fx": "'같은 온도·압력·부피면 분자 수가 같다(질량 무관)'를 기준으로 삼는다. 그래서 기체의 부피비 = 몰비임을, 반응식 계수로 확인하라.", "f": "A3", "rk": 45, "d": 1, "rh": 7, "pre": ["CH1-039"], "tr": "무거운 기체가 같은 부피에 더 적게 들 것 같아, 같은 조건이면 분자 수가 같다(질량 무관)는 게 의외다.", "an": "같은 조건이면 무게와 무관하게 분자 수가 같다: 같은 부피 상자에 든 개수가 같다.", "rd": "같은 조건이면 부피가 분자 수에 비례한다. 그래서 무게와 무관하게 개수가 같다.", "tf": "같은 조건의 H₂와 O₂ 1 L에 분자 수는? (같음)"}, "CH1-043": {"n": "질량 계산", "c": "ch1", "u": "Ⅰ-3", "t": "A", "dx": "몰질량을 구성 원자량의 합으로 구하는 게 흔들린 경우다. 몰질량을 못 잡으면 질량↔몰 환산이 전부 막힌다.", "fx": "몰질량은 '화학식 속 원자량을 모두 더해' 구한다. CO₂를 12 + 16×2 = 44 g/mol로 직접 계산해 질량↔몰 환산의 기준을 세워라.", "f": "D3", "rk": 578, "d": 5, "rh": 0, "pre": ["CH1-040"], "tr": "몰질량을 어떻게 구하는지 막막해, 구성 원자량의 합이라는 게 빠진다.", "an": "몰질량은 구성 원자량의 합으로 구한다.", "rd": "몰질량은 구성 원자량을 더해 구한다.", "tf": "몰질량은 무엇을 더해 구하나? (구성 원자량)"}, "CH1-044": {"n": "몰-입자수", "c": "ch1", "u": "Ⅰ-3", "t": "A", "dx": "1몰 분자 속 원자 수를 분자식 첨자로 환산하는 게 흔들린 경우다. 첨자 환산이 약하면 원자 단위 입자 수 계산이 어긋난다.", "fx": "'분자 1몰 속 특정 원자 몰수 = 1몰 × 그 원자의 첨자'로 환산한다. H₂O 1몰에 H 2몰·O 1몰처럼 첨자를 곱해 원자 몰수를 구하라.", "f": "D3", "rk": 46, "d": 1, "rh": 2, "pre": ["CH1-039"], "tr": "1몰 분자 속 원자 수가 막연해, 분자식 첨자로 환산한다는 게 빠진다.", "an": "분자식 첨자만큼 원자 몰수가 곱해진다: 물 1몰엔 H 2몰.", "rd": "분자 1몰 안 원자 수는 첨자배다. 그래서 첨자만큼 곱한다.", "tf": "H₂O 1몰엔 수소 원자 몇 몰? (2)"}, "CH1-045": {"n": "몰 환산", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "몰수 = 질량 ÷ 몰질량이라는 환산을 놓친 경우다. 이 식이 흔들리면 모든 정량 문제의 출발점이 막힌다.", "fx": "'몰수 = 질량 ÷ 몰질량'을 정량 문제의 출발 식으로 못 박는다. 질량과 몰질량을 넣어 몰수를 구하는 환산을 반복해 손에 익혀라.", "f": "D3", "rk": 579, "d": 5, "rh": 16, "pre": ["CH1-040"], "tr": "몰수를 어떻게 구하는지 막막해, 질량÷몰질량이라는 환산이 안 잡힌다.", "an": "몰수=질량÷몰질량: 무게를 한 개 무게로 나눠 개수를 안다.", "rd": "몰수=질량÷몰질량이다. 전체 무게를 한 개 무게로 나눠 개수를 안다.", "tf": "물 36 g은 몇 몰? (2: 36/18)"}, "CH1-046": {"n": "기체 몰 환산", "c": "ch1", "u": "Ⅰ-3", "t": "B", "dx": "기체 몰수 = 부피 ÷ 22.4 L(표준 상태)라는 환산을 놓친 경우다. 부피↔몰 다리가 약하면 기체 양적관계가 막힌다.", "fx": "'기체 몰수 = 부피 ÷ 22.4 L(표준 상태)'를 부피↔몰 다리로 못 박는다. 주어진 부피를 22.4로 나눠 몰수를 구해 보라.", "f": "D3", "rk": 141, "d": 2, "rh": 1, "pre": ["CH1-041"], "tr": "기체 몰수를 어떻게 구하는지 막막해, 부피÷22.4(표준)라는 환산이 빠진다.", "an": "기체 몰수=부피÷22.4(표준): 부피로 개수를 환산한다.", "rd": "표준 상태 기체 몰수=부피÷22.4다.", "tf": "표준 상태 기체 44.8 L는 몇 몰? (2)"}, "CH1-047": {"n": "몰 비교", "c": "ch1", "u": "Ⅰ-3", "t": "B", "dx": "같은 질량이면 분자량이 작은 기체가 몰수가 많다는 반비례를 놓친 경우다. 질량과 몰수를 혼동하면 입자 수 비교가 어긋난다.", "fx": "'같은 질량이면 분자량이 작을수록 몰수 많음(반비례)'을 기준으로 삼는다. 같은 1 g의 H₂와 O₂ 몰수를 비교해 반비례를 확인하라.", "f": "A2", "rk": 580, "d": 5, "rh": 1, "pre": ["CH1-040"], "tr": "같은 질량이면 몰수도 같을 것 같아, 분자량이 작을수록 몰수가 많다는 반비례가 안 떠오른다.", "an": "같은 질량이라도 가벼운 분자가 더 많은 몰: 같은 무게면 작은 알갱이가 더 많다(반비례).", "rd": "같은 질량이면 몰질량이 작을수록 몰수가 많다. 작은 알갱이가 더 많다(반비례).", "tf": "같은 질량의 H₂와 O₂ 중 몰수가 많은 건? (H₂: 가벼움)"}, "CH1-048": {"n": "원자-분자 몰", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "분자 1몰 속 특정 원자의 몰수를 첨자로 환산하는 게 흔들린 경우다. 이 환산이 약하면 원자 수준 양적관계가 막힌다.", "fx": "'분자 몰수 × 첨자 = 그 원자 몰수'로 환산한다. CO₂ 2몰에 O가 4몰임을 첨자로 계산해 원자 수준 양적관계를 굳혀라.", "f": "D3", "rk": 142, "d": 2, "rh": 0, "pre": ["CH1-044"], "tr": "분자 1몰이면 원자도 1몰 같아, 첨자만큼 곱한다는 게 빠진다.", "an": "분자 1몰이어도 원자는 첨자배: CO₂ 1몰엔 산소 2몰.", "rd": "분자 1몰 안 원자는 첨자만큼 많다. CO₂ 1몰엔 산소 2몰이다.", "tf": "CO₂ 1몰엔 산소 원자 몇 몰? (2)"}, "CH1-049": {"n": "밀도-분자량", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "같은 조건에서 기체 밀도가 분자량에 비례한다는 점을 놓친 경우다. 이 비례가 흔들리면 분자량 측정·기체 비교가 어긋난다.", "fx": "'같은 온도·압력에서 기체 밀도 ∝ 분자량'을 기준으로 삼는다. 밀도가 큰 기체가 분자량이 큼을, 두 기체 밀도 비교로 확인하라.", "f": "A2", "rk": 143, "d": 2, "rh": 0, "pre": ["CH1-041"], "tr": "기체 밀도가 분자량과 무관할 것 같아, 같은 조건이면 비례한다는 게 빠진다.", "an": "같은 조건이면 기체 밀도가 분자량에 비례: 무거운 기체가 더 빽빽하다.", "rd": "같은 조건이면 부피당 분자 수가 같다. 그래서 밀도가 분자량에 비례한다.", "tf": "같은 조건에서 무거운 기체의 밀도는? (큼)"}, "CH1-050": {"n": "기체 분자수-압력", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "같은 온도·부피에서 압력이 분자 수(몰수)에 비례한다는 점을 놓친 경우다. 이 비례가 약하면 분압·기체 평형 해석이 흔들린다.", "fx": "'같은 온도·부피에서 압력 ∝ 분자 수(몰수)'를 기준으로 삼는다. 기체를 더 넣어 몰수가 늘면 압력이 비례해 오름을 분압 해석으로 이어라.", "f": "A2", "rk": 144, "d": 2, "rh": 0, "pre": ["CH1-042"], "tr": "압력이 분자 수와 무관할 것 같아, 같은 온도·부피면 비례한다는 게 빠진다.", "an": "같은 온도·부피면 압력이 분자 수에 비례한다.", "rd": "같은 온도·부피면 압력이 분자 수에 비례한다.", "tf": "같은 온도·부피에서 분자 수가 2배면 압력은? (2배)"}, "CH1-051": {"n": "입자수-질량", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "몰수·몰질량으로 입자 수와 질량을 잇는 게 흔들린 경우다. 이 다리가 약하면 정량 계산이 중간에서 끊긴다.", "fx": "'질량을 몰질량으로 나눠 몰수를, 몰수에 6.02×10²³을 곱해 입자 수를 잇는' 두 다리를 순서대로 둔다. 한 물질로 질량에서 입자 수까지 끊김 없이 환산해 보라.", "f": "D3", "rk": 670, "d": 6, "rh": 0, "pre": ["CH1-045", "CH1-044"], "tr": "입자 수와 질량을 직접 이을 것 같아, 몰수·몰질량을 거친다는 게 흐려진다.", "an": "입자 수와 질량은 몰수·몰질량을 거쳐 이어진다: 직통이 아니다.", "rd": "입자 수와 질량은 몰수·몰질량을 거쳐 이어진다. 직통이 아니다.", "tf": "질량에서 입자 수로 가려면 무엇을 거치나? (몰수)"}, "CH1-052": {"n": "실험식-분자식", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "실험식이 같아도 분자식이 정수배만큼 다를 수 있다(포도당·아세트산)는 점을 놓친 경우다. 이걸 놓치면 조성 분석에서 분자식을 못 확정한다.", "fx": "'같은 실험식이라도 분자식은 정수배만큼 다를 수 있다'를 기준으로 삼는다. 포도당(C₆H₁₂O₆)과 아세트산(C₂H₄O₂)이 같은 실험식 CH₂O임을 확인하라.", "f": "D3", "rk": 410, "d": 4, "rh": 0, "pre": ["CH1-006", "CH1-038"], "tr": "실험식이 같으면 같은 물질 같아, 분자식이 정수배로 다를 수 있다(포도당·아세트산)는 게 빠진다.", "an": "실험식이 같아도 분자식이 정수배로 다를 수 있다: 포도당과 아세트산.", "rd": "같은 비율(실험식)이라도 실제 개수는 정수배일 수 있다. 그래서 분자식이 다를 수 있다.", "tf": "실험식이 같으면 분자식도 같나? (아니다: 정수배 가능)"}, "CH1-053": {"n": "몰-부피", "c": "ch1", "u": "Ⅰ-3", "t": "C", "dx": "기체 몰수와 부피를 22.4 L로 잇는 환산이 흔들린 경우다. 부피↔몰 다리가 약하면 기체 양적관계가 막힌다.", "fx": "'기체 부피 ↔ 몰수'를 22.4 L로 잇는 환산을 못 박는다. 몰수에 22.4를 곱해 부피를, 부피를 22.4로 나눠 몰수를 구해 양방향을 익혀라.", "f": "D3", "rk": 260, "d": 3, "rh": 0, "pre": ["CH1-046"], "tr": "기체 몰수와 부피를 어떻게 잇는지 막막해, 22.4 L로 환산한다는 게 흔들린다.", "an": "기체 몰수와 부피는 22.4 L로 잇는다.", "rd": "표준 상태 기체 몰수와 부피는 22.4 L로 잇는다.", "tf": "기체 몰수와 부피를 잇는 값은? (22.4 L)"}, "CH1-054": {"n": "화학반응식 형식", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "화학반응식을 '왼쪽 반응물 → 오른쪽 생성물'이라는 방향 있는 문장으로 읽지 못한 경우다. 이 문법이 안 잡히면 계수·양적관계 같은 정량 해석이 시작부터 어긋난다.", "fx": "반응식을 '왼쪽 반응물에서 오른쪽 생성물로 가는 방향 있는 문장'으로 읽는다. 화살표 양쪽을 가려 반응물과 생성물을 직접 표시해 보며 문법을 잡아라.", "f": "B2", "rk": 145, "d": 2, "rh": 105, "pre": ["CH1-002"], "tr": "반응식이 그냥 양변 등식 같아, \"반응물→생성물\"이라는 방향 있는 문장이라는 게 흐려진다.", "an": "반응식은 반응물→생성물의 방향 있는 문장: 단순 등식이 아니다.", "rd": "반응물이 생성물로 바뀌는 과정이라 화살표로 방향을 나타낸다.", "tf": "반응식에서 화살표 왼쪽은? (반응물)"}, "CH1-055": {"n": "화학반응식 계수", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "반응식 계수를 단순한 개수표로 보고, 그것이 가장 간단한 정수 몰비라는 의미를 놓친 경우다. 계수를 몰비로 읽지 못하면 이후 양적관계 계산이 통째로 막힌다.", "fx": "계수를 '개수표가 아니라 가장 간단한 정수 몰비'로 읽는다. 2H₂ + O₂ → 2H₂O에서 2:1:2를 몰비로 소리 내어 읽으며 양적관계의 출발로 삼아라.", "f": "D3", "rk": 261, "d": 3, "rh": 102, "pre": ["CH1-054"], "tr": "계수가 단순 개수표 같아, 가장 간단한 정수 몰비라는 의미가 묻힌다.", "an": "계수는 가장 간단한 몰비: 요리 레시피의 재료 비율이다.", "rd": "계수는 반응하는 분자 수의 가장 간단한 비다.", "tf": "계수는 무엇의 비? (반응 분자 수)"}, "CH1-056": {"n": "질량 보존", "c": "ch1", "u": "Ⅰ-4", "t": "A", "dx": "반응에서 질량이 생기거나 사라진다고 본 경우다(빠져나간 기체를 빼먹는 게 전형). 반응은 원자의 재배열일 뿐이라는 보존 감각이 없으면 양적관계의 출발 전제가 무너진다.", "fx": "반응을 '원자가 사라지지 않고 재배열될 뿐'으로 못 박는다. 빠져나간 기체까지 포함한 닫힌 계로 반응 전후 질량을 맞춰 보며 보존을 확인하라.", "f": "D3", "rk": 262, "d": 3, "rh": 2, "pre": ["CH1-054"], "tr": "반응하면 무언가 생기거나 사라질 것 같아, 빠져나간 기체까지 세면 총질량이 같다는 게 빠진다.", "an": "빠져나간 기체까지 다 세면 반응 전후 총질량이 같다: 사라진 게 아니라 안 보일 뿐이다.", "rd": "원자가 새로 생기거나 없어지지 않는다. 빠진 기체까지 세면 총질량이 같다.", "tf": "나무가 타면 질량이 주는 듯한 이유는? (기체가 빠져나감)"}, "CH1-057": {"n": "질량 보존 법칙", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "반응 전후 원자의 종류·수가 그대로라 총질량이 같다는 법칙을, 기체로 빠진 생성물까지 닫힌 계로 셈해야 성립한다는 점에서 놓친 경우다. 이 닫힌 계 감각이 약하면 질량 균형 문제가 어긋난다.", "fx": "'원자의 종류·수가 그대로라 닫힌 계의 총질량이 같다'를 기준으로 삼는다. 기체가 빠지는 반응을 밀폐 용기로 두고 전후 질량을 비교해 법칙을 확인하라.", "f": "D2", "rk": 411, "d": 4, "rh": 1, "pre": ["CH1-056"], "tr": "열린 데서 재면 질량이 줄 것 같아, 닫힌 계로 셈해야 보존이 성립한다는 게 빠진다.", "an": "닫힌 상자 안에서 재야 보존이 보인다: 열린 데선 기체가 달아나 줄어 보인다.", "rd": "닫힌 계라야 빠진 물질이 없다. 그래서 닫힌 계로 셈해야 보존이 성립한다.", "tf": "질량 보존을 확인하려면 어떤 계에서? (닫힌 계)"}, "CH1-058": {"n": "일정 성분비 법칙", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "한 화합물의 성분 질량비가 늘 일정하다는 점을, 혼합물의 가변 비율과 뒤섞어 놓친 경우다. 이 구분이 흔들리면 화합물과 혼합물을 가르는 기준, 나아가 화학식 결정이 어긋난다.", "fx": "'한 화합물의 성분 질량비는 늘 일정, 혼합물은 자유'로 둘을 갈라 둔다. 물의 H:O = 1:8과 소금물의 자유로운 비를 비교해 구분하라.", "f": "B2", "rk": 412, "d": 4, "rh": 3, "pre": ["CH1-038"], "tr": "비율이 자유로울 것 같아, 한 화합물의 성분 질량비는 늘 일정하다는 게(혼합물과 달리) 흐려진다.", "an": "한 화합물의 성분 질량비는 늘 일정: 물은 언제나 H:O=1:8.", "rd": "한 화합물은 원자 비가 정해져 있다. 그래서 성분 질량비가 늘 일정하다.", "tf": "물의 H:O 질량비는 항상? (1:8)"}, "CH1-059": {"n": "일정 성분비 적용", "c": "ch1", "u": "Ⅰ-4", "t": "B", "dx": "일정한 질량비(물에서 수소:산소 = 1:8)로 성분량을 역산하는 적용이 흔들린 경우다. 이 계산이 약하면 조성 분석·화학식 도출에서 막힌다.", "fx": "일정한 질량비(물 수소:산소 = 1:8)로 성분량을 역산한다. 산소 16 g과 결합하는 수소가 2 g임을 비례로 직접 구해 조성 분석에 써라.", "f": "D3", "rk": 581, "d": 5, "rh": 0, "pre": ["CH1-058"], "tr": "성분량을 어떻게 구하는지 막막해, 일정한 질량비로 역산한다는 게 빠진다.", "an": "일정한 질량비로 성분량을 역산한다.", "rd": "질량비가 일정하니 한 성분량에서 다른 성분량을 역산한다.", "tf": "질량비가 일정하면 한 성분으로 다른 성분을? (역산)"}, "CH1-060": {"n": "배수 비례 법칙", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "같은 두 원소가 만든 여러 화합물을 '비교'할 때 한 원소 고정량에 결합한 다른 원소 질량이 간단한 정수비가 된다는 법칙을 놓친 경우다. '여러 화합물 비교'라는 전제를 놓치면 원자설의 정량적 근거를 못 읽는다.", "fx": "배수 비례는 '같은 두 원소가 만든 여러 화합물을 비교할 때' 성립함을 전제로 못 박는다. 한 원소를 고정량으로 두고 다른 원소 질량이 정수비가 되는지 두 화합물로 확인하라.", "f": "D3", "rk": 413, "d": 4, "rh": 1, "pre": ["CH1-038"], "tr": "두 원소면 비율이 하나일 것 같아, 여러 화합물을 비교하면 간단한 정수비가 된다는 게 빠진다.", "an": "같은 두 원소로 된 여러 화합물은 한쪽 같은 양당 다른 쪽이 간단한 정수비: CO·CO₂.", "rd": "같은 두 원소 화합물은 한쪽 같은 양당 다른 쪽이 정수개씩 붙는다. 그래서 간단한 정수비다.", "tf": "CO와 CO₂에서 탄소 같은 양당 산소비는? (1:2)"}, "CH1-061": {"n": "배수 비례 적용", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "CO와 CO₂에서 탄소 같은 양당 산소가 1:2라는 배수 비례 적용이 흔들린 경우다. 화합물 쌍을 직접 비교하는 셈이 약하면 배수 비례 문제가 어긋난다.", "fx": "화합물 쌍을 직접 비교해 배수 비례를 적용한다. 탄소 같은 양당 CO와 CO₂의 산소가 1:2임을 계산해 정수비를 확인하라.", "f": "D3", "rk": 582, "d": 5, "rh": 0, "pre": ["CH1-060"], "tr": "CO·CO₂ 산소비가 막연해, 탄소 같은 양당 1:2라는 적용이 빠진다.", "an": "탄소 같은 양당 CO:CO₂의 산소비가 1:2다.", "rd": "탄소 같은 양에 CO는 산소 1, CO₂는 2다. 그래서 1:2다.", "tf": "같은 두 원소 화합물의 질량비는? (간단한 정수비)"}, "CH1-062": {"n": "기체 반응 법칙", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "같은 온도·압력에서 반응하는 기체 부피가 간단한 정수비라는 점을, 질량비와 혼동하거나 조건 일정 전제를 빼먹어 놓친 경우다. 이 법칙이 약하면 아보가드로 법칙·분자설로 이어지는 고리가 끊긴다.", "fx": "'같은 온도·압력에서 반응 기체의 부피가 간단한 정수비'임을 못 박는다(질량비 아님). 수소·산소·수증기 부피가 2:1:2임을 확인하며 아보가드로 법칙으로 이어라.", "f": "B2", "rk": 146, "d": 2, "rh": 1, "pre": ["CH1-042"], "tr": "기체 부피비가 질량비 같아, 부피가 간단한 정수비(조건 일정)라는 게 흐려진다.", "an": "같은 조건 기체는 부피가 간단한 정수비로 반응: 수소:산소=2:1.", "rd": "같은 조건 기체는 부피가 분자 수에 비례한다. 그래서 부피가 간단한 정수비다.", "tf": "수소와 산소가 물 될 때 부피비는? (2:1)"}, "CH1-063": {"n": "계수비-분자수", "c": "ch1", "u": "Ⅰ-4", "t": "B", "dx": "계수비를 질량의 비로 받아들이고, 그것이 실은 분자(입자) 수의 비라는 점을 놓친 경우다. 계수=분자 수라는 기준이 흔들리면 몰비·부피비 해석이 함께 무너진다.", "fx": "계수비를 '질량이 아니라 분자(입자) 수의 비'로 못 박는다. 2H₂ + O₂에서 분자 수 2:1을 세어 보며 몰비·부피비의 토대로 삼아라.", "f": "B2", "rk": 414, "d": 4, "rh": 0, "pre": ["CH1-055", "CH1-042"], "tr": "계수비가 질량비 같아, 실은 분자(입자) 수의 비라는 게 빠진다.", "an": "계수비는 질량비가 아니라 분자(입자) 수의 비다.", "rd": "계수는 반응하는 분자 수의 비다. 질량비가 아니다.", "tf": "계수비는 질량비인가 분자 수 비인가? (분자 수)"}, "CH1-064": {"n": "계수비-질량비", "c": "ch1", "u": "Ⅰ-4", "t": "A", "dx": "계수비를 그대로 질량비로 쓴 경우다. 물질마다 분자량이 달라 (몰수 × 분자량)을 거쳐야 질량비가 되는데 그 단계를 건너뛴 것이다. 이 한 단계를 빠뜨리면 질량 기반 양적관계·수율 계산이 전부 틀어진다.", "fx": "계수비 = 몰비임을 먼저 못 박고, 질량을 물으면 반드시 몰수에 분자량을 곱하는 한 단계를 끼운다. 계수에서 몰, 몰에서 질량으로 잇는 3단 환산을 한 반응으로 직접 써 보라.", "f": "B2", "rk": 415, "d": 4, "rh": 0, "pre": ["CH1-055"], "tr": "계수가 곧 질량 같아, 계수비를 그대로 질량비로 쓴다.", "an": "계수를 질량으로 쓰면 틀린다: 계수는 개수 비다.", "rd": "계수는 개수 비라 질량으로 쓰면 틀린다. 질량은 몰질량을 곱해야 한다.", "tf": "계수를 질량으로 바로 쓰면? (틀림: 개수 비)"}, "CH1-065": {"n": "계수비-부피비", "c": "ch1", "u": "Ⅰ-4", "t": "B", "dx": "계수비가 부피비와 같아지는 건 기체에 한정된다(아보가드로 법칙)는 단서를 놓친 경우다. 적용 범위를 기체로 제한하지 못하면 액체·고체가 섞인 반응에서 부피비를 잘못 쓴다.", "fx": "'계수비 = 부피비'는 기체에만 적용됨(아보가드로 법칙)을 단서로 못 박는다. 액체·고체가 낀 반응에선 부피비를 쓰지 않음을 예로 가려라.", "f": "D2", "rk": 416, "d": 4, "rh": 2, "pre": ["CH1-055", "CH1-042"], "tr": "계수비가 늘 부피비 같아, 기체에 한정된다(아보가드로)는 단서가 빠진다.", "an": "계수비가 부피비가 되는 건 기체일 때만(아보가드로).", "rd": "같은 조건 기체는 부피가 분자 수에 비례한다. 그래서 기체에 한해 계수비=부피비다.", "tf": "계수비가 부피비가 되는 건 언제? (기체일 때)"}, "CH1-066": {"n": "양적관계 부피", "c": "ch1", "u": "Ⅰ-4", "t": "B", "dx": "기체 반응에서 계수비를 그대로 부피비로 옮겨 부피를 구하는 적용이 흔들린 경우다. 이 환산이 약하면 기체 양적관계 문제에서 답이 어긋난다.", "fx": "기체 반응은 '계수비를 그대로 부피비로' 옮겨 부피를 구한다. 주어진 기체 부피에 계수비를 적용해 다른 기체 부피를 직접 구해 보라.", "f": "D3", "rk": 583, "d": 5, "rh": 0, "pre": ["CH1-065"], "tr": "부피를 어떻게 구하는지 막막해, 계수비를 그대로 부피비로 옮긴다는 게 흔들린다.", "an": "기체 부피는 계수비를 그대로 옮긴다.", "rd": "기체는 계수비가 곧 부피비다. 그대로 옮긴다.", "tf": "기체 반응에서 계수비는 곧? (부피비)"}, "CH1-067": {"n": "양적관계 몰", "c": "ch1", "u": "Ⅰ-4", "t": "B", "dx": "계수비를 몰비로 옮겨 반응·생성 몰수를 구하는 적용이 흔들린 경우다. 가장 기본인 몰 환산이 약하면 질량·부피 양적관계가 줄줄이 막힌다.", "fx": "계수비를 몰비로 옮겨 반응·생성 몰수를 구한다. 한 물질의 몰수에 계수비를 곱해 짝 물질의 몰수를 구하는 환산을 반복해 익혀라.", "f": "D3", "rk": 671, "d": 6, "rh": 12, "pre": ["CH1-055", "CH1-045"], "tr": "몰을 어떻게 구하는지 막막해, 계수비를 몰비로 옮긴다는 게 흔들린다.", "an": "몰은 계수비를 그대로 옮긴다: 계수가 곧 몰비다.", "rd": "계수가 곧 반응 몰비다. 그대로 옮긴다.", "tf": "계수비는 곧 무슨 비? (몰비)"}, "CH1-068": {"n": "한계 반응물", "c": "ch1", "u": "Ⅰ-4", "t": "A", "dx": "단순히 양이 적은 쪽을 한계 반응물로 본 경우다. 계수로 나눈 '반응에 쓸 수 있는 몫'을 비교해야 누가 먼저 동나는지 정해진다. 이 비교를 건너뛰면 생성물 최대량·수율 계산이 엉뚱한 기준에서 출발한다.", "fx": "한계 반응물은 '각 반응물의 몰수를 계수로 나눈 몫이 가장 작은 쪽'으로 정한다. 양이 많아도 몫이 작으면 먼저 동남을, 계수가 다른 예제로 확인하라.", "f": "B2", "rk": 712, "d": 7, "rh": 0, "pre": ["CH1-067"], "tr": "양이 적은 쪽이 한계일 것 같아, 계수비로 따져야 한다는 게 빠진다.", "an": "양이 적은 쪽이 아니라 계수비로 따져 먼저 떨어지는 쪽이 한계: 레시피 비율로 본다.", "rd": "계수비로 따져 먼저 떨어지는 쪽이 반응을 멈춘다. 양이 적은 쪽이 아니다.", "tf": "양이 적은 반응물이 항상 먼저 떨어지나? (아니다: 계수비로)"}, "CH1-069": {"n": "몰비-계수비", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "계수가 곧 반응 몰비라는 점을 질량비와 헷갈려 놓친 경우다. 계수=몰비라는 출발점이 흔들리면 모든 양적관계가 첫 단추부터 어긋난다.", "fx": "'계수가 곧 반응 몰비'임을 첫 단추로 못 박는다(질량비 아님). 반응식 계수를 그대로 몰비로 읽어 양적관계의 출발점을 세워라.", "f": "B2", "rk": 417, "d": 4, "rh": 0, "pre": ["CH1-055"], "tr": "계수가 질량비 같아, 곧 반응 몰비라는 게 흔들린다.", "an": "계수가 곧 반응 몰비다.", "rd": "계수가 곧 반응 몰비다.", "tf": "반응 몰비는 무엇과 같나? (계수)"}, "CH1-070": {"n": "계수 맞추기", "c": "ch1", "u": "Ⅰ-4", "t": "A", "dx": "계수가 아니라 화학식(첨자)을 바꿔 맞추려 한 경우다. 첨자를 바꾸면 다른 물질이 되므로, 원자 종류별 수가 양변에 같도록 계수만 조정해야 한다. 균형을 못 맞추면 그 뒤 모든 양적관계가 틀린 식 위에 세워진다.", "fx": "균형은 '첨자(화학식)는 건드리지 말고 계수만 조정'해 맞춘다. 원자 종류별 수를 양변에 적어 같아지도록 계수만 바꾸는 연습을 하라.", "f": "D3", "rk": 584, "d": 5, "rh": 0, "pre": ["CH1-055", "CH1-057"], "tr": "화학식 첨자를 바꿔 맞추고 싶어져, 계수만 조절해 균형 잡는다는 게 빠진다.", "an": "첨자(화학식)는 못 건드리고 계수만 조절해 균형: 레시피 양만 조절한다.", "rd": "원자 수 보존을 위해 계수만 조절한다. 첨자를 바꾸면 다른 물질이 된다.", "tf": "계수를 맞출 때 첨자를 바꿔도 되나? (안 됨: 계수만)"}, "CH1-071": {"n": "양적관계 질량", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "계수비로 몰을 구한 뒤 몰질량을 곱해 질량으로 옮기는 마지막 환산이 흔들린 경우다. 몰에서 질량으로 가는 다리가 약하면 질량 양적관계의 결론이 어긋난다.", "fx": "계수비로 몰을 구한 뒤 '몰 × 몰질량'으로 질량으로 옮긴다. 마지막 환산에서 몰질량을 곱하는 단계를 빠뜨리지 않도록 끝까지 적어라.", "f": "D3", "rk": 713, "d": 7, "rh": 0, "pre": ["CH1-067", "CH1-045"], "tr": "몰까지 구하고 멈출 것 같아, 몰질량을 곱해 질량으로 옮기는 마지막 환산이 빠진다.", "an": "몰에서 멈추지 말고 몰질량을 곱해 질량까지: 마지막 환산을 잊지 않는다.", "rd": "몰에서 몰질량을 곱해야 질량이 나온다. 마지막 환산을 잊지 않는다.", "tf": "몰에서 질량으로 가려면? (몰질량을 곱함)"}, "CH1-072": {"n": "계수 규칙", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "반응에 참여하는 물질만, 그리고 계수는 양의 정수로 쓴다는 규칙을 놓친 경우다. 식 작성 규칙이 흐리면 균형·양적관계의 전제가 흔들린다.", "fx": "식 작성은 '반응에 참여하는 물질만, 계수는 양의 정수로'를 규칙으로 둔다. 규칙에 맞는지 점검하며 반응식을 써 균형의 전제를 갖춰라.", "f": "D3", "rk": 418, "d": 4, "rh": 0, "pre": ["CH1-055"], "tr": "계수에 아무 수나 될 것 같아, 양의 정수로 쓴다는 규칙이 흐려진다.", "an": "계수는 양의 정수로 쓴다.", "rd": "분자 개수라 양의 정수로 쓴다.", "tf": "계수는 어떤 수로? (양의 정수)"}, "CH1-073": {"n": "분자설 도입", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "분자설을 원자설과 충돌하는 것으로 본 경우다. 원자설만으로 설명 못 한 기체 부피비를 메우려 분자 개념이 보태진 것이다. 이 보완 관계를 놓치면 부피비=분자 수 비라는 결론의 뿌리를 못 짚는다.", "fx": "분자설을 '원자설과 충돌이 아니라, 설명 못 한 기체 부피비를 메우려 보탠 보완'으로 본다. 부피비 = 분자 수 비라는 결론이 분자 개념에서 나옴을 짚어라.", "f": "B2", "rk": 47, "d": 1, "rh": 0, "pre": ["CH1-001"], "tr": "분자설이 원자설과 부딪칠 것 같아, 보완한다는 게 안 잡힌다.", "an": "분자설은 원자설을 보완: 기체 반응 부피비를 설명한다.", "rd": "원자설만으론 기체 반응 부피비를 설명 못했다. 분자 개념이 그것을 보완한다.", "tf": "기체 부피비를 설명하려 도입된 것은? (분자 개념)"}, "CH1-074": {"n": "일정 성분비 범위", "c": "ch1", "u": "Ⅰ-4", "t": "B", "dx": "일정 성분비 법칙을 비율이 자유로운 혼합물에까지 적용한 경우다. 법칙의 적용 범위를 화합물로 좁히지 못하면 혼합물 문제에서 엉뚱한 일정 비를 가정하게 된다.", "fx": "일정 성분비는 '비율이 정해진 화합물에만' 적용함을 못 박는다. 혼합물은 비가 자유로워 이 법칙을 가정하면 안 됨을 예로 가려라.", "f": "D1", "rk": 585, "d": 5, "rh": 0, "pre": ["CH1-058", "CH1-020"], "tr": "일정 성분비가 모든 물질에 적용될 것 같아, 혼합물은 비율이 자유라는 한계가 빠진다.", "an": "일정 성분비는 화합물만: 혼합물(소금물)은 비율이 자유롭다.", "rd": "일정 성분비는 화합물에만 성립한다. 혼합물은 섞는 비율이 자유다.", "tf": "일정 성분비가 성립하는 물질은? (화합물)"}, "CH1-075": {"n": "양적관계 몰수변화", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "반응 전후 기체 총 몰수가 늘 일정하다고 본 경우다. 양변 계수 합을 비교하면 늘 수도, 줄 수도, 같을 수도 있다. 이 감각이 없으면 반응에 따른 압력·부피 변화 해석이 어긋난다.", "fx": "반응 전후 기체 몰수는 '양변 계수 합을 비교'해 늘 수도, 줄 수도, 같을 수도 있음을 본다. 계수 합 변화로 압력·부피 변화를 예측해 보라.", "f": "D1", "rk": 714, "d": 7, "rh": 0, "pre": ["CH1-067"], "tr": "반응 전후 기체 몰수가 늘 같을 것 같아, 변할 수 있다는 게 빠진다.", "an": "반응 전후 기체 몰수가 변할 수 있다: 늘 같지 않다.", "rd": "반응 전후 기체 분자 수가 달라질 수 있다. 그래서 몰수가 변할 수 있다.", "tf": "반응 전후 기체 몰수는 항상 같나? (아니다)"}, "CH1-076": {"n": "부피비-몰비", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "기체 부피비를 질량비로 본 경우다. 부피는 몰수에 비례(부피 ∝ 몰수)하므로 부피비가 곧 몰비다. 이 비례를 놓치면 기체 양적관계에서 질량과 부피를 섞어 쓴다.", "fx": "'기체 부피는 몰수에 비례하므로 부피비 = 몰비'임을 못 박는다(질량비 아님). 부피비를 곧장 몰비로 읽어 기체 양적관계에 써라.", "f": "B2", "rk": 586, "d": 5, "rh": 0, "pre": ["CH1-065"], "tr": "기체 부피비가 질량비 같아, 몰비라는 게 흔들린다.", "an": "기체 부피비는 곧 몰비다.", "rd": "같은 조건 기체는 부피가 몰수에 비례한다. 그래서 부피비=몰비다.", "tf": "기체 부피비는 곧? (몰비)"}, "CH1-223": {"n": "양적관계", "c": "ch1", "u": "Ⅰ-4", "t": "C", "dx": "기체 반응에서 부피비가 곧 분자 수 비라는 점(아보가드로 법칙)을 놓친 경우다. 계수가 주는 몰비와 부피비를 잇지 못하면 기체 양적관계 문제가 막힌다.", "fx": "기체 반응은 '부피비 = 분자 수 비(아보가드로 법칙)'로 못 박는다. 계수의 몰비와 부피비를 이어 기체 양적관계를 풀어라.", "f": "B2", "rk": 268, "d": 3, "rh": 0, "pre": ["CH1-062"], "tr": "기체 부피비가 질량비 같아, 분자 수 비(아보가드로)라는 게 흐려진다.", "an": "기체 부피비는 분자 수 비(아보가드로)다.", "rd": "같은 조건 기체는 부피가 분자 수에 비례한다(아보가드로).", "tf": "기체 부피비는 무엇의 비? (분자 수)"}, "CH1-077": {"n": "원자 구성", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "원자를 핵(양성자·중성자)만으로 떠올리고 핵 바깥 전자를 구성에서 빠뜨린 경우다. 전자를 빼면 원자의 전기적 중성도, 이온이 왜 전자만으로 생기는지도 설명할 수 없다.", "fx": "원자를 '핵(양성자·중성자) + 핵 바깥 전자'로, 전자를 빼지 않고 그린다. 전자가 있어야 중성이 성립하고 전자만 드나들어 이온이 됨을 이어 짚어라.", "f": "B2", "rk": 147, "d": 2, "rh": 144, "pre": ["CH1-007"], "tr": "원자를 핵만으로 떠올려, 핵 바깥 전자를 구성에서 빠뜨린다.", "an": "원자는 핵+핵 밖 전자: 핵만으로는 반쪽이다.", "rd": "원자는 핵과 핵 밖 전자로 이뤄진다. 핵만으론 반쪽이다.", "tf": "원자는 핵과 무엇으로? (핵 밖 전자)"}, "CH1-078": {"n": "입자 전하", "c": "ch1", "u": "Ⅱ-1", "t": "B", "dx": "세 입자의 전하를 양성자 +1·전자 −1(크기 같고 부호 반대)·중성자 0으로 못 박지 못한 경우다. 전하의 기준값이 흐리면 원자의 중성 조건과 이온 전하 계산이 흔들린다.", "fx": "세 입자 전하를 '양성자 +1, 전자 −1(크기 같고 부호 반대), 중성자 0'으로 못 박는다. 이 값으로 중성 조건과 이온 전하를 직접 셈하라.", "f": "B2", "rk": 263, "d": 3, "rh": 14, "pre": ["CH1-077"], "tr": "세 입자 전하가 헷갈려, 양성자 +1·전자 -1·중성자 0이 섞인다.", "an": "양성자(+1)·전자(-1)·중성자(0).", "rd": "양성자 +1, 전자 -1, 중성자 0이다.", "tf": "양성자의 전하는? (+1)"}, "CH1-079": {"n": "원자번호", "c": "ch1", "u": "Ⅱ-1", "t": "A", "dx": "원자번호를 양성자 수가 아닌 다른 수로 잡거나 질량수와 뒤섞은 경우다. 양성자 수가 곧 원소의 정체성이라는 이 한 줄이 흔들리면 주기율표 위치부터 그 뒤 화학 전부가 어긋난다.", "fx": "원자번호를 '양성자 수, 곧 원소의 정체성'으로 못 박는다(질량수와 구분). 양성자 수가 바뀌면 다른 원소가 됨을, 주기율표 위치와 맞춰 확인하라.", "f": "B2", "rk": 264, "d": 3, "rh": 17, "pre": ["CH1-077"], "tr": "원자번호가 막연한 번호 같아, 양성자 수라는 정체가 흐려지고 질량수와 섞인다.", "an": "원자번호=양성자 수, 원소의 정체: 질량수와 다르다.", "rd": "원소를 정하는 양성자 수가 원자번호다. 질량수와 다르다.", "tf": "원자번호는 무엇의 수? (양성자)"}, "CH1-080": {"n": "원소 결정", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "무엇이 원소 종류를 정하는지에서 양성자 수가 아니라 중성자·전자를 떠올린 경우다. 양성자 수가 정체성이라는 점을 놓치면 동위원소와 이온이 왜 여전히 같은 원소인지 이해하지 못한다.", "fx": "'원소 종류를 정하는 건 오직 양성자 수'임을 기준으로 삼는다. 그래서 중성자·전자가 달라도(동위원소·이온) 같은 원소임을 짚어라.", "f": "B2", "rk": 419, "d": 4, "rh": 0, "pre": ["CH1-079"], "tr": "무엇이 원소를 정하는지 막막해, 중성자·전자가 아니라 양성자 수라는 게 흔들린다.", "an": "원소를 정하는 건 양성자 수: 중성자·전자가 변해도 원소는 그대로다.", "rd": "양성자 수가 화학적 정체를 정한다. 중성자·전자가 변해도 원소는 그대로다.", "tf": "중성자가 변하면 원소가 바뀌나? (아니다)"}, "CH1-081": {"n": "질량수", "c": "ch1", "u": "Ⅱ-1", "t": "A", "dx": "질량수를 양성자와 중성자의 합으로 보지 못한 경우다(전자를 끼워 넣거나 한쪽을 빠뜨리는 게 전형). 전자 질량은 무시할 만하다는 감각까지 잡혀야 중성자 수 계산·동위원소 구분으로 이어진다.", "fx": "질량수를 '양성자 수 + 중성자 수'로 못 박는다(전자 질량은 무시). 질량수에서 원자번호를 빼 중성자 수를 구하는 역산을 직접 해 보라.", "f": "D3", "rk": 420, "d": 4, "rh": 3, "pre": ["CH1-079"], "tr": "질량수에 전자도 넣을 것 같아, 양성자+중성자라는 게 흔들린다.", "an": "질량수=양성자+중성자: 전자는 안 센다.", "rd": "핵 알맹이는 양성자·중성자뿐이라 질량수=양성자+중성자다. 전자는 안 센다.", "tf": "질량수는 무엇의 합? (양성자+중성자)"}, "CH1-082": {"n": "원자 표기", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "원소 기호 표기에서 왼쪽 위 질량수와 왼쪽 아래 원자번호의 자리를 바꿔 읽은 경우다. 표기를 거꾸로 읽으면 양성자·중성자 수를 통째로 잘못 뽑아낸다.", "fx": "원소 기호 표기를 '왼쪽 위 = 질량수, 왼쪽 아래 = 원자번호'로 자리를 고정한다. 한 핵종을 적고 두 수에서 양성자·중성자 수를 뽑아 보라.", "f": "D3", "rk": 587, "d": 5, "rh": 0, "pre": ["CH1-079", "CH1-081"], "tr": "질량수·원자번호 자리가 헷갈려, 왼쪽 위·아래가 뒤바뀐다.", "an": "왼쪽 위가 질량수, 왼쪽 아래가 원자번호: 자리 약속이다.", "rd": "약속상 왼쪽 위에 질량수, 왼쪽 아래에 원자번호를 쓴다.", "tf": "원소 기호 왼쪽 위는 무엇? (질량수)"}, "CH1-083": {"n": "전자수", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "중성 원자의 전자 수가 양성자 수와 같다는 점을, 중성자 수 등과 헷갈려 놓친 경우다. 이 등식이 흔들리면 전자 배치의 출발 전자 수부터 어긋난다.", "fx": "'중성 원자는 전자 수 = 양성자 수'를 등식으로 못 박는다. 원자번호로 전자 수를 잡아 전자 배치의 출발점으로 삼아라.", "f": "D3", "rk": 421, "d": 4, "rh": 6, "pre": ["CH1-079", "CH1-010"], "tr": "전자 수가 막연해, 중성 원자면 양성자 수와 같다는 게 흔들린다.", "an": "중성 원자면 전자 수=양성자 수다.", "rd": "중성 원자면 (+)와 (-)가 같아 전자 수=양성자 수다.", "tf": "중성 원자의 전자 수는 무엇과 같나? (양성자 수)"}, "CH1-084": {"n": "질량수 계산", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "질량수 = 양성자 + 중성자라는 관계를 뒤집어 중성자 수를 합으로 구한 경우다. 중성자 수 = 질량수 − 원자번호라는 역산이 안 잡히면 동위원소 비교가 어긋난다.", "fx": "'중성자 수 = 질량수 − 원자번호'로 역산한다. 질량수와 원자번호를 넣어 중성자 수를 구하고 동위원소를 비교해 보라.", "f": "D3", "rk": 588, "d": 5, "rh": 0, "pre": ["CH1-081"], "tr": "질량수=양성자+중성자를 뒤집어, 중성자를 합으로 구한다.", "an": "중성자=질량수-양성자: 식을 거꾸로 푼다.", "rd": "질량수=양성자+중성자라 중성자=질량수-양성자다.", "tf": "질량수 23, 양성자 11이면 중성자는? (12)"}, "CH1-085": {"n": "동위원소", "c": "ch1", "u": "Ⅱ-1", "t": "A", "dx": "동위원소를 양성자가 다른(즉 다른 원소인) 것으로 본 경우다. 양성자 수가 같아 화학적 성질이 같고 중성자 수만 달라 질량이 다른 것이라는 두 축을 잡아야, 평균 원자량과 동위원소 분리 불가의 이유가 풀린다.", "fx": "동위원소를 '양성자 같아 성질 같음, 중성자만 달라 질량 다름' 두 축으로 잡는다. 이 두 축으로 평균 원자량과 분리 불가의 이유를 설명해 보라.", "f": "B2", "rk": 422, "d": 4, "rh": 6, "pre": ["CH1-079"], "tr": "동위원소면 다른 원소 같아, 양성자 같고 중성자만 다르다는 게 흔들린다.", "an": "양성자 같고 중성자만 다른 형제다.", "rd": "양성자가 같으면 같은 원소다. 중성자만 다른 변이가 동위원소다.", "tf": "양성자 같고 중성자 다른 관계는? (동위원소)"}, "CH1-086": {"n": "입자 질량", "c": "ch1", "u": "Ⅱ-1", "t": "B", "dx": "양성자·중성자는 질량이 비슷하고 전자는 약 1840분의 1로 훨씬 가볍다는 비를 놓친 경우다. 이 질량 차가 안 잡히면 원자 질량이 사실상 핵에 몰려 있다는 다음 개념이 흔들린다.", "fx": "'양성자≈중성자, 전자는 약 1840분의 1로 가벼움'을 기준으로 삼는다. 그래서 질량이 핵에 몰린다는 다음 개념까지 이어 적어라.", "f": "C1", "rk": 265, "d": 3, "rh": 2, "pre": ["CH1-077"], "tr": "셋 다 입자라 비슷할 것 같아, 전자만 1840분의 1로 가볍다는 게 의외다.", "an": "전자만 1840분의 1로 가볍다.", "rd": "전자는 핵자의 약 1/1840이다. 그래서 가볍다.", "tf": "전자는 양성자의 약 몇 분의 1? (1/1840)"}, "CH1-087": {"n": "원자 질량 분포", "c": "ch1", "u": "Ⅱ-1", "t": "B", "dx": "원자 질량이 핵(양성자·중성자)에 거의 다 몰려 있고 전자 몫은 무시할 만하다는 점을 놓친 경우다. 이걸 놓치면 질량수가 곧 원자 질량을 대표한다는 셈이 흔들린다.", "fx": "'원자 질량은 핵에 거의 다, 전자 몫은 무시'로 못 박는다. 그래서 질량수가 곧 원자 질량을 대표함을 한 문장으로 이어라.", "f": "C1", "rk": 423, "d": 4, "rh": 1, "pre": ["CH1-086"], "tr": "질량이 골고루 퍼진 것 같아, 핵에 거의 다 몰리고 전자 몫은 무시할 만하다는 게 빠진다.", "an": "질량 거의 전부가 핵에 몰림: 전자 몫은 무시할 만하다.", "rd": "질량은 거의 전부 핵에 있다. 전자 몫은 무시할 만하다.", "tf": "원자 질량은 주로 어디에? (핵)"}, "CH1-088": {"n": "원자핵 크기", "c": "ch1", "u": "Ⅱ-1", "t": "B", "dx": "원자핵이 부피로는 극히 작은 점이면서 질량 대부분을 차지한다는 두 사실을 함께 잡지 못한 경우다. 이 대비가 약하면 원자가 대부분 빈 공간이라는 러더퍼드 결론을 이해하지 못한다.", "fx": "핵을 '부피로는 극히 작은 점이면서 질량은 대부분'이라는 두 사실로 함께 잡는다. 그래서 원자가 대부분 빈 공간이라는 러더퍼드 결론으로 이어라.", "f": "A4", "rk": 589, "d": 5, "rh": 0, "pre": ["CH1-077", "CH1-087"], "tr": "핵이 크고 무거울 것 같아, 부피로는 극히 작은 점이면서 질량 대부분을 차지한다는 두 사실이 안 잡힌다.", "an": "핵은 부피로는 점, 질량으로는 거의 전부: 작지만 무겁다.", "rd": "핵은 부피로는 점이지만 질량은 거의 전부다. 작지만 무겁다.", "tf": "핵은 작은데 질량은? (거의 전부)"}, "CH1-089": {"n": "동위원소 정의", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "동위원소의 정의를 거꾸로(양성자 다르고 중성자 같음) 잡은 경우다. '양성자 같고 중성자 다름'이라는 방향을 바로잡지 못하면 동위원소 판정 전체가 뒤집힌다.", "fx": "동위원소 정의의 방향을 '양성자 같음, 중성자 다름'으로 바로잡는다. 거꾸로 잡지 않도록 두 축을 적어 판정에 써라.", "f": "B2", "rk": 590, "d": 5, "rh": 0, "pre": ["CH1-085"], "tr": "동위원소 정의가 헷갈려, 양성자 다르고 중성자 같다고 거꾸로 잡는다.", "an": "양성자 같고 중성자 다름: 거꾸로 잡지 않는다.", "rd": "양성자가 같고 중성자가 다르다. 거꾸로가 아니다.", "tf": "동위원소는 양성자가 같나 다른가? (같음)"}, "CH1-090": {"n": "평균 원자량", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "평균 원자량을 동위원소 질량의 단순 평균으로 본 경우다. 존재비로 가중한다는 점을 놓치면 실제 원자량 값이 어긋나 몰 계산까지 틀어진다.", "fx": "평균 원자량은 '동위원소 질량 × 존재비의 합(가중 평균)'으로 구한다. 단순 평균이 아님을, 존재비가 다른 예로 직접 계산해 확인하라.", "f": "D3", "rk": 591, "d": 5, "rh": 0, "pre": ["CH1-085", "CH1-036"], "tr": "동위원소 질량을 그냥 평균낼 것 같아, 존재 비 가중이 빠진다.", "an": "존재 비율로 가중한 평균이다.", "rd": "동위원소를 존재 비율로 가중한 평균이다.", "tf": "동위원소의 원자량은 무엇으로 계산? (존재 비율 가중)"}, "CH1-091": {"n": "동위원소 전자", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "동위원소끼리 전자 수·전자 배치가 다를 거라 본 경우다. 양성자 수가 같으니 전자 수도 같고, 그래서 화학적 성질이 같다는 연결을 놓치면 동위원소의 핵심을 못 짚는다.", "fx": "'동위원소는 양성자 수가 같아 전자 수·배치도 같다'를 못 박는다. 그래서 화학적 성질이 같다는 결론까지 이어 짚어라.", "f": "B2", "rk": 592, "d": 5, "rh": 0, "pre": ["CH1-085", "CH1-083"], "tr": "동위원소끼리 전자가 다를 것 같아, 같다는 게 흔들린다.", "an": "동위원소끼리 전자 수는 같다.", "rd": "동위원소는 양성자가 같아 (중성 원자) 전자 수도 같다.", "tf": "동위원소(중성 원자)끼리 전자 수는? (같음)"}, "CH1-092": {"n": "핵전하", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "핵의 (+)전하가 양성자에서만 나오고 중성자는 전하가 없다는 점을 놓친 경우다. 핵전하의 출처가 흐리면 유효핵전하·핵과 전자의 인력 해석이 흔들린다.", "fx": "핵의 (+)전하가 '양성자에서만 나오고 중성자는 0'임을 못 박는다. 핵전하 = 양성자 수임을 유효핵전하 해석의 출발로 삼아라.", "f": "B2", "rk": 424, "d": 4, "rh": 13, "pre": ["CH1-078"], "tr": "핵 전하가 양성자·중성자 둘 다에서 올 것 같아, 양성자에서만 온다는 게 흐려진다.", "an": "핵 전하는 양성자에서만: 중성자는 전하가 없다.", "rd": "전하는 양성자만 가진다. 중성자는 전하가 없다.", "tf": "핵 전하는 무엇에서? (양성자)"}, "CH1-093": {"n": "동위원소 판정", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "두 원자가 동위원소인지 가릴 때 양성자 수가 같은지를 기준 삼지 못한 경우다. 질량수가 달라도 양성자 수가 같으면 같은 원소라는 판정이 흔들리면 분류가 어긋난다.", "fx": "두 원자가 동위원소인지는 '양성자 수가 같은지'로 가린다. 질량수가 달라도 양성자 수가 같으면 같은 원소임을 판정 기준으로 써라.", "f": "B2", "rk": 593, "d": 5, "rh": 0, "pre": ["CH1-085"], "tr": "동위원소 기준이 막연해, 양성자 수가 같은지를 본다는 게 빠진다.", "an": "양성자 수가 같은지로 동위원소를 가린다.", "rd": "양성자 수가 같은지로 동위원소를 가린다.", "tf": "동위원소를 가리는 기준은? (양성자 수)"}, "CH1-094": {"n": "동위원소 vs 동중원소", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "같은 양성자 수의 동위원소와 같은 질량수의 동중원소를 뒤섞은 경우다. 무엇이 같은지(원자번호냐 질량수냐)를 가르지 못하면 핵종 분류가 헝클어진다.", "fx": "'동위원소 = 원자번호 같음, 동중원소 = 질량수 같음'으로 무엇이 같은지를 가른다. 두 핵종을 두고 어느 수가 같은지 따져 분류하라.", "f": "B2", "rk": 594, "d": 5, "rh": 0, "pre": ["CH1-085", "CH1-081"], "tr": "동위·동중원소가 헷갈려, 양성자 같은(동위)과 질량수 같은(동중)이 섞인다.", "an": "양성자 같으면 동위, 질량수 같으면 동중: 무엇이 같은지가 다르다.", "rd": "양성자가 같으면 동위, 질량수가 같으면 동중이다. 무엇이 같은지가 다르다.", "tf": "질량수가 같은 관계는? (동중원소)"}, "CH1-095": {"n": "이온 형성", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "전자를 잃으면 양이온, 얻으면 음이온이 된다는 방향을 놓친 경우다(전자만 드나든다는 점이 핵심). 이 방향이 흔들리면 이온식·결합·산화수가 줄줄이 어긋난다.", "fx": "'전자를 잃으면 양이온, 얻으면 음이온(드나드는 건 전자뿐)'을 못 박는다. 양성자는 그대로임을 이온식·산화수의 출발로 삼아라.", "f": "A1", "rk": 595, "d": 5, "rh": 4, "pre": ["CH1-083"], "tr": "이온이 어떻게 생기는지 헷갈려, 전자를 잃으면 양이온·얻으면 음이온이라는 방향이 흔들린다.", "an": "전자를 잃으면 양이온, 얻으면 음이온이다.", "rd": "전자를 잃으면 (+)가 남아 양이온, 얻으면 (-)가 늘어 음이온이다.", "tf": "전자를 얻으면 무슨 이온? (음이온)"}, "CH1-096": {"n": "이온 전자수", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "이온의 전자 수를 (양성자 수 − 전하)로 셈하는 게 흔들린 경우다. 전하만큼 전자가 줄거나 는다는 셈이 약하면 이온의 전자 배치를 잘못 잡는다.", "fx": "이온의 전자 수를 '양성자 수 − 전하'로 셈한다. 전하만큼 전자가 줄거나 늚을, 양이온·음이온 예로 직접 계산하라.", "f": "D3", "rk": 672, "d": 6, "rh": 0, "pre": ["CH1-095"], "tr": "이온 전자 수가 막연해, (양성자 수-전하)로 센다는 게 흔들린다.", "an": "이온 전자 수=양성자 수-전하다.", "rd": "전자 수=양성자 수-전하다. 전하만큼 전자가 줄거나 는다.", "tf": "양성자 11, 전하 +1인 이온의 전자 수는? (10)"}, "CH1-097": {"n": "이온 양성자수", "c": "ch1", "u": "Ⅱ-1", "t": "A", "dx": "이온이 되면 양성자 수도 변한다고 본 경우다. 드나드는 건 전자뿐이고 양성자 수는 그대로라 원소 정체성이 유지된다는 점을 놓치면, 이온이 여전히 같은 원소라는 사실부터 어긋난다.", "fx": "'이온이 돼도 양성자 수는 그대로, 전자만 드나든다'를 못 박는다. 그래서 이온이 여전히 같은 원소임을, 전자 수만 바꿔 확인하라.", "f": "B2", "rk": 673, "d": 6, "rh": 0, "pre": ["CH1-095", "CH1-079"], "tr": "이온이 되면 양성자도 변할 것 같아, 전자만 드나든다는 게 빠진다.", "an": "이온이 돼도 양성자는 그대로: 전자만 드나든다.", "rd": "이온이 돼도 전자만 드나든다. 양성자는 그대로다.", "tf": "이온이 돼도 변하지 않는 것은? (양성자)"}, "CH1-098": {"n": "수소 동위원소", "c": "ch1", "u": "Ⅱ-1", "t": "C", "dx": "수소의 ¹H·²H·³H를 질량수가 달라 서로 다른 원소로 본 경우다. 양성자 수가 모두 1이라 다 수소라는 점을 놓치면 동위원소 개념의 가장 기본 예가 무너진다.", "fx": "수소의 ¹H·²H·³H가 '양성자 수가 모두 1이라 다 수소'임을 못 박는다. 질량수만 다르고 같은 원소임을 동위원소의 기본 예로 새겨라.", "f": "B2", "rk": 596, "d": 5, "rh": 0, "pre": ["CH1-085"], "tr": "¹H·²H·³H가 다른 원소 같아, 질량수만 달라 같은 수소라는 게 흔들린다.", "an": "¹H·²H·³H는 질량수만 다른 같은 수소다.", "rd": "¹H·²H·³H는 양성자가 같아 모두 수소다. 질량수만 다르다.", "tf": "¹H와 ²H는 같은 원소인가? (그렇다: 수소)"}, "CH1-099": {"n": "원자모형 변천", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "원자모형의 발전 순서(돌턴·톰슨·러더퍼드·보어·현대)나 각 모형이 무엇을 몰랐는지를 헷갈린 경우다. 돌턴은 전자조차 몰랐다는 식의 '각 단계가 무엇을 더 밝혔나'가 안 잡히면 모형이 왜 바뀌었는지 설명하지 못한다.", "fx": "원자모형을 '돌턴(전자 모름)·톰슨(전자 발견)·러더퍼드(핵 발견)·보어(준위)·현대(확률)' 순으로, 각 단계가 무엇을 더 밝혔는지로 외운다. 모형마다 한 줄로 '새로 밝힌 것'을 적어 변천의 인과를 잡아라.", "f": "B2", "rk": 266, "d": 3, "rh": 122, "pre": ["CH1-077"], "tr": "모형 발전이 막연해, 돌턴·톰슨·러더퍼드·보어·현대 순과 각자 무엇을 몰랐는지가 섞인다.", "an": "돌턴(단단한 공)→톰슨(건포도빵)→러더퍼드(핵 발견)→보어(궤도)→현대(확률): 점점 보완된다.", "rd": "새 실험 결과가 나올 때마다 모형을 고쳤다. 돌턴→톰슨→러더퍼드→보어→현대 순이다.", "tf": "톰슨 모형 다음은 누구 모형? (러더퍼드)"}, "CH1-100": {"n": "전자 발견", "c": "ch1", "u": "Ⅱ-2", "t": "A", "dx": "전자 발견을 톰슨의 음극선 실험에 연결하지 못하고 러더퍼드와 뒤바꾼 경우다. 누가 무엇을 발견했는지가 흔들리면 원자모형 변천의 인과가 통째로 헝클어진다.", "fx": "'전자 발견 = 톰슨의 음극선 실험'으로 못 박는다(러더퍼드 아님). 누가 무엇을 발견했는지 표로 정리해 톰슨(전자)·러더퍼드(핵)를 갈라라.", "f": "B2", "rk": 425, "d": 4, "rh": 2, "pre": ["CH1-099"], "tr": "전자를 누가 찾았는지 헷갈려, 톰슨 음극선과 러더퍼드를 뒤바꾼다.", "an": "전자는 톰슨이 음극선으로 발견: 러더퍼드는 핵이다.", "rd": "톰슨이 음극선 실험으로 전자를 발견했다.", "tf": "전자를 발견한 실험은? (음극선)"}, "CH1-101": {"n": "음극선 성질", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "음극선이 (−)전하를 띤 전자의 흐름이라 (+)극 쪽으로 휜다는 점을 놓친 경우다. 음극선의 정체가 흐리면 전자의 전하·질량을 밝힌 실험의 의미를 못 읽는다.", "fx": "음극선을 '(−)전하를 띤 전자의 흐름이라 (+)극 쪽으로 휜다'로 못 박는다. 휘는 방향으로 전자가 음전하임을 읽어 내는 논리를 따라가 보라.", "f": "A1", "rk": 597, "d": 5, "rh": 0, "pre": ["CH1-100"], "tr": "음극선이 어디로 휠지 막막해, (-)전하라 (+)극 쪽으로 휜다는 게 빠진다.", "an": "음극선은 (-)전하라 (+)극 쪽으로 휜다.", "rd": "음극선은 (-)전하라 (+)극 쪽으로 휜다.", "tf": "음극선은 어느 극으로 휘나? (+극: -전하)"}, "CH1-102": {"n": "톰슨 모형", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "톰슨 모형을 (+)바탕에 전자가 박힌 형태로 보지 못하고 핵이 있다고 본 경우다. 톰슨 모형엔 핵이 없다는 점을 놓치면 러더퍼드가 무엇을 새로 밝혔는지 대비가 사라진다.", "fx": "톰슨 모형을 '(+)바탕에 전자가 박힌, 핵이 없는 형태'로 못 박는다. 핵이 없다는 점을 러더퍼드 모형과 나란히 두고 대비하라.", "f": "B2", "rk": 598, "d": 5, "rh": 0, "pre": ["CH1-100"], "tr": "톰슨 모형에 핵이 있을 것 같아, (+)바탕에 전자가 박힌 형태라는 게 흔들린다.", "an": "톰슨 모형은 (+)바탕에 전자가 박힌 건포도빵: 핵이 없다.", "rd": "핵을 모르던 때라 (+)바탕에 전자가 박힌 모형을 세웠다.", "tf": "톰슨 모형엔 핵이 있나? (없다)"}, "CH1-103": {"n": "원자핵 발견", "c": "ch1", "u": "Ⅱ-2", "t": "A", "dx": "원자핵 발견을 러더퍼드의 알파 입자 산란이 아니라 톰슨에 연결한 경우다. 발견의 주인을 바꾸면 음극선(전자)·산란(핵)이라는 두 실험의 역할이 뒤섞인다.", "fx": "'원자핵 발견 = 러더퍼드의 알파 입자 산란'으로 못 박는다(톰슨 아님). 음극선(전자)과 산란(핵) 두 실험의 주인과 결과를 갈라 정리하라.", "f": "B2", "rk": 426, "d": 4, "rh": 118, "pre": ["CH1-099"], "tr": "핵을 누가 찾았는지 헷갈려, 러더퍼드 알파 산란을 톰슨과 뒤바꾼다.", "an": "핵은 러더퍼드가 알파 산란으로 발견했다.", "rd": "러더퍼드가 알파 산란 실험으로 핵을 발견했다.", "tf": "핵을 발견한 실험은? (알파 산란)"}, "CH1-104": {"n": "알파 산란 결과", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "알파 입자 대부분이 그대로 통과하고 극히 일부만 크게 튕긴 관찰을 '원자 내부가 대부분 빈 공간'으로 잇지 못한 경우다. 결과와 해석의 연결이 약하면 핵의 존재라는 결론에 도달하지 못한다.", "fx": "'알파 입자 대부분 통과 = 원자 내부가 대부분 빈 공간'으로 관찰과 해석을 잇는다. 극히 일부만 튕긴다는 관찰까지 더해 핵의 존재로 이어라.", "f": "B3", "rk": 599, "d": 5, "rh": 117, "pre": ["CH1-103"], "tr": "알파가 다 튕길 것 같은데, 대부분 통과해 \"내부가 대부분 빈 공간\"이라는 결론이 안 잡힌다.", "an": "알파 대부분이 그냥 통과: 원자 내부가 거의 빈 공간이라는 증거다.", "rd": "알파가 대부분 그냥 통과했다. 그래서 원자 내부가 거의 빈 공간이라 결론지었다.", "tf": "알파가 대부분 통과한 건 무엇의 증거? (빈 공간)"}, "CH1-105": {"n": "알파 산란 해석", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "소수의 큰 산란이 작고 무거운 (+)핵이 알파 입자를 밀어낸 결과라는 해석을 놓친 경우다. 가벼운 전자로는 큰 산란을 못 만든다는 점까지 잡아야 핵의 성질이 드러난다.", "fx": "'소수의 큰 산란 = 작고 무거운 (+)핵이 알파 입자를 밀어낸 것'으로 해석한다. 가벼운 전자로는 큰 산란이 안 됨을 더해 핵의 성질을 끌어내라.", "f": "B3", "rk": 674, "d": 6, "rh": 116, "pre": ["CH1-104"], "tr": "큰 산란이 막연해, 작고 무거운 (+)핵이 밀어낸 결과라는 해석이 빠진다.", "an": "가끔 크게 튕긴 건 작고 무거운 (+)핵이 밀어낸 것이다.", "rd": "일부 알파가 크게 튕긴 건 작고 무거운 (+)핵이 밀어낸 것이다.", "tf": "알파가 크게 튕긴 건 무엇 때문? (작고 무거운 +핵)"}, "CH1-106": {"n": "핵의 존재", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "질량과 (+)전하가 작은 핵에 몰려 있다는 결론을 놓친 경우다. 이 결론이 약하면 원자 질량이 핵에 집중된다는 앞 단원 사실과 모형이 연결되지 않는다.", "fx": "'질량과 (+)전하가 작은 핵에 집중'됨을 결론으로 못 박는다. 이를 앞서 본 '원자 질량은 핵에 몰림'과 이어 모형과 사실을 맞춰라.", "f": "B2", "rk": 715, "d": 7, "rh": 115, "pre": ["CH1-105"], "tr": "질량·전하가 퍼져 있을 것 같아, 작은 핵에 몰려 있다는 결론이 빠진다.", "an": "질량·전하가 퍼진 게 아니라 작은 핵에 몰려 있다.", "rd": "큰 산란은 질량·전하가 작은 핵에 몰려야 설명된다. 그래서 핵이 있다.", "tf": "질량과 전하가 작은 곳에 몰려 있는 것은? (핵)"}, "CH1-107": {"n": "보어 모형", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "보어 모형에서 전자가 정해진 에너지 준위(궤도)에만 있다는 양자화를 놓친 경우다. 이 핵심이 흔들리면 선 스펙트럼 설명도, 다전자 원자에서의 한계도 따라오지 못한다.", "fx": "보어 모형을 '전자가 정해진 에너지 준위에만 있다(양자화)'로 못 박는다. 이 핵심에서 선 스펙트럼 설명과 다전자 한계가 따라옴을 짚어라.", "f": "B2", "rk": 742, "d": 8, "rh": 114, "pre": ["CH1-106"], "tr": "전자가 아무 데나 있을 것 같아, 정해진 에너지 준위(궤도)에만 있다는 양자화가 빠진다.", "an": "전자는 정해진 궤도(에너지 준위)에만: 아무 데나 못 있다.", "rd": "전자가 아무 데나 있으면 스펙트럼이 연속이어야 한다. 정해진 궤도여야 선 스펙트럼이 나온다.", "tf": "보어 모형에서 전자는 어디에? (정해진 궤도)"}, "CH1-108": {"n": "전자껍질 순서", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "전자껍질이 K(가장 안쪽)·L·M 순이고 K가 핵에 가장 가깝다는 순서를 놓친 경우다. 껍질 순서가 흔들리면 에너지 준위 비교와 전자 배치 순서가 어긋난다.", "fx": "전자껍질을 'K(가장 안쪽)·L·M 순, K가 핵에 가장 가깝다'로 못 박는다. 안쪽일수록 에너지가 낮음을 순서와 맞춰 전자 배치에 써라.", "f": "B2", "rk": 770, "d": 9, "rh": 112, "pre": ["CH1-107"], "tr": "껍질 순서가 막연해, K(가장 안쪽)·L·M 순이라는 게 흔들린다.", "an": "안쪽부터 K·L·M이다.", "rd": "안쪽부터 K·L·M로 이름 붙인다.", "tf": "가장 안쪽 껍질은? (K)"}, "CH1-109": {"n": "에너지 준위", "c": "ch1", "u": "Ⅱ-2", "t": "B", "dx": "바깥 껍질일수록 에너지 준위가 높다는 방향을 뒤집은 경우다. 안쪽이 낮고 바깥이 높다는 순서가 흔들리면 전자 전이의 흡수·방출 방향과 쌓음 순서가 어긋난다.", "fx": "'바깥 껍질일수록 에너지 준위가 높다(안쪽이 낮음)'로 방향을 못 박는다. 이 순서로 전이의 흡수·방출 방향과 쌓음 순서를 잡아라.", "f": "A1", "rk": 800, "d": 10, "rh": 111, "pre": ["CH1-108"], "tr": "바깥일수록 에너지가 낮을 것 같아, 바깥 껍질일수록 높다는 방향이 뒤집힌다.", "an": "바깥 껍질일수록 에너지가 높다: 위층일수록 높다.", "rd": "바깥 껍질일수록 핵에서 멀어 에너지가 높다.", "tf": "바깥 껍질일수록 에너지는? (높음)"}, "CH1-110": {"n": "에너지 양자화", "c": "ch1", "u": "Ⅱ-2", "t": "A", "dx": "전자 에너지가 연속이라 중간값도 가질 수 있다고 본 경우다. 허용된 준위만 존재한다는 양자화를 놓치면 선 스펙트럼이 왜 특정 파장만 나오는지 설명할 수 없다.", "fx": "전자 에너지를 '연속이 아니라 허용된 준위만 가짐(중간값 없음)'으로 못 박는다. 그래서 선 스펙트럼이 특정 파장만 내는 까닭을 이어 짚어라.", "f": "B2", "rk": 771, "d": 9, "rh": 110, "pre": ["CH1-107"], "tr": "에너지가 연속일 것 같아, 정해진 값만 가져 중간값이 없다는 게 의외다.", "an": "에너지는 계단처럼 정해진 값만: 중간값(경사로)이 없다.", "rd": "정해진 궤도만 있으니 에너지도 정해진 값만 가능하다. 그래서 중간값이 없다.", "tf": "전자 에너지는 연속인가 띄엄띄엄인가? (띄엄띄엄)"}, "CH1-111": {"n": "바닥상태", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "바닥상태가 전자가 가장 낮은 준위에 있는 가장 안정한 상태라는 점을 놓친 경우다. 기준인 바닥상태가 흐리면 들뜬상태와의 대비, 바닥상태 전자 배치가 흔들린다.", "fx": "바닥상태를 '전자가 가장 낮은 준위에 있는 가장 안정한 상태'로 못 박는다. 이 기준에서 들뜬상태와의 대비, 바닥상태 배치를 잡아라.", "f": "B2", "rk": 826, "d": 11, "rh": 1, "pre": ["CH1-109"], "tr": "바닥상태가 막연해, 전자가 가장 낮은 준위에 있는 가장 안정한 상태라는 게 흐려진다.", "an": "바닥상태는 전자가 가장 낮은 준위에 있는 가장 안정한 상태다.", "rd": "전자가 가장 낮은 준위에 있을 때 에너지가 최저라 가장 안정하다.", "tf": "전자가 가장 낮은 준위에 있으면? (바닥상태)"}, "CH1-112": {"n": "전자 전이", "c": "ch1", "u": "Ⅱ-2", "t": "A", "dx": "전자가 올라갈 때 흡수, 내려올 때 방출이라는 방향을 뒤바꾼 경우다. 주고받는 에너지가 두 준위 차와 같다는 점까지 잡아야 스펙트럼선의 위치를 해석할 수 있다.", "fx": "'올라갈 때 흡수, 내려올 때 방출, 주고받는 에너지 = 두 준위 차'로 못 박는다. 준위 차를 계산해 스펙트럼선 위치로 잇는 연습을 하라.", "f": "A1", "rk": 827, "d": 11, "rh": 109, "pre": ["CH1-109", "CH1-110"], "tr": "전자가 올라갈 때 빛을 낼 것 같아, 올라갈 때 흡수·내려올 때 방출이라는 방향이 뒤바뀐다.", "an": "올라갈 때 흡수, 내려올 때 방출: 계단 오르내림이다.", "rd": "올라가려면 에너지를 흡수하고 내려오면 그만큼 방출한다.", "tf": "전자가 내려올 때 에너지를? (방출)"}, "CH1-113": {"n": "선 스펙트럼", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "전이 에너지가 양자화돼 특정 파장만 나타나는 게 선 스펙트럼이라는 연결을 놓친 경우다. 양자화와 선 스펙트럼의 고리가 약하면 스펙트럼이 준위의 증거라는 해석이 안 선다.", "fx": "선 스펙트럼을 '전이 에너지가 양자화돼 특정 파장만 나타나는 것'으로 잇는다. 양자화가 선 스펙트럼을 만든다는 고리를 한 줄로 적어라.", "f": "B2", "rk": 845, "d": 12, "rh": 105, "pre": ["CH1-112"], "tr": "빛이 연속으로 나올 것 같아, 전이가 양자화돼 특정 파장만 나타난다는 게 빠진다.", "an": "정해진 전이라 특정 파장만 나타나는 띄엄띄엄 선이다.", "rd": "전이가 정해진 준위 사이라 특정 에너지(파장)만 나온다. 그래서 띄엄띄엄 선이다.", "tf": "선 스펙트럼이 띄엄띄엄인 이유는? (준위가 불연속)"}, "CH1-114": {"n": "스펙트럼 해석", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "선 스펙트럼을 불연속 에너지 준위의 증거로 읽지 못한 경우다. 스펙트럼선의 의미가 위치가 아니라 에너지 차라는 점을 놓치면 보어 모형의 근거를 못 짚는다.", "fx": "선 스펙트럼을 '불연속 에너지 준위의 증거'로 읽는다. 스펙트럼선이 위치가 아니라 에너지 차를 뜻함을 보어 모형의 근거로 삼아라.", "f": "B2", "rk": 864, "d": 13, "rh": 0, "pre": ["CH1-113"], "tr": "선 스펙트럼이 막연해, 불연속 에너지 준위의 증거라는 게 안 읽힌다.", "an": "선 스펙트럼은 에너지 준위가 불연속이라는 증거다.", "rd": "선이 띄엄띄엄이면 준위가 불연속이라는 뜻이다.", "tf": "선 스펙트럼은 무엇의 증거? (불연속 준위)"}, "CH1-115": {"n": "연속 스펙트럼", "c": "ch1", "u": "Ⅱ-2", "t": "A", "dx": "연속 스펙트럼이 모든 파장이 끊김 없이 이어진(무지개) 빛이라는 점을 놓치고 선 스펙트럼과 뒤섞은 경우다. 두 스펙트럼을 못 가르면 수소가 왜 선 스펙트럼을 내는지 의미가 사라진다.", "fx": "연속 스펙트럼을 '모든 파장이 끊김 없이 이어진(무지개) 빛'으로 선 스펙트럼과 갈라 둔다. 수소가 선 스펙트럼을 냄과 대비해 의미를 잡아라.", "f": "B2", "rk": 865, "d": 13, "rh": 0, "pre": ["CH1-113"], "tr": "연속·선 스펙트럼이 같은 것 같아, 연속은 모든 파장이 이어진 무지개라는 구분이 흐려진다.", "an": "연속은 모든 파장이 이어진 무지개: 선 스펙트럼과 다르다.", "rd": "연속은 모든 파장이 이어진 무지개다. 선 스펙트럼과 다르다.", "tf": "모든 파장이 이어진 스펙트럼은? (연속)"}, "CH1-116": {"n": "스펙트럼선 의미", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "스펙트럼선의 위치가 전이 전후 준위의 에너지 차를 나타낸다는 점을 놓친 경우다. 위치를 질량 등으로 오해하면 스펙트럼의 정량적 의미를 못 읽는다.", "fx": "스펙트럼선의 위치를 '전이 전후 준위의 에너지 차'로 읽는다. 위치를 질량 등으로 오해하지 않도록 에너지 차로만 해석하라.", "f": "B2", "rk": 846, "d": 12, "rh": 0, "pre": ["CH1-112"], "tr": "스펙트럼선 위치가 막연해, 전이 전후 준위의 에너지 차를 나타낸다는 게 빠진다.", "an": "선 위치는 전이 전후 준위의 에너지 차다.", "rd": "선의 위치(에너지)는 전이 전후 준위의 에너지 차다.", "tf": "선의 에너지는 무엇? (전이 준위 차)"}, "CH1-117": {"n": "보어 모형 성공", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "보어 모형이 수소 선 스펙트럼을 에너지 양자화로 설명한 성과를 놓친 경우다. 무엇을 성공시켰는지가 흐리면 다전자 원자에서의 한계와 대비가 서지 않는다.", "fx": "보어 모형의 성과를 '수소 선 스펙트럼을 에너지 양자화로 설명'으로 못 박는다. 무엇을 성공시켰는지를 다전자 한계와 대비해 두라.", "f": "B2", "rk": 866, "d": 13, "rh": 102, "pre": ["CH1-113"], "tr": "보어 모형이 무엇을 했는지 막연해, 수소 선 스펙트럼을 양자화로 설명한 성과가 빠진다.", "an": "보어 모형은 수소 선 스펙트럼을 양자화로 설명한 성과다.", "rd": "양자화 가정으로 수소 선 스펙트럼을 계산해 맞혔다.", "tf": "보어 모형이 설명한 것은? (수소 선 스펙트럼)"}, "CH1-118": {"n": "보어 모형 한계", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "보어 모형이 전자가 둘 이상인 원자에는 잘 맞지 않는다는 한계를 놓친 경우다. 이 한계가 안 잡히면 왜 현대 모형으로 넘어갔는지 동기를 못 짚는다.", "fx": "보어 모형의 한계를 '전자가 둘 이상인 원자엔 잘 안 맞음'으로 못 박는다. 이 한계가 현대 모형으로 넘어간 동기임을 짚어라.", "f": "D1", "rk": 884, "d": 14, "rh": 101, "pre": ["CH1-117"], "tr": "보어 모형이 다 맞을 것 같아, 전자가 둘 이상인 원자엔 잘 안 맞는다는 한계가 빠진다.", "an": "전자 둘 이상인 원자엔 잘 안 맞는다.", "rd": "전자 사이 반발을 못 다뤄 다전자 원자엔 안 맞는다.", "tf": "보어 모형이 안 맞는 원자는? (다전자)"}, "CH1-119": {"n": "현대 모형", "c": "ch1", "u": "Ⅱ-2", "t": "C", "dx": "현대 모형이 전자 위치를 확률로 다뤄 정해진 궤도가 없다는 점(보어와의 차이)을 놓친 경우다. 이 차이가 흐리면 다음 단원의 오비탈 개념이 보어식 궤도와 섞인다.", "fx": "현대 모형을 '전자 위치를 확률로 다뤄 정해진 궤도가 없다(보어와 차이)'로 못 박는다. 이 차이를 다음 단원 오비탈과 보어식 궤도가 안 섞이게 새겨라.", "f": "B2", "rk": 891, "d": 15, "rh": 100, "pre": ["CH1-118"], "tr": "현대 모형도 궤도가 있을 것 같아, 위치를 확률로 다뤄 정해진 궤도가 없다는 게(보어와 차이) 빠진다.", "an": "현대 모형은 위치를 확률로: 정해진 궤도가 없다(보어와 차이).", "rd": "전자의 정확한 궤도는 알 수 없어 확률로 다룬다. 그래서 정해진 궤도가 없다.", "tf": "현대 모형에서 전자 위치는? (확률)"}, "CH1-120": {"n": "오비탈", "c": "ch1", "u": "Ⅱ-2-d", "t": "B", "dx": "오비탈을 보어식 정해진 궤도로 보고, 전자가 발견될 확률 분포(영역)라는 점을 놓친 경우다. 궤도와 오비탈을 섞으면 전자가 점이 아니라 구름처럼 퍼진다는 그림이 무너진다.", "fx": "오비탈을 '전자가 발견될 확률이 높은 영역(정해진 궤도 아님)'으로 못 박는다. 전자가 점이 아니라 구름처럼 퍼짐을 보어식 궤도와 대비하라.", "f": "B2", "rk": 892, "d": 16, "rh": 98, "pre": ["CH1-119"], "tr": "오비탈이 보어식 궤도 같아, 전자가 발견될 확률 분포(영역)라는 게 안 잡힌다.", "an": "오비탈은 궤도가 아니라 전자가 발견될 확률 구역(구름)이다.", "rd": "오비탈은 전자가 발견될 확률이 높은 구역이다. 궤도가 아니다.", "tf": "오비탈은 궤도인가 확률 구역인가? (확률 구역)"}, "CH1-121": {"n": "불확정성", "c": "ch1", "u": "Ⅱ-2-d", "t": "C", "dx": "불확정성 원리로 전자의 위치와 운동량을 동시에 정확히 알 수 없다는 점을 놓친 경우다. 이 원리가 약하면 왜 오비탈을 확률로만 다루는지 근거가 사라진다.", "fx": "불확정성 원리를 '전자의 위치와 운동량을 동시에 정확히 알 수 없음'으로 못 박는다. 그래서 오비탈을 확률로만 다룬다는 근거로 삼아라.", "f": "B2", "rk": 893, "d": 16, "rh": 0, "pre": ["CH1-119"], "tr": "위치·운동량을 다 알 수 있을 것 같아, 동시에 정확히는 못 안다는 게 의외다.", "an": "위치와 운동량을 동시에 정확히는 못 안다.", "rd": "위치와 운동량을 동시에 정확히는 못 안다. 그래서 확률로만 말한다.", "tf": "위치와 운동량을 동시에 정확히 아나? (못 함)"}, "CH1-122": {"n": "오비탈 종류", "c": "ch1", "u": "Ⅱ-2-d", "t": "C", "dx": "s·p·d·f 오비탈이 모양이 서로 다르다(s는 구형, p는 아령)는 점을 놓친 경우다. 오비탈 모양 감각이 없으면 전자 배치와 결합의 방향성을 이해하기 어렵다.", "fx": "오비탈을 's는 구형, p는 아령'처럼 모양으로 구분한다. s·p·d·f의 모양 차이를 전자 배치·결합의 방향성과 이어 두라.", "f": "B2", "rk": 894, "d": 17, "rh": 94, "pre": ["CH1-120"], "tr": "오비탈이 다 같은 모양 같아, s(구)·p(아령) 등 종류마다 다르다는 게 빠진다.", "an": "s는 공, p는 아령: 모양이 다르다.", "rd": "l이 모양을 정해 s는 구, p는 아령이다.", "tf": "p 오비탈의 모양은? (아령)"}, "CH1-123": {"n": "전이 에너지", "c": "ch1", "u": "Ⅱ-2-d", "t": "C", "dx": "전이 때 두 준위의 에너지 차만큼 빛을 주고받고 에너지와 파장이 반비례한다는 점을 놓친 경우다. 이 관계가 약하면 스펙트럼선과 에너지·파장을 잇는 계산이 어긋난다.", "fx": "'전이 때 두 준위 차만큼 빛을 주고받고, 에너지와 파장은 반비례'로 못 박는다. 준위 차에서 파장을 구하는 계산으로 스펙트럼선과 이어라.", "f": "A2", "rk": 847, "d": 12, "rh": 0, "pre": ["CH1-112"], "tr": "전이 에너지와 파장 관계가 막막해, 둘이 반비례한다는 게 빠진다.", "an": "전이 에너지와 빛 파장은 반비례: 큰 에너지일수록 짧은 파장이다.", "rd": "에너지가 클수록 파장이 짧다(E=hc/λ). 그래서 반비례다.", "tf": "전이 에너지가 크면 파장은? (짧음)"}, "CH1-124": {"n": "부껍질", "c": "ch1", "u": "Ⅱ-2-d", "t": "C", "dx": "주껍질이 s·p·d·f 부껍질로 갈리고 에너지가 s<p<d<f라는 점을 놓친 경우다. 부껍질 구분이 약하면 전자가 어느 순서로 채워지는지(쌓음)를 잡지 못한다.", "fx": "주껍질이 's·p·d·f 부껍질로 갈리고 에너지가 s<p<d<f'임을 못 박는다. 이 순서를 전자가 채워지는 쌓음 순서의 바탕으로 삼아라.", "f": "B2", "rk": 897, "d": 18, "rh": 93, "pre": ["CH1-122"], "tr": "주껍질이 하나의 덩어리 같아, s·p·d·f 부껍질로 갈리고 에너지가 s<p<d<f라는 게 빠진다.", "an": "주껍질이 s·p·d·f 부껍질로 갈리고 에너지 s<p<d<f다.", "rd": "주껍질이 s·p·d·f 부껍질로 갈리고 에너지가 s<p<d<f다.", "tf": "s, p, d, f 중 에너지가 가장 낮은 건? (s)"}, "CH1-125": {"n": "주양자수", "c": "ch1", "u": "Ⅱ-2-d", "t": "C", "dx": "주양자수 n을 0도 될 수 있다고 보거나 모양을 정하는 수로 오해한 경우다. n이 1 이상의 껍질 번호이고 클수록 에너지가 높다는 점이 흔들리면 준위 구조가 어긋난다.", "fx": "주양자수 n을 '1 이상의 껍질 번호이고 클수록 에너지가 높음'으로 못 박는다(0 불가, 모양 정하는 수 아님). n으로 준위 구조를 잡아라.", "f": "B2", "rk": 895, "d": 17, "rh": 0, "pre": ["CH1-120"], "tr": "n이 0도 되고 모양도 정할 것 같아, 최솟값 1이고 껍질·에너지를 정한다는 게 흔들린다.", "an": "n은 1부터, 껍질·에너지를 정한다.", "rd": "n은 껍질·에너지를 정하고 최솟값이 1이다.", "tf": "n의 최솟값은? (1)"}, "CH1-126": {"n": "바닥·들뜬상태", "c": "ch1", "u": "Ⅱ-2-d", "t": "C", "dx": "에너지를 흡수하면 들뜬상태로 올라가고 들뜬상태가 바닥상태보다 에너지가 높다는 점을 놓친 경우다. 흡수·방출과 높낮이가 흔들리면 전이와 전자 배치 해석이 어긋난다.", "fx": "'에너지를 흡수하면 들뜬상태로 올라가고 들뜬상태가 바닥상태보다 높다'를 못 박는다. 흡수·방출과 높낮이를 전이·배치 해석에 써라.", "f": "B2", "rk": 848, "d": 12, "rh": 0, "pre": ["CH1-111", "CH1-112"], "tr": "흡수하면 내려갈 것 같기도 해, 흡수하면 들뜬상태로 올라가고 그게 더 높다는 게 흔들린다.", "an": "흡수하면 들뜬상태로 올라가고 그게 더 높다.", "rd": "흡수하면 더 높은 준위로 올라간다. 그게 들뜬상태라 바닥보다 높다.", "tf": "에너지를 흡수하면 어느 상태로? (들뜬상태)"}, "CH1-127": {"n": "오비탈 전자수", "c": "ch1", "u": "Ⅱ-3", "t": "A", "dx": "한 오비탈에 전자가 스핀 반대인 최대 2개만 들어간다는 점을 놓친 경우다(6개는 오비탈이 아니라 p 부껍질 전체). 오비탈 정원이 흔들리면 전자 배치의 칸 수가 통째로 어긋난다.", "fx": "'한 오비탈엔 스핀 반대인 전자 최대 2개'를 못 박는다(6개는 오비탈 아니라 p 부껍질 전체). 오비탈 칸마다 2개씩 채워 배치의 칸 수를 맞춰라.", "f": "D3", "rk": 896, "d": 17, "rh": 90, "pre": ["CH1-120"], "tr": "한 오비탈에 여럿 들어갈 것 같아, 스핀 반대인 최대 2개라는 게 빠진다(6개는 p 부껍질 전체).", "an": "한 오비탈엔 스핀 반대인 최대 2개다.", "rd": "파울리에 따라 한 오비탈엔 스핀 반대인 2개까지다.", "tf": "한 오비탈에 전자는 최대 몇 개? (2)"}, "CH1-128": {"n": "오비탈 수", "c": "ch1", "u": "Ⅱ-3", "t": "C", "dx": "부껍질별 오비탈 수가 s 1·p 3·d 5·f 7개라는 점을 놓친 경우다. 오비탈 수가 흔들리면 부껍질 최대 전자 수(오비탈 수 × 2)가 따라서 어긋난다.", "fx": "부껍질별 오비탈 수를 's 1, p 3, d 5, f 7'로 못 박는다. 이 수에 2를 곱해 부껍질 최대 전자 수가 나옴을 이어 셈하라.", "f": "D3", "rk": 899, "d": 19, "rh": 90, "pre": ["CH1-124"], "tr": "부껍질 오비탈 수가 막연해, s1·p3·d5·f7이 안 외워진다.", "an": "s1·p3·d5·f7이다.", "rd": "한 부껍질의 오비탈 수는 s1·p3·d5·f7이다.", "tf": "p 부껍질의 오비탈 수는? (3)"}, "CH1-129": {"n": "부껍질 전자수", "c": "ch1", "u": "Ⅱ-3", "t": "A", "dx": "부껍질 최대 전자 수를 (오비탈 수 × 2)로 셈하지 못한 경우다. s 2·p 6·d 10이라는 정원이 흔들리면 전자 배치에서 어디까지 채울지를 잘못 잡는다.", "fx": "부껍질 최대 전자 수를 '오비탈 수 × 2 = s 2, p 6, d 10'으로 못 박는다. 이 정원으로 전자 배치에서 어디까지 채울지 잡아라.", "f": "D3", "rk": 901, "d": 20, "rh": 1, "pre": ["CH1-127", "CH1-128"], "tr": "부껍질 최대 전자 수가 막연해, (오비탈 수×2)라는 게 빠진다.", "an": "부껍질 최대=오비탈 수×2다.", "rd": "오비탈마다 2개라 부껍질 최대=오비탈 수×2다.", "tf": "d 부껍질의 최대 전자 수는? (10)"}, "CH1-130": {"n": "껍질 최대 전자수", "c": "ch1", "u": "Ⅱ-3", "t": "A", "dx": "n번째 껍질 최대 전자 수가 2n²(2·8·18·32)이라는 점을 놓친 경우다. 이 공식이 약하면 주기율표의 주기 길이가 왜 그렇게 되는지 설명하지 못한다.", "fx": "n번째 껍질 최대 전자 수를 '2n² = 2, 8, 18, 32'로 못 박는다. 이 값이 주기율표의 주기 길이를 정함을 이어 짚어라.", "f": "D3", "rk": 904, "d": 21, "rh": 0, "pre": ["CH1-129"], "tr": "껍질 최대 전자 수가 막연해, 2n²(2·8·18·32)이라는 게 빠진다.", "an": "껍질 최대=2n²(2·8·18·32)이다.", "rd": "껍질 n의 오비탈 수가 n²이라 최대 전자가 2n²이다.", "tf": "n=2 껍질의 최대 전자 수는? (8: 2n²)"}, "CH1-131": {"n": "쌓음 원리", "c": "ch1", "u": "Ⅱ-3", "t": "C", "dx": "전자가 에너지가 낮은 오비탈부터 차례로 채워진다는 쌓음 원리를 놓친 경우다(안쪽부터가 아니라 에너지 순). 이 순서가 흔들리면 전자 배치 자체가 어긋난다.", "fx": "쌓음 원리를 '에너지가 낮은 오비탈부터 차례로 채움(안쪽 순이 아니라 에너지 순)'으로 못 박는다. 에너지 순서대로 전자를 채워 배치를 잡아라.", "f": "B2", "rk": 900, "d": 19, "rh": 88, "pre": ["CH1-124"], "tr": "\"쌓는다\"가 안쪽부터 같아, 에너지 낮은 오비탈부터라는 게 가려진다.", "an": "물이 낮은 곳부터 차듯 에너지 낮은 오비탈부터다.", "rd": "계는 낮은 에너지가 안정하다. 그래서 에너지 낮은 오비탈부터 채운다.", "tf": "전자를 어떤 오비탈부터 채우나? (에너지 낮은 것)"}, "CH1-132": {"n": "오비탈 에너지 순서", "c": "ch1", "u": "Ⅱ-3", "t": "A", "dx": "다전자 원자에서 4s가 3d보다 에너지가 낮아 먼저 채워진다는 순서를 놓친 경우다. 껍질 번호만 보고 채우면 전이 금속 영역의 전자 배치가 어긋난다.", "fx": "다전자 원자에서 '4s가 3d보다 낮아 먼저 채워진다'를 못 박는다. 껍질 번호만 보지 말고 이 순서로 전이 금속 영역을 채워라.", "f": "B2", "rk": 902, "d": 20, "rh": 0, "pre": ["CH1-131"], "tr": "n이 작으면 먼저일 것 같아, 4s가 3d보다 낮아 먼저라는 역전이 어긋난다.", "an": "4s가 3d보다 낮아 먼저: n만으로 못 정한다.", "rd": "침투 효과로 4s가 3d보다 낮다. 그래서 4s를 먼저 채운다.", "tf": "4s와 3d 중 낮은 건? (4s)"}, "CH1-133": {"n": "파울리 배타원리", "c": "ch1", "u": "Ⅱ-3", "t": "A", "dx": "한 오비탈의 두 전자가 스핀이 반대여야 한다(같은 상태 불가)는 파울리 배타원리를 놓친 경우다. 이 원리가 흔들리면 오비탈에 왜 2개까지만 들어가는지 근거가 사라진다.", "fx": "파울리 배타원리를 '한 오비탈의 두 전자는 스핀이 반대여야 함(같은 상태 불가)'으로 못 박는다. 그래서 오비탈에 2개까지만 들어감을 근거로 삼아라.", "f": "B2", "rk": 898, "d": 18, "rh": 87, "pre": ["CH1-127"], "tr": "한 오비탈에 같은 스핀 둘이 될 것 같아, 반대여야 한다는 게 빠진다.", "an": "한 오비탈 두 전자는 스핀 반대: 앞뒤로 앉는다.", "rd": "한 오비탈 두 전자는 같은 양자수를 못 가져 스핀이 반대다.", "tf": "한 오비탈 두 전자의 스핀은? (반대)"}, "CH1-134": {"n": "훈트 규칙", "c": "ch1", "u": "Ⅱ-3", "t": "B", "dx": "같은 에너지 오비탈에 전자가 먼저 하나씩 평행 스핀으로 들어간다(홀전자 최대)는 훈트 규칙을 놓친 경우다. 이걸 어기면 홀전자 수를 잘못 세고, 그 위에 선 자기성 판단이 어긋난다.", "fx": "훈트 규칙을 '같은 에너지 오비탈엔 먼저 하나씩 평행 스핀으로 채움(홀전자 최대)'으로 못 박는다. 2p⁴ 등을 직접 채워 홀전자 수를 바로 세라.", "f": "B2", "rk": 903, "d": 20, "rh": 87, "pre": ["CH1-128"], "tr": "짝부터 채울 것 같아, 같은 에너지엔 하나씩 평행 스핀 먼저(홀전자 최대)라는 게 빠진다.", "an": "같은 에너지면 하나씩 따로 앉은 뒤 짝짓는다: 빈 2인석이다.", "rd": "반발을 피해 같은 에너지면 하나씩 흩어 채운 뒤 짝짓는다.", "tf": "같은 에너지 오비탈을 어떻게 채우나? (하나씩 먼저)"}, "CH1-135": {"n": "전자 배치 표기", "c": "ch1", "u": "Ⅱ-3", "t": "B", "dx": "전자 배치 표기(1s²2s²…)의 지수로 전자 수를 읽어내는 게 흔들린 경우다. 표기 해석이 약하면 원자·이온의 전자 수와 배치를 잘못 잡는다.", "fx": "전자 배치 표기(1s²2s²…)에서 '지수가 곧 그 오비탈의 전자 수'임을 못 박는다. 지수를 더해 원자·이온의 전자 수를 읽어 내라.", "f": "D3", "rk": 905, "d": 21, "rh": 86, "pre": ["CH1-131", "CH1-133", "CH1-134"], "tr": "1s²2s² 지수가 막연해, 지수가 전자 수를 나타낸다는 게 빠진다.", "an": "1s²의 지수가 그 오비탈 전자 수다.", "rd": "지수가 그 오비탈에 든 전자 수를 나타낸다.", "tf": "1s²의 2는 무엇? (전자 수)"}, "CH1-136": {"n": "원자가전자", "c": "ch1", "u": "Ⅱ-3", "t": "C", "dx": "원자가전자가 결합에 관여하는 가장 바깥 껍질 전자라는 점을 놓친 경우다. 원자가전자를 못 짚으면 결합 수·족 판정·반응성 예측이 줄줄이 막힌다.", "fx": "원자가전자를 '결합에 관여하는 가장 바깥 껍질 전자'로 못 박는다. 이를 짚어 결합 수·족 판정·반응성의 출발로 삼아라.", "f": "B2", "rk": 906, "d": 22, "rh": 78, "pre": ["CH1-135"], "tr": "모든 전자가 결합에 낄 것 같아, 가장 바깥 껍질 전자만이라는 게 흐려진다.", "an": "가장 바깥 껍질 전자만 결합에 낀다: 바깥 손이다.", "rd": "결합은 가장 바깥 껍질 전자만 한다. 그것이 원자가 전자다.", "tf": "결합에 쓰이는 전자는? (가장 바깥)"}, "CH1-137": {"n": "홀전자", "c": "ch1", "u": "Ⅱ-3", "t": "C", "dx": "전자 배치에서 짝을 못 이룬 홀전자 수를 잘못 센 경우다(2p³은 3개, 2p⁴는 2개). 훈트 규칙대로 채우지 못하면 홀전자 수가 어긋나 자기성·결합 해석이 틀어진다.", "fx": "홀전자를 '짝을 못 이룬 전자'로 잡고 훈트 규칙대로 채워 센다. 2p³은 3개, 2p⁴는 2개처럼 직접 채워 홀전자 수를 확인하라.", "f": "D3", "rk": 907, "d": 22, "rh": 0, "pre": ["CH1-134", "CH1-135"], "tr": "홀전자 수가 막연해, 2p³은 3개·2p⁴는 2개라는 셈이 흔들린다.", "an": "2p³은 홀전자 3개, 2p⁴는 2개: 짝 없는 전자 세기다.", "rd": "한 칸에 1개씩 채우다 보면 짝 없는 전자가 남는다. 2p³은 3개, 2p⁴는 2개다.", "tf": "2p³의 홀전자 수는? (3)"}, "CH1-138": {"n": "바닥상태", "c": "ch1", "u": "Ⅱ-3", "t": "C", "dx": "바닥상태 전자 배치가 쌓음·파울리·훈트 세 규칙을 모두 따르는 가장 안정한 배치라는 점을 놓친 경우다. 세 규칙을 함께 적용하지 못하면 어떤 배치가 바닥상태인지 가리지 못한다.", "fx": "바닥상태 배치를 '쌓음·파울리·훈트 세 규칙을 모두 따르는 가장 안정한 배치'로 못 박는다. 세 규칙을 함께 적용해 바닥상태인지 가려라.", "f": "B2", "rk": 908, "d": 22, "rh": 1, "pre": ["CH1-135"], "tr": "바닥상태 배치가 막연해, 쌓음·파울리·훈트를 다 따른 가장 안정한 배치라는 게 흐려진다.", "an": "세 규칙을 다 지킨 가장 안정한 배치다.", "rd": "쌓음·파울리·훈트를 다 지키면 에너지가 최저라 가장 안정한 바닥상태다.", "tf": "세 규칙을 다 지킨 배치는? (바닥상태)"}, "CH1-139": {"n": "들뜬상태", "c": "ch1", "u": "Ⅱ-3", "t": "C", "dx": "들뜬상태가 전자가 에너지를 흡수해 더 높은 오비탈로 올라간(낮은 칸을 건너뛴) 상태라는 점을 놓친 경우다. 바닥상태와의 차이가 흐리면 들뜬 배치를 잘못 판정한다.", "fx": "들뜬상태를 '전자가 에너지를 흡수해 더 높은 오비탈로 올라간(낮은 칸을 건너뛴) 상태'로 못 박는다. 바닥상태와 비교해 들뜬 배치를 판정하라.", "f": "B2", "rk": 911, "d": 23, "rh": 0, "pre": ["CH1-138"], "tr": "들뜬상태 배치가 막연해, 전자가 흡수해 더 높은 오비탈로 올라간(낮은 칸 건너뛴) 상태라는 게 빠진다.", "an": "낮은 칸을 건너뛰어 위로 올라간 배치다.", "rd": "흡수해 낮은 칸을 건너뛰고 위로 올라간 배치가 들뜬상태다.", "tf": "낮은 칸을 건너뛴 배치는? (들뜬상태)"}, "CH1-140": {"n": "전자수 세기", "c": "ch1", "u": "Ⅱ-3", "t": "C", "dx": "전자 배치 지수의 합으로 전체 전자 수를 세는 게 흔들린 경우다. 합산이 어긋나면 그 배치가 어느 원소(원자번호)인지부터 틀어진다.", "fx": "전체 전자 수를 '전자 배치 지수의 합'으로 센다. 합이 곧 원자번호임을, 배치에서 원소를 알아내는 데 써라.", "f": "D3", "rk": 909, "d": 22, "rh": 0, "pre": ["CH1-135"], "tr": "전자 수를 어떻게 세는지 막막해, 지수의 합이라는 게 빠진다.", "an": "지수의 합이 전자 수다.", "rd": "배치 지수를 다 더하면 전자 수다.", "tf": "배치 지수를 다 더하면? (전자 수)"}, "CH1-141": {"n": "가려막기", "c": "ch1", "u": "Ⅱ-3", "t": "C", "dx": "안쪽 전자가 핵의 인력을 일부 가려 바깥 전자가 느끼는 인력을 줄인다는 가려막기를 놓친 경우다. 이 개념이 약하면 유효핵전하, 나아가 원자 반지름·이온화 에너지의 주기성을 설명하지 못한다.", "fx": "가려막기를 '안쪽 전자가 핵 인력을 일부 가려 바깥 전자가 느끼는 인력을 줄임'으로 못 박는다. 이를 유효핵전하·반지름·이온화 에너지 주기성의 바탕으로 삼아라.", "f": "B3", "rk": 910, "d": 22, "rh": 13, "pre": ["CH1-135"], "tr": "모든 전자가 핵 인력을 똑같이 느낄 것 같아, 안쪽 전자가 가려 바깥이 덜 느낀다는 게 빠진다.", "an": "안쪽 전자가 우산처럼 가려 바깥 전자가 핵 인력을 덜 느낀다.", "rd": "안쪽 전자가 핵 인력을 일부 가린다. 그래서 바깥 전자가 덜 느낀다.", "tf": "안쪽 전자가 핵 인력을? (가림)"}, "CH1-142": {"n": "유효핵전하", "c": "ch1", "u": "Ⅱ-3", "t": "A", "dx": "유효핵전하를 핵전하에서 가려막기를 뺀 '전자가 실제로 느끼는 (+)전하'로 잡지 못한 경우다. 양성자 수만 보고 가려막기를 빼먹으면 반지름·이온화 에너지·전기음성도의 주기성이 통째로 어긋난다.", "fx": "유효핵전하를 '핵전하 − 가려막기 = 전자가 실제로 느끼는 (+)전하'로 못 박는다. 양성자 수만 보지 말고 가려막기를 빼, 반지름·이온화 에너지·전기음성도 주기성을 풀어라.", "f": "B2", "rk": 912, "d": 23, "rh": 12, "pre": ["CH1-141", "CH1-092"], "tr": "핵전하 그대로 느낄 것 같아, 가려막기를 뺀 \"실제로 느끼는 (+)전하\"라는 게 흐려진다.", "an": "가려막기를 뺀 실제로 느끼는 (+)전하다.", "rd": "실제 핵전하에서 가려막기를 뺀 것이 유효 핵전하다.", "tf": "핵전하에서 가려막기를 뺀 것은? (유효 핵전하)"}, "CH1-143": {"n": "전자 반발", "c": "ch1", "u": "Ⅱ-3", "t": "C", "dx": "같은 (−)전하인 전자끼리 서로 밀어낸다는 전자 반발을 놓친 경우다. 이 반발이 약하면 훈트 규칙(홀전자를 먼저 만들어 반발을 줄임)의 이유를 못 짚는다.", "fx": "전자 반발을 '같은 (−)전하인 전자끼리 서로 밀어냄'으로 못 박는다. 그래서 훈트 규칙이 홀전자를 먼저 만들어 반발을 줄임을 이어 짚어라.", "f": "B2", "rk": 267, "d": 3, "rh": 0, "pre": ["CH1-009"], "tr": "전자끼리 무관할 것 같아, 같은 (-)라 서로 민다는 게 빠진다.", "an": "전자끼리 같은 (-)라 서로 민다.", "rd": "전자끼리 같은 (-)라 서로 민다.", "tf": "전자끼리 같은 전하라 서로? (밀어냄)"}, "CH1-144": {"n": "주기 구조", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "주기율표에서 무엇이 무엇을 정하는지를 뒤섞은 경우다. 세로줄 족이 원자가전자 수를, 가로줄 주기가 껍질 수를 정한다는 두 축이 흔들리면 주기성·결합 예측의 토대가 무너진다.", "fx": "주기율표를 '세로 족 = 원자가전자 수, 가로 주기 = 껍질 수' 두 축으로 못 박는다. 임의 원소의 위치에서 두 값을 읽어 주기성·결합 예측의 토대로 삼아라.", "f": "B2", "rk": 913, "d": 23, "rh": 0, "pre": ["CH1-136"], "tr": "표에서 무엇이 무엇을 정하는지 막막해, 좌표 의미가 뒤섞인다.", "an": "가로·세로가 껍질 수·바깥 전자 수를 정하는 좌표다.", "rd": "가로는 껍질 수, 세로는 바깥 전자 수를 정하는 좌표다.", "tf": "주기율표 가로줄은 무엇이 같나? (껍질 수)"}, "CH1-145": {"n": "족 성질", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "같은 족이 원자가전자 수가 같아 화학적 성질이 비슷하다는 연결을 놓친 경우다. 족이 성질을 묶는다는 점이 약하면 한 원소로 같은 족 거동을 유추하지 못한다.", "fx": "'같은 족은 원자가전자 수가 같아 화학적 성질이 비슷'함을 못 박는다. 한 원소의 거동으로 같은 족 다른 원소를 유추해 보며 굳혀라.", "f": "B2", "rk": 914, "d": 23, "rh": 0, "pre": ["CH1-136"], "tr": "같은 족이 성질이 다를 것 같아, 원자가 전자 수가 같아 비슷하다는 게 빠진다.", "an": "같은 족은 바깥 전자 수가 같아 성질이 비슷하다.", "rd": "같은 족은 바깥 전자 수가 같아 성질이 비슷하다.", "tf": "같은 족이 성질 닮는 이유는? (바깥 전자 수 같음)"}, "CH1-146": {"n": "유효핵전하 주기성", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "유효핵전하가 같은 주기에서 오른쪽으로 갈수록 커지는 까닭(가려막기는 비슷한데 양성자만 늘어남)을 놓친 경우다. 이 한 엔진이 흔들리면 반지름·이온화 에너지·전기음성도의 주기성이 줄줄이 어긋난다.", "fx": "'같은 주기 오른쪽으로 갈수록 유효핵전하 증가(가려막기는 비슷, 양성자만 늘어남)'를 하나의 엔진으로 못 박는다. 이 엔진에서 반지름·이온화 에너지·전기음성도 주기성이 모두 나옴을 짚어라.", "f": "B3", "rk": 916, "d": 24, "rh": 11, "pre": ["CH1-142"], "tr": "오른쪽으로 가도 핵 인력이 비슷할 것 같아, 가려막기는 비슷한데 양성자만 늘어 커진다는 게 빠진다.", "an": "오른쪽으로 가면 가려막기는 비슷한데 양성자만 늘어 유효 핵전하가 커진다.", "rd": "오른쪽으로 가면 껍질은 그대로라 가려막기는 비슷한데 양성자만 는다. 그래서 유효 핵전하가 커진다.", "tf": "같은 주기 오른쪽으로 유효 핵전하는? (증가)"}, "CH1-147": {"n": "원자 반지름", "c": "ch1", "u": "Ⅱ-4", "t": "A", "dx": "원자 반지름이 같은 주기에서 오른쪽으로 작아지고(유효핵전하 증가) 같은 족에서 아래로 커진다(껍질 증가)는 두 방향을 놓친 경우다. 두 경향의 원인을 못 잡으면 이온 반지름·결합 길이 비교가 어긋난다.", "fx": "원자 반지름을 '주기 오른쪽으로 작아짐(유효핵전하 증가), 족 아래로 커짐(껍질 증가)' 두 방향으로 못 박는다. 두 원인을 적어 이온 반지름·결합 길이 비교에 써라.", "f": "A1", "rk": 922, "d": 25, "rh": 3, "pre": ["CH1-146", "CH1-136"], "tr": "반지름 경향에 원인이 하나일 것 같아, 주기는 유효 핵전하·족은 껍질 수 두 방향이 빠진다.", "an": "주기는 유효 핵전하·족은 껍질 수: 두 방향으로 변한다.", "rd": "껍질이 늘면 커지고(족) 유효 핵전하가 늘면 작아진다(주기). 두 방향이다.", "tf": "같은 족 아래로 반지름은? (증가: 껍질 늘음)"}, "CH1-148": {"n": "이온 반지름", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "양이온은 전자를 잃어 작아지고 음이온은 전자를 얻어 반발이 커져 커진다는 점을 놓친 경우다. 전자 수 변화가 반지름을 바꾼다는 감각이 없으면 이온 크기 비교가 어긋난다.", "fx": "'양이온은 전자를 잃어 작아지고, 음이온은 전자를 얻어 반발이 커져 커진다'를 못 박는다. 전자 수 변화로 크기 변화를 잡아 원자와 그 이온을 비교하라.", "f": "A1", "rk": 929, "d": 26, "rh": 1, "pre": ["CH1-147", "CH1-095"], "tr": "이온이 돼도 크기가 비슷할 것 같아, 양이온은 작아지고 음이온은 반발로 커진다는 게 빠진다.", "an": "양이온은 줄고(전자 빠짐) 음이온은 반발로 커진다.", "rd": "전자를 잃으면(양이온) 작아지고 얻으면(음이온) 반발로 커진다.", "tf": "음이온은 원자보다 크나 작나? (큼: 반발)"}, "CH1-149": {"n": "등전자 이온", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "전자 수가 같은(등전자) 이온은 양성자가 많을수록 전자를 더 세게 당겨 작아진다는 점을 놓친 경우다. 같은 전자 수에서 양성자 수가 크기를 가른다는 기준이 약하면 등전자 비교가 막힌다.", "fx": "등전자 이온은 '양성자가 많을수록 전자를 세게 당겨 작아진다'를 기준으로 삼는다. 전자 수가 같은 이온들을 양성자 수 순으로 늘어놓고 크기를 비교하라.", "f": "C1", "rk": 942, "d": 27, "rh": 0, "pre": ["CH1-148"], "tr": "전자 수 같으면 크기도 같을 것 같아, 양성자 많을수록 더 당겨 작아진다는 게 빠진다.", "an": "전자 수 같아도 양성자 많을수록 더 당겨 작다.", "rd": "전자 수가 같으면 양성자가 많을수록 더 당겨 작아진다.", "tf": "전자 수 같으면 양성자 많을수록 크기는? (작음)"}, "CH1-150": {"n": "이온화 에너지", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "이온화 에너지가 기체 원자에서 전자를 떼는 데 드는 흡열 에너지라는 정의를 놓친 경우다. 반지름이 클수록(핵에서 멀수록) 떼기 쉬워 작다는 연결까지 잡아야 주기성으로 이어진다.", "fx": "이온화 에너지를 '기체 원자에서 전자를 떼는 데 드는 흡열 에너지'로 못 박는다. 반지름이 커 핵에서 멀수록 떼기 쉬워 작아짐을 주기성으로 이어라.", "f": "B2", "rk": 915, "d": 23, "rh": 71, "pre": ["CH1-136"], "tr": "이온화 에너지가 막연해, 기체 원자에서 전자를 떼는 흡열 에너지라는 정의가 흐려진다.", "an": "기체 원자에서 전자를 떼는 데 드는 흡열 에너지다.", "rd": "기체 원자에서 전자를 떼는 데 드는 에너지다. 인력을 이겨야 해 흡열이다.", "tf": "전자를 떼는 건 흡열인가 발열인가? (흡열)"}, "CH1-151": {"n": "이온화 에너지 주기성", "c": "ch1", "u": "Ⅱ-4", "t": "A", "dx": "이온화 에너지가 같은 주기에서 오른쪽으로 커지고(유효핵전하 증가) 같은 족에서 아래로 작아진다(반지름 증가)는 방향을 놓친 경우다. 이 경향이 흔들리면 금속성·반응성 예측이 어긋난다.", "fx": "이온화 에너지를 '주기 오른쪽으로 커짐(유효핵전하), 족 아래로 작아짐(반지름 증가)'으로 못 박는다. 이 방향으로 금속성·반응성을 예측하라.", "f": "A1", "rk": 923, "d": 25, "rh": 2, "pre": ["CH1-150", "CH1-146"], "tr": "경향 방향이 헷갈려, 오른쪽으로 커지고(유효 핵전하) 아래로 작아진다(반지름)는 게 흔들린다.", "an": "오른쪽으로 커지고 아래로 작아진다.", "rd": "유효 핵전하가 큰 오른쪽일수록 크고, 반지름이 큰 아래일수록 작다.", "tf": "같은 주기 오른쪽으로 이온화 에너지는? (증가)"}, "CH1-152": {"n": "순차 이온화 에너지", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "전자를 뗄수록 떼기 어려워 순차 이온화 에너지가 E₁<E₂<E₃로 커지고, 값이 급증하는 지점이 안쪽 껍질로 넘어가는 자리라는 점을 놓친 경우다. 이 급증을 못 읽으면 원자가전자 수를 알아내지 못한다.", "fx": "순차 이온화 에너지가 'E₁<E₂<E₃로 커지고 값이 급증하는 자리가 안쪽 껍질로 넘어가는 지점'임을 못 박는다. 급증 직전까지의 전자 수가 원자가전자 수임을 직접 읽어라.", "f": "C1", "rk": 917, "d": 24, "rh": 0, "pre": ["CH1-150"], "tr": "떼는 에너지가 다 비슷할 것 같아, E₁<E₂<E₃로 커지고 안쪽 껍질서 급증한다는 게 빠진다.", "an": "뗄수록 커지고 안쪽 껍질에 닿으면 폭증: 겉옷보다 속옷이 어렵다.", "rd": "뗄수록 남은 전자를 더 세게 당겨 커지고, 안쪽 껍질에 닿으면 급증한다.", "tf": "안쪽 껍질에 닿으면 이온화 에너지는? (급증)"}, "CH1-153": {"n": "전기음성도", "c": "ch1", "u": "Ⅱ-4", "t": "C", "dx": "전기음성도를 이온화 에너지와 뒤섞은 경우다. 전기음성도가 '결합에서 공유 전자쌍을 끌어당기는 세기'라는 정의를 놓치면 결합 극성·분자 극성 판단이 어긋난다.", "fx": "전기음성도를 '결합에서 공유 전자쌍을 끌어당기는 세기'로 못 박는다(이온화 에너지와 구분). 이 세기로 결합 극성·분자 극성을 판단하라.", "f": "B2", "rk": 918, "d": 24, "rh": 20, "pre": ["CH1-150"], "tr": "전기음성도가 이온화 에너지 같아, 둘이 섞인다.", "an": "전기음성도는 결합 전자를 당기는 힘: 이온화 에너

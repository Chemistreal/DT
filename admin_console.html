"fx": "평형 상수 식에서 '순수 고체·액체는 활동도를 1로 보아 제외'함을 못 박는다. 고체 농도를 식에 넣는 실수를 피하라.", "f": "D1", "rk": 237, "d": 2, "rh": 1, "pre": ["GC-117"], "tr": "평형 식에 모든 물질을 넣어야 할 것 같아, 순수 고체·액체는 활동도 1로 빼는 규칙이 묻힌다.", "an": "평형식에서 순수 고체·액체는 농도가 안 변해 1로 친다: 식에서 빠진다.", "rd": "순수 고체·액체는 농도(활동도)가 일정해 1로 친다. 그래서 평형식에서 빠진다.", "tf": "평형식에 순수 고체를 넣나? (안 넣음: 1로)"}, "GC-121": {"n": "평형 상수 의미", "c": "gc", "u": "화학평형-1", "t": "A", "dx": "K 크기의 의미를 놓친 경우다. K가 크면 생성물이, 작으면 반응물이 우세하다는 해석이 흔들린다.", "fx": "'K가 크면 생성물이, 작으면 반응물이 우세'함을 못 박는다. K 크기로 평형이 어느 쪽으로 치우쳤는지 읽어라.", "f": "C1", "rk": 238, "d": 2, "rh": 0, "pre": ["GC-117"], "tr": "K 값이 그냥 숫자 같아, 크면 생성물·작으면 반응물 쪽이라는 의미가 안 읽힌다.", "an": "K가 크면 평형이 생성물 쪽으로 기운 천칭: 작으면 반응물 쪽이다.", "rd": "K는 평형에서 생성물/반응물 비다. 크면 생성물 쪽, 작으면 반응물 쪽으로 치우친 것이다.", "tf": "K가 매우 크면 평형은 어느 쪽? (생성물)"}, "GC-122": {"n": "평형 상수 의존성", "c": "gc", "u": "화학평형-1", "t": "C", "dx": "K가 온도에만 의존하고 농도·압력·촉매로는 변하지 않는다는 점을 놓친 경우다. 농도를 바꾸면 평형 위치는 이동해도 K 값은 그대로라는 구분이 약하다.", "fx": "'K는 온도에만 의존하고 농도·압력·촉매로는 변하지 않음'을 못 박는다. 농도를 바꾸면 평형 위치는 이동해도 K 값은 그대로임을 갈라라.", "f": "A3", "rk": 239, "d": 2, "rh": 2, "pre": ["GC-117"], "tr": "농도·압력·촉매를 바꾸면 K도 변할 것 같아, 오직 온도에만 의존한다는 게 의외로 다가온다.", "an": "농도·압력·촉매를 건드려도 K는 안 변한다: 오직 온도만 K를 바꾼다.", "rd": "K는 정·역 속도상수의 비다. 속도상수는 온도에만 의존하므로 K도 온도에만 의존한다.", "tf": "농도를 바꾸면 K가 변하나? (안 변함: 온도만)"}, "GC-123": {"n": "반응지수", "c": "gc", "u": "화학평형-1", "t": "C", "dx": "반응지수 Q와 K를 비교해 방향을 판단한다는 점을 헷갈린 경우다. Q<K면 정반응, Q>K면 역반응, Q=K면 평형이라는 대응이 흔들린다.", "fx": "반응지수를 'Q와 K를 비교해 방향 판단: Q<K면 정반응, Q>K면 역반응, Q=K면 평형'으로 못 박는다. Q-K 비교로 이동 방향을 정하라.", "f": "C1", "rk": 240, "d": 2, "rh": 1, "pre": ["GC-117"], "tr": "Q가 K의 다른 이름 같아, 둘을 비교해 진행 방향을 판단한다는 쓰임이 안 잡힌다.", "an": "Q는 지금 사진, K는 평형 사진: 둘을 비교해 어느 쪽으로 갈지 안다.", "rd": "Q는 평형식에 현재 농도를 넣은 값이다. Q와 K를 비교하면 어느 쪽으로 갈지 안다.", "tf": "Q가 K보다 작으면 어느 방향? (정반응)"}, "GC-124": {"n": "르샤틀리에", "c": "gc", "u": "화학평형-1", "t": "C", "dx": "르샤틀리에 원리(가해진 변화를 완화하는 방향으로 평형 이동)를 놓친 경우다. 속도 변화가 아니라 평형 위치 이동이라는 점이 약하다.", "fx": "르샤틀리에 원리를 '가해진 변화를 완화하는 방향으로 평형이 이동'으로 못 박는다. 속도 변화가 아니라 평형 위치 이동임을 잡아라.", "f": "A1", "rk": 241, "d": 2, "rh": 7, "pre": ["GC-117"], "tr": "평형이 가한 변화에 어떻게 반응할지 막막해, \"완화하는 방향\"이라는 르샤틀리에의 핵심이 흐려진다.", "an": "평형은 찌르면 피하는 청개구리: 가한 변화를 완화하는 쪽으로 움직인다.", "rd": "평형이 깨지면 변화를 줄이는 쪽으로 다시 균형을 찾는다. 그것이 이동 방향이다.", "tf": "평형에 변화를 주면 어느 쪽으로? (완화하는 쪽)"}, "GC-125": {"n": "농도 변화", "c": "gc", "u": "화학평형-1", "t": "C", "dx": "농도를 바꿨을 때 이동 방향을 헷갈린 경우다. 반응물을 넣으면 정반응, 생성물을 넣으면 역반응으로 그 변화를 완화한다는 방향이 흔들린다.", "fx": "'반응물을 넣으면 정반응, 생성물을 넣으면 역반응으로 그 변화를 완화'함을 못 박는다. 농도 변화에서 이동 방향을 바로 잡아라.", "f": "A1", "rk": 382, "d": 3, "rh": 0, "pre": ["GC-124"], "tr": "농도를 바꾸면 평형이 어디로 갈지 헷갈려, 이동 방향이 흔들린다.", "an": "반응물을 더 부으면 그걸 줄이려 정반응: 넘치면 흘려보내는 쪽으로 간다.", "rd": "반응물을 더하면 Q가 K보다 작아져 정반응으로, 생성물을 더하면 역반응으로 간다.", "tf": "반응물을 더 넣으면 어느 방향? (정반응)"}, "GC-126": {"n": "압력 변화", "c": "gc", "u": "화학평형-2", "t": "A", "dx": "압력(부피)을 바꿨을 때 기체 몰수가 적은 쪽으로 이동해 변화를 완화한다는 점을 놓친 경우다. 압축하면 분자 수가 줄어드는 쪽으로 이동한다는 방향이 흔들린다.", "fx": "'압력(부피)을 바꾸면 기체 몰수가 적은 쪽으로 이동해 변화를 완화'함을 못 박는다. 압축하면 분자 수가 줄어드는 쪽으로 이동함을 잡아라.", "f": "A1", "rk": 383, "d": 3, "rh": 0, "pre": ["GC-124"], "tr": "압력을 올리면 평형이 어디로 갈지 막막해, 기체 몰수가 적은 쪽으로 간다는 게 안 잡힌다.", "an": "압력을 높이면 자리를 덜 차지하는 기체 적은 쪽으로: 만원 버스에서 덜 붐비는 칸으로 간다.", "rd": "압력을 높이면 부피를 줄이려 기체 몰수가 적은 쪽으로 이동한다.", "tf": "압력을 높이면 기체 몰수 어느 쪽으로? (적은 쪽)"}, "GC-127": {"n": "온도 변화", "c": "gc", "u": "화학평형-2", "t": "C", "dx": "온도 변화 시 이동 방향을 헷갈린 경우다. 온도를 올리면 흡열 반응 쪽으로 이동한다(열을 흡수해 완화)는 대응이 흔들린다.", "fx": "'온도를 올리면 흡열 반응 쪽으로 이동(열을 흡수해 완화)'함을 못 박는다. 온도 변화에서 이동 방향을 흡열·발열로 갈라라.", "f": "A1", "rk": 384, "d": 3, "rh": 1, "pre": ["GC-124"], "tr": "온도를 바꾸면 평형이 어디로 갈지 헷갈려, 흡열·발열 방향과의 대응이 흔들린다.", "an": "온도를 올리면 열을 흡수하는(흡열) 쪽으로: 더우면 열을 먹는 방향으로 피한다.", "rd": "온도를 올리면 열을 흡수하는(흡열) 쪽으로 이동해 그 변화를 완화한다.", "tf": "발열 반응에 온도를 올리면? (역반응: 흡열 쪽)"}, "GC-128": {"n": "촉매와 평형", "c": "gc", "u": "화학평형-2", "t": "B", "dx": "촉매가 정·역반응 속도를 똑같이 높여 평형에 빨리 도달시킬 뿐 평형 위치(K)는 바꾸지 않는다는 점을 놓친 경우다.", "fx": "'촉매는 정·역반응 속도를 똑같이 높여 평형에 빨리 도달시킬 뿐 평형 위치(K)는 안 바꿈'을 못 박는다. 도달 속도와 위치를 갈라라.", "f": "A3", "rk": 552, "d": 4, "rh": 0, "pre": ["GC-124", "GC-198"], "tr": "촉매가 평형도 옮길 것 같아, 정·역을 똑같이 빠르게 해 위치(K)는 그대로라는 게 빠진다.", "an": "촉매는 정·역을 똑같이 빠르게 해 도착만 앞당기는 지름길: 평형 위치(K)는 안 바꾼다.", "rd": "촉매는 정·역 속도를 똑같이 올린다. 비가 안 변하니 K도 평형 위치도 그대로다.", "tf": "촉매가 평형 위치를 바꾸나? (안 바꿈)"}, "GC-129": {"n": "불활성 기체", "c": "gc", "u": "화학평형-2", "t": "C", "dx": "일정 부피에서 불활성 기체를 넣어도 각 반응 성분의 부분 압력·농도가 그대로라 평형이 이동하지 않는다는 점을 놓친 경우다.", "fx": "'일정 부피에서 불활성 기체를 넣어도 각 반응 성분의 부분 압력·농도가 그대로라 평형이 이동하지 않음'을 못 박는다. 전체 압력만 오를 뿐임을 잡아라.", "f": "A3", "rk": 385, "d": 3, "rh": 0, "pre": ["GC-124"], "tr": "기체를 넣었으니 평형이 움직일 것 같은데, 부피 고정에서 불활성 기체는 각 분압을 안 바꿔 이동이 없다는 게 의외다.", "an": "부피 고정에서 아르곤을 넣어도 반응 기체 농도는 그대로: 구경꾼이 늘어도 경기는 안 변한다.", "rd": "부피 고정에서 불활성 기체를 넣어도 반응 기체 농도(분압)는 그대로다. 그래서 Q가 안 변해 이동이 없다.", "tf": "부피 고정에서 Ar을 넣으면 평형은? (이동 없음)"}, "GC-130": {"n": "온도와 K", "c": "gc", "u": "화학평형-2", "t": "C", "dx": "K를 바꾸는 유일한 요인이 온도라는 점을 놓친 경우다. 농도·압력·촉매는 K를 안 바꾸고 온도만 K 값 자체를 바꾼다는 구분이 흔들린다.", "fx": "'K를 바꾸는 유일한 요인이 온도'임을 못 박는다. 농도·압력·촉매는 K를 안 바꾸고 온도만 K 값 자체를 바꿈을 갈라라.", "f": "A3", "rk": 553, "d": 4, "rh": 0, "pre": ["GC-122", "GC-127"], "tr": "여러 요인이 K를 바꿀 것 같아, 오직 온도만이 K를 바꾼다는 게 안 잡힌다.", "an": "무엇을 넣고 빼도 K는 그대로, 오직 온도만: 천칭의 영점은 온도로만 옮긴다.", "rd": "K를 바꾸려면 정·역 속도상수의 비를 바꿔야 한다. 그건 온도만 한다.", "tf": "무엇만 K를 바꾸나? (온도)"}, "GC-131": {"n": "용해도곱", "c": "gc", "u": "화학평형-2", "t": "C", "dx": "용해도곱 Kₛₚ가 잘 녹지 않는 염의 용해 평형 상수라는 점을 놓친 경우다. 평형 상수의 일종이라 온도에만 의존한다는 점이 약하다.", "fx": "용해도곱 Kₛₚ를 '잘 녹지 않는 염의 용해 평형 상수'로 못 박는다. 평형 상수의 일종이라 온도에만 의존함을 잡아라.", "f": "B2", "rk": 242, "d": 2, "rh": 3, "pre": ["GC-117"], "tr": "Kₛₚ가 특별한 상수 같아, 잘 안 녹는 염의 용해 평형 상수일 뿐이라는 게 안 잡힌다.", "an": "Ksp는 잘 안 녹는 염의 평형상수: 녹은 이온 농도의 곱이 일정하다.", "rd": "잘 안 녹는 염의 용해 평형 상수다. 고체는 1로 빼고 이온 농도의 곱이 Ksp다.", "tf": "잘 안 녹는 염의 평형 상수는? (Ksp)"}, "GC-132": {"n": "공통 이온 효과", "c": "gc", "u": "화학평형-2", "t": "A", "dx": "공통 이온을 넣으면 평형이 침전 쪽으로 이동해 용해도가 줄어든다(공통 이온 효과)는 점을 놓친 경우다. Kₛₚ는 온도에만 의존해 그대로라는 점과 헷갈린다.", "fx": "'공통 이온을 넣으면 평형이 침전 쪽으로 이동해 용해도가 줆(공통 이온 효과)'을 못 박는다. Kₛₚ는 온도에만 의존해 그대로임과 갈라라.", "f": "A1", "rk": 386, "d": 3, "rh": 0, "pre": ["GC-131", "GC-124"], "tr": "공통 이온을 넣어도 별일 없을 것 같은데, 평형이 침전 쪽으로 밀려 용해도가 준다는 게 빠진다.", "an": "같은 이온을 더 부으면 평형이 침전 쪽으로 밀려 덜 녹는다: 이미 붐비면 더 안 들어온다.", "rd": "같은 이온을 더하면 Q가 Ksp에 빨리 닿아 침전 쪽으로 간다. 그래서 용해도가 준다.", "tf": "NaCl 용액에 Cl⁻를 더하면 용해도는? (감소)"}, "GC-133": {"n": "침전 조건", "c": "gc", "u": "화학평형-2", "t": "C", "dx": "이온곱 Q와 Kₛₚ 비교로 침전 여부를 판단한다는 점을 놓친 경우다. Q>Kₛₚ면 과포화라 침전, Q<Kₛₚ면 불포화라 더 녹는다는 대응이 흔들린다.", "fx": "침전 여부를 '이온곱 Q와 Kₛₚ 비교: Q>Kₛₚ면 과포화라 침전, Q<Kₛₚ면 불포화라 더 녹음'으로 못 박는다. Q-Kₛₚ 비교로 판단하라.", "f": "C1", "rk": 387, "d": 3, "rh": 0, "pre": ["GC-131", "GC-123"], "tr": "침전 여부가 감으로 정해질 것 같아, 이온곱 Q와 Kₛₚ 비교로 판단한다는 절차가 빠진다.", "an": "이온곱 Q를 Ksp와 비교: Q가 더 크면 넘쳐서 침전한다.", "rd": "이온곱 Q를 Ksp와 비교한다. Q>Ksp면 과포화라 침전한다.", "tf": "Q가 Ksp보다 크면? (침전)"}, "GC-134": {"n": "Ksp 식", "c": "gc", "u": "화학평형-2", "t": "C", "dx": "Kₛₚ 식에서 고체 활동도를 1로 빼고, 각 이온 농도에 계수를 지수로 넣어 곱한다는 규칙을 놓친 경우다.", "fx": "Kₛₚ 식을 '고체 활동도를 1로 빼고, 각 이온 농도에 계수를 지수로 넣어 곱함'으로 못 박는다. 화학식의 이온 계수를 지수로 옮겨라.", "f": "D3", "rk": 388, "d": 3, "rh": 0, "pre": ["GC-131", "GC-120"], "tr": "Ksp 식에 고체도 넣어야 할 것 같아, 활동도 1로 빼고 이온 농도에 계수를 지수로 넣는다는 게 흐려진다.", "an": "고체는 1로 빼고 이온 농도에 계수를 지수로: 평형식 규칙 그대로다.", "rd": "고체는 활동도 1로 빼고 이온 농도에 계수를 지수로 곱한다.", "tf": "Ksp 식에 고체를 넣나? (안 넣음)"}, "GC-135": {"n": "촉매와 K", "c": "gc", "u": "화학평형-2", "t": "C", "dx": "촉매가 K에 영향을 주지 않는다(평형 위치 불변)는 점을 놓친 경우다. K는 온도에만 의존한다는 원칙이 흔들린다.", "fx": "'촉매는 K에 영향을 주지 않음(평형 위치 불변)'을 못 박는다. K는 온도에만 의존한다는 원칙을 지켜라.", "f": "A3", "rk": 554, "d": 4, "rh": 0, "pre": ["GC-122", "GC-198"], "tr": "촉매가 평형 위치도 바꿀 것 같아, K에는 영향이 없다는 게 안 잡힌다.", "an": "촉매는 평형 위치(K)를 못 바꾼다: 지름길일 뿐 도착지는 같다.", "rd": "촉매는 정·역을 똑같이 빠르게 해 K를 안 바꾼다. 그래서 평형 위치가 그대로다.", "tf": "촉매가 평형 농도를 바꾸나? (안 바꿈)"}, "GC-180": {"n": "반응 속도", "c": "gc", "u": "반응속도론-1", "t": "C", "dx": "반응 속도가 단위 시간당 농도 변화율이라는 정의를 놓친 경우다. 반응물은 줄고 생성물은 느는 변화의 '율'이 속도라는 점이 약하다.", "fx": "반응 속도를 '단위 시간당 농도 변화율'로 못 박는다. 반응물은 줄고 생성물은 느는 변화의 '율'임을 잡아 속도를 정량화하라.", "f": "B2", "rk": 35, "d": 0, "rh": 24, "pre": [], "tr": "반응 속도가 막연한 빠르기 같아, 단위 시간당 농도 변화율이라는 정의가 흐려진다.", "an": "반응속도는 시간당 농도 변화량: 빠르기를 수로 잰 것이다.", "rd": "속도는 단위 시간당 변화량이다. 그래서 농도의 시간 변화율로 정의한다.", "tf": "반응 속도의 단위는 시간당 무엇? (농도 변화)"}, "GC-181": {"n": "속도식", "c": "gc", "u": "반응속도론-1", "t": "C", "dx": "속도식의 차수가 반응식 계수와 일치한다는 보장이 없고 실험으로 정해진다는 점을 놓친 경우다. 계수=차수로 단정한 것이 오류다.", "fx": "'속도식의 차수가 반응식 계수와 일치한다는 보장이 없고 실험으로 정함'을 못 박는다. 계수=차수로 단정 말고 실험 데이터로 차수를 잡아라.", "f": "D1", "rk": 128, "d": 1, "rh": 17, "pre": ["GC-180"], "tr": "속도식 차수가 반응식 계수일 것 같아, 실험으로만 정해진다는 게 의외로 다가온다.", "an": "차수는 반응식 계수에서 못 읽고 실험으로만 정한다: 겉보기 계수와 다를 수 있다.", "rd": "속도가 농도에 어떻게 의존하나는 메커니즘이 정한다. 그래서 실험으로만 알 수 있다.", "tf": "차수를 반응식 계수에서 읽을 수 있나? (없다: 실험)"}, "GC-182": {"n": "반응 차수", "c": "gc", "u": "반응속도론-1", "t": "C", "dx": "반응 차수가 반응식만으로는 알 수 없고 정수로 제한되지도 않으며 실험 데이터로 정한다는 점을 놓친 경우다.", "fx": "반응 차수를 '반응식만으로는 알 수 없고 정수로 제한되지도 않으며 실험 데이터로 정함'으로 못 박는다. 차수를 짐작 말고 데이터로 구하라.", "f": "D1", "rk": 248, "d": 2, "rh": 10, "pre": ["GC-181"], "tr": "차수가 계수에서 읽힐 것 같아, 반응식만으로는 알 수 없고 정수도 아닐 수 있다는 게 빠진다.", "an": "차수는 농도를 바꿔 속도가 어떻게 변하나 실험해 알아낸다: 정수가 아닐 수도 있다.", "rd": "한 농도만 바꿔 속도 변화를 보면 그 반응물의 차수가 나온다. 계수와 무관하다.", "tf": "차수는 무엇으로 정하나? (실험)"}, "GC-183": {"n": "전체 차수", "c": "gc", "u": "반응속도론-1", "t": "C", "dx": "전체 차수가 각 반응물 차수의 합이라는 점을 놓친 경우다. 1차와 2차가 함께면 전체 3차라는 셈이 흔들린다.", "fx": "전체 차수를 '각 반응물 차수의 합'으로 못 박는다. 1차와 2차가 함께면 전체 3차임을 잡아 전체 차수를 셈하라.", "f": "D3", "rk": 396, "d": 3, "rh": 0, "pre": ["GC-182"], "tr": "전체 차수가 따로 정해질 것 같아, 각 반응물 차수의 합이라는 게 안 잡힌다.", "an": "전체 차수는 각 반응물 차수의 합이다.", "rd": "속도식의 농도 지수를 다 더한 것이 전체 차수다.", "tf": "1차+2차 반응물이면 전체 차수는? (3)"}, "GC-184": {"n": "속도 상수", "c": "gc", "u": "반응속도론-1", "t": "C", "dx": "속도 상수 k가 온도(와 활성화 에너지)에만 의존하고 농도로는 변하지 않는다는 점을 놓친 경우다. 온도가 오르면 k가 커진다는 방향이 약하다.", "fx": "속도 상수 k를 '온도(와 활성화 에너지)에만 의존하고 농도로는 변하지 않음'으로 못 박는다. 온도가 오르면 k가 커지는 방향을 잡아라.", "f": "A3", "rk": 249, "d": 2, "rh": 2, "pre": ["GC-181"], "tr": "농도를 올리면 k도 커질 것 같아, k는 온도(와 Eₐ)에만 의존한다는 게 빠진다.", "an": "k는 농도와 무관, 온도와 활성화에너지만 좌우: 그 반응의 체질이다.", "rd": "k는 충돌 빈도·배향·장벽을 담는다. 농도가 아니라 온도와 Ea로 정해진다.", "tf": "k는 농도에 의존하나? (안 함)"}, "GC-185": {"n": "0차 반응", "c": "gc", "u": "반응속도론-1", "t": "C", "dx": "0차 반응이 농도와 무관하게 일정한 속도(v=k)로 진행된다는 점을 놓친 경우다. 농도가 줄어도 속도가 유지된다는 점이 흔들린다.", "fx": "0차 반응을 'v=k라 농도와 무관하게 일정한 속도로 진행'으로 못 박는다. 농도가 줄어도 속도가 유지됨을 잡아라.", "f": "A2", "rk": 397, "d": 3, "rh": 1, "pre": ["GC-182"], "tr": "0차 반응이 안 일어날 것 같은 이름이라, 농도와 무관하게 일정 속도(v=k)로 간다는 게 안 잡힌다.", "an": "0차는 농도와 무관하게 일정 속도(v=k): 컨베이어처럼 정해진 속도로 처리한다.", "rd": "속도가 농도와 무관(v=k)하면 0차다. 농도를 올려도 속도가 그대로다.", "tf": "농도를 올려도 속도가 그대로면 몇 차? (0차)"}, "GC-186": {"n": "1차 반응", "c": "gc", "u": "반응속도론-1", "t": "C", "dx": "1차 반응이 v=k[A]이고 반감기 t½=ln2/k로 농도와 무관하게 일정하다는 점을 놓친 경우다.", "fx": "1차 반응을 'v=k[A]이고 반감기 t½=ln2/k로 농도와 무관하게 일정'으로 못 박는다. 1차 반감기의 농도 독립성을 잡아라.", "f": "A2", "rk": 398, "d": 3, "rh": 6, "pre": ["GC-182"], "tr": "1차의 반감기도 농도에 따라 변할 것 같아, t½=ln2/k로 농도와 무관하게 일정하다는 게 의외다.", "an": "1차는 반감기가 농도와 무관하게 일정: 방사성 붕괴처럼.", "rd": "1차는 v=k[A]라 적분하면 반감기 t½=ln2/k다. 농도가 안 들어가 일정하다.", "tf": "1차 반응의 반감기는 농도에 의존하나? (안 함)"}, "GC-187": {"n": "2차 반응", "c": "gc", "u": "반응속도론-1", "t": "C", "dx": "2차 반응이 v=k[A]²이고, ln[A]-t 직선은 1차의 특징이라는 구분을 놓친 경우다. 차수별 그래프 형태가 흔들린다.", "fx": "2차 반응을 'v=k[A]²'로 못 박는다. ln[A]-t 직선은 1차의 특징임을 갈라, 차수별 그래프 형태를 구분하라.", "f": "A2", "rk": 399, "d": 3, "rh": 1, "pre": ["GC-182"], "tr": "ln[A]-t 직선이 2차의 특징 같아, 그건 1차의 특징이고 2차는 v=k[A]²이라는 게 흔들린다.", "an": "ln[A] 대 t가 직선이면 1차: 2차는 v=k[A]²로 다르다.", "rd": "1차 적분식 ln[A]=ln[A]₀-kt라 ln[A] 대 t가 직선이다. 2차는 1/[A]가 직선이다.", "tf": "ln[A] 대 t가 직선이면 몇 차? (1차)"}, "GC-188": {"n": "적분 속도식", "c": "gc", "u": "반응속도론-1", "t": "C", "dx": "적분 속도식의 직선 형태로 차수를 구별한다는 점을 놓친 경우다. [A]-t 직선은 0차, ln[A]-t 직선은 1차, 1/[A]-t 직선은 2차라는 대응이 흔들린다.", "fx": "적분 속도식의 차수 구별을 '[A]-t 직선은 0차, ln[A]-t 직선은 1차, 1/[A]-t 직선은 2차'로 못 박는다. 어느 그래프가 직선인지로 차수를 정하라.", "f": "A2", "rk": 566, "d": 4, "rh": 0, "pre": ["GC-185", "GC-186", "GC-187"], "tr": "차수를 그래프로 어떻게 구별하는지 막막해, 적분 속도식의 직선 형태로 가른다는 게 빠진다.", "an": "적분 속도식이 직선이 되는 그래프로 차수를 가른다: [A]·ln[A]·1/[A] 중 직선인 것이다.", "rd": "각 차수의 적분식이 직선이 되는 변수가 다르다. 직선이 되는 그래프로 차수를 가른다.", "tf": "1/[A] 대 t가 직선이면 몇 차? (2차)"}, "GC-189": {"n": "반감기", "c": "gc", "u": "반응속도론-1", "t": "A", "dx": "1차 반응만 반감기 t½=ln2/k가 농도와 무관하게 일정하고, 0차·2차는 초기 농도에 의존한다는 점을 놓친 경우다.", "fx": "'1차 반응만 반감기 t½=ln2/k가 농도와 무관하게 일정, 0차·2차는 초기 농도에 의존'함을 못 박는다. 차수별 반감기 거동을 갈라라.", "f": "A2", "rk": 567, "d": 4, "rh": 3, "pre": ["GC-186"], "tr": "반감기는 다 일정할 것 같아, 1차만 농도 무관이고 0차·2차는 초기 농도에 의존한다는 게 빠진다.", "an": "반감기가 농도 무관인 건 1차뿐: 0차·2차는 초기 농도에 따라 달라진다.", "rd": "1차만 반감기가 농도 무관이다. 0차·2차는 적분식에 초기 농도가 남아 의존한다.", "tf": "반감기가 일정한 차수는? (1차)"}, "GC-190": {"n": "충돌 이론", "c": "gc", "u": "반응속도론-2", "t": "C", "dx": "반응이 일어나려면 충분한 에너지와 올바른 배향(방향)을 갖춘 충돌이어야 한다는 점을 놓친 경우다. 대부분의 충돌은 반응으로 이어지지 않는다는 점이 약하다.", "fx": "충돌 이론을 '반응이 일어나려면 충분한 에너지와 올바른 배향(방향)을 갖춘 충돌'로 못 박는다. 대부분의 충돌은 반응으로 이어지지 않음을 잡아라.", "f": "A4", "rk": 129, "d": 1, "rh": 7, "pre": ["GC-180"], "tr": "부딪치기만 하면 반응할 것 같아, 충분한 에너지와 올바른 배향 둘 다 필요하다는 게 빠진다.", "an": "부딪쳐야 반응하되 충분한 에너지+올바른 방향을 갖춘 충돌만: 헛부딪침은 무효다.", "rd": "반응은 충돌에서 시작하되 에너지 장벽을 넘고 배향이 맞아야 한다. 그래서 유효 충돌만 반응한다.", "tf": "부딪치면 다 반응하나? (아니다: 유효 충돌만)"}, "GC-191": {"n": "활성화 에너지", "c": "gc", "u": "반응속도론-2", "t": "C", "dx": "활성화 에너지가 반응이 넘어야 할 에너지 장벽이고, 장벽이 높을수록 넘기 어려워 반응이 느리다는 점을 놓친 경우다.", "fx": "활성화 에너지를 '반응이 넘어야 할 에너지 장벽, 높을수록 넘기 어려워 반응이 느림'으로 못 박는다. 장벽 개념으로 속도를 가늠하라.", "f": "B3", "rk": 250, "d": 2, "rh": 6, "pre": ["GC-190"], "tr": "활성화 에너지가 막연한 장벽 같아, 높을수록 넘기 어려워 느려진다는 대응이 흐려진다.", "an": "활성화에너지는 넘어야 할 고개: 높을수록 넘기 힘들어 느리다.", "rd": "반응엔 넘어야 할 에너지 봉우리가 있다. 높을수록 넘는 분자가 적어 느리다.", "tf": "활성화 에너지가 높으면 속도는? (느림)"}, "GC-192": {"n": "아레니우스", "c": "gc", "u": "반응속도론-2", "t": "C", "dx": "아레니우스 식에서 온도가 오르면 k가 커지고 활성화 에너지 Eₐ가 클수록 k가 작아진다는 관계를 놓친 경우다. Eₐ가 지수항에 들어간다는 점이 약하다.", "fx": "아레니우스 식을 '온도가 오르면 k가 커지고 활성화 에너지 Eₐ가 클수록 k가 작아짐(Eₐ가 지수항에 들어감)'으로 못 박는다. 두 인자로 k 변화를 따져라.", "f": "A2", "rk": 400, "d": 3, "rh": 1, "pre": ["GC-191", "GC-184"], "tr": "온도가 k를 어떻게 바꾸는지 막막해, 온도 오르면 k 커지고 Eₐ 크면 k 작아진다는 관계가 빠진다.", "an": "온도가 오르면 k 증가, Ea가 크면 k 감소: 고개 높이와 추진력의 관계다.", "rd": "아레니우스 k=Ae^(-Ea/RT)다. 온도가 오르면 k 증가, Ea가 크면 k 감소다.", "tf": "온도를 올리면 k는? (증가)"}, "GC-193": {"n": "빈도 인자", "c": "gc", "u": "반응속도론-2", "t": "C", "dx": "빈도 인자 A가 충돌 빈도와 배향 인자를 담고, 활성화 에너지는 지수항에 따로 들어간다는 점을 놓친 경우다. k가 A에 비례한다는 점이 흔들린다.", "fx": "빈도 인자 A를 '충돌 빈도와 배향 인자를 담고, 활성화 에너지는 지수항에 따로 들어감'으로 못 박는다. k가 A에 비례함을 잡아라.", "f": "B2", "rk": 568, "d": 4, "rh": 0, "pre": ["GC-192"], "tr": "빈도 인자 A가 무엇을 담는지 막연해, 충돌 빈도·배향을 담고 Eₐ는 지수항에 따로라는 게 빠진다.", "an": "A는 충돌 빈도와 방향을 담은 항: Ea는 지수에 따로 들어간다.", "rd": "A는 충돌 빈도와 배향 인자를 담는다. 에너지 장벽은 e^(-Ea/RT)에 따로 들어간다.", "tf": "A는 무엇을 담나? (충돌 빈도·배향)"}, "GC-194": {"n": "온도와 충돌", "c": "gc", "u": "반응속도론-2", "t": "C", "dx": "온도가 오르면 분자 에너지 분포가 이동해 장벽을 넘는 분자 비율이 늘어 속도가 커진다는 점을 놓친 경우다. 활성화 에너지 자체는 변하지 않는다는 점이 약하다.", "fx": "'온도가 오르면 분자 에너지 분포가 이동해 장벽을 넘는 분자 비율이 늘어 속도가 커짐'을 못 박는다. 활성화 에너지 자체는 변하지 않음을 잡아라.", "f": "B3", "rk": 401, "d": 3, "rh": 0, "pre": ["GC-191"], "tr": "온도가 오르면 그냥 빨라질 것 같아, 에너지 분포가 옮겨 장벽 넘는 비율이 는다는 메커니즘이 빠진다.", "an": "온도가 오르면 빠른 분자가 늘어 고개를 넘는 비율이 커진다: 분포가 오른쪽으로 이동한다.", "rd": "온도가 오르면 에너지 분포가 오른쪽으로 옮겨 장벽을 넘는 분자 비율이 커진다.", "tf": "온도가 오르면 장벽 넘는 분자 비율은? (증가)"}, "GC-195": {"n": "메커니즘", "c": "gc", "u": "반응속도론-2", "t": "C", "dx": "전체 반응식의 계수를 바로 차수로 쓰면 틀리고, 소반응(단일 단계)에서만 계수가 곧 차수라는 점을 놓친 경우다. 메커니즘이 여러 단계로 이뤄진다는 점이 약하다.", "fx": "'전체 반응식의 계수를 바로 차수로 쓰면 틀리고, 소반응(단일 단계)에서만 계수가 곧 차수'임을 못 박는다. 메커니즘이 여러 단계로 이뤄짐을 잡아라.", "f": "D1", "rk": 251, "d": 2, "rh": 2, "pre": ["GC-181"], "tr": "전체 반응식 계수를 차수로 쓸 것 같아, 소반응(단일 단계)에서만 계수가 곧 차수라는 게 빠진다.", "an": "단일 단계(소반응)에서만 계수가 곧 차수: 전체 반응식은 그렇지 않다.", "rd": "단일 단계(소반응)는 그 충돌에 참여한 분자 수가 곧 차수다. 전체 반응식은 여러 단계라 다르다.", "tf": "소반응의 차수는 무엇으로? (계수와 같음)"}, "GC-196": {"n": "속도 결정 단계", "c": "gc", "u": "반응속도론-2", "t": "C", "dx": "여러 단계 중 가장 느린 단계가 전체 속도를 제한한다(병목)는 점을 놓친 경우다. 전체 속도가 단계들의 합이 아니라 병목 단계로 정해진다는 점이 흔들린다.", "fx": "'여러 단계 중 가장 느린 단계가 전체 속도를 제한함(병목)'을 못 박는다. 전체 속도가 단계들의 합이 아니라 병목 단계로 정해짐을 잡아라.", "f": "B3", "rk": 402, "d": 3, "rh": 0, "pre": ["GC-195"], "tr": "모든 단계가 속도에 똑같이 기여할 것 같아, 가장 느린 단계가 전체를 제한한다(병목)는 게 빠진다.", "an": "가장 느린 단계가 전체 속도를 정한다: 병목, 고속도로도 톨게이트에서 막힌다.", "rd": "가장 느린 단계가 전체 흐름을 제한한다. 그래서 그 단계가 전체 속도를 정한다.", "tf": "전체 속도를 정하는 단계는? (가장 느린)"}, "GC-197": {"n": "중간체", "c": "gc", "u": "반응속도론-2", "t": "C", "dx": "중간체가 한 단계에서 생겼다가 다음 단계에서 소비되어 전체 반응식에는 나타나지 않는다는 점을 놓친 경우다. 처음부터 있는 반응물과 다르다는 구분이 약하다.", "fx": "중간체를 '한 단계에서 생겼다가 다음 단계에서 소비되어 전체 반응식에는 나타나지 않음'으로 못 박는다. 처음부터 있는 반응물과 갈라라.", "f": "B2", "rk": 403, "d": 3, "rh": 0, "pre": ["GC-195"], "tr": "중간체가 반응식에 나올 것 같아, 생겼다 소비돼 전체식엔 안 나타난다는 게 빠진다.", "an": "중간체는 생겼다 바로 소비돼 전체 반응식엔 안 나온다: 잠깐 거치는 정거장이다.", "rd": "중간체는 한 단계서 생겨 다음 단계서 소비된다. 양변에서 지워져 전체식엔 안 남는다.", "tf": "중간체가 전체 반응식에 나오나? (안 나옴)"}, "GC-198": {"n": "촉매", "c": "gc", "u": "반응속도론-2", "t": "B", "dx": "촉매가 활성화 에너지를 낮춰 속도를 높이되 자신은 소모되지 않고 반응엔탈피 ΔH(평형)는 바꾸지 않는다는 점을 놓친 경우다.", "fx": "촉매를 '활성화 에너지를 낮춰 속도를 높이되 자신은 소모되지 않고 반응엔탈피 ΔH(평형)는 안 바꿈'으로 못 박는다. 속도와 평형을 갈라라.", "f": "B3", "rk": 404, "d": 3, "rh": 2, "pre": ["GC-191"], "tr": "촉매가 반응 자체를 바꿀 것 같아, Eₐ만 낮춰 속도를 올리고 자신은 소모 안 되며 ΔH는 안 바꾼다는 게 흐려진다.", "an": "촉매는 더 낮은 고개(다른 경로)를 열어 빠르게: 자신은 안 닳고 ΔH는 안 바꾼다.", "rd": "촉매는 Ea가 더 낮은 경로를 연다. 빨라지되 자신은 소비 안 되고 시작·끝이 같아 ΔH는 그대로다.", "tf": "촉매가 활성화 에너지를? (낮춤)"}, "GC-043": {"n": "이온 결합", "c": "gc", "u": "분자-1", "t": "A", "dx": "이온 결합(전자 이동, 금속+비금속)과 공유 결합(전자 공유)을 섞은 경우다. 강한 정전 인력으로 녹는점이 높다는 성질 연결도 흐리다.", "fx": "이온 결합을 '전자 이동(금속+비금속)으로 강한 정전 인력, 그래서 녹는점 높음'으로 못 박는다. 공유 결합(전자 공유)과 갈라 성질까지 이어라.", "f": "B2", "rk": 795, "d": 9, "rh": 1, "pre": ["GC-035", "GC-036"], "tr": "결합은 다 전자가 오가는 일 같아, 완전히 넘기는 것(이온)과 나눠 갖는 것(공유)의 경계가 흐려진다.", "an": "이온 결합은 전자를 아예 넘겨준 거래: 빌려 쓰는(공유) 게 아니라 소유권을 넘긴다.", "rd": "전기음성도 차가 크면 전자가 한쪽으로 완전히 넘어가 +와 -이온이 된다. 그 정전기 인력이 이온 결합이다.", "tf": "전기음성도 차가 매우 크면 무슨 결합? (이온)"}, "GC-044": {"n": "공유 결합", "c": "gc", "u": "분자-1", "t": "C", "dx": "공유 결합(전자쌍 공유)과 이온 결합(완전 이동)의 경계를 헷갈린 경우다. 전자쌍을 2·3쌍 공유해 이중·삼중 결합이 된다는 점이 약하다.", "fx": "공유 결합을 '전자쌍 공유, 2·3쌍 공유면 이중·삼중 결합'으로 못 박는다. 이온 결합(완전 이동)과 경계를 갈라 결합 차수를 잡아라.", "f": "B2", "rk": 765, "d": 8, "rh": 44, "pre": ["GC-035"], "tr": "한쪽이 전자를 \"내주는\" 그림이 강해, 완전히 넘기든 나눠 갖든 다 \"주는 것\"으로 보여 이온과 공유가 섞인다.", "an": "공유 결합은 담요 한 장을 나눠 덮기: 한 사람이 가져가 버리면(이온) 공유가 아니다.", "rd": "전기음성도 차가 작으면 전자를 나눠 갖는다. 완전히 넘기지 않고 공유하므로 공유 결합이다.", "tf": "O₂의 두 산소 사이 결합은? (공유: 전기음성도 차 0)"}, "GC-045": {"n": "결합 길이", "c": "gc", "u": "분자-1", "t": "A", "dx": "결합 길이를 결합 차수와 연결하지 못한 경우다. 차수가 클수록(공유 전자쌍 많을수록) 더 짧아진다는 관계가 흔들린다.", "fx": "결합 길이를 '결합 차수가 클수록(공유 전자쌍 많을수록) 짧음'으로 못 박는다. 차수-길이의 반비례로 단일·이중·삼중을 비교하라.", "f": "A3", "rk": 796, "d": 9, "rh": 2, "pre": ["GC-044"], "tr": "결합 길이는 원자 크기로 정해질 것 같아, 같은 두 원자라도 차수가 크면 짧아진다는 연결이 안 떠오른다.", "an": "결합 차수가 클수록 짧다: 손을 한 번보다 두 번·세 번 맞잡으면 더 바싹 당겨진다.", "rd": "차수가 크면 전자쌍이 많아 더 강하게 당겨 짧아진다. 그래서 삼중<이중<단일 순으로 짧다.", "tf": "N₂(삼중)와 N 단일결합 중 짧은 건? (삼중: 차수 큼)"}, "GC-046": {"n": "결합 세기", "c": "gc", "u": "분자-1", "t": "C", "dx": "결합 세기를 결합 차수·길이와 묶지 못한 경우다. 차수가 크고 짧을수록 강하며, 끊는 데 큰 에너지가 든다는 정의가 정리되지 않았다.", "fx": "결합 세기를 '차수가 크고 짧을수록 강하며, 끊는 데 큰 에너지가 듦'으로 못 박는다. 차수·길이·세기를 한 묶음으로 잡아라.", "f": "A3", "rk": 814, "d": 10, "rh": 1, "pre": ["GC-045"], "tr": "세기와 길이는 따로 외울 항목 같아, 차수가 커지면 짧고 강해진다는 한 묶음이 안 보인다.", "an": "차수가 크면 짧고 세다: 많이 맞잡은 손일수록 떼기 어렵다, 길이와 세기가 한 묶음.", "rd": "전자쌍이 많을수록 결합이 강하고 짧다. 차수가 길이와 세기를 함께 정한다.", "tf": "이중결합과 단일결합 중 끊기 어려운 건? (이중: 더 강함)"}, "GC-047": {"n": "루이스 구조", "c": "gc", "u": "분자-1", "t": "C", "dx": "루이스 구조에서 최외각 전자(코어 제외)와 비공유 전자쌍까지 그린다는 규칙을 놓친 경우다. 전자를 점으로 배분하는 절차가 흔들린다.", "fx": "루이스 구조를 '최외각 전자(코어 제외)와 비공유 전자쌍까지 점으로 배분'으로 못 박는다. 전체 원자가 전자를 세고 결합·비공유로 나눠 그려라.", "f": "D3", "rk": 797, "d": 9, "rh": 11, "pre": ["GC-035", "GC-044"], "tr": "루이스 구조는 결합선만 그으면 될 것 같아, 비공유 전자쌍까지 점으로 다 그려야 한다는 게 빠진다.", "an": "루이스 구조는 전자 점까지 다 그린 가족사진: 결합선뿐 아니라 안 쓰인 전자쌍(비공유)도 빠짐없이 찍는다.", "rd": "옥텟을 맞추려면 결합 전자쌍과 남는 비공유 전자쌍을 다 배치해야 한다. 그래서 점까지 다 그린다.", "tf": "H₂O의 산소에 비공유 전자쌍을 안 그려도 되나? (안 됨: 다 그려야)"}, "GC-048": {"n": "옥텟 규칙", "c": "gc", "u": "분자-1", "t": "A", "dx": "옥텟(최외각 8개) 지향과 그 한계를 같이 잡지 못한 경우다. 수소는 2개(He 배치), 붕소·확장 옥텟·홀수 전자 분자 같은 예외가 빠졌다.", "fx": "옥텟 규칙을 '최외각 8개 지향, 단 수소는 2개(He 배치)·붕소·확장 옥텟·홀수 전자 분자는 예외'로 못 박는다. 지향과 한계를 함께 잡아라.", "f": "D1", "rk": 815, "d": 10, "rh": 1, "pre": ["GC-047"], "tr": "옥텟은 \"여덟이면 안정\"이라는 깔끔한 규칙이라 늘 성립할 것 같아, 예외가 있다는 단서가 묻힌다.", "an": "옥텟은 8개 채우면 만족 규칙이지만 예외 있는 교칙: 늘 지켜지진 않는다.", "rd": "비활성 기체의 8전자 배치가 안정하므로 원자들이 그것을 노린다. 단 항상 가능한 건 아니다.", "tf": "모든 분자가 옥텟을 지키나? (아니다: 예외 있음)"}, "GC-049": {"n": "옥텟 예외", "c": "gc", "u": "분자-1", "t": "C", "dx": "옥텟 예외를 인식하지 못한 경우다. 붕소(6개)·확장 옥텟(3주기 이하)·홀수 전자 분자가 안정하게 존재한다는 점이 흔들린다.", "fx": "옥텟 예외를 '붕소(6개)·확장 옥텟(3주기 이하)·홀수 전자 분자가 안정하게 존재'로 못 박는다. 옥텟을 절대 규칙으로 보지 말고 예외를 인식하라.", "f": "D1", "rk": 835, "d": 11, "rh": 0, "pre": ["GC-048"], "tr": "최외각이 8이 아니면 틀린 구조 같아, 확장 옥텟처럼 8을 넘기는 경우가 정상일 수 있다는 게 안 떠오른다.", "an": "확장 옥텟은 8명 정원을 넘겨 태우는 큰 버스(3주기 이하): 8 아닌 게 틀린 게 아니다.", "rd": "3주기 이하 원소는 빈 d 오비탈을 써 8을 넘길 수 있다. 그래서 확장 옥텟이 가능하다.", "tf": "SF₆에서 황 주위 전자가 8개를 넘나? (그렇다: 확장 옥텟)"}, "GC-050": {"n": "형식 전하", "c": "gc", "u": "분자-1", "t": "A", "dx": "형식 전하 계산(원자가 전자 - 비공유 - 결합쌍/2)을 헷갈린 경우다. 전하 분리가 적은 구조가 더 안정하다는 판단으로 이어지지 않는다.", "fx": "형식 전하를 '원자가 전자 − 비공유 − 결합쌍/2'로 못 박는다. 전하 분리가 적은 구조가 더 안정함을 잡아 여러 루이스 구조를 가려라.", "f": "D3", "rk": 816, "d": 10, "rh": 0, "pre": ["GC-047"], "tr": "형식 전하가 복잡한 공식처럼 보여, 원자가에서 비공유와 결합쌍 절반을 빼는 셈에서 항을 흘린다.", "an": "형식 전하는 전자를 공평히 나눴다 치고 계산한 가계부: (원자가 - 비공유 - 결합쌍/2).", "rd": "전자를 공평히 반씩 나눴다 가정하고 (원자가-비공유-결합쌍/2)로 계산한다. 형식 전하가 작은 구조가 안정하다.", "tf": "같은 분자의 두 루이스 구조 중 안정한 건? (형식 전하가 작은 쪽)"}, "GC-051": {"n": "공명", "c": "gc", "u": "분자-1", "t": "C", "dx": "공명을 실제로 구조가 오가는 것으로 오해한 경우다. 원자는 고정이고 전자만 비편재화되어 안정해진다는 핵심이 빠졌다.", "fx": "공명을 '구조가 오가는 게 아니라 원자는 고정이고 전자만 비편재화되어 안정해짐'으로 못 박는다. 실제로 오간다는 오해를 버리고 평균 구조로 보라.", "f": "B2", "rk": 817, "d": 10, "rh": 0, "pre": ["GC-047"], "tr": "공명 화살표가 구조가 진짜 왔다 갔다 하는 동영상처럼 읽혀, 실제로는 한 평균 구조라는 정지화면이 안 잡힌다.", "an": "공명은 여러 장 사진을 겹친 평균 한 장: 구조가 실제로 왔다 갔다 하는 동영상이 아니다.", "rd": "여러 타당한 루이스 구조가 있으면 실제는 그 평균이다. 그래서 한 구조가 아니라 섞인 평균 구조다.", "tf": "오존의 두 O-O 결합 길이가 다른가? (같다: 공명 평균)"}, "GC-052": {"n": "결합 극성", "c": "gc", "u": "분자-1", "t": "B", "dx": "결합 극성을 전기음성도 차이로 잡지 못한 경우다. 차이가 클수록 전자쌍이 치우치고, 더 끄는 원자가 부분 음전하를 띤다는 그림이 흐리다.", "fx": "결합 극성을 '전기음성도 차이가 클수록 전자쌍이 치우치고, 더 끄는 원자가 부분 음전하'로 못 박는다. 전기음성도 차로 극성 방향을 잡아라.", "f": "A3", "rk": 836, "d": 11, "rh": 2, "pre": ["GC-041", "GC-044"], "tr": "극성은 분자를 보면 느낌으로 알 것 같아, 전기음성도 차이라는 잴 수 있는 기준이 뒤로 밀린다.", "an": "결합 극성은 두 사람 키 차이: 전기음성도 차이가 있으면 전자쌍이 한쪽으로 쏠린다.", "rd": "전기음성도 차가 있으면 전자쌍이 한쪽으로 치우쳐 부분 전하가 생긴다. 그것이 결합 극성이다.", "tf": "H-Cl 결합은 극성인가? (그렇다: 전기음성도 차)"}, "GC-053": {"n": "분자 극성", "c": "gc", "u": "분자-2", "t": "C", "dx": "결합이 극성이어도 분자가 무극성일 수 있다는 점(CO₂처럼 쌍극자 상쇄)을 놓친 경우다. 결합 극성과 분자 극성은 모양이 매개한다는 연결이 약하다.", "fx": "'결합이 극성이어도 분자가 무극성일 수 있음(CO₂처럼 쌍극자 상쇄)'을 못 박는다. 결합 극성과 분자 극성을 모양이 매개함을 잡아 대칭을 따져라.", "f": "A4", "rk": 875, "d": 13, "rh": 0, "pre": ["GC-052", "GC-057"], "tr": "결합이 극성이면 그 극성이 분자 전체로 그대로 합쳐질 것 같아, 방향이 반대인 쌍극자가 서로 지운다는 가능성이 안 떠오른다.", "an": "CO₂는 양쪽에서 똑같이 당기는 줄다리기: 결합은 극성이라도 방향이 반대라 상쇄돼 무극성이다.", "rd": "결합 쌍극자를 벡터로 더한다. 대칭이면 상쇄돼 무극성(CO₂), 비대칭이면 남아 극성이다.", "tf": "CO₂는 극성인가? (무극성: 대칭이라 상쇄)"}, "GC-054": {"n": "VSEPR", "c": "gc", "u": "분자-2", "t": "C", "dx": "VSEPR의 핵심(전자쌍 반발 최소화)을 놓친 경우다. 비공유 전자쌍도 반발하고 다중 결합은 한 영역으로 센다는 규칙이 흔들린다.", "fx": "VSEPR를 '전자쌍 반발을 최소화하는 배치, 비공유 전자쌍도 반발하고 다중 결합은 한 영역으로 셈'으로 못 박는다. 전자 영역 수를 세어 골격을 잡아라.", "f": "B2", "rk": 818, "d": 10, "rh": 6, "pre": ["GC-047"], "tr": "VSEPR 모양을 결과만 외우면 될 것 같아, 전자쌍이 최대한 멀어지려 한다는 동기가 묻힌다.", "an": "전자쌍은 서로 밀어내는 풍선 묶음: 최대한 멀어지려는 배치가 모양을 정한다.", "rd": "전자쌍은 같은 (-)라 서로 민다. 반발이 최소가 되게 최대한 벌어진 배치가 실제 모양이다.", "tf": "전자쌍이 분자 모양을 정하는 원리는? (반발 최소로 멀어짐)"}, "GC-055": {"n": "VSEPR 구조", "c": "gc", "u": "분자-2", "t": "C", "dx": "전자 영역 수와 기본 골격의 대응을 헷갈린 경우다. 2영역 직선(180°)·3영역 평면삼각형·4영역 정사면체라는 짝이 안 잡혔다.", "fx": "전자 영역과 골격을 '2영역 직선(180°)·3영역 평면삼각형·4영역 정사면체'로 짝지어 못 박는다. 영역 수에서 기본 골격을 바로 옮겨라.", "f": "B2", "rk": 837, "d": 11, "rh": 4, "pre": ["GC-054"], "tr": "전자 영역 수와 모양 이름이 따로 외울 짝 같아, 둘이 한 규칙으로 이어진다는 게 안 잡힌다.", "an": "영역 2개는 일자, 3개는 Y자, 4개는 삼발이: 풍선 개수가 펼친 모양을 정한다.", "rd": "전자 영역 수를 세면 기본 골격이 나온다. 2개 직선·3개 평면삼각·4개 사면체다.", "tf": "전자 영역 3개인 분자의 골격은? (평면 삼각형)"}, "GC-056": {"n": "비공유 전자쌍", "c": "gc", "u": "분자-2", "t": "C", "dx": "비공유 전자쌍이 결합쌍보다 반발이 커서 결합각을 좁힌다는 점을 놓친 경우다. 한 원자에만 묶여 더 퍼진다는 이유가 빠졌다.", "fx": "'비공유 전자쌍은 결합쌍보다 반발이 커서 결합각을 좁힘(한 원자에만 묶여 더 퍼짐)'을 못 박는다. 비공유쌍 수만큼 결합각이 줄어듦을 잡아라.", "f": "B3", "rk": 838, "d": 11, "rh": 2, "pre": ["GC-054"], "tr": "전자쌍이면 다 똑같이 밀 것 같아, 비공유쌍이 한 원자에만 매여 더 퍼져 세게 민다는 차이가 안 보인다.", "an": "비공유쌍은 핵 하나에만 묶여 더 부푼 풍선: 옆 결합을 더 세게 밀어 각을 좁힌다.", "rd": "비공유쌍은 한 원자에만 묶여 더 퍼진다. 그래서 결합쌍을 더 세게 밀어 각을 좁힌다.", "tf": "비공유쌍이 결합각을 넓히나 좁히나? (좁힘)"}, "GC-057": {"n": "분자 구조", "c": "gc", "u": "분자-2", "t": "A", "dx": "전자쌍 배치(정사면체)와 실제 분자 모양(비공유쌍 때문에 굽음)을 구분하지 못한 경우다. 물·암모니아가 사면체 골격에서 굽은형·피라미드형이 되는 흐름이 흔들린다.", "fx": "'전자쌍 배치(정사면체)와 실제 분자 모양(비공유쌍 때문에 굽음)을 구분'함을 못 박는다. 물·암모니아가 사면체 골격에서 굽은형·피라미드형이 되는 흐름을 그려라.", "f": "B2", "rk": 858, "d": 12, "rh": 1, "pre": ["GC-055", "GC-056"], "tr": "전자쌍이 사면체로 놓이면 분자도 사면체일 것 같아, 비공유쌍 자리가 비어 모양이 굽는다는 그림이 안 떠오른다.", "an": "비공유쌍 자리는 보이지 않는 빈 의자: 그 자리 때문에 분자 모양이 굽는다(물의 V자).", "rd": "비공유쌍 자리는 비어 보인다. 그래서 전자쌍 배치가 사면체여도 분자 모양은 굽는다(물).", "tf": "물이 직선이 아닌 이유는? (비공유쌍 2개가 굽힘)"}, "GC-058": {"n": "혼성 오비탈", "c": "gc", "u": "분자-2", "t": "C", "dx": "혼성을 전자 영역 수와 연결하지 못한 경우다. 정사면체 sp³·평면삼각형 sp²·직선 sp, 그리고 남는 p 오비탈이 파이 결합을 만든다는 대응이 약하다.", "fx": "혼성을 '전자 영역 수와 짝: 정사면체 sp³·평면삼각형 sp²·직선 sp, 남는 p 오비탈이 파이 결합'으로 못 박는다. 영역 수에서 혼성을 바로 정하라.", "f": "B2", "rk": 859, "d": 12, "rh": 1, "pre": ["GC-055"], "tr": "혼성은 별도의 암기 거리 같아, 중심 원자의 전자 영역 수만 세면 정해진다는 연결이 안 보인다.", "an": "혼성은 여러 카드를 섞어 똑같은 새 카드로 만들기: 전자 영역 수만큼 sp·sp²·sp³가 된다.", "rd": "결합에 맞게 오비탈을 섞는다. 전자 영역 2·3·4개면 sp·sp²·sp³로 혼성한다.", "tf": "전자 영역 4개면 혼성은? (sp³)"}, "GC-059": {"n": "시그마·파이", "c": "gc", "u": "분자-2", "t": "A", "dx": "단일 결합은 시그마, 다중 결합의 첫 결합만 시그마이고 나머지가 파이라는 구분을 놓친 경우다. 결합 차수와 시그마·파이 개수의 관계가 흔들린다.", "fx": "'단일 결합은 시그마, 다중 결합은 첫 결합만 시그마이고 나머지가 파이'를 못 박는다. 결합 차수에서 시그마·파이 개수를 셈하라.", "f": "B2", "rk": 876, "d": 13, "rh": 0, "pre": ["GC-044", "GC-058"], "tr": "결합이 둘이든 셋이든 다 같은 결합이 겹친 것 같아, 첫 줄만 시그마이고 나머지는 파이라는 구분이 안 잡힌다.", "an": "첫 결합은 정면으로 맞댄 손(시그마), 추가 결합은 옆구리로 붙은 손(파이): 이중은 시그마1+파이1.", "rd": "정면 겹침이 시그마, 측면 겹침이 파이다. 첫 결합은 시그마, 추가 결합은 파이라 이중=시그마+파이다.", "tf": "이중결합은 시그마와 파이 몇 개씩? (시그마 1, 파이 1)"}, "GC-060": {"n": "분자 오비탈", "c": "gc", "u": "분자-2", "t": "C", "dx": "분자 오비탈에서 보강 겹침(결합성)과 상쇄 겹침(반결합성)이 함께 생긴다는 점을 놓친 경우다. 원자 오비탈 수만큼 분자 오비탈이 나온다는 보존이 빠졌다.", "fx": "분자 오비탈을 '보강 겹침(결합성)과 상쇄 겹침(반결합성)이 함께 생기고, 원자 오비탈 수만큼 분자 오비탈이 나옴'으로 못 박는다. 둘을 짝으로 그려라.", "f": "B2", "rk": 798, "d": 9, "rh": 2, "pre": ["GC-044"], "tr": "결합하면 좋은 겹침(결합성)만 생길 것 같아, 동시에 나쁜 겹침(반결합성)도 만들어진다는 게 의외로 다가온다.", "an": "두 파동이 만나면 보강(결합성)과 상쇄(반결합성)가 함께 생긴다: 좋은 겹침만 생기지 않는다.", "rd": "두 원자 오비탈이 겹치면 보강(결합성)과 상쇄(반결합성) 둘 다 만들어진다.", "tf": "오비탈이 겹치면 결합성만 생기나? (아니다: 반결합성도)"}, "GC-061": {"n": "결합 차수", "c": "gc", "u": "분자-2", "t": "A", "dx": "결합 차수=(결합성-반결합성)/2에서 반결합성 전자를 빼야 한다는 점을 놓친 경우다. 차수가 0이면 결합이 없다는 판단으로 이어지지 않는다.", "fx": "결합 차수를 '(결합성 − 반결합성)/2'로 못 박는다. 반결합성 전자를 빼야 함을 잡고, 차수가 0이면 결합이 없다고 판단하라.", "f": "D3", "rk": 819, "d": 10, "rh": 0, "pre": ["GC-060"], "tr": "전자를 다 합치면 결합 차수일 것 같아, 반결합성 전자는 오히려 빼야 한다는 부호가 어긋나 보인다.", "an": "결합 차수는 찬성표 빼기 반대표를 2로 나눈 것: 반결합성 전자는 빼야 한다.", "rd": "결합 차수=(결합성-반결합성 전자)/2다. 반결합성 전자는 결합을 약화하므로 뺀다.", "tf": "결합성 8 반결합성 4면 결합 차수는? (2)"}, "GC-062": {"n": "자기성", "c": "gc", "u": "분자-2", "t": "C", "dx": "홀전자 유무로 자기성을 판단하는 연결을 놓친 경우다. 홀전자가 있으면 상자기성, 모두 짝지으면 반자기성이라는 대응이 흔들린다(MO로 O₂ 상자기성 설명).", "fx": "자기성을 '홀전자가 있으면 상자기성, 모두 짝지으면 반자기성'으로 못 박는다. MO로 O₂에 홀전자가 있어 상자기성임을 설명하라.", "f": "B3", "rk": 820, "d": 10, "rh": 0, "pre": ["GC-030", "GC-060"], "tr": "자기성이 화학과 동떨어진 물리 현상 같아, 홀전자 하나로 갈린다는 단순한 연결이 안 떠오른다.", "an": "자기성은 짝 없는 전자가 있나: 홀전자가 있으면 자석에 끌리고(상자기), 다 짝지으면 안 끌린다.", "rd": "홀전자는 자기 모멘트를 낳는다. 홀전자가 있으면 상자기, 다 짝지으면 반자기다.", "tf": "홀전자가 있는 분자는 자석에 끌리나? (그렇다: 상자기)"}, "GC-224": {"n": "방사성 붕괴", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "방사성 붕괴가 전자만 관여하는 화학 반응이 아니라 핵 자체가 변하는 변화라는 점을 놓친 경우다. 양성자 수가 바뀌어 다른 원소가 될 수 있다는 점이 약하다.", "fx": "방사성 붕괴를 '전자만 관여하는 화학 반응이 아니라 핵 자체가 변하는 변화'로 못 박는다. 양성자 수가 바뀌어 다른 원소가 될 수 있음을 잡아라.", "f": "B2", "rk": 406, "d": 3, "rh": 18, "pre": ["GC-013"], "tr": "방사성 붕괴가 전자 화학 반응 같아, 핵 자체가 변하는 변화라는 게 안 잡힌다.", "an": "방사성 붕괴는 핵 자체가 바뀌는 변화: 전자만 오가는 화학반응과 차원이 다르다.", "rd": "핵 자체가 더 안정한 핵으로 바뀌며 입자·에너지를 낸다. 전자만 오가는 화학반응과 다르다.", "tf": "방사성 붕괴는 핵이 바뀌나 전자만 바뀌나? (핵)"}, "GC-225": {"n": "알파 붕괴", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "알파 붕괴가 헬륨 핵(⁴He, 양성자 2·중성자 2)을 방출해 질량수 4·원자번호 2가 줄어든다는 점을 놓친 경우다.", "fx": "알파 붕괴를 '헬륨 핵(⁴He, 양성자 2·중성자 2)을 방출해 질량수 4·원자번호 2가 줄어듦'으로 못 박는다. 방출 입자로 질량수·원자번호 변화를 셈하라.", "f": "D3", "rk": 569, "d": 4, "rh": 0, "pre": ["GC-224"], "tr": "알파 입자가 막연한 방사선 같아, 헬륨 핵이라 질량수 4·원자번호 2가 준다는 게 안 잡힌다.", "an": "알파 입자는 헬륨 핵: 떨어져 나가면 질량수 4·원자번호 2가 준다.", "rd": "알파 입자는 양성자 2·중성자 2의 헬륨 핵이다. 방출되면 질량수 4·원자번호 2가 준다.", "tf": "알파 붕괴로 원자번호는? (2 감소)"}, "GC-226": {"n": "베타 붕괴", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "베타(β⁻) 붕괴가 중성자 하나가 양성자로 바뀌며 전자를 방출해, 질량수는 그대로이고 원자번호가 1 늘어난다는 점을 놓친 경우다.", "fx": "베타(β⁻) 붕괴를 '중성자 하나가 양성자로 바뀌며 전자를 방출, 질량수는 그대로이고 원자번호가 1 늚'으로 못 박는다. 이 변화를 핵반응식에 반영하라.", "f": "D3", "rk": 570, "d": 4, "rh": 1, "pre": ["GC-224"], "tr": "베타에서 질량수가 변할 것 같아, 중성자가 양성자로 바뀌어 질량수는 그대로·원자번호만 1 는다는 게 빠진다.", "an": "중성자가 양성자로 바뀜: 질량수는 그대로, 원자번호만 1 는다(베타).", "rd": "중성자 하나가 양성자+전자(베타)로 바뀐다. 질량수는 그대로, 원자번호만 1 는다.", "tf": "베타 붕괴로 원자번호는? (1 증가)"}, "GC-227": {"n": "감마 붕괴", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "감마 붕괴가 입자가 아니라 에너지(전자기파)만 방출해 질량수·원자번호가 변하지 않는다는 점을 놓친 경우다. 들뜬 핵이 에너지를 내려놓는 과정이라는 점이 약하다.", "fx": "감마 붕괴를 '입자가 아니라 에너지(전자기파)만 방출해 질량수·원자번호가 변하지 않음'으로 못 박는다. 들뜬 핵이 에너지를 내려놓는 과정임을 잡아라.", "f": "D3", "rk": 571, "d": 4, "rh": 0, "pre": ["GC-224"], "tr": "감마도 입자가 나갈 것 같아, 에너지만 방출해 질량수·원자번호가 안 변한다는 게 빠진다.", "an": "감마는 입자 없이 에너지만 방출: 질량수·원자번호가 안 변한다.", "rd": "들뜬 핵이 에너지만 광자로 내놓는다. 입자가 안 나가 질량수·원자번호가 그대로다.", "tf": "감마 붕괴로 원자번호는? (불변)"}, "GC-228": {"n": "양전자 방출", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "양전자(β⁺) 방출이 양성자 하나가 중성자로 바뀌며 양전자를 내보내, 질량수는 그대로이고 원자번호가 1 줄어든다는 점(β⁻와 반대)을 놓친 경우다.", "fx": "양전자(β⁺) 방출을 '양성자 하나가 중성자로 바뀌며 양전자를 내보내, 질량수는 그대로이고 원자번호가 1 줆(β⁻와 반대)'으로 못 박는다. 두 베타의 반대 방향을 잡아라.", "f": "D3", "rk": 665, "d": 5, "rh": 0, "pre": ["GC-226"], "tr": "양전자 방출이 베타와 같을 것 같아, 양성자가 중성자로 바뀌어 원자번호가 1 준다(β⁻와 반대)는 게 빠진다.", "an": "양성자가 중성자로 바뀜: 원자번호가 1 줄어 베타와 반대다.", "rd": "양성자가 중성자+양전자로 바뀐다. 원자번호가 1 줄어 베타와 반대다.", "tf": "양전자 방출로 원자번호는? (1 감소)"}, "GC-229": {"n": "Z-N 그래프", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "안정성 그래프의 축이 양성자 수(Z)와 중성자 수(N)이고, 안정한 핵이 띠(안정대) 형태로 분포한다는 점을 놓친 경우다. 전자 분포가 아니라는 점이 흔들린다.", "fx": "안정성 그래프를 '축이 양성자 수(Z)와 중성자 수(N), 안정한 핵이 띠(안정대) 형태로 분포'로 못 박는다. 전자 분포가 아님을 잡아라.", "f": "B2", "rk": 572, "d": 4, "rh": 1, "pre": ["GC-224"], "tr": "안정성 그래프 축이 막연해, 양성자 수와 중성자 수이고 안정 핵이 띠를 이룬다는 게 빠진다.", "an": "가로 양성자 수·세로 중성자 수, 안정 핵이 안정 띠를 이룬다.", "rd": "양성자 수와 중성자 수를 축으로 안정 핵을 찍으면 띠를 이룬다.", "tf": "안정 핵은 그래프에서 무엇을 이루나? (안정 띠)"}, "GC-230": {"n": "안정성 비", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "가벼운 핵은 중성자:양성자 비가 약 1:1에서 안정하고, 무거워질수록 중성자가 더 많아야 안정하다는 점을 놓친 경우다.", "fx": "'가벼운 핵은 중성자:양성자 비가 약 1:1에서 안정하고, 무거워질수록 중성자가 더 많아야 안정'함을 못 박는다. 이 비로 안정대의 휘어짐을 잡아라.", "f": "C1", "rk": 666, "d": 5, "rh": 0, "pre": ["GC-229"], "tr": "안정한 핵은 양성자=중성자일 것 같아, 무거워질수록 중성자가 더 많아야 한다는 게 빠진다.", "an": "무거운 핵일수록 양성자보다 중성자가 더 많아야 안정: 1:1이 아니다.", "rd": "양성자가 많으면 정전기 반발이 커진다. 그래서 무거운 핵은 중성자를 더 둬 반발을 완충한다.", "tf": "무거운 핵일수록 중성자는 양성자보다? (많음)"}, "GC-231": {"n": "붕괴 속도", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "방사성 붕괴가 1차 반응이라 붕괴 속도가 남은 핵 수에 비례한다는 점을 놓친 경우다. 그래서 반감기가 일정하다는 점이 흔들린다.", "fx": "방사성 붕괴를 '1차 반응이라 붕괴 속도가 남은 핵 수에 비례'로 못 박는다. 그래서 반감기가 일정함을 잡아라.", "f": "A2", "rk": 573, "d": 4, "rh": 3, "pre": ["GC-224", "GC-186"], "tr": "붕괴 속도가 일정할 것 같아, 1차 반응이라 남은 핵 수에 비례한다는 게 빠진다.", "an": "붕괴는 1차 반응: 남은 핵 수에 비례해 일정 비율로 준다.", "rd": "각 핵이 독립적으로 일정 확률로 붕괴한다. 그래서 붕괴 수가 남은 핵 수에 비례하는 1차 반응이다.", "tf": "방사성 붕괴는 몇 차 반응? (1차)"}, "GC-232": {"n": "방사성 반감기", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "반감기가 핵 수가 절반으로 줄어드는 데 걸리는 시간이고, 1차 반응이라 처음 양과 무관하게 핵 고유값이라는 점을 놓친 경우다. '완전히 사라짐'이 아니라 '절반'이라는 점이 흔들린다.", "fx": "반감기를 '핵 수가 절반으로 줄어드는 데 걸리는 시간, 1차 반응이라 처음 양과 무관한 핵 고유값'으로 못 박는다. '완전히 사라짐'이 아니라 '절반'임을 잡아라.", "f": "A3", "rk": 667, "d": 5, "rh": 2, "pre": ["GC-231", "GC-189"], "tr": "반감기가 처음 양에 따라 달라질 것 같아, 1차라 처음 양과 무관한 핵 고유값이라는 게 의외다.", "an": "반감기는 처음 양과 무관한 핵의 고유 시계: 양이 많든 적든 같다.", "rd": "1차라 반감기 t½=ln2/k다. 처음 양이 안 들어가 핵 고유값이다.", "tf": "반감기는 처음 양에 의존하나? (안 함)"}, "GC-233": {"n": "반감기 계산", "c": "gc", "u": "핵화학-1", "t": "C", "dx": "반감기가 지날 때마다 양이 절반씩 거듭 줄어(절반의 절반…) 거듭제곱으로 감소한다는 점을 놓친 경우다. 곱이 아니라 거듭제곱이고 여전히 일부가 남는다는 점이 약하다.", "fx": "반감기 계산을 '반감기가 지날 때마다 절반씩 거듭 줄어 거듭제곱으로 감소'로 못 박는다. 곱이 아니라 거듭제곱이고 여전히 일부가 남음을 잡아라.", "f": "A2", "rk": 710, "d": 6, "rh": 1, "pre": ["GC-232"], "tr": "반감기마다 같은 양이 줄 것 같아, 절반씩 거듭 줄어 거듭제곱으로 감소한다는 게 빠진다.", "an": "반감기마다 절반씩 거듭 줄어든다: 같은 양이 아니라 같은 비율로.", "rd": "반감기마다 절반이 되니 n번 지나면 (1/2)ⁿ이다. 같은 양이 아니라 같은 비율로 준다.", "tf": "반감기 3번이면 처음의 얼마? (1/8)"}, "GC-234": {"n": "연대 측정", "c": "gc", "u": "핵화학-2", "t": "C", "dx": "연대 측정이 일정한 반감기를 시간 척도로 삼아, 남은 방사성 동위원소 양으로 시간을 잰다는 원리를 놓친 경우다.", "fx": "연대 측정을 '일정한 반감기를 시간 척도로 삼아, 남은 방사성 동위원소 양으로 시간을 잼'으로 못 박는다. 반감기의 일정함이 시계가 됨을 잡아라.", "f": "B2", "rk": 740, "d": 7, "rh": 0, "pre": ["GC-233"], "tr": "연대 측정이 마법 같아, 일정한 반감기를 시계 삼아 남은 양으로 시간을 잰다는 원리가 빠진다.", "an": "일정한 반감기를 시계 삼아 남은 양으로 나이를 잰다: 탄소-14 연대법이다.", "rd": "반감기가 일정하니 남은 양으로 지난 반감기 수를 역산한다. 그래서 나이를 잰다.", "tf": "탄소-14로 무엇을 재나? (나이)"}, "GC-235": {"n": "질량 결손", "c": "gc", "u": "핵화학-2", "t": "C", "dx": "핵이 핵자들의 질량 합보다 가볍고(질량 결손), 그 줄어든 질량이 핵을 묶는 에너지로 바뀌었다는 점을 놓친 경우다. 질량이 생기는 게 아니라 줄어든다는 방향이 흔들린다.", "fx": "질량 결손을 '핵이 핵자들의 질량 합보다 가볍고, 그 줄어든 질량이 핵을 묶는 에너지로 바뀜'으로 못 박는다. 질량이 생기는 게 아니라 줆을 잡아라.", "f": "B3", "rk": 574, "d": 4, "rh": 7, "pre": ["GC-224"], "tr": "핵 질량이 핵자 합과 같을 것 같아, 더 가볍고(질량 결손) 그 차이가 결합 에너지로 갔다는 게 의외다.", "an": "핵은 부품 합보다 가볍다: 사라진 질량이 결합에너지로 바뀌었다(E=mc²).", "rd": "핵자가 뭉치며 결합에너지만큼 안정해진다. E=mc²로 그만큼 질량이 줄어 핵이 부품 합보다 가볍다.", "tf": "핵이 부품 합보다 가벼운 이유는? (결합에너지로 질량 전환)"}, "GC-236": {"n": "질량-에너지", "c": "gc", "u": "핵화학-2", "t": "C", "dx": "질량과 에너지가 E=mc²로 등가이고 c(빛의 속도)의 제곱이 곱해져 작은 질량 변화도 큰 에너지가 된다는 점을 놓친 경우다.", "fx": "질량-에너지를 'E=mc²로 등가, c(빛의 속도)의 제곱이 곱해져 작은 질량 변화도 큰 에너지'로 못 박는다. c²의 크기로 핵에너지의 규모를 잡아라.", "f": "A2", "rk": 668, "d": 5, "rh": 6, "pre": ["GC-235"], "tr": "작은 질량 변화는 작은 에너지일 것 같아, E=mc²의 c²가 곱해져 큰 에너지가 된다는 게 빠진다.", "an": "작은 질량도 c²를 곱하면 거대한 에너지: E=mc²의 위력이다.", "rd": "E=mc²다. c²가 매우 커 작은 질량 변화도 거대한 에너지가 된다.", "tf": "질량과 에너지의 관계식은? (E=mc²)"}, "GC-237": {"n": "핵 결합 에너지", "c": "gc", "u": "핵화학-2", "t": "C", "dx": "핵 결합 에너지가 핵을 핵자로 분리하는 데 필요한(형성 시 방출되는) 에너지이고, 질량 결손이 그 에너지원이라는 점을 놓친 경우다. 클수록 안정하다는 방향이 약하다.", "fx": "핵 결합 에너지를 '핵을 핵자로 분리하는 데 필요한(형성 시 방출되는) 에너지, 질량 결손이 그 에너지원'으로 못 박는다. 클수록 안정함을 잡아라.", "f": "B2", "rk": 711, "d": 6, "rh": 5, "pre": ["GC-235", "GC-236"], "tr": "핵 결합 에너지가 막연해, 핵을 핵자로 쪼개는 데 드는(형성 시 방출되는) 에너지이고 질량 결손이 원천이라는 게 빠진다.", "an": "핵을 부품으로 쪼개는 데 드는 에너지: 질량 결손이 그 원천이다.", "rd": "핵을 자유 핵자로 쪼개는 데 드는 에너지다. 질량 결손에 c²를 곱한 값이다.", "tf": "핵을 쪼개는 에너지의 원천은? (질량 결손)"}, "GC-238": {"n": "핵자당 결합 에너지", "c": "gc", "u": "핵화학-2", "t": "C", "dx": "핵자당 결합 에너지가 클수록 안정하고 철(Fe) 부근에서 최대라는 점을 놓친 경우다. 질량수에 따라 단조 증가가 아니라 봉우리 형태라는 점이 흔들린다.", "fx": "핵자당 결합 에너지를 '클수록 안정하고 철(Fe) 부근에서 최대'로 못 박는다. 질량수에 따라 단조 증가가 아니라 봉우리 형태임을 잡아라.", "f": "C1", "rk": 741, "d": 7, "rh": 4, "pre": ["GC-237"], "tr": "결합 에너지는 클수록 그냥 좋을 것 같아, 핵자당으로 따져 철 부근에서 최대로 안정하다는 게 빠진다.", "an": "핵자당으로 따지면 철 부근이 가장 안정: 산봉우리의 정상이다.", "rd": "총 결합에너지를 핵자 수로 나눈 값이다. 철 부근에서 최대라 가장 안정하다.", "tf": "가장 안정한 핵은 어느 부근? (철)"}, "GC-239": {"n": "핵분열", "c": "gc", "u": "핵화학-2", "t": "C", "dx": "핵분열이 무거운 핵이 더 안정한(핵자당 결합 에너지가 큰) 핵들로 쪼개지며 질량 결손만큼 에너지를 낸다는 점을 놓친 경우다. 합쳐지는 핵융합과 방향이 반대다.", "fx": "핵분열을 '무거운 핵이 더 안정한(핵자당 결합 에너지가 큰) 핵들로 쪼개지며 질량 결손만큼 에너지를 냄'으로 못 박는다. 합쳐지는 핵융합과 방향이 반대임을 잡아라.", "f": "B2", "rk": 766, "d": 8, "rh": 0, "pre": ["GC-238"], "tr": "핵분열이 그냥 쪼개짐 같아, 더 안정한(핵자당 결합 큰) 핵으로 가며 질량 결손만큼 에너지를 낸다는 게 빠진다.", "an": "무거운 핵이 더 안정한(핵자당 결합 큰) 조각으로 쪼개지며 에너지 방출한다.", "rd": "무거운 핵이 핵자당 결합에너지가 더 큰 조각으로 쪼개진다. 그 차이만큼 에너지가 나온다.", "tf": "무거운 핵이 쪼개지며 에너지가 나오는 건? (핵분열)"}, "GC-240": {"n": "핵융합", "c": "gc", "u": "핵화학-2", "t": "C", "dx": "핵융합이 가벼운 핵들이 더 안정한 핵으로 합쳐지며 에너지를 낸다는 점을 놓친 경우다. 쪼개지는 핵분열과 방향이 반대라는 구분이 흔들린다.", "fx": "핵융합을 '가벼운 핵들이 더 안정한 핵으로 합쳐지며 에너지를 냄'으로 못 박는다. 쪼개지는 핵분열과 방향이 반대임을 잡아라.", "f": "B2", "rk": 767, "d": 8, "rh": 0, "pre": ["GC-238"], "tr": "핵융합도 쪼개짐과 비슷할 것 같아, 가벼운 핵이 더 안정한 핵으로 합쳐지며 에너지를 낸다는 게 빠진다.", "an": "가벼운 핵이 더 안정한 핵으로 합쳐지며 에너지 방출: 태양의 동력이다.", "rd": "가벼운 핵이 핵자당 결합에너지가 더 큰 핵으로 합쳐진다. 그 차이만큼 에너지가 나온다.", "tf": "태양의 에너지원은? (핵융합)"}, "GC-241": {"n": "핵에너지", "c": "gc", "u": "핵화학-2", "t": "C", "dx": "핵에너지가 화학 결합이 아니라 핵 변화의 질량-에너지 전환에서 나오고, 질량 변화가 화학 반응보다 훨씬 커 에너지도 훨씬 크다는 점을 놓친 경우다.", "fx": "핵에너지를 '화학 결합이 아니라 핵 변화의 질량-에너지 전환에서 나옴'으로 못 박는다. 질량 변화가 화학 반응보다 훨씬 커 에너지도 훨씬 큼을 잡아라.", "f": "C1", "rk": 768, "d": 8, "rh": 0, "pre": ["GC-236", "GC-238"], "tr": "핵에너지가 큰 화학 에너지 같아, 핵 변화의 질량-에너지 전환이라 화학보다 훨씬 크다는 게 빠진다.", "an": "핵에너지는 질량-에너지 전환이라 화학에너지보다 압도적으로 크다.", "rd": "핵 변화는 질량 결손 곱하기 c²라 결합 차이가 크다. 그래서 화학에너지보다 압도적으로 크다.", "tf": "핵에너지가 화학에너지보다? (압도적으로 큼)"}, "GC-242": {"n": "안정화 경향", "c": "gc", "u": "핵화학-2", "t": "C", "dx": "핵 반응이 핵자당 결합 에너지가 큰(더 안정한) 쪽으로 진행한다는 방향을 놓친 경우다. 가벼운 핵은 융합으로, 무거운 핵은 분열로 철 부근의 안정점에 가까워진다는 점이 흔들린다.", "fx": "핵 반응을 '핵자당 결합 에너지가 큰(더 안정한) 쪽으로 진행'으로 못 박는다. 가벼운 핵은 융합으로, 무거운 핵은 분열로 철 부근의 안정점에 가까워짐을 잡아라.", "f": "A1", "rk": 769, "d": 8, "rh": 0, "pre": ["GC-238"], "tr": "핵 반응 방향이 임의 같아, 핵자당 결합 에너지가 큰(더 안정한) 쪽으로 간다는 게 빠진다.", "an": "반응은 핵자당 결합에너지가 큰(더 안정한) 쪽으로: 정상을 향해 올라간다.", "rd": "반응은 핵자당 결합에너지가 더 큰(더 안정한) 쪽으로 간다. 그 차이가 방출 에너지다.", "tf": "반응은 핵자당 결합에너지 어느 쪽으로? (큰 쪽: 더 안정)"}, "GC-036": {"n": "족과 원자가 전자", "c": "gc", "u": "주기성", "t": "C", "dx": "같은 족=원자가 전자 수가 같아 성질이 비슷하다는 연결과, 주기는 껍질 수·족은 원자가 전자 수라는 대응이 흔들린 경우다. 주기율표 위치와 전자 배치의 다리가 약하다.", "fx": "'같은 족 = 원자가 전자 수가 같아 성질 비슷, 주기는 껍질 수·족은 원자가 전자 수'를 못 박는다. 주기율표 위치와 전자 배치를 이 대응으로 이으라.", "f": "B2", "rk": 763, "d": 8, "rh": 3, "pre": ["GC-035"], "tr": "주기·족이 둘 다 표의 좌표라 비슷해 보여, 어느 쪽이 껍질 수이고 어느 쪽이 원자가 전자 수인지 뒤바뀐다.", "an": "주기율표는 좌석표: 가로줄(주기)=몇 층 껍질, 세로줄(족)=바깥 전자 수.", "rd": "같은 족은 바깥 전자 수가 같아 성질이 닮는다. 주기는 전자가 든 가장 바깥 껍질 번호다.", "tf": "같은 족 원소가 성질이 닮는 이유는? (바깥 전자 수가 같음)"}, "GC-037": {"n": "전자 배치와 위치", "c": "gc", "u": "주기성", "t": "C", "dx": "원자가 전자 배치가 족을, 최외각 껍질 번호가 주기를 정한다는 대응을 놓친 경우다. 전자 배치로 주기율표 위치를 역추적하지 못한다.", "fx": "'원자가 전자 배치가 족을, 최외각 껍질 번호가 주기를 정함'을 못 박는다. 전자 배치로 주기율표 위치를 역추적하라.", "f": "B2", "rk": 792, "d": 9, "rh": 0, "pre": ["GC-035", "GC-036"], "tr": "전자 배치는 원자 안 사정이고 표의 위치는 별개 같아, 배치가 곧 족·주기를 정한다는 다리가 안 놓인다.", "an": "전자 배치를 알면 주소가 나온다: 바깥 전자 수로 족, 가장 바깥 껍질 번호로 주기가 정해진다.", "rd": "바깥 전자 수를 세면 족, 가장 바깥 껍질 번호를 보면 주기다. 배치가 위치를 결정한다.", "tf": "바깥 전자 7개인 원소는 몇 족인가? (17족)"}, "GC-038": {"n": "원자 반지름", "c": "gc", "u": "주기성", "t": "B", "dx": "원자 반지름 경향을 두 인자로 분리하지 못한 경우다. 같은 주기는 유효 핵전하 증가로 감소, 같은 족은 껍질 수 증가로 증가라는 두 축이 섞였다.", "fx": "원자 반지름을 '같은 주기는 유효 핵전하 증가로 감소, 같은 족은 껍질 수 증가로 증가'의 두 축으로 못 박는다. 두 인자를 갈라 위치별 반지름을 잡아라.", "f": "A4", "rk": 764, "d": 8, "rh": 7, "pre": ["GC-030", "GC-035"], "tr": "경향 하나엔 원인 하나가 깔끔해 보여, 반지름을 유효 핵전하 하나로만 설명하고 껍질 수를 빠뜨린다.", "an": "반지름은 두 힘의 줄다리기: 층이 늘면 커지고(껍질), 핵이 더 당기면 작아진다(유효 핵전하), 원인이 둘이다.", "rd": "껍질이 늘면 커지고, 같은 주기서 유효 핵전하가 늘면 당겨져 작아진다. 두 효과의 합이다.", "tf": "같은 주기에서 오른쪽으로 갈수록 반지름은? (작아짐: 유효 핵전하 증가)"}, "GC-039": {"n": "이온화 에너지", "c": "gc", "u": "주기성", "t": "A", "dx": "이온화 에너지 경향에서 유효 핵전하 효과를 놓친 경우다. 오른쪽·위로 갈수록 커지며, Be·N 같은 안정 배치에서의 예외적 꺾임이 빠졌다.", "fx": "이온화 에너지를 '유효 핵전하 때문에 오른쪽·위로 갈수록 커짐, Be·N 같은 안정 배치에서 예외적 꺾임'으로 못 박는다. 유효 핵전하를 축으로 잡고 예외를 따로 새겨라.", "f": "B3", "rk": 793, "d": 9, "rh": 5, "pre": ["GC-038", "GC-035"], "tr": "반지름이 작으면 전자가 가까워 떼기 쉬울 것 같은데, 실제로는 더 세게 붙들려 떼기 어렵다는 게 역설처럼 느껴진다.", "an": "전자를 떼는 건 자석에서 클립 떼기: 작아도 더 세게 붙은 클립이 떼기 어렵듯, 핵이 세게 당기면 떼기 힘들다.", "rd": "핵이 전자를 세게 붙들수록 떼기 어렵다. 유효 핵전하가 큰 오른쪽일수록 이온화 에너지가 크다.", "tf": "Li와 F 중 전자를 떼기 더 어려운 쪽은? (F: 유효 핵전하 큼)"}, "GC-040": {"n": "순차 이온화 에너지", "c": "gc", "u": "주기성", "t": "C", "dx": "순차 이온화에서 전자를 뗄수록 남은 전자 인력이 커져 에너지가 점증하고, 안쪽 껍질로 넘어갈 때 급증한다는 점을 놓친 경우다. 이 급증 위치가 원자가 전자 수를 알려준다.", "fx": "순차 이온화 에너지를 '전자를 뗄수록 점증하고, 안쪽 껍질로 넘어갈 때 급증'으로 못 박는다. 이 급증 위치가 원자가 전자 수를 알려줌을 잡아라.", "f": "C1", "rk": 812, "d": 10, "rh": 0, "pre": ["GC-039"], "tr": "전자를 하나 떼나 둘 떼나 비슷한 힘이 들 것 같아, 뗄수록 급증하고 안쪽 껍질에서 폭증한다는 도약이 안 보인다.", "an": "첫 전자는 헐겁게, 다음은 더 빡빡: 겉옷 벗기는 쉬워도 속옷은 어렵고, 안쪽 껍질에 닿으면 폭증한다.", "rd": "전자를 뗄수록 남은 전자는 더 강하게 당겨져 떼기 어렵다. 안쪽 껍질에 닿으면 급증한다.", "tf": "Na의 둘째 이온화 에너지가 급증하는 이유는? (안쪽 닫힌 껍질을 떼야)"}, "GC-041": {"n": "전기음성도", "c": "gc", "u": "주기성", "t": "A", "dx": "전기음성도를 결합에서 전자를 당기는 힘으로 잡되, 유효 핵전하·반지름과의 관계와 F가 최대라는 점이 흔들린 경우다.", "fx": "전기음성도를 '결합에서 전자를 당기는 힘, 유효 핵전하가 크고 반지름이 작을수록 커짐(F가 최대)'으로 못 박는다. 유효 핵전하·반지름과 묶어 경향을 잡아라.", "f": "C1", "rk": 813, "d": 10, "rh": 3, "pre": ["GC-039"], "tr": "전기음성도가 \"반응을 잘함\" 같은 막연한 활성으로 들려, 결합 속 전자를 당기는 힘이자 F 최대가 흐려진다.", "an": "전기음성도는 줄다리기 힘: 결합한 전자쌍을 자기 쪽으로 당기는 세기이고, F가 챔피언이다.", "rd": "결합한 전자쌍을 자기 쪽으로 당기는 힘이다. 유효 핵전하가 크고 반지름이 작은 F가 최대다.", "tf": "결합에서 전자를 가장 세게 당기는 원소는? (F)"}, "GC-042": {"n": "등전자 이온", "c": "gc", "u": "주기성", "t": "C", "dx": "등전자 이온(전자 수 동일) 비교에서 핵전하가 클수록 더 세게 당겨 반지름이 작아진다는 점을 놓친 경우다. 전자 수가 같아야 등전자 관계라는 전제도 흔들린다.", "fx": "등전자 이온을 '전자 수가 같으면 핵전하가 클수록 더 세게 당겨 반지름이 작아짐'으로 못 박는다. 전자 수가 같아야 등전자 관계임을 전제로 핵전하로 반지름을 비교하라.", "f": "C1", "rk": 794, "d": 9, "rh": 0, "pre": ["GC-038"], "tr": "전자 수가 같으면 크기도 엇비슷할 것 같아, 핵전하가 클수록 더 조여 작아진다는 차이가 떠오르지 않는다.", "an": "전자 수가 같아도 핵 인구가 많으면 더 조인다: 양성자가 많을수록 전자 구름을 당겨 작아진다.", "rd": "전자 수가 같으면 핵전하가 셀수록 더 당겨 작아진다. 그래서 양성자 많은 쪽이 더 작다.", "tf": "Na⁺와 F⁻ 중 더 작은 건? (Na⁺: 양성자 많아 더 당김)"}, "GC-019": {"n": "주양자수", "c": "gc", "u": "양자수", "t": "C", "dx": "주양자수 n의 의미(껍질·에너지 크기)와 범위(최솟값 1)를 놓친 경우다. n이 클수록 에너지가 높고 핵에서 멀다는 연결이 약하다.", "fx": "주양자수 n을 '껍질·에너지 크기를 정함, 최솟값 1, n이 클수록 에너지 높고 핵에서 멂'으로 못 박는다. n으로 껍질과 에너지 규모를 잡아라.", "f": "B2", "rk": 111, "d": 1, "rh": 70, "pre": ["GC-011"], "tr": "n도 번호니 단순 순번처럼 보여, 그것이 껍질 크기와 에너지를 동시에 정한다는 무게가 느껴지지 않는다.", "an": "n은 아파트 층수: 1층부터 시작하고, 높을수록 멀고 에너지가 크다.", "rd": "전자가 핵에서 얼마나 떨어진 껍질에 있나가 n이다. 멀수록 에너지가 크고 가장 안쪽이 1이라 최솟값이 1이다.", "tf": "n=0인 전자가 있나? (없다: 최솟값 1)"}, "GC-020": {"n": "방위양자수", "c": "gc", "u": "양자수", "t": "C", "dx": "방위양자수 l이 오비탈 모양을 정하고 0부터 n-1까지라는 점을 놓친 경우다. 방향을 정하는 mₗ과 역할을 섞었다.", "fx": "방위양자수 l을 '오비탈 모양을 정함, 0부터 n-1까지'로 못 박는다. 방향을 정하는 mₗ과 갈라 모양은 l로 잡아라.", "f": "D3", "rk": 224, "d": 2, "rh": 68, "pre": ["GC-019"], "tr": "양자수가 줄줄이 나오니 l도 또 하나의 번호로만 보여, 그것이 \"모양\"을 정한다는 역할이 묻힌다.", "an": "l은 방의 모양: 같은 층 안에도 동그란 방(s)·아령 방(p)이 따로 있다.", "rd": "한 껍질 안 오비탈 모양을 구분하는 것이 l이다. n이 정해지면 l은 0부터 n-1까지만 가능하다.", "tf": "n=2일 때 가능한 l은? (0, 1: 0부터 n-1까지)"}, "GC-021": {"n": "자기양자수", "c": "gc", "u": "양자수", "t": "C", "dx": "자기양자수 mₗ이 오비탈의 공간 방향을 정하고 -l부터 +l까지(0·음수 포함)라는 점이 흔들린 경우다. 모양을 정하는 l과 혼동했다.", "fx": "자기양자수 mₗ을 '오비탈의 공간 방향을 정함, -l부터 +l까지(0·음수 포함)'로 못 박는다. 모양을 정하는 l과 혼동 말고 방향은 mₗ로 잡아라.", "f": "D3", "rk": 373, "d": 3, "rh": 63, "pre": ["GC-020"], "tr": "범위는 0부터 시작할 것 같은 관성이 있어, 음수와 0까지 -l~+l이라는 펼침이 안 잡힌다.", "an": "mₗ은 같은 모양 방이 향한 방향: 아령 방이 x·y·z로 세 방향, -l부터 +l까지 펼쳐진다.", "rd": "한 모양(l)의 오비탈이 향하는 방향이 mₗ이다. -l부터 +l까지(0 포함) 2l+1개다.", "tf": "l=1이면 mₗ은 몇 개? (3개: -1, 0, +1)"}, "GC-022": {"n": "스핀양자수", "c": "gc", "u": "양자수", "t": "A", "dx": "전자 스핀을 정수로 보거나 값을 헷갈린 경우다. mₛ는 +1/2·-1/2 두 값뿐이라는 점이 빠졌다.", "fx": "스핀양자수 mₛ을 '+1/2와 -1/2 두 값뿐'으로 못 박는다. 정수로 보지 말고 두 반정수 값만 써라.", "f": "D3", "rk": 225, "d": 2, "rh": 60, "pre": ["GC-019"], "tr": "양자수는 정수라는 인상이 앞서, 스핀만 ±1/2이라는 반정수가 예외처럼 느껴진다.", "an": "스핀은 동전 앞뒤: 두 값(+1/2, -1/2)뿐이고 정수가 아니다.", "rd": "전자의 자전 방향은 두 가지뿐이라 +1/2, -1/2다. 그래서 반정수다.", "tf": "스핀이 +1일 수 있나? (없다: +1/2 또는 -1/2뿐)"}, "GC-023": {"n": "양자수 범위", "c": "gc", "u": "양자수", "t": "A", "dx": "양자수 간 종속 범위를 놓친 경우다. l의 최댓값은 n이 아니라 n-1, mₗ은 -l부터 +l까지라는 제약이 정리되지 않았다.", "fx": "양자수 종속 범위를 'l의 최댓값은 n이 아니라 n-1, mₗ은 -l부터 +l까지'로 못 박는다. n, l, mₗ 순으로 제약을 따라 가능한 양자수 조합을 가려라.", "f": "D3", "rk": 535, "d": 4, "rh": 60, "pre": ["GC-019", "GC-020", "GC-021"], "tr": "네 양자수를 각각 따로 고르면 될 것 같아, 앞 양자수가 뒤 양자수의 범위를 좁힌다는 사슬이 안 보인다.", "an": "네 양자수는 주소: 층→방모양→방향→자리: 윗 칸이 아랫 칸의 범위를 정하는 종속 구조다.", "rd": "큰 틀이 작은 틀을 제약한다. n이 l을(0~n-1), l이 mₗ을(-l~+l) 정하는 종속 사슬이다.", "tf": "n=1에 p 오비탈이 있나? (없다: l이 0까지라 s만)"}, "GC-024": {"n": "오비탈 기호", "c": "gc", "u": "양자수", "t": "C", "dx": "오비탈 기호와 l 값의 대응을 헷갈린 경우다. s=0·p=1·d=2·f=3이라는 짝이 흔들린다.", "fx": "오비탈 기호와 l을 's=0·p=1·d=2·f=3'으로 짝지어 못 박는다. 이 대응으로 기호에서 l을, l에서 기호를 옮겨라.", "f": "D3", "rk": 374, "d": 3, "rh": 64, "pre": ["GC-020"], "tr": "s·p·d·f가 그냥 붙은 이름표 같아, 그 뒤에 l=0·1·2·3이라는 수가 숨어 있다는 게 떠오르지 않는다.", "an": "s·p·d·f는 l=0·1·2·3의 별명: 글자 뒤에 숨은 숫자가 정해져 있다.", "rd": "s·p·d·f는 l=0·1·2·3에 붙인 이름표(분광선 이름 유래)다. 유도가 아니라 약속이라 외운다.", "tf": "d는 l이 얼마인가? (2)"}, "GC-025": {"n": "오비탈 수", "c": "gc", "u": "양자수", "t": "B", "dx": "부껍질별 오비탈 수를 놓친 경우다. s 1·p 3·d 5·f 7(=2l+1)이라는 셈이 안 잡혔다.", "fx": "부껍질별 오비탈 수를 's 1·p 3·d 5·f 7(=2l+1)'로 못 박는다. 2l+1로 오비탈 수를, 그 두 배로 최대 전자 수를 셈하라.", "f": "D3", "rk": 536, "d": 4, "rh": 60, "pre": ["GC-021", "GC-024"], "tr": "오비탈 수가 임의의 숫자처럼 보여, 1·3·5·7이라는 규칙이 잘 외워지지 않는다.", "an": "부껍질 오비탈 수는 방 개수: s 1칸·p 3칸·d 5칸·f 7칸으로 정해져 있다.", "rd": "한 l에 mₗ이 2l+1개다. l=0·1·2·3이면 1·3·5·7개 오비탈이다.", "tf": "f 부껍질엔 오비탈이 몇 개? (7개)"}, "GC-026": {"n": "오비탈 모양", "c": "gc", "u": "양자수", "t": "C", "dx": "오비탈 모양과 종류의 대응을 헷갈린 경우다. s는 구형, p는 아령형이라는 기본 그림이 흐리다.", "fx": "오비탈 모양을 's는 구형, p는 아령형'으로 못 박는다. 기본 그림을 잡아 모양과 종류를 짝지어라.", "f": "B2", "rk": 537, "d": 4, "rh": 10, "pre": ["GC-024"], "tr": "오비탈이라 하면 둥근 궤도가 먼저 떠올라, 종류마다 모양이 다르다(아령 등)는 그림이 약하다.", "an": "오비탈은 전자가 자주 머무는 구역의 모양: 공 모양(s)도 아령 모양(p)도 있어 다 둥근 궤도가 아니다.", "rd": "l이 모양을 정한다. l=0(s)은 구, l=1(p)은 아령처럼 l 값마다 모양이 다르다.", "tf": "s 오비탈도 아령 모양인가? (아니다: 구형)"}, "GC-158": {"n": "산화·환원 정의", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "산화(전자 잃음·산화수 증가)와 환원(전자 얻음·산화수 감소)의 대응을 헷갈린 경우다. 전자 이동 방향과 산화수 변화가 한 묶음이라는 점이 약하다.", "fx": "'산화 = 전자 잃음·산화수 증가, 환원 = 전자 얻음·산화수 감소'로 못 박는다. 전자 이동 방향과 산화수 변화를 한 묶음으로 잡아라.", "f": "B1", "rk": 34, "d": 0, "rh": 22, "pre": [], "tr": "산화·환원이 산소가 붙고 떨어지는 일 같아, 전자 잃음(산화)·얻음(환원)이라는 더 근본 정의가 흐려진다.", "an": "산화는 전자를 잃음, 환원은 얻음: 산소가 아니라 전자가 주인공이다.", "rd": "더 근본은 전자 이동이다. 전자를 잃으면 산화, 얻으면 환원이다.", "tf": "전자를 잃는 것은 산화인가 환원인가? (산화)"}, "GC-159": {"n": "산화 정의", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "산화가 전자를 잃고 산화수가 커지는 것이라는 정의를 놓친 경우다. 전자 손실=산화라는 핵심이 흔들린다.", "fx": "산화를 '전자를 잃고 산화수가 커지는 것'으로 못 박는다. 전자 손실=산화라는 핵심을 잡아라.", "f": "B1", "rk": 125, "d": 1, "rh": 0, "pre": ["GC-158"], "tr": "산화가 산소와 결합하는 것 같아, 전자를 잃고 산화수가 커지는 것이라는 정의가 묻힌다.", "an": "산화는 전자를 잃어 산화수가 커지는 것: 가진 전자를 내주는 손해다.", "rd": "전자를 잃으면 산화수가 커진다. 그것이 산화의 정의다.", "tf": "산화되면 산화수는? (증가)"}, "GC-160": {"n": "동시성", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "산화와 환원이 항상 짝으로(전자를 주는 쪽과 받는 쪽이 동시에) 일어난다는 점을 놓친 경우다. 한쪽만 단독으로 일어날 수 없다는 점이 약하다.", "fx": "'산화와 환원은 항상 짝으로(전자를 주는 쪽과 받는 쪽이 동시에) 일어남'을 못 박는다. 한쪽만 단독으로 일어날 수 없음을 잡아라.", "f": "B2", "rk": 126, "d": 1, "rh": 1, "pre": ["GC-158"], "tr": "산화만 따로 일어날 것 같아, 늘 환원과 짝으로 동시에 일어난다는 게 빠진다.", "an": "한쪽이 잃은 전자를 다른 쪽이 받는다: 산화와 환원은 늘 한 쌍이다.", "rd": "잃은 전자는 어딘가 가야 한다. 그래서 산화와 환원이 늘 짝으로 일어난다.", "tf": "산화만 따로 일어날 수 있나? (없다: 환원과 짝)"}, "GC-161": {"n": "산화수 규칙", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "산화수 규칙을 헷갈린 경우다. 홑원소 0, 단원자 이온은 그 전하, 화합물 전체 합은 0(이온은 전하)이라는 기준이 흔들린다.", "fx": "산화수 규칙을 '홑원소 0, 단원자 이온은 그 전하, 화합물 전체 합은 0(이온은 전하)'으로 못 박는다. 이 기준으로 모르는 원자의 산화수를 역산하라.", "f": "D3", "rk": 127, "d": 1, "rh": 18, "pre": ["GC-158"], "tr": "산화수 규칙이 외울 목록 같아 어느 원소가 몇인지 섞인다.", "an": "산화수는 전자를 다 줬다 치고 매긴 가상 전하: 원소별 약속값이 있다.", "rd": "전자를 전기음성도 큰 쪽이 다 가졌다 가정하고 매긴 가상 전하다. 원소별 약속값에서 나온다.", "tf": "홑원소의 산화수는? (0)"}, "GC-162": {"n": "산화제·환원제", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "산화제(자신은 환원되며 상대를 산화)와 환원제(자신은 산화되며 상대를 환원)의 역할을 뒤바꾼 경우다. 전자를 받는 쪽이 산화제라는 점이 약하다.", "fx": "'산화제는 자신이 환원되며 상대를 산화, 환원제는 자신이 산화되며 상대를 환원'으로 못 박는다. 전자를 받는 쪽이 산화제임을 잡아 역할을 뒤바꾸지 마라.", "f": "B1", "rk": 246, "d": 2, "rh": 17, "pre": ["GC-158", "GC-161"], "tr": "환원제니 환원되는 것 같고 산화제니 산화되는 것 같아, 이름과 반대로 역할이 작동한다는 게 헷갈린다.", "an": "이름과 반대로 작동: 환원제는 남을 환원시키느라 자기가 산화된다.", "rd": "환원제는 전자를 주어 남을 환원시키니 자기는 산화된다. 이름과 반대로 작동한다.", "tf": "환원제는 산화되나 환원되나? (산화됨)"}, "GC-163": {"n": "전자 보존", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "산화환원에서 잃은 전자 수=얻은 전자 수로 전자가 보존된다는 점을 놓친 경우다. 반쪽 반응 균형의 근거가 흔들린다.", "fx": "'산화환원에서 잃은 전자 수 = 얻은 전자 수로 전자가 보존'됨을 못 박는다. 이를 반쪽 반응 균형의 근거로 삼아라.", "f": "D3", "rk": 247, "d": 2, "rh": 0, "pre": ["GC-160"], "tr": "전자가 어디론가 사라질 것 같아, 잃은 수와 얻은 수가 같아 보존된다는 게 안 잡힌다.", "an": "잃은 전자 수 = 얻은 전자 수: 전자는 사라지지 않고 옮겨갈 뿐이다.", "rd": "전자는 생기거나 사라지지 않는다. 그래서 잃은 수와 얻은 수가 같다.", "tf": "잃은 전자와 얻은 전자 수의 관계는? (같음)"}, "GC-164": {"n": "갈바니 전지", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "갈바니(볼타) 전지가 자발 반응으로 전기를 만든다는 점을 놓친 경우다. 외부 전원으로 비자발 반응을 강제하는 전기분해와 방향이 반대라는 구분이 약하다.", "fx": "갈바니(볼타) 전지를 '자발 반응으로 전기를 만듦'으로 못 박는다. 외부 전원으로 비자발 반응을 강제하는 전기분해와 방향이 반대임을 잡아라.", "f": "B2", "rk": 393, "d": 3, "rh": 9, "pre": ["GC-162"], "tr": "전지가 그냥 전기 만드는 장치 같아, 자발 반응의 화학 에너지를 전기로 바꾼다는 원리가 흐려진다.", "an": "전지는 자발 반응의 화학에너지를 전기로 바꾸는 발전기다.", "rd": "자발적 산화환원에서 전자가 도선을 흐르면 전류다. 그 화학 에너지를 전기로 뽑는 장치다.", "tf": "전지는 무슨 에너지를 전기로? (화학)"}, "GC-165": {"n": "전극 극성", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "갈바니 전지에서 산화전극(-)·환원전극(+)이라는 극성 대응을 헷갈린 경우다. 산화는 (-)극, 환원은 (+)극에서 일어난다는 점이 흔들린다.", "fx": "갈바니 전지에서 '산화전극 (-)·환원전극 (+)'를 못 박는다. 산화는 (-)극, 환원은 (+)극에서 일어남을 잡아라.", "f": "B1", "rk": 561, "d": 4, "rh": 1, "pre": ["GC-164"], "tr": "산화전극이 +일 것 같아, 갈바니에선 산화전극이 -·환원전극이 +라는 대응이 흔들린다.", "an": "갈바니 전지에서 산화전극이 (-), 환원전극이 (+): 전기분해와 반대다.", "rd": "갈바니 전지는 자발 반응이다. 산화전극에서 전자가 나오니 (-), 환원전극이 (+)다.", "tf": "갈바니 전지에서 산화전극은 +인가 -인가? (-)"}, "GC-166": {"n": "전자 흐름", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "전자가 산화전극에서 환원전극으로 도선을 따라 흐른다는 방향을 놓친 경우다. 전류는 그 반대(양전하 흐름)로 정의된다는 점도 흔들린다.", "fx": "'전자가 산화전극에서 환원전극으로 도선을 따라 흐름'을 못 박는다. 전류는 그 반대(양전하 흐름)로 정의됨도 잡아라.", "f": "A1", "rk": 661, "d": 5, "rh": 0, "pre": ["GC-165"], "tr": "전자가 어느 쪽으로 흐를지 헷갈려, 산화전극에서 환원전극으로 간다는 방향이 흔들린다.", "an": "전자는 산화전극(-)에서 환원전극(+)으로 도선을 타고 간다.", "rd": "전자는 산화전극(전자 생성)에서 환원전극(전자 소비)으로 도선을 타고 간다.", "tf": "전자는 어느 전극에서 어느 전극으로 가나? (산화전극에서 환원전극으로)"}, "GC-167": {"n": "염다리", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "염다리가 전하 쏠림을 막아 회로를 유지한다는 역할을 놓친 경우다. 전자는 도선으로 흐르고 염다리는 이온으로 전기적 중성을 지킨다는 구분이 약하다.", "fx": "염다리를 '전하 쏠림을 막아 회로를 유지'로 못 박는다. 전자는 도선으로 흐르고 염다리는 이온으로 전기적 중성을 지킴을 갈라라.", "f": "B3", "rk": 562, "d": 4, "rh": 0, "pre": ["GC-164"], "tr": "염다리가 장식 같아, 전하 쏠림을 막아 회로를 유지하는 역할이 빠진다.", "an": "염다리는 전하 쏠림을 막는 균형추: 없으면 회로가 멈춘다.", "rd": "반응이 진행되면 한쪽에 전하가 쌓인다. 염다리가 이온을 옮겨 전하 균형을 맞춰 회로를 잇는다.", "tf": "염다리가 없으면 전지는? (멈춤)"}, "GC-168": {"n": "표준 수소 전극", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "표준 수소 전극을 0 V 기준으로 삼아 다른 전극 전위를 정한다는 점을 놓친 경우다. 절대값이 아니라 기준 대비 상대값이라는 점이 흔들린다.", "fx": "표준 수소 전극을 '0 V 기준으로 삼아 다른 전극 전위를 정함'으로 못 박는다. 절대값이 아니라 기준 대비 상대값임을 잡아라.", "f": "D2", "rk": 563, "d": 4, "rh": 5, "pre": ["GC-164"], "tr": "전극 전위가 절대값으로 정해질 것 같아, 표준 수소 전극을 0으로 삼은 상대값이라는 게 빠진다.", "an": "전위는 절대값이 아니라 수소 전극을 0으로 둔 상대 점수다.", "rd": "절대 전위는 못 재니 수소 전극을 0으로 약속하고 거기에 대한 상대값으로 잰다.", "tf": "전극 전위의 기준 0은 무슨 전극? (수소)"}, "GC-169": {"n": "전지 전위", "c": "gc", "u": "산화환원평형-1", "t": "C", "dx": "표준 전지 전위 = (환원전극 전위) - (산화전극 전위)로 빼서 구하고, 값이 양수면 자발적이라는 점을 놓친 경우다.", "fx": "표준 전지 전위를 '(환원전극 전위) − (산화전극 전위)로 빼서 구함, 값이 양수면 자발'로 못 박는다. 빼는 순서를 맞춰 자발성을 잡아라.", "f": "D3", "rk": 662, "d": 5, "rh": 3, "pre": ["GC-168"], "tr": "전지 전위를 더하면 될 것 같아, (환원전극)-(산화전극)으로 빼고 양수면 자발이라는 게 흐려진다.", "an": "전지 전위=(환원전극-산화전극) 환원전위, 양수면 자발: 점수 차로 자발성 판정이다.", "rd": "E=(환원전극)-(산화전극)의 환원 전위다. 양수면 자발이다.", "tf": "전지 전위가 양수면 반응은? (자발)"}, "GC-170": {"n": "자발성", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "전지 전위가 양수면 자발, 음수면 비자발이라는 대응을 놓친 경우다. E°의 부호가 반응 방향을 알려준다는 점이 흔들린다.", "fx": "'전지 전위가 양수면 자발, 음수면 비자발'임을 못 박는다. E°의 부호가 반응 방향을 알려줌을 잡아라.", "f": "C2", "rk": 706, "d": 6, "rh": 0, "pre": ["GC-169"], "tr": "전위 부호와 자발성의 대응이 헷갈려, 양수가 자발이라는 게 흔들린다.", "an": "전위가 양수면 저절로 도는 전지: 음수면 안 돈다.", "rd": "ΔG=-nFE라 E>0이면 ΔG<0이다. 그래서 전위가 양수면 자발이다.", "tf": "E가 음이면 ΔG는? (양: 비자발)"}, "GC-171": {"n": "표준 환원 전위", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "표준 환원 전위가 클수록 환원이 잘 일어나(전자를 잘 받아 산화제로 작용)는 경향이 크다는 점을 놓친 경우다. 전위 크기와 환원 경향의 방향이 흔들린다.", "fx": "'표준 환원 전위가 클수록 환원이 잘 일어나(전자를 잘 받아 산화제로 작용)는 경향이 큼'을 못 박는다. 전위 크기로 환원 경향·산화제 세기를 잡아라.", "f": "C1", "rk": 663, "d": 5, "rh": 0, "pre": ["GC-168"], "tr": "환원 전위가 크면 무엇이 잘 되는지 막막해, 클수록 환원이 잘 돼 산화제로 작용한다는 게 빠진다.", "an": "환원전위가 클수록 전자를 잘 받아(환원 잘 됨) 산화제로 센 물질이다.", "rd": "환원 전위가 클수록 환원이 잘 된다. 그래서 전자를 잘 받는 센 산화제다.", "tf": "환원 전위가 큰 물질은 산화제인가 환원제인가? (산화제)"}, "GC-172": {"n": "자유 에너지와 전위", "c": "gc", "u": "산화환원평형-2", "t": "A", "dx": "ΔG° = -nFE°에서 음의 부호 때문에 E°>0이면 ΔG°<0(자발)이라는 연결을 놓친 경우다. n은 이동 전자 몰수, F는 패러데이 상수라는 점이 약하다.", "fx": "'ΔG° = -nFE°라 음의 부호 때문에 E°>0이면 ΔG°<0(자발)'임을 못 박는다. n은 이동 전자 몰수, F는 패러데이 상수임을 잡아라.", "f": "C2", "rk": 707, "d": 6, "rh": 0, "pre": ["GC-169", "GC-111"], "tr": "ΔG°와 E°가 따로 노는 것 같아, ΔG°=-nFE°의 음부호로 E°>0이 자발과 묶인다는 게 안 잡힌다.", "an": "ΔG°=-nFE°, 음부호라 E°가 양수면 자발: 전위와 자유에너지가 묶인다.", "rd": "전기 일 nFE가 최대 비팽창 일 -ΔG와 같다. 그래서 ΔG°=-nFE°다.", "tf": "ΔG°와 E°의 관계식은? (ΔG°=-nFE°)"}, "GC-173": {"n": "네른스트 식", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "네른스트 식이 농도가 표준과 다를 때 전위를 보정하고, 평형에서 전위가 0이 된다는 점을 놓친 경우다. 반응이 평형을 향하며 전위가 줄어든다는 흐름이 약하다.", "fx": "네른스트 식을 '농도가 표준과 다를 때 전위를 보정하고, 평형에서 전위가 0이 됨'으로 못 박는다. 반응이 평형을 향하며 전위가 줄어드는 흐름을 잡아라.", "f": "A2", "rk": 708, "d": 6, "rh": 0, "pre": ["GC-169", "GC-117"], "tr": "네른스트가 복잡한 보정 같아, 농도가 표준과 다를 때 전위를 고치고 평형에서 0이 된다는 게 흐려진다.", "an": "농도가 표준과 다르면 전위를 보정: 평형에 닿으면 전위가 0이 된다(네른스트).", "rd": "농도가 표준과 다르면 평형 위치가 달라 전위가 바뀐다. 평형에 닿으면 추진력이 없어 E=0이다.", "tf": "평형에 도달하면 전지 전위는? (0)"}, "GC-174": {"n": "전기분해", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "전기분해가 외부 전원으로 비자발 반응을 강제하는 것이라는 점을 놓친 경우다. 전기를 만드는 갈바니 전지와 방향이 반대라는 구분이 흔들린다.", "fx": "전기분해를 '외부 전원으로 비자발 반응을 강제'로 못 박는다. 전기를 만드는 갈바니 전지와 방향이 반대임을 잡아라.", "f": "B2", "rk": 394, "d": 3, "rh": 4, "pre": ["GC-162"], "tr": "전기분해도 그냥 반응 같아, 외부 전원으로 비자발 반응을 강제한다는 게 흐려진다.", "an": "전기분해는 전기로 비자발 반응을 억지로 미는 역발전이다.", "rd": "외부 전원으로 전자를 억지로 밀어 비자발 반응을 일으킨다. 전지의 반대다.", "tf": "전기분해는 자발인가 비자발 강제인가? (비자발 강제)"}, "GC-175": {"n": "전기분해 전극", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "전기분해에서 (-)극 연결 전극이 환원, (+)극 연결 전극이 산화라는 대응을 놓친 경우다. 산화·환원이 두 전극에서 짝으로 일어난다는 점이 약하다.", "fx": "전기분해에서 '(-)극에 연결된 전극이 환원, (+)극에 연결된 전극이 산화'임을 못 박는다. 산화·환원이 두 전극에서 짝으로 일어남을 잡아라.", "f": "B1", "rk": 564, "d": 4, "rh": 0, "pre": ["GC-174"], "tr": "전기분해 전극 극성이 전지와 같을 것 같아, (-)극 연결이 환원·(+)극 연결이 산화라는 대응이 흔들린다.", "an": "전기분해는 (-)극 연결이 환원, (+)극 연결이 산화: 전지와 반대다.", "rd": "외부 전원 (-)극에 연결된 전극에 전자가 밀려 들어와 환원, (+)극 쪽은 산화다. 전지와 반대다.", "tf": "전기분해에서 (+)극은 산화인가 환원인가? (산화: 전지와 반대)"}, "GC-176": {"n": "패러데이 법칙", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "석출량이 흘려준 전하량에 비례한다는 패러데이 법칙을 놓친 경우다. 전하량=전류×시간(Q=It)이라는 연결이 흔들린다.", "fx": "패러데이 법칙을 '석출량이 흘려준 전하량에 비례'로 못 박는다. 전하량 = 전류 × 시간(Q=It)으로 전하량을 구하라.", "f": "A2", "rk": 565, "d": 4, "rh": 2, "pre": ["GC-174"], "tr": "석출량이 시간만 따를 것 같아, 흘린 전하량에 비례한다(패러데이)는 게 안 잡힌다.", "an": "석출량은 흘려준 전하량에 비례: 전기를 많이 흘릴수록 많이 쌓인다.", "rd": "반응한 전자 몰수가 흘린 전하량에 비례한다. 그래서 석출량이 전하량에 비례한다.", "tf": "전하량을 2배 흘리면 석출량은? (2배)"}, "GC-177": {"n": "패러데이 상수", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "패러데이 상수가 전자 1몰의 전하(약 96500 C/mol)라는 점을 놓친 경우다. 전자 1개가 아니라 1몰 기준이고, Q=It로 전하량을 구한다는 점이 약하다.", "fx": "패러데이 상수를 '전자 1몰의 전하(약 96500 C/mol)'로 못 박는다. 전자 1개가 아니라 1몰 기준이고, Q=It로 전하량을 구함을 잡아라.", "f": "D3", "rk": 664, "d": 5, "rh": 1, "pre": ["GC-176"], "tr": "패러데이 상수가 임의의 큰 수 같아, 전자 1몰의 전하(약 96500 C)라는 정체가 빠진다.", "an": "패러데이 상수는 전자 1몰의 전하(약 96500 C): 전자 개수와 전하를 잇는 환율이다.", "rd": "전자 1몰의 전하다. 전자 6.02×10²³개 곱하기 기본 전하가 약 96500 C다.", "tf": "전자 1몰의 전하는 대략? (96500 C)"}, "GC-178": {"n": "패러데이 계산", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "석출량 계산에서 이온의 전하수만큼 전자가 필요하다는 점을 놓친 경우다. +2가 이온은 같은 몰을 석출하는 데 전자가 두 배 든다는 비례가 흔들린다.", "fx": "'석출에 이온의 전하수만큼 전자가 필요'함을 못 박는다. +2가 이온은 같은 몰을 석출하는 데 전자가 두 배 듦을 잡아라.", "f": "D3", "rk": 709, "d": 6, "rh": 0, "pre": ["GC-176", "GC-177"], "tr": "같은 전하면 같은 몰이 나올 것 같아, 이온 전하수만큼 전자가 더 필요하다는 게 빠진다.", "an": "같은 전하라도 +2 이온은 전자 2개가 필요해 절반만 석출: 가수에 반비례한다.", "rd": "+2 이온 1개를 석출하려면 전자 2개가 필요하다. 같은 전하라도 가수가 크면 몰수가 적다.", "tf": "같은 전하로 Cu²⁺와 Ag⁺ 중 더 적게 석출되는 몰수는? (Cu²⁺: 전자 2개 필요)"}, "GC-179": {"n": "환원제", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "환원제가 전자를 주어 상대를 환원시키고 자신은 산화(산화수 증가)된다는 점을 놓친 경우다. 역할과 자기 변화 방향이 뒤섞였다.", "fx": "환원제를 '전자를 주어 상대를 환원시키고 자신은 산화(산화수 증가)됨'으로 못 박는다. 역할과 자기 변화 방향을 갈라 잡아라.", "f": "B1", "rk": 395, "d": 3, "rh": 0, "pre": ["GC-162"], "tr": "환원제니 환원되는 것 같아, 전자를 주어 상대를 환원시키고 자신은 산화된다는 게 헷갈린다.", "an": "환원제는 전자를 주어 남을 환원시키고 자기는 산화: 이름과 반대다.", "rd": "환원제는 전자를 내놓아 남을 환원시키고 자기는 산화된다. 이름과 반대다.", "tf": "환원제는 전자를 주나 받나? (줌)"}, "GC-199": {"n": "산화제", "c": "gc", "u": "산화환원평형-2", "t": "C", "dx": "산화제가 전자를 받아 상대를 산화시키고 자신은 환원(산화수 감소)된다는 점을 놓친 경우다. 환원제와 역할이 뒤바뀌었다.", "fx": "산화제를 '전자를 받아 상대를 산화시키고 자신은 환원(산화수 감소)됨'으로 못 박는다. 환원제와 역할을 뒤바꾸지 마라.", "f": "B1", "rk": 405, "d": 3, "rh": 0, "pre": ["GC-162"], "tr": "산화제니 산화되는 것 같아, 전자를 받아 상대를 산화시키고 자신은 환원된다는 게 헷갈린다.", "an": "산화제는 전자를 받아 남을 산화시키고 자기는 환원: 이름과 반대다.", "rd": "산화제는 전자를 받아 남을 산화시키고 자기는 환원된다. 이름과 반대다.", "tf": "산화제는 전자를 받나 주나? (받음)"}, "GC-084": {"n": "끓는점 오름·어는점 내림", "c": "gc", "u": "물질의상태-총괄성", "t": "C", "dx": "끓는점 오름·어는점 내림이 몰랄 농도에 비례한다(ΔT = K·m)는 점을 놓친 경우다. 상수 K가 용매 고유값이고 두 현상의 방향(오름 대 내림)이 흔들린다.", "fx": "끓는점 오름·어는점 내림을 'ΔT = K·m, K는 용매 고유값'으로 못 박는다. 끓는점은 오르고 어는점은 내리는 방향을 갈라 잡아라.", "f": "A2", "rk": 545, "d": 4, "rh": 2, "pre": ["GC-082", "GC-080"], "tr": "끓는점 오름이 막연히 농도와 관련 있을 것 같아, 몰랄 농도에 비례(ΔT=K·m)한다는 식이 안 떠오른다.", "an": "입자가 많을수록 끓이기 더 어렵다: 몰랄 농도에 비례해 끓는점이 오른다.", "rd": "증기압이 내렸으니 외부 압력에 도달하려면 더 데워야 한다. 그래서 끓는점이 몰랄에 비례해 오른다.", "tf": "소금물이 순수한 물보다 끓는점이? (높음)"}, "GC-085": {"n": "삼투압", "c": "gc", "u": "물질의상태-총괄성", "t": "A", "dx": "삼투압 π = MRT(M은 몰 농도)에서 R·T가 곱해진다는 점, 그리고 농도를 맞추는(묽은 쪽에서 진한 쪽으로) 방향을 놓친 경우다.", "fx": "삼투압을 'π = MRT, M은 몰 농도'로 못 박는다. R·T가 곱해짐을 잡고 용매가 묽은 쪽에서 진한 쪽으로 가는 방향을 새겨라.", "f": "A2", "rk": 546, "d": 4, "rh": 0, "pre": ["GC-082"], "tr": "삼투압이 그냥 압력 하나 같아, π=MRT처럼 R·T가 곱해지고 묽은 쪽에서 진한 쪽으로 간다는 방향이 빠진다.", "an": "묽은 쪽 물이 진한 쪽으로 밀고 드는 압력: π=MRT로 농도·온도에 비례한다.", "rd": "묽은 쪽 용매가 진한 쪽으로 밀려 든다. 이를 멈출 압력이 삼투압이고 π=MRT다.", "tf": "농도를 2배로 하면 삼투압은? (2배: π=MRT)"}, "GC-086": {"n": "반트호프 인자", "c": "gc", "u": "물질의상태-총괄성", "t": "C", "dx": "반트호프 인자 i가 용질 1몰이 내놓는 입자 수라는 점을 놓친 경우다. 비전해질은 i=1, 전해질은 이온 수만큼 커져 총괄성이 배가된다는 연결이 약하다.", "fx": "반트호프 인자 i를 '용질 1몰이 내놓는 입자 수'로 못 박는다. 비전해질은 i=1, 전해질은 이온 수만큼 커져 총괄성이 배가됨을 잡아라.", "f": "B2", "rk": 547, "d": 4, "rh": 1, "pre": ["GC-082"], "tr": "반트호프 i가 알 수 없는 보정 계수 같아, 용질 1몰이 내놓는 입자 수라는 단순한 정체가 안 잡힌다.", "an": "i는 용질 1 알이 물에 들어가 몇 조각이 되나: 소금은 약 2, 설탕은 1이다.", "rd": "용질 1몰이 녹아 실제 몇 몰의 입자가 되나가 i다. 총괄성은 i를 곱한 입자 수로 정해진다.", "tf": "NaCl의 i는 대략? (2: Na⁺와 Cl⁻)"}, "GC-087": {"n": "증기압 내림", "c": "gc", "u": "물질의상태-총괄성", "t": "B", "dx": "증기압 내림이 표면의 용매 분자 비율(용매 몰분율)이 줄어 생긴다는 메커니즘을 놓친 경우다. 용질이 많을수록 더 내려간다는 방향이 흔들린다.", "fx": "증기압 내림을 '표면의 용매 분자 비율(용매 몰분율)이 줄어 생김'으로 못 박는다. 용질이 많을수록 더 내려가는 방향을 잡아라.", "f": "B3", "rk": 653, "d": 5, "rh": 0, "pre": ["GC-083"], "tr": "증기압이 주는 건 알아도 왜인지 막연해, 표면의 용매 비율이 줄어서라는 메커니즘이 빠진다.", "an": "줄 선 사람 중 일부가 용질로 바뀌면 표를 살(증발할) 용매가 줄어든다: 표면 비율이 핵심이다.", "rd": "증발은 표면 용매가 한다. 표면의 용매 비율이 줄면 증발이 줄어 증기압이 내린다.", "tf": "비휘발성 용질이 증발을 막는 이유는? (표면 용매 비율 감소)"}, "GC-088": {"n": "몰랄 상수", "c": "gc", "u": "물질의상태-총괄성", "t": "C", "dx": "끓는점 오름·어는점 내림 상수가 용질이 아니라 용매의 고유 성질이라는 점을 놓친 경우다. 같은 용매면 어떤 용질이든 같은 상수를 쓴다는 점이 빠졌다.", "fx": "끓는점 오름·어는점 내림 상수를 '용질이 아니라 용매의 고유 성질'로 못 박는다. 같은 용매면 어떤 용질이든 같은 상수를 씀을 잡아라.", "f": "A3", "rk": 654, "d": 5, "rh": 0, "pre": ["GC-084"], "tr": "끓는점 상수가 용질에 따라 변할 것 같아, 실제로는 용매의 고유 성질이라는 게 거꾸로 느껴진다.", "an": "상수는 용매의 고유 체질: 어떤 용질을 녹여도 변하지 않는다.", "rd": "상수는 용매의 성질로만 정해진다. 그래서 어떤 용질을 녹여도 변하지 않는다.", "tf": "끓는점 오름 상수는 용질에 따라 변하나? (안 변함: 용매 고유)"}, "GC-089": {"n": "전해질 비교", "c": "gc", "u": "물질의상태-총괄성", "t": "C", "dx": "같은 농도라도 전해질(예: NaCl)은 이온으로 나뉘어 입자 수가 더 많아 총괄성이 크다는 점을 놓친 경우다. 반트호프 인자로 비교해야 한다는 연결이 약하다.", "fx": "'같은 농도라도 전해질(NaCl)은 이온으로 나뉘어 입자 수가 더 많아 총괄성이 큼'을 못 박는다. 반트호프 인자로 비교해야 함을 잡아라.", "f": "C1", "rk": 655, "d": 5, "rh": 0, "pre": ["GC-082", "GC-086"], "tr": "같은 농도면 총괄성도 같을 것 같아, 전해질은 이온으로 쪼개져 입자가 더 많다는 게 빠진다.", "an": "소금 1 알은 물에서 2조각(Na⁺·Cl⁻): 같은 농도라도 입자가 많아 효과가 크다.", "rd": "전해질은 이온으로 쪼개져 입자가 는다. 같은 농도라도 입자가 많아 총괄성이 크다.", "tf": "같은 몰랄의 설탕과 소금 중 어는점이 더 낮은 건? (소금: 입자 많음)"}, "GC-090": {"n": "용해성 규칙", "c": "gc", "u": "물질의상태-총괄성", "t": "C", "dx": "'비슷한 것끼리 잘 녹는다'(극성끼리·무극성끼리)는 규칙을 놓친 경우다. 극성과 무극성은 잘 섞이지 않는다는 방향이 흔들린다.", "fx": "용해성을 '비슷한 것끼리 잘 녹음(극성끼리·무극성끼리)'으로 못 박는다. 극성과 무극성은 잘 섞이지 않는 방향을 잡아라.", "f": "B2", "rk": 860, "d": 12, "rh": 0, "pre": ["GC-052"], "tr": "용해성은 경험으로만 아는 것 같아, \"비슷한 극성끼리 녹는다\"는 규칙으로 짚힌다는 게 안 떠오른다.", "an": "비슷한 극성끼리 녹는다: 기름은 기름에, 물은 소금에, 끼리끼리 섞인다.", "rd": "비슷한 분자 간 힘이라야 서로의 인력을 대신한다. 그래서 극성은 극성에, 무극성은 무극성에 녹는다.", "tf": "기름이 물에 안 녹는 이유는? (극성 안 맞음)"}, "GC-091": {"n": "어는점 내림", "c": "gc", "u": "물질의상태-총괄성", "t": "C", "dx": "어는점 내림이 총괄성이라 용질 입자 수(몰랄 농도)에 비례한다는 점을 놓친 경우다. 왜 총괄성인지(용매 화학퍼텐셜 낮춤)의 뿌리가 약하다.", "fx": "어는점 내림을 '총괄성이라 용질 입자 수(몰랄 농도)에 비례'로 못 박는다. 용매의 화학퍼텐셜을 낮춰 총괄성이 됨을 뿌리로 잡아라.", "f": "A2", "rk": 656, "d": 5, "rh": 0, "pre": ["GC-084"], "tr": "어는점 내림이 용질 종류에 좌우될 것 같아, 입자 수(몰랄)에만 비례하는 총괄성이라는 게 묻힌다.", "an": "입자가 많을수록 얼리기 더 어렵다: 몰랄 농도에 비례해 어는점이 내려간다(제설).", "rd": "용질이 끼면 용매가 규칙적 결정을 이루기 어렵다. 그래서 더 식혀야 얼어 어는점이 몰랄에 비례해 내린다.", "tf": "겨울에 도로에 소금을 뿌리는 이유는? (어는점 내림)"}, "GC-063": {"n": "이상 기체", "c": "gc", "u": "물질의상태-기체", "t": "A", "dx": "이상 기체 상태방정식(PV=nRT)에서 변수 관계를 헷갈린 경우다. 부피는 압력에 반비례(보일)·절대온도에 정비례(샤를, 일차)라는 비례 구조가 흔들린다.", "fx": "이상 기체를 'PV=nRT, 부피는 압력에 반비례(보일)·절대온도에 정비례(샤를)'로 못 박는다. 비례 구조를 잡아 변수 변화를 따져라.", "f": "A2", "rk": 112, "d": 1, "rh": 11, "pre": ["GC-001"], "tr": "변수 네 개가 한 식에 얽혀 있어, 무엇을 고정하고 무엇을 변화로 볼지가 막막해 관계가 뒤섞인다.", "an": "풍선 하나에 압력·부피·온도·기체량이 한 줄로 묶인 시소: 하나를 누르면 다른 게 뜬다(고정한 것 빼고).", "rd": "보일(PV 일정)·샤를(V∝T)·아보가드로(V∝n)를 합치면 PV∝nT, 비례 상수 R로 PV=nRT다.", "tf": "온도를 2배(켈빈)로 올리고 부피 일정이면 압력은? (2배)"}, "GC-064": {"n": "돌턴 분압", "c": "gc", "u": "물질의상태-기체", "t": "C", "dx": "전체 압력이 각 성분 분압의 합이고, 각 분압이 몰분율에 비례한다는 점을 놓친 경우다. 합을 곱으로 다루거나 몰수·분압 관계가 흐리다.", "fx": "돌턴 분압을 '전체 압력은 각 성분 분압의 합, 각 분압은 몰분율에 비례'로 못 박는다. 합을 곱으로 다루지 말고 몰분율로 분압을 구하라.", "f": "A2", "rk": 226, "d": 2, "rh": 2, "pre": ["GC-063"], "tr": "기체가 섞이면 압력이 어떻게든 평균날 것 같아, 각자 따로 내는 압력의 \"합\"이고 몰분율에 비례한다는 게 안 떠오른다.", "an": "한 방에 사람과 강아지가 섞여도 각자 내는 소음이 따로: 전체 소음은 그 합, 인원 비율에 비례한다.", "rd": "이상 기체는 서로 무관하게 압력을 낸다. 그래서 전체 압력=각 분압의 합이고 분압은 몰분율에 비례한다.", "tf": "N₂ 3몰, O₂ 1몰이면 N₂ 분압은 전체의? (3/4)"}, "GC-065": {"n": "운동론", "c": "gc", "u": "물질의상태-기체", "t": "C", "dx": "기체 분자 운동론의 가정(온도가 평균 운동 에너지를 정함, 탄성 충돌)을 놓친 경우다. 0 K가 아니면 분자는 늘 운동한다는 점이 약하다.", "fx": "기체 운동론을 '온도가 평균 운동 에너지를 정하고 충돌은 탄성, 0 K가 아니면 분자는 늘 운동'으로 못 박는다. 이 가정을 속력·압력 해석의 토대로 삼아라.", "f": "A3", "rk": 227, "d": 2, "rh": 7, "pre": ["GC-063"], "tr": "기체 분자는 다 같은 속도로 날 것 같아, 온도가 평균 운동 에너지를 정한다는 전제가 뒤로 밀린다.", "an": "같은 온도의 기체는 평균 에너지가 같은 무리: 속도가 다 같은 게 아니라 평균만 같다.", "rd": "온도는 평균 운동 에너지의 척도다. 같은 온도면 평균 에너지가 같지만 개별 속도는 분포를 이룬다.", "tf": "같은 온도의 He와 Ar은 평균 운동 에너지가 같나? (같다)"}, "GC-066": {"n": "vrms", "c": "gc", "u": "물질의상태-기체", "t": "A", "dx": "제곱평균제곱근 속력(vᵣₘₛ)이 √T에 비례하고 √M(몰질량)에 반비례한다는 관계를 헷갈린 경우다. 분모가 M의 제곱근이라는 점이 흔들린다.", "fx": "제곱평균제곱근 속력을 'vᵣₘₛ는 √T에 비례하고 √M(몰질량)에 반비례'로 못 박는다. 분모가 M의 제곱근임을 잡아 속력을 정량 비교하라.", "f": "A2", "rk": 375, "d": 3, "rh": 2, "pre": ["GC-065"], "tr": "무거우면 빠를 것 같기도 느릴 것 같기도 해, vᵣₘₛ이 √T에 비례·√M에 반비례한다는 형태가 안 잡힌다.", "an": "같은 에너지면 무거운 공이 느리다: 볼링공과 탁구공을 같은 힘으로 굴리면 탁구공이 빠르다(√M 반비례).", "rd": "(1/2)mv²의 평균이 (3/2)kT라 v∝√(T/m)이다. 그래서 √T 비례·√M 반비례다.", "tf": "온도를 4배로 올리면 rms 속력은? (2배: √4)"}, "GC-067": {"n": "분자량과 속력", "c": "gc", "u": "물질의상태-기체", "t": "A", "dx": "같은 온도면 평균 운동 에너지가 같아 무거운 분자가 더 느리다는 결론을 놓친 경우다. (1/2)mv²이 같으니 M이 크면 v가 작다는 흐름이 약하다.", "fx": "'같은 온도면 평균 운동 에너지가 같아 무거운 분자가 더 느림'을 못 박는다. (1/2)mv²이 같으니 M이 크면 v가 작음을 잡아라.", "f": "C1", "rk": 539, "d": 4, "rh": 0, "pre": ["GC-065", "GC-066"], "tr": "무거운 분자가 더 힘차게 부딪칠 것 같아, 같은 온도면 에너지가 같아 오히려 더 느리다는 결론이 거꾸로 느껴진다.", "an": "무거운 트럭과 가벼운 오토바이가 같은 운동에너지면 트럭이 느리다: 무거울수록 느리다.", "rd": "같은 온도면 평균 운동 에너지가 같다. (1/2)mv²이 같으니 m이 크면 v가 작다.", "tf": "같은 온도의 O₂와 H₂ 중 빠른 건? (H₂: 가벼움)"}, "GC-068": {"n": "그레이엄", "c": "gc", "u": "물질의상태-기체", "t": "C", "dx": "확산·분출 속도가 몰질량의 제곱근에 반비례한다는 그레이엄 법칙을 놓친 경우다. 가벼운 기체일수록 빠르다는 결론이 vᵣₘₛ와 같은 뿌리임을 못 본다.", "fx": "그레이엄 법칙을 '확산·분출 속도가 몰질량의 제곱근에 반비례'로 못 박는다. 가벼운 기체일수록 빠름이 vᵣₘₛ와 같은 뿌리임을 잡아라.", "f": "A2", "rk": 540, "d": 4, "rh": 0, "pre": ["GC-066"], "tr": "확산 속도가 질량에 단순 반비례할 것 같아, 제곱근이 끼어 √M에 반비례한다는 게 한 단계 더 들어간다.", "an": "향수 퍼지는 속도가 분자량 제곱근에 반비례: 가벼운 냄새가 먼저 도착한다.", "rd": "평균 운동 에너지가 같아 v∝1/√M이다. 그래서 확산 속도가 분자량 제곱근에 반비례한다(그레이엄).", "tf": "H₂와 O₂ 중 확산이 빠른 건? (H₂: √M 반비례)"}, "GC-069": {"n": "실제 기체", "c": "gc", "u": "물질의상태-기체", "t": "C", "dx": "이상 기체 가정(분자 부피 0, 분자 간 힘 0)이 깨지는 조건을 놓친 경우다. 고압·저온에서 비이상성이 커진다는 점이 흔들린다.", "fx": "실제 기체를 '이상 가정(분자 부피 0, 분자 간 힘 0)이 고압·저온에서 깨짐'으로 못 박는다. 어느 조건에서 비이상성이 커지는지 잡아라.", "f": "D2", "rk": 376, "d": 3, "rh": 3, "pre": ["GC-063", "GC-065"], "tr": "이상 기체 식은 늘 맞을 것 같아, 분자 부피와 인력이 무시 못 할 조건이 따로 있다는 게 안 보인다.", "an": "이상기체 식은 교통 한산할 때만 맞는 공식: 분자가 빽빽하거나 서로 끌면 어긋난다.", "rd": "이상 기체는 분자 부피·인력을 무시한 모형이다. 그 가정이 깨지는 고압·저온에선 어긋난다.", "tf": "이상 기체 식은 언제 잘 안 맞나? (고압·저온)"}, "GC-070": {"n": "압축 인자", "c": "gc", "u": "물질의상태-기체", "t": "C", "dx": "압축 인자 Z=PV/nRT에서 Z=1이 이상 기체 기준이라는 점을 놓친 경우다. 분자·분모를 뒤집어 1보다 큰지 작은지 해석이 흔들린다.", "fx": "압축 인자를 'Z=PV/nRT, Z=1이 이상 기체 기준'으로 못 박는다. 1보다 큰지 작은지로 분자 부피·인력 중 무엇이 우세한지 해석하라.", "f": "D2", "rk": 541, "d": 4, "rh": 0, "pre": ["GC-069"], "tr": "Z가 또 하나의 복잡한 양 같아, Z=1이 \"이상 기체\"라는 깔끔한 기준선이라는 게 안 잡힌다.", "an": "Z는 실제/이상 눈금: 1이면 딱 이상기체, 1에서 벗어난 만큼 실제기체다.", "rd": "Z=PV/nRT다. 이상 기체면 PV=nRT라 Z=1, 벗어난 정도가 실제 기체성이다.", "tf": "Z가 1보다 작으면 무엇이 우세? (인력)"}, "GC-071": {"n": "이상 기체 근접", "c": "gc", "u": "물질의상태-기체", "t": "C", "dx": "이상 기체에 가까워지는 조건(저압·고온)을 거꾸로 잡은 경우다. 인력이 작고 분자 부피가 무시될 때 이상성에 가까워진다는 점이 빠졌다.", "fx": "'이상 기체에 가까워지는 조건은 저압·고온(인력이 작고 분자 부피가 무시될 때)'임을 못 박는다. 조건을 거꾸로 잡지 마라.", "f": "A1", "rk": 542, "d": 4, "rh": 0, "pre": ["GC-069"], "tr": "이상 기체에 가까우려면 빽빽하고 차가워야 할 것 같은데, 실제로는 저압·고온이라 직관과 반대다.", "an": "분자들이 서로 멀고(저압) 빨라서 인력을 무시할 때(고온) 이상기체에 가깝다: 빽빽·차가움의 반대다.", "rd": "분자가 멀면(저압) 부피·인력이 무시되고 빠르면(고온) 인력을 이긴다. 그래서 저압·고온에서 이상에 가깝다.", "tf": "실제 기체가 이상에 가까운 조건은? (저압·고온)"}, "GC-072": {"n": "반데르발스", "c": "gc", "u": "물질의상태-기체", "t": "C", "dx": "반데르발스 식의 두 보정 항을 헷갈린 경우다. a는 분자 간 인력, b는 분자 자체 부피 보정이라는 대응이 흔들린다.", "fx": "반데르발스 식을 'a는 분자 간 인력, b는 분자 자체 부피 보정'으로 못 박는다. 두 항의 역할을 바꾸지 말고 실제 기체를 해석하라.", "f": "B2", "rk": 543, "d": 4, "rh": 0, "pre": ["GC-069"], "tr": "반데르발스의 두 보정 항이 비슷해 보여, 어느 것이 부피이고 어느 것이 인력인지 섞인다.", "an": "식에 보정 둘: 하나는 차가 차지하는 자리(부피 b), 하나는 서로 끌어 느려짐(인력 a)이다.", "rd": "부피는 분자 자체 부피만큼 빼고(b), 압력은 인력으로 깎이니 더한다(a). 그래서 두 보정 항이 생긴다.", "tf": "반데르발스 a는 무엇을 보정? (인력)"}, "GC-073": {"n": "증기압", "c": "gc", "u": "물질의상태-액체고체용액", "t": "C", "dx": "증기압이 온도와 분자 간 힘으로 정해진다는 점을 놓친 경우다. 고온일수록·인력이 약할수록 증기압이 크다는 방향이 흔들린다.", "fx": "증기압을 '온도와 분자 간 힘으로 정해짐, 고온일수록·인력이 약할수록 큼'으로 못 박는다. 두 인자로 증기압 방향을 잡아라.", "f": "A3", "rk": 26, "d": 0, "rh": 5, "pre": [], "tr": "증기압은 그 액체의 고정 성질 같아, 온도와 분자 간 힘으로 정해진다는 변수성이 안 떠오른다.", "an": "증기압은 액체가 증발하려는 압력: 온도가 높고 분자가 헐겁게 붙을수록 세진다.", "rd": "액체 표면 분자가 탈출하려는 경향이 증기압이다. 온도가 높고 분자 간 힘이 약할수록 잘 탈출해 크다.", "tf": "분자 간 힘이 약한 액체의 증기압은? (큼)"}, "GC-074": {"n": "끓는점", "c": "gc", "u": "물질의상태-액체고체용액", "t": "C", "dx": "끓는점이 증기압=외부 압력이 되는 온도라는 정의를 놓친 경우다. 인력이 강할수록 끓는점이 높고, 외압이 낮으면 끓는점도 낮아진다는 연결이 약하다.", "fx": "끓는점을 '증기압이 외부 압력과 같아지는 온도'로 못 박는다. 인력이 강할수록 끓는점이 높고 외압이 낮으면 끓는점도 낮아짐을 이으라.", "f": "B2", "rk": 113, "d": 1, "rh": 1, "pre": ["GC-073"], "tr": "끓는점은 물질마다 정해진 숫자 같아, 증기압이 외부 압력과 같아지는 \"조건\"이라는 정의가 묻힌다.", "an": "끓는점은 고정 숫자가 아니라 증기압이 바깥 압력을 이기는 조건: 산에선 더 낮은 온도에 끓는다.", "rd": "증기압이 외부 압력과 같아지면 내부에서도 기화한다. 외부 압력이 바뀌면 그 온도도 바뀐다.", "tf": "산 정상에서 물이 100℃ 아래서 끓는 이유는? (외부 압력 낮음)"}, "GC-075": {"n": "점도·표면장력", "c": "gc", "u": "물질의상태-액체고체용액", "t": "C", "dx": "점도·표면장력이 모두 분자 간 인력에서 나온다는 공통 뿌리를 놓친 경우다. 인력이 강할수록 흐름 저항·표면장력이 크다는 방향이 흔들린다.", "fx": "'점도·표면장력은 모두 분자 간 인력에서 나옴, 인력이 강할수록 흐름 저항·표면장력이 큼'을 못 박는다. 공통 뿌리를 잡아 함께 설명하라.", "f": "B3", "rk": 27, "d": 0, "rh": 1, "pre": [], "tr": "점도와 표면장력이 서로 다른 현상 같아, 둘 다 분자 간 인력이라는 한 뿌리에서 나온다는 게 안 보인다.", "an": "점성과 표면장력은 한 뿌리(분자 간 인력)에서 난 두 가지: 끈끈할수록 막도 질기다.", "rd": "점성과 표면장력 둘 다 분자 간 인력에서 나온다. 인력이 셀수록 흐름을 막고 표면을 당긴다.", "tf": "물방울이 둥근 이유는? (표면장력, 분자 간 인력)"}, "GC-076": {"n": "점도", "c": "gc", "u": "물질의상태-액체고체용액", "t": "C", "dx": "점도가 흐름에 대한 저항이고 분자 간 인력이 클수록 커진다는 점을 놓친 경우다. 인력과 미끄러짐의 방향이 뒤집혔다.", "fx": "점도를 '흐름에 대한 저항이고 분자 간 인력이 클수록 큼'으로 못 박는다. 인력과 미끄러짐의 방향을 뒤집지 마라.", "f": "B3", "rk": 114, "d": 1, "rh": 0, "pre": ["GC-075"], "tr": "점도는 그냥 끈적함 같아, 분자 간 인력이 클수록 흐름을 더 막는다는 인과가 약하다.", "an": "점성은 분자끼리 손잡은 정도: 세게 잡을수록 잘 안 흐른다(꿀 vs 물).", "rd": "분자끼리 잘 붙들수록 층이 미끄러지기 어렵다. 그래서 분자 간 힘이 클수록 점성이 크다.", "tf": "꿀이 물보다 점성이 큰 이유는? (분자 간 힘이 강함)"}, "GC-077": {"n": "이온 결정", "c": "gc", "u": "물질의상태-액체고체용액", "t": "C", "dx": "이온 결정의 단단함·높은 녹는점이 강한 정전 인력에서 온다는 점, 그리고 층이 밀릴 때 같은 전하끼리 만나 쪼개진다는 점을 놓친 경우다.", "fx": "이온 결정을 '강한 정전 인력으로 단단하고 녹는점 높음, 층이 밀리면 같은 전하끼리 만나 쪼개짐(취성)'으로 못 박는다. 두 성질을 한 그림으로 잡아라.", "f": "B3", "rk": 821, "d": 10, "rh": 0, "pre": ["GC-043"], "tr": "이온 결정이 단단하니 잘 안 깨질 것 같은데, 같은 전하 층이 만나 오히려 쪼개진다는 게 의외로 다가온다.", "an": "망치로 치면 층이 한 칸 밀려 (+)와 (+)가 마주쳐 튕긴다: 단단해도 한순간에 쪼개진다.", "rd": "층이 한 칸 어긋나면 같은 전하끼리 마주쳐 강하게 반발한다. 그래서 단단해도 충격에 쪼개진다.", "tf": "소금 결정을 치면 부서지는 이유는? (층 밀려 같은 전하 반발)"}, "GC-078": {"n": "단위 세포", "c": "gc", "u": "물질의상태-액체고체용액", "t": "C", "dx": "단위 세포당 입자 수를 헷갈린 경우다. 단순입방(SC) 1·체심입방(BCC) 2·면심입방(FCC) 4라는 셈(꼭짓점 1/8·면 1/2·체심 1)이 안 잡혔다.", "fx": "단위 세포당 입자 수를 '단순입방(SC) 1·체심입방(BCC) 2·면심입방(FCC) 4'로 못 박는다. 꼭짓점 1/8·면 1/2·체심 1로 직접 세어 확인하라.", "f": "D3", "rk": 28, "d": 0, "rh": 0, "pre": [], "tr": "단위 세포 안 입자를 통째로 셀 것 같아, 모서리·면의 입자를 쪼개 나눠 센다는 게 빠진다.", "an": "모서리 입자는 여러 세포가 나눠 갖는 공유 벽돌: 통째로 세지 말고 몫만큼 쪼개 센다.", "rd": "꼭짓점·모서리·면의 입자는 이웃 세포와 나눠 갖는다. 그 몫(1/8·1/4·1/2)만 세야 한 세포 입자 수다.", "tf": "꼭짓점 입자는 한 세포에 몇 개로 세나? (1/8)"}, "GC-079": {"n": "상평형 그림", "c": "gc", "u": "물질의상태-액체고체용액", "t": "C", "dx": "상평형 그림의 축(온도·압력)과 삼중점·임계점의 의미를 놓친 경우다. 삼중점은 세 상 공존, 임계점은 액체-기체 경계의 끝이라는 점이 흔들린다.", "fx": "상평형 그림을 '축은 온도·압력, 삼중점은 세 상 공존, 임계점은 액체-기체 경계의 끝'으로 못 박는다. 두 특이점의 의미를 잡아 그림을 읽어라.", "f": "D3", "rk": 228, "d": 2, "rh": 0, "pre": ["GC-074"], "tr": "상평형 그림이 그냥 영역 나눈 지도 같아, 축(온도·압력)과 삼중점·임계점의 의미가 안 읽힌다.", "an": "상평형도는 온도·압력 좌표 위 지도: 영역은 고체·액체·기체, 경계선은 공존, 삼중점은 셋이 만나는 곳이다.", "rd": "온도·압력에 따라 가장 안정한 상이 정해진다. 경계선은 두 상이 공존하는 조건이다.", "tf": "삼중점은 무엇이 만나는 점? (고체·액체·기체 셋)"}, "GC-080": {"n": "몰랄 농도", "c": "gc", "u": "물질의상태-액체고체용액", "t": "C", "dx": "몰랄 농도(용매 1 kg당 용질 mol)와 몰 농도(용액 1 L당 mol)를 섞은 경우다. 질량 기준이라 온도에 안 변한다는 몰랄의 장점이 빠졌다.", "fx": "몰랄 농도를 '용매 1 kg당 용질 mol이라 온도에 안 변함, 몰 농도(용액 1 L당 mol)와 별개'로 못 박는다. 질량 기준이라는 장점을 총괄성에 써라.", "f": "B2", "rk": 229, "d": 2, "rh": 9, "pre": ["GC-002"], "tr": "농도는 다 비슷한 진하기 같아, 몰랄(용매 kg)과 몰(용액 L)의 기준이 다르다는 게 흐려진다.", "an": "몰랄은 용매 1 kg에 몇 mol, 몰농도는 용액 1 L에 몇 mol: 분모가 무게냐 부피냐로 갈린다.", "rd": "몰랄은 용매 kg, 몰농도는 용액 L가 분모다. 무엇을 기준으로 얼마나 녹았나를 재느냐가 다르다.", "tf": "몰랄의 분모는 용매와 용액 중? (용매 질량)"}, "GC-081": {"n": "헨리 법칙", "c": "gc", "u": "물질의상태-액체고체용액", "t": "A", "dx": "기체의 용해도가 그 기체의 부분 압력에 비례한다는 헨리 법칙을 놓친 경우다. 압력이 클수록·저온일수록 더 녹는다는 방향이 흔들린다.", "fx": "헨리 법칙을 '기체의 용해도가 그 기체의 부분 압력에 비례'로 못 박는다. 압력이 클수록·저온일수록 더 녹는 방향을 잡아라.", "f": "A2", "rk": 115, "d": 1, "rh": 0, "pre": ["GC-073"], "tr": "기체 용해도가 막연히 압력과 관련 있을 것 같아, 부분 압력에 \"비례\"한다는 형태가 안 잡힌다.", "an": "탄산음료처럼 누를수록 더 녹는다: 기체 용해도가 분압에 비례한다.", "rd": "압력이 높으면 기체 분자가 액면을 더 자주 때려 더 녹는다. 그래서 용해도가 분압에 비례한다(헨리).", "tf": "탄산음료에 압력을 높이면 기체 용해도는? (증가: 헨리)"}, "GC-082": {"n": "총괄성", "c": "gc", "u": "물질의상태-액체고체용액", "t": "A", "dx": "총괄성이 용질 입자의 종류가 아니라 개수에 의존한다는 핵심을 놓친 경우다. 전해질은 이온으로 나뉘어 입자 수가 늘어난다는 점이 빠졌다.", "fx": "총괄성을 '용질 입자의 종류가 아니라 개수에 의존'으로 못 박는다. 전해질은 이온으로 나뉘어 입자 수가 늚을 잡아 반트호프 인자를 반영하라.", "f": "A3", "rk": 377, "d": 3, "rh": 8, "pre": ["GC-080"], "tr": "총괄성이 용질이 무엇이냐에 달렸을 것 같아, 종류가 아니라 입자 \"개수\"만 본다는 핵심이 묻힌다.", "an": "총괄성은 머릿수 정치: 용질이 설탕이든 소금이든 녹은 입자 개수만 따진다.", "rd": "용질 입자가 용매 거동을 방해하는 효과다. 방해는 입자 수에 달려 종류와 무관하다.", "tf": "설탕 1몰과 포도당 1몰의 끓는점 오름이 같나? (같다: 입자 수)"}, "GC-083": {"n": "라울 법칙", "c": "gc", "u": "물질의상태-액체고체용액", "t": "C", "dx": "용액의 증기압이 용매 몰분율에 비례한다(라울)는 점을 놓친 경우다. 용질이 늘면 용매 몰분율이 1보다 작아져 증기압이 내려간다는 흐름이 약하다.", "fx": "라울 법칙을 '용액의 증기압이 용매 몰분율에 비례'로 못 박는다. 용질이 늘면 용매 몰분율이 1보다 작아져 증기압이 내려감을 잡아라.", "f": "A2", "rk": 544, "d": 4, "rh": 1, "pre": ["GC-073", "GC-082"], "tr": "용액 증기압도 그냥 줄겠지 싶어, 용매 몰분율에 비례해 정확히 정해진다(라울)는 게 안 잡힌다.", "an": "표면에 용질이 끼면 용매가 나갈 자리가 줄어 증기압이 준다: 용매 몰분율만큼 정확히.", "rd": "표면 일부를 용질이 차지하면 용매가 증발할 자리가 준다. 그래서 용매 몰분율만큼 증기압이 내린다(라울).", "tf": "물에 소금을 녹이면 증기압은? (내림: 표면 자리 차지)"}, "GC-100": {"n": "ΔH 부호", "c": "gc", "u": "열역학-엔탈피엔트로피", "t": "C", "dx": "ΔH 부호와 발열·흡열의 대응을 헷갈린 경우다. 발열은 ΔH<0(엔탈피 감소), 흡열은 ΔH>0이라는 약속이 흔들린다.", "fx": "'발열은 ΔH<0(엔탈피 감소), 흡열은 ΔH>0'을 못 박는다. 열 출입 방향과 부호를 짝지어 열화학식의 부호를 맞춰라.", "f": "C2", "rk": 233, "d": 2, "rh": 3, "pre": ["GC-099"], "tr": "ΔH 부호가 발열인지 흡열인지 매번 헷갈려, 음이 발열이라는 대응이 흔들린다.", "an": "발열은 에너지를 내놓아 잔액 감소(ΔH<0), 흡열은 받아 증가(ΔH>0)다.", "rd": "발열은 에너지를 내놓아 H가 줄어 ΔH<0, 흡열은 받아 ΔH>0이다.", "tf": "발열 반응의 ΔH 부호는? (음)"}, "GC-101": {"n": "표준 생성 엔탈피", "c": "gc", "u": "열역학-엔탈피엔트로피", "t": "C", "dx": "표준 생성 엔탈피에서 기준(가장 안정한 홑원소 물질=0)을 놓친 경우다. 화합물은 0이 아니며, 생성(분해 아님) 반응 기준이라는 점이 약하다.", "fx": "표준 생성 엔탈피를 '가장 안정한 홑원소 물질 = 0, 화합물은 0이 아니고 생성(분해 아님) 반응 기준'으로 못 박는다. 홑원소 0을 기준점으로 반응엔탈피를 구하라.", "f": "D2", "rk": 234, "d": 2, "rh": 1, "pre": ["GC-099"], "tr": "생성 엔탈피의 기준 0이 임의 같아, 가장 안정한 홑원소가 0이라는 약속이 묻힌다.", "an": "가장 안정한 홑원소를 해발 0 m로 정함: 화합물 높이는 거기서 잰다.", "rd": "비교 기준이 필요하니 가장 안정한 홑원소를 0으로 약속한다. 화합물 엔탈피는 거기서 잰다.", "tf": "O₂의 표준 생성 엔탈피는? (0: 안정한 홑원소)"}, "GC-102": {"n": "반응엔탈피 계산", "c": "gc", "u": "열역학-엔탈피엔트로피", "t": "C", "dx": "반응엔탈피를 (생성물 생성엔탈피 합) - (반응물 생성엔탈피 합)으로 계산하고, 각 항에 계수(몰수)를 곱한다는 절차를 놓친 경우다.", "fx": "반응엔탈피를 '(생성물 생성엔탈피 합) − (반응물 생성엔탈피 합), 각 항에 계수 곱'으로 못 박는다. 계수 반영을 빼먹지 말고 계산하라.", "f": "D3", "rk": 379, "d": 3, "rh": 0, "pre": ["GC-101"], "tr": "반응엔탈피를 그냥 빼면 될 것 같아, 각 항에 계수를 곱해야 한다는 단계가 빠진다.", "an": "각 물질을 계수만큼 곱해 더하고 뺀다: 장 본 개수만큼 값을 곱하는 셈이다.", "rd": "각 물질 엔탈피에 계수를 곱해 (생성물-반응물)로 더하고 뺀다.", "tf": "반응엔탈피는 생성 엔탈피로 어떻게? (생성물-반응물, 계수 곱)"}, "GC-103": {"n": "헤스 법칙", "c": "gc", "u": "열역학-엔탈피엔트로피", "t": "C", "dx": "엔탈피가 상태 함수라 경로와 무관하다는 헤스 법칙을 놓친 경우다. 반응을 더하거나 뒤집으면 ΔH도 같이 더해지고 부호가 바뀐다는 점이 흔들린다.", "fx": "헤스 법칙을 '엔탈피가 상태 함수라 경로와 무관, 반응을 더하면 ΔH도 더해지고 뒤집으면 부호가 바뀜'으로 못 박는다. 이 조합 규칙으로 다단계 ΔH를 구하라.", "f": "A3", "rk": 235, "d": 2, "rh": 0, "pre": ["GC-099"], "tr": "엔탈피가 어떻게 가느냐에 달릴 것 같아, 경로와 무관하다(헤스)는 게 안 잡힌다.", "an": "산 정상 높이는 어느 등산로로 갔든 같다: 반응엔탈피는 경로와 무관하다(헤스).", "rd": "엔탈피는 상태 함수라 경로 무관이다. 그래서 단계로 쪼개 ΔH를 더해도 같다(헤스).", "tf": "경로가 달라도 반응엔탈피가 같은 법칙은? (헤스)"}, "GC-104": {"n": "결합 에너지", "c": "gc", "u": "열역학-엔탈피엔트로피", "t": "C", "dx": "결합을 끊는 데 에너지를 흡수(흡열)하고 만들 때 방출(발열)한다는 방향을 놓친 경우다. 반응엔탈피를 (끊은 결합 합) - (만든 결합 합)으로 보는 틀이 약하다.", "fx": "'결합을 끊는 데 에너지를 흡수(흡열), 만들 때 방출(발열)'을 못 박는다. 반응엔탈피를 (끊은 결합 합) − (만든 결합 합)으로 구하라.", "f": "A1", "rk": 839, "d": 11, "rh": 0, "pre": ["GC-046", "GC-100"], "tr": "결합은 에너지를 품고 있는 것 같아, 끊으면 그 갇힌 에너지가 풀려 나온다(발열)는 그림이 자연스럽다.", "an": "결합은 품은 에너지가 아니라 자석이 철컥 붙은 상태: 떼려면 힘을 들이고(흡열), 붙을 때 에너지가 나온다(발열).", "rd": "결합은 에너지가 낮은(안정한) 상태다. 만들면 에너지가 남아 발열, 끊으려면 넣어야 해 흡열이다.", "tf": "결합을 끊는 건 흡열인가 발열인가? (흡열)"}, "GC-105": {"n": "엔트로피", "c": "gc", "u": "열역학-엔탈피엔트로피", "t": "C", "dx": "엔트로피가 무질서도(미시 상태 수)와 같은 방향이고 기체에서 가장 크다는 점을 놓친 경우다. 상태 함수라는 점도 흔들린다.", "fx": "엔트로피를 '무질서도(미시 상태 수)와 같은 방향이고 기체에서 가장 큰 상태 함수'로 못 박는다. 상태별 크기 비교의 토대로 삼아라.", "f": "B2", "rk": 30, "d": 0, "rh": 10, "pre": [], "tr": "엔트로피가 추상적이라 막연한데, 무질서도와 같은 방향이고 기체에서 최대라는 게 안 잡힌다.", "an": "엔트로피는 방이 어질러진 정도: 기체처럼 자유로울수록 크다.", "rd": "가능한 미시 상태 수가 많을수록 무질서하다. 기체처럼 자유로울수록 상태 수가 많아 엔트로피가 크다.", "tf": "기체와 고체 중 엔트로피가 큰 건? (기체)"}, "GC-106": {"n": "제2법칙", "c": "gc", "u": "열역학-엔탈피엔트로피", "t": "C", "dx": "고립계(또는 계+주위)의 전체 엔트로피가 자발 과정에서 증가한다는 제2법칙을 놓친 경우다. 계만 보지 않고 주위 변화까지 합쳐 판단해야 한다는 점이 약하다.", "fx": "제2법칙을 '고립계(또는 계+주위)의 전체 엔트로피가 자발 과정에서 증가'로 못 박는다. 계만 보지 말고 주위 변화까지 합쳐 판단하라.", "f": "A1", "rk": 118, "d": 1, "rh": 0, "pre": ["GC-105"], "tr": "무질서는 계만 보면 될 것 같아, 계+주위 전체가 증가한다는 제2법칙의 범위가 빠진다.", "an": "내 방을 치워도 그 쓰레기가 밖으로 나갈 뿐: 계+주위 전체 무질서는 늘어난다.", "rd": "자발 과정은 우주 전체 무질서를 늘린다. 계만 줄어도 주위가 더 늘면 전체는 증가한다.", "tf": "냉장고가 안을 식혀도 우주 엔트로피는? (증가)"}, "GC-107": {"n": "제3법칙", "c": "gc", "u": "열역학-엔탈피엔트로피", "t": "C", "dx": "완전한 결정이 0 K에서 엔트로피 0(배열이 하나뿐)이라는 제3법칙을 놓친 경우다. 0 K에서 최대가 아니라 0이라는 방향이 흔들린다.", "fx": "제3법칙을 '완전한 결정은 0 K에서 엔트로피 0(배열이 하나뿐)'으로 못 박는다. 0 K에서 최대가 아니라 0임을 새겨라.", "f": "D2", "rk": 119, "d": 1, "rh": 0, "pre": ["GC-105"], "tr": "0 K에서도 엔트로피가 남을 것 같은데, 완전한 결정은 배열이 하나뿐이라 0이라는 게 의외로 다가온다.", "an": "완전한 결정은 0 K에서 배열이 단 하나: 어질러질 여지가 없어 엔트로피가 0이다.", "rd": "완전한 결정은 0 K에서 배열이 단 하나(미시 상태 1)다. ln1=0이라 엔트로피가 0이다.", "tf": "완전한 결정의 0 K 엔트로피는? (0)"}, "GC-108": {"n": "엔트로피 변화", "c": "gc", "u": "열역학-엔탈피엔트로피", "t": "C", "dx": "상태 변화에서 엔트로피 방향(고체<액체<기체, 입자 운동·무질서 증가)을 놓친 경우다. 기체화·용해처럼 배열 수가 느는 쪽이 ΔS>0이라는 감이 약하다.", "fx": "엔트로피 변화 방향을 '고체<액체<기체, 입자 운동·무질서가 늘수록 큼'으로 못 박는다. 기체화·용해처럼 배열 수가 느는 쪽이 ΔS>0임을 잡아라.", "f": "A1", "rk": 120, "d": 1, "rh": 1, "pre": ["GC-105"], "tr": "상태 변화의 엔트로피 방향이 헷갈려, 고체<액체<기체로 커진다는 순서가 흔들린다.", "an": "고체(줄 맞춘 교실)<액체(쉬는 시간)<기체(운동장): 자유로울수록 무질서가 크다.", "rd": "입자의 자유도가 클수록 엔트로피가 크다. 그래서 고체<액체<기체다.", "tf": "물이 얼면 엔트로피는? (감소)"}, "GC-092": {"n": "내부 에너지", "c": "gc", "u": "열역학-1법칙", "t": "C", "dx": "내부 에너지 U가 상태 함수라 경로가 아니라 처음·끝 상태로만 정해진다는 점을 놓친 경우다. 경로에 따라 값이 달라진다고 본 것이 오류다.", "fx": "내부 에너지 U를 '상태 함수라 경로가 아니라 처음·끝 상태로만 정해짐'으로 못 박는다. 경로에 따라 값이 달라진다고 보지 마라.", "f": "B2", "rk": 29, "d": 0, "rh": 19, "pre": [], "tr": "내부 에너지가 경로에 따라 달라질 것 같아, 처음과 끝 상태로만 정해지는 상태 함수라는 게 안 잡힌다.", "an": "내부에너지는 통장 잔액: 어떤 경로로 채웠든 지금 잔액만 정해진 상태 함수다.", "rd": "내부에너지는 상태 함수라 경로가 아니라 현재 상태로만 정해진다. 그래서 처음과 끝만 알면 변화량이 나온다.", "tf": "내부에너지는 경로에 따라 다른가? (아니다: 상태 함수)"}, "GC-093": {"n": "제1법칙", "c": "gc", "u": "열역학-1법칙", "t": "B", "dx": "ΔU = q + w(에너지 보존)에서 부호 규약(계가 받는 열·일을 양으로)을 놓친 경우다. 열과 일을 통한 에너지 출입의 총합이 내부 에너지 변화라는 틀이 흔들린다.", "fx": "제1법칙을 'ΔU = q + w(에너지 보존), 계가 받는 열·일을 양으로'로 못 박는다. 열과 일을 통한 에너지 출입의 총합이 내부 에너지 변화임을 잡아라.", "f": "C2", "rk": 116, "d": 1, "rh": 5, "pre": ["GC-092"], "tr": "ΔU=q+w에서 부호를 어디 붙일지 막막해, 계가 받는 열·일을 양으로 본다는 약속이 흐려진다.", "an": "잔액 변화 = 들어온 열 + 받은 일: 계로 들어오면 +, 나가면 -의 부호 약속이다.", "rd": "에너지 보존이다. 계의 에너지 변화는 들어온 열과 받은 일의 합(ΔU=q+w)이다.", "tf": "계가 열을 받고 일도 받으면 ΔU는? (둘 다 더해 증가)"}, "GC-094": {"n": "부호 규약", "c": "gc", "u": "열역학-1법칙", "t": "C", "dx": "열의 부호 규약을 헷갈린 경우다. 계가 흡수하면 q>0, 방출하면 q<0이라는 약속이 정리되지 않았다.", "fx": "열의 부호 규약을 '계가 흡수하면 q>0, 방출하면 q<0'으로 못 박는다. 흡수·방출 방향을 부호로 옮겨라.", "f": "C2", "rk": 230, "d": 2, "rh": 2, "pre": ["GC-093"], "tr": "열은 그냥 양수일 것 같아, 계가 내보내면 음이라는 부호 약속이 헷갈린다.", "an": "계가 열을 받으면 입금(+), 내보내면 출금(-): 통장 부호와 같다.", "rd": "계 중심으로 본다. 계로 들어오면 +(흡열), 나가면 -(발열)로 약속한다.", "tf": "계가 열을 방출하면 q 부호는? (음)"}, "GC-095": {"n": "일의 부호", "c": "gc", "u": "열역학-1법칙", "t": "C", "dx": "일의 부호 규약을 헷갈린 경우다. 계가 일을 받으면 w>0, 계가 일을 하면(팽창) w<0이라는 약속이 흔들린다.", "fx": "일의 부호 규약을 '계가 일을 받으면 w>0, 계가 일을 하면(팽창) w<0'으로 못 박는다. 팽창이 일을 내보냄을 부호로 잡아라.", "f": "C2", "rk": 378, "d": 3, "rh": 1, "pre": ["GC-093", "GC-094"], "tr": "일도 그냥 양수일 것 같아, 계가 외부에 하면 음이라는 약속이 헷갈린다.", "an": "계가 일을 받으면 +, 외부에 일을 하면 -: 받음/베풂의 부호다.", "rd": "계 중심으로 본다. 계가 받으면 +, 외부에 하면 -로 약속한다.", "tf": "계가 외부에 일을 하면 w 부호는? (음)"}, "GC-096": {"n": "정적 과정", "c": "gc", "u": "열역학-1법칙", "t": "C", "dx": "정적 과정(ΔV=0)에서 한 일이 0이라 q가 곧 ΔU라는 점을 놓친 경우다. 정압의 q=ΔH와 정적의 q=ΔU를 뒤섞었다.", "fx": "정적 과정을 'ΔV=0이라 한 일이 0이라 q가 곧 ΔU'로 못 박는다. 정압의 q=ΔH와 정적의 q=ΔU를 뒤섞지 마라.", "f": "D2", "rk": 231, "d": 2, "rh": 0, "pre": ["GC-093"], "tr": "부피가 안 변해도 무언가 일을 할 것 같은데, ΔV=0이면 일이 0이라 q가 곧 ΔU라는 게 빠진다.", "an": "부피가 안 변하면 외부에 미는 일이 0: 통장에 열만 들고 나(q=ΔU).", "rd": "부피가 안 변하면 PΔV=0이라 일이 0이다. 그래서 q가 곧 ΔU다.", "tf": "부피 고정이면 q는 무엇과 같나? (ΔU)"}, "GC-097": {"n": "정압 과정", "c": "gc", "u": "열역학-1법칙", "t": "C", "dx": "정압 과정의 열이 엔탈피 변화 ΔH와 같다는 점을 놓친 경우다. 압력이 일정해도 부피는 변해 팽창 일이 생긴다는 점이 흔들린다.", "fx": "정압 과정의 열을 '엔탈피 변화 ΔH와 같음'으로 못 박는다. 압력이 일정해도 부피는 변해 팽창 일이 생김을 잡아라.", "f": "D2", "rk": 232, "d": 2, "rh": 0, "pre": ["GC-093", "GC-099"], "tr": "정압에서 주고받는 열이 그냥 열일 것 같아, 그것이 엔탈피 변화 ΔH와 같다는 동일시가 안 잡힌다.", "an": "정압에서 주고받는 열이 곧 엔탈피 변화: ΔH는 정압 영수증이다.", "rd": "정압에서 q=ΔU+PΔV=Δ(U+PV)=ΔH다. 그래서 정압의 열이 엔탈피 변화다.", "tf": "정압에서 흡수한 열은 무엇? (ΔH)"}, "GC-098": {"n": "팽창과 일", "c": "gc", "u": "열역학-1법칙", "t": "C", "dx": "기체가 팽창할 때 계가 외부에 일을 한다(w<0, 크기 P·ΔV)는 점을 놓친 경우다. 부피가 늘며 에너지가 일로 빠져나간다는 방향이 약하다.", "fx": "'기체가 팽창할 때 계가 외부에 일을 함(w<0, 크기 P·ΔV)'을 못 박는다. 부피가 늘며 에너지가 일로 빠져나가는 방향을 잡아라.", "f": "C2", "rk": 548, "d": 4, "rh": 0, "pre": ["GC-095"], "tr": "기체가 팽창하면 무언가 얻을 것 같은데, 계가 외부에 일을 해서 w가 음(P·ΔV)이라는 방향이 빠진다.", "an": "기체가 팽창하면 외부를 밀어내느라 일을 베푼다(-): 풍선이 부풀며 손을 미는 셈이다.", "rd": "기체가 팽창하면 외부를 밀어 일을 한다. 계가 일을 했으니 w가 음(-PΔV)이다.", "tf": "기체가 팽창하면 일의 부호는? (음: 외부에 함)"}, "GC-099": {"n": "엔탈피 정의", "c": "gc", "u": "열역학-1법칙", "t": "A", "dx": "엔탈피 H = U + PV의 정의를 놓친 경우다. PV를 더한 상태 함수라는 점, 정압에서 q와 같아지는 이유가 흔들린다.", "fx": "엔탈피를 'H = U + PV'로 못 박는다. PV를 더한 상태 함수임을 잡아 정압에서 q와 같아지는 이유로 이어라.", "f": "D3", "rk": 117, "d": 1, "rh": 13, "pre": ["GC-092"], "tr": "엔탈피가 새 양 같아 막연한데, H=U+PV라는 정의가 안 떠오른다.", "an": "엔탈피는 내부에너지에 밀어낸 자리값(PV)을 더한 것: H=U+PV다.", "rd": "정압 과정을 다루기 쉽게 H=U+PV로 정의한다. 그래서 정압의 열이 ΔH가 된다.", "tf": "엔탈피는 U에 무엇을 더한 것? (PV)"}, "GC-109": {"n": "자유 에너지", "c": "gc", "u": "열역학

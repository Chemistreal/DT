조건에서만 성립한다는 점이 약하면 적용 범위를 잘못 잡는다.", "fx": "'헨리 법칙은 물에 잘 녹거나 반응하는 기체(HCl·NH₃)에는 잘 맞지 않음'을 못 박는다. 이상적 조건에서만 성립함을 잡아 적용 범위를 가려라.", "f": "D1", "rk": 493, "d": 4, "rh": 0, "pre": ["CH2-222"], "tr": "헨리가 모든 기체에 맞을 것 같아, 물에 잘 녹거나 반응하는 HCl·NH₃엔 잘 안 맞는다는 게 빠진다.", "an": "물에 잘 녹거나 반응하는 HCl·NH₃엔 잘 안 맞는다.", "rd": "물에 잘 녹거나 반응하면 단순 비례가 깨진다. 그래서 HCl·NH₃엔 안 맞는다.", "tf": "헨리가 잘 안 맞는 기체는? (HCl, NH₃)"}, "CH2-229": {"n": "온도와 기체 용해도", "c": "ch2", "u": "용해", "t": "C", "dx": "기체 용해가 발열이라 온도가 높을수록 덜 녹는다는 점을 놓친 경우다. 이 경향이 약하면 수온이 오르면 물속 산소가 줄어드는 환경 문제로 이어지지 못한다.", "fx": "'기체 용해는 발열이라 온도가 높을수록 덜 녹음'을 못 박는다. 이 경향으로 수온이 오르면 물속 산소가 줄어드는 환경 문제로 이어라.", "f": "A1", "rk": 494, "d": 4, "rh": 0, "pre": ["CH2-221"], "tr": "기체도 데우면 더 녹을 것 같아, 발열이라 높을수록 덜 녹는다는 게 거꾸로 느껴진다.", "an": "기체는 발열이라 데우면 덜 녹는다(거꾸로).", "rd": "기체 용해는 발열이라 데우면 덜 녹는다(거꾸로).", "tf": "기체는 데우면? (덜 녹음)"}, "CH2-230": {"n": "용해 평형", "c": "ch2", "u": "용해", "t": "C", "dx": "용해 평형이 용해와 석출 속도가 같은 포화 상태의 동적 평형이라는 점을 놓친 경우다. 동적 본질이 약하면 포화 용액에서 일어나는 일을 잘못 그린다.", "fx": "용해 평형을 '용해와 석출 속도가 같은 포화 상태의 동적 평형'으로 못 박는다. 동적 본질을 잡아 포화 용액에서 일어나는 일을 그려라.", "f": "E1", "rk": 495, "d": 4, "rh": 0, "pre": ["CH2-218"], "tr": "용해 평형이 막연해, 용해·석출 속도가 같은 포화의 동적 평형이라는 게 빠진다.", "an": "용해·석출 속도가 같은 포화의 동적 평형이다.", "rd": "용해와 석출 속도가 같은 포화의 동적 평형이다.", "tf": "포화의 동적 평형은? (용해 평형)"}, "CH2-337": {"n": "화학 전지", "c": "ch2", "u": "전기화학", "t": "C", "dx": "화학 전지가 자발적인 산화환원 반응의 화학 에너지를 전기 에너지로 바꾸는 장치라는 점을 놓친 경우다. 자발 반응이 전기를 만든다는 점이 약하면 전기분해와 구분하지 못한다.", "fx": "화학 전지를 '자발적인 산화환원 반응의 화학 에너지를 전기 에너지로 바꾸는 장치'로 못 박는다. 자발 반응이 전기를 만듦을 잡아 전기분해와 구분하라.", "f": "B2", "rk": 526, "d": 4, "rh": 11, "pre": ["CH2-326", "CH2-197"], "tr": "전지가 그냥 전기 만드는 장치 같아, 자발적 산화환원의 화학 에너지를 전기로 바꾼다는 게 빠진다.", "an": "전지는 자발적 산화환원의 화학 에너지를 전기로 바꾸는 발전기다.", "rd": "자발적 산화환원에서 전자가 도선을 흐르면 전류다. 그 화학 에너지를 전기로 뽑는다.", "tf": "자발 반응의 화학 에너지를 전기로 바꾸는 건? (화학 전지)"}, "CH2-338": {"n": "전극 반응", "c": "ch2", "u": "전기화학", "t": "C", "dx": "산화전극에서는 산화, 환원전극에서는 환원이 일어난다는 점을 놓친 경우다(이름과 일어나는 반응이 같음). 어느 전극에서 무엇이 일어나는지가 약하면 전극 극성·전자 흐름이 어긋난다.", "fx": "'산화전극에서는 산화, 환원전극에서는 환원(이름과 반응이 같음)'을 못 박는다. 어느 전극에서 무엇이 일어나는지로 전극 극성·전자 흐름을 잡아라.", "f": "B1", "rk": 642, "d": 5, "rh": 3, "pre": ["CH2-337"], "tr": "어느 전극서 뭐가 일어나는지 헷갈려, 산화전극서 산화·환원전극서 환원(이름대로)이라는 게 빠진다.", "an": "산화전극서 산화, 환원전극서 환원: 이름대로다.", "rd": "산화전극에서 산화, 환원전극에서 환원이 일어난다. 이름대로다.", "tf": "산화전극에서 일어나는 반응은? (산화)"}, "CH2-339": {"n": "전극 극성", "c": "ch2", "u": "전기화학", "t": "C", "dx": "화학 전지에서 산화전극이 (-)극, 환원전극이 (+)극이라는 점을 놓친 경우다. 극성을 뒤집으면 전자가 어디로 흐르는지, 전지 전위 계산이 통째로 어긋난다.", "fx": "화학 전지에서 '산화전극이 (-)극, 환원전극이 (+)극'임을 못 박는다. 극성을 뒤집지 말고 전자 흐름·전지 전위 계산을 맞춰라.", "f": "B1", "rk": 696, "d": 6, "rh": 1, "pre": ["CH2-338"], "tr": "산화전극이 +일 것 같아, 화학 전지에선 산화전극이 -·환원전극이 +라는 게 흔들린다.", "an": "화학 전지에선 산화전극이 (-), 환원전극이 (+)다.", "rd": "화학 전지는 자발 반응이다. 산화전극에서 전자가 나오니 (-), 환원전극이 (+)다.", "tf": "화학 전지에서 산화전극은? (-)"}, "CH2-340": {"n": "전자 이동", "c": "ch2", "u": "전기화학", "t": "C", "dx": "전자가 산화전극((-)극)에서 도선을 따라 환원전극((+)극)으로 흐른다는 점을 놓친 경우다. 전자 흐름의 방향이 약하면 전류 방향·전극 반응을 잘못 잡는다.", "fx": "'전자가 산화전극((-)극)에서 도선을 따라 환원전극((+)극)으로 흐름'을 못 박는다. 전자 흐름의 방향으로 전류 방향·전극 반응을 잡아라.", "f": "A1", "rk": 733, "d": 7, "rh": 0, "pre": ["CH2-339"], "tr": "전자가 어디로 흐를지 헷갈려, 산화전극(-)에서 환원전극(+)으로 간다는 게 흔들린다.", "an": "전자는 산화전극(-)에서 환원전극(+)으로 간다.", "rd": "전자는 산화전극(전자 생성)에서 환원전극(전자 소비)으로 간다.", "tf": "전자는 어느 전극에서 어느 전극으로? (산화전극에서 환원전극으로)"}, "CH2-341": {"n": "다니엘 전지", "c": "ch2", "u": "전기화학", "t": "C", "dx": "다니엘 전지에서 아연이 산화(산화전극)되고 구리 이온이 환원(환원전극)된다는 점을 놓친 경우다. 어느 금속이 산화·환원되는지가 약하면 전지의 작동을 설명하지 못한다.", "fx": "'다니엘 전지에서 아연이 산화(산화전극)되고 구리 이온이 환원(환원전극)됨'을 못 박는다. 어느 금속이 산화·환원되는지로 전지의 작동을 설명하라.", "f": "B2", "rk": 697, "d": 6, "rh": 0, "pre": ["CH2-338"], "tr": "다니엘 전지서 뭐가 산화되는지 막막해, 아연이 산화·구리 이온이 환원된다는 게 빠진다.", "an": "아연이 산화, 구리 이온이 환원이다.", "rd": "아연이 구리보다 전자를 잘 내놓는다. 그래서 아연이 산화, 구리 이온이 환원이다.", "tf": "다니엘 전지에서 산화되는 금속은? (아연)"}, "CH2-342": {"n": "염다리", "c": "ch2", "u": "전기화학", "t": "C", "dx": "염다리가 이온을 이동시켜 두 반쪽 전지의 전하 균형을 맞춘다는 점을 놓친 경우다. 전하 균형이 없으면 전류가 곧 끊긴다는 점이 약하면 염다리의 역할을 못 짚는다.", "fx": "염다리를 '이온을 이동시켜 두 반쪽 전지의 전하 균형을 맞춤'으로 못 박는다. 전하 균형이 없으면 전류가 곧 끊김을 잡아 염다리의 역할을 짚어라.", "f": "B3", "rk": 643, "d": 5, "rh": 0, "pre": ["CH2-337"], "tr": "염다리가 장식 같아, 이온을 옮겨 두 반쪽 전지의 전하 균형을 맞춘다는 게 빠진다.", "an": "이온을 옮겨 두 반쪽 전지의 전하 균형을 맞춘다.", "rd": "반응으로 한쪽에 전하가 쌓인다. 염다리가 이온을 옮겨 균형을 맞춰 회로를 잇는다.", "tf": "전하 균형을 맞추는 건? (염다리)"}, "CH2-343": {"n": "표준 수소 전극", "c": "ch2", "u": "전기화학", "t": "C", "dx": "표준 수소 전극이 전위를 0 V로 정한 기준 전극이고 모든 표준 전위가 이에 대한 상대값이라는 점을 놓친 경우다. 기준이 흐리면 표준 환원 전위의 의미를 못 짚는다.", "fx": "표준 수소 전극을 '전위를 0 V로 정한 기준 전극, 모든 표준 전위가 이에 대한 상대값'으로 못 박는다. 기준을 잡아 표준 환원 전위의 의미를 짚어라.", "f": "D2", "rk": 644, "d": 5, "rh": 4, "pre": ["CH2-337"], "tr": "전극 전위가 절대값일 것 같아, 표준 수소 전극을 0 V로 삼은 상대값이라는 게 빠진다.", "an": "전극 전위는 절대값이 아니라 수소 전극을 0 V로 둔 상대값이다.", "rd": "절대 전위는 못 재니 수소 전극을 0 V로 약속한다. 그 상대값으로 잰다.", "tf": "전극 전위 기준 0은? (수소 전극)"}, "CH2-344": {"n": "전지 전위", "c": "ch2", "u": "전기화학", "t": "C", "dx": "전지 전위가 (환원전극의 표준 환원 전위 − 산화전극의 표준 환원 전위)라는 점을 놓친 경우다. 빼는 순서가 약하면 전지 전위의 부호가 뒤집혀 자발성 판단이 어긋난다.", "fx": "전지 전위를 '(환원전극의 표준 환원 전위 − 산화전극의 표준 환원 전위)'로 못 박는다. 빼는 순서를 맞춰 전지 전위의 부호와 자발성 판단을 잡아라.", "f": "D3", "rk": 698, "d": 6, "rh": 1, "pre": ["CH2-343"], "tr": "전지 전위를 더할 것 같아, (환원전극-산화전극)의 표준 환원 전위 차라는 게 빠진다.", "an": "(환원전극-산화전극)의 표준 환원 전위 차다.", "rd": "전지 전위=(환원전극-산화전극)의 표준 환원 전위 차다.", "tf": "전지 전위=환원전극 빼기 무엇? (산화전극)"}, "CH2-345": {"n": "자발성", "c": "ch2", "u": "전기화학", "t": "C", "dx": "전지 전위가 양수면 자발적 반응이라는 점을 놓친 경우다. 부호가 자발성을 정한다는 점이 약하면 그 반응이 전지로 작동할지 전기분해가 필요한지 못 가린다.", "fx": "'전지 전위가 양수면 자발적 반응'임을 못 박는다. 부호가 자발성을 정함을 잡아 전지로 작동할지 전기분해가 필요한지 가려라.", "f": "C2", "rk": 734, "d": 7, "rh": 0, "pre": ["CH2-344"], "tr": "전위 부호와 자발성이 막연해, 양수면 자발적 반응이라는 게 빠진다.", "an": "전위가 양수면 자발적 반응이다.", "rd": "전위가 양수면 ΔG가 음이다. 그래서 자발적 반응이다.", "tf": "전위가 양수면? (자발)"}, "CH2-346": {"n": "표준 환원 전위", "c": "ch2", "u": "전기화학", "t": "C", "dx": "표준 환원 전위가 클수록 환원되기 쉽다는 점을 놓친 경우다. 전위로 환원되기 쉬운 정도를 못 읽으면 어느 물질이 환원전극이 되는지, 산화제 세기를 못 가린다.", "fx": "'표준 환원 전위가 클수록 환원되기 쉬움'을 못 박는다. 전위로 어느 물질이 환원전극이 되는지, 산화제 세기를 가려라.", "f": "C1", "rk": 699, "d": 6, "rh": 1, "pre": ["CH2-343"], "tr": "환원 전위가 크면 뭐가 잘 되는지 막막해, 클수록 환원되기 쉽다는 게 빠진다.", "an": "환원 전위가 클수록 환원되기 쉽다.", "rd": "환원 전위가 클수록 환원이 잘 된다.", "tf": "환원 전위가 크면 환원이? (잘 됨)"}, "CH2-347": {"n": "전기분해", "c": "ch2", "u": "전기화학", "t": "C", "dx": "전기분해가 비자발적 반응을 외부 전원으로 강제로 일으키는 것이라는 점을 놓친 경우다. 외부 전원이 필요하다는 점이 약하면 자발 반응을 쓰는 전지와 혼동한다.", "fx": "전기분해를 '비자발적 반응을 외부 전원으로 강제로 일으키는 것'으로 못 박는다. 외부 전원이 필요함을 잡아 자발 반응을 쓰는 전지와 혼동하지 마라.", "f": "B2", "rk": 527, "d": 4, "rh": 9, "pre": ["CH2-326"], "tr": "전기분해도 그냥 반응 같아, 비자발 반응을 외부 전원으로 강제한다는 게 빠진다.", "an": "전기분해는 비자발 반응을 외부 전원으로 강제: 역발전이다.", "rd": "외부 전원으로 전자를 억지로 밀어 비자발 반응을 일으킨다. 전지의 반대다.", "tf": "전기로 비자발 반응을 강제하는 건? (전기분해)"}, "CH2-348": {"n": "전기분해 전극", "c": "ch2", "u": "전기화학", "t": "C", "dx": "전기분해에서도 산화전극에서 산화, 환원전극에서 환원이 일어나지만 외부 전원에 연결돼 극성은 전지와 반대((+)극이 산화전극)라는 점을 놓친 경우다. 이 차이가 약하면 전기분해 전극 반응을 잘못 잡는다.", "fx": "'전기분해에서도 산화전극에서 산화·환원전극에서 환원이지만 극성은 전지와 반대((+)극이 산화전극)'임을 못 박는다. 이 차이로 전기분해 전극 반응을 잡아라.", "f": "B1", "rk": 645, "d": 5, "rh": 1, "pre": ["CH2-347"], "tr": "전기분해 극성이 전지와 같을 것 같아, 외부 전원에 연결돼 (+)극이 산화전극으로 반대라는 게 빠진다.", "an": "외부 전원에 연결돼 (+)극이 산화전극: 전지와 반대다.", "rd": "외부 전원의 (+)극에 연결돼 그 전극에서 전자가 빠져 산화된다. 그래서 전지와 반대다.", "tf": "전기분해에서 (+)극은 산화인가 환원인가? (산화: 전지와 반대)"}, "CH2-349": {"n": "패러데이 법칙", "c": "ch2", "u": "전기화학", "t": "C", "dx": "전기분해에서 석출되는 물질의 양이 흘려준 전하량에 정비례한다는 패러데이 법칙을 놓친 경우다. 전하량과 석출량의 비례가 약하면 석출량 계산이 막힌다.", "fx": "패러데이 법칙을 '석출되는 물질의 양이 흘려준 전하량에 정비례'로 못 박는다. 전하량과 석출량의 비례로 석출량을 계산하라.", "f": "A2", "rk": 646, "d": 5, "rh": 3, "pre": ["CH2-347"], "tr": "석출량이 시간만 따를 것 같아, 흘린 전하량에 정비례한다(패러데이)는 게 빠진다.", "an": "석출량이 흘린 전하량에 정비례한다.", "rd": "반응한 전자 몰수가 흘린 전하량에 비례한다. 그래서 석출량이 전하량에 비례한다.", "tf": "석출량은 전하량에? (비례)"}, "CH2-350": {"n": "전하량", "c": "ch2", "u": "전기화학", "t": "C", "dx": "전하량 Q를 (전류 I × 시간 t)로 구한다는 점을 놓친 경우다. 이 식이 약하면 전류와 시간에서 흘려준 전하량을 못 구한다.", "fx": "전하량을 'Q = 전류 I × 시간 t'로 못 박는다. 이 식으로 전류와 시간에서 흘려준 전하량을 구하라.", "f": "D3", "rk": 700, "d": 6, "rh": 1, "pre": ["CH2-349"], "tr": "전하량이 막연해, (전류 I×시간 t)로 구한다는 게 빠진다.", "an": "전하량=전류 I×시간 t다.", "rd": "전하량=전류×시간(Q=It)이다.", "tf": "전하량=전류 곱하기 무엇? (시간)"}, "CH2-351": {"n": "패러데이 상수", "c": "ch2", "u": "전기화학", "t": "C", "dx": "패러데이 상수가 전자 1몰의 전하량(약 96500 C)이라는 점을 놓친 경우다. 이 상수가 약하면 전하량을 전자 몰수로 환산하지 못한다.", "fx": "패러데이 상수를 '전자 1몰의 전하량(약 96500 C)'으로 못 박는다. 이 상수로 전하량을 전자 몰수로 환산하라.", "f": "D3", "rk": 701, "d": 6, "rh": 1, "pre": ["CH2-349"], "tr": "패러데이 상수가 임의의 큰 수 같아, 전자 1몰의 전하(약 96500 C)라는 게 빠진다.", "an": "전자 1몰의 전하(약 96500 C): 전자 개수와 전하의 환율이다.", "rd": "전자 1몰의 전하다. 전자 6.02×10²³개 곱하기 기본 전하가 약 96500 C다.", "tf": "전자 1몰의 전하는? (약 96500 C)"}, "CH2-352": {"n": "전기분해 응용", "c": "ch2", "u": "전기화학", "t": "C", "dx": "전기분해가 전기 도금·금속 정련·물 분해 같은 산업에 쓰인다는 응용을 놓친 경우다. 전기분해와 실생활의 연결이 약하면 응용 문제를 못 잡는다.", "fx": "'전기분해가 전기 도금·금속 정련·물 분해 같은 산업에 쓰임'을 못 박는다. 전기분해와 실생활의 연결로 응용 문제를 잡아라.", "f": "B2", "rk": 647, "d": 5, "rh": 0, "pre": ["CH2-347"], "tr": "전기분해가 교과서 속 개념 같아, 전기 도금·금속 정련·물 분해에 쓰인다는 게 빠진다.", "an": "전기 도금·금속 정련·물 분해에 쓰인다.", "rd": "전기로 비자발 반응을 일으킨다. 그래서 도금·정련·물 분해에 쓴다.", "tf": "전기 도금은 무엇을 쓰나? (전기분해)"}, "CH2-353": {"n": "물 전기분해", "c": "ch2", "u": "전기화학", "t": "C", "dx": "물을 전기분해하면 수소와 산소가 생기고 그 부피비가 2:1이라는 점을 놓친 경우다. 이 부피비가 약하면 물 전기분해의 양적관계가 어긋난다.", "fx": "'물을 전기분해하면 수소와 산소가 생기고 부피비가 2:1'임을 못 박는다. 이 부피비로 물 전기분해의 양적관계를 맞춰라.", "f": "D3", "rk": 648, "d": 5, "rh": 0, "pre": ["CH2-347"], "tr": "물 분해 산물이 막연해, 수소와 산소가 2:1 부피비로 생긴다는 게 빠진다.", "an": "수소와 산소가 2:1 부피비로 생긴다.", "rd": "물이 분해돼 수소와 산소가 2:1 부피비로 생긴다.", "tf": "물 전기분해로 수소와 산소의 부피비는? (2:1)"}, "CH2-354": {"n": "전지 vs 전기분해", "c": "ch2", "u": "전기화학", "t": "C", "dx": "화학 전지는 자발 반응으로 전기를 만들고 전기분해는 전기를 받아 비자발 반응을 일으켜 방향이 반대라는 점을 놓친 경우다. 둘을 구분 못 하면 어느 쪽이 에너지를 만들고 쓰는지 헷갈린다.", "fx": "'화학 전지는 자발 반응으로 전기를 만들고 전기분해는 전기를 받아 비자발 반응을 일으켜 방향이 반대'임을 못 박는다. 둘을 구분해 어느 쪽이 에너지를 만들고 쓰는지 잡아라.", "f": "B2", "rk": 649, "d": 5, "rh": 0, "pre": ["CH2-337", "CH2-347"], "tr": "전지와 전기분해가 비슷할 것 같아, 하나는 자발로 전기 생성·하나는 전기로 비자발 강제로 반대라는 게 빠진다.", "an": "하나는 자발로 전기 생성, 하나는 전기로 비자발 강제: 반대다.", "rd": "전지는 자발로 전기를 만들고 전기분해는 전기로 비자발을 강제한다. 그래서 반대다.", "tf": "전지와 전기분해는 자발성에서? (반대)"}, "CH2-355": {"n": "패러데이 계산", "c": "ch2", "u": "전기화학", "t": "C", "dx": "같은 전하량이라도 이온의 가수가 클수록 석출되는 몰수가 적다(가수에 반비례)는 점을 놓친 경우다. 가수 보정이 약하면 서로 다른 이온의 석출량을 잘못 비교한다.", "fx": "'같은 전하량이라도 이온의 가수가 클수록 석출되는 몰수가 적음(가수에 반비례)'을 못 박는다. 가수 보정으로 서로 다른 이온의 석출량을 비교하라.", "f": "A2", "rk": 735, "d": 7, "rh": 0, "pre": ["CH2-350", "CH2-351"], "tr": "같은 전하면 같은 몰이 나올 것 같아, 이온 가수가 클수록 석출 몰수가 적다(반비례)는 게 빠진다.", "an": "+2 이온은 전자 2개가 필요해 같은 전하라도 석출 몰수가 적다(가수 반비례).", "rd": "+2 이온 1개를 석출하려면 전자 2개가 필요하다. 그래서 가수가 크면 석출 몰수가 적다.", "tf": "같은 전하로 Cu²⁺와 Ag⁺ 중 석출 몰수가 적은 건? (Cu²⁺: 전자 2개)"}, "CH2-356": {"n": "전극 질량", "c": "ch2", "u": "전기화학", "t": "C", "dx": "산화전극에서는 금속이 녹아 나가 질량이 줄고 환원전극에서는 금속이 석출돼 질량이 는다는 점을 놓친 경우다. 어느 전극이 녹고 쌓이는지가 약하면 전극 질량 변화를 잘못 잡는다.", "fx": "'산화전극에서는 금속이 녹아 질량이 줄고 환원전극에서는 석출돼 질량이 늚'을 못 박는다. 어느 전극이 녹고 쌓이는지로 전극 질량 변화를 잡아라.", "f": "A1", "rk": 702, "d": 6, "rh": 0, "pre": ["CH2-348"], "tr": "양 전극 질량이 그대로일 것 같아, 산화전극은 녹아 줄고 환원전극은 석출돼 는다는 게 빠진다.", "an": "산화전극은 녹아 줄고 환원전극은 석출돼 는다.", "rd": "산화전극은 녹아 줄고 환원전극은 석출돼 는다.", "tf": "산화전극의 질량은? (줄음)"}, "CH2-357": {"n": "산화제 세기", "c": "ch2", "u": "전기화학", "t": "C", "dx": "산화제의 세기가 전자를 얼마나 잘 받는지(표준 환원 전위가 클수록 강함)로 정해진다는 점을 놓친 경우다. 전위로 산화제 세기를 비교하지 못하면 반응 방향을 못 예측한다.", "fx": "'산화제의 세기는 전자를 얼마나 잘 받는지(표준 환원 전위가 클수록 강함)로 정해짐'을 못 박는다. 전위로 산화제 세기를 비교해 반응 방향을 예측하라.", "f": "C1", "rk": 736, "d": 7, "rh": 0, "pre": ["CH2-346"], "tr": "산화제 세기가 막연해, 전자를 잘 받을수록(표준 환원 전위 클수록) 강하다는 게 빠진다.", "an": "전자를 잘 받을수록(표준 환원 전위 클수록) 강한 산화제다.", "rd": "전자를 잘 받을수록(표준 환원 전위 클수록) 강한 산화제다.", "tf": "환원 전위가 크면 산화제로? (셈)"}, "CH2-171": {"n": "계와 주위", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "계(관찰 대상인 반응)와 주위(그 밖의 모든 것)를 가르지 못한 경우다. 이 구분이 약하면 열이 계에서 주위로 나가는지 들어오는지(발열·흡열)를 잘못 잡는다.", "fx": "'계 = 관찰 대상인 반응, 주위 = 그 밖의 모든 것'으로 갈라 둔다. 이 구분으로 열이 계에서 주위로 나가는지 들어오는지(발열·흡열)를 잡아라.", "f": "B2", "rk": 15, "d": 0, "rh": 42, "pre": [], "tr": "계·주위가 막연해, 관찰 대상(계)과 그 밖 전부(주위)를 가른다는 게 빠진다.", "an": "관찰 대상이 계, 그 밖 전부가 주위다.", "rd": "관찰 대상을 계, 그 밖 전부를 주위로 나눈다.", "tf": "관찰 대상은 계인가 주위인가? (계)"}, "CH2-172": {"n": "엔탈피 정의", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "엔탈피가 일정 압력에서의 열함량이고 절대값은 알 수 없어 변화량(ΔH)으로만 다루는 상태 함수라는 점을 놓친 경우다. 절대값 대신 변화량이라는 점이 약하면 반응엔탈피 계산이 막힌다.", "fx": "엔탈피를 '일정 압력에서의 열함량이고 절대값은 알 수 없어 변화량(ΔH)으로만 다루는 상태 함수'로 못 박는다. 변화량임을 잡아 반응엔탈피를 계산하라.", "f": "B2", "rk": 83, "d": 1, "rh": 36, "pre": ["CH2-171"], "tr": "엔탈피가 절대값을 갖는 양 같아, 절대값을 못 다루고 변화량(ΔH)으로만 보는 상태 함수라는 게 빠진다.", "an": "엔탈피는 절대값을 못 다루고 변화량(ΔH)으로 보는 상태 함수다.", "rd": "엔탈피 절대값은 못 재고 변화량으로만 다룬다. 상태 함수라 처음·끝으로 정해진다.", "tf": "엔탈피는 절대값과 변화량 중? (변화량)"}, "CH2-173": {"n": "반응엔탈피", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "반응엔탈피가 (생성물 엔탈피 − 반응물 엔탈피)라는 점을 놓친 경우다. 생성물에서 반응물을 뺀다는 방향이 약하면 ΔH 부호가 뒤집힌다.", "fx": "반응엔탈피를 '(생성물 엔탈피 − 반응물 엔탈피)'로 못 박는다. 생성물에서 반응물을 빼는 방향을 잡아 ΔH 부호를 맞춰라.", "f": "B2", "rk": 186, "d": 2, "rh": 15, "pre": ["CH2-172"], "tr": "반응엔탈피가 막연해, (생성물-반응물) 엔탈피라는 게 빠진다.", "an": "(생성물-반응물) 엔탈피다.", "rd": "(생성물-반응물) 엔탈피가 반응엔탈피다.", "tf": "생성물에서 반응물을 뺀 엔탈피는? (반응엔탈피)"}, "CH2-174": {"n": "ΔH 부호", "c": "ch2", "u": "엔탈피", "t": "A", "dx": "열을 방출하면 ΔH<0(발열), 흡수하면 ΔH>0(흡열)이라는 부호 약속을 놓친 경우다. 열 출입 방향과 부호의 대응이 흔들리면 열화학 반응식의 부호가 어긋난다.", "fx": "'열을 방출하면 ΔH<0(발열), 흡수하면 ΔH>0(흡열)'을 못 박는다. 열 출입 방향과 부호의 대응으로 열화학 반응식 부호를 잡아라.", "f": "C2", "rk": 320, "d": 3, "rh": 5, "pre": ["CH2-173"], "tr": "ΔH 부호가 헷갈려, 방출이면 음(발열)·흡수면 양(흡열)이라는 게 흔들린다.", "an": "방출이면 음(발열), 흡수면 양(흡열)이다.", "rd": "방출이면 엔탈피가 줄어 음(발열), 흡수면 늘어 양(흡열)이다.", "tf": "방출이면 ΔH 부호는? (음)"}, "CH2-175": {"n": "표준 상태", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "표준 상태가 25°C·1기압 같은 정해진 기준 조건이라는 점을 놓친 경우다. 기준 조건이 흐리면 표준 생성·반응 엔탈피의 비교 기준이 사라진다.", "fx": "표준 상태를 '25°C·1기압 같은 정해진 기준 조건'으로 못 박는다. 기준 조건을 잡아 표준 생성·반응 엔탈피의 비교 기준으로 삼아라.", "f": "D2", "rk": 16, "d": 0, "rh": 3, "pre": [], "tr": "표준 상태가 막연해, 25°C·1기압 같은 정해진 기준 조건이라는 게 빠진다.", "an": "25℃·1기압 같은 정해진 기준 조건이다.", "rd": "비교 기준이 필요해 25℃·1기압 등을 표준 상태로 약속한다.", "tf": "25℃·1기압 같은 기준은? (표준 상태)"}, "CH2-176": {"n": "표준 생성 엔탈피", "c": "ch2", "u": "엔탈피", "t": "A", "dx": "표준 생성 엔탈피에서 가장 안정한 홑원소 물질만 0이고 화합물은 0이 아니라는 점을 놓친 경우다(1몰 기준). 기준점인 홑원소 0을 못 잡으면 생성 엔탈피로 반응엔탈피를 구하지 못한다.", "fx": "표준 생성 엔탈피에서 '가장 안정한 홑원소 물질만 0, 화합물은 0이 아님(1몰 기준)'을 못 박는다. 기준점인 홑원소 0을 잡아 생성 엔탈피로 반응엔탈피를 구하라.", "f": "D2", "rk": 321, "d": 3, "rh": 2, "pre": ["CH2-173", "CH2-175"], "tr": "생성 엔탈피가 다 0일 것 같아, 가장 안정한 홑원소만 0이고 화합물은 아니라는 게 빠진다.", "an": "가장 안정한 홑원소만 0: 화합물은 아니다.", "rd": "기준으로 가장 안정한 홑원소만 0으로 둔다. 화합물은 아니다.", "tf": "표준 생성 엔탈피가 0인 것은? (안정한 홑원소)"}, "CH2-177": {"n": "반응엔탈피 계산", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "반응엔탈피를 (생성물 생성 엔탈피 합 − 반응물 생성 엔탈피 합)으로, 계수를 곱해 구한다는 점을 놓친 경우다. 계수 반영을 빼먹으면 ΔH 계산이 어긋난다.", "fx": "반응엔탈피를 '(생성물 생성 엔탈피 합 − 반응물 생성 엔탈피 합), 계수를 곱해' 구한다. 계수 반영을 빼먹지 말고 ΔH를 계산하라.", "f": "D3", "rk": 477, "d": 4, "rh": 0, "pre": ["CH2-176"], "tr": "생성 엔탈피로 ΔH를 그냥 뺄 것 같아, 계수를 곱해 (생성물 합-반응물 합)으로 구한다는 게 빠진다.", "an": "계수를 곱해 (생성물 합-반응물 합)으로 구한다.", "rd": "각 물질 생성 엔탈피에 계수를 곱해 (생성물-반응물)로 더하고 뺀다.", "tf": "반응엔탈피는 생성 엔탈피로 어떻게? (생성물-반응물, 계수 곱)"}, "CH2-178": {"n": "헤스 법칙", "c": "ch2", "u": "엔탈피", "t": "B", "dx": "엔탈피가 상태 함수라 반응엔탈피가 경로와 무관하고 여러 반응의 ΔH를 더해(뒤집으면 부호 반대, 배수하면 함께) 구한다는 헤스 법칙을 놓친 경우다. 이 조합 규칙이 약하면 다단계 ΔH 계산이 막힌다.", "fx": "헤스 법칙을 '엔탈피가 상태 함수라 반응엔탈피가 경로와 무관, 여러 ΔH를 더해 구함(뒤집으면 부호 반대, 배수하면 함께)'으로 못 박는다. 이 조합 규칙으로 다단계 ΔH를 계산하라.", "f": "A3", "rk": 322, "d": 3, "rh": 1, "pre": ["CH2-173"], "tr": "반응엔탈피가 경로에 달릴 것 같아, 상태 함수라 경로 무관하고 ΔH를 더해 구한다(헤스)는 게 빠진다.", "an": "상태 함수라 경로 무관: ΔH를 더해 구한다, 어느 등산로든 정상 높이는 같다.", "rd": "엔탈피는 상태 함수라 경로 무관이다. 그래서 단계 ΔH를 더해도 같다.", "tf": "경로가 달라도 ΔH가 같은 법칙은? (헤스)"}, "CH2-179": {"n": "결합 에너지", "c": "ch2", "u": "엔탈피", "t": "A", "dx": "결합 에너지로 반응엔탈피를 구할 때 (반응물에서 끊은 결합 에너지 합 − 생성물에서 만든 결합 에너지 합)으로, 평균 결합 에너지를 쓴다는 점을 놓친 경우다. 끊음·만듦의 방향이 흔들리면 ΔH 부호가 뒤집힌다.", "fx": "결합 에너지로 반응엔탈피를 '(반응물에서 끊은 결합 에너지 합 − 생성물에서 만든 결합 에너지 합), 평균 결합 에너지로' 구한다. 끊음·만듦의 방향을 잡아 ΔH 부호를 맞춰라.", "f": "D3", "rk": 323, "d": 3, "rh": 1, "pre": ["CH2-173"], "tr": "결합 에너지로 ΔH 구하는 식이 헷갈려, (끊은 합-만든 합)이고 평균값을 쓴다는 게 빠진다.", "an": "ΔH=(끊은 합-만든 합), 평균값을 쓴다.", "rd": "끊은 결합 에너지 합에서 만든 합을 뺀다. 평균값을 쓴다.", "tf": "결합 에너지로 ΔH는 끊은 합에서 뺀 것? (만든 합)"}, "CH2-180": {"n": "흡열과 엔탈피", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "흡열 반응에서 엔탈피가 늘어(ΔH>0) 주위에서 열을 흡수한다는 점을 놓친 경우다. 흡수와 엔탈피 증가의 연결이 약하면 부호 판단이 어긋난다.", "fx": "'흡열 반응은 엔탈피가 늘어(ΔH>0) 주위에서 열을 흡수'함을 못 박는다. 흡수와 엔탈피 증가를 이어 부호를 판단하라.", "f": "C2", "rk": 478, "d": 4, "rh": 0, "pre": ["CH2-174"], "tr": "흡열이면 엔탈피가 줄 것 같아, 늘어(ΔH>0) 주위 열을 흡수한다는 게 흔들린다.", "an": "흡열은 엔탈피가 늘어(ΔH>0) 주위 열을 흡수한다.", "rd": "흡열은 흡수해 엔탈피가 는다(ΔH>0). 그래서 주위 열을 흡수한다.", "tf": "흡열이면 엔탈피는? (증가)"}, "CH2-181": {"n": "결합 에너지 적용", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "결합을 만들 때 방출하는 에너지가 끊을 때 흡수하는 것보다 크면 발열이라는 점을 놓친 경우다. 결합 에너지 수지로 발열·흡열을 가르지 못하면 반응의 열 성격을 잘못 본다.", "fx": "'결합을 만들 때 방출하는 에너지가 끊을 때 흡수하는 것보다 크면 발열'임을 못 박는다. 결합 에너지 수지로 발열·흡열을 가려라.", "f": "C1", "rk": 479, "d": 4, "rh": 0, "pre": ["CH2-179"], "tr": "만든·끊은 에너지 비교가 막막해, 만들 때 방출이 끊을 때 흡수보다 크면 발열이라는 게 빠진다.", "an": "만들 때 방출이 끊을 때 흡수보다 크면 발열이다.", "rd": "만들 때 방출이 끊을 때 흡수보다 크면 발열이다.", "tf": "만들 때 방출이 더 크면? (발열)"}, "CH2-182": {"n": "열량계", "c": "ch2", "u": "엔탈피", "t": "B", "dx": "열량계에서 방출·흡수한 열량을 q = m·c·ΔT(c는 비열)로 구하고 열 손실이 없다고 가정한다는 점을 놓친 경우다. 이 측정 식이 약하면 반응열을 실험으로 못 구한다.", "fx": "열량계에서 열량을 'q = m·c·ΔT(c는 비열), 열 손실이 없다고 가정'으로 못 박는다. 이 측정 식으로 반응열을 실험으로 구하라.", "f": "D3", "rk": 324, "d": 3, "rh": 0, "pre": ["CH2-173", "CH2-183"], "tr": "열량을 어떻게 구하는지 막막해, q=m·c·ΔT이고 열 손실이 없다고 가정한다는 게 빠진다.", "an": "q=m·c·ΔT, 열 손실이 없다고 가정한다.", "rd": "흡수·방출 열을 q=m·c·ΔT로 잰다. 열 손실은 없다고 가정한다.", "tf": "q=m·c·무엇? (ΔT)"}, "CH2-183": {"n": "비열", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "비열이 물질 1 g의 온도를 1°C 올리는 데 드는 열량이고 비열이 클수록 같은 열에 온도가 덜 오른다는 점을 놓친 경우다. 비열의 의미가 약하면 q=mcΔT 계산이 어긋난다.", "fx": "비열을 '물질 1 g의 온도를 1°C 올리는 데 드는 열량, 클수록 같은 열에 온도가 덜 오름'으로 못 박는다. 비열의 의미를 잡아 q=mcΔT를 계산하라.", "f": "B2", "rk": 84, "d": 1, "rh": 2, "pre": ["CH2-171"], "tr": "비열이 막연해, 1 g을 1°C 올리는 열량이고 클수록 같은 열에 온도가 덜 오른다는 게 빠진다.", "an": "1 g을 1℃ 올리는 열량: 크면 같은 열에 온도가 덜 오른다.", "rd": "단위 질량을 1℃ 올리는 열이다. 크면 같은 열에도 온도가 덜 오른다.", "tf": "비열이 크면 같은 열에 온도는? (덜 오름)"}, "CH2-184": {"n": "엔탈피와 열", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "일정 압력에서 반응이 주고받는 열량이 곧 반응엔탈피(q = ΔH)라는 점을 놓친 경우다. 이 등식이 약하면 열량계로 잰 열을 ΔH로 연결하지 못한다.", "fx": "'일정 압력에서 반응이 주고받는 열량이 곧 반응엔탈피(q = ΔH)'임을 못 박는다. 이 등식으로 열량계로 잰 열을 ΔH로 연결하라.", "f": "B2", "rk": 325, "d": 3, "rh": 0, "pre": ["CH2-173"], "tr": "정압의 열이 그냥 열 같아, 그것이 곧 반응엔탈피(q=ΔH)라는 게 빠진다.", "an": "정압의 열이 곧 반응엔탈피(q=ΔH)다.", "rd": "정압의 열이 곧 엔탈피 변화다(q=ΔH).", "tf": "정압의 열은 무엇? (ΔH)"}, "CH2-185": {"n": "상태 함수", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "엔탈피가 처음·끝 상태로만 정해지고 경로와 무관한 상태 함수라는 점을 놓친 경우다. 이 본질이 약하면 헤스 법칙이 왜 성립하는지 근거가 사라진다.", "fx": "엔탈피를 '처음·끝 상태로만 정해지고 경로와 무관한 상태 함수'로 못 박는다. 이 본질을 헤스 법칙이 성립하는 근거로 삼아라.", "f": "A3", "rk": 480, "d": 4, "rh": 0, "pre": ["CH2-178"], "tr": "엔탈피가 경로에 달릴 것 같아, 처음·끝 상태로만 정해지는 상태 함수라는 게 빠진다.", "an": "처음·끝 상태로만 정해지는 상태 함수다.", "rd": "처음·끝 상태로만 정해지는 상태 함수다.", "tf": "엔탈피는 경로에 의존하나? (안 함)"}, "CH2-186": {"n": "생성 엔탈피 해석", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "생성 엔탈피를 화합물이 구성 홑원소보다 에너지가 높은지 낮은지를 나타내는 값으로 읽지 못한 경우다. 에너지 높낮이라는 해석이 약하면 화합물의 상대적 안정성을 못 비교한다.", "fx": "생성 엔탈피를 '화합물이 구성 홑원소보다 에너지가 높은지 낮은지를 나타내는 값'으로 읽는다. 에너지 높낮이로 화합물의 상대적 안정성을 비교하라.", "f": "B2", "rk": 481, "d": 4, "rh": 0, "pre": ["CH2-176"], "tr": "생성 엔탈피가 막연해, 화합물이 구성 홑원소보다 에너지가 높은지 낮은지를 나타낸다는 게 빠진다.", "an": "화합물이 구성 홑원소보다 에너지가 높은지 낮은지를 나타낸다.", "rd": "화합물이 구성 홑원소보다 에너지가 낮은지 높은지를 나타낸다.", "tf": "생성 엔탈피는 무엇과 비교한 값? (구성 홑원소)"}, "CH2-187": {"n": "열용량", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "열용량이 물질 전체의 값이라 (질량 × 비열)로 구해지고 단위 질량당 값인 비열과 다르다는 점을 놓친 경우다. 둘을 혼동하면 열량 계산에서 질량을 두 번 곱하거나 빠뜨린다.", "fx": "열용량을 '물질 전체의 값이라 (질량 × 비열)로 구함, 단위 질량당 값인 비열과 다름'으로 못 박는다. 둘을 혼동해 질량을 두 번 곱하거나 빠뜨리지 마라.", "f": "D3", "rk": 187, "d": 2, "rh": 0, "pre": ["CH2-183"], "tr": "열용량과 비열이 같을 것 같아, 열용량은 물질 전체(질량×비열) 값이라는 게 빠진다.", "an": "열용량은 물질 전체(질량×비열) 값: 비열과 다르다.", "rd": "열용량은 물질 전체(질량×비열) 값이다. 단위 질량의 비열과 다르다.", "tf": "열용량은 비열에 무엇을 곱한 값? (질량)"}, "CH2-188": {"n": "발열과 엔탈피", "c": "ch2", "u": "엔탈피", "t": "C", "dx": "발열 반응에서 엔탈피가 줄어든다(ΔH<0)는 점을 놓친 경우다. 방출과 엔탈피 감소의 연결이 약하면 부호 판단이 어긋난다.", "fx": "'발열 반응은 엔탈피가 줄어듦(ΔH<0)'을 못 박는다. 방출과 엔탈피 감소를 이어 부호를 판단하라.", "f": "C2", "rk": 482, "d": 4, "rh": 0, "pre": ["CH2-174"], "tr": "발열이면 엔탈피가 늘 것 같아, 줄어든다(ΔH<0)는 게 흔들린다.", "an": "발열은 엔탈피가 줄어든다(ΔH<0).", "rd": "발열은 방출해 엔탈피가 준다(ΔH<0).", "tf": "발열이면 엔탈피는? (감소)"}, "CH2-189": {"n": "엔트로피 정의", "c": "ch2", "u": "엔트로피", "t": "C", "dx": "엔트로피가 입자와 에너지의 무질서도(흩어진 정도)를 나타내는 양이라는 점을 놓친 경우다. 이 정의가 흐리면 ΔS 부호와 자발성 판단의 한 축이 무너진다.", "fx": "엔트로피를 '입자와 에너지의 무질서도(흩어진 정도)를 나타내는 양'으로 못 박는다. 이 정의를 ΔS 부호와 자발성 판단의 한 축으로 삼아라.", "f": "B2", "rk": 17, "d": 0, "rh": 34, "pre": [], "tr": "엔트로피가 막연해, 입자·에너지의 무질서도라는 게 빠진다.", "an": "엔트로피는 입자·에너지의 무질서도: 방이 어질러진 정도다.", "rd": "가능한 미시 상태 수가 많을수록 무질서다. 그것이 엔트로피다.", "tf": "무질서도를 나타내는 양은? (엔트로피)"}, "CH2-190": {"n": "상태별 엔트로피", "c": "ch2", "u": "엔트로피", "t": "B", "dx": "엔트로피가 고체 < 액체 < 기체 순으로 커진다(입자가 자유로울수록 무질서)는 점을 놓친 경우다. 이 순서가 약하면 상태 변화·반응에서 엔트로피 증감을 못 가린다.", "fx": "엔트로피를 '고체 < 액체 < 기체 순으로 커짐(자유로울수록 무질서)'으로 못 박는다. 이 순서로 상태 변화·반응의 엔트로피 증감을 가려라.", "f": "A1", "rk": 85, "d": 1, "rh": 1, "pre": ["CH2-189"], "tr": "상태와 엔트로피가 무관할 것 같아, 고체<액체<기체로 커진다는 게 빠진다.", "an": "고체<액체<기체로 커진다.", "rd": "입자 자유도가 클수록 엔트로피가 크다. 그래서 고체<액체<기체다.", "tf": "고체·액체·기체 중 엔트로피가 큰 건? (기체)"}, "CH2-191": {"n": "온도와 엔트로피", "c": "ch2", "u": "엔트로피", "t": "C", "dx": "온도가 높을수록 입자 운동이 활발해져 엔트로피가 커진다는 점을 놓친 경우다. 온도와 무질서도의 연결이 약하면 온도 변화에 따른 엔트로피 변화를 못 짚는다.", "fx": "'온도가 높을수록 입자 운동이 활발해져 엔트로피가 커짐'을 못 박는다. 온도와 무질서도를 이어 온도 변화에 따른 엔트로피 변화를 짚어라.", "f": "A1", "rk": 86, "d": 1, "rh": 0, "pre": ["CH2-189"], "tr": "온도와 엔트로피가 무관할 것 같아, 높을수록 운동이 활발해 커진다는 게 빠진다.", "an": "온도 높을수록 운동이 활발해 커진다.", "rd": "온도가 높으면 운동이 활발해 상태 수가 는다. 그래서 엔트로피가 크다.", "tf": "온도가 높으면 엔트로피는? (큼)"}, "CH2-192": {"n": "기체 수와 엔트로피", "c": "ch2", "u": "엔트로피", "t": "C", "dx": "반응에서 기체 분자 수가 늘면 엔트로피가 커진다는(기체 몰수 변화가 핵심) 점을 놓친 경우다. 양변 기체 몰수를 비교하지 못하면 반응의 ΔS 부호를 잘못 잡는다.", "fx": "'반응에서 기체 분자 수가 늘면 엔트로피가 커짐(기체 몰수 변화가 핵심)'을 못 박는다. 양변 기체 몰수를 비교해 반응의 ΔS 부호를 잡아라.", "f": "A1", "rk": 87, "d": 1, "rh": 1, "pre": ["CH2-189"], "tr": "분자 수와 엔트로피가 무관할 것 같아, 기체 분자 수가 늘면 커진다는 게 빠진다.", "an": "기체 분자 수가 늘면 커진다.", "rd": "기체 분자가 늘면 가능한 배치가 는다. 그래서 엔트로피가 크다.", "tf": "기체 분자가 늘면 엔트로피는? (큼)"}, "CH2-193": {"n": "상태 변화와 엔트로피", "c": "ch2", "u": "엔트로피", "t": "C", "dx": "융해·기화는 엔트로피를 키우고 응고·액화는 줄인다는 점을 놓친 경우다. 상변화 방향과 무질서도 변화를 못 이으면 ΔS 부호가 어긋난다.", "fx": "'융해·기화는 엔트로피를 키우고 응고·액화는 줄임'을 못 박는다. 상변화 방향과 무질서도 변화를 이어 ΔS 부호를 잡아라.", "f": "A1", "rk": 188, "d": 2, "rh": 0, "pre": ["CH2-190"], "tr": "상변화 방향이 헷갈려, 융해·기화는 키우고 응고·액화는 줄인다는 게 빠진다.", "an": "융해·기화는 키우고 응고·액화는 줄인다.", "rd": "융해·기화는 자유도를 키우고 응고·액화는 줄인다.", "tf": "기화하면 엔트로피는? (증가)"}, "CH2-194": {"n": "ΔS 정의", "c": "ch2", "u": "엔트로피", "t": "C", "dx": "엔트로피 변화 ΔS가 (생성물 엔트로피 − 반응물 엔트로피)이고 양수면 증가라는 점을 놓친 경우다. 부호의 의미가 약하면 자발성 식에서 ΔS를 잘못 넣는다.", "fx": "ΔS를 '(생성물 엔트로피 − 반응물 엔트로피), 양수면 증가'로 못 박는다. 부호의 의미를 잡아 자발성 식에 ΔS를 바로 넣어라.", "f": "C2", "rk": 88, "d": 1, "rh": 7, "pre": ["CH2-189"], "tr": "ΔS가 막연해, (생성물-반응물) 엔트로피이고 양수면 증가라는 게 빠진다.", "an": "ΔS=(생성물-반응물) 엔트로피, 양수면 증가다.", "rd": "ΔS=(생성물-반응물) 엔트로피다. 양수면 증가다.", "tf": "ΔS가 양수면 엔트로피는? (증가)"}, "CH2-205": {"n": "기체 생성", "c": "ch2", "u": "엔트로피", "t": "C", "dx": "고체·액체에서 기체가 생기는 반응이 엔트로피를 크게 키운다는 점을 놓친 경우다(기체는 자유롭게 움직임). 기체 생성과 무질서도 증가를 못 이으면 ΔS를 과소평가한다.", "fx": "'고체·액체에서 기체가 생기는 반응은 엔트로피를 크게 키움(기체는 자유롭게 움직임)'을 못 박는다. 기체 생성과 무질서도 증가를 이어 ΔS를 과소평가 마라.", "f": "A1", "rk": 191, "d": 2, "rh": 0, "pre": ["CH2-192"], "tr": "기체 생성이 엔트로피와 무관할 것 같아, 고체·액체서 기체가 생기면 크게 커진다는 게 빠진다.", "an": "고체·액체에서 기체가 생기면 엔트로피가 크게 커진다.", "rd": "고체·액체서 기체가 생기면 자유도가 크게 는다. 그래서 엔트로피가 크게 커진다.", "tf": "고체에서 기체가 생기면 엔트로피는? (크게 증가)"}, "CH2-206": {"n": "ΔS 해석", "c": "ch2", "u": "엔트로피", "t": "C", "dx": "ΔS가 양수면 무질서도 증가, 음수면 감소라 부호가 변화 방향을 나타낸다는 점을 놓친 경우다. 부호 해석이 약하면 반응이 무질서를 늘리는지 줄이는지 못 가린다.", "fx": "'ΔS가 양수면 무질서도 증가, 음수면 감소라 부호가 변화 방향을 나타냄'을 못 박는다. 부호 해석으로 반응이 무질서를 늘리는지 줄이는지 가려라.", "f": "C2", "rk": 192, "d": 2, "rh": 0, "pre": ["CH2-194"], "tr": "ΔS 부호가 막연해, 양수면 증가·음수면 감소로 변화 방향을 나타낸다는 게 빠진다.", "an": "양수면 증가, 음수면 감소다.", "rd": "양수면 무질서 증가, 음수면 감소다.", "tf": "ΔS가 음수면 엔트로피는? (감소)"}, "CH2-209": {"n": "엔트로피 감소 반응", "c": "ch2", "u": "엔트로피", "t": "C", "dx": "계의 엔트로피가 줄어도 주위까지 합한 전체 엔트로피가 늘면 자발적일 수 있다는 점을 놓친 경우다. 전체 엔트로피로 판단한다는 기준이 약하면 발열로 엔트로피가 주는 반응의 자발성을 잘못 본다.", "fx": "'계의 엔트로피가 줄어도 주위까지 합한 전체 엔트로피가 늘면 자발적일 수 있음'을 못 박는다. 전체 엔트로피로 판단함을 잡아 발열로 엔트로피가 주는 반응의 자발성을 보라.", "f": "A4", "rk": 328, "d": 3, "rh": 0, "pre": ["CH2-195"], "tr": "계 엔트로피가 줄면 안 일어날 것 같아, 주위까지 합한 전체가 늘면 자발적일 수 있다는 게 빠진다.", "an": "계 엔트로피가 줄어도 주위까지 합한 전체가 늘면 자발적일 수 있다.", "rd": "자발성은 전체 엔트로피로 본다. 계가 줄어도 주위가 더 늘면 자발일 수 있다.", "tf": "계 엔트로피가 줄어도 자발일 수 있나? (있다: 전체가 늘면)"}, "CH2-210": {"n": "용해와 엔트로피", "c": "ch2", "u": "엔트로피", "t": "C", "dx": "용해가 보통 입자가 흩어져 엔트로피가 커지는 과정이라는 점을 놓친 경우다. 용해와 무질서도 증가를 못 이으면 용해 자발성에서 엔트로피 항의 역할을 놓친다.", "fx": "'용해는 보통 입자가 흩어져 엔트로피가 커지는 과정'임을 못 박는다. 용해와 무질서도 증가를 이어 용해 자발성에서 엔트로피 항의 역할을 잡아라.", "f": "B2", "rk": 193, "d": 2, "rh": 1, "pre": ["CH2-194"], "tr": "용해가 엔트로피와 무관할 것 같아, 보통 입자가 흩어져 커지는 과정이라는 게 빠진다.", "an": "용해는 보통 입자가 흩어져 엔트로피가 커지는 과정이다.", "rd": "용해는 보통 입자를 흩는다. 그래서 엔트로피가 커진다.", "tf": "용해는 보통 엔트로피가? (증가)"}, "CH2-036": {"n": "상태 방정식", "c": "ch2", "u": "이상기체", "t": "A", "dx": "이상 기체 상태 방정식 PV=nRT를 절대 온도(K) 기준으로 쓰지 못한 경우다(섭씨를 그대로 넣는 게 전형). 온도를 K로 안 바꾸면 보일·샤를을 아우르는 이 식의 모든 계산이 어긋난다.", "fx": "이상 기체 상태 방정식을 'PV=nRT, 온도는 반드시 절대 온도(K)'로 못 박는다. 섭씨를 넣지 말고 273을 더해 K로 바꾼 뒤 계산하라.", "f": "D3", "rk": 9, "d": 0, "rh": 33, "pre": [], "tr": "PV=nRT에 섭씨를 그냥 넣을 것 같아, 절대 온도(K)로 써야 한다는 게 빠진다.", "an": "PV=nRT엔 섭씨가 아니라 절대 온도(K)를 넣는다: 0℃도 273 K다.", "rd": "기체 거동은 절대 온도에 비례한다. 그래서 PV=nRT에 켈빈을 넣는다.", "tf": "PV=nRT에 넣는 온도는? (절대 온도)"}, "CH2-037": {"n": "보일 법칙", "c": "ch2", "u": "이상기체", "t": "B", "dx": "일정 온도에서 압력과 부피가 반비례(PV = 일정)한다는 보일 법칙을 놓친 경우다. 압력을 키우면 부피가 줄어드는 이 관계가 약하면 압력·부피 변화 계산이 어긋난다.", "fx": "보일 법칙을 '일정 온도에서 압력과 부피가 반비례(PV = 일정)'로 못 박는다. 압력을 키우면 부피가 주는 관계로 P₁V₁ = P₂V₂를 적용하라.", "f": "A2", "rk": 59, "d": 1, "rh": 0, "pre": ["CH2-036"], "tr": "압력·부피 관계가 막연해, 일정 온도서 반비례(PV 일정)한다는 게 빠진다.", "an": "일정 온도에서 누르면(압력↑) 부피가 준다(반비례): 풍선을 쥐면 작아진다.", "rd": "온도 일정이면 부피가 줄 때 충돌이 잦아 압력이 는다. 그래서 PV가 일정(반비례)이다.", "tf": "온도 일정에서 압력을 2배로 하면 부피는? (절반)"}, "CH2-038": {"n": "샤를 법칙", "c": "ch2", "u": "이상기체", "t": "C", "dx": "일정 압력에서 부피가 절대 온도에 비례(V/T = 일정)한다는 샤를 법칙을 놓친 경우다. 섭씨로 비례를 따지면 비가 깨져 온도·부피 계산이 어긋난다.", "fx": "샤를 법칙을 '일정 압력에서 부피가 절대 온도에 비례(V/T = 일정)'로 못 박는다. 섭씨 말고 K로 비를 따져 온도·부피를 계산하라.", "f": "A2", "rk": 60, "d": 1, "rh": 0, "pre": ["CH2-036"], "tr": "부피·온도 관계가 막연해, 일정 압력서 절대 온도에 비례(V/T 일정)한다는 게 빠진다.", "an": "일정 압력에서 데우면 부피가 는다(절대 온도 비례): 더운 날 풍선이 부푼다.", "rd": "압력 일정이면 데울수록 분자가 빨라져 부피가 는다. 그래서 V가 절대 온도에 비례한다.", "tf": "압력 일정에서 절대 온도를 2배로 하면 부피는? (2배)"}, "CH2-039": {"n": "아보가드로 법칙", "c": "ch2", "u": "이상기체", "t": "C", "dx": "같은 온도·압력에서 부피가 몰수에 비례하고 기체 종류·분자량과 무관하다는 아보가드로 법칙을 놓친 경우다. 부피가 곧 몰수를 대변한다는 점이 약하면 기체 양적관계가 막힌다.", "fx": "아보가드로 법칙을 '같은 온도·압력에서 부피가 몰수에 비례, 기체 종류·분자량과 무관'으로 못 박는다. 부피가 곧 몰수를 대변함을 양적관계에 써라.", "f": "A2", "rk": 61, "d": 1, "rh": 1, "pre": ["CH2-036"], "tr": "무거운 기체가 같은 부피에 적게 들 것 같아, 같은 조건이면 부피가 몰수에 비례(종류 무관)한다는 게 빠진다.", "an": "같은 조건이면 무게와 무관하게 부피가 몰수에 비례: 개수만큼 부푼다.", "rd": "같은 조건이면 부피가 분자 수에 비례한다. 그래서 무게와 무관하게 몰수가 부피를 정한다.", "tf": "같은 조건에서 부피는 무엇에 비례? (몰수)"}, "CH2-040": {"n": "기체 상수", "c": "ch2", "u": "이상기체", "t": "C", "dx": "기체 상수 R가 기체 종류와 무관한 보편 상수이고 값은 단위 선택에 따라 달라질 뿐이라는 점을 놓친 경우다. R를 기체마다 다른 값으로 여기면 상태 방정식 계산이 어긋난다.", "fx": "기체 상수 R를 '기체 종류와 무관한 보편 상수, 값은 단위 선택으로만 달라짐'으로 못 박는다. 기체마다 다른 값이라 여기지 말고 단위를 맞춰 R를 써라.", "f": "B2", "rk": 62, "d": 1, "rh": 0, "pre": ["CH2-036"], "tr": "R가 기체마다 다를 것 같아, 종류 무관 보편 상수이고 값은 단위 선택에 따를 뿐이라는 게 빠진다.", "an": "R는 기체 종류와 무관한 보편 상수: 값은 단위 선택에 따를 뿐이다.", "rd": "R는 PV=nRT의 비례 상수다. 기체 종류와 무관하고 값은 단위에 따른다.", "tf": "R는 기체 종류에 따라 변하나? (안 변함)"}, "CH2-041": {"n": "몰부피", "c": "ch2", "u": "이상기체", "t": "B", "dx": "표준 상태(0°C, 1 atm)에서 기체 1몰이 종류와 무관하게 22.4 L라는 점, 그리고 이 값이 조건에 의존한다는 점을 놓친 경우다. 조건이 바뀌면 22.4 L가 아니라는 점이 약하면 비표준 조건 계산이 어긋난다.", "fx": "'표준 상태(0°C, 1 atm) 기체 1몰 = 22.4 L, 단 조건이 바뀌면 22.4 L 아님'을 못 박는다. 비표준 조건에선 PV=nRT로 부피를 다시 구하라.", "f": "D3", "rk": 163, "d": 2, "rh": 0, "pre": ["CH2-039"], "tr": "기체마다 부피가 다를 것 같아, 표준 상태 1몰이 종류 무관 22.4 L라는 게 의외다.", "an": "표준 상태 1몰은 종류 무관 22.4 L다.", "rd": "같은 조건 기체 1몰 부피는 종류와 무관하다. 표준 상태에서 22.4 L다.", "tf": "표준 상태 기체 1몰의 부피는? (22.4 L)"}, "CH2-042": {"n": "이상 기체 가정", "c": "ch2", "u": "이상기체", "t": "A", "dx": "이상 기체가 분자 자체의 크기를 0으로 보고 분자 간 힘을 무시하며 충돌에서 에너지 손실이 없다고 가정한다는 점을 놓친 경우다. 이 가정이 흐리면 실제 기체가 왜·언제 어긋나는지의 기준이 사라진다.", "fx": "이상 기체 가정을 '분자 크기 0, 분자 간 힘 무시, 충돌 시 에너지 손실 없음'으로 못 박는다. 이 가정이 실제 기체가 언제 어긋나는지의 기준임을 잡아라.", "f": "B2", "rk": 63, "d": 1, "rh": 19, "pre": ["CH2-036"], "tr": "이상 기체가 막연해, 분자 크기 0·분자 간 힘 무시·충돌 손실 없음을 가정한다는 게 빠진다.", "an": "이상 기체는 분자 크기 0·인력 무시·충돌 손실 없음을 가정한 단순 모형이다.", "rd": "분자 크기·인력·충돌 손실을 무시하면 거동이 단순해진다. 그것이 이상 기체다.", "tf": "이상 기체는 분자 크기를 어떻게 보나? (0으로)"}, "CH2-043": {"n": "운동 에너지와 온도", "c": "ch2", "u": "이상기체", "t": "A", "dx": "기체의 평균 운동 에너지가 오직 절대 온도로만 정해진다는 점을 놓친 경우다. 같은 온도면 분자량이 달라도 평균 운동 에너지가 같다는 점이 약하면 무거운 분자가 왜 느린지 설명하지 못한다.", "fx": "'기체의 평균 운동 에너지는 오직 절대 온도로만 정해짐(같은 온도면 분자량 무관)'을 못 박는다. 그래서 무거운 분자가 느린 까닭(같은 에너지, 큰 질량)을 짚어라.", "f": "A3", "rk": 164, "d": 2, "rh": 6, "pre": ["CH2-042"], "tr": "평균 운동 에너지가 분자 종류에 달렸을 것 같아, 오직 절대 온도로만 정해진다는 게 빠진다.", "an": "평균 운동 에너지는 분자 종류와 무관, 오직 절대 온도가 정한다.", "rd": "온도는 평균 운동 에너지의 척도다. 그래서 종류와 무관하게 절대 온도가 정한다.", "tf": "평균 운동 에너지를 정하는 것은? (절대 온도)"}, "CH2-044": {"n": "온도와 속력", "c": "ch2", "u": "이상기체", "t": "C", "dx": "온도가 높을수록 운동 에너지가 커져 분자 속력이 빨라진다(v ∝ √T)는 점을 놓친 경우다. 온도와 속력의 제곱근 관계가 약하면 온도에 따른 속력 분포 변화를 못 읽는다.", "fx": "'온도가 높을수록 운동 에너지가 커져 속력이 빨라짐(v ∝ √T)'을 못 박는다. 온도와 속력의 제곱근 관계로 속력 분포 변화를 읽어라.", "f": "A2", "rk": 287, "d": 3, "rh": 4, "pre": ["CH2-043"], "tr": "온도와 속력이 막연해, 높을수록 운동 에너지가 커져 빨라진다(v∝√T)는 게 빠진다.", "an": "온도가 높을수록 운동 에너지가 커져 빨라진다(v∝√T).", "rd": "온도가 오르면 운동 에너지가 커진다. (1/2)mv²이 커지니 v∝√T다.", "tf": "온도를 올리면 분자 속력은? (빨라짐)"}, "CH2-045": {"n": "분자량과 속력", "c": "ch2", "u": "이상기체", "t": "A", "dx": "같은 온도에서 분자 속력이 분자량의 제곱근에 반비례(v ∝ 1/√M)해 가벼운 분자가 빠르다는 점을 놓친 경우다(H₂가 가장 빠름). 이 관계가 약하면 확산·분출 속도 비교가 어긋난다.", "fx": "'같은 온도에서 속력은 분자량의 제곱근에 반비례(v ∝ 1/√M)해 가벼운 분자가 빠름'을 못 박는다(H₂가 가장 빠름). 이 관계로 확산·분출 속도를 비교하라.", "f": "A2", "rk": 454, "d": 4, "rh": 1, "pre": ["CH2-044"], "tr": "무거우면 빠를 것 같아, 같은 온도서 분자량 제곱근에 반비례해 가벼울수록 빠르다(H₂ 최고)는 게 의외다.", "an": "같은 온도면 무거울수록 느리다(√M 반비례): 볼링공보다 탁구공이 빠르다, 무거우면 빠를 것 같지만 반대다.", "rd": "같은 온도면 (1/2)mv²이 같다. m이 크면 v가 작아 √M에 반비례한다.", "tf": "같은 온도의 O₂와 H₂ 중 느린 건? (O₂: 무거움)"}, "CH2-046": {"n": "제곱평균제곱근 속력", "c": "ch2", "u": "이상기체", "t": "C", "dx": "제곱평균제곱근 속력이 √(3RT/M)이라 온도의 제곱근에 비례하고 분자량의 제곱근에 반비례한다는 점을 놓친 경우다. 이 식이 약하면 속력을 정량적으로 비교하지 못한다.", "fx": "제곱평균제곱근 속력을 '√(3RT/M)이라 온도의 제곱근에 비례, 분자량의 제곱근에 반비례'로 못 박는다. 이 식으로 속력을 정량 비교하라.", "f": "A2", "rk": 455, "d": 4, "rh": 0, "pre": ["CH2-044"], "tr": "vᵣₘₛ가 막연해, √(3RT/M)이라 √T에 비례·√M에 반비례한다는 게 빠진다.", "an": "vrms=√(3RT/M): √T에 비례, √M에 반비례한다.", "rd": "(1/2)mv²=(3/2)kT에서 v=√(3RT/M)이다. √T 비례·√M 반비례다.", "tf": "온도를 4배로 하면 rms 속력은? (2배)"}, "CH2-047": {"n": "속력 분포", "c": "ch2", "u": "이상기체", "t": "C", "dx": "기체 분자들이 하나의 속력이 아니라 분포를 이루고 온도가 높을수록 분포가 넓고 빠른 쪽으로 이동한다는 점을 놓친 경우다. 이 분포 감각이 약하면 반응 속도에서 활성화 에너지를 넘는 분자 비율 논의로 이어지지 못한다.", "fx": "'기체 분자는 하나의 속력이 아니라 분포를 이루고, 온도가 높을수록 분포가 넓고 빠른 쪽으로 이동'함을 못 박는다. 이 분포를 반응 속도(활성화 에너지 넘는 비율)로 이어라.", "f": "B2", "rk": 456, "d": 4, "rh": 0, "pre": ["CH2-044"], "tr": "분자가 다 같은 속력일 것 같아, 분포를 이루고 온도 높을수록 빠른 쪽으로 넓게 퍼진다는 게 빠진다.", "an": "분자는 다 같은 속력이 아니라 분포를 이룬다: 온도 높을수록 빠른 쪽으로 넓게 퍼진다.", "rd": "충돌로 속도가 끊임없이 바뀌어 분포를 이룬다. 온도가 높을수록 빠른 쪽으로 퍼진다.", "tf": "기체 분자는 다 같은 속력인가? (아니다: 분포)"}, "CH2-048": {"n": "그레이엄 법칙", "c": "ch2", "u": "이상기체", "t": "A", "dx": "기체의 확산·분출 속도가 분자량의 제곱근에 반비례(그레이엄 법칙)한다는 점을 놓친 경우다. 가벼운 기체가 빨리 퍼진다는 이 관계가 약하면 두 기체의 확산 속도비를 못 구한다.", "fx": "그레이엄 법칙을 '확산·분출 속도가 분자량의 제곱근에 반비례'로 못 박는다. 가벼운 기체가 빨리 퍼짐을 잡아 두 기체의 확산 속도비를 구하라.", "f": "A2", "rk": 614, "d": 5, "rh": 0, "pre": ["CH2-045"], "tr": "확산 속도가 질량에 단순 반비례할 것 같아, 분자량 제곱근에 반비례한다(그레이엄)는 게 빠진다.", "an": "확산 속도가 분자량 제곱근에 반비례: 가벼운 냄새가 먼저 도착한다.", "rd": "평균 운동 에너지가 같아 v∝1/√M이다. 그래서 확산 속도가 분자량 제곱근에 반비례한다.", "tf": "확산 속도는 분자량 제곱근에? (반비례)"}, "CH2-049": {"n": "압력의 기원", "c": "ch2", "u": "이상기체", "t": "C", "dx": "기체 압력이 분자가 용기 벽에 충돌하며 생긴다는 점을 놓친 경우다. 압력의 기원이 충돌이라는 그림이 약하면 분자 수·속력이 압력을 어떻게 바꾸는지 설명하지 못한다.", "fx": "기체 압력을 '분자가 용기 벽에 충돌하며 생김'으로 못 박는다. 압력의 기원이 충돌임을 잡아 분자 수·속력이 압력을 바꾸는 까닭을 설명하라.", "f": "B3", "rk": 165, "d": 2, "rh": 0, "pre": ["CH2-042"], "tr": "기체 압력이 어디서 오는지 막막해, 분자가 벽에 충돌해서라는 게 빠진다.", "an": "기체 압력은 분자가 벽에 부딪쳐 생긴다.", "rd": "기체 분자가 벽에 끊임없이 부딪친다. 그 힘이 압력이다.", "tf": "기체 압력은 무엇 때문에? (분자가 벽에 충돌)"}, "CH2-050": {"n": "실제 기체 편차", "c": "ch2", "u": "이상기체", "t": "C", "dx": "실제 기체가 분자 부피와 분자 간 힘을 실제로 가져 이상 기체에서 벗어난다는 점을 놓친 경우다(이상 기체는 둘 다 무시). 편차의 두 원인이 약하면 어떤 조건에서 어긋나는지 못 짚는다.", "fx": "'실제 기체는 분자 부피와 분자 간 힘을 실제로 가져 이상 기체에서 벗어남(이상은 둘 다 무시)'을 못 박는다. 편차의 두 원인으로 어느 조건에서 어긋나는지 짚어라.", "f": "B2", "rk": 166, "d": 2, "rh": 10, "pre": ["CH2-042", "CH2-001"], "tr": "실제 기체도 이상 기체 같을 것 같아, 분자 부피와 인력을 실제로 가져 벗어난다는 게 빠진다.", "an": "실제 기체는 분자 부피와 인력을 가져 이상에서 벗어난다.", "rd": "실제 분자는 부피와 인력이 있다. 그래서 이상에서 벗어난다.", "tf": "실제 기체가 이상에서 벗어나는 이유는? (분자 부피·인력)"}, "CH2-051": {"n": "절대 영도", "c": "ch2", "u": "이상기체", "t": "C", "dx": "절대 영도(0 K, 약 −273°C)가 분자 운동 에너지가 이론상 0이 되는 최저 온도라는 점을 놓친 경우다(0°C는 273 K). 절대 온도의 기준점이 흐리면 샤를 법칙의 비례가 어긋난다.", "fx": "절대 영도를 '0 K(약 −273°C)로 분자 운동 에너지가 이론상 0이 되는 최저 온도'로 못 박는다(0°C는 273 K). 이 기준점으로 샤를 법칙의 비를 맞춰라.", "f": "B2", "rk": 288, "d": 3, "rh": 0, "pre": ["CH2-043"], "tr": "절대 영도가 막연해, 운동 에너지가 이론상 0인 최저 온도(약 -273°C)라는 게 빠진다.", "an": "절대 영도는 운동 에너지가 이론상 0인 최저 온도(약 -273℃)다.", "rd": "온도를 낮추면 운동 에너지가 준다. 이론상 0이 되는 최저 온도가 약 -273℃다.", "tf": "운동 에너지가 0인 온도는? (약 -273℃)"}, "CH2-001": {"n": "분자 간 힘 정의", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "분자 사이에 작용하는 인력(분자 간 힘)을 원자를 묶는 화학 결합과 뒤섞은 경우다. 분자 간 힘이 분자 '사이'의 힘이라는 점이 흐리면 끓음·녹음 같은 상태 변화의 원인을 잘못 짚는다.", "fx": "분자 간 힘을 '분자 사이에 작용하는 인력(원자를 묶는 화학 결합과는 다름)'으로 못 박는다. '사이의 힘'임을 잡아 끓음·녹음 같은 상태 변화의 원인으로 삼아라.", "f": "B2", "rk": 8, "d": 0, "rh": 103, "pre": [], "tr": "분자 간 힘이 화학 결합 같아, 분자 사이 인력이지 원자를 묶는 결합이 아니라는 게 흐려진다.", "an": "분자 간 힘은 분자끼리 끌어당기는 약한 손짓: 원자를 묶는 결합(접착제)이 아니다.", "rd": "결합은 원자를 묶고 분자 간 힘은 분자끼리 끈다. 둘은 다른 층위의 힘이다.", "tf": "분자 간 힘과 결합 중 분자끼리 끄는 건? (분자 간 힘)"}, "CH2-002": {"n": "분자 간 힘 vs 결합", "c": "ch2", "u": "분자간힘", "t": "B", "dx": "분자 간 힘이 화학 결합보다 훨씬 약하고, 끓을 때 끊기는 건 분자 간 힘이지 분자 안의 공유 결합이 아니라는 점을 놓친 경우다. 이 구분이 없으면 물이 끓으면 H₂O가 H와 O로 쪼개진다고 잘못 본다.", "fx": "'분자 간 힘은 결합보다 훨씬 약하고, 끓을 때 끊기는 건 분자 간 힘이지 분자 안 공유 결합이 아님'을 못 박는다. 물이 끓어도 H₂O가 H와 O로 쪼개지지 않음을 새겨라.", "f": "B2", "rk": 49, "d": 1, "rh": 0, "pre": ["CH2-001"], "tr": "끓을 때 결합이 끊길 것 같아, 분자 간 힘이 끊기지 분자 안 공유 결합이 아니라는 게 빠진다.", "an": "끓일 때 분자 사이 손만 놓을 뿐 분자 안 결합은 그대로: 물이 끓어도 H₂O는 H₂O다.", "rd": "끓을 땐 분자가 떨어질 만큼만 에너지를 준다. 그래서 분자 간 힘만 끊기고 결합은 그대로다.", "tf": "물이 끓으면 H₂O 결합이 끊기나? (아니다: 분자 간 힘만)"}, "CH2-003": {"n": "분산력 보편성", "c": "ch2", "u": "분자간힘", "t": "A", "dx": "분산력이 무극성 분자에만 작용한다고 본 경우다. 전자를 가진 모든 분자에 작용하는 가장 기본 힘이라는 점을 놓치면 극성 분자에도 분산력이 깔려 있다는 사실을 빠뜨린다.", "fx": "분산력을 '전자를 가진 모든 분자에 작용하는 가장 기본 힘(무극성만이 아님)'으로 못 박는다. 극성 분자에도 분산력이 깔려 있음을 잡아라.", "f": "D1", "rk": 50, "d": 1, "rh": 13, "pre": ["CH2-001"], "tr": "분산력이 무극성에만 있을 것 같아, 모든 분자에 작용한다는 게 빠진다.", "an": "분산력은 모든 분자에 깔린 기본 인력: 무극성에도 있다.", "rd": "어떤 분자든 전자 구름이 순간 쏠릴 수 있다. 그래서 분산력은 모든 분자에 있다.", "tf": "무극성 분자에도 인력이 있나? (있다: 분산력)"}, "CH2-004": {"n": "분산력 원리", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "분산력이 전자 구름이 순간적으로 치우쳐 생긴 일시적 쌍극자 때문이라는 원리를 놓친 경우다. 순간 쌍극자라는 발생 원리가 약하면 전자 수가 세기를 정하는 까닭으로 이어지지 못한다.", "fx": "분산력을 '전자 구름이 순간적으로 치우쳐 생긴 일시적 쌍극자 때문'으로 못 박는다. 이 발생 원리에서 전자 수가 세기를 정하는 까닭으로 이어라.", "f": "B3", "rk": 153, "d": 2, "rh": 10, "pre": ["CH2-003"], "tr": "무극성 분자에 왜 인력이 있는지 막막해, 전자 구름이 순간 치우쳐 생긴 일시적 쌍극자 때문이라는 게 빠진다.", "an": "전자 구름이 순간 한쪽으로 쏠려 생기는 깜빡이는 쌍극자: 찰나의 끌림이다.", "rd": "전자가 순간 한쪽에 몰리면 일시 쌍극자가 생겨 이웃을 유도한다. 그 끌림이 분산력이다.", "tf": "분산력은 무엇이 순간 쏠려 생기나? (전자 구름)"}, "CH2-005": {"n": "쌍극자-쌍극자", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "쌍극자-쌍극자 힘이 영구 쌍극자를 가진 극성 분자 사이에서만 작용한다는 점을 놓친 경우다. 무극성 분자엔 이 힘이 없다는 점이 약하면 극성·무극성의 끓는점 차이를 못 짚는다.", "fx": "쌍극자-쌍극자 힘을 '영구 쌍극자를 가진 극성 분자 사이에서만 작용'으로 못 박는다(무극성엔 없음). 이로써 극성·무극성의 끓는점 차이를 짚어라.", "f": "B2", "rk": 51, "d": 1, "rh": 5, "pre": ["CH2-001"], "tr": "쌍극자 힘이 막연해, 영구 쌍극자를 가진 극성 분자 사이에만 작용한다는 게 빠진다.", "an": "영구 쌍극자를 가진 극성 분자끼리 +와 -가 맞물리는 인력이다.", "rd": "극성 분자는 영구 쌍극자가 있다. +와 -끼리 맞물려 끄는 힘이다.", "tf": "영구 쌍극자끼리의 인력은? (쌍극자-쌍극자)"}, "CH2-006": {"n": "수소 결합 조건", "c": "ch2", "u": "분자간힘", "t": "A", "dx": "수소 결합의 조건이 전기음성도가 큰 N·O·F에 직접 결합한 H라는 점을 놓친 경우다(C는 조건이 아님). 이 조건이 흐리면 어떤 분자가 수소 결합을 하는지 판정이 통째로 어긋난다.", "fx": "수소 결합 조건을 'H가 N·O·F에 직접 결합했는가' 한 가지로 거른다(C는 조건 아님). HF·H₂O·NH₃(된다)와 HCl·CH₄(안 된다)를 나란히 두고 직접 가려라.", "f": "B2", "rk": 52, "d": 1, "rh": 10, "pre": ["CH2-001"], "tr": "H면 다 수소 결합할 것 같아, N·O·F에 직접 붙은 H라야 한다(C는 아님)는 게 빠진다.", "an": "수소 결합은 H가 N·O·F에 직접 붙었을 때만: 탄소에 붙은 H는 못 한다.", "rd": "H가 전기음성도 큰 N·O·F에 붙으면 부분 전하가 크다. 그래서 그때만 강한 수소 결합이 된다.", "tf": "H가 어떤 원소에 붙어야 수소 결합? (N, O, F)"}, "CH2-007": {"n": "수소 결합 본질", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "수소 결합을 화학 결합으로 오해한 경우다. 분자 간 힘 중 특히 강한 것일 뿐 분자 안의 결합이 아니라는 점을 놓치면 분자 간 힘의 세기 순서에서 자리를 잘못 잡는다.", "fx": "수소 결합을 '분자 간 힘 중 특히 강한 것일 뿐 분자 안의 결합이 아님'으로 못 박는다. 분자 간 힘 세기 순서에서 그 자리를 바로 잡아라.", "f": "B2", "rk": 154, "d": 2, "rh": 0, "pre": ["CH2-006"], "tr": "수소 결합이 화학 결합 같아, 분자 간 힘의 하나라는 게 흔들린다.", "an": "수소 결합은 강한 편이지만 어디까지나 분자 간 힘의 하나다.", "rd": "수소 결합도 분자 사이 인력이다. 강할 뿐 분자 간 힘의 하나다.", "tf": "수소 결합은 결합인가 분자 간 힘인가? (분자 간 힘)"}, "CH2-008": {"n": "분산력 세기", "c": "ch2", "u": "분자간힘", "t": "B", "dx": "분산력이 전자 수가 많을수록(전자 구름이 클수록 잘 치우쳐) 커진다는 점을 놓친 경우다. 이 세기 결정 인자가 약하면 분자량이 큰 분자의 끓는점이 왜 높은지 설명하지 못한다.", "fx": "분산력을 '전자 수가 많을수록(전자 구름이 커 잘 치우쳐) 커짐'으로 못 박는다. 이 인자로 분자량이 큰 분자의 끓는점이 높은 까닭을 설명하라.", "f": "B3", "rk": 281, "d": 3, "rh": 9, "pre": ["CH2-004"], "tr": "분산력 세기가 막연해, 전자 수가 많을수록(구름이 잘 치우쳐) 커진다는 게 빠진다.", "an": "전자가 많을수록(구름이 잘 쏠려) 분산력이 크다.", "rd": "전자가 많을수록 구름이 잘 쏠린다. 그래서 분산력이 커진다.", "tf": "전자가 많을수록 분산력은? (큼)"}, "CH2-009": {"n": "할로젠 끓는점", "c": "ch2", "u": "분자간힘", "t": "B", "dx": "할로젠(F₂·Cl₂·Br₂·I₂)이 분자량이 클수록 전자 수가 많아 분산력이 커져 끓는점이 높아진다는 점을 놓친 경우다. 분자량과 분산력의 연결이 약하면 동족 끓는점 순서를 못 잡는다.", "fx": "'할로젠은 분자량이 클수록 전자 수가 많아 분산력이 커져 끓는점이 높아짐'을 못 박는다. F₂·Cl₂·Br₂·I₂를 분자량 순으로 늘어놓고 끓는점 순서를 잡아라.", "f": "B3", "rk": 446, "d": 4, "rh": 0, "pre": ["CH2-008"], "tr": "할로젠 끓는점 순서가 막연해, 분자량이 클수록 전자가 많아 분산력이 커져 높아진다는 게 빠진다.", "an": "분자량 클수록 전자 많아 분산력이 커져 끓는점이 높다.", "rd": "분자량이 클수록 전자가 많아 분산력이 크다. 그래서 끓는점이 높다.", "tf": "분자량이 큰 할로젠일수록 끓는점은? (높음)"}, "CH2-010": {"n": "비활성 기체 끓는점", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "비활성 기체가 원자번호가 클수록 전자 수가 많아 분산력이 커져 끓는점이 높아진다는 점을 놓친 경우다. 분산력만 작용하는 이 예가 약하면 분산력-끓는점 관계의 기본을 못 짚는다.", "fx": "'비활성 기체는 원자번호가 클수록 전자 수가 많아 분산력이 커져 끓는점이 높아짐'을 못 박는다. 분산력만 작용하는 이 예로 분산력-끓는점 관계를 익혀라.", "f": "B3", "rk": 447, "d": 4, "rh": 0, "pre": ["CH2-008"], "tr": "비활성 기체 끓는점 순서가 막연해, 원자번호 클수록 전자가 많아 분산력이 커져 높아진다는 게 빠진다.", "an": "원자번호 클수록 전자 많아 분산력이 커져 끓는점이 높다.", "rd": "원자번호가 클수록 전자가 많아 분산력이 크다. 그래서 끓는점이 높다.", "tf": "원자번호가 큰 비활성 기체일수록 끓는점은? (높음)"}, "CH2-011": {"n": "접촉 면적", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "분자가 길게 뻗어 접촉 면적이 넓을수록 분산력이 커진다는 점을 놓친 경우다. 같은 분자식이라도 모양에 따라 접촉 면적이 달라 끓는점이 갈린다는 점이 약하면 이성질체 비교가 어긋난다.", "fx": "'분자가 길게 뻗어 접촉 면적이 넓을수록 분산력이 커짐'을 못 박는다. 같은 분자식이라도 모양 따라 면적이 달라 끓는점이 갈림을 이성질체로 비교하라.", "f": "B3", "rk": 448, "d": 4, "rh": 0, "pre": ["CH2-008"], "tr": "분자 모양이 분산력과 무관할 것 같아, 길게 뻗어 접촉 면적이 넓을수록 커진다는 게 빠진다.", "an": "길게 뻗은 분자일수록 맞닿는 면이 넓어 분산력이 크다: 넓은 테이프가 더 잘 붙는다.", "rd": "길게 뻗으면 맞닿는 면이 넓어 순간 쌍극자가 더 작용한다. 그래서 분산력이 크다.", "tf": "길게 뻗은 분자의 분산력은? (큼: 접촉 면 넓음)"}, "CH2-012": {"n": "무극성 분자 힘", "c": "ch2", "u": "분자간힘", "t": "B", "dx": "무극성 분자는 영구 쌍극자가 없어 분자 간 힘이 아예 없다고 본 경우다. 분산력은 무극성 분자에도 작용한다는 점을 놓치면 무극성 물질이 어떻게 액화·고화되는지 설명하지 못한다.", "fx": "'무극성 분자도 분산력이 작용해 분자 간 힘이 있음(아예 없는 게 아님)'을 못 박는다. 그래서 무극성 물질이 액화·고화됨을 짚어라.", "f": "B2", "rk": 155, "d": 2, "rh": 0, "pre": ["CH2-003"], "tr": "무극성이면 인력이 아예 없을 것 같아, 분산력이 작용한다는 게 빠진다.", "an": "무극성도 분산력은 있다: 인력이 아예 없는 게 아니다.", "rd": "무극성도 순간 쌍극자로 분산력이 있다. 인력이 아예 없는 게 아니다.", "tf": "무극성에 인력이 아예 없나? (있다: 분산력)"}, "CH2-013": {"n": "수소 결합 예", "c": "ch2", "u": "분자간힘", "t": "A", "dx": "수소 결합을 하는 분자를 가릴 때 H가 N·O·F에 붙었는지를 못 따진 경우다(HF·H₂O·NH₃는 되고, HCl·CH₄는 안 됨). 이 판정이 약하면 어느 물질이 비정상적으로 끓는점이 높은지 못 짚는다.", "fx": "수소 결합 분자를 'H가 N·O·F에 붙었는가'로 가린다. HF·H₂O·NH₃는 되고 HCl·CH₄는 안 됨을 적어, 어느 물질이 비정상적으로 끓는점이 높은지 짚어라.", "f": "B2", "rk": 156, "d": 2, "rh": 0, "pre": ["CH2-006"], "tr": "어떤 게 수소 결합하는지 막막해, H가 N·O·F에 붙었는지로 가린다(HF·H₂O·NH₃ O, HCl·CH₄ X)는 게 빠진다.", "an": "H가 N·O·F에 붙었는지로 가린다: HF·H₂O·NH₃는 O, HCl·CH₄는 X.", "rd": "H가 N·O·F에 붙었는지로 가린다. HF·H₂O·NH₃는 되고 HCl·CH₄는 안 된다.", "tf": "HCl에 수소 결합이 있나? (없다: Cl이라)"}, "CH2-014": {"n": "수소 결합 세기", "c": "ch2", "u": "분자간힘", "t": "B", "dx": "수소 결합이 큰 부분 전하 때문에 보통의 쌍극자-쌍극자 힘보다 강하다는 점을 놓친 경우다. 이 세기 차가 약하면 수소 결합 물질의 유독 높은 끓는점을 설명하지 못한다.", "fx": "'수소 결합은 큰 부분 전하 때문에 보통의 쌍극자-쌍극자 힘보다 강함'을 못 박는다. 이 세기 차로 수소 결합 물질의 유독 높은 끓는점을 설명하라.", "f": "B3", "rk": 157, "d": 2, "rh": 6, "pre": ["CH2-006"], "tr": "수소 결합이 보통 쌍극자 힘 정도일 것 같아, 큰 부분 전하로 더 강하다는 게 빠진다.", "an": "큰 부분 전하 덕에 보통 쌍극자 힘보다 강하다.", "rd": "N·O·F의 큰 전기음성도로 부분 전하가 크다. 그래서 보통 쌍극자 힘보다 강하다.", "tf": "수소 결합이 쌍극자 힘보다? (강함)"}, "CH2-015": {"n": "끓는점 이상", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "물이 분자량이 작은데도 같은 족에서 끓는점이 비정상적으로 높은 까닭이 수소 결합이라는 점을 놓친 경우다. 이 예외를 못 잡으면 16족 수소화물 끓는점 그래프의 튀는 점을 설명하지 못한다.", "fx": "'물이 분자량이 작은데도 같은 족에서 끓는점이 비정상적으로 높은 까닭은 수소 결합'임을 못 박는다. 16족 수소화물 끓는점 그래프의 튀는 점을 이로 설명하라.", "f": "B3", "rk": 282, "d": 3, "rh": 0, "pre": ["CH2-014"], "tr": "물이 가벼운데 왜 끓는점이 높은지 막막해, 수소 결합 때문이라는 게 빠진다.", "an": "물이 가벼운데도 끓는점이 높은 건 수소 결합 때문이다.", "rd": "물은 작아 분산력이 약한데도 끓는점이 높다. 수소 결합이 그 차이를 만든다.", "tf": "물이 가벼운데 끓는점이 높은 이유는? (수소 결합)"}, "CH2-016": {"n": "얼음 밀도", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "얼음에서 수소 결합이 규칙적인 빈 공간 구조를 만들어 물보다 밀도가 작아진다는(그래서 뜬다) 점을 놓친 경우다. 이 구조를 못 잡으면 고체가 액체보다 가벼운 물의 예외를 설명하지 못한다.", "fx": "'얼음에서 수소 결합이 규칙적인 빈 공간 구조를 만들어 물보다 밀도가 작아짐(그래서 뜸)'을 못 박는다. 고체가 액체보다 가벼운 물의 예외를 이로 설명하라.", "f": "B3", "rk": 283, "d": 3, "rh": 0, "pre": ["CH2-014"], "tr": "얼음이 물보다 무거워 가라앉을 것 같은데, 수소 결합이 빈 공간 구조를 만들어 밀도가 작아 뜬다는 게 의외다.", "an": "수소 결합이 빈 공간 많은 격자를 만들어 얼음이 물보다 가벼워 뜬다: 무거워 가라앉을 것 같지만 반대다.", "rd": "수소 결합이 일정 각도로 이어져 빈 공간 격자를 만든다. 그래서 얼음이 물보다 가벼워 뜬다.", "tf": "얼음이 물에 뜨는 이유는? (수소 결합 빈 공간 격자)"}, "CH2-017": {"n": "물의 특성", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "물의 높은 끓는점·표면 장력·비열 같은 특성이 수소 결합에서 비롯된다는 점을 놓친 경우다. 분자량은 작은데 인력이 강하다는 연결이 약하면 물의 여러 특이성을 한 원인으로 꿰지 못한다.", "fx": "'물의 높은 끓는점·표면 장력·비열이 모두 수소 결합에서 비롯됨'을 못 박는다. 분자량은 작은데 인력이 강하다는 한 원인으로 물의 특이성을 꿰어라.", "f": "B3", "rk": 284, "d": 3, "rh": 0, "pre": ["CH2-014"], "tr": "물의 높은 끓는점·표면 장력·비열이 막연해, 수소 결합에서 비롯된다는 게 빠진다.", "an": "물의 높은 끓는점·표면 장력·비열은 모두 수소 결합에서 나온다.", "rd": "수소 결합이 분자를 강하게 잡는다. 그래서 끓는점·표면 장력·비열이 크다.", "tf": "물의 높은 비열·표면장력의 원인은? (수소 결합)"}, "CH2-018": {"n": "동족 경향", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "수소 결합이 없는 동족 계열에서 전자 수(분자량)가 클수록 분산력이 커져 끓는점이 높아진다는 경향을 놓친 경우다. 이 기본 경향이 약하면 수소 결합 예외와 정상 경향을 구분하지 못한다.", "fx": "'수소 결합이 없는 동족 계열은 전자 수(분자량)가 클수록 분산력이 커져 끓는점이 높아짐'을 못 박는다. 이 정상 경향을 수소 결합 예외와 구분하라.", "f": "B3", "rk": 449, "d": 4, "rh": 0, "pre": ["CH2-008"], "tr": "동족 계열 끓는점이 막연해, 수소 결합이 없으면 전자 수(분자량)가 클수록 분산력이 커져 높아진다는 게 빠진다.", "an": "수소 결합이 없으면 분자량(전자 수) 클수록 분산력이 커져 끓는점이 높다.", "rd": "수소 결합이 없으면 분산력만 남는다. 그래서 분자량이 클수록 끓는점이 높다.", "tf": "수소 결합 없는 동족에서 분자량이 크면 끓는점은? (높음)"}, "CH2-019": {"n": "끓는점 관계", "c": "ch2", "u": "분자간힘", "t": "A", "dx": "끓는점이 분자 간 힘의 세기에 비례한다는 핵심을 놓친 경우다. 끓음이 분자 간 힘을 끊는 과정이라 힘이 강할수록 더 많은 에너지가 들어 끓는점이 높다는 논리가 없으면 모든 끓는점 비교가 막힌다.", "fx": "'끓는점은 분자 간 힘에 비례(끓음이 분자 간 힘을 끊는 과정이라 힘이 강할수록 더 많은 에너지가 듦)'함을 못 박는다. 이 논리로 모든 끓는점 비교를 풀어라.", "f": "A1", "rk": 53, "d": 1, "rh": 1, "pre": ["CH2-001"], "tr": "끓는점이 무엇으로 정해지는지 막막해, 분자 간 힘 세기에 비례한다는 게 빠진다.", "an": "끓는점은 분자 간 힘 세기에 비례한다.", "rd": "끓으려면 분자 간 힘을 이겨야 한다. 그래서 끓는점이 그 세기에 비례한다.", "tf": "분자 간 힘이 세면 끓는점은? (높음)"}, "CH2-020": {"n": "증기압 관계", "c": "ch2", "u": "분자간힘", "t": "A", "dx": "분자 간 힘이 강하면 분자가 잘 떨어져 나가지 못해 증기압이 작다는 반비례를 놓친 경우다. 힘과 증기압의 반대 관계가 약하면 증기압 비교와 총괄성(증기압 내림)이 흔들린다.", "fx": "'분자 간 힘이 강하면 분자가 잘 떨어져 나가지 못해 증기압이 작음(반비례)'을 못 박는다. 이 반대 관계를 증기압 비교와 총괄성(증기압 내림)의 바탕으로 삼아라.", "f": "A1", "rk": 54, "d": 1, "rh": 2, "pre": ["CH2-001"], "tr": "분자 간 힘이 세면 증기압도 클 것 같아, 잘 못 떨어져 나가 오히려 작다는 게 거꾸로 느껴진다.", "an": "분자 간 힘이 세면 잘 못 떨어져 나가 증기압이 작다: 셀수록 증기압이 작다(반비례).", "rd": "분자 간 힘이 세면 표면을 떠나기 어렵다. 그래서 증기압이 작다(반비례).", "tf": "분자 간 힘이 세면 증기압은? (작음)"}, "CH2-021": {"n": "증발 관계", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "분자 간 힘이 강할수록 분자가 표면을 떠나기 어려워 증발이 잘 안 일어난다는 점을 놓친 경우다. 힘과 증발의 반비례가 약하면 어느 액체가 빨리 마르는지 못 가린다.", "fx": "'분자 간 힘이 강할수록 분자가 표면을 떠나기 어려워 증발이 잘 안 일어남'을 못 박는다. 이 반비례로 어느 액체가 빨리 마르는지 가려라.", "f": "A1", "rk": 55, "d": 1, "rh": 0, "pre": ["CH2-001"], "tr": "분자 간 힘과 증발이 무관할 것 같아, 셀수록 표면을 떠나기 어려워 증발이 잘 안 된다는 게 빠진다.", "an": "분자 간 힘이 셀수록 표면을 떠나기 어려워 증발이 잘 안 된다.", "rd": "분자 간 힘이 셀수록 탈출이 어렵다. 그래서 증발이 잘 안 된다.", "tf": "분자 간 힘이 세면 증발은? (잘 안 됨)"}, "CH2-022": {"n": "녹는점 관계", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "분자 간 힘이 강할수록 녹는점도 높다는 점을 놓친 경우다. 고체에서 분자를 떼어내는 데 더 큰 에너지가 든다는 연결이 약하면 분자 결정의 녹는점 비교가 어긋난다.", "fx": "'분자 간 힘이 강할수록 녹는점도 높음(고체에서 떼는 데 더 큰 에너지)'을 못 박는다. 이 연결로 분자 결정의 녹는점을 비교하라.", "f": "A1", "rk": 56, "d": 1, "rh": 0, "pre": ["CH2-001"], "tr": "분자 간 힘과 녹는점이 무관할 것 같아, 셀수록 녹는점도 높다는 게 빠진다.", "an": "분자 간 힘이 셀수록 녹는점도 높다.", "rd": "분자 간 힘이 셀수록 끊으려면 더 데워야 한다. 그래서 녹는점이 높다.", "tf": "분자 간 힘이 세면 녹는점은? (높음)"}, "CH2-023": {"n": "끓는점 해석", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "끓는점을 분자 간 힘 세기의 척도로 읽지 못한 경우다. 끓는점이 높다는 건 힘이 강하다는 뜻이라는 역방향 해석이 약하면 끓는점 자료로 힘을 비교하지 못한다.", "fx": "'끓는점이 높다는 건 분자 간 힘이 강하다는 뜻'으로 역방향 해석을 못 박는다. 끓는점 자료를 힘의 척도로 읽어 분자 간 힘을 비교하라.", "f": "A1", "rk": 158, "d": 2, "rh": 0, "pre": ["CH2-019"], "tr": "끓는점이 막연한 숫자 같아, 분자 간 힘 세기의 척도라는 게 빠진다.", "an": "끓는점은 분자 간 힘 세기의 척도다.", "rd": "끓는점은 분자 간 힘을 이기는 온도다. 그래서 그 세기의 척도다.", "tf": "끓는점은 무엇의 척도? (분자 간 힘 세기)"}, "CH2-024": {"n": "극성과 끓는점", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "극성 분자가 분산력에 더해 쌍극자-쌍극자 힘까지 작용해 비슷한 크기의 무극성 분자보다 끓는점이 높다는 점을 놓친 경우다. 힘이 '더해진다'는 점이 약하면 극성·무극성 끓는점 차이를 못 짚는다.", "fx": "'극성 분자는 분산력에 쌍극자-쌍극자 힘까지 더해져 비슷한 크기의 무극성보다 끓는점이 높음'을 못 박는다. 힘이 '더해짐'을 잡아 극성·무극성 차이를 짚어라.", "f": "B3", "rk": 450, "d": 4, "rh": 0, "pre": ["CH2-005", "CH2-008"], "tr": "크기 같으면 끓는점도 같을 것 같아, 극성은 쌍극자 힘까지 더해져 더 높다는 게 빠진다.", "an": "크기 같으면 극성이 쌍극자 힘까지 더해져 끓는점이 더 높다.", "rd": "극성은 쌍극자 힘이 더해진다. 그래서 크기가 같아도 끓는점이 더 높다.", "tf": "크기 같으면 극성과 무극성 중 끓는점이 높은 건? (극성)"}, "CH2-025": {"n": "증기압 해석", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "증기압이 크다는 것을 분자 간 힘이 약해 증발이 잘 된다는 뜻으로 읽지 못한 경우다. 증기압을 힘의 척도로 역해석하지 못하면 증기압 자료로 휘발성을 비교하지 못한다.", "fx": "'증기압이 크다는 건 분자 간 힘이 약해 증발이 잘 된다는 뜻'으로 역해석을 못 박는다. 증기압 자료로 휘발성을 비교하라.", "f": "A1", "rk": 159, "d": 2, "rh": 0, "pre": ["CH2-020"], "tr": "증기압이 크다는 게 막연해, 분자 간 힘이 약해 증발이 잘 된다는 뜻이라는 게 빠진다.", "an": "증기압이 크다는 건 분자 간 힘이 약해 증발이 잘 된다는 뜻이다.", "rd": "증기압이 크면 분자가 잘 탈출한다는 뜻이다. 즉 분자 간 힘이 약하다.", "tf": "증기압이 크면 분자 간 힘은? (약함)"}, "CH2-026": {"n": "점성 관계", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "분자 간 힘이 강할수록 분자가 서로 잘 미끄러지지 못해 점성이 크다는 점을 놓친 경우다. 힘과 점성의 비례가 약하면 액체의 끈적임 차이를 분자 간 힘으로 설명하지 못한다.", "fx": "'분자 간 힘이 강할수록 분자가 서로 잘 미끄러지지 못해 점성이 큼'을 못 박는다. 이 비례로 액체의 끈적임 차이를 분자 간 힘으로 설명하라.", "f": "A1", "rk": 57, "d": 1, "rh": 0, "pre": ["CH2-001"], "tr": "분자 간 힘과 점성이 무관할 것 같아, 셀수록 잘 안 미끄러져 점성이 크다는 게 빠진다.", "an": "분자 간 힘이 셀수록 잘 안 미끄러져 점성이 크다.", "rd": "분자 간 힘이 셀수록 층이 미끄러지기 어렵다. 그래서 점성이 크다.", "tf": "분자 간 힘이 세면 점성은? (큼)"}, "CH2-027": {"n": "종합 비교", "c": "ch2", "u": "분자간힘", "t": "C", "dx": "끓는점을 비교할 때 분산력(크기)과 극성을 함께 따지지 못한 경우다. 분산력 차이가 크면 무극성이라도 작은 극성 분자보다 끓는점이 높을 수 있다는 점이 약하면 종합 비교가 어긋난다.", "fx": "끓는점 비교를 '분산력(크기)과 극성을 함께 따져' 한다. 분산력 차이가 크면 무극성이라도 작은 극성 분자보다 끓는점이 높을 수 있음을 잡아 종합 비교하라.", "f": "A4", "rk": 451, "d": 4, "rh": 0, "pre": ["CH2-008", "CH2-005"], "tr": "끓는점을 한 요인으로 볼 것 같아, 분산력(크기)과 극성을 함께 따져야 한다는 게 빠진다.", "an": "끓는점은 분산력(크기)과 극성을 함께 따져야 한다.", "rd": "끓는점은 크기(분산력)와 극성을 함께 따져야 한다.", "tf": "끓는점은 분산력과 무엇을 함께 보나? (극성)"}, "CH2-028": {"n": "휘발성", "c": "ch2", "u": "분자간힘-d", "t": "B", "dx": "휘발성이 분자 간 힘에 반비례해 힘이 약할수록 잘 증발한다는 점을 놓친 경우다. 이 반비례가 약하면 어느 물질이 더 휘발성인지 분자 간 힘으로 판단하지 못한다.", "fx": "'휘발성은 분자 간 힘에 반비례해 힘이 약할수록 잘 증발'함을 못 박는다. 이 반비례로 어느 물질이 더 휘발성인지 분자 간 힘으로 판단하라.", "f": "A1", "rk": 160, "d": 2, "rh": 0, "pre": ["CH2-020"], "tr": "분자 간 힘과 휘발성이 무관할 것 같아, 힘이 약할수록 잘 증발한다(반비례)는 게 빠진다.", "an": "분자 간 힘이 약할수록 잘 증발한다(반비례).", "rd": "분자 간 힘이 약하면 잘 탈출한다. 그래서 잘 증발한다(반비례).", "tf": "분자 간 힘이 약하면 휘발성은? (큼)"}, "CH2-029": {"n": "상태 결정", "c": "ch2", "u": "분자간힘-d", "t": "C", "dx": "같은 온도에서 분자 간 힘이 분자의 응집 정도를 정해 고체·액체·기체를 가른다는 점을 놓친 경우다. 힘이 강하면 뭉치고 약하면 흩어진다는 연결이 약하면 물질의 상태를 설명하지 못한다.", "fx": "'같은 온도에서 분자 간 힘이 응집 정도를 정해 고체·액체·기체를 가름(강하면 뭉치고 약하면 흩어짐)'을 못 박는다. 힘으로 물질의 상태를 설명하라.", "f": "B3", "rk": 58, "d": 1, "rh": 0, "pre": ["CH2-001"], "tr": "같은 온도면 상태가 정해질 것 같아, 분자 간 힘이 응집 정도를 정해 고체·액체·기체를 가른다는 게 빠진다.", "an": "분자 간 힘이 응집 정도를 정해 고체·액체·기체를 가른다.", "rd": "분자 간 힘이 응집 정도를 정한다. 그래서 고체·액체·기체가 갈린다.", "tf": "고체·액체·기체를 가르는 건? (분자 간 힘)"}, "CH2-030": {"n": "힘의 공존", "c": "ch2", "u": "분자간힘-d", "t": "B", "dx": "극성 분자엔 쌍극자-쌍극자나 수소 결합과 함께 분산력도 늘 깔려 있다는 점(여러 힘의 공존)을 놓친 경우다. 분산력을 빼고 한 힘만 보면 분자 간 힘의 총세기를 잘못 잡는다.", "fx": "'극성 분자엔 쌍극자-쌍극자나 수소 결합과 함께 분산력도 늘 깔려 있음(공존)'을 못 박는다. 분산력을 빼지 말고 분자 간 힘의 총세기를 잡아라.", "f": "A4", "rk": 161, "d": 2, "rh": 0, "pre": ["CH2-005", "CH2-003"], "tr": "극성 분자엔 쌍극자 힘만 있을 것 같아, 분산력도 늘 함께 깔려 있다는 게 빠진다.", "an": "극성 분자에도 분산력이 늘 함께 깔려 있다.", "rd": "분산력은 모든 분자에 있다. 그래서 극성 분자에도 분산력이 함께 깔린다.", "tf": "극성 분자에 분산력이 있나? (있다)"}, "CH2-031": {"n": "세기 순서", "c": "ch2", "u": "분자간힘-d", "t": "C", "dx": "분자 간 힘의 세기가 대체로 분산력 < 쌍극자-쌍극자 < 수소 결합 순이라는 점을 놓친 경우다(단 분산력은 크기에 따라 매우 커질 수 있음). 이 순서가 약하면 분자 간 힘 비교가 어긋난다.", "fx": "'분자 간 힘 세기가 대체로 분산력 < 쌍극자-쌍극자 < 수소 결합 순(단 분산력은 크기에 따라 매우 커질 수 있음)'임을 못 박는다. 이 순서로 분자 간 힘을 비교하라.", "f": "C1", "rk": 452, "d": 4, "rh": 0, "pre": ["CH2-005", "CH2-006", "CH2-008"], "tr": "분자 간 힘 세기 순서가 막연해, 대체로 분산력<쌍극자<수소 결합(단 분산력은 크기로 커질 수 있음)이라는 게 빠진다.", "an": "대체로 분산력<쌍극자<수소 결합: 단 분산력은 크기로 커질 수 있다.", "rd": "대체로 분산력<쌍극자<수소 결합이다. 단 분산력은 크기로 커질 수 있다.", "tf": "분산력·쌍극자·수소 결합 중 보통 가장 약한 건? (분산력)"}, "CH2-032": {"n": "이온-쌍극자", "c": "ch2", "u": "분자간힘-d", "t": "C", "dx": "이온-쌍극자 힘이 이온과 극성 분자 사이에 작용해 물 분자가 이온을 둘러싼다는(수화) 점을 놓친 경우다. 이 힘이 약하면 이온 결정이 물에 녹는 용해 과정을 설명하지 못한다.", "fx": "이온-쌍극자 힘을 '이온과 극성 분자 사이에 작용해 물 분자가 이온을 둘러쌈(수화)'으로 못 박는다. 이 힘으로 이온 결정이 물에 녹는 과정을 설명하라.", "f": "B2", "rk": 162, "d": 2, "rh": 0, "pre": ["CH2-005"], "tr": "이온-쌍극자 힘이 막연해, 이온과 극성 분자 사이라 물이 이온을 둘러싼다(수화)는 게 빠진다.", "an": "이온과 극성 분자 사이 인력: 물이 이온을 둘러싼다(수화).", "rd": "이온과 극성 분자의 부분 전하가 끈다. 그래서 물이 이온을 둘러싼다(수화).", "tf": "물이 이온을 둘러싸는 힘은? (이온-쌍극자)"}, "CH2-033": {"n": "생체 적용", "c": "ch2", "u": "분자간힘-d", "t": "C", "dx": "DNA 이중 나선·단백질 구조를 잡아 주는 힘이 수소 결합이라는 점을 놓친 경우다. 분자 간 힘이 생체 분자에서 하는 역할이 약하면 화학과 생명의 연결을 못 짚는다.", "fx": "'DNA 이중 나선·단백질 구조를 잡아 주는 힘이 수소 결합'임을 못 박는다. 분자 간 힘이 생체 분자에서 하는 역할로 화학과 생명을 이어라.", "f": "B2", "rk": 285, "d": 3, "rh": 0, "pre": ["CH2-014"], "tr": "생체 분자를 잡는 힘이 막연해, DNA 이중 나선·단백질을 수소 결합이 잡는다는 게 빠진다.", "an": "DNA 이중 나선·단백질을 수소 결합이 잡아준다.", "rd": "수소 결합이 약하지만 많아 큰 분자를 잡는다. 그래서 DNA·단백질 구조를 유지한다.", "tf": "DNA 이중 나선을 잡는 힘은? (수소 결합)"}, "CH2-034": {"n": "분산력 비교", "c": "ch2", "u": "분자간힘-d", "t": "C", "dx": "모두 무극성인 분자들끼리는 분산력 차이(전자 수·크기)만으로 끓는점이 갈린다는 점을 놓친 경우다. 분산력 하나로 비교하는 감각이 약하면 무극성 분자들의 순서를 못 잡는다.", "fx": "'모두 무극성인 분자끼리는 분산력 차이(전자 수·크기)만으로 끓는점이 갈림'을 못 박는다. 분산력 하나로 무극성 분자들의 순서를 잡아라.", "f": "C1", "rk": 453, "d": 4, "rh": 0, "pre": ["CH2-008"], "tr": "무극성끼리 끓는점이 막연해, 분산력 차이(전자 수·크기)만으로 갈린다는 게 빠진다.", "an": "무극성끼리는 분산력 차이(전자 수·크기)만으로 끓는점이 갈린다.", "rd": "무극성끼리는 분산력만 작용한다. 그래서 전자 수·크기 차이가 끓는점을 가른다.", "tf": "무극성끼리 끓는점을 가르는 건? (전자 수·크기)"}, "CH2-035": {"n": "수소 결합 효과", "c": "ch2", "u": "분자간힘-d", "t": "C", "dx": "수소 결합이 더해지면 추가로 강한 인력이 생겨 끓는점·녹는점이 크게 올라간다는 점을 놓친 경우다. 이 추가 효과가 약하면 수소 결합 물질이 왜 유독 끓는점이 높은지 설명하지 못한다.", "fx": "'수소 결합이 더해지면 추가로 강한 인력이 생겨 끓는점·녹는점이 크게 올라감'을 못 박는다. 이 추가 효과로 수소 결합 물질의 유독 높은 끓는점을 설명하라.", "f": "B3", "rk": 286, "d": 3, "rh": 0, "pre": ["CH2-014"], "tr": "수소 결합이 더해지면 끓는점이 막연히 변할 것 같아, 크게 올라간다는 게 빠진다.", "an": "수소 결합이 더해지면 끓는점이 크게 올라간다.", "rd": "수소 결합이 분자를 더 강하게 잡는다. 그래서 끓는점이 크게 오른다.", "tf": "수소 결합이 더해지면 끓는점은? (크게 오름)"}, "CH2-231": {"n": "반응 속도 정의", "c": "ch2", "u": "반응속도", "t": "C", "dx": "반응 속도가 단위 시간당 농도 변화라는 정의를 놓친 경우다. 시간당 농도가 얼마나 변하는지가 속도라는 점이 약하면 속도를 정량적으로 다루지 못한다.", "fx": "반응 속도를 '단위 시간당 농도 변화'로 못 박는다. 시간당 농도가 얼마나 변하는지가 속도임을 잡아 속도를 정량적으로 다뤄라.", "f": "B2", "rk": 18, "d": 0, "rh": 19, "pre": [], "tr": "반응 속도가 막연한 빠르기 같아, 단위 시간당 농도 변화라는 게 빠진다.", "an": "반응 속도는 단위 시간당 농도 변화다.", "rd": "속도는 단위 시간당 농도 변화다.", "tf": "단위 시간당 농도 변화는? (반응 속도)"}, "CH2-232": {"n": "반응 속도 표현", "c": "ch2", "u": "반응속도", "t": "C", "dx": "반응 속도를 반응물 농도 감소나 생성물 농도 증가 어느 쪽으로도 나타낼 수 있다는 점을 놓친 경우다. 부호와 계수를 맞춰 표현하지 못하면 속도 정의가 어긋난다.", "fx": "'반응 속도는 반응물 농도 감소나 생성물 농도 증가 어느 쪽으로도 나타냄(부호·계수 맞춤)'을 못 박는다. 부호와 계수를 맞춰 같은 속도로 표현하라.", "f": "B2", "rk": 90, "d": 1, "rh": 0, "pre": ["CH2-231"], "tr": "속도를 한 쪽으로만 나타낼 것 같아, 반응물 감소나 생성물 증가 어느 쪽으로도 된다는 게 빠진다.", "an": "반응물 감소나 생성물 증가 어느 쪽으로도 나타낸다.", "rd": "반응물이 줄고 생성물이 는다. 그래서 어느 쪽으로도 나타낸다.", "tf": "속도를 반응물과 생성물 중 무엇으로? (둘 다 가능)"}, "CH2-233": {"n": "충돌 이론", "c": "ch2", "u": "반응속도", "t": "C", "dx": "반응이 입자 충돌로 일어나되 모든 충돌이 아니라 유효 충돌만 반응으로 이어진다는 충돌 이론을 놓친 경우다. 충돌과 반응을 같다고 보면 왜 충돌이 많아도 반응이 느릴 수 있는지 설명하지 못한다.", "fx": "충돌 이론을 '반응이 입자 충돌로 일어나되 모든 충돌이 아니라 유효 충돌만 반응으로 이어짐'으로 못 박는다. 충돌과 반응이 같지 않음을 잡아 충돌이 많아도 느릴 수 있는 까닭을 설명하라.", "f": "B2", "rk": 91, "d": 1, "rh": 13, "pre": ["CH2-231"], "tr": "부딪치면 다 반응할 것 같아, 유효 충돌만 반응으로 이어진다는 게 빠진다.", "an": "부딪쳐야 반응하되 유효 충돌만 반응으로 이어진다.", "rd": "반응은 충돌에서 시작하되 에너지·배향이 맞아야 한다. 그래서 유효 충돌만 반응한다.", "tf": "충돌하면 다 반응하나? (아니다: 유효 충돌만)"}, "CH2-234": {"n": "유효 충돌", "c": "ch2", "u": "반응속도", "t": "C", "dx": "유효 충돌이 충분한 에너지뿐 아니라 올바른 방향까지 갖춘 충돌이라는 점을 놓친 경우다. 에너지만 보면 방향이 안 맞아 반응 안 되는 충돌을 놓쳐 속도 해석이 어긋난다.", "fx": "유효 충돌을 '충분한 에너지뿐 아니라 올바른 방향까지 갖춘 충돌'로 못 박는다. 에너지만 보지 말고 방향이 안 맞아 반응 안 되는 충돌까지 따져라.", "f": "A4", "rk": 197, "d": 2, "rh": 9, "pre": ["CH2-233"], "tr": "유효 충돌이 막연해, 충분한 에너지와 올바른 방향을 다 갖춘 충돌이라는 게 빠진다.", "an": "충분한 에너지와 올바른 방향을 다 갖춘 충돌이다.", "rd": "충분한 에너지와 올바른 방향을 다 갖춘 충돌이 유효 충돌이다.", "tf": "에너지와 방향을 갖춘 충돌은? (유효 충돌)"}, "CH2-235": {"n": "활성화 에너지", "c": "ch2", "u": "반응속도", "t": "A", "dx": "활성화 에너지가 반응이 일어나려면 넘어야 하는 에너지 장벽이고 이 장벽이 높을수록 반응이 느리다는 점을 놓친 경우다. 장벽 개념이 약하면 온도·촉매가 속도를 바꾸는 원리를 못 짚는다.", "fx": "활성화 에너지를 '반응이 일어나려면 넘어야 하는 에너지 장벽, 높을수록 느림'으로 못 박는다. 장벽 개념으로 온도·촉매가 속도를 바꾸는 원리를 짚어라.", "f": "B3", "rk": 336, "d": 3, "rh": 8, "pre": ["CH2-234"], "tr": "활성화 에너지가 막연해, 넘어야 할 에너지 장벽이고 높을수록 느리다는 게 빠진다.", "an": "넘어야 할 에너지 장벽(고개), 높을수록 느리다.", "rd": "넘어야 할 에너지 봉우리가 활성화 에너지다. 높을수록 넘는 분자가 적어 느리다.", "tf": "넘어야 할 에너지 장벽은? (활성화 에너지)"}, "CH2-236": {"n": "농도와 속도", "c": "ch2", "u": "반응속도", "t": "C", "dx": "농도가 높을수록 입자가 많아 충돌 빈도가 늘어 반응이 빨라진다는 점을 놓친 경우다. 농도와 충돌 빈도의 연결이 약하면 농도 효과를 설명하지 못한다.", "fx": "'농도가 높을수록 입자가 많아 충돌 빈도가 늘어 빨라짐'을 못 박는다. 농도와 충돌 빈도를 이어 농도 효과를 설명하라.", "f": "B3", "rk": 198, "d": 2, "rh": 1, "pre": ["CH2-233"], "tr": "농도와 속도가 무관할 것 같아, 높을수록 충돌 빈도가 늘어 빨라진다는 게 빠진다.", "an": "농도 높을수록 충돌 빈도가 늘어 빨라진다.", "rd": "농도가 높으면 충돌이 잦다. 그래서 빨라진다.", "tf": "농도가 높으면 속도는? (빠름)"}, "CH2-237": {"n": "온도와 속도", "c": "ch2", "u": "반응속도", "t": "C", "dx": "온도가 높을수록 입자 운동이 활발해지고 활성화 에너지를 넘는 입자가 크게 늘어 반응이 빨라진다는 점을 놓친 경우다. 온도가 단지 충돌 빈도만이 아니라 유효 충돌 비율을 키운다는 점이 약하면 온도 효과를 과소평가한다.", "fx": "'온도가 높을수록 입자 운동이 활발하고 활성화 에너지를 넘는 입자가 크게 늘어 빨라짐'을 못 박는다. 온도가 충돌 빈도만이 아니라 유효 충돌 비율을 키움을 잡아 온도 효과를 과소평가 마라.", "f": "B3", "rk": 496, "d": 4, "rh": 1, "pre": ["CH2-235"], "tr": "온도와 속도가 막연해, 높을수록 장벽 넘는 입자가 크게 늘어 빨라진다는 게 빠진다.", "an": "온도 높을수록 장벽 넘는 입자가 크게 늘어 빨라진다.", "rd": "온도가 높으면 장벽 넘는 분자가 크게 는다. 그래서 빨라진다.", "tf": "온도가 높으면 속도는? (빠름)"}, "CH2-238": {"n": "표면적과 속도", "c": "ch2", "u": "반응속도", "t": "C", "dx": "고체 반응물의 표면적이 넓을수록 충돌할 면이 많아 반응이 빨라진다는 점을 놓친 경우다. 덩어리를 잘게 쪼개면 빨라진다는 점이 약하면 표면적 효과를 설명하지 못한다.", "fx": "'고체 반응물의 표면적이 넓을수록 충돌할 면이 많아 빨라짐'을 못 박는다. 덩어리를 잘게 쪼개면 빨라짐을 잡아 표면적 효과를 설명하라.", "f": "B3", "rk": 199, "d": 2, "rh": 0, "pre": ["CH2-233"], "tr": "표면적과 속도가 무관할 것 같아, 넓을수록 충돌 면이 많아 빨라진다는 게 빠진다.", "an": "표면적 넓을수록 충돌 면이 많아 빨라진다: 가루가 덩어리보다 빠르다.", "rd": "표면적이 넓으면 충돌 면이 많다. 그래서 빨라진다.", "tf": "가루와 덩어리 중 빠른 건? (가루: 표면적 큼)"}, "CH2-239": {"n": "촉매", "c": "ch2", "u": "반응속도", "t": "C", "dx": "촉매가 활성화 에너지를 낮춰 반응을 빠르게 하면서 자신은 소모되지 않는다는 점을 놓친 경우다. 촉매의 두 특징이 약하면 촉매가 어떻게 속도만 바꾸는지 못 짚는다.", "fx": "촉매를 '활성화 에너지를 낮춰 반응을 빠르게 하면서 자신은 소모되지 않음'으로 못 박는다. 이 두 특징으로 촉매가 어떻게 속도만 바꾸는지 짚어라.", "f": "B3", "rk": 497, "d": 4, "rh": 4, "pre": ["CH2-235"], "tr": "촉매가 소모될 것 같아, 활성화 에너지를 낮춰 빠르게 하면서 자신은 안 소모된다는 게 빠진다.", "an": "촉매는 활성화 에너지를 낮춰 빠르게 하면서 자신은 안 소모한다.", "rd": "촉매는 더 낮은 장벽 경로를 연다. 빨라지되 자신은 소모되지 않는다.", "tf": "활성화 에너지를 낮추고 안 닳는 건? (촉매)"}, "CH2-240": {"n": "촉매와 엔탈피", "c": "ch2", "u": "반응속도", "t": "A", "dx": "촉매가 활성화 에너지만 낮출 뿐 반응물·생성물의 에너지(ΔH)는 바꾸지 않고 정·역반응을 똑같이 빠르게 한다는 점을 놓친 경우다. 촉매가 ΔH나 평형 위치를 바꾼다고 오해하면 속도와 평형을 뒤섞는다.", "fx": "'촉매는 활성화 에너지만 낮출 뿐 반응물·생성물의 에너지(ΔH)는 안 바꾸고 정·역반응을 똑같이 빠르게 함'을 못 박는다. 촉매가 ΔH나 평형 위치를 바꾼다고 오해 마라.", "f": "A3", "rk": 628, "d": 5, "rh": 0, "pre": ["CH2-239"], "tr": "촉매가 ΔH도 바꿀 것 같아, 활성화 에너지만 낮추고 ΔH는 그대로이며 정·역을 똑같이 빠르게 한다는 게 빠진다.", "an": "촉매는 활성화 에너지만 낮추고 ΔH는 그대로, 정·역을 똑같이 빠르게 한다.", "rd": "촉매는 장벽만 낮추고 시작·끝은 그대로다. 그래서 ΔH는 안 바뀌고 정·역이 같이 빨라진다.", "tf": "촉매가 ΔH를 바꾸나? (안 바꿈)"}, "CH2-241": {"n": "촉매 종류", "c": "ch2", "u": "반응속도", "t": "C", "dx": "촉매에 활성화 에너지를 낮추는 정촉매뿐 아니라 높이는 부촉매도 있다는 점을 놓친 경우다. 촉매가 늘 속도를 높인다고만 보면 부촉매의 작용을 설명하지 못한다.", "fx": "'촉매에 활성화 에너지를 낮추는 정촉매뿐 아니라 높이는 부촉매도 있음'을 못 박는다. 촉매가 늘 속도를 높인다고만 보지 말고 부촉매 작용을 설명하라.", "f": "D1", "rk": 629, "d": 5, "rh": 0, "pre": ["CH2-239"], "tr": "촉매가 빠르게만 할 것 같아, 활성화 에너지를 높이는 부촉매도 있다는 게 빠진다.", "an": "활성화 에너지를 높이는 부촉매도 있다.", "rd": "장벽을 높이는 부촉매도 있다.", "tf": "활성화 에너지를 높이는 건? (부촉매)"}, "CH2-242": {"n": "속도식", "c": "ch2", "u": "반응속도", "t": "C", "dx": "속도식이 반응식 계수가 아니라 실험으로 정해지고 농도와 속도 상수 k로 이뤄진다는 점을 놓친 경우다. 계수에서 속도식을 바로 읽으려 하면 반응 차수가 어긋난다.", "fx": "속도식을 '반응식 계수가 아니라 실험으로 정해지고 농도와 속도 상수 k로 이뤄짐'으로 못 박는다. 계수에서 속도식을 바로 읽지 말고 실험 차수를 써라.", "f": "D1", "rk": 92, "d": 1, "rh": 4, "pre": ["CH2-231"], "tr": "속도식이 반응식 계수에서 나올 것 같아, 실험으로 정하고 농도와 k로 이뤄진다는 게 빠진다.", "an": "속도식은 실험으로 정하고 농도와 k로 이뤄진다: 계수에서 못 읽는다.", "rd": "속도가 농도에 어떻게 의존하나는 메커니즘이 정한다. 그래서 실험으로 정한다.", "tf": "속도식은 무엇으로 정하나? (실험)"}, "CH2-243": {"n": "반응 차수", "c": "ch2", "u": "반응속도", "t": "C", "dx": "반응 차수가 속도식에서 각 농도에 붙는 지수이고 실험으로 정해진다는 점을 놓친 경우다. 차수를 계수로 짐작하면 속도식 적용이 어긋난다.", "fx": "반응 차수를 '속도식에서 각 농도에 붙는 지수이고 실험으로 정해짐'으로 못 박는다. 차수를 계수로 짐작 말고 실험으로 정해 속도식에 써라.", "f": "A2", "rk": 200, "d": 2, "rh": 1, "pre": ["CH2-242"], "tr": "차수가 계수일 것 같아, 속도식 농도의 지수이고 실험으로 정한다는 게 빠진다.", "an": "차수는 속도식 농도의 지수, 실험으로 정한다.", "rd": "차수는 속도식 농도의 지수다. 실험으로 정한다.", "tf": "속도식 농도의 지수는? (차수)"}, "CH2-244": {"n": "속도 상수", "c": "ch2", "u": "반응속도", "t": "A", "dx": "속도 상수 k가 농도에는 의존하지 않고 온도와 활성화 에너지에 따라 정해진다는 점을 놓친 경우다. k가 농도로 변한다고 오해하면 속도식의 의미를 잘못 잡는다.", "fx": "속도 상수 k를 '농도에는 의존하지 않고 온도와 활성화 에너지에 따라 정해짐'으로 못 박는다. k가 농도로 변한다고 오해 말고 속도식의 의미를 잡아라.", "f": "A3", "rk": 201, "d": 2, "rh": 1, "pre": ["CH2-242"], "tr": "k가 농도 따라 변할 것 같아, 온도와 활성화 에너지에만 의존한다는 게 빠진다.", "an": "k는 온도와 활성화 에너지에만 의존: 농도 무관이다.", "rd": "k는 충돌·배향·장벽을 담는다. 농도가 아니라 온도·Ea로 정해진다.", "tf": "k는 농도에 의존하나? (안 함)"}, "CH2-245": {"n": "아레니우스 식", "c": "ch2", "u": "반응속도", "t": "C", "dx": "아레니우스 식이 온도가 높거나 활성화 에너지가 낮을수록 속도 상수 k가 커진다는 관계를 나타낸다는 점을 놓친 경우다. 이 관계가 약하면 온도가 k를 통해 속도를 바꾸는 정도를 못 가늠한다.", "fx": "아레니우스 식을 '온도가 높거나 활성화 에너지가 낮을수록 속도 상수 k가 커짐'으로 못 박는다. 이 관계로 온도가 k를 통해 속도를 바꾸는 정도를 가늠하라.", "f": "A2", "rk": 498, "d": 4, "rh": 0, "pre": ["CH2-235", "CH2-244"], "tr": "아레니우스 식이 막연해, 온도 높거나 활성화 에너지 낮을수록 k가 커진다는 게 빠진다.", "an": "온도 높거나 활성화 에너지 낮을수록 k가 커진다.", "rd": "k=Ae^(-Ea/RT)다. 온도가 높거나 Ea가 작으면 k가 커진다.", "tf": "온도가 높거나 Ea가 작으면 k는? (큼)"}, "CH2-246": {"n": "촉매와 역반응", "c": "ch2", "u": "반응속도", "t": "A", "dx": "촉매가 정반응과 역반응의 활성화 에너지를 똑같이 낮춰 평형 위치는 그대로 두고 평형 도달만 앞당긴다는 점을 놓친 경우다. 한쪽만 빨라진다고 보면 촉매가 평형을 옮긴다는 오개념에 빠진다.", "fx": "'촉매는 정·역반응의 활성화 에너지를 똑같이 낮춰 평형 위치는 그대로 두고 평형 도달만 앞당김'을 못 박는다. 한쪽만 빨라진다고 보지 말고 촉매가 평형을 옮긴다는 오개념을 피하라.", "f": "A3", "rk": 630, "d": 5, "rh": 0, "pre": ["CH2-239"], "tr": "촉매가 평형을 옮길 것 같아, 정·역 활성화 에너지를 똑같이 낮춰 위치는 그대로 두고 도달만 앞당긴다는 게 빠진다.", "an": "촉매는 정·역을 똑같이 낮춰 위치는 그대로 두고 도달만 앞당긴다.", "rd": "촉매는 정·역 장벽을 똑같이 낮춘다. 그래서 위치는 그대로 두고 도달만 앞당긴다.", "tf": "촉매가 정·역 중 무엇을 빠르게? (둘 다)"}, "CH2-247": {"n": "온도와 유효 충돌", "c": "ch2", "u": "반응속도", "t": "C", "dx": "온도가 높아지면 빠른 입자가 많아져 활성화 에너지를 넘는 유효 충돌이 크게 는다는 점을 놓친 경우다. 속력 분포의 이동이 약하면 온도가 왜 속도를 급격히 올리는지 못 짚는다.", "fx": "'온도가 높아지면 빠른 입자가 많아져 활성화 에너지를 넘는 유효 충돌이 크게 늚'을 못 박는다. 속력 분포의 이동으로 온도가 왜 속도를 급격히 올리는지 짚어라.", "f": "B3", "rk": 631, "d": 5, "rh": 0, "pre": ["CH2-237"], "tr": "온도가 충돌 횟수만 늘릴 것 같아, 빠른 입자가 많아져 장벽 넘는 유효 충돌이 크게 는다는 게 빠진다.", "an": "온도가 오르면 빠른 입자가 많아져 장벽 넘는 유효 충돌이 크게 는다.", "rd": "온도가 오르면 에너지 분포가 옮겨 장벽 넘는 비율이 는다. 그래서 유효 충돌이 는다.", "tf": "온도가 오르면 유효 충돌은? (증가)"}, "CH2-248": {"n": "촉매 작용", "c": "ch2", "u": "반응속도", "t": "C", "dx": "촉매가 활성화 에너지가 더 낮은 다른 반응 경로를 열어 준다는 점을 놓친 경우다. 새 경로를 연다는 그림이 약하면 촉매가 어떻게 장벽을 낮추는지 설명하지 못한다.", "fx": "촉매를 '활성화 에너지가 더 낮은 다른 반응 경로를 열어 줌'으로 못 박는다. 새 경로를 연다는 그림으로 촉매가 어떻게 장벽을 낮추는지 설명하라.", "f": "B3", "rk": 632, "d": 5, "rh": 0, "pre": ["CH2-239"], "tr": "촉매가 어떻게 낮추는지 막막해, 활성화 에너지가 더 낮은 다른 경로를 열어서라는 게 빠진다.", "an": "촉매는 활성화 에너지가 더 낮은 다른 경로(지름길)를 연다.", "rd": "촉매는 Ea가 더 낮은 다른 경로를 연다. 그래서 빨라진다.", "tf": "촉매는 무엇을 여나? (낮은 장벽 경로)"}, "CH2-249": {"n": "시간과 속도", "c": "ch2", "u": "반응속도", "t": "C", "dx": "시간이 지나며 반응물 농도가 줄어 반응 속도가 점점 느려진다는 점을 놓친 경우다. 농도 감소와 속도 저하의 연결이 약하면 속도-시간 그래프를 잘못 읽는다.", "fx": "'시간이 지나며 반응물 농도가 줄어 반응 속도가 점점 느려짐'을 못 박는다. 농도 감소와 속도 저하를 이어 속도-시간 그래프를 읽어라.", "f": "A1", "rk": 337, "d": 3, "rh": 0, "pre": ["CH2-236"], "tr": "반응 속도가 일정할 것 같아, 시간이 지나며 반응물이 줄어 점점 느려진다는 게 빠진다.", "an": "시간이 지나며 반응물이 줄어 속도가 점점 느려진다.", "rd": "시간이 지나면 반응물이 줄어 충돌이 준다. 그래서 속도가 느려진다.", "tf": "시간이 지나면 속도는? (느려짐: 반응물 감소)"}, "CH2-250": {"n": "전체 차수", "c": "ch2", "u": "반응속도", "t": "C", "dx": "전체 반응 차수가 각 반응물 차수의 합이고 실험으로 정한 값이라는 점을 놓친 경우다. 차수의 합이라는 점이 약하면 전체 차수를 잘못 구한다.", "fx": "전체 반응 차수를 '각 반응물 차수의 합이고 실험으로 정한 값'으로 못 박는다. 차수의 합임을 잡아 전체 차수를 바로 구하라.", "f": "D3", "rk": 338, "d": 3, "rh": 0, "pre": ["CH2-243"], "tr": "전체 차수가 막연해, 각 반응물 차수의 합이고 실험값이라는 게 빠진다.", "an": "전체 차수는 각 반응물 차수의 합, 실험값이다.", "rd": "각 반응물 차수의 합이 전체 차수다. 실험값이다.", "tf": "전체 차수는 각 차수의? (합)"}, "CH2-070": {"n": "증기압 정의", "c": "ch2", "u": "액체", "t": "B", "dx": "증기압이 밀폐 용기에서 증발과 응축이 동적 평형을 이룰 때 증기가 나타내는 압력이고 물질 고유 성질이라는 점을 놓친 경우다. 평형 상태의 압력이라는 정의가 약하면 끓는점·휘발성 해석의 출발이 흔들린다.", "fx": "증기압을 '밀폐 용기에서 증발·응축이 동적 평형을 이룰 때 증기가 내는 압력, 물질 고유 성질'로 못 박는다. 평형 상태의 압력임을 잡아 끓는점·휘발성 해석의 출발로 삼아라.", "f": "B2", "rk": 65, "d": 1, "rh": 31, "pre": ["CH2-001"], "tr": "증기압이 막연해, 증발·응축이 동적 평형일 때 증기 압력이고 물질 고유 성질이라는 게 빠진다.", "an": "증기압은 증발·응축이 동적 평형일 때 증기 압력, 물질 고유 성질이다.", "rd": "밀폐에서 증발과 응축이 같아진 동적 평형의 증기 압력이다. 물질 고유 성질이다.", "tf": "증발·응축이 평형일 때의 증기 압력은? (증기압)"}, "CH2-071": {"n": "증기압과 온도", "c": "ch2", "u": "액체", "t": "B", "dx": "온도가 높을수록 증발이 활발해져 증기압이 커진다는 점을 놓친 경우다. 온도 의존이 약하면 같은 액체라도 온도에 따라 증기압이 달라진다는 점을 못 짚는다.", "fx": "'온도가 높을수록 증발이 활발해져 증기압이 커짐'을 못 박는다. 같은 액체라도 온도에 따라 증기압이 달라짐을 증기압 곡선에 반영하라.", "f": "A1", "rk": 169, "d": 2, "rh": 1, "pre": ["CH2-070"], "tr": "온도와 증기압이 무관할 것 같아, 높을수록 증발이 활발해 커진다는 게 빠진다.", "an": "온도 높을수록 증발이 활발해 증기압이 크다.", "rd": "온도가 높으면 빠른 분자가 많아 증발이 활발하다. 그래서 증기압이 크다.", "tf": "온도가 높으면 증기압은? (큼)"}, "CH2-072": {"n": "증기압과 분자 간 힘", "c": "ch2", "u": "액체", "t": "C", "dx": "분자 간 힘이 약할수록 분자가 잘 빠져나가 증기압이 크다는 점을 놓친 경우다. 힘과 증기압의 반비례가 약하면 두 액체의 증기압 비교가 어긋난다.", "fx": "'분자 간 힘이 약할수록 분자가 잘 빠져나가 증기압이 큼(반비례)'을 못 박는다. 힘 차이로 두 액체의 증기압을 비교하라.", "f": "A1", "rk": 170, "d": 2, "rh": 3, "pre": ["CH2-070", "CH2-001"], "tr": "분자 간 힘과 증기압이 무관할 것 같아, 약할수록 잘 빠져나가 증기압이 크다는 게 빠진다.", "an": "분자 간 힘이 약할수록 잘 빠져나가 증기압이 크다.", "rd": "분자 간 힘이 약하면 잘 탈출한다. 그래서 증기압이 크다.", "tf": "분자 간 힘이 약하면 증기압은? (큼)"}, "CH2-073": {"n": "휘발성과 증기압", "c": "ch2", "u": "액체", "t": "B", "dx": "휘발성과 증기압이 같은 방향으로 변해 증기압이 큰 액체가 더 잘 휘발한다는 점을 놓친 경우다. 둘의 연결이 약하면 증기압으로 휘발성을 가늠하지 못한다.", "fx": "'휘발성과 증기압은 같은 방향이라 증기압이 큰 액체가 더 잘 휘발'함을 못 박는다. 증기압으로 휘발성을 가늠하라.", "f": "A1", "rk": 171, "d": 2, "rh": 1, "pre": ["CH2-070"], "tr": "휘발성과 증기압이 무관할 것 같아, 같은 방향이라 증기압 큰 액체가 잘 휘발한다는 게 빠진다.", "an": "증기압 큰 액체가 잘 휘발한다: 같은 방향이다.", "rd": "증기압이 크면 잘 탈출한다는 뜻이다. 그래서 휘발성과 같은 방향이다.", "tf": "증기압이 큰 액체는 휘발성이? (큼)"}, "CH2-074": {"n": "증기압 세기 성질", "c": "ch2", "u": "액체", "t": "A", "dx": "증기압을 액체 양에 비례하는 양이라고 본 경우다. 액체가 많으면 증발 속도만 빠를 뿐 평형 증기압 값은 같은 세기 성질이라는 점을 놓치면 양에 따라 증기압이 변한다고 잘못 본다.", "fx": "증기압을 '액체 양과 무관한 세기 성질(많으면 증발 속도만 빠를 뿐 평형 증기압 값은 같음)'로 못 박는다. 양에 따라 증기압이 변한다고 보지 마라.", "f": "A3", "rk": 172, "d": 2, "rh": 0, "pre": ["CH2-070"], "tr": "액체가 많으면 증기압도 클 것 같아, 양과 무관한 세기 성질이라는 게 빠진다.", "an": "증기압은 액체 양과 무관한 세기 성질이다.", "rd": "증기압은 표면 탈출 경향이라 양과 무관하다. 그래서 세기 성질이다.", "tf": "증기압은 액체 양에 의존하나? (안 함)"}, "CH2-075": {"n": "동적 평형", "c": "ch2", "u": "액체", "t": "C", "dx": "증기압 평형이 증발과 응축이 멈춘 게 아니라 두 과정이 같은 속도로 계속되는 동적 상태라는 점을 놓친 경우다. 멈춤으로 오해하면 증기압이 왜 일정하게 유지되는지 설명하지 못한다.", "fx": "증기압 평형을 '증발·응축이 멈춘 게 아니라 같은 속도로 계속되는 동적 상태'로 못 박는다. 멈춤으로 오해 말고 증기압이 일정하게 유지되는 까닭을 잡아라.", "f": "E1", "rk": 173, "d": 2, "rh": 4, "pre": ["CH2-070"], "tr": "증기압 평형이 정지 같아, 증발·응축이 같은 속도로 계속되는 동적 상태라는 게 빠진다.", "an": "증발·응축이 같은 속도로 계속되는 동적 상태다.", "rd": "증발과 응축이 같은 속도로 계속된다. 그래서 멈춘 게 아니라 동적이다.", "tf": "증발·응축이 같은 속도면? (동적 평형)"}, "CH2-076": {"n": "끓음 조건", "c": "ch2", "u": "액체", "t": "C", "dx": "끓음이 액체의 증기압이 외부 압력과 같아질 때 일어난다는 조건을 놓친 경우다. 이 조건이 약하면 외부 압력이 끓는점을 바꾸는 까닭을 못 짚는다.", "fx": "끓음 조건을 '액체의 증기압이 외부 압력과 같아질 때'로 못 박는다. 이 조건으로 외부 압력이 끓는점을 바꾸는 까닭을 짚어라.", "f": "B2", "rk": 174, "d": 2, "rh": 9, "pre": ["CH2-070"], "tr": "끓음 조건이 막연해, 증기압이 외부 압력과 같아질 때라는 게 빠진다.", "an": "증기압이 외부 압력과 같아질 때 끓는다.", "rd": "증기압이 외부 압력과 같아지면 내부에서도 기화한다. 그것이 끓음이다.", "tf": "증기압이 외부 압력과 같아지면? (끓음)"}, "CH2-077": {"n": "끓음 정의", "c": "ch2", "u": "액체", "t": "C", "dx": "끓음이 표면만이 아니라 액체 내부에서도 증기 기포가 생기며 기화하는 현상이라는 점을 놓친 경우다. 표면 증발과의 위치 차이가 약하면 끓음과 증발을 혼동한다.", "fx": "끓음을 '표면만이 아니라 액체 내부에서도 증기 기포가 생기며 기화'로 못 박는다. 표면 증발과의 위치 차이로 끓음과 증발을 구분하라.", "f": "B2", "rk": 296, "d": 3, "rh": 0, "pre": ["CH2-076"], "tr": "끓음이 표면 증발 같아, 내부에서도 기포가 생기며 기화하는 현상이라는 게 빠진다.", "an": "끓음은 표면뿐 아니라 내부에서도 기포가 생기며 기화하는 현상이다.", "rd": "표면뿐 아니라 내부에서도 기포가 생긴다. 그것이 증발과 다른 끓음이다.", "tf": "내부에서도 기포가 생기는 건 증발인가 끓음인가? (끓음)"}, "CH2-078": {"n": "끓는점 정의", "c": "ch2", "u": "액체", "t": "A", "dx": "끓는점을 압력과 무관한 물질 고유의 고정값으로 본 경우다. 끓는점이 증기압과 외부 압력이 같아지는 온도라 외부 압력에 따라 달라진다는 점을 놓치면 고산·압력솥 현상을 설명하지 못한다.", "fx": "끓는점을 '증기압과 외부 압력이 같아지는 온도라 외부 압력에 따라 달라짐(고정값 아님)'으로 못 박는다. 이로써 고산·압력솥 현상을 설명하라.", "f": "A3", "rk": 297, "d": 3, "rh": 4, "pre": ["CH2-076"], "tr": "끓는점이 고정값 같아, 압력에 따라 달라진다는 게 빠진다.", "an": "끓는점은 고정값이 아니라 압력에 따라 달라진다.", "rd": "끓는점은 증기압이 외부 압력과 같아지는 온도다. 그래서 압력에 따라 달라진다.", "tf": "끓는점은 고정값인가 압력에 따라 변하나? (변함)"}, "CH2-079": {"n": "정상 끓는점", "c": "ch2", "u": "액체", "t": "C", "dx": "정상 끓는점이 외부 압력 1기압에서의 끓는점이라는 점을 놓친 경우다. 기준 압력이 1기압이라는 점이 약하면 압력이 다를 때의 끓는점과 혼동한다.", "fx": "정상 끓는점을 '외부 압력 1기압에서의 끓는점'으로 못 박는다. 기준 압력이 1기압임을 잡아 압력이 다를 때의 끓는점과 구분하라.", "f": "D2", "rk": 464, "d": 4, "rh": 0, "pre": ["CH2-078"], "tr": "정상 끓는점이 막연해, 외부 압력 1기압에서의 끓는점이라는 게 빠진다.", "an": "정상 끓는점은 외부 압력 1기압에서의 끓는점이다.", "rd": "외부 압력 1기압에서의 끓는점이 정상 끓는점이다.", "tf": "1기압에서의 끓는점은? (정상 끓는점)"}, "CH2-080": {"n": "압력과 끓는점", "c": "ch2", "u": "액체", "t": "A", "dx": "외부 압력이 높을수록 더 높은 온도에서 끓는다는 점을 놓친 경우다(높은 증기압에 도달해야 하므로). 압력과 끓는점의 비례가 약하면 압력솥은 빨리, 높은 산은 낮은 온도에서 끓는 까닭을 못 짚는다.", "fx": "'외부 압력이 높을수록 더 높은 온도에서 끓음(높은 증기압에 도달해야 하므로)'을 못 박는다. 압력솥은 빨리, 높은 산은 낮은 온도에서 끓는 까닭을 짚어라.", "f": "A1", "rk": 298, "d": 3, "rh": 1, "pre": ["CH2-076"], "tr": "압력이 끓는점과 무관할 것 같아, 높을수록 더 높은 온도서 끓는다는 게 빠진다.", "an": "압력 높을수록 더 높은 온도에서 끓는다: 압력솥이다.", "rd": "외부 압력이 높으면 더 높은 증기압이 필요하다. 그래서 더 높은 온도에 끓는다.", "tf": "압력이 높으면 끓는점은? (높음: 압력솥)"}, "CH2-081": {"n": "분자 간 힘과 끓는점", "c": "ch2", "u": "액체", "t": "C", "dx": "분자 간 힘이 강할수록 증발이 어려워 끓는점이 높다는 점을 놓친 경우다. 힘과 끓는점의 비례가 약하면 분자 간 힘 자료로 끓는점을 비교하지 못한다.", "fx": "'분자 간 힘이 강할수록 증발이 어려워 끓는점이 높음'을 못 박는다. 분자 간 힘 자료로 끓는점을 비교하라.", "f": "A1", "rk": 465, "d": 4, "rh": 1, "pre": ["CH2-072", "CH2-078"], "tr": "분자 간 힘과 끓는점이 무관할 것 같아, 셀수록 증발이 어려워 끓는점이 높다는 게 빠진다.", "an": "분자 간 힘이 셀수록 증발이 어려워 끓는점이 높다.", "rd": "분자 간 힘이 세면 증기압이 낮다. 그래서 외부 압력에 닿으려면 더 데워야 해 끓는점이 높다.", "tf": "분자 간 힘이 세면 끓는점은? (높음)"}, "CH2-082": {"n": "증기압과 끓는점", "c": "ch2", "u": "액체", "t": "C", "dx": "증기압이 큰 액체일수록 낮은 온도에서 외부 압력에 도달해 끓는점이 낮다는 반비례를 놓친 경우다. 증기압과 끓는점의 반대 관계가 약하면 두 자료를 잇지 못한다.", "fx": "'증기압이 큰 액체일수록 낮은 온도에서 외부 압력에 도달해 끓는점이 낮음(반비례)'을 못 박는다. 증기압과 끓는점 두 자료를 이 반대 관계로 이으라.", "f": "A1", "rk": 466, "d": 4, "rh": 0, "pre": ["CH2-073", "CH2-078"], "tr": "증기압 큰 액체 끓는점이 막연해, 낮은 온도서 외부 압력에 도달해 끓는점이 낮다(반비례)는 게 빠진다.", "an": "증기압 큰 액체는 낮은 온도에 외부 압력에 도달해 끓는점이 낮다(반비례).", "rd": "증기압이 크면 낮은 온도에 외부 압력에 닿는다. 그래서 끓는점이 낮다(반비례).", "tf": "증기압이 큰 액체의 끓는점은? (낮음)"}, "CH2-083": {"n": "증기압-온도 곡선", "c": "ch2", "u": "액체", "t": "C", "dx": "증기압이 온도에 따라 직선이 아니라 지수적으로(가파르게) 증가한다는 점을 놓친 경우다. 곡선의 비선형성이 약하면 증기압-온도 그래프를 잘못 읽는다.", "fx": "'증기압은 온도에 따라 직선이 아니라 지수적으로(가파르게) 증가'함을 못 박는다. 곡선의 비선형성을 잡아 증기압-온도 그래프를 읽어라.", "f": "A2", "rk": 299, "d": 3, "rh": 0, "pre": ["CH2-071"], "tr": "증기압이 온도에 직선으로 늘 것 같아, 지수적으로 가파르게 증가한다는 게 빠진다.", "an": "증기압은 온도에 직선이 아니라 지수적으로 가파르게 증가한다.", "rd": "온도가 오르면 탈출 분자가 지수적으로 는다. 그래서 증기압이 가파르게 증가한다.", "tf": "증기압은 온도에 직선인가 지수적인가? (지수적)"}, "CH2-084": {"n": "물의 끓는점", "c": "ch2", "u": "액체", "t": "C", "dx": "물의 끓는점 100°C가 1기압에서의 값일 뿐 압력에 따라 달라진다는 점을 놓친 경우다. 100°C를 고정값으로 외우면 압력이 다른 상황에서 끓는점을 잘못 잡는다.", "fx": "'물의 끓는점 100°C는 1기압에서의 값일 뿐 압력에 따라 달라짐'을 못 박는다. 100°C를 고정값으로 외우지 말고 압력이 다른 상황을 따져라.", "f": "D2", "rk": 467, "d": 4, "rh": 0, "pre": ["CH2-080"], "tr": "물 끓는점 100°C가 고정값 같아, 1기압에서의 값일 뿐 압력 따라 달라진다는 게 빠진다.", "an": "물 100℃는 1기압에서의 값일 뿐 압력 따라 달라진다.", "rd": "100℃는 1기압에서의 값이다. 압력이 바뀌면 끓는점도 바뀐다.", "tf": "물 100℃는 어느 압력에서? (1기압)"}, "CH2-085": {"n": "끓는점 조건", "c": "ch2", "u": "액체", "t": "C", "dx": "끓는점이 증기압과 외부 압력이 같아지는 조건에서 정해진다는 점을 놓친 경우다. 이 조건이 약하면 주어진 압력에서 언제 끓는지 판단하지 못한다.", "fx": "끓는점을 '증기압과 외부 압력이 같아지는 조건에서 정해짐'으로 못 박는다. 이 조건으로 주어진 압력에서 언제 끓는지 판단하라.", "f": "B2", "rk": 300, "d": 3, "rh": 0, "pre": ["CH2-076"], "tr": "끓는점이 어떻게 정해지는지 막막해, 증기압과 외부 압력이 같아지는 조건이라는 게 빠진다.", "an": "끓는점은 증기압과 외부 압력이 같아지는 조건이다.", "rd": "끓는점은 증기압과 외부 압력이 같아지는 조건이다.", "tf": "끓는점은 증기압이 무엇과 같아질 때? (외부 압력)"}, "CH2-086": {"n": "증발 속도", "c": "ch2", "u": "액체", "t": "C", "dx": "증발 속도가 온도가 높아 운동 에너지가 클수록, 그리고 증발할 표면이 넓을수록 빨라진다는 점을 놓친 경우다. 이 두 인자가 약하면 같은 액체라도 증발 빠르기 차이를 설명하지 못한다.", "fx": "'증발 속도는 온도가 높아 운동 에너지가 클수록, 표면이 넓을수록 빨라짐'을 못 박는다. 이 두 인자로 같은 액체의 증발 빠르기 차이를 설명하라.", "f": "A1", "rk": 175, "d": 2, "rh": 0, "pre": ["CH2-070"], "tr": "증발 속도가 막연해, 온도가 높고 표면이 넓을수록 빨라진다는 게 빠진다.", "an": "온도가 높고 표면이 넓을수록 증발이 빠르다.", "rd": "온도가 높고 표면이 넓으면 탈출이 잦다. 그래서 증발이 빠르다.", "tf": "표면이 넓으면 증발은? (빠름)"}, "CH2-087": {"n": "증기압 비교", "c": "ch2", "u": "액체", "t": "C", "dx": "두 액체의 증기압을 분자 간 힘으로 비교하지 못한 경우다(에탄올은 물보다 힘이 약해 증기압이 큼). 힘 차이로 증기압을 가늠하지 못하면 물질별 증기압 순서가 어긋난다.", "fx": "두 액체의 증기압을 '분자 간 힘으로 비교'한다(에탄올은 물보다 힘이 약해 증기압이 큼). 힘 차이로 물질별 증기압 순서를 잡아라.", "f": "C1", "rk": 301, "d": 3, "rh": 0, "pre": ["CH2-072"], "tr": "두 액체 증기압 비교가 막막해, 분자 간 힘으로 비교한다(에탄올이 물보다 약해 증기압 큼)는 게 빠진다.", "an": "분자 간 힘으로 비교: 에탄올이 물보다 약해 증기압이 크다.", "rd": "분자 간 힘이 약할수록 증기압이 크다. 그래서 에탄올이 물보다 증기압이 크다.", "tf": "물과 에탄올 중 증기압이 큰 건? (에탄올)"}, "CH2-088": {"n": "증발 정의", "c": "ch2", "u": "액체", "t": "C", "dx": "증발이 끓는점 아래에서도 액체 표면에서 늘 일어나는 기화라는 점을 놓친 경우다. 표면에서 일어난다는 점이 약하면 내부에서까지 기화하는 끓음과 구분하지 못한다.", "fx": "증발을 '끓는점 아래에서도 액체 표면에서 늘 일어나는 기화'로 못 박는다. 표면에서 일어남을 잡아 내부까지 기화하는 끓음과 구분하라.", "f": "B2", "rk": 176, "d": 2, "rh": 1, "pre": ["CH2-070"], "tr": "증발이 끓을 때만 일어날 것 같아, 끓는점 아래서도 표면에서 늘 일어나는 기화라는 게 빠진다.", "an": "증발은 끓는점 아래서도 표면에서 늘 일어나는 기화다.", "rd": "끓는점 아래서도 표면 분자는 늘 탈출한다. 그것이 증발이다.", "tf": "끓는점 아래서도 일어나는 기화는? (증발)"}, "CH2-089": {"n": "끓는점과 분자 간 힘", "c": "ch2", "u": "액체", "t": "C", "dx": "끓는점을 분자 간 힘의 척도로 읽지 못한 경우다. 끓는점이 높다는 건 힘이 강하다는 뜻이라는 역해석이 약하면 끓는점 자료로 분자 간 힘을 비교하지 못한다.", "fx": "'끓는점이 높다는 건 분자 간 힘이 강하다는 뜻'으로 역해석을 못 박는다. 끓는점 자료를 힘의 척도로 읽어 분자 간 힘을 비교하라.", "f": "A1", "rk": 616, "d": 5, "rh": 0, "pre": ["CH2-081"], "tr": "끓는점이 막연한 숫자 같아, 분자 간 힘의 척도라는 게 빠진다.", "an": "끓는점은 분자 간 힘의 척도다.", "rd": "끓는점은 분자 간 힘을 이기는 온도다. 그래서 그 척도다.", "tf": "끓는점은 무엇의 척도? (분자 간 힘)"}, "CH2-090": {"n": "증발과 에너지", "c": "ch2", "u": "액체", "t": "A", "dx": "증발이 분자 간 힘을 끊어 내는 흡열 과정이라 주위에서 열을 흡수한다는 점을 놓친 경우다. 흡열이라는 점이 약하면 땀·알코올이 증발할 때 시원해지는 냉각 효과를 설명하지 못한다.", "fx": "증발을 '분자 간 힘을 끊는 흡열 과정이라 주위에서 열을 흡수'로 못 박는다. 흡열임을 잡아 땀·알코올이 증발할 때 시원해지는 냉각 효과를 설명하라.", "f": "A1", "rk": 302, "d": 3, "rh": 0, "pre": ["CH2-088"], "tr": "증발이 그냥 일어날 것 같아, 분자 간 힘을 끊는 흡열이라 주위 열을 흡수한다는 게 빠진다.", "an": "증발은 분자 간 힘을 끊는 흡열이라 주위 열을 흡수: 땀이 식히는 원리다.", "rd": "탈출하려면 분자 간 힘을 끊어야 한다. 그 흡열이 주위 열을 흡수한다.", "tf": "땀이 식히는 이유는? (증발이 흡열)"}, "CH2-152": {"n": "삼투 정의", "c": "ch2", "u": "삼투압", "t": "C", "dx": "삼투가 반투막을 사이에 두고 용매가 이동하는 현상(용질은 막을 통과 못 함)이라는 점을 놓친 경우다. 무엇이 움직이는지가 흐리면 삼투압의 의미로 이어지지 못한다.", "fx": "삼투를 '반투막을 사이에 두고 용매가 이동하는 현상(용질은 막 통과 못 함)'으로 못 박는다. 무엇이 움직이는지(용매)를 잡아 삼투압의 의미로 이어라.", "f": "B2", "rk": 319, "d": 3, "rh": 18, "pre": ["CH2-136"], "tr": "삼투가 막연해, 반투막을 두고 용매가 이동하는(용질은 못 지나감) 현상이라는 게 빠진다.", "an": "삼투는 반투막을 두고 용매가 이동하는 현상: 용질은 못 지나간다.", "rd": "반투막은 용매만 통과시킨다. 그래서 용매가 이동하는 것이 삼투다.", "tf": "반투막을 통해 용매가 이동하는 건? (삼투)"}, "CH2-153": {"n": "반투막", "c": "ch2", "u": "삼투압", "t": "C", "dx": "반투막이 용매는 통과시키고 용질은 막는 막이라는 점을 놓친 경우다. 막의 선택성이 약하면 왜 용매만 이동해 농도 차가 생기는지 설명하지 못한다.", "fx": "반투막을 '용매는 통과시키고 용질은 막는 막'으로 못 박는다. 막의 선택성으로 왜 용매만 이동해 농도 차가 생기는지 설명하라.", "f": "B2", "rk": 475, "d": 4, "rh": 0, "pre": ["CH2-152"], "tr": "반투막이 막연해, 용매는 통과시키고 용질은 막는 막이라는 게 빠진다.", "an": "반투막은 용매는 통과시키고 용질은 막는 막이다.", "rd": "용매는 통과시키고 용질은 막는 막이다.", "tf": "용매만 통과시키는 막은? (반투막)"}, "CH2-154": {"n": "삼투 방향", "c": "ch2", "u": "삼투압", "t": "B", "dx": "삼투에서 용매가 묽은 쪽에서 진한 쪽으로 이동해 농도 차를 줄인다는 방향을 놓친 경우다(진한 쪽이 묽어짐). 방향을 뒤집으면 세포의 수축·팽창 판단이 통째로 어긋난다.", "fx": "삼투 방향을 '용매가 묽은 쪽에서 진한 쪽으로 이동해 농도 차를 줄임(진한 쪽이 묽어짐)'으로 못 박는다. 방향을 뒤집지 말고 세포의 수축·팽창을 판단하라.", "f": "A1", "rk": 476, "d": 4, "rh": 16, "pre": ["CH2-152"], "tr": "용매가 진한 쪽에서 묽은 쪽으로 갈 것 같아, 묽은 쪽에서 진한 쪽으로 가 농도 차를 줄인다는 게 거꾸로 느껴진다.", "an": "물이 묽은 쪽에서 진한 쪽으로 가 농도 차를 줄인다: 진한 쪽에서 갈 것 같지만 반대다.", "rd": "양쪽 농도를 맞추려 용매가 묽은 쪽에서 진한 쪽으로 간다.", "tf": "물은 묽은 쪽과 진한 쪽 중 어디로? (진한 쪽)"}, "CH2-155": {"n": "삼투압 정의", "c": "ch2", "u": "삼투압", "t": "C", "dx": "삼투압이 용매의 삼투 이동을 멈추기 위해 진한 쪽에 걸어야 하는 압력이라는 점을 놓친 경우다. '멈추는 압력'이라는 정의가 약하면 삼투압을 단순 농도로 오해한다.", "fx": "삼투압을 '용매의 삼투 이동을 멈추기 위해 진한 쪽에 걸어야 하는 압력'으로 못 박는다. '멈추는 압력'임을 잡아 단순 농도로 오해 마라.", "f": "B2", "rk": 622, "d": 5, "rh": 14, "pre": ["CH2-154"], "tr": "삼투압이 막연해, 삼투 이동을 멈추려 진한 쪽에 걸어야 하는 압력이라는 게 빠진다.", "an": "삼투를 멈추려 진한 쪽에 걸어야 하는 압력이다.", "rd": "삼투로 들어오는 용매를 멈추려 진한 쪽에 걸어야 하는 압력이다.", "tf": "삼투를 멈출 압력은? (삼투압)"}, "CH2-156": {"n": "반트호프 식", "c": "ch2", "u": "삼투압", "t": "A", "dx": "반트호프 식 π=MRT에서 M이 몰농도, T가 절대 온도라는 점을 놓친 경우다. 부피 기준 농도와 켈빈 온도를 안 쓰면 삼투압 계산이 어긋난다.", "fx": "반트호프 식을 'π=MRT, M은 몰농도, T는 절대 온도'로 못 박는다. 부피 기준 농도와 켈빈 온도를 써서 삼투압을 계산하라.", "f": "A2", "rk": 686, "d": 6, "rh": 5, "pre": ["CH2-155", "CH2-115"], "tr": "π=MRT가 막연해, M이 몰농도·T가 절대 온도라는 게 빠진다.", "an": "π=MRT: M은 몰농도, T는 절대 온도다.", "rd": "묽은 용액은 기체처럼 거동해 π=MRT다. M은 몰농도, T는 절대 온도다.", "tf": "삼투압 식은? (π=MRT)"}, "CH2-157": {"n": "총괄성", "c": "ch2", "u": "삼투압", "t": "C", "dx": "삼투압이 용질 입자 수에만 의존하는 총괄성이고 용질 종류와 무관하다는 점을 놓친 경우다. 총괄성이라는 점이 약하면 전해질에서 i를 반영해야 하는 이유로 이어지지 못한다.", "fx": "삼투압을 '용질 입자 수에만 의존하는 총괄성, 용질 종류 무관'으로 못 박는다. 총괄성임을 잡아 전해질에서 i를 반영하는 이유로 이어라.", "f": "A3", "rk": 687, "d": 6, "rh": 0, "pre": ["CH2-155", "CH2-136"], "tr": "삼투압이 용질 종류에 달렸을 것 같아, 입자 수에만 의존하는 총괄성이라는 게 빠진다.", "an": "삼투압은 입자 수에만 의존하는 총괄성이다.", "rd": "삼투압도 입자 수에만 의존하는 총괄성이다.", "tf": "삼투압은 무엇에 의존하는 총괄성? (입자 수)"}, "CH2-158": {"n": "전해질 삼투압", "c": "ch2", "u": "삼투압", "t": "C", "dx": "전해질의 삼투압을 계산할 때 이온화로 늘어난 입자 수를 반영해 i를 곱해야 한다는 점을 놓친 경우다. i를 빼먹으면 전해질 용액의 삼투압이 과소평가된다.", "fx": "'전해질의 삼투압은 이온화로 늘어난 입자 수를 반영해 i를 곱해야' 함을 못 박는다. i를 빼먹어 전해질 용액의 삼투압을 과소평가 마라.", "f": "D3", "rk": 725, "d": 7, "rh": 1, "pre": ["CH2-156", "CH2-143"], "tr": "전해질 삼투압을 그냥 계산할 것 같아, 이온화로 늘어난 입자 수를 i로 반영해야 한다는 게 빠진다.", "an": "이온화로 늘어난 입자 수를 i로 반영한다.", "rd": "전해질은 이온으로 쪼개져 입자가 는다. 그래서 i를 반영한다.", "tf": "전해질 삼투압에 무엇을 반영? (i)"}, "CH2-159": {"n": "전해질 비교", "c": "ch2", "u": "삼투압", "t": "C", "dx": "같은 몰농도라도 이온화로 입자 수가 많은 전해질의 삼투압이 더 크다는 점을 놓친 경우다. 입자 수로 비교하지 못하면 삼투압 순서가 어긋난다.", "fx": "'같은 몰농도라도 이온화로 입자 수가 많은 전해질의 삼투압이 더 큼'을 못 박는다. 입자 수로 삼투압 순서를 잡아라.", "f": "C1", "rk": 760, "d": 8, "rh": 0, "pre": ["CH2-158"], "tr": "같은 몰농도면 삼투압도 같을 것 같아, 이온화로 입자가 많은 전해질이 더 크다는 게 빠진다.", "an": "같은 몰농도라도 이온화로 입자 많은 전해질이 삼투압이 크다.", "rd": "이온화로 입자가 많을수록 삼투압이 크다.", "tf": "같은 몰농도에서 전해질의 삼투압은? (큼)"}, "CH2-160": {"n": "온도 의존", "c": "ch2", "u": "삼투압", "t": "C", "dx": "삼투압이 절대 온도에 비례한다는(π=MRT) 점을 놓친 경우다. 온도가 오르면 삼투압이 커진다는 점이 약하면 온도가 다른 조건의 삼투압 계산이 어긋난다.", "fx": "'삼투압은 절대 온도에 비례(π=MRT)'함을 못 박는다. 온도가 오르면 삼투압이 커짐을 온도가 다른 조건의 계산에 반영하라.", "f": "A2", "rk": 726, "d": 7, "rh": 0, "pre": ["CH2-156"], "tr": "삼투압이 온도와 무관할 것 같아, 절대 온도에 비례한다(π=MRT)는 게 빠진다.", "an": "삼투압이 절대 온도에 비례(π=MRT)한다.", "rd": "π=MRT라 삼투압이 절대 온도에 비례한다.", "tf": "삼투압은 절대 온도에? (비례)"}, "CH2-161": {"n": "농도 의존", "c": "ch2", "u": "삼투압", "t": "B", "dx": "삼투압이 몰농도에 비례한다는 점을 놓친 경우다. 농도가 진할수록 삼투압이 크다는 비례가 약하면 농도로 삼투압을 가늠하지 못한다.", "fx": "'삼투압은 몰농도에 비례'함을 못 박는다. 농도가 진할수록 삼투압이 큼을 잡아 농도로 삼투압을 가늠하라.", "f": "A2", "rk": 727, "d": 7, "rh": 0, "pre": ["CH2-156"], "tr": "삼투압이 농도와 무관할 것 같아, 몰농도에 비례한다는 게 빠진다.", "an": "삼투압이 몰농도에 비례한다.", "rd": "π=MRT라 삼투압이 몰농도에 비례한다.", "tf": "삼투압은 몰농도에? (비례)"}, "CH2-162": {"n": "등장액", "c": "ch2", "u": "삼투압", "t": "C", "dx": "등장액이 삼투압(입자 농도)이 같아 용매의 알짜 이동이 없는 용액이라는 점을 놓친 경우다. 등장의 기준이 약하면 세포가 변형 없이 유지되는 조건을 못 짚는다.", "fx": "등장액을 '삼투압(입자 농도)이 같아 용매의 알짜 이동이 없는 용액'으로 못 박는다. 등장 기준으로 세포가 변형 없이 유지되는 조건을 짚어라.", "f": "B2", "rk": 688, "d": 6, "rh": 3, "pre": ["CH2-155"], "tr": "등장액이 막연해, 삼투압이 같아 용매의 알짜 이동이 없는 용액이라는 게 빠진다.", "an": "삼투압이 같아 용매 알짜 이동이 없는 용액이다.", "rd": "삼투압이 같으면 용매의 알짜 이동이 없다. 그것이 등장액이다.", "tf": "삼투압이 같은 용액은? (등장액)"}, "CH2-163": {"n": "고장액", "c": "ch2", "u": "삼투압", "t": "C", "dx": "고장액이 세포보다 삼투압이 높아 물이 세포 밖(진한 쪽)으로 빠져 세포가 쭈그러드는 용액이라는 점을 놓친 경우다. 이 방향이 약하면 세포 수축을 잘못 판단한다.", "fx": "고장액을 '세포보다 삼투압이 높아 물이 세포 밖(진한 쪽)으로 빠져 세포가 쭈그러드는 용액'으로 못 박는다. 이 방향으로 세포 수축을 판단하라.", "f": "B2", "rk": 728, "d": 7, "rh": 1, "pre": ["CH2-162"], "tr": "고장액이 막연해, 삼투압이 높아 물이 세포 밖으로 빠져 쭈그러드는 용액이라는 게 빠진다.", "an": "삼투압이 높아 물이 세포 밖으로 빠져 쭈그러드는 용액이다.", "rd": "삼투압이 높으면 물이 세포 밖으로 빠진다. 그래서 쭈그러든다.", "tf": "민물고기를 바닷물에 넣으면 세포는? (쭈그러듦: 고장액)"}, "CH2-164": {"n": "저장액", "c": "ch2", "u": "삼투압", "t": "C", "dx": "저장액이 세포보다 삼투압이 낮아 물이 세포 안으로 들어와 세포가 부푸는 용액이라는 점을 놓친 경우다. 이 방향이 약하면 적혈구가 터지는(용혈) 현상을 설명하지 못한다.", "fx": "저장액을 '세포보다 삼투압이 낮아 물이 세포 안으로 들어와 세포가 부푸는 용액'으로 못 박는다. 이 방향으로 적혈구가 터지는(용혈) 현상을 설명하라.", "f": "B2", "rk": 729, "d": 7, "rh": 1, "pre": ["CH2-162"], "tr": "저장액이 막연해, 삼투압이 낮아 물이 세포 안으로 들어와 부푸는 용액이라는 게 빠진다.", "an": "삼투압이 낮아 물이 세포 안으로 들어와 부푸는 용액이다.", "rd": "삼투압이 낮으면 물이 세포 안으로 든다. 그래서 부푼다.", "tf": "삼투압이 낮은 용액에서 세포는? (부풂)"}, "CH2-165": {"n": "세포와 삼투", "c": "ch2", "u": "삼투압", "t": "C", "dx": "세포를 둘러싼 용액의 농도에 따라 물이 세포로 들어오거나 빠져나간다는 삼투 적용을 놓친 경우다. 용액 농도와 물 이동을 못 이으면 세포의 팽창·수축을 예측하지 못한다.", "fx": "'세포를 둘러싼 용액의 농도에 따라 물이 세포로 들어오거나 빠져나감'을 못 박는다. 용액 농도와 물 이동을 이어 세포의 팽창·수축을 예측하라.", "f": "A1", "rk": 761, "d": 8, "rh": 0, "pre": ["CH2-163", "CH2-164"], "tr": "세포와 삼투가 막연해, 둘러싼 용액 농도에 따라 물이 드나든다는 게 빠진다.", "an": "둘러싼 용액 농도에 따라 물이 드나든다.", "rd": "세포 안팎 농도 차로 물이 드나든다.", "tf": "세포 안팎 농도 차로 무엇이 이동? (물)"}, "CH2-166": {"n": "역삼투", "c": "ch2", "u": "삼투압", "t": "C", "dx": "역삼투가 삼투압보다 큰 압력을 진한 쪽에 걸어 용매를 반대 방향(진한 쪽에서 묽은 쪽)으로 밀어내는 것이라는 점을 놓친 경우다. 이 반대 방향이 약하면 정수·담수화 원리를 못 짚는다.", "fx": "역삼투를 '삼투압보다 큰 압력을 진한 쪽에 걸어 용매를 반대 방향(진한 쪽에서 묽은 쪽)으로 밀어냄'으로 못 박는다. 이 반대 방향으로 정수·담수화 원리를 짚어라.", "f": "A1", "rk": 689, "d": 6, "rh": 1, "pre": ["CH2-155"], "tr": "역삼투가 막연해, 삼투압보다 큰 압력을 걸어 용매를 반대로(진한 쪽→묽은 쪽) 미는 것이라는 게 빠진다.", "an": "삼투압보다 큰 압력을 걸어 용매를 반대로(진한 쪽→묽은 쪽) 민다.", "rd": "삼투압보다 큰 압력을 걸면 용매가 거꾸로 밀린다. 그것이 역삼투다.", "tf": "삼투압보다 큰 압력으로 용매를 거꾸로 미는 건? (역삼투)"}, "CH2-167": {"n": "역삼투 응용", "c": "ch2", "u": "삼투압", "t": "C", "dx": "역삼투로 용질을 걸러 순수한 물을 얻는다는(해수 담수화·정수기) 응용을 놓친 경우다. 역삼투와 실생활의 연결이 약하면 응용 문제를 못 잡는다.", "fx": "'역삼투로 용질을 걸러 순수한 물을 얻음(해수 담수화·정수기)'을 못 박는다. 역삼투와 실생활의 연결로 응용 문제를 잡아라.", "f": "B2", "rk": 730, "d": 7, "rh": 0, "pre": ["CH2-166"], "tr": "역삼투가 교과서 속 개념 같아, 해수 담수화·정수기로 순수한 물을 얻는다는 게 빠진다.", "an": "해수 담수화·정수기로 순수한 물을 얻는다.", "rd": "역삼투로 용질을 막고 물만 뽑는다. 그래서 해수 담수화·정수에 쓴다.", "tf": "해수 담수화에 쓰는 건? (역삼투)"}, "CH2-168": {"n": "분자량 측정", "c": "ch2", "u": "삼투압", "t": "C", "dx": "삼투압에서 πV=nRT로 몰수를 구해 분자량을 알아낼 수 있고 묽은 용액에서도 측정이 쉽다는 점을 놓친 경우다. 이 활용이 약하면 고분자 분자량 측정에 왜 삼투압을 쓰는지 못 짚는다.", "fx": "'삼투압에서 πV=nRT로 몰수를 구해 분자량을 알아낼 수 있고 묽은 용액에서도 측정이 쉬움'을 못 박는다. 이 활용으로 고분자 분자량 측정에 삼투압을 쓰는 까닭을 짚어라.", "f": "D3", "rk": 731, "d": 7, "rh": 0, "pre": ["CH2-156"], "tr": "삼투압으로 분자량을 못 구할 것 같아, πV=nRT로 몰수를 구해 알아내고 묽은 용액서도 쉽다는 게 빠진다.", "an": "πV=nRT로 몰수를 구해 분자량을 알아낸다: 묽은 용액서도 쉽다.", "rd": "πV=nRT로 몰수를 구해 분자량을 안다. 묽은 용액서도 삼투압이 커 쉽다.", "tf": "삼투압으로 무엇을 구하나? (분자량)"}, "CH2-169": {"n": "삼투압 크기", "c": "ch2", "u": "삼투압", "t": "C", "dx": "삼투압이 묽은 용액에서도 비교적 크게 나타나는 가장 민감한 총괄성이라는 점을 놓친 경우다. 이 민감성이 약하면 어는점 내림보다 삼투압이 분자량 측정에 유리한 까닭을 못 짚는다.", "fx": "'삼투압은 묽은 용액에서도 비교적 크게 나타나는 가장 민감한 총괄성'임을 못 박는다. 이 민감성으로 어는점 내림보다 삼투압이 분자량 측정에 유리한 까닭을 짚어라.", "f": "C1", "rk": 690, "d": 6, "rh": 0, "pre": ["CH2-155"], "tr": "삼투압이 작을 것 같아, 묽은 용액서도

-자유에너지", "t": "C", "dx": "깁스 자유 에너지 G = H - TS에서 TS를 빼는(더하지 않는) 정의를 놓친 경우다. ΔG<0일 때 자발적이라는 판단 기준이 흔들린다.", "fx": "깁스 자유 에너지를 'G = H − TS(TS를 더하지 않고 뺌)'로 못 박는다. ΔG<0일 때 자발적이라는 판단 기준을 잡아라.", "f": "D3", "rk": 236, "d": 2, "rh": 6, "pre": ["GC-099", "GC-105"], "tr": "G=H-TS에서 TS를 더할지 뺄지 헷갈려, 빼는 정의가 흔들린다.", "an": "자유에너지는 H에서 못 쓰는 무질서 몫(TS)을 뺀 쓸 수 있는 에너지: G=H-TS다.", "rd": "일정 온도·압력에서 자발성을 한 양으로 판단하려 G=H-TS로 정의한다.", "tf": "G는 H에서 무엇을 뺀 것? (TS)"}, "GC-110": {"n": "ΔG 식", "c": "gc", "u": "열역학-자유에너지", "t": "A", "dx": "ΔG = ΔH - TΔS에서 T를 켈빈으로 쓰고 TΔS를 빼야 한다는 점을 놓친 경우다. -TΔS 항의 부호가 엔트로피 증가를 자발성으로 잇는다는 흐름이 약하다.", "fx": "깁스 식을 'ΔG = ΔH − TΔS, T는 켈빈, TΔS를 뺌'으로 못 박는다. −TΔS 항이 엔트로피 증가를 자발성으로 잇는 흐름을 잡아라.", "f": "D3", "rk": 380, "d": 3, "rh": 5, "pre": ["GC-109"], "tr": "ΔG=ΔH-TΔS에서 온도 단위와 부호가 막막해, T를 켈빈으로 쓰고 TΔS를 뺀다는 게 흐려진다.", "an": "ΔG=ΔH-TΔS, 온도는 켈빈으로: 무질서 몫에 온도를 곱해 뺀다.", "rd": "ΔG=ΔH-TΔS, T는 켈빈이다. 엔탈피 항에서 무질서 항(TΔS)을 뺀다.", "tf": "ΔG 식에서 온도는 무슨 단위? (켈빈)"}, "GC-111": {"n": "자발성 판단", "c": "gc", "u": "열역학-자유에너지", "t": "C", "dx": "ΔG<0이면 자발, ΔG>0이면 비자발, ΔG=0이면 평형이라는 기준을 놓친 경우다. ΔG의 부호 하나로 방향이 결정된다는 점이 흔들린다.", "fx": "'ΔG<0이면 자발, ΔG>0이면 비자발, ΔG=0이면 평형'을 못 박는다. ΔG 부호 하나로 방향이 결정됨을 잡아라.", "f": "C2", "rk": 549, "d": 4, "rh": 3, "pre": ["GC-110"], "tr": "ΔG 부호와 자발성의 대응이 매번 헷갈려, 음이 자발·0이 평형이라는 기준이 흔들린다.", "an": "ΔG가 음이면 저절로 굴러감(자발), 0이면 평형: 내리막인지 판정하는 잣대다.", "rd": "ΔG<0이면 전체 엔트로피가 느는 방향이라 자발, 0이면 평형이다.", "tf": "ΔG가 음이면 반응은? (자발)"}, "GC-112": {"n": "부호 조합", "c": "gc", "u": "열역학-자유에너지", "t": "C", "dx": "ΔH·ΔS 부호 조합과 온도 의존을 헷갈린 경우다. 고온에서는 -TΔS 항이, 저온에서는 ΔH 항이 우세해진다는 온도 갈림이 약하다.", "fx": "'ΔH·ΔS 부호 조합과 온도 의존: 고온에서는 −TΔS 항이, 저온에서는 ΔH 항이 우세'함을 못 박는다. 온도 갈림으로 자발성 전환을 따져라.", "f": "C2", "rk": 550, "d": 4, "rh": 0, "pre": ["GC-110", "GC-100", "GC-108"], "tr": "ΔH·ΔS 부호 조합이 경우의 수가 많아, 온도가 자발성을 어떻게 뒤집는지가 막막하다.", "an": "발열+무질서 증가면 항상 자발, 반대면 항상 비자발, 나머지는 온도가 심판: 줄다리기다.", "rd": "ΔG=ΔH-TΔS의 부호를 따진다. 발열+엔트로피 증가면 항상 자발, 반대면 비자발, 나머지는 T가 가른다.", "tf": "발열이고 엔트로피 증가면 자발성은? (항상 자발)"}, "GC-113": {"n": "발열과 자발성", "c": "gc", "u": "열역학-자유에너지", "t": "B", "dx": "발열이 곧 자발성은 아니고 ΔG가 최종 기준이라는 점을 놓친 경우다. 엔트로피와 온도에 따라 흡열도 고온에서 자발일 수 있다는 점이 약하다.", "fx": "'발열이 곧 자발은 아니고 ΔG가 최종 기준'임을 못 박는다. 엔트로피와 온도에 따라 흡열도 고온에서 자발일 수 있음을 잡아라.", "f": "D1", "rk": 657, "d": 5, "rh": 0, "pre": ["GC-111", "GC-100"], "tr": "발열이면 당연히 자발일 것 같아, ΔG가 최종 판정이고 발열만으로는 부족하다는 게 안 잡힌다.", "an": "발열이라고 다 자발은 아니다: 최종 판정은 ΔG, 온도·무질서까지 합산해야 한다.", "rd": "자발성의 최종 판정은 ΔG다. 발열(ΔH<0)이어도 ΔS가 크게 음이면 비자발일 수 있다.", "tf": "발열이면 무조건 자발인가? (아니다: ΔG로 판정)"}, "GC-114": {"n": "자유 에너지와 평형", "c": "gc", "u": "열역학-자유에너지", "t": "A", "dx": "ΔG° = -RT ln K에서 K와 ΔG°의 부호 관계를 놓친 경우다. K>1이면 ln K>0이라 ΔG°<0, K=1이면 ln 1=0이라 ΔG°=0이라는 연결이 흔들린다.", "fx": "'ΔG° = -RT ln K'를 못 박는다. K>1이면 ln K>0이라 ΔG°<0, K=1이면 ln 1=0이라 ΔG°=0인 부호 관계를 잡아라.", "f": "C2", "rk": 658, "d": 5, "rh": 0, "pre": ["GC-111", "GC-117"], "tr": "ΔG°와 K가 따로 노는 것 같아, ΔG°=-RT ln K로 부호가 연결된다는 게 안 떠오른다.", "an": "ΔG°가 음일수록 평형이 생성물 쪽: ΔG°=-RT ln K로 둘이 묶인다.", "rd": "ΔG°=-RT ln K다. ΔG°가 음일수록 K가 커져 평형이 생성물 쪽이다.", "tf": "ΔG°가 음일수록 K는? (큼: 생성물 쪽)"}, "GC-115": {"n": "비열", "c": "gc", "u": "열역학-자유에너지", "t": "C", "dx": "비열이 단위 질량을 1 K 올리는 데 드는 열이고 물질 고유값이라는 점을 놓친 경우다. 비열이 클수록 데우기 어렵다는 방향이 뒤집혔다.", "fx": "비열을 '단위 질량을 1 K 올리는 데 드는 열, 물질 고유값'으로 못 박는다. 비열이 클수록 데우기 어려움을 방향으로 잡아라.", "f": "B2", "rk": 31, "d": 0, "rh": 0, "pre": [], "tr": "비열이 그냥 \"뜨거워지기 쉬운 정도\" 같아, 단위 질량을 1 K 올리는 데 드는 열이자 물질 고유값이라는 정의가 흐려진다.", "an": "비열은 데우기 힘든 정도: 물처럼 비열이 크면 같은 열에도 온도가 천천히 오른다.", "rd": "단위 질량을 1도 올리는 데 필요한 열이 비열이다. 비열이 크면 같은 열에도 온도가 덜 오른다.", "tf": "비열이 큰 물이 천천히 데워지는 이유는? (같은 열에 온도 덜 오름)"}, "CH1-369": {"n": "확장옥텟·SN5,6", "c": "ch1", "u": "Ⅱ-6a", "t": "C", "dx": "'SN5의 기본 모양은 삼각쌍뿔형이다.'를 정확히 적용하지 못한 경우다.", "fx": "SN5: 삼각쌍뿔(0)·시소(1)·T자(2)·직선(3). SN6: 정팔면체(0)·사각뿔(1)·평면사각형(2). (괄호=비공유쌍) 핵심값을 묶어 외우고, 'SN5의 기본 모양은 삼각쌍뿔형이다.'를 기준 문장으로 굳혀라.", "f": "B2", "rk": 0, "d": 0, "rh": 0, "pre": [], "tr": "입체수(SN)와 비공유 전자쌍 수가 모양을 동시에 결정하는데, 둘 중 하나만 보면 시소-T자, 사각뿔-평면사각형을 뒤집는다.", "an": "전자쌍을 풍선으로 보면 5개는 삼각쌍뿔로, 6개는 정팔면체로 벌어진다. 비공유쌍이 자리를 차지하면 보이는 원자 배열만 시소·T자로 남 const deps={}; for(const id in N) deps[id]=[];

function reachUp(id){const s=new Set(),st=[...(N[id].pre||[])];while(st.length){const x=st.pop();if(s.has(x)||!N[x])continue;s.add(x);for(const p of (N[x].pre||[]))st.push(p);}return s;}
function rootsOf(W){const Wset=new Set(W);return W.filter(c=>{for(const p of reachUp(c))if(Wset.has(p))return false;return true;});}
function domFam(W){const by={};for(const c of W){const f=N[c].f;if(f)by[f]=(by[f]||0)+1;}let best=null,bn=0;for(const f in by)if(by[f]>bn){bn=by[f];best=f;}return best;}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function parse(txt){
  const studs=[];
  txt.split(/\n/).forEach(line=>{
    line=line.trim(); if(!line)return;
    let name='',rest=line;
    if(line.includes('|')){const i=line.indexOf('|');name=line.slice(0,i).trim();rest=line.slice(i+1);}
    const ids=rest.split(/[\s,;]+/).map(x=>x.trim().toUpperCase()).filter(x=>N[x]);
    if(ids.length)studs.push({name:name||('학생'+(studs.length+1)),W:[...new Set(ids)]});
  });
  return studs;
}

function analyze(studs){
  const S=studs.length;
  // concept frequency
  const cf={}; for(const s of studs)for(const c of s.W)cf[c]=(cf[c]||0)+1;
  // family prevalence: students affected (>=1 wrong in family) and total occurrences
  const famStud={},famOcc={};
  for(const s of studs){const fams=new Set();for(const c of s.W){const f=N[c].f;if(f){famOcc[f]=(famOcc[f]||0)+1;fams.add(f);}}for(const f of fams)famStud[f]=(famStud[f]||0)+1;}
  // roots frequency: how many students have c as originating root
  const rootFreq={}; for(const s of studs)for(const r of rootsOf(s.W))rootFreq[r]=(rootFreq[r]||0)+1;
  // class prescription: score = freq * log(1+reach)
  const score=c=>cf[c]*Math.log1p(N[c].rh);
  const plan=Object.keys(cf).sort((a,b)=>score(b)-score(a));
  return {S,cf,famStud,famOcc,rootFreq,plan,score};
}

function render(studs){
  const R=document.getElementById('report');
  if(!studs.length){R.innerHTML='<div class="empty">인식된 학생이 없습니다. 한 줄에 한 명씩, GC/CH1/CH2 번호로 입력하세요.</div>';return;}
  const A=analyze(studs);
  const totalWrong=Object.values(A.cf).reduce((a,b)=>a+b,0);
  const avg=(totalWrong/A.S).toFixed(1);
  const fams=Object.keys(A.famStud).sort((a,b)=>A.famStud[b]-A.famStud[a]||A.famOcc[b]-A.famOcc[a]);
  let h='';
  h+=`<div class="kpis"><div><div class="n">${A.S}</div><div class="l">학생</div></div><div><div class="n">${Object.keys(A.cf).length}</div><div class="l">서로 다른 오답 개념</div></div><div><div class="n">${avg}</div><div class="l">평균 오답</div></div><div><div class="n">${fams.length}</div><div class="l">관여 오개념 족</div></div></div>`;
  // dominant families
  h+=`<div class="sec"><div class="sec-h"><span class="sec-n">Ⅰ</span><span class="sec-t">지배적 오개념 족</span><span class="sec-sub">반 공통 패턴</span></div>`;
  const topF=fams[0];
  h+=`<p>이 반은 <span style="color:var(--brass-deep);font-weight:600">${FAMLBL[topF]||topF}(${topF})</span> 패턴이 가장 널리 퍼져 있습니다(${A.famStud[topF]}/${A.S}명). 단원이 아니라 이 추론 방식을 반 전체에 교정하는 것이 효율적입니다.</p>`;
  h+='<div class="barlist">';
  const maxF=A.famStud[topF];
  for(const f of fams.slice(0,6))h+=`<div class="brow"><span class="bname"><span class="code">${f}</span>${FAMLBL[f]||f}</span><span class="btrack"><span class="bfill" style="width:${A.famStud[f]/maxF*100}%"></span></span><span class="bval">${A.famStud[f]}명</span></div>`;
  h+='</div></div>';
  // most common wrong concepts
  h+=`<div class="sec"><div class="sec-h"><span class="sec-n">Ⅱ</span><span class="sec-t">최빈 오답 개념</span><span class="sec-sub">몇 명이 틀렸나</span></div><div class="barlist">`;
  const topC=Object.keys(A.cf).sort((a,b)=>A.cf[b]-A.cf[a]).slice(0,8);
  const maxC=A.cf[topC[0]];
  for(const c of topC)h+=`<div class="brow"><span class="bname">${esc(N[c].n)}</span><span class="btrack"><span class="bfill slate" style="width:${A.cf[c]/maxC*100}%"></span></span><span class="bval">${A.cf[c]}/${A.S}</span></div>`;
  h+='</div></div>';
  // class roots
  h+=`<div class="sec"><div class="sec-h"><span class="sec-n">Ⅲ</span><span class="sec-t">반 공통 발원 뿌리</span><span class="sec-sub">먼저 다시 가르칠 토대</span></div>`;
  const roots=Object.keys(A.rootFreq).sort((a,b)=>A.rootFreq[b]-A.rootFreq[a]||N[b].rh-N[a].rh).slice(0,6);
  if(roots.length){h+=`<p>여러 학생에게서 공통으로 발원하는 토대입니다. 이 개념들을 반 전체에 다시 세우면 그 위 하류가 함께 회복됩니다.</p><div class="barlist">`;
    const maxR=A.rootFreq[roots[0]];
    for(const c of roots)h+=`<div class="brow"><span class="bname">${esc(N[c].n)}${N[c].rh>=KEY?' <span class="code">키스톤</span>':''}</span><span class="btrack"><span class="bfill" style="width:${A.rootFreq[c]/maxR*100}%"></span></span><span class="bval">${A.rootFreq[c]}명</span></div>`;
    h+='</div>';}else h+=`<p>공통 발원 뿌리가 두드러지지 않습니다.</p>`;
  h+='</div>';
  // class prescription
  h+=`<div class="sec"><div class="sec-h"><span class="sec-n">Ⅳ</span><span class="sec-t">반 처방 우선순위</span><span class="sec-sub">빈도 × 파급</span></div><p>많은 학생이 틀렸고 파급이 큰 개념부터. 한 번의 수업으로 가장 넓게 회복시키는 순서입니다.</p><div class="plan">`;
  A.plan.slice(0,8).forEach((c,i)=>{const isR=A.rootFreq[c];const isK=N[c].rh>=KEY;const _cl=COURSE[c.split('-')[0]]||'';
    h+=`<div class="prow"><div class="pn">${i+1}</div><div><div class="pname">${esc(N[c].n)}${isR?'<span class="root">뿌리</span>':''}${isK?'<span class="key">키스톤</span>':''}</div><div class="pmeta">${[_cl,esc(N[c].u||''),'파급 '+N[c].rh].filter(Boolean).join(' · ')}</div></div><div class="pfreq"><b>${A.cf[c]}</b>/${A.S}명</div></div>`;});
  h+='</div></div>';
  // per-student
  h+=`<div class="sec"><div class="sec-h"><span class="sec-n">Ⅴ</span><span class="sec-t">학생별 요약</span></div><div class="students">`;
  for(const s of studs){const r=rootsOf(s.W);const df=domFam(s.W);
    const diag=`오답 ${s.W.length} · ${df?FAMLBL[df]+' 경향':'점 오류'}${r.length?' · 뿌리 「'+esc(N[r.sort((a,b)=>N[b].rh-N[a].rh)[0]].n)+'」':''}`;
    h+=`<div class="srow"><span class="sname">${esc(s.name)}</span><span class="sdiag">${diag}</span></div>`;}
  h+='</div></div>';
  R.innerHTML=h;
}

document.getElementById('go').addEventListener('click',()=>render(parse(document.getElementById('cls').value)));
document.getElementById('demo').addEventListener('click',()=>{

서연 | CH1-120, CH1-124, CH1-131, CH1-135, CH1-150
지호 | CH1-150, CH1-153, CH1-185, CH1-206, CH1-214, CH1-265, CH1-266
하은 | CH1-109, CH1-120, CH1-124, CH1-281, CH1-288
도윤 | CH1-131, CH1-135, CH1-136, CH1-265, CH1-266, CH1-281, CH1-288`;
  document.getElementById('cls').value=demo;render(parse(demo));
});

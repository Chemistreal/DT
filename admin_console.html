 크게 나타나는 가장 민감한 총괄성이라는 게 빠진다.", "an": "묽은 용액서도 크게 나타나는 가장 민감한 총괄성이다.", "rd": "삼투압은 묽은 용액서도 크게 나타난다. 그래서 가장 민감한 총괄성이다.", "tf": "묽은 용액서도 크게 나타나는 총괄성은? (삼투압)"}, "CH2-170": {"n": "삼투 현상", "c": "ch2", "u": "삼투압", "t": "C", "dx": "삼투에서 물이 진한 쪽으로 이동해 그쪽 액면이 높아지는 현상을 놓친 경우다. 관찰되는 액면 차가 곧 삼투압과 관련된다는 점이 약하면 삼투 실험을 잘못 읽는다.", "fx": "'삼투에서 물이 진한 쪽으로 이동해 그쪽 액면이 높아짐'을 못 박는다. 관찰되는 액면 차가 삼투압과 관련됨을 잡아 삼투 실험을 읽어라.", "f": "A1", "rk": 623, "d": 5, "rh": 0, "pre": ["CH2-154"], "tr": "삼투 현상이 막연해, 물이 진한 쪽으로 이동해 그쪽 액면이 높아진다는 게 빠진다.", "an": "물이 진한 쪽으로 이동해 그쪽 액면이 높아진다.", "rd": "용매가 진한 쪽으로 이동한다. 그래서 그쪽 액면이 높아진다.", "tf": "삼투로 어느 쪽 액면이 높아지나? (진한 쪽)"}, "CH2-320": {"n": "산화 정의", "c": "ch2", "u": "산화수", "t": "B", "dx": "산화가 전자를 잃는 것(또는 산소를 얻거나 수소를 잃는 것)이라는 점을 놓친 경우다. 전자 잃음이 산화의 본질이라는 점이 약하면 환원과 짝지어 산화환원을 보지 못한다.", "fx": "산화를 '전자를 잃는 것(또는 산소를 얻거나 수소를 잃는 것)'으로 못 박는다. 전자 잃음이 산화의 본질임을 잡아 환원과 짝지어 산화환원을 보라.", "f": "B1", "rk": 20, "d": 0, "rh": 37, "pre": [], "tr": "산화가 산소를 얻는 것만 같아, 전자를 잃는 것(또는 산소 얻음·수소 잃음)이라는 게 빠진다.", "an": "산화는 전자를 잃는 것: 산소 얻음·수소 잃음도 포함한다.", "rd": "더 근본은 전자 이동이다. 전자를 잃으면(산소 얻음·수소 잃음 포함) 산화다.", "tf": "전자를 잃는 것은? (산화)"}, "CH2-321": {"n": "환원 정의", "c": "ch2", "u": "산화수", "t": "C", "dx": "환원이 전자를 얻는 것(또는 산소를 잃거나 수소를 얻는 것)이라는 점을 놓친 경우다. 전자 얻음이 환원의 본질이라는 점이 약하면 산화와의 대응이 흔들린다.", "fx": "환원을 '전자를 얻는 것(또는 산소를 잃거나 수소를 얻는 것)'으로 못 박는다. 전자 얻음이 환원의 본질임을 잡아 산화와 대응시켜라.", "f": "B1", "rk": 97, "d": 1, "rh": 30, "pre": ["CH2-320"], "tr": "환원이 산소를 잃는 것만 같아, 전자를 얻는 것(또는 산소 잃음·수소 얻음)이라는 게 빠진다.", "an": "환원은 전자를 얻는 것: 산소 잃음·수소 얻음도 포함한다.", "rd": "전자를 얻으면(산소 잃음·수소 얻음 포함) 환원이다.", "tf": "전자를 얻는 것은? (환원)"}, "CH2-322": {"n": "동시성", "c": "ch2", "u": "산화수", "t": "C", "dx": "산화와 환원이 한쪽이 잃은 전자를 다른 쪽이 얻으며 항상 동시에 일어난다는 점을 놓친 경우다. 따로 일어난다고 보면 산화환원을 한 반응으로 못 본다.", "fx": "'산화와 환원은 한쪽이 잃은 전자를 다른 쪽이 얻으며 항상 동시에 일어남'을 못 박는다. 따로 일어난다고 보지 말고 산화환원을 한 반응으로 보라.", "f": "B2", "rk": 209, "d": 2, "rh": 29, "pre": ["CH2-320", "CH2-321"], "tr": "산화만 따로 일어날 것 같아, 한쪽이 잃은 전자를 다른 쪽이 얻어 늘 동시라는 게 빠진다.", "an": "한쪽이 잃은 전자를 다른 쪽이 얻어 늘 동시다.", "rd": "잃은 전자는 어딘가 가야 한다. 그래서 산화와 환원이 늘 동시다.", "tf": "산화와 환원은 따로 일어나나? (아니다: 동시)"}, "CH2-323": {"n": "산화수 규칙", "c": "ch2", "u": "산화수", "t": "B", "dx": "산화수 규칙(홑원소는 0, 수소는 보통 +1, 산소는 보통 -2)을 놓친 경우다. 이 기본 규칙이 흔들리면 화합물 속 원자의 산화수를 못 매긴다.", "fx": "산화수 규칙을 '홑원소는 0, 수소는 보통 +1, 산소는 보통 -2'로 못 박는다. 이 기본 규칙으로 화합물 속 원자의 산화수를 매겨라.", "f": "D3", "rk": 98, "d": 1, "rh": 33, "pre": ["CH2-320"], "tr": "산화수 규칙이 외울 목록 같아, 홑원소 0·수소 보통 +1·산소 보통 -2가 섞인다.", "an": "산화수는 전자를 다 줬다 치고 매긴 가상 전하: 홑원소 0·수소 +1·산소 -2가 기본이다.", "rd": "전자를 전기음성도 큰 쪽이 다 가졌다 가정한 가상 전하다. 홑원소 0·수소 +1·산소 -2가 기본이다.", "tf": "홑원소의 산화수는? (0)"}, "CH2-324": {"n": "산화수 합", "c": "ch2", "u": "산화수", "t": "C", "dx": "한 화학종에서 산화수의 합이 전체 전하와 같다는(중성은 0, 이온은 그 전하) 점을 놓친 경우다. 이 합 규칙이 약하면 모르는 원자의 산화수를 역산하지 못한다.", "fx": "'한 화학종에서 산화수의 합이 전체 전하와 같음(중성 0, 이온은 그 전하)'을 못 박는다. 이 합 규칙으로 모르는 원자의 산화수를 역산하라.", "f": "D3", "rk": 210, "d": 2, "rh": 1, "pre": ["CH2-323"], "tr": "산화수 합이 막연해, 전체 전하와 같다(중성 0·이온은 그 전하)는 게 빠진다.", "an": "산화수 합=전체 전하: 중성 0, 이온은 그 전하다.", "rd": "전하 보존이라 산화수 합이 전체 전하와 같다. 중성은 0, 이온은 그 전하다.", "tf": "산화수 합은 무엇과 같나? (전체 전하)"}, "CH2-325": {"n": "산화수 변화", "c": "ch2", "u": "산화수", "t": "C", "dx": "산화수가 증가하면 산화, 감소하면 환원이라는 점을 놓친 경우다. 산화수 변화로 산화·환원을 가리지 못하면 어느 물질이 산화·환원됐는지 못 짚는다.", "fx": "'산화수가 증가하면 산화, 감소하면 환원'을 못 박는다. 산화수 변화로 어느 물질이 산화·환원됐는지 가려라.", "f": "B1", "rk": 211, "d": 2, "rh": 28, "pre": ["CH2-323"], "tr": "산화수 변화 방향이 헷갈려, 증가면 산화·감소면 환원이라는 게 흔들린다.", "an": "증가면 산화, 감소면 환원이다.", "rd": "전자를 잃으면 증가(산화), 얻으면 감소(환원)다.", "tf": "산화수가 증가하면? (산화)"}, "CH2-326": {"n": "산화제", "c": "ch2", "u": "산화수", "t": "C", "dx": "산화제가 상대를 산화시키면서 자신은 환원되는(전자를 받는) 물질이라는 점을 놓친 경우다. 산화제가 환원된다는 역설적 관계가 약하면 산화제·환원제를 거꾸로 잡는다.", "fx": "산화제를 '상대를 산화시키면서 자신은 환원되는(전자를 받는) 물질'로 못 박는다. 산화제가 환원된다는 역설을 잡아 산화제·환원제를 거꾸로 잡지 마라.", "f": "B1", "rk": 359, "d": 3, "rh": 24, "pre": ["CH2-322", "CH2-325"], "tr": "산화제니 산화되는 것 같아, 상대를 산화시키며 자신은 환원되는(전자 받는) 물질이라는 게 헷갈린다.", "an": "산화제는 남을 산화시키며 자기는 환원되는(전자 받는) 물질: 이름과 반대다.", "rd": "산화제는 전자를 받아 남을 산화시킨다. 그래서 자기는 환원된다. 이름과 반대다.", "tf": "산화제는 산화되나 환원되나? (환원됨: 이름과 반대)"}, "CH2-327": {"n": "환원제", "c": "ch2", "u": "산화수", "t": "A", "dx": "환원제가 상대를 환원시키면서 자신은 산화되는(전자를 내놓는) 물질이라는 점을 놓친 경우다. 환원제가 산화된다는 관계가 약하면 산화제·환원제를 거꾸로 잡는다.", "fx": "환원제를 '상대를 환원시키면서 자신은 산화되는(전자를 내놓는) 물질'로 못 박는다. 환원제가 산화된다는 관계를 잡아 산화제·환원제를 거꾸로 잡지 마라.", "f": "B1", "rk": 360, "d": 3, "rh": 2, "pre": ["CH2-322", "CH2-325"], "tr": "환원제니 환원되는 것 같아, 상대를 환원시키며 자신은 산화되는(전자 내놓는) 물질이라는 게 헷갈린다.", "an": "환원제는 남을 환원시키며 자기는 산화되는(전자 내놓는) 물질: 이름과 반대다.", "rd": "환원제는 전자를 주어 남을 환원시킨다. 그래서 자기는 산화된다. 이름과 반대다.", "tf": "환원제는 산화되나 환원되나? (산화됨: 이름과 반대)"}, "CH2-328": {"n": "산화제와 전자", "c": "ch2", "u": "산화수", "t": "C", "dx": "산화제가 전자를 받는다는 점을 놓친 경우다. 전자를 받아 자신이 환원된다는 흐름이 약하면 전자 이동 방향을 잘못 잡는다.", "fx": "'산화제는 전자를 받음'을 못 박는다. 전자를 받아 자신이 환원되는 흐름으로 전자 이동 방향을 잡아라.", "f": "B1", "rk": 521, "d": 4, "rh": 0, "pre": ["CH2-326"], "tr": "산화제가 전자를 줄 것 같아, 받는다는 게 흔들린다.", "an": "산화제는 전자를 받는다.", "rd": "산화제는 남을 산화시키려 전자를 받는다.", "tf": "산화제는 전자를 받나 주나? (받음)"}, "CH2-329": {"n": "환원제와 전자", "c": "ch2", "u": "산화수", "t": "C", "dx": "환원제가 전자를 내놓는다는 점을 놓친 경우다. 전자를 잃어 자신이 산화된다는 흐름이 약하면 전자 이동 방향을 잘못 잡는다.", "fx": "'환원제는 전자를 내놓음'을 못 박는다. 전자를 잃어 자신이 산화되는 흐름으로 전자 이동 방향을 잡아라.", "f": "B1", "rk": 522, "d": 4, "rh": 0, "pre": ["CH2-327"], "tr": "환원제가 전자를 받을 것 같아, 내놓는다는 게 흔들린다.", "an": "환원제는 전자를 내놓는다.", "rd": "환원제는 남을 환원시키려 전자를 내놓는다.", "tf": "환원제는 전자를 받나 주나? (줌)"}, "CH2-330": {"n": "산화제 산화수", "c": "ch2", "u": "산화수", "t": "C", "dx": "산화제는 전자를 받아 산화수가 감소한다(환원됨)는 점을 놓친 경우다. 산화수 변화로 산화제를 가리지 못하면 반응 해석이 어긋난다.", "fx": "'산화제는 전자를 받아 산화수가 감소함(환원됨)'을 못 박는다. 산화수 변화로 산화제를 가려 반응을 해석하라.", "f": "B1", "rk": 523, "d": 4, "rh": 0, "pre": ["CH2-326"], "tr": "산화제 산화수가 늘 것 같아, 전자를 받아 감소한다(환원됨)는 게 흔들린다.", "an": "산화제는 전자를 받아 산화수가 감소(환원됨)한다.", "rd": "산화제는 전자를 받아 산화수가 감소한다(환원됨).", "tf": "산화제의 산화수는? (감소)"}, "CH2-331": {"n": "환원제 산화수", "c": "ch2", "u": "산화수", "t": "C", "dx": "환원제는 전자를 잃어 산화수가 증가한다(산화됨)는 점을 놓친 경우다. 산화수 변화로 환원제를 가리지 못하면 반응 해석이 어긋난다.", "fx": "'환원제는 전자를 잃어 산화수가 증가함(산화됨)'을 못 박는다. 산화수 변화로 환원제를 가려 반응을 해석하라.", "f": "B1", "rk": 524, "d": 4, "rh": 0, "pre": ["CH2-327"], "tr": "환원제 산화수가 줄 것 같아, 전자를 잃어 증가한다(산화됨)는 게 흔들린다.", "an": "환원제는 전자를 잃어 산화수가 증가(산화됨)한다.", "rd": "환원제는 전자를 잃어 산화수가 증가한다(산화됨).", "tf": "환원제의 산화수는? (증가)"}, "CH2-332": {"n": "전자 균형", "c": "ch2", "u": "산화수", "t": "C", "dx": "산화에서 잃은 전자 수와 환원에서 얻은 전자 수가 같아야(전자 보존) 한다는 점을 놓친 경우다. 전자 균형이 약하면 산화환원 반응식의 계수를 못 맞춘다.", "fx": "'산화에서 잃은 전자 수와 환원에서 얻은 전자 수가 같아야(전자 보존) 함'을 못 박는다. 전자 균형으로 산화환원 반응식의 계수를 맞춰라.", "f": "D3", "rk": 361, "d": 3, "rh": 0, "pre": ["CH2-322"], "tr": "전자가 어디론가 사라질 것 같아, 잃은 수와 얻은 수가 같아야(보존) 한다는 게 빠진다.", "an": "잃은 전자 수=얻은 전자 수(보존)다.", "rd": "전자는 생기거나 사라지지 않는다. 그래서 잃은 수=얻은 수다.", "tf": "잃은 전자와 얻은 전자는? (같음)"}, "CH2-333": {"n": "과산화물", "c": "ch2", "u": "산화수", "t": "C", "dx": "과산화물에서는 산소의 산화수가 보통의 -2가 아니라 -1이라는 예외를 놓친 경우다. 이 예외를 모르면 과산화수소 같은 물질의 산화수가 어긋난다.", "fx": "'과산화물에서는 산소의 산화수가 보통의 -2가 아니라 -1'임을 못 박는다. 이 예외로 과산화수소 같은 물질의 산화수를 맞춰라.", "f": "D1", "rk": 212, "d": 2, "rh": 0, "pre": ["CH2-323"], "tr": "산소는 늘 -2일 것 같아, 과산화물에선 -1이라는 예외가 빠진다.", "an": "산소는 보통 -2지만 과산화물에선 -1이다.", "rd": "산소는 보통 -2지만 과산화물에선 O-O 결합이라 -1이다.", "tf": "과산화물에서 산소의 산화수는? (-1)"}, "CH2-334": {"n": "금속 수소화물", "c": "ch2", "u": "산화수", "t": "C", "dx": "금속 수소화물에서는 수소의 산화수가 보통의 +1이 아니라 -1이라는 예외를 놓친 경우다. 이 예외를 모르면 NaH 같은 물질의 산화수가 어긋난다.", "fx": "'금속 수소화물에서는 수소의 산화수가 보통의 +1이 아니라 -1'임을 못 박는다. 이 예외로 NaH 같은 물질의 산화수를 맞춰라.", "f": "D1", "rk": 213, "d": 2, "rh": 0, "pre": ["CH2-323"], "tr": "수소는 늘 +1일 것 같아, 금속 수소화물에선 -1이라는 예외가 빠진다.", "an": "수소는 보통 +1이지만 금속 수소화물에선 -1이다.", "rd": "수소는 보통 +1이지만 금속과는 H가 음전하라 -1이다.", "tf": "금속 수소화물에서 수소의 산화수는? (-1)"}, "CH2-335": {"n": "산화수 계산", "c": "ch2", "u": "산화수", "t": "C", "dx": "산화수 규칙과 합이 전하와 같다는 조건으로 모르는 원자의 산화수를 구하는 게 흔들린 경우다. 이 셈이 약하면 산화·환원 판정의 출발이 막힌다.", "fx": "모르는 원자의 산화수를 '산화수 규칙과 합이 전하와 같다는 조건으로' 구한다. 이 셈을 산화·환원 판정의 출발로 삼아라.", "f": "D3", "rk": 362, "d": 3, "rh": 0, "pre": ["CH2-324"], "tr": "산화수 계산이 막막해, 규칙과 합=전하 조건으로 모르는 값을 구한다는 게 흔들린다.", "an": "규칙과 합=전하 조건으로 모르는 값을 구한다.", "rd": "규칙과 합=전하 조건을 세워 모르는 산화수를 푼다.", "tf": "모르는 산화수는 무엇으로 푸나? (합=전하)"}, "CH2-336": {"n": "산화제 역할", "c": "ch2", "u": "산화수", "t": "C", "dx": "산화제가 전자를 받아 자신은 환원되면서 상대를 산화시키는 역할이라는 점을 놓친 경우다. 이 역할이 흐리면 반응에서 산화제를 못 짚는다.", "fx": "산화제를 '전자를 받아 자신은 환원되면서 상대를 산화시키는 역할'로 못 박는다. 이 역할로 반응에서 산화제를 짚어라.", "f": "B1", "rk": 525, "d": 4, "rh": 0, "pre": ["CH2-326"], "tr": "산화제 역할이 헷갈려, 전자를 받아 자신은 환원되며 상대를 산화시킨다는 게 흔들린다.", "an": "산화제는 전자를 받아 자기는 환원되며 상대를 산화시킨다.", "rd": "산화제는 전자를 받아 자기는 환원되며 상대를 산화시킨다.", "tf": "산화제는 상대를 무엇? (산화)"}, "CH2-062": {"n": "돌턴 법칙", "c": "ch2", "u": "분압", "t": "A", "dx": "전체 압력이 각 성분 기체 분압의 합이라는 돌턴 법칙을 놓친 경우다(각 기체가 독립적으로 압력을 냄). 분압을 더한다는 점이 약하면 혼합 기체의 전체·성분 압력 관계가 어긋난다.", "fx": "돌턴 법칙을 '전체 압력 = 각 성분 기체 분압의 합(각 기체가 독립적으로 압력을 냄)'으로 못 박는다. 분압을 더해 혼합 기체의 전체·성분 압력을 잡아라.", "f": "B2", "rk": 64, "d": 1, "rh": 7, "pre": ["CH2-036"], "tr": "섞인 기체 압력이 평균날 것 같아, 각 분압의 합이라(독립적으로 압력 냄)는 게 빠진다.", "an": "섞인 기체 전체 압력은 각 분압의 합: 각자 독립적으로 압력을 낸다.", "rd": "이상 기체는 서로 무관하게 압력을 낸다. 그래서 전체 압력=각 분압의 합이다.", "tf": "섞인 기체의 전체 압력은? (각 분압의 합)"}, "CH2-063": {"n": "분압 정의", "c": "ch2", "u": "분압", "t": "C", "dx": "분압이 한 성분 기체가 전체 부피를 혼자 차지했을 때 낼 압력이라는 점을 놓친 경우다. 전체 부피 기준이라는 점이 약하면 분압의 의미를 잘못 잡는다.", "fx": "분압을 '한 성분 기체가 전체 부피를 혼자 차지했을 때 낼 압력'으로 못 박는다. 전체 부피 기준임을 잡아 분압의 의미를 바로 세워라.", "f": "B2", "rk": 167, "d": 2, "rh": 5, "pre": ["CH2-062"], "tr": "분압이 막연해, 한 성분이 전체 부피를 혼자 차지할 때 낼 압력이라는 게 빠진다.", "an": "분압은 한 성분이 전체 부피를 혼자 차지할 때 낼 압력이다.", "rd": "한 성분이 전체 부피를 혼자 차지하면 낼 압력이 분압이다.", "tf": "한 성분이 혼자 차지할 때의 압력은? (분압)"}, "CH2-064": {"n": "분압-몰분율", "c": "ch2", "u": "분압", "t": "A", "dx": "분압이 (전체 압력 × 그 성분의 몰분율)이라는 관계를 놓친 경우다. 이 정의 관계가 약하면 혼합 기체에서 각 성분의 분압을 못 구한다.", "fx": "분압을 '전체 압력 × 그 성분의 몰분율'로 못 박는다. 이 정의 관계로 혼합 기체에서 각 성분의 분압을 구하라.", "f": "A2", "rk": 293, "d": 3, "rh": 1, "pre": ["CH2-063", "CH2-065"], "tr": "분압이 막연해, (전체 압력×몰분율)이라는 게 빠진다.", "an": "분압=전체 압력×몰분율이다.", "rd": "분압은 전체 압력에 그 성분의 몰분율을 곱한 값이다.", "tf": "분압=전체 압력 곱하기 무엇? (몰분율)"}, "CH2-065": {"n": "몰분율", "c": "ch2", "u": "분압", "t": "B", "dx": "몰분율이 (성분 몰수 ÷ 전체 몰수)이고 모든 성분의 몰분율 합이 1이라는 점을 놓친 경우다. 몰분율 정의가 약하면 분압-몰분율 계산이 막힌다.", "fx": "몰분율을 '성분 몰수 ÷ 전체 몰수, 모든 성분의 합은 1'로 못 박는다. 이 정의로 분압-몰분율 계산을 이어가라.", "f": "D3", "rk": 168, "d": 2, "rh": 2, "pre": ["CH2-062"], "tr": "몰분율이 막연해, (성분 몰수÷전체 몰수)이고 합이 1이라는 게 빠진다.", "an": "몰분율=성분 몰수÷전체 몰수, 합이 1이다.", "rd": "몰분율=성분 몰수÷전체 몰수다. 다 더하면 1이다.", "tf": "몰분율을 다 더하면? (1)"}, "CH2-066": {"n": "분압-몰수", "c": "ch2", "u": "분압", "t": "C", "dx": "같은 온도·부피에서 분압이 그 성분의 몰수에 비례한다는 점을 놓친 경우다. 분압이 몰수를 대변한다는 점이 약하면 몰수로 분압을 가늠하지 못한다.", "fx": "'같은 온도·부피에서 분압은 그 성분의 몰수에 비례'함을 못 박는다. 분압이 몰수를 대변함을 잡아 몰수로 분압을 가늠하라.", "f": "A2", "rk": 294, "d": 3, "rh": 1, "pre": ["CH2-063"], "tr": "분압이 몰수와 무관할 것 같아, 같은 온도·부피서 몰수에 비례한다는 게 빠진다.", "an": "같은 온도·부피면 분압이 몰수에 비례한다.", "rd": "같은 온도·부피면 압력이 몰수에 비례한다. 그래서 분압이 몰수에 비례한다.", "tf": "같은 온도·부피에서 분압은 무엇에 비례? (몰수)"}, "CH2-067": {"n": "분압비", "c": "ch2", "u": "분압", "t": "B", "dx": "분압의 비가 곧 몰수의 비라는 점을 놓친 경우다(같은 온도·부피에서). 분압비=몰비라는 점이 약하면 압력 자료로 성분 조성을 못 읽는다.", "fx": "'분압의 비가 곧 몰수의 비(같은 온도·부피)'임을 못 박는다. 분압비 = 몰비로 압력 자료에서 성분 조성을 읽어라.", "f": "A2", "rk": 462, "d": 4, "rh": 0, "pre": ["CH2-066"], "tr": "분압비가 막연해, 같은 온도·부피서 곧 몰수의 비라는 게 빠진다.", "an": "같은 온도·부피면 분압비가 곧 몰수의 비다.", "rd": "같은 온도·부피면 분압이 몰수에 비례한다. 그래서 분압비가 몰수비다.", "tf": "같은 온도·부피에서 분압비는? (몰수비)"}, "CH2-068": {"n": "수상 치환", "c": "ch2", "u": "분압", "t": "C", "dx": "물 위로 기체를 모을 때(수상 치환) 모인 기체에 수증기가 섞여 있어 전체 압력에서 그 온도의 수증기압을 빼야 한다는 점을 놓친 경우다. 이 보정을 빼먹으면 포집한 기체의 분압이 과대평가된다.", "fx": "'수상 치환으로 모은 기체엔 수증기가 섞여 있어 전체 압력에서 그 온도의 수증기압을 빼야' 함을 못 박는다. 이 보정을 빼먹어 포집 기체 분압을 과대평가하지 마라.", "f": "D2", "rk": 295, "d": 3, "rh": 0, "pre": ["CH2-063", "CH2-070"], "tr": "물 위로 모은 기체가 순수할 것 같아, 수증기가 섞여 그 온도의 수증기압을 빼야 한다는 게 빠진다.", "an": "물 위로 모은 기체엔 수증기가 섞여 그 온도의 수증기압을 빼야 한다.", "rd": "물 위로 모으면 수증기가 섞인다. 그래서 그 온도의 수증기압을 빼야 한다.", "tf": "물 위로 모은 기체에서 빼야 할 것은? (수증기압)"}, "CH2-069": {"n": "분압 계산", "c": "ch2", "u": "분압", "t": "C", "dx": "분압을 (몰분율 × 전체 압력)으로 계산하는 게 흔들린 경우다. 몰분율을 구해 전체 압력에 곱하는 절차가 약하면 분압 값이 어긋난다.", "fx": "분압을 '몰분율 × 전체 압력'으로 계산한다. 몰분율을 구해 전체 압력에 곱하는 절차를 따라 분압 값을 맞춰라.", "f": "D3", "rk": 463, "d": 4, "rh": 0, "pre": ["CH2-064"], "tr": "분압 계산이 막막해, (몰분율×전체 압력)이라는 게 흔들린다.", "an": "분압=몰분율×전체 압력이다.", "rd": "분압=몰분율×전체 압력이다.", "tf": "분압=몰분율 곱하기 무엇? (전체 압력)"}, "CH2-052": {"n": "실제 기체 특징", "c": "ch2", "u": "실제기체", "t": "B", "dx": "실제 기체가 이상 기체와 달리 분자에 크기가 있고 분자 간 힘이 작용한다는 점을 놓친 경우다. 이 두 차이가 약하면 실제 기체가 이상 기체에서 벗어나는 까닭을 못 짚는다.", "fx": "실제 기체를 '이상과 달리 분자에 크기가 있고 분자 간 힘이 작용함'으로 못 박는다. 이 두 차이로 실제 기체가 이상에서 벗어나는 까닭을 짚어라.", "f": "B2", "rk": 289, "d": 3, "rh": 2, "pre": ["CH2-050"], "tr": "실제 기체도 이상 같을 것 같아, 분자에 크기가 있고 분자 간 힘이 작용한다는 게 빠진다.", "an": "실제 기체는 분자 크기와 인력이 있어 이상과 다르다.", "rd": "실제 분자는 크기와 인력이 있다. 그래서 이상과 다르다.", "tf": "실제 기체가 이상과 다른 이유는? (크기·인력)"}, "CH2-053": {"n": "이상 기체 근접 조건", "c": "ch2", "u": "실제기체", "t": "C", "dx": "실제 기체가 고온·저압에서 이상 기체에 가까워진다(분자 부피·인력 영향이 작아짐)는 점을 놓친 경우다. 분자가 멀리 빠르게 움직이는 조건이라는 점이 약하면 언제 이상 기체로 봐도 되는지 못 가린다.", "fx": "'실제 기체는 고온·저압에서 이상 기체에 가까워짐(분자 부피·인력 영향이 작아짐)'을 못 박는다. 분자가 멀리 빠르게 움직이는 조건임을 잡아 언제 이상으로 봐도 되는지 가려라.", "f": "D2", "rk": 290, "d": 3, "rh": 2, "pre": ["CH2-050"], "tr": "이상 기체에 가까우려면 빽빽하고 차가워야 할 것 같은데, 고온·저압이라 거꾸로 느껴진다.", "an": "분자가 서로 멀고(저압) 빨라서 인력을 무시할 때(고온) 이상에 가깝다: 빽빽·차가움의 반대다.", "rd": "분자가 멀면(저압) 부피·인력이 무시되고 빠르면(고온) 인력을 이긴다. 그래서 저압·고온에서 이상에 가깝다.", "tf": "실제 기체가 이상에 가까운 조건은? (저압·고온)"}, "CH2-054": {"n": "이상 기체 편차", "c": "ch2", "u": "실제기체", "t": "A", "dx": "실제 기체가 고압에서는 분자 부피 영향이, 저온에서는 인력 영향이 커져 이상 기체에서 크게 벗어난다는 점을 놓친 경우다. 어느 조건에서 무엇이 편차를 키우는지 못 가르면 실제 기체 거동을 잘못 본다.", "fx": "'고압에선 분자 부피 영향이, 저온에선 인력 영향이 커져 이상에서 크게 벗어남'을 못 박는다. 어느 조건에서 무엇이 편차를 키우는지 갈라 실제 거동을 잡아라.", "f": "D2", "rk": 291, "d": 3, "rh": 1, "pre": ["CH2-050"], "tr": "실제 기체가 어디서 벗어나는지 막막해, 고압선 분자 부피·저온선 인력 영향이 커져서라는 게 빠진다.", "an": "고압선 분자 부피, 저온선 인력 영향이 커져 벗어난다.", "rd": "고압에선 분자 부피가, 저온에선 인력이 두드러진다. 그래서 그 조건에서 벗어난다.", "tf": "고압에서 두드러지는 것은? (분자 부피)"}, "CH2-055": {"n": "반데르발스 식", "c": "ch2", "u": "실제기체", "t": "C", "dx": "반데르발스 식이 이상 기체 방정식에 분자 부피와 인력 두 요인을 보정한 실제 기체용 식이라는 점을 놓친 경우다. 두 보정 항의 의미가 약하면 실제 기체 식을 해석하지 못한다.", "fx": "반데르발스 식을 '이상 기체 방정식에 분자 부피와 인력 두 요인을 보정한 실제 기체용 식'으로 못 박는다. 두 보정 항의 의미를 잡아 실제 기체 식을 해석하라.", "f": "B2", "rk": 457, "d": 4, "rh": 1, "pre": ["CH2-052"], "tr": "반데르발스 식이 막연해, 이상 기체 식에 분자 부피와 인력을 보정한 실제 기체용이라는 게 빠진다.", "an": "이상 기체 식에 분자 부피와 인력 보정을 더한 실제 기체용 식이다.", "rd": "이상 기체 식에 분자 부피와 인력을 보정한다. 그것이 실제 기체용 식이다.", "tf": "이상 기체 식에 부피·인력을 보정한 식은? (반데르발스)"}, "CH2-056": {"n": "반데르발스 상수", "c": "ch2", "u": "실제기체", "t": "A", "dx": "반데르발스 상수에서 a가 분자 간 인력을, b가 분자 자체 부피를 나타내는 기체 고유 값이라는 점을 놓친 경우다. a와 b의 역할을 바꾸면 실제 기체 비교가 어긋난다.", "fx": "반데르발스 상수를 'a는 분자 간 인력, b는 분자 자체 부피를 나타내는 기체 고유 값'으로 못 박는다. a와 b의 역할을 바꾸지 말고 실제 기체를 비교하라.", "f": "B2", "rk": 615, "d": 5, "rh": 0, "pre": ["CH2-055"], "tr": "a·b가 헷갈려, a가 인력·b가 분자 부피를 나타내는 고유값이라는 게 빠진다.", "an": "a는 인력, b는 분자 부피를 나타내는 고유값이다.", "rd": "a는 인력, b는 분자 부피를 나타낸다. 각 기체의 고유값이다.", "tf": "반데르발스 b는 무엇을 나타내나? (분자 부피)"}, "CH2-057": {"n": "압축 인자", "c": "ch2", "u": "실제기체", "t": "A", "dx": "압축 인자가 Z = PV/nRT로 정의되고 이상 기체는 Z=1, 그에서 벗어나면 실제 기체라는 점을 놓친 경우다. Z가 1에서 얼마나 떨어졌는지가 편차의 척도라는 점이 약하면 실제 기체 정도를 못 읽는다.", "fx": "압축 인자를 'Z = PV/nRT로 정의, 이상 기체는 Z=1, 벗어나면 실제 기체'로 못 박는다. Z가 1에서 떨어진 정도를 편차의 척도로 읽어라.", "f": "D3", "rk": 292, "d": 3, "rh": 1, "pre": ["CH2-036", "CH2-050"], "tr": "압축 인자가 막연해, Z=PV/nRT이고 이상 기체는 Z=1이라는 게 빠진다.", "an": "Z=PV/nRT, 이상 기체는 Z=1: 실제/이상 눈금이다.", "rd": "Z=PV/nRT다. 이상 기체면 1이라 벗어난 정도를 잰다.", "tf": "이상 기체의 압축 인자 Z는? (1)"}, "CH2-058": {"n": "압축 인자 해석", "c": "ch2", "u": "실제기체", "t": "C", "dx": "압축 인자가 1보다 작으면 인력이 우세해 부피가 이상보다 작고, 1보다 크면 분자 부피 영향이 우세하다는 해석을 놓친 경우다. Z의 위아래 의미가 약하면 어느 효과가 지배하는지 못 가린다.", "fx": "'Z<1이면 인력이 우세해 부피가 이상보다 작고, Z>1이면 분자 부피 영향이 우세함'을 못 박는다. Z의 위아래로 어느 효과가 지배하는지 가려라.", "f": "B2", "rk": 458, "d": 4, "rh": 0, "pre": ["CH2-057"], "tr": "Z<1·Z>1이 막연해, 1보다 작으면 인력 우세·크면 분자 부피 우세라는 게 빠진다.", "an": "Z<1이면 인력 우세, Z>1이면 분자 부피 우세다.", "rd": "인력이 세면 부피가 줄어 Z<1, 분자 부피가 두드러지면 Z>1이다.", "tf": "Z<1이면 무엇이 우세? (인력)"}, "CH2-059": {"n": "편차 크기", "c": "ch2", "u": "실제기체", "t": "C", "dx": "실제 기체 편차의 크기가 조건에 따라 인력이 큰지 분자 부피가 큰지로 갈린다는 점을 놓친 경우다. 어느 요인이 더 센지를 못 따지면 편차 크기를 비교하지 못한다.", "fx": "'실제 기체 편차의 크기는 조건에 따라 인력이 큰지 분자 부피가 큰지로 갈림'을 못 박는다. 어느 요인이 더 센지 따져 편차 크기를 비교하라.", "f": "B2", "rk": 459, "d": 4, "rh": 0, "pre": ["CH2-054"], "tr": "실제 기체 편차가 한 가지 같아, 조건 따라 인력이 큰지 분자 부피가 큰지로 갈린다는 게 빠진다.", "an": "편차는 한 가지가 아니라 조건 따라 인력이 큰지 부피가 큰지로 갈린다.", "rd": "조건에 따라 인력이 우세하거나 분자 부피가 우세하다. 그래서 편차 방향이 갈린다.", "tf": "편차는 한 방향뿐인가? (아니다: 조건 따라 다름)"}, "CH2-060": {"n": "이상 기체 근접", "c": "ch2", "u": "실제기체", "t": "C", "dx": "분자 간 힘이 약하고 작은 기체일수록 이상 기체에 가깝게 거동한다는 점을 놓친 경우다(He가 대표적). 인력·부피와 이상성의 관계가 약하면 어느 기체가 더 이상적인지 못 가린다.", "fx": "'분자 간 힘이 약하고 작은 기체일수록 이상 기체에 가깝게 거동'함을 못 박는다(He가 대표). 인력·부피와 이상성의 관계로 어느 기체가 더 이상적인지 가려라.", "f": "B2", "rk": 460, "d": 4, "rh": 0, "pre": ["CH2-053"], "tr": "어떤 기체가 이상에 가까운지 막막해, 분자 간 힘이 약하고 작을수록(He) 가깝다는 게 빠진다.", "an": "분자 간 힘이 약하고 작을수록(He) 이상에 가깝다.", "rd": "분자 간 힘이 약하고 작을수록 이상에 가깝다. 그래서 He가 가깝다.", "tf": "어떤 기체가 이상에 가장 가깝나? (He)"}, "CH2-061": {"n": "저압 근사", "c": "ch2", "u": "실제기체", "t": "C", "dx": "저압에서는 분자 사이 거리가 멀어 분자 부피·인력의 영향이 작아져 편차가 작아진다는 점을 놓친 경우다. 압력이 낮을수록 이상 기체에 가깝다는 점이 약하면 근사 조건을 못 잡는다.", "fx": "'저압에선 분자 사이 거리가 멀어 분자 부피·인력의 영향이 작아져 편차가 작아짐'을 못 박는다. 압력이 낮을수록 이상에 가까움을 근사 조건으로 잡아라.", "f": "D2", "rk": 461, "d": 4, "rh": 0, "pre": ["CH2-053"], "tr": "저압서 왜 이상에 가까운지 막막해, 분자 거리가 멀어 부피·인력 영향이 작아서라는 게 빠진다.", "an": "저압에선 분자 거리가 멀어 부피·인력 영향이 작아 이상에 가깝다.", "rd": "저압에선 분자 거리가 멀다. 그래서 부피·인력 영향이 작아 이상에 가깝다.", "tf": "저압에서 이상에 가까운 이유는? (분자 거리가 멈)"}, "CH2-091": {"n": "결정성 고체", "c": "ch2", "u": "고체", "t": "C", "dx": "결정성 고체가 입자가 규칙적으로 배열된 고체라는 점을 놓친 경우다. 규칙적 배열이 약하면 일정한 녹는점을 갖는 결정성과 그렇지 않은 비결정성의 차이를 못 짚는다.", "fx": "결정성 고체를 '입자가 규칙적으로 배열된 고체'로 못 박는다. 규칙 배열이 일정한 녹는점으로 이어짐을 잡아 비결정성과 구분하라.", "f": "B2", "rk": 66, "d": 1, "rh": 20, "pre": ["CH2-001"], "tr": "결정성 고체가 막연해, 입자가 규칙적으로 배열된 고체라는 게 빠진다.", "an": "입자가 규칙적으로 줄 맞춰 배열된 고체다.", "rd": "입자가 규칙적으로 줄 맞춰 배열된 고체다.", "tf": "입자가 규칙적으로 배열된 고체는? (결정성)"}, "CH2-092": {"n": "비결정성 고체", "c": "ch2", "u": "고체", "t": "C", "dx": "비결정성(무정형) 고체가 입자 배열이 불규칙해 일정한 녹는점이 없다는 점을 놓친 경우다(유리가 대표적). 불규칙 배열이 약하면 결정성과의 차이를 가르지 못한다.", "fx": "비결정성(무정형) 고체를 '입자 배열이 불규칙해 일정한 녹는점이 없음'으로 못 박는다(유리가 대표). 불규칙 배열로 결정성과의 차이를 가려라.", "f": "B2", "rk": 177, "d": 2, "rh": 0, "pre": ["CH2-091"], "tr": "비결정성 고체가 막연해, 배열이 불규칙해 일정한 녹는점이 없다(유리)는 게 빠진다.", "an": "배열이 불규칙해 일정한 녹는점이 없다: 유리다.", "rd": "배열이 불규칙해 녹는 온도가 한 점이 아니다. 유리가 그 예다.", "tf": "녹는점이 한 점이 아닌 고체는? (비결정성, 유리)"}, "CH2-093": {"n": "이온 결정", "c": "ch2", "u": "고체", "t": "C", "dx": "이온 결정이 양이온과 음이온이 이온 결합으로 격자를 이룬 고체라는 점을 놓친 경우다. 구성이 흐리면 녹는점·전도성 같은 이온 결정의 성질로 이어지지 못한다.", "fx": "이온 결정을 '양이온과 음이온이 이온 결합으로 격자를 이룬 고체'로 못 박는다. 이 구성에서 녹는점·전도성 같은 성질로 이어라.", "f": "B2", "rk": 178, "d": 2, "rh": 4, "pre": ["CH2-091"], "tr": "이온 결정이 막연해, 양·음이온이 이온 결합으로 격자를 이룬 고체라는 게 빠진다.", "an": "양·음이온이 이온 결합으로 격자를 이룬 고체다.", "rd": "양·음이온이 이온 결합으로 격자를 이룬 고체다.", "tf": "이온 결합으로 격자를 이룬 고체는? (이온 결정)"}, "CH2-094": {"n": "이온 결정 녹는점", "c": "ch2", "u": "고체", "t": "C", "dx": "이온 결정이 강한 정전기적 인력 때문에 녹는점이 높다는 점을 놓친 경우다. 인력 세기가 녹는점을 정한다는 연결이 약하면 결정 유형별 녹는점 비교가 어긋난다.", "fx": "'이온 결정은 강한 정전기적 인력 때문에 녹는점이 높음'을 못 박는다. 인력 세기가 녹는점을 정함을 결정 유형별 비교에 써라.", "f": "B3", "rk": 303, "d": 3, "rh": 1, "pre": ["CH2-093"], "tr": "이온 결정 녹는점이 막연해, 강한 정전기 인력 때문에 높다는 게 빠진다.", "an": "강한 정전기 인력 때문에 녹는점이 높다.", "rd": "정전기 인력이 강해 끊으려면 큰 에너지가 든다. 그래서 녹는점이 높다.", "tf": "이온 결정의 녹는점이 높은 이유는? (강한 정전기)"}, "CH2-095": {"n": "이온 결정 전도성", "c": "ch2", "u": "고체", "t": "A", "dx": "이온 결정이 고체에서는 이온이 격자에 고정돼 전기가 안 통하고, 녹거나 물에 녹으면 이온이 자유로이 움직여 통한다는 조건 차이를 놓친 경우다. 이 구분이 약하면 전해질·전기분해 단원이 흔들린다.", "fx": "이온 결정을 '고체는 이온이 격자에 고정돼 안 통하고, 녹거나 물에 녹으면 이온이 움직여 통함'으로 못 박는다. 이 조건 차이를 전해질·전기분해의 바탕으로 삼아라.", "f": "D2", "rk": 304, "d": 3, "rh": 0, "pre": ["CH2-093"], "tr": "이온 결정이 늘 전기를 통할 것 같아, 고체는 안 통하고 녹거나 녹으면 통한다는 조건 차이가 빠진다.", "an": "고체는 안 통하고 녹거나 녹으면 통한다: 이온이 풀려야 한다.", "rd": "전기는 전하 운반자가 자유로워야 통한다. 고체는 이온이 묶여 안 통하고 녹으면 통한다.", "tf": "이온 결정은 언제 전기가 통하나? (녹았을 때)"}, "CH2-096": {"n": "이온 결정 성질", "c": "ch2", "u": "고체", "t": "C", "dx": "이온 결정이 외력에 층이 밀리면 같은 전하 이온이 마주쳐 반발해 쪼개지는(취성) 성질을 놓친 경우다. 단단하지만 잘 부서지는 이 이중성이 약하면 이온 결정 물성을 설명하지 못한다.", "fx": "이온 결정을 '단단하지만 층이 밀리면 같은 전하가 마주쳐 반발해 쪼개짐(취성)'으로 두 성질을 함께 잡는다. 단단함과 부서짐을 한 그림으로 새겨라.", "f": "B3", "rk": 305, "d": 3, "rh": 0, "pre": ["CH2-093"], "tr": "이온 결정이 단단하니 안 깨질 것 같은데, 층이 밀려 같은 전하가 만나 쪼개진다(취성)는 게 의외다.", "an": "망치로 치면 층이 밀려 같은 전하가 만나 쪼개진다: 단단해도 깨진다.", "rd": "층이 밀려 같은 전하가 만나면 강하게 반발한다. 그래서 단단해도 깨진다.", "tf": "이온 결정이 충격에 깨지는 이유는? (같은 전하 반발)"}, "CH2-097": {"n": "분자 결정", "c": "ch2", "u": "고체", "t": "C", "dx": "분자 결정이 분자들이 약한 분자 간 힘으로 모인 고체라는 점을 놓친 경우다. 끊기는 게 결합이 아니라 분자 간 힘이라는 점이 약하면 낮은 녹는점의 까닭을 못 짚는다.", "fx": "분자 결정을 '분자들이 약한 분자 간 힘으로 모인 고체'로 못 박는다. 끊기는 게 결합이 아니라 분자 간 힘임을 잡아 낮은 녹는점의 까닭을 짚어라.", "f": "B2", "rk": 179, "d": 2, "rh": 3, "pre": ["CH2-091", "CH2-001"], "tr": "분자 결정이 막연해, 분자들이 약한 분자 간 힘으로 모인 고체라는 게 빠진다.", "an": "분자들이 약한 분자 간 힘으로 모인 고체다.", "rd": "분자들이 약한 분자 간 힘으로 모인 고체다.", "tf": "약한 분자 간 힘으로 모인 고체는? (분자 결정)"}, "CH2-098": {"n": "분자 결정 녹는점", "c": "ch2", "u": "고체", "t": "B", "dx": "분자 결정이 분자 간 힘이 약해 녹는점이 낮다는 점을 놓친 경우다. 약한 힘이 낮은 녹는점으로 이어진다는 연결이 약하면 결정 유형별 비교가 어긋난다.", "fx": "'분자 결정은 분자 간 힘이 약해 녹는점이 낮음'을 못 박는다. 약한 힘이 낮은 녹는점으로 이어짐을 결정 유형별 비교에 써라.", "f": "B3", "rk": 306, "d": 3, "rh": 1, "pre": ["CH2-097"], "tr": "분자 결정 녹는점이 막연해, 분자 간 힘이 약해 낮다는 게 빠진다.", "an": "분자 간 힘이 약해 녹는점이 낮다.", "rd": "분자 간 힘이 약해 끊기 쉽다. 그래서 녹는점이 낮다.", "tf": "분자 결정의 녹는점은? (낮음)"}, "CH2-099": {"n": "분자 결정 예", "c": "ch2", "u": "고체", "t": "C", "dx": "드라이아이스(CO₂)·얼음·아이오딘처럼 분자로 이뤄진 고체가 분자 결정이라는 점을 놓친 경우다. 예를 이온·공유 결정과 혼동하면 결정 유형 분류가 어긋난다.", "fx": "'드라이아이스(CO₂)·얼음·아이오딘처럼 분자로 이뤄진 고체가 분자 결정'임을 못 박는다. 예를 이온·공유 결정과 혼동하지 말고 분류하라.", "f": "B2", "rk": 307, "d": 3, "rh": 0, "pre": ["CH2-097"], "tr": "어떤 게 분자 결정인지 막연해, 드라이아이스·얼음·아이오딘이라는 게 빠진다.", "an": "드라이아이스·얼음·아이오딘이다.", "rd": "드라이아이스·얼음·아이오딘이 분자 결정이다.", "tf": "드라이아이스는 무슨 결정? (분자)"}, "CH2-100": {"n": "공유 결정", "c": "ch2", "u": "고체", "t": "C", "dx": "공유 결정이 원자들이 그물처럼 연속으로 공유 결합한 고체라 독립 분자가 없다는 점을 놓친 경우다. 연속 결합 구조가 약하면 매우 높은 녹는점의 까닭을 못 짚는다.", "fx": "공유 결정을 '원자들이 그물처럼 연속으로 공유 결합한 고체라 독립 분자가 없음'으로 못 박는다. 연속 결합 구조로 매우 높은 녹는점의 까닭을 짚어라.", "f": "B2", "rk": 180, "d": 2, "rh": 7, "pre": ["CH2-091"], "tr": "공유  "위치가 밀려도 자유 전자가 결합을 유지한다. 그래서 펴진다(전성·연성).", "tf": "금속을 두드리면 펴지는 이유는? (자유 전자가 결합 유지)"}, "CH2-109": {"n": "녹는점 비교", "c": "ch2", "u": "고체", "t": "C", "dx": "결정 유형별 녹는점을 끊어야 하는 힘의 세기로 비교하지 못한 경우다(공유·이온 결정은 높고 분자 결정은 낮음). 무엇을 끊는지에 따라 녹는점이 갈린다는 점이 약하면 결정 비교가 어긋난다.", "fx": "결정 유형별 녹는점을 '끊어야 하는 힘의 세기'로 비교한다(공유·이온은 높고 분자는 낮음). 무엇을 끊는지에 따라 녹는점이 갈림을 잡아 비교하라.", "f": "C1", "rk": 470, "d": 4, "rh": 0, "pre": ["CH2-094", "CH2-098", "CH2-101"], "tr": "결정 녹는점을 한눈에 비교 못할 것 같아, 끊어야 하는 힘 세기로 비교한다(공유·이온 높고 분자 낮음)는 게 빠진다.", "an": "끊어야 하는 힘 세기로 비교: 공유·이온 높고 분자 낮다.", "rd": "끊어야 하는 힘이 셀수록 녹는점이 높다. 공유·이온은 높고 분자는 낮다.", "tf": "공유·이온·분자 결정 중 녹는점이 가장 낮은 건? (분자)"}, "CH2-110": {"n": "단위 세포", "c": "ch2", "u": "고체", "t": "C", "dx": "단위 세포가 결정의 규칙적 배열을 이루는 최소 반복 단위라는 점을 놓친 경우다. 반복 단위라는 개념이 약하면 단위 세포 속 입자 수·결정 구조 계산이 어긋난다.", "fx": "단위 세포를 '결정의 규칙적 배열을 이루는 최소 반복 단위'로 못 박는다. 반복 단위 개념으로 단위 세포 속 입자 수·결정 구조를 계산하라.", "f": "B2", "rk": 182, "d": 2, "rh": 0, "pre": ["CH2-091"], "tr": "단위 세포가 막연해, 규칙적 배열을 이루는 최소 반복 단위라는 게 빠진다.", "an": "규칙적 배열을 이루는 최소 반복 단위다.", "rd": "규칙적 배열의 최소 반복 단위다.", "tf": "규칙적 배열의 최소 반복 단위는? (단위 세포)"}, "CH2-111": {"n": "흑연 구조", "c": "ch2", "u": "고체", "t": "C", "dx": "흑연이 탄소가 평면 층으로 공유 결합하고 층 사이는 약한 힘으로 묶여(잘 미끄러짐) 남은 전자가 자유로운 구조라는 점을 놓친 경우다. 이 층 구조가 약하면 흑연의 윤활성·전도성을 함께 설명하지 못한다.", "fx": "흑연을 '탄소가 평면 층으로 공유 결합하고 층 사이는 약한 힘으로 묶여(잘 미끄러짐) 남은 전자가 자유로운 구조'로 못 박는다. 이 층 구조로 흑연의 윤활성·전도성을 함께 설명하라.", "f": "B2", "rk": 617, "d": 5, "rh": 0, "pre": ["CH2-104"], "tr": "흑연 구조가 막연해, 평면 층은 공유 결합·층 사이는 약한 힘이라 미끄러지고 남은 전자가 자유롭다는 게 빠진다.", "an": "평면 층은 공유 결합·층 사이는 약한 힘이라 미끄러지고 남은 전자가 자유롭다.", "rd": "평면 층은 공유 결합, 층 사이는 약한 힘이다. 그래서 미끄럽고 남은 전자가 자유롭다.", "tf": "흑연이 미끄러운 이유는? (층 사이가 약한 힘)"}, "CH2-195": {"n": "자발성 방향", "c": "ch2", "u": "자발성", "t": "C", "dx": "반응의 자발성이 계와 주위를 합한 전체 엔트로피가 증가하는 방향으로 정해진다는 점을 놓친 경우다(열역학 제2법칙). 전체 엔트로피 기준이 약하면 깁스 자유 에너지로 넘어가는 논리를 못 짚는다.", "fx": "자발성을 '계와 주위를 합한 전체 엔트로피가 증가하는 방향(열역학 제2법칙)'으로 못 박는다. 전체 엔트로피 기준을 잡아 깁스 자유 에너지로 넘어가는 논리로 이어라.", "f": "A1", "rk": 189, "d": 2, "rh": 2, "pre": ["CH2-194", "CH2-171"], "tr": "자발성이 막연해, 계+주위 전체 엔트로피가 증가하는 방향이라는(제2법칙) 게 빠진다.", "an": "자발성은 계+주위 전체 엔트로피가 증가하는 방향(제2법칙)이다.", "rd": "자발 과정은 우주 전체 엔트로피를 늘린다. 그것이 제2법칙이다.", "tf": "자발 과정은 우주 엔트로피를? (증가)"}, "CH2-196": {"n": "열역학 제2법칙", "c": "ch2", "u": "자발성", "t": "C", "dx": "열역학 제2법칙이 자발적 변화에서 우주 전체의 엔트로피가 항상 증가한다는 법칙이라는 점을 놓친 경우다. 이 법칙이 약하면 자발성의 근본 기준을 못 잡는다.", "fx": "열역학 제2법칙을 '자발적 변화에서 우주 전체의 엔트로피가 항상 증가'로 못 박는다. 이 법칙을 자발성의 근본 기준으로 삼아라.", "f": "A1", "rk": 326, "d": 3, "rh": 0, "pre": ["CH2-195"], "tr": "제2법칙이 막연해, 자발적 변화서 우주 전체 엔트로피가 항상 증가한다는 게 빠진다.", "an": "자발적 변화에서 우주 전체 엔트로피가 항상 증가한다.", "rd": "자발적 변화에서 계+주위 엔트로피가 항상 는다.", "tf": "자발적 변화에서 전체 엔트로피는? (증가)"}, "CH2-197": {"n": "깁스 자유 에너지", "c": "ch2", "u": "자발성", "t": "C", "dx": "깁스 자유 에너지가 엔탈피와 엔트로피를 한데 묶어 자발성을 판단하는 양이라는 점을 놓친 경우다. 두 요인을 하나로 합친다는 점이 약하면 ΔG 식의 의미를 못 짚는다.", "fx": "깁스 자유 에너지를 '엔탈피와 엔트로피를 한데 묶어 자발성을 판단하는 양'으로 못 박는다. 두 요인을 하나로 합침을 잡아 ΔG 식의 의미를 짚어라.", "f": "B2", "rk": 190, "d": 2, "rh": 21, "pre": ["CH2-172", "CH2-189"], "tr": "깁스 에너지가 막연해, 엔탈피와 엔트로피를 묶어 자발성을 판단하는 양이라는 게 빠진다.", "an": "엔탈피와 엔트로피를 묶어 자발성을 판단하는 양이다.", "rd": "일정 온도·압력에서 자발성을 한 양으로 보려 G=H-TS를 쓴다.", "tf": "엔탈피와 엔트로피를 묶어 자발성을 보는 양은? (깁스 자유 에너지)"}, "CH2-198": {"n": "ΔG 식", "c": "ch2", "u": "자발성", "t": "A", "dx": "깁스 식 ΔG = ΔH − TΔS에서 T가 절대 온도이고 TΔS 항이 빠진다는 점을 놓친 경우다. 식의 꼴이나 켈빈 온도를 틀리면 자발성 판단이 통째로 어긋난다.", "fx": "깁스 식을 'ΔG = ΔH − TΔS, T는 절대 온도(TΔS 항이 빠짐)'로 못 박는다. 식의 꼴과 켈빈 온도를 맞춰 자발성을 판단하라.", "f": "D3", "rk": 327, "d": 3, "rh": 8, "pre": ["CH2-197"], "tr": "ΔG=ΔH-TΔS에서 부호·단위가 막막해, T가 절대 온도이고 TΔS를 뺀다는 게 빠진다.", "an": "ΔG=ΔH-TΔS, T는 절대 온도, TΔS를 뺀다.", "rd": "ΔG=ΔH-TΔS다. T는 절대 온도이고 무질서 항(TΔS)을 뺀다.", "tf": "ΔG=ΔH 빼기 무엇? (TΔS)"}, "CH2-199": {"n": "자발성 판단", "c": "ch2", "u": "자발성", "t": "B", "dx": "ΔG가 음수면 자발, 0이면 평형, 양수면 비자발이라는 판정 기준을 놓친 경우다. ΔG 부호가 자발성을 정한다는 점이 약하면 반응이 일어날지 가리지 못한다.", "fx": "'ΔG가 음수면 자발, 0이면 평형, 양수면 비자발'을 못 박는다. ΔG 부호가 자발성을 정함을 잡아 반응이 일어날지 가려라.", "f": "C2", "rk": 483, "d": 4, "rh": 3, "pre": ["CH2-198"], "tr": "ΔG 부호와 자발성이 헷갈려, 음수면 자발·0이면 평형·양수면 비자발이라는 게 흔들린다.", "an": "ΔG가 음이면 자발, 0이면 평형, 양이면 비자발이다.", "rd": "ΔG<0이면 전체 엔트로피가 느는 방향이라 자발, 0이면 평형이다.", "tf": "ΔG가 음이면? (자발)"}, "CH2-200": {"n": "부호 조합", "c": "ch2", "u": "자발성", "t": "C", "dx": "ΔH와 ΔS의 부호 조합에 따라 자발성이 갈린다는 점을 놓친 경우다(발열·엔트로피 증가면 항상 자발, 반대면 항상 비자발, 나머지는 온도에 좌우). 이 조합 분석이 약하면 온도에 따른 자발성 전환을 못 짚는다.", "fx": "'ΔH·ΔS 부호 조합으로 자발성이 갈림(발열·엔트로피 증가면 항상 자발, 반대면 항상 비자발, 나머지는 온도에 좌우)'을 못 박는다. 이 조합으로 온도에 따른 자발성 전환을 짚어라.", "f": "C2", "rk": 484, "d": 4, "rh": 0, "pre": ["CH2-198", "CH2-174", "CH2-194"], "tr": "ΔH·ΔS 조합이 막연해, 발열+엔트로피 증가면 항상 자발·반대면 항상 비자발·나머지는 온도에 좌우라는 게 빠진다.", "an": "발열+엔트로피 증가면 항상 자발, 반대면 항상 비자발, 나머지는 온도가 심판이다.", "rd": "ΔG=ΔH-TΔS의 부호를 따진다. 발열+엔트로피 증가면 항상 자발, 반대면 비자발, 나머지는 T가 가른다.", "tf": "발열이고 엔트로피 증가면? (항상 자발)"}, "CH2-201": {"n": "자발성 결정", "c": "ch2", "u": "자발성", "t": "C", "dx": "자발성이 엔탈피·엔트로피·온도 셋을 함께 봐야 정해진다는 점을 놓친 경우다. 한 가지만 보면 ΔG 부호를 잘못 잡아 자발성 판단이 어긋난다.", "fx": "자발성을 '엔탈피·엔트로피·온도 셋을 함께 봐야 정해짐'으로 못 박는다. 한 가지만 보지 말고 셋으로 ΔG 부호를 잡아라.", "f": "A4", "rk": 485, "d": 4, "rh": 0, "pre": ["CH2-198"], "tr": "자발성이 한 요인으로 정해질 것 같아, 엔탈피·엔트로피·온도를 함께 봐야 한다는 게 빠진다.", "an": "엔탈피·엔트로피·온도를 함께 봐야 한다.", "rd": "자발성은 엔탈피·엔트로피·온도를 함께 봐야 한다.", "tf": "자발성에 봐야 할 셋은? (엔탈피·엔트로피·온도)"}, "CH2-202": {"n": "발열과 자발성", "c": "ch2", "u": "자발성", "t": "A", "dx": "발열 반응이면 무조건 자발적이라고 본 경우다. 자발성은 ΔG = ΔH − TΔS로 정해져 엔트로피와 온도(TΔS 항)에도 좌우된다는 점을 놓치면 흡열인데 자발적인 반응을 설명하지 못한다.", "fx": "'발열 반응이라고 무조건 자발이 아님, 자발성은 ΔG = ΔH − TΔS로 엔트로피·온도(TΔS)에도 좌우'됨을 못 박는다. 흡열인데 자발적인 반응(엔트로피 증가)을 이로 설명하라.", "f": "D1", "rk": 624, "d": 5, "rh": 0, "pre": ["CH2-199", "CH2-174"], "tr": "발열이면 무조건 자발일 것 같아, ΔG가 최종 판정이라 발열만으로는 부족하다는 게 빠진다.", "an": "발열이라고 다 자발은 아니다: 최종 판정은 ΔG다.", "rd": "발열이어도 ΔS가 크게 음이면 ΔG가 양일 수 있다. 그래서 발열만으론 부족하다.", "tf": "발열이면 무조건 자발인가? (아니다: ΔG로)"}, "CH2-203": {"n": "온도와 자발성", "c": "ch2", "u": "자발성", "t": "C", "dx": "온도가 TΔS 항을 통해 ΔG를 바꿔, 어떤 온도를 경계로 자발성이 뒤바뀔 수 있다는 점을 놓친 경우다. 온도의 역할이 약하면 전환 온도 개념으로 이어지지 못한다.", "fx": "'온도가 TΔS 항을 통해 ΔG를 바꿔, 어떤 온도를 경계로 자발성이 뒤바뀜'을 못 박는다. 온도의 역할을 잡아 전환 온도 개념으로 이어라.", "f": "A1", "rk": 486, "d": 4, "rh": 1, "pre": ["CH2-198"], "tr": "온도가 자발성과 무관할 것 같아, TΔS를 통해 어떤 온도를 경계로 뒤바뀔 수 있다는 게 빠진다.", "an": "TΔS를 통해 어떤 온도를 경계로 자발성이 뒤바뀔 수 있다.", "rd": "TΔS의 T가 크면 엔트로피 항이 커진다. 그래서 어떤 온도를 경계로 자발성이 뒤바뀐다.", "tf": "온도로 자발성이 바뀔 수 있나? (있다)"}, "CH2-204": {"n": "ΔG 크기", "c": "ch2", "u": "자발성", "t": "C", "dx": "ΔG가 더 큰 음수일수록 더 자발적이라는 점을 놓친 경우다. ΔG 크기가 자발성의 정도를 나타낸다는 점이 약하면 두 반응의 자발성을 비교하지 못한다.", "fx": "'ΔG가 더 큰 음수일수록 더 자발적'임을 못 박는다. ΔG 크기가 자발성의 정도임을 잡아 두 반응의 자발성을 비교하라.", "f": "C1", "rk": 625, "d": 5, "rh": 0, "pre": ["CH2-199"], "tr": "ΔG 크기가 막연해, 더 큰 음수일수록 더 자발적이라는 게 빠진다.", "an": "더 큰 음수일수록 더 자발적이다.", "rd": "ΔG가 더 큰 음수일수록 더 자발적이다.", "tf": "ΔG가 더 큰 음수면? (더 자발적)"}, "CH2-207": {"n": "자발성과 속도", "c": "ch2", "u": "자발성", "t": "C", "dx": "자발성과 반응 속도를 같은 것으로 본 경우다. ΔG는 반응이 일어나는 방향만 알려줄 뿐 빠르기와는 무관하다는 점을 놓치면 자발적인데도 느린 반응(다이아몬드가 흑연으로 바뀌는 변화)을 설명하지 못한다.", "fx": "'자발성과 반응 속도는 다름, ΔG는 방향만 알려줄 뿐 빠르기와 무관'함을 못 박는다. 자발적인데도 느린 반응(다이아몬드가 흑연으로)을 이로 설명하라.", "f": "B2", "rk": 626, "d": 5, "rh": 0, "pre": ["CH2-199"], "tr": "자발이면 빠를 것 같아, 자발성과 반응 속도는 다르다는 게 빠진다.", "an": "자발이라고 빠른 건 아니다: 자발성과 속도는 별개다(다이아몬드).", "rd": "자발성은 방향, 속도는 빠르기다. 그래서 자발이어도 느릴 수 있다(다이아몬드).", "tf": "자발이면 빠른가? (아니다: 별개)"}, "CH2-208": {"n": "전환 온도", "c": "ch2", "u": "자발성", "t": "C", "dx": "전환 온도가 ΔG = 0이 되는 온도라 그 위아래로 자발성이 뒤바뀌는 경계라는 점을 놓친 경우다. 이 경계 온도가 약하면 언제부터 반응이 자발적이 되는지 못 구한다.", "fx": "전환 온도를 'ΔG = 0이 되는 온도라 그 위아래로 자발성이 뒤바뀌는 경계'로 못 박는다. ΔG=0으로 두고 언제부터 자발적이 되는지 구하라.", "f": "A1", "rk": 627, "d": 5, "rh": 0, "pre": ["CH2-203"], "tr": "전환 온도가 막연해, ΔG=0이 되는 온도라 그 위아래로 자발성이 뒤바뀌는 경계라는 게 빠진다.", "an": "ΔG=0이 되는 온도: 그 위아래로 자발성이 뒤바뀌는 경계다.", "rd": "ΔG=0이 되는 온도가 전환 온도다. 그 위아래로 자발성이 뒤바뀐다.", "tf": "ΔG=0이 되는 온도는? (전환 온도)"}, "CH2-296": {"n": "중화 반응", "c": "ch2", "u": "적정", "t": "C", "dx": "중화 반응이 산과 염기가 만나 염과 물을 만드는 반응이라는 점을 놓친 경우다. 생성물이 흐리면 적정에서 일어나는 반응을 잘못 잡는다.", "fx": "중화 반응을 '산과 염기가 만나 염과 물을 만드는 반응'으로 못 박는다. 생성물을 염과 물로 잡아 적정에서 일어나는 반응을 바로 잡아라.", "f": "B2", "rk": 208, "d": 2, "rh": 17, "pre": ["CH2-252"], "tr": "중화가 그냥 산+염기 같아, 염과 물을 만든다는 게 빠진다.", "an": "산+염기가 염과 물을 만든다.", "rd": "산의 H⁺와 염기의 OH⁻가 물을 만든다. 그때 염도 함께 생긴다.", "tf": "산+염기가 만드는 두 가지는? (염과 물)"}, "CH2-297": {"n": "알짜 이온 반응", "c": "ch2", "u": "적정", "t": "C", "dx": "중화의 알짜 이온 반응식이 H⁺ + OH⁻ → H₂O이고 구경꾼 이온은 빠진다는 점을 놓친 경우다. 참여 이온만 쓰는 규칙이 약하면 알짜식이 어긋난다.", "fx": "중화 알짜 이온식을 'H⁺ + OH⁻ → H₂O, 구경꾼 이온은 뺌'으로 못 박는다. 참여 이온만 쓰는 규칙으로 알짜식을 맞춰라.", "f": "B2", "rk": 356, "d": 3, "rh": 0, "pre": ["CH2-296"], "tr": "알짜식에 모든 이온을 넣을 것 같아, H⁺+OH⁻→H₂O이고 구경꾼은 뺀다는 게 빠진다.", "an": "알짜는 H⁺+OH⁻→H₂O, 구경꾼은 뺀다.", "rd": "실제 반응한 H⁺+OH⁻→H₂O만 알짜다. 구경꾼은 뺀다.", "tf": "중화의 알짜 반응은? (H⁺+OH⁻→H₂O)"}, "CH2-298": {"n": "중화열", "c": "ch2", "u": "적정", "t": "B", "dx": "중화 반응이 발열이라 열을 방출한다는 점을 놓친 경우다. 중화가 발열이라는 점이 약하면 적정 중 온도 변화나 중화열 문제를 못 짚는다.", "fx": "'중화 반응은 발열이라 열을 방출'함을 못 박는다. 중화가 발열임을 잡아 적정 중 온도 변화나 중화열 문제를 짚어라.", "f": "B2", "rk": 512, "d": 4, "rh": 0, "pre": ["CH2-296", "CH2-174"], "tr": "중화가 흡열일 것 같기도 해, 발열이라 열을 방출한다는 게 흔들린다.", "an": "중화는 발열이라 열을 방출한다.", "rd": "중화는 H⁺+OH⁻→H₂O로 안정해진다. 그래서 발열이다.", "tf": "중화는 발열인가 흡열인가? (발열)"}, "CH2-299": {"n": "중화 양적 관계", "c": "ch2", "u": "적정", "t": "C", "dx": "중화 양적 관계가 (산이 낸 H⁺ 몰수 = 염기가 낸 OH⁻ 몰수)이고 가수와 부피를 반영해야 한다는 점을 놓친 경우다. 가수를 빼먹으면 적정 계산이 어긋난다.", "fx": "중화 양적 관계를 '(산이 낸 H⁺ 몰수 = 염기가 낸 OH⁻ 몰수), 가수와 부피를 반영'으로 못 박는다. 가수를 빼먹지 말고 적정 계산을 하라.", "f": "D3", "rk": 357, "d": 3, "rh": 14, "pre": ["CH2-296"], "tr": "중화 양이 막연해, (산 H⁺ 몰수=염기 OH⁻ 몰수)이고 가수·부피를 반영한다는 게 빠진다.", "an": "산 H⁺ 몰수=염기 OH⁻ 몰수, 가수·부피를 반영한다.", "rd": "H⁺와 OH⁻가 1:1로 반응한다. 가수·부피를 반영해 몰수를 맞춘다.", "tf": "H⁺와 OH⁻는 몇 대 몇? (1:1)"}, "CH2-300": {"n": "적정 정의", "c": "ch2", "u": "적정", "t": "C", "dx": "적정이 농도를 아는 표준 용액으로 모르는 산·염기의 농도를 중화 양론으로 구하는 방법이라는 점을 놓친 경우다. 이 원리가 약하면 적정 실험의 목적을 잘못 잡는다.", "fx": "적정을 '농도를 아는 표준 용액으로 모르는 산·염기의 농도를 중화 양론으로 구하는 방법'으로 못 박는다. 이 원리로 적정 실험의 목적을 잡아라.", "f": "B2", "rk": 513, "d": 4, "rh": 0, "pre": ["CH2-299"], "tr": "적정이 막연해, 표준 용액으로 모르는 농도를 중화 양론으로 구하는 방법이라는 게 빠진다.", "an": "표준 용액으로 모르는 농도를 중화 양론으로 구하는 방법이다.", "rd": "농도 아는 표준 용액으로 미지 농도를 중화 양론으로 구한다.", "tf": "표준 용액으로 미지 농도를 구하는 건? (적정)"}, "CH2-301": {"n": "표준 용액", "c": "ch2", "u": "적정", "t": "C", "dx": "표준 용액이 농도를 정확히 아는 기준 용액이라는 점을 놓친 경우다. 기준이 되는 까닭이 약하면 적정에서 미지 농도를 못 구한다.", "fx": "표준 용액을 '농도를 정확히 아는 기준 용액'으로 못 박는다. 기준이 되는 까닭을 잡아 적정에서 미지 농도를 구하라.", "f": "D2", "rk": 96, "d": 1, "rh": 0, "pre": ["CH2-115"], "tr": "표준 용액이 막연해, 농도를 정확히 아는 기준 용액이라는 게 빠진다.", "an": "농도를 정확히 아는 기준 용액이다.", "rd": "농도를 정확히 아는 기준 용액이다.", "tf": "농도를 아는 기준 용액은? (표준 용액)"}, "CH2-302": {"n": "당량점", "c": "ch2", "u": "적정", "t": "C", "dx": "당량점이 산과 염기의 몰수(가수 반영)가 같아져 완전히 중화된 지점이라는 점을 놓친 경우다. 당량점의 정의가 약하면 적정 곡선에서 그 위치를 못 잡는다.", "fx": "당량점을 '산과 염기의 몰수(가수 반영)가 같아져 완전히 중화된 지점'으로 못 박는다. 당량점의 정의로 적정 곡선에서 그 위치를 잡아라.", "f": "B2", "rk": 514, "d": 4, "rh": 9, "pre": ["CH2-299"], "tr": "당량점이 막연해, 산·염기 몰수(가수 반영)가 같아져 완전히 중화된 지점이라는 게 빠진다.", "an": "산·염기 몰수(가수 반영)가 같아져 완전히 중화된 지점이다.", "rd": "산·염기 몰수(가수 반영)가 같아진 지점이 당량점이다.", "tf": "산·염기 몰수가 같아진 지점은? (당량점)"}, "CH2-303": {"n": "적정 곡선", "c": "ch2", "u": "적정", "t": "C", "dx": "적정 곡선이 가한 부피에 따른 pH 그래프이고 당량점 부근에서 pH가 급격히 도약한다는 점을 놓친 경우다. 곡선의 모양이 약하면 도약으로 당량점을 못 찾는다.", "fx": "적정 곡선을 '가한 부피에 따른 pH 그래프이고 당량점 부근에서 pH가 급격히 도약'으로 못 박는다. 곡선의 모양으로 도약에서 당량점을 찾아라.", "f": "B2", "rk": 637, "d": 5, "rh": 5, "pre": ["CH2-302", "CH2-272"], "tr": "적정 곡선이 막연해, 부피 대 pH 그래프이고 당량점 부근서 급격히 도약한다는 게 빠진다.", "an": "부피 대 pH 그래프: 당량점 부근서 급격히 도약한다.", "rd": "당량점 부근에서 적은 양에도 pH가 크게 변한다. 그래서 도약 그래프다.", "tf": "적정 곡선은 부피 대 무엇? (pH)"}, "CH2-304": {"n": "강산-강염기 당량점", "c": "ch2", "u": "적정", "t": "A", "dx": "강산-강염기 적정의 당량점이 생긴 염이 가수분해하지 않아 중성(pH 7)이라는 점을 놓친 경우다. 이 기준이 약하면 어떤 지시약을 골라야 하는지 판단이 어긋난다.", "fx": "'강산-강염기 적정의 당량점은 생긴 염이 가수분해하지 않아 중성(pH 7)'임을 못 박는다. 이 기준으로 어떤 지시약을 골라야 하는지 판단하라.", "f": "B2", "rk": 638, "d": 5, "rh": 0, "pre": ["CH2-302"], "tr": "당량점은 늘 중성일 것 같아, 강산-강염기는 염이 가수분해 안 해 중성(pH 7)이라는 게 빠진다.", "an": "염이 가수분해 안 해 중성(pH 7)이다.", "rd": "생긴 염이 가수분해 안 한다. 그래서 중성(pH 7)이다.", "tf": "강산-강염기 당량점의 액성은? (중성)"}, "CH2-305": {"n": "약산-강염기 당량점", "c": "ch2", "u": "적정", "t": "C", "dx": "약산-강염기 적정의 당량점이 약산의 짝염기가 가수분해해 염기성(pH > 7)이 된다는 점을 놓친 경우다. 이걸 놓치면 당량점을 중성으로 잘못 보고 지시약을 틀리게 고른다.", "fx": "'약산-강염기 적정의 당량점은 약산의 짝염기가 가수분해해 염기성(pH > 7)'임을 못 박는다. 당량점을 중성으로 잘못 보지 말고 지시약을 바로 골라라.", "f": "B3", "rk": 639, "d": 5, "rh": 0, "pre": ["CH2-302", "CH2-289"], "tr": "당량점은 중성일 것 같아, 약산-강염기는 짝염기 가수분해로 염기성(pH>7)이라는 게 빠진다.", "an": "짝염기 가수분해로 염기성(pH>7)이다.", "rd": "짝염기가 가수분해한다. 그래서 염기성(pH>7)이다.", "tf": "약산-강염기 당량점의 액성은? (염기성)"}, "CH2-306": {"n": "강산-약염기 당량점", "c": "ch2", "u": "적정", "t": "C", "dx": "강산-약염기 적정의 당량점이 약염기의 짝산이 가수분해해 산성(pH < 7)이 된다는 점을 놓친 경우다. 이걸 놓치면 당량점을 중성으로 잘못 보고 지시약을 틀리게 고른다.", "fx": "'강산-약염기 적정의 당량점은 약염기의 짝산이 가수분해해 산성(pH < 7)'임을 못 박는다. 당량점을 중성으로 잘못 보지 말고 지시약을 바로 골라라.", "f": "B3", "rk": 640, "d": 5, "rh": 0, "pre": ["CH2-302", "CH2-289"], "tr": "당량점은 중성일 것 같아, 강산-약염기는 짝산 가수분해로 산성(pH<7)이라는 게 빠진다.", "an": "짝산 가수분해로 산성(pH<7)이다.", "rd": "짝산이 가수분해한다. 그래서 산성(pH<7)이다.", "tf": "강산-약염기 당량점의 액성은? (산성)"}, "CH2-307": {"n": "pH 도약", "c": "ch2", "u": "적정", "t": "C", "dx": "당량점 부근에서 적은 양을 더해도 pH가 크게 도약한다는 점을 놓친 경우다. 이 급변 구간이 약하면 당량점을 정확히 짚지 못한다.", "fx": "'당량점 부근에서 적은 양을 더해도 pH가 크게 도약'함을 못 박는다. 이 급변 구간으로 당량점을 정확히 짚어라.", "f": "B2", "rk": 692, "d": 6, "rh": 0, "pre": ["CH2-303"], "tr": "당량점 부근 pH가 천천히 변할 것 같아, 적은 양에도 크게 도약한다는 게 빠진다.", "an": "당량점 부근은 적은 양에도 pH가 크게 도약한다.", "rd": "당량점 부근은 완충이 없어 적은 양에도 pH가 크게 도약한다.", "tf": "당량점 부근에서 pH는? (크게 도약)"}, "CH2-308": {"n": "지시약", "c": "ch2", "u": "적정", "t": "C", "dx": "지시약이 특정 pH 범위(변색 범위)에서 색이 변한다는 점을 놓친 경우다. 변색 범위가 있다는 점이 약하면 지시약 선택의 기준을 못 잡는다.", "fx": "지시약을 '특정 pH 범위(변색 범위)에서 색이 변함'으로 못 박는다. 변색 범위가 있음을 잡아 지시약 선택의 기준으로 삼아라.", "f": "B2", "rk": 358, "d": 3, "rh": 6, "pre": ["CH2-272"], "tr": "지시약이 막연해, 특정 pH 범위(변색 범위)서 색이 변한다는 게 빠진다.", "an": "특정 pH 범위(변색 범위)에서 색이 변한다.", "rd": "지시약은 특정 pH 범위에서 색이 변한다.", "tf": "특정 pH에서 색이 변하는 건? (지시약)"}, "CH2-309": {"n": "지시약 선택", "c": "ch2", "u": "적정", "t": "C", "dx": "지시약을 고를 때 그 변색 범위가 적정 곡선의 pH 도약 구간 안에 들어야 한다는 점을 놓친 경우다. 도약에 안 맞는 지시약을 쓰면 종말점이 당량점에서 벗어나 오차가 커진다.", "fx": "지시약을 고를 때 '변색 범위가 적정 곡선의 pH 도약 구간 안에 들어야' 함을 못 박는다. 도약에 안 맞는 지시약을 쓰면 종말점이 당량점에서 벗어나 오차가 커짐을 잡아라.", "f": "B2", "rk": 693, "d": 6, "rh": 1, "pre": ["CH2-308", "CH2-303"], "tr": "지시약을 아무거나 쓸 것 같아, 변색 범위가 도약 구간 안에 들어야 한다는 게 빠진다.", "an": "변색 범위가 도약 구간 안에 들어야 한다.", "rd": "변색이 도약 구간 안에서 일어나야 당량점을 짚는다.", "tf": "지시약 변색이 어디서 일어나야? (도약 구간)"}, "CH2-310": {"n": "페놀프탈레인", "c": "ch2", "u": "적정", "t": "C", "dx": "페놀프탈레인이 산성에서 무색, 염기성에서 분홍색이라는 점을 놓친 경우다. 변색 방향이 흐리면 색으로 액성·종말점을 잘못 읽는다.", "fx": "페놀프탈레인을 '산성에서 무색, 염기성에서 분홍색'으로 못 박는다. 변색 방향을 잡아 색으로 액성·종말점을 읽어라.", "f": "B2", "rk": 515, "d": 4, "rh": 1, "pre": ["CH2-308"], "tr": "페놀프탈레인 색이 막연해, 산성서 무색·염기성서 분홍색이라는 게 빠진다.", "an": "산성서 무색, 염기성서 분홍색이다.", "rd": "페놀프탈레인은 산성서 무색, 염기성서 분홍색이다.", "tf": "페놀프탈레인은 염기성에서 무슨 색? (분홍)"}, "CH2-311": {"n": "페놀프탈레인 범위", "c": "ch2", "u": "적정", "t": "C", "dx": "페놀프탈레인의 변색 범위가 약 pH 8-10(염기성 쪽)이라는 점을 놓친 경우다. 이 범위가 약하면 약산-강염기 적정처럼 당량점이 염기성인 경우에 맞는 지시약인지 못 가린다.", "fx": "페놀프탈레인의 변색 범위를 '약 pH 8-10(염기성 쪽)'으로 못 박는다. 이 범위로 약산-강염기 적정처럼 당량점이 염기성인 경우에 맞는 지시약인지 가려라.", "f": "D3", "rk": 641, "d": 5, "rh": 0, "pre": ["CH2-310"], "tr": "페놀프탈레인 범위가 막연해, 약 pH 8-10(염기성 쪽)이라는 게 빠진다.", "an": "약 pH 8-10(염기성 쪽)이다.", "rd": "변색 범위가 약 pH 8-10(염기성 쪽)이다.", "tf": "페놀프탈레인 변색 범위는? (약 pH 8-10)"}, "CH2-312": {"n": "메틸 오렌지 범위", "c": "ch2", "u": "적정", "t": "C", "dx": "메틸 오렌지의 변색 범위가 약 pH 3-4.5(산성 쪽)라는 점을 놓친 경우다. 이 범위가 약하면 강산-약염기 적정처럼 당량점이 산성인 경우에 맞는 지시약인지 못 가린다.", "fx": "메틸 오렌지의 변색 범위를 '약 pH 3-4.5(산성 쪽)'로 못 박는다. 이 범위로 강산-약염기 적정처럼 당량점이 산성인 경우에 맞는 지시약인지 가려라.", "f": "D3", "rk": 516, "d": 4, "rh": 0, "pre": ["CH2-308"], "tr": "메틸 오렌지 범위가 막연해, 약 pH 3-4(산성 쪽)라는 게 빠진다.", "an": "약 pH 3-4(산성 쪽)다.", "rd": "변색 범위가 약 pH 3-4(산성 쪽)다.", "tf": "메틸 오렌지 변색 범위는? (약 pH 3-4)"}, "CH2-313": {"n": "지시약 역할", "c": "ch2", "u": "적정", "t": "C", "dx": "지시약이 색 변화로 종말점을 알려 당량점을 찾게 해 준다는(농도를 직접 재는 게 아님) 점을 놓친 경우다. 지시약의 역할이 약하면 종말점과 당량점의 관계를 못 짚는다.", "fx": "지시약을 '색 변화로 종말점을 알려 당량점을 찾게 해 줌(농도를 직접 재는 게 아님)'으로 못 박는다. 지시약의 역할로 종말점과 당량점의 관계를 짚어라.", "f": "B2", "rk": 517, "d": 4, "rh": 0, "pre": ["CH2-308"], "tr": "지시약이 농도를 직접 잴 것 같아, 색으로 종말점을 알려 당량점을 찾게 한다는 게 빠진다.", "an": "색으로 종말점을 알려 당량점을 찾게 한다.", "rd": "지시약이 색으로 종말점을 알린다. 그래서 당량점을 찾게 한다.", "tf": "지시약이 알리는 것은? (종말점)"}, "CH2-314": {"n": "중화 부피", "c": "ch2", "u": "적정-d", "t": "C", "dx": "중화에 필요한 부피를 산·염기 몰수가 같아지는 조건으로 구한다는 점을 놓친 경우다. 몰수 일치라는 기준이 약하면 적정에 쓰인 부피를 못 구한다.", "fx": "중화에 필요한 부피를 '산·염기 몰수가 같아지는 조건'으로 구한다. 몰수 일치를 기준으로 적정에 쓰인 부피를 구하라.", "f": "D3", "rk": 518, "d": 4, "rh": 0, "pre": ["CH2-299"], "tr": "중화 부피가 막연해, 산·염기 몰수가 같아지는 조건으로 구한다는 게 빠진다.", "an": "산·염기 몰수가 같아지는 조건으로 구한다.", "rd": "산·염기 몰수가 같아지는 조건으로 부피를 구한다.", "tf": "중화 부피는 무엇이 같아지는 조건? (산·염기 몰수)"}, "CH2-315": {"n": "중화 양론", "c": "ch2", "u": "적정-d", "t": "C", "dx": "중화 양론이 H⁺ 몰수와 OH⁻ 몰수를 같게 맞추는 것이고 다가 산·염기는 가수를 반영해야 한다는 점을 놓친 경우다. 가수를 빼먹으면 중화량 계산이 어긋난다.", "fx": "중화 양론을 'H⁺ 몰수와 OH⁻ 몰수를 같게 맞춤, 다가 산·염기는 가수를 반영'으로 못 박는다. 가수를 빼먹지 말고 중화량을 계산하라.", "f": "D3", "rk": 519, "d": 4, "rh": 0, "pre": ["CH2-299"], "tr": "중화 양론이 막연해, H⁺·OH⁻ 몰수를 같게 맞추고 다가 산·염기는 가수를 반영한다는 게 빠진다.", "an": "H⁺·OH⁻ 몰수를 같게 맞추고 다가 산·염기는 가수를 반영한다.", "rd": "H⁺·OH⁻ 몰수를 같게 맞춘다. 다가 산·염기는 가수를 반영한다.", "tf": "다가 산·염기는 무엇을 반영? (가수)"}, "CH2-316": {"n": "완전 중화 조건", "c": "ch2", "u": "적정-d", "t": "C", "dx": "완전 중화가 산과 염기의 몰수가 같아 남는 것이 없는 상태라는 점을 놓친 경우다. 이 조건이 약하면 당량점을 잘못 잡는다.", "fx": "완전 중화를 '산과 염기의 몰수가 같아 남는 것이 없는 상태'로 못 박는다. 이 조건으로 당량점을 잡아라.", "f": "B2", "rk": 520, "d": 4, "rh": 0, "pre": ["CH2-299"], "tr": "완전 중화가 막연해, 산·염기 몰수가 같아 남는 게 없는 상태라는 게 빠진다.", "an": "산·염기 몰수가 같아 남는 게 없는 상태다.", "rd": "산·염기 몰수가 같아 남는 게 없는 상태다.", "tf": "남는 게 없는 상태는? (완전 중화)"}, "CH2-317": {"n": "당량점 위치", "c": "ch2", "u": "적정-d", "t": "C", "dx": "당량점이 적정 곡선에서 pH가 급변하는 도약 구간의 중간에 있다는 점을 놓친 경우다. 위치를 잘못 잡으면 당량점 pH와 지시약 선택이 어긋난다.", "fx": "당량점을 '적정 곡선에서 pH가 급변하는 도약 구간의 중간'으로 못 박는다. 위치를 바로 잡아 당량점 pH와 지시약 선택을 맞춰라.", "f": "B2", "rk": 694, "d": 6, "rh": 0, "pre": ["CH2-303"], "tr": "당량점 위치가 막연해, 적정 곡선서 pH 급변 도약 구간의 중간이라는 게 빠진다.", "an": "적정 곡선서 pH 급변 도약 구간의 중간이다.", "rd": "적정 곡선에서 pH 급변 도약 구간의 중간이 당량점이다.", "tf": "당량점은 도약 구간의? (중간)"}, "CH2-318": {"n": "완충 영역", "c": "ch2", "u": "적정-d", "t": "C", "dx": "적정 곡선에서 당량점 전, 약산과 짝염기가 함께 있는 완충 영역이 있어 pH가 천천히 변한다는 점을 놓친 경우다. 이 영역이 약하면 적정 곡선의 완만한 구간을 설명하지 못한다.", "fx": "'적정 곡선에서 당량점 전, 약산과 짝염기가 함께 있는 완충 영역이 있어 pH가 천천히 변함'을 못 박는다. 이 영역으로 적정 곡선의 완만한 구간을 설명하라.", "f": "B2", "rk": 695, "d": 6, "rh": 0, "pre": ["CH2-303", "CH2-285"], "tr": "당량점 전이 그냥 변할 것 같아, 약산·짝염기가 함께 있는 완충 영역이라 pH가 천천히 변한다는 게 빠진다.", "an": "당량점 전은 약산·짝염기가 함께라 완충 영역, pH가 천천히 변한다.", "rd": "당량점 전은 약산과 짝염기가 함께라 완충 영역이다. 그래서 pH가 천천히 변한다.", "tf": "당량점 전 약산·짝염기가 함께면? (완충 영역)"}, "CH2-319": {"n": "종말점과 당량점", "c": "ch2", "u": "적정-d", "t": "C", "dx": "종말점(지시약이 변하는 점)이 당량점과 가까워야 적정 오차가 작다는 점을 놓친 경우다. 둘의 차이가 크면 측정 농도가 어긋난다는 점이 약하면 지시약 선택의 중요성을 못 짚는다.", "fx": "'종말점(지시약이 변하는 점)이 당량점과 가까워야 적정 오차가 작음'을 못 박는다. 둘의 차이가 크면 측정 농도가 어긋남을 잡아 지시약 선택의 중요성을 짚어라.", "f": "B2", "rk": 732, "d": 7, "rh": 0, "pre": ["CH2-309", "CH2-302"], "tr": "종말점·당량점이 같을 것 같아, 둘이 가까워야 적정 오차가 작다는 게 빠진다.", "an": "종말점과 당량점이 가까워야 적정 오차가 작다.", "rd": "종말점과 당량점이 가까워야 적정 오차가 작다.", "tf": "적정 오차가 작으려면 종말점과 당량점이? (가까워야)"}, "GC-136": {"n": "브뢴스테드-라우리", "c": "gc", "u": "산염기평형-1", "t": "B", "dx": "브뢴스테드-라우리 정의에서 산은 양성자(H⁺)를 주고 염기는 받는다는 대응을 헷갈린 경우다. 전자를 주고받는 산화환원과 혼동한 점이 보인다.", "fx": "브뢴스테드-라우리를 '산은 양성자(H⁺)를 주고 염기는 받음'으로 못 박는다. 전자를 주고받는 산화환원과 혼동 말고 양성자 이동으로 보라.", "f": "B1", "rk": 33, "d": 0, "rh": 14, "pre": [], "tr": "산·염기가 그냥 성질 같아, 산은 H⁺를 주고 염기는 받는다는 주개·받개 대응이 흐려진다.", "an": "산은 H⁺를 주는 사람, 염기는 받는 사람: 양성자 주고받기다.", "rd": "브뢴스테드는 H⁺ 주고받음으로 정의한다. 주면 산, 받으면 염기다.", "tf": "H⁺를 받는 물질은 산인가 염기인가? (염기)"}, "GC-137": {"n": "짝산-짝염기", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "짝산·짝염기가 양성자 하나 차이로 이어지고(산이 H⁺를 잃으면 짝염기), 세기는 반대로 대응한다(강산의 짝염기는 약함)는 점을 놓친 경우다.", "fx": "짝산·짝염기를 '양성자 하나 차이로 이어지고(산이 H⁺를 잃으면 짝염기) 세기는 반대(강산의 짝염기는 약함)'로 못 박는다. 세기 반비례를 잡아라.", "f": "B1", "rk": 122, "d": 1, "rh": 5, "pre": ["GC-136"], "tr": "강산의 짝염기도 셀 것 같은데, 세기가 거꾸로 대응해 강산의 짝염기가 약하다는 게 역설처럼 느껴진다.", "an": "센 산일수록 그 짝염기는 약하다: 세게 던진 공일수록 되돌아올 힘이 약하다(반비례).", "rd": "산이 H⁺를 잘 내놓을수록(강산) 짝염기는 H⁺를 잘 안 붙든다(약염기). 그래서 세기가 반비례한다.", "tf": "강산의 짝염기는 센가 약한가? (약함)"}, "GC-138": {"n": "양쪽성", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "양쪽성 물질이 조건에 따라 산으로도 염기로도 작용한다는 점을 놓친 경우다. 물·HCO₃⁻처럼 양성자를 주기도 받기도 한다는 그림이 약하다.", "fx": "양쪽성 물질을 '조건에 따라 산으로도 염기로도 작용'으로 못 박는다. 물·HCO₃⁻처럼 양성자를 주기도 받기도 함을 그려라.", "f": "B2", "rk": 123, "d": 1, "rh": 0, "pre": ["GC-136"], "tr": "물질은 산이면 산, 염기면 염기일 것 같아, 조건에 따라 둘 다 되는 양쪽성이 예외처럼 다가온다.", "an": "물은 상황 따라 산도 염기도 되는 양손잡이: 상대에 따라 주거나 받는다.", "rd": "물은 상대에 따라 H⁺를 주기도 받기도 한다. 그래서 산도 염기도 된다.", "tf": "물이 산도 염기도 되는 이유는? (상대 따라 H⁺ 주고받음)"}, "GC-139": {"n": "pH·pOH 정의", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "pH = -log[H⁺], pOH = -log[OH⁻]라는 정의를 헷갈린 경우다. 음의 로그라는 부호와 두 정의의 대상이 뒤섞였다.", "fx": "pH·pOH를 'pH = -log[H⁺], pOH = -log[OH⁻]'로 못 박는다. 음의 로그라는 부호와 두 정의의 대상을 갈라라.", "f": "D3", "rk": 389, "d": 3, "rh": 4, "pre": ["GC-141"], "tr": "pH가 -log인지 log인지 헷갈려, pH=-log[H⁺]·pOH=-log[OH⁻]가 흔들린다.", "an": "pH=-log[H⁺]: 농도가 10배 진하면 pH는 1 내려간다.", "rd": "[H⁺]가 10의 거듭제곱으로 변하니 다루기 쉽게 -log를 취한다. pH=-log[H⁺]다.", "tf": "[H⁺]가 10배 커지면 pH는? (1 감소)"}, "GC-140": {"n": "pH+pOH", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "25°C에서 pH + pOH = 14가 물 이온곱에서 나온다는 점을 놓친 경우다. 이 14는 온도에 따라 변한다(물 이온곱이 온도 의존)는 점이 약하다.", "fx": "'25°C에서 pH + pOH = 14가 물 이온곱에서 나옴'을 못 박는다. 이 14는 온도에 따라 변함(물 이온곱이 온도 의존)을 잡아라.", "f": "D3", "rk": 555, "d": 4, "rh": 0, "pre": ["GC-139", "GC-141"], "tr": "pH+pOH=14가 그냥 외울 공식 같아, 물 이온곱에서 나온 결과라는 뿌리가 빠진다.", "an": "14는 외울 공식이 아니라 물 이온곱(10⁻¹⁴)에서 나온 결과: 뿌리가 있다.", "rd": "[H⁺][OH⁻]=10⁻¹⁴에 -log를 취하면 (-log[H⁺])+(-log[OH⁻])=14, 즉 pH+pOH=14다.", "tf": "pH 3이면 pOH는? (11)"}, "GC-141": {"n": "물 이온곱", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "물 이온곱이 [H⁺]와 [OH⁻]의 곱(25°C에서 10⁻¹⁴)이고 합이 아니라는 점을 놓친 경우다. 중성에서 각 농도가 10⁻⁷이라는 점이 흔들린다.", "fx": "물 이온곱을 '[H⁺]와 [OH⁻]의 곱(25°C에서 10⁻¹⁴), 합이 아님'으로 못 박는다. 중성에서 각 농도가 10⁻⁷임을 잡아라.", "f": "D3", "rk": 243, "d": 2, "rh": 6, "pre": ["GC-117"], "tr": "물 이온곱이 합일 것 같아, [H⁺]와 [OH⁻]의 \"곱\"(10⁻¹⁴)이라는 게 흐려진다.", "an": "[H⁺]와 [OH⁻]는 곱이 일정한 시소: 한쪽이 커지면 다른 쪽이 작아진다(곱 10⁻¹⁴).", "rd": "물 자동이온화 평형에서 [H⁺][OH⁻]=Kw=10⁻¹⁴(25℃)다. 합이 아니라 곱이 일정하다.", "tf": "[H⁺]가 커지면 [OH⁻]는? (작아짐: 곱 일정)"}, "GC-142": {"n": "중성 pH", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "중성이 [H⁺]=[OH⁻]인 상태라는 정의를 놓친 경우다. pH 7은 25°C에서만 중성이고, 물 이온곱이 온도에 의존해 중성 pH가 달라진다는 점이 약하다.", "fx": "중성을 '[H⁺]=[OH⁻]인 상태'로 못 박는다. pH 7은 25°C에서만 중성이고 물 이온곱이 온도에 의존해 중성 pH가 달라짐을 잡아라.", "f": "D2", "rk": 556, "d": 4, "rh": 1, "pre": ["GC-141", "GC-139"], "tr": "중성이 그냥 pH 7일 것 같아, [H⁺]=[OH⁻]가 정의이고 7은 25°C 조건이라는 게 빠진다.", "an": "중성은 [H⁺]=[OH⁻]인 균형점: 25°C에선 그게 pH 7이다.", "rd": "중성은 [H⁺]=[OH⁻]다. 물 이온곱에 넣으면 각 10⁻⁷, 25℃에서 pH 7이다.", "tf": "25℃ 중성의 [H⁺]는? (10⁻⁷)"}, "GC-143": {"n": "산성 pH", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "산성·염기성의 pH 기준을 헷갈린 경우다. 25°C에서 pH<7이 산성([H⁺]가 더 많음), pH>7이 염기성이라는 대응이 흔들린다.", "fx": "'25°C에서 pH<7이 산성([H⁺]가 더 많음), pH>7이 염기성'임을 못 박는다. pH 기준으로 액성을 가려라.", "f": "D2", "rk": 659, "d": 5, "rh": 0, "pre": ["GC-142"], "tr": "산성·염기성의 pH 경계가 헷갈려, 7 기준 대소가 흔들린다.", "an": "7을 기준으로 작으면 산성·크면 염기성: 저울 영점이 7이다.", "rd": "중성 pH 7을 기준으로 [H⁺]가 많으면 pH<7(산성), 적으면 pH>7(염기성)이다.", "tf": "pH 5는 산성인가 염기성인가? (산성)"}, "GC-144": {"n": "이온화 상수", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "산의 세기는 산 이온화 상수 Kₐ로, 염기의 세기는 염기 이온화 상수로 나타내며 온도에 의존한다는 점을 놓친 경우다.", "fx": "'산의 세기는 Kₐ로, 염기의 세기는 염기 이온화 상수로 나타내며 온도에 의존'함을 못 박는다. 세기를 이온화 상수로 정량화하라.", "f": "B2", "rk": 244, "d": 2, "rh": 8, "pre": ["GC-136", "GC-117"], "tr": "산의 세기가 농도 같아, Kₐ로 나타내며 온도에만 의존한다는 게 흐려진다.", "an": "산 세기는 Ka로 잰다: 농도가 아니라 얼마나 잘 이온화하나다.", "rd": "산 세기는 이온화 정도이고 Ka로 잰다. 평형 상수라 온도에만 의존한다.", "tf": "산 세기를 정하는 건 농도인가 Ka인가? (Ka)"}, "GC-145": {"n": "Ka와 세기", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "Kₐ가 클수록 더 많이 이온화하는 강한 산이라는 대응을 놓친 경우다. Kₐ가 작으면 약산(이온화가 덜 됨)이라는 방향이 흔들린다.", "fx": "'Kₐ가 클수록 더 많이 이온화하는 강한 산, 작으면 약산(이온화 덜 됨)'임을 못 박는다. Kₐ 크기로 산 세기를 가려라.", "f": "C1", "rk": 390, "d": 3, "rh": 6, "pre": ["GC-144"], "tr": "Kₐ가 크면 약한 산일 것 같기도 해, 클수록 많이 이온화하는 강한 산이라는 대응이 흔들린다.", "an": "Ka가 클수록 많이 이온화한 강한 산: 작으면 약한 산이다.", "rd": "Ka는 이온화 평형 상수다. 크면 평형이 이온 쪽이라 많이 이온화한 강한 산이다.", "tf": "Ka가 큰 산은 센가 약한가? (셈)"}, "GC-146": {"n": "강산 pH", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "강산이 물에서 거의 완전히 이온화한다는 점을 놓친 경우다. 부분 이온화는 약산이라는 구분이 흔들려 강산 pH 계산이 막힌다.", "fx": "강산을 '물에서 거의 완전히 이온화'로 못 박는다. 부분 이온화는 약산임을 갈라 강산 pH를 계산하라.", "f": "B2", "rk": 557, "d": 4, "rh": 0, "pre": ["GC-145"], "tr": "강산도 일부만 이온화할 것 같아, 거의 완전히 이온화한다는 게 안 잡힌다.", "an": "강산은 물에서 거의 다 쪼개진다: 던지면 거의 전부 풀리는 매듭이다.", "rd": "강산은 Ka가 매우 커 평형이 이온 쪽에 치우친다. 그래서 거의 완전히 이온화한다.", "tf": "강산은 물에서 얼마나 이온화? (거의 완전)"}, "GC-147": {"n": "약산 근사", "c": "gc", "u": "산염기평형-1", "t": "C", "dx": "약산이 일부만 이온화해 평형을 이룬다는 점, 그래서 근사(이온화 적음)를 쓴다는 점을 놓친 경우다. 완전 이온화는 강산이라는 구분이 약하다.", "fx": "약산을 '일부만 이온화해 평형을 이루고, 그래서 이온화 적음 근사를 씀'으로 못 박는다. 완전 이온화는 강산임을 갈라라.", "f": "D2", "rk": 558, "d": 4, "rh": 3, "pre": ["GC-145"], "tr": "약산도 다 이온화한 양으로 계산할 것 같아, 일부만 이온화해 평형이라 근사를 쓴다는 게 빠진다.", "an": "약산은 일부만 쪼개져 평형: 대부분 분자로 남아 근사를 쓴다.", "rd": "약산은 Ka가 작아 일부만 이온화하고 평형을 이룬다. 그래서 근사 계산을 쓴다.", "tf": "약산은 물에서 얼마나 이온화? (일부)"}, "GC-148": {"n": "Ka·Kb 관계", "c": "gc", "u": "산염기평형-2", "t": "A", "dx": "짝산·짝염기의 이온화 상수 곱이 물 이온곱(=[H⁺][OH⁻])으로 일정하다는 관계(Kₐ × 짝염기 상수 = 물 이온곱)를 놓친 경우다. 합이 14인 것과 혼동했다.", "fx": "'짝산·짝염기의 이온화 상수 곱이 물 이온곱(=[H⁺][OH⁻])으로 일정(Kₐ × 짝염기 상수 = 물 이온곱)'임을 못 박는다. 합이 14인 것과 혼동 말고 곱으로 잡아라.", "f": "D3", "rk": 391, "d": 3, "rh": 0, "pre": ["GC-144", "GC-141"], "tr": "Kₐ와 짝염기 상수가 따로 놀 것 같아, 둘의 곱이 물 이온곱으로 일정하다는 관계가 안 잡힌다.", "an": "산의 Ka와 짝염기 Kb는 곱이 물 이온곱(Kw): 짝으로 묶여 있다.", "rd": "짝산-짝염기에서 Ka×Kb=Kw다. 한쪽이 크면 다른 쪽이 작다.", "tf": "Ka와 짝염기 Kb의 곱은? (Kw)"}, "GC-149": {"n": "pKa", "c": "gc", "u": "산염기평형-2", "t": "C", "dx": "pKₐ = -log Kₐ라 강산일수록 pKₐ가 작다는 대응을 놓친 경우다. 음의 로그라는 부호 때문에 Kₐ와 pKₐ의 크기 방향이 반대라는 점이 흔들린다.", "fx": "pKₐ를 'pKₐ = -log Kₐ라 강산일수록 pKₐ가 작음'으로 못 박는다. 음의 로그라 Kₐ와 pKₐ의 크기 방향이 반대임을 잡아라.", "f": "A1", "rk": 559, "d": 4, "rh": 1, "pre": ["GC-145"], "tr": "pKₐ가 크면 센 산일 것 같아, -log라 작을수록 강하다는 역방향이 흔들린다.", "an": "pKa는 작을수록 센 산: -log라 Ka가 크면 pKa는 작다(역방향).", "rd": "pKa=-log Ka다. Ka가 크면(강산) pKa가 작아 역방향이다.", "tf": "pKa가 작은 산은 센가 약한가? (셈)"}, "GC-150": {"n": "완충 용액", "c": "gc", "u": "산염기평형-2", "t": "C", "dx": "완충 용액이 약산과 그 짝염기(또는 약염기와 짝산)가 함께 있어야 만들어진다는 점을 놓친 경우다. 강산·강염기만으로는 완충이 안 된다는 점이 약하다.", "fx": "완충 용액을 '약산과 그 짝염기(또는 약염기와 짝산)가 함께 있어야 만들어짐'으로 못 박는다. 강산·강염기만으로는 완충이 안 됨을 잡아라.", "f": "B2", "rk": 660, "d": 5, "rh": 2, "pre": ["GC-137", "GC-147"], "tr": "완충이 그냥 약산만 있으면 될 것 같아, 약산과 그 짝염기가 함께 있어야 한다는 조건이 빠진다.", "an": "완충은 약산+짝염기 짝꿍: 둘이 함께 있어야 작동한다.", "rd": "가해진 산·염기를 둘 다 중화하려면 약산과 짝염기가 함께 있어야 한다.", "tf": "완충에 필요한 두 가지는? (약산과 짝염기)"}, "GC-151": {"n": "완충 작용", "c": "gc", "u": "산염기평형-2", "t": "C", "dx": "완충이 외부에서 들어온 H⁺를 짝염기가, OH⁻를 약산이 흡수해 pH 변화를 줄인다는 메커니즘을 놓친 경우다. 완충 능력에 한계가 있다는 점도 약하다.", "fx": "완충 작용을 '외부에서 들어온 H⁺를 짝염기가, OH⁻를 약산이 흡수해 pH 변화를 줄임'으로 못 박는다. 완충 능력에 한계가 있음도 잡아라.", "f": "B3", "rk": 704, "d": 6, "rh": 0, "pre": ["GC-150"], "tr": "완충이 어떻게 pH를 지키는지 막막해, 짝염기가 H⁺를·약산이 OH⁻를 흡수한다는 메커니즘이 빠진다.", "an": "산이 들어오면 짝염기가, 염기가 들어오면 약산이 받아낸다: 양쪽 충격 흡수기다.", "rd": "산이 들어오면 짝염기가, 염기가 들어오면 약산이 반응해 흡수한다. 그래서 pH가 거의 안 변한다.", "tf": "완충에 산을 넣으면 무엇이 받나? (짝염기)"}, "GC-152": {"n": "헨더슨-하셀바흐", "c": "gc", "u": "산염기평형-2", "t": "C", "dx": "헨더슨-하셀바흐 식에서 pH = pKₐ + log([짝염기]/[산])이라는 구조를 헷갈린 경우다. 기준이 7이 아니라 pKₐ이고 분자·분모(짝염기/산)가 뒤바뀌기 쉽다.", "fx": "헨더슨-하셀바흐를 'pH = pKₐ + log([짝염기]/[산])'로 못 박는다. 기준이 7이 아니라 pKₐ임을 잡고 분자·분모(짝염기/산)를 뒤바꾸지 마라.", "f": "D3", "rk": 705, "d": 6, "rh": 0, "pre": ["GC-150", "GC-149"], "tr": "헨더슨-하셀바흐 식 형태가 헷갈려, pH=pKₐ+log([짝염기]/[산]) 구조가 흔들린다.", "an": "pH=pKa+log([짝염기]/[산]): 둘이 같으면 log 1=0이라 pH=pKa다.", "rd": "Ka 식 [H⁺]=Ka[산]/[짝염기]에 -log를 취하면 pH=pKa+log([짝염기]/[산])이다.", "tf": "[짝염기]=[산]이면 pH는? (pKa)"}, "GC-154": {"n": "염 가수분해", "c": "gc", "u": "산염기평형-2", "t": "A", "dx": "염을 이루는 이온의 가수분해로 액성이 갈린다는 점을 놓친 경우다. 아세트산 이온은 가수분해해 염기성, NH₄⁺는 가수분해해 산성이 된다는 대응이 흔들린다.", "fx": "'염을 이루는 이온의 가수분해로 액성이 갈림'을 못 박는다. 아세트산 이온은 가수분해해 염기성, NH₄⁺는 가수분해해 산성이 됨을 잡아라.", "f": "B3", "rk": 245, "d": 2, "rh": 1, "pre": ["GC-137"], "tr": "염은 중성일 것 같아, 이온의 가수분해로 액성이 갈린다는 게 빠진다.", "an": "염도 그 부모(약산·약염기)를 닮아 액성이 갈린다: 늘 중성이 아니다.", "rd": "약산·약염기에서 온 이온은 물과 반응해 H⁺나 OH⁻를 낸다. 그래서 염도 액성이 갈린다.", "tf": "약산에서 온 염은 액성이? (염기성 쪽)"}, "GC-155": {"n": "중화 반응", "c": "gc", "u": "산염기평형-2", "t": "C", "dx": "중화 반응의 알짜 변화가 H⁺ + OH⁻ → H₂O이고 산+염기 → 염+물이라는 틀을 놓친 경우다.", "fx": "중화 반응을 '알짜 변화가 H⁺ + OH⁻ → H₂O, 산+염기 → 염+물'로 못 박는다. 이 틀로 중화 반응식을 잡아라.", "f": "B2", "rk": 124, "d": 1, "rh": 1, "pre": ["GC-136"], "tr": "중화가 그냥 산+염기 같아, 알짜가 H⁺+OH⁻→H₂O이고 산+염기→염+물이라는 틀이 흐려진다.", "an": "중화의 핵심은 H⁺+OH⁻→H₂O: 산+염기가 만나 염과 물이 된다.", "rd": "산의 H⁺와 염기의 OH⁻가 만나 물이 된다. 알짜는 H⁺+OH⁻→H₂O이고 염도 함께 생긴다.", "tf": "중화의 알짜 반응은? (H⁺+OH⁻→H₂O)"}, "GC-156": {"n": "적정 곡선", "c": "gc", "u": "산염기평형-2", "t": "C", "dx": "적정 당량점의 액성이 생성된 염의 가수분해로 정해진다는 점을 놓친 경우다. 약산+강염기 적정은 짝염기 가수분해로 당량점이 염기성이 된다는 대응이 흔들린다.", "fx": "'적정 당량점의 액성은 생성된 염의 가수분해로 정해짐'을 못 박는다. 약산+강염기 적정은 짝염기 가수분해로 당량점이 염기성이 됨을 잡아라.", "f": "B3", "rk": 392, "d": 3, "rh": 0, "pre": ["GC-155", "GC-154"], "tr": "당량점은 늘 중성일 것 같아, 생성된 염의 가수분해로 액성이 정해진다는 게 빠진다.", "an": "당량점이 늘 중성은 아니다: 생긴 염이 부모를 닮아 산성·염기성이 될 수 있다.", "rd": "당량점에 남는 염이 가수분해하면 액성이 변한다. 그래서 늘 중성은 아니다.", "tf": "강산-약염기 당량점의 액성은? (산성)"}, "GC-157": {"n": "pH 정의", "c": "gc", "u": "산염기평형-2", "t": "C", "dx": "pH가 [H⁺] 기준의 음의 로그이고 [OH⁻] 기준은 pOH라는 구분을 놓친 경우다. 정비례가 아니라 로그 관계라는 점이 약하다.", "fx": "pH를 '[H⁺] 기준의 음의 로그이고 [OH⁻] 기준은 pOH'로 못 박는다. 정비례가 아니라 로그 관계임을 잡아라.", "f": "B2", "rk": 560, "d": 4, "rh": 0, "pre": ["GC-139"], "tr": "pH와 pOH 기준이 헷갈려, pH가 [H⁺]·pOH가 [OH⁻] 기준이라는 구분이 흔들린다.", "an": "pH는 [H⁺] 잣대, pOH는 [OH⁻] 잣대: 무엇을 재는지 다르다.", "rd": "pH는 [H⁺], pOH는 [OH⁻]에 -log다. 무엇을 기준 삼느냐만 다르다.", "tf": "pOH는 무엇의 -log? ([OH⁻])"}, "GC-011": {"n": "원자 구성", "c": "gc", "u": "원자", "t": "C", "dx": "원자의 구성 입자 배치를 헷갈린 경우다. 전자는 핵 바깥, 질량은 핵(양성자·중성자)에 거의 다 있다는 그림이 흐리다.", "fx": "원자 구성을 '전자는 핵 바깥, 질량은 핵(양성자·중성자)에 거의 다'로 못 박는다. 이 배치로 질량과 전하가 어디에 있는지 그려라.", "f": "B2", "rk": 25, "d": 0, "rh": 97, "pre": [], "tr": "원자를 떠올리면 입자 셋이 한데 모인 덩어리로 그려져, 핵 안과 밖이라는 공간 구분이 흐려진다.", "an": "원자는 경기장: 한가운데 작고 무거운 핵(공)이 있고, 텅 빈 관중석을 전자가 돈다.", "rd": "무거운 양성자·중성자는 가운데 핵에 뭉치고 가벼운 전자는 둘레를 차지한다. 그래서 핵 안과 핵 밖으로 갈린다.", "tf": "원자 질량의 대부분은 어디에 있나? (핵: 양성자·중성자가 무거움)"}, "GC-012": {"n": "원자 번호", "c": "gc", "u": "원자", "t": "B", "dx": "원자번호=양성자 수라는 정의와 질량수(양성자+중성자)를 섞은 경우다. 원자번호가 원소를 결정한다는 점이 빠지면 동위원소에서 막힌다.", "fx": "원자번호를 '양성자 수(원소를 결정), 질량수(양성자+중성자)와 별개'로 못 박는다. 원자번호가 원소 정체임을 잡아 동위원소를 다뤄라.", "f": "B2", "rk": 107, "d": 1, "rh": 22, "pre": ["GC-011"], "tr": "\"번호\"가 순서이자 크기처럼 들려, 원자번호가 질량과도 얽혀 있을 것 같다.", "an": "원자번호는 원소의 주민등록번호: 양성자 수가 곧 그 원소의 정체이고, 무게(질량수)와는 별개다.", "rd": "화학적 정체는 전자 수, 중성 원자의 전자 수는 양성자 수가 정한다. 그래서 양성자 수를 원자번호로 삼았다.", "tf": "양성자 6개면 무조건 탄소인가? (그렇다: 양성자 수가 원소를 정함)"}, "GC-013": {"n": "질량수", "c": "gc", "u": "원자", "t": "A", "dx": "질량수에 전자를 포함하거나 중성자를 빠뜨린 경우다. 질량수=양성자+중성자(전자 제외)라는 셈이 흔들린다.", "fx": "질량수를 '양성자 + 중성자(전자 제외)'로 못 박는다. 전자를 넣거나 중성자를 빼지 말고 두 핵 입자만 더하라.", "f": "D3", "rk": 223, "d": 2, "rh": 21, "pre": ["GC-011", "GC-012"], "tr": "질량을 말하니 무게 있는 건 다 더해야 할 것 같아, 가벼운 전자도 끼워 넣고 싶어진다.", "an": "질량수는 핵 안 알맹이 수: 양성자+중성자만 세고, 깃털처럼 가벼운 전자는 무게 셈에서 뺀다.", "rd": "질량은 거의 전부 핵에 있다. 핵 알맹이는 양성자와 중성자뿐이라 질량수=양성자+중성자, 전자는 무시한다.", "tf": "전자 수를 알면 질량수를 구할 수 있나? (없다: 질량수는 양성자+중성자)"}, "GC-014": {"n": "동위원소", "c": "gc", "u": "원자", "t": "B", "dx": "동위원소를 양성자 수가 다른 것으로 오해하거나, 질량수만 다를 뿐 전자 배치·화학적 성질은 같다는 점을 놓친 경우다.", "fx": "동위원소를 '양성자 수는 같고 질량수(중성자)만 다름, 전자 배치·화학적 성질은 같음'으로 못 박는다. 양성자가 다른 것으로 오해 마라.", "f": "B2", "rk": 372, "d": 3, "rh": 1, "pre": ["GC-012", "GC-013"], "tr": "이름이 다르면 다른 원소라는 직관이 강해, 동위원소도 양성자가 다를 거라 짐작한다.", "an": "동위원소는 같은 사람의 몸무게만 다른 버전: 양성자(정체)는 그대로이고 중성자만 달라 성질이 같다.", "rd": "양성자 수가 같으면 같은 원소다. 중성자 수가 달라도 원소는 그대로이므로 그 변이가 동위원소다.", "tf": "¹²C와 ¹⁴C는 화학 반응이 다른가? (거의 같다: 양성자 같아 성질 같음)"}, "GC-015": {"n": "원자량", "c": "gc", "u": "원자", "t": "C", "dx": "원자량을 한 동위원소의 질량으로 본 경우다. 존재비로 가중평균한 값이라 보통 소수가 된다는 점이 빠졌다.", "fx": "원자량을 '존재비로 가중평균한 값이라 보통 소수'로 못 박는다. 한 동위원소의 질량으로 보지 말고 존재비를 곱해 평균하라.", "f": "B2", "rk": 534, "d": 4, "rh": 0, "pre": ["GC-014"], "tr": "한 원소엔 원자량 하나가 딱 정해진 듯 보여, 여러 동위원소의 가중 평균이라는 그림이 안 떠오른다.", "an": "원자량은 반 평균 키: 큰 학생·작은 학생을 인원 비율로 섞은 평균이라, 어느 한 사람 키가 아니다.", "rd": "한 원소는 동위원소가 섞여 있다. 각 질량을 존재 비율로 곱해 더하면 가중 평균 원자량이 나온다.", "tf": "염소 원자량 35.5는 한 원자의 실제 질량인가? (아니다: 동위원소 가중 평균)"}, "GC-016": {"n": "전하 균형", "c": "gc", "u": "원자", "t": "C", "dx": "중성 원자에서 양성자 수=전자 수라는 균형을 놓친 경우다. 이온이 될 때 변하는 건 전자 수이지 양성자 수가 아니라는 점이 흔들린다.", "fx": "'중성 원자는 양성자 수 = 전자 수, 이온이 될 때 변하는 건 전자 수(양성자 불변)'임을 못 박는다. 이온식·산화수의 토대로 삼아라.", "f": "D3", "rk": 108, "d": 1, "rh": 0, "pre": ["GC-011"], "tr": "전하가 있고 없고는 별개 사안처럼 느껴져, 중성이 양성자 수와 전자 수가 맞물린 결과라는 연결이 약하다.", "an": "중성 원자는 수입=지출인 통장: (+)양성자와 (-)전자가 정확히 상쇄돼 잔액이 0이다.", "rd": "중성이려면 (+)와 (-)가 상쇄돼야 한다. 양성자(+1)와 전자(-1) 수가 같아야 전체 전하가 0이다.", "tf": "양성자 11, 전자 10이면 중성인가? (아니다: +1 양이온)"}, "GC-017": {"n": "입자 질량", "c": "gc", "u": "원자", "t": "B", "dx": "전자 질량을 양성자·중성자와 비슷하게 본 경우다. 전자는 약 1/1836로 매우 가벼워 원자 질량에 사실상 기여하지 않는다.", "fx": "'전자는 양성자·중성자의 약 1/1836로 매우 가벼워 원자 질량에 사실상 기여 안 함'을 못 박는다. 질량은 핵 입자로만 셈하라.", "f": "C1", "rk": 109, "d": 1, "rh": 0, "pre": ["GC-011"], "tr": "셋 다 \"입자\"라 부르니 무게도 엇비슷할 것 같아, 전자만 1840배 가볍다는 비대칭이 의외로 다가온다.", "an": "양성자·중성자는 볼링공, 전자는 깃털: 같은 \"입자\"라 불려도 무게는 1840배 차이 난다.", "rd": "양성자·중성자는 핵을 이루는 핵자라 무겁고 전자는 그 약 1/1840이다. 그래서 질량은 사실상 핵자가 정한다.", "tf": "전자 1840개의 질량이 양성자 1개와 비슷한 이유는? (전자가 1/1840로 가벼움)"}, "GC-018": {"n": "입자 전하", "c": "gc", "u": "원자", "t": "C", "dx": "구성 입자의 전하를 헷갈린 경우다. 양성자(+)·전자(-)·중성자(0)의 부호가 정리되지 않았다.", "fx": "구성 입자 전하를 '양성자(+)·전자(−)·중성자(0)'로 못 박는다. 세 부호를 적어 두고 전하 계산에 써라.", "f": "B2", "rk": 110, "d": 1, "rh": 0, "pre": ["GC-011"], "tr": "+인지 -인지 0인지가 외워야 할 목록처럼 느껴져, 어느 입자에 붙는지 섞인다.", "an": "양성자(+1)·전자(-1)·중성자(0)는 +카드·-카드·백지 카드: 어느 입자가 어느 카드인지 정해져 있다.", "rd": "양성자 +1, 전자 -1, 중성자 0의 약속에서 각 입자의 부호가 나온다.", "tf": "중성자가 전기장에서 휘나? (안 휨: 전하 0)"}, "GC-001": {"n": "SI 단위", "c": "gc", "u": "기초지식", "t": "C", "dx": "SI 기본 단위를 혼동한 경우다. 질량은 g이 아니라 kg, 온도는 ℃가 아니라 K가 기본 단위라는 점이 흔들린다.", "fx": "SI 기본 단위를 '질량은 kg(g 아님), 온도는 K(℃ 아님)'로 못 박는다. 기본 단위 목록을 적어 두고 계산 전 단위를 기본형으로 맞춰라.", "f": "B2", "rk": 22, "d": 0, "rh": 27, "pre": [], "tr": "단위는 다 \"얼마나\"를 재는 것이라 길이든 질량이든 비슷한 양처럼 느껴진다.", "an": "길이·질량·시간은 미터자·저울·시계가 재는 전혀 다른 것: 길이를 저울에 올릴 수 없다.", "rd": "측정량마다 기준 단위를 하나씩 약속한 것이 SI다. 길이·질량·시간은 서로 다른 물리량이라 같은 기준을 못 공유한다.", "tf": "5 kg을 10 m와 더할 수 있나? (없다: 다른 물리량이라 단위가 안 맞는다)"}, "GC-002": {"n": "물질량 단위", "c": "gc", "u": "기초지식", "t": "A", "dx": "질량(g)과 물질량(mol)을 같은 '양'으로 뭉뚱그린 경우다. mol은 입자 수를 세는 단위라는 정체가 빠지면 이후 양적관계 전체가 흔들린다.", "fx": "mol을 '입자 수를 세는 단위(질량 g과 다른 양)'로 못 박는다. 질량·물질량을 갈라 두고 모든 양적관계를 mol을 축으로 세워라.", "f": "B2", "rk": 101, "d": 1, "rh": 10, "pre": ["GC-001"], "tr": "g도 mol도 \"얼마나 있나\"를 말하니 둘 다 같은 종류의 양이라는 느낌이 자연스럽게 든다.", "an": "g은 \"무게\", mol은 \"개수\": 사과를 kg으로 살지 개수로 살지처럼, 같은 사과라도 재는 잣대가 다르다.", "rd": "질량은 저울로, 물질량은 개수로 잰다. \"얼마나 무거운가\"와 \"몇 개인가\"는 다른 질문이라 단위가 갈린다.", "tf": "금 막대를 g과 mol 중 무엇으로 사야 원자 개수를 아나? (mol: 개수 단위)"}, "GC-003": {"n": "접두사", "c": "gc", "u": "기초지식", "t": "B", "dx": "SI 접두사의 지수를 헷갈린 경우다. milli(10⁻³)·micro(10⁻⁶)·nano(10⁻⁹)의 자릿수 간격이 정리되지 않았다.", "fx": "SI 접두사를 'milli(10⁻³)·micro(10⁻⁶)·nano(10⁻⁹)'로 자릿수까지 못 박는다. 세 칸 간격을 외워 두고 단위 환산에서 지수를 맞춰라.", "f": "D3", "rk": 102, "d": 1, "rh": 1, "pre": ["GC-001"], "tr": "k·M·m이 단위 앞에 붙은 장식처럼 보여, 각각이 10의 몇 제곱이라는 크기로 다가오지 않는다.", "an": "k·M·m은 천 원·백만 원·천분의 일처럼 자릿수를 통째로 옮기는 화폐 단위: 같은 수라도 단위가 크기를 정한다.", "rd": "접두사는 10의 거듭제곱 약속이다. k=10^3, M=10^6, m=10^-3처럼 자릿수를 옮기는 인자로 외운다.", "tf": "3 km는 몇 mm인가? (3×10⁶ mm: 거듭제곱 인자로 환산)"}, "GC-004": {"n": "유효숫자", "c": "gc", "u": "기초지식", "t": "C", "dx": "유효숫자를 '자릿값 표시'로만 보고 측정의 정밀도를 담는다는 의미를 놓친 경우다. 어떤 0이 유효한지의 판단이 흔들린다.", "fx": "유효숫자를 '측정의 정밀도를 담는 자리(단순 자릿값 표시가 아님)'로 못 박는다. 앞의 0은 무효·중간과 뒤의 0은 유효라는 판단 규칙으로 어떤 0이 유효한지 가려라.", "f": "D3", "rk": 23, "d": 0, "rh": 2, "pre": [], "tr": "수는 정확한 값 하나라는 인상이 강해, 마지막 자리가 \"얼마나 믿을 만한가\"를 담는다는 발상이 안 든다.", "an": "디지털 저울이 0.00 g까지 보여주면 딱 그만큼만 믿는 것: 측정의 정밀도가 적힌 자릿수에 담긴다.", "rd": "측정은 도구 한계까지만 믿을 수 있다. 믿을 수 있는 자리까지 적은 것이 유효숫자이므로 자릿수가 곧 정밀도다.", "tf": "자로 잰 12.0 cm와 12 cm 중 더 정밀한 측정은? (12.0: 소수 첫째까지 믿음)"}, "GC-005": {"n": "유효숫자 연산", "c": "gc", "u": "기초지식", "t": "C", "dx": "곱셈·나눗셈은 가장 적은 유효숫자, 덧셈·뺄셈은 가장 적은 소수 자릿수가 결과를 제한한다는 두 규칙을 섞은 경우다.", "fx": "'곱셈·나눗셈은 가장 적은 유효숫자, 덧셈·뺄셈은 가장 적은 소수 자릿수'로 두 규칙을 갈라 못 박는다. 연산 종류를 먼저 보고 맞는 규칙을 적용하라.", "f": "D3", "rk": 103, "d": 1, "rh": 0, "pre": ["GC-004"], "tr": "규칙은 하나로 통일돼 있을 거라는 기대가 있어, 곱셈과 덧셈에서 따로 작동하는 게 번거롭게 느껴진다.", "an": "곱셈은 가장 흐릿한 사진의 해상도에, 덧셈은 가장 짧은 자의 눈금에 맞춘다: 규칙이 둘로 갈린다.", "rd": "곱셈은 비율 오차가 쌓여 가장 적은 유효숫자에, 덧셈은 절대 오차가 쌓여 가장 적은 소수 자릿수에 맞춘다.", "tf": "2.5×3.42와 2.5+3.42의 유효숫자 처리가 같나? (다르다: 곱은 자릿수, 합은 소수자리)"}, "GC-006": {"n": "정확한 수", "c": "gc", "u": "기초지식", "t": "C", "dx": "정의값·셈값 같은 정확한 수는 유효숫자 제한을 받지 않는다는 점을 놓친 경우다. 측정값과 정확한 수를 같이 취급하면 자릿수가 틀린다.", "fx": "'정의값·셈값 같은 정확한 수는 유효숫자 제한을 받지 않음'을 못 박는다. 측정값과 정확한 수를 갈라 자릿수 제한은 측정값에만 걸어라.", "f": "D1", "rk": 104, "d": 1, "rh": 0, "pre": ["GC-004"], "tr": "\"12개\"나 \"1 m=100 cm\" 같은 수도 측정값처럼 오차가 있을 것 같아 유효숫자 제한을 똑같이 걸고 싶어진다.", "an": "\"사람 12명\"은 11.9명일 리 없는 셈값: 측정값과 달리 자릿수 제한이 없는, 무한히 정확한 수다.", "rd": "정의나 셈으로 나온 수는 오차가 없다. 측정에서 나온 게 아니므로 유효숫자 제한을 받지 않는다.", "tf": "달걀 12개의 12는 유효숫자 제한을 받나? (안 받음: 셈값이라 무한 정확)"}, "GC-007": {"n": "정확도·정밀도", "c": "gc", "u": "기초지식", "t": "A", "dx": "정확도(참값 근접)와 정밀도(재현성)를 한 덩어리로 본 경우다. 계통 오차가 있으면 정밀해도 부정확할 수 있다는 구분이 빠졌다.", "fx": "'정확도 = 참값 근접, 정밀도 = 재현성'으로 갈라 못 박는다. 계통 오차가 있으면 정밀해도 부정확할 수 있음을 잡아 둘을 따로 평가하라.", "f": "B2", "rk": 24, "d": 0, "rh": 0, "pre": [], "tr": "일상어에서 \"정확\"과 \"정밀\"이 같은 칭찬으로 쓰여, 참값 근접과 재현성이 다른 축이라는 느낌이 안 온다.", "an": "다트가 한가운데 모였나(정확)와 한 곳에 모였나(정밀)는 다른 칭찬: 빗나간 곳에 빽빽이 모일 수도 있다.", "rd": "정확도는 참값과의 거리, 정밀도는 측정값끼리의 흩어짐이다. 둘은 독립이라 한쪽만 좋을 수 있다.", "tf": "과녁 한 곳에 빽빽이 몰렸으나 중심에서 벗어났다면? (정밀하나 부정확)"}, "GC-008": {"n": "밀도", "c": "gc", "u": "기초지식", "t": "C", "dx": "밀도를 질량/부피의 고정된 비로 다루지 못한 경우다. 분자·분모를 뒤집거나 단위 처리에서 막힌다.", "fx": "밀도를 '질량 ÷ 부피의 고정된 비'로 못 박는다. 분자·분모를 뒤집지 말고 단위를 약분해 따라가며 밀도를 다뤄라.", "f": "D3", "rk": 105, "d": 1, "rh": 0, "pre": ["GC-001"], "tr": "들었을 때 무거우면 밀도가 크다는 경험이 강해, 부피로 나눈 비라는 점이 뒤로 밀린다.", "an": "밀도는 같은 가방에 얼마나 꽉 찼나: 솜 한 가방과 쇠 한 가방은 무게가 달라도, 빽빽함(부피당 무게)이 본질이다.", "rd": "밀도=질량/부피다. 단위 부피에 든 질량이라 무게가 아니라 빽빽함을 잰다.", "tf": "같은 부피의 솜과 철 중 밀도가 큰 건? (철: 부피당 질량 큼)"}, "GC-009": {"n": "온도 환산", "c": "gc", "u": "기초지식", "t": "B", "dx": "℃와 K 환산에서 막힌 경우다. 둘은 눈금 간격이 같고 0점만 273.15 차이라는 점이 흔들린다.", "fx": "'℃와 K는 눈금 간격이 같고 0점만 273.15 차이'임을 못 박는다. K = ℃ + 273.15로 더하거나 빼 환산하라.", "f": "D3", "rk": 106, "d": 1, "rh": 0, "pre": ["GC-001"], "tr": "단위 환산은 보통 곱하고 나누는 거라, ℃와 K도 비례로 묶고 싶어져 273의 평행이동이 눈에 안 들어온다.", "an": "℃와 K는 같은 자에 0점만 다른 눈금: 273만큼 평행이동할 뿐 1도 간격은 똑같아 비례가 아니다.", "rd": "켈빈과 섭씨는 눈금 간격이 같고 0점만 273.15 차이다. 그래서 K=℃+273.15, 비례가 아니라 평행이동이다.", "tf": "20℃와 40℃는 절대 온도로 2배 차이인가? (아니다: 293 K vs 313 K, 평행이동)"}, "GC-010": {"n": "차원 분석", "c": "gc", "u": "기초지식", "t": "C", "dx": "단위환산을 더하기로 처리하거나, 환산인자가 값 1인 같은 양의 다른 표현임을 놓친 경우다. 단위를 약분해 따라가는 습관이 안 잡혔다.", "fx": "차원 분석을 '환산인자는 값이 1인 같은 양의 다른 표현, 단위를 약분해 따라감'으로 못 박는다. 더하기로 처리 말고 곱해 단위를 약분하라.", "f": "D3", "rk": 222, "d": 2, "rh": 0, "pre": ["GC-001", "GC-003"], "tr": "식에 단위가 섞여 있으면 숫자처럼 더하고 빼고 싶어져, 환산인자가 \"값 1\"이라 곱해도 양이 안 변한다는 그림이 약하다.", "an": "환산인자(1 m=100 cm)는 값이 1인 곱셈 카드: 곱해도 양은 안 변하고 단위만 갈아끼운다, 더하는 게 아니다.", "rd": "환산인자는 같은 양을 다른 단위로 쓴 분수라 값이 1이다. 1을 곱하면 양이 안 변해 단위만 갈아 끼운다.", "tf": "60 km/h를 m/s로 바꿀 때 환산인자를 더하나 곱하나? (곱한다: 값 1인 카드)"}, "GC-200": {"n": "배위 착물", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "배위 착물이 중심 금속에 리간드가 배위 결합한 화합물이라는 구조를 놓친 경우다. 금속이 중심, 리간드가 둘러싼다는 골격이 약하다.", "fx": "배위 착물을 '중심 금속에 리간드가 배위 결합한 화합물'로 못 박는다. 금속이 중심, 리간드가 둘러싼다는 골격을 잡아라.", "f": "B2", "rk": 799, "d": 9, "rh": 23, "pre": ["GC-044"], "tr": "착물이 평범한 화합물 같아, 중심 금속에 리간드가 배위 결합한 구조라는 게 안 잡힌다.", "an": "착물은 중심 금속에 리간드가 손잡고 둘러싼 구조다.", "rd": "중심 금속이 리간드의 전자쌍을 받아 배위 결합으로 둘러싸인 구조가 착물이다.", "tf": "중심 금속을 둘러싼 것은? (리간드)"}, "GC-201": {"n": "중심 금속", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "중심 금속(주로 전이 금속)이 리간드의 전자쌍을 받는 쪽(루이스 산)이라는 점을 놓친 경우다. 받는 역할이라는 점이 흔들린다.", "fx": "중심 금속을 '주로 전이 금속, 리간드의 전자쌍을 받는 쪽(루이스 산)'으로 못 박는다. 받는 역할임을 잡아라.", "f": "B1", "rk": 822, "d": 10, "rh": 0, "pre": ["GC-200"], "tr": "중심 금속이 전자를 줄 것 같아, 리간드의 전자쌍을 받는 쪽(루이스 산)이라는 게 흐려진다.", "an": "중심 금속은 전자쌍을 받는 쪽(루이스 산): 빈손을 내미는 집주인이다.", "rd": "중심 금속은 빈 오비탈에 전자쌍을 받는다. 그래서 루이스 산이다.", "tf": "중심 금속은 루이스 산인가 염기인가? (산: 전자쌍 받음)"}, "GC-202": {"n": "리간드", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "리간드가 전자쌍을 주는 쪽(루이스 염기)이고 그 전자쌍으로 배위한다는 점을 놓친 경우다. 주개 원자가 비공유 전자쌍을 낸다는 그림이 약하다.", "fx": "리간드를 '전자쌍을 주는 쪽(루이스 염기)이고 그 전자쌍으로 배위'로 못 박는다. 주개 원자가 비공유 전자쌍을 냄을 그려라.", "f": "B1", "rk": 823, "d": 10, "rh": 8, "pre": ["GC-200"], "tr": "리간드가 전자를 받을 것 같아, 전자쌍을 주는 쪽(루이스 염기)이라는 게 흐려진다.", "an": "리간드는 전자쌍을 주는 쪽(루이스 염기): 손을 잡아주는 손님이다.", "rd": "리간드는 비공유 전자쌍을 내준다. 그래서 루이스 염기다.", "tf": "리간드는 전자쌍을 주나 받나? (줌: 루이스 염기)"}, "GC-203": {"n": "배위 결합", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "배위 결합이 한쪽(리간드)이 전자쌍을 모두 내어 공유하는 결합이라는 점을 놓친 경우다. 일반 공유 결합과 전자쌍 출처가 다르다는 점이 흔들린다.", "fx": "배위 결합을 '한쪽(리간드)이 전자쌍을 모두 내어 공유하는 결합'으로 못 박는다. 일반 공유 결합과 전자쌍 출처가 다름을 잡아라.", "f": "B2", "rk": 840, "d": 11, "rh": 4, "pre": ["GC-200", "GC-202"], "tr": "배위 결합이 보통 공유 결합 같아, 한쪽이 전자쌍을 모두 내어 공유한다는 차이가 빠진다.", "an": "배위결합은 한쪽이 전자쌍을 통째로 내어 공유: 보통 공유결합과 출처만 다르다.", "rd": "한쪽(리간드)이 전자쌍을 통째로 내어 공유한다. 결과는 공유 결합과 같고 출처만 다르다.", "tf": "배위결합은 전자쌍을 누가 다 내나? (한쪽: 리간드)"}, "GC-204": {"n": "배위수", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "배위수가 중심 금속에 직접 결합한 주개 원자 수이고 4·6이 흔하다는 점을 놓친 경우다. 한 리간드가 여러 자리를 차지할 수 있다는 점이 약하다.", "fx": "배위수를 '중심 금속에 직접 결합한 주개 원자 수, 4·6이 흔함'으로 못 박는다. 한 리간드가 여러 자리를 차지할 수 있음을 잡아라.", "f": "B2", "rk": 861, "d": 12, "rh": 3, "pre": ["GC-203"], "tr": "배위수가 막연한 수 같아, 중심 금속에 직접 결합한 주개 원자 수(흔히 4·6)라는 게 안 잡힌다.", "an": "배위수는 중심 금속이 직접 잡은 손 개수: 흔히 4 또는 6이다.", "rd": "중심 금속에 직접 결합한 주개 원자의 수가 배위수다. 흔히 4 또는 6이다.", "tf": "배위수 6의 흔한 구조는? (팔면체)"}, "GC-205": {"n": "한자리 리간드", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "한자리 리간드가 결합점(주개 원자) 하나로 배위한다는 점을 놓친 경우다. 결합점 수가 리간드 분류 기준이라는 점이 흔들린다.", "fx": "한자리 리간드를 '결합점(주개 원자) 하나로 배위'로 못 박는다. 결합점 수가 리간드 분류 기준임을 잡아라.", "f": "B2", "rk": 841, "d": 11, "rh": 2, "pre": ["GC-202"], "tr": "한자리·여러자리가 같은 결합 같아, 한자리는 결합점이 하나라는 구분이 빠진다.", "an": "한자리 리간드는 손이 하나라 한 곳만 잡는다.", "rd": "결합점(주개 원자)이 하나면 한자리다. 한 곳만 잡는다.", "tf": "결합점이 하나인 리간드는? (한자리)"}, "GC-206": {"n": "여러자리 리간드", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "여러자리 리간드가 한 분자에 결합점이 여럿이라 여러 자리에서 동시에 배위한다는 점을 놓친 경우다.", "fx": "여러자리 리간드를 '한 분자에 결합점이 여럿이라 여러 자리에서 동시에 배위'로 못 박는다. 결합점 수로 한자리와 갈라라.", "f": "B2", "rk": 862, "d": 12, "rh": 1, "pre": ["GC-205"], "tr": "여러자리도 한 자리만 쓸 것 같아, 결합점이 여럿이라 동시에 여러 자리에서 묶는다는 게 빠진다.", "an": "여러자리는 손이 여럿이라 동시에 여러 곳을 잡는다.", "rd": "결합점이 여럿이면 여러자리다. 동시에 여러 곳을 잡는다.", "tf": "한 리간드가 여러 곳을 잡으면? (여러자리)"}, "GC-207": {"n": "킬레이트 효과", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "여러자리 리간드가 금속을 집게처럼 무는(킬레이트) 착물이 한자리 여럿보다 더 안정하다는 킬레이트 효과를 놓친 경우다. 엔트로피 이득이 안정성의 뿌리라는 점이 약하다.", "fx": "킬레이트 효과를 '여러자리 리간드가 금속을 집게처럼 무는 착물이 한자리 여럿보다 더 안정'으로 못 박는다. 엔트로피 이득이 안정성의 뿌리임을 잡아라.", "f": "C1", "rk": 877, "d": 13, "rh": 0, "pre": ["GC-206"], "tr": "한자리 여럿이나 여러자리 하나나 같을 것 같아, 집게처럼 무는 킬레이트가 더 안정하다는 게 빠진다.", "an": "집게(킬레이트)처럼 여러 손으로 무는 리간드가 더 안정: 한 손씩 여럿보다 꽉 잡힌다.", "rd": "여러자리가 한 금속을 집게처럼 물면 풀리기 어렵다(엔트로피 이득). 그래서 더 안정하다.", "tf": "킬레이트가 더 안정한 이유는? (여러 손, 엔트로피 이득)"}, "GC-208": {"n": "이성질체", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "배위 착물의 이성질이 구조 이성질(결합 방식 차이)과 입체 이성질(공간 배열 차이)로 나뉜다는 점을 놓친 경우다.", "fx": "배위 착물의 이성질을 '구조 이성질(결합 방식 차이)과 입체 이성질(공간 배열 차이)'로 나눠 못 박는다. 두 갈래로 이성질을 분류하라.", "f": "B2", "rk": 824, "d": 10, "rh": 2, "pre": ["GC-200"], "tr": "이성질이 한 종류 같아, 구조 이성질과 입체 이성질로 갈린다는 게 안 잡힌다.", "an": "이성질은 같은 부품, 다른 조립: 구조 이성질과 입체 이성질로 갈린다.", "rd": "같은 조성이라도 연결·배치가 다를 수 있다. 그래서 구조·입체 이성질로 갈린다.", "tf": "같은 조성 다른 배치는? (이성질)"}, "GC-209": {"n": "기하 이성질체", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "기하 이성질이 결합 순서는 같고 리간드의 공간 배열(cis·trans)이 달라 성질이 바뀌는 것이라는 점을 놓친 경우다. 정의가 광학 이성질과 뒤섞였다.", "fx": "기하 이성질을 '결합 순서는 같고 리간드의 공간 배열(cis·trans)이 달라 성질이 바뀜'으로 못 박는다. 광학 이성질과 갈라 정의하라.", "f": "B2", "rk": 842, "d": 11, "rh": 0, "pre": ["GC-208"], "tr": "결합만 같으면 같은 물질 같아, cis·trans 공간 배열이 달라 성질이 바뀐다는 게 빠진다.", "an": "같은 결합이라도 같은 편(cis)·반대편(trans) 배치로 성질이 다르다: 자리 배치가 중요하다.", "rd": "리간드가 같은 편(cis)인지 반대편(trans)인지로 공간 배치가 달라 성질이 바뀐다.", "tf": "리간드가 반대편에 있으면? (trans)"}, "GC-210": {"n": "광학 이성질체", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "광학 이성질이 거울상이 겹쳐지지 않는 입체 배열 차이라는 점을 놓친 경우다. 결합 순서가 아니라 공간 배열(손대칭성)의 차이라는 점이 흔들린다.", "fx": "광학 이성질을 '거울상이 겹쳐지지 않는 입체 배열 차이'로 못 박는다. 결합 순서가 아니라 공간 배열(손대칭성)의 차이임을 잡아라.", "f": "B2", "rk": 843, "d": 11, "rh": 0, "pre": ["GC-208"], "tr": "거울상은 같은 물질 같아, 겹쳐지지 않으면 다른 광학 이성질이라는 게 의외로 다가온다.", "an": "왼손과 오른손처럼 거울상이지만 겹쳐지지 않는 두 분자: 다른 물질이다.", "rd": "거울상이 원본과 안 겹치면 둘은 다른 분자다. 그것이 광학 이성질이다.", "tf": "거울상이 안 겹치는 두 분자는? (광학 이성질)"}, "GC-211": {"n": "평면 사각", "c": "gc", "u": "배위화학-1", "t": "C", "dx": "배위수 4가 평면 사각형 또는 정사면체로, 배위수 6은 팔면체로 배열된다는 대응을 놓친 경우다. 같은 배위수라도 구조가 갈릴 수 있다는 점이 약하다.", "fx": "'배위수 4는 평면 사각형 또는 정사면체, 배위수 6은 팔면체'로 못 박는다. 같은 배위수라도 구조가 갈릴 수 있음을 잡아라.", "f": "B2", "rk": 878, "d": 13, "rh": 1, "pre": ["GC-204"], "tr": "배위수 4면 모양이 하나일 것 같아, 평면 사각 또는 정사면체 둘이라는 게 빠진다.", "an": "배위수 4는 평면 사각 또는 정사면체: 모양이 하나가 아니다.", "rd": "배위수 4는 평면 사각 또는 정사면체다. d 전자와 리간드에 따라 갈린다.", "tf": "배위수 4의 두 구조는? (평면 사각, 정사면체)"}, "GC-212": {"n": "팔면체", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "배위수 6이 팔면체, 배위수 4가 평면 사각·정사면체라는 구조 대응을 헷갈린 경우다. 배위수와 기하 구조의 짝이 흔들린다.", "fx": "'배위수 6은 팔면체, 배위수 4는 평면 사각·정사면체'로 못 박는다. 배위수와 기하 구조의 짝을 맞춰라.", "f": "B2", "rk": 879, "d": 13, "rh": 1, "pre": ["GC-204"], "tr": "배위수와 모양 대응이 헷갈려, 6은 팔면체·4는 평면 사각/정사면체라는 게 흔들린다.", "an": "6이면 팔면체, 4면 평면 사각/정사면체: 손 개수가 모양을 정한다.", "rd": "반발 최소 배치가 구조를 정한다. 6은 팔면체, 4는 평면 사각/정사면체다.", "tf": "배위수가 구조를 정하나? (그렇다)"}, "GC-213": {"n": "결정장 이론", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "결정장 이론이 리간드를 점전하로 보고 그 정전기적 영향으로 금속 d 오비탈 에너지가 갈라진다고 설명한다는 점을 놓친 경우다.", "fx": "결정장 이론을 '리간드를 점전하로 보고 그 정전기적 영향으로 금속 d 오비탈 에너지가 갈라짐'으로 못 박는다. 이 그림으로 d 오비탈 분리를 설명하라.", "f": "B2", "rk": 825, "d": 10, "rh": 9, "pre": ["GC-200", "GC-026"], "tr": "d 오비탈이 늘 같은 에너지일 것 같아, 리간드 점전하의 영향으로 갈라진다(결정장)는 게 빠진다.", "an": "리간드가 다가오면 d 오비탈 높이가 갈라진다: 점전하가 밀어 에너지 층이 생긴다.", "rd": "리간드 전자쌍이 다가오면 그 방향의 d 오비탈이 더 밀려 에너지가 오른다. 그래서 d가 갈라진다.", "tf": "리간드가 다가오면 d 오비탈은? (에너지 갈라짐)"}, "GC-214": {"n": "d 오비탈 분리", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "팔면체장에서 리간드를 향한 d 오비탈이 더 큰 반발로 높아지고 그 사이를 향한 것은 낮아져, 낮은 세 개·높은 두 개로 갈라진다는 점을 놓친 경우다.", "fx": "'팔면체장에서 리간드를 향한 d 오비탈이 더 큰 반발로 높아지고 그 사이를 향한 것은 낮아져, 낮은 세 개·높은 두 개로 갈라짐'을 못 박는다. 방향으로 분리를 잡아라.", "f": "B2", "rk": 844, "d": 11, "rh": 8, "pre": ["GC-213"], "tr": "팔면체에서 d가 어떻게 갈라질지 막막해, 낮은 셋·높은 둘로 나뉜다는 게 안 잡힌다.", "an": "팔면체에선 d가 낮은 셋·높은 둘로 갈린다.", "rd": "팔면체는 축 방향 d 오비탈이 리간드와 정면 충돌해 높아진다. 그래서 낮은 셋·높은 둘로 갈린다.", "tf": "팔면체에서 d는 몇 대 몇으로? (3 낮음 2 높음)"}, "GC-215": {"n": "분리 에너지", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "갈라짐 에너지 Δ가 두 d 오비탈 무리의 에너지 차이이고 리간드 장 세기에 따라 달라진다는 점을 놓친 경우다. '같음'이 아니라 '차이'라는 점이 흔들린다.", "fx": "갈라짐 에너지 Δ를 '두 d 오비탈 무리의 에너지 차이이고 리간드 장 세기에 따라 달라짐'으로 못 박는다. '같음'이 아니라 '차이'임을 잡아라.", "f": "A3", "rk": 863, "d": 12, "rh": 7, "pre": ["GC-214"], "tr": "갈라짐 Δ가 고정값 같아, 리간드 장 세기에 따라 달라진다는 게 빠진다.", "an": "갈라짐 Δ는 고정값이 아니라 리간드 장 세기에 따라 달라진다.", "rd": "갈라짐 Δ는 리간드가 d 오비탈을 미는 세기다. 그래서 리간드 장 세기에 따라 달라진다.", "tf": "Δ는 무엇에 따라 변하나? (리간드 장 세기)"}, "GC-216": {"n": "강한 장", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "강한 장 리간드일수록 갈라짐 Δ를 크게 만든다는 대응을 놓친 경우다. 장이 약하면 Δ가 작다는 방향이 흔들린다.", "fx": "'강한 장 리간드일수록 갈라짐 Δ를 크게 만듦'을 못 박는다. 장이 약하면 Δ가 작은 방향을 잡아라.", "f": "C1", "rk": 880, "d": 13, "rh": 2, "pre": ["GC-215"], "tr": "리간드 종류와 Δ가 무관할 것 같아, 강한 장일수록 Δ를 크게 만든다는 대응이 빠진다.", "an": "강한 장 리간드일수록 Δ를 크게 벌린다.", "rd": "강한 장 리간드일수록 d 오비탈을 더 세게 밀어 Δ가 크다.", "tf": "강한 장 리간드는 Δ가? (큼)"}, "GC-217": {"n": "저스핀", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "Δ가 짝짓기 에너지보다 크면(강한 장) 전자가 낮은 오비탈에서 짝을 지어 저스핀이 된다는 점을 놓친 경우다.", "fx": "'Δ가 짝짓기 에너지보다 크면(강한 장) 전자가 낮은 오비탈에서 짝을 지어 저스핀'임을 못 박는다. Δ와 짝짓기 에너지의 크기 비교로 스핀을 정하라.", "f": "C1", "rk": 881, "d": 13, "rh": 2, "pre": ["GC-215", "GC-028"], "tr": "전자가 늘 흩어져 채워질 것 같아, Δ가 크면(강한 장) 짝지어 저스핀이 된다는 게 빠진다.", "an": "Δ가 크면(강한 장) 전자가 짝지어 아래로 몰린다(저스핀): 계단이 높아 위로 안 올라간다.", "rd": "Δ가 크면 위 오비탈로 올리기보다 짝짓는 게 싸다. 그래서 아래부터 채워 저스핀이다.", "tf": "Δ가 크면 저스핀인가 고스핀인가? (저스핀)"}, "GC-218": {"n": "고스핀", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "Δ가 작으면(약한 장) 짝짓기보다 높은 오비탈로 퍼져 들어가는 편이 유리해 고스핀이 된다는 점을 놓친 경우다.", "fx": "'Δ가 작으면(약한 장) 짝짓기보다 높은 오비탈로 퍼져 들어가는 편이 유리해 고스핀'임을 못 박는다. 약한 장에서 전자가 퍼짐을 잡아라.", "f": "C1", "rk": 882, "d": 13, "rh": 2, "pre": ["GC-215", "GC-028"], "tr": "전자가 늘 짝부터 채울 것 같아, Δ가 작으면(약한 장) 퍼져 들어가 고스핀이 된다는 게 빠진다.", "an": "Δ가 작으면(약한 장) 전자가 흩어져 위까지 채운다(고스핀): 계단이 낮아 퍼진다.", "rd": "Δ가 작으면 짝짓는 반발보다 위로 올리는 게 싸다. 그래서 흩어 채워 고스핀이다.", "tf": "Δ가 작으면? (고스핀)"}, "GC-219": {"n": "강한 장과 스핀", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "강한 장은 Δ가 커서 저스핀, 약한 장은 Δ가 작아 고스핀이라는 연결을 놓친 경우다. Δ와 짝짓기 에너지의 크기 비교가 스핀을 정한다는 점이 약하다.", "fx": "'강한 장은 Δ가 커서 저스핀, 약한 장은 Δ가 작아 고스핀'임을 못 박는다. Δ와 짝짓기 에너지의 크기 비교가 스핀을 정함을 잡아라.", "f": "B2", "rk": 887, "d": 14, "rh": 0, "pre": ["GC-216", "GC-217", "GC-218"], "tr": "장 세기와 스핀 상태 대응이 헷갈려, 강한 장=저스핀·약한 장=고스핀이 흔들린다.", "an": "강한 장=저스핀, 약한 장=고스핀: 계단 높이가 전자 배치를 정한다.", "rd": "Δ와 짝지음 에너지의 크기 비교가 스핀을 정한다. 강한 장=저스핀, 약한 장=고스핀이다.", "tf": "강한 장은 어떤 스핀? (저스핀)"}, "GC-220": {"n": "분광화학 계열", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "분광화학 계열이 리간드를 장 세기(Δ 크기) 순으로 배열한 것이고 분자량 순이 아니라는 점을 놓친 경우다.", "fx": "분광화학 계열을 '리간드를 장 세기(Δ 크기) 순으로 배열한 것'으로 못 박는다. 분자량 순이 아님을 잡아라.", "f": "B2", "rk": 888, "d": 14, "rh": 0, "pre": ["GC-216"], "tr": "분광화학 계열이 분자량 순일 것 같아, 장 세기(Δ) 순이라는 게 의외로 다가온다.", "an": "계열은 분자량 순이 아니라 장 세기(Δ) 순: 무게가 아니라 미는 힘 순서다.", "rd": "계열은 리간드가 Δ를 키우는 순서(장 세기 순)다. 분자량과는 무관하다.", "tf": "분광화학계열의 순서는 무엇 순? (장 세기 Δ)"}, "GC-221": {"n": "착물의 색", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "착물의 색이 d 오비탈 전이로 Δ만큼의 빛을 흡수하고 그 보색이 보이는 것이라는 점을 놓친 경우다. 흡수한 색 자체가 보이는 게 아니라는 점이 흔들린다.", "fx": "착물의 색을 'd 오비탈 전이로 Δ만큼의 빛을 흡수하고 그 보색이 보임'으로 못 박는다. 흡수한 색 자체가 보이는 게 아님을 잡아라.", "f": "B3", "rk": 883, "d": 13, "rh": 0, "pre": ["GC-215"], "tr": "착물 색이 그냥 색소 같아, d 전이로 Δ만큼 흡수하고 그 보색이 보인다는 메커니즘이 빠진다.", "an": "d 전이로 Δ만큼의 빛을 흡수하고 그 보색이 보인다: 흡수한 색의 반대가 눈에 띈다.", "rd": "d 전자가 Δ만큼의 에너지를 흡수해 전이한다. 흡수된 색의 보색이 보인다.", "tf": "착물 색은 흡수한 색의 무엇? (보색)"}, "GC-222": {"n": "착물 자기성", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "착물의 자기성이 홀전자 유무로 정해진다는 점을 놓친 경우다. 홀전자가 있으면 상자기성, 없으면 반자기성이라는 대응이 흔들린다(고스핀·저스핀과 직결).", "fx": "착물의 자기성을 '홀전자가 있으면 상자기성, 없으면 반자기성'으로 못 박는다. 고스핀·저스핀이 홀전자 수를 정함과 직결로 잡아라.", "f": "B3", "rk": 889, "d": 14, "rh": 0, "pre": ["GC-217", "GC-218"], "tr": "착물 자기성이 특별할 것 같아, 홀전자 유무로 정해진다는 단순한 연결이 빠진다.", "an": "홀전자가 있으면 상자기, 다 짝지으면 반자기: 짝 없는 전자가 자석을 부른다.", "rd": "갈라진 d에 홀전자가 있으면 상자기, 다 짝지으면 반자기다.", "tf": "홀전자가 있는 착물은? (상자기)"}, "GC-223": {"n": "배위수와 구조", "c": "gc", "u": "배위화학-2", "t": "C", "dx": "배위수가 기하 구조를 정한다는 대응을 놓친 경우다. 2는 직선형, 4는 평면 사각·정사면체, 6은 팔면체라는 짝이 흔들린다.", "fx": "배위수가 기하 구조를 정함을 '2는 직선형, 4는 평면 사각·정사면체, 6은 팔면체'로 못 박는다. 배위수에서 구조를 바로 옮겨라.", "f": "B2", "rk": 890, "d": 14, "rh": 0, "pre": ["GC-204", "GC-211", "GC-212"], "tr": "배위수와 구조가 따로 놀 것 같아, 배위수가 기하 구조를 정한다는 대응이 빠진다.", "an": "배위수가 기하 구조를 정한다: 손 개수가 모양을 결정한다.", "rd": "리간드끼리 반발을 피하는 배치가 기하 구조다. 그래서 배위수가 모양을 정한다.", "tf": "기하 구조를 정하는 건? (배위수)"}, "GC-027": {"n": "파울리 원리", "c": "gc", "u": "전자배치", "t": "B", "dx": "파울리 원리를 '스핀은 두 종류'로만 외우고, 네 양자수가 모두 같은 전자는 존재할 수 없다는 핵심을 놓친 경우다. 한 오비탈에 전자가 반대 스핀 2개까지만 들어가는 이유가 여기서 나온다.", "fx": "파울리 원리를 '네 양자수가 모두 같은 전자는 존재 불가'로 못 박는다. 여기서 한 오비탈에 반대 스핀 2개까지만 들어감이 나옴을 잡아라.", "f": "B2", "rk": 650, "d": 5, "rh": 59, "pre": ["GC-022", "GC-023"], "tr": "파울리를 \"스핀은 두 종류\"로만 외우면 충분해 보여, 네 양자수가 전부 같을 수 없다는 더 센 조건이 묻힌다.", "an": "한 자리(오비탈)엔 앞·뒤로 앉은 두 사람까지: 네 주소가 똑같은 전자는 있을 수 없다.", "rd": "한 오비탈은 n·l·mₗ이 같으니 두 전자가 들어가려면 스핀이 달라야 한다. 그래서 최대 2개다.", "tf": "한 오비탈에 같은 스핀 전자 2개가 가능한가? (불가: 스핀이 달라야)"}, "GC-028": {"n": "훈트 규칙", "c": "gc", "u": "전자배치", "t": "C", "dx": "같은 에너지의 오비탈은 먼저 하나씩 평행 스핀으로 채운 뒤 짝짓는다는 순서를, 결과만 외우고 이유(전자 반발 최소·교환 안정화)를 놓친 경우다. p·d 오비탈 채움에서 바로 틀린다.", "fx": "훈트 규칙을 '같은 에너지의 오비탈은 먼저 하나씩 평행 스핀으로 채운 뒤 짝지음(전자 반발 최소·교환 안정화)'으로 못 박는다. p·d 채움을 이 순서로 그려라.", "f": "D3", "rk": 651, "d": 5, "rh": 59, "pre": ["GC-025"], "tr": "전자를 채울 때 일단 짝부터 맞추는 게 깔끔해 보여, 하나씩 흩어 평행 스핀으로 먼저 넣는다는 순서가 거슬린다.", "an": "버스 빈 2인석을 채울 때 일단 한 명씩 따로 앉는다: 같은 에너지면 흩어 앉은 뒤에야 짝을 짓는다.", "rd": "같은 에너지 오비탈이면 전자는 반발을 피해 흩어진다. 그래서 하나씩 평행 스핀으로 채운 뒤 짝짓는다.", "tf": "2p에 전자 2개면 같은 오비탈에 짝지나? (아니다: 다른 오비탈에 하나씩)"}, "GC-029": {"n": "쌓음 원리", "c": "gc", "u": "전자배치", "t": "B", "dx": "쌓음 원리를 '안쪽 껍질부터'라는 공간 순서로 오해한 경우다. 기준은 위치가 아니라 에너지이며, 바닥상태는 에너지가 가장 낮은 배치라는 정의가 흔들린다(4s가 3d보다 먼저 차는 이유와 직결).", "fx": "쌓음 원리를 '기준은 위치가 아니라 에너지, 바닥상태는 에너지가 가장 낮은 배치'로 못 박는다. 4s가 3d보다 먼저 차는 이유를 에너지 순서로 설명하라.", "f": "B2", "rk": 538, "d": 4, "rh": 60, "pre": ["GC-024"], "tr": "\"쌓는다\"가 안쪽부터 벽돌 올리듯 공간 순서로 들려, 기준이 에너지라는 점이 가려진다.", "an": "물을 부으면 낮은 곳부터 찬다: 안쪽 껍질 순서가 아니라 에너지 낮은 곳부터다.", "rd": "계는 에너지가 낮을수록 안정하다. 그래서 전자는 빈 오비탈 중 에너지 낮은 것부터 채운다.", "tf": "전자를 가장 안쪽 껍질부터 채우나? (아니다: 에너지 낮은 순)"}, "GC-030": {"n": "배치 순서", "c": "gc", "u": "전자배치", "t": "C", "dx": "주어진 원자의 전자를 부껍질에 실제로 배분하는 단계에서 막히는 경우다. 전자 수 세기, 에너지 순서대로 채우기, 각 부껍질 최대 수(s²·p⁶·d¹⁰) 적용이 한 흐름으로 이어지지 않는다.", "fx": "전자 배치를 '전자 수를 세고, 에너지 순서대로 채우고, 각 부껍질 최대 수(s²·p⁶·d¹⁰)를 적용하는 한 흐름'으로 못 박는다. 이 순서로 주어진 원자를 채워라.", "f": "D3", "rk": 703, "d": 6, "rh": 58, "pre": ["GC-027", "GC-028", "GC-029"], "tr": "규칙은 알아도 막상 한 원자의 전자를 어디부터 넣을지는 막막해, 적용 단계에서 손이 멈춘다.", "an": "전자 배치는 좌석표대로 손님 앉히기: 세 규칙(쌓음·파울리·훈트)을 순서대로 적용한다.", "rd": "쌓음(낮은 에너지부터)·파울리(오비탈당 2개)·훈트(흩어 먼저)를 순서대로 적용하면 배치가 나온다.", "tf": "배치에 세 원칙 중 하나만 쓰면 되나? (아니다: 셋 다 순서대로)"}, "GC-031": {"n": "에너지 순서", "c": "gc", "u": "전자배치", "t": "C", "dx": "오비탈 에너지를 주양자수 n만으로 판단해 4s와 3d, 6s와 4f 순서에서 틀리는 경우다. 다전자 원자에서는 가려막기·침투 때문에 같은 n 안에서도 l에 따라 에너지가 갈린다는 점이 빠졌다.", "fx": "'오비탈 에너지를 n만으로 판단하면 안 되고, 다전자 원자에선 가려막기·침투로 같은 n 안에서도 l에 따라 에너지가 갈림'을 못 박는다. 4s<3d, 6s<4f를 이로 잡아라.", "f": "A4", "rk": 652, "d": 5, "rh": 1, "pre": ["GC-029"], "tr": "n이 크면 에너지도 크다는 단순 비례가 자연스러워, 4s가 3d보다 먼저라는 역전이 어긋나 보인다.", "an": "4s가 3d보다 먼저인 건 층은 높아도 계단이 더 가까운 방: 층수(n)만으로 에너지 순서를 못 정한다.", "rd": "침투 효과로 4s가 핵 가까이 들어가 가려막기를 덜 받는다. 그래서 4s가 3d보다 낮아 먼저 채워진다.", "tf": "3d와 4s 중 먼저 채우는 건? (4s: 침투로 더 낮음)"}, "GC-032": {"n": "안정 배치", "c": "gc", "u": "전자배치", "t": "C", "dx": "반쪽 채움(d⁵)·가득 참(d¹⁰)이 주는 추가 안정성을 모르고, Cr·Cu 같은 예외 배치를 단순 규칙 위반으로 보는 경우다. 4s 전자 하나가 3d로 옮겨 가는 이유가 여기 있다.", "fx": "'반쪽 채움(d⁵)·가득 참(d¹⁰)이 주는 추가 안정성'을 못 박는다. 4s 전자 하나가 3d로 옮겨 가는 Cr·Cu 예외를 단순 위반이 아니라 안정화로 설명하라.", "f": "D1", "rk": 737, "d": 7, "rh": 0, "pre": ["GC-030", "GC-031"], "tr": "규칙을 어긴 배치는 틀린 답 같아, Cr·Cu가 반쪽채움·가득참으로 더 안정해 일부러 그런다는 사정이 안 보인다.", "an": "Cr·Cu는 반쯤 채운 책장이 더 안정해 한 칸 당겨오는 예외: 규칙 위반이 아니라 더 낮은 에너지를 택한 것.", "rd": "반쪽 채움·가득 채움은 특별히 안정하다. 그래서 Cr·Cu는 한 전자를 옮겨 그 안정 배치를 택한다.", "tf": "Cr이 3d⁴4s²가 아닌 3d⁵4s¹인 이유는? (반쪽 채움이 더 안정)"}, "GC-033": {"n": "바닥상태", "c": "gc", "u": "전자배치", "t": "C", "dx": "바닥상태를 '세 원칙을 지킨 배치'로만 외우고, 본질이 에너지가 가장 낮은 상태라는 정의와 분리된 경우다. 전자 하나라도 더 높은 자리에 있으면 들뜬상태라는 대비가 약하다.", "fx": "바닥상태를 '본질이 에너지가 가장 낮은 상태'로 못 박는다. 세 원칙을 지킨 배치로만 외우지 말고, 전자 하나라도 더 높은 자리면 들뜬상태임을 대비하라.", "f": "B2", "rk": 738, "d": 7, "rh": 1, "pre": ["GC-030"], "tr": "세 원칙을 지킨 배치가 곧 정답이라 외우면 충분해 보여, 본질이 \"에너지 최저 상태\"라는 정의와 떨어진다.", "an": "바닥상태는 공이 굴러 멈춘 골짜기 맨 밑: 가장 안정한, 에너지 최저 배치다.", "rd": "에너지가 가장 낮은 배치가 가장 안정하다. 세 원칙을 다 지킨 배치가 곧 바닥상태인 이유다.", "tf": "들뜬상태가 바닥상태보다 안정한가? (아니다: 바닥이 에너지 최저)"}, "GC-034": {"n": "들뜬상태", "c": "gc", "u": "전자배치", "t": "C", "dx": "들뜬상태가 에너지를 흡수해 전자가 올라간 불안정한 상태이고, 떨어질 때 그 차이를 빛으로 내놓는다는 흡수·방출 방향을 헷갈리는 경우다. 선 스펙트럼·바닥상태와 한 묶음으로 봐야 한다.", "fx": "들뜬상태를 '에너지를 흡수해 전자가 올라간 불안정한 상태, 떨어질 때 그 차이를 빛으로 방출'로 못 박는다. 흡수·방출 방향을 선 스펙트럼과 한 묶음으로 잡아라.", "f": "A1", "rk": 762, "d": 8, "rh": 0, "pre": ["GC-033"], "tr": "들뜬상태 하면 빛나는 네온사인이 떠올라, 흡수(올라갈 때)와 방출(내려올 때)을 뭉쳐 \"들뜨면 빛을 낸다\"로 직행한다.", "an": "들뜬상태는 계단을 올라간 공: 올라갈 땐 에너지를 흡수하고, 내려올 때 그 차이를 빛으로 뱉는다.", "rd": "전자가 에너지를 흡수하면 더 높은 준위로 올라간다(들뜸). 내려올 땐 그 차이를 빛으로 방출한다.", "tf": "전자가 빛을 내는 건 올라갈 때인가 내려올 때인가? (내려올 때: 방출)"}, "GC-035": {"n": "원자가 전자", "c": "gc", "u": "전자배치", "t": "C", "dx": "결합에 참여하는 건 가장 바깥 껍질의 원자가 전자이고 안쪽 전자는 거의 관여하지 않는다는 구분이 흐린 경우다. 원자가 전자 수가 족·반응성으로 이어지는 다음 단원(주기성·결합)의 토대가 흔들린다.", "fx": "원자가 전자를 '가장 바깥 껍질의 전자로 결합에 참여, 안쪽 전자는 거의 관여 안 함'으로 못 박는다. 원자가 전자 수를 족·반응성으로 잇는 다음 단원의 토대로 삼아라.", "f": "B2", "rk": 739, "d": 7, "rh": 54, "pre": ["GC-030"], "tr": "전자가 많으면 다 같이 결합에 낄 것 같아, 결합은 바깥 껍질 전자만 한다는 선이 흐려진다.", "an": "결합은 바깥 손만 잡는 악수: 안쪽 껍질 전자는 끼지 않고 최외각 전자만 한다.", "rd": "결합은 바깥에서 만난다. 가장 바깥 껍질 전자만 다른 원자와 닿으므로 그것만 결합에 쓰인다.", "tf": "안쪽 껍질 전자가 결합에 끼나? (아니다: 최외각만)"}, "GC-116": {"n": "동적 평형", "c": "gc", "u": "화학평형-1", "t": "B", "dx": "동적 평형이 반응이 멈춘 게 아니라 정·역반응이 같은 속도로 계속되어 농도가 일정한 상태라는 점을 놓친 경우다. '일정함'과 '멈춤'을 같게 본 것이 오류다.", "fx": "동적 평형을 '반응이 멈춘 게 아니라 정·역반응이 같은 속도로 계속되어 농도가 일정'으로 못 박는다. '일정함'과 '멈춤'을 갈라라.", "f": "E1", "rk": 32, "d": 0, "rh": 36, "pre": [], "tr": "농도가 안 변하면 반응이 끝나 멈춘 것 같아, 정·역반응이 같은 속도로 계속되는 \"동적\" 상태라는 게 안 잡힌다.", "an": "평형은 멈춤이 아니라 올라가는 사람=내려오는 사람이 같은 에스컬레이터: 겉보기는 일정해도 양방향 계속이다.", "rd": "정반응과 역반응 속도가 같아지면 농도가 더 안 변한다. 반응은 양방향으로 계속되므로 동적이다.", "tf": "평형에서 반응이 멈췄나? (아니다: 정·역 계속)"}, "GC-117": {"n": "평형 상수", "c": "gc", "u": "화학평형-1", "t": "C", "dx": "평형 상수 식에서 생성물을 분자, 반응물을 분모에 두고 계수를 지수로, 처음 농도가 아니라 평형 농도를 넣는다는 규칙을 헷갈린 경우다.", "fx": "평형 상수 식을 '생성물을 분자·반응물을 분모, 계수를 지수, 처음이 아니라 평형 농도를 넣음'으로 못 박는다. 평형 농도를 써서 K를 세워라.", "f": "D3", "rk": 121, "d": 1, "rh": 35, "pre": ["GC-116"], "tr": "평형 식을 세울 때 분자·분모, 계수 자리, 처음/평형 농도가 한꺼번에 밀려와 규칙이 뒤섞인다.", "an": "생성물을 위, 반응물을 아래, 계수를 지수로, 평형 농도를 넣는다: 분수 만들기 규칙이다.", "rd": "평형에서 정·역 속도가 같다는 조건에서 (생성물 곱)/(반응물 곱)에 계수를 지수로 한 K가 일정해진다.", "tf": "생성물 농도는 평형식의 어디에? (분자)"}, "GC-118": {"n": "Kp", "c": "gc", "u": "화학평형-1", "t": "C", "dx": "압력 평형 상수 Kₚ가 부분 압력으로, 농도 평형 상수가 농도로 표현된다는 구분을 놓친 경우다. 순수 고체·액체는 식에서 빠지고 Δn=0일 때만 둘이 같다는 점이 흔들린다.", "fx": "'Kₚ는 부분 압력으로, 농도 평형 상수는 농도로 표현, 순수 고체·액체는 제외, Δn=0일 때만 둘이 같음'을 못 박는다. 무엇으로 표현하는지 갈라라.", "f": "B2", "rk": 381, "d": 3, "rh": 1, "pre": ["GC-117", "GC-064"], "tr": "Kp와 Kc가 같은 K 같아, 하나는 부분 압력·하나는 농도라는 표현 차이가 흐려진다.", "an": "같은 평형을 압력으로 적으면 Kp, 농도로 적으면 Kc: 같은 사실의 두 표기다.", "rd": "기체 농도를 분압으로 쓰면 Kp, 몰농도로 쓰면 Kc다. 같은 평형의 두 표현이다.", "tf": "압력으로 쓴 평형상수는? (Kp)"}, "GC-119": {"n": "Kc-Kp 관계", "c": "gc", "u": "화학평형-1", "t": "A", "dx": "압력 기준 Kₚ와 농도 기준 K가 기체 몰수 변화 Δn에 따라 달라진다는 점(Δn=0이면 같음)을 놓친 경우다. 관계식에서 온도는 켈빈을 쓴다는 점도 흔들린다.", "fx": "'Kₚ와 농도 기준 K는 기체 몰수 변화 Δn에 따라 달라짐(Δn=0이면 같음)'을 못 박는다. 관계식에서 온도는 켈빈을 씀을 잡아라.", "f": "A3", "rk": 551, "d": 4, "rh": 0, "pre": ["GC-118"], "tr": "Kp와 Kc가 늘 같을 것 같아, 기체 몰수 변화 Δn에 따라 달라진다는 게 빠진다.", "an": "기체 몰수가 변하면 둘이 어긋난다: Δn만큼 환산이 필요하다.", "rd": "P=(n/V)RT라 분압과 농도가 RT배다. 기체 몰수 변화 Δn만큼 Kp와 Kc가 달라진다.", "tf": "기체 몰수가 변하면 Kp와 Kc는? (다름: Δn 환산)"}, "GC-120": {"n": "평형 상수 식", "c": "gc", "u": "화학평형-1", "t": "C", "dx": "평형 상수 식에서 순수 고체·액체는 활동도를 1로 보아 제외한다는 규칙을 놓친 경우다. 고체 농도를 식에 넣는 실수로 이어진다.",

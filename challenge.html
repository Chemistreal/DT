<style>
:root{--paper:#FAFAF7;--surface:#FFFFFF;--ink:#16202E;--sub:#5F6D7C;--faint:#626D7B;--line:#E7E8E2;--line2:#EEF0EA;
  --teal:#0B6E6E;--teal-d:#0A5A5A;--teal-soft:#E4F0EF;--teal-line:#BFE0DD;--o:#1B8A4C;--o-bg:#E7F5EC;--x:#C0392B;--x-bg:#FBEBE9;
  --brass:#A9853C;--brass-soft:#F5EEDF;--shadow:0 1px 2px rgba(16,32,46,.04),0 6px 20px rgba(16,32,46,.05);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:680px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:11px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brass),#caa45a);flex:none}
.dawon-logo{height:28px;width:auto;display:block;flex:none}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em}.brand small{display:block;font-size:11.5px;color:var(--sub);font-weight:600;letter-spacing:0}
.wrap{max-width:680px;margin:0 auto;padding:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h1{font-size:21px;letter-spacing:-.02em;margin-bottom:8px}h2{font-size:15px;margin-bottom:6px}
.lede{font-size:13.5px;color:var(--sub)}
/* 「배운 데까지만 낸다」 를 화면에 적는 자리. 적어 두어야 학생이 이상하다고
   느낄 때 그것이 진짜인지 서로 확인할 수 있다. */
.scope{font-size:12.5px;color:var(--sub);background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;margin:10px 0 0;line-height:1.6}
.scope.thin{color:var(--brass);border-color:var(--brass);background:rgba(176,124,44,.06)}
/* 옛 링크(회차 없음)로 들어왔을 때 고르는 자리. 손가락으로 눌러야 한다. */
.rpicks{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.rpick{min-width:56px;min-height:44px;padding:11px 13px;font-size:14px;font-weight:700;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px}
.rpick:hover{border-color:var(--teal);color:var(--teal)}
.intro{border-left:4px solid var(--brass);background:linear-gradient(180deg,#FAF6EF,var(--surface))}
.badgeA{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;color:#fff;background:var(--brass);padding:4px 11px;border-radius:20px;margin-bottom:10px}
button{font-family:inherit;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:.15s}
.btn{width:100%;padding:14px;font-size:15px;background:var(--teal);color:#fff}.btn:hover{background:var(--teal-d)}
.btn:disabled{background:var(--line);color:var(--faint);cursor:not-allowed}
.q{padding:15px 0;border-bottom:1px solid var(--line2)}.q:last-child{border-bottom:0}
.qn{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;color:var(--brass);margin-bottom:6px}
.qs{font-size:14.5px;margin-bottom:11px;line-height:1.5}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:260px}
.ox button{padding:11px 0;font-size:17px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.ox button.o.sel{background:var(--o-bg);color:var(--o);border-color:var(--o)}
.ox button.x.sel{background:var(--x-bg);color:var(--x);border-color:var(--x)}
.fb{margin-top:10px;font-size:13px;border-radius:9px;padding:10px 12px;line-height:1.5}
.fb.ok{background:var(--o-bg);color:#15703D}.fb.no{background:var(--x-bg);color:#8E2F22}
.fb .cor{font-weight:800}
.result{text-align:center}.score{font-family:'JetBrains Mono',monospace;font-size:46px;font-weight:800;color:var(--teal)}
.smsg{font-size:14px;color:var(--ink);margin:8px 0 4px}.snote{font-size:12.5px;color:var(--sub)}
.prog{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.pbar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--brass);border-radius:6px;transition:width .3s}
.pt{font-size:12px;font-weight:700;color:var(--brass);white-space:nowrap}
.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:600;width:100%;padding:12px;font-size:14px;margin-top:10px}
.ghost:hover{border-color:var(--teal);color:var(--teal)}
.muted{color:var(--faint);font-size:12px}
.reviewbox{border-left:4px solid var(--brass)}
.mchips{display:flex;flex-wrap:wrap;gap:7px}
.mchip{font-size:12.5px;background:var(--brass-soft);color:#7A5E20;border-radius:20px;padding:5px 12px;font-weight:600}
/* 복습 칩이 개념 강의로 이어진다(concept-lecture-dt.json 의 map[mis]). 표에 없으면 이름만. */
a.mchip.lec{color:var(--teal-d);background:var(--teal-soft);border:1px solid var(--teal-line);text-decoration:none}
a.mchip.lec:hover{border-color:var(--teal)}
a.mchip.lec small{font-size:11.5px;font-weight:700;margin-left:5px}
/* 「결과 복사」 — 이름 없는 평문 한 줄. 푼 결과는 이 화면을 닫으면 사라진다. */
.copybtn{background:var(--surface);color:var(--teal-d);border:1.5px solid var(--teal-line);font-weight:700;padding:10px 14px;font-size:13.5px;margin-top:12px}
.copybtn:hover{border-color:var(--teal)}
.copybtn.copied{background:var(--teal-soft);border-color:var(--teal)}
/* 결과의 두 갈래(약한 개념 다시 · 두 개념 엮기)와 저장 한 줄 */
.halves{margin:12px auto 0;max-width:340px;text-align:left;border-top:1px solid var(--line2)}
.half{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line2);font-size:13.5px}
.half span{color:var(--sub)}.half b{font-family:'Pretendard',sans-serif;white-space:nowrap}
.savest{font-size:12.5px;color:var(--sub);margin-top:9px}
.savest.ok{color:#15703D}.savest.fail{color:#8E2F22}
.savebtn{background:var(--surface);color:var(--teal-d);border:1.5px solid var(--teal-line);font-size:12.5px;padding:7px 12px;margin-left:6px;min-height:36px}
.qmis{float:right;font-family:'Pretendard',sans-serif;font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:0}
.result + .card .btn,.card + .btn{margin-top:0}
.btn + .ghost{margin-top:9px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

const CHALLENGE_BANK={"CH1": [{"c": "CH1-006", "m": "실험식 도출", "ol": "**실험식 = 첨자를 최대공약수로 나눈 가장 간단한 비.**", "forms": [{"a": "O", "s": "포도당(C₆H₁₂O₆)과 아세트산(CH₃COOH)의 실험식은 같다."}]}, {"c": "CH1-013", "m": "루이스 전자점식", "ol": "**점 = 원자가 전자만**(O 6점, He 2점). 결합에 쓰이는 전자라 안쪽은 빼고, 이 점이 결합·모양·옥텟 분석의 출발점이다.", "forms": [{"a": "X", "s": "산소(O)와 황(S) 원자의 루이스 전자점식은 점의 개수가 서로 다르다."}]}, {"c": "CH1-036", "m": "평균 원자량", "ol": "**평균 원자량 = 질량수 × 존재 비율의 합**(보통 소수).", "forms": [{"a": "X", "s": "어떤 원소의 평균 원자량은 가장 존재비가 큰 동위원소의 질량수와 항상 같다."}]}, {"c": "CH1-046", "m": "기체 몰 환산", "ol": "**기체 몰수 = 부피 / 22.4**(11.2 L = 0.5몰). 22.4 L가 1몰당 부피라, 부피를 그것으로 나누면 몰수가 된다.", "forms": [{"a": "O", "s": "0°C, 1기압에서 5.6 L 기체는 0.25몰이다."}]}, {"c": "CH1-047", "m": "몰 비교", "ol": "**같은 질량이면 분자량 작을수록 몰수 큼**(몰수 ∝ 1/분자량). 가벼운 분자가 같은 질량에 더 많이 들어가고, 질량과 개수는 다른 잣대다.", "forms": [{"a": "X", "s": "같은 질량의 H₂와 O₂ 중 몰수가 더 큰 것은 O₂이다."}]}, {"c": "CH1-049", "m": "밀도-분자량", "ol": "**분자량 = 밀도 × 22.4**(곱셈). 분자량 클수록 밀도 큼.", "forms": [{"a": "O", "s": "0°C, 1기압에서 기체의 밀도(g/L)에 22.4를 곱하면 분자량을 구할 수 있다."}]}, {"c": "CH1-053", "m": "몰-부피", "ol": "**부피 = 몰수 × 22.4 L.** CO₂ 11.2 L = 0.5몰.", "forms": [{"a": "O", "s": "0°C, 1기압에서 CO₂ 11.2 L는 0.5몰이다."}]}, {"c": "CH1-061", "m": "배수 비례 적용", "ol": "**같은 탄소에 대한 CO:CO₂ 산소비 = 1:2.**", "forms": [{"a": "X", "s": "CO와 CO₂에서 같은 질량의 탄소와 결합한 산소의 질량비는 1:1이다."}]}, {"c": "CH1-071", "m": "양적관계 질량", "ol": "**탄소 12 g + 산소 32 g → CO₂ 44 g.**", "forms": [{"a": "X", "s": "C + O₂ → CO₂ 에서 탄소 12 g이 완전 연소하면 CO₂ 22 g이 생성된다."}]}, {"c": "CH1-073", "m": "분자설 도입", "ol": "**아보가드로가 분자 개념으로 기체 반응 법칙 설명.**", "forms": [{"a": "X", "s": "기체 반응 법칙은 돌턴의 원자설만으로 완전히 설명된다."}]}, {"c": "CH1-075", "m": "양적관계 몰수변화", "ol": "**계수 합 비교로 전체 몰수 변화 판단.** N₂ + 3H₂ → 2NH₃는 감소.", "forms": [{"a": "O", "s": "N₂ + 3H₂ → 2NH₃ 에서 반응이 진행되면 전체 기체 몰수는 감소한다."}]}, {"c": "CH1-094", "m": "동위원소 vs 동중원소", "ol": "**동위원소(원자번호 같음) vs 동중원소(질량수 같음, 다른 원소).**", "forms": [{"a": "X", "s": "질량수가 같고 원자번호가 다른 원자는 동위원소이다."}]}, {"c": "CH1-149", "m": "등전자 이온", "ol": "**등전자 이온: 핵전하 클수록 "}]}, {"c": "CH1-247", "m": "상태 함수", "ol": "**엔탈피 = 상태 함수(경로 무관)**(헤스 법칙의 근거).", "forms": [{"a": "O", "s": "엔탈피는 경로와 관계없이 처음과 나중 상태로만 결정되는 상태 함수이다."}]}, {"c": "CH1-253", "m": "평형 상수 식", "ol": "**K = 생성물/반응물(계수만큼 제곱, 고체·순수액체 제외).**", "forms": [{"a": "X", "s": "평형 상수 식에는 고체와 순수한 액체의 농도도 포함한다."}]}, {"c": "CH1-257", "m": "반응 지수 방향", "ol": "**Q < K 정반응, Q > K 역반응, Q = K 평형.** ΔG = RT ln(Q/K)라 Q와 K 비교는 곧 ΔG의 부호이고, 반응은 Q=K로 굴러간다.", "forms": [{"a": "X", "s": "Q < K이면 역반응이 우세하게 진행된다."}, {"a": "O", "s": "Q > K이면 역반응이 우세하게 진행된다."}, {"a": "X", "s": "Q < K이면 역반응이 우세하다."}, {"a": "X", "s": "Q > K이면 정반응이 우세하다."}, {"a": "O", "s": "Q < K이면 정반응이 우세하다."}]}, {"c": "CH1-260", "m": "평형 상수 단위", "ol": "**K 단위 = 반응에 따라 다름**(보통 무차원).", "forms": [{"a": "X", "s": "평형 상수 K의 단위는 항상 mol/L이다."}]}, {"c": "CH1-267", "m": "온도와 평형 상수", "ol": "**K는 온도로만 변함**(발열 온도↑ → K↓, 흡열 온도↑ → K↑).", "forms": [{"a": "X", "s": "발열 반응에서 온도를 높이면 평형 상수가 커진다."}]}, {"c": "CH1-268", "m": "압력 변화", "ol": "**압력↑ → 분자 수 적은 쪽, 압력↓ → 많은 쪽**(같으면 이동 없음). Q를 K로 되돌리는 것이고, 일정 부피의 비활성 기체는 이동을 안 일으킨다.", "forms": [{"a": "X", "s": "압력을 높이면(부피를 줄이면) 기체 분자 수가 많은 쪽으로 평형이 이동한다."}, {"a": "O", "s": "압력을 낮추면(부피를 늘리면) 기체 분자 수가 많은 쪽으로 평형이 이동한다."}, {"a": "X", "s": "압력을 높이면 기체 분자 수가 많은 쪽으로 평형이 이동한다."}, {"a": "O", "s": "압력을 높이면 기체 분자 수가 적은 쪽으로 평형이 이동한다."}]}, {"c": "CH1-269", "m": "비활성 기체", "ol": "**일정 부피 비활성 기체 첨가 → 평형 이동 없음**(분압 불변).", "forms": [{"a": "X", "s": "일정한 부피에서 비활성 기체를 넣으면 평형이 크게 이동한다."}]}, {"c": "CH1-270", "m": "촉매", "ol": "**촉매 = 평형에 빨리 도달**(위치·K·수득률 그대로). 공유 봉우리를 낮춰 양방향을 가속할 뿐이라, 수율은 압력·온도·생성물 제거로 얻는다.", "forms": [{"a": "X", "s": "촉매는 생성물의 양(수득률)을 증가시킨다."}]}, {"c": "CH1-271", "m": "압력 적용", "ol": "**N₂+3H₂⇌2NH₃: 압력↑ → NH₃ 쪽**(고압 유리).", "forms": [{"a": "O", "s": "N₂ + 3H₂ ⇌ 2NH₃에서 압력을 높이면 NH₃가 생성되는 쪽으로 이동한다."}]}, {"c": "CH1-272", "m": "온도 적용", "ol": "**N₂+3H₂⇌2NH₃(발열): 온도↓ → NH₃ 증가.**", "forms": [{"a": "O", "s": "N₂ + 3H₂ ⇌ 2NH₃(발열)에서 온도를 낮추면 NH₃ 생성이 늘어난다."}]}, {"c": "CH1-273", "m": "평형 이동과 K", "ol": "**농도·압력으로 평형 이동해도 K는 그대로**(온도만 K 변화).", "forms": [{"a": "X", "s": "압력 변화로 평형이 이동하면 새로운 평형에서 K 값이 달라진다."}]}, {"c": "CH1-284", "m": "포화 용액", "ol": "**포화 용액 = 용해 평형(동적)**(용해 속도 = 석출 속도). 멈춘 게 아니라 양방향이 맞물린 균형이고, 화학 평형·증기압과 같은 구조다.", "forms": [{"a": "X", "s": "포화 용액에서는 더 이상 용질이 녹지 않으므로 용질 입자의 이동도 없다."}]}, {"c": "CH1-285", "m": "불포화 용액", "ol": "**불포화 용액 = 더 녹일 수 있음**(용해 속도 > 석출 속도).", "forms": [{"a": "X", "s": "불포화 용액에서는 석출 속도가 용해 속도보다 크다."}]}, {"c": "CH1-302", "m": "희석 계산", "ol": "**2 M 100 mL → 200 mL = 1 M**(부피 2배 → 농도 절반).", "forms": [{"a": "X", "s": "2 M 용액 100 mL를 물로 희석하여 200 mL로 만들면 4 M이 된다."}]}, {"c": "CH1-303", "m": "농도 환산", "ol": "**농도 환산 = 밀도 + 몰질량 필요.**", "forms": [{"a": "O", "s": "퍼센트 농도를 몰농도로 바꾸려면 용액의 밀도가 필요하다."}]}, {"c": "CH1-304", "m": "몰농도와 온도", "ol": "**몰농도는 온도에 따라 변함**(부피가 변하기 때문).", "forms": [{"a": "O", "s": "몰농도는 온도가 변하면 값이 달라질 수 있다."}, {"a": "O", "s": "몰농도가 온도에 따라 변하는 것은 용액의 부피가 온도에 따라 변하기 때문이다."}]}, {"c": "CH1-305", "m": "퍼센트 농도와 온도", "ol": "**퍼센트 농도는 온도와 무관**(질량 기준).", "forms": [{"a": "X", "s": "퍼센트 농도는 온도에 따라 변한다."}]}, {"c": "CH1-309", "m": "농도 비교", "ol": "**퍼센트 농도 같아도 몰질량 다르면 몰농도 다름.**", "forms": [{"a": "O", "s": "퍼센트 농도가 같아도 용질의 몰질량이 다르면 몰농도가 다를 수 있다."}]}, {"c": "CH1-311", "m": "용액 부피", "ol": "**용액 부피 ≠ 단순 합**(입자가 섞이며 부피 변함).", "forms": [{"a": "X", "s": "용액의 부피는 용질과 용매의 부피를 단순히 더한 값과 항상 같다."}]}, {"c": "CH1-316", "m": "Kw와 온도", "ol": "**Kw는 온도에 따라 변함**(25°C에서만 10⁻¹⁴).", "forms": [{"a": "X", "s": "Kw는 온도가 변해도 항상 일정하다."}]}, {"c": "CH1-326", "m": "pH 비교", "ol": "**pH 차이 n → [H⁺] 10ⁿ배 차이**(pH 차이 2 = 100배).", "forms": [{"a": "O", "s": "pH 3인 용액은 pH 5인 용액보다 [H⁺]가 100배 크다."}]}, {"c": "CH1-332", "m": "희석과 pH", "ol": "**희석 → pH가 7에 가까워짐**(산성↑, 염기성↓).", "forms": [{"a": "X", "s": "산성 용액에 물을 많이 넣어 묽히면 pH는 더 작아진다."}]}, {"c": "CH1-333", "m": "Kw 적용", "ol": "**[H⁺][OH⁻] = 10⁻¹⁴**(10⁻⁵ → 10⁻⁹).", "forms": [{"a": "X", "s": "25°C에서 [H⁺]가 10⁻⁵ M이면 [OH⁻]는 10⁻⁵ M이다."}]}, {"c": "CH1-334", "m": "Kw 일정성", "ol": "**같은 온도면 액성과 무관하게 Kw 동일**(25°C 10⁻¹⁴).", "forms": [{"a": "O", "s": "같은 온도에서 산성, 중성, 염기성 용액 모두 K "CH1-476", "m": "전자전이·스펙트럼 계열", "ol": "**4→1 전이와 4→2 전이에서 방출되는 빛의 에너지 비는 5:1이다.**", "forms": [{"a": "O", "s": "4→1 전이와 4→2 전이에서 방출되는 빛의 에너지 비는 5:1이다."}]}, {"c": "CH1-477", "m": "전자전이·스펙트럼 계열", "ol": "**방출되는 빛의 에너지가 클수록 진동수는 크고 파장은 짧다.**", "forms": [{"a": "X", "s": "방출되는 빛의 에너지가 클수록 진동수는 작고 파장은 길다."}]}], "CH1S": [{"c": "CH1S-001", "m": "구성 입자 질량·전하", "ol": "**양성자 ≈ 중성자 ≫ 전자(약 1/1836)**, 전하는 +1 : 0 : −1이다.", "forms": [{"a": "X", "s": "¹H⁺ 이온 1개의 질량은 입자 수가 절반이므로 ¹H 원자 1개 질량의 약 절반이다."}]}, {"c": "CH1S-002", "m": "질량은 핵·성질은 전자", "ol": "**질량은 핵, 성질은 전자.** 전자 한 개 차이로 성질이 바뀐다.", "forms": [{"a": "X", "s": "Na 원자와 Na⁺ 이온은 질량이 거의 같으므로 화학적 성질도 거의 같다."}]}, {"c": "CH1S-007", "m": "양성자 수≠중성자 수", "ol": "**양성자 수 ≠ 중성자 수가 보통이다.** 무거운 핵일수록 중성자가 많다.", "forms": [{"a": "X", "s": "질량수가 원자 번호의 2배보다 크면 중성자 수는 양성자 수보다 적다."}]}, {"c": "CH1S-008", "m": "길이 단위 환산", "ol": "**1 Å = 100 pm = 0.1 nm = 10⁻¹⁰ m.** 지수로 바꿔 비교한다.", "forms": [{"a": "X", "s": "반지름이 1.5 Å인 원자의 지름은 30 nm이다."}]}, {"c": "CH1S-010", "m": "부피 비는 세제곱", "ol": "**부피 비 = (길이 비)³.** 길이 10⁵배면 부피는 10¹⁵배이다.", "forms": [{"a": "O", "s": "지름이 2×10⁻¹⁰ m인 원자의 부피는 반지름이 1×10⁻¹⁵ m인 원자핵 부피의 10¹⁵배이다."}, {"a": "X", "s": "반지름 50 pm인 원자의 부피는 반지름 5 fm인 원자핵 부피의 10⁴배이다."}, {"a": "X", "s": "원자핵 반지름이 원자 반지름의 10⁻⁵배이면 원자핵의 밀도는 원자 전체 평균 밀도의 약 10⁵배이다."}, {"a": "O", "s": "지름이 4 Å인 원자의 부피는 반지름이 1 Å인 원자 부피의 8배이다."}]}, {"c": "CH1S-011", "m": "원자 개수·부피 어림", "ol": "**단위를 m·m³로 먼저 통일**하고, 1 cm³ = 10⁻⁶ m³를 잊지 않는다.", "forms": [{"a": "X", "s": "1 mol의 부피가 10 cm³인 금속에서 원자 1개가 차지하는 부피는 약 1.7×10⁻²³ m³이다."}, {"a": "X", "s": "지름 2 Å인 원자를 한 변이 2 nm인 정육면체에 줄 맞춰 쌓으면 10개가 들어간다."}]}, {"c": "CH1S-014", "m": "원자량 기준 ¹²C", "ol": "**원자량 = ¹²C = 12 기준 상대 질량**(단위 없음). 탄소 평균은 12.01이다.", "forms": [{"a": "X", "s": "원자량의 기준이 탄소이므로 주기율표에 적힌 탄소의 원자량은 정확히 12이다."}]}, {"c": "CH1S-015", "m": "질량수≠원자량", "ol": "**질량수 = 개수(정수), 원자량 = 상대 질량(평균, 소수)**.", "forms": [{"a": "X", "s": "원자량 표에 산소가 16으로 적혀 있으므로 산소 원자는 모두 질량수가 16이다."}]}, {"c": "CH1S-016", "m": "평균 원자량 계산", "ol": "**평균 원자량 = Σ(질량 × 존재비)**, 많은 쪽에 가깝다.", "forms": [{"a": "O", "s": "질량수를 원자량으로 보면, ²⁴Mg 79 %, ²⁵Mg 10 %, ²⁶Mg 11 %인 마그네슘의 평균 원자량은 약 24.3이다."}, {"a": "X", "s": "질량수를 원자량으로 보면, ⁶³Cu 69 %, ⁶⁵Cu 31 %인 구리의 평균 원자량은 64보다 크다."}]}, {"c": "CH1S-017", "m": "동위원소 존재비 역산", "ol": "**x와 1 − x로 식을 세우고**, 평균이 가까운 쪽이 더 많은지 검산한다.", "forms": [{"a": "O", "s": "원자량 69, 71인 두 동위원소로만 된 Ga의 원자량이 69.8이면 ⁶⁹Ga의 존재비는 60 %이다."}, {"a": "O", "s": "원자량 6, 7인 두 동위원소로만 된 Li의 원자량이 6.9이면 ⁶Li : ⁷Li의 원자 수 비는 1 : 9이다."}, {"a": "X", "s": "Cl₂의 평균 분자량이 70.9이고 Cl이 ³⁵Cl과 ³⁷Cl로만 이루어지면 ³⁵Cl의 존재비는 22.5 %이다."}, {"a": "O", "s": "원자량 63, 65인 두 동위원소로만 된 Cu의 원자량이 63.5이면 ⁶³Cu : ⁶⁵Cu의 원자 수 비는 3 : 1이다."}]}, {"c": "CH1S-018", "m": "질량 스펙트럼 봉우리", "ol": "**봉우리 높이 = 존재비의 곱**, 같은 원소의 서로 다른 동위원소 짝(³⁵Cl³⁷Cl)만 ×2이다.", "forms": [{"a": "O", "s": "⁷⁹Br : ⁸¹Br = 1 : 1, ³⁵Cl : ³⁷Cl = 3 : 1이면 BrCl의 질량 스펙트럼에서 분자 이온 봉우리는 3개이다."}, {"a": "X", "s": "³⁵Cl : ³⁷Cl = 3 : 1일 때 Cl₂의 분자 이온 봉우리 가운데 가장 높은 것은 m/z 72이다."}, {"a": "X", "s": "³⁵Cl : ³⁷Cl = 3 : 1일 때 Cl₂의 m/z 72 봉우리와 74 봉우리의 세기 비는 3 : 1이다."}]}, {"c": "CH1S-021", "m": "동소체≠동위원소", "ol": "**동소체 = 물질(배열) 차이, 동위원소 = 원자(중성자 수) 차이**.", "forms": [{"a": "X", "s": "¹⁶O₂와 ¹⁸O₂는 원자의 질량수가 다르므로 서로 동소체이다."}]}, {"c": "CH1S-023", "m": "분자식=실험식×n", "ol": "**n = 분자량 ÷ 실험식량**, 분자식 = 실험식 × n이다.", "forms": [{"a": "O", "s": "C 85.7 %, H 14.3 %이고 분자량이 56인 탄화수소의 분자식은 C₄H₈이다."}, {"a": "X", "s": "실험식이 CH₂O인 화합물 0.1 mol의 질량이 6.0 g이면 분자식은 C₃H₆O₃이다."}]}, {"c": "CH1S-025", "m": "분자량·화학식량", "ol": "**분자가 있으면 분자량, 없으면 화학식량**(수치 계산법은 같다).", "forms": [{"a": "O", "s": "Ca(OH)₂는 분자가 없는 이온 결합 물질이며 화학식량은 74이다."}]}, {"c": "CH1S-029", "m": "무엇의 몰수인가", "ol": "**\"무엇의\" 몰수인지 먼저 정하고**, 분자 몰수에 개수를 곱한다.", "forms": [{"a": "O", "s": "Al₂(SO₄)₃ 0.1 mol이 물에 녹아 모두 이온으로 나뉘면 이온은 모두 0.5 mol이다."}, {"a": "X", "s": "H₂O 9 g과 NH₃ 8.5 g에 들어 있는 전체 원자 수는 같다."}, {"a": "O", "s": "NH₄⁺ 1.8 g에 들어 있는 전자는 모두 1 mol이다."}]}, {"c": "CH1S-031", "m": "아보가드로 법칙", "ol": "**같은 T·P·V이면 같은 분자 수**(같은 몰수), 질량은 다르다.", "forms": [{"a": "X", "s": "같은 온도와 압력에서 O₂ 16 g과 같은 부피를 차지하는 CH₄는 16 g이다."}]}, {"c": "CH1S-032", "m": "기체 밀도와 분자량", "ol": "**같은 T·P에서 밀도 비 = 분자량 비.** 22.4는 0 °C, 1 atm 전용이다.", "forms": [{"a": "X", "s": "25 °C, 1 atm에서 O₂ 기체의 밀도는 32 ÷ 22.4 ≈ 1.43 g/L이다."}]}, {"c": "CH1S-033", "m": "평균 몰 질량", "ol": "**평균 몰 질량 = 전체 질량 ÷ 전체 몰수**, 몰분율로 가중한다.", "forms": [{"a": "X", "s": "H₂ 4 g과 O₂ 32 g을 섞은 기체의 평균 몰 질량은 17 g/mol이다."}]}, {"c": "CH1S-035", "m": "질량 조성→실험식", "ol": "**질량 ÷ 원자량 → 몰수 비 → 가장 간단한 정수비**.", "forms": [{"a": "O", "s": "질량 조성이 Fe 70 %, O 30 %인 철 산화물(Fe = 56)의 실험식은 Fe₂O₃이다."}, {"a": "X", "s": "질량 조성이 S 40 %, O 60 %인 황 산화물(S = 32)의 실험식은 SO₂이다."}]}, {"c": "CH1S-036", "m": "배수 비례 비교", "ol": "**한 원소를 고정하고 다른 원소의 질량을 비교**하면 정수비이다.", "forms": [{"a": "O", "s": "N₂O, NO, NO₂에서 일정 질량의 질소와 결합하는 산소의 질량비는 1 : 2 : 4이다."}, {"a": "O", "s": "S(원자량 32) 1 g과 결합한 O가 각각 1 g, 1.5 g인 두 황 산화물의 실험식은 SO₂, SO₃이다."}]}, {"c": "CH1S-037", "m": "보일·샤를 법칙", "ol": "**PV 일정(보일), V/T 일정(샤를)**, T는 반드시 K이다.", "forms": [{"a": "X", "s": "일정량의 기체를 1 atm, 27 °C, 6 L에서 2 atm, 327 °C로 바꾸면 부피는 6 L보다 작아진다."}]}, {"c": "CH1S-038", "m": "PV=nRT 단위·절대 온도", "ol": "**R = 0.082 → atm·L·K.** 대입 전에 단위부터 맞춘다.", "forms": [{"a": "X", "s": "R = 0.082 atm·L/(mol·K)일 때 27 °C, 0.82 atm에서 기체 1 mol의 부피는 약 2.7 L이다."}]}, {"c": "CH1S-039", "m": "분자량 M=dRT/P", "ol": "**M = dRT/P**, P가 1 atm이 아니면 꼭 나눈다.", "forms": [{"a": "X", "s": "127 °C, 0.5 atm에서 밀도가 1.0 g/L인 기체의 분자량은 약 33이다."}, {"a": "X", "s": "27 °C, 1 atm에서 2.46 L 용기를 채운 기체 3.2 g의 분자량은 16이다."}]}, {"c": "CH1S-040", "m": "부분 압력", "ol": "**P(성분) = 몰분율 × P(전체)**, 섞으면 각자 전체 부피로 퍼진다.", "forms": [{"a": "X", "s": "같은 온도에서 He 3 atm이 든 1 L 용기와 Ne 1.5 atm이 든 2 L 용기를 이으면 He의 부분 압력은 1.5 atm이다."}, {"a": "O", "s": "물 위로 모은 H₂의 전체 압력이 1.00 atm이고 그 온도의 수증기압이 0.03 atm이면 H₂의 몰분율은 0.97이다."}, {"a": "O", "s": "같은 온도에서 2 atm인 N₂ 2 L와 1 atm인 O₂ 2 L를 콕으로 이으면 전체 압력은 1.5 atm이다."}]}, {"c": "CH1S-041", "m": "실제 기체의 편차", "ol": "**고온·저압일수록 이상 기체에 가깝다**(분자가 멀리 떨어진다).", "forms": [{"a": "O", "s": "압력이 매우 높으면 분자 자체의 부피 때문에 실제 기체의 부피는 같은 조건의 이상 기체보다 커진다."}, {"a": "X", "s": "0 °C, 1 atm에서 NH₃ 1 mol의 실제 부피가 22.4 L보다 작은 것은 분자 자체의 부피 때문이다."}]}, {"c": "CH1S-042", "m": "기체 입자 수 계산", "ol": "**PV = nRT → n → ×6.02×10²³ → ×원자 수**의 순서를 지킨다.", "forms": [{"a": "O", "s": "27 °C, 1 atm에서 부피가 24.6 L인 CH₄에 들어 있는 수소 원자는 약 2.4×10²⁴개이다."}, {"a": "X", "s": "27 °C, 1.0×10⁻⁶ atm인 기체 1 L에 들어 있는 분자는 약 2.4×10¹⁹개이다."}, {"a": "O", "s": "27 °C, 2 atm에서 부피가 12.3 L인 N₂에 들어 있는 질소 원자는 약 1.2×10²⁴개이다."}]}, {"c": "CH1S-043", "m": "계수만 조절한다", "ol": "**계수만 바꾸고 첨자는 건드리지 않는다.** 원자 수가 보존된다.", "forms": [{"a": "O", "s": "Al + H⁺ → Al³⁺ + H₂는 화학식은 그대로 두고 계수만 바꿔 2Al + 6H⁺ → 2Al³⁺ + 3H₂로 맞춘다."}]}, {"c": "CH1S-044", "m": "가장 간단한 정수비", "ol": "**가장 간단한 정수비, 1은 생략**(합을 셀 때는 1도 더한다).", "forms": [{"a": "X", "s": "C₂H₆의 완전 연소 반응식을 가장 간단한 정수비로 완성하면 계수의 합은 13이다."}]}, {"c": "CH1S-045", "m": "연소 반응 계수", "ol": "**O₂ = x + y/4 − z/2**(C → H → O 순으로 맞춘다).", "forms": [{"a": "O", "s": "포도당(C₆H₁₂O₆) 1 mol의 완전 연소에 필요한 O₂는 6 mol이다."}]}, {"c": "CH1S-046", "m": "미정계수법", "ol": "**원소마다 방정식 → 하나를 정하고 풀기 → 정수비로**.", "forms": [{"a": "O", "s": "aNH₃ + bO₂ → cNO + dH₂O를 가장 간단한 정수비로 맞추면 a + b + c + d = 19이다."}, {"a": "X", "s": "aAl + bHCl → cAlCl₃ + dH₂를 가장 간단한 정수비로 맞추면 d = 2이다."}, {"a": "X", "s": "aKClO₃ → bKCl + cO₂를 가장 간단한 정수비로 맞추면 a + b + c = 5이다."}]}, {"c": "CH1S-047", "m": "알짜 이온 반응식", "ol": "**이온으로 풀고 → 구경꾼 이온을 지운다.** 전하도 맞춘다.", "forms": [{"a": "O", "s": "Mg과 묽은 염산의 알짜 이온 반응식은 Mg + 2H⁺ → Mg²⁺ + H₂이고 Cl⁻는 구경꾼 이온이다."}]}, {"c": "CH1S-048", "m": "이온으로 쪼개지 않는 것", "ol": "**녹는 강전해질만 이온으로**, 앙금·기체·물·약전해질은 그대로 쓴다.", "forms": [{"a": "X", "s": "CaCO₃와 묽은 염산의 알짜 이온 반응식은 CO₃²⁻ + 2H⁺ → H₂O + CO₂이다."}, {"a": "O", "s": "CaCO₃와 묽은 염산의 알짜 이온 반응식은 CaCO₃ + 2H⁺ → Ca²⁺ + H₂O + CO₂이다."}, {"a": "O", "s": "BaCl₂ 수용액과 Na₂SO₄ 수용액이 앙금 BaSO₄를 만들 때 알짜 이온 반응식은 Ba²⁺ + SO₄²⁻ → BaSO₄이다."}]}, {"c": "CH1S-049", "m": "계수비=몰비=입자 수 비", "ol": "**계수비 = 몰비 = 입자 수 비.** 반응식에 적힌 열의 양도 계수만큼 반응할 때의 값이다.", "forms": [{"a": "X", "s": "2H₂(g) + O₂(g) → 2H₂O(l), ΔH = −572 kJ에서 H₂O(l) 1 mol이 생기면 572 kJ이 방출된다."}]}, {"c": "CH1S-050", "m": "계수비≠질량비", "ol": "**질량비 = 계수 × 몰 질량의 비.** 계수비를 g에 바로 쓰지 않는다.", "forms": [{"a": "X", "s": "N₂ + 3H₂ → 2NH₃에서 H₂ 6 g과 반응하는 N₂는 계수비 1 : 3에 따라 2 g이다."}]}, {"c": "CH1S-053", "m": "한계 반응물 판정", "ol": "**몰수 ÷ 계수가 작은 쪽이 한계 반응물**(질량·몰수만 보면 틀린다).", "forms": [{"a": "X", "s": "N₂ + 3H₂ → 2NH₃에서 N₂ 2 mol과 H₂ 3 mol을 반응시키면 몰수가 적은 N₂가 한계 반응물이다."}, {"a": "X", "s": "Mg(원자량 24) 4.8 g과 O₂ 4.8 g을 2Mg + O₂ → 2MgO로 반응시키면 Mg가 남는다."}]}, {"c": "CH1S-054", "m": "남는 반응물·최대 생성량", "ol": "**생성량은 한계 반응물로, 남는 양은 처음 − 반응한 양으로** 구한다.", "forms": [{"a": "O", "s": "N₂ 28 g과 H₂ 9 g을 N₂ + 3H₂ → 2NH₃로 반응시키면 NH₃는 최대 34 g 생긴다."}, {"a": "O", "s": "2H₂ + O₂ → 2H₂O에서 H₂ 6 g과 O₂ 32 g을 반응시키면 H₂ 2 g이 남는다."}, {"a": "O", "s": "2Mg + O₂ → 2MgO에서 Mg 12 g과 O₂ 16 g을 반응시키면 MgO는 최대 20 g 생긴다."}]}, {"c": "CH1S-055", "m": "수득률", "ol": "**수득률 = 실제 ÷ 이론 × 100**, 100 %를 넘을 수 없다.", "forms": [{"a": "O", "s": "CH₄ 3.2 g을 충분한 O₂로 태워 CO₂ 6.6 g을 얻었다면 CO₂의 수득률은 75 %이다."}, {"a": "X", "s": "C 12 g을 충분한 O₂로 태워 CO₂ 33 g을 얻었다면 CO₂의 수득률은 33 %이다."}]}, {"c": "CH1S-056", "m": "순도 계산", "ol": "**생성물 → 몰 → 순물질 질량 → ÷ 시료 질량**.", "forms": [{"a": "X", "s": "불순물이 반응하지 않는 CaCO₃ 시료 20 g에 충분한 염산을 넣어 CO₂ 6.6 g을 얻었다면 순도는 33 %이다."}, {"a": "X", "s": "불순물이 반응하지 않는 Mg 시료 6 g에 충분한 염산을 넣어 H₂ 0.2 mol을 얻었다면 Mg의 순도는 20 %이다."}]}, {"c": "CH1S-057", "m": "연소 분석", "ol": "**C는 CO₂에서, H는 H₂O에서, O는 빼기로** 구한다.", "forms": [{"a": "X", "s": "C, H, O로 된 물질 3.2 g을 완전 연소시켜 CO₂ 4.4 g과 H₂O 3.6 g을 얻었다면 실험식은 CH₄이다."}, {"a": "O", "s": "C, H로만 된 물질을 완전 연소시켜 CO₂ 8.8 g과 H₂O 5.4 g을 얻었다면 실험식은 CH₃이다."}, {"a": "X", "s": "C, H, O로 된 시료 4.6 g을 완전 연소시켜 CO₂ 8.8 g과 H₂O 5.4 g을 얻었다면 시료에 O는 없다."}]}, {"c": "CH1S-058", "m": "기체 몰수·압력 변화", "ol": "**V·T 일정이면 P ∝ 기체 몰수.** 기체 계수 합을 비교한다.", "forms": [{"a": "O", "s": "부피·온도가 일정할 때 CO 2 mol과 O₂ 2 mol이 2CO + O₂ → 2CO₂로 완결되면 전체 압력은 처음의 3/4이다."}]}, {"c": "CH1S-059", "m": "반응 후 부분 압력", "ol": "**V·T 일정이면 부분 압력 = 몰수처럼 계산**한다.", "forms": [{"a": "O", "s": "부피·온도가 일정할 때 H₂ 2 atm, O₂ 2 atm이 2H₂ + O₂ → 2H₂O(g)로 완결되면 전체 압력은 3 atm이다."}, {"a": "X", "s": "부피·온도가 일정할 때 N₂ 1 atm, H₂ 1.5 atm이 N₂ + 3H₂ → 2NH₃로 완결되면 NH₃의 몰분율은 0.5이다."}, {"a": "X", "s": "부피·온도가 일정할 때 CH₄ 1 atm과 O₂ 3 atm이 완전 연소해 H₂O(g)가 생기면 O₂의 몰분율은 1/2이다."}]}, {"c": "CH1S-060", "m": "방사성 붕괴의 뜻", "ol": "**방사성 붕괴 = 핵이 바뀌는 변화**, 원소가 바뀔 수 있다.", "forms": [{"a": "X", "s": "핵반응식도 화학 반응식처럼 양변의 원자 종류와 개수가 같아야 한다."}]}, {"c": "CH1S-061", "m": "α 붕괴 변화", "ol": "**α 붕괴: A −4, Z −2**(He 원자핵을 내보낸다).", "forms": [{"a": "O", "s": "²³²Th(원자 번호 90)가 α 붕괴를 2번 하면 질량수 224, 원자 번호 86인 원자핵이 된다."}]}, {"c": "CH1S-062", "m": "β 붕괴 변화", "ol": "**β⁻: Z +1, β⁺: Z −1, 질량수는 둘 다 그대로**.", "forms": [{"a": "O", "s": "¹⁸F(원자 번호 9)가 β⁺ 붕괴하면 양성자 8개, 중성자 10개인 ¹⁸O가 된다."}]}, {"c": "CH1S-063", "m": "γ 붕괴·핵반응식 보존", "ol": "**질량수 합·원자 번호 합 보존**으로 빠진 입자를 찾는다.", "forms": [{"a": "X", "s": "²³⁵U + n → ¹⁴¹Ba + ⁹²Kr + 2n은 질량수가 보존된 핵반응식이다."}]}, {"c": "CH1S-064", "m": "반감기 계산", "ol": "**남은 양 = 처음 × (1/2)^(t/T).** X : Y는 남은 비율로 바꿔 센다.", "forms": [{"a": "X", "s": "반감기 8일인 X가 안정한 Y로 붕괴할 때, X만 있던 시료의 원자 수 비 X : Y가 1 : 3이 되기까지 24일 걸린다."}, {"a": "O", "s": "반감기가 30년인 ¹³⁷Cs 1.6 g은 150년 뒤 0.05 g이 남는다."}, {"a": "O", "s": "어떤 방사성 동위원소가 30일 뒤 처음 양의 1/8만 남았다면 이 동위원소의 반감기는 10일이다."}, {"a": "O", "s": "반감기가 10일인 X만 있던 시료에서 30일 동안 붕괴한 X는 처음 양의 7/8이다."}]}, {"c": "CH1S-065", "m": "반감기 불변 조건", "ol": "**반감기는 핵종의 고유값**, 온도·압력·결합·양과 무관하다.", "forms": [{"a": "X", "s": "반감기가 8일인 ¹³¹I를 화합물로 만들어 높은 온도에 두면 16일 뒤 처음 양의 1/4보다 적게 남는다."}]}, {"c": "CH1S-066", "m": "붕괴 계열 횟수", "ol": "**α = ΔA ÷ 4, β⁻ = 2α − ΔZ.** α부터 정한다.", "forms": [{"a": "X", "s": "²³⁵U(원자 번호 92)가 ²⁰⁷Pb(원자 번호 82)로 될 때 α 붕괴는 7번, β⁻ 붕괴는 2번 일어난다."}, {"a": "O", "s": "²²⁶Ra(원자 번호 88)가 α 붕괴 5번, β⁻ 붕괴 4번을 거치면 ²⁰⁶Pb(원자 번호 82)가 된다."}, {"a": "X", "s": "²³²Th(원자 번호 90)가 ²⁰⁸Pb(원자 번호 82)로 될 때 β⁻ 붕괴는 2번 일어난다."}]}, {"c": "CH1S-067", "m": "방사성 동위원소 이용", "ol": "**살아서는 일정, 죽은 뒤부터 반감기로 감소** → 남은 비율로 연대를 잰다.", "forms": [{"a": "X", "s": "¹⁴C의 반감기가 5730년일 때 ¹⁴C가 살아 있을 때의 1/4만 남은 유물은 약 2865년 전 것이다."}]}, {"c": "CH1S-068", "m": "광자 에너지 E=hc/λ", "ol": "**E(eV) = 1240 ÷ λ(nm).** 파장이 짧을수록 에너지가 크다.", "forms": [{"a": "X", "s": "hc = 1240 eV·nm일 때 에너지가 1.24 eV인 광자는 가시광선 영역에 속한다."}, {"a": "O", "s": "hc = 1240 eV·nm일 때 광자 하나로 4.96 eV인 결합을 끊으려면 파장 250 nm 이하의 빛이 필요하다."}]}, {"c": "CH1S-069", "m": "음극선·톰슨 모형", "ol": "**음극선 = 전자의 흐름**, 어떤 금속에서나 같다 → 톰슨 푸딩 모형.", "forms": [{"a": "X", "s": "음극선은 전극 금속을 바꾸면 휘는 정도가 달라져 금속마다 다른 입자로 밝혀졌다."}]}, {"c": "CH1S-072", "m": "선 스펙트럼과 양자화", "ol": "**선 스펙트럼 = 에너지 준위가 불연속(양자화)이라는 증거**, 선 하나 = 준위 차 하나.", "forms": [{"a": "O", "s": "수소 원자에서 n = 2 → n = 1 전이로 나오는 빛은 n = 3 → n = 2 전이로 나오는 빛보다 파장이 짧다."}]}, {"c": "CH1S-073", "m": "수소 스펙트럼 계열", "ol": "**계열 = 도착 준위**: 1 라이먼(자외선), 2 발머(가시광선), 3 파셴(적외선).", "forms": [{"a": "X", "s": "수소의 발머 계열 중 에너지가 가장 큰 선은 라이먼 계열 중 가장 작은 선보다 에너지가 크다."}]}, {"c": "CH1S-074", "m": "전이 에너지 계산", "ol": "**ΔE = 13.6(1/n₁² − 1/n₂²) eV, λ ∝ 1/ΔE** — 준위 에너지가 아니라 준위 차를 쓴다.", "forms": [{"a": "X", "s": "수소 원자에서 n = 3 → n = 1 전이로 방출되는 에너지는 약 1.5 eV이다."}, {"a": "O", "s": "수소 원자에서 n = 3 → 2 전이로 나오는 빛의 파장은 n = 2 → 1 전이 빛 파장의 5.4배이다."}]}, {"c": "CH1S-075", "m": "계열 안 파장 비교", "ol": "**같은 계열: 높은 준위에서 떨어질수록 ΔE↑, 파장↓**(발머 최장 = 3 → 2, 656 nm).", "forms": [{"a": "X", "s": "수소 원자에서 n = 5 → 2 전이의 빛은 n = 3 → 2 전이의 빛보다 파장이 길다."}, {"a": "X", "s": "발머 계열에는 라이먼 계열의 n = 2 → 1 선보다 파장이 짧은 선이 있다."}]}, {"c": "CH1S-077", "m": "오비탈=확률 분포", "ol": "**오비탈 = 전자의 확률 분포(구름)**, 정해진 궤도가 아니다.", "forms": [{"a": "O", "s": "수소 1s 전자가 발견될 확률이 가장 큰 거리는 핵이 아니라 핵에서 약 52.9 pm 떨어진 곳이다."}]}, {"c": "CH1S-078", "m": "양자수 규칙", "ol": "**l은 n − 1까지, mₗ은 −l부터 +l까지** — 조건 하나만 보고 개수를 세면 틀린다.", "forms": [{"a": "X", "s": "n = 3, mₗ = +1을 만족하는 오비탈은 3p 오비탈 하나뿐이다."}]}, {"c": "CH1S-080", "m": "오비탈의 마디 수", "ol": "**전체(n − 1) = 방사상(n − l − 1) + 각방향(l)**.", "forms": [{"a": "O", "s": "전체 마디가 3개이고 방사상 마디가 1개인 수소 원자의 오비탈은 4d이다."}, {"a": "X", "s": "n이 같으면 s, p, d 오비탈의 방사상 마디 수는 서로 같다."}]}, {"c": "CH1S-082", "m": "수소·다전자 에너지 순서", "ol": "**1전자: n만 같으면 에너지 같음 / 다전자: s < p < d**.", "forms": [{"a": "X", "s": "He⁺ 이온에서 2s 오비탈의 에너지는 2p 오비탈의 에너지보다 낮다."}]}, {"c": "CH1S-083", "m": "방사 확률 분포 해석", "ol": "**봉우리 = n − l개**, 봉우리 사이 확률 0인 골이 방사상 마디다.", "forms": [{"a": "X", "s": "3s 오비탈의 방사 방향 확률 분포 그래프에는 봉우리가 2개 나타난다."}, {"a": "X", "s": "2s와 2p 오비탈의 방사 방향 확률 분포는 봉우리 수가 서로 같다."}, {"a": "O", "s": "3p 오비탈의 방사 방향 확률 분포에는 봉우리가 2개, 방사상 마디가 1개 있다."}]}, {"c": "CH1S-088", "m": "Cr·Cu 예외 배치", "ol": "**Cr 3d⁵ 4s¹(홀전자 6), Cu 3d¹⁰ 4s¹** — 반 채움·완전 채움을 택한다.", "forms": [{"a": "O", "s": "바닥상태 Cr 원자의 홀전자 수는 6으로 4주기 원소 가운데 가장 많다."}, {"a": "X", "s": "바닥상태 Cr 원자의 홀전자 수는 4이다."}]}, {"c": "CH1S-089", "m": "전이 금속 이온 배치", "ol": "**전이 금속 양이온: 4s를 먼저 떼고 3d를 훈트 규칙으로 센다**(Fe²⁺ 4개, Fe³⁺ 5개).", "forms": [{"a": "X", "s": "Fe²⁺와 Fe³⁺ 가운데 바닥상태에서 홀전자가 더 많은 것은 Fe²⁺이다."}, {"a": "O", "s": "바닥상태에서 Co³⁺(원자 번호 27)의 홀전자 수는 Ni²⁺(원자 번호 28)의 2배이다."}, {"a": "O", "s": "전이 금속이 양이온이 될 때 4s 전자부터 잃는 것은 3d에 전자가 들어오면 4s가 3d보다 에너지가 높아지기 때문이다."}, {"a": "O", "s": "Mn²⁺과 Fe³⁺의 바닥상태 전자 배치는 모두 [Ar]3d⁵이고 홀전자는 5개이다."}, {"a": "O", "s": "Ti(원자 번호 22)가 Ti²⁺가 되어도 홀전자 수는 원자일 때와 같은 2이다."}]}, {"c": "CH1S-090", "m": "상자기성·반자기성", "ol": "**홀전자 있음 → 상자기성, 홀전자 0 → 반자기성**.", "forms": [{"a": "X", "s": "Fe 원자는 상자기성이지만 Fe³⁺는 전자를 잃어 반자기성을 띤다."}]}, {"c": "CH1S-092", "m": "양자수 조건별 전자 수", "ol": "**배치 먼저(이온은 4s부터 뺀다) → 조건(n, l)에 맞는 전자만 합산**.", "forms": [{"a": "O", "s": "바닥상태 Cu 원자에서 l = 2인 전자 수는 n = 4인 전자 수의 10배이다."}, {"a": "X", "s": "바닥상태 Co²⁺(원자 번호 27)에서 l = 2인 전자는 5개이다."}]}, {"c": "CH1S-096", "m": "원자·이온 크기 역전", "ol": "**같은 주기: 원자는 금속 > 비금속, 이온은 음이온 > 양이온**.", "forms": [{"a": "O", "s": "원자 반지름은 Mg가 S보다 크지만, 이온 반지름은 S²⁻가 Mg²⁺보다 크다."}, {"a": "X", "s": "원자 반지름은 Mg가 O보다 크므로 이온 반지름도 Mg²⁺가 O²⁻보다 크다."}]}, {"c": "CH1S-097", "m": "등전자 이온 배치·크기", "ol": "**등전자 이온: 원자 번호 클수록 작다** — 전자 수가 다르면 껍질 수부터 비교한다.", "forms": [{"a": "X", "s": "Mg²⁺와 Cl⁻ 가운데 핵전하가 더 큰 Cl⁻의 이온 반지름이 더 작다."}, {"a": "O", "s": "Kr과 전자 배치가 같은 Se²⁻, Br⁻, Rb⁺, Sr²⁺ 중 반지름이 가장 작은 것은 Sr²⁺이다."}, {"a": "O", "s": "O²⁻, F⁻, Na⁺, Mg²⁺ 가운데 전자 수/양성자 수 비가 가장 큰 이온이 반지름도 가장 크다."}]}, {"c": "CH1S-101", "m": "2·13족, 15·16족 예외", "ol": "**예외 두 곳: 2족 > 13족(s → p), 15족 > 16족(짝지음 반발)** — 3주기 Mg > Al, P > S도 같다.", "forms": [{"a": "O", "s": "Be, B, C, N, O의 제1 이온화 에너지는 N > O > C > Be > B 순이다."}, {"a": "X", "s": "O의 제1 이온화 에너지가 N보다 작은 것은 O의 유효 핵전하가 N보다 작기 때문이다."}, {"a": "X", "s": "O의 제1 이온화 에너지가 N보다 작은 것은 O의 핵전하가 N보다 작기 때문이다."}]}, {"c": "CH1S-102", "m": "순차 이온화 에너지", "ol": "**급증 직전까지 뗀 전자 수 = 원자가 전자 수**, 안정한 이온까지의 값은 모두 더한다.", "forms": [{"a": "O", "s": "E₁, E₂, E₃이 738, 1451, 7733 kJ/mol인 원자가 안정한 이온이 되는 데 2189 kJ/mol이 든다."}]}, {"c": "CH1S-103", "m": "전자 친화도", "ol": "**전자 친화도 최대는 F가 아니라 Cl**, 전자 이동만으로는 에너지를 흡수한다.", "forms": [{"a": "X", "s": "이온화 에너지 Na 496, 전자 친화도 Cl 349 kJ/mol일 때 기체 Na와 Cl이 Na⁺와 Cl⁻가 되면 에너지가 방출된다."}]}, {"c": "CH1S-105", "m": "금속성·비금속성", "ol": "**금속성: 왼쪽 아래 ↑, 비금속성: 오른쪽 위 ↑**, 그 경계에 준금속.", "forms": [{"a": "O", "s": "F, Cl, Br 가운데 전기음성도가 가장 큰 F가 비금속성도 가장 크다."}]}, {"c": "CH1S-106", "m": "옥텟·듀엣 규칙", "ol": "**목표는 가장 가까운 18족 배치**: 대부분 옥텟(8), H는 듀엣(2).", "forms": [{"a": "O", "s": "BF₃의 B는 NH₃의 비공유 전자쌍을 받아 F₃B−NH₃가 되면서 옥텟을 만족한다."}]}, {"c": "CH1S-107", "m": "옥텟 규칙의 예외", "ol": "**예외 셋: 전자 부족(BF₃ 6), 확장 옥텟(PCl₅ 10, SF₆ 12), 홀수 전자(NO₂)**.", "forms": [{"a": "X", "s": "BF₃가 NH₃의 비공유 전자쌍을 받아 결합하면 B 주위의 전자는 10개가 된다."}, {"a": "X", "s": "BeCl₂의 Be 주위 전자는 6개로 BF₃의 B와 같다."}]}, {"c": "CH1S-110", "m": "격자 에너지", "ol": "**격자 에너지 ∝ (전하 곱)/(이온 사이 거리)** — 전하 먼저, 같으면 크기.", "forms": [{"a": "O", "s": "격자 에너지는 KBr < KCl < LiCl < MgCl₂ 순으로 커진다."}, {"a": "O", "s": "MgF₂, CaF₂, ZrO₂의 격자 에너지는 CaF₂ < MgF₂ < ZrO₂ 순이다."}, {"a": "O", "s": "이온이 더 큰 CaS가 LiF보다 격자 에너지가 크다."}]}, {"c": "CH1S-113", "m": "배위 결합", "ol": "**배위 결합 = 전자쌍을 한쪽이 다 낸 공유 결합**, 생긴 뒤에는 다른 결합과 똑같다.", "forms": [{"a": "O", "s": "H₂O가 H⁺와 배위 결합해 H₃O⁺가 되면 O에 남은 비공유 전자쌍은 1개이다."}, {"a": "O", "s": "BF₃가 F⁻의 비공유 전자쌍을 받아 BF₄⁻가 되면 B의 형식 전하는 −1이 된다."}, {"a": "O", "s": "배위 결합으로 생긴 H₃O⁺의 세 O−H 결합은 길이가 같다."}]}, {"c": "CH1S-116", "m": "분자 결정 녹는점", "ol": "**분자 결정의 녹는점 = 분자 사이 힘의 크기** → 약해서 낮다.", "forms": [{"a": "O", "s": "드라이아이스가 승화할 때 끊어지는 힘은 다이아몬드가 녹을 때 끊어지는 결합보다 훨씬 약하다."}, {"a": "O", "s": "I₂ 결정이 쉽게 승화하는 것은 분자 안 I−I 결합이 아니라 분자 사이 힘이 약하기 때문이다."}, {"a": "X", "s": "SiO₂는 CO₂와 같은 14족 산화물이므로 분자 결정이어서 녹는점이 낮다."}]}, {"c": "CH1S-118", "m": "수용액 전기 전도도 비교", "ol": "**전도도는 실제 이온의 양·전하가 클수록 크다** — 이온화 정도가 결정적이다.", "forms": [{"a": "O", "s": "온도가 올라가면 NaCl 수용액의 전기 전도도는 커지고 구리의 전기 전도도는 작아진다."}, {"a": "X", "s": "같은 온도에서 0.1 M HCl과 0.1 M CH₃COOH 수용액은 모두 1가 산이라 전기 전도도가 같다."}, {"a": "O", "s": "HCl 기체를 녹인 수용액은 전기가 통하지만 순수한 액체 HCl은 거의 통하지 않는다."}]}, {"c": "CH1S-123", "m": "반발 세기와 결합각", "ol": "**반발: 비공유·비공유 > 비공유·공유 > 공유·공유** → 입체수가 같으면 비공유 전자쌍 ↑, 결합각 ↓.", "forms": [{"a": "O", "s": "H₃O⁺의 H−O−H 결합각은 H₂O의 결합각보다 크다."}, {"a": "X", "s": "SF₄에서 축 방향의 두 F가 이루는 F−S−F 결합각은 정확히 180°이다."}]}, {"c": "CH1S-124", "m": "중심 원자 크기와 결합각", "ol": "**중심 원자가 같은 족 아래쪽(큼)이면 결합각이 작다**: NH₃ > PH₃, H₂O > H₂S.", "forms": [{"a": "O", "s": "PH₃의 결합각은 NH₃보다 작고 H₂O보다도 작다."}, {"a": "X", "s": "SiH₄는 중심 원자가 C보다 크므로 결합각이 CH₄보다 작다."}]}, {"c": "CH1S-125", "m": "입체수 5 비공유쌍 자리", "ol": "**입체수 5: 비공유 전자쌍은 적도로 → 1개 시소형, 2개 T자형, 3개 직선형**.", "forms": [{"a": "X", "s": "XeF₂의 F−Xe−F 결합각은 120°이다."}]}, {"c": "CH1S-126", "m": "입체수 6 비공유쌍 자리", "ol": "**입체수 6: 비공유 1개 → 사각뿔형, 2개 → 마주 보아 평면 사각형**.", "forms": [{"a": "O", "s": "XeF₄의 F−Xe−F 결합각은 90°와 180°의 두 가지이다."}]}, {"c": "CH1S-127", "m": "확장 옥텟 조건", "ol": "**확장 옥텟은 3주기 이상 중심 원자만**(PCl₅ ○, NCl₅ ✕).", "forms": [{"a": "X", "s": "ClF₃처럼 F를 중심 원자로 한 FCl₃도 안정하게 존재할 수 있다."}]}, {"c": "CH1S-128", "m": "분자의 평면성", "ol": "**평면성은 원자만 본다**: 원자 3개는 늘 평면, 삼각뿔형·정사면체·시소형은 비평면.", "forms": [{"a": "X", "s": "H₂O는 비공유 전자쌍 때문에 굽은형이므로 세 원자가 한 평면에 놓이지 않는다."}, {"a": "X", "s": "XeF₄와 SF₄는 모두 F 4개를 가지므로 다섯 원자가 한 평면에 놓인다."}]}, {"c": "CH1S-129", "m": "루이스 구조 그리기", "ol": "**총 전자 = 원자가 전자 합 + 음이온 전하 − 양이온 전하**.", "forms": [{"a": "X", "s": "HCN의 루이스 구조에서 C와 N 사이는 이중 결합이다."}]}, {"c": "CH1S-130", "m": "형식 전하 계산", "ol": "**형식 전하 = 원자가 전자 − 비공유 전자 − 결합 수**, 합 = 전체 전하.", "forms": [{"a": "O", "s": "CO의 루이스 구조에서 C의 형식 전하는 −1, O의 형식 전하는 +1이다."}, {"a": "X", "s": "모든 S−O가 단일 결합인 SO₄²⁻ 루이스 구조에서 S의 형식 전하는 0이다."}, {"a": "O", "s": "O₃의 O=O−O 구조에서 가운데 O의 형식 전하는 +1, 단일 결합한 끝 O는 −1이다."}]}, {"c": "CH1S-131", "m": "형식 전하≠산화수", "ol": "**형식 전하: 반씩 나눔(구조 판단용) / 산화수: 전기음성도 큰 쪽이 독차지(산화·환원용)**.", "forms": [{"a": "X", "s": "NH₄⁺에서 N 원자의 형식 전하와 산화수는 모두 +1이다."}, {"a": "X", "s": "CO에서 C의 형식 전하가 −1이므로 C의 산화수도 −1이다."}]}, {"c": "CH1S-132", "m": "기여 구조 고르기", "ol": "**형식 전하는 작게, 음전하는 전기음성도 큰 원자에** — 이 순서로 고른다.", "forms": [{"a": "X", "s": "N₂O에서 기여도가 가장 큰 루이스 구조는 N과 O 사이가 삼중 결합인 구조이다."}, {"a": "O", "s": "NCO⁻의 공명 구조 중 음의 형식 전하가 O에 놓인 N≡C−O⁻의 기여도가 가장 크다."}, {"a": "O", "s": "CO₂의 루이스 구조 기여도는 O=C=O가 가장 크고, ⁻O−C≡O⁺와 ⁺O≡C−O⁻의 기여도는 서로 같다."}, {"a": "O", "s": "N₃⁻에서 형식 전하가 (−1, +1, −1)인 N=N=N 구조는 (0, +1, −2)인 N≡N−N 구조보다 기여도가 크다."}]}, {"c": "CH1S-133", "m": "공명 혼성체", "ol": "**공명 혼성체 = 기여 구조들의 겹침(오가지 않음)**, 어느 기여 구조보다 안정하다.", "forms": [{"a": "O", "s": "NO₃⁻는 서로 동등한 공명 구조 3개로 나타낼 수 있다."}]}, {"c": "CH1S-134", "m": "공명과 결합 차수·길이", "ol": "**결합 차수 = 공유 전자쌍 수 ÷ 공명하는 결합 자리 수**(NO₃⁻ 4/3, NO₂⁻ 3/2).", "forms": [{"a": "O", "s": "N−O 결합 길이는 NO⁺ < NO₂⁻ < NO₃⁻ 순으로 길어진다."}, {"a": "X", "s": "NO₃⁻의 N−O 결합 길이는 NO₂⁻의 N−O 결합 길이보다 짧다."}]}, {"c": "CH1S-135", "m": "라디칼", "ol": "**원자가 전자 총수가 홀수 → 라디칼(홀전자) → 반응성 큼·이량화**.", "forms": [{"a": "X", "s": "2NO₂ → N₂O₄로 생긴 N₂O₄도 홀전자를 가진 라디칼이다."}]}, {"c": "CH1S-137", "m": "입체수로 혼성 판정", "ol": "**혼성 = 입체수로 읽는다**(2 sp, 3 sp², 4 sp³, 5 sp³d, 6 sp³d²) — 모양으로 읽지 않는다.", "forms": [{"a": "X", "s": "I₃⁻의 중심 원자 I는 결합한 원자가 2개이므로 sp 혼성이다."}, {"a": "O", "s": "NH₂⁻와 H₂O는 분자 구조와 중심 원자의 혼성이 모두 같다."}]}, {"c": "CH1S-138", "m": "σ·π 결합의 성질", "ol": "**σ: 정면 겹침, 강함, 회전 가능 / π: 옆 겹침, 약함, 회전 불가**.", "forms": [{"a": "X", "s": "π 결합은 σ 결합보다 겹침이 커서 더 강하다."}]}, {"c": "CH1S-139", "m": "σ·π 결합 수 세기", "ol": "**σ = 원자 사이 연결 수, π = 이중 결합마다 1개·삼중 결합마다 2개**.", "forms": [{"a": "X", "s": "C₂H₆, C₂H₄, C₂H₂ 가운데 σ 결합 수가 가장 많은 것은 C₂H₂이다."}]}, {"c": "CH1S-140", "m": "s 성분과 결합 성질", "ol": "**s 성분 ↑(sp > sp² > sp³) → 결합 짧음·전기음성도 큼·H⁺ 내놓기 쉬움**.", "forms": [{"a": "O", "s": "C₂H₂의 C−H 결합은 C₂H₆의 C−H 결합보다 짧고 H⁺로 떨어져 나가기 쉽다."}, {"a": "X", "s": "C₂H₄의 C−H 결합은 C₂H₂의 C−H 결합보다 짧다."}]}, {"c": "CH1S-145", "m": "비대칭·치환이면 극성", "ol": "**대칭 모양이어도 둘레 원자가 다르면 극성**이다(CH₃Cl, BF₂Cl).", "forms": [{"a": "O", "s": "평면 삼각형인 BF₃는 무극성이지만 F 하나를 Cl로 바꾼 BF₂Cl은 극성이다."}]}, {"c": "CH1S-146", "m": "비공유쌍 있어도 무극성", "ol": "**비공유쌍의 유무가 아니라 결합 원자들의 배치가 대칭인지**로 판정한다(XeF₂·XeF₄는 무극성).", "forms": [{"a": "X", "s": "XeF₂는 중심 원자 Xe의 입체수가 5이고 결합한 원자가 2개이므로 굽은형 극성 분자이다."}]}, {"c": "CH1S-147", "m": "쌍극자 모멘트 크기 비교", "ol": "**쌍극자 크기는 결합 극성과 상쇄 정도가 함께 정한다**: CH₃Cl > CH₂Cl₂ > CHCl₃ > CCl₄다.", "forms": [{"a": "O", "s": "쌍극자 모멘트의 크기는 H₂O > H₂S > CO₂ 순이다."}, {"a": "O", "s": "삼각뿔형인 NH₃와 PH₃ 중 쌍극자 모멘트는 NH₃가 더 크다."}, {"a": "X", "s": "CH₃Cl, CH₂Cl₂, CHCl₃, CCl₄ 중 Cl이 가장 많은 CCl₄의 쌍극자 모멘트가 가장 크다."}, {"a": "O", "s": "CH₄, NH₃, H₂O 중 쌍극자 모멘트가 0인 것은 CH₄뿐이고 가장 큰 것은 H₂O이다."}]}, {"c": "CH1S-149", "m": "쌍극자 사이 힘", "ol": "**극성 분자 사이 = 분산력 + 쌍극자 힘**이라, 분자량이 비슷하면 극성 쪽이 끓는점이 높다.", "forms": [{"a": "X", "s": "CO₂는 C=O 결합이 극성이므로 CO₂ 분자 사이에는 쌍극자 힘이 작용한다."}]}, {"c": "CH1S-150", "m": "수소 결합 조건", "ol": "**H는 F·O·N에 붙어 있어야 하고**(주는 쪽), 받는 쪽은 F·O·N의 비공유쌍이다.", "forms": [{"a": "O", "s": "CH₃NH₂ 분자 사이에는 수소 결합이 작용하지만 (CH₃)₃N 분자 사이에는 작용하지 않는다."}]}, {"c": "CH1S-151", "m": "끓는점 비교", "ol": "**수소 결합 유무 → 극성 → 분자량·모양** 순서로 따지되, 분자량 차가 아주 크면 분산력이 앞설 수 있다.", "forms": [{"a": "X", "s": "HCl은 HF보다 분자량이 커서 분산력이 크므로 끓는점도 HF보다 높다."}, {"a": "O", "s": "분자량이 같은 뷰테인과 아이소뷰테인 중 뷰테인의 끓는점이 더 높다."}, {"a": "O", "s": "끓는점은 H₂O > HF > NH₃ > CH₄ 순이다."}]}, {"c": "CH1S-153", "m": "이원자 분자 결합 에너지", "ol": "**결합 차수가 크고 길이가 짧을수록 결합 에너지가 크지만**, 할로젠은 Cl₂ > Br₂ > F₂ > I₂로 F₂가 예외다.", "forms": [{"a": "O", "s": "할로젠 분자 중 결합 에너지가 가장 큰 것은 원자가 가장 작은 F₂가 아니라 Cl₂이다."}, {"a": "X", "s": "CO와 N₂는 결합 차수가 3으로 같으므로 결합 에너지도 같다."}, {"a": "X", "s": "할로젠 분자 중 결합 길이가 가장 짧은 것은 원자가 가장 작은 F₂가 아니라 Cl₂이다."}]}, {"c": "CH1S-154", "m": "상태 함수", "ol": "**ΔH는 처음과 나중 상태로만 정해진다**(경로 무관): 이것이 헤스 법칙의 뿌리다.", "forms": [{"a": "O", "s": "A → B의 ΔH가 a, B → C의 ΔH가 b이면 C → A의 ΔH는 −(a + b)이다."}]}, {"c": "CH1S-156", "m": "발열·흡열과 주위 온도", "ol": "**주위가 따뜻해지면 발열(ΔH < 0), 차가워지면 흡열(ΔH > 0)**이다.", "forms": [{"a": "O", "s": "주위의 온도가 내려간 반응에서 생성물의 엔탈피 합은 반응물의 엔탈피 합보다 크다."}]}, {"c": "CH1S-157", "m": "등압에서 q=ΔH", "ol": "**압력이 일정하면 q = ΔH**: 열린 용기에서 잰 열이 곧 ΔH다.", "forms": [{"a": "X", "s": "반응계에 출입한 열이 ΔH와 같아지려면 반응하는 동안 부피를 일정하게 유지해야 한다."}, {"a": "X", "s": "일정한 압력에서 물질 A 2 mol이 반응해 열 30 kJ을 내놓았다면 A 1 mol당 ΔH는 −30 kJ이다."}]}, {"c": "CH1S-158", "m": "열화학 반응식 상태 표시", "ol": "**상태가 바뀌면 ΔH도 바뀐다**: H₂O(l) 생성은 −286 kJ, H₂O(g) 생성은 −242 kJ이다.", "forms": [{"a": "O", "s": "H₂O(l) → H₂O(g)의 ΔH가 +44 kJ이면 H₂O(l) 2 mol이 증발할 때의 ΔH는 +88 kJ이다."}]}, {"c": "CH1S-161", "m": "상태 변화와 분자 운동", "ol": "**온도는 분자 운동을, 상태 변화 열은 분자 사이 거리를** 바꾼다: 녹는 동안 온도는 일정하다.", "forms": [{"a": "X", "s": "1기압에서 얼음이 녹는 동안 0 °C로 일정한 것은 흡수한 열이 분자의 운동 에너지를 높이기 때문이다."}]}, {"c": "CH1S-162", "m": "결합 끊기 흡열·형성 발열", "ol": "**끊기 = 흡열, 만들기 = 발열**이고, 반응열은 둘의 차이다.", "forms": [{"a": "X", "s": "H₂(g) + Cl₂(g) → 2HCl(g)이 발열 반응인 것은 H−H 결합과 Cl−Cl 결합이 끊어질 때에도 에너지가 방출되기 때문이다."}, {"a": "O", "s": "CH₄(g) → C(g) + 4H(g)는 흡열 과정이며 그 ΔH는 C−H 결합 에너지의 약 4배이다."}]}, {"c": "CH1S-163", "m": "결합 에너지로 ΔH", "ol": "**ΔH ≈ 끊는 결합의 합 − 생기는 결합의 합**이고, 결합 수는 계수 × 분자당 결합 수로 센다.", "forms": [{"a": "X", "s": "H−H 436, O=O 498, O−H 463 kJ/mol이면 2H₂ + O₂ → 2H₂O(g)의 ΔH는 +444 kJ이다."}, {"a": "O", "s": "결합 에너지 N≡N 945, H−H 436, N−H 391 kJ/mol로 구한 N₂ + 3H₂ → 2NH₃의 ΔH는 −93 kJ이다."}]}, {"c": "CH1S-164", "m": "헤스 법칙", "ol": "**반응식을 더하면 ΔH도 더한다**: 뒤집으면 부호가 반대, k배 하면 ΔH도 k배다.", "forms": [{"a": "O", "s": "C와 CO의 연소 엔탈피가 −394, −283 kJ/mol이면 C(s) + ½O₂(g) → CO(g)의 ΔH는 −111 kJ이다."}]}, {"c": "CH1S-165", "m": "표준 생성 엔탈피", "ol": "**가장 안정한 홑원소 물질만 0**이고, ΔH = 생성물의 생성 엔탈피 합 − 반응물의 합이다.", "forms": [{"a": "O", "s": "표준 생성 엔탈피가 C₂H₄ +52, C₂H₆ −85 kJ/mol이면 C₂H₄ + H₂ → C₂H₆의 ΔH는 −137 kJ이다."}, {"a": "X", "s": "생성 엔탈피가 CO₂ −394, H₂O(l) −286, CH₄ −75 kJ/mol이면 CH₄ 1 mol 연소 ΔH는 −605 kJ이다."}]}, {"c": "CH1S-166", "m": "온도 눈금 선형 변환", "ol": "**온도 값 = 기울기 × t + 절편**: 온도 값은 절편까지, 온도 차는 기울기만 쓴다.", "forms": [{"a": "X", "s": "1기압에서 물이 10 °R에서 얼고 210 °R에서 끓는 선형 눈금에서 20 °C는 30 °R이다."}]}, {"c": "CH1S-167", "m": "비열과 열용량", "ol": "**비열은 물질의 성질, 열용량(= 비열 × 질량)은 물체의 성질**이다.", "forms": [{"a": "O", "s": "물 100 g과 비열이 물의 1/2인 액체 200 g에 같은 열량을 주면 온도 변화는 같다."}]}, {"c": "CH1S-168", "m": "Q=cmΔT 계산", "ol": "**Q = cmΔT, ΔT는 나중 − 처음**이고 °C로 쓰나 K로 쓰나 같다.", "forms": [{"a": "O", "s": "물 200 g에 8.36 kJ의 열을 가하면 온도가 25 °C에서 35 °C가 된다."}]}, {"c": "CH1S-169", "m": "Q=nΔH·용해 엔탈피", "ol": "**Q = nΔH**: 몰수부터 구하고, 1 g당 열은 ΔH ÷ 몰 질량이다.", "forms": [{"a": "X", "s": "용해 엔탈피가 +30 kJ/mol인 X(120 g/mol)는 +20 kJ/mol인 Y(50 g/mol)보다 1 g당 흡수열이 크다."}, {"a": "O", "s": "연소 엔탈피가 −890 kJ/mol인 CH₄ 1.6 g의 연소열을 20 °C 물 1.0 kg이 모두 받으면 약 21 °C 오른다."}, {"a": "O", "s": "용해 엔탈피가 +15 kJ/mol인 NH₄Cl 10.7 g이 물에 녹으면 3.0 kJ의 열을 흡수한다."}]}, {"c": "CH1S-170", "m": "열량계 Q와 ΔH 부호", "ol": "**ΔH = −(cmΔT) ÷ n**: 부호를 뒤집고 몰수로 나눈다.", "forms": [{"a": "X", "s": "열량계의 물 200 g에 고체 0.20 mol을 녹여 수온이 5.0 °C 내려가면 용해 엔탈피는 약 +4.2 kJ/mol이다."}, {"a": "O", "s": "단열 용기에서 HCl과 NaOH 각 0.050 mol이 반응해 용액 200 g이 3.4 °C 오르면 ΔH는 약 −57 kJ/mol이다."}, {"a": "O", "s": "열량계의 물 250 g에 고체 0.10 mol을 녹여 수온이 2.0 °C 오르면 용해 엔탈피는 약 −21 kJ/mol이다."}]}, {"c": "CH1S-171", "m": "열량계 측정 오차", "ol": "**열 손실이 있으면 측정한 ΔH의 크기는 참값보다 작다**(0 쪽으로 치우친다).", "forms": [{"a": "O", "s": "간이 열량계로 잰 발열 반응의 ΔH는 용기와 온도계가 흡수한 열 때문에 참값보다 0에 가깝게 나온다."}, {"a": "X", "s": "흡열 반응을 간이 열량계로 재면 주위에서 열이 들어와 ΔH의 크기가 참값보다 크게 나온다."}]}, {"c": "CH1S-172", "m": "가열 곡선 해석", "ol": "**기울기는 비열에 반비례, 수평 구간 길이는 상태 변화 열에 비례**한다.", "forms": [{"a": "X", "s": "얼음을 일정한 세기로 가열한 가열 곡선에서 액체 물 구간의 기울기는 얼음 구간보다 가파르다."}, {"a": "O", "s": "융해열 334 J/g, 증발열 2260 J/g인 얼음을 일정한 세기로 가열하면 끓는 수평 구간이 녹는 구간보다 약 7배 길다."}, {"a": "X", "s": "1기압에서 가열 세기를 2배로 높이면 끓는 동안 나타나는 수평 구간의 온도도 높아진다."}]}, {"c": "CH1S-173", "m": "열평형 온도 계산", "ol": "**잃은 열 = 얻은 열**이고, 평형 온도는 열용량이 큰 쪽 온도에 가깝다.", "forms": [{"a": "O", "s": "단열 용기의 20 °C 물 100 g에 비열이 물의 1/9인 90 °C 금속 100 g을 넣으면 평형 온도는 27 °C이다."}, {"a": "X", "s": "단열 용기에서 80 °C 물 100 g과 20 °C 물 200 g을 섞으면 평형 온도는 50 °C이다."}]}, {"c": "CH1S-174", "m": "아레니우스 정의와 한계", "ol": "**아레니우스: 물에서 H⁺을 내면 산, OH⁻을 내면 염기**이고, 수용액 밖에서는 쓸 수 없다.", "forms": [{"a": "X", "s": "NH₃ 수용액에 OH⁻이 있으므로 NH₃는 자신이 OH⁻을 내놓는 아레니우스 염기이다."}]}, {"c": "CH1S-175", "m": "브뢴스테드-로리 정의", "ol": "**H⁺을 주면 산, 받으면 염기**: 같은 물질도 상대에 따라 역할이 바뀐다.", "forms": [{"a": "O", "s": "HF + NH₃ ⇌ F⁻ + NH₄⁺의 정반응에서 HF는 산이고 역반응에서 NH₄⁺은 산이다."}]}, {"c": "CH1S-176", "m": "양쪽성 물질", "ol": "**양쪽성 = 줄 H⁺도, H⁺을 받을 자리도 있는 물질**(H₂O, HCO₃⁻, H₂PO₄⁻)이다.", "forms": [{"a": "X", "s": "HCO₃⁻ + H₂O ⇌ H₂CO₃ + OH⁻의 정반응에서 HCO₃⁻은 산으로 작용한다."}]}, {"c": "CH1S-177", "m": "짝산·짝염기", "ol": "**짝은 화살표 양쪽에서 H⁺ 하나 차이**로 맺어진 쌍이다.", "forms": [{"a": "X", "s": "H₂SO₄의 짝염기는 SO₄²⁻이다."}]}, {"c": "CH1S-178", "m": "루이스 산·염기", "ol": "**루이스: 전자쌍을 받으면 산, 주면 염기**이며 가장 넓은 정의다.", "forms": [{"a": "X", "s": "Zn²⁺ + 4OH⁻ → [Zn(OH)₄]²⁻에서 OH⁻는 H⁺을 받는 브뢴스테드-로리 염기로 작용한다."}, {"a": "O", "s": "브뢴스테드-로리 염기는 모두 루이스 염기이지만 루이스 산이 모두 브뢴스테드-로리 산인 것은 아니다."}, {"a": "X", "s": "H₃N−BF₃의 N−B 배위 결합을 이루는 전자쌍은 B가 내놓은 것이다."}, {"a": "X", "s": "BF₃는 H⁺을 내놓지 못하므로 브뢴스테드-로리 산이 아니라 루이스 염기이다."}]}, {"c": "CH1S-179", "m": "Ka·pKa와 산의 세기", "ol": "**Ka가 클수록, pKa가 작을수록 강한 산**이다(pKa 1 차이 = Ka 10배).", "forms": [{"a": "X", "s": "같은 온도에서 Ka가 1.8×10⁻⁵인 산은 Ka가 6.8×10⁻⁴인 산보다 pKa가 작다."}]}, {"c": "CH1S-180", "m": "강산의 짝염기는 약하다", "ol": "**산이 강할수록 짝염기는 약하다**: pKa가 작은 산의 짝염기가 더 약한 염기다.", "forms": [{"a": "X", "s": "25 °C에서 pKa가 HF 3.2, CH₃COOH 4.8이면 F⁻가 CH₃COO⁻보다 강한 염기이다."}, {"a": "X", "s": "25 °C에서 Ka가 HF 6.8×10⁻⁴, HCN 6.2×10⁻¹⁰이면 F⁻가 CN⁻보다 강한 염기이다."}]}, {"c": "CH1S-181", "m": "구조로 보는 산의 세기", "ol": "**HX는 결합이 약할수록, 산소산은 O가 많을수록 강산**이다(HI > HF, HClO₄ > HClO).", "forms": [{"a": "X", "s": "F의 전기음성도가 I보다 크므로 HF는 HI보다 강한 산이다."}, {"a": "X", "s": "HNO₃와 HNO₂는 중심 원자 N이 같으므로 산의 세기도 같다."}]}, {"c": "CH1S-182", "m": "산의 세기≠농도", "ol": "**강·약은 이온화 비율, 진하기·묽기는 농도**다: 두 축은 서로 다르다.", "forms": [{"a": "X", "s": "1 M CH₃COOH 수용액의 pH가 0.001 M HCl 수용액보다 작으므로 CH₃COOH는 HCl보다 강한 산이다."}, {"a": "X", "s": "강산 수용액의 H⁺ 농도는 농도와 관계없이 항상 약산 수용액보다 크다."}]}, {"c": "CH1S-183", "m": "산화물의 액성", "ol": "**금속 산화물은 대체로 염기성, 비금속 산화물은 대체로 산성**이고, Al₂O₃·ZnO는 양쪽성, CO·NO는 중성이다.", "forms": [{"a": "O", "s": "SO₃, Na₂O, CaO, P₄O₁₀ 가운데 물에 녹아 염기성 용액을 만드는 것은 Na₂O와 CaO뿐이다."}, {"a": "X", "s": "CO는 비금속 산화물이므로 NaOH와 반응해 염을 만드는 산성 산화물이다."}]}, {"c": "CH1S-185", "m": "구경꾼 이온과 염", "ol": "**구경꾼 이온은 반응 전후 그대로**이고, 산의 음이온과 염기의 양이온이 이루는 물질이 염이다.", "forms": [{"a": "O", "s": "HCl 수용액에 NaOH 수용액을 넣어 가는 동안 혼합 용액 속 Cl⁻의 수는 일정하다."}]}, {"c": "CH1S-186", "m": "약산의 알짜 이온 반응식", "ol": "**약산·약염기는 분자로, 강산·강염기·녹는 염은 이온으로** 쓴다.", "forms": [{"a": "X", "s": "CH₃COOH 수용액과 NaOH 수용액의 중화에서 Na⁺과 CH₃COO⁻는 모두 구경꾼 이온이다."}]}, {"c": "CH1S-187", "m": "가수와 nMV=n′M′V′", "ol": "**nMV = n′M′V′**: 가수 n을 곱한 H⁺·OH⁻ 몰수가 같아야 완전 중화다.", "forms": [{"a": "X", "s": "0.1 M HCl 10 mL와 0.1 M H₂SO₄ 10 mL를 섞은 용액을 완전히 중화하려면 0.1 M NaOH 20 mL가 든다."}, {"a": "O", "s": "이양성자산 H₂A 0.90 g을 완전히 중화하는 데 0.50 M NaOH 40 mL가 들었다면 H₂A의 몰 질량은 90 g/mol이다."}]}, {"c": "CH1S-189", "m": "중화 전후 이온 수 변화", "ol": "**H⁺ 하나가 사라질 때 Na⁺ 하나가 들어온다**: 중화점까지 전체 이온 수는 일정하다.", "forms": [{"a": "X", "s": "HCl 수용액에 NaOH 수용액을 조금씩 넣으면 중화점까지 혼합 용액 속 전체 이온 수는 계속 줄어든다."}, {"a": "X", "s": "0.1 M HCl 100 mL와 0.1 M NaOH 50 mL를 섞으면 전체 이온 수는 섞기 전과 같다."}]}, {"c": "CH1S-190", "m": "염의 가수 분해", "ol": "**염의 액성은 강한 쪽을 따른다**: 약산+강염기 → 염기성, 강산+약염기 → 산성이다.", "forms": [{"a": "X", "s": "KNO₃, Na₂CO₃, NH₄NO₃를 각각 물에 녹인 수용액 가운데 산성인 것은 Na₂CO₃ 수용액이다."}, {"a": "O", "s": "CH₃COOH 수용액과 NaOH 수용액이 꼭 맞게 중화된 용액은 중성이 아니라 염기성이다."}, {"a": "X", "s": "CH₃COOH 수용액과 NaOH 수용액이 꼭 맞게 중화된 용액은 산성이다."}, {"a": "X", "s": "HCl 수용액과 NH₃ 수용액이 꼭 맞게 중화된 용액은 산성이 아니라 염기성이다."}]}, {"c": "CH1S-191", "m": "중화열", "ol": "**강산-강염기 중화열 ≈ 물 1 mol당 56 kJ**이고, 산·염기의 종류와 무관하다.", "forms": [{"a": "O", "s": "0.1 M HCl 100 mL와 0.1 M NaOH 100 mL를 섞을 때 방출되는 열은 0.2 M HCl 50 mL와 0.2 M NaOH 50 mL를 섞을 때와 같다."}, {"a": "O", "s": "1 M HCl 100 mL와 1 M NaOH 50 mL를 섞으면 약 2.8 kJ의 열이 방출된다."}]}, {"c": "CH1S-192", "m": "적정 중 전기 전도도", "ol": "**강산을 강염기로 적정하면 전기 전도도는 중화점에서 가장 작다**(V자 모양).", "forms": [{"a": "O", "s": "HCl 수용액을 NaOH 수용액으로 적정하면 혼합 용액의 전기 전도도는 중화점에서 가장 작다."}, {"a": "X", "s": "H₂SO₄ 수용액을 Ba(OH)₂ 수용액으로 적정하면 중화점에서도 이온이 많아 전기 전도도가 크다."}]}, {"c": "CH1S-196", "m": "상평형 도달 과정", "ol": "**증발 속도는 일정하고 응축 속도가 커져서** 둘이 같아지는 순간 상평형이다.", "forms": [{"a": "X", "s": "온도가 일정한 밀폐 용기 속 물은 증발 속도가 점점 작아져 응축 속도와 같아지면서 평형에 이른다."}]}, {"c": "CH1S-197", "m": "용해 평형과 포화 용액", "ol": "**포화 용액 = 용해 속도와 석출 속도가 같은 용해 평형** 상태다.", "forms": [{"a": "O", "s": "일정 온도에서 포화 용액의 물을 일부 증발시키면 녹아 있던 용질의 일부가 석출된다."}]}, {"c": "CH1S-199", "m": "pH·pOH 계산", "ol": "**pH = −log[H₃O⁺], 25 °C에서 pH + pOH = 14**: 가수를 곱해 이온 농도부터 구한다.", "forms": [{"a": "X", "s": "log 2 = 0.3일 때 25 °C에서 0.005 M Ba(OH)₂ 수용액의 pH는 11.7이다."}]}, {"c": "CH1S-200", "m": "pH 눈금과 액성", "ol": "**25 °C에서 pH < 7 산성, = 7 중성, > 7 염기성**이며 pH 1 차이는 [H₃O⁺] 10배 차이다.", "forms": [{"a": "O", "s": "25 °C에서 pH 4인 용액의 [OH⁻]는 pH 6인 용액의 [OH⁻]보다 100배 작다."}]}, {"c": "CH1S-201", "m": "Kw와 온도·중성 기준", "ol": "**중성 = [H₃O⁺] = [OH⁻]**: 온도가 오르면 Kw가 커져 중성 pH가 7보다 작아진다.", "forms": [{"a": "X", "s": "Kw가 1.0×10⁻¹²인 온도에서 순수한 물은 pH가 6이므로 산성이다."}]}, {"c": "CH1S-202", "m": "희석과 pH의 한계", "ol": "**묽힌 산은 pH 7에 다가갈 뿐 넘지 않는다**(묽힌 염기도 7 위에 머문다).", "forms": [{"a": "O", "s": "25 °C에서 pH 9인 NaOH 수용액을 물로 1000배 묽히면 pH는 6이 되지 않고 7보다 조금 크다."}]}, {"c": "CH1S-203", "m": "지시약 변색 범위", "ol": "**지시약은 변색 범위로 읽는다**: 메틸오렌지 3.1~4.4, BTB 6.0~7.6, 페놀프탈레인 8.3~10.0이다.", "forms": [{"a": "O", "s": "pH 12인 수용액에 BTB 용액과 페놀프탈레인 용액을 각각 떨어뜨리면 파란색과 붉은색을 띤다."}]}, {"c": "CH1S-204", "m": "표준 용액과 적정 기구", "ol": "**부피 플라스크(만들기)·피펫(취하기)·뷰렛(떨어뜨린 부피 읽기)**이 적정의 세 기구다.", "forms": [{"a": "O", "s": "최소 눈금이 0.1 mL인 뷰렛은 부피를 0.01 mL 자리까지 어림하여 읽는다."}]}, {"c": "CH1S-205", "m": "적정 조작과 오차", "ol": "**몰수를 재는 기구(피펫·뷰렛)는 공세척**하고, 반응 그릇(삼각 플라스크)은 물기가 있어도 된다.", "forms": [{"a": "X", "s": "뷰렛을 증류수로만 헹구고 표준 NaOH 수용액을 채워 산을 적정하면 구한 산의 농도가 실제보다 작다."}]}, {"c": "CH1S-206", "m": "당량점과 종말점", "ol": "**당량점 = 몰수가 같아지는 이론 지점, 종말점 = 색이 변해 멈추는 실제 지점**이다.", "forms": [{"a": "X", "s": "0.1 M HCl 20 mL를 0.1 M Ca(OH)₂로 적정하면 당량점은 Ca(OH)₂ 20 mL를 넣은 지점이다."}]}, {"c": "CH1S-207", "m": "당량점 pH와 지시약 선택", "ol": "**당량점 pH를 변색 범위에 품는 지시약**을 고른다: 약산 적정은 페놀프탈레인, 약염기 적정은 메틸오렌지다.", "forms": [{"a": "X", "s": "0.1 M NH₃ 수용액을 0.1 M HCl로 적정할 때는 페놀프탈레인이 알맞은 지시약이다."}]}, {"c": "CH1S-208", "m": "적정 곡선과 반중화점", "ol": "**반중화점(당량점 부피의 ½)에서 pH = pKa**이다.", "forms": [{"a": "X", "s": "0.1 M 약산 HA 20 mL를 0.1 M NaOH로 적정하면 NaOH 20 mL를 넣은 지점에서 pH = pKa이다."}, {"a": "O", "s": "약산 HA를 NaOH로 적정한 곡선에서 반중화점의 pH가 5.0이면 HA의 Ka는 1.0×10⁻⁵이다."}, {"a": "X", "s": "약산을 NaOH로 적정할 때 반중화점 부근에서는 NaOH를 조금 넣어도 pH가 크게 변한다."}]}, {"c": "CH1S-209", "m": "다양성자산 적정", "ol": "**다양성자산의 당량점은 V, 2V, 3V…로 같은 간격**이다(너무 약한 단계는 보이지 않을 수 있다).", "forms": [{"a": "O", "s": "0.10 M 이양성자산 H₂A 10 mL를 0.10 M NaOH로 적정할 때 두 번째 당량점까지 필요한 NaOH는 20 mL이다."}, {"a": "X", "s": "0.10 M H₂A 20 mL를 0.20 M NaOH로 적정하면 두 번째 당량점은 NaOH 10 mL에서 나타난다."}]}, {"c": "CH1S-210", "m": "혼합 용액 pH 계산", "ol": "**남은 몰수 ÷ 전체 부피**로 농도를 구한 뒤 pH를 계산한다: 섞으면 부피가 합쳐진다.", "forms": [{"a": "X", "s": "log 2 = 0.3일 때 25 °C에서 0.02 M NaOH와 0.01 M HCl을 100 mL씩 섞은 용액의 pH는 12이다."}, {"a": "X", "s": "25 °C에서 0.1 M HCl 100 mL와 0.1 M Ca(OH)₂ 50 mL를 섞은 용액의 pH는 7보다 작다."}]}, {"c": "CH1S-211", "m": "시료 정량·중화열 측정", "ol": "**적정으로 구한 농도 × 희석 배수 = 원래 시료의 농도**다.", "forms": [{"a": "O", "s": "식초 10 mL를 100 mL로 묽힌 용액 20 mL를 0.10 M NaOH 15 mL로 중화했다면 식초의 아세트산은 0.75 M이다."}, {"a": "O", "s": "Mg(OH)₂(58 g/mol) 0.29 g은 0.10 M HCl 100 mL를 완전히 중화할 수 있다."}]}], "CH2": [{"c": "CH2-008", "m": "분산력 세기", "ol": "**분자량·전자 수·분극률 클수록 분산력 큼.** 전자가 많고 느슨할수록, 또 분자가 길쭉해 표면적이 클수록 강해진다.", "forms": [{"a": "O", "s": "분자의 분극률이 클수록 분산력이 커진다."}, {"a": "O", "s": "분산력은 분자의 분극률이 클수록 커진다."}]}, {"c": "CH2-011", "m": "접촉 면적", "ol": "**접촉 면적 클수록 분산력 큼**(긴 사슬 > 구형).", "forms": [{"a": "X", "s": "분자량이 비슷하면 접촉 면적이 작을수록 분산력이 크다."}, {"a": "X", "s": "구형에 가까운 분자가 긴 사슬 분자보다 접촉 면적이 커서 분산력이 크다."}]}, {"c": "CH2-016", "m": "얼음 밀도", "ol": "**얼음 = 수소 결합 규칙 배열로 밀도 작아 뜸.**", "forms": [{"a": "O", "s": "얼음이 물 위에 뜨는 것은 수소 결합에 의한 규칙적 배열로 밀도가 낮아지기 때문이다."}]}, {"c": "CH2-018", "m": "동족 경향", "ol": "**14족: CH₄ < SiH₄ < GeH₄**(수소 결합 없이 분산력만).", "forms": [{"a": "O", "s": "14족 수소화합물 끓는점은 CH₄ < SiH₄ < GeH₄ 순으로, 수소 결합 없이 분산력만 반영한다."}]}, {"c": "CH2-027", "m": "종합 비교", "ol": "**끓는점 = 분자량 + 극성 함께 고려**(무극성이 높을 수도).", "forms": [{"a": "O", "s": "분자량이 큰 무극성 분자가 분자량이 작은 극성 분자보다 끓는점이 높을 수 있다."}]}, {"c": "CH2-032", "m": "이온-쌍극자", "ol": "**이온-쌍극자 힘 = 이온이 물(극성)에 녹을 때 작용.**", "forms": [{"a": "O", "s": "이온-쌍극자 힘은 이온이 물에 녹을 때 작용한다."}]}, {"c": "CH2-043", "m": "운동 에너지와 온도", "ol": "**평균 운동 에너지 ∝ 절대 온도**(속력은 √T). 온도는 곧 평균 운동 에너지이고(분자량 무관), 0 K에서 운동이 멈추기에 절대 온도를 쓴다.", "forms": [{"a": "X", "s": "절대 온도가 2배가 되면 분자의 평균 속력도 2배가 된다."}, {"a": "X", "s": "절대 온도가 2배가 되면 평균 속력도 2배가 된다."}]}, {"c": "CH2-046", "m": "제곱평균제곱근 속력", "ol": "**vrms = √(3RT/M)**(T↑ 커짐, M↑ 작아짐).", "forms": [{"a": "O", "s": "기체의 제곱평균제곱근 속력(vrms)은 √(3RT/M)이다."}, {"a": "O", "s": "제곱평균제곱근 속력(vrms)은 √(3RT/M)이다."}]}, {"c": "CH2-047", "m": "속력 분포", "ol": "**기체 분자는 다양한 속력 분포**(온도↑ → 분포 넓어짐).", "forms": [{"a": "O", "s": "온도가 높을수록 기체 분자의 속력 분포가 넓어진다."}]}, {"c": "CH2-048", "m": "그레이엄 법칙", "ol": "**확산 속도 ∝ 1/√M**(가벼운 기체가 빠름). vrms=√(3RT/M)의 직접 결과이고, √M 차이가 작아 우라늄 농축엔 수천 단계가 든다.", "forms": [{"a": "O", "s": "기체의 확산 속도는 분자량의 제곱근에 반비례한다."}, {"a": "O", "s": "그레이엄 법칙을 이용하면 두 기체의 확산 속도 비로부터 분자량 비를 구할 수 있다."}, {"a": "X", "s": "같은 조건에서 분자량이 큰 기체가 분자량이 작은 기체보다 빨리 확산한다."}]}, {"c": "CH2-055", "m": "반데르발스 식", "ol": "**반데르발스 식 = 분자 부피 + 인력 보정한 상태 방정식.**", "forms": [{"a": "O", "s": "반데르발스 식은 분자 자체 부피와 분자 간 인력을 보정한 상태 방정식이다."}]}, {"c": "CH2-056", "m": "반데르발스 상수", "ol": "**a = 분자 간 인력(압력 보정), b = 분자 부피(부피 보정).** (P+a(n/V)²)(V−nb)=nRT이고, a가 큰 기체는 수소 결합·극성이 강하다.", "forms": [{"a": "O", "s": "반데르발스 상수 a는 분자 간 인력을, b는 분자 자체 부피를 반영한다."}, {"a": "X", "s": "반데르발스 상수 a는 분자 자체의 부피를 반영하는 항이다."}, {"a": "O", "s": "반데르발스 상수 a는 분자 간 인력을 반영하는 항이다."}]}, {"c": "CH2-057", "m": "압축 인자", "ol": "**Z = PV/nRT = V_실제/V_이상**(이상은 Z=1). Z<1은 인력이 수축시킨 것, Z>1은 분자 부피가 버틴 것이고, 보일 온도에서 둘이 상쇄된다.", "forms": [{"a": "O", "s": "압축 인자 Z = PV/nRT이며 이상 기체는 Z = 1이다."}, {"a": "X", "s": "이상 기체의 압축 인자 Z는 1이 아니다."}, {"a": "O", "s": "압축 인자 Z = PV/nRT이고 이상 기체는 Z = 1이다."}]}, {"c": "CH2-058", "m": "압축 인자 해석", "ol": "**인력 지배 Z < 1, 분자 부피 지배 Z > 1.**", "forms": [{"a": "O", "s": "매우 높은 압력에서 실제 기체의 Z는 1보다 커지는 경향이 있다."}, {"a": "O", "s": "분자 간 인력이 지배적이면 Z는 1보다 작아진다."}]}, {"c": "CH2-068", "m": "수상 치환", "ol": "**기체 분압 = 측정 압력 − 수증기압**(빼기).", "forms": [{"a": "O", "s": "수상 치환으로 모은 기체의 측정 압력에는 수증기압이 포함되어 있다."}, {"a": "X", "s": "수상 치환으로 모은 기체의 분압을 구하려면 측정 압력에 수증기압을 더해야 한다."}]}, {"c": "CH2-083", "m": "증기압-온도 곡선", "ol": "**증기압-온도 곡선 = 위로 볼록**(비선형 증가).", "forms": [{"a": "O", "s": "온도가 올라가면 증기 압력은 점점 빠르게(비선형적으로) 증가한다."}]}, {"c": "CH2-087", "m": "증기압 비교", "ol": "**같은 온도: 에탄올 증기압 > 물**(분자 간 힘 약함).", "forms": [{"a": "O", "s": "같은 온도에서 에탄올(C₂H₅OH)이 물보다 증기 압력이 크다."}]}, {"c": "CH2-118", "m": "농도 근사", "ol": "**묽은 수용액: 몰농도 ≈ 몰랄 농도**(물 밀도 약 1이라 부피 ≈ 질량). 진한 용액·비수용매에서는 둘을 구분해야 한다.", "forms": [{"a": "X", "s": "묽은 수용액에서 몰농도는 몰랄 농도보다 항상 훨씬 크다."}, {"a": "O", "s": "묽은 수용액에서 몰농도와 몰랄 농도는 거의 비슷하다."}]}, {"c": "CH2-125", "m": "농도 환산", "ol": "**몰농도↔몰랄 농도 환산 = 밀도 필요**(부피와 질량 연결).", "forms": [{"a": "O", "s": "몰농도를 몰랄 농도로 바꾸려면 용액의 밀도가 필요하다."}]}, {"c": "CH2-131", "m": "몰농도 의미", "ol": "**1 M = 용액 부피 1 L**(물 1 L에 녹이면 ≠ 1 M).", "forms": [{"a": "X", "s": "물 1 L에 용질 1몰을 녹이면 1 M 용액이 된다."}]}, {"c": "CH2-134", "m": "농도 비교", "ol": "**같은 퍼센트라도 분자량 다르면 몰농도 다름.**", "forms": [{"a": "O", "s": "퍼센트 농도가 같아도 용질의 분자량이 다르면 몰농도가 다르다."}]}, {"c": "CH2-137", "m": "증기압 내림", "ol": "**비휘발성 용질 → 증기압 내려감**(몰분율에 비례). 용질이 표면을 차지해 증발을 방해해서이고, 모든 총괄성의 뿌리다.", "forms": [{"a": "O", "s": "증기압 내림의 크기는 용질의 몰분율에 비례한다."}]}, {"c": "CH2-138", "m": "라울 법칙", "ol": "**용액 증기압 = 용매 몰분율 × 순용매 증기압.**", "forms": [{"a": "O", "s": "라울 법칙에 따르면 용액의 증기압은 용매의 몰분율에 순용매의 증기압을 곱한 값이다."}, {"a": "O", "s": "라울 법칙에서 용매의 몰분율이 작아지면 용액의 증기압도 작아진다."}]}, {"c": "CH2-141", "m": "몰랄 오름 상수", "ol": "**Kb, Kf = 용매 고유의 값**(용질 종류와 무관).", "forms": [{"a": "X", "s": "Kb, Kf는 용질의 종류에 따라 정해지는 값이다."}]}, {"c": "CH2-143", "m": "반트호프 인자", "ol": "**i = 입자 수**(NaCl≈2, CaCl₂≈3, 포도당≈1). 총괄성은 입자 수만 세므로 전해질은 i배가 되고, 실제 i는 이온 쌍 탓에 정수보다 살짝 작다.", "forms": [{"a": "O", "s": "CaCl₂는 물에서 입자 수가 약 3배가 된다(i≈3)."}, {"a": "O", "s": "반트호프 인자 i는 용질 1개가 내놓는 입자 수를 반영한다."}]}, {"c": "CH2-144", "m": "전해질 총괄성", "ol": "**전해질 총괄성 > 비전해질**(같은 몰랄 농도, 입자 수 많음).", "forms": [{"a": "O", "s": "같은 몰랄 농도라면 전해질 용액이 비전해질 용액보다 총괄성이 크다."}]}, {"c": "CH2-145", "m": "전해질 계산", "ol": "**전해질 총괄성 = i·K·m**(i를 곱함).", "forms": [{"a": "O", "s": "전해질 용액의 끓는점 오름은 ΔTb = i·Kb·m로 계산한다."}]}, {"c": "CH2-146", "m": "전해질 비교", "ol": "**NaCl > 포도당**(같은 몰랄 농도, 입자 수 2배).", "forms": [{"a": "O", "s": "같은 몰랄 농도면 NaCl 용액이 포도당 용액보다 어는점이 더 많이 내려간다."}, {"a": "X", "s": "0.1 m NaCl 용액과 0.1 m 포도당 용액의 끓는점 오름은 같다."}]}, {"c": "CH2-150", "m": "비전해질 비교", "ol": "**같은 몰랄 농도 비전해질 = 총괄성 같음**(i≈1).", "forms": [{"a": "X", "s": "0.1 m 포도당 용액과 0.1 m 설탕 용액의 어는점 내림은 서로 다르다."}]}, {"c": "CH2-151", "m": "몰랄 상수", "ol": "**Kf, Kb = 용매마다 다름**(물보다 클 수도).", "forms": [{"a": "O", "s": "어는점 내림 상수 Kf는 용매에 따라 물보다 더 클 수도 있다."}]}, {"c": "CH2-156", "m": "반트호프 식", "ol": "**π = MRT**(M = 몰농도, T = 절대 온도). 용질 입자가 기체처럼 압력을 내 이상 기체 식과 같은 꼴이고, 진짜 동력은 섞임 엔트로피라 총괄성이 된다.", "forms": [{"a": "O", "s": "삼투압은 π = MRT(M은 몰농도, 반트호프 인자 = 1로 가정)로 나타낼 수 있다."}, {"a": "O", "s": "삼투압은 πV = nRT 형태로도 나타낼 수 있다."}]}, {"c": "CH2-158", "m": "전해질 삼투압", "ol": "**전해질 삼투압: π = iMRT**(i를 곱함).", "forms": [{"a": "O", "s": "전해질 용액의 삼투압은 π = iMRT로 계산한다."}]}, {"c": "CH2-159", "m": "전해질 비교", "ol": "**전해질 삼투압 > 비전해질**(같은 몰농도, 입자 수 많음).", "forms": [{"a": "O", "s": "같은 몰농도면 전해질 용액이 비전해질 용액보다 삼투압이 크다."}]}, {"c": "CH2-165", "m": "세포와 삼투", "ol": "**고장액 수축·저장액 팽창·등장액 변화 없음.**", "forms": [{"a": "O", "s": "적혈구를 고장액에 넣으면 수축한다."}, {"a": "O", "s": "적혈구를 저장액에 넣으면 팽창하거나 터진다."}, {"a": "X", "s": "적혈구를 저장액에 넣으면 수축한다."}]}, {"c": "CH2-166", "m": "역삼투", "ol": "**역삼투 = 삼투압보다 큰 압력으로 용매를 반대로 이동.**", "forms": [{"a": "O", "s": "역삼투는 삼투압보다 큰 압력을 가해 용매를 반대로 이동시키는 것이다."}]}, {"c": "CH2-168", "m": "분자량 측정", "ol": "**삼투압 측정 → 분자량 계산**(고분자에 유용).", "forms": [{"a": "O", "s": "삼투압 측정으로 용질의 분자량을 구할 수 있다."}, {"a": "O", "s": "삼투압은 고분자(큰 분자)의 분자량 측정에 특히 유용하다."}]}, {"c": "CH2-169", "m": "삼투압 크기", "ol": "**삼투압 = 묽은 용액에서도 크게 나타남**(측정 유리).", "forms": [{"a": "X", "s": "삼투압은 매우 묽은 용액에서는 측정할 수 없을 만큼 작다."}]}, {"c": "CH2-176", "m": "표준 생성 엔탈피", "ol": "**안정한 홑원소 물질의 표준 생성 엔탈피 = 0**(측정 불가라 약속한 기준). 모든 물질을 홑원소 기준으로 적어 두면 ΔH = Σ생성물 − Σ반응물로 나온다.", "forms": [{"a": "X", "s": "산소 기체(O₂)처럼 가장 안정한 홑원소 물질의 표준 생성 엔탈피는 0이 아니다."}, {"a": "O", "s": "표준 생성 엔탈피는 화합물 1몰이 가장 안정한 원소로부터 생성될 때의 엔탈피 변화이다."}, {"a": "X", "s": "산소 기체(O₂)의 표준 생성 엔탈피는 0이 아니다."}, {"a": "O", "s": "가장 안정한 홑원소 물질의 표준 생성 엔탈피는 0이다."}]}, {"c": "CH2-177", "m": "반응엔탈피 계산", "ol": "**반응엔탈피 = 생성물 ΔHf° 합 − 반응물 ΔHf° 합.**", "forms": [{"a": "O", "s": "표준 반응엔탈피는 (생성물 ΔHf° 합) - (반응물 ΔHf° 합)으로 구한다."}, {"a": "X", "s": "표준 반응엔탈피는 (반응물 ΔHf° 합) - (생성물 ΔHf° 합)으로 구한다."}]}, {"c": "CH2-178", "m": "헤스 법칙", "ol": "**헤스 법칙 = 반응엔탈피는 경로와 무관**(엔탈피가 상태 함수=고도 차). 뒤집으면 부호 반대, 계수 곱하면 비례라, 어려운 ΔH를 쉬운 반응들로 조합한다.", "forms": [{"a": "O", "s": "여러 반응식을 더하면 각 ΔH도 더해진다."}]}, {"c": "CH2-179", "m": "결합 에너지", "ol": "**끊기 = 흡열, 형성 = 발열**(ΔH ≈ 반응물 − 생성물 결합 E). 결합은 에너지 우물이라 끊으려면 에너지가 들고, 평균값이라 결과는 근삿값이다.", "forms": [{"a": "O", "s": "결합 에너지로 ΔH ≈ (반응물 결합 에너지 합) - (생성물 결합 에너지 합)이다."}]}, {"c": "CH2-181", "m": "결합 에너지 적용", "ol": "**생성물 결합 강할수록 발열**(결합 에너지 차로 결정).", "forms": [{"a": "X", "s": "생성물의 결합이 더 약할수록(결합 에너지 합이 작을수록) 반응은 발열이다."}]}, {"c": "CH2-184", "m": "엔탈피와 열", "ol": "**일정 압력에서 q = ΔH.**", "forms": [{"a": "O", "s": "일정 압력에서 출입한 열 q는 엔탈피 변화 ΔH와 같다."}]}, {"c": "CH2-186", "m": "생성 엔탈피 해석", "ol": "**생성 엔탈피 음수 = 안정, 양수 = 불안정.**", "forms": [{"a": "X", "s": "표준 생성 엔탈피가 양수이면 그 화합물이 원소보다 안정하다."}]}, {"c": "CH2-195", "m": "자발성 방향", "ol": "**자발적 변화 = 우주(계+주위) 엔트로피 증가 방향.**", "forms": [{"a": "O", "s": "자발적 변화는 우주(계+주위)의 엔트로피가 증가하는 방향으로 일어난다."}]}, {"c": "CH2-197", "m": "깁스 자유 에너지", "ol": "**G = H − TS** (T = 절대 온도). 주위의 엔트로피(−ΔH/T)를 계의 양으로 접어 ΔG<0 하나로 2법칙을 판단하게 만든 함수다.", "forms": [{"a": "O", "s": "깁스 자유 에너지는 G = H - TS로 정의된다."}]}, {"c": "CH2-200", "m": "부호 조합", "ol": "**ΔH<0·ΔS>0 항상 자발, ΔH>0·ΔS<0 항상 비자발**. 부호 같으면 T = ΔH/ΔS에서 갈리고, 그 경계가 곧 녹는점·끓는점이다.", "forms": [{"a": "O", "s": "ΔH < 0이고 ΔS > 0이면 모든 온도에서 자발적이다."}, {"a": "X", "s": "ΔH > 0이고 ΔS < 0이면 모든 온도에서 자발적이다."}, {"a": "O", "s": "ΔH < 0이고 ΔS < 0이면 저온에서 자발적이다."}, {"a": "O", "s": "ΔH > 0이고 ΔS > 0이면 고온에서 자발적이다."}, {"a": "X", "s": "ΔH > 0이고 ΔS > 0이면 저온에서 자발적이다."}, {"a": "O", "s": "ΔH < 0, ΔS > 0이면 온도와 무관하게 자발적이다."}]}, {"c": "CH2-207", "m": "자발성과 속도", "ol": "**자발적이라도 속도는 느릴 수 있음.** 자발성(ΔG, 방향)과 속도(활성화 에너지)는 별개의 축이고, 촉매는 속도만 바꾼다.", "forms": [{"a": "O", "s": "자발적인 반응이라도 반응 속도는 느릴 수 있다."}]}, {"c": "CH2-208", "m": "전환 온도", "ol": "**전환 온도 T = ΔH/ΔS**(ΔG = 0인 온도). ΔG = ΔH − TΔS = 0에서 유도하고, ΔH·ΔS 부호가 같을 때만 경계가 생긴다.", "forms": [{"a": "O", "s": "자발과 비자발의 경계가 되는 온도는 T = ΔH/ΔS로 어림할 수 있다."}]}, {"c": "CH2-209", "m": "엔트로피 감소 반응", "ol": "**계 엔트로피 감소해도 전체 증가하면 반응 일어남.**", "forms": [{"a": "X", "s": "계의 엔트로피가 감소하는 반응은 절대 일어날 수 없다."}]}, {"c": "CH2-212", "m": "용해 단계", "ol": "**떼어내기 = 흡열, 섞임 = 발열**(합이 용해 엔탈피).", "forms": [{"a": "X", "s": "용해 과정에서 용질과 용매 입자 사이의 상호작용은 에너지를 흡수한다."}, {"a": "O", "s": "용질 입자를 서로 떼어내는 과정은 에너지를 흡수한다."}]}, {"c": "CH2-213", "m": "용해 엔탈피", "ol": "**용해 엔탈피 = 흡열일 수도 발열일 수도**(항상 발열 아님).", "forms": [{"a": "O", "s": "용해 엔탈피는 용해 과정 각 단계의 에너지 변화를 합한 값이다."}]}, {"c": "CH2-214", "m": "용해 자발성", "ol": "**흡열 용해 = 엔트로피 증가로 일어남.**", "forms": [{"a": "O", "s": "용해가 흡열인데도 일어나는 것은 엔트로피 증가 때문이다."}, {"a": "O", "s": "용해의 주된 자발성 원동력은 대체로 엔트로피 증가이다."}]}, {"c": "CH2-221", "m": "기체 용해도와 온도", "ol": "**기체 용해도 = 온도 높을수록 작아짐**(용해가 발열, 고체와 반대). 온도를 올리면 평형이 기체 방출 쪽으로 가고, 압력은 반대로 작용한다.", "forms": [{"a": "O", "s": "기체의 용해는 대체로 발열이라 온도가 높으면 덜 녹는다."}]}, {"c": "CH2-222", "m": "헨리 법칙", "ol": "**기체 용해도 ∝ 부분 압력**(온도 일정). 압력이 높을수록 더 녹고(탄산음료·잠수병), 온도가 오르면 오히려 덜 녹는다(고체와 반대).", "forms": [{"a": "O", "s": "헨리 법칙에 따르면 기체의 용해도는 그 기체의 부분 압력에 비례한다."}, {"a": "O", "s": "헨리 법칙은 온도가 일정할 때 성립한다."}, {"a": "O", "s": "헨리 법칙에 따르면 기체의 용해도는 부분 압력에 비례한다."}]}, {"c": "CH2-223", "m": "헨리 응용", "ol": "**탄산음료·잠수병 = 압력과 기체 용해도(헨리 법칙).**", "forms": [{"a": "O", "s": "잠수부의 잠수병은 압력과 기체 용해도의 관계(헨리 법칙)와 관련 있다."}]}, {"c": "CH2-224", "m": "헨리 법칙 계산", "ol": "**부분 압력 2배 → 용해도 2배**(정비례).", "forms": [{"a": "X", "s": "헨리 법칙에서 부분 압력이 2배가 되면 기체 용해도는 절반이 된다."}]}, {"c": "CH2-227", "m": "과포화 용액", "ol": "**과포화 용액 = 용해도보다 많이 녹은 불안정 상태.**", "forms": [{"a": "O", "s": "과포화 용액은 용해도보다 많은 용질이 녹아 있는 불안정한 상태이다."}]}, {"c": "CH2-228", "m": "헨리 법칙 한계", "ol": "**헨리 법칙 = 잘 안 녹는 기체에 잘 맞음**(암모니아는 벗어남).", "forms": [{"a": "O", "s": "헨리 법칙은 물과 반응하거나 매우 잘 녹는 기체에는 잘 맞지 않는다."}]}, {"c": "CH2-235", "m": "활성화 에너지", "ol": "**활성화 에너지 = 봉우리−반응물(장벽), 클수록 느림.** ΔH(끝점 차이)와 독립이라, 발열이어도 Ea가 높으면 느리다.", "forms": [{"a": "X", "s": "활성화 에너지는 반응물과 생성물의 에너지 차이(ΔH)와 같다."}]}, {"c": "CH2-240", "m": "촉매와 엔탈피", "ol": "**촉매는 활성화 에너지만 낮춤**(ΔH·평형 불변). 더 낮은 길을 뚫을 뿐 양쪽 골짜기 높이(ΔH)는 그대로라, 속도만 올리고 어디서 멈출지는 못 바꾼다.", "forms": [{"a": "O", "s": "촉매는 반응엔탈피 ΔH를 변화시키지 않는다."}]}, {"c": "CH2-242", "m": "속도식", "ol": "**v = k[A]^m[B]^n**(k = 속도 상수, m·n = 차수). 차수는 실험으로 정하고(메커니즘 반영), k는 온도가 정한다.", "forms": [{"a": "O", "s": "속도식은 v = k[A]^m[B]^n 형태로 나타낸다."}]}, {"c": "CH2-243", "m": "반응 차수", "ol": "**반응 차수 = 실험으로 결정**(계수와 다를 수 있음). 속도 결정 단계를 비추는 창이라 단일 단계에서만 계수와 같고, 분수·음수도 나온다.", "forms": [{"a": "O", "s": "반응 차수는 속도식에서 각 농도의 지수이다."}, {"a": "X", "s": "반응 차수는 화학 반응식의 계수와 항상 같다."}, {"a": "O", "s": "반응 차수는 실험을 통해 결정한다."}]}, {"c": "CH2-244", "m": "속도 상수", "ol": "**속도 상수 k = 온도·촉매에 의존**(농도와 무관). 농도는 충돌 횟수(속도)를, k는 충돌당 성공 확률을 담아, k=A·e^(−Ea/RT)로 정해진다.", "forms": [{"a": "O", "s": "속도 상수 k는 온도에 따라 달라진다."}, {"a": "X", "s": "속도 상수 k는 반응물의 농도에 따라 달라진다."}]}, {"c": "CH2-245", "m": "아레니우스 식", "ol": "**k = A·e^(-Ea/RT)**(온도 ↑ → k ↑, Ea ↑ → k ↓). 지수항은 문턱 넘을 확률(볼츠만), A는 충돌·배향을 담는다.", "forms": [{"a": "O", "s": "아레니우스 식 k = A·e^(-Ea/RT)에서 온도가 높을수록 k가 커진다."}, {"a": "O", "s": "활성화 에너지가 클수록 같은 온도에서 속도 상수가 작다."}]}, {"c": "CH2-246", "m": "촉매와 역반응", "ol": "**촉매는 정·역반응 모두 빠르게**(평형 위치·K 불변). 공유 봉우리를 낮춰 양방향을 함께 가속하니, 같은 평형에 더 빨리 도달할 뿐이다.", "forms": [{"a": "X", "s": "촉매는 정반응만 빠르게 하고 역반응 속도는 그대로이다."}, {"a": "O", "s": "촉매는 정반응과 역반응을 모두 빠르게 한다."}]}, {"c": "CH2-247", "m": "온도와 유효 충돌", "ol": "**온도 ↑ → 활성화 에너지 넘는 입자 비율 ↑**(유효 충돌 증가). 볼츠만 분포가 높은 쪽으로 이동해 문턱 넘는 꼬리가 커지는 것이 핵심이다.", "forms": [{"a": "X", "s": "온도가 높으면 활성화 에너지를 넘는 입자의 비율이 작아진다."}]}, {"c": "CH2-248", "m": "촉매 작용", "ol": "**촉매 = 활성화 에너지 낮은 새 경로 제공.** 낮아진 문턱을 더 많이 넘어 빨라지고, ΔH와 평형은 바꾸지 않으며 반응 후 회복된다.", "forms": [{"a": "O", "s": "촉매는 더 낮은 활성화 에너지를 갖는 새로운 반응 경로를 제공한다."}]}, {"c": "CH2-250", "m": "전체 차수", "ol": "**전체 차수 = 각 차수의 합**(m + n, 곱 아님).", "forms": [{"a": "O", "s": "전체 반응 차수는 각 반응물에 대한 차수의 합이다."}]}, {"c": "CH2-265", "m": "Ka·Kb 관계", "ol": "**Ka·Kb = Kw**. 두 식을 곱하면 [HA]·[A⁻]가 약분되고 [H⁺][OH⁻]=Kw만 남는다. 짝산-짝염기 세기는 물이 묶어 둔 반비례다.", "forms": [{"a": "O", "s": "짝산-짝염기 관계에서 Ka·Kb = Kw이다."}]}, {"c": "CH2-266", "m": "짝염기 세기", "ol": "**강산일수록 짝염기 약함**(약산일수록 짝염기 강함).", "forms": [{"a": "O", "s": "강산의 짝염기는 매우 약한 염기이다."}]}, {"c": "CH2-268", "m": "pKa", "ol": "**pKa 작을수록 강한 산**(Ka 크면 pKa 작음).", "forms": [{"a": "X", "s": "pKa가 클수록 강한 산이다."}]}, {"c": "CH2-269", "m": "물 이온곱", "ol": "**Kw = [H⁺][OH⁻] = 1×10⁻¹⁴**(25°C).", "forms": [{"a": "X", "s": "물의 자동 이온화 상수 Kw = [H⁺][OH⁻] = 1×10^-7 (25°C)이다."}]}, {"c": "CH2-282", "m": "약산 근사", "ol": "**약산 [H⁺] ≈ √(Ka·C)**(농도보다 작음).", "forms": [{"a": "O", "s": "약산의 [H⁺]는 대략 √(Ka·C)로 어림할 수 있다."}]}, {"c": "CH2-285", "m": "완충 용액", "ol": "**완충 용액 = 약산+짝염기**. 약산은 염기를, 짝염기는 산을 막는 두 저수지다. 강산의 짝염기는 방관자라 완충이 안 된다.", "forms": [{"a": "O", "s": "완충 용액은 약산과 그 짝염기(또는 약염기와 그 짝산)로 이루어진다."}, {"a": "O", "s": "완충 용액은 약산과 그 짝염기로 이루어질 수 있다."}]}, {"c": "CH2-287", "m": "헨더슨-하셀바흐", "ol": "**pH = pKa + log([짝염기]/[산])**([짝염기]=[산]이면 pH=pKa).", "forms": [{"a": "O", "s": "헨더슨-하셀바흐 식은 pH = pKa + log([짝염기]/[산])이다."}, {"a": "X", "s": "완충 용액에서 [짝염기] = [산]이면 pH는 7이다."}, {"a": "O", "s": "완충 용액에서 [짝염기] = [산]이면 pH는 pKa와 같다."}]}, {"c": "CH2-288", "m": "공통 이온 효과", "ol": "**공통 이온 효과 = 이온화 억제**(평형 분자 쪽으로 이동).", "forms": [{"a": "O", "s": "공통 이온 효과로 약산에 그 짝염기를 넣으면 약산의 이온화가 억제된다."}, {"a": "X", "s": "공통 이온 효과로 약산에 그 짝염기를 넣으면 약산의 이온화가 촉진된다."}]}, {"c": "CH2-289", "m": "염 가수분해", "ol": "**강+강 중성, 약산+강염기 염기성, 강산+약염기 산성.** 약한 부모에서 온 이온만 물과 반응하며, 전부 Ka·Kb=Kw로 결정된다.", "forms": [{"a": "O", "s": "염화 암모늄(NH₄Cl) 수용액은 산성이다."}, {"a": "X", "s": "염화 암모늄(NH₄Cl) 수용액은 염기성이다."}]}, {"c": "CH2-299", "m": "중화 양적 관계", "ol": "**nMV = n'M'V'**(가수·농도·부피, H⁺ = OH⁻ 몰수).", "forms": [{"a": "O", "s": "중화 양적 관계는 nMV = n'M'V'로 나타낸다."}]}, {"c": "CH2-304", "m": "강산-강염기 당량점", "ol": "**강산-강염기 당량점 = pH 7**. 남은 이온이 방관자라 물을 안 건드리기 때문이고, 약산이 끼면 짝염기 가수분해로 당량점이 염기성이 된다.", "forms": [{"a": "O", "s": "강산-강염기 적정의 당량점 pH는 7이다."}, {"a": "X", "s": "강산-강염기 적정의 당량점 pH는 7보다 크다."}]}, {"c": "CH2-305", "m": "약산-강염기 당량점", "ol": "**약산-강염기 당량점 = 염기성**(짝염기 가수분해).", "forms": [{"a": "O", "s": "약산-강염기 적정의 당량점은 염기성(pH>7)이다."}, {"a": "X", "s": "약산-강염기 적정의 당량점은 산성(pH<7)이다."}]}, {"c": "CH2-324", "m": "산화수 합", "ol": "**중성 화합물 합 0, 다원자 이온 합 = 전하.**", "forms": [{"a": "O", "s": "다원자 이온에서 산화수의 합은 그 이온의 전하와 같다."}]}, {"c": "CH2-326", "m": "산화제", "ol": "**산화제 = 상대 산화, 자신 환원**(전자 받음). 이름과 달리 자신이 환원되고, 표준 환원 전위가 클수록 강하다.", "forms": [{"a": "O", "s": "산화제는 다른 물질을 산화시키고 자신은 환원된다."}, {"a": "X", "s": "산화제는 전자를 잃는다."}]}, {"c": "CH2-327", "m": "환원제", "ol": "**환원제 = 상대 환원, 자신 산화**(전자 내놓음, 산화수 증가).", "forms": [{"a": "X", "s": "환원제는 다른 물질을 환원시키고 자신도 환원된다."}]}, {"c": "CH2-329", "m": "환원제와 전자", "ol": "**환원제 = 전자를 내놓음**(자신 산화, 상대 환원). 산화제와 짝을 이루고, 주고받은 전자 수는 같다.", "forms": [{"a": "O", "s": "환원제는 전자를 내놓는다(잃는다)."}]}, {"c": "CH2-330", "m": "산화제 산화수", "ol": "**산화제 = 산화수 감소**(전자 받아 환원).", "forms": [{"a": "X", "s": "산화제는 반응에서 자신의 산화수가 증가한다."}]}, {"c": "CH2-331", "m": "환원제 산화수", "ol": "**환원제 = 산화수 증가**(전자 잃어 산화).", "forms": [{"a": "O", "s": "환원제는 반응에서 자신의 산화수가 증가한다."}]}, {"c": "CH2-332", "m": "전자 균형", "ol": "**잃은 전자 수 = 얻은 전자 수**(전자 보존). 두 반쪽의 전자 수를 맞춰 더하면 식이 완성되고, 원자·전하도 함께 맞춘다.", "forms": [{"a": "O", "s": "산화환원 반응에서 잃은 전자 수와 얻은 전자 수는 같다."}, {"a": "X", "s": "산화환원 반응에서 잃은 전자 수가 얻은 전자 수보다 많다."}]}, {"c": "CH2-333", "m": "과산화물", "ol": "**과산화물 산소 = -1**(보통 -2의 예외). 산소-산소 결합 전자를 같은 원자끼리 반씩 나눠서이다.", "forms": [{"a": "X", "s": "과산화물에서 산소의 산화수는 -2이다."}]}, {"c": "CH2-334", "m": "금속 수소화물", "ol": "**금속 수소화물 수소 = -1**(보통 +1의 예외). 금속이 수소보다 전기음성도가 작아 수소가 전자를 가져가서이다.", "forms": [{"a": "X", "s": "금속 수소화물(예: NaH)에서 수소의 산화수는 +1이다."}]}, {"c": "CH2-336", "m": "산화제 역할", "ol": "**산화제 = 자신 환원, 상대 산화**(전자 받음).", "forms": [{"a": "O", "s": "산화제는 환원되면서 다른 물질을 산화시킨다."}]}, {"c": "CH2-341", "m": "다니엘 전지", "ol": "**다니엘 전지: 아연 산화전극, 구리 환원전극.**", "forms": [{"a": "O", "s": "다니엘 전지에서 아연(Zn)이 산화전극이다."}, {"a": "X", "s": "다니엘 전지에서 구리(Cu)가 산화전극이다."}]}, {"c": "CH2-342", "m": "염다리", "ol": "**염다리 = 이온 이동으로 전하 균형 유지**(전자는 도선).", "forms": [{"a": "O", "s": "염다리는 이온의 이동으로 양쪽 용액의 전하 균형을 유지한다."}]}, {"c": "CH2-343", "m": "표준 수소 전극", "ol": "**표준 수소 전극 = 표준 환원 전위 0 V(기준).** 전위는 회로상 차이로만 재므로 절대값이 없고, 해수면처럼 0을 약속한 것이다.", "forms": [{"a": "O", "s": "표준 수소 전극의 표준 환원 전위는 0 V로 정한다."}, {"a": "X", "s": "표준 수소 전극의 표준 환원 전위는 1 V로 정한다."}]}, {"c": "CH2-344", "m": "전지 전위", "ol": "**E°cell = E°(환원전극) - E°(산화전극).**", "forms": [{"a": "O", "s": "표준 전지 전위는 E°cell = E°(환원전극) - E°(산화전극)이다."}, {"a": "X", "s": "표준 전지 전위는 E°cell = E°(산화전극) - E°(환원전극)이다."}]}, {"c": "CH2-345", "m": "자발성", "ol": "**E°cell 양수 → 자발적**(ΔG < 0). E°cell은 전자를 미는 전압이라 양수면 전자가 스스로 흐르고, ΔG°=−nFE°의 음부호가 이를 자발성과 맞물린다.", "forms": [{"a": "O", "s": "E°cell이 양수이면 그 전지 반응은 자발적이다."}]}, {"c": "CH2-346", "m": "표준 환원 전위", "ol": "**표준 환원 전위 큼 = 환원 잘 됨(좋은 산화제).** 큰 쪽이 환원극이 되고, E°cell = 환원극 − 산화극으로 자발성을 정한다.", "forms": [{"a": "O", "s": "표준 환원 전위가 클수록 환원이 잘 일어난다."}, {"a": "X", "s": "표준 환원 전위가 클수록 환원되기 어렵다."}]}, {"c": "CH2-348", "m": "전기분해 전극", "ol": "**전기분해: (-)극 환원, (+)극 산화.** 환원=음극·산화=양극은 전지·전기분해 공통이고, 전원 극성 부호만 다르다.", "forms": [{"a": "X", "s": "전기분해에서 (-)극과 연결된 전극에서 산화가 일어난다."}]}, {"c": "CH2-349", "m": "패러데이 법칙", "ol": "**석출량 ∝ 전하량.** 본질은 전자 세기다: 전자 몰수 = Q/F, 석출 몰수 = (Q/F)/n이라 질량 = (Q/F)(M/n).", "forms": [{"a": "X", "s": "패러데이 법칙에서 석출량은 전하량과 무관하다."}]}, {"c": "CH2-367", "m": "아민", "ol": "**아민 = 아미노기(-NH₂), 염기성**(H⁺ 받음).", "forms": [{"a": "O", "s": "아미노기(-NH₂)를 가진 아민은 염기성을 나타낸다."}]}, {"c": "CH2-368", "m": "알데하이드", "ol": "**알데하이드 = 폼일기(-CHO)**(산화 시 카복실산).", "forms": [{"a": "X", "s": "알데하이드는 카복실기(-COOH)를 가진다."}]}, {"c": "CH2-369", "m": "케톤", "ol": "**케톤 = 카보닐기(C=O) 가운데**(알데하이드는 끝).", "forms": [{"a": "O", "s": "케톤은 카보닐기(C=O)를 분자 안쪽에 가진다."}]}

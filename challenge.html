 증가하면 전지 전위는 커진다."}]}, {"c": "CH2-473", "m": "네른스트·농도차전지", "ol": "**농도차 전지는 표준 전지 전위가 0이지만 농도 차이로 기전력이 생긴다.**", "forms": [{"a": "X", "s": "농도차 전지는 표준 전지 전위가 0이므로 기전력이 생기지 않는다."}]}, {"c": "CH2-474", "m": "네른스트·농도차전지", "ol": "**농도차 전지에서 농도가 묽은 쪽 전극이 산화전극(−극)이다.**", "forms": [{"a": "O", "s": "농도차 전지에서 농도가 묽은 쪽 전극이 산화전극(−극)이다."}]}, {"c": "CH2-475", "m": "네른스트·농도차전지", "ol": "**깁스 자유에너지와 표준 전지 전위의 관계는 ΔG° = −nFE°이다.**", "forms": [{"a": "O", "s": "깁스 자유에너지와 표준 전지 전위의 관계는 ΔG° = −nFE°이다."}]}, {"c": "CH2-476", "m": "네른스트·농도차전지", "ol": "**ΔG°가 음수이면 E°cell은 양수이고 반응은 자발적이다.**", "forms": [{"a": "O", "s": "ΔG°가 음수이면 E°cell은 양수이고 반응은 자발적이다."}]}, {"c": "CH2-477", "m": "네른스트·농도차전지", "ol": "**전지 전위는 세기 성질이므로 반응식의 계수를 곱해도 변하지 않는다.**", "forms": [{"a": "X", "s": "전지 전위는 크기 성질이므로 반응식의 계수를 곱하면 그 배가 된다."}]}], "GC": [{"c": "GC-021", "m": "양자수 범위", "ol": "**ml = 방향, -l~+l, (2l+1)개.** 각 오비탈에 파울리로 2개씩 들어가 용량 2(2l+1)이고, 네 양자수가 전자를 완전히 지정한다.", "forms": [{"a": "O", "s": "자기 양자수 ml은 -l부터 +l까지의 정수 값을 가진다."}]}, {"c": "GC-023", "m": "양자수 범위", "ol": "**n≥1 → l: 0~n-1 → ml: -l~+l → ms: ±1/2.** 오비탈 (2l+1)·n², 전자 2n².", "forms": [{"a": "X", "s": "방위 양자수 l은 0부터 n까지의 값을 가진다."}, {"a": "O", "s": "방위 양자수 l은 0부터 n-1까지의 값을 가진다."}]}, {"c": "GC-028", "m": "훈트 규칙", "ol": "**같은 에너지 오비탈은 하나씩 먼저(평행 스핀), 그 다음 짝짓기.** 반발을 줄이고 교환 안정화를 얻기 위함이며, 홀전자 수가 자기성을 정한다.", "forms": [{"a": "O", "s": "훈트 규칙에 따라 같은 에너지의 오비탈에는 전자가 먼저 하나씩 채워진다."}]}, {"c": "GC-031", "m": "에너지 순서", "ol": "**4s가 3d보다 먼저.** 다전자 원자 오비탈 에너지는 n과 l에 함께 의존.", "forms": [{"a": "O", "s": "다전자 원자에서 4s 오비탈은 3d보다 먼저 채워진다."}]}, {"c": "GC-032", "m": "안정 배치", "ol": "**d⁵·d¹⁰이 안정 → Cr=4s¹3d⁵, Cu=4s¹3d¹⁰.** 쌓음의 대표 예외.", "forms": [{"a": "O", "s": "한 부껍질이 절반 채워지거나 가득 차면 비교적 안정하다."}]}, {"c": "GC-049", "m": "옥텟 예외", "ol": "예외 셋: **붕소(미만), 3주기↑(확장), 홀수 전자(라디칼).**", "forms": [{"a": "X", "s": "BF₃, BeCl₂는 옥텟을 초과하는(확장 옥텟) 예외이다."}, {"a": "O", "s": "SF₆, PCl₅는 옥텟을 초과하는(확장 옥텟) 예외이다."}]}, {"c": "GC-050", "m": "형식 전하", "ol": "**형식 전하 = 원자가 − 비공유 − 결합/2.** 합은 분자 전하이고, 결합을 반반으로 센 장부값(진짜 전하·산화수와 다름)이다. 0에 가까울수록 안정.", "forms": [{"a": "O", "s": "형식 전하 = 원자가 전자 - 비공유 전자 - (결합 전자/2)이다."}]}, {"c": "GC-053", "m": "분자 극성", "ol": "**결합 극성 + 모양.** 대칭이면 상쇄(무극성), 비대칭이면 극성.", "forms": [{"a": "O", "s": "분자의 극성은 결합의 극성과 분자의 기하 구조에 함께 의존한다."}, {"a": "O", "s": "CO₂는 결합은 극성이지만 직선형이라 분자 전체는 무극성이다."}, {"a": "X", "s": "결합이 모두 극성이면 분자도 반드시 극성이다."}]}, {"c": "GC-055", "m": "VSEPR 구조", "ol": "**2직선·3평면삼각·4정사면체·5삼각쌍뿔·6정팔면체.** 4는 정사면체(109.5°).", "forms": [{"a": "O", "s": "전자 영역(입체수)이 2이면 직선형, 3이면 평면 삼각형, 4이면 정사면체이다."}, {"a": "O", "s": "입체수가 5이면 삼각쌍뿔, 6이면 정팔면체 구조이다."}]}, {"c": "GC-056", "m": "비공유 전자쌍", "ol": "비공유 전자쌍 = **반발 큼 → 결합각 줄임.** CH₄>NH₃>H₂O.", "forms": [{"a": "X", "s": "비공유 전자쌍은 결합 전자쌍보다 반발이 작아 결합각을 늘린다."}]}, {"c": "GC-059", "m": "시그마·파이", "ol": "**σ 정면(강)·π 옆(약).** 첫 결합은 σ. π는 밀도가 핵 사이에 덜 쌓여 약하고, 나란함이 필요해 회전을 잠가 시스-트랜스를 만든다.", "forms": [{"a": "O", "s": "시그마 결합은 오비탈이 머리를 맞대어, 파이 결합은 옆으로 겹쳐 형성된다."}, {"a": "O", "s": "이중 결합은 시그마 1개와 파이 1개, 삼중 결합은 시그마 1개와 파이 2개로 이루어진다."}, {"a": "X", "s": "삼중 결합은 시그마 결합 3개로 이루어진다."}, {"a": "O", "s": "삼중 결합은 시그마 1개와 파이 2개로 이루어진다."}]}, {"c": "GC-060", "m": "분자 오비탈", "ol": "**결합성(낮음)·반결합성(높음) 둘 생성.** 반결합성 전자는 결합을 약화.", "forms": [{"a": "O", "s": "분자 오비탈에는 결합성 오비탈과 반결합성 오비탈이 있다."}]}, {"c": "GC-061", "m": "결합 차수", "ol": "**차수 = (결합성 − 반결합성)/2.** 반결합성은 마디로 결합을 상쇄해 뺀다. O₂는 차수 2지만 π* 홀전자로 상자기성(루이스 패배), O₂⁺은 반결합성이 줄어 O₂보다 강하다.", "forms": [{"a": "X", "s": "결합 차수 = (결합성 전자 수 + 반결합성 전자 수)/2이다."}, {"a": "X", "s": "결합 차수가 0이면 그 분자는 안정하게 존재한다."}, {"a": "O", "s": "결합 차수 = (결합성 전자 수 - 반결합성 전자 수)/2이다."}]}, {"c": "GC-062", "m": "자기성", "ol": "**홀전자 → 상자기성(끌림), 짝지음 → 반자기성.** O₂는 상자기성.", "forms": [{"a": "O", "s": "홀전자가 있는 분자는 상자기성을 띤다."}]}, {"c": "GC-066", "m": "vrms", "ol": "**vrms = √(3RT/M).** (1/2)mv²=(3/2)kT에서 나온 식이라 3은 3차원, 제곱근은 KE∝v²에서 온다. 온도 4배 → 속력 2배.", "forms": [{"a": "O", "s": "제곱평균제곱근 속력 vrms = √(3RT/M)이다."}]}, {"c": "GC-068", "m": "그레이엄", "ol": "**확산 속도 ∝ 1/√M.** 가벼울수록 빠름, M 4배 → 속도 1/2.", "forms": [{"a": "O", "s": "그레이엄 법칙에 따르면 기체의 확산 속도는 분자량의 제곱근에 반비례한다."}]}, {"c": "GC-072", "m": "반데르발스", "ol": "**a = 인력 보정, b = 부피 보정.** 실제 기체용 보정식.", "forms": [{"a": "O", "s": "반데르발스 식은 분자 자체 부피와 분자 간 인력을 보정한 식이다."}]}, {"c": "GC-078", "m": "단위 세포", "ol": "**SC 1 · BCC 2 · FCC 4.** 꼭짓점 1/8, 면 1/2, 체심 1.", "forms": [{"a": "X", "s": "면심 입방(FCC) 단위 세포에는 원자가 2개 들어 있다."}, {"a": "O", "s": "체심 입방(BCC) 단위 세포에는 원자가 2개 들어 있다."}, {"a": "O", "s": "면심 입방(FCC) 단위 세포에는 원자가 4개 들어 있다."}]}, {"c": "GC-079", "m": "상평형 그림", "ol": "**축은 온도·압력.** 삼중점 = 세 상 공존, 임계점 너머 = 액기 구분 소멸.", "forms": [{"a": "X", "s": "상평형 그림에서 삼중점은 두 상이 공존하는 점이다."}]}, {"c": "GC-083", "m": "라울 법칙", "ol": "**P_용액 = 용매 몰분율 × 순용매 증기압.** 비휘발성 용질 → 증기압 내림.", "forms": [{"a": "O", "s": "라울 법칙에 따르면 용액의 증기압은 용매 몰분율 × 순용매 증기압이다."}]}, {"c": "GC-084", "m": "끓는점 오름·어는점 내림", "ol": "**끓는점↑·어는점↓, ΔT = K·m**(곱). 전해질이 더 큼.", "forms": [{"a": "O", "s": "끓는점 오름은 ΔTb = Kb·m, 어는점 내림은 ΔTf = Kf·m이다."}]}, {"c": "GC-085", "m": "삼투압", "ol": "**π = MRT**(진할수록·온도↑ 큼). 용매는 묽은 쪽 → 진한 쪽.", "forms": [{"a": "O", "s": "삼투압은 π = MRT(M은 몰농도, 반트호프 인자 = 1로 가정)로 나타낸다."}, {"a": "X", "s": "삼투압은 용액이 묽을수록 크다."}]}, {"c": "GC-086", "m": "반트호프 인자", "ol": "**i = 1몰당 입자 수.** 비전해질 1, NaCl 2, CaCl₂ 3.", "forms": [{"a": "O", "s": "전해질 용액의 총괄성은 반트호프 인자 i를 곱해 계산한다."}]}, {"c": "GC-088", "m": "몰랄 상수", "ol": "**Kf, Kb = 용매의 상수**(용질 무관). 용질은 m·i로 반영.", "forms": [{"a": "X", "s": "어는점 내림 상수 Kf는 용질의 종류에 따라 정해진다."}]}, {"c": "GC-089", "m": "전해질 비교", "ol": "같은 농도면 **NaCl > 포도당**(입자 수). CaCl₂ > NaCl > 포도당.", "forms": [{"a": "X", "s": "같은 몰랄 농도면 포도당 용액이 NaCl 용액보다 어는점이 더 많이 내려간다."}]}, {"c": "GC-095", "m": "일의 부호", "ol": "**팽창 w < 0(일 함), 압축 w > 0(일 받음).**", "forms": [{"a": "X", "s": "계가 외부에 일을 하면(기체 팽창) 일의 부호는 w > 0이다."}]}, {"c": "GC-096", "m": "정적 과정", "ol": "**일정 부피 → w = 0 → q = ΔU.**", "forms": [{"a": "O", "s": "일정 부피에서 출입한 열 q는 내부 에너지 변화 ΔU와 같다."}]}, {"c": "GC-099", "m": "엔탈피 정의", "ol": "**H = U + PV, 정압 q = ΔH.** 발열 ΔH<0, 흡열 ΔH>0.", "forms": [{"a": "X", "s": "엔탈피는 H = U - PV로 정의된다."}, {"a": "O", "s": "엔탈피는 H = U + PV로 정의된다."}]}, {"c": "GC-102", "m": "반응엔탈피 계산", "ol": "**ΔH = 생성물 합 - 반응물 합**(계수 곱). 순서 주의.", "forms": [{"a": "O", "s": "표준 반응엔탈피는 (생성물 ΔHf° 합) - (반응물 ΔHf° 합)이다."}, {"a": "X", "s": "표준 반응엔탈피는 (반응물 ΔHf° 합) - (생성물 ΔHf° 합)이다."}]}, {"c": "GC-106", "m": "제2법칙", "ol": "**자발 → 우주 총 엔트로피 증가**(계는 줄 수도).", "forms": [{"a": "O", "s": "열역학 제2법칙은 자발적 과정에서 우주의 엔트로피가 증가한다는 것이다."}]}, {"c": "GC-107", "m": "제3법칙", "ol": "**0 K 완전 결정 S = 0**(배열 하나). 절대 엔트로피의 기준.", "forms": [{"a": "X", "s": "열역학 제3법칙에 따르면 0 K의 완전한 결정의 엔트로피는 최대이다."}]}, {"c": "GC-114", "m": "자유 에너지와 평형", "ol": "**ΔG° = -RT ln K** (ΔG = ΔG° + RT ln Q에서 평형 조건을 넣은 것). K>1이면 ΔG°<0이고, 지수 관계라 작은 ΔG°가 평형을 크게 몰아붙인다.", "forms": [{"a": "O", "s": "표준 상태에서 ΔG° = -RT ln K이다."}, {"a": "X", "s": "평형 상수 K가 1보다 크면 ΔG°는 양수이다."}]}, {"c": "GC-117", "m": "평형 상수", "ol": "**Kc = 생성물/반응물(계수 거듭제곱), 평형 농도.** 순수 고체·액체는 빠지고, ΔG° = −RT ln K로 자발성과 묶인다.", "forms": [{"a": "O", "s": "평형 상수 Kc는 생성물 농도를 반응물 농도로 나눈 것이다(각 농도는 계수만큼 거듭제곱)."}]}, {"c": "GC-118", "m": "Kp", "ol": "**Kp = 부분 압력 평형 상수.** Kp = Kc(RT)^Δn이라, 기체 몰수가 안 변할 때(Δn=0)만 Kc와 같다.", "forms": [{"a": "O", "s": "Kp는 부분 압력을 이용해 나타낸 평형 상수이다."}]}, {"c": "GC-119", "m": "Kc-Kp 관계", "ol": "**Kp = Kc(RT)^Δn**(P = c·RT를 대입한 결과). Δn은 기체(생성물−반응물)만 세고, Δn=0이면 Kp=Kc다.", "forms": [{"a": "O", "s": "Kp = Kc(RT)^Δn 관계가 성립한다."}]}, {"c": "GC-120", "m": "평형 상수 식", "ol": "**순수 고체·액체 제외(활동도 1), 기체·용질만 포함.**", "forms": [{"a": "O", "s": "순수한 고체와 액체는 평형 상수 식에 포함하지 않는다."}, {"a": "X", "s": "순수한 고체와 액체도 평형 상수 식에 농도로 포함한다."}]}, {"c": "GC-122", "m": "평형 상수 의존성", "ol": "**K는 온도에만 의존.** ΔG° = ΔH° − TΔS°에 온도가 들어가서이고, 농도·압력·촉매는 K가 아니라 평형 위치만 옮긴다.", "forms": [{"a": "O", "s": "평형 상수는 온도에만 의존하고 농도·압력에는 무관하다."}, {"a": "X", "s": "평형 상수는 반응물의 처음 농도에 따라 달라진다."}]}, {"c": "GC-123", "m": "반응지수", "ol": "**Q<K 정반응·Q>K 역반응·Q=K 평형.** 반응은 Q가 K를 향해 가고, ΔG = RT ln(Q/K)라 이 비교가 곧 자발성이다.", "forms": [{"a": "O", "s": "반응지수 Q가 K보다 작으면 정반응이 우세하게 진행된다."}, {"a": "O", "s": "반응지수 Q가 K보다 크면 역반응이 우세하게 진행된다."}]}, {"c": "GC-126", "m": "압력 변화", "ol": "**압력↑ → 몰수 적은 쪽, 압력↓ → 많은 쪽**(K 불변). 일정 부피에서 비활성 기체를 넣으면 부분 압력이 그대로라 이동하지 않는다.", "forms": [{"a": "O", "s": "압력을 높이면(부피 감소) 기체 몰수가 적은 쪽으로 평형이 이동한다."}, {"a": "X", "s": "압력을 높이면 기체 몰수가 많은 쪽으로 평형이 이동한다."}]}, {"c": "GC-127", "m": "온도 변화", "ol": "**온도↑ → 흡열 방향.** 흡열 정반응(K↑), 발열 역반응(K↓).", "forms": [{"a": "X", "s": "발열 반응에서 온도를 높이면 정반응 쪽으로 이동하고 K가 증가한다."}, {"a": "O", "s": "흡열 반응에서 온도를 높이면 정반응 쪽으로 이동하고 K가 증가한다."}]}, {"c": "GC-129", "m": "비활성 기체", "ol": "**일정 부피 비활성 기체 → 이동 없음**(부분 압력·Q 불변). 일정 압력은 부피가 늘어 부분 압력이 변하므로 몰수 많은 쪽으로 이동한다.", "forms": [{"a": "O", "s": "일정 부피에서 비활성 기체를 넣어도 평형은 이동하지 않는다."}]}, {"c": "GC-131", "m": "용해도곱", "ol": "**Ksp = 난용성 염 용해 평형 상수.** 같은 형태면 클수록 잘 녹고 온도에만 의존하며, 형태가 다르면 몰 용해도로 비교한다.", "forms": [{"a": "O", "s": "용해도곱 Ksp는 난용성 염의 용해 평형 상수이다."}]}, {"c": "GC-132", "m": "공통 이온 효과", "ol": "**공통 이온 → 용해도↓(침전 쪽), Ksp 불변.** Q가 Ksp 위로 올라가 되돌리는 것이고, 완충(약산+짝염기)과 같은 Q-vs-K 원리다.", "forms": [{"a": "X", "s": "공통 이온 효과로 공통 이온을 넣으면 난용성 염의 용해도가 커진다."}, {"a": "O", "s": "공통 이온을 넣으면 난용성 염의 용해도가 작아진다."}]}, {"c": "GC-133", "m": "침전 조건", "ol": "**Q > Ksp 침전, Q = Ksp 포화, Q < Ksp 침전 없음.** 용해 평형의 Q와 K 비교이고, 공통 이온이 있으면 이온곱이 커져 침전이 잘 생긴다.", "forms": [{"a": "O", "s": "이온곱이 Ksp보다 크면 침전이 생긴다."}, {"a": "X", "s": "이온곱이 Ksp보다 작으면 침전이 생긴다."}]}, {"c": "GC-134", "m": "Ksp 식", "ol": "**Ksp = 이온 농도의 곱(계수 거듭제곱), 고체 제외.** AB₂ → [A][B]².", "forms": [{"a": "O", "s": "Ksp 식에서도 녹지 않은 순수한 고체는 포함하지 않는다."}]}, {"c": "GC-149", "m": "pKa", "ol": "**pKa = -log Ka, 작을수록 강산.** pH가 작을수록 산성인 것과 같은 구조이고, pKa는 반중화점의 pH다.", "forms": [{"a": "O", "s": "pKa = -log Ka이고, pKa가 작을수록 강한 산이다."}]}, {"c": "GC-154", "m": "염 가수분해", "ol": "**약한 쪽 짝이 가수분해.** NaCl 중성, CH₃COONa 염기성, NH₄Cl 산성.", "forms": [{"a": "X", "s": "약산과 강염기로 만든 염(CH₃COONa)의 수용액은 산성이다."}, {"a": "X", "s": "강산과 약염기로 만든 염(NH₄Cl)의 수용액은 염기성이다."}]}, {"c": "GC-167", "m": "염다리", "ol": "**염다리 = 이온 이동으로 전하 균형.** 전자는 도선 담당.", "forms": [{"a": "O", "s": "염다리는 이온 이동으로 두 반쪽 전지의 전하 균형을 유지한다."}]}, {"c": "GC-169", "m": "전지 전위", "ol": "**E°cell = E°(환원극) - E°(산화극)**, 양수면 자발적.", "forms": [{"a": "O", "s": "표준 전지 전위는 E°cell = E°(환원극) - E°(산화극)이다."}, {"a": "X", "s": "표준 전지 전위는 E°cell = E°(산화극) - E°(환원극)이다."}]}, {"c": "GC-171", "m": "표준 환원 전위", "ol": "**E° 크면 산화제 강함, E° 작으면 환원제 강함.** 환원되려는 경향의 척도라 환원제 세기와 반대로 읽고, 표 하나로 방향·세기를 다 안다.", "forms": [{"a": "O", "s": "표준 환원 전위가 클수록 환원이 잘 일어나고 산화제로서 강하다."}]}, {"c": "GC-172", "m": "자유 에너지와 전위", "ol": "**ΔG° = -nFE°**(nF=총 전하, ×E°=일, −는 계가 일을 내줌). ΔG°=−RT ln K와 합치면 E°=(RT/nF)ln K라, E°·ΔG°·K는 같은 사실의 세 언어다.", "forms": [{"a": "O", "s": "자유 에너지와 전위의 관계는 ΔG° = -nFE°이다."}, {"a": "X", "s": "자유 에너지와 전위의 관계는 ΔG° = +nFE°이다."}]}, {"c": "GC-173", "m": "네른스트 식", "ol": "**E = E° - (RT/nF) ln Q**, 평형에서 E = 0. ΔG = ΔG° + RT ln Q와 같은 식이고, 평형의 E=0이 K를 준다.", "forms": [{"a": "O", "s": "네른스트 식은 E = E° - (RT/nF) ln Q이다."}, {"a": "X", "s": "네른스트 식에서 평형에 도달하면 E는 최대가 된다."}, {"a": "O", "s": "네른스트 식에서 평형에 도달하면 전지 전위 E = 0이다."}]}, {"c": "GC-175", "m": "전기분해 전극", "ol": "**전기분해: (-)극 환원, (+)극 산화.** 환원은 늘 cathode.", "forms": [{"a": "O", "s": "전기분해에서 (-)극과 연결된 전극에서 환원이, (+)극에서 산화가 일어난다."}]}, {"c": "GC-176", "m": "패러데이 법칙", "ol": "**석출량 ∝ 전하량(Q = It).** 전하량을 F로 나눠 전자 몰수를 구하고, 반응식의 전자 수로 물질 몰수를 환산한다.", "forms": [{"a": "O", "s": "패러데이 법칙에 따르면 석출량은 흘려준 전하량에 비례한다."}]}, {"c": "GC-177", "m": "패러데이 상수", "ol": "**Q = It, 1 F ≈ 96500 C = 전자 1몰.**", "forms": [{"a": "O", "s": "전하량은 전류와 시간의 곱(Q = It)이고, 1 패러데이는 약 96500 C이다."}]}, {"c": "GC-178", "m": "패러데이 계산", "ol": "**석출 몰수 = 전자 몰수 / 전하수.** 같은 전하량이면 +1가가 +2가의 2배.", "forms": [{"a": "O", "s": "같은 전하량이면 +1가 이온이 +2가 이온보다 두 배의 몰수가 석출된다."}]}, {"c": "GC-182", "m": "반응 차수", "ol": "**차수 = 농도 지수(실험 결정).** 계수와 다를 수 있고 분수도 가능.", "forms": [{"a": "O", "s": "반응 차수는 속도식에서 농도의 지수이며 실험으로 결정한다."}]}, {"c": "GC-184", "m": "속도 상수", "ol": "**k는 온도·촉매에 의존, 농도와 무관.**", "forms": [{"a": "O", "s": "속도 상수 k는 온도에 의존하고 농도와는 무관하다."}, {"a": "X", "s": "속도 상수 k는 반응물의 농도가 커지면 함께 커진다."}]}, {"c": "GC-185", "m": "0차 반응", "ol": "**0차: v = k(농도 무관), [A]-t 직선.**", "forms": [{"a": "X", "s": "0차 반응의 속도는 반응물 농도에 비례한다."}, {"a": "O", "s": "0차 반응의 반감기는 초기 농도에 비례한다."}]}, {"c": "GC-186", "m": "1차 반응", "ol": "**1차: v = k[A], ln[A]-t 직선, 반감기 일정.**", "forms": [{"a": "O", "s": "1차 반응의 속도는 반응물 농도에 비례한다."}]}, {"c": "GC-187", "m": "2차 반응", "ol": "**2차: v = k[A]², 1/[A]-t 직선, 반감기 초기 농도에 반비례.**", "forms": [{"a": "O", "s": "2차 반응의 속도는 반응물 농도의 제곱에 비례한다."}, {"a": "O", "s": "2차 반응의 반감기는 초기 농도에 반비례한다."}]}, {"c": "GC-188", "m": "적분 속도식", "ol": "**0차 [A]·1차 ln[A]·2차 1/[A]가 t에 대해 직선.**", "forms": [{"a": "O", "s": "1차 반응에서 ln[A]와 시간 t의 그래프는 직선이다."}, {"a": "O", "s": "0차 반응에서 [A]와 시간 t의 그래프는 직선이다."}, {"a": "X", "s": "2차 반응에서 [A]와 시간 t의 그래프가 직선이다."}]}, {"c": "GC-189", "m": "반감기", "ol": "**1차 반감기만 농도 무관(일정).** 1차는 개별 확률이 일정해서(방사성 붕괴), 0차는 비례, 2차는 반비례. 반감기 거동이 차수를 진단한다.", "forms": [{"a": "O", "s": "1차 반응의 반감기는 t½ = ln2/k로 초기 농도와 무관하게 일정하다."}, {"a": "X", "s": "1차 반응의 반감기는 초기 농도에 비례해 커진다."}, {"a": "X", "s": "모든 반응의 반감기는 초기 농도와 무관하게 일정하다."}]}, {"c": "GC-192", "m": "아레니우스", "ol": "**k = A·e^(−Ea/RT).** 지수항은 Ea를 넘는 분자의 볼츠만 비율이라 온도가 오르면 지수적으로 커지고, ln k vs 1/T 기울기(−Ea/R)로 Ea를 잰다.", "forms": [{"a": "X", "s": "아레니우스 식에서 활성화 에너지가 클수록 같은 온도에서 k가 크다."}]}, {"c": "GC-193", "m": "빈도 인자", "ol": "**A = 충돌 빈도 + 배향 인자.** Ea(장벽)와 별개로 유효 충돌의 충돌·방향 조건을 담는다.", "forms": [{"a": "O", "s": "빈도 인자 A는 충돌 빈도와 방향(배향) 인자를 반영한다."}]}, {"c": "GC-194", "m": "온도와 충돌", "ol": "**온도↑ → 장벽 넘는 분자 비율↑**(Ea는 불변). 에너지 분포가 높은 쪽으로 옮겨 문턱을 넘는 비율이 급증하는 것이 주된 효과다.", "forms": [{"a": "O", "s": "온도가 높을수록 활성화 에너지를 넘는 분자의 비율이 커진다."}]}, {"c": "GC-195", "m": "메커니즘", "ol": "**단일 단계만 계수로 속도식.** 여러 단계는 메커니즘에서 유도.", "forms": [{"a": "O", "s": "단일 단계(소반응) 반응에서는 속도식을 그 반응식 계수로부터 바로 쓸 수 있다."}]}, {"c": "GC-196", "m": "속도 결정 단계", "ol": "**전체 속도 = 가장 느린 단계(병목)가 결정.** 빠른 단계는 앞지르지 못하고, 차수가 계수와 다른 것은 차수가 이 단계를 반영하기 때문이다.", "forms": [{"a": "X", "s": "여러 단계 반응의 전체 속도는 가장 빠른 단계가 결정한다."}]}, {"c": "GC-197", "m": "중간체", "ol": "**중간체 = 생성됐다 소비됨.** 전체 반응식에 안 나타남.", "forms": [{"a": "O", "s": "반응 중간체는 한 단계에서 생성되었다가 이후 단계에서 소비된다."}, {"a": "X", "s": "반응 중간체는 최종 생성물로 남는다."}]}, {"c": "GC-201", "m": "중심 금속", "ol": "**중심 금속 = 전이 금속, 루이스 산**(전자쌍 받음).", "forms": [{"a": "O", "s": "중심 금속 이온은 주로 전이 금속이며 전자쌍을 받는 루이스 산으로 작용한다."}]}, {"c": "GC-202", "m": "리간드", "ol": "**리간드 = 전자쌍 주는 루이스 염기.**", "forms": [{"a": "O", "s": "리간드는 비공유 전자쌍을 제공하는 루이스 염기이다."}, {"a": "X", "s": "리간드는 중심 금속에서 전자쌍을 받는 루이스 산이다."}]}, {"c": "GC-203", "m": "배위 결합", "ol": "**배위 결합 = 리간드가 전자쌍을 통째로 제공.**", "forms": [{"a": "X", "s": "배위 결합은 금속과 리간드가 전자를 하나씩 내어 만드는 결합이다."}]}, {"c": "GC-204", "m": "배위수", "ol": "**배위수 = 주개 원자 수**(흔히 4·6). 분자 수와 다를 수 있음.", "forms": [{"a": "O", "s": "배위수는 중심 금속에 직접 결합한 주개 원자의 수이다."}, {"a": "X", "s": "착물에서 흔한 배위수는 3과 5이다."}]}, {"c": "GC-205", "m": "한자리 리간드", "ol": "**한자리 = 주개 원자 1개**(물·암모니아·Cl⁻).", "forms": [{"a": "O", "s": "한자리 리간드는 하나의 주개 원자로 금속에 결합한다."}]}, {"c": "GC-206", "m": "여러자리 리간드", "ol": "**여러자리 = 주개 원자 2개 이상**(en 2, EDTA 6).", "forms": [{"a": "O", "s": "여러자리(킬레이트) 리간드는 두 개 이상의 주개 원자로 금속에 결합한다."}]}, {"c": "GC-207", "m": "킬레이트 효과", "ol": "**킬레이트 착물이 더 안정**(여러 점 결합 + 엔트로피↑). 여러자리 리간드가 한자리 여럿을 풀어 ΔS>0, ΔG=ΔH−TΔS에서 −TΔS가 안정성을 만든다.", "forms": [{"a": "X", "s": "여러자리 리간드로 만든 킬레이트 착물은 같은 종류의 한자리 리간드 착물보다 불안정하다."}]}, {"c": "GC-208", "m": "이성질체", "ol": "**착물에도 구조·입체 이성질체 존재.**", "forms": [{"a": "O", "s": "배위 착물에도 구조 이성질체와 입체 이성질체가 존재한다."}]}, {"c": "GC-209", "m": "기하 이성질체", "ol": "**cis = 인접, trans = 반대편.** 배열만 다름.", "forms": [{"a": "O", "s": "기하 이성질체에는 cis(시스)와 trans(트랜스)가 있다."}]}, {"c": "GC-210", "m": "광학 이성질체", "ol": "**광학 이성질체 = 거울상, 포개지지 않음.** 배열만 다름.", "forms": [{"a": "X", "s": "광학 이성질체는 서로 완전히 똑같이 포개지는 관계이다."}, {"a": "X", "s": "광학 이성질체는 분자식과 결합 방식이 모두 달라서 생긴다."}]}, {"c": "GC-211", "m": "평면 사각", "ol": "**평면 사각(배위수 4)은 cis-trans 가짐**(Pt(II) 등).", "forms": [{"a": "O", "s": "평면 사각 착물은 cis-trans 기하 이성질체를 가질 수 있다."}]}, {"c": "GC-212", "m": "팔면체", "ol": "**팔면체 = 여섯 리간드(배위수 6).** cis-trans·fac-mer 가짐.", "forms": [{"a": "O", "s": "팔면체 착물은 cis-trans나 fac-mer 같은 이성질체를 가질 수 있다."}]}, {"c": "GC-213", "m": "결정장 이론", "ol": "**결정장 이론 = 리간드가 정전기적 반발로 d 오비탈을 분리.**", "forms": [{"a": "O", "s": "결정장 이론은 리간드가 중심 금속의 d 오비탈 에너지를 분리시킨다고 본다."}]}, {"c": "GC-214", "m": "d 오비탈 분리", "ol": "**팔면체: 낮은 셋 + 높은 둘**(리간드 향한 오비탈이 정면 반발로 높음). 사면체는 분리가 뒤집히고 더 작다.", "forms": [{"a": "O", "s": "팔면체 장에서 d 오비탈은 에너지가 다른 두 무리로 갈라진다."}, {"a": "X", "s": "팔면체 장에서 모든 d 오비탈의 에너지는 똑같이 유지된다."}]}, {"c": "GC-215", "m": "분리 에너지", "ol": "**Δ = 두 d 오비탈 무리의 에너지 차이.** 리간드에 따라 변함.", "forms": [{"a": "O", "s": "d 오비탈 분리 에너지를 결정장 분리 에너지 Δ로 나타낸다."}]}, {"c": "GC-216", "m": "강한 장", "ol": "**강한 장 → Δ 큼.** 약한 장 → Δ 작음.", "forms": [{"a": "X", "s": "강한 장 리간드는 분리 에너지 Δ를 작게 만든다."}]}, {"c": "GC-217", "m": "저스핀", "ol": "**Δ > 짝지음 E → 저스핀**(홀전자 적음).", "forms": [{"a": "O", "s": "분리 에너지 Δ가 짝지음 에너지보다 크면 저스핀 배치가 된다."}]}, {"c": "GC-218", "m": "고스핀", "ol": "**Δ < 짝지음 E → 고스핀**(홀전자 많음). 올라가는 비용 Δ와 짝짓는 비용 P 중 싼 쪽을 고르는, 훈트 규칙의 확장이다.", "forms": [{"a": "O", "s": "분리 에너지 Δ가 짝지음 에너지보다 작으면 고스핀 배치가 된다."}]}, {"c": "GC-219", "m": "강한 장과 스핀", "ol": "**강한 장 → 저스핀, 약한 장 → 고스핀.**", "forms": [{"a": "X", "s": "강한 장 리간드일수록 고스핀 배치를 만든다."}, {"a": "O", "s": "강한 장 리간드일수록 저스핀 배치를 만든다."}]}, {"c": "GC-220", "m": "분광화학 계열", "ol": "**분광화학 계열 = 리간드의 Δ 크기 순 배열.** CN⁻ 강, I⁻ 약.", "forms": [{"a": "O", "s": "분광화학 계열은 리간드를 장의 세기(Δ 크기) 순서로 배열한 것이다."}]}, {"c": "GC-221", "m": "착물의 색", "ol": "**d-d 전이로 흡수, 보이는 색 = 흡수색의 보색**(흡수 E = Δ). 리간드가 Δ를 바꾸면 색이 바뀌어, 색은 Δ를 읽는 눈금이 된다.", "forms": [{"a": "O", "s": "착물의 색은 d 오비탈 사이 전이(d-d 전이)로 빛을 흡수해 나타난다."}, {"a": "X", "s": "착물은 흡수한 빛의 색을 그대로 우리 눈에 보여준다."}]}, {"c": "GC-222", "m": "자기성", "ol": "**자기성 = 홀전자 수로 결정.** 고스핀이 상자기성 강함.", "forms": [{"a": "X", "s": "착물의 자기성은 중심 금속의 질량으로 결정된다."}, {"a": "O", "s": "고스핀 착물은 저스핀 착물보다 홀전자가 많아 상자기성이 더 강하다."}]}, {"c": "GC-223", "m": "배위수와 구조", "ol": "**6 팔면체, 4 평면 사각/정사면체, 2 직선형.**", "forms": [{"a": "O", "s": "배위수가 6인 착물의 가장 흔한 구조는 팔면체이다."}]}, {"c": "GC-225", "m": "알파 붕괴", "ol": "**α 붕괴 = 헬륨 핵 방출 → 질량수 -4, 원자 번호 -2.**", "forms": [{"a": "O", "s": "알파(α) 붕괴에서는 헬륨 핵(질량수 4, 양성자 2)이 방출된다."}, {"a": "O", "s": "알파 붕괴가 일어나면 질량수는 4, 원자 번호는 2 감소한다."}, {"a": "X", "s": "알파 붕괴가 일어나면 원자 번호는 2 증가한다."}]}, {"c": "GC-226", "m": "베타 붕괴", "ol": "**β⁻ d": 15}, {"c": "GC-061", "c2": "GC-062", "m": "결합 차수", "m2": "자기성", "a": "X", "s": "N₂는 결합 차수가 3이고 홀전자가 있어 상자기성이다.", "f": "N₂는 결합 차수가 3이고 홀전자가 없어 반자기성이다.", "w": "N₂의 분자 오비탈은 결합성 전자 8, 반결합성 2로 차수 3이며, 모든 전자가 짝지어 반자기성이다.", "first_round": 2}, {"c": "CH1-468", "c2": "CH1-467", "m": "전자전이·스펙트럼 계열", "m2": "전자전이·스펙트럼 계열", "a": "X", "s": "4 → 2 전이의 빛은 가시광선이므로 4 → 1 전이의 빛보다 에너지가 크다.", "f": "4 → 2 전이의 빛은 가시광선이므로 4 → 1 전이의 빛보다 에너지가 작다.", "w": "n = 2로 가는 전이는 가시광선, n = 1로 가는 전이는 자외선이며, 자외선이 가시광선보다 에너지가 크다.", "first_round": 5}, {"c": "CH2-385", "c2": "CH2-386", "m": "고체 결정구조", "m2": "고체 결정구조", "a": "X", "s": "단순입방구조에서 가장 가까운 두 원자 사이 거리는 단위 세포 한 변 길이의 절반이다.", "f": "단순입방구조에서 가장 가까운 두 원자 사이 거리는 단위 세포 한 변 길이와 같다.", "w": "배위수 6인 이웃 원자는 모서리를 따라 맞닿아 있으므로, 중심 사이 거리 2r가 한 변 l과 같다.", "first_round": 5}, {"c": "CH2-043", "c2": "CH2-045", "m": "운동 에너지와 온도", "m2": "분자량과 속력", "a": "O", "s": "같은 온도에서 H₂와 O₂는 평균 운동 에너지가 같지만 평균 속력은 H₂가 4배 빠르다.", "f": "같은 온도에서 H₂와 O₂는 평균 운동 에너지가 같지만 평균 속력은 H₂가 4배 빠르다.", "w": "평균 운동 에너지는 온도로만 정해지고, 속력은 1/√M에 비례하므로 √(32/2) = 4배이다.", "first_round": 1}, {"c": "CH2-240", "c2": "CH2-178", "m": "촉매와 엔탈피", "m2": "헤스 법칙", "a": "X", "s": "촉매를 사용해 반응 경로가 바뀌면 반응엔탈피도 경로에 따라 달라진다.", "f": "촉매를 사용해 반응 경로가 바뀌어도 반응엔탈피는 변하지 않는다.", "w": "헤스 법칙대로 ΔH는 처음과 끝 상태로만 정해지므로, 촉매가 만든 새 경로에서도 ΔH는 같다.", "first_round": 12}, {"c": "GC-055", "c2": "GC-056", "m": "VSEPR 구조", "m2": "비공유 전자쌍", "a": "O", "s": "NH₃와 H₂O는 모두 입체수 4이지만 결합각은 H₂O가 더 작다.", "f": "NH₃와 H₂O는 모두 입체수 4이지만 결합각은 H₂O가 더 작다.", "w": "둘 다 전자쌍 배치는 사면체이지만, 반발이 큰 비공유 전자쌍이 H₂O는 2개라 결합각이 더 좁아진다(107° > 104.5°).", "first_round": 2}, {"c": "CH1-210", "c2": "CH1-195", "m": "무극성 분자", "m2": "분자 모양", "a": "O", "s": "BF₃는 평면 삼각형이라 무극성이지만 NH₃는 삼각뿔형이라 극성이다.", "f": "BF₃는 평면 삼각형이라 무극성이지만 NH₃는 삼각뿔형이라 극성이다.", "w": "분자 모양이 대칭인 평면 삼각형은 결합 쌍극자가 상쇄되지만, 비공유 전자쌍이 있는 삼각뿔형은 상쇄되지 않는다.", "first_round": 10}, {"c": "CH1-470", "c2": "CH1-465", "m": "전자전이·스펙트럼 계열", "m2": "전자전이·스펙트럼 계열", "a": "O", "s": "3 → 2 전이의 빛은 발머 계열 중 파장이 가장 길다.", "f": "3 → 2 전이의 빛은 발머 계열 중 파장이 가장 길다.", "w": "발머 계열(n = 2로 오는 전이) 중 에너지가 가장 작은 것이 3 → 2이므로, 파장이 가장 긴 빨간색 빛이다.", "first_round": 5}, {"c": "CH1-268", "c2": "CH1-033", "m": "압력 변화", "m2": "하버보슈", "a": "O", "s": "N₂ + 3H₂ ⇌ 2NH₃ 평형에서 부피를 줄여 압력을 높이면 NH₃의 양이 증가한다.", "f": "N₂ + 3H₂ ⇌ 2NH₃ 평형에서 부피를 줄여 압력을 높이면 NH₃의 양이 증가한다.", "w": "하버-보슈 반응은 기체 4몰 → 2몰로 줄어드는 반응이라, 압력을 높이면 분자 수가 적은 NH₃ 쪽으로 평형이 이동한다.", "first_round": 13}, {"c": "GC-078", "c2": "CH2-397", "m": "단위 세포", "m2": "고체 결정구조", "a": "X", "s": "NaCl 결정의 단위 세포에는 Na⁺과 Cl⁻이 각각 1개씩 들어 있다.", "f": "NaCl 결정의 단위 세포에는 Na⁺과 Cl⁻이 각각 4개씩 들어 있다.", "w": "NaCl은 Cl⁻이 면심 입방(4개)을 이루고 Na⁺이 모서리 중앙·체심(12 × 1/4 + 1 = 4개)에 있다.", "first_round": 3}, {"c": "GC-126", "c2": "GC-123", "m": "압력 변화", "m2": "반응지수", "a": "X", "s": "N₂O₄ ⇌ 2NO₂ 평형에서 부피를 절반으로 줄이면 순간적으로 Q < K가 되어 정반응이 진행된다.", "f": "N₂O₄ ⇌ 2NO₂ 평형에서 부피를 절반으로 줄이면 순간적으로 Q > K가 되어 역반응이 진행된다.", "w": "두 농도가 모두 2배가 되면 Q = [NO₂]²/[N₂O₄]가 2배로 커져 Q > K이므로 몰수가 적은 N₂O₄ 쪽으로 이동한다.", "first_round": 5}, {"c": "GC-049", "c2": "GC-062", "m": "옥텟 예외", "m2": "자기성", "a": "X", "s": "NO는 전자 수가 홀수인 분자이므로 반자기성이다.", "f": "NO는 전자 수가 홀수인 분자이므로 상자기성이다.", "w": "전자 수가 홀수(7 + 8 = 15)이면 홀전자가 반드시 있어 옥텟 예외가 되고, 홀전자가 있으면 상자기성이다.", "first_round": 2}, {"c": "CH2-442", "c2": "CH1-338", "m": "완충범위·용량·헨더슨", "m2": "알짜 이온 반응식", "a": "O", "s": "CH₃COOH/CH₃COONa 완충 용액에 HCl을 조금 넣을 때 알짜 반응은 CH₃COO⁻ + H⁺ → CH₃COOH이다.", "f": "CH₃COOH/CH₃COONa 완충 용액에 HCl을 조금 넣을 때 알짜 반응은 CH₃COO⁻ + H⁺ → CH₃COOH이다.", "w": "Na⁺과 Cl⁻은 구경꾼이라 알짜 이온 반응식에서 빠지고, 짝염기가 H⁺을 받아 약산으로 바뀐다.", "first_round": 14}, {"c": "CH1-149", "c2": "CH1-096", "m": "등전자 이온", "m2": "이온 전자수", "a": "X", "s": "Mg²⁺은 Na⁺보다 전자 수가 적어서 반지름이 작다.", "f": "Mg²⁺은 Na⁺과 전자 수가 같지만 핵전하가 커서 반지름이 작다.", "w": "Na⁺(11−1)과 Mg²⁺(12−2)은 전자 수가 10개로 같은 등전자 이온이고, 핵전하가 큰 Mg²⁺이 전자를 더 세게 당긴다.", "first_round": 7}, {"c": "GC-028", "c2": "GC-030", "m": "훈트 규칙", "m2": "배치 순서", "a": "X", "s": "바닥상태 산소 원자의 홀전자 수는 4개이다.", "f": "바닥상태 산소 원자의 홀전자 수는 2개이다.", "w": "O는 1s²2s²2p⁴이고, 훈트 규칙대로 2p 세 오비탈에 하나씩 채운 뒤 하나만 짝지으므로 홀전자는 2개이다.", "first_round": 1}, {"c": "CH2-165", "c2": "CH2-158", "m": "세포와 삼투", "m2": "전해질 삼투압", "a": "O", "s": "적혈구와 등장인 NaCl 수용액의 몰농도는 등장인 포도당 수용액의 약 절반이다.", "f": "적혈구와 등장인 NaCl 수용액의 몰농도는 등장인 포도당 수용액의 약 절반이다.", "w": "삼투압은 입자 농도(iM)로 정해지는데 NaCl은 i ≈ 2라 포도당의 약 절반 몰농도로 같은 삼투압을 낸다.", "first_round": 8}, {"c": "CH2-441", "c2": "CH2-449", "m": "완충범위·용량·헨더슨", "m2": "완충범위·용량·헨더슨", "a": "X", "s": "[짝염기]/[산] = 1인 두 완충 용액은 농도가 달라도 완충 용량이 같다.", "f": "[짝염기]/[산] = 1인 두 완충 용액은 농도가 진한 쪽의 완충 용량이 더 크다.", "w": "비가 같으면 pH는 같지만, 완충 용량은 산과 짝염기의 절대량이 많을수록 커진다.", "first_round": 14}, {"c": "CH1S-001", "c2": "CH1S-005", "m": "구성 입자 질량·전하", "m2": "이온의 전자 수", "a": "O", "s": "²⁴Mg²⁺ 이온 하나에 들어 있는 전하를 띤 입자는 모두 22개이다.", "f": "²⁴Mg²⁺ 이온 하나에 들어 있는 전하를 띤 입자는 모두 22개이다.", "w": "전하를 띤 것은 양성자와 전자뿐이고 중성자는 0이다. Mg²⁺은 양성자 12개, 전자 12 − 2 = 10개이므로 12 + 10 = 22개이다.", "first_round": 1}, {"c": "CH1S-002", "c2": "CH1S-001", "m": "질량은 핵·성질은 전자", "m2": "구성 입자 질량·전하", "a": "X", "s": "Na 원자가 Na⁺이 되면 질량이 크게 줄어 화학적 성질도 달라진다.", "f": "Na 원자가 Na⁺이 되면 질량은 거의 그대로이지만 화학적 성질은 달라진다.", "w": "잃은 전자 1개는 양성자의 약 1/1836이라 질량은 거의 변하지 않는다. 성질이 바뀌는 까닭은 질량이 아니라 바깥 전자의 변화 때문이다.", "first_round": 1}, {"c": "CH1S-003", "c2": "CH1S-001", "m": "원자 번호=양성자 수", "m2": "구성 입자 질량·전하", "a": "X", "s": "전자 18개를 가지고 전하가 −2인 이온의 원자 번호는 20이다.", "f": "전자 18개를 가지고 전하가 −2인 이온의 원자 번호는 16이다.", "w": "전하 −2는 전자가 양성자보다 2개 많다는 뜻이므로 양성자는 18 − 2 = 16개이다. 원자 번호는 양성자 수이므로 16(S²⁻)이다.", "first_round": 1}, {"c": "CH1S-004", "c2": "CH1S-003", "m": "질량수·중성자 수", "m2": "원자 번호=양성자 수", "a": "X", "s": "³⁷Cl⁻과 ⁴⁰Ar은 중성자 수가 같다.", "f": "³⁷Cl⁻과 ³⁹K⁺은 중성자 수가 같다.", "w": "원자 번호로 양성자 수를 정하면 중성자 수는 ³⁷Cl 37 − 17 = 20, ⁴⁰Ar 40 − 18 = 22로 다르다. ³⁹K은 39 − 19 = 20으로 같고, 이온의 전하는 중성자 수와 관계없다.", "first_round": 1}, {"c": "CH1S-005", "c2": "CH1S-003", "m": "이온의 전자 수", "m2": "원자 번호=양성자 수", "a": "X", "s": "전자 수가 Ne과 같은 3가 양이온은 양성자 수가 Ne보다 3개 적다.", "f": "전자 수가 Ne과 같은 3가 양이온은 양성자 수가 Ne보다 3개 많다.", "w": "전자 수 = 양성자 수 − 3 = 10이므로 양성자는 13개(Al³⁺)이다. Ne의 양성자 수는 원자 번호 10이므로 3개 많다.", "first_round": 1}, {"c": "CH1S-006", "c2": "CH1S-003", "m": "이온이 돼도 핵 불변", "m2": "원자 번호=양성자 수", "a": "X", "s": "Cl⁻의 원자 번호는 전자 수와 같은 18이다.", "f": "Cl⁻의 원자 번호는 전자 수보다 1 작은 17이다.", "w": "원자 번호는 전자 수가 아니라 양성자 수이고, 이온이 될 때 바뀌는 것은 전자뿐이다. 따라서 Cl⁻도 양성자 17개, 원자 번호 17이다.", "first_round": 1}, {"c": "CH1S-007", "c2": "CH1S-004", "m": "양성자 수≠중성자 수", "m2": "질량수·중성자 수", "a": "O", "s": "²³⁸U(원자 번호 92)는 중성자 수가 양성자 수보다 50개 넘게 많다.", "f": "²³⁸U(원자 번호 92)는 중성자 수가 양성자 수보다 50개 넘게 많다.", "w": "중성자 수 = 238 − 92 = 146이므로 146 − 92 = 54개 더 많다. 무거운 핵일수록 중성자가 양성자보다 많아진다.", "first_round": 1}, {"c": "CH1S-008", "c2": "CH1S-009", "m": "길이 단위 환산", "m2": "원자·핵 크기 비", "a": "X", "s": "반지름이 1 Å인 원자의 원자핵 반지름은 약 1 pm이다.", "f": "반지름이 1 Å인 원자의 원자핵 반지름은 약 10⁻³ pm이다.", "w": "원자 : 핵 ≈ 10⁵ : 1이므로 핵 반지름은 10⁻¹⁰ m ÷ 10⁵ = 10⁻¹⁵ m이다. 1 pm = 10⁻¹² m이므로 10⁻¹⁵ m = 10⁻³ pm(1 fm)이다.", "first_round": 1}, {"c": "CH1S-009", "c2": "CH1S-002", "m": "원자·핵 크기 비", "m2": "질량은 핵·성질은 전자", "a": "O", "s": "원자 질량의 99.9 % 이상이 지름이 원자의 약 10⁻⁵배인 원자핵에 모여 있다.", "f": "원자 질량의 99.9 % 이상이 지름이 원자의 약 10⁻⁵배인 원자핵에 모여 있다.", "w": "질량은 양성자·중성자가 있는 핵이 거의 다 가지고, 핵 지름은 원자의 약 1/10⁵이다. 질량과 크기가 정반대로 어긋나 있다.", "first_round": 1}, {"c": "CH1S-010", "c2": "CH1S-009", "m": "부피 비는 세제곱", "m2": "원자·핵 크기 비", "a": "X", "s": "반지름 100 pm인 원자에서 원자핵의 부피는 원자 부피의 약 10⁻⁵배이다.", "f": "반지름 100 pm인 원자에서 원자핵의 부피는 원자 부피의 약 10⁻¹⁵배이다.", "w": "100 pm = 10⁻¹⁰ m이고 핵 반지름은 그 1/10⁵인 10⁻¹⁵ m이다. 부피 비는 길이 비의 세제곱이므로 (10⁻⁵)³ = 10⁻¹⁵배이다.", "first_round": 1}, {"c": "CH1S-011", "c2": "CH1S-026", "m": "원자 개수·부피 어림", "m2": "몰과 아보가드로 수", "a": "O", "s": "원자 하나가 한 변 2 Å인 정육면체 자리를 차지하면 원자 1 mol의 부피는 1 cm³보다 크다.", "f": "원자 하나가 한 변 2 Å인 정육면체 자리를 차지하면 원자 1 mol의 부피는 1 cm³보다 크다.", "w": "자리 하나는 (2×10⁻¹⁰ m)³ = 8×10⁻³⁰ m³이고, ×6.02×10²³ = 4.8×10⁻⁶ m³이다. 1 cm³ = 10⁻⁶ m³이므로 약 4.8 cm³로 1 cm³보다 크다.", "first_round": 1}, {"c": "CH1S-012", "c2": "CH1S-004", "m": "동위원소 정의", "m2": "질량수·중성자 수", "a": "X", "s": "¹²C와 ¹³C의 질량수 차 1은 두 원자의 양성자 수 차에서 생긴다.", "f": "¹²C와 ¹³C의 질량수 차 1은 두 원자의 중성자 수 차에서 생긴다.", "w": "동위원소는 양성자 수(원자 번호 6)가 같으므로, 질량수(양성자 + 중성자) 차 13 − 12 = 1은 모두 중성자 수 차이다.", "first_round": 1}, {"c": "CH1S-013", "c2": "CH1S-002", "m": "동위원소 성질 비교", "m2": "질량은 핵·성질은 전자", "a": "X", "s": "³⁵Cl₂와 ³⁷Cl₂는 화학적 성질이 같으므로 같은 온도·압력에서 밀도도 같다.", "f": "³⁵Cl₂와 ³⁷Cl₂는 화학적 성질이 같지만 같은 온도·압력에서 밀도는 다르다.", "w": "전자 배치가 같아 화학적 성질은 같지만 질량은 핵이 정한다. 분자량이 70과 74로 달라 같은 온도·압력에서 밀도는 74/70배 차이가 난다.", "first_round": 1}, {"c": "CH1S-014", "c2": "CH1S-016", "m": "원자량 기준 ¹²C", "m2": "평균 원자량 계산", "a": "X", "s": "¹²C의 원자량을 정확히 12로 정하므로 자연계 탄소의 평균 원자량도 정확히 12이다.", "f": "¹²C의 원자량을 정확히 12로 정해도 자연계 탄소의 평균 원자량은 12보다 약간 크다.", "w": "12는 ¹²C 한 동위원소에만 매긴 기준값이다. 자연계 탄소에는 ¹³C가 약 1 % 섞여 있어 가중 평균은 12.01이 된다.", "first_round": 1}, {"c": "CH1S-015", "c2": "CH1S-014", "m": "질량수≠원자량", "m2": "원자량 기준 ¹²C", "a": "X", "s": "질량수는 정수이고 원자량은 ¹²C를 12로 둔 상대 질량이므로 단위가 g이다.", "f": "질량수는 정수이고 원자량은 ¹²C를 12로 둔 상대 질량이므로 단위가 없다.", "w": "질량수는 양성자와 중성자의 개수이고, 원자량은 ¹²C 12와 견준 비이다. 둘 다 단위가 없으며 g은 몰 질량(g/mol)에 붙는다.", "first_round": 1}, {"c": "CH1S-016", "c2": "CH1S-012", "m": "평균 원자량 계산", "m2": "동위원소 정의", "a": "O", "s": "⁶³Cu와 중성자가 36개인 Cu 원자가 7 : 3으로 있으면 Cu 평균 원자량은 64보다 작다.", "f": "⁶³Cu와 중성자가 36개인 Cu 원자가 7 : 3으로 있으면 Cu 평균 원자량은 64보다 작다.", "w": "⁶³Cu에서 원자 번호는 29이므로 두 번째 동위원소는 29 + 36 = 65이다. 평균 = 63 × 0.7 + 65 × 0.3 = 63.6으로 64보다 작다.", "first_round": 1}, {"c": "CH1S-017", "c2": "CH1S-016", "m": "동위원소 존재비 역산", "m2": "평균 원자량 계산", "a": "O", "s": "⁷⁹Br와 ⁸¹Br로만 된 Br의 평균 원자량이 79.9이면 ⁸¹Br의 존재비는 50 %보다 작다.", "f": "⁷⁹Br와 ⁸¹Br로만 된 Br의 평균 원자량이 79.9이면 ⁸¹Br의 존재비는 50 %보다 작다.", "w": "⁸¹Br의 비율을 x라 두면 79(1 − x) + 81x = 79.9에서 x = 0.45이다. 평균 79.9가 두 질량의 가운데 80보다 79 쪽에 가까운 것과도 맞는다.", "first_round": 1}, {"c": "CH1S-018", "c2": "CH1S-016", "m": "질량 스펙트럼 봉우리", "m2": "평균 원자량 계산", "a": "X", "s": "평균 원자량 35.5인 Cl의 Cl₂ 질량 스펙트럼에서 72 봉우리는 70 봉우리의 1/3 높이이다.", "f": "평균 원자량 35.5인 Cl의 Cl₂ 질량 스펙트럼에서 72 봉우리는 70 봉우리의 2/3 높이이다.", "w": "35x + 37(1 − x) = 35.5에서 ³⁵Cl : ³⁷Cl = 3 : 1이다. 70은 (3/4)² = 9/16, 72는 2 × 3/4 × 1/4 = 6/16이므로 6/9 = 2/3이다.", "first_round": 1}, {"c": "CH1S-019", "c2": "CH1S-020", "m": "순물질·혼합물 판정", "m2": "홑원소 물질·화합물", "a": "O", "s": "끓는 동안 온도가 일정한 액체를 전기 분해해 두 가지 기체를 얻었다면 그 액체는 화합물이다.", "f": "끓는 동안 온도가 일정한 액체를 전기 분해해 두 가지 기체를 얻었다면 그 액체는 화합물이다.", "w": "끓는점이 일정하므로 순물질이고, 분해되어 두 물질이 나왔으니 원소가 둘 이상이다. 둘 이상의 원소로 된 순물질이 화합물이다.", "first_round": 1}, {"c": "CH1S-020", "c2": "CH1S-019", "m": "홑원소 물질·화합물", "m2": "순물질·혼합물 판정", "a": "X", "s": "O₂와 O₃를 섞은 기체는 원소가 한 종류이므로 홑원소 물질이다.", "f": "O₂와 O₃를 섞은 기체는 원소가 한 종류여도 혼합물이다.", "w": "홑원소 물질·화합물은 순물질을 나누는 말이다. O₂와 O₃는 서로 다른 물질이므로 섞으면 원소가 하나여도 혼합물이다.", "first_round": 1}, {"c": "CH1S-021", "c2": "CH1S-012", "m": "동소체≠동위원소", "m2": "동위원소 정의", "a": "X", "s": "¹²C로만 된 흑연과 ¹³C로만 된 흑연은 서로 동소체이다.", "f": "¹²C로만 된 흑연과 ¹³C로만 된 흑연은 서로 동소체가 아니다.", "w": "두 흑연은 원자 배열이 같고 원자의 중성자 수만 다르다. 동소체는 배열이 다른 홑원소 물질이고, 중성자 수 차이는 동위원소의 차이이다.", "first_round": 1}, {"c": "CH1S-022", "c2": "CH1S-023", "m": "화학식 네 가지", "m2": "분자식=실험식×n", "a": "O", "s": "시성식이 CH₃COOH인 아세트산은 포도당 C₆H₁₂O₆과 실험식이 같다.", "f": "시성식이 CH₃COOH인 아세트산은 포도당 C₆H₁₂O₆과 실험식이 같다.", "w": "시성식 CH₃COOH를 원자 수로 세면 분자식 C₂H₄O₂이다. 두 분자식을 각각 2와 6으로 나누면 모두 실험식 CH₂O가 된다.", "first_round": 1}, {"c": "CH1S-023", "c2": "CH1S-025", "m": "분자식=실험식×n", "m2": "분자량·화학식량", "a": "X", "s": "실험식이 CH₂이고 분자량이 56인 탄화수소의 분자식은 C₃H₆이다.", "f": "실험식이 CH₂이고 분자량이 56인 탄화수소의 분자식은 C₄H₈이다.", "w": "실험식량은 12 + 2 = 14이므로 n = 56 ÷ 14 = 4이다. 분자식은 (CH₂)₄ = C₄H₈이고, C₃H₆은 분자량 42이다.", "first_round": 1}, {"c": "CH1S-024", "c2": "CH1S-025", "m": "분자가 있는 물질 판정", "m2": "분자량·화학식량", "a": "X", "s": "SiO₂(Si 28)의 60은 CO₂의 44처럼 분자 1개의 질량을 나타내는 분자량이다.", "f": "SiO₂(Si 28)의 60은 분자가 없으므로 분자량이 아니라 화학식량이다.", "w": "SiO₂는 공유 결정이라 독립된 분자가 없다. 수치는 28 + 32 = 60으로 같은 방법으로 구해도, 분자가 없으면 화학식량이라 부른다.", "first_round": 1}, {"c": "CH1S-025", "c2": "CH1S-024", "m": "분자량·화학식량", "m2": "분자가 있는 물질 판정", "a": "O", "s": "CaCO₃는 분자 대신 이온으로 이루어진 물질이므로 그 100은 화학식량이다.", "f": "CaCO₃는 분자 대신 이온으로 이루어진 물질이므로 그 100은 화학식량이다.", "w": "CaCO₃는 Ca²⁺과 CO₃²⁻으로 된 이온 결정이라 분자가 없다. 40 + 12 + 48 = 100은 분자량이 아니라 화학식량이다.", "first_round": 1}, {"c": "CH1S-026", "c2": "CH1S-029", "m": "몰과 아보가드로 수", "m2": "무엇의 몰수인가", "a": "O", "s": "H₂O 분자 3.01×10²³개에 들어 있는 원자는 모두 1.5 mol이다.", "f": "H₂O 분자 3.01×10²³개에 들어 있는 원자는 모두 1.5 mol이다.", "w": "분자 3.01×10²³개 ÷ 6.02×10²³ = 0.5 mol이다. 분자 하나에 원자가 3개이므로 원자는 0.5 × 3 = 1.5 mol이다.", "first_round": 1}, {"c": "CH1S-027", "c2": "CH1S-026", "m": "몰 질량", "m2": "몰과 아보가드로 수", "a": "O", "s": "Mg 원자 1개의 질량은 약 4×10⁻²³ g이다.", "f": "Mg 원자 1개의 질량은 약 4×10⁻²³ g이다.", "w": "Mg 1 mol(6.02×10²³개)의 질량이 24 g이므로 1개는 24 ÷ 6.02×10²³ ≈ 3.99×10⁻²³ g이다.", "first_round": 1}, {"c": "CH1S-028", "c2": "CH1S-027", "m": "몰수=질량÷몰 질량", "m2": "몰 질량", "a": "X", "s": "같은 질량의 CH₄와 SO₂ 중 분자 수는 SO₂가 4배이다.", "f": "같은 질량의 CH₄와 SO₂ 중 분자 수는 CH₄가 4배이다.", "w": "몰 질량은 CH₄ 16, SO₂ 64 g/mol이다. 같은 질량이면 몰수는 몰 질량에 반비례하므로 가벼운 CH₄가 64/16 = 4배이다.", "first_round": 1}, {"c": "CH1S-029", "c2": "CH1S-026", "m": "무엇의 몰수인가", "m2": "몰과 아보가드로 수", "a": "O", "s": "H 원자가 1.806×10²⁴개 들어 있는 CH₄는 0.75 mol이다.", "f": "H 원자가 1.806×10²⁴개 들어 있는 CH₄는 0.75 mol이다.", "w": "H 원자는 1.806×10²⁴ ÷ 6.02×10²³ = 3 mol이다. CH₄ 1 mol에 H가 4 mol 있으므로 CH₄는 3 ÷ 4 = 0.75 mol이다.", "first_round": 1}, {"c": "CH1S-030", "c2": "CH1S-026", "m": "기체 몰 부피 조건", "m2": "몰과 아보가드로 수", "a": "X", "s": "25 °C, 1 atm에서 He 22.4 L에는 He 원자가 6.02×10²³개 들어 있다.", "f": "0 °C, 1 atm에서 He 22.4 L에는 He 원자가 6.02×10²³개 들어 있다.", "w": "22.4 L가 1 mol인 것은 0 °C, 1 atm일 때뿐이다. 25 °C에서는 1 mol이 약 24.4 L이므로 22.4 L에는 1 mol보다 적게 들어 있다.", "first_round": 1}, {"c": "CH1S-031", "c2": "CH1S-030", "m": "아보가드로 법칙", "m2": "기체 몰 부피 조건", "a": "X", "s": "0 °C, 1 atm의 N₂ 11.2 L와 27 °C, 1 atm의 O₂ 11.2 L는 분자 수가 같다.", "f": "0 °C, 1 atm의 N₂ 11.2 L와 0 °C, 1 atm의 O₂ 11.2 L는 분자 수가 같다.", "w": "부피가 같아도 온도가 다르면 아보가드로 법칙을 쓸 수 없다. 0 °C, 1 atm의 11.2 L는 0.5 mol이지만 27 °C의 11.2 L는 0.5 mol보다 적다.", "first_round": 1}, {"c": "CH1S-032", "c2": "CH1S-030", "m": "기체 밀도와 분자량", "m2": "기체 몰 부피 조건", "a": "O", "s": "0 °C, 1 atm에서 밀도가 1.96 g/L인 기체 1 mol의 질량은 약 44 g이다.", "f": "0 °C, 1 atm에서 밀도가 1.96 g/L인 기체 1 mol의 질량은 약 44 g이다.", "w": "0 °C, 1 atm에서 기체 1 mol은 종류와 관계없이 22.4 L이므로 1.96 g/L × 22.4 L ≈ 43.9 g이다(CO₂ 정도의 분자량).", "first_round": 1}, {"c": "CH1S-033", "c2": "CH1S-027", "m": "평균 몰 질량", "m2": "몰 질량", "a": "X", "s": "N₂와 O₂를 몰수 비 4 : 1로 섞은 기체의 평균 몰 질량은 30 g/mol이다.", "f": "N₂와 O₂를 몰수 비 4 : 1로 섞은 기체의 평균 몰 질량은 28.8 g/mol이다.", "w": "몰 질량은 N₂ 28, O₂ 32이다. (28 × 4 + 32 × 1) ÷ 5 = 144 ÷ 5 = 28.8이며, 30은 두 값을 단순 평균한 값이다.", "first_round": 1}, {"c": "CH1S-034", "c2": "CH1S-028", "m": "몰 농도×부피=몰수", "m2": "몰수=질량÷몰 질량", "a": "O", "s": "NaOH 2.0 g을 녹여 만든 수용액 250 mL의 몰 농도는 0.2 M이다.", "f": "NaOH 2.0 g을 녹여 만든 수용액 250 mL의 몰 농도는 0.2 M이다.", "w": "NaOH 몰수 = 2.0 ÷ 40 = 0.05 mol이고, 250 mL = 0.25 L이므로 0.05 ÷ 0.25 = 0.2 M이다.", "first_round": 1}, {"c": "CH1S-035", "c2": "CH1S-028", "m": "질량 조성→실험식", "m2": "몰수=질량÷몰 질량", "a": "X", "s": "질량 백분율이 C 75 %, H 25 %인 화합물의 실험식은 C₃H₄이다.", "f": "질량 백분율이 C 75 %, H 25 %인 화합물의 실험식은 CH₄이다.", "w": "100 g 기준 C 75 ÷ 12 = 6.25 mol, H 25 ÷ 1 = 25 mol이다. 몰수 비 6.25 : 25 = 1 : 4이고, 3 : 1은 질량비를 그대로 쓴 함정이다.", "first_round": 1}, {"c": "CH1S-036", "c2": "CH1S-035", "m": "배수 비례 비교", "m2": "질량 조성→실험식", "a": "O", "s": "N 14 g과 결합한 O가 16 g, 32 g, 40 g인 세 산화물 가운데 하나는 N₂O₅이다.", "f": "N 14 g과 결합한 O가 16 g, 32 g, 40 g인 세 산화물 가운데 하나는 N₂O₅이다.", "w": "N 14 g은 1 mol이고 O 40 g은 2.5 mol이므로 N : O = 1 : 2.5 = 2 : 5이다. O의 질량비 16 : 32 : 40 = 2 : 4 : 5로 정수비이다.", "first_round": 1}, {"c": "CH1S-037", "c2": "CH1S-038", "m": "보일·샤를 법칙", "m2": "PV=nRT 단위·절대 온도", "a": "X", "s": "압력이 일정할 때 기체를 27 °C에서 54 °C로 가열하면 부피가 2배가 된다.", "f": "압력이 일정할 때 기체를 27 °C에서 54 °C로 가열하면 부피가 1.09배가 된다.", "w": "샤를 법칙의 온도는 절대 온도이다. 300 K → 327 K이므로 부피는 327/300 = 1.09배이다.", "first_round": 1}, {"c": "CH1S-038", "c2": "CH1S-031", "m": "PV=nRT 단위·절대 온도", "m2": "아보가드로 법칙", "a": "O", "s": "27 °C, 2 atm에서 6.15 L를 차지하는 기체는 종류와 관계없이 0.5 mol이다.", "f": "27 °C, 2 atm에서 6.15 L를 차지하는 기체는 종류와 관계없이 0.5 mol이다.", "w": "n = PV/RT = 2 × 6.15 ÷ (0.082 × 300) = 0.5 mol이다. 같은 T·P·V이면 기체 종류와 관계없이 몰수가 같다.", "first_round": 1}, {"c": "CH1S-039", "c2": "CH1S-032", "m": "분자량 M=dRT/P", "m2": "기체 밀도와 분자량", "a": "X", "s": "273 °C, 1 atm에서 밀도가 1.25 g/L인 기체의 분자량은 28이다.", "f": "273 °C, 1 atm에서 밀도가 1.25 g/L인 기체의 분자량은 약 56이다.", "w": "1.25 × 22.4 = 28은 0 °C에서만 쓸 수 있다. 273 °C = 546 K이므로 M = dRT/P = 1.25 × 0.082 × 546 ≈ 56이다.", "first_round": 1}, {"c": "CH1S-040", "c2": "CH1S-038", "m": "부분 압력", "m2": "PV=nRT 단위·절대 온도", "a": "O", "s": "27 °C, 4.1 L 용기에 He 0.2 mol과 Ne 0.3 mol을 넣으면 Ne의 부분 압력은 1.8 atm이다.", "f": "27 °C, 4.1 L 용기에 He 0.2 mol과 Ne 0.3 mol을 넣으면 Ne의 부분 압력은 1.8 atm이다.", "w": "전체 압력 = 0.5 × 0.082 × 300 ÷ 4.1 = 3 atm이다. Ne의 몰분율이 0.3/0.5 = 0.6이므로 0.6 × 3 = 1.8 atm이다.", "first_round": 1}, {"c": "CH1S-041", "c2": "CH1S-038", "m": "실제 기체의 편차", "m2": "PV=nRT 단위·절대 온도", "a": "O", "s": "실제 기체 1 mol의 PV/RT 값은 0 °C, 100 atm에서보다 273 °C, 1 atm에서 1에 더 가깝다.", "f": "실제 기체 1 mol의 PV/RT 값은 0 °C, 100 atm에서보다 273 °C, 1 atm에서 1에 더 가깝다.", "w": "이상 기체라면 PV = nRT라서 1 mol의 PV/RT = 1이다. 고온·저압일수록 분자 사이가 멀어 이상 기체에 가까우므로 273 °C, 1 atm 쪽이 1에 더 가깝다.", "first_round": 1}, {"c": "CH1S-042", "c2": "CH1S-038", "m": "기체 입자 수 계산", "m2": "PV=nRT 단위·절대 온도", "a": "X", "s": "0 °C, 0.5 atm에서 CH₄ 4.48 L에 들어 있는 H 원자는 0.8 mol이다.", "f": "0 °C, 0.5 atm에서 CH₄ 4.48 L에 들어 있는 H 원자는 0.4 mol이다.", "w": "n = PV/RT = 0.5 × 4.48 ÷ (0.082 × 273) ≈ 0.1 mol이고 H는 × 4 = 0.4 mol이다. 0.8은 1 atm에서만 쓰는 22.4 L로 나눈 값이다.", "first_round": 1}, {"c": "CH1S-043", "c2": "CH1S-044", "m": "계수만 조절한다", "m2": "가장 간단한 정수비", "a": "O", "s": "N₂ + H₂ → NH₃를 맞추면 반응물 계수의 합은 생성물 계수의 합의 2배이다.", "f": "N₂ + H₂ → NH₃를 맞추면 반응물 계수의 합은 생성물 계수의 합의 2배이다.", "w": "첨자는 두고 계수만 맞추면 N₂ + 3H₂ → 2NH₃이다. 생략된 1도 세어 반응물 1 + 3 = 4, 생성물 2이므로 2배이다.", "first_round": 2}, {"c": "CH1S-044", "c2": "CH1S-043", "m": "가장 간단한 정수비", "m2": "계수만 조절한다", "a": "O", "s": "Fe₂O₃ + CO → Fe + CO₂를 가장 간단한 정수비로 맞추면 계수의 합은 9이다.", "f": "Fe₂O₃ + CO → Fe + CO₂를 가장 간단한 정수비로 맞추면 계수의 합은 9이다.", "w": "Fe₂O₃ + 3CO → 2Fe + 3CO₂로 원자 수가 맞는다. 생략된 Fe₂O₃의 1까지 더하면 1 + 3 + 2 + 3 = 9이다.", "first_round": 2}, {"c": "CH1S-045", "c2": "CH1S-049", "m": "연소 반응 계수", "m2": "계수비=몰비=입자 수 비", "a": "X", "s": "C₂H₅OH 1 mol이 완전 연소할 때 필요한 O₂는 3.5 mol이다.", "f": "C₂H₅OH 1 mol이 완전 연소할 때 필요한 O₂는 3 mol이다.", "w": "C₂H₆O이므로 O₂ = 2 + 6/4 − 1/2 = 3이고, 반응식은 C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O이다. 계수비가 몰비이므로 3 mol이며, 3.5는 분자 속 O를 빼지 않은 값이다.", "first_round": 2}, {"c": "CH1S-046", "c2": "CH1S-044", "m": "미정계수법", "m2": "가장 간단한 정수비", "a": "O", "s": "aCu + bHNO₃ → cCu(NO₃)₂ + dNO + eH₂O를 정수비로 맞추면 b : d = 4 : 1이다.", "f": "aCu + bHNO₃ → cCu(NO₃)₂ + dNO + eH₂O를 정수비로 맞추면 b : d = 4 : 1이다.", "w": "원소마다 식을 세워 풀면 3Cu + 8HNO₃ → 3Cu(NO₃)₂ + 2NO + 4H₂O이다. b : d = 8 : 2 = 4 : 1이다.", "first_round": 2}, {"c": "CH1S-047", "c2": "CH1S-048", "m": "알짜 이온 반응식", "m2": "이온으로 쪼개지 않는 것", "a": "X", "s": "CaCO₃(s)에 HCl 수용액을 넣는 반응의 알짜 이온 반응식에는 CO₃²⁻이 반응물로 쓰인다.", "f": "CaCO₃(s)에 HCl 수용액을 넣는 반응의 알짜 이온 반응식에는 CaCO₃(s)가 반응물로 쓰인다.", "w": "녹지 않는 고체는 이온으로 쪼개지 않으므로 CaCO₃(s) + 2H⁺ → Ca²⁺ + H₂O + CO₂이다. 구경꾼 이온은 Cl⁻뿐이다.", "first_round": 2}, {"c": "CH1S-048", "c2": "CH1S-047", "m": "이온으로 쪼개지 않는 것", "m2": "알짜 이온 반응식", "a": "X", "s": "CH₃COOH 수용액과 NaOH 수용액의 알짜 이온 반응식은 H⁺ + OH⁻ → H₂O이다.", "f": "CH₃COOH 수용액과 NaOH 수용액의 알짜 이온 반응식은 CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O이다.", "w": "CH₃COOH는 약전해질이라 이온으로 쪼개지 않고 분자 그대로 쓴다. Na⁺만 구경꾼 이온으로 지운다.", "first_round": 2}, {"c": "CH1S-049", "c2": "CH1S-026", "m": "계수비=몰비=입자 수 비", "m2": "몰과 아보가드로 수", "a": "O", "s": "2CO + O₂ → 2CO₂에서 CO 분자 1.204×10²⁴개가 모두 반응하면 CO₂ 2 mol이 생긴다.", "f": "2CO + O₂ → 2CO₂에서 CO 분자 1.204×10²⁴개가 모두 반응하면 CO₂ 2 mol이 생긴다.", "w": "CO 1.204×10²⁴개 ÷ 6.02×10²³ = 2 mol이다. CO : CO₂의 계수비가 2 : 2이므로 CO₂도 2 mol이다.", "first_round": 2}, {"c": "CH1S-050", "c2": "CH1S-049", "m": "계수비≠질량비", "m2": "계수비=몰비=입자 수 비", "a": "O", "s": "N₂ + 3H₂ → 2NH₃에서 반응하는 N₂와 H₂의 질량비는 14 : 3이다.", "f": "N₂ + 3H₂ → 2NH₃에서 반응하는 N₂와 H₂의 질량비는 14 : 3이다.", "w": "몰비 1 : 3에 몰 질량을 곱하면 28 : 3 × 2 = 28 : 6 = 14 : 3이다. 계수비 1 : 3을 질량비로 쓰면 틀린다.", "first_round": 2}, {"c": "CH1S-051", "c2": "CH1S-031", "m": "기체 계수비=부피비", "m2": "아보가드로 법칙", "a": "X", "s": "25 °C, 1 atm에서 H₂ 20 mL와 O₂ 10 mL가 모두 반응한 뒤 남는 기체는 20 mL이다.", "f": "25 °C, 1 atm에서 H₂ 20 mL와 O₂ 10 mL가 모두 반응한 뒤 남는 기체는 없다.", "w": "2H₂ + O₂ → 2H₂O에서 기체 부피비 2 : 1대로 모두 반응한다. 25 °C에서 생긴 H₂O는 액체라 기체 부피에 세지 않으므로 기체가 남지 않는다.", "first_round": 2}, {"c": "CH1S-052", "c2": "CH1S-028", "m": "질량·입자 수 양적 계산", "m2": "몰수=질량÷몰 질량", "a": "O", "s": "2Na + Cl₂ → 2NaCl에서 Na 4.6 g이 모두 반응하면 NaCl 11.7 g이 생긴다.", "f": "2Na + Cl₂ → 2NaCl에서 Na 4.6 g이 모두 반응하면 NaCl 11.7 g이 생긴다.", "w": "Na 4.6 ÷ 23 = 0.2 mol이고 Na : NaCl = 2 : 2이므로 NaCl도 0.2 mol이다. 0.2 × 58.5 = 11.7 g이다.", "first_round": 2}, {"c": "CH1S-053", "c2": "CH1S-049", "m": "한계 반응물 판정", "m2": "계수비=몰비=입자 수 비", "a": "X", "s": "N₂ + 3H₂ → 2NH₃에서 N₂ 28 g과 H₂ 4 g을 반응시키면 N₂가 한계 반응물이다.", "f": "N₂ + 3H₂ → 2NH₃에서 N₂ 28 g과 H₂ 4 g을 반응시키면 H₂가 한계 반응물이다.", "w": "N₂ 1 mol, H₂ 2 mol이고 몰수 ÷ 계수는 N₂ 1, H₂ 2/3이다. 값이 작은 H₂가 먼저 바닥나므로 한계 반응물이다.", "first_round": 2}, {"c": "CH1S-054", "c2": "CH1S-053", "m": "남는 반응물·최대 생성량", "m2": "한계 반응물 판정", "a": "O", "s": "2H₂ + O₂ → 2H₂O에서 H₂ 3 mol과 O₂ 2 mol을 반응시키면 O₂ 0.5 mol이 남는다.", "f": "2H₂ + O₂ → 2H₂O에서 H₂ 3 mol과 O₂ 2 mol을 반응시키면 O₂ 0.5 mol이 남는다.", "w": "몰수 ÷ 계수는 H₂ 1.5, O₂ 2이므로 H₂가 한계 반응물이다. O₂는 3 × 1/2 = 1.5 mol이 반응해 2 − 1.5 = 0.5 mol이 남는다.", "first_round": 2}, {"c": "CH1S-055", "c2": "CH1S-053", "m": "수득률", "m2": "한계 반응물 판정", "a": "O", "s": "N₂ 1 mol과 H₂ 1.5 mol로 NH₃ 0.8 mol을 얻었다면 수득률은 80 %이다.", "f": "N₂ 1 mol과 H₂ 1.5 mol로 NH₃ 0.8 mol을 얻었다면 수득률은 80 %이다.", "w": "H₂ 1.5 ÷ 3 = 0.5 < N₂ 1 ÷ 1이므로 H₂가 한계 반응물이고 이론량은 NH₃ 1 mol이다. 0.8 ÷ 1 × 100 = 80 %이다.", "first_round": 2}, {"c": "CH1S-056", "c2": "CH1S-052", "m": "순도 계산", "m2": "질량·입자 수 양적 계산", "a": "O", "s": "불순물이 반응하지 않는 CaCO₃ 시료 12.5 g을 분해해 CO₂ 4.4 g을 얻었다면 순도는 80 %이다.", "f": "불순물이 반응하지 않는 CaCO₃ 시료 12.5 g을 분해해 CO₂ 4.4 g을 얻었다면 순도는 80 %이다.", "w": "CO₂ 4.4 ÷ 44 = 0.1 mol이고 CaCO₃ → CaO + CO₂이므로 CaCO₃도 0.1 mol, 10 g이다. 10 ÷ 12.5 × 100 = 80 %이다.", "first_round": 2}, {"c": "CH1S-057", "c2": "CH1S-035", "m": "연소 분석", "m2": "질량 조성→실험식", "a": "O", "s": "C, H, O로 된 물질 4.6 g이 연소해 CO₂ 8.8 g과 H₂O 5.4 g이 생기면 실험식은 C₂H₆O이다.", "f": "C, H, O로 된 물질 4.6 g이 연소해 CO₂ 8.8 g과 H₂O 5.4 g이 생기면 실험식은 C₂H₆O이다.", "w": "C 0.2 mol(2.4 g), H 0.3 × 2 = 0.6 mol(0.6 g)이고 O는 4.6 − 3.0 = 1.6 g, 0.1 mol이다. 몰수 비 0.2 : 0.6 : 0.1 = 2 : 6 : 1이다.", "first_round": 2}, {"c": "CH1S-058", "c2": "CH1S-051", "m": "기체 몰수·압력 변화", "m2": "기체 계수비=부피비", "a": "O", "s": "강철 용기에 CO 2 mol과 O₂ 1 mol을 넣어 모두 반응시키면 같은 온도에서 압력은 처음의 2/3가 된다.", "f": "강철 용기에 CO 2 mol과 O₂ 1 mol을 넣어 모두 반응시키면 같은 온도에서 압력은 처음의 2/3가 된다.", "w": "2CO + O₂ → 2CO₂로 기체가 3 mol에서 2 mol이 된다. 부피·온도가 일정하면 압력은 기체 몰수에 비례하므로 2/3이다.", "first_round": 2}, {"c": "CH1S-059", "c2": "CH1S-040", "m": "반응 후 부분 압력", "m2": "부분 압력", "a": "O", "s": "V·T가 일정한 용기에서 H₂ 0.6 atm과 Cl₂ 0.2 atm이 완전히 반응해 HCl이 되면 HCl의 몰분율은 0.5이다.", "f": "V·T가 일정한 용기에서 H₂ 0.6 atm과 Cl₂ 0.2 atm이 완전히 반응해 HCl이 되면 HCl의 몰분율은 0.5이다.", "w": "H₂ + Cl₂ → 2HCl에서 Cl₂ 0.2가 다 쓰여 H₂ 0.4 atm, HCl 0.4 atm이 된다. 몰분율 = 부분 압력 ÷ 전체 압력 = 0.4 ÷ 0.8 = 0.5이다.", "first_round": 2}, {"c": "CH1S-060", "c2": "CH1S-003", "m": "방사성 붕괴의 뜻", "m2": "원자 번호=양성자 수", "a": "X", "s": "¹³¹I가 붕괴해 ¹³¹Xe(원자 번호 54)이 되면 질량수가 그대로이므로 같은 원소로 남는다.", "f": "¹³¹I가 붕괴해 ¹³¹Xe(원자 번호 54)이 되면 질량수가 그대로여도 다른 원소가 된다.", "w": "원소는 질량수가 아니라 원자 번호(양성자 수)로 정해진다. 핵이 바뀌어 원자 번호가 53에서 54가 되었으므로 다른 원소이다.", "first_round": 3}, {"c": "CH1S-061", "c2": "CH1S-004", "m": "α 붕괴 변화", "m2": "질량수·중성자 수", "a": "O", "s": "²²⁶Ra(원자 번호 88)가 α 붕괴하면 중성자 수가 136인 원자핵이 된다.", "f": "²²⁶Ra(원자 번호 88)가 α 붕괴하면 중성자 수가 136인 원자핵이 된다.", "w": "α 붕괴로 질량수 226 − 4 = 222, 원자 번호 88 − 2 = 86이 된다. 중성자 수는 222 − 86 = 136이다.", "first_round": 3}, {"c": "CH1S-062", "c2": "CH1S-004", "m": "β 붕괴 변화", "m2": "질량수·중성자 수", "a": "X", "s": "⁶⁰Co(원자 번호 27)가 β⁻ 붕괴하면 중성자 수가 1 늘어난다.", "f": "⁶⁰Co(원자 번호 27)가 β⁻ 붕괴하면 중성자 수가 1 줄어든다.", "w": "β⁻ 붕괴는 질량수 60을 두고 원자 번호만 28로 1 올린다. 중성자 수는 60 − 27 = 33에서 60 − 28 = 32로 1 줄어든다.", "first_round": 3}, {"c": "CH1S-063", "c2": "CH1S-061", "m": "γ 붕괴·핵반응식 보존", "m2": "α 붕괴 변화", "a": "X", "s": "¹⁴N + ⁴He → ¹⁷O + X에서 X는 중성자이다.", "f": "¹⁴N + ⁴He → ¹⁷O + X에서 X는 양성자이다.", "w": "α 입자 ⁴He는 원자 번호 2이다. 질량수 14 + 4 = 17 + 1, 원자 번호 7 + 2 = 8 + 1이므로 X는 질량수 1, 원자 번호 1인 양성자이다.", "first_round": 3}, {"c": "CH1S-064", "c2": "CH1S-060", "m": "반감기 계산", "m2": "방사성 붕괴의 뜻", "a": "O", "s": "반감기가 2일인  "수소·다전자 에너지 순서", "a": "O", "s": "수소 원자에서는 4s가 3d보다 에너지가 높지만 다전자 원자에서는 4s가 3d보다 먼저 채워진다.", "f": "수소 원자에서는 4s가 3d보다 에너지가 높지만 다전자 원자에서는 4s가 3d보다 먼저 채워진다.", "w": "1전자인 수소는 n으로만 에너지가 정해져 n = 4인 4s가 3d보다 높다. 다전자 원자는 n + l로 따져 4s(4)가 3d(5)보다 먼저 채워진다.", "first_round": 4}, {"c": "CH1S-085", "c2": "CH1S-078", "m": "파울리 배타 원리", "m2": "양자수 규칙", "a": "O", "s": "n = 2인 전자 가운데 mₗ = 0이고 mₛ = +½인 전자는 최대 2개이다.", "f": "n = 2인 전자 가운데 mₗ = 0이고 mₛ = +½인 전자는 최대 2개이다.", "w": "n = 2에서 mₗ = 0인 오비탈은 2s(l = 0)와 2p(l = 1) 하나씩 2개이다. 한 오비탈에 같은 스핀 전자는 하나뿐이므로 최대 2개이다.", "first_round": 4}, {"c": "CH1S-086", "c2": "CH1S-084", "m": "훈트 규칙·홀전자 수", "m2": "쌓음 원리·n+l 규칙", "a": "O", "s": "바닥상태의 ₁₆S 원자와 ₂₂Ti 원자는 홀전자 수가 같다.", "f": "바닥상태의 ₁₆S 원자와 ₂₂Ti 원자는 홀전자 수가 같다.", "w": "S는 [Ne] 3s² 3p⁴로 3p에 홀전자 2개, Ti는 [Ar] 4s² 3d²로 3d에 같은 스핀으로 따로 들어가 홀전자 2개이다.", "first_round": 4}, {"c": "CH1S-087", "c2": "CH1S-085", "m": "바닥·들뜬 상태 판정", "m2": "파울리 배타 원리", "a": "X", "s": "2p 오비탈 하나에 같은 스핀의 전자 2개가 들어간 배치는 훈트 규칙만 어긴 들뜬상태이다.", "f": "2p 오비탈 하나에 같은 스핀의 전자 2개가 들어간 배치는 파울리 원리를 어겨 존재할 수 없다.", "w": "한 오비탈에서는 n, l, mₗ이 같으므로 mₛ까지 같으면 네 양자수가 모두 같아진다. 파울리 원리 위반은 들뜬상태가 아니라 불가능한 배치이다.", "first_round": 4}, {"c": "CH1S-088", "c2": "CH1S-086", "m": "Cr·Cu 예외 배치", "m2": "훈트 규칙·홀전자 수", "a": "X", "s": "바닥상태 ₂₄Cr 원자의 홀전자 수는 ₂₅Mn 원자와 같다.", "f": "바닥상태 ₂₄Cr 원자의 홀전자 수는 ₂₅Mn 원자보다 1개 많다.", "w": "Cr은 예외로 3d⁵ 4s¹이 되어 6개가 모두 홀전자이다. Mn은 3d⁵ 4s²로 3d의 5개만 홀전자이므로 Cr이 1개 많다.", "first_round": 4}, {"c": "CH1S-089", "c2": "CH1S-005", "m": "전이 금속 이온 배치", "m2": "이온의 전자 수", "a": "O", "s": "바닥상태의 Mn²⁺(원자 번호 25)과 Fe³⁺은 전자 수와 홀전자 수가 모두 같다.", "f": "바닥상태의 Mn²⁺(원자 번호 25)과 Fe³⁺은 전자 수와 홀전자 수가 모두 같다.", "w": "전자 수는 25 − 2 = 23, 26 − 3 = 23으로 같다. 4s부터 떼므로 둘 다 [Ar] 3d⁵이고 홀전자는 5개씩이다.", "first_round": 4}, {"c": "CH1S-090", "c2": "CH1S-086", "m": "상자기성·반자기성", "m2": "훈트 규칙·홀전자 수", "a": "X", "s": "바닥상태 ₆C 원자는 2p 전자 2개가 한 오비탈에 짝지어 있어 반자기성이다.", "f": "바닥상태 ₆C 원자는 2p 전자 2개가 서로 다른 오비탈에 들어가 상자기성이다.", "w": "훈트 규칙에 따라 2p 전자 2개는 다른 오비탈에 같은 스핀으로 들어가 홀전자 2개가 된다. 홀전자가 있으므로 상자기성이다.", "first_round": 4}, {"c": "CH1S-091", "c2": "CH1S-084", "m": "원자가 전자·s·p·d 구역", "m2": "쌓음 원리·n+l 규칙", "a": "X", "s": "바닥상태 ₃₁Ga 원자의 원자가 전자는 13개이다.", "f": "바닥상태 ₃₁Ga 원자의 원자가 전자는 3개이다.", "w": "Ga는 [Ar] 3d¹⁰ 4s² 4p¹이다. 꽉 찬 3d는 세지 않고 가장 바깥 n = 4의 s + p 전자만 세므로 3개이다.", "first_round": 4}, {"c": "CH1S-092", "c2": "CH1S-089", "m": "양자수 조건별 전자 수", "m2": "전이 금속 이온 배치", "a": "X", "s": "바닥상태 Fe²⁺(원자 번호 26)에서 n = 4인 전자는 2개이다.", "f": "바닥상태 Fe²⁺(원자 번호 26)에서 n = 4인 전자는 0개이다.", "w": "Fe는 [Ar] 3d⁶ 4s²이고 양이온이 될 때 4s 전자부터 뗀다. Fe²⁺은 [Ar] 3d⁶이므로 n = 4 전자가 없다.", "first_round": 4}, {"c": "CH1S-093", "c2": "CH1S-091", "m": "가려막기·유효 핵전하", "m2": "원자가 전자·s·p·d 구역", "a": "O", "s": "2주기 원소는 원자가 전자 수가 많을수록 원자가 전자가 느끼는 유효 핵전하가 크다.", "f": "2주기 원소는 원자가 전자 수가 많을수록 원자가 전자가 느끼는 유효 핵전하가 크다.", "w": "같은 주기에서 원자가 전자가 1개 늘 때 양성자도 1개 는다. 같은 껍질 전자의 가려막기는 작아 늘어난 핵전하를 다 상쇄하지 못하므로 유효 핵전하가 커진다.", "first_round": 4}, {"c": "CH1S-094", "c2": "CH1S-093", "m": "원자 반지름 주기성", "m2": "가려막기·유효 핵전하", "a": "X", "s": "Li에서 F로 갈수록 원자 반지름이 작아지는 것은 가려막기 효과가 커지기 때문이다.", "f": "Li에서 F로 갈수록 원자 반지름이 작아지는 것은 유효 핵전하가 커지기 때문이다.", "w": "같은 2주기에서 늘어나는 전자는 같은 껍질이라 가려막기가 거의 늘지 않는다. 양성자가 늘어 유효 핵전하가 커지므로 전자를 더 세게 당겨 작아진다.", "first_round": 4}, {"c": "CH1S-095", "c2": "CH1S-006", "m": "양이온·음이온 반지름", "m2": "이온이 돼도 핵 불변", "a": "X", "s": "Na⁺이 Na보다 작은 것은 이온이 될 때 양성자 수가 늘어나기 때문이다.", "f": "Na⁺이 Na보다 작은 것은 이온이 될 때 전자 껍질 수가 줄어들기 때문이다.", "w": "이온화는 전자만 바꾸므로 양성자 수는 11 그대로이다. 3s 전자를 잃어 껍질이 3개에서 2개로 줄어 작아진다.", "first_round": 4}, {"c": "CH1S-096", "c2": "CH1S-095", "m": "원자·이온 크기 역전", "m2": "양이온·음이온 반지름", "a": "X", "s": "원자 반지름은 Mg > S이고, 이온 반지름도 Mg²⁺ > S²⁻이다.", "f": "원자 반지름은 Mg > S이지만, 이온 반지름은 Mg²⁺ < S²⁻이다.", "w": "같은 3주기 원자는 왼쪽이 크다. 이온은 Mg²⁺이 껍질 2개, S²⁻이 껍질 3개를 가지므로 크기가 뒤집힌다.", "first_round": 4}, {"c": "CH1S-097", "c2": "CH1S-095", "m": "등전자 이온 배치·크기", "m2": "양이온·음이온 반지름", "a": "O", "s": "Cl⁻은 K⁺보다 반지름이 크고 F⁻보다도 반지름이 크다.", "f": "Cl⁻은 K⁺보다 반지름이 크고 F⁻보다도 반지름이 크다.", "w": "Cl⁻과 K⁺은 전자 18개의 등전자 이온이라 원자 번호가 작은 Cl⁻이 크다. Cl⁻과 F⁻은 전자 수가 달라 껍질 수(3 > 2)로 비교하면 Cl⁻이 크다.", "first_round": 4}, {"c": "CH1S-098", "c2": "CH1S-094", "m": "족별 반응성·원소 추론", "m2": "원자 반지름 주기성", "a": "O", "s": "1족에서는 원자 반지름이 큰 원소일수록, 17족에서는 원자 반지름이 작은 원소일수록 반응성이 크다.", "f": "1족에서는 원자 반지름이 큰 원소일수록, 17족에서는 원자 반지름이 작은 원소일수록 반응성이 크다.", "w": "1족 금속은 전자를 잃는 반응이라 원자가 클수록 잃기 쉽다. 17족 비금속은 전자를 얻는 반응이라 원자가 작을수록 전자를 세게 끌어 반응성이 크다.", "first_round": 4}, {"c": "CH1S-099", "c2": "CH1S-087", "m": "이온화 에너지 정의", "m2": "바닥·들뜬 상태 판정", "a": "X", "s": "들뜬상태 Na(1s² 2s² 2p⁶ 3p¹)에서 전자 1개를 떼는 데 드는 에너지는 Na의 이온화 에너지보다 크다.", "f": "들뜬상태 Na(1s² 2s² 2p⁶ 3p¹)에서 전자 1개를 떼는 데 드는 에너지는 Na의 이온화 에너지보다 작다.", "w": "이온화 에너지는 바닥상태 기체 원자에서 전자를 떼는 에너지이다. 들뜬상태의 3p 전자는 이미 3s보다 에너지가 높으므로 떼는 데 덜 든다.", "first_round": 4}, {"c": "CH1S-100", "c2": "CH1S-094", "m": "이온화 에너지 주기성", "m2": "원자 반지름 주기성", "a": "O", "s": "제1 이온화 에너지가 Li > Na > K인 것은 아래로 갈수록 원자가 전자가 핵에서 멀어지기 때문이다.", "f": "제1 이온화 에너지가 Li > Na > K인 것은 아래로 갈수록 원자가 전자가 핵에서 멀어지기 때문이다.", "w": "같은 족에서 아래로 갈수록 껍질이 늘어 원자 반지름이 커진다. 원자가 전자가 핵에서 멀어져 약하게 붙잡히므로 떼기 쉬워진다.", "first_round": 4}, {"c": "CH1S-101", "c2": "CH1S-086", "m": "2·13족, 15·16족 예외", "m2": "훈트 규칙·홀전자 수", "a": "O", "s": "₁₅P가 ₁₆S보다 제1 이온화 에너지가 큰 것은 S의 3p 오비탈에 짝지은 전자가 있어서이다.", "f": "₁₅P가 ₁₆S보다 제1 이온화 에너지가 큰 것은 S의 3p 오비탈에 짝지은 전자가 있어서이다.", "w": "P의 3p³은 세 오비탈에 하나씩 들어 있지만 S의 3p⁴는 한 오비탈에 전자 2개가 짝지어 반발한다. 그 전자는 떼기 쉬워 S의 값이 더 작다.", "first_round": 4}, {"c": "CH1S-102", "c2": "CH1S-091", "m": "순차 이온화 에너지", "m2": "원자가 전자·s·p·d 구역", "a": "O", "s": "순차 이온화 에너지가 E₃에서 E₄로 급증하는 3주기 원소의 원자가 전자 배치는 3s² 3p¹이다.", "f": "순차 이온화 에너지가 E₃에서 E₄로 급증하는 3주기 원소의 원자가 전자 배치는 3s² 3p¹이다.", "w": "E₄에서 급증하면 원자가 전자가 3개이다. 3주기에서 원자가 전자가 3개인 것은 13족 Al(3s² 3p¹)이다.", "first_round": 4}, {"c": "CH1S-103", "c2": "CH1S-099", "m": "전자 친화도", "m2": "이온화 에너지 정의", "a": "X", "s": "Na(g) + Cl(g) → Na⁺(g) + Cl⁻(g)는 Cl의 전자 친화도가 Na의 이온화 에너지보다 커서 에너지를 방출한다.", "f": "Na(g) + Cl(g) → Na⁺(g) + Cl⁻(g)는 Cl의 전자 친화도가 Na의 이온화 에너지보다 작아 에너지를 흡수한다.", "w": "Na의 이온화 에너지(약 496 kJ/mol)가 Cl의 전자 친화도(약 349 kJ/mol)보다 크다. 전자가 옮겨 가기만 하는 이 과정은 그 차만큼 에너지를 흡수한다.", "first_round": 4}, {"c": "CH1S-104", "c2": "CH1S-093", "m": "전기음성도", "m2": "가려막기·유효 핵전하", "a": "O", "s": "O가 N보다 전기음성도가 큰 것은 같은 2주기에서 O의 유효 핵전하가 더 크기 때문이다.", "f": "O가 N보다 전기음성도가 큰 것은 같은 2주기에서 O의 유효 핵전하가 더 크기 때문이다.", "w": "전기음성도는 결합 속 공유 전자쌍을 끄는 힘이다. 같은 껍질을 쓰는 2주기에서 원자 번호가 큰 O가 유효 핵전하가 커 전자쌍을 더 세게 끈다.", "first_round": 4}, {"c": "CH1S-105", "c2": "CH1S-100", "m": "금속성·비금속성", "m2": "이온화 에너지 주기성", "a": "X", "s": "Si는 P보다 제1 이온화 에너지가 크므로 비금속성도 더 크다.", "f": "Si는 P보다 제1 이온화 에너지가 작고 비금속성도 더 작다.", "w": "같은 3주기에서 오른쪽의 P가 Si보다 제1 이온화 에너지가 크다. 비금속성도 오른쪽 위로 갈수록 커지므로 P가 더 크다.", "first_round": 4}, {"c": "CH1S-106", "c2": "CH1S-091", "m": "옥텟·듀엣 규칙", "m2": "원자가 전자·s·p·d 구역", "a": "X", "s": "Mg는 전자 6개를 얻기보다 원자가 전자 2개를 잃어 Ar과 같은 전자 배치가 된다.", "f": "Mg는 전자 6개를 얻기보다 원자가 전자 2개를 잃어 Ne과 같은 전자 배치가 된다.", "w": "Mg는 [Ne] 3s²로 원자가 전자가 2개이다. 2개를 잃으면 가장 가까운 18족인 Ne(1s² 2s² 2p⁶)의 배치가 된다.", "first_round": 5}, {"c": "CH1S-107", "c2": "CH1S-106", "m": "옥텟 규칙의 예외", "m2": "옥텟·듀엣 규칙", "a": "O", "s": "PCl₅에서 P 주위 전자는 10개로 옥텟을 넘지만, 각 Cl 주위 전자는 8개로 옥텟을 만족한다.", "f": "PCl₅에서 P 주위 전자는 10개로 옥텟을 넘지만, 각 Cl 주위 전자는 8개로 옥텟을 만족한다.", "w": "P는 Cl 5개와 공유 전자쌍 5개를 이뤄 10개(확장 옥텟)를 갖고, 각 Cl은 공유 1쌍 + 비공유 3쌍으로 8개를 채운다.", "first_round": 5}, {"c": "CH1S-108", "c2": "CH1S-106", "m": "루이스 구조·전자쌍", "m2": "옥텟·듀엣 규칙", "a": "X", "s": "HCN의 루이스 구조에서 공유 전자쌍은 4개, 비공유 전자쌍은 2개이다.", "f": "HCN의 루이스 구조에서 공유 전자쌍은 4개, 비공유 전자쌍은 1개이다.", "w": "원자가 전자는 1 + 4 + 5 = 10개(5쌍)이고, C·N이 옥텟을 채우려면 H−C≡N으로 공유 4쌍이 되어 남는 1쌍만 N의 비공유쌍이 된다.", "first_round": 5}, {"c": "CH1S-109", "c2": "CH1S-105", "m": "이온 결합 형성·식별", "m2": "금속성·비금속성", "a": "O", "s": "NH₄Cl에는 금속 원소가 없지만 이온 결합이 있고, NH₄⁺ 안의 N−H 결합은 공유 결합이다.", "f": "NH₄Cl에는 금속 원소가 없지만 이온 결합이 있고, NH₄⁺ 안의 N−H 결합은 공유 결합이다.", "w": "N·H·Cl은 모두 비금속이라 원자 사이 결합은 공유 결합이지만, NH₄⁺과 Cl⁻이라는 양이온·음이온이 있으므로 이온 결합도 있다.", "first_round": 5}, {"c": "CH1S-110", "c2": "CH1S-095", "m": "격자 에너지", "m2": "양이온·음이온 반지름", "a": "X", "s": "LiF와 CsI는 이온 전하가 같으므로, 이온 반지름 합이 큰 LiF의 격자 에너지가 더 크다.", "f": "LiF와 CsI는 이온 전하가 같으므로, 이온 반지름 합이 작은 LiF의 격자 에너지가 더 크다.", "w": "Li⁺·F⁻은 2주기 이온이라 Cs⁺·I⁻보다 훨씬 작아 반지름 합이 작고, 전하가 같으면 거리가 짧을수록 격자 에너지가 크다.", "first_round": 5}, {"c": "CH1S-111", "c2": "CH1S-108", "m": "결합 차수·길이·세기", "m2": "루이스 구조·전자쌍", "a": "X", "s": "C₂H₂의 탄소 사이 결합 에너지는 C₂H₆의 탄소 사이 결합 에너지의 3배이다.", "f": "C₂H₂의 탄소 사이 결합 에너지는 C₂H₆의 탄소 사이 결합 에너지의 3배보다 작다.", "w": "루이스 구조로 C₂H₂는 C≡C(결합 차수 3), C₂H₆는 C−C(1)이다. 차수가 크면 결합이 세지만 더해진 결합이 첫 결합보다 약해 3배에 못 미친다.", "first_round": 5}, {"c": "CH1S-112", "c2": "CH1S-115", "m": "금속 결합과 성질", "m2": "이온 결정 전기 전도성", "a": "X", "s": "Na 고체와 NaCl 고체는 모두 양이온을 포함하므로 둘 다 전기가 통한다.", "f": "Na 고체와 NaCl 고체는 모두 양이온을 포함하지만 Na 고체만 전기가 통한다.", "w": "Na는 자유 전자가 움직여 고체에서도 전기가 통하지만, NaCl 고체는 이온이 제자리에 고정되어 움직일 전하가 없다.", "first_round": 5}, {"c": "CH1S-113", "c2": "CH1S-108", "m": "배위 결합", "m2": "루이스 구조·전자쌍", "a": "X", "s": "NH₃와 BF₃가 배위 결합한 H₃N−BF₃에서 B 주위 전자는 6개 그대로이다.", "f": "NH₃와 BF₃가 배위 결합한 H₃N−BF₃에서 B 주위 전자는 8개가 된다.", "w": "BF₃의 B는 공유 3쌍(6개)뿐이고 NH₃의 N에는 비공유쌍 1개가 있다. 이 쌍을 N이 통째로 내주어 B−N이 생기므로 B는 8개가 된다.", "first_round": 5}, {"c": "CH1S-114", "c2": "CH1S-104", "m": "전기음성도 차와 결합 성격", "m2": "전기음성도", "a": "X", "s": "O−F 결합은 두 원자 모두 전기음성도가 커서 H−O 결합보다 극성이 크다.", "f": "O−F 결합은 두 원자 모두 전기음성도가 커서 H−O 결합보다 극성이 작다.", "w": "결합 극성은 전기음성도의 크기가 아니라 차이로 정한다. O−F는 4.0 − 3.5 = 0.5, H−O는 3.5 − 2.1 = 1.4로 H−O가 더 극성이다.", "first_round": 5}, {"c": "CH1S-115", "c2": "CH1S-109", "m": "이온 결정 전기 전도성", "m2": "이온 결합 형성·식별", "a": "X", "s": "NH₄Cl은 금속 원소가 없으므로 고체를 물에 녹여도 전기가 통하지 않는다.", "f": "NH₄Cl은 금속 원소가 없지만 고체를 물에 녹이면 전기가 통한다.", "w": "NH₄Cl은 금속이 없어도 NH₄⁺과 Cl⁻으로 된 이온 결합 물질이고, 물에 녹으면 이 이온들이 움직여 전기가 통한다.", "first_round": 5}, {"c": "CH1S-116", "c2": "CH1S-024", "m": "분자 결정 녹는점", "m2": "분자가 있는 물질 판정", "a": "O", "s": "CO₂는 분자가 있지만 SiO₂는 분자가 없으므로, 녹는점은 SiO₂가 훨씬 높다.", "f": "CO₂는 분자가 있지만 SiO₂는 분자가 없으므로, 녹는점은 SiO₂가 훨씬 높다.", "w": "CO₂ 고체는 분자 사이 힘만 끊으면 되는 분자 결정이고, SiO₂는 Si−O 공유 결합이 그물처럼 이어져 공유 결합을 끊어야 녹는다.", "first_round": 5}, {"c": "CH1S-117", "c2": "CH1S-021", "m": "원자 결정·흑연", "m2": "동소체≠동위원소", "a": "X", "s": "다이아몬드와 흑연은 동소체이므로 고체 상태의 전기 전도성이 같다.", "f": "다이아몬드와 흑연은 동소체이지 H₃, H₂O, H₂S 중 결합각이 가장 작은 분자는 H₂S이다.", "w": "H₂O·H₂S는 비공유쌍이 2개라 NH₃(1개)보다 결합각이 작고, 같은 족에서 중심 원자가 큰 S 쪽이 더 작아 NH₃ 107° > H₂O 104.5° > H₂S 약 92°이다.", "first_round": 6}, {"c": "CH1S-125", "c2": "CH1S-107", "m": "입체수 5 비공유쌍 자리", "m2": "옥텟 규칙의 예외", "a": "O", "s": "ClF₃에서 Cl은 옥텟을 넘는 10개의 전자에 둘러싸이며, 분자 구조는 T자형이다.", "f": "ClF₃에서 Cl은 옥텟을 넘는 10개의 전자에 둘러싸이며, 분자 구조는 T자형이다.", "w": "Cl의 원자가 전자 7개 중 3개로 F와 결합하고 비공유 2쌍이 남아 전자 10개(확장 옥텟)·입체수 5이며, 비공유쌍 2개가 적도에 놓여 T자형이다.", "first_round": 6}, {"c": "CH1S-126", "c2": "CH1S-107", "m": "입체수 6 비공유쌍 자리", "m2": "옥텟 규칙의 예외", "a": "X", "s": "BrF₅에서 Br은 확장 옥텟으로 전자 12개를 가지며 분자 구조는 삼각쌍뿔형이다.", "f": "BrF₅에서 Br은 확장 옥텟으로 전자 12개를 가지며 분자 구조는 사각뿔형이다.", "w": "Br은 F 5개와 결합하고 비공유 1쌍이 남아 전자 12개·입체수 6(정팔면체 배열)이고, 비공유쌍 1개를 지우면 사각뿔형이다.", "first_round": 6}, {"c": "CH1S-127", "c2": "CH1S-107", "m": "확장 옥텟 조건", "m2": "옥텟 규칙의 예외", "a": "X", "s": "S가 SF₆에서 전자 12개를 가지므로 같은 16족인 O도 OF₆를 만들 수 있다.", "f": "S가 SF₆에서 전자 12개를 가지지만 같은 16족인 O는 OF₆를 만들 수 없다.", "w": "SF₆의 확장 옥텟은 3주기 S라서 가능하고, 2주기인 O는 원자가 껍질에 오비탈이 4개뿐이라 전자 8개를 넘길 수 없다.", "first_round": 6}, {"c": "CH1S-128", "c2": "CH1S-122", "m": "분자의 평면성", "m2": "전자쌍 배열≠분자 구조", "a": "X", "s": "BF₃와 NH₃는 원자 수가 같으므로 둘 다 모든 원자가 한 평면에 있다.", "f": "BF₃와 NH₃는 원자 수가 같지만 BF₃만 모든 원자가 한 평면에 있다.", "w": "BF₃는 비공유쌍 없이 평면 삼각형이지만, NH₃는 비공유쌍 1개가 있어 정사면체 배열에서 원자만 남긴 삼각뿔형이라 평면이 아니다.", "first_round": 6}, {"c": "CH1S-129", "c2": "CH1S-108", "m": "루이스 구조 그리기", "m2": "루이스 구조·전자쌍", "a": "O", "s": "CN⁻의 루이스 구조에서 전자쌍은 모두 5쌍이며, 그중 공유 전자쌍은 3쌍이다.", "f": "CN⁻의 루이스 구조에서 전자쌍은 모두 5쌍이며, 그중 공유 전자쌍은 3쌍이다.", "w": "총 전자 = 4 + 5 + 1(음전하) = 10개, 5쌍이다. C·N이 옥텟을 채우려면 C≡N으로 공유 3쌍, 나머지 2쌍은 C·N에 하나씩 비공유쌍이다.", "first_round": 6}, {"c": "CH1S-130", "c2": "CH1S-129", "m": "형식 전하 계산", "m2": "루이스 구조 그리기", "a": "O", "s": "NO₃⁻의 기여 구조에서 N의 형식 전하는 +1이고, 단일 결합한 O의 형식 전하는 −1이다.", "f": "NO₃⁻의 기여 구조에서 N의 형식 전하는 +1이고, 단일 결합한 O의 형식 전하는 −1이다.", "w": "총 전자 5 + 18 + 1 = 24개로 N=O 하나, N−O 둘을 그리면 N은 5 − 0 − 4 = +1, 단일 결합 O는 6 − 6 − 1 = −1로 합이 −1이 된다.", "first_round": 6}, {"c": "CH1S-131", "c2": "CH1S-130", "m": "형식 전하≠산화수", "m2": "형식 전하 계산", "a": "X", "s": "O₃의 가운데 O는 형식 전하가 +1이므로 산화수도 +1이다.", "f": "O₃의 가운데 O는 형식 전하가 +1이지만 산화수는 0이다.", "w": "가운데 O는 6 − 2 − 3 = +1의 형식 전하를 갖지만, 홑원소 물질은 같은 원자끼리 공유 전자를 반씩 나누므로 산화수가 모두 0이다.", "first_round": 6}, {"c": "CH1S-132", "c2": "CH1S-130", "m": "기여 구조 고르기", "m2": "형식 전하 계산", "a": "X", "s": "OCN⁻에서는 음의 형식 전하가 N에 있는 기여 구조가 가장 안정하다.", "f": "OCN⁻에서는 음의 형식 전하가 O에 있는 기여 구조가 가장 안정하다.", "w": "O=C=N(N이 −1)과 O−C≡N(O가 −1)은 형식 전하 크기가 같으므로, 음전하가 전기음성도가 더 큰 O에 있는 쪽이 더 안정하다.", "first_round": 6}, {"c": "CH1S-133", "c2": "CH1S-129", "m": "공명 혼성체", "m2": "루이스 구조 그리기", "a": "O", "s": "CO₃²⁻의 루이스 구조는 이중 결합 위치만 다른 3개이며, 실제 이온의 세 C−O 결합 길이는 같다.", "f": "CO₃²⁻의 루이스 구조는 이중 결합 위치만 다른 3개이며, 실제 이온의 세 C−O 결합 길이는 같다.", "w": "총 전자 24개로 C=O 하나와 C−O 둘을 그리면 이중 결합 자리만 바뀐 기여 구조가 3개 나오고, 실제 이온은 이들이 겹친 혼성체라 세 결합이 같다.", "first_round": 6}, {"c": "CH1S-134", "c2": "CH1S-111", "m": "공명과 결합 차수·길이", "m2": "결합 차수·길이·세기", "a": "X", "s": "NO₂⁻의 N−O 결합은 NO₃⁻의 N−O 결합보다 길다.", "f": "NO₂⁻의 N−O 결합은 NO₃⁻의 N−O 결합보다 짧다.", "w": "공명으로 결합 차수는 NO₂⁻이 3/2, NO₃⁻이 4/3이고, 결합 차수가 클수록 결합이 짧으므로 NO₂⁻ 쪽이 짧다.", "first_round": 6}, {"c": "CH1S-135", "c2": "CH1S-129", "m": "라디칼", "m2": "루이스 구조 그리기", "a": "X", "s": "NO₂⁻은 원자가 전자 총수가 17이므로 홀전자가 있는 라디칼이다.", "f": "NO₂⁻은 원자가 전자 총수가 18이므로 홀전자가 없어 라디칼이 아니다.", "w": "총 전자 = 5 + 6 × 2 + 1(음전하) = 18로 짝수이다. 전하를 빼먹으면 NO₂처럼 17로 세어 라디칼로 착각한다.", "first_round": 6}, {"c": "CH1S-136", "c2": "CH1S-079", "m": "혼성 오비탈 개수 보존", "m2": "오비탈 모양·개수", "a": "X", "s": "sp 혼성 탄소의 혼성 오비탈은 2개이고, 혼성에 쓰이지 않은 2p 오비탈은 1개이다.", "f": "sp 혼성 탄소의 혼성 오비탈은 2개이고, 혼성에 쓰이지 않은 2p 오비탈도 2개이다.", "w": "2p 오비탈은 3개인데 sp 혼성에는 2s 1개와 2p 1개만 들어가 혼성 오비탈 2개가 되므로, 2p는 3 − 1 = 2개가 남는다.", "first_round": 6}, {"c": "CH1S-137", "c2": "CH1S-120", "m": "입체수로 혼성 판정", "m2": "입체수 세기", "a": "X", "s": "SO₂와 H₂O는 모두 굽은형이므로 중심 원자의 혼성 오비탈 종류가 같다.", "f": "SO₂와 H₂O는 모두 굽은형이지만 중심 원자의 혼성 오비탈 종류가 다르다.", "w": "SO₂의 S는 O 2개 + 비공유 1쌍으로 입체수 3(sp²), H₂O의 O는 H 2개 + 비공유 2쌍으로 입체수 4(sp³)라 모양이 같아도 혼성이 다르다.", "first_round": 6}, {"c": "CH1S-138", "c2": "CH1S-136", "m": "σ·π 결합의 성질", "m2": "혼성 오비탈 개수 보존", "a": "O", "s": "C₂H₄에서 혼성에 쓰이지 않은 p 오비탈끼리 옆으로 겹친 결합 때문에 C=C 축 회전이 어렵다.", "f": "C₂H₄에서 혼성에 쓰이지 않은 p 오비탈끼리 옆으로 겹친 결합 때문에 C=C 축 회전이 어렵다.", "w": "sp² 혼성 C에는 p 오비탈이 1개 남고, 이 p끼리 옆으로 겹쳐 π 결합을 이룬다. 축을 돌리면 옆 겹침이 깨지므로 회전이 막힌다.", "first_round": 6}, {"c": "CH1S-139", "c2": "CH1S-138", "m": "σ·π 결합 수 세기", "m2": "σ·π 결합의 성질", "a": "X", "s": "C₂H₂ 한 분자에서 오비탈이 정면으로 겹쳐 생긴 결합은 2개이다.", "f": "C₂H₂ 한 분자에서 오비탈이 정면으로 겹쳐 생긴 결합은 3개이다.", "w": "정면 겹침 결합은 σ이고, σ는 원자 사이 연결 수(C−H 2 + C−C 1 = 3)와 같다. 나머지 2개는 옆 겹침인 π 결합이다.", "first_round": 6}, {"c": "CH1S-140", "c2": "CH1S-137", "m": "s 성분과 결합 성질", "m2": "입체수로 혼성 판정", "a": "X", "s": "C₂H₂, C₂H₄, C₂H₆ 중 C−H 결합이 가장 긴 것은 C₂H₂이다.", "f": "C₂H₂, C₂H₄, C₂H₆ 중 C−H 결합이 가장 긴 것은 C₂H₆이다.", "w": "C의 입체수가 2·3·4라 혼성은 sp·sp²·sp³이고, s 성분이 가장 작은 sp³ 오비탈로 만든 C₂H₆의 C−H가 가장 길다.", "first_round": 6}, {"c": "CH1S-141", "c2": "CH1S-114", "m": "결합 극성·부분 전하", "m2": "전기음성도 차와 결합 성격", "a": "O", "s": "ClF와 HCl에서 Cl이 띠는 부분 전하의 부호는 서로 반대이다.", "f": "ClF와 HCl에서 Cl이 띠는 부분 전하의 부호는 서로 반대이다.", "w": "전기음성도는 F 4.0 > Cl 3.0 > H 2.1이라 ClF에서는 Cl이 δ+, HCl에서는 Cl이 δ−를 띤다. 부분 전하는 결합 상대에 따라 정해진다.", "first_round": 7}, {"c": "CH1S-142", "c2": "CH1S-141", "m": "쌍극자 모멘트=벡터 합", "m2": "결합 극성·부분 전하", "a": "X", "s": "H₂O의 쌍극자 모멘트는 두 O−H 결합 쌍극자의 크기를 더한 값과 같다.", "f": "H₂O의 쌍극자 모멘트는 두 O−H 결합 쌍극자의 크기를 더한 값보다 작다.", "w": "두 O−H 결합 쌍극자는 모두 δ−인 O 쪽을 향하지만 굽은형이라 방향이 달라, 벡터 합은 크기의 단순 합보다 작다.", "first_round": 7}, {"c": "CH1S-143", "c2": "CH1S-122", "m": "극성 결합≠극성 분자", "m2": "전자쌍 배열≠분자 구조", "a": "O", "s": "SO₂와 CO₂는 모두 극성 결합만 가지지만 극성 분자인 것은 SO₂뿐이다.", "f": "SO₂와 CO₂는 모두 극성 결합만 가지지만 극성 분자인 것은 SO₂뿐이다.", "w": "CO₂는 C에 비공유쌍이 없어 직선형이라 두 쌍극자가 상쇄되고, SO₂는 S의 비공유쌍 때문에 굽은형이라 상쇄되지 않는다.", "first_round": 7}, {"c": "CH1S-144", "c2": "CH1S-143", "m": "대칭이면 상쇄(무극성)", "m2": "극성 결합≠극성 분자", "a": "O", "s": "SF₆은 S−F 결합 6개가 모두 극성이지만 무극성 분자이다.", "f": "SF₆은 S−F 결합 6개가 모두 극성이지만 무극성 분자이다.", "w": "결합은 모두 극성이지만 SF₆은 6자리가 모두 F인 정팔면체라, 마주 보는 결합 쌍극자끼리 상쇄되어 합이 0이다.", "fir  80 + 60 = +140 kJ이다.", "first_round": 8}, {"c": "CH1S-165", "c2": "CH1S-021", "m": "표준 생성 엔탈피", "m2": "동소체≠동위원소", "a": "X", "s": "O₂와 O₃은 모두 산소만으로 된 홑원소 물질이므로 표준 생성 엔탈피가 0이다.", "f": "O₂와 O₃은 모두 산소만으로 된 홑원소 물질이지만 표준 생성 엔탈피가 0인 것은 O₂뿐이다.", "w": "O₂와 O₃은 동소체이고, 표준 생성 엔탈피가 0인 것은 가장 안정한 홑원소 물질인 O₂뿐이다(O₃은 O₂로부터 만들 때 열을 흡수한다).", "first_round": 8}, {"c": "CH1S-166", "c2": "CH1S-168", "m": "온도 눈금 선형 변환", "m2": "Q=cmΔT 계산", "a": "O", "s": "물 50 g을 25 °C에서 298 K보다 10 K 높은 온도까지 데우는 데 드는 열은 2.09 kJ이다.", "f": "물 50 g을 25 °C에서 298 K보다 10 K 높은 온도까지 데우는 데 드는 열은 2.09 kJ이다.", "w": "25 °C = 298 K이므로 온도 차는 10 K = 10 °C이고, Q = 4.18 × 50 × 10 = 2090 J = 2.09 kJ이다.", "first_round": 8}, {"c": "CH1S-167", "c2": "CH1S-168", "m": "비열과 열용량", "m2": "Q=cmΔT 계산", "a": "O", "s": "비열이 0.45 J/(g·°C)인 철 200 g은 물 20 g보다 열용량이 크다.", "f": "비열이 0.45 J/(g·°C)인 철 200 g은 물 20 g보다 열용량이 크다.", "w": "열용량 = 비열 × 질량이므로 철은 0.45 × 200 = 90 J/°C, 물은 4.18 × 20 = 83.6 J/°C로 철이 더 크다.", "first_round": 8}, {"c": "CH1S-168", "c2": "CH1S-167", "m": "Q=cmΔT 계산", "m2": "비열과 열용량", "a": "X", "s": "열용량이 50 J/°C인 그릇에 담긴 물 100 g을 10 °C 올리는 데 드는 열은 4.18 kJ이다.", "f": "열용량이 50 J/°C인 그릇에 담긴 물 100 g을 10 °C 올리는 데 드는 열은 4.68 kJ이다.", "w": "물은 4.18 × 100 × 10 = 4180 J, 그릇도 함께 데워지므로 50 × 10 = 500 J을 더해 4680 J = 4.68 kJ이다.", "first_round": 8}, {"c": "CH1S-169", "c2": "CH1S-028", "m": "Q=nΔH·용해 엔탈피", "m2": "몰수=질량÷몰 질량", "a": "O", "s": "용해 엔탈피가 −82 kJ/mol인 CaCl₂ 11.1 g이 물에 녹으면 8.2 kJ의 열이 방출된다.", "f": "용해 엔탈피가 −82 kJ/mol인 CaCl₂ 11.1 g이 물에 녹으면 8.2 kJ의 열이 방출된다.", "w": "CaCl₂의 몰 질량은 40 + 35.5 × 2 = 111이라 11.1 g은 0.1 mol이고, Q = nΔH = 0.1 × 82 = 8.2 kJ이 방출된다.", "first_round": 8}, {"c": "CH1S-170", "c2": "CH1S-168", "m": "열량계 Q와 ΔH 부호", "m2": "Q=cmΔT 계산", "a": "X", "s": "비열 4.18 J/(g·°C)인 용액 100 g에서 염 0.05 mol이 녹아 2.0 °C 내려가면 용해 엔탈피는 −16.7 kJ/mol이다.", "f": "비열 4.18 J/(g·°C)인 용액 100 g에서 염 0.05 mol이 녹아 2.0 °C 내려가면 용해 엔탈피는 +16.7 kJ/mol이다.", "w": "Q = 4.18 × 100 × 2.0 = 836 J을 용액에서 빼앗았으므로 ΔH = +836 ÷ 0.05 = +16 720 J/mol ≈ +16.7 kJ/mol이다.", "first_round": 8}, {"c": "CH1S-171", "c2": "CH1S-170", "m": "열량계 측정 오차", "m2": "열량계 Q와 ΔH 부호", "a": "X", "s": "열이 새는 열량계로 중화열을 재면 ΔH가 참값보다 더 큰 음수로 나온다.", "f": "열이 새는 열량계로 중화열을 재면 ΔH가 참값보다 0에 가까운 음수로 나온다.", "w": "열이 새면 온도 상승 ΔT가 작게 재여 Q가 작아지고, ΔH = −Q/n의 크기도 작아져 0 쪽으로 치우친다.", "first_round": 8}, {"c": "CH1S-172", "c2": "CH1S-159", "m": "가열 곡선 해석", "m2": "상태 변화 열(융해·증발·승화)", "a": "O", "s": "일정한 세기로 가열한 물의 가열 곡선에서 100 °C 수평 구간이 0 °C 구간보다 긴 것은 증발열이 더 커서이다.", "f": "일정한 세기로 가열한 물의 가열 곡선에서 100 °C 수평 구간이 0 °C 구간보다 긴 것은 증발열이 더 커서이다.", "w": "수평 구간의 길이는 그 상태 변화에 드는 열에 비례하고, 물의 증발열(약 41 kJ/mol)이 융해열(약 6 kJ/mol)보다 훨씬 크다.", "first_round": 8}, {"c": "CH1S-173", "c2": "CH1S-168", "m": "열평형 온도 계산", "m2": "Q=cmΔT 계산", "a": "O", "s": "80 °C 철 100 g(비열 0.45 J/(g·°C))을 20 °C 물 100 g에 넣으면 평형 온도는 30 °C보다 낮다.", "f": "80 °C 철 100 g(비열 0.45 J/(g·°C))을 20 °C 물 100 g에 넣으면 평형 온도는 30 °C보다 낮다.", "w": "잃은 열 = 얻은 열에서 0.45 × 100 × (80 − t) = 4.18 × 100 × (t − 20), t ≈ 25.8 °C이다. 열용량이 큰 물 쪽 온도에 가깝다.", "first_round": 8}, {"c": "CH1S-174", "c2": "CH1S-175", "m": "아레니우스 정의와 한계", "m2": "브뢴스테드-로리 정의", "a": "X", "s": "NH₃(g)와 HCl(g)가 만나 NH₄Cl(s)가 될 때 HCl은 아레니우스 산으로 설명된다.", "f": "NH₃(g)와 HCl(g)가 만나 NH₄Cl(s)가 될 때 HCl은 브뢴스테드-로리 산으로 설명된다.", "w": "물이 없는 기체 반응이라 아레니우스 정의는 쓸 수 없고, HCl이 NH₃에 H⁺을 주므로 브뢴스테드-로리 산이다.", "first_round": 9}, {"c": "CH1S-175", "c2": "CH1S-177", "m": "브뢴스테드-로리 정의", "m2": "짝산·짝염기", "a": "O", "s": "NH₃ + H₂O ⇌ NH₄⁺ + OH⁻에서 H₂O는 H⁺을 주는 산이고, 그 짝염기는 OH⁻이다.", "f": "NH₃ + H₂O ⇌ NH₄⁺ + OH⁻에서 H₂O는 H⁺을 주는 산이고, 그 짝염기는 OH⁻이다.", "w": "H₂O가 NH₃에 H⁺을 주므로 이 반응에서는 산이고, H⁺ 하나가 빠진 OH⁻이 H₂O의 짝염기이다.", "first_round": 9}, {"c": "CH1S-176", "c2": "CH1S-175", "m": "양쪽성 물질", "m2": "브뢴스테드-로리 정의", "a": "X", "s": "HSO₄⁻과 SO₄²⁻은 모두 H⁺을 받을 수 있으므로 둘 다 양쪽성 물질이다.", "f": "HSO₄⁻과 SO₄²⁻은 모두 H⁺을 받을 수 있지만 양쪽성 물질은 HSO₄⁻뿐이다.", "w": "양쪽성이려면 H⁺을 받을 자리와 줄 H⁺이 모두 있어야 한다. SO₄²⁻은 줄 H⁺이 없어 산으로 작용할 수 없다.", "first_round": 9}, {"c": "CH1S-177", "c2": "CH1S-175", "m": "짝산·짝염기", "m2": "브뢴스테드-로리 정의", "a": "X", "s": "HCO₃⁻ + H₂O ⇌ H₂CO₃ + OH⁻에서 HCO₃⁻의 짝은 H₂CO₃이고, HCO₃⁻은 산이다.", "f": "HCO₃⁻ + H₂O ⇌ H₂CO₃ + OH⁻에서 HCO₃⁻의 짝은 H₂CO₃이고, HCO₃⁻은 염기이다.", "w": "HCO₃⁻과 H₂CO₃은 H⁺ 하나 차이의 짝이고, HCO₃⁻이 H₂O에서 H⁺을 받아 H₂CO₃이 되므로 이 반응에서 HCO₃⁻은 염기이다.", "first_round": 9}, {"c": "CH1S-178", "c2": "CH1S-113", "m": "루이스 산·염기", "m2": "배위 결합", "a": "O", "s": "H⁺ + H₂O → H₃O⁺에서 배위 결합의 전자쌍을 내놓은 H₂O는 루이스 염기이다.", "f": "H⁺ + H₂O → H₃O⁺에서 배위 결합의 전자쌍을 내놓은 H₂O는 루이스 염기이다.", "w": "H₃O⁺의 새 O−H 결합은 O의 비공유 전자쌍을 H⁺이 받아 생긴 배위 결합이고, 전자쌍을 준 쪽이 루이스 염기이다.", "first_round": 9}, {"c": "CH1S-179", "c2": "CH1S-180", "m": "Ka·pKa와 산의 세기", "m2": "강산의 짝염기는 약하다", "a": "X", "s": "pKa가 3.2인 HF의 짝염기 F⁻은 pKa가 4.8인 CH₃COOH의 짝염기보다 강한 염기이다.", "f": "pKa가 3.2인 HF의 짝염기 F⁻은 pKa가 4.8인 CH₃COOH의 짝염기보다 약한 염기이다.", "w": "pKa가 작은 HF가 더 강한 산(Ka 약 10^1.6 ≈ 40배)이고, 강한 산의 짝염기일수록 약하므로 F⁻이 CH₃COO⁻보다 약한 염기이다.", "first_round": 9}, {"c": "CH1S-180", "c2": "CH1S-177", "m": "강산의 짝염기는 약하다", "m2": "짝산·짝염기", "a": "O", "s": "HCl + H₂O → H₃O⁺ + Cl⁻이 정반응 쪽으로 치우친다면 Cl⁻은 H₂O보다 약한 염기이다.", "f": "HCl + H₂O → H₃O⁺ + Cl⁻이 정반응 쪽으로 치우친다면 Cl⁻은 H₂O보다 약한 염기이다.", "w": "짝은 HCl/Cl⁻, H₃O⁺/H₂O이다. 반응은 강한 산이 약한 산으로 바뀌는 쪽으로 가므로 HCl > H₃O⁺이고, 그 짝염기는 Cl⁻ < H₂O이다.", "first_round": 9}, {"c": "CH1S-181", "c2": "CH1S-104", "m": "구조로 보는 산의 세기", "m2": "전기음성도", "a": "X", "s": "F의 전기음성도가 가장 크므로 할로젠화 수소 중 HF가 가장 강한 산이다.", "f": "F의 전기음성도가 가장 크지만 할로젠화 수소 중 HF가 가장 약한 산이다.", "w": "HX의 산 세기는 전기음성도보다 H−X 결합 세기가 정한다. F가 가장 작아 H−F 결합이 가장 강하므로 HF가 가장 약한 산이다.", "first_round": 9}, {"c": "CH1S-182", "c2": "CH1S-179", "m": "산의 세기≠농도", "m2": "Ka·pKa와 산의 세기", "a": "X", "s": "0.01 M HF(pKa 3.2)는 0.1 M CH₃COOH(pKa 4.8)보다 농도가 작으므로 더 약한 산이다.", "f": "0.01 M HF(pKa 3.2)는 0.1 M CH₃COOH(pKa 4.8)보다 농도가 작지만 더 강한 산이다.", "w": "산의 세기는 농도가 아니라 Ka(pKa)로 정한다. pKa가 작은 HF가 더 강한 산이며, 묽게 녹아 있다고 약한 산이 되지는 않는다.", "first_round": 9}, {"c": "CH1S-183", "c2": "CH1S-105", "m": "산화물의 액성", "m2": "금속성·비금속성", "a": "O", "s": "Na₂O를 녹인 수용액과 SO₃를 녹인 수용액을 섞으면 중화 반응이 일어난다.", "f": "Na₂O를 녹인 수용액과 SO₃를 녹인 수용액을 섞으면 중화 반응이 일어난다.", "w": "Na는 금속이라 Na₂O는 물과 NaOH를 만들어 염기성, S는 비금속이라 SO₃는 H₂SO₄를 만들어 산성이므로 두 용액은 서로 중화한다.", "first_round": 9}, {"c": "CH1S-184", "c2": "CH1S-047", "m": "중화의 알짜 이온 반응식", "m2": "알짜 이온 반응식", "a": "X", "s": "Ba(OH)₂ 수용액과 H₂SO₄ 수용액을 섞을 때 Ba²⁺과 SO₄²⁻은 구경꾼 이온이다.", "f": "Ba(OH)₂ 수용액과 H₂SO₄ 수용액을 섞을 때 Ba²⁺과 SO₄²⁻도 알짜 반응에 참여한다.", "w": "H⁺ + OH⁻ → H₂O와 함께 Ba²⁺ + SO₄²⁻ → BaSO₄(s) 앙금이 생기므로, 두 이온도 알짜 이온 반응식에 들어간다.", "first_round": 9}, {"c": "CH1S-185", "c2": "CH1S-184", "m": "구경꾼 이온과 염", "m2": "중화의 알짜 이온 반응식", "a": "O", "s": "H₂SO₄ 수용액과 KOH 수용액의 중화에서 구경꾼 이온들이 이루는 염은 K₂SO₄이다.", "f": "H₂SO₄ 수용액과 KOH 수용액의 중화에서 구경꾼 이온들이 이루는 염은 K₂SO₄이다.", "w": "알짜 반응은 H⁺ + OH⁻ → H₂O뿐이라 K⁺과 SO₄²⁻은 그대로 남고, 두 이온이 전하를 맞춰 이루는 K₂SO₄가 염이다.", "first_round": 9}, {"c": "CH1S-186", "c2": "CH1S-048", "m": "약산의 알짜 이온 반응식", "m2": "이온으로 쪼개지 않는 것", "a": "X", "s": "HF 수용액과 NaOH 수용액의 알짜 이온 반응식은 H⁺ + OH⁻ → H₂O이다.", "f": "HF 수용액과 NaOH 수용액의 알짜 이온 반응식은 HF + OH⁻ → F⁻ + H₂O이다.", "w": "HF는 pKa 3.2인 약산이라 물에서 대부분 분자로 있으므로 이온으로 쪼개지 않고 HF 그대로 쓰며, Na⁺은 구경꾼이라 지운다.", "first_round": 9}, {"c": "CH1S-187", "c2": "CH1S-034", "m": "가수와 nMV=n′M′V′", "m2": "몰 농도×부피=몰수", "a": "X", "s": "0.2 M NaOH 15 mL를 완전히 중화하려면 0.1 M H₂SO₄ 30 mL가 필요하다.", "f": "0.2 M NaOH 15 mL를 완전히 중화하려면 0.1 M H₂SO₄ 15 mL가 필요하다.", "w": "OH⁻은 0.2 × 15 = 3 mmol이고, H₂SO₄는 2가라 2 × 0.1 × V = 3에서 V = 15 mL이다. 가수를 빼먹으면 30 mL로 착각한다.", "first_round": 9}, {"c": "CH1S-188", "c2": "CH1S-187", "m": "혼합 용액의 액성", "m2": "가수와 nMV=n′M′V′", "a": "X", "s": "0.1 M HCl 25 mL와 0.1 M Ca(OH)₂ 15 mL를 섞은 용액은 산성이다.", "f": "0.1 M HCl 25 mL와 0.1 M Ca(OH)₂ 15 mL를 섞은 용액은 염기성이다.", "w": "H⁺은 0.1 × 25 = 2.5 mmol, OH⁻은 2 × 0.1 × 15 = 3 mmol이라 OH⁻ 0.5 mmol이 남아 염기성이다. 부피만 보면 틀린다.", "first_round": 9}, {"c": "CH1S-189", "c2": "CH1S-185", "m": "중화 전후 이온 수 변화", "m2": "구경꾼 이온과 염", "a": "X", "s": "HCl 수용액에 NaOH 수용액을 중화점을 지나서도 계속 넣으면 전체 이온 수는 일정하게 유지된다.", "f": "HCl 수용액에 NaOH 수용액을 중화점을 지나서도 계속 넣으면 전체 이온 수는 늘어난다.", "w": "중화점까지는 사라진 H⁺ 자리를 구경꾼 Na⁺이 채워 일정하지만, 그 뒤에는 반응할 H⁺이 없어 넣은 Na⁺과 OH⁻이 그대로 쌓인다.", "first_round": 9}, {"c": "CH1S-190", "c2": "CH1S-180", "m": "염의 가수 분해", "m2": "강산의 짝염기는 약

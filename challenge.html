   넣는다. 복사 방식은 pending.html 의 복사 단추와 같은 길이다(클립보드가 안 되면
   옛 방식, 그것도 안 되면 창에 띄워 손으로 복사한다). 옛 방식의 임시 칸은 어떻게
   끝나든 지운다 — 이 점만 pending 과 다르다(2026-09-11 검토에서 잡음). */
function resultText(){
  var course=curCourse(), round=curRound(), correct=0, wrong=[];
  S.qs.forEach(function(q,i){ if(S.ans[i]===q.a) correct++; else misOf(q).forEach(function(m){ if(wrong.indexOf(m)<0) wrong.push(m); }); });
  var parts=['심화 도전'];
  if(COURSE_NAME[course]) parts.push(COURSE_NAME[course]+(round?' '+round+'회 범위':''));
  parts.push(S.qs.length+'문항 중 '+correct+' 맞음');
  parts.push('다시 볼 개념: '+(wrong.length?wrong.join(', '):'없음'));
  return parts.join(' · ');
}
function copyResult(btn){
  var msg=resultText(); if(!msg) return;
  var orig=btn.getAttribute('data-orig')||btn.textContent;
  var done=function(){ btn.textContent='복사됨 ✓'; btn.classList.add('copied');
    setTimeout(function(){ btn.textContent=orig; btn.classList.remove('copied'); }, 1800); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(msg).then(done).catch(fallback); }
  else fallback();
  /* 임시 textarea 칸은 execCommand 가 던져도 지운다(안 지우면 보이지 않는 칸이 body 에 남는다).
     execCommand 가 false 를 돌려주면 복사된 것이 아니므로 「복사됨」 이라 하지 않고 창에 띄운다. */
  function fallback(){ var ta=document.createElement('textarea'), ok=false; ta.value=msg; ta.style.position='fixed'; ta.style.opacity='0';
    try{ document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy')===true; }catch(e){ ok=false; }
    if(ta.parentNode) ta.parentNode.removeChild(ta);
    if(ok) done(); else prompt('결과 복사', msg); }
}

/* ── 안 배운 것은 내지 않는다 (선생님 2026-08-15) ──────────────────
   여태 이 화면은 **과목 접두만** 보고 뽑았다. 회차를 아예 안 봤다.
   그래서 화학Ⅰ 1회를 막 통과한 학생이 「심화 도전」을 누르면 후보 54개념
   중 44개(81%)가 18회까지 가야 배우는 것이었다 — 12문항 중 평균 열 개
   가까이가 안 배운 문제였다. 화학Ⅱ 1회 41%, 일반화학 1회 17%.

   심화는 «어려운 것» 이지 «안 배운 것» 이 아니다. 안 배운 것을 틀리게 하는
   건 도전이 아니라 그냥 모르는 것을 확인시키는 일이다.

   시험이 누적이므로 r회까지 배운 것 = 처음 등장한 회차가 r 이하인 개념이다.
   선수 과목(화학Ⅱ 학생에게 화학Ⅰ)은 이미 마쳤으므로 회차와 무관하게 낸다. */
function curCourse(){
  var c=(new URLSearchParams(location.search).get('course')||'').toLowerCase();
  return PRECOURSE[c]?c:'';               // 모르는 과목은 «없다» 로 본다
}
/* 없는 회차를 «있다» 고 적지 않는다. 주소에 round=999 가 오면 여태
   「999회까지 배운 범위」 라고 화면에 적었다 — 그런 회차는 없다. */
function curRound(){
  var r=parseInt(new URLSearchParams(location.search).get('round'),10);
  if(!(r>0)) return null;
  var last=COURSE_LAST[curCourse()]||0;
  return (last && r>last) ? last : r;
}
/* 이 회차까지 낼 수 있는 개념. round 가 없으면 아무것도 안 고른다 —
   모르면서 «다 배웠다» 고 치는 것이 지금까지의 잘못이었다. */
function poolFor(course, round){
  var prefixes=PRECOURSE[course]||[], own=prefixes[0], pool=[];
  prefixes.forEach(function(p){ (CHALLENGE_BANK[p]||[]).forEach(function(cid){
    if(!cid.forms || !cid.forms.length) return;
    if(p===own){                                  // 지금 듣는 과목만 회차로 자른다
      var first=CHALLENGE_ROUND[cid.c];
      if(first==null || round==null || first>round) return;
    }
    var f=cid.forms[Math.floor(Math.random()*cid.forms.length)];
    pool.push({c:cid.c, m:cid.m, ol:cid.ol, a:f.a, s:f.s});
  }); });
  return pool;
}
/* ── 심화의 뜻 = 반반 (선생님 결정 2026-09-28) ──────────────────────
   12문항 가운데 절반은 «약한 lvl3 개념을 다시», 절반은 «잘 잡은 개념을 한 층 더» —
   두 개념을 엮는 문장이다.

   ① 약한 개념 다시 (6까지)
      성적표가 &mis=이름|이름|… 로 넘기는 오개념 이름(고질 개념 + 최근 회차에 틀린
      개념)을 은행 개념에 맞댄다. 이름은 엔진(chemengine.js misCanon)과 같은 규칙으로
      대표 이름으로 바꾼 뒤 CHALLENGE_MIS 에서 찾는다(표는 tools/challenge_bank.py 가
      chemengine.js 의 MIS_CANON 으로 만든다 — 손으로 베끼지 않는다). 넘어온 순서대로
      이름마다 한 개념씩 돌아가며 뽑는다 — 한 이름에 개념이 열일곱 개 걸린 것도 있어서,
      그냥 모으면 여섯 자리를 한 이름이 다 차지한다. 회차 범위는 그대로 지킨다.
   ② 두 개념 엮기 (6까지)
      CHALLENGE_LINK 가운데 주인 개념(c)이 **지금 듣는 과목**이고, 둘 다 배운 회차
      (first_round · 회차 표) 안에 드는 것.
   ③ 나머지는 전처럼 배운 개념에서 무작위로 채운다. 엮기 문장이 모자라면 그 자리도
      여기서, 배운 개념이 모자라면 남은 엮기 문장으로 채운다 — 12를 채울 수 있으면 채운다.
      못 채우면 모자란 채로 내고 그렇다고 말한다(안 배운 것을 끌어오지 않는다).

   선수 과목 비중 상한: 12문항 중 3 (선생님 결정 2026-09-28)
      화학Ⅱ(선수 화학Ⅰ)·일반화학(선수 화학Ⅱ·Ⅰ) 학생에게 선수 과목 개념은 3문항까지만.
      ①이 먼저 고르고 ③이 뒤에 채우므로, 약한 개념이 선수 과목이면 그것도 3에 든다.
      (엮기 문장은 주인 개념이 지금 과목이라 3에 안 든다.) */
var TOTAL=12, HALF=6, PRE_CAP=3;
function prefixOf(c){ c=String(c||''); var i=c.lastIndexOf('-'); return i>0 ? c.slice(0,i) : ''; }
function misKey(m){ var k=(m==null?'':String(m)).trim(); return CHALLENGE_CANON[k]||k; }
/* 주소의 &mis= — 대표 이름으로 바꿔 겹치는 것을 뺀다. 지나치게 긴 목록은 앞의 40개만. */
function weakNames(){
  var raw=new URLSearchParams(location.search).get('mis')||'', out=[];
  raw.split('|').forEach(function(m){ var k=misKey(m); if(k && out.indexOf(k)<0 && out.length<40) out.push(k); });
  return out;
}
/* 엮기 문장이 틀렸을 때 «다시 볼 개념» 은 두 개념 다다. */
function misOf(q){ var o=[]; if(q.m) o.push(q.m); if(q.kind==='link' && q.m2 && q.m2!==q.m) o.push(q.m2); return o; }
function linkNote(e){ return e.w || (e.a==='X' && e.f && e.f!==e.s ? '옳은 문장: '+e.f : ''); }
/* 이 회차까지 낼 수 있는 엮기 문장. 회차는 문장에 적힌 first_round 와 회차 표를
   **둘 다** 보고 늦은 쪽을 따른다(적어 온 수가 틀려도 안 배운 것이 새지 않게). */
function linkPoolFor(course, round){
  var own=(PRECOURSE[course]||[])[0], out=[];
  if(!own || round==null) return out;
  CHALLENGE_LINK.forEach(function(e){
    if(prefixOf(e.c)!==own) return;
    var same=prefixOf(e.c2)===own, r1=CHALLENGE_ROUND[e.c], r2=same ? CHALLENGE_ROUND[e.c2] : 0;
    if(!(e.first_round>0) || r1==null || r2==null) return;      // 언제 배우는지 모르면 안 낸다
    if(Math.max(e.first_round, r1, r2)>round) return;
    out.push({c:e.c, c2:e.c2, m:e.m, m2:e.m2, ol:linkNote(e), a:e.a, s:e.s, kind:'link'});
  });
  return out;
}
/* 한 판을 짠다. 돌려주는 문항마다 kind 가 붙는다 — 'weak'(넘겨받은 약한 개념) ·
   'link'(두 개념 엮기) · 'fill'(배운 개념에서 채움). 결과 화면과 기록이 이것으로 센다. */
function planFor(course, round, weak){
  var own=(PRECOURSE[course]||[])[0], byC={}, uniq=[], used={}, seenS={}, pre=0, out=[];
  shuffle(poolFor(course, round)).forEach(function(q){ if(!byC[q.c]){ byC[q.c]=q; uniq.push(q); } });
  var links=shuffle(linkPoolFor(course, round)), li=0;
  function take(q, kind){
    var isPre=prefixOf(q.c)!==own;
    if(used[q.c] || (isPre && pre>=PRE_CAP)) return false;
    used[q.c]=1; if(isPre) pre++;
    out.push(Object.assign({}, q, {kind:kind})); return true;
  }
  function takeLink(){
    while(li<links.length){ var q=links[li++]; if(seenS[q.s]) continue; seenS[q.s]=1; out.push(q); return true; }
    return false;
  }
  // ① 약한 개념 — 이름마다 한 개념씩 돌아가며.
  //    CHALLENGE_MIS 의 한 이름에 여러 과목 개념이 걸릴 수 있다(화학Ⅰ 심화 이름 18개가 화학Ⅰ 과 같다 —
  //    «격자 에너지» → CH1-186 · CH1S-110). byC 는 이 과목이 낼 수 있는 개념(PRECOURSE · 회차)뿐이라
  //    ch1s 학생에게는 CH1S- 만, ch1 학생에게는 CH1- 만 남는다.
  var cand=(weak||[]).map(function(m){ return shuffle((CHALLENGE_MIS[m]||[]).filter(function(c){ return byC[c]; })); });
  var nWeak=0, left=true;
  while(nWeak<HALF && left){
    left=false;
    for(var i=0;i<cand.length && nWeak<HALF;i++){
      while(cand[i].length){ if(take(byC[cand[i].shift()], 'weak')){ nWeak++; break; } }
      if(cand[i].length) left=true;
    }
  }
  // ② 두 개념 엮기
  for(var k=0;k<HALF && takeLink();k++){}
  // ③ 나머지는 배운 개념에서 — 그래도 모자라면 남은 엮기 문장
  for(var j=0;j<uniq.length && out.length<TOTAL;j++) take(uniq[j], 'fill');
  while(out.length<TOTAL && takeLink()){}
  return shuffle(out);
}
function pickQuestions(){ return planFor(curCourse(), curRound(), weakNames()); }
function countKind(qs, kind){ return qs.filter(function(q){ return q.kind===kind; }).length; }

/* ── 기록한다 (선생님 결정 2026-09-28) ──────────────────────────────
   성적표 링크가 &stu=<성적표 주소의 ?student= 와 같은 불투명 코드> 를 넘기면, 다 푼
   도전 한 판을 시트 「심화기록」 에 남긴다(apps-script.gs · kind:'challenge').
     · stu 가 없으면 보내지 않는다 — 「결과 복사」 만 그대로.
     · 결과 화면은 네트워크를 기다리지 않는다. 먼저 보여 주고, 저장은 뒤에서 한다.
       성적표의 「필수는 아닙니다」 가 참이어야 한다 — 저장이 안 돼도 결과는 다 보인다.
     · 저장됐는지는 한 줄로 사실대로 말한다(저장 중 · 저장됨 · 저장 안 됨 → 다시 시도).
     · 「틀린 문항만 다시 풀기」 는 한 판이 아니라서 기록하지 않는다.
   보내는 꼴: {kind:'challenge', stu, course, round, n, ok, weakN, weakOk, linkN, linkOk,
               concepts:['CH2-010','CH2-020+CH1-005',…], isTest} */
var SAVE_URL='https://script.google.com/macros/s/AKfycbzvFaPXgEgCBQ8HowtP8tPTtdiIVFtmZSUf0KFXUOVOh3ektrFMkz4KSR4I52LDBzB8rw/exec';   // index.html · retake_entry.html 과 같은 곳
function curStu(){ var v=(new URLSearchParams(location.search).get('stu')||'').trim(); return (v && v.length<=120) ? v : ''; }
function tally(qs, ans){
  var t={n:qs.length, ok:0, weakN:0, weakOk:0, linkN:0, linkOk:0, fillN:0, fillOk:0};
  qs.forEach(function(q,i){ var ok=ans[i]===q.a?1:0; t.ok+=ok;
    if(q.kind==='weak'){ t.weakN++; t.weakOk+=ok; }
    else if(q.kind==='link'){ t.linkN++; t.linkOk+=ok; }
    else { t.fillN++; t.fillOk+=ok; } });
  return t;
}
function savePayload(){
  var t=tally(S.qs, S.ans);
  return { kind:'challenge', stu:curStu(), course:curCourse(), round:curRound(),
    n:t.n, ok:t.ok, weakN:t.weakN, weakOk:t.weakOk, linkN:t.linkN, linkOk:t.linkOk,
    concepts:S.qs.map(function(q){ return q.kind==='link' ? q.c+'+'+q.c2 : q.c; }),
    isTest:new URLSearchParams(location.search).get('test')==='1' };
}
function saveLine(){
  if(!S.save) return '';
  var t={saving:'저장 중…', ok:'기록 저장됨 ✓', fail:'저장 안 됨', retry:'틀린 문항 다시 풀기는 따로 기록하지 않습니다.'}[S.save]||'';
  return t + (S.save==='fail' ? ' <button class="savebtn" onclick="saveChallenge()">다시 시도</button>' : '');
}
function showSave(){ var el=document.getElementById('savest'); if(el){ el.className='savest '+(S.save||''); el.innerHTML=saveLine(); } }
function saveChallenge(){
  if(!S.payload || !SAVE_URL || typeof fetch!=='function') return;
  var mine=S.payload; S.save='saving'; showSave();
  var ac=(typeof AbortController==='function') ? new AbortController() : null;
  var timer=ac ? setTimeout(function(){ ac.abort(); }, 20000) : null;
  fetch(SAVE_URL, {method:'POST', body:JSON.stringify(mine), signal:ac?ac.signal:undefined})
    .then(function(r){ return r.json(); })
    .then(function(j){ if(S.payload!==mine) return; S.save=(j && j.ok===true) ? 'ok' : 'fail'; showSave(); })
    .catch(function(){ if(S.payload!==mine) return; S.save='fail'; showSave(); })
    .then(function(){ if(timer) clearTimeout(timer); });
}
/* 과목조차 모르면 회차를 물어봐야 소용이 없다. 여태는 그럴 때 화학Ⅰ 회차를
   보여 줬는데, 눌러도 과목이 그대로라 **같은 화면이 다시 떴다**(무한 반복).
   모르면 모른다고 하고 먼저 과목을 묻는다. */
var COURSE_NAME={ch1:'화학Ⅰ', ch1s:'화학Ⅰ 심화', ch2:'화학Ⅱ', gc:'일반화학'};
/* 그 과목 자기 문항이 은행에 있나. 은행이 빈 과목은 고르는 단추에 안 세운다(지금은 네 과목 모두 있다 —
   화학Ⅰ 심화는 설계 9단계 2026-10-03 에 은행을 채웠다). */
function hasBank(c){ var b=CHALLENGE_BANK[(PRECOURSE[c]||[])[0]]; return !!(b&&b.length); }
function coursePickHTML(){
  var b=Object.keys(PRECOURSE).filter(hasBank).map(function(c){
    return '<button class="rpick" onclick="goCourse(\''+c+'\')">'+COURSE_NAME[c]+'</button>'; }).join('');
  return '<div class="card intro"><span class="badgeA">A밴드 · 심화</span>'
    +'<h1>어느 과목인가요?</h1>'
    +'<p class="lede">배운 데까지만 냅니다. 먼저 과목을 골라 주세요.</p>'
    +'<div class="rpicks">'+b+'</div></div>';
}
function goCourse(c){
  var sp=new URLSearchParams(location.search);
  sp.set('course', c); sp.delete('round');   // 과목이 바뀌면 회차는 뜻이 없다
  location.search=sp.toString();
}
/* 옛 링크에는 회차가 없다(이미 학생들에게 나갔다). 그때는 지어내지 않고
   묻는다 — 한 번 누르면 되고, 안 배운 문제는 안 나온다. */
function roundPickHTML(course){
  var last=COURSE_LAST[course]||0, n=[];
  for(var r=1;r<=last;r++) n.push('<button class="rpick" onclick="goRound('+r+')">'+r+'회</button>');
  return '<div class="card intro"><span class="badgeA">A밴드 · 심화</span>'
    +'<h1>어디까지 배웠나요?</h1>'
    +'<p class="lede">배운 데까지만 냅니다. 아직 안 배운 단원은 나오지 않아요. '
    +'가장 최근에 <b>본 시험 회차</b>를 눌러 주세요.</p>'
    +'<div class="rpicks">'+n.join('')+'</div></div>';
}
function goRound(r){
  var sp=new URLSearchParams(location.search); sp.set('round', r);
  location.search=sp.toString();
}

function start(){ loadLec(); S.qs=pickQuestions(); S.ans=S.qs.map(function(){return null;}); S.graded=false; S.full=true; S.save=null; S.payload=null; S.view='quiz'; render(); window.scrollTo(0,0); }
function retryWrong(){ var w=S.qs.filter(function(q,i){return S.ans[i]!==q.a;}); if(!w.length){start();return;} shuffle(w); S.qs=w; S.ans=w.map(function(){return null;}); S.graded=false; S.full=false; S.save=null; S.payload=null; S.view='quiz'; render(); window.scrollTo(0,0); }
function answer(i,v){ if(S.graded) return; S.ans[i]=v; render(); }
function allAnswered(){ return S.ans.every(function(a){return a!=null;}); }
/* 결과를 먼저 그리고, 저장은 그다음에 보낸다(기다리지 않는다). 한 판에 한 번만. */
function submit(){
  var first=!S.graded;
  S.graded=true; S.view='result';
  if(first && curStu()){
    if(S.full){ S.payload=savePayload(); S.save='saving'; } else S.save='retry';
  }
  render(); window.scrollTo(0,0);
  if(first && S.full && S.payload) saveChallenge();
}

/* 결과를 두 갈래로 따로 센다 — 「약한 개념 다시 · 6문항 중 k」 「두 개념 엮기 · 6문항 중 j」.
   못 낸 갈래는 없다고 적고, 배운 개념에서 채운 문항이 있으면 그것도 따로 적는다
   (채운 문항을 «약한 개념» 이라고 세면 거짓말이 된다). */
function halvesHTML(){
  var t=tally(S.qs, S.ans), row=function(label, n, ok, none){
    return '<div class="half"><span>'+label+'</span><b>'+(n ? n+'문항 중 '+ok : none)+'</b></div>'; };
  return '<div class="halves">'
    +row('약한 개념 다시', t.weakN, t.weakOk, weakNames().length ? '이 범위에 없음' : '넘겨받은 약한 개념 없음')
    +row('두 개념 엮기', t.linkN, t.linkOk, CHALLENGE_LINK.length ? '이 범위에 없음' : '문장 준비 중')
    +(t.fillN ? row('배운 개념에서 채움', t.fillN, t.fillOk, '') : '')
    +'</div>';
}
function render(){
  var h='';
  if(S.view==='intro'){
    var course=curCourse(), round=curRound();
    if(!course) { $('#app').innerHTML=coursePickHTML(); return; }
    if(!round)  { $('#app').innerHTML=roundPickHTML(course); return; }
    /* 화면에 적는 수는 실제로 짜 본 한 판에서 센다 — 적은 수와 낼 수가 갈리지 않게.
       (몇 개가 되는지는 무작위와 상관없다: 지금 과목 개념 + 선수 과목 3개까지 + 엮기 문장, 12까지.) */
    var weak=weakNames(), plan=planFor(course, round, weak), many=plan.length;
    var ownP=(PRECOURSE[course]||[])[0], nOwn=0, nPre=0, seenC={};
    poolFor(course, round).forEach(function(q){ if(seenC[q.c]) return; seenC[q.c]=1; if(prefixOf(q.c)===ownP) nOwn++; else nPre++; });
    var nLinkAll=linkPoolFor(course, round).length, hasPre=(PRECOURSE[course]||[]).length>1;
    var nW=countKind(plan,'weak'), nL=countKind(plan,'link');
    var n=nOwn+Math.min(nPre,PRE_CAP)+nLinkAll;
    var why = (!hasPre && !nLinkAll) ? '지금 회차까지 배운 심화 개념이 '+nOwn+'개라 '
      : '지금 회차까지 배운 심화 개념이 '+nOwn+'개'
        +(hasPre ? ', 선수 과목 개념은 '+Math.min(nPre,PRE_CAP)+'개까지' : '')
        +(nLinkAll ? ', 두 개념 엮기 문장이 '+nLinkAll+'개' : '')+'라 ';
    /* 두 갈래를 사실대로 적는다 — 넘겨받은 약한 개념이 몇 개 걸렸는지, 엮기 문장이 있는지. */
    var weakSay = !new URLSearchParams(location.search).get('mis')
        ? '약한 개념을 넘겨받지 않아 이 자리는 배운 개념에서 고릅니다.'
      : nW ? '지난 시험에서 약했던 개념 가운데 <b>'+nW+'개</b>를 먼저 냅니다.'
      : '넘겨받은 약한 개념이 이 범위의 심화 문항에 없어 이 자리는 배운 개념에서 고릅니다.';
    var linkSay = nL>=HALF ? '두 개념을 엮는 문장 <b>'+nL+'개</b>를 냅니다.'
      : nL ? '두 개념 엮기 문장이 이 범위에 '+nL+'개뿐이라 나머지는 배운 개념에서 채웁니다.'
      : CHALLENGE_LINK.length ? '두 개념 엮기 문장이 이 회차 범위에는 아직 없어 그 자리도 배운 개념에서 채웁니다.'
      : '두 개념 엮기 문장은 아직 준비 중이라 그 자리도 배운 개념에서 채웁니다.';
    h='<div class="card intro"><span class="badgeA">A밴드 · 심화</span>'
      +'<h1>한 단계 위 문제에 도전</h1>'
      +'<p class="lede">평소보다 까다로운 심화 문항 '+many+'개입니다. 틀려도 괜찮아요. 어디까지 닿는지 확인하고, 막힌 곳은 새로 배우는 기회로 삼으면 됩니다.</p>'
      /* 「배운 데까지만」 을 화면에 적는다. 적어 두면 학생이 «안 배운 게 나왔다»
         고 느낄 때 그것이 진짜인지 아닌지 서로 확인할 수 있다. */
      +'<p class="scope"><b>'+round+'회까지 배운 범위</b>에서만 냅니다. 아직 안 배운 단원은 나오지 않아요.</p>'
      +(many ? '<p class="scope">절반은 <b>약한 개념 다시</b>, 절반은 <b>두 개념 엮기</b>입니다. '+weakSay+' '+linkSay
             + (hasPre ? ' 선수 과목 문항은 '+TOTAL+'문항 중 '+PRE_CAP+'개까지만 냅니다.' : '')+'</p>' : '')
      +(n<12 ? '<p class="scope thin">'+why+many+'문항입니다. '
             + '회차가 쌓이면 문항도 늘어납니다.</p>' : '')
      +(many===0 ? '<p class="scope thin">아직 심화로 낼 만한 개념이 없습니다. 다음 회차에 다시 오세요.</p>'
              : '<div style="margin-top:16px"><button class="btn" onclick="start()">도전 시작</button></div>')
      +'</div>';
  } else if(S.view==='quiz'){
    var done=S.ans.filter(function(a){return a!=null;}).length;
    var pct=Math.round(100*done/S.qs.length);
    h='<div class="card"><h2>심화 도전 · '+S.qs.length+'문항</h2>'
      +'<div class="prog"><div class="pbar"><i style="width:'+pct+'%"></i></div><span class="pt">'+done+'/'+S.qs.length+'</span></div>'
      +S.qs.map(function(q,i){return '<div class="q"><div class="qn">Q'+(i+1)+'</div><div class="qs">'+esc(q.s)+'</div>'
        +'<div class="ox"><button class="o '+(S.ans[i]==='O'?'sel':'')+'" onclick="answer('+i+',\'O\')">O</button>'
        +'<button class="x '+(S.ans[i]==='X'?'sel':'')+'" onclick="answer('+i+',\'X\')">X</button></div></div>';}).join('')
      +'<div style="margin-top:16px"><button class="btn" '+(allAnswered()?'':'disabled')+' onclick="submit()">'+(allAnswered()?'채점하기':'모든 문항에 답하면 채점')+'</button></div></div>';
  } else if(S.view==='result'){
    var correct=0, wrongMis=[]; S.qs.forEach(function(q,i){ if(S.ans[i]===q.a){correct++;} else misOf(q).forEach(function(m){ if(wrongMis.indexOf(m)<0) wrongMis.push(m); }); });
    var nWrong=S.qs.length-correct;
    var pct=Math.round(100*correct/S.qs.length);
    var msg = pct>=80?'대단합니다. 심화 문제도 탄탄하게 잡고 있어요.'
            : pct>=50?'잘하고 있어요. 심화에서도 절반 이상을 맞혔습니다.'
            : '여기까지 도전한 것만으로 충분합니다. 틀린 문항은 새로 배우는 기회예요.';
    h='<div class="card result"><span class="badgeA">A밴드 · 결과</span>'
      +'<div class="score">'+correct+' / '+S.qs.length+'</div>'
      +'<div class="smsg">'+msg+'</div><div class="snote">정답률 '+pct+'%</div>'
      +halvesHTML()
      +'<button class="copybtn" data-orig="결과 복사" onclick="copyResult(this)">결과 복사</button>'
      +(S.save ? '<p id="savest" class="savest '+S.save+'" role="status">'+saveLine()+'</p>' : '')
      +'</div>';
    if(wrongMis.length){
      h+='<div class="card reviewbox"><h2>복습하면 좋을 개념</h2>'
        +'<p class="lede" style="margin:-2px 0 10px">아래 개념을 한 번 더 짚으면 다음엔 더 멀리 갑니다.'
        +(wrongMis.some(function(m){return !!lecFor(m);}) ? ' 「▶ 강의」 가 붙은 개념은 누르면 개념 강의가 새 창으로 열립니다.' : '')+'</p>'
        +'<div class="mchips">'+wrongMis.map(chipHTML).join('')+'</div></div>';
    }
    /* 문장·개념 이름·해설은 은행(JSON)에서 오는 글자 그대로다 — innerHTML 에 날로 넣으면
       「Q<K 정반응·Q>K 역반응」 의 <K …> 가 태그로 먹혀 『QK 역반응』 이 된다(GC-123,
       2026-09-11 은행을 다시 만들며 생김). 복습 칩과 같이 esc() 로 감싼다. */
    h+='<div class="card"><h2>문항별 확인</h2>'
      +S.qs.map(function(q,i){var ok=S.ans[i]===q.a;
        return '<div class="q"><div class="qn">Q'+(i+1)+' · '+(ok?'정답':'오답')+'<span class="qmis">'+esc(misOf(q).join(' + '))+'</span></div><div class="qs">'+esc(q.s)+'</div>'
          +'<div class="fb '+(ok?'ok':'no')+'"><span class="cor">정답: '+q.a+'</span>'+(q.ol?' · '+esc(q.ol.replace(/\*\*(.+?)\*\*/g,'$1')):'')+'</div></div>';}).join('')
      +'</div>'
      +(nWrong?'<button class="btn" onclick="retryWrong()">틀린 '+nWrong+'문항만 다시 풀기</button>':'')
      +'<button class="ghost" onclick="start()">새 문항으로 다시 도전</button>';
  }
  $('#app').innerHTML=h;
}
render();
</script></body></html>

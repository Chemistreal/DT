<style>
:root{--paper:#FAFAF7;--surface:#FFFFFF;--ink:#16202E;--sub:#5F6D7C;--faint:#626D7B;--line:#E7E8E2;--line2:#EEF0EA;
  --teal:#0B6E6E;--teal-d:#0A5A5A;--teal-soft:#E4F0EF;--teal-line:#BFE0DD;--o:#1B8A4C;--o-bg:#E7F5EC;--x:#C0392B;--x-bg:#FBEBE9;
  --brass:#A9853C;--brass-soft:#F5EEDF;--shadow:0 1px 2px rgba(16,32,46,.04),0 6px 20px rgba(16,32,46,.05);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:680px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:11px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brass),#caa45a);flex:none}
.dawon-logo{height:28px;width:auto;display:block;flex:none}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em}.brand small{display:block;font-size:11.5px;color:var(--sub);font-weight:600;letter-spacing:0}
.wrap{max-width:680px;margin:0 auto;padding:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h1{font-size:21px;letter-spacing:-.02em;margin-bottom:8px}h2{font-size:15px;margin-bottom:6px}
.lede{font-size:13.5px;color:var(--sub)}
/* 「배운 데까지만 낸다」 를 화면에 적는 자리. 적어 두어야 학생이 이상하다고
   느낄 때 그것이 진짜인지 서로 확인할 수 있다. */
.scope{font-size:12.5px;color:var(--sub);background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;margin:10px 0 0;line-height:1.6}
.scope.thin{color:var(--brass);border-color:var(--brass);background:rgba(176,124,44,.06)}
/* 옛 링크(회차 없음)로 들어왔을 때 고르는 자리. 손가락으로 눌러야 한다. */
.rpicks{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.rpick{min-width:56px;min-height:44px;padding:11px 13px;font-size:14px;font-weight:700;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px}
.rpick:hover{border-color:var(--teal);color:var(--teal)}
.intro{border-left:4px solid var(--brass);background:linear-gradient(180deg,#FAF6EF,var(--surface))}
.badgeA{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;color:#fff;background:var(--brass);padding:4px 11px;border-radius:20px;margin-bottom:10px}
button{font-family:inherit;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:.15s}
.btn{width:100%;padding:14px;font-size:15px;background:var(--teal);color:#fff}.btn:hover{background:var(--teal-d)}
.btn:disabled{background:var(--line);color:var(--faint);cursor:not-allowed}
.q{padding:15px 0;border-bottom:1px solid var(--line2)}.q:last-child{border-bottom:0}
.qn{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;color:var(--brass);margin-bottom:6px}
.qs{font-size:14.5px;margin-bottom:11px;line-height:1.5}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:260px}
.ox button{padding:11px 0;font-size:17px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.ox button.o.sel{background:var(--o-bg);color:var(--o);border-color:var(--o)}
.ox button.x.sel{background:var(--x-bg);color:var(--x);border-color:var(--x)}
.fb{margin-top:10px;font-size:13px;border-radius:9px;padding:10px 12px;line-height:1.5}
.fb.ok{background:var(--o-bg);color:#15703D}.fb.no{background:var(--x-bg);color:#8E2F22}
.fb .cor{font-weight:800}
.result{text-align:center}.score{font-family:'JetBrains Mono',monospace;font-size:46px;font-weight:800;color:var(--teal)}
.smsg{font-size:14px;color:var(--ink);margin:8px 0 4px}.snote{font-size:12.5px;color:var(--sub)}
.prog{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.pbar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--brass);border-radius:6px;transition:width .3s}
.pt{font-size:12px;font-weight:700;color:var(--brass);white-space:nowrap}
.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:600;width:100%;padding:12px;font-size:14px;margin-top:10px}
.ghost:hover{border-color:var(--teal);color:var(--teal)}
.muted{color:var(--faint);font-size:12px}
.reviewbox{border-left:4px solid var(--brass)}
.mchips{display:flex;flex-wrap:wrap;gap:7px}
.mchip{font-size:12.5px;background:var(--brass-soft);color:#7A5E20;border-radius:20px;padding:5px 12px;font-weight:600}
/* 복습 칩이 개념 강의로 이어진다(concept-lecture-dt.json 의 map[mis]). 표에 없으면 이름만. */
a.mchip.lec{color:var(--teal-d);background:var(--teal-soft);border:1px solid var(--teal-line);text-decoration:none}
a.mchip.lec:hover{border-color:var(--teal)}
a.mchip.lec small{font-size:11.5px;font-weight:700;margin-left:5px}
/* 「결과 복사」 — 이름 없는 평문 한 줄. 푼 결과는 이 화면을 닫으면 사라진다. */
.copybtn{background:var(--surface);color:var(--teal-d);border:1.5px solid var(--teal-line);font-weight:700;padding:10px 14px;font-size:13.5px;margin-top:12px}
.copybtn:hover{border-color:var(--teal)}
.copybtn.copied{background:var(--teal-soft);border-color:var(--teal)}
.qmis{float:right;font-family:'Pretendard',sans-serif;font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:0}
.result + .card .btn,.card + .btn{margin-top:0}
.btn + .ghost{margin-top:9px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

:root{--ink:#16202E;--ink-soft:#5C5C66;--ink-faint:#706E66;--sub:#5F6D7C;--faint:#626D7B;--line:#E7E8E2;--line2:#EEF0EA;--line-strong:#D2C8B5;--paper:#FAFAF7;--card:#fff;--panel:#fff;--surface:#fff;--teal:#0B6E6E;--teal-d:#0A5A5A;--teal-soft:#E4F0EF;--teal-line:#BFE0DD;--brass:#A9853C;--brass-deep:#8A6A38;--brass-soft:#F5EEDF;/* 금색은 두 가지 일을 한다 — 글자색으로도 쓰고 흰 글씨를 얹는 단추      바탕으로도 쓴다. 원래 값(#9a7b27)은 양쪽 다 4.01:1 로 본문 기준(4.5)에      못 미쳤다. 한 단 낮춰 글자 4.77 · 단추 5.12 로 올린다. */--gold:#866A20;--o:#1B8A4C;--o-bg:#E7F5EC;--x:#C0392B;--x-bg:#FBEBE9;--bad:#b23b3b;--slate:#41595A}
html{color-scheme:light;-webkit-text-size-adjust:100%}
@media screen{
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  header .logo{letter-spacing:.16em;font-weight:700}
}</style>

const CHALLENGE_BANK={"CH1": [{"c": "CH1-006", "m": "실험식 도출", "ol": "**실험식 = 첨자를 최대공약수로 나눈 가장 간단한 비.**", "forms": [{"a": "O", "s": "포도당(C₆H₁₂O₆)과 아세트산(CH₃COOH)의 실험식은 같다."}]}, {"c": "CH1-013", "m": "루이스 전자점식", "ol": "**점 = 원자가 전자만**(O 6점, He 2점). 결합에 쓰이는 전자라 안쪽은 빼고, 이 점이 결합·모양·옥텟 분석의 출발점이다.", "forms": [{"a": "X", "s": "산소(O)와 황(S) 원자의 루이스 전자점식은 점의 개수가 서로 다르다."}]}, {"c": "CH1-036", "m": "평균 원자량", "ol": "**평균 원자량 = 질량수 × 존재 비율의 합**(보통 소수).", "forms": [{"a": "X", "s": "어떤 원소의 평균 원자량은 가장 존재비가 큰 동위원소의 질량수와 항상 같다."}]}, {"c": "CH1-046", "m": "기체 몰 환산", "ol": "**기체 몰수 = 부피 / 22.4**(11.2 L = 0.5몰). 22.4 L가 1몰당 부피라, 부피를 그것으로 나누면 몰수가 된다.", "forms": [{"a": "O", "s": "0°C, 1기압에서 5.6 L 기체는 0.25몰이다."}]}, {"c": "CH1-047", "m": "몰 비교", "ol": "**같은 질량이면 분자량 작을수록 몰수 큼**(몰수 ∝ 1/분자량). 가벼운 분자가 같은 질량에 더 많이 들어가고, 질량과 개수는 다른 잣대다.", "forms": [{"a": "X", "s": "같은 질량의 H₂와 O₂ 중 몰수가 더 큰 것은 O₂이다."}]}, {"c": "CH1-049", "m": "밀도-분자량", "ol": "**분자량 = 밀도 × 22.4**(곱셈). 분자량 클수록 밀도 큼.", "forms": [{"a": "O", "s": "0°C, 1기압에서 기체의 밀도(g/L)에 22.4를 곱하면 분자량을 구할 수 있다."}]}, {"c": "CH1-053", "m": "몰-부피", "ol": "**부피 = 몰수 × 22.4 L.** CO₂ 11.2 L = 0.5몰.", "forms": [{"a": "O", "s": "0°C, 1기압에서 CO₂ 11.2 L는 0.5몰이다."}]}, {"c": "CH1-061", "m": "배수 비례 적용", "ol": "**같은 탄소에 대한 CO:CO₂ 산소비 = 1:2.**", "forms": [{"a": "X", "s": "CO와 CO₂에서 같은 질량의 탄소와 결합한 산소의 질량비는 1:1이다."}]}, {"c": "CH1-071", "m": "양적관계 질량", "ol": "**탄소 12 g + 산소 32 g → CO₂ 44 g.**", "forms": [{"a": "X", "s": "C + O₂ → CO₂ 에서 탄소 12 g이 완전 연소하면 CO₂ 22 g이 생성된다."}]}, {"c": "CH1-073", "m": "분자설 도입", "ol": "**아보가드로가 분자 개념으로 기체 반응 법칙 설명.**", "forms": [{"a": "X", "s": "기체 반응 법칙은 돌턴의 원자설만으로 완전히 설명된다."}]}, {"c": "CH1-075", "m": "양적관계 몰수변화", "ol": "**계수 합 비교로 전체 몰수 변화 판단.** N₂ + 3H₂ → 2NH₃는 감소.", "forms": [{"a": "O", "s": "N₂ + 3H₂ → 2NH₃ 에서 반응이 진행되면 전체 기체 몰수는 감소한다."}]}, {"c": "CH1-094", "m": "동위원소 vs 동중원소", "ol": "**동위원소(원자번호 같음) vs 동중원소(질량수 같음, 다른 원소).**", "forms": [{"a": "X", "s": "질량수가 같고 원자번호가 다른 원자는 동위원소이다."}]}, {"c": "CH1-149", "m": "등전자 이온", "ol": "**등전자 이온: 핵전하 클수록 "}]}, {"c": "CH1-247", "m": "상태 함수", "ol": "**엔탈피 = 상태 함수(경로 무관)**(헤스 법칙의 근거).", "forms": [{"a": "O", "s": "엔탈피는 경로와 관계없이 처음과 나중 상태로만 결정되는 상태 함수이다."}]}, {"c": "CH1-253", "m": "평형 상수 식", "ol": "**K = 생성물/반응물(계수만큼 제곱, 고체·순수액체 제외).**", "forms": [{"a": "X", "s": "평형 상수 식에는 고체와 순수한 액체의 농도도 포함한다."}]}, {"c": "CH1-257", "m": "반응 지수 방향", "ol": "**Q < K 정반응, Q > K 역반응, Q = K 평형.** ΔG = RT ln(Q/K)라 Q와 K 비교는 곧 ΔG의 부호이고, 반응은 Q=K로 굴러간다.", "forms": [{"a": "X", "s": "Q < K이면 역반응이 우세하게 진행된다."}, {"a": "O", "s": "Q > K이면 역반응이 우세하게 진행된다."}, {"a": "X", "s": "Q < K이면 역반응이 우세하다."}, {"a": "X", "s": "Q > K이면 정반응이 우세하다."}, {"a": "O", "s": "Q < K이면 정반응이 우세하다."}]}, {"c": "CH1-260", "m": "평형 상수 단위", "ol": "**K 단위 = 반응에 따라 다름**(보통 무차원).", "forms": [{"a": "X", "s": "평형 상수 K의 단위는 항상 mol/L이다."}]}, {"c": "CH1-267", "m": "온도와 평형 상수", "ol": "**K는 온도로만 변함**(발열 온도↑ → K↓, 흡열 온도↑ → K↑).", "forms": [{"a": "X", "s": "발열 반응에서 온도를 높이면 평형 상수가 커진다."}]}, {"c": "CH1-268", "m": "압력 변화", "ol": "**압력↑ → 분자 수 적은 쪽, 압력↓ → 많은 쪽**(같으면 이동 없음). Q를 K로 되돌리는 것이고, 일정 부피의 비활성 기체는 이동을 안 일으킨다.", "forms": [{"a": "X", "s": "압력을 높이면(부피를 줄이면) 기체 분자 수가 많은 쪽으로 평형이 이동한다."}, {"a": "O", "s": "압력을 낮추면(부피를 늘리면) 기체 분자 수가 많은 쪽으로 평형이 이동한다."}, {"a": "X", "s": "압력을 높이면 기체 분자 수가 많은 쪽으로 평형이 이동한다."}, {"a": "O", "s": "압력을 높이면 기체 분자 수가 적은 쪽으로 평형이 이동한다."}]}, {"c": "CH1-269", "m": "비활성 기체", "ol": "**일정 부피 비활성 기체 첨가 → 평형 이동 없음**(분압 불변).", "forms": [{"a": "X", "s": "일정한 부피에서 비활성 기체를 넣으면 평형이 크게 이동한다."}]}, {"c": "CH1-270", "m": "촉매", "ol": "**촉매 = 평형에 빨리 도달**(위치·K·수득률 그대로). 공유 봉우리를 낮춰 양방향을 가속할 뿐이라, 수율은 압력·온도·생성물 제거로 얻는다.", "forms": [{"a": "X", "s": "촉매는 생성물의 양(수득률)을 증가시킨다."}]}, {"c": "CH1-271", "m": "압력 적용", "ol": "**N₂+3H₂⇌2NH₃: 압력↑ → NH₃ 쪽**(고압 유리).", "forms": [{"a": "O", "s": "N₂ + 3H₂ ⇌ 2NH₃에서 압력을 높이면 NH₃가 생성되는 쪽으로 이동한다."}]}, {"c": "CH1-272", "m": "온도 적용", "ol": "**N₂+3H₂⇌2NH₃(발열): 온도↓ → NH₃ 증가.**", "forms": [{"a": "O", "s": "N₂ + 3H₂ ⇌ 2NH₃(발열)에서 온도를 낮추면 NH₃ 생성이 늘어난다."}]}, {"c": "CH1-273", "m": "평형 이동과 K", "ol": "**농도·압력으로 평형 이동해도 K는 그대로**(온도만 K 변화).", "forms": [{"a": "X", "s": "압력 변화로 평형이 이동하면 새로운 평형에서 K 값이 달라진다."}]}, {"c": "CH1-284", "m": "포화 용액", "ol": "**포화 용액 = 용해 평형(동적)**(용해 속도 = 석출 속도). 멈춘 게 아니라 양방향이 맞물린 균형이고, 화학 평형·증기압과 같은 구조다.", "forms": [{"a": "X", "s": "포화 용액에서는 더 이상 용질이 녹지 않으므로 용질 입자의 이동도 없다."}]}, {"c": "CH1-285", "m": "불포화 용액", "ol": "**불포화 용액 = 더 녹일 수 있음**(용해 속도 > 석출 속도).", "forms": [{"a": "X", "s": "불포화 용액에서는 석출 속도가 용해 속도보다 크다."}]}, {"c": "CH1-302", "m": "희석 계산", "ol": "**2 M 100 mL → 200 mL = 1 M**(부피 2배 → 농도 절반).", "forms": [{"a": "X", "s": "2 M 용액 100 mL를 물로 희석하여 200 mL로 만들면 4 M이 된다."}]}, {"c": "CH1-303", "m": "농도 환산", "ol": "**농도 환산 = 밀도 + 몰질량 필요.**", "forms": [{"a": "O", "s": "퍼센트 농도를 몰농도로 바꾸려면 용액의 밀도가 필요하다."}]}, {"c": "CH1-304", "m": "몰농도와 온도", "ol": "**몰농도는 온도에 따라 변함**(부피가 변하기 때문).", "forms": [{"a": "O", "s": "몰농도는 온도가 변하면 값이 달라질 수 있다."}, {"a": "O", "s": "몰농도가 온도에 따라 변하는 것은 용액의 부피가 온도에 따라 변하기 때문이다."}]}, {"c": "CH1-305", "m": "퍼센트 농도와 온도", "ol": "**퍼센트 농도는 온도와 무관**(질량 기준).", "forms": [{"a": "X", "s": "퍼센트 농도는 온도에 따라 변한다."}]}, {"c": "CH1-309", "m": "농도 비교", "ol": "**퍼센트 농도 같아도 몰질량 다르면 몰농도 다름.**", "forms": [{"a": "O", "s": "퍼센트 농도가 같아도 용질의 몰질량이 다르면 몰농도가 다를 수 있다."}]}, {"c": "CH1-311", "m": "용액 부피", "ol": "**용액 부피 ≠ 단순 합**(입자가 섞이며 부피 변함).", "forms": [{"a": "X", "s": "용액의 부피는 용질과 용매의 부피를 단순히 더한 값과 항상 같다."}]}, {"c": "CH1-316", "m": "Kw와 온도", "ol": "**Kw는 온도에 따라 변함**(25°C에서만 10⁻¹⁴).", "forms": [{"a": "X", "s": "Kw는 온도가 변해도 항상 일정하다."}]}, {"c": "CH1-326", "m": "pH 비교", "ol": "**pH 차이 n → [H⁺] 10ⁿ배 차이**(pH 차이 2 = 100배).", "forms": [{"a": "O", "s": "pH 3인 용액은 pH 5인 용액보다 [H⁺]가 100배 크다."}]}, {"c": "CH1-332", "m": "희석과 pH", "ol": "**희석 → pH가 7에 가까워짐**(산성↑, 염기성↓).", "forms": [{"a": "X", "s": "산성 용액에 물을 많이 넣어 묽히면 pH는 더 작아진다."}]}, {"c": "CH1-333", "m": "Kw 적용", "ol": "**[H⁺][OH⁻] = 10⁻¹⁴**(10⁻⁵ → 10⁻⁹).", "forms": [{"a": "X", "s": "25°C에서 [H⁺]가 10⁻⁵ M이면 [OH⁻]는 10⁻⁵ M이다."}]}, {"c": "CH1-334", "m": "Kw 일정성", "ol": "**같은 온도면 액성과 무관하게 Kw 동일**(25°C 10⁻¹⁴).", "forms": [{"a": "O", "s": "같은 온도에서 산성, 중성, 염기성 용액 모두 K "CH1-476", "m": "전자전이·스펙트럼 계열", "ol": "**4→1 전이와 4→2 전이에서 방출되는 빛의 에너지 비는 5:1이다.**", "forms": [{"a": "O", "s": "4→1 전이와 4→2 전이에서 방출되는 빛의 에너지 비는 5:1이다."}]}, {"c": "CH1-477", "m": "전자전이·스펙트럼 계열", "ol": "**방출되는 빛의 에너지가 클수록 진동수는 크고 파장은 짧다.**", "forms": [{"a": "X", "s": "방출되는 빛의 에너지가 클수록 진동수는 작고 파장은 길다."}]}], "CH2": [{"c": "CH2-008", "m": "분산력 세기", "ol": "**분자량·전자 수·분극률 클수록 분산력 큼.** 전자가 많고 느슨할수록, 또 분자가 길쭉해 표면적이 클수록 강해진다.", "forms": [{"a": "O", "s": "분자의 분극률이 클수록 분산력이 커진다."}, {"a": "O", "s": "분산력은 분자의 분극률이 클수록 커진다."}]}, {"c": "CH2-011", "m": "접촉 면적", "ol": "**접촉 면적 클수록 분산력 큼**(긴 사슬 > 구형).", "forms": [{"a": "X", "s": "분자량이 비슷하면 접촉 면적이 작을수록 분산력이 크다."}, {"a": "X", "s": "구형에 가까운 분자가 긴 사슬 분자보다 접촉 면적이 커서 분산력이 크다."}]}, {"c": "CH2-016", "m": "얼음 밀도", "ol": "**얼음 = 수소 결합 규칙 배열로 밀도 작아 뜸.**", "forms": [{"a": "O", "s": "얼음이 물 위에 뜨는 것은 수소 결합에 의한 규칙적 배열로 밀도가 낮아지기 때문이다."}]}, {"c": "CH2-018", "m": "동족 경향", "ol": "**14족: CH₄ < SiH₄ < GeH₄**(수소 결합 없이 분산력만).", "forms": [{"a": "O", "s": "14족 수소화합물 끓는점은 CH₄ < SiH₄ < GeH₄ 순으로, 수소 결합 없이 분산력만 반영한다."}]}, {"c": "CH2-027", "m": "종합 비교", "ol": "**끓는점 = 분자량 + 극성 함께 고려**(무극성이 높을 수도).", "forms": [{"a": "O", "s": "분자량이 큰 무극성 분자가 분자량이 작은 극성 분자보다 끓는점이 높을 수 있다."}]}, {"c": "CH2-032", "m": "이온-쌍극자", "ol": "**이온-쌍극자 힘 = 이온이 물(극성)에 녹을 때 작용.**", "forms": [{"a": "O", "s": "이온-쌍극자 힘은 이온이 물에 녹을 때 작용한다."}]}, {"c": "CH2-043", "m": "운동 에너지와 온도", "ol": "**평균 운동 에너지 ∝ 절대 온도**(속력은 √T). 온도는 곧 평균 운동 에너지이고(분자량 무관), 0 K에서 운동이 멈추기에 절대 온도를 쓴다.", "forms": [{"a": "X", "s": "절대 온도가 2배가 되면 분자의 평균 속력도 2배가 된다."}, {"a": "X", "s": "절대 온도가 2배가 되면 평균 속력도 2배가 된다."}]}, {"c": "CH2-046", "m": "제곱평균제곱근 속력", "ol": "**vrms = √(3RT/M)**(T↑ 커짐, M↑ 작아짐).", "forms": [{"a": "O", "s": "기체의 제곱평균제곱근 속력(vrms)은 √(3RT/M)이다."}, {"a": "O", "s": "제곱평균제곱근 속력(vrms)은 √(3RT/M)이다."}]}, {"c": "CH2-047", "m": "속력 분포", "ol": "**기체 분자는 다양한 속력 분포**(온도↑ → 분포 넓어짐).", "forms": [{"a": "O", "s": "온도가 높을수록 기체 분자의 속력 분포가 넓어진다."}]}, {"c": "CH2-048", "m": "그레이엄 법칙", "ol": "**확산 속도 ∝ 1/√M**(가벼운 기체가 빠름). vrms=√(3RT/M)의 직접 결과이고, √M 차이가 작아 우라늄 농축엔 수천 단계가 든다.", "forms": [{"a": "O", "s": "기체의 확산 속도는 분자량의 제곱근에 반비례한다."}, {"a": "O", "s": "그레이엄 법칙을 이용하면 두 기체의 확산 속도 비로부터 분자량 비를 구할 수 있다."}, {"a": "X", "s": "같은 조건에서 분자량이 큰 기체가 분자량이 작은 기체보다 빨리 확산한다."}]}, {"c": "CH2-055", "m": "반데르발스 식", "ol": "**반데르발스 식 = 분자 부피 + 인력 보정한 상태 방정식.**", "forms": [{"a": "O", "s": "반데르발스 식은 분자 자체 부피와 분자 간 인력을 보정한 상태 방정식이다."}]}, {"c": "CH2-056", "m": "반데르발스 상수", "ol": "**a = 분자 간 인력(압력 보정), b = 분자 부피(부피 보정).** (P+a(n/V)²)(V−nb)=nRT이고, a가 큰 기체는 수소 결합·극성이 강하다.", "forms": [{"a": "O", "s": "반데르발스 상수 a는 분자 간 인력을, b는 분자 자체 부피를 반영한다."}, {"a": "X", "s": "반데르발스 상수 a는 분자 자체의 부피를 반영하는 항이다."}, {"a": "O", "s": "반데르발스 상수 a는 분자 간 인력을 반영하는 항이다."}]}, {"c": "CH2-057", "m": "압축 인자", "ol": "**Z = PV/nRT = V_실제/V_이상**(이상은 Z=1). Z<1은 인력이 수축시킨 것, Z>1은 분자 부피가 버틴 것이고, 보일 온도에서 둘이 상쇄된다.", "forms": [{"a": "O", "s": "압축 인자 Z = PV/nRT이며 이상 기체는 Z = 1이다."}, {"a": "X", "s": "이상 기체의 압축 인자 Z는 1이 아니다."}, {"a": "O", "s": "압축 인자 Z = PV/nRT이고 이상 기체는 Z = 1이다."}]}, {"c": "CH2-058", "m": "압축 인자 해석", "ol": "**인력 지배 Z < 1, 분자 부피 지배 Z > 1.**", "forms": [{"a": "O", "s": "매우 높은 압력에서 실제 기체의 Z는 1보다 커지는 경향이 있다."}, {"a": "O", "s": "분자 간 인력이 지배적이면 Z는 1보다 작아진다."}]}, {"c": "CH2-068", "m": "수상 치환", "ol": "**기체 분압 = 측정 압력 − 수증기압**(빼기).", "forms": [{"a": "O", "s": "수상 치환으로 모은 기체의 측정 압력에는 수증기압이 포함되어 있다."}, {"a": "X", "s": "수상 치환으로 모은 기체의 분압을 구하려면 측정 압력에 수증기압을 더해야 한다."}]}, {"c": "CH2-083", "m": "증기압-온도 곡선", "ol": "**증기압-온도 곡선 = 위로 볼록**(비선형 증가).", "forms": [{"a": "O", "s": "온도가 올라가면 증기 압력은 점점 빠르게(비선형적으로) 증가한다."}]}, {"c": "CH2-087", "m": "증기압 비교", "ol": "**같은 온도: 에탄올 증기압 > 물**(분자 간 힘 약함).", "forms": [{"a": "O", "s": "같은 온도에서 에탄올(C₂H₅OH)이 물보다 증기 압력이 크다."}]}, {"c": "CH2-118", "m": "농도 근사", "ol": "**묽은 수용액: 몰농도 ≈ 몰랄 농도**(물 밀도 약 1이라 부피 ≈ 질량). 진한 용액·비수용매에서는 둘을 구분해야 한다.", "forms": [{"a": "X", "s": "묽은 수용액에서 몰농도는 몰랄 농도보다 항상 훨씬 크다."}, {"a": "O", "s": "묽은 수용액에서 몰농도와 몰랄 농도는 거의 비슷하다."}]}, {"c": "CH2-125", "m": "농도 환산", "ol": "**몰농도↔몰랄 농도 환산 = 밀도 필요**(부피와 질량 연결).", "forms": [{"a": "O", "s": "몰농도를 몰랄 농도로 바꾸려면 용액의 밀도가 필요하다."}]}, {"c": "CH2-131", "m": "몰농도 의미", "ol": "**1 M = 용액 부피 1 L**(물 1 L에 녹이면 ≠ 1 M).", "forms": [{"a": "X", "s": "물 1 L에 용질 1몰을 녹이면 1 M 용액이 된다."}]}, {"c": "CH2-134", "m": "농도 비교", "ol": "**같은 퍼센트라도 분자량 다르면 몰농도 다름.**", "forms": [{"a": "O", "s": "퍼센트 농도가 같아도 용질의 분자량이 다르면 몰농도가 다르다."}]}, {"c": "CH2-137", "m": "증기압 내림", "ol": "**비휘발성 용질 → 증기압 내려감**(몰분율에 비례). 용질이 표면을 차지해 증발을 방해해서이고, 모든 총괄성의 뿌리다.", "forms": [{"a": "O", "s": "증기압 내림의 크기는 용질의 몰분율에 비례한다."}]}, {"c": "CH2-138", "m": "라울 법칙", "ol": "**용액 증기압 = 용매 몰분율 × 순용매 증기압.**", "forms": [{"a": "O", "s": "라울 법칙에 따르면 용액의 증기압은 용매의 몰분율에 순용매의 증기압을 곱한 값이다."}, {"a": "O", "s": "라울 법칙에서 용매의 몰분율이 작아지면 용액의 증기압도 작아진다."}]}, {"c": "CH2-141", "m": "몰랄 오름 상수", "ol": "**Kb, Kf = 용매 고유의 값**(용질 종류와 무관).", "forms": [{"a": "X", "s": "Kb, Kf는 용질의 종류에 따라 정해지는 값이다."}]}, {"c": "CH2-143", "m": "반트호프 인자", "ol": "**i = 입자 수**(NaCl≈2, CaCl₂≈3, 포도당≈1). 총괄성은 입자 수만 세므로 전해질은 i배가 되고, 실제 i는 이온 쌍 탓에 정수보다 살짝 작다.", "forms": [{"a": "O", "s": "CaCl₂는 물에서 입자 수가 약 3배가 된다(i≈3)."}, {"a": "O", "s": "반트호프 인자 i는 용질 1개가 내놓는 입자 수를 반영한다."}]}, {"c": "CH2-144", "m": "전해질 총괄성", "ol": "**전해질 총괄성 > 비전해질**(같은 몰랄 농도, 입자 수 많음).", "forms": [{"a": "O", "s": "같은 몰랄 농도라면 전해질 용액이 비전해질 용액보다 총괄성이 크다."}]}, {"c": "CH2-145", "m": "전해질 계산", "ol": "**전해질 총괄성 = i·K·m**(i를 곱함).", "forms": [{"a": "O", "s": "전해질 용액의 끓는점 오름은 ΔTb = i·Kb·m로 계산한다."}]}, {"c": "CH2-146", "m": "전해질 비교", "ol": "**NaCl > 포도당**(같은 몰랄 농도, 입자 수 2배).", "forms": [{"a": "O", "s": "같은 몰랄 농도면 NaCl 용액이 포도당 용액보다 어는점이 더 많이 내려간다."}, {"a": "X", "s": "0.1 m NaCl 용액과 0.1 m 포도당 용액의 끓는점 오름은 같다."}]}, {"c": "CH2-150", "m": "비전해질 비교", "ol": "**같은 몰랄 농도 비전해질 = 총괄성 같음**(i≈1).", "forms": [{"a": "X", "s": "0.1 m 포도당 용액과 0.1 m 설탕 용액의 어는점 내림은 서로 다르다."}]}, {"c": "CH2-151", "m": "몰랄 상수", "ol": "**Kf, Kb = 용매마다 다름**(물보다 클 수도).", "forms": [{"a": "O", "s": "어는점 내림 상수 Kf는 용매에 따라 물보다 더 클 수도 있다."}]}, {"c": "CH2-156", "m": "반트호프 식", "ol": "**π = MRT**(M = 몰농도, T = 절대 온도). 용질 입자가 기체처럼 압력을 내 이상 기체 식과 같은 꼴이고, 진짜 동력은 섞임 엔트로피라 총괄성이 된다.", "forms": [{"a": "O", "s": "삼투압은 π = MRT(M은 몰농도, 반트호프 인자 = 1로 가정)로 나타낼 수 있다."}, {"a": "O", "s": "삼투압은 πV = nRT 형태로도 나타낼 수 있다."}]}, {"c": "CH2-158", "m": "전해질 삼투압", "ol": "**전해질 삼투압: π = iMRT**(i를 곱함).", "forms": [{"a": "O", "s": "전해질 용액의 삼투압은 π = iMRT로 계산한다."}]}, {"c": "CH2-159", "m": "전해질 비교", "ol": "**전해질 삼투압 > 비전해질**(같은 몰농도, 입자 수 많음).", "forms": [{"a": "O", "s": "같은 몰농도면 전해질 용액이 비전해질 용액보다 삼투압이 크다."}]}, {"c": "CH2-165", "m": "세포와 삼투", "ol": "**고장액 수축·저장액 팽창·등장액 변화 없음.**", "forms": [{"a": "O", "s": "적혈구를 고장액에 넣으면 수축한다."}, {"a": "O", "s": "적혈구를 저장액에 넣으면 팽창하거나 터진다."}, {"a": "X", "s": "적혈구를 저장액에 넣으면 수축한다."}]}, {"c": "CH2-166", "m": "역삼투", "ol": "**역삼투 = 삼투압보다 큰 압력으로 용매를 반대로 이동.**", "forms": [{"a": "O", "s": "역삼투는 삼투압보다 큰 압력을 가해 용매를 반대로 이동시키는 것이다."}]}, {"c": "CH2-168", "m": "분자량 측정", "ol": "**삼투압 측정 → 분자량 계산**(고분자에 유용).", "forms": [{"a": "O", "s": "삼투압 측정으로 용질의 분자량을 구할 수 있다."}, {"a": "O", "s": "삼투압은 고분자(큰 분자)의 분자량 측정에 특히 유용하다."}]}, {"c": "CH2-169", "m": "삼투압 크기", "ol": "**삼투압 = 묽은 용액에서도 크게 나타남**(측정 유리).", "forms": [{"a": "X", "s": "삼투압은 매우 묽은 용액에서는 측정할 수 없을 만큼 작다."}]}, {"c": "CH2-176", "m": "표준 생성 엔탈피", "ol": "**안정한 홑원소 물질의 표준 생성 엔탈피 = 0**(측정 불가라 약속한 기준). 모든 물질을 홑원소 기준으로 적어 두면 ΔH = Σ생성물 − Σ반응물로 나온다.", "forms": [{"a": "X", "s": "산소 기체(O₂)처럼 가장 안정한 홑원소 물질의 표준 생성 엔탈피는 0이 아니다."}, {"a": "O", "s": "표준 생성 엔탈피는 화합물 1몰이 가장 안정한 원소로부터 생성될 때의 엔탈피 변화이다."}, {"a": "X", "s": "산소 기체(O₂)의 표준 생성 엔탈피는 0이 아니다."}, {"a": "O", "s": "가장 안정한 홑원소 물질의 표준 생성 엔탈피는 0이다."}]}, {"c": "CH2-177", "m": "반응엔탈피 계산", "ol": "**반응엔탈피 = 생성물 ΔHf° 합 − 반응물 ΔHf° 합.**", "forms": [{"a": "O", "s": "표준 반응엔탈피는 (생성물 ΔHf° 합) - (반응물 ΔHf° 합)으로 구한다."}, {"a": "X", "s": "표준 반응엔탈피는 (반응물 ΔHf° 합) - (생성물 ΔHf° 합)으로 구한다."}]}, {"c": "CH2-178", "m": "헤스 법칙", "ol": "**헤스 법칙 = 반응엔탈피는 경로와 무관**(엔탈피가 상태 함수=고도 차). 뒤집으면 부호 반대, 계수 곱하면 비례라, 어려운 ΔH를 쉬운 반응들로 조합한다.", "forms": [{"a": "O", "s": "여러 반응식을 더하면 각 ΔH도 더해진다."}]}, {"c": "CH2-179", "m": "결합 에너지", "ol": "**끊기 = 흡열, 형성 = 발열**(ΔH ≈ 반응물 − 생성물 결합 E). 결합은 에너지 우물이라 끊으려면 에너지가 들고, 평균값이라 결과는 근삿값이다.", "forms": [{"a": "O", "s": "결합 에너지로 ΔH ≈ (반응물 결합 에너지 합) - (생성물 결합 에너지 합)이다."}]}, {"c": "CH2-181", "m": "결합 에너지 적용", "ol": "**생성물 결합 강할수록 발열**(결합 에너지 차로 결정).", "forms": [{"a": "X", "s": "생성물의 결합이 더 약할수록(결합 에너지 합이 작을수록) 반응은 발열이다."}]}, {"c": "CH2-184", "m": "엔탈피와 열", "ol": "**일정 압력에서 q = ΔH.**", "forms": [{"a": "O", "s": "일정 압력에서 출입한 열 q는 엔탈피 변화 ΔH와 같다."}]}, {"c": "CH2-186", "m": "생성 엔탈피 해석", "ol": "**생성 엔탈피 음수 = 안정, 양수 = 불안정.**", "forms": [{"a": "X", "s": "표준 생성 엔탈피가 양수이면 그 화합물이 원소보다 안정하다."}]}, {"c": "CH2-195", "m": "자발성 방향", "ol": "**자발적 변화 = 우주(계+주위) 엔트로피 증가 방향.**", "forms": [{"a": "O", "s": "자발적 변화는 우주(계+주위)의 엔트로피가 증가하는 방향으로 일어난다."}]}, {"c": "CH2-197", "m": "깁스 자유 에너지", "ol": "**G = H − TS** (T = 절대 온도). 주위의 엔트로피(−ΔH/T)를 계의 양으로 접어 ΔG<0 하나로 2법칙을 판단하게 만든 함수다.", "forms": [{"a": "O", "s": "깁스 자유 에너지는 G = H - TS로 정의된다."}]}, {"c": "CH2-200", "m": "부호 조합", "ol": "**ΔH<0·ΔS>0 항상 자발, ΔH>0·ΔS<0 항상 비자발**. 부호 같으면 T = ΔH/ΔS에서 갈리고, 그 경계가 곧 녹는점·끓는점이다.", "forms": [{"a": "O", "s": "ΔH < 0이고 ΔS > 0이면 모든 온도에서 자발적이다."}, {"a": "X", "s": "ΔH > 0이고 ΔS < 0이면 모든 온도에서 자발적이다."}, {"a": "O", "s": "ΔH < 0이고 ΔS < 0이면 저온에서 자발적이다."}, {"a": "O", "s": "ΔH > 0이고 ΔS > 0이면 고온에서 자발적이다."}, {"a": "X", "s": "ΔH > 0이고 ΔS > 0이면 저온에서 자발적이다."}, {"a": "O", "s": "ΔH < 0, ΔS > 0이면 온도와 무관하게 자발적이다."}]}, {"c": "CH2-207", "m": "자발성과 속도", "ol": "**자발적이라도 속도는 느릴 수 있음.** 자발성(ΔG, 방향)과 속도(활성화 에너지)는 별개의 축이고, 촉매는 속도만 바꾼다.", "forms": [{"a": "O", "s": "자발적인 반응이라도 반응 속도는 느릴 수 있다."}]}, {"c": "CH2-208", "m": "전환 온도", "ol": "**전환 온도 T = ΔH/ΔS**(ΔG = 0인 온도). ΔG = ΔH − TΔS = 0에서 유도하고, ΔH·ΔS 부호가 같을 때만 경계가 생긴다.", "forms": [{"a": "O", "s": "자발과 비자발의 경계가 되는 온도는 T = ΔH/ΔS로 어림할 수 있다."}]}, {"c": "CH2-209", "m": "엔트로피 감소 반응", "ol": "**계 엔트로피 감소해도 전체 증가하면 반응 일어남.**", "forms": [{"a": "X", "s": "계의 엔트로피가 감소하는 반응은 절대 일어날 수 없다."}]}, {"c": "CH2-212", "m": "용해 단계", "ol": "**떼어내기 = 흡열, 섞임 = 발열**(합이 용해 엔탈피).", "forms": [{"a": "X", "s": "용해 과정에서 용질과 용매 입자 사이의 상호작용은 에너지를 흡수한다."}, {"a": "O", "s": "용질 입자를 서로 떼어내는 과정은 에너지를 흡수한다."}]}, {"c": "CH2-213", "m": "용해 엔탈피", "ol": "**용해 엔탈피 = 흡열일 수도 발열일 수도**(항상 발열 아님).", "forms": [{"a": "O", "s": "용해 엔탈피는 용해 과정 각 단계의 에너지 변화를 합한 값이다."}]}, {"c": "CH2-214", "m": "용해 자발성", "ol": "**흡열 용해 = 엔트로피 증가로 일어남.**", "forms": [{"a": "O", "s": "용해가 흡열인데도 일어나는 것은 엔트로피 증가 때문이다."}, {"a": "O", "s": "용해의 주된 자발성 원동력은 대체로 엔트로피 증가이다."}]}, {"c": "CH2-221", "m": "기체 용해도와 온도", "ol": "**기체 용해도 = 온도 높을수록 작아짐**(용해가 발열, 고체와 반대). 온도를 올리면 평형이 기체 방출 쪽으로 가고, 압력은 반대로 작용한다.", "forms": [{"a": "O", "s": "기체의 용해는 대체로 발열이라 온도가 높으면 덜 녹는다."}]}, {"c": "CH2-222", "m": "헨리 법칙", "ol": "**기체 용해도 ∝ 부분 압력**(온도 일정). 압력이 높을수록 더 녹고(탄산음료·잠수병), 온도가 오르면 오히려 덜 녹는다(고체와 반대).", "forms": [{"a": "O", "s": "헨리 법칙에 따르면 기체의 용해도는 그 기체의 부분 압력에 비례한다."}, {"a": "O", "s": "헨리 법칙은 온도가 일정할 때 성립한다."}, {"a": "O", "s": "헨리 법칙에 따르면 기체의 용해도는 부분 압력에 비례한다."}]}, {"c": "CH2-223", "m": "헨리 응용", "ol": "**탄산음료·잠수병 = 압력과 기체 용해도(헨리 법칙).**", "forms": [{"a": "O", "s": "잠수부의 잠수병은 압력과 기체 용해도의 관계(헨리 법칙)와 관련 있다."}]}, {"c": "CH2-224", "m": "헨리 법칙 계산", "ol": "**부분 압력 2배 → 용해도 2배**(정비례).", "forms": [{"a": "X", "s": "헨리 법칙에서 부분 압력이 2배가 되면 기체 용해도는 절반이 된다."}]}, {"c": "CH2-227", "m": "과포화 용액", "ol": "**과포화 용액 = 용해도보다 많이 녹은 불안정 상태.**", "forms": [{"a": "O", "s": "과포화 용액은 용해도보다 많은 용질이 녹아 있는 불안정한 상태이다."}]}, {"c": "CH2-228", "m": "헨리 법칙 한계", "ol": "**헨리 법칙 = 잘 안 녹는 기체에 잘 맞음**(암모니아는 벗어남).", "forms": [{"a": "O", "s": "헨리 법칙은 물과 반응하거나 매우 잘 녹는 기체에는 잘 맞지 않는다."}]}, {"c": "CH2-235", "m": "활성화 에너지", "ol": "**활성화 에너지 = 봉우리−반응물(장벽), 클수록 느림.** ΔH(끝점 차이)와 독립이라, 발열이어도 Ea가 높으면 느리다.", "forms": [{"a": "X", "s": "활성화 에너지는 반응물과 생성물의 에너지 차이(ΔH)와 같다."}]}, {"c": "CH2-240", "m": "촉매와 엔탈피", "ol": "**촉매는 활성화 에너지만 낮춤**(ΔH·평형 불변). 더 낮은 길을 뚫을 뿐 양쪽 골짜기 높이(ΔH)는 그대로라, 속도만 올리고 어디서 멈출지는 못 바꾼다.", "forms": [{"a": "O", "s": "촉매는 반응엔탈피 ΔH를 변화시키지 않는다."}]}, {"c": "CH2-242", "m": "속도식", "ol": "**v = k[A]^m[B]^n**(k = 속도 상수, m·n = 차수). 차수는 실험으로 정하고(메커니즘 반영), k는 온도가 정한다.", "forms": [{"a": "O", "s": "속도식은 v = k[A]^m[B]^n 형태로 나타낸다."}]}, {"c": "CH2-243", "m": "반응 차수", "ol": "**반응 차수 = 실험으로 결정**(계수와 다를 수 있음). 속도 결정 단계를 비추는 창이라 단일 단계에서만 계수와 같고, 분수·음수도 나온다.", "forms": [{"a": "O", "s": "반응 차수는 속도식에서 각 농도의 지수이다."}, {"a": "X", "s": "반응 차수는 화학 반응식의 계수와 항상 같다."}, {"a": "O", "s": "반응 차수는 실험을 통해 결정한다."}]}, {"c": "CH2-244", "m": "속도 상수", "ol": "**속도 상수 k = 온도·촉매에 의존**(농도와 무관). 농도는 충돌 횟수(속도)를, k는 충돌당 성공 확률을 담아, k=A·e^(−Ea/RT)로 정해진다.", "forms": [{"a": "O", "s": "속도 상수 k는 온도에 따라 달라진다."}, {"a": "X", "s": "속도 상수 k는 반응물의 농도에 따라 달라진다."}]}, {"c": "CH2-245", "m": "아레니우스 식", "ol": "**k = A·e^(-Ea/RT)**(온도 ↑ → k ↑, Ea ↑ → k ↓). 지수항은 문턱 넘을 확률(볼츠만), A는 충돌·배향을 담는다.", "forms": [{"a": "O", "s": "아레니우스 식 k = A·e^(-Ea/RT)에서 온도가 높을수록 k가 커진다."}, {"a": "O", "s": "활성화 에너지가 클수록 같은 온도에서 속도 상수가 작다."}]}, {"c": "CH2-246", "m": "촉매와 역반응", "ol": "**촉매는 정·역반응 모두 빠르게**(평형 위치·K 불변). 공유 봉우리를 낮춰 양방향을 함께 가속하니, 같은 평형에 더 빨리 도달할 뿐이다.", "forms": [{"a": "X", "s": "촉매는 정반응만 빠르게 하고 역반응 속도는 그대로이다."}, {"a": "O", "s": "촉매는 정반응과 역반응을 모두 빠르게 한다."}]}, {"c": "CH2-247", "m": "온도와 유효 충돌", "ol": "**온도 ↑ → 활성화 에너지 넘는 입자 비율 ↑**(유효 충돌 증가). 볼츠만 분포가 높은 쪽으로 이동해 문턱 넘는 꼬리가 커지는 것이 핵심이다.", "forms": [{"a": "X", "s": "온도가 높으면 활성화 에너지를 넘는 입자의 비율이 작아진다."}]}, {"c": "CH2-248", "m": "촉매 작용", "ol": "**촉매 = 활성화 에너지 낮은 새 경로 제공.** 낮아진 문턱을 더 많이 넘어 빨라지고, ΔH와 평형은 바꾸지 않으며 반응 후 회복된다.", "forms": [{"a": "O", "s": "촉매는 더 낮은 활성화 에너지를 갖는 새로운 반응 경로를 제공한다."}]}, {"c": "CH2-250", "m": "전체 차수", "ol": "**전체 차수 = 각 차수의 합**(m + n, 곱 아님).", "forms": [{"a": "O", "s": "전체 반응 차수는 각 반응물에 대한 차수의 합이다."}]}, {"c": "CH2-265", "m": "Ka·Kb 관계", "ol": "**Ka·Kb = Kw**. 두 식을 곱하면 [HA]·[A⁻]가 약분되고 [H⁺][OH⁻]=Kw만 남는다. 짝산-짝염기 세기는 물이 묶어 둔 반비례다.", "forms": [{"a": "O", "s": "짝산-짝염기 관계에서 Ka·Kb = Kw이다."}]}, {"c": "CH2-266", "m": "짝염기 세기", "ol": "**강산일수록 짝염기 약함**(약산일수록 짝염기 강함).", "forms": [{"a": "O", "s": "강산의 짝염기는 매우 약한 염기이다."}]}, {"c": "CH2-268", "m": "pKa", "ol": "**pKa 작을수록 강한 산**(Ka 크면 pKa 작음).", "forms": [{"a": "X", "s": "pKa가 클수록 강한 산이다."}]}, {"c": "CH2-269", "m": "물 이온곱", "ol": "**Kw = [H⁺][OH⁻] = 1×10⁻¹⁴**(25°C).", "forms": [{"a": "X", "s": "물의 자동 이온화 상수 Kw = [H⁺][OH⁻] = 1×10^-7 (25°C)이다."}]}, {"c": "CH2-282", "m": "약산 근사", "ol": "**약산 [H⁺] ≈ √(Ka·C)**(농도보다 작음).", "forms": [{"a": "O", "s": "약산의 [H⁺]는 대략 √(Ka·C)로 어림할 수 있다."}]}, {"c": "CH2-285", "m": "완충 용액", "ol": "**완충 용액 = 약산+짝염기**. 약산은 염기를, 짝염기는 산을 막는 두 저수지다. 강산의 짝염기는 방관자라 완충이 안 된다.", "forms": [{"a": "O", "s": "완충 용액은 약산과 그 짝염기(또는 약염기와 그 짝산)로 이루어진다."}, {"a": "O", "s": "완충 용액은 약산과 그 짝염기로 이루어질 수 있다."}]}, {"c": "CH2-287", "m": "헨더슨-하셀바흐", "ol": "**pH = pKa + log([짝염기]/[산])**([짝염기]=[산]이면 pH=pKa).", "forms": [{"a": "O", "s": "헨더슨-하셀바흐 식은 pH = pKa + log([짝염기]/[산])이다."}, {"a": "X", "s": "완충 용액에서 [짝염기] = [산]이면 pH는 7이다."}, {"a": "O", "s": "완충 용액에서 [짝염기] = [산]이면 pH는 pKa와 같다."}]}, {"c": "CH2-288", "m": "공통 이온 효과", "ol": "**공통 이온 효과 = 이온화 억제**(평형 분자 쪽으로 이동).", "forms": [{"a": "O", "s": "공통 이온 효과로 약산에 그 짝염기를 넣으면 약산의 이온화가 억제된다."}, {"a": "X", "s": "공통 이온 효과로 약산에 그 짝염기를 넣으면 약산의 이온화가 촉진된다."}]}, {"c": "CH2-289", "m": "염 가수분해", "ol": "**강+강 중성, 약산+강염기 염기성, 강산+약염기 산성.** 약한 부모에서 온 이온만 물과 반응하며, 전부 Ka·Kb=Kw로 결정된다.", "forms": [{"a": "O", "s": "염화 암모늄(NH₄Cl) 수용액은 산성이다."}, {"a": "X", "s": "염화 암모늄(NH₄Cl) 수용액은 염기성이다."}]}, {"c": "CH2-299", "m": "중화 양적 관계", "ol": "**nMV = n'M'V'**(가수·농도·부피, H⁺ = OH⁻ 몰수).", "forms": [{"a": "O", "s": "중화 양적 관계는 nMV = n'M'V'로 나타낸다."}]}, {"c": "CH2-304", "m": "강산-강염기 당량점", "ol": "**강산-강염기 당량점 = pH 7**. 남은 이온이 방관자라 물을 안 건드리기 때문이고, 약산이 끼면 짝염기 가수분해로 당량점이 염기성이 된다.", "forms": [{"a": "O", "s": "강산-강염기 적정의 당량점 pH는 7이다."}, {"a": "X", "s": "강산-강염기 적정의 당량점 pH는 7보다 크다."}]}, {"c": "CH2-305", "m": "약산-강염기 당량점", "ol": "**약산-강염기 당량점 = 염기성**(짝염기 가수분해).", "forms": [{"a": "O", "s": "약산-강염기 적정의 당량점은 염기성(pH>7)이다."}, {"a": "X", "s": "약산-강염기 적정의 당량점은 산성(pH<7)이다."}]}, {"c": "CH2-324", "m": "산화수 합", "ol": "**중성 화합물 합 0, 다원자 이온 합 = 전하.**", "forms": [{"a": "O", "s": "다원자 이온에서 산화수의 합은 그 이온의 전하와 같다."}]}, {"c": "CH2-326", "m": "산화제", "ol": "**산화제 = 상대 산화, 자신 환원**(전자 받음). 이름과 달리 자신이 환원되고, 표준 환원 전위가 클수록 강하다.", "forms": [{"a": "O", "s": "산화제는 다른 물질을 산화시키고 자신은 환원된다."}, {"a": "X", "s": "산화제는 전자를 잃는다."}]}, {"c": "CH2-327", "m": "환원제", "ol": "**환원제 = 상대 환원, 자신 산화**(전자 내놓음, 산화수 증가).", "forms": [{"a": "X", "s": "환원제는 다른 물질을 환원시키고 자신도 환원된다."}]}, {"c": "CH2-329", "m": "환원제와 전자", "ol": "**환원제 = 전자를 내놓음**(자신 산화, 상대 환원). 산화제와 짝을 이루고, 주고받은 전자 수는 같다.", "forms": [{"a": "O", "s": "환원제는 전자를 내놓는다(잃는다)."}]}, {"c": "CH2-330", "m": "산화제 산화수", "ol": "**산화제 = 산화수 감소**(전자 받아 환원).", "forms": [{"a": "X", "s": "산화제는 반응에서 자신의 산화수가 증가한다."}]}, {"c": "CH2-331", "m": "환원제 산화수", "ol": "**환원제 = 산화수 증가**(전자 잃어 산화).", "forms": [{"a": "O", "s": "환원제는 반응에서 자신의 산화수가 증가한다."}]}, {"c": "CH2-332", "m": "전자 균형", "ol": "**잃은 전자 수 = 얻은 전자 수**(전자 보존). 두 반쪽의 전자 수를 맞춰 더하면 식이 완성되고, 원자·전하도 함께 맞춘다.", "forms": [{"a": "O", "s": "산화환원 반응에서 잃은 전자 수와 얻은 전자 수는 같다."}, {"a": "X", "s": "산화환원 반응에서 잃은 전자 수가 얻은 전자 수보다 많다."}]}, {"c": "CH2-333", "m": "과산화물", "ol": "**과산화물 산소 = -1**(보통 -2의 예외). 산소-산소 결합 전자를 같은 원자끼리 반씩 나눠서이다.", "forms": [{"a": "X", "s": "과산화물에서 산소의 산화수는 -2이다."}]}, {"c": "CH2-334", "m": "금속 수소화물", "ol": "**금속 수소화물 수소 = -1**(보통 +1의 예외). 금속이 수소보다 전기음성도가 작아 수소가 전자를 가져가서이다.", "forms": [{"a": "X", "s": "금속 수소화물(예: NaH)에서 수소의 산화수는 +1이다."}]}, {"c": "CH2-336", "m": "산화제 역할", "ol": "**산화제 = 자신 환원, 상대 산화**(전자 받음).", "forms": [{"a": "O", "s": "산화제는 환원되면서 다른 물질을 산화시킨다."}]}, {"c": "CH2-341", "m": "다니엘 전지", "ol": "**다니엘 전지: 아연 산화전극, 구리 환원전극.**", "forms": [{"a": "O", "s": "다니엘 전지에서 아연(Zn)이 산화전극이다."}, {"a": "X", "s": "다니엘 전지에서 구리(Cu)가 산화전극이다."}]}, {"c": "CH2-342", "m": "염다리", "ol": "**염다리 = 이온 이동으로 전하 균형 유지**(전자는 도선).", "forms": [{"a": "O", "s": "염다리는 이온의 이동으로 양쪽 용액의 전하 균형을 유지한다."}]}, {"c": "CH2-343", "m": "표준 수소 전극", "ol": "**표준 수소 전극 = 표준 환원 전위 0 V(기준).** 전위는 회로상 차이로만 재므로 절대값이 없고, 해수면처럼 0을 약속한 것이다.", "forms": [{"a": "O", "s": "표준 수소 전극의 표준 환원 전위는 0 V로 정한다."}, {"a": "X", "s": "표준 수소 전극의 표준 환원 전위는 1 V로 정한다."}]}, {"c": "CH2-344", "m": "전지 전위", "ol": "**E°cell = E°(환원전극) - E°(산화전극).**", "forms": [{"a": "O", "s": "표준 전지 전위는 E°cell = E°(환원전극) - E°(산화전극)이다."}, {"a": "X", "s": "표준 전지 전위는 E°cell = E°(산화전극) - E°(환원전극)이다."}]}, {"c": "CH2-345", "m": "자발성", "ol": "**E°cell  들어가 용량 2(2l+1)이고, 네 양자수가 전자를 완전히 지정한다.", "forms": [{"a": "O", "s": "자기 양자수 ml은 -l부터 +l까지의 정수 값을 가진다."}]}, {"c": "GC-023", "m": "양자수 범위", "ol": "**n≥1 → l: 0~n-1 → ml: -l~+l → ms: ±1/2.** 오비탈 (2l+1)·n², 전자 2n².", "forms": [{"a": "X", "s": "방위 양자수 l은 0부터 n까지의 값을 가진다."}, {"a": "O", "s": "방위 양자수 l은 0부터 n-1까지의 값을 가진다."}]}, {"c": "GC-028", "m": "훈트 규칙", "ol": "**같은 에너지 오비탈은 하나씩 먼저(평행 스핀), 그 다음 짝짓기.** 반발을 줄이고 교환 안정화를 얻기 위함이며, 홀전자 수가 자기성을 정한다.", "forms": [{"a": "O", "s": "훈트 규칙에 따라 같은 에너지의 오비탈에는 전자가 먼저 하나씩 채워진다."}]}, {"c": "GC-031", "m": "에너지 순서", "ol": "**4s가 3d보다 먼저.** 다전자 원자 오비탈 에너지는 n과 l에 함께 의존.", "forms": [{"a": "O", "s": "다전자 원자에서 4s 오비탈은 3d보다 먼저 채워진다."}]}, {"c": "GC-032", "m": "안정 배치", "ol": "**d⁵·d¹⁰이 안정 → Cr=4s¹3d⁵, Cu=4s¹3d¹⁰.** 쌓음의 대표 예외.", "forms": [{"a": "O", "s": "한 부껍질이 절반 채워지거나 가득 차면 비교적 안정하다."}]}, {"c": "GC-049", "m": "옥텟 예외", "ol": "예외 셋: **붕소(미만), 3주기↑(확장), 홀수 전자(라디칼).**", "forms": [{"a": "X", "s": "BF₃, BeCl₂는 옥텟을 초과하는(확장 옥텟) 예외이다."}, {"a": "O", "s": "SF₆, PCl₅는 옥텟을 초과하는(확장 옥텟) 예외이다."}]}, {"c": "GC-050", "m": "형식 전하", "ol": "**형식 전하 = 원자가 − 비공유 − 결합/2.** 합은 분자 전하이고, 결합을 반반으로 센 장부값(진짜 전하·산화수와 다름)이다. 0에 가까울수록 안정.", "forms": [{"a": "O", "s": "형식 전하 = 원자가 전자 - 비공유 전자 - (결합 전자/2)이다."}]}, {"c": "GC-053", "m": "분자 극성", "ol": "**결합 극성 + 모양.** 대칭이면 상쇄(무극성), 비대칭이면 극성.", "forms": [{"a": "O", "s": "분자의 극성은 결합의 극성과 분자의 기하 구조에 함께 의존한다."}, {"a": "O", "s": "CO₂는 결합은 극성이지만 직선형이라 분자 전체는 무극성이다."}, {"a": "X", "s": "결합이 모두 극성이면 분자도 반드시 극성이다."}]}, {"c": "GC-055", "m": "VSEPR 구조", "ol": "**2직선·3평면삼각·4정사면체·5삼각쌍뿔·6정팔면체.** 4는 정사면체(109.5°).", "forms": [{"a": "O", "s": "전자 영역(입체수)이 2이면 직선형, 3이면 평면 삼각형, 4이면 정사면체이다."}, {"a": "O", "s": "입체수가 5이면 삼각쌍뿔, 6이면 정팔면체 구조이다."}]}, {"c": "GC-056", "m": "비공유 전자쌍", "ol": "비공유 전자쌍 = **반발 큼 → 결합각 줄임.** CH₄>NH₃>H₂O.", "forms": [{"a": "X", "s": "비공유 전자쌍은 결합 전자쌍보다 반발이 작아 결합각을 늘린다."}]}, {"c": "GC-059", "m": "시그마·파이", "ol": "**σ 정면(강)·π 옆(약).** 첫 결합은 σ. π는 밀도가 핵 사이에 덜 쌓여 약하고, 나란함이 필요해 회전을 잠가 시스-트랜스를 만든다.", "forms": [{"a": "O", "s": "시그마 결합은 오비탈이 머리를 맞대어, 파이 결합은 옆으로 겹쳐 형성된다."}, {"a": "O", "s": "이중 결합은 시그마 1개와 파이 1개, 삼중 결합은 시그마 1개와 파이 2개로 이루어진다."}, {"a": "X", "s": "삼중 결합은 시그마 결합 3개로 이루어진다."}, {"a": "O", "s": "삼중 결합은 시그마 1개와 파이 2개로 이루어진다."}]}, {"c": "GC-060", "m": "분자 오비탈", "ol": "**결합성(낮음)·반결합성(높음) 둘 생성.** 반결합성 전자는 결합을 약화.", "forms": [{"a": "O", "s": "분자 오비탈에는 결합성 오비탈과 반결합성 오비탈이 있다."}]}, {"c": "GC-061", "m": "결합 차수", "ol": "**차수 = (결합성 − 반결합성)/2.** 반결합성은 마디로 결합을 상쇄해 뺀다. O₂는 차수 2지만 π* 홀전자로 상자기성(루이스 패배), O₂⁺은 반결합성이 줄어 O₂보다 강하다.", "forms": [{"a": "X", "s": "결합 차수 = (결합성 전자 수 + 반결합성 전자 수)/2이다."}, {"a": "X", "s": "결합 차수가 0이면 그 분자는 안정하게 존재한다."}, {"a": "O", "s": "결합 차수 = (결합성 전자 수 - 반결합성 전자 수)/2이다."}]}, {"c": "GC-062", "m": "자기성", "ol": "**홀전자 → 상자기성(끌림), 짝지음 → 반자기성.** O₂는 상자기성.", "forms": [{"a": "O", "s": "홀전자가 있는 분자는 상자기성을 띤다."}]}, {"c": "GC-066", "m": "vrms", "ol": "**vrms = √(3RT/M).** (1/2)mv²=(3/2)kT에서 나온 식이라 3은 3차원, 제곱근은 KE∝v²에서 온다. 온도 4배 → 속력 2배.", "forms": [{"a": "O", "s": "제곱평균제곱근 속력 vrms = √(3RT/M)이다."}]}, {"c": "GC-068", "m": "그레이엄", "ol": "**확산 속도 ∝ 1/√M.** 가벼울수록 빠름, M 4배 → 속도 1/2.", "forms": [{"a": "O", "s": "그레이엄 법칙에 따르면 기체의 확산 속도는 분자량의 제곱근에 반비례한다."}]}, {"c": "GC-072", "m": "반데르발스", "ol": "**a = 인력 보정, b = 부피 보정.** 실제 기체용 보정식.", "forms": [{"a": "O", "s": "반데르발스 식은 분자 자체 부피와 분자 간 인력을 보정한 식이다."}]}, {"c": "GC-078", "m": "단위 세포", "ol": "**SC 1 · BCC 2 · FCC 4.** 꼭짓점 1/8, 면 1/2, 체심 1.", "forms": [{"a": "X", "s": "면심 입방(FCC) 단위 세포에는 원자가 2개 들어 있다."}, {"a": "O", "s": "체심 입방(BCC) 단위 세포에는 원자가 2개 들어 있다."}, {"a": "O", "s": "면심 입방(FCC) 단위 세포에는 원자가 4개 들어 있다."}]}, {"c": "GC-079", "m": "상평형 그림", "ol": "**축은 온도·압력.** 삼중점 = 세 상 공존, 임계점 너머 = 액기 구분 소멸.", "forms": [{"a": "X", "s": "상평형 그림에서 삼중점은 두 상이 공존하는 점이다."}]}, {"c": "GC-083", "m": "라울 법칙", "ol": "**P_용액 = 용매 몰분율 × 순용매 증기압.** 비휘발성 용질 → 증기압 내림.", "forms": [{"a": "O", "s": "라울 법칙에 따르면 용액의 증기압은 용매 몰분율 × 순용매 증기압이다."}]}, {"c": "GC-084", "m": "끓는점 오름·어는점 내림", "ol": "**끓는점↑·어는점↓, ΔT = K·m**(곱). 전해질이 더 큼.", "forms": [{"a": "O", "s": "끓는점 오름은 ΔTb = Kb·m, 어는점 내림은 ΔTf = Kf·m이다."}]}, {"c": "GC-085", "m": "삼투압", "ol": "**π = MRT**(진할수록·온도↑ 큼). 용매는 묽은 쪽 → 진한 쪽.", "forms": [{"a": "O", "s": "삼투압은 π = MRT(M은 몰농도, 반트호프 인자 = 1로 가정)로 나타낸다."}, {"a": "X", "s": "삼투압은 용액이 묽을수록 크다."}]}, {"c": "GC-086", "m": "반트호프 인자", "ol": "**i = 1몰당 입자 수.** 비전해질 1, NaCl 2, CaCl₂ 3.", "forms": [{"a": "O", "s": "전해질 용액의 총괄성은 반트호프 인자 i를 곱해 계산한다."}]}, {"c": "GC-088", "m": "몰랄 상수", "ol": "**Kf, Kb = 용매의 상수**(용질 무관). 용질은 m·i로 반영.", "forms": [{"a": "X", "s": "어는점 내림 상수 Kf는 용질의 종류에 따라 정해진다."}]}, {"c": "GC-089", "m": "전해질 비교", "ol": "같은 농도면 **NaCl > 포도당**(입자 수). CaCl₂ > NaCl > 포도당.", "forms": [{"a": "X", "s": "같은 몰랄 농도면 포도당 용액이 NaCl 용액보다 어는점이 더 많이 내려간다."}]}, {"c": "GC-095", "m": "일의 부호", "ol": "**팽창 w < 0(일 함), 압축 w > 0(일 받음).**", "forms": [{"a": "X", "s": "계가 외부에 일을 하면(기체 팽창) 일의 부호는 w > 0이다."}]}, {"c": "GC-096", "m": "정적 과정", "ol": "**일정 부피 → w = 0 → q = ΔU.**", "forms": [{"a": "O", "s": "일정 부피에서 출입한 열 q는 내부 에너지 변화 ΔU와 같다."}]}, {"c": "GC-099", "m": "엔탈피 정의", "ol": "**H = U + PV, 정압 q = ΔH.** 발열 ΔH<0, 흡열 ΔH>0.", "forms": [{"a": "X", "s": "엔탈피는 H = U - PV로 정의된다."}, {"a": "O", "s": "엔탈피는 H = U + PV로 정의된다."}]}, {"c": "GC-102", "m": "반응엔탈피 계산", "ol": "**ΔH = 생성물 합 - 반응물 합**(계수 곱). 순서 주의.", "forms": [{"a": "O", "s": "표준 반응엔탈피는 (생성물 ΔHf° 합) - (반응물 ΔHf° 합)이다."}, {"a": "X", "s": "표준 반응엔탈피는 (반응물 ΔHf° 합) - (생성물 ΔHf° 합)이다."}]}, {"c": "GC-106", "m": "제2법칙", "ol": "**자발 → 우주 총 엔트로피 증가**(계는 줄 수도).", "forms": [{"a": "O", "s": "열역학 제2법칙은 자발적 과정에서 우주의 엔트로피가 증가한다는 것이다."}]}, {"c": "GC-107", "m": "제3법칙", "ol": "**0 K 완전 결정 S = 0**(배열 하나). 절대 엔트로피의 기준.", "forms": [{"a": "X", "s": "열역학 제3법칙에 따르면 0 K의 완전한 결정의 엔트로피는 최대이다."}]}, {"c": "GC-114", "m": "자유 에너지와 평형", "ol": "**ΔG° = -RT ln K** (ΔG = ΔG° + RT ln Q에서 평형 조건을 넣은 것). K>1이면 ΔG°<0이고, 지수 관계라 작은 ΔG°가 평형을 크게 몰아붙인다.", "forms": [{"a": "O", "s": "표준 상태에서 ΔG° = -RT ln K이다."}, {"a": "X", "s": "평형 상수 K가 1보다 크면 ΔG°는 양수이다."}]}, {"c": "GC-117", "m": "평형 상수", "ol": "**Kc = 생성물/반응물(계수 거듭제곱), 평형 농도.** 순수 고체·액체는 빠지고, ΔG° = −RT ln K로 자발성과 묶인다.", "forms": [{"a": "O", "s": "평형 상수 Kc는 생성물 농도를 반응물 농도로 나눈 것이다(각 농도는 계수만큼 거듭제곱)."}]}, {"c": "GC-118", "m": "Kp", "ol": "**Kp = 부분 압력 평형 상수.** Kp = Kc(RT)^Δn이라, 기체 몰수가 안 변할 때(Δn=0)만 Kc와 같다.", "forms": [{"a": "O", "s": "Kp는 부분 압력을 이용해 나타낸 평형 상수이다."}]}, {"c": "GC-119", "m": "Kc-Kp 관계", "ol": "**Kp = Kc(RT)^Δn**(P = c·RT를 대입한 결과). Δn은 기체(생성물−반응물)만 세고, Δn=0이면 Kp=Kc다.", "forms": [{"a": "O", "s": "Kp = Kc(RT)^Δn 관계가 성립한다."}]}, {"c": "GC-120", "m": "평형 상수 식", "ol": "**순수 고체·액체 제외(활동도 1), 기체·용질만 포함.**", "forms": [{"a": "O", "s": "순수한 고체와 액체는 평형 상수 식에 포함하지 않는다."}, {"a": "X", "s": "순수한 고체와 액체도 평형 상수 식에 농도로 포함한다."}]}, {"c": "GC-122", "m": "평형 상수 의존성", "ol": "**K는 온도에만 의존.** ΔG° = ΔH° − TΔS°에 온도가 들어가서이고, 농도·압력·촉매는 K가 아니라 평형 위치만 옮긴다.", "forms": [{"a": "O", "s": "평형 상수는 온도에만 의존하고 농도·압력에는 무관하다."}, {"a": "X", "s": "평형 상수는 반응물의 처음 농도에 따라 달라진다."}]}, {"c": "GC-123", "m": "반응지수", "ol": "**Q<K 정반응·Q>K 역반응·Q=K 평형.** 반응은 Q가 K를 향해 가고, ΔG = RT ln(Q/K)라 이 비교가 곧 자발성이다.", "forms": [{"a": "O", "s": "반응지수 Q가 K보다 작으면 정반응이 우세하게 진행된다."}, {"a": "O", "s": "반응지수 Q가 K보다 크면 역반응이 우세하게 진행된다."}]}, {"c": "GC-126", "m": "압력 변화", "ol": "**압력↑ → 몰수 적은 쪽, 압력↓ → 많은 쪽**(K 불변). 일정 부피에서 비활성 기체를 넣으면 부분 압력이 그대로라 이동하지 않는다.", "forms": [{"a": "O", "s": "압력을 높이면(부피 감소) 기체 몰수가 적은 쪽으로 평형이 이동한다."}, {"a": "X", "s": "압력을 높이면 기체 몰수가 많은 쪽으로 평형이 이동한다."}]}, {"c": "GC-127", "m": "온도 변화", "ol": "**온도↑ → 흡열 방향.** 흡열 정반응(K↑), 발열 역반응(K↓).", "forms": [{"a": "X", "s": "발열 반응에서 온도를 높이면 정반응 쪽으로 이동하고 K가 증가한다."}, {"a": "O", "s": "흡열 반응에서 온도를 높이면 정반응 쪽으로 이동하고 K가 증가한다."}]}, {"c": "GC-129", "m": "비활성 기체", "ol": "**일정 부피 비활성 기체 → 이동 없음**(부분 압력·Q 불변). 일정 압력은 부피가 늘어 부분 압력이 변하므로 몰수 많은 쪽으로 이동한다.", "forms": [{"a": "O", "s": "일정 부피에서 비활성 기체를 넣어도 평형은 이동하지 않는다."}]}, {"c": "GC-131", "m": "용해도곱", "ol": "**Ksp = 난용성 염 용해 평형 상수.** 같은 형태면 클수록 잘 녹고 온도에만 의존하며, 형태가 다르면 몰 용해도로 비교한다.", "forms": [{"a": "O", "s": "용해도곱 Ksp는 난용성 염의 용해 평형 상수이다."}]}, {"c": "GC-132", "m": "공통 이온 효과", "ol": "**공통 이온 → 용해도↓(침전 쪽), Ksp 불변.** Q가 Ksp 위로 올라가 되돌리는 것이고, 완충(약산+짝염기)과 같은 Q-vs-K 원리다.", "forms": [{"a": "X", "s": "공통 이온 효과로 공통 이온을 넣으면 난용성 염의 용해도가 커진다."}, {"a": "O", "s": "공통 이온을 넣으면 난용성 염의 용해도가 작아진다."}]}, {"c": "GC-133", "m": "침전 조건", "ol": "**Q > Ksp 침전, Q = Ksp 포화, Q < Ksp 침전 없음.** 용해 평형의 Q와 K 비교이고, 공통 이온이 있으면 이온곱이 커져 침전이 잘 생긴다.", "forms": [{"a": "O", "s": "이온곱이 Ksp보다 크면 침전이 생긴다."}, {"a": "X", "s": "이온곱이 Ksp보다 작으면 침전이 생긴다."}]}, {"c": "GC-134", "m": "Ksp 식", "ol": "**Ksp = 이온 농도의 곱(계수 거듭제곱), 고체 제외.** AB₂ → [A][B]².", "forms": [{"a": "O", "s": "Ksp 식에서도 녹지 않은 순수한 고체는 포함하지 않는다."}]}, {"c": "GC-149", "m": "pKa", "ol": "**pKa = -log Ka, 작을수록 강산.** pH가 작을수록 산성인 것과 같은 구조이고, pKa는 반중화점의 pH다.", "forms": [{"a": "O", "s": "pKa = -log Ka이고, pKa가 작을수록 강한 산이다."}]}, {"c": "GC-154", "m": "염 가수분해", "ol": "**약한 쪽 짝이 가수분해.** NaCl 중성, CH₃COONa 염기성, NH₄Cl 산성.", "forms": [{"a": "X", "s": "약산과 강염기로 만든 염(CH₃COONa)의 수용액은 산성이다."}, {"a": "X", "s": "강산과 약염기로 만든 염(NH₄Cl)의 수용액은 염기성이다."}]}, {"c": "GC-167", "m": "염다리", "ol": "**염다리 = 이온 이동으로 전하 균형.** 전자는 도선 담당.", "forms": [{"a": "O", "s": "염다리는 이온 이동으로 두 반쪽 전지의 전하 균형을 유지한다."}]}, {"c": "GC-169", "m": "전지 전위", "ol": "**E°cell = E°(환원극) - E°(산화극)**, 양수면 자발적.", "forms": [{"a": "O", "s": "표준 전지 전위는 E°cell = E°(환원극) - E°(산화극)이다."}, {"a": "X", "s": "표준 전지 전위는 E°cell = E°(산화극) - E°(환원극)이다."}]}, {"c": "GC-171", "m": "표준 환원 전위", "ol": "**E° 크면 산화제 강함, E° 작으면 환원제 강함.** 환원되려는 경향의 척도라 환원제 세기와 반대로 읽고, 표 하나로 방향·세기를 다 안다.", "forms": [{"a": "O", "s": "표준 환원 전위가 클수록 환원이 잘 일어나고 산화제로서 강하다."}]}, {"c": "GC-172", "m": "자유 에너지와 전위", "ol": "**ΔG° = -nFE°**(nF=총 전하, ×E°=일, −는 계가 일을 내줌). ΔG°=−RT ln K와 합치면 E°=(RT/nF)ln K라, E°·ΔG°·K는 같은 사실의 세 언어다.", "forms": [{"a": "O", "s": "자유 에너지와 전위의 관계는 ΔG° = -nFE°이다."}, {"a": "X", "s": "자유 에너지와 전위의 관계는 ΔG° = +nFE°이다."}]}, {"c": "GC-173", "m": "네른스트 식", "ol": "**E = E° - (RT/nF) ln Q**, 평형에서 E = 0. ΔG = ΔG° + RT ln Q와 같은 식이고, 평형의 E=0이 K를 준다.", "forms": [{"a": "O", "s": "네른스트 식은 E = E° - (RT/nF) ln Q이다."}, {"a": "X", "s": "네른스트 식에서 평형에 도달하면 E는 최대가 된다."}, {"a": "O", "s": "네른스트 식에서 평형에 도달하면 전지 전위 E = 0이다."}]}, {"c": "GC-175", "m": "전기분해 전극", "ol": "**전기분해: (-)극 환원, (+)극 산화.** 환원은 늘 cathode.", "forms": [{"a": "O", "s": "전기분해에서 (-)극과 연결된 전극에서 환원이, (+)극에서 산화가 일어난다."}]}, {"c": "GC-176", "m": "패러데이 법칙", "ol": "**석출량 ∝ 전하량(Q = It).** 전하량을 F로 나눠 전자 몰수를 구하고, 반응식의 전자 수로 물질 몰수를 환산한다.", "forms": [{"a": "O", "s": "패러데이 법칙에 따르면 석출량은 흘려준 전하량에 비례한다."}]}, {"c": "GC-177", "m": "패러데이 상수", "ol": "**Q = It, 1 F ≈ 96500 C = 전자 1몰.**", "forms": [{"a": "O", "s": "전하량은 전류와 시간의 곱(Q = It)이고, 1 패러데이는 약 96500 C이다."}]}, {"c": "GC-178", "m": "패러데이 계산", "ol": "**석출 몰수 = 전자 몰수 / 전하수.** 같은 전하량이면 +1가가 +2가의 2배.", "forms": [{"a": "O", "s": "같은 전하량이면 +1가 이온이 +2가 이온보다 두 배의 몰수가 석출된다."}]}, {"c": "GC-182", "m": "반응 차수", "ol": "**차수 = 농도 지수(실험 결정).** 계수와 다를 수 있고 분수도 가능.", "forms": [{"a": "O", "s": "반응 차수는 속도식에서 농도의 지수이며 실험으로 결정한다."}]}, {"c": "GC-184", "m": "속도 상수", "ol": "**k는 온도·촉매에 의존, 농도와 무관.**", "forms": [{"a": "O", "s": "속도 상수 k는 온도에 의존하고 농도와는 무관하다."}, {"a": "X", "s": "속도 상수 k는 반응물의 농도가 커지면 함께 커진다."}]}, {"c": "GC-185", "m": "0차 반응", "ol": "**0차: v = k(농도 무관), [A]-t 직선.**", "forms": [{"a": "X", "s": "0차 반응의 속도는 반응물 농도에 비례한다."}, {"a": "O", "s": "0차 반응의 반감기는 초기 농도에 비례한다."}]}, {"c": "GC-186", "m": "1차 반응", "ol": "**1차: v = k[A], ln[A]-t 직선, 반감기 일정.**", "forms": [{"a": "O", "s": "1차 반응의 속도는 반응물 농도에 비례한다."}]}, {"c": "GC-187", "m": "2차 반응", "ol": "**2차: v = k[A]², 1/[A]-t 직선, 반감기 초기 농도에 반비례.**", "forms": [{"a": "O", "s": "2차 반응의 속도는 반응물 농도의 제곱에 비례한다."}, {"a": "O", "s": "2차 반응의 반감기는 초기 농도에 반비례한다."}]}, {"c": "GC-188", "m": "적분 속도식", "ol": "**0차 [A]·1차 ln[A]·2차 1/[A]가 t에 대해 직선.**", "forms": [{"a": "O", "s": "1차 반응에서 ln[A]와 시간 t의 그래프는 직선이다."}, {"a": "O", "s": "0차 반응에서 [A]와 시간 t의 그래프는 직선이다."}, {"a": "X", "s": "2차 반응에서 [A]와 시간 t의 그래프가 직선이다."}]}, {"c": "GC-189", "m": "반감기", "ol": "**1차 반감기만 농도 무관(일정).** 1차는 개별 확률이 일정해서(방사성 붕괴), 0차는 비례, 2차는 반비례. 반감기 거동이 차수를 진단한다.", "forms": [{"a": "O", "s": "1차 반응의 반감기는 t½ = ln2/k로 초기 농도와 무관하게 일정하다."}, {"a": "X", "s": "1차 반응의 반감기는 초기 농도에 비례해 커진다."}, {"a": "X", "s": "모든 반응의 반감기는 초기 농도와 무관하게 일정하다."}]}, {"c": "GC-192", "m": "아레니우스", "ol": "**k = A·e^(−Ea/RT).** 지수항은 Ea를 넘는 분자의 볼츠만 비율이라 온도가 오르면 지수적으로 커지고, ln k vs 1/T 기울기(−Ea/R)로 Ea를 잰다.", "forms": [{"a": "X", "s": "아레니우스 식에서 활성화 에너지가 클수록 같은 온도에서 k가 크다."}]}, {"c": "GC-193", "m": "빈도 인자", "ol": "**A = 충돌 빈도 + 배향 인자.** Ea(장벽)와 별개로 유효 충돌의 충돌·방향 조건을 담는다.", "forms": [{"a": "O", "s": "빈도 인자 A는 충돌 빈도와 방향(배향) 인자를 반영한다."}]}, {"c": "GC-194", "m": "온도와 충돌", "ol": "**온도↑ → 장벽 넘는 분자 비율↑**(Ea는 불변). 에너지 분포가 높은 쪽으로 옮겨 문턱을 넘는 비율이 급증하는 것이 주된 효과다.", "forms": [{"a": "O", "s": "온도가 높을수록 활성화 에너지를 넘는 분자의 비율이 커진다."}]}, {"c": "GC-195", "m": "메커니즘", "ol": "**단일 단계만 계수로 속도식.** 여러 단계는 메커니즘에서 유도.", "forms": [{"a": "O", "s": "단일 단계(소반응) 반응에서는 속도식을 그 반응식 계수로부터 바로 쓸 수 있다."}]}, {"c": "GC-196", "m": "속도 결정 단계", "ol": "**전체 속도 = 가장 느린 단계(병목)가 결정.** 빠른 단계는 앞지르지 못하고, 차수가 계수와 다른 것은 차수가 이 단계를 반영하기 때문이다.", "forms": [{"a": "X", "s": "여러 단계 반응의 전체 속도는 가장 빠른 단계가 결정한다."}]}, {"c": "GC-197", "m": "중간체", "ol": "**중간체 = 생성됐다 소비됨.** 전체 반응식에 안 나타남.", "forms": [{"a": "O", "s": "반응 중간체는 한 단계에서 생성되었다가 이후 단계에서 소비된다."}, {"a": "X", "s": "반응 중간체는 최종 생성물로 남는다."}]}, {"c": "GC-201", "m": "중심 금속", "ol": "**중심 금속 = 전이 금속, 루이스 산**(전자쌍 받음).", "forms": [{"a": "O", "s": "중심 금속 이온은 주로 전이 금속이며 전자쌍을 받는 루이스 산으로 작용한다."}]}, {"c": "GC-202", "m": "리간드", "ol": "**리간드 = 전자쌍 주는 루이스 염기.**", "forms": [{"a": "O", "s": "리간드는 비공유 전자쌍을 제공하는 루이스 염기이다."}, {"a": "X", "s": "리간드는 중심 금속에서 전자쌍을 받는 루이스 산이다."}]}, {"c": "GC-203", "m": "배위 결합", "ol": "**배위 결합 = 리간드가 전자쌍을 통째로 제공.**", "forms": [{"a": "X", "s": "배위 결합은 금속과 리간드가 전자를 하나씩 내어 만드는 결합이다."}]}, {"c": "GC-204", "m": "배위수", "ol": "**배위수 = 주개 원자 수**(흔히 4·6). 분자 수와 다를 수 있음.", "forms": [{"a": "O", "s": "배위수는 중심 금속에 직접 결합한 주개 원자의 수이다."}, {"a": "X", "s": "착물에서 흔한 배위수는 3과 5이다."}]}, {"c": "GC-205", "m": "한자리 리간드", "ol": "**한자리 = 주개 원자 1개**(물·암모니아·Cl⁻).", "forms": [{"a": "O", "s": "한자리 리간드는 하나의 주개 원자로 금속에 결합한다."}]}, {"c": "GC-206", "m": "여러자리 리간드", "ol": "**여러자리 = 주개 원자 2개 이상**(en 2, EDTA 6).", "forms": [{"a": "O", "s": "여러자리(킬레이트) 리간드는 두 개 이상의 주개 원자로 금속에 결합한다."}]}, {"c": "GC-207", "m": "킬레이트 효과", "ol": "**킬레이트 착물이 더 안정**(여러 점 결합 + 엔트로피↑). 여러자리 리간드가 한자리 여럿을 풀어 ΔS>0, ΔG=ΔH−TΔS에서 −TΔS가 안정성을 만든다.", "forms": [{"a": "X", "s": "여러자리 리간드로 만든 킬레이트 착물은 같은 종류의 한자리 리간드 착물보다 불안정하다."}]}, {"c": "GC-208", "m": "이성질체", "ol": "**착물에도 구조·입체 이성질체 존재.**", "forms": [{"a": "O", "s": "배위 착물에도 구조 이성질체와 입체 이성질체가 존재한다."}]}, {"c": "GC-209", "m": "기하 이성질체", "ol": "**cis = 인접, trans = 반대편.** 배열만 다름.", "forms": [{"a": "O", "s": "기하 이성질체에는 cis(시스)와 trans(트랜스)가 있다."}]}, {"c": "GC-210", "m": "광학 이성질체", "ol": "**광학 이성질체 = 거울상, 포개지지 않음.** 배열만 다름.", "forms": [{"a": "X", "s": "광학 이성질체는 서로 완전히 똑같이 포개지는 관계이다."}, {"a": "X", "s": "광학 이성질체는 분자식과 결합 방식이 모두 달라서 생긴다."}]}, {"c": "GC-211", "m": "평면 사각", "ol": "**평면 사각(배위수 4)은 cis-trans 가짐**(Pt(II) 등).", "forms": [{"a": "O", "s": "평면 사각 착물은 cis-trans 기하 이성질체를 가질 수 있다."}]}, {"c": "GC-212", "m": "팔면체", "ol": "**팔면체 = 여섯 리간드(배위수 6).** cis-trans·fac-mer 가짐.", "forms": [{"a": "O", "s": "팔면체 착물은 cis-trans나 fac-mer 같은 이성질체를 가질 수 있다."}]}, {"c": "GC-213", "m": "결정장 이론", "ol": "**결정장 이론 = 리간드가 정전기적 반발로 d 오비탈을 분리.**", "forms": [{"a": "O", "s": "결정장 이론은 리간드가 중심 금속의 d 오비탈 에너지를 분리시킨다고 본다."}]}, {"c": "GC-214", "m": "d 오비탈 분리", "ol": "**팔면체: 낮은 셋 + 높은 둘**(리간드 향한 오비탈이 정면 반발로 높음). 사면체는 분리가 뒤집히고 더 작다.", "forms": [{"a": "O", "s": "팔면체 장에서 d 오비탈은 에너지가 다른 두 무리로 갈라진다."}, {"a": "X", "s": "팔면체 장에서 모든 d 오비탈의 에너지는 똑같이 유지된다."}]}, {"c": "GC-215", "m": "분리 에너지", "ol": "**Δ = 두 d 오비탈 무리의 에너지 차이.** 리간드에 따라 변함.", "forms": [{"a": "O", "s": "d 오비탈 분리 에너지를 결정장 분리 에너지 Δ로 나타낸다."}]}, {"c": "GC-216", "m": "강한 장", "ol": "**강한 장 → Δ 큼.** 약한 장 → Δ 작음.", "forms": [{"a": "X", "s": "강한 장 리간드는 분리 에너지 Δ를 작게 만든다."}]}, {"c": "GC-217", "m": "저스핀", "ol": "**Δ > 짝지음 E → 저스핀**(홀전자 적음).", "forms": [{"a": "O", "s": "분리 에너지 Δ가 짝지음 에너지보다 크면 저스핀 배치가 된다."}]}, {"c": "GC-218", "m": "고스핀", "ol": "**Δ < 짝지음 E → 고스핀**(홀전자 많음). 올라가는 비용 Δ와 짝짓는 비용 P 중 싼 쪽을 고르는, 훈트 규칙의 확장이다.", "forms": [{"a": "O", "s": "분리 에너지 Δ가 짝지음 에너지보다 작으면 고스핀 배치가 된다."}]}, {"c": "GC-219", "m": "강한 장과 스핀", "ol": "**강한 장 → 저스핀, 약한 장 → 고스핀.**", /* ── 복습 칩 → 개념 강의 (2026-09-11) ──────────────────────────────
   결과 화면의 「복습하면 좋을 개념」 은 이름뿐이었다 — 어디서 다시 보는지가
   없었다. 성적표(report.html)는 concept-lecture-dt.json 의 map[mis] 로 강의를
   건다. 여기서도 같은 표를 읽어 같은 규칙으로 건다(byUnit 은 이 화면에 단원이
   없어 안 쓴다). 표가 안 오면(망·주소) 지금처럼 이름만 보인다 — 화면은 그대로다.
   표는 도전을 시작할 때 한 번만 읽는다(64KB — 들어오자마자 읽을 까닭이 없다). */
var LEC_BASE='https://chemistreal.github.io/exam/';
var LEC=null, LEC_ASKED=false;
function loadLec(){
  if(LEC_ASKED || typeof fetch!=='function') return;
  LEC_ASKED=true;
  fetch('concept-lecture-dt.json').then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(!d||!d.map||!d.lectures) return; LEC=d; if(S.view==='result') render(); })
    .catch(function(){});
}
function lecFor(mis){
  if(!LEC||!mis) return '';
  var id=LEC.map[mis], l=id&&LEC.lectures[id];
  return (l&&l.file) ? (LEC.base||LEC_BASE)+l.file : '';
}
function chipHTML(m){
  var h=lecFor(m);
  return h ? '<a class="mchip lec" href="'+esc(h)+'" target="_blank" rel="noopener">'+esc(m)+'<small>▶ 강의</small></a>'
           : '<span class="mchip">'+esc(m)+'</span>';
}

/* ── 결과 복사 (2026-09-11) ─────────────────────────────────────────
   푼 결과는 어디에도 안 남는다 — 이 화면을 닫으면 사라진다(저장할지는 선생님이
   정할 일). 그래서 학생이 한 줄로 들고 갈 수 있게 평문을 만든다. 이름은 안
   넣는다. 복사 방식은 pending.html 의 복사 단추와 같은 길이다(클립보드가 안 되면
   옛 방식, 그것도 안 되면 창에 띄워 손으로 복사한다). 옛 방식의 임시 칸은 어떻게
   끝나든 지운다 — 이 점만 pending 과 다르다(2026-09-11 검토에서 잡음). */
function resultText(){
  var course=curCourse(), round=curRound(), correct=0, wrong=[];
  S.qs.forEach(function(q,i){ if(S.ans[i]===q.a) correct++; else if(wrong.indexOf(q.m)<0) wrong.push(q.m); });
  var parts=['심화 도전'];
  if(COURSE_NAME[course]) parts.push(COURSE_NAME[course]+(round?' '+round+'회 범위':''));
  parts.push(S.qs.length+'문항 중 '+correct+' 맞음');
  parts.push('다시 볼 개념: '+(wrong.length?wrong.join(', '):'없음'));
  return parts.join(' · ');
}
function copyResult(btn){
  var msg=resultText(); if(!msg) return;
  var orig=btn.getAttribute('data-orig')||btn.textContent;
  var done=function(){ btn.textContent='복사됨 ✓'; btn.classList.add('copied');
    setTimeout(function(){ btn.textContent=orig; btn.classList.remove('copied'); }, 1800); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(msg).then(done).catch(fallback); }
  else fallback();
  /* 임시 textarea 칸은 execCommand 가 던져도 지운다(안 지우면 보이지 않는 칸이 body 에 남는다).
     execCommand 가 false 를 돌려주면 복사된 것이 아니므로 「복사됨」 이라 하지 않고 창에 띄운다. */
  function fallback(){ var ta=document.createElement('textarea'), ok=false; ta.value=msg; ta.style.position='fixed'; ta.style.opacity='0';
    try{ document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy')===true; }catch(e){ ok=false; }
    if(ta.parentNode) ta.parentNode.removeChild(ta);
    if(ok) done(); else prompt('결과 복사', msg); }
}

/* ── 안 배운 것은 내지 않는다 (선생님 2026-08-15) ──────────────────
   여태 이 화면은 **과목 접두만** 보고 뽑았다. 회차를 아예 안 봤다.
   그래서 화학Ⅰ 1회를 막 통과한 학생이 「심화 도전」을 누르면 후보 54개념
   중 44개(81%)가 18회까지 가야 배우는 것이었다 — 12문항 중 평균 열 개
   가까이가 안 배운 문제였다. 화학Ⅱ 1회 41%, 일반화학 1회 17%.

   심화는 «어려운 것» 이지 «안 배운 것» 이 아니다. 안 배운 것을 틀리게 하는
   건 도전이 아니라 그냥 모르는 것을 확인시키는 일이다.

   시험이 누적이므로 r회까지 배운 것 = 처음 등장한 회차가 r 이하인 개념이다.
   선수 과목(화학Ⅱ 학생에게 화학Ⅰ)은 이미 마쳤으므로 회차와 무관하게 낸다. */
function curCourse(){
  var c=(new URLSearchParams(location.search).get('course')||'').toLowerCase();
  return PRECOURSE[c]?c:'';               // 모르는 과목은 «없다» 로 본다
}
/* 없는 회차를 «있다» 고 적지 않는다. 주소에 round=999 가 오면 여태
   「999회까지 배운 범위」 라고 화면에 적었다 — 그런 회차는 없다. */
function curRound(){
  var r=parseInt(new URLSearchParams(location.search).get('round'),10);
  if(!(r>0)) return null;
  var last=COURSE_LAST[curCourse()]||0;
  return (last && r>last) ? last : r;
}
/* 이 회차까지 낼 수 있는 개념. round 가 없으면 아무것도 안 고른다 —
   모르면서 «다 배웠다» 고 치는 것이 지금까지의 잘못이었다. */
function poolFor(course, round){
  var prefixes=PRECOURSE[course]||[], own=prefixes[0], pool=[];
  prefixes.forEach(function(p){ (CHALLENGE_BANK[p]||[]).forEach(function(cid){
    if(!cid.forms || !cid.forms.length) return;
    if(p===own){                                  // 지금 듣는 과목만 회차로 자른다
      var first=CHALLENGE_ROUND[cid.c];
      if(first==null || round==null || first>round) return;
    }
    var f=cid.forms[Math.floor(Math.random()*cid.forms.length)];
    pool.push({c:cid.c, m:cid.m, ol:cid.ol, a:f.a, s:f.s});
  }); });
  return pool;
}
function pickQuestions(){
  var pool=poolFor(curCourse(), curRound());
  // 개념 중복 없이 섞어서 최대 12개. 모자라면 **모자란 채로** 낸다.
  shuffle(pool);
  var seen={}, out=[];
  for(var i=0;i<pool.length && out.length<12;i++){ if(!seen[pool[i].c]){ seen[pool[i].c]=1; out.push(pool[i]); } }
  return out;
}
/* 과목조차 모르면 회차를 물어봐야 소용이 없다. 여태는 그럴 때 화학Ⅰ 회차를
   보여 줬는데, 눌러도 과목이 그대로라 **같은 화면이 다시 떴다**(무한 반복).
   모르면 모른다고 하고 먼저 과목을 묻는다. */
var COURSE_NAME={ch1:'화학Ⅰ', ch2:'화학Ⅱ', gc:'일반화학'};
function coursePickHTML(){
  var b=Object.keys(PRECOURSE).map(function(c){
    return '<button class="rpick" onclick="goCourse(\''+c+'\')">'+COURSE_NAME[c]+'</button>'; }).join('');
  return '<div class="card intro"><span class="badgeA">A밴드 · 심화</span>'
    +'<h1>어느 과목인가요?</h1>'
    +'<p class="lede">배운 데까지만 냅니다. 먼저 과목을 골라 주세요.</p>'
    +'<div class="rpicks">'+b+'</div></div>';
}
function goCourse(c){
  var sp=new URLSearchParams(location.search);
  sp.set('course', c); sp.delete('round');   // 과목이 바뀌면 회차는 뜻이 없다
  location.search=sp.toString();
}
/* 옛 링크에는 회차가 없다(이미 학생들에게 나갔다). 그때는 지어내지 않고
   묻는다 — 한 번 누르면 되고, 안 배운 문제는 안 나온다. */
function roundPickHTML(course){
  var last=COURSE_LAST[course]||0, n=[];
  for(var r=1;r<=last;r++) n.push('<button class="rpick" onclick="goRound('+r+')">'+r+'회</button>');
  return '<div class="card intro"><span class="badgeA">A밴드 · 심화</span>'
    +'<h1>어디까지 배웠나요?</h1>'
    +'<p class="lede">배운 데까지만 냅니다. 아직 안 배운 단원은 나오지 않아요. '
    +'가장 최근에 <b>본 시험 회차</b>를 눌러 주세요.</p>'
    +'<div class="rpicks">'+n.join('')+'</div></div>';
}
function goRound(r){
  var sp=new URLSearchParams(location.search); sp.set('round', r);
  location.search=sp.toString();
}

function start(){ loadLec(); S.qs=pickQuestions(); S.ans=S.qs.map(function(){return null;}); S.graded=false; S.view='quiz'; render(); window.scrollTo(0,0); }
function retryWrong(){ var w=S.qs.filter(function(q,i){return S.ans[i]!==q.a;}); if(!w.length){start();return;} shuffle(w); S.qs=w; S.ans=w.map(function(){return null;}); S.graded=false; S.view='quiz'; render(); window.scrollTo(0,0); }
function answer(i,v){ if(S.graded) return; S.ans[i]=v; render(); }
function allAnswered(){ return S.ans.every(function(a){return a!=null;}); }
function submit(){ S.graded=true; S.view='result'; render(); window.scrollTo(0,0); }

function render(){
  var h='';
  if(S.view==='intro'){
    var course=curCourse(), round=curRound();
    if(!course) { $('#app').innerHTML=coursePickHTML(); return; }
    if(!round)  { $('#app').innerHTML=roundPickHTML(course); return; }
    var n=poolFor(course, round).filter(function(q,i,a){
      return a.findIndex(function(x){return x.c===q.c;})===i; }).length;
    var many=Math.min(n,12);
    h='<div class="card intro"><span class="badgeA">A밴드 · 심화</span>'
      +'<h1>한 단계 위 문제에 도전</h1>'
      +'<p class="lede">평소보다 까다로운 심화 문항 '+many+'개입니다. 틀려도 괜찮아요. 어디까지 닿는지 확인하고, 막힌 곳은 새로 배우는 기회로 삼으면 됩니다.</p>'
      /* 「배운 데까지만」 을 화면에 적는다. 적어 두면 학생이 «안 배운 게 나왔다»
         고 느낄 때 그것이 진짜인지 아닌지 서로 확인할 수 있다. */
      +'<p class="scope"><b>'+round+'회까지 배운 범위</b>에서만 냅니다. 아직 안 배운 단원은 나오지 않아요.</p>'
      +(n<12 ? '<p class="scope thin">지금 회차까지 배운 심화 개념이 '+n+'개라 '+many+'문항입니다. '
             + '회차가 쌓이면 문항도 늘어납니다.</p>' : '')
      +(n===0 ? '<p class="scope thin">아직 심화로 낼 만한 개념이 없습니다. 다음 회차에 다시 오세요.</p>'
              : '<div style="margin-top:16px"><button class="btn" onclick="start()">도전 시작</button></div>')
      +'</div>';
  } else if(S.view==='quiz'){
    var done=S.ans.filter(function(a){return a!=null;}).length;
    var pct=Math.round(100*done/S.qs.length);
    h='<div class="card"><h2>심화 도전 · '+S.qs.length+'문항</h2>'
      +'<div class="prog"><div class="pbar"><i style="width:'+pct+'%"></i></div><span class="pt">'+done+'/'+S.qs.length+'</span></div>'
      +S.qs.map(function(q,i){return '<div class="q"><div class="qn">Q'+(i+1)+'</div><div class="qs">'+esc(q.s)+'</div>'
        +'<div class="ox"><button class="o '+(S.ans[i]==='O'?'sel':'')+'" onclick="answer('+i+',\'O\')">O</button>'
        +'<button class="x '+(S.ans[i]==='X'?'sel':'')+'" onclick="answer('+i+',\'X\')">X</button></div></div>';}).join('')
      +'<div style="margin-top:16px"><button class="btn" '+(allAnswered()?'':'disabled')+' onclick="submit()">'+(allAnswered()?'채점하기':'모든 문항에 답하면 채점')+'</button></div></div>';
  } else if(S.view==='result'){
    var correct=0, wrongMis=[]; S.qs.forEach(function(q,i){ if(S.ans[i]===q.a){correct++;} else if(wrongMis.indexOf(q.m)<0){wrongMis.push(q.m);} });
    var nWrong=S.qs.length-correct;
    var pct=Math.round(100*correct/S.qs.length);
    var msg = pct>=80?'대단합니다. 심화 문제도 탄탄하게 잡고 있어요.'
            : pct>=50?'잘하고 있어요. 심화에서도 절반 이상을 맞혔습니다.'
            : '여기까지 도전한 것만으로 충분합니다. 틀린 문항은 새로 배우는 기회예요.';
    h='<div class="card result"><span class="badgeA">A밴드 · 결과</span>'
      +'<div class="score">'+correct+' / '+S.qs.length+'</div>'
      +'<div class="smsg">'+msg+'</div><div class="snote">정답률 '+pct+'%</div>'
      +'<button class="copybtn" data-orig="결과 복사" onclick="copyResult(this)">결과 복사</button></div>';
    if(wrongMis.length){
      h+='<div class="card reviewbox"><h2>복습하면 좋을 개념</h2>'
        +'<p class="lede" style="margin:-2px 0 10px">아래 개념을 한 번 더 짚으면 다음엔 더 멀리 갑니다.'
        +(wrongMis.some(function(m){return !!lecFor(m);}) ? ' 「▶ 강의」 가 붙은 개념은 누르면 개념 강의가 새 창으로 열립니다.' : '')+'</p>'
        +'<div class="mchips">'+wrongMis.map(chipHTML).join('')+'</div></div>';
    }
    /* 문장·개념 이름·해설은 은행(JSON)에서 오는 글자 그대로다 — innerHTML 에 날로 넣으면
       「Q<K 정반응·Q>K 역반응」 의 <K …> 가 태그로 먹혀 『QK 역반응』 이 된다(GC-123,
       2026-09-11 은행을 다시 만들며 생김). 복습 칩과 같이 esc() 로 감싼다. */
    h+='<div class="card"><h2>문항별 확인</h2>'
      +S.qs.map(function(q,i){var ok=S.ans[i]===q.a;
        return '<div class="q"><div class="qn">Q'+(i+1)+' · '+(ok?'정답':'오답')+'<span class="qmis">'+esc(q.m)+'</span></div><div class="qs">'+esc(q.s)+'</div>'
          +'<div class="fb '+(ok?'ok':'no')+'"><span class="cor">정답: '+q.a+'</span>'+(q.ol?' · '+esc(q.ol.replace(/\*\*(.+?)\*\*/g,'$1')):'')+'</div></div>';}).join('')
      +'</div>'
      +(nWrong?'<button class="btn" onclick="retryWrong()">틀린 '+nWrong+'문항만 다시 풀기</button>':'')
      +'<button class="ghost" onclick="start()">새 문항으로 다시 도전</button>';
  }
  $('#app').innerHTML=h;
}
render();
</script></body></html>

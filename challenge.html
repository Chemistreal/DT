<style>
:root{--paper:#FAFAF7;--surface:#FFFFFF;--ink:#16202E;--sub:#5F6D7C;--faint:#626D7B;--line:#E7E8E2;--line2:#EEF0EA;
  --teal:#0B6E6E;--teal-d:#0A5A5A;--teal-soft:#E4F0EF;--teal-line:#BFE0DD;--o:#1B8A4C;--o-bg:#E7F5EC;--x:#C0392B;--x-bg:#FBEBE9;
  --brass:#A9853C;--brass-soft:#F5EEDF;--shadow:0 1px 2px rgba(16,32,46,.04),0 6px 20px rgba(16,32,46,.05);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:680px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:11px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brass),#caa45a);flex:none}
.dawon-logo{height:28px;width:auto;display:block;flex:none}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em}.brand small{display:block;font-size:11.5px;color:var(--sub);font-weight:600;letter-spacing:0}
.wrap{max-width:680px;margin:0 auto;padding:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h1{font-size:21px;letter-spacing:-.02em;margin-bottom:8px}h2{font-size:15px;margin-bottom:6px}
.lede{font-size:13.5px;color:var(--sub)}
/* 「배운 데까지만 낸다」 를 화면에 적는 자리. 적어 두어야 학생이 이상하다고
   느낄 때 그것이 진짜인지 서로 확인할 수 있다. */
.scope{font-size:12.5px;color:var(--sub);background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;margin:10px 0 0;line-height:1.6}
.scope.thin{color:var(--brass);border-color:var(--brass);background:rgba(176,124,44,.06)}
/* 옛 링크(회차 없음)로 들어왔을 때 고르는 자리. 손가락으로 눌러야 한다. */
.rpicks{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.rpick{min-width:56px;min-height:44px;padding:11px 13px;font-size:14px;font-weight:700;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px}
.rpick:hover{border-color:var(--teal);color:var(--teal)}
.intro{border-left:4px solid var(--brass);background:linear-gradient(180deg,#FAF6EF,var(--surface))}
.badgeA{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;color:#fff;background:var(--brass);padding:4px 11px;border-radius:20px;margin-bottom:10px}
button{font-family:inherit;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:.15s}
.btn{width:100%;padding:14px;font-size:15px;background:var(--teal);color:#fff}.btn:hover{background:var(--teal-d)}
.btn:disabled{background:var(--line);color:var(--faint);cursor:not-allowed}
.q{padding:15px 0;border-bottom:1px solid var(--line2)}.q:last-child{border-bottom:0}
.qn{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;color:var(--brass);margin-bottom:6px}
.qs{font-size:14.5px;margin-bottom:11px;line-height:1.5}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:260px}
.ox button{padding:11px 0;font-size:17px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.ox button.o.sel{background:var(--o-bg);color:var(--o);border-color:var(--o)}
.ox button.x.sel{background:var(--x-bg);color:var(--x);border-color:var(--x)}
.fb{margin-top:10px;font-size:13px;border-radius:9px;padding:10px 12px;line-height:1.5}
.fb.ok{background:var(--o-bg);color:#15703D}.fb.no{background:var(--x-bg);color:#8E2F22}
.fb .cor{font-weight:800}
.result{text-align:center}.score{font-family:'JetBrains Mono',monospace;font-size:46px;font-weight:800;color:var(--teal)}
.smsg{font-size:14px;color:var(--ink);margin:8px 0 4px}.snote{font-size:12.5px;color:var(--sub)}
.prog{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.pbar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--brass);border-radius:6px;transition:width .3s}
.pt{font-size:12px;font-weight:700;color:var(--brass);white-space:nowrap}
.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:600;width:100%;padding:12px;font-size:14px;margin-top:10px}
.ghost:hover{border-color:var(--teal);color:var(--teal)}
.muted{color:var(--faint);font-size:12px}
.reviewbox{border-left:4px solid var(--brass)}
.mchips{display:flex;flex-wrap:wrap;gap:7px}
.mchip{font-size:12.5px;background:var(--brass-soft);color:#7A5E20;border-radius:20px;padding:5px 12px;font-weight:600}
.qmis{float:right;font-family:'Pretendard',sans-serif;font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:0}
.result + .card .btn,.card + .btn{margin-top:0}
.btn + .ghost{margin-top:9px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

html{color-scheme:light;-webkit-text-size-adjust:100%}

  header .logo{letter-spacing:.16em;font-weight:700}
}</style>

const CHALLENGE_BANK={"CH1": [{"c": "CH1-002", "m": "분자 종류", "ol": "**분자 원자 수 = 첨자의 합**(H₂O 3, CH₄ 5, O₂ 2). 분자식은 개수의 설명서라, 정확히 세는 것이 모든 계산의 출발점이다.", "forms": [{"a": "O", "s": "He은 일원자분자이다."}, {"a": "O", "s": "CO₂는 삼원자분자이다."}, {"a": "X", "s": "HCl은 일원자분자이다."}, {"a": "X", "s": "O₂는 삼원자분자이다."}]}, {"c": "CH1-013", "m": "루이스 전자점식", "ol": "**점 = 원자가 전자만**(O 6점, He 2점). 결합에 쓰이는 전자라 안쪽은 빼고, 이 점이 결합·모양·옥텟 분석의 출발점이다.", "forms": [{"a": "O", "s": "루이스 전자점식은 원자가 전자를 점으로 나타낸 식이다."}, {"a": "O", "s": "루이스 전자점식에서는 원소 기호 둘레에 원자가 전자를 점으로 표시한다."}, {"a": "X", "s": "산소(O) 원자의 루이스 전자점식에는 점이 8개 찍힌다."}, {"a": "X", "s": "루이스 전자점식에서는 안쪽 껍질 전자까지 모두 점으로 표시한다."}]}, {"c": "CH1-018", "m": "결합 기초", "ol": "**금속+비금속 이온, 비금속끼리 공유, 금속끼리 금속결합.** 전기음성도 차이로 전자를 넘기느냐·나누느냐·풀어놓느냐가 갈리고, 이것이 성질을 정한다.", "forms": [{"a": "O", "s": "금속과 비금속이 결합하면 이온결합이 형성된다."}, {"a": "O", "s": "비금속끼리 결합하면 공유결합이 형성된다."}, {"a": "X", "s": "같은 금속끼리 결합하면 공유결합이 형성된다."}, {"a": "X", "s": "산소 분자(O₂)의 결합은 이온결합이다."}]}, {"c": "CH1-021", "m": "물질 분류 판정", "ol": "**순물질(홑원소물질·화합물) vs 혼합물.** 조성이 일정하면 순물질, 한 원소면 홑원소물질(O₂), 결합하면 화합물, 섞였으면 혼합물(공기)이다.", "forms": [{"a": "O", "s": "NaCl은 화합물이다."}, {"a": "O", "s": "H₂O는 화합물이다."}, {"a": "X", "s": "산소(O₂)는 화합물이다."}, {"a": "X", "s": "다이아몬드는 화합물이다."}]}, {"c": "CH1-024", "m": "분자 판정", "ol": "**이온결합 물질(NaCl)은 분자 아님**(연속 격자, 실험식). 분자는 공유결합으로 묶인 독립 입자라, 금속·공유결정도 분자가 아니다.", "forms": [{"a": "O", "s": "이산화 탄소(CO₂)는 분자이다."}, {"a": "O", "s": "물(H₂O)은 분자이다."}, {"a": "X", "s": "CaO는 분자이다."}, {"a": "X", "s": "KCl은 분자이다."}]}, {"c": "CH1-027", "m": "금속 반응성·사용시기", "ol": "**반응성 작을수록 먼저 사용**(산화물 덜 안정, 환원 쉬움). 금·은은 자연 상태, 구리·철은 숯 환원, 알루미늄은 전기분해를 기다렸다.", "forms": [{"a": "O", "s": "반응성이 큰 금속일수록 제련이 어려워 늦게 사용되었다."}, {"a": "O", "s": "청동기 시대가 철기 시대보다 앞선다."}, {"a": "X", "s": "금속의 사용 시기는 반응성이 클수록 빨랐다."}, {"a": "X", "s": "반응성이 큰 알루미늄은 가장 먼저 사용되었다."}]}, {"c": "CH1-029", "m": "지각 구성원소", "ol": "**지각 질량비 1위 = 산소(약 46%)**, 2위 규소. 광물에 산소가 많이 결합해서이고, 우주·인체와는 분포가 다르다.", "forms": [{"a": "O", "s": "지각을 구성하는 원소 중 질량비가 가장 큰 것은 산소이다."}, {"a": "O", "s": "지각에서 가장 많은 원소는 산소이다."}, {"a": "X", "s": "지각 구성원소의 질량비 순서는 규소 > 산소 > 알루미늄 > 철이다."}, {"a": "X", "s": "지각에서 두 번째로 많은 원소는 알루미늄이다."}]}, {"c": "CH1-030", "m": "인체 구성원소", "ol": "**인체 질량비 1위 산소, 개수비 1위 수소.** 물에 수소가 2개라 개수는 많지만 가벼워, 질량은 무거운 산소가 1위다.", "forms": [{"a": "O", "s": "사람의 몸을 구성하는 원소 중 질량비가 가장 큰 것은 산소이다."}, {"a": "O", "s": "인체를 질량비로 보면 산소가 가장 많다."}, {"a": "X", "s": "사람의 몸을 구성하는 원소 중 개수비가 가장 큰 것은 산소이다."}, {"a": "X", "s": "인체에서 개수비로 가장 많은 원소는 산소이다."}]}, {"c": "CH1-032", "m": "질소 안정성", "ol": "**N₂는 삼중결합으로 안정(반응성 작음).** 약 945 kJ/mol의 강한 결합이라 활성화 에너지가 높아 느리고, 쓰려면 질소 고정이 필요하다.", "forms": [{"a": "O", "s": "질소 기체(N₂)는 매우 안정하여 사람이 호흡으로 직접 이용할 수 없다."}, {"a": "O", "s": "N₂는 삼중결합을 가져 반응성이 작다."}, {"a": "X", "s": "질소 기체(N₂)는 반응성이 커서 쉽게 반응한다."}, {"a": "X", "s": "N₂는 반응성이 커서 쉽게 반응한다."}]}, {"c": "CH1-033", "m": "하버보슈", "ol": "**하버보슈: N₂ + 3H₂ ⇌ 2NH₃(고압·중온·촉매).** 고압은 수율, 중온은 수율과 속도의 타협, 촉매는 속도를 위한 것으로, 평형·속도·촉매가 한데 모인다.", "forms": [{"a": "O", "s": "하버보슈법에 의한 암모니아 합성은 식량 부족 문제 개선에 기여하였다."}, {"a": "O", "s": "하버보슈법은 질소와 수소로 암모니아를 합성한다."}, {"a": "X", "s": "암모니아(NH₃)는 산소와 수소로 이루어진 화합물이다."}, {"a": "X", "s": "하버보슈법은 산소와 수소로 암모니아를 합성한다."}]}, {"c": "CH1-039", "m": "몰 정의", "ol": "**1몰 = 6.02 × 10²³개**(종류 무관). 원자 세계와 저울 세계를 잇는 다리라, 1몰의 질량이 분자량과 같은 수가 된다.", "forms": [{"a": "O", "s": "1몰은 6.02 × 10²³개의 입자 수이다."}, {"a": "O", "s": "1몰의 입자 수는 약 6.02 × 10²³개이다."}, {"a": "X", "s": "0.5몰은 6.02 × 10²³개의 입자이다."}, {"a": "X", "s": "2몰의 입자 수는 약 6.02 × 10²³개이다."}]}, {"c": "CH1-040", "m": "몰질량", "ol": "**1몰 질량(g) = 화학식량**(O₂ 32, H₂O 18, CO₂ 44). 몰의 정의로 amu와 그램이 일치해서이고, 질량과 몰수를 잇는 변환 인자다.", "forms": [{"a": "O", "s": "어떤 물질 1몰의 질량(g)은 그 물질의 화학식량과 수치가 같다."}, {"a": "O", "s": "O₂ 1몰의 질량은 32 g이다."}, {"a": "X", "s": "CO₂ 1몰의 질량은 22 g이다."}, {"a": "X", "s": "NH₃ 1몰의 질량은 14 g이다."}]}, {"c": "CH1-041", "m": "기체 몰부피", "ol": "**0°C, 1기압에서 기체 1몰 = 22.4 L**(종류 무관). 아보가드로 법칙 덕분이고, 분자가 닿아 있는 고체·액체는 물질마다 다르다.", "forms": [{"a": "O", "s": "0°C, 1기압에서 기체 1몰의 부피는 22.4 L이다."}, {"a": "O", "s": "0°C, 1기압에서 모든 기체 1몰의 부피는 22.4 L로 같다."}, {"a": "X", "s": "0°C, 1기압에서 기체 1몰의 부피는 기체의 종류에 따라 다르다."}, {"a": "X", "s": "0°C, 1기압에서 기체 2몰의 부피는 22.4 L이다."}]}, {"c": "CH1-043", "m": "질량 계산", "ol": "**질량 = 몰수 × 화학식량**(O₂ 2몰 = 64 g). 몰질량이 질량과 몰을 잇는 변환 인자라, 모든 화학량 계산이 질량→몰→몰비→몰→질량으로 돈다.", "forms": [{"a": "O", "s": "이산화탄소 1몰의 질량은 44 g이다."}, {"a": "O", "s": "CH₄ 1몰의 질량은 16 g이다."}, {"a": "X", "s": "CH₄ 1몰의 질량은 12 g이다."}, {"a": "X", "s": "암모니아 1몰의 질량은 14 g이다."}]}, {"c": "CH1-044", "m": "몰-입자수", "ol": "**원자 몰수 = 분자 몰수 × 분자당 원자 수**(O₂ 1몰 → 산소 2몰). 분자 몰과 원자 몰은 개수 단위가 달라, 무엇을 세는지 읽고 첨자를 곱해야 한다.", "forms": [{"a": "O", "s": "산소 분자 O₂ 1몰에 들어 있는 산소 원자는 2몰이다."}, {"a": "O", "s": "질량수 12인 탄소 12 g에 들어 있는 원자 수는 아보가드로 수와 같다."}, {"a": "X", "s": "H₂O 1몰에 들어 있는 수소 원자는 1몰이다."}, {"a": "X", "s": "O₂ 1몰에 들어 있는 산소 원자는 1몰이다."}]}, {"c": "CH1-056", "m": "질량 보존", "ol": "**원자 보존 → 총질량 보존.** 반응은 원자의 재배열일 뿐이라, 빠져나간 기체까지 합치면 질량은 정확히 보존된다.", "forms": [{"a": "O", "s": "화학반응 전후 원자의 종류와 수는 보존된다."}, {"a": "O", "s": "반응물의 전체 질량과 생성물의 전체 질량은 같다."}, {"a": "X", "s": "화학반응에서 원자가 새로 생성되거나 소멸한다."}, {"a": "X", "s": "화학반응 후 총질량이 늘어난다."}]}, {"c": "CH1-064", "m": "계수비-질량비", "ol": "**계수비 = 몰비(질량비 아님), 질량비 = 계수 × 분자량.** 계수는 개수의 언어라, 모든 계산은 몰을 거쳐 돈다.", "forms": [{"a": "O", "s": "화학반응식의 계수비는 몰비와 같다."}, {"a": "O", "s": "계수비는 분자 수의 비이지 질량비가 아니다."}, {"a": "X", "s": "화학반응식의 계수비는 질량비와 같다."}, {"a": "X", "s": "화학반응식 계수비는 곧 질량비이다."}]}, {"c": "CH1-068", "m": "한계 반응물", "ol": "**한계 반응물 = 계수 대비 가장 부족(먼저 소모, 생성물 결정).** 양이 아니라 몰수/계수가 정하므로, 더 많이 넣은 쪽이 한계일 수도 있다.", "forms": [{"a": "O", "s": "한계 반응물은 먼저 모두 소모되어 생성물의 양을 결정하는 반응물이다."}, {"a": "O", "s": "한계 반응물이 모두 소모되면 반응이 멈춘다."}, {"a": "X", "s": "반응물을 충분히 넣으면 한계 반응물과 무관하게 생성물이 계속 늘어난다."}, {"a": "X", "s": "한계 반응물은 가장 많이 넣은 반응물이다."}]}, {"c": "CH1-070", "m": "계수 맞추기", "ol": "**계수만 조정해 양변 원자 수 일치(첨자 불변).** 첨자는 물질의 정체라 못 바꾸고, 맞춘 계수가 그대로 몰비가 된다.", "forms": [{"a": "O", "s": "화학반응식을 완성하면 양변의 각 원자 수가 같아진다."}, {"a": "O", "s": "CH₄ + 2O₂ → CO₂ + 2H₂O는 균형 잡힌 식이다."}, {"a": "X", "s": "메테인 연소식 CH₄ + O₂ → CO₂ + 2H₂O 는 계수가 맞는 식이다."}, {"a": "X", "s": "메테인 연소식은 CH₄ + O₂ → CO₂ + 2H₂O이다."}]}, {"c": "CH1-079", "m": "원자번호", "ol": "**원자번호 = 양성자 수**(원소 결정, 이온돼도 불변). 주기율표를 조직하는 근본 수이고(원자량 아님), 중성 원자에선 전자 수와 같다.", "forms": [{"a": "O", "s": "원자번호는 양성자수와 같다."}, {"a": "O", "s": "원자번호는 양성자수이다."}, {"a": "X", "s": "원자번호는 중성자 수와 같다."}, {"a": "X", "s": "원자번호는 질량수와 같다."}]}, {"c": "CH1-081", "m": "질량수", "ol": "**질량수 = 양성자 + 중성자**(전자 제외, 전자는 1/1840이라 무시). 중성자 수 = 질량수 − 원자번호이고, 평균값인 원자량과는 다르다.", "forms": [{"a": "O", "s": "질량수는 양성자수와 중성자수의 합이다."}, {"a": "O", "s": "질량수는 핵자(양성자 + 중성자)의 총수이다."}, {"a": "X", "s": "질량수는 양성자수와 전자수의 합이다."}, {"a": "X", "s": "질량수는 중성자 수와 같다."}]}, {"c": "CH1-085", "m": "동위원소", "ol": "**동위원소 = 양성자 같고 중성자 다름**(화학 같음, 물리 다름). 존재비 가중 평균이 원자량(Cl 35.5)이고, 질량 차이는 분리에, 방사성은 연대 측정에 쓰인다.", "forms": [{"a": "O", "s": "질량수 12인 탄소와 질량수 14인 탄소는 동위원소이다."}, {"a": "O", "s": "동위원소는 양성자수가 같고 질량수가 다르다."}, {"a": "X", "s": "동위원소는 화학적 성질이 서로 다르다."}, {"a": "X", "s": "동위원소는 양성자수가 서로 다르다."}]}, {"c": "CH1-097", "m": "이온 양성자수", "ol": "**이온돼도 양성자 수(원자번호) 불변**(전자만 변함). 양성자 수가 원소를 정의하므로 화학 변화로는 원소가 바뀌지 않는다.", "forms": [{"a": "O", "s": "이온이 되어도 양성자수는 중성 원자와 같다."}, {"a": "O", "s": "이온이 되어도 양성자수는 변하지 않는다."}, {"a": "X", "s": "이온이 되면 양성자 수가 변한다."}, {"a": "X", "s": "양이온은 양성자를 잃어 만들어진다."}]}, {"c": "CH1-100", "m": "전자 발견", "ol": "**톰슨이 음극선 실험으로 전자 발견.** e/m을 재 원자보다 작은 입자임을 밝혀 불가분성을 깨고 건포도 푸딩 모형을 세웠다.", "forms": [{"a": "O", "s": "톰슨은 음극선 실험으로 전자를 발견하였다."}, {"a": "O", "s": "톰슨은 음극선 실험으로 전자를 발견했다."}, {"a": "X", "s": "톰슨은 양성자를 발견하였다."}, {"a": "X", "s": "전자는 러더퍼드가 발견하였다."}]}, {"c": "CH1-103", "m": "원자핵 발견", "ol": "**러더퍼드가 알파 산란으로 원자핵 발견.** 되튀는 알파 입자가 작고 무거운 (+)핵과 대부분 빈 공간을 드러내 건포도 푸딩 모형을 뒤집었다.", "forms": [{"a": "O", "s": "러더퍼드는 알파 입자 산란 실험으로 원자핵을 발견하였다."}, {"a": "O", "s": "러더퍼드는 알파 입자 산란으로 원자핵을 발견했다."}, {"a": "X", "s": "원자핵은 톰슨이 발견하였다."}, {"a": "X", "s": "러더퍼드는 알파 산란으로 전자를 발견하였다."}]}, {"c": "CH1-110", "m": "에너지 양자화", "ol": "**전자 에너지 = 불연속(양자화)**, E_n=−13.6/n²이라 위로 갈수록 촘촘해지고 n=∞에서 이온화. 허용 준위만 있어 선 스펙트럼이 된다.", "forms": [{"a": "O", "s": "보어 모형에서 전자의 에너지는 불연속적이다."}, {"a": "O", "s": "보어 모형에서 전자는 정해진 에너지 값만 가진다."}, {"a": "X", "s": "보어 모형에서 전자의 에너지는 연속적인 값을 갖는다."}, {"a": "X", "s": "보어 모형에서 전자의 에너지는 연속적이다."}]}, {"c": "CH1-112", "m": "전자 전이", "ol": "**올라가면 흡수, 떨어지면 방출**(에너지 = 준위 차이). λ=hc/ΔE라 전이마다 특정 파장이 나오고(발머=가시광선), 그 집합이 원소의 지문이다.", "forms": [{"a": "O", "s": "전자가 낮은 준위에서 높은 준위로 갈 때 에너지를 흡수한다."}, {"a": "O", "s": "전자가 높은 준위에서 낮은 준위로 가면 빛을 방출한다."}, {"a": "X", "s": "들뜬상태의 전자가 낮은 에너지 준위로 떨어질 때 빛을 흡수한다."}, {"a": "X", "s": "전자가 높은 준위로 갈 때 에너지를 방출한다."}]}, {"c": "CH1-115", "m": "연속 스펙트럼", "ol": "**백색광 → 연속 스펙트럼**(모든 파장). 원자는 양자화로 방출 선(밝음)·흡수 선(어두움)을 같은 파장에 만들어, 별의 성분까지 읽게 한다.", "forms": [{"a": "O", "s": "백색광은 연속 스펙트럼을 만든다."}, {"a": "O", "s": "백색광(햇빛)을 분광하면 연속 스펙트럼이 나타난다."}, {"a": "X", "s": "백색광은 선 스펙트럼을 만든다."}, {"a": "X", "s": "햇빛(백색광)을 분광하면 선 스펙트럼이 나타난다."}]}, {"c": "CH1-127", "m": "오비탈 전자수", "ol": "**한 오비탈 = 최대 2개**(스핀 반대). ms가 두 값뿐이라 2개이고, 이 기본 단위에서 부껍질·껍질 수용 수가 모두 쌓인다.", "forms": [{"a": "O", "s": "오비탈 1개에는 최대 2개의 전자가 들어갈 수 있다."}, {"a": "O", "s": "오비탈 1개에는 최대 2개의 전자가 들어간다."}, {"a": "X", "s": "오비탈 1개에는 최대 3개의 전자가 들어간다."}, {"a": "X", "s": "오비탈 1개에는 전자가 무제한으로 들어간다."}]}, {"c": "CH1-129", "m": "부껍질 전자수", "ol": "**s 2, p 6, d 10, f 14**(오비탈 수 × 2, 파울리). 이 수들이 주기율표 s·p·d·f 블록의 너비이고, 그 뿌리는 양자수와 파울리다.", "forms": [{"a": "O", "s": "p 부껍질에는 최대 6개의 전자가 들어간다."}, {"a": "O", "s": "d 부껍질에는 최대 10개의 전자가 들어간다."}, {"a": "X", "s": "s 부껍질에는 최대 6개의 전자가 들어간다."}, {"a": "X", "s": "p 부껍질의 최대 전자 수는 2개이다."}]}, {"c": "CH1-130", "m": "껍질 최대 전자수", "ol": "**껍질 최대 전자 = 2n²**(2, 8, 18, 32). n²은 오비탈 수(1+3+5+... 합), 2는 스핀이라, 파울리에서 곧장 나온다.", "forms": [{"a": "O", "s": "n번째 전자껍질의 최대 전자 수는 2n²이다."}, {"a": "O", "s": "K 껍질(n=1)의 최대 전자 수는 2이다."}, {"a": "X", "s": "M 껍질(n=3)의 최대 전자 수는 8이다."}, {"a": "X", "s": "L 껍질(n=2)의 최대 전자 수는 2이다."}]}, {"c": "CH1-132", "m": "오비탈 에너지 순서", "ol": "**4s<3d로 먼저 채움(침투 때문), 같은 껍질 s<p<d.** 단 채운 뒤엔 3d<4s라 이온화 때 4s가 먼저 빠진다.", "forms": [{"a": "O", "s": "오비탈 에너지 순서에서 4s는 3d보다 먼저 채워진다."}, {"a": "O", "s": "4s는 3d보다 먼저 채워진다."}, {"a": "X", "s": "같은 전자껍질에서 오비탈의 에너지 순서는 p < s < d 이다."}, {"a": "X", "s": "다전자 원자에서 4s 오비탈은 3d보다 에너지가 높다."}]}, {"c": "CH1-133", "m": "파울리 배타원리", "ol": "**한 오비탈 두 전자 = 스핀 반대**(→ 최대 2개). 네 양자수가 같을 수 없어서이고, 이 하나가 s·p·d·f 수용 수(2·6·10·14)와 주기율표 모양을 만든다.", "forms": [{"a": "O", "s": "한 오비탈의 두 전자는 스핀이 서로 반대이다."}, {"a": "O", "s": "파울리 배타원리에 따라 한 오비탈에는 전자가 최대 2개 들어간다."}, {"a": "X", "s": "파울리 배타원리에 따라 한 오비탈의 두 전자는 같은 스핀을 가진다."}, {"a": "X", "s": "한 오비탈에는 같은 스핀의 전자가 2개 들어간다."}]}, {"c": "CH1-142", "m": "유효핵전하", "ol": "**유효핵전하 = 핵전하 − 가려막기**(주기 오른쪽으로 ↑). 같은 껍질끼리 가려막기를 잘 못 해서이고, 반지름·이온화 에너지·전기음성도가 전부 이 하나를 따른다.", "forms": [{"a": "O", "s": "유효핵전하는 전자가 실제로 느끼는 핵전하이다."}, {"a": "O", "s": "같은 주기에서 원자번호가 커지면 유효핵전하가 커진다."}, {"a": "X", "s": "같은 주기에서 원자번호가 커질수록 유효핵전하는 작아진다."}, {"a": "X", "s": "같은 주기에서 원자번호가 커지면 유효핵전하가 작아진다."}]}, {"c": "CH1-147", "m": "원자 반지름", "ol": "**주기 오른쪽 작아짐, 족 아래로 커짐.** 양이온<중성<음이온이고, 등전자 이온은 핵전하가 클수록 작다(Mg²⁺<Na⁺<F⁻<O²⁻).", "forms": [{"a": "O", "s": "같은 족에서 아래로 갈수록 원자 반지름은 커진다."}, {"a": "O", "s": "같은 주기에서 원자번호가 커지면 원자 반지름이 작아진다."}, {"a": "X", "s": "같은 주기에서 원자번호가 커질수록 원자 반지름은 커진다."}, {"a": "X", "s": "같은 주기에서 원자번호가 커지면 원자 반지름이 커진다."}]}, {"c": "CH1-151", "m": "이온화 에너지 주기성", "ol": "**주기 오른쪽 커짐, 족 아래로 작아짐.** Be>B(2p가 높음), N>O(짝 반발)의 예외가 s/p 간격과 훈트 규칙을 드러낸다.", "forms": [{"a": "O", "s": "같은 주기에서 원자번호가 커질수록 이온화 에너지는 대체로 커진다."}, {"a": "O", "s": "같은 족에서 아래로 갈수록 이온화 에너지가 작아진다."}, {"a": "X", "s": "같은 족에서 아래로 갈수록 이온화 에너지는 커진다."}, {"a": "X", "s": "같은 족에서 아래로 갈수록 이온화 에너지가 커진다."}]}, {"c": "CH1-155", "m": "전기음성도 최대", "ol": "**전기음성도 최대 = 플루오린(F)**(큰 유효핵전하 + 작은 크기). 전자 친화도(F<Cl)와는 다른 개념임에 주의.", "forms": [{"a": "O", "s": "전기음성도가 가장 큰 원소는 플루오린(F)이다."}, {"a": "O", "s": "플루오린은 모든 원소 중 전기음성도가 가장 크다."}, {"a": "X", "s": "전기음성도가 가장 큰 원소는 산소(O)이다."}, {"a": "X", "s": "전기음성도가 가장 큰 원소는 세슘(Cs)이다."}]}, {"c": "CH1-177", "m": "이온결정 전도성", "ol": "**이온결합 물질: 고체 안 통함, 액체·수용액 통함.** 금속은 자유 전자로 고체도 통하고, 이온결정은 녹아야 이온이 움직여 통한다.", "forms": [{"a": "O", "s": "이온결합 물질은 액체 상태나 수용액에서 전기가 통한다."}, {"a": "O", "s": "이온결합 물질은 고체 상태에서 전기가 통하지 않는다."}, {"a": "X", "s": "이온결합 물질은 고체 상태에서 전기가 잘 통한다."}, {"a": "X", "s": "이온결합 물질은 고체 상태에서 전기가 통한다."}]}, {"c": "CH1-180", "m": "공유결정", "ol": "**공유결정 = 원자 연속 결합(매우 단단, 녹는점 매우 높음).** 녹이려면 강한 공유결합을 끊어야 해서이고, 분자 간 힘만 끊는 분자결정과 정반대다.", "forms": [{"a": "O", "s": "공유결정인 다이아몬드는 녹는점이 매우 높다."}, {"a": "O", "s": "공유결정은 원자들이 공유결합으로 연속적으로 연결된 결정이다."}, {"a": "X", "s": "공유결정인 다이아몬드는 녹는점이 매우 낮다."}, {"a": "X", "s": "공유결정인 다이아몬드는 녹는점이 낮다."}]}, {"c": "CH1-186", "m": "격자 에너지", "ol": "**격자 에너지 ∝ (q⁺q⁻)/d**: 전하 크고 이온 작을수록 큼(MgO≫NaCl). 직접 못 재서 보른-하버 순환(헤스 법칙)으로 구한다.", "forms": [{"a": "O", "s": "격자 에너지는 기체 이온이 모여 이온결정을 형성할 때 방출하는 에너지이다."}, {"a": "O", "s": "이온의 크기가 작을수록 격자 에너지는 커진다."}, {"a": "X", "s": "이온의 전하가 클수록 격자 에너지는 작아진다."}, {"a": "X", "s": "이온의 전하가 클수록 격자 에너지가 작아진다."}]}, {"c": "CH1-195", "m": "분자 모양", "ol": "**CO₂ 직선·CH₄ 정사면체·NH₃ 삼각뿔·H₂O 굽은형.** 전자쌍이 최대한 멀어지고(VSEPR), 비공유쌍이 더 넓은 각을 차지해 결합각을 좁힌다.", "forms": [{"a": "O", "s": "CO₂는 직선형 분자이다."}, {"a": "O", "s": "CH₄는 정사면체 분자이다."}, {"a": "X", "s": "BF₃는 삼각뿔 분자이다."}, {"a": "X", "s": "NH₃는 평면 삼각형 분자이다."}]}, {"c": "CH1-210", "m": "무극성 분자", "ol": "**대칭 분자(CO₂·BF₃·CH₄·CCl₄) = 무극성**(쌍극자 상쇄). 극성은 결합 극성과 모양 둘에 달려, 같은 AB₂라도 직선이면 무극성·굽으면 극성이다.", "forms": [{"a": "O", "s": "이산화탄소는 극성 결합을 가지나 분자 전체는 무극성이다."}, {"a": "O", "s": "BF₃는 평면 삼각형 대칭이라 무극성 분자이다."}, {"a": "X", "s": "CCl₄는 극성 분자이다."}, {"a": "X", "s": "CH₄는 극성 분자이다."}]}, {"c": "CH1-217", "m": "혼성 적용", "ol": "**CH₄·NH₃·H₂O sp³, BF₃ sp², CO₂ sp.** 영역 수(비공유쌍 포함)로 정하고, 혼성은 VSEPR 기하의 사후 설명이며, s 성질이 클수록 결합각이 크다.", "forms": [{"a": "O", "s": "메테인(CH₄)의 탄소는 sp³ 혼성을 한다."}, {"a": "O", "s": "이산화탄소(CO₂)의 탄소는 sp 혼성을 한다."}, {"a": "X", "s": "이산화탄소(CO₂)의 탄소는 sp³ 혼성을 한다."}, {"a": "X", "s": "메테인(CH₄)의 탄소는 sp 혼성을 한다."}]}, {"c": "CH1-257", "m": "반응 지수 방향", "ol": "**Q < K 정반응, Q > K 역반응, Q = K 평형.** ΔG = RT ln(Q/K)라 Q와 K 비교는 곧 ΔG의 부호이고, 반응은 Q=K로 굴러간다.", "forms": [{"a": "O", "s": "Q > K이면 역반응이 우세하게 진행된다."}, {"a": "O", "s": "Q = K이면 반응은 평형 상태이다."}, {"a": "X", "s": "Q < K이면 역반응이 우세하게 진행된다."}, {"a": "X", "s": "Q < K이면 역반응이 우세하다."}]}, {"c": "CH1-268", "m": "압력 변화", "ol": "**압력↑ → 분자 수 적은 쪽, 압력↓ → 많은 쪽**(같으면 이동 없음). Q를 K로 되돌리는 것이고, 일정 부피의 비활성 기체는 이동을 안 일으킨다.", "forms": [{"a": "O", "s": "압력을 낮추면(부피를 늘리면) 기체 분자 수가 많은 쪽으로 평형이 이동한다."}, {"a": "O", "s": "반응 전후 기체 분자 수가 같으면 압력을 바꿔도 평형이 이동하지 않는다."}, {"a": "X", "s": "압력을 높이면(부피를 줄이면) 기체 분자 수가 많은 쪽으로 평형이 이동한다."}, {"a": "X", "s": "압력을 높이면 기체 분자 수가 많은 쪽으로 평형이 이동한다."}]}, {"c": "CH1-270", "m": "촉매", "ol": "**촉매 = 평형에 빨리 도달**(위치·K·수득률 그대로). 공유 봉우리를 낮춰 양방향을 가속할 뿐이라, 수율은 압력·온도·생성물 제거로 얻는다.", "forms": [{"a": "O", "s": "촉매를 넣으면 평형에 더 빨리 도달한다."}, {"a": "O", "s": "촉매는 평형의 위치(이동)를 바꾸지 않는다."}, {"a": "X", "s": "촉매는 정반응 속도만 빠르게 한다."}, {"a": "X", "s": "촉매는 생성물의 양(수득률)을 증가시킨다."}]}, {"c": "CH1-369", "m": "확장옥텟·SN5,6", "ol": "**SN5의 기본 모양은 삼각쌍뿔형이다.**"}, {"c": "CH1-370", "m": "확장옥텟·SN5,6", "ol": "**SN6의 기본 모양은 정팔면체형이다.**"}, {"c": "CH1-386", "m": "혼성오비탈·분자극성", "ol": "**SN5의 혼성 오비탈은 sp³d이다.**"}, {"c": "CH1-387", "m": "혼성오비탈·분자극성", "ol": "**SN6의 혼성 오비탈은 sp³d²이다.**"}, {"c": "CH1-399", "m": "오비탈 마디·양자수", "ol": "**s 오비탈의 각마디 수는 0이다.**"}, {"c": "CH1-400", "m": "오비탈 마디·양자수", "ol": "**p 오비탈의 각마디 수는 1이다.**"}, {"c": "CH1-464", "m": "전자전이·스펙트럼 계열", "ol": "**자외선이 방출되는 계열을 라이먼 계열이라고 한다.**"}, {"c": "CH1-465", "m": "전자전이·스펙트럼 계열", "ol": "**가시광선이 방출되는 계열을 발머 계열이라고 한다.**"}], "CH2": [{"c": "CH2-263", "m": "Ka와 세기", "ol": "**Ka 클수록 강한 산**. Ka는 이온화 평형 상수라 클수록 이온 쪽으로 치우치고, 물속 강산들은 평준화되어 같게 보인다.", "forms": [{"a": "O", "s": "Ka가 클수록 강한 산이다."}, {"a": "O", "s": "Ka가 클수록 산이 더 잘 이온화한다."}, {"a": "X", "s": "Ka가 클수록 약한 산이다."}, {"a": "X", "s": "Ka가 작을수록 강한 산이다."}]}, {"c": "CH2-265", "m": "Ka·Kb 관계", "ol": "**Ka·Kb = Kw**. 두 식을 곱하면 [HA]·[A⁻]가 약분되고 [H⁺][OH⁻]=Kw만 남는다. 짝산-짝염기 세기는 물이 묶어 둔 반비례다.", "forms": [{"a": "O", "s": "짝산-짝염기 관계에서 Ka·Kb = Kw이다."}, {"a": "O", "s": "짝산의 Ka와 짝염기의 Kb를 곱하면 물의 이온곱 Kw가 된다."}, {"a": "X", "s": "짝산-짝염기 관계에서 Ka·Kb = 1이다."}, {"a": "X", "s": "짝산의 Ka가 크면 짝염기의 Kb도 크다."}]}, {"c": "CH2-285", "m": "완충 용액 구성", "ol": "**완충 용액 = 약산+짝염기**. 약산은 염기를, 짝염기는 산을 막는 두 저수지다. 강산의 짝염기는 방관자라 완충이 안 된다.", "forms": [{"a": "O", "s": "완충 용액은 약산과 그 짝염기(또는 약염기와 그 짝산)로 이루어진다."}, {"a": "O", "s": "완충 용액은 약산과 그 짝염기로 이루어질 수 있다."}, {"a": "X", "s": "완충 용액은 강산과 그 짝염기로 이루어진다."}, {"a": "X", "s": "완충 용액은 강산과 강염기의 혼합으로 만든다."}]}, {"c": "CH2-289", "m": "염 가수분해", "ol": "**강+강 중성, 약산+강염기 염기성, 강산+약염기 산성.** 약한 부모에서 온 이온만 물과 반응하며, 전부 Ka·Kb=Kw로 결정된다.", "forms": [{"a": "O", "s": "강산과 강염기로 만든 염(NaCl)의 수용액은 중성이다."}, {"a": "O", "s": "약산과 강염기로 만든 염(CH₃COONa)의 수용액은 염기성이다."}, {"a": "X", "s": "약산과 강염기로 만든 염의 수용액은 산성이다."}, {"a": "X", "s": "염화 암모늄(NH₄Cl) 수용액은 염기성이다."}]}, {"c": "CH2-136", "m": "총괄성 정의", "ol": "**총괄성 = 용질 입자 수에만 의존**(종류 무관). 용매 증기압을 낮추는 정도가 입자 수에 비례해서이고, 전해질은 이온화로 i배만큼 커진다.", "forms": [{"a": "O", "s": "총괄성은 용질 입자의 수에만 의존하고 용질의 종류와는 무관하다."}, {"a": "O", "s": "총괄성은 용질 입자의 수에만 의존한다."}, {"a": "X", "s": "총괄성은 용질의 종류에 따라 달라진다."}, {"a": "X", "s": "총괄성은 용질 입자의 종류에 따라 달라진다."}]}, {"c": "CH2-140", "m": "어는점 내림", "ol": "**어는점 내림: ΔTf = Kf·m**(어는점 낮아짐). 용질이 용매의 결정화를 방해해서이고, 끓는점 오름과 한 쌍으로 부동액·제설에 쓰인다.", "forms": [{"a": "O", "s": "어는점 내림은 ΔTf = Kf·m로 나타낸다."}, {"a": "O", "s": "용질을 녹이면 용액의 어는점이 순용매보다 낮아진다."}, {"a": "X", "s": "용질을 녹이면 용액의 어는점이 올라간다."}, {"a": "X", "s": "용질을 녹이면 어는점이 순용매보다 높아진다."}]}, {"c": "CH2-112", "m": "몰랄 농도 정의", "ol": "**몰랄 농도(m) = 용질 몰수 / 용매 kg**(용매 질량 기준). 질량 기준이라 온도에 무관해, 총괄성 계산에 쓰인다.", "forms": [{"a": "O", "s": "몰랄 농도(m)는 용매 1 kg에 녹아 있는 용질의 몰수이다."}, {"a": "O", "s": "몰랄 농도는 용매의 질량을 기준으로 한다."}, {"a": "X", "s": "몰랄 농도는 용액 1 kg에 녹아 있는 용질의 몰수이다."}, {"a": "X", "s": "몰랄 농도는 용액 1 L에 녹아 있는 용질의 몰수이다."}]}, {"c": "CH2-117", "m": "몰농도 온도", "ol": "**몰농도 = 온도 의존**(부피 기준, 온도↑ → 몰농도↓). 질량 기준 몰랄 농도는 온도에 무관해, 온도를 다루는 총괄성 계산에 쓰인다.", "forms": [{"a": "O", "s": "몰농도는 부피를 기준으로 하므로 온도에 의존한다."}, {"a": "O", "s": "몰농도는 온도가 변하면 달라진다."}, {"a": "X", "s": "몰농도는 온도가 변해도 일정하다."}, {"a": "X", "s": "몰농도는 질량을 기준으로 해서 온도에 무관하다."}]}, {"c": "CH2-118", "m": "농도 근사", "ol": "**묽은 수용액: 몰농도 ≈ 몰랄 농도**(물 밀도 약 1이라 부피 ≈ 질량). 진한 용액·비수용매에서는 둘을 구분해야 한다.", "forms": [{"a": "O", "s": "묽은 수용액에서 몰농도와 몰랄 농도는 거의 비슷하다."}, {"a": "O", "s": "묽은 수용액에서는 용액의 부피(L)와 용매의 질량(kg)이 거의 같다."}, {"a": "X", "s": "묽은 수용액에서 몰농도는 몰랄 농도보다 항상 훨씬 크다."}, {"a": "X", "s": "묽은 수용액에서 몰농도는 몰랄 농도보다 항상 훨씬 작다."}]}, {"c": "CH2-222", "m": "헨리 법칙", "ol": "**기체 용해도 ∝ 부분 압력**(온도 일정). 압력이 높을수록 더 녹고(탄산음료·잠수병), 온도가 오르면 오히려 덜 녹는다(고체와 반대).", "forms": [{"a": "O", "s": "헨리 법칙에 따르면 기체의 용해도는 그 기체의 부분 압력에 비례한다."}, {"a": "O", "s": "헨리 법칙은 온도가 일정할 때 성립한다."}, {"a": "X", "s": "헨리 법칙에서 기체 용해도는 부분 압력에 반비례한다."}, {"a": "X", "s": "헨리 법칙은 온도가 변할 때도 항상 성립한다."}]}, {"c": "CH2-174", "m": "ΔH 부호", "ol": "**발열 ΔH < 0, 흡열 ΔH > 0.** 계가 열을 내보내면 엔탈피가 줄어 음수이고, 발열은 자발에 유리하나 ΔG=ΔH−TΔS의 한 항일 뿐이다.", "forms": [{"a": "O", "s": "발열 반응은 ΔH < 0, 흡열 반응은 ΔH > 0이다."}, {"a": "O", "s": "발열 반응은 ΔH < 0이다."}, {"a": "X", "s": "발열 반응에서 ΔH는 0보다 크다."}, {"a": "X", "s": "흡열 반응은 ΔH < 0이다."}]}, {"c": "CH2-176", "m": "표준 생성 엔탈피", "ol": "**안정한 홑원소 물질의 표준 생성 엔탈피 = 0**(측정 불가라 약속한 기준). 모든 물질을 홑원소 기준으로 적어 두면 ΔH = Σ생성물 − Σ반응물로 나온다.", "forms": [{"a": "O", "s": "표준 생성 엔탈피는 화합물 1몰이 가장 안정한 원소로부터 생성될 때의 엔탈피 변화이다."}, {"a": "O", "s": "가장 안정한 홑원소 물질의 표준 생성 엔탈피는 0이다."}, {"a": "X", "s": "산소 기체(O₂)처럼 가장 안정한 홑원소 물질의 표준 생성 엔탈피는 0이 아니다."}, {"a": "X", "s": "산소 기체(O₂)의 표준 생성 엔탈피는 0이 아니다."}]}, {"c": "CH2-179", "m": "결합 에너지", "ol": "**끊기 = 흡열, 형성 = 발열**(ΔH ≈ 반응물 − 생성물 결합 E). 결합은 에너지 우물이라 끊으려면 에너지가 들고, 평균값이라 결과는 근삿값이다.", "forms": [{"a": "O", "s": "결합 에너지로 ΔH ≈ (반응물 결합 에너지 합) - (생성물 결합 에너지 합)이다."}, {"a": "O", "s": "결합이 형성될 때는 에너지를 방출한다(발열)."}, {"a": "X", "s": "결합을 끊는 과정은 에너지를 방출하는 발열 과정이다."}, {"a": "X", "s": "결합이 형성될 때 에너지를 흡수한다."}]}, {"c": "CH2-036", "m": "상태 방정식", "ol": "**PV = nRT**(T는 절대 온도). 보일·샤를·아보가드로를 묶은 식이라 변수를 고정하면 각 법칙이 나오고, R는 모든 기체에 같은 보편 상수다.", "forms": [{"a": "O", "s": "이상 기체 상태 방정식은 PV = nRT이다."}, {"a": "O", "s": "PV = nRT에서 P는 압력, V는 부피, n은 몰수, R는 기체 상수, T는 절대 온도이다."}, {"a": "X", "s": "PV = nRT에서 T는 섭씨 온도를 쓴다."}, {"a": "X", "s": "상태 방정식에서 압력과 부피는 항상 비례한다."}]}, {"c": "CH2-042", "m": "이상 기체 가정", "ol": "**이상 기체 = 크기·분자 간 힘 무시 + 완전 탄성 충돌.** 실제로 깨지는 건 부피와 인력 둘뿐이고, 저압·고온에서 가정이 잘 맞는다.", "forms": [{"a": "O", "s": "이상 기체는 분자 자체의 크기와 분자 간 힘을 무시한다."}, {"a": "O", "s": "이상 기체 분자의 충돌은 완전 탄성 충돌로 본다."}, {"a": "X", "s": "이상 기체는 분자 사이에 인력이 작용한다고 가정한다."}, {"a": "X", "s": "이상 기체는 분자 사이에 인력이 있다고 가정한다."}]}, {"c": "CH2-043", "m": "운동 에너지와 온도", "ol": "**평균 운동 에너지 ∝ 절대 온도**(속력은 √T). 온도는 곧 평균 운동 에너지이고(분자량 무관), 0 K에서 운동이 멈추기에 절대 온도를 쓴다.", "forms": [{"a": "O", "s": "기체 분자의 평균 운동 에너지는 절대 온도에 비례한다."}, {"a": "O", "s": "온도가 같으면 기체 종류가 달라도 분자의 평균 운동 에너지는 같다."}, {"a": "X", "s": "절대 온도가 2배가 되면 분자의 평균 속력도 2배가 된다."}, {"a": "X", "s": "같은 온도에서 평균 운동 에너지는 분자량에 따라 달라진다."}]}, {"c": "CH2-045", "m": "분자량과 속력", "ol": "**분자량 클수록 평균 속력 느림**(v ∝ 1/√M). 같은 온도면 운동 에너지가 같아 무거운 분자가 느리고, 확산·분출도 같은 √M 의존성을 따른다.", "forms": [{"a": "O", "s": "같은 온도에서 분자량이 클수록 평균 속력이 느리다."}, {"a": "O", "s": "같은 온도에서 H₂는 O₂보다 평균 속력이 빠르다."}, {"a": "X", "s": "같은 온도에서 분자량이 작을수록 평균 속력이 느리다."}, {"a": "X", "s": "같은 온도에서는 분자량과 관계없이 평균 속력이 같다."}]}, {"c": "CH2-048", "m": "그레이엄 법칙", "ol": "**확산 속도 ∝ 1/√M**(가벼운 기체가 빠름). vrms=√(3RT/M)의 직접 결과이고, √M 차이가 작아 우라늄 농축엔 수천 단계가 든다.", "forms": [{"a": "O", "s": "기체의 확산 속도는 분자량의 제곱근에 반비례한다."}, {"a": "O", "s": "그레이엄 법칙을 이용하면 두 기체의 확산 속도 비로부터 분자량 비를 구할 수 있다."}, {"a": "X", "s": "같은 조건에서 분자량이 큰 기체가 분자량이 작은 기체보다 빨리 확산한다."}, {"a": "X", "s": "확산 속도는 분자량에 비례한다."}]}, {"c": "CH2-003", "m": "분산력 보편성", "ol": "**분산력 = 전자를 가진 모든 입자에 작용**(He도). 순간 쌍극자에서 생기고, 분극률이 클수록(분자가 클수록) 강해진다.", "forms": [{"a": "O", "s": "분산력은 모든 분자와 원자 사이에 작용한다."}, {"a": "O", "s": "분산력은 모든 분자 사이에 작용한다."}, {"a": "X", "s": "분산력은 무극성 분자 사이에는 작용하지 않는다."}, {"a": "X", "s": "He 원자 사이에는 분자 간 힘이 전혀 작용하지 않는다."}]}, {"c": "CH2-006", "m": "수소 결합 조건", "ol": "**수소 결합 = H가 F, O, N에 결합했을 때**(HF·H₂O·NH₃). 작고 전기음성도 큰 원자라 H가 강한 δ+를 띠고, 이것이 물의 이상성을 만든다.", "forms": [{"a": "O", "s": "수소 결합은 F, O, N에 결합한 수소 원자가 관여한다."}, {"a": "O", "s": "수소 결합은 H가 F, O, N에 직접 결합했을 때 나타난다."}, {"a": "X", "s": "수소 결합은 모든 수소 화합물에서 나타난다."}, {"a": "X", "s": "수소 결합은 H가 C에 결합했을 때도 잘 나타난다."}]}, {"c": "CH2-013", "m": "수소 결합 예", "ol": "**수소 결합 = H₂O·HF·NH₃·에탄올**(H가 F·O·N에 결합). CH₄·HCl은 안 하고, 에탄올은 −OH의 H만 한다.", "forms": [{"a": "O", "s": "물(H₂O)은 분자 사이에 수소 결합을 형성한다."}, {"a": "O", "s": "플루오린화 수소(HF)는 분자 사이에 수소 결합을 한다."}, {"a": "X", "s": "메테인(CH₄)은 분자 사이에 수소 결합을 한다."}, {"a": "X", "s": "염화 수소(HCl)는 분자 사이에 수소 결합을 한다."}]}, {"c": "CH2-019", "m": "끓는점 관계", "ol": "**분자 간 힘 강할수록 끓는점 높음**(비례). 위계는 수소 결합>쌍극자>분산력이나 큰 분자는 분산력이 세고, 끊어지는 건 분자 간 힘이지 공유 결합이 아니다.", "forms": [{"a": "O", "s": "분자 간 힘이 강할수록 끓는점이 높다."}, {"a": "O", "s": "분자 간 힘이 약할수록 물질은 더 낮은 온도에서 끓는다."}, {"a": "X", "s": "끓는점은 분자 간 힘과 무관하다."}, {"a": "X", "s": "분자 간 힘이 강할수록 끓는점이 낮다."}]}, {"c": "CH2-020", "m": "증기압 관계", "ol": "**분자 간 힘 강할수록 증기압 작음**(반비례). 증기압 큼↔끓는점 낮음↔분자 간 힘 약함이 한 묶음이고, 온도가 오르면 증기압이 커진다.", "forms": [{"a": "O", "s": "분자 간 힘이 강할수록 증기 압력이 작다."}, {"a": "O", "s": "분자 간 힘이 강하면 증발이 어려워 증기 압력이 작다."}, {"a": "X", "s": "분자 간 힘이 강할수록 증기 압력이 크다."}, {"a": "X", "s": "분자 간 힘이 약할수록 증기 압력이 작다."}]}, {"c": "CH2-235", "m": "활성화 에너지", "ol": "**활성화 에너지 = 봉우리−반응물(장벽), 클수록 느림.** ΔH(끝점 차이)와 독립이라, 발열이어도 Ea가 높으면 느리다.", "forms": [{"a": "O", "s": "활성화 에너지는 반응이 일어나기 위해 필요한 최소 에너지이다."}, {"a": "O", "s": "활성화 에너지가 클수록 반응이 느리다."}, {"a": "X", "s": "활성화 에너지가 클수록 반응이 빠르다."}, {"a": "X", "s": "활성화 에너지는 반응물과 생성물의 에너지 차이(ΔH)와 같다."}]}, {"c": "CH2-240", "m": "촉매와 엔탈피", "ol": "**촉매는 활성화 에너지만 낮춤**(ΔH·평형 불변). 더 낮은 길을 뚫을 뿐 양쪽 골짜기 높이(ΔH)는 그대로라, 속도만 올리고 어디서 멈출지는 못 바꾼다.", "forms": [{"a": "O", "s": "촉매는 반응엔탈피 ΔH를 변화시키지 않는다."}, {"a": "O", "s": "촉매는 활성화 에너지만 낮추고 ΔH는 그대로 둔다."}, {"a": "X", "s": "촉매는 반응엔탈피 ΔH를 작게 만든다."}, {"a": "X", "s": "촉매는 ΔH를 변화시켜 반응을 빠르게 한다."}]}, {"c": "CH2-244", "m": "속도 상수", "ol": "**속도 상수 k = 온도·촉매에 의존**(농도와 무관). 농도는 충돌 횟수(속도)를, k는 충돌당 성공 확률을 담아, k=A·e^(−Ea/RT)로 정해진다.", "forms": [{"a": "O", "s": "속도 상수 k는 온도에 따라 달라진다."}, {"a": "O", "s": "속도 상수 k는 농도와 무관하다."}, {"a": "X", "s": "속도 상수 k는 반응물의 농도에 따라 달라진다."}, {"a": "X", "s": "속도 상수 k는 반응물의 농도가 커지면 커진다."}]}, {"c": "CH2-246", "m": "촉매와 역반응", "ol": "**촉매는 정·역반응 모두 빠르게**(평형 위치·K 불변). 공유 봉우리를 낮춰 양방향을 함께 가속하니, 같은 평형에 더 빨리 도달할 뿐이다.", "forms": [{"a": "O", "s": "촉매는 정반응과 역반응을 모두 빠르게 한다."}, {"a": "O", "X", "s": "환원제는 전자를 받는다."}]}, {"c": "CH2-062", "m": "돌턴 법칙", "ol": "**전체 압력 = 각 성분 분압의 합.** 이상 기체는 분자끼리 간섭하지 않아 각자의 압력이 그대로 더해진다.", "forms": [{"a": "O", "s": "돌턴 분압 법칙에 따르면 전체 압력은 각 성분 기체의 분압의 합이다."}, {"a": "O", "s": "이상 기체 혼합물에서도 돌턴의 분압 법칙이 성립한다."}, {"a": "X", "s": "전체 압력은 가장 큰 분압과 같다."}, {"a": "X", "s": "혼합 기체의 전체 압력은 각 분압의 평균이다."}]}, {"c": "CH2-064", "m": "분압-몰분율", "ol": "**분압 = 전체 압력 × 몰분율**(P ∝ n에서 나옴). 분압/전체압력 = 몰분율이고, 이상 기체는 몰분율·부피분율·압력분율이 모두 같다.", "forms": [{"a": "O", "s": "어떤 기체의 부분 압력은 전체 압력에 그 기체의 몰분율을 곱한 값이다."}, {"a": "O", "s": "전체 압력이 일정하면 몰분율이 큰 성분일수록 분압이 크다."}, {"a": "X", "s": "분압은 전체 압력에 몰분율을 곱한 값과 다르다."}, {"a": "X", "s": "전체 압력이 일정할 때 분압이 큰 성분일수록 몰분율이 작다."}]}, {"c": "CH2-054", "m": "이상 기체 편차", "ol": "**저온(인력)·고압(부피) → 이상 기체에서 벗어남.** 저온엔 인력이 수축시키고 고압엔 분자 부피가 버텨, 두 효과의 경쟁이 Z 곡선을 만든다.", "forms": [{"a": "O", "s": "저온에서는 분자 간 인력의 영향으로 이상 기체에서 벗어난다."}, {"a": "O", "s": "실제 기체는 고압에서 이상 기체에서 많이 벗어난다."}, {"a": "X", "s": "실제 기체는 고압에서 이상 기체와 잘 맞는다."}, {"a": "X", "s": "실제 기체는 저온에서 이상 기체와 잘 맞는다."}]}, {"c": "CH2-056", "m": "반데르발스 상수", "ol": "**a = 분자 간 인력(압력 보정), b = 분자 부피(부피 보정).** (P+a(n/V)²)(V−nb)=nRT이고, a가 큰 기체는 수소 결합·극성이 강하다.", "forms": [{"a": "O", "s": "반데르발스 상수 a는 분자 간 인력을, b는 분자 자체 부피를 반영한다."}, {"a": "O", "s": "반데르발스 상수 a는 분자 간 인력을 반영하는 항이다."}, {"a": "X", "s": "반데르발스 상수 a는 분자 자체의 부피를 반영하는 항이다."}, {"a": "X", "s": "반데르발스 상수 b는 분자 간 인력을 반영한다."}]}, {"c": "CH2-057", "m": "압축 인자", "ol": "**Z = PV/nRT = V_실제/V_이상**(이상은 Z=1). Z<1은 인력이 수축시킨 것, Z>1은 분자 부피가 버틴 것이고, 보일 온도에서 둘이 상쇄된다.", "forms": [{"a": "O", "s": "압축 인자 Z = PV/nRT이며 이상 기체는 Z = 1이다."}, {"a": "O", "s": "압축 인자 Z는 실제 기체가 이상 기체에서 얼마나 벗어났는지 나타낸다."}, {"a": "X", "s": "이상 기체의 압축 인자 Z는 1이 아니다."}, {"a": "X", "s": "이상 기체의 압축 인자는 압력에 따라 변한다."}]}, {"c": "CH2-095", "m": "이온 결정 전도성", "ol": "**이온 결정: 고체 X, 액체·수용액 O.** 전도는 움직이는 전하 운반자가 있어야 하는데, 고체에선 이온이 고정되고 녹으면 자유로워진다.", "forms": [{"a": "O", "s": "이온 결정은 액체나 수용액 상태에서 전기를 통한다."}, {"a": "O", "s": "이온 결정은 고체 상태에서 전기를 통하지 않는다."}, {"a": "X", "s": "이온 결정은 고체 상태에서 전기를 통한다."}, {"a": "X", "s": "이온 결정은 액체 상태에서도 전기를 통하지 않는다."}]}, {"c": "CH2-105", "m": "다이아몬드 전도성", "ol": "**다이아몬드 = 전기 안 통함**(4개 결합, 자유 전자 없음). 흑연은 4번째 전자가 비편재화해 통하니, 같은 탄소라도 결합 방식이 전도성을 가른다.", "forms": [{"a": "O", "s": "다이아몬드는 전기를 통하지 않는다."}, {"a": "O", "s": "다이아몬드는 각 탄소가 4개의 탄소와 공유 결합해 자유 전자가 없다."}, {"a": "X", "s": "다이아몬드는 전기 전도성이 좋다."}, {"a": "X", "s": "다이아몬드는 자유 전자가 많아 전기를 잘 통한다."}]}, {"c": "CH2-198", "m": "ΔG 식", "ol": "**ΔG = ΔH − TΔS**. 에너지 낮추기(ΔH)와 무질서 늘리기(ΔS)의 줄다리기이고, T가 엔트로피의 가중치라 T = ΔH/ΔS에서 승부가 뒤집힌다.", "forms": [{"a": "O", "s": "ΔG = ΔH - TΔS이다."}, {"a": "O", "s": "ΔG = ΔH - TΔS로 자발성을 판단한다."}, {"a": "X", "s": "ΔG = ΔH + TΔS이다."}, {"a": "X", "s": "ΔG = ΔS - TΔH이다."}]}, {"c": "CH2-202", "m": "발열과 자발성", "ol": "**발열이라도 항상 자발은 아니다**(ΔG로 판단). 발열성이 대개 맞는 건 엔탈피가 흔히 지배해서일 뿐이고, 자발적이라고 빠른 것도 아니다.", "forms": [{"a": "O", "s": "발열 반응이라도 항상 자발적인 것은 아니다."}, {"a": "O", "s": "발열 반응(ΔH < 0)이어도 ΔS < 0이고 고온이면 비자발적일 수 있다."}, {"a": "X", "s": "발열 반응은 항상 자발적이다."}, {"a": "X", "s": "흡열 반응은 절대 자발적일 수 없다."}]}, {"c": "CH2-304", "m": "강산-강염기 당량점", "ol": "**강산-강염기 당량점 = pH 7**. 남은 이온이 방관자라 물을 안 건드리기 때문이고, 약산이 끼면 짝염기 가수분해로 당량점이 염기성이 된다.", "forms": [{"a": "O", "s": "강산-강염기 적정의 당량점 pH는 7이다."}, {"a": "O", "s": "강산-강염기 적정의 당량점은 중성이다."}, {"a": "X", "s": "강산-강염기 적정의 당량점 pH는 7보다 크다."}, {"a": "X", "s": "강산-강염기 적정의 당량점 pH는 7보다 작다."}]}, {"c": "CH2-384", "m": "고체 결정구조", "ol": "**단순입방구조는 단위 세포당 입자수가 1개이다.**"}, {"c": "CH2-385", "m": "고체 결정구조", "ol": "**단순입방구조는 배위수가 6이다.**"}, {"c": "CH2-410", "m": "적정·가수분해·다양성자", "ol": "**강산과 강염기의 중화로 생성된 염은 가수분해하지 않는다.**"}, {"c": "CH2-411", "m": "적정·가수분해·다양성자", "ol": "**약산과 약염기의 중화로 생성된 염은 가수분해한다.**"}, {"c": "CH2-428", "m": "Ka·이온화도·오스트발트", "ol": "**약산의 이온화 상수는 Ka = [H⁺][A⁻]/[HA]이다.**"}, {"c": "CH2-429", "m": "Ka·이온화도·오스트발트", "ol": "**약산을 물로 묽히면 이온화도(α)는 커진다.**"}, {"c": "CH2-440", "m": "완충범위·용량·헨더슨", "ol": "**완충 용액의 유효 완충 범위는 대략 pH = pKa ± 1이다.**"}, {"c": "CH2-441", "m": "완충범위·용량·헨더슨", "ol": "**완충 용액은 [짝염기]/[산] = 1일 때 완충 용량이 가장 크다.**"}, {"c": "CH2-450", "m": "기체·실제기체·반데르발스", "ol": "**이상기체 분자는 분자 자체의 크기가 없다고 가정한다.**"}, {"c": "CH2-451", "m": "기체·실제기체·반데르발스", "ol": "**이상기체 분자는 분자간 인력과 반발력이 없다고 가정한다.**"}, {"c": "CH2-464", "m": "네른스트·농도차전지", "ol": "**네른스트 식은 비표준 상태에서의 전지 전위를 구하는 식이다.**"}, {"c": "CH2-465", "m": "네른스트·농도차전지", "ol": "**25°C에서 네른스트 식은 E = E° − (0.0592/n)log Q이다.**"}], "GC": [{"c": "GC-148", "m": "Ka·Kb 관계", "ol": "**Ka·Kb = Kw, pKa+pKb = 14.** Kb = Kw/Ka, 강산↔약한 짝염기.", "forms": [{"a": "O", "s": "짝산-짝염기 관계에서 Ka·Kb = Kw이다."}, {"a": "O", "s": "짝산의 Ka와 짝염기의 Kb를 곱하면 Kw가 된다."}, {"a": "X", "s": "짝산-짝염기 관계에서 Ka·Kb = 1이다."}, {"a": "X", "s": "Ka가 클수록 그 짝염기의 Kb도 크다."}]}, {"c": "GC-154", "m": "염 가수분해", "ol": "**약한 쪽 짝이 가수분해.** NaCl 중성, CH₃COONa 염기성, NH₄Cl 산성.", "forms": [{"a": "O", "s": "강산과 강염기로 만든 염(NaCl)의 수용액은 중성이다."}, {"a": "O", "s": "염화 암모늄(NH₄Cl) 수용액은 산성이다."}, {"a": "X", "s": "약산과 강염기로 만든 염(CH₃COONa)의 수용액은 산성이다."}, {"a": "X", "s": "강산과 약염기로 만든 염(NH₄Cl)의 수용액은 염기성이다."}]}, {"c": "GC-013", "m": "질량수", "ol": "**질량수 = 양성자 + 중성자(전자 제외), 정수.** 중성자 = 질량수 - 원자 번호. 원자량(평균)과는 다르다.", "forms": [{"a": "O", "s": "질량수는 양성자 수와 중성자 수의 합이다."}, {"a": "O", "s": "질량수는 핵을 이루는 핵자(양성자와 중성자)의 총수이다."}, {"a": "X", "s": "질량수는 양성자 수와 전자 수의 합이다."}, {"a": "X", "s": "질량수는 양성자 수와 같다."}]}, {"c": "GC-002", "m": "물질량 단위", "ol": "**몰 = 6.022×10²³개 묶음.** 질량÷몰질량=몰, 몰×아보가드로=개수, 1몰 기체=22.4 L(STP). 같은 질량이라고 같은 몰수 아니다.", "forms": [{"a": "O", "s": "물질의 양(물질량)의 SI 기본 단위는 몰(mol)이다."}, {"a": "O", "s": "1몰은 약 6.022×10^23개의 입자를 뜻한다(아보가드로 수)."}, {"a": "X", "s": "물질의 양(물질량)의 SI 기본 단위는 그램(g)이다."}, {"a": "X", "s": "물질의 양의 SI 기본 단위는 킬로그램(kg)이다."}]}, {"c": "GC-007", "m": "정확도·정밀도", "ol": "**정확=참값 근접, 정밀=재현성.** 치우침은 정확도(계통), 흩어짐은 정밀도(무작위). 정밀≠정확.", "forms": [{"a": "O", "s": "정확도는 측정값이 참값에 가까운 정도이다."}, {"a": "O", "s": "정밀도는 측정값들이 서로 얼마나 일치하는지를 나타낸다."}, {"a": "X", "s": "정밀도가 높으면 항상 정확도도 높다."}, {"a": "X", "s": "정확도와 정밀도는 같은 개념이다."}]}, {"c": "GC-119", "m": "Kc-Kp 관계", "ol": "**Kp = Kc(RT)^Δn**(P = c·RT를 대입한 결과). Δn은 기체(생성물−반응물)만 세고, Δn=0이면 Kp=Kc다.", "forms": [{"a": "O", "s": "Kp = Kc(RT)^Δn 관계가 성립한다."}, {"a": "O", "s": "Δn은 기체 생성물 몰수에서 기체 반응물 몰수를 뺀 값이다."}, {"a": "X", "s": "Kp = Kc(RT)^Δn에서 T는 섭씨 온도이다."}, {"a": "X", "s": "Δn은 모든 물질의 몰수 변화로 센다."}]}, {"c": "GC-121", "m": "평형 상수 의미", "ol": "**K 크면 생성물·작으면 반응물 우세.** 농도가 변하는 화학종만 들어가고(고체·액체 제외), K=e^(−ΔG°/RT)이며, 위치를 말할 뿐 속도가 아니다.", "forms": [{"a": "O", "s": "평형 상수 K가 크면 평형에서 생성물이 우세하다."}, {"a": "O", "s": "평형 상수 K가 작으면 평형에서 반응물이 우세하다."}, {"a": "X", "s": "평형 상수 K가 크면 평형에서 반응물이 우세하다."}, {"a": "X", "s": "평형 상수 K가 작으면 평형에서 생성물이 우세하다."}]}, {"c": "GC-126", "m": "압력 변화", "ol": "**압력↑ → 몰수 적은 쪽, 압력↓ → 많은 쪽**(K 불변). 일정 부피에서 비활성 기체를 넣으면 부분 압력이 그대로라 이동하지 않는다.", "forms": [{"a": "O", "s": "압력을 높이면(부피 감소) 기체 몰수가 적은 쪽으로 평형이 이동한다."}, {"a": "O", "s": "압력을 낮추면(부피 증가) 기체 몰수가 많은 쪽으로 평형이 이동한다."}, {"a": "X", "s": "압력을 높이면 기체 몰수가 많은 쪽으로 평형이 이동한다."}, {"a": "X", "s": "압력을 낮추면 기체 몰수가 적은 쪽으로 평형이 이동한다."}]}, {"c": "GC-132", "m": "공통 이온 효과", "ol": "**공통 이온 → 용해도↓(침전 쪽), Ksp 불변.** Q가 Ksp 위로 올라가 되돌리는 것이고, 완충(약산+짝염기)과 같은 Q-vs-K 원리다.", "forms": [{"a": "O", "s": "공통 이온을 넣으면 난용성 염의 용해도가 작아진다."}, {"a": "O", "s": "공통 이온 효과는 르샤틀리에 원리로 설명된다."}, {"a": "X", "s": "공통 이온 효과로 공통 이온을 넣으면 난용성 염의 용해도가 커진다."}, {"a": "X", "s": "공통 이온을 넣으면 용해 평형이 용해(정반응) 쪽으로 이동한다."}]}, {"c": "GC-189", "m": "반감기", "ol": "**1차 반감기만 농도 무관(일정).** 1차는 개별 확률이 일정해서(방사성 붕괴), 0차는 비례, 2차는 반비례. 반감기 거동이 차수를 진단한다.", "forms": [{"a": "O", "s": "1차 반응의 반감기는 t½ = ln2/k로 초기 농도와 무관하게 일정하다."}, {"a": "O", "s": "0차 반응의 반감기는 초기 농도에 비례한다."}, {"a": "X", "s": "1차 반응의 반감기는 초기 농도에 비례해 커진다."}, {"a": "X", "s": "모든 반응의 반감기는 초기 농도와 무관하게 일정하다."}]}, {"c": "GC-043", "m": "이온 결합", "ol": "**금속+비금속, 전자 주고받음, 정전기 인력.** 이온성은 전기음성도 차이의 극단(공유와 연속)이고, 쿨롱 격자 에너지가 녹는점·전도성을 정한다.", "forms": [{"a": "O", "s": "이온 결합은 양이온과 음이온 사이의 정전기적 인력으로 형성된다."}, {"a": "O", "s": "이온 결합은 주로 금속과 비금속 사이에서 형성된다."}, {"a": "X", "s": "이온 결합은 두 원자가 전자를 공유해 형성된다."}, {"a": "X", "s": "이온 결합은 주로 두 비금속 원자 사이에서 형성된다."}]}, {"c": "GC-045", "m": "결합 길이", "ol": "**삼중<이중<단일(차수 ↑ 길이 ↓), 짧을수록 강함.** 전자쌍이 핵을 더 세게 당겨서이고, 차수·길이·세기·에너지는 한 묶음이다.", "forms": [{"a": "O", "s": "같은 두 원자 사이에서 삼중 결합은 이중, 단일 결합보다 짧다."}, {"a": "O", "s": "결합 차수가 클수록 결합 길이가 짧아진다."}, {"a": "X", "s": "같은 두 원자 사이에서 단일 결합이 삼중 결합보다 짧다."}, {"a": "X", "s": "결합 차수가 클수록 결합 길이가 길어진다."}]}, {"c": "GC-048", "m": "옥텟 규칙", "ol": "**최외각 8개(s²p⁶)로 안정**(수소는 2개). 8은 s·p가 닫히는 수라, 부족·확장·홀수 전자에서 깨지고 3주기 이후만 확장된다.", "forms": [{"a": "O", "s": "옥텟 규칙은 원자가 전자 8개를 채워 안정해지려는 경향이다."}, {"a": "O", "s": "옥텟을 만족하면 비활성 기체와 같은 안정한 전자 배치가 된다."}, {"a": "X", "s": "옥텟 규칙은 원자가 전자 18개를 채우려는 경향이다."}, {"a": "X", "s": "수소도 옥텟 규칙에 따라 전자 8개를 채운다."}]}, {"c": "GC-050", "m": "형식 전하", "ol": "**형식 전하 = 원자가 − 비공유 − 결합/2.** 합은 분자 전하이고, 결합을 반반으로 센 장부값(진짜 전하·산화수와 다름)이다. 0에 가까울수록 안정.", "forms": [{"a": "O", "s": "형식 전하는 (원자가 전자 수) - (비공유 전자 수) - (결합 전자 수의 절반)으로 구한다."}, {"a": "O", "s": "분자 내 모든 원자의 형식 전하의 합은 분자 전체 전하와 같다."}, {"a": "X", "s": "형식 전하는 (원자가 전자 수) + (결합 전자 수)로 구한다."}, {"a": "X", "s": "형식 전하의 합은 분자 전하와 무관하게 항상 0이다."}]}, {"c": "GC-057", "m": "분자 구조", "ol": "**CH₄ 정사면체·NH₃ 삼각뿔·H₂O 굽은형·CO₂ 직선·BF₃ 평면삼각.** 입체수가 같아도 비공유 수가 모양을 가르고, 그 모양이 극성을 정한다.", "forms": [{"a": "O", "s": "물(H₂O)은 비공유 전자쌍 두 개 때문에 굽은형 구조이다."}, {"a": "O", "s": "메테인(CH₄)은 정사면체이고 결합각은 약 109.5°이다."}, {"a": "X", "s": "메테인(CH₄)은 평면 사각형이고 결합각은 약 90°이다."}, {"a": "X", "s": "암모니아(NH₃)는 비공유 전자쌍 때문에 평면 삼각형 구조이다."}]}, {"c": "GC-059", "m": "시그마·파이", "ol": "**σ 정면(강)·π 옆(약).** 첫 결합은 σ. π는 밀도가 핵 사이에 덜 쌓여 약하고, 나란함이 필요해 회전을 잠가 시스-트랜스를 만든다.", "forms": [{"a": "O", "s": "시그마 결합은 오비탈이 머리를 맞대어, 파이 결합은 옆으로 겹쳐 형성된다."}, {"a": "O", "s": "이중 결합은 시그마 1개와 파이 1개, 삼중 결합은 시그마 1개와 파이 2개로 이루어진다."}, {"a": "X", "s": "삼중 결합은 시그마 결합 3개로 이루어진다."}, {"a": "X", "s": "단일 결합은 파이 결합 1개이다."}]}, {"c": "GC-061", "m": "결합 차수", "ol": "**차수 = (결합성 − 반결합성)/2.** 반결합성은 마디로 결합을 상쇄해 뺀다. O₂는 차수 2지만 π* 홀전자로 상자기성(루이스 패배), O₂⁺은 반결합성이 줄어 O₂보다 강하다.", "forms": [{"a": "O", "s": "결합 차수는 (결합성 전자 수 - 반결합성 전자 수)/2이다."}, {"a": "O", "s": "결합 차수가 클수록 결합이 강하고 결합 길이가 짧다."}, {"a": "X", "s": "결합 차수는 (결합성 전자 수 + 반결합성 전자 수)/2이다."}, {"a": "X", "s": "결합 차수가 0이면 그 분자는 안정하게 존재한다."}]}, {"c": "GC-039", "m": "이온화 에너지", "ol": "큰 흐름은 **오른쪽↑ 아래↓**, 예외는 **Be>B, N>O** 두 개. 이유는 **꽉 찬 2s·반쪽 찬 2p의 안정성** 하나로 설명된다.\n\n---\n*이 자료를 읽었으면, 같은 개념(GC-039)의 다른 문항으로 재시를 본다.*", "forms": [{"a": "O", "s": "이온화 에너지는 기체 상태 원자에서 전자 1개를 떼는 데 필요한 에너지이다."}, {"a": "O", "s": "같은 주기에서 오른쪽으로 갈수록 1차 이온화 에너지는 대체로 증가한다."}, {"a": "X", "s": "같은 족에서 아래로 갈수록 1차 이온화 에너지는 증가한다."}, {"a": "X", "s": "1차 이온화 에너지는 같은 주기에서 왼쪽으로 갈수록 커진다."}]}, {"c": "GC-041", "m": "전기음성도", "ol": "**오른쪽 위로 갈수록 ↑, 1등은 F.** 유효핵전하·크기가 정하는 파생 개념이고, 두 원자의 차이가 무극성·극성·이온을 가른다.", "forms": [{"a": "O", "s": "전기음성도는 같은 주기에서 오른쪽으로 갈수록 증가한다."}, {"a": "O", "s": "전기음성도는 공유 결합에서 원자가 전자쌍을 끌어당기는 능력의 척도이다."}, {"a": "X", "s": "전기음성도는 같은 족에서 아래로 갈수록 증가한다."}, {"a": "X", "s": "전기음성도는 같은 주기에서 왼쪽으로 갈수록 증가한다."}]}, {"c": "GC-022", "m": "스핀양자수", "ol": "**ms = ±1/2(두 값).** 스핀은 전자의 고유 양자 성질이고(슈테른-게를라흐로 확인), 전자가 페르미온이라 파울리로 이어져 오비탈당 반대 스핀 2개가 된다.", "forms": [{"a": "O", "s": "스핀 양자수 ms는 +1/2 또는 -1/2의 값을 가진다."}, {"a": "O", "s": "스핀 양자수는 전자의 자전 방향(스핀 상태)을 나타낸다."}, {"a": "X", "s": "스핀 양자수 ms는 0 또는 1의 값을 가진다."}, {"a": "X", "s": "스핀 양자수 ms는 -1부터 +1까지의 정수이다."}]}, {"c": "GC-023", "m": "양자수 범위", "ol": "**n≥1 → l: 0~n-1 → ml: -l~+l → ms: ±1/2.** 오비탈 (2l+1)·n², 전자 2n².", "forms": [{"a": "O", "s": "자기 양자수 ml은 -l부터 +l까지의 정수 값을 가진다."}, {"a": "O", "s": "방위 양자수 l은 0부터 n-1까지의 값을 가진다."}, {"a": "X", "s": "방위 양자수 l은 0부터 n까지의 값을 가진다."}, {"a": "X", "s": "자기 양자수 ml은 0부터 +l까지만 가진다."}]}, {"c": "GC-172", "m": "자유 에너지와 전위", "ol": "**ΔG° = -nFE°**(nF=총 전하, ×E°=일, −는 계가 일을 내줌). ΔG°=−RT ln K와 합치면 E°=(RT/nF)ln K라, E°·ΔG°·K는 같은 사실의 세 언어다.", "forms": [{"a": "O", "s": "자유 에너지와 전위의 관계는 ΔG° = -nFE°이다."}, {"a": "O", "s": "ΔG° = -nFE°에서 n은 이동한 전자의 몰수, F는 패러데이 상수이다."}, {"a": "X", "s": "자유 에너지와 전위의 관계는 ΔG° = +nFE°이다."}, {"a": "X", "s": "E°cell이 양수이면 ΔG°가 양수이다."}]}, {"c": "GC-085", "m": "삼투압", "ol": "**π = MRT**(진할수록·온도↑ 큼). 용매는 묽은 쪽 → 진한 쪽.", "forms": [{"a": "O", "s": "삼투압은 π = MRT(M은 몰농도, 반트호프 인자 = 1로 가정)로 나타낸다."}, {"a": "O", "s": "삼투는 용매가 반투막을 통해 묽은 쪽에서 진한 쪽으로 이동하는 현상이다."}, {"a": "X", "s": "삼투에서 용매는 진한 쪽에서 묽은 쪽으로 이동한다."},    그래서 화학Ⅰ 1회를 막 통과한 학생이 「심화 도전」을 누르면 후보 54개념
   중 44개(81%)가 18회까지 가야 배우는 것이었다 — 12문항 중 평균 열 개
   가까이가 안 배운 문제였다. 화학Ⅱ 1회 41%, 일반화학 1회 17%.

   심화는 «어려운 것» 이지 «안 배운 것» 이 아니다. 안 배운 것을 틀리게 하는
   건 도전이 아니라 그냥 모르는 것을 확인시키는 일이다.

   시험이 누적이므로 r회까지 배운 것 = 처음 등장한 회차가 r 이하인 개념이다.
   선수 과목(화학Ⅱ 학생에게 화학Ⅰ)은 이미 마쳤으므로 회차와 무관하게 낸다. */
function curRound(){
  var sp=new URLSearchParams(location.search);
  var r=parseInt(sp.get('round'),10);
  return (r>0)?r:null;
}
function curCourse(){
  var c=(new URLSearchParams(location.search).get('course')||'').toLowerCase();
  return PRECOURSE[c]?c:'';
}
/* 이 회차까지 낼 수 있는 개념. round 가 없으면 아무것도 안 고른다 —
   모르면서 «다 배웠다» 고 치는 것이 지금까지의 잘못이었다. */
function poolFor(course, round){
  var prefixes=PRECOURSE[course]||[], own=prefixes[0], pool=[];
  prefixes.forEach(function(p){ (CHALLENGE_BANK[p]||[]).forEach(function(cid){
    if(!cid.forms || !cid.forms.length) return;
    if(p===own){                                  // 지금 듣는 과목만 회차로 자른다
      var first=CHALLENGE_ROUND[cid.c];
      if(first==null || round==null || first>round) return;
    }
    var f=cid.forms[Math.floor(Math.random()*cid.forms.length)];
    pool.push({c:cid.c, m:cid.m, ol:cid.ol, a:f.a, s:f.s});
  }); });
  return pool;
}
function pickQuestions(){
  var pool=poolFor(curCourse(), curRound());
  // 개념 중복 없이 섞어서 최대 12개. 모자라면 **모자란 채로** 낸다.
  shuffle(pool);
  var seen={}, out=[];
  for(var i=0;i<pool.length && out.length<12;i++){ if(!seen[pool[i].c]){ seen[pool[i].c]=1; out.push(pool[i]); } }
  return out;
}
/* 옛 링크에는 회차가 없다(이미 학생들에게 나갔다). 그때는 지어내지 않고
   묻는다 — 한 번 누르면 되고, 안 배운 문제는 안 나온다. */
function roundPickHTML(course){
  var last=COURSE_LAST[course]||0, n=[];
  for(var r=1;r<=last;r++) n.push('<button class="rpick" onclick="goRound('+r+')">'+r+'회</button>');
  return '<div class="card intro"><span class="badgeA">A밴드 · 심화</span>'
    +'<h1>어디까지 배웠나요?</h1>'
    +'<p class="lede">배운 데까지만 냅니다. 아직 안 배운 단원은 나오지 않아요. '
    +'가장 최근에 <b>본 시험 회차</b>를 눌러 주세요.</p>'
    +'<div class="rpicks">'+n.join('')+'</div></div>';
}
function goRound(r){
  var sp=new URLSearchParams(location.search); sp.set('round', r);
  location.search=sp.toString();
}

function start(){ S.qs=pickQuestions(); S.ans=S.qs.map(function(){return null;}); S.graded=false; S.view='quiz'; render(); window.scrollTo(0,0); }
function retryWrong(){ var w=S.qs.filter(function(q,i){return S.ans[i]!==q.a;}); if(!w.length){start();return;} shuffle(w); S.qs=w; S.ans=w.map(function(){return null;}); S.graded=false; S.view='quiz'; render(); window.scrollTo(0,0); }
function answer(i,v){ if(S.graded) return; S.ans[i]=v; render(); }
function allAnswered(){ return S.ans.every(function(a){return a!=null;}); }
function submit(){ S.graded=true; S.view='result'; render(); window.scrollTo(0,0); }

function render(){
  var h='';
  if(S.view==='intro'){
    var course=curCourse(), round=curRound();
    if(!course || !round) { $('#app').innerHTML=roundPickHTML(course||'ch1'); return; }
    var n=poolFor(course, round).filter(function(q,i,a){
      return a.findIndex(function(x){return x.c===q.c;})===i; }).length;
    var many=Math.min(n,12);
    h='<div class="card intro"><span class="badgeA">A밴드 · 심화</span>'
      +'<h1>한 단계 위 문제에 도전</h1>'
      +'<p class="lede">평소보다 까다로운 심화 문항 '+many+'개입니다. 틀려도 괜찮아요. 어디까지 닿는지 확인하고, 막힌 곳은 새로 배우는 기회로 삼으면 됩니다.</p>'
      /* 「배운 데까지만」 을 화면에 적는다. 적어 두면 학생이 «안 배운 게 나왔다»
         고 느낄 때 그것이 진짜인지 아닌지 서로 확인할 수 있다. */
      +'<p class="scope"><b>'+round+'회까지 배운 범위</b>에서만 냅니다. 아직 안 배운 단원은 나오지 않아요.</p>'
      +(n<12 ? '<p class="scope thin">지금 회차까지 배운 심화 개념이 '+n+'개라 '+many+'문항입니다. '
             + '회차가 쌓이면 문항도 늘어납니다.</p>' : '')
      +(n===0 ? '<p class="scope thin">아직 심화로 낼 만한 개념이 없습니다. 다음 회차에 다시 오세요.</p>'
              : '<div style="margin-top:16px"><button class="btn" onclick="start()">도전 시작</button></div>')
      +'</div>';
  } else if(S.view==='quiz'){
    var done=S.ans.filter(function(a){return a!=null;}).length;
    var pct=Math.round(100*done/S.qs.length);
    h='<div class="card"><h2>심화 도전 · '+S.qs.length+'문항</h2>'
      +'<div class="prog"><div class="pbar"><i style="width:'+pct+'%"></i></div><span class="pt">'+done+'/'+S.qs.length+'</span></div>'
      +S.qs.map(function(q,i){return '<div class="q"><div class="qn">Q'+(i+1)+'</div><div class="qs">'+q.s+'</div>'
        +'<div class="ox"><button class="o '+(S.ans[i]==='O'?'sel':'')+'" onclick="answer('+i+',\'O\')">O</button>'
        +'<button class="x '+(S.ans[i]==='X'?'sel':'')+'" onclick="answer('+i+',\'X\')">X</button></div></div>';}).join('')
      +'<div style="margin-top:16px"><button class="btn" '+(allAnswered()?'':'disabled')+' onclick="submit()">'+(allAnswered()?'채점하기':'모든 문항에 답하면 채점')+'</button></div></div>';
  } else if(S.view==='result'){
    var correct=0, wrongMis=[]; S.qs.forEach(function(q,i){ if(S.ans[i]===q.a){correct++;} else if(wrongMis.indexOf(q.m)<0){wrongMis.push(q.m);} });
    var nWrong=S.qs.length-correct;
    var pct=Math.round(100*correct/S.qs.length);
    var msg = pct>=80?'대단합니다. 심화 문제도 탄탄하게 잡고 있어요.'
            : pct>=50?'잘하고 있어요. 심화에서도 절반 이상을 맞혔습니다.'
            : '여기까지 도전한 것만으로 충분합니다. 틀린 문항은 새로 배우는 기회예요.';
    h='<div class="card result"><span class="badgeA">A밴드 · 결과</span>'
      +'<div class="score">'+correct+' / '+S.qs.length+'</div>'
      +'<div class="smsg">'+msg+'</div><div class="snote">정답률 '+pct+'%</div></div>';
    if(wrongMis.length){
      h+='<div class="card reviewbox"><h2>복습하면 좋을 개념</h2>'
        +'<p class="lede" style="margin:-2px 0 10px">아래 개념을 한 번 더 짚으면 다음엔 더 멀리 갑니다.</p>'
        +'<div class="mchips">'+wrongMis.map(function(m){return '<span class="mchip">'+m+'</span>';}).join('')+'</div></div>';
    }
    h+='<div class="card"><h2>문항별 확인</h2>'
      +S.qs.map(function(q,i){var ok=S.ans[i]===q.a;
        return '<div class="q"><div class="qn">Q'+(i+1)+' · '+(ok?'정답':'오답')+'<span class="qmis">'+q.m+'</span></div><div class="qs">'+q.s+'</div>'
          +'<div class="fb '+(ok?'ok':'no')+'"><span class="cor">정답: '+q.a+'</span>'+(q.ol?' · '+q.ol.replace(/\*\*(.+?)\*\*/g,'$1'):'')+'</div></div>';}).join('')
      +'</div>'
      +(nWrong?'<button class="btn" onclick="retryWrong()">틀린 '+nWrong+'문항만 다시 풀기</button>':'')
      +'<button class="ghost" onclick="start()">새 문항으로 다시 도전</button>';
  }
  $('#app').innerHTML=h;
}
render();
</script></body></html>

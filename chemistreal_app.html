<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chemistreal · 채점과 진단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --surface:#FFFFFF; --ink:#16202E; --sub:#5F6D7C; --faint:#626D7B;
  --line:#E7E8E2; --line2:#EEF0EA;
  --teal:#0B6E6E; --teal-d:#0A5A5A; --teal-soft:#E4F0EF; --teal-line:#BFE0DD;
  --o:#1B8A4C; --o-bg:#E7F5EC; --x:#C0392B; --x-bg:#FBEBE9;
  --brass:#A9853C; --brass-soft:#F5EEDF;
  --shadow:0 1px 2px rgba(16,32,46,.04), 0 6px 20px rgba(16,32,46,.04);
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:'Pretendard',system-ui,-apple-system,sans-serif; color:var(--ink); background:var(--paper);
  line-height:1.55; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-feature-settings:"tnum"}
.wrap{max-width:720px; margin:0 auto; padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
/* header */
header{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--paper) 88%, transparent); backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line)}
.hd{max-width:720px; margin:0 auto; padding:11px 14px calc(11px + env(safe-area-inset-top)) 14px; display:flex; align-items:center; gap:10px}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(150deg,var(--teal),var(--teal-d));position:relative;flex:none}
.logo:after{content:"";position:absolute;inset:7px 7px auto auto;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.brand{font-weight:800;letter-spacing:-.01em;font-size:15.5px}
.brand small{display:block;font-weight:500;color:var(--sub);font-size:11.5px;letter-spacing:.01em;margin-top:-2px}
.testbadge{margin-left:auto;font-size:11.5px;color:#fff;background:var(--brass);border-radius:30px;padding:3px 10px;display:none;font-weight:600}
/* reaction-coordinate stepper */
.steps{max-width:720px;margin:0 auto;padding:0 12px 9px;display:flex;gap:0;align-items:center;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--faint)}
.step .lb{font-size:11.5px;color:var(--faint);white-space:nowrap}
.step .seg{width:14px;height:1.5px;background:var(--line);margin:0 5px}
.step.on .dot{background:var(--teal);border-color:var(--teal);color:#fff}
.step.on .lb{color:var(--teal);font-weight:700}
.step.past .dot{background:var(--teal-soft);border-color:var(--teal-line);color:var(--teal)}
/* cards & type */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:13px 0;box-shadow:var(--shadow)}
h1{font-size:21px;letter-spacing:-.02em;margin:.1em 0 .15em}
.lede{color:var(--sub);font-size:13.5px;margin:.3em 0 1.1em}
.plink{margin-top:16px;padding:13px 15px;background:var(--o-bg);border-radius:12px}
.pll{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px}.pll .muted{font-weight:400}
.plurl{font-size:11.5px;color:var(--o);word-break:break-all;background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-bottom:10px;line-height:1.45}
h2{font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--teal);font-weight:700;margin:1.5em 0 .5em;display:flex;align-items:center;gap:7px}
h2:before{content:"";width:14px;height:2px;background:var(--teal);border-radius:2px}
label{display:block;font-size:12px;color:var(--sub);margin:13px 0 5px;font-weight:600}
input,select{width:100%;padding:12px 13px;font-size:16px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.row2{display:flex;gap:10px}.row2>div{flex:1}
/* buttons */
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-size:15px;font-weight:700;padding:13px 16px;background:var(--teal);color:#fff;transition:transform .04s,filter .15s}
button:active{transform:translateY(1px)} button:hover{filter:brightness(1.05)}
button.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:600}
button.ghost:hover{border-color:var(--teal);color:var(--teal);filter:none}
button.ok{background:var(--o)} button:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btnrow{display:flex;gap:10px;margin-top:18px}.btnrow button{flex:1}
.toggle{display:flex;align-items:center;gap:11px;margin-top:15px;padding:12px 13px;border:1.5px dashed var(--line);border-radius:11px;font-size:12.5px;color:var(--sub)}
.toggle input{width:18px;height:18px;flex:none}
.muted{color:var(--faint);font-size:12px} .note{color:var(--sub);font-size:12px;margin-top:10px}
/* course tabs + round grid */
.tabs{display:flex;gap:6px;margin:4px 0 14px;background:var(--line2);padding:4px;border-radius:12px}
.tabs button{flex:1;background:transparent;color:var(--sub);font-size:13px;font-weight:600;padding:9px 4px;border-radius:9px}
.tabs button.sel{background:var(--surface);color:var(--teal);box-shadow:var(--shadow)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.rchip{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:700;color:var(--ink);gap:2px}
.rchip:hover{border-color:var(--teal);color:var(--teal)} .rchip .n{font-size:18px} .rchip .u{font-size:11.5px;color:var(--faint);font-weight:500}
/* pdf */
.pdfbtn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:600;margin:9px 0;padding:14px}
.pdfbtn:hover{border-color:var(--teal-line);filter:none}
.pdfbtn .ic{width:38px;height:38px;border-radius:10px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;font-family:'JetBrains Mono',monospace}
.pdfbtn small{color:var(--faint);font-weight:500}
/* grading instrument */
.gradehead{position:sticky;top:84px;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.gradehead .cnt{font-size:18px;font-weight:800} .gradehead .of{color:var(--faint);font-size:13px}
.bar{flex:1;height:7px;background:var(--line2);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);transition:width .2s}
.focusq{background:var(--surface);border:1.5px solid var(--teal-line);border-radius:16px;padding:18px;margin:14px 0;text-align:center;box-shadow:var(--shadow)}
.focusq .qnum{font-size:12px;color:var(--teal);font-weight:700}
.focusq .stmt{font-size:16.5px;line-height:1.5;margin:10px 0 16px;min-height:1.5em}
.oxbtns{display:flex;gap:12px}.oxbtns button{flex:1;padding:20px 0;font-size:22px;font-weight:800;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--sub)}
.oxbtns button.o:hover,.oxbtns button.o.sel{background:var(--o-bg);color:var(--o);border-color:var(--o)}
.oxbtns button.x:hover,.oxbtns button.x.sel{background:var(--x-bg);color:var(--x);border-color:var(--x)}
.entrywrap{display:flex;align-items:center;gap:14px;justify-content:center;margin:8px 0 2px}
.entry{width:92px;height:82px;text-align:center;font-size:38px;font-weight:800;border:2px solid var(--teal-line);border-radius:16px;background:var(--surface);color:var(--ink);caret-color:var(--teal)}
.entry:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.curval{width:82px;height:82px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:800;background:var(--line2);color:var(--faint)}
.curval.o{background:var(--o-bg);color:var(--o)} .curval.x{background:var(--x-bg);color:var(--x)}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:16px 0}
.dot2{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--faint);cursor:pointer;background:var(--surface)}
.dot2.o{background:var(--o-bg);color:var(--o);border-color:var(--o-bg)} .dot2.x{background:var(--x-bg);color:var(--x);border-color:var(--x-bg)}
.dot2.cur{outline:2px solid var(--teal);outline-offset:1px}
.hint{font-size:11.5px;color:var(--faint);text-align:center;margin:10px 0}
.hint kbd{font-family:'JetBrains Mono',monospace;background:var(--line2);border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--ink)}
/* report */
.scorewrap{display:flex;align-items:flex-end;gap:14px;margin:4px 0 2px}
.scorewrap .big{font-size:54px;font-weight:800;line-height:.9;letter-spacing:-.03em}
.scorewrap .denom{color:var(--faint);font-size:14px;margin-bottom:6px}
.verdict{font-size:13px;font-weight:700;padding:5px 13px;border-radius:30px;margin-bottom:7px}
.verdict.p{background:var(--o-bg);color:var(--o)} .verdict.f{background:var(--x-bg);color:var(--x)}
.level{height:9px;background:var(--line2);border-radius:9px;overflow:hidden;margin:14px 0 4px;position:relative}
.level i{display:block;height:100%;border-radius:9px} .level .pass{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.4}
.lvlnote{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line2)}
.kv:last-child{border-bottom:0} .kv .r{color:var(--sub);font-size:12.5px}
.axiscard{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin:7px 0}
.axiscard .ax{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:13px;color:#fff;background:var(--teal);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.axiscard .axn{font-size:13px;font-weight:600;flex:1} .axiscard .axr{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--x);font-weight:700}
.ubar{display:flex;align-items:center;gap:10px;margin:7px 0}.ubar .un{font-size:12.5px;width:84px;flex:none;color:var(--ink)}
.ubar .ut{flex:1;height:8px;background:var(--line2);border-radius:8px;overflow:hidden}.ubar .ut i{display:block;height:100%;background:var(--teal);border-radius:8px}
.ubar .uv{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--sub);width:54px;text-align:right;flex:none}
.ladder{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.lstep{font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 11px;border-radius:30px;border:1px solid var(--line);color:var(--sub)}
.lstep.p{background:var(--o-bg);color:var(--o);border-color:var(--o-bg)} .lstep.f{background:var(--x-bg);color:var(--x);border-color:var(--x-bg)}
/* gate */
.gate{border:1.5px solid var(--line);border-radius:14px;padding:15px;margin:11px 0;transition:border-color .2s}
.gate.done{border-color:var(--o);background:var(--o-bg)}
.gate .gt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:4px}
.gate .gu{font-size:11.5px;color:var(--faint);font-weight:500}
.gate .badge{margin-left:auto;font-size:11.5px;font-weight:700} .gate .badge.lock{color:var(--faint)} .gate .badge.ok{color:var(--o)}
.gprog{display:flex;align-items:center;gap:10px;margin:0 0 10px;position:sticky;top:0;z-index:5;background:var(--surface);padding:10px 0 8px}
.gpbar{flex:1;height:9px;background:var(--line);border-radius:6px;overflow:hidden}
.gpbar i{display:block;height:100%;background:var(--o);border-radius:6px;transition:width .3s}
.gpt{font-size:12px;font-weight:700;color:var(--o);white-space:nowrap}
.gencourage{font-size:12.5px;color:var(--o);background:var(--o-bg);border-radius:9px;padding:9px 13px;margin:0 0 14px;font-weight:600;line-height:1.45}
.cqstage{font-size:11.5px;font-weight:700;color:var(--teal);margin:9px 0 3px;letter-spacing:.02em}
.feedback{background:var(--x-bg);border:1px solid var(--x);border-radius:10px;padding:11px 13px;margin-top:9px;font-size:13px;line-height:1.5}
.gdone{font-size:12.5px;color:var(--o);font-weight:600;margin-top:6px}
button.ghost.sm{padding:7px 14px;font-size:12.5px;margin-top:9px;width:auto}
.reading{background:var(--surface);border:1px solid var(--line2);border-left:3px solid var(--teal);border-radius:9px;padding:11px 13px;margin:9px 0;font-size:13px;color:#2b3744}
.reading .lab{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--teal);font-weight:700;letter-spacing:.04em;display:block;margin-bottom:3px}
.reading b{color:var(--ink)}
.rlayer{padding:7px 0;border-bottom:1px solid var(--line2)}.rlayer:last-child{border-bottom:0;padding-bottom:0}.rlayer:first-child{padding-top:0}
.rlayer.kill{color:#8E4B2F}.rlayer.kill .lab{color:#B5651D}
.rlayer.one .lab{color:var(--brass)}
.dcfig{margin:9px 0 4px;padding:8px 4px;background:#FCFCFA;border:1px solid var(--line2);border-radius:8px}.dcfig svg{width:100%;height:auto;max-height:150px;display:block}
.gatedivider{margin:16px 0 10px;font-size:11.5px;color:var(--sub);text-align:center;border-top:1px dashed var(--line);padding-top:12px}
.gatedivider span{display:block;font-weight:700;color:var(--brass);font-size:13px;margin-bottom:2px}
.retrieval{font-size:12px;color:var(--brass);background:var(--brass-soft,#F5EEDF);border-radius:8px;padding:8px 11px;margin:8px 0 6px;font-weight:600}
.cq{font-size:14px;margin:11px 0 8px} .cq b{color:var(--teal)}
.again{font-size:11.5px;color:var(--x);margin-left:9px;align-self:center}
/* done */
.hero{text-align:center;padding:18px 0 6px}
.hero .seal{width:62px;height:62px;border-radius:50%;background:var(--o-bg);color:var(--o);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px;border:2px solid var(--o)}
.hero h1{font-size:25px} .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 11px;border-radius:30px;background:var(--line2);color:var(--sub);margin:3px}
.resume{background:var(--brass-soft);border:1px solid #E9DcC0;border-radius:12px;padding:12px 14px;margin:0 0 12px;display:flex;align-items:center;gap:12px;font-size:13px}
.resume button{padding:8px 13px;font-size:13px;background:var(--brass)} .resume .x{background:transparent;color:var(--sub);padding:8px;font-weight:600}
.loading{text-align:center;padding:40px 0;color:var(--faint);font-size:13px}
</style></head>
<body>
<header>
  <div class="hd"><div class="logo"></div><div class="brand">Chemistreal<small>올림피아드 화학 · 채점과 진단</small></div><span class="testbadge" id="testBadge">테스트 모드</span></div>
  <div class="steps" id="steps"></div>
</header>
<div class="wrap"><div id="app"></div></div>

<script>/* ============================================================
   Chemistreal 채점·진단·재시 로직 엔진 (Phase 2)
   - 순수 함수만. DOM·네트워크 없음. Node와 브라우저에서 동일 동작.
   - 여기서 테스트 통과한 코드가 그대로 앱(Phase 4)에 들어간다.
   ============================================================ */
(function (root) {
  'use strict';

  // ---------- 공통 유틸 ----------
  function norm(s) {            // 문장 정규화(공백·괄호 미세차 흡수) → 중복 판별용
    return (s || '').replace(/\s+/g, '').replace(/（/g, '(').replace(/）/g, ')').trim();
  }
  function cleanName(s) { return (s || '').replace(/\s+/g, '').trim(); }

  // ---------- 1) 학생키: 이름+학교 (학년은 키에서 제외, 속성으로만) ----------
  function studentKey(name, school) {
    return cleanName(school) + '-' + cleanName(name);   // 예: 휘문중-홍길동
  }

  // ---------- 2) 5대 통합축 매핑 (보너스 진단층; 단원·오개념 그룹이 본체) ----------
  // unit + mis 텍스트를 함께 스캔. 매칭 없으면 null (리포트는 단원/오개념으로 폴백).
  var AXES = [
    { key: 'A1', name: '에너지·자발성·평형 (ΔG=ΔH−TΔS=−nFE°=−RT ln K)',
      kw: ['열역학','자발','엔트로피','전기화학','화학평형','평형','엔탈피','깁스','헤스','전지','전기분해','반응열'] },
    { key: 'A3', name: '결합·극성·산화수 (전기음성도 장부)',
      kw: ['전기음성도','산화수','산화','환원','결합','극성','루이스','이온화에너지'] },
    { key: 'A5', name: '원자구조→주기율표 (파울리→부껍질 용량)',
      kw: ['양자','오비탈','전자배치','전자 배치','주기율','부껍질','바닥상태','들뜬','원자 모형','원자모형'] },
    { key: 'A2', name: '분자 운동·반응 속도 (볼츠만 분포)',
      kw: ['반응속도','반응 속도','속도','활성화','촉매','충돌','기체','이상기체','실제기체','분압','분자 운동','확산'] },
    { key: 'A4', name: '동적 평형·상·용액 (증발↔응축↔용해)',
      kw: ['증기압','증발','액체','고체','총괄성','용해','농도','분자간','분자 간','상평형','포화'] }
  ];
  function axisOf(unit, mis) {
    var hay = (unit || '') + ' ' + (mis || '');
    for (var i = 0; i < AXES.length; i++) {
      for (var j = 0; j < AXES[i].kw.length; j++) {
        if (hay.indexOf(AXES[i].kw[j]) !== -1) return AXES[i];
      }
    }
    return null;
  }
  function axisName(key) { for (var i=0;i<AXES.length;i++) if (AXES[i].key===key) return AXES[i].name; return key; }

  // ---------- 3) 채점 ----------
  // studentAnswers: ['O'|'X'|''] 길이 = keyItems.length (보통 60)
  // keyItems: 정시 items [{n,u,mis,a,s,f,w,lvl,c}]
  // scoring: {per, max, pass}
  function gradeAttempt(studentAnswers, keyItems, scoring) {
    var per = (scoring && scoring.per) || (100 / keyItems.length);
    var passScore = (scoring && scoring.pass) != null ? scoring.pass : 80;
    var perItem = [], correct = 0, blank = 0;
    for (var i = 0; i < keyItems.length; i++) {
      var it = keyItems[i];
      var sa = (studentAnswers[i] || '').toUpperCase();
      var isBlank = (sa !== 'O' && sa !== 'X');
      var ok = (!isBlank && sa === String(it.a).toUpperCase());
      if (ok) correct++;
      if (isBlank) blank++;
      perItem.push({
        idx: i, id: it.n, c: it.c || null, unit: it.u, mis: it.mis,
        lvl: it.lvl || 1, studentAns: isBlank ? '' : sa, correctAns: it.a,
        ok: ok, blank: isBlank, f: it.f, w: it.w
      });
    }
    var scoreRaw = correct * per;
    var score = Math.round(scoreRaw * 10) / 10;       // 표시용 소수1
    var pass = scoreRaw >= passScore - 1e-6;
    return {
      n: keyItems.length, correctCount: correct, blankCount: blank,
      wrongCount: keyItems.length - correct - blank,
      score: score, scoreInt: Math.round(scoreRaw), max: (scoring && scoring.max) || 100,
      passScore: passScore, pass: pass, perItem: perItem
    };
  }

  // 채점결과 → 교정 필요 개념(틀림 또는 미기입). cid 없으면 문항 자체 정보로 폴백.
  function notCorrectConcepts(graded) {
    var seenCid = {}, out = [];
    graded.perItem.forEach(function (p) {
      if (p.ok) return;                         // 맞은 건 제외
      var keyC = p.c || ('NOID:' + p.idx);      // cid 없으면 문항별 폴백키
      if (seenCid[keyC]) { seenCid[keyC].count++; return; }
      var rec = { c: p.c || null, unit: p.unit, mis: p.mis, lvl: p.lvl,
                  f: p.f, w: p.w, count: 1, blank: p.blank };
      seenCid[keyC] = rec; out.push(rec);
    });
    return out;
  }

  // ---------- 4) 진단 (단발 1회차) ----------
  function diagnose(graded, formsBank) {
    formsBank = formsBank || {};
    var byUnit = {}, byMis = {}, byAxis = {};
    graded.perItem.forEach(function (p) {
      // 단원별
      var u = byUnit[p.unit] || (byUnit[p.unit] = { unit: p.unit, total: 0, wrong: 0 });
      u.total++; if (!p.ok) u.wrong++;
      // 축별
      var ax = axisOf(p.unit, p.mis);
      if (ax) {
        var a = byAxis[ax.key] || (byAxis[ax.key] = { key: ax.key, name: ax.name, total: 0, wrong: 0 });
        a.total++; if (!p.ok) a.wrong++;
      }
      // 오개념별 (틀린 것만 집계)
      if (!p.ok) {
        var m = byMis[p.mis] || (byMis[p.mis] = { mis: p.mis, unit: p.unit, count: 0, cids: [] });
        m.count++; if (p.c && m.cids.indexOf(p.c) === -1) m.cids.push(p.c);
      }
    });
    // 교정 개념 + 강의록 부착
    var wrongConcepts = notCorrectConcepts(graded).map(function (w) {
      var reading = (w.c && formsBank[w.c] && formsBank[w.c].reading) ? formsBank[w.c].reading : null;
      return { c: w.c, unit: w.unit, mis: w.mis, lvl: w.lvl, blank: w.blank,
               reading: reading, fix: w.f, why: w.w,
               hasReading: !!(reading && (reading.oneline || reading.core)) };
    });
    function toSortedArr(obj, rateBase) {
      return Object.keys(obj).map(function (k) {
        var o = obj[k]; if (rateBase) o.rate = o.total ? Math.round(100 * o.wrong / o.total) : 0; return o;
      }).sort(function (a, b) { return (b.wrong||b.count) - (a.wrong||a.count); });
    }
    return {
      score: graded.score, pass: graded.pass, passScore: graded.passScore,
      correctCount: graded.correctCount, wrongCount: graded.wrongCount, blankCount: graded.blankCount,
      byUnit: toSortedArr(byUnit, true),
      byMisconception: toSortedArr(byMis, false),
      byAxis: toSortedArr(byAxis, true),
      wrongConcepts: wrongConcepts
    };
  }

  // ---------- 5) 읽음 확인 게이트 ----------
  // wrongConcepts: diagnose의 wrongConcepts
  // 각 개념: 강의록(있으면) + 확인질문(아직 안 본 다른 form O/X) 1개. 없으면 폴백(옳은문장 재확인).
  function buildGate(wrongConcepts, formsBank, seenStatements) {
    formsBank = formsBank || {}; seenStatements = seenStatements || {};
    var gates = [];
    wrongConcepts.forEach(function (w) {
      var checks = [], fallback = false;
      if (w.c && formsBank[w.c] && formsBank[w.c].forms) {
        var fresh = formsBank[w.c].forms.filter(function (fm) { return !seenStatements[norm(fm.s)]; });
        for (var i = 0; i < 2 && i < fresh.length; i++) { var p = fresh[i]; checks.push({ s: p.s, a: p.a, f: p.f, w: p.w }); seenStatements[norm(p.s)] = 1; }
        if (checks.length < 2) {          // 새 문장 부족 → 본 적 있는 form으로 2단 채움
          var more = formsBank[w.c].forms.filter(function (fm) { return !checks.some(function (c) { return norm(c.s) === norm(fm.s); }); });
          for (var j = 0; checks.length < 2 && j < more.length; j++) { checks.push({ s: more[j].s, a: more[j].a, f: more[j].f, w: more[j].w }); }
        }
      }
      if (!checks.length) {               // 폴백: cid 없거나 form 없음 → 옳은 문장 재확인(정답 O)
        fallback = true;
        var cf = { s: w.fix || w.mis, a: 'O', f: w.fix, w: w.why };
        checks.push(cf); seenStatements[norm(cf.s)] = 1;
      }
      gates.push({
        c: w.c, unit: w.unit, mis: w.mis,
        reading: w.reading || null, hasReading: w.hasReading,
        checks: checks, check: checks[0], fallback: fallback
      });
    });
    return { gates: gates, seenStatements: seenStatements };
  }

  // ---------- 6) 재시 생성 (점점 쉽게 + 개별화) ----------
  // attemptNo: 2=재시, 3=재재시  (정시=1)
  // cbandVersions: round.retakeC = [{v,items:[{c,u,a,s,f,w}]}...] (C=기본, 더 쉬움)
  // wrongCids: 직전 시도에서 틀린 개념 cid 집합(객체/배열)
  // formsBank: 개별화용 대체 form 소스
  // seenStatements: 이미 학생이 본 문장(중복 방지) · 갱신해서 반환
  function buildRetake(attemptNo, cbandVersions, wrongCids, formsBank, seenStatements, wrongStmts) {
    formsBank = formsBank || {}; seenStatements = seenStatements || {}; wrongStmts = wrongStmts || {};
    var wrong = {};
    (Array.isArray(wrongCids) ? wrongCids : Object.keys(wrongCids || {})).forEach(function (c) { if (c) wrong[c] = 1; });
    if (!cbandVersions || !cbandVersions.length) return { items: [], seenStatements: seenStatements, n: 0 };
    var base = cbandVersions[Math.min(attemptNo - 2, cbandVersions.length - 1)].items;

    var usedThis = {};                 // 이 시도에서 쓴 문장 → 한 시험 안 중복 절대 방지
    var subCids = base.map(function (it) { return it.c; }).filter(function (c, i, a) { return c && a.indexOf(c) === i; }); // 대체용 범위 내 개념
    function avail(fb, fn) { return (fb && fb.forms && fb.forms.length ? fb.forms : []).find(fn); }
    function nwFresh(fb) { return avail(fb, function (fm) { return !usedThis[norm(fm.s)] && !seenStatements[norm(fm.s)] && !wrongStmts[norm(fm.s)]; }); }
    function nwUnused(fb) { return avail(fb, function (fm) { return !usedThis[norm(fm.s)] && !wrongStmts[norm(fm.s)]; }); }
    function subForm() {                // D9: 다른 범위 내 개념에서 안 본·안 틀린 form (재노출 0 보장)
      for (var i = 0; i < subCids.length; i++) { var sfb = formsBank[subCids[i]]; var ff = nwFresh(sfb) || nwUnused(sfb);
        if (ff) return { c: subCids[i], a: ff.a, s: ff.s, f: ff.f, w: ff.w }; }
      return null;
    }
    var items = base.map(function (it) {
      var fb = formsBank[it.c];
      var orig = { c: it.c, a: it.a, s: it.s, f: it.f, w: it.w };
      var pick, subbed = false, p;
      if (wrong[it.c]) {
        // 틀린 개념: 새 문장 우선, 학생이 틀린 문장은 절대 재노출 안 함
        p = nwFresh(fb) || nwUnused(fb);
        if (p) pick = { c: it.c, a: p.a, s: p.s, f: p.f, w: p.w };
      } else {
        // 맞힌 개념: 원본 유지(form 절약), 충돌 시에만 비오답 form으로
        if (!usedThis[norm(orig.s)] && !wrongStmts[norm(orig.s)]) pick = orig;
        else { p = nwUnused(fb); if (p) pick = { c: it.c, a: p.a, s: p.s, f: p.f, w: p.w }; }
      }
      if (!pick) { var sub = subForm(); if (sub) { pick = sub; subbed = true; } }  // 소진 → 범위 내 다른 개념으로 대체
      if (!pick) pick = orig;                                                       // 최후(이론상 도달 안 함)
      usedThis[norm(pick.s)] = 1; seenStatements[norm(pick.s)] = 1;
      var pfb = formsBank[pick.c];
      var mis = (pfb && pfb.m) || (fb && fb.m) || '';
      return { c: pick.c, u: it.u, mis: mis, a: pick.a, s: pick.s, f: pick.f, w: pick.w,
               targeted: !!wrong[it.c] && !subbed, substituted: subbed,
               swapped: norm(pick.s) !== norm(it.s), reusedWrong: !!wrongStmts[norm(pick.s)] };
    });
    return { items: items, seenStatements: seenStatements, n: items.length };
  }

  // ---------- 7) 누적 (학생 단위, 미응시는 생략, null-safe) ----------
  // rows: 제출 기록 배열. 각 row:
  //   {studentKey, name, school, year, course, round, attempt('정시'|'재시'|'재재시'),
  //    score, pass(bool), date, wrongMis:[..], wrongAxes:{key:count}, isTest(bool)}
  // 반환: {studentKey: {info, trend[], chronicMis[], axisWeak[], roundsTaken[], coverageRound, attemptsTotal}}
  function cumulative(rows) {
    rows = rows || [];
    var byStu = {};
    rows.forEach(function (r) {
      var k = r.studentKey || studentKey(r.name, r.school);
      (byStu[k] || (byStu[k] = [])).push(r);
    });

    var out = {};
    Object.keys(byStu).forEach(function (k) {
      var rs = byStu[k];
      // 회차별 묶기 (course+round)
      var rounds = {};
      rs.forEach(function (r) {
        var rk = r.course + '#' + r.round;
        (rounds[rk] || (rounds[rk] = { course: r.course, round: r.round, attempts: [] })).attempts.push(r);
      });
      // trend: 실제로 본 회차만, round 순. (미응시 회차는 애초에 키가 없어 자동 생략)
      var trend = Object.keys(rounds).map(function (rk) {
        var R = rounds[rk];
        R.attempts.sort(function (a, b) { return order(a.attempt) - order(b.attempt); });
        var jeong = R.attempts.find(function (a) { return a.attempt === '정시'; });
        var last = R.attempts[R.attempts.length - 1];
        var passedAny = R.attempts.some(function (a) { return a.pass; });
        return {
          course: R.course, round: R.round,
          jeongsiScore: jeong ? jeong.score : null,
          finalScore: last ? last.score : null,
          finalAttempt: last ? last.attempt : null,
          attemptsCount: R.attempts.length,
          passed: passedAny,
          date: last ? last.date : null
        };
      }).sort(function (a, b) {
        if (a.course !== b.course) return a.course < b.course ? -1 : 1;
        return a.round - b.round;
      });

      // 고질 오개념: 서로 다른 회차에서 반복해서 틀린 것 (≥2회차)
      var misRounds = {};
      rs.forEach(function (r) {
        (r.wrongMis || []).forEach(function (m) {
          (misRounds[m] || (misRounds[m] = {}))[r.course + '#' + r.round] = 1;
        });
      });
      var chronic = Object.keys(misRounds).map(function (m) {
        return { mis: m, rounds: Object.keys(misRounds[m]).length };
      }).filter(function (x) { return x.rounds >= 2; })
        .sort(function (a, b) { return b.rounds - a.rounds; });

      // 축별 누적 약점
      var axis = {};
      rs.forEach(function (r) {
        var wa = r.wrongAxes || {};
        Object.keys(wa).forEach(function (ak) { axis[ak] = (axis[ak] || 0) + wa[ak]; });
      });
      var axisWeak = Object.keys(axis).map(function (ak) {
        return { key: ak, name: axisName(ak), wrong: axis[ak] };
      }).sort(function (a, b) { return b.wrong - a.wrong; });

      var roundsTaken = trend.map(function (t) { return t.course + t.round; });
      var coverageRound = trend.length ? trend[trend.length - 1].round : 0;  // 최근 응시 회차 = 누적 범위
      var attemptsTotal = rs.length;
      var info = { name: rs[0].name, school: rs[0].school, yearLatest: latestYear(rs) };

      out[k] = {
        info: info, trend: trend, chronicMis: chronic, axisWeak: axisWeak,
        roundsTaken: roundsTaken, roundsTakenCount: trend.length,
        coverageRound: coverageRound, attemptsTotal: attemptsTotal,
        passedRounds: trend.filter(function (t) { return t.passed; }).length
      };
    });
    return out;
  }
  function order(att) { return (att === '정시' || att === '첫번째시험' || att === '이번주 테스트' || att === '첫 응시') ? 0 : att === '재시' ? 1 : 2; }
  function latestYear(rs) {
    var y = null, d = '';
    rs.forEach(function (r) { if (r.date && r.date > d) { d = r.date; y = r.year; } });
    return y != null ? y : (rs[0] ? rs[0].year : null);
  }

  /* ---------- 간격 반복 ----------
     "복습 시점" 이라고 적어 놓고 **시점 설계가 없었다.** 과거에 한 번이라도
     틀린 개념을 회차마다 그대로 다시 늘어놓았다. 그러면 목록이 계속 길어지고,
     길어지면 안 읽힌다.

     왜 필요한가 — 재어 보니 이렇다. 한 개념을 틀린 뒤 **정시에서 다시 만날
     때까지**:

         화학Ⅰ 882짝 중 390(44%) · 화학Ⅱ 902중 420(47%) · 일반화학 503중 253(50%)
         이 **다시는 안 나온다.** 나오는 것의 대부분은 바로 다음 회차다.

     즉 간격이 **1 아니면 ∞** 다. 사이가 비어 있다.

     선생님이 정한 간격: **1 → 3 → 7 회차**(2026-08).
     마지막으로 틀린 회차 L 을 기준으로 L+1, L+4(=1+3), L+11(=1+3+7) 에 한 번씩
     떠오르고, 그 뒤로는 졸업한다. 그 사이에 다시 틀리면 L 이 그 회차로 옮겨져
     처음부터 다시 센다.

     ⚠ 여기서 아는 것은 "**다시 안 걸렸다**" 뿐이지 "**확인됐다**" 가 아니다.
     시트 기록에는 그 회차에 그 개념을 **물었는지**가 없고 틀린 목록만 있다.
     그래서 이 함수는 *언제 다시 보여 줄지*만 정한다 — 숙달 판정이 아니다.
     (물었는지까지 보려면 회차 자료를 학생 앱이 들고 있어야 한다.) */
  var SPACED_DUE = [1, 4, 11];        // 1 → +3 → +7 (누적)

  function spacedReview(rows, currentRound) {
    var ord = { '정시': 0, '첫번째시험': 0, '이번주 테스트': 0, '첫 응시': 0, '재시': 1, '재재시': 2 };
    var byRound = {};
    (rows || []).forEach(function (r) { (byRound[r.round] || (byRound[r.round] = [])).push(r); });
    var byConcept = {};
    Object.keys(byRound).forEach(function (rd) {
      var rs = byRound[rd].slice().sort(function (a, b) { return (ord[a.attempt] || 0) - (ord[b.attempt] || 0); });
      var first = rs[0]; if (!first) return;
      (first.wrongMis || []).forEach(function (m) {
        var o = byConcept[m] || (byConcept[m] = { rounds: {}, last: 0 });
        o.rounds[rd] = 1; o.last = Math.max(o.last, Number(rd));
      });
    });
    var now = Number(currentRound) || 0;
    return Object.keys(byConcept).map(function (m) {
      var o = byConcept[m], gap = now - o.last;
      /* 지난 due 를 몇 개 넘겼나 = 몇 단계까지 왔나. 셋을 다 넘겼으면 졸업이다.
         (오래전에 한 번 틀리고 그 뒤로 안 걸린 개념은 여기서 목록을 떠난다 —
         그것을 지금 "복습 시점" 이라고 내미는 것이 오히려 거짓말이다.) */
      var stage = 0;
      while (stage < SPACED_DUE.length && gap > SPACED_DUE[stage]) stage++;
      var due = stage < SPACED_DUE.length ? o.last + SPACED_DUE[stage] : null;
      return { mis: m, times: Object.keys(o.rounds).length, last: o.last, gap: gap,
               stage: stage, due: due, dueNow: due != null && now >= due };
    }).filter(function (x) { return x.last < now && x.dueNow; })
      .sort(function (a, b) { return b.times - a.times || b.last - a.last; });
  }

  // ---------- export (Node + 브라우저) ----------
  var api = {
    norm: norm, studentKey: studentKey, axisOf: axisOf, axisName: axisName, AXES: AXES,
    gradeAttempt: gradeAttempt, notCorrectConcepts: notCorrectConcepts,
    diagnose: diagnose, buildGate: buildGate, buildRetake: buildRetake, cumulative: cumulative,
    spacedReview: spacedReview
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ChemEngine = api;
})(typeof window !== 'undefined' ? window : this);

 = 분자 간 인력(압력 보정), b = 분자 부피(부피 보정).** (P+a(n/V)²)(V−nb)=nRT이고, a가 큰 기체는 수소 결합·극성이 강하다."}}, "CH2-057": {"m": "압축 인자", "t": "A", "forms": [{"a": "O", "s": "압축 인자 Z = PV/nRT이며 이상 기체는 Z = 1이다.", "f": "압축 인자 Z = PV/nRT이며 이상 기체는 Z = 1이다.", "w": "정의 식이다."}, {"a": "O", "s": "압축 인자 Z는 실제 기체가 이상 기체에서 얼마나 벗어났는지 나타낸다.", "f": "압축 인자 Z는 실제 기체가 이상 기체에서 얼마나 벗어났는지 나타낸다.", "w": "편차의 척도이다."}, {"a": "O", "s": "Z = 1이면 이상 기체처럼 거동한다는 뜻이다.", "f": "Z = 1이면 이상 기체처럼 거동한다는 뜻이다.", "w": "PV = nRT를 만족한다."}, {"a": "O", "s": "Z가 1에서 멀어질수록 이상 기체에서 많이 벗어난 것이다.", "f": "Z가 1에서 멀어질수록 이상 기체에서 많이 벗어난 것이다.", "w": "편차가 크다."}, {"a": "O", "s": "Z < 1이면 분자 간 인력이 지배적이다.", "f": "Z < 1이면 분자 간 인력이 지배적이다.", "w": "부피가 작아진다."}, {"a": "O", "s": "Z > 1이면 분자 부피의 영향이 지배적이다.", "f": "Z > 1이면 분자 부피의 영향이 지배적이다.", "w": "부피가 커진다."}, {"a": "O", "s": "이상 기체는 모든 조건에서 Z = 1이다.", "f": "이상 기체는 모든 조건에서 Z = 1이다.", "w": "항상 PV = nRT이다."}, {"a": "O", "s": "Z = PV/nRT로 정의된다.", "f": "Z = PV/nRT로 정의된다.", "w": "정의 식이다."}, {"a": "O", "s": "실제 기체의 Z는 온도와 압력에 따라 변한다.", "f": "실제 기체의 Z는 온도와 압력에 따라 변한다.", "w": "조건에 의존한다."}, {"a": "X", "s": "이상 기체의 압축 인자 Z는 1이 아니다.", "f": "이상 기체의 압축 인자 Z는 1이다.", "w": "항상 PV = nRT이다."}, {"a": "X", "s": "이상 기체의 압축 인자는 압력에 따라 변한다.", "f": "이상 기체의 압축 인자는 항상 1이다.", "w": "항상 PV = nRT이다."}, {"a": "X", "s": "Z = nRT/PV로 정의된다.", "f": "Z = PV/nRT로 정의된다.", "w": "정의 식이다."}, {"a": "X", "s": "Z가 1이면 이상 기체에서 많이 벗어난 것이다.", "f": "Z가 1이면 이상 기체처럼 거동하는 것이다.", "w": "편차가 없다."}, {"a": "X", "s": "실제 기체의 Z는 항상 1이다.", "f": "실제 기체의 Z는 1에서 벗어날 수 있다.", "w": "조건에 따라 변한다."}, {"a": "X", "s": "압축 인자는 분자량을 나타낸다.", "f": "압축 인자는 이상 기체에서의 편차를 나타낸다.", "w": "Z = PV/nRT이다."}], "reading": {"core": "압축 인자 **Z = PV/nRT**다. **이상 기체는 모든 조건에서 Z = 1**이다. Z가 1에서 멀어질수록 실제 기체가 이상 기체에서 많이 벗어난 것이다.", "kill": "\"이상 기체의 Z가 1이 아니다\"거나 \"Z = nRT/PV\"라거나 \"Z가 1이면 많이 벗어난 것\"이라는 착각이다. 이상 기체는 항상 PV = nRT라 Z = 1이고, Z = 1은 이상처럼 거동한다는 뜻이다. Z < 1은 인력 지배, Z > 1은 부피 지배다.", "oneline": "**Z = PV/nRT = V_실제/V_이상**(이상은 Z=1). Z<1은 인력이 수축시킨 것, Z>1은 분자 부피가 버틴 것이고, 보일 온도에서 둘이 상쇄된다."}}, <script>
const $=s=>document.querySelector(s);
const PDF_BASE='./';                 // 배포 시 PDF 위치 (필요하면 './pdf/' 등으로)
const DATA_BASE='./appdata/';
const SAVE_URL='https://script.google.com/macros/s/AKfycbzvFaPXgEgCBQ8HowtP8tPTtdiIVFtmZSUf0KFXUOVOh3ektrFMkz4KSR4I52LDBzB8rw/exec';   // ★ 배포 후 Apps Script 웹앱 /exec URL 을 여기 붙여넣기 (비우면 저장 생략)
const COURSE={ch1:'화학Ⅰ',ch2:'화학Ⅱ',gc:'일반화학'};
// 안전 저장소: 샌드박스에선 메모리, 배포 시 localStorage
const Store={mem:{},get(k){try{return localStorage.getItem(k)}catch(e){return this.mem[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){this.mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete this.mem[k]}}};
const SKEY='chemistreal_session_v1';

let S=null, MANIFEST=null, FORMS=null, courseTab='ch2';
function blank(){return {view:'id',name:'',school:'',grade:'',isTest:false,roundId:null,round:null,
  attemptNo:1,attempts:[],keyItems:[],answers:[],cur:0,graded:null,dx:null,gate:null,seen:{},wrongStmts:{}};}

// ---------- 데이터 로더 (fetch → 실패 시 EMBED 폴백) ----------
async function loadJSON(file,embed){
  try{const r=await fetch(DATA_BASE+file,{cache:'no-store'}); if(r.ok) return await r.json();}catch(e){}
  return embed!==undefined?embed:null;
}
async function loadManifest(){ MANIFEST=await loadJSON('app_manifest.json',EMBED.manifest); }
async function enterRetake(key,course,round){
  if(!MANIFEST) await loadManifest();
  S={view:'retakeload'}; render();
  var rows=[];
  try{ var resp=await fetch(SAVE_URL+'?student='+encodeURIComponent(key)); var j=await resp.json(); rows=j.rows||[]; }catch(e){}
  var mrec=(MANIFEST.rounds||[]).find(function(m){return m.course===course && Number(m.round)===Number(round);});
  var rd=mrec?await loadRound(mrec.data):null;
  var fr=rows.filter(function(r){return r.course===course && Number(r.round)===Number(round) && (r.attempt==='첫 응시'||r.attempt==='정시'||r.attempt==='첫번째시험');});
  var first=fr[0];
  if(!rd || !first || !first.answers){ S={view:'retakefail'}; render(); return; }
  await ensureForms();
  var items=rd.jeongsi.items;
  var ans=(first.answers||'').split('').map(function(ch){return ch==='O'?'O':ch==='X'?'X':'';});
  // 길이 보정
  while(ans.length<items.length) ans.push('');
  var g=ChemEngine.gradeAttempt(ans,items,rd.scoring);
  var dx=ChemEngine.diagnose(g,FORMS);
  S=blank(); S.name=first.name||''; S.school=first.school||''; S.grade=first.year||''; S.round=rd; S.roundId=mrec.data;
  S.keyItems=items; S.answers=ans; S.attemptNo=1; S.graded=g; S.dx=dx;
  g.perItem.forEach(function(p,i){ if(!p.ok && items[i]) S.wrongStmts[ChemEngine.norm(items[i].s)]=1; });
  items.forEach(function(it){ S.seen[ChemEngine.norm(it.s)]=1; });
  S.attempts=[{attempt:'첫 응시',score:g.score,pass:g.pass}];
  S.gate=ChemEngine.buildGate(dx.wrongConcepts,FORMS,S.seen);
  S.view='gate'; render();
}
async function loadRound(file){ return await loadJSON(file, EMBED.rounds[file]||null); }
async function ensureForms(){ if(FORMS) return FORMS; FORMS=await loadJSON('forms_bank.json',EMBED.forms||{}); return FORMS; }

// ---------- 임시저장(채점/재시 중) ----------
function saveSession(){ if(S.view!=='grade'&&S.view!=='retake') return;
  Store.set(SKEY, JSON.stringify({roundId:S.roundId,attemptNo:S.attemptNo,answers:S.answers,cur:S.cur,

function getDiagram(mis,unit){ var t=((mis||'')+' '+(unit||''));
  if(/분자.{0,2}모양|결합각|입체|정사면체|사면체|굽은|선.{0,2}형|평면.{0,2}삼각|VSEPR|전자쌍.{0,2}반발|분자.{0,2}구조|분자.{0,2}극성/.test(t)) return DIAGRAMS.molGeometry;
  if(/오비탈|전자.{0,2}배치|쌓음|훈트|파울리|바닥상태|들뜬|껍질.{0,4}전자|부껍질|양자수/.test(t)) return DIAGRAMS.orbitalFill;
  if(/전기음성도|원자.{0,2}반지름|이온화.{0,2}에너지|주기.{0,2}경향|유효.{0,2}핵전하|주기.{0,2}성질/.test(t)) return DIAGRAMS.periodicTrend;
  if(/적정|당량점|중화점|완충|지시약|반당량|중화.{0,2}반응/.test(t)) return DIAGRAMS.titrationCurve;
  if(/활성화.{0,2}에너지|반응.{0,2}좌표|발열|흡열|엔탈피|반응열|촉매|에너지.{0,2}도표/.test(t)) return DIAGRAMS.reactionEnergy;
  if(/상평형|삼중점|임계점|상 그림|승화/.test(t)) return DIAGRAMS.phaseGraph;
  if(/용해도.{0,3}온도|온도.{0,3}용해도|고체 용해도|용해.{0,2}석출|재결정/.test(t)) return DIAGRAMS.solubilityGraph;
  if(/보일|샤를|압력.{0,2}부피 그래프/.test(t)) return DIAGRAMS.gasLawGraph;
  return ''; }

const ORD={id:0,select:1,pdf:2,grade:3,report:4,gate:5,retake:6,done:7};
const STEPLB=['학생','회차','시험지','채점','진단','강의록','재시','완료'];
function renderSteps(){
  const cur=ORD[S.view];
  $('#steps').innerHTML=STEPLB.map((lb,i)=>{
    const cls=i===cur?'on':i<cur?'past':'';
    return `<div class="step ${cls}"><div class="dot">${i<cur?'✓':i+1}</div><div class="lb">${lb}</div></div>`+
      (i<STEPLB.length-1?'<div class="seg"></div>':'');
  }).join('');
  $('#testBadge').style.display=S.isTest?'inline-block':'none';
}
function go(v){S.view=v;render();window.scrollTo(0,0);}
function reportBase(){ return location.origin+location.pathname.replace(/[^/]*$/,''); }
function reportLink(){ return reportBase()+'report.html?student='+ChemEngine.studentKey(S.name,S.school); }
function copyReportLink(btn){ var link=reportLink();
  try{ navigator.clipboard.writeText(link).then(function(){flashCopied(btn);},function(){window.prompt('아래 링크를 복사하세요:',link);}); }
  catch(e){ try{window.prompt('아래 링크를 복사하세요:',link);}catch(_){} } }
function flashCopied(btn){ if(!btn)return; var t=btn.dataset._t||btn.textContent; btn.dataset._t=t; btn.textContent='✓ 복사됨'; setTimeout(function(){btn.textContent=t;},1500); }

// ---------- 2키 입력 ----------
function setAns(i,v){ S.answers[i]=v; saveSession();
  if(i===S.cur){const n=S.answers.findIndex((a,j)=>j>i&&!a); S.cur=n>=0?n:Math.min(i+1,S.keyItems.length-1);} render(); }
document.addEventListener('keydown',e=>{
  if(S.view!=='grade'&&S.view!=='retake')return; const k=e.key.toLowerCase();
  if(k==='o'||k==='ㅐ'){setAns(S.cur,'O')} else if(k==='x'||k==='ㅌ'){setAns(S.cur,'X')}
  else if(e.key==='ArrowDown'||e.key==='ArrowRight'){S.cur=Math.min(S.cur+1,S.keyItems.length-1);render()}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){S.cur=Math.max(S.cur-1,0);render()}
});
function onEntry(el){var v=(el.value||'').trim(); if(v==='1')setAns(S.cur,'O'); else if(v==='2')setAns(S.cur,'X'); el.value='';}
function inputScreen(title,sub,submitLabel,onSubmit,showStmt){
  const done=S.answers.filter(a=>a==='O'||a==='X').length, n=S.keyItems.length, it=S.keyItems[S.cur];
  const dots=S.keyItems.map((x,i)=>`<div class="dot2 ${S.answers[i]==='O'?'o':S.answers[i]==='X'?'x':''} ${i===S.cur?'cur':''}" onclick="S.cur=${i};render()">${i+1}</div>`).join('');
  return `<div class="card">
    <h1>${title}</h1><p class="lede">${sub}</p>
    <div class="gradehead"><span class="cnt mono">${done}</span><span class="of mono">/ ${n}</span><div class="bar"><i style="width:${100*done/n}%"></i></div></div>
    <div class="focusq">
      <div class="qnum mono">문항 ${S.cur+1}</div>
      <div class="stmt">${showStmt?it.s:'OMR '+(S.cur+1)+'번 입력 (1=O · 2=X)'}</div>
      <div class="entrywrap">
        <input id="entry" class="entry mono" inputmode="numeric" maxlength="1" autocomplete="off" placeholder="·" oninput="onEntry(this)">
        <div class="curval ${S.answers[S.cur]==='O'?'o':S.answers[S.cur]==='X'?'x':''}">${S.answers[S.cur]||'·'}</div>
      </div>
      <p class="hint"><kbd>1</kbd>=O · <kbd>2</kbd>=X 키 입력 → 자동으로 다음 칸 · ←/→ 이동</p>
    </div>
    <div class="dots">${dots}</div>
    <div class="btnrow"><button onclick="(${onSubmit})()">${submitLabel}${done<n?` · ${n-done}개 미기입(오답 처리)`:''}</button></div>
  </div>`;
}

// ---------- 흐름 ----------
function startGrade(items,attemptNo){S.keyItems=items;S.answers=new Array(items.length).fill('');S.cur=0;S.attemptNo=attemptNo;}
async function saveResult(g,dx){
  if(!SAVE_URL) return;
  try{
    var payload={ studentKey:ChemEngine.studentKey(S.name,S.school), reportLink:reportLink(), name:S.name, school:S.school, year:S.grade,
      course:S.round.course, round:S.round.round, attempt:S.attempts[S.attempts.length-1].attempt,
      score:g.score, pass:g.pass, correctCount:g.correctCount, wrongCount:g.wrongCount,
      wrongMis:(dx.byMisconception||[]).map(function(m){return m.mis;}),
      wrongAxes:(dx.byAxis||[]).reduce(function(o,a){o[a.key]=a.wrong;return o;},{}),
      units:(dx.byUnit||[]).map(function(u){return {u:u.unit,t:u.total,w:u.wrong};}),
      axes:(dx.byAxis||[]).map(function(a){return {k:a.key,t:a.total,w:a.wrong};}),
      isTest:!!S.isTest,
      answers:(S.answers||[]).map(function(a){return a==='O'?'O':a==='X'?'X':'.';}).join('') };
    await fetch(SAVE_URL,{method:'POST',body:JSON.stringify(payload)});
  }catch(e){ console.warn('[Chemistreal] 시트 저장 실패(네트워크):',e); }
}
async function doGrade(){
  if(!S.keyItems||!S.keyItems.length){ alert('시험 데이터가 없습니다. 회차를 다시 선택하세요.'); go('select'); return; }
  const blanks=S.answers.filter(a=>a!=='O'&&a!=='X').length;
  if(blanks>0){ let ok=true; try{ ok=window.confirm(blanks+'개 문항이 미기입입니다. 오답으로 처리하고 채점할까요?'); }catch(e){} if(!ok) return; }
  const g=ChemEngine.gradeAttempt(S.answers,S.keyItems,S.round.scoring);
  await ensureForms();
  const dx=ChemEngine.diagnose(g,FORMS); S.graded=g; S.dx=dx;
  g.perItem.forEach((p,i)=>{ if(!p.ok) S.wrongStmts[ChemEngine.norm(S.keyItems[i].s)]=1; });
  S.attempts.push({attempt:S.attemptNo===1?'첫 응시':S.attemptNo===2?'재시':'재재시',score:g.score,pass:g.pass});
  S.keyItems.forEach(it=>{S.seen[ChemEngine.norm(it.s)]=1;});
  saveResult(g,dx);   // 시트 저장(비차단)
  clearSession(); go('report');
}
async function afterReport(){
  if(S.graded.pass){go('done');return;}
  try{ await ensureForms(); }catch(e){ FORMS=FORMS||{}; }
  S.gate=ChemEngine.buildGate(S.dx.wrongConcepts,FORMS,S.seen);
  S.gate.gates.forEach(g=>{g._unlocked=false;g._stage=0;g._wrong=false;g._required=true;}); // 전부 직면: 모든 오개념 필수
  go('gate');
}
function answerCheck(i,v){const g=S.gate.gates[i];const st=g._stage||0;const c=g.checks[st];
  if(v===c.a){g._wrong=false; if(st<g.checks.length-1){g._stage=st+1;} else {g._unlocked=true;}}
  else {g._wrong=true;}
  render();}
function retryCheck(i){S.gate.gates[i]._wrong=false;render();}
function allUnlocked(){return S.gate.gates.every(g=>g._unlocked);}
function allRequiredUnlocked(){return S.gate.gates.filter(g=>g._required).every(g=>g._unlocked);}
function gateEncourage(done,total){ var left=total-done;
  if(total<=2) return '';
  if(left===0) return '전부 해제했어요. 잘 해냈습니다. 이제 재시로 확인해요.';
  if(done===0) return '하나씩 차근차근. 강의록을 덮고 스스로 떠올리면 더 오래 남아요.';
  if(left===1) return '마지막 하나! 이것만 잡으면 끝이에요.';
  if(done>=total/2) return '절반을 넘었어요. 여기까지 잘 왔습니다. 조금만 더.';
  return '좋은 출발이에요. 한 번에 하나씩 가봅시다.'; }
function startRetake(){
  FORMS=FORMS||{};
  const wrong=S.dx.wrongConcepts.map(w=>w.c).filter(Boolean);
  const next=S.attemptNo+1;
  const rt=ChemEngine.buildRetake(next,S.round.retakeC,wrong,FORMS,S.seen,S.wrongStmts);
  S.seen=rt.seenStatements; var rwN=rt.items.filter(x=>x.reusedWrong).length; if(rwN) console.warn('[Chemistreal] 재노출 '+rwN+'문항(form 소진)'); startGrade(rt.items,next); go('retake');
}

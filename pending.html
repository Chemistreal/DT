<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미응시 현황 · Chemistreal</title>
<style>
:root{ --ink:#23272e; --gold:#C9A227; --char:#2b2f36; --muted:#8a8f98; --line:#e8eaed; --bg:#f5f6f8;
  --red:#c0392b; --amber:#c9851f; --green:#1f7a4d; }
*{box-sizing:border-box}
body{font-family:'Noto Sans CJK KR','Noto Sans KR',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.6px solid var(--gold);
  padding:18px 2px 11px;margin-bottom:14px}
.brand{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.h1{font-size:21px;font-weight:800;color:var(--char);margin-top:3px}
.who{text-align:right;font-size:12.5px;color:#4b5563}
.who b{color:#111}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:96px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.stat.act .n{color:var(--red)} .stat.stl .n{color:var(--muted)}
.sec-h{font-size:14px;font-weight:800;color:var(--char);margin:18px 0 9px;display:flex;align-items:center;gap:7px}
.sec-h .tag{font-size:11px;font-weight:700;color:#fff;background:var(--char);border-radius:5px;padding:1px 7px}
.row{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.urgent{border-left:4px solid var(--red)}
.row.warn{border-left:4px solid var(--amber)}
.row.ok{border-left:4px solid var(--gold)}
.rinfo{flex:1;min-width:0}
.rname{font-weight:800;font-size:15.5px;color:#1f2937}
.rsub{font-size:12px;color:var(--muted);margin-top:1px}
.rwhat{font-size:13px;color:#374151;margin-top:5px}
.rwhat b{color:#1f2937}
.rneed{color:var(--red);font-weight:700}
.copybtn{margin-top:8px;font-size:12px;font-weight:700;color:var(--char);background:#fff;border:1.3px solid var(--gold);border-radius:8px;padding:7px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.copybtn:active{transform:scale(.98)}
.copybtn.copied{background:#eef7f0;border-color:var(--green);color:var(--green)}
.copygrp{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.cglab{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin-bottom:1px}
.copygrp .copybtn{margin-top:0;width:100%;text-align:center;border-left-width:3px}
.copybtn.s1{border-left-color:#3b82f6}
.copybtn.s2{border-left-color:#f59e0b}
.copybtn.s3{border-left-color:#ef4444}
.days{flex-shrink:0;text-align:center;min-width:62px}
.days .dn{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.days .dl{font-size:10.5px;color:var(--muted);margin-top:2px}
.days.urgent .dn{color:var(--red)} .days.warn .dn{color:var(--amber)} .days.ok .dn{color:var(--green)}
.muted-note{font-size:12px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.stale details summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:700;padding:6px 2px;list-style:none}
.stale details summary::-webkit-details-marker{display:none}
.stale .row{opacity:.72}
.tools{display:flex;gap:8px;margin:6px 0 16px}
.btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:13px;font-weight:700;
  color:#374151;cursor:pointer}
.btn.p{background:var(--char);color:#fff;border-color:var(--char)}
.loading{text-align:center;color:var(--muted);padding:40px 10px}
.err{background:#fff4f3;border:1px solid #f3c9c4;color:#922;border-radius:10px;padding:12px;font-size:13px}
.foot{text-align:center;color:#b9bec7;font-size:11px;margin-top:26px}
.stat.exabs .n{color:var(--red)}
.abx-cls{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:8px;border-left:4px solid var(--red)}
.abx-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.abx-nm{font-weight:800;font-size:15px;color:#1f2937}
.abx-badge{font-size:11px;font-weight:700;color:#fff;background:var(--char);border-radius:5px;padding:1px 7px}
.abx-cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--red)}
.abx-bc{margin:9px 0 4px}
.abx-bc .copybtn{width:100%;text-align:center;border-left-width:3px;border-left-color:var(--gold)}
.abx-stu{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0 2px;border-top:1px dashed var(--line);margin-top:6px}
.abx-sname{font-weight:700;font-size:14px;color:#374151;min-width:66px}
.abx-btns{flex-direction:row;gap:6px;margin-left:auto;margin-top:0}
.abx-btns .copybtn{width:auto;margin-top:0;border-left-width:3px}
.copybtn.a1{border-left-color:#3b82f6}
.copybtn.a2{border-left-color:#8b5cf6}
.copybtn.abc{border-left-color:var(--gold)}
.zipbtn{border:1px solid var(--teal,#0B6E6E);color:var(--teal-d,#0A5A5A);background:#fff;border-radius:7px;padding:4px 10px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;margin-left:8px;white-space:nowrap}
.zipbtn:hover{background:rgba(11,110,110,.07)}
.zipbtn[data-busy="1"]{opacity:.7;cursor:progress}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="brand">다원교육 영재관 · Chemistreal</div><div class="h1">미응시 현황</div></div>
    <div class="who"><div>조준모 화학</div><div id="gen" style="margin-top:3px"></div></div>
  </div>
  <div id="app"><div class="loading">불러오는 중…</div></div>
  <div class="foot">Chemistreal · 조준모 화학 · 다원교육 영재관<br>매주 수요일 18시 whwnsah11@naver.com 자동 발송 · 2주 이상 미응시는 이탈 추정으로 제외</div>
</div>
<script>
var STATUS_URL='https://script.google.com/macros/s/AKfycbzvFaPXgEgCBQ8HowtP8tPTtdiIVFtmZSUf0KFXUOVOh3ektrFMkz4KSR4I52LDBzB8rw/exec';
/* ---- 관리자 코드 (Apps Script 스크립트 속성 ADMIN_TOKEN 값) ---- */
function admTok(){ var t=''; try{ t=localStorage.getItem('dt_admtok')||''; }catch(e){} return (t||'').trim(); }   /* 전체 공개 모드: 관리자 코드 입력 없이 동작 */
function admReset(){ try{ localStorage.removeItem('dt_admtok'); }catch(e){} }

var COURSE={ch1:'화학Ⅰ',ch2:'화학Ⅱ',gc:'일반화학'};
var Q=new URLSearchParams(location.search);

function urgency(days){ return days>=7?'urgent':days>=4?'warn':'ok'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var STAGE_LABEL={'1':'1단계 · 월요일','2':'2단계 · 수요일','3':'3단계 · 수업 전날'};
function shareMsg(d, stage){
  var course=COURSE[d.course]||d.course;
  var head='[다원교육 영재관 · 화학] '+d.name+' 학생';
  var reask='재시는 아이가 틀린 개념만 골라 개별 출제되며, 처음 본 문항과 겹치지 않습니다.';
  var link='▶ '+d.link;
  if(stage==='3'){
    return head+' 재시 안내 (수업 전날)\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'내일 수업을 앞두고 마지막으로 안내드립니다. '+course+' '+d.round+'회 재시가 아직 확인되지 않았는데, 내일 수업 전까지는 꼭 마치고 오면 좋겠습니다. 재시로 개념을 정리한 상태로 들어와야 내일 진도가 온전히 이어집니다.\n\n'
      +'아래 링크에서 취약 개념 보강 후 재시까지 짧게 마무리해 주세요. '+reask+'\n\n'
      +link+'\n\n'
      +'오늘 안에 완료해 두시면 내일 수업이 한결 수월합니다. 감사합니다.\n\n조준모 드림';
  }
  if(stage==='2'){
    return head+' 재시 리마인드\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'앞서 안내드린 '+course+' '+d.round+'회 재시가 아직 확인되지 않아 다시 한번 챙겨드립니다. 지금 보강하면 개념이 굳기 전에 정확히 잡히는 시점이라, 이번 주가 지나기 전에 마무리하시길 권합니다.\n\n'
      +'아래 링크에서 틀린 개념만 강의록으로 짚은 뒤 재시를 보면 됩니다. 오래 걸리지 않고, '+reask+'\n\n'
      +link+'\n\n'
      +'수업 전까지 마쳐 두면 다음 진도를 훨씬 편하게 따라갑니다. 감사합니다.\n\n조준모 드림';
  }
  // 1단계 (월요일 · 처음 안내)
  return head+' 재시 안내\n\n'
    +'안녕하세요, 화학 조준모입니다.\n\n'
    +d.name+' 학생이 '+course+' '+d.round+'회 '+d.att+'에서 '+d.score+'점으로 통과선(80점)에 조금 못 미쳤습니다. 저희 반은 틀린 개념을 다시 잡아 통과까지 마무리하는 재시 과정을 두는데, 이번 주 재시를 아직 시작하기 전이라 안내드립니다.\n\n'
    +'아래 링크에서 취약 개념만 강의록으로 보강한 뒤 재시를 보면 됩니다. '+reask+'\n\n'
    +link+'\n\n'
    +'누적 시험이라 이번 주 안에 마무리하면 다음 회차가 훨씬 수월합니다. 감사합니다.\n\n조준모 드림';
}
function copyShare(btn){
  var stage=btn.getAttribute('data-stage')||'1';
  var host=btn.closest('.copygrp')||btn.parentNode;
  var d={ name:host.getAttribute('data-name'), course:host.getAttribute('data-course'), round:host.getAttribute('data-round'),
    att:host.getAttribute('data-att'), score:host.getAttribute('data-score'), next:host.getAttribute('data-next'), link:host.getAttribute('data-link') };
  var kind=host.getAttribute('data-kind')||'retake';
  var msg=(kind==='exam')?absentMsg(d, stage):shareMsg(d, stage); if(!msg) return;
  var orig=btn.getAttribute('data-orig')||btn.textContent;
  var done=function(){ btn.textContent='복사됨 ✓'; btn.classList.add('copied');
    setTimeout(function(){ btn.textContent=orig; btn.classList.remove('copied'); }, 1800); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(msg).then(done).catch(fallback); }
  else fallback();
  function fallback(){ try{ var ta=document.createElement('textarea'); ta.value=msg; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); }catch(e){ prompt('메시지 복사', msg); } }
}

function siteBase(){ var b=location.href.split('?')[0].split('#')[0]; return b.slice(0,b.lastIndexOf('/')+1); }
function examLink(course, round){ return siteBase()+'exam.html?c='+encodeURIComponent(course)+'&r='+encodeURIComponent(round); }

/* 시험 미응시(정식 시험 자체를 안 본 학생) 안내 메시지. 링크는 응시 페이지(exam.html?c=&r=). */
function absentMsg(d, stage){
  var course=COURSE[d.course]||d.course;
  var link='\u25b6 '+d.link;
  if(stage==='bc'){
    return '[다원교육 영재관 · 화학] '+course+' '+d.round+'회 온라인 시험 안내\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'이번 '+course+' '+d.round+'회 누적 OX 시험을 아직 응시하지 않은 학생은 아래 링크에서 온라인으로 응시해 주세요. 60문항 OX이고, 다음 수업 전까지 마치면 됩니다.\n\n'
      +link+'\n\n'
      +'응시하면 결과와 취약 개념이 개인 리포트에 바로 반영됩니다. 누적 시험이라 한 주를 건너뛰면 다음 회차가 그만큼 버거워지니 꼭 챙겨 주세요. 감사합니다.\n\n조준모 드림';
  }
  var head='[다원교육 영재관 · 화학] '+d.name+' 학생';
  if(stage==='2'){
    return head+' 시험 리마인드\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'앞서 안내드린 '+course+' '+d.round+'회 시험이 아직 응시 전이라 다시 한번 챙겨드립니다. 다음 수업은 이 회차 내용을 이어서 진행하기 때문에, 그 전에 응시해 두어야 진도가 온전히 연결됩니다.\n\n'
      +'아래 링크에서 지금 바로 응시할 수 있습니다. 60문항 OX으로 길지 않습니다.\n\n'
      +link+'\n\n'
      +'오늘 안에 마쳐 두시면 다음 수업이 한결 수월합니다. 감사합니다.\n\n조준모 드림';
  }
  // 1차 안내
  return head+' 시험 안내\n\n'
    +'안녕하세요, 화학 조준모입니다.\n\n'
    +d.name+' 학생이 이번 '+course+' '+d.round+'회 시험을 아직 응시하지 않아 안내드립니다. 저희 반은 매주 누적 OX 시험으로 그 주 학습을 점검하는데, '+d.round+'회 응시 기록이 아직 확인되지 않습니다.\n\n'
    +'아래 링크에서 온라인으로 바로 응시할 수 있습니다. 60문항 OX이라 오래 걸리지 않으니, 다음 수업 전까지 꼭 마쳐 주세요.\n\n'
    +link+'\n\n'
    +'응시하면 결과와 취약 개념 피드백이 개인 리포트에 바로 반영됩니다. 누적 시험이라 한 주를 건너뛰면 다음 회차가 버거워집니다. 감사합니다.\n\n조준모 드림';
}

function absentClassHTML(c){
  var el=examLink(c.course, c.round);
  var head='<div class="abx-head"><span class="abx-nm">'+esc(c.label)+'</span>'
    +'<span class="abx-badge">'+(COURSE[c.course]||esc(c.course))+' '+esc(c.round)+'회</span>'
    +'<span class="abx-cnt">미응시 '+c.absent.length+'/'+c.total+'명</span>'
    +'<button class="zipbtn" data-course="'+escAttr(c.course)+'" data-round="'+Number(c.round)+'" data-label="'+escAttr(c.label)+'" data-absent="'+escAttr(JSON.stringify(c.absent))+'" onclick="zipExamClass(this)">시험지 ZIP</button></div>';
  var bc='<div class="copygrp abx-bc" data-kind="exam" data-name="" data-course="'+escAttr(c.course)+'" data-round="'+escAttr(c.round)+'" data-link="'+escAttr(el)+'">'
    +'<button class="copybtn abc" data-stage="bc" data-orig="반 전체 공지 복사" onclick="copyShare(this)">반 전체 공지 복사</button></div>';
  var stus=(c.absent||[]).map(function(nm){
    return '<div class="abx-stu"><span class="abx-sname">'+esc(nm)+'</span>'
      +'<div class="copygrp abx-btns" data-kind="exam" data-name="'+escAttr(nm)+'" data-course="'+escAttr(c.course)+'" data-round="'+escAttr(c.round)+'" data-link="'+escAttr(el)+'">'
      +'<button class="copybtn a1" data-stage="1" data-orig="1차 안내" onclick="copyShare(this)">1차 안내</button>'
      +'<button class="copybtn a2" data-stage="2" data-orig="리마인드" onclick="copyShare(this)">리마인드</button>'
      +'</div></div>';
  }).join('');
  return '<div class="abx-cls">'+head+bc+stus+'</div>';
}

function rowHTML(p){
  var u=urgency(p.days);
  var sub=esc(p.school)+(p.year?' · '+esc(p.year)+'학년':'');
  return '<div class="row '+u+'"><div class="rinfo">'
    +'<div class="rname">'+esc(p.name)+'</div>'
    +'<div class="rsub">'+sub+'</div>'
    +'<div class="rwhat"><b>'+(COURSE[p.course]||esc(p.course))+' '+esc(p.round)+'회</b> · '
      +esc(p.lastAttempt)+' '+esc(p.score)+'점 미통과 → <span class="rneed">'+esc(p.nextNeeded)+' 미응시</span></div>'
    +(p.reportLink?'<div class="copygrp" data-link="'+escAttr(p.reportLink)+'" data-name="'+escAttr(p.name)+'" data-course="'+escAttr(p.course)+'" data-round="'+escAttr(p.round)+'" data-att="'+escAttr(p.lastAttempt)+'" data-score="'+escAttr(p.score)+'" data-next="'+escAttr(p.nextNeeded)+'">'
    +'<div class="cglab">카톡 안내 복사</div>'
    +'<button class="copybtn s1" data-stage="1" data-orig="1단계 · 월 안내" onclick="copyShare(this)">1단계 · 월 안내</button>'
    +'<button class="copybtn s2" data-stage="2" data-orig="2단계 · 수 리마인드" onclick="copyShare(this)">2단계 · 수 리마인드</button>'
    +'<button class="copybtn s3" data-stage="3" data-orig="3단계 · 전날 최종" onclick="copyShare(this)">3단계 · 전날 최종</button>'
    +'</div>':'')
    +'</div><div class="days '+u+'"><div class="dn">'+p.days+'</div><div class="dl">일 경과<br>('+esc(p.lastDate)+')</div></div></div>';
}

function render(P, ABS){
  var a=P.active||[], s=P.stale||[];
  _ACTIVE=a.slice();
  var absClasses=(ABS&&ABS.classes||[]).filter(function(c){return c.absent&&c.absent.length;});
  var absN=absClasses.reduce(function(t,c){return t+c.absent.length;},0);
  var gen=document.getElementById('gen'); if(gen) gen.textContent='갱신 '+(P.generatedAt||(ABS&&ABS.generatedAt)||'');
  var h='';
  h+='<div class="bar">'
    +'<div class="stat exabs"><div class="n">'+absN+'</div><div class="l">시험 미응시</div></div>'
    +'<div class="stat act"><div class="n">'+a.length+'</div><div class="l">재시 필요 (2주 내)</div></div>'
    +'<div class="stat stl"><div class="n">'+s.length+'</div><div class="l">이탈 추정 (2주+)</div></div>'
    +'<div class="stat"><div class="n">'+(P.activeDays||14)+'</div><div class="l">기준 일수</div></div></div>';
  h+='<div class="tools"><button class="btn p" onclick="load()">새로고침</button></div>';

  // 시험 미응시 (roster 미응시자 기준) · 온라인 응시 안내
  h+='<div class="sec-h">시험 미응시 <span class="tag" style="background:var(--red)">'+absN+'</span><span style="font-weight:600;color:var(--muted);font-size:11.5px">· 온라인 응시 필요</span></div>';
  if(!ABS){ h+='<div class="muted-note">미응시자 명단을 불러오지 못했습니다. roster.html에 반 명단이 저장돼 있는지 확인하세요.</div>'; }
  else if(!absN){ h+='<div class="empty">이번 회차 시험을 응시하지 않은 학생이 없습니다.</div>'; }
  else{ h+='<div class="muted-note">저장된 반 명단 기준, 이번 회차 시험 응시 기록이 없는 학생입니다. 버튼으로 온라인 응시 안내를 복사해 보내세요. (OX 워밍업이 아니라 정식 60문항 시험입니다.)</div>'; h+=absClasses.map(absentClassHTML).join(''); }

  h+='<div class="sec-h">재시 필요 <span class="tag">'+a.length+'</span><span style="font-weight:600;color:var(--muted);font-size:11.5px">· 오래된 순</span>'+(a.length?'<button class="zipbtn" style="margin-left:auto" onclick="zipRetakePending(this)">재시지 ZIP ('+a.length+'명)</button>':'')+'</div>';
  if(!a.length){ h+='<div class="empty">2주 이내 재시 미응시 학생이 없습니다.</div>'; }
  else{ h+='<div class="muted-note">정시(또는 재시) 미통과 후 다음 재시를 아직 보지 않은 학생입니다. 토요일 수업 전에 확인하세요.</div>'; h+=a.map(rowHTML).join(''); }

  if(s.length){
    h+='<div class="stale"><details><summary>장기 미응시 · 이탈 추정 ('+s.length+'명, 알람 제외) ▾</summary>'
      +'<div class="muted-note">2주 이상 같은 시험의 재시를 보지 않은 학생입니다. 학원을 그만둔 경우가 섞일 수 있어 자동 알람에서는 제외합니다. 복귀가 확인되면 다시 응시하면 활성으로 돌아옵니다.</div>'
      +s.map(rowHTML).join('')+'</details></div>';
  }
  document.getElementById('app').innerHTML=h;
}

/* ===== 오프라인 인쇄용 ZIP 다운로드 ===== */
var _ACTIVE=[];   // 재시 필요 목록 캐시(zipRetakePending 용)
var JSZIP_URL='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
function loadJSZip(){ if(window.JSZip) return Promise.resolve(); return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=JSZIP_URL; s.onload=res; s.onerror=function(){rej(new Error('JSZip 로드 실패'));}; document.head.appendChild(s); }); }
function safeName(s){ return String(s||'학생').replace(/[\\/:*?"<>|]/g,'').trim()||'학생'; }
function keyFromLink(link){ try{ var m=String(link||'').match(/[?&]student=([^&]+)/); if(!m) return ''; var raw=decodeURIComponent(m[1]); var li=raw.lastIndexOf('-'); if(li>0 && /^[0-9a-z]{8}$/.test(raw.slice(li+1))) return raw.slice(0,li); return raw; }catch(e){ return ''; } }
function saveBlob(blob,fname){ var u=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=u; a.download=fname; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1500); }

// 미응시(정시) 반 -> 그 회차 시험지 1부를 학생 이름별로 복사해 ZIP
async function zipExamClass(btn){
  if(btn.dataset.busy==='1') return; var orig=btn.textContent; btn.dataset.busy='1';
  var course=btn.getAttribute('data-course'), round=Number(btn.getAttribute('data-round')), label=btn.getAttribute('data-label');
  var names=[]; try{ names=JSON.parse(btn.getAttribute('data-absent')||'[]'); }catch(e){ names=[]; }
  if(!names.length){ alert('미응시자가 없습니다.'); btn.dataset.busy='0'; return; }
  try{
    btn.textContent='라이브러리\u2026'; await loadJSZip();
    btn.textContent='시험지 생성\u2026';
    var made=await DTPDF.make({course:course, round:round, kind:'exam', variant:'jeongsi', output:'blob', onstep:function(m){ btn.textContent=m||orig; }});
    var zip=new JSZip();
    names.forEach(function(nm){ zip.file(safeName(nm)+'.pdf', made.blob); });
    btn.textContent='압축\u2026';
    var out=await zip.generateAsync({type:'blob'});
    saveBlob(out, safeName(label)+'_'+round+'회_시험지.zip');
    btn.textContent='\u2713 완료';
  }catch(e){ btn.textContent=orig; alert('ZIP 생성 실패: '+(e&&e.message?e.message:e)); }
  setTimeout(function(){ btn.textContent=orig; btn.dataset.busy='0'; },1600);
}

// 재시 필요 학생 -> 각자 개인화 재시지(이름.pdf) ZIP
async function zipRetakePending(btn){
  if(btn.dataset.busy==='1') return; var orig=btn.textContent; btn.dataset.busy='1';
  var list=_ACTIVE.slice();
  if(!list.length){ alert('재시 필요 학생이 없습니다.'); btn.dataset.busy='0'; return; }
  try{
    btn.textContent='라이브러리\u2026'; await loadJSZip();
    var zip=new JSZip(); var ok=0, fail=[];
    for(var i=0;i<list.length;i++){
      var s=list[i]; var key=keyFromLink(s.reportLink);
      btn.textContent='재시지 '+(i+1)+'/'+list.length+' ('+ (s.name||'') +')';
      try{
        var rr=await DTRetake.items({key:key, course:s.course, round:s.round});
        if(!rr || !rr.items.length){ fail.push(s.name||key); continue; }
        var made=await DTPDF.make({items:rr.items, course:s.course, round:Number(s.round), vlabel:'재시', kind:'exam', scoring:rr.scoring, output:'blob', fname:safeName(s.name)+'.pdf'});
        zip.file(made.fname, made.blob); ok++;
      }catch(e){ fail.push((s.name||key)+' ('+(e&&e.message?e.message:e)+')'); }
    }
    if(!ok){ btn.textContent=orig; alert('생성된 재시지가 없습니다.'+(fail.length?'\n실패: '+fail.slice(0,5).join(', '):'')); btn.dataset.busy='0'; return; }
    btn.textContent='압축\u2026';
    var out=await zip.generateAsync({type:'blob'});
    saveBlob(out, '재시지_'+ok+'명.zip');
    btn.textContent='\u2713 '+ok+'명';
    if(fail.length) alert('일부 실패('+fail.length+'명): '+fail.slice(0,6).join(', ')+'\n(첫 응시 기록이 없으면 재시지를 만들 수 없습니다.)');
  }catch(e){ btn.textContent=orig; alert('ZIP 생성 실패: '+(e&&e.message?e.message:e)); }
  setTimeout(function(){ btn.textContent=orig; btn.dataset.busy='0'; },1800);
}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재시 미응시 현황 · Chemistreal</title>
<style>
:root{ --ink:#23272e; --gold:#C9A227; --char:#2b2f36; --muted:#8a8f98; --line:#e8eaed; --bg:#f5f6f8;
  --red:#c0392b; --amber:#c9851f; --green:#1f7a4d; }
*{box-sizing:border-box}
body{font-family:'Noto Sans CJK KR','Noto Sans KR',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.6px solid var(--gold);
  padding:18px 2px 11px;margin-bottom:14px}
.brand{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.h1{font-size:21px;font-weight:800;color:var(--char);margin-top:3px}
.who{text-align:right;font-size:12.5px;color:#4b5563}
.who b{color:#111}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:96px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.stat.act .n{color:var(--red)} .stat.stl .n{color:var(--muted)}
.sec-h{font-size:14px;font-weight:800;color:var(--char);margin:18px 0 9px;display:flex;align-items:center;gap:7px}
.sec-h .tag{font-size:11px;font-weight:700;color:#fff;background:var(--char);border-radius:5px;padding:1px 7px}
.row{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.urgent{border-left:4px solid var(--red)}
.row.warn{border-left:4px solid var(--amber)}
.row.ok{border-left:4px solid var(--gold)}
.rinfo{flex:1;min-width:0}
.rname{font-weight:800;font-size:15.5px;color:#1f2937}
.rsub{font-size:12px;color:var(--muted);margin-top:1px}
.rwhat{font-size:13px;color:#374151;margin-top:5px}
.rwhat b{color:#1f2937}
.rneed{color:var(--red);font-weight:700}
.copybtn{margin-top:8px;font-size:12px;font-weight:700;color:var(--char);background:#fff;border:1.3px solid var(--gold);border-radius:8px;padding:7px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.copybtn:active{transform:scale(.98)}
.copybtn.copied{background:#eef7f0;border-color:var(--green);color:var(--green)}
.copygrp{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.cglab{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin-bottom:1px}
.copygrp .copybtn{margin-top:0;width:100%;text-align:center;border-left-width:3px}
.copybtn.s1{border-left-color:#3b82f6}
.copybtn.s2{border-left-color:#f59e0b}
.copybtn.s3{border-left-color:#ef4444}
.days{flex-shrink:0;text-align:center;min-width:62px}
.days .dn{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.days .dl{font-size:10.5px;color:var(--muted);margin-top:2px}
.days.urgent .dn{color:var(--red)} .days.warn .dn{color:var(--amber)} .days.ok .dn{color:var(--green)}
.muted-note{font-size:12px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.stale details summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:700;padding:6px 2px;list-style:none}
.stale details summary::-webkit-details-marker{display:none}
.stale .row{opacity:.72}
.tools{display:flex;gap:8px;margin:6px 0 16px}
.btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:13px;font-weight:700;
  color:#374151;cursor:pointer}
.btn.p{background:var(--char);color:#fff;border-color:var(--char)}
.loading{text-align:center;color:var(--muted);padding:40px 10px}
.err{background:#fff4f3;border:1px solid #f3c9c4;color:#922;border-radius:10px;padding:12px;font-size:13px}
.foot{text-align:center;color:#b9bec7;font-size:11px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="brand">다원교육 영재관 · Chemistreal</div><div class="h1">재시 미응시 현황</div></div>
    <div class="who"><div>조준모 화학</div><div id="gen" style="margin-top:3px"></div></div>
  </div>
  <div id="app"><div class="loading">불러오는 중…</div></div>
  <div class="foot">Chemistreal · 조준모 화학 · 다원교육 영재관<br>매주 수요일 18시 whwnsah11@naver.com 자동 발송 · 2주 이상 미응시는 이탈 추정으로 제외</div>
</div>
<script>
var STATUS_URL='https://script.google.com/macros/s/AKfycbzvFaPXgEgCBQ8HowtP8tPTtdiIVFtmZSUf0KFXUOVOh3ektrFMkz4KSR4I52LDBzB8rw/exec';
var COURSE={ch1:'화학Ⅰ',ch2:'화학Ⅱ',gc:'일반화학'};
var Q=new URLSearchParams(location.search);

function urgency(days){ return days>=7?'urgent':days>=4?'warn':'ok'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var STAGE_LABEL={'1':'1단계 · 월요일','2':'2단계 · 수요일','3':'3단계 · 수업 전날'};
function shareMsg(d, stage){
  var course=COURSE[d.course]||d.course;
  var head='[다원교육 영재관 · 화학] '+d.name+' 학생';
  var reask='재시는 아이가 틀린 개념만 골라 개별 출제되며, 처음 본 문항과 겹치지 않습니다.';
  var link='▶ '+d.link;
  if(stage==='3'){
    return head+' 재시 안내 (수업 전날)\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'내일 수업을 앞두고 마지막으로 안내드립니다. '+course+' '+d.round+'회 재시가 아직 확인되지 않았는데, 내일 수업 전까지는 꼭 마치고 오면 좋겠습니다. 재시로 개념을 정리한 상태로 들어와야 내일 진도가 온전히 이어집니다.\n\n'
      +'아래 링크에서 취약 개념 보강 후 재시까지 짧게 마무리해 주세요. '+reask+'\n\n'
      +link+'\n\n'
      +'오늘 안에 완료해 두시면 내일 수업이 한결 수월합니다. 감사합니다.\n\n조준모 드림';
  }
  if(stage==='2'){
    return head+' 재시 리마인드\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'앞서 안내드린 '+course+' '+d.round+'회 재시가 아직 확인되지 않아 다시 한번 챙겨드립니다. 지금 보강하면 개념이 굳기 전에 정확히 잡히는 시점이라, 이번 주가 지나기 전에 마무리하시길 권합니다.\n\n'
      +'아래 링크에서 틀린 개념만 강의록으로 짚은 뒤 재시를 보면 됩니다. 오래 걸리지 않고, '+reask+'\n\n'
      +link+'\n\n'
      +'수업 전까지 마쳐 두면 다음 진도를 훨씬 편하게 따라갑니다. 감사합니다.\n\n조준모 드림';
  }
  // 1단계 (월요일 · 처음 안내)
  return head+' 재시 안내\n\n'
    +'안녕하세요, 화학 조준모입니다.\n\n'
    +d.name+' 학생이 '+course+' '+d.round+'회 '+d.att+'에서 '+d.score+'점으로 통과선(80점)에 조금 못 미쳤습니다. 저희 반은 틀린 개념을 다시 잡아 통과까지 마무리하는 재시 과정을 두는데, 이번 주 재시를 아직 시작하기 전이라 안내드립니다.\n\n'
    +'아래 링크에서 취약 개념만 강의록으로 보강한 뒤 재시를 보면 됩니다. '+reask+'\n\n'
    +link+'\n\n'
    +'누적 시험이라 이번 주 안에 마무리하면 다음 회차가 훨씬 수월합니다. 감사합니다.\n\n조준모 드림';
}
function copyShare(btn){
  var stage=btn.getAttribute('data-stage')||'1';
  var host=btn.closest('.copygrp')||btn.parentNode;
  var d={ name:host.getAttribute('data-name'), course:host.getAttribute('data-course'), round:host.getAttribute('data-round'),
    att:host.getAttribute('data-att'), score:host.getAttribute('data-score'), next:host.getAttribute('data-next'), link:host.getAttribute('data-link') };
  var msg=shareMsg(d, stage); if(!msg) return;
  var orig=btn.getAttribute('data-orig')||btn.textContent;
  var done=function(){ btn.textContent='복사됨 ✓'; btn.classList.add('copied');
    setTimeout(function(){ btn.textContent=orig; btn.classList.remove('copied'); }, 1800); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(msg).then(done).catch(fallback); }
  else fallback();
  function fallback(){ try{ var ta=document.createElement('textarea'); ta.value=msg; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); }catch(e){ prompt('메시지 복사', msg); } }
}

function rowHTML(p){
  var u=urgency(p.days);
  var sub=esc(p.school)+(p.year?' · '+esc(p.year)+'학년':'');
  return '<div class="row '+u+'"><div class="rinfo">'
    +'<div class="rname">'+esc(p.name)+'</div>'
    +'<div class="rsub">'+sub+'</div>'
    +'<div class="rwhat"><b>'+(COURSE[p.course]||esc(p.course))+' '+esc(p.round)+'회</b> · '
      +esc(p.lastAttempt)+' '+esc(p.score)+'점 미통과 → <span class="rneed">'+esc(p.nextNeeded)+' 미응시</span></div>'
    +(p.reportLink?'<div class="copygrp" data-link="'+escAttr(p.reportLink)+'" data-name="'+escAttr(p.name)+'" data-course="'+escAttr(p.course)+'" data-round="'+escAttr(p.round)+'" data-att="'+escAttr(p.lastAttempt)+'" data-score="'+escAttr(p.score)+'" data-next="'+escAttr(p.nextNeeded)+'">'
    +'<div class="cglab">카톡 안내 복사</div>'
    +'<button class="copybtn s1" data-stage="1" data-orig="1단계 · 월 안내" onclick="copyShare(this)">1단계 · 월 안내</button>'
    +'<button class="copybtn s2" data-stage="2" data-orig="2단계 · 수 리마인드" onclick="copyShare(this)">2단계 · 수 리마인드</button>'
    +'<button class="copybtn s3" data-stage="3" data-orig="3단계 · 전날 최종" onclick="copyShare(this)">3단계 · 전날 최종</button>'
    +'</div>':'')
    +'</div><div class="days '+u+'"><div class="dn">'+p.days+'</div><div class="dl">일 경과<br>('+esc(p.lastDate)+')</div></div></div>';
}

function render(P){
  var a=P.active||[], s=P.stale||[];
  var gen=document.getElementById('gen'); if(gen) gen.textContent='갱신 '+(P.generatedAt||'');
  var h='';
  h+='<div class="bar">'
    +'<div class="stat act"><div class="n">'+a.length+'</div><div class="l">재시 필요 (2주 내)</div></div>'
    +'<div class="stat stl"><div class="n">'+s.length+'</div><div class="l">이탈 추정 (2주+)</div></div>'
    +'<div class="stat"><div class="n">'+(P.activeDays||14)+'</div><div class="l">기준 일수</div></div></div>';
  h+='<div class="tools"><button class="btn p" onclick="load()">새로고침</button></div>';

  h+='<div class="sec-h">재시 필요 <span class="tag">'+a.length+'</span><span style="font-weight:600;color:var(--muted);font-size:11.5px">· 오래된 순</span></div>';
  if(!a.length){ h+='<div class="empty">2주 이내 재시 미응시 학생이 없습니다.</div>'; }
  else{ h+='<div class="muted-note">정시(또는 재시) 미통과 후 다음 재시를 아직 보지 않은 학생입니다. 토요일 수업 전에 확인하세요.</div>'; h+=a.map(rowHTML).join(''); }

  if(s.length){
    h+='<div class="stale"><details><summary>장기 미응시 · 이탈 추정 ('+s.length+'명, 알람 제외) ▾</summary>'
      +'<div class="muted-note">2주 이상 같은 시험의 재시를 보지 않은 학생입니다. 학원을 그만둔 경우가 섞일 수 있어 자동 알람에서는 제외합니다. 복귀가 확인되면 다시 응시하면 활성으로 돌아옵니다.</div>'
      +s.map(rowHTML).join('')+'</details></div>';
  }
  document.getElementById('app').innerHTML=h;
}

function demo(){
  var R='https://chemistreal.github.io/DT/report.html?student=';
  return { activeDays:14, generatedAt:'2026-06-20 14:30', active:[
    {name:'이지호',school:'휘문중',year:'2',course:'ch2',round:5,lastAttempt:'정시',score:73,nextNeeded:'재시',days:9,lastDate:'6/11',reportLink:R+'%ED%9C%98%EB%AC%B8%EC%A4%91-%EC%9D%B4%EC%A7%80%ED%98%B8'},
    {name:'박서준',school:'대청중',year:'3',course:'ch2',round:7,lastAttempt:'재시',score:78,nextNeeded:'재재시',days:5,lastDate:'6/15',reportLink:R+'demo2'},
    {name:'최예린',school:'역삼중',year:'2',course:'ch1',round:12,lastAttempt:'정시',score:68,nextNeeded:'재시',days:3,lastDate:'6/17',reportLink:R+'demo3'},
    {name:'김도윤',school:'언주중',year:'1',course:'gc',round:3,lastAttempt:'정시',score:71,nextNeeded:'재시',days:2,lastDate:'6/18',reportLink:R+'demo4'}
  ], stale:[
    {name:'정민서',school:'개포중',year:'3',course:'ch2',round:4,lastAttempt:'정시',score:62,nextNeeded:'재시',days:23,lastDate:'5/28',reportLink:R+'demo5'},
    {name:'한지우',school:'구룡중',year:'2',course:'ch1',round:9,lastAttempt:'재시',score:75,nextNeeded:'재재시',days:31,lastDate:'5/20',reportLink:R+'demo6'}
  ]};
}

function load(){
  if(Q.has('demo')){ render(demo()); return; }
  document.getElementById('app').innerHTML='<div class="loading">불러오는 중…</div>';
  fetch(STATUS_URL+'?action=pending').then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok&&j.pending) render(j.pending);
    else document.getElementById('app').innerHTML='<div class="err">데이터를 불러오지 못했습니다. Apps Script 배포(/exec)와 권한을 확인하세요.</div>';
  }).catch(function(e){
    document.getElementById('app').innerHTML='<div class="err">연결 실패: '+esc(String(e))+'<br>Apps Script 웹앱이 배포되어 있고 액세스가 "모든 사용자"인지 확인하세요.</div>';
  });
}
load();
</script>
</body>
</html>

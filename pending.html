<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미응시 현황 · Chemistreal</title>
<style>
:root{ --ink:#23272e; --gold:#C9A227; --char:#2b2f36; --muted:#6D7178; --line:#e8eaed; --bg:#f5f6f8;
  --red:#c0392b; --amber:#c9851f; --green:#1f7a4d; }
*{box-sizing:border-box}
body{font-family:'Noto Sans CJK KR','Noto Sans KR',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.6px solid var(--gold);
  padding:18px 2px 11px;margin-bottom:14px}
.brand{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.h1{font-size:21px;font-weight:800;color:var(--char);margin:3px 0 0}
.who{text-align:right;font-size:12.5px;color:#4b5563}
.who b{color:#111}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:96px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
.stat.act .n{color:var(--red)} .stat.stl .n{color:var(--muted)}
.sec-h{font-size:14px;font-weight:800;color:var(--char);margin:18px 0 9px;display:flex;align-items:center;gap:7px}
.sec-h .tag{font-size:11.5px;font-weight:700;color:#fff;background:var(--char);border-radius:5px;padding:1px 7px}
.row{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.urgent{border-left:4px solid var(--red)}
.row.warn{border-left:4px solid var(--amber)}
.row.ok{border-left:4px solid var(--gold)}
.rinfo{flex:1;min-width:0}
.rname{font-weight:800;font-size:15.5px;color:#1f2937}
.rsub{font-size:12px;color:var(--muted);margin-top:1px}
.rwhat{font-size:13px;color:#374151;margin-top:5px}
.rwhat b{color:#1f2937}
.rneed{color:var(--red);font-weight:700}
.copybtn{margin-top:8px;font-size:12px;font-weight:700;color:var(--char);background:#fff;border:1.3px solid var(--gold);border-radius:8px;padding:7px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.copybtn:active{transform:scale(.98)}
.copybtn.copied{background:#eef7f0;border-color:var(--green);color:var(--green)}
.copygrp{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.cglab{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin-bottom:1px}
.copygrp .copybtn{margin-top:0;width:100%;text-align:center;border-left-width:3px}
.copybtn.s1{border-left-color:#3b82f6}
.copybtn.s2{border-left-color:#f59e0b}
.copybtn.s3{border-left-color:#ef4444}
.days{flex-shrink:0;text-align:center;min-width:62px}
.days .dn{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.days .dl{font-size:11.5px;color:var(--muted);margin-top:2px}
.days.urgent .dn{color:var(--red)} .days.warn .dn{color:var(--amber)} .days.ok .dn{color:var(--green)}
.muted-note{font-size:12px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.stale details summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:700;padding:6px 2px;list-style:none}
.stale details summary::-webkit-details-marker{display:none}
.stale .row{opacity:.72}
.tools{display:flex;gap:8px;margin:6px 0 16px}
.btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:13px;font-weight:700;
  color:#374151;cursor:pointer}
.btn.p{background:var(--char);color:#fff;border-color:var(--char)}
.loading{text-align:center;color:var(--muted);padding:40px 10px}
.err{background:#fff4f3;border:1px solid #f3c9c4;color:#922;border-radius:10px;padding:12px;font-size:13px}
.foot{text-align:center;color:#b9bec7;font-size:11.5px;margin-top:26px}
.stat.exabs .n{color:var(--red)}
.abx-cls{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:8px;border-left:4px solid var(--red)}
.abx-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.abx-nm{font-weight:800;font-size:15px;color:#1f2937}
.abx-badge{font-size:11.5px;font-weight:700;color:#fff;background:var(--char);border-radius:5px;padding:1px 7px}
.abx-cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--red)}
.abx-bc{margin:9px 0 4px}
.abx-bc .copybtn{width:100%;text-align:center;border-left-width:3px;border-left-color:var(--gold)}
.abx-stu{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0 2px;border-top:1px dashed var(--line);margin-top:6px}
.abx-sname{font-weight:700;font-size:14px;color:#374151;min-width:66px}
.abx-btns{flex-direction:row;gap:6px;margin-left:auto;margin-top:0}
.abx-btns .copybtn{width:auto;margin-top:0;border-left-width:3px}
.copybtn.a1{border-left-color:#3b82f6}
.copybtn.a2{border-left-color:#8b5cf6}
.copybtn.abc{border-left-color:var(--gold)}
.copybtn.pass{border-left-width:3px;border-left-color:var(--green);width:100%;text-align:center}
.row.pass{border-left-color:var(--green)}
.rpass{color:var(--green);font-weight:800}
.rtry{font-size:11.5px;font-weight:700;color:var(--muted);background:#f1f5f9;border-radius:5px;padding:1px 6px;margin-left:2px}
.rtry.one{color:#0B6E39;background:#eef7f0}
.stat.pss .n{color:var(--green)}
.zipbtn{border:1px solid var(--teal,#0B6E6E);color:var(--teal-d,#0A5A5A);background:#fff;border-radius:7px;padding:4px 10px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;margin-left:8px;white-space:nowrap}
.zipbtn:hover{background:rgba(11,110,110,.07)}
.zipbtn[data-busy="1"]{opacity:.7;cursor:progress}
.pdfc{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:74px}
.pdfbtn{border:1px solid var(--gold);color:#7a5d20;background:#fff;border-radius:8px;padding:7px 9px;font-size:11.5px;font-weight:800;line-height:1.35;cursor:pointer;font-family:inherit;text-align:center;white-space:nowrap}
.pdfbtn:hover{background:rgba(201,162,39,.08)}
.pdfbtn[data-busy="1"]{opacity:.7;cursor:progress}
.hidebtn{margin-top:7px;border:1px solid var(--line);color:var(--muted);background:#fff;border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.roundsel{border:1px solid var(--line);color:#6b7280;background:#fff;border-radius:6px;padding:3px 6px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.roundsel:hover{border-color:var(--gold);color:#7a5d20}
.roundsel.on{border-color:var(--gold);color:#7a5d20;background:rgba(201,162,39,.08)}
.hidebtn:hover{border-color:#cbd5e1;color:#4b5563}
.hidwrap{margin:2px 0 8px}
.hidwrap details summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:700;padding:6px 2px;list-style:none}
.hidwrap details summary::-webkit-details-marker{display:none}
.hidrow{background:#fff;border:1px dashed var(--line);border-radius:9px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:#6b7280}
.hidrow b{color:#374151}
.unhidebtn{margin-left:auto;border:1px solid var(--gold);color:#7a5d20;background:#fff;border-radius:7px;padding:4px 10px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.unhidebtn:hover{background:rgba(201,162,39,.08)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="brand">다원교육 영재관 · Chemistreal</div><h1 class="h1">미응시 현황</h1></div>
    <div class="who"><div>조준모 화학</div><div id="gen" style="margin-top:3px"></div></div>
  </div>
  <div id="app"><div class="loading">불러오는 중…</div></div>
  <div class="foot">Chemistreal · 조준모 화학 · 다원교육 영재관<br>매주 수요일 18시 whwnsah11@naver.com 자동 발송 · 2주 이상 미응시는 이탈 추정으로 제외</div>
</div>
<script>
var STATUS_URL='https://script.google.com/macros/s/AKfycbzvFaPXgEgCBQ8HowtP8tPTtdiIVFtmZSUf0KFXUOVOh3ektrFMkz4KSR4I52LDBzB8rw/exec';
/* ---- 관리자 코드 (Apps Script 스크립트 속성 ADMIN_TOKEN 값) ---- */
function admTok(){ var t=''; try{ t=localStorage.getItem('dt_admtok')||''; }catch(e){} return (t||'').trim(); }   /* 전체 공개 모드: 관리자 코드 입력 없이 동작 */
function admReset(){ try{ localStorage.removeItem('dt_admtok'); }catch(e){} }

var COURSE={ch1:'화학Ⅰ',ch2:'화학Ⅱ',gc:'일반화학'};
var Q=new URLSearchParams(location.search);

function urgency(days){ return days>=7?'urgent':days>=4?'warn':'ok'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 반별 시험 회차 수동 지정(브라우저 저장). 서버 자동 감지가 틀릴 때 화면에서 바로 고친다. */
function absOv(){ try{ return JSON.parse(localStorage.getItem('dt_absov')||'{}')||{}; }catch(e){ return {}; } }
function setAbsRoundVal(el){
  var label=el.getAttribute('data-label'), v=el.value, cur=absOv();
  if(v===''){ delete cur[label]; } else { cur[label]=Number(v); }
  try{ localStorage.setItem('dt_absov', JSON.stringify(cur)); }catch(e){}
  load();   // 선택한 회차로 미응시 다시 조회 (자동=서버 최빈값)
}

var STAGE_LABEL={'1':'1단계 · 월요일','2':'2단계 · 수요일','3':'3단계 · 최종'};
function shareMsg(d, stage){
  var course=COURSE[d.course]||d.course;
  var head='[다원교육 영재관 · 화학] '+d.name+' 학생';
  var reask='재시는 아이가 틀린 개념만 골라 개별 출제되며, 처음 본 문항과 겹치지 않습니다.';
  var link='▶ '+d.link;
  if(stage==='3'){
    return head+' 재시 최종 안내\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'마지막으로 안내드립니다. '+course+' '+d.round+'회 재시가 아직 확인되지 않았습니다. 다음 수업 전까지는 꼭 마치고 오면 좋겠습니다. 재시로 개념을 정리한 상태로 들어와야 다음 진도가 온전히 이어집니다.\n\n'
      +'아래 링크에서 취약 개념 보강 후 재시까지 짧게 마무리해 주세요. '+reask+'\n\n'
      +link+'\n\n'
      +'미리 완료해 두면 다음 수업이 한결 수월합니다. 감사합니다.\n\n조준모 드림';
  }
  if(stage==='2'){
    return head+' 재시 리마인드\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'앞서 안내드린 '+course+' '+d.round+'회 재시가 아직 확인되지 않아 다시 한번 챙겨드립니다. 지금 보강하면 개념이 굳기 전에 정확히 잡히는 시점이라, 이번 주가 지나기 전에 마무리하시길 권합니다.\n\n'
      +'아래 링크에서 틀린 개념만 강의록으로 짚은 뒤 재시를 보면 됩니다. 오래 걸리지 않고, '+reask+'\n\n'
      +link+'\n\n'
      +'수업 전까지 마쳐 두면 다음 진도를 훨씬 편하게 따라갑니다. 감사합니다.\n\n조준모 드림';
  }
  // 1단계 (월요일 · 처음 안내)
  return head+' 재시 안내\n\n'
    +'안녕하세요, 화학 조준모입니다.\n\n'
    +d.name+' 학생이 '+course+' '+d.round+'회 '+d.att+'에서 '+d.score+'점으로 통과선(80점)에 조금 못 미쳤습니다. 저희 반은 틀린 개념을 다시 잡아 통과까지 마무리하는 재시 과정을 두는데, 이번 주 재시를 아직 시작하기 전이라 안내드립니다.\n\n'
    +'아래 링크에서 취약 개념만 강의록으로 보강한 뒤 재시를 보면 됩니다. '+reask+'\n\n'
    +link+'\n\n'
    +'누적 시험이라 이번 주 안에 마무리하면 다음 회차가 훨씬 수월합니다. 감사합니다.\n\n조준모 드림';
}
/* ── 통과한 학생에게 보내는 문자 ────────────────────────────────────
   여태 이 페이지에서 복사할 수 있는 것은 전부 독촉이었다 — 재시 안내,
   시험 안내, 리마인드, 최종 안내. 통과한 학생에게는 아무것도 가지 않았다.
   잘한 아이가 가장 조용한 셈이다.

   한 번에 통과한 것과 재시로 마무리한 것은 다른 이야기다. 재시로 통과한
   학생에게 "한 번에 넘겼다" 고 쓰면 안 읽어 본 티가 난다. 시도 수로 가른다. */
function passMsg(d){
  var course=COURSE[d.course]||d.course;
  var sc=Number(d.score), tries=Number(d.tries)||1;
  var head='[다원교육 영재관 · 화학] '+d.name+' 학생 통과 안내';
  var how;
  if(tries<=1){
    how=d.name+' 학생이 '+course+' '+d.round+'회 '+(d.att||'정시')+'에서 '+d.score+'점으로 통과했습니다. '
      +(sc>=100?'만점입니다. ':(sc>=95?'거의 흐트러짐이 없었습니다. ':''))
      +'재시 없이 한 번에 통과선(80점)을 넘겼습니다.';
  }else{
    how=d.name+' 학생이 '+course+' '+d.round+'회 '+(d.att||'재시')+'에서 '+d.score+'점으로 통과했습니다. '
      +'정시에서 놓친 개념을 다시 잡아 통과까지 마무리했습니다. 틀린 것을 그냥 넘기지 않고 끝까지 메운 과정이라, '
      +'점수보다 그 과정이 남습니다.';
  }
  return head+'\n\n'
    +'안녕하세요, 화학 조준모입니다.\n\n'
    +how+'\n\n'
    +(d.link?('아래 리포트에서 문항별 결과와 개념별 정리를 확인하실 수 있습니다.\n\n▶ '+d.link+'\n\n'):'')
    +'누적 시험이라 이번 회차를 깔끔히 넘긴 것이 다음 회차에 그대로 이어집니다. 감사합니다.\n\n조준모 드림';
}
function copyShare(btn){
  var stage=btn.getAttribute('data-stage')||'1';
  var host=btn.closest('.copygrp')||btn.parentNode;
  var d={ name:host.getAttribute('data-name'), course:host.getAttribute('data-course'), round:host.getAttribute('data-round'),
    att:host.getAttribute('data-att'), score:host.getAttribute('data-score'), next:host.getAttribute('data-next'),
    tries:host.getAttribute('data-tries'), link:host.getAttribute('data-link') };
  var kind=host.getAttribute('data-kind')||'retake';
  var msg=(kind==='exam')?absentMsg(d, stage):(kind==='pass')?passMsg(d):shareMsg(d, stage); if(!msg) return;
  var orig=btn.getAttribute('data-orig')||btn.textContent;
  var done=function(){ btn.textContent='복사됨 ✓'; btn.classList.add('copied');
    setTimeout(function(){ btn.textContent=orig; btn.classList.remove('copied'); }, 1800); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(msg).then(done).catch(fallback); }
  else fallback();
  function fallback(){ try{ var ta=document.createElement('textarea'); ta.value=msg; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); }catch(e){ prompt('메시지 복사', msg); } }
}

function siteBase(){ var b=location.href.split('?')[0].split('#')[0]; return b.slice(0,b.lastIndexOf('/')+1); }
function examLink(course, round){ return siteBase()+'exam.html?c='+encodeURIComponent(course)+'&r='+encodeURIComponent(round); }

/* 시험 미응시(정식 시험 자체를 안 본 학생) 안내 메시지. 링크는 응시 페이지(exam.html?c=&r=). */
function absentMsg(d, stage){
  var course=COURSE[d.course]||d.course;
  var link='\u25b6 '+d.link;
  if(stage==='bc'){
    return '[다원교육 영재관 · 화학] '+course+' '+d.round+'회 온라인 시험 안내\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'이번 '+course+' '+d.round+'회 누적 OX 시험을 아직 응시하지 않은 학생은 아래 링크에서 온라인으로 응시해 주세요. 60문항 OX이고, 다음 수업 전까지 마치면 됩니다.\n\n'
      +link+'\n\n'
      +'응시하면 결과와 취약 개념이 개인 리포트에 바로 반영됩니다. 누적 시험이라 한 주를 건너뛰면 다음 회차가 그만큼 버거워지니 꼭 챙겨 주세요. 감사합니다.\n\n조준모 드림';
  }
  var head='[다원교육 영재관 · 화학] '+d.name+' 학생';
  if(stage==='2'){
    return head+' 시험 리마인드\n\n'
      +'안녕하세요, 화학 조준모입니다.\n\n'
      +'앞서 안내드린 '+course+' '+d.round+'회 시험이 아직 응시 전이라 다시 한번 챙겨드립니다. 다음 수업은 이 회차 내용을 이어서 진행하기 때문에, 그 전에 응시해 두어야 진도가 온전히 연결됩니다.\n\n'

/* ===== 안내 완료 학생 숨김 (이 브라우저·이 페이지에서만 적용, 서버 데이터 불변) ===== */
var HIDE_LS='dt_pending_hide_v1';
function hkey(p){ return [p.course,p.round,p.name,p.nextNeeded].join('|'); }
function hiddenMap(){ try{ return JSON.parse(localStorage.getItem(HIDE_LS)||'{}')||{}; }catch(e){ return {}; } }
function saveHidden(m){ try{ localStorage.setItem(HIDE_LS, JSON.stringify(m)); }catch(e){} }
/* 현재 목록에 더 이상 없는(재시 응시 등으로 해소된) 숨김 키는 자동 정리 */
function pruneHidden(list){
  var m=hiddenMap(), live={}, changed=false;
  (list||[]).forEach(function(p){ live[hkey(p)]=1; });
  Object.keys(m).forEach(function(k){ if(!live[k]){ delete m[k]; changed=true; } });
  if(changed) saveHidden(m);
  return m;
}
function hideRow(btn){
  var k=btn.getAttribute('data-key'); if(!k) return;
  var m=hiddenMap(); m[k]={t:Date.now()}; saveHidden(m);
  if(_LASTP) render(_LASTP,_LASTABS,_LASTFAIL);
}
function unhideRow(btn){
  var k=btn.getAttribute('data-key'); if(!k) return;
  var m=hiddenMap(); delete m[k]; saveHidden(m);
  if(_LASTP) render(_LASTP,_LASTABS,_LASTFAIL);
}
function unhideAll(){
  saveHidden({});
  if(_LASTP) render(_LASTP,_LASTABS,_LASTFAIL);
}
function hidRowHTML(p){
  return '<div class="hidrow"><b>'+esc(p.name)+'</b> '+(COURSE[p.course]||esc(p.course))+' '+esc(p.round)+'회 · '+esc(p.nextNeeded)+' 미응시 · '+p.days+'일 경과'

}

var _LASTP=null,_LASTABS=null,_LASTFAIL=false,_LASTPASS=null;
function render(P, ABS, absFail, PASS){
  _LASTP=P; _LASTABS=ABS; _LASTFAIL=absFail;
  if(PASS!==undefined) _LASTPASS=PASS;
  PASS=_LASTPASS;
  var a0=P.active||[], s0=P.stale||[];
  var hid=pruneHidden(a0.concat(s0));
  var a=[], s=[], hidden=[];
  a0.forEach(function(p){ (hid[hkey(p)]?hidden:a).push(p); });
  s0.forEach(function(p){ (hid[hkey(p)]?hidden:s).push(p); });
  _ACTIVE=a.slice();
  var absClasses=(ABS&&ABS.classes||[]).filter(function(c){return c.absent&&c.absent.length;});
  var absN=absClasses.reduce(function(t,c){return t+c.absent.length;},0);
  var gen=document.getElementById('gen'); if(gen) gen.textContent='갱신 '+(P.generatedAt||(ABS&&ABS.generatedAt)||'');
  var h='';
  var pass=(PASS&&PASS.passed)||[];
  h+='<div class="bar">'
    +'<div class="stat exabs"><div class="n">'+absN+'</div><div class="l">시험 미응시</div></div>'
    +'<div class="stat act"><div class="n">'+a.length+'</div><div class="l">재시 필요 (2주 내)</div></div>'
    +'<div class="stat stl"><div class="n">'+s.length+'</div><div class="l">이탈 추정 (2주+)</div></div>'
    +'<div class="stat pss"><div class="n">'+pass.length+'</div><div class="l">통과 (2주 내)</div></div>'
    +'<div class="stat"><div class="n">'+(P.activeDays||14)+'</div><div class="l">기준 일수</div></div></div>';
  h+='<div class="tools"><button class="btn p" onclick="load()">새로고침</button></div>';

  // 시험 미응시 (roster 미응시자 기준) · 온라인 응시 안내
  h+='<div class="sec-h">시험 미응시 <span class="tag" style="background:var(--red)">'+absN+'</span><span style="font-weight:600;color:var(--muted);font-size:11.5px">· 온라인 응시 필요</span></div>';
  if(!ABS){ h+= absFail ? '<div class="muted-note">미응시자 명단을 불러오지 못했습니다. 잠시 후 <b>새로고침</b> 해주세요. (서버가 잠깐 응답하지 못한 경우로, 대개 다시 시도하면 됩니다.)</div>' : '<div class="muted-note">등록된 반 명단이 없습니다. roster.html에서 반 명단을 저장하세요.</div>'; }
  else if(!absN){ h+='<div class="empty">이번 회차 시험을 응시하지 않은 학생이 없습니다.</div>'; }
  else{ h+='<div class="muted-note">저장된 반 명단 기준, 이번 회차 시험 응시 기록이 없는 학생입니다. 버튼으로 온라인 응시 안내를 복사해 보내세요. (OX 워밍업이 아니라 정식 60문항 시험입니다.)</div>'; h+=absClasses.map(absentClassHTML).join(''); }

  h+='<div class="sec-h">재시 필요 <span class="tag">'+a.length+'</span><span style="font-weight:600;color:var(--muted);font-size:11.5px">· 오래된 순</span>'+(a.length?'<button class="zipbtn" style="margin-left:auto" onclick="zipRetakePending(this)">재시지 ZIP ('+a.length+'명)</button>':'')+'</div>';
  if(!a.length){ h+='<div class="empty">'+(hidden.length?'표시할 재시 미응시 학생이 없습니다. (숨김 '+hidden.length+'명)':'2주 이내 재시 미응시 학생이 없습니다.')+'</div>'; }
  else{ h+='<div class="muted-note">정시(또는 재시) 미통과 후 다음 재시를 아직 보지 않은 학생입니다. 토요일 수업 전에 확인하세요. 안내를 보낸 학생은 행 오른쪽 <b>안내함 · 숨김</b> 버튼으로 이 페이지에서만 감출 수 있습니다.</div>'; h+=a.map(rowHTML).join(''); }

  if(hidden.length){
    h+='<div class="hidwrap"><details><summary>안내 완료로 숨긴 학생 '+hidden.length+'명 ▾ <span style="font-weight:600">(이 브라우저에서만 적용)</span></summary>'
      +'<div class="muted-note">안내 발송 후 숨긴 학생입니다. 서버 데이터에는 영향이 없고 이 페이지 목록에서만 빠집니다. 해당 재시를 응시하면 자동으로 정리되고, 다음 회차에 다시 미응시하면 새 항목으로 다시 나타납니다.</div>'
      +hidden.map(hidRowHTML).join('')
      +'<button class="btn" style="width:100%;margin-top:2px" onclick="unhideAll()">모두 복원</button>'
      +'</details></div>';
  }

  /* 통과한 학생. 독촉 목록 아래에 둔다 — 급한 것부터 보고, 그다음에 챙긴다. */
  h+='<div class="sec-h">통과 <span class="tag" style="background:var(--green)">'+pass.length+'</span>'
    +'<span style="font-weight:600;color:var(--muted);font-size:11.5px">· 최근 2주 · 최근 순</span></div>';
  if(!PASS){ h+='<div class="muted-note">통과 목록을 불러오지 못했습니다. <b>새로고침</b> 해주세요.</div>'; }
  else if(!pass.length){ h+='<div class="empty">최근 2주 안에 통과한 학생이 없습니다.</div>'; }
  else{
    h+='<div class="muted-note">최근 2주 안에 통과선(80점)을 넘긴 학생입니다. 여태 이 페이지에서 복사할 수 있는 것은 전부 독촉이었는데, '
      +'통과한 학생에게도 한 줄 보낼 수 있게 두었습니다. <b>한 번에 통과</b>와 <b>재시로 마무리</b>는 문구가 다릅니다.</div>';
    h+=pass.map(passRowHTML).join('');
  }

  if(s.length){
    h+='<div class="stale"><details><summary>장기 미응시 · 이탈 추정 ('+s.length+'명, 알람 제외) ▾</summary>'
      +'<div class="muted-note">2주 이상 같은 시험의 재시를 보지 않은 학생입니다. 학원을 그만둔 경우가 섞일 수 있어 자동 알람에서는 제외합니다. 복귀가 확인되면 다시 응시하면 활성으로 돌아옵니다.</div>'
      +s.map(rowHTML).join('')+'</details></div>';
  }
  document.getElementById('app').innerHTML=h;
}

/* ── 누구에게 무슨 안내를 보냈나 ────────────────────────────────────
   통합 셸이 문자를 복사하면 그 줄을 가라앉힌다. 그 표시가 화면에서만 살면
   새로고침에 사라지고 다른 기기에서는 안 보인다 — 여덟 명 중 다섯에게 보낸 뒤
   잠깐 다른 일을 하면 누구에게 보냈는지 다시 세야 한다.

   셸은 아무것도 쓰지 않기로 되어 있으므로(지워도 안전한 파일), **이 화면이
   대신 쓴다.** 셸은 문구를 빌리듯 이 함수를 빌린다.

   POST 는 CORS 가 막히므로 no-cors 로 던진다 — 앱스크립트는 받아 적고,
   이쪽은 성공 여부를 못 읽는다. 그래도 괜찮다: 못 적혀도 다음에 셸이 시트를
   다시 읽으면 표시가 없을 뿐, 문자는 이미 복사돼 있다(잃는 것이 없다). */
function markSent(d){
  try{
    return fetch(STATUS_URL, { method:'POST', mode:'no-cors',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'marksent', kind:d.kind, name:d.name,
                             course:d.course, round:d.round, off:!!d.off }) });
  }catch(e){ return Promise.resolve(); }
}
function unmarkSent(d){ return markSent({ kind:d.kind, name:d.name, course:d.course, round:d.round, off:true }); }

/* 미루기도 같은 길이다. d.until 은 'YYYY-MM-DD', off:true 면 "지금 보기".
   지우는 것이 아니라 미루는 것이므로, 못 적혀도 잃는 것은 없다 —
   다음에 열면 그 줄이 그대로 목록에 있을 뿐이다. */
function snoozeStu(d){
  try{
    return fetch(STATUS_URL, { method:'POST', mode:'no-cors',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'snooze', kind:d.kind, name:d.name,
                             course:d.course, round:d.round,
                             until:d.until||'', off:!!d.off }) });
  }catch(e){ return Promise.resolve(); }
}

function fetchJSON_(url, tries){
  tries = tries || 3;
  return fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    try{ return JSON.parse(t); }catch(e){ throw new Error('bad-json'); }
  }).catch(function(e){
    if(tries>1){ return new Promise(function(res){ setTimeout(res, 700); }).then(function(){ return fetchJSON_(url, tries-1); }); }
    return null;
  });
}
/* 못 물어봤을 때 하는 말. 예전에는 "Apps Script 배포(/exec)와 권한을 확인하세요"
   였다 — 맞는 말이지만 **선생님이 할 수 있는 일이 아니다.** 대개는 서버가 잠깐
   밀린 것이고, 다시 누르면 된다. 그러니 먼저 다시 누를 자리를 준다.
   원인은 접어서 아래에 남긴다(정말 배포가 끊겼을 때 필요하다). */
function failBox(why){
  return '<div class="err"><b>미응시 현황을 불러오지 못했습니다.</b> '
    + '기록이 없는 것이 아니라 <b>지금 서버에 물어보지 못한 것</b>입니다. '
    + '<button id="pendRetry" class="ghost" style="margin-left:6px">다시 불러오기</button>'
    + '<div style="margin-top:8px;font-size:12px;opacity:.75">계속 이러면 Apps Script 웹앱이 배포되어 있고 '
    + '액세스가 "모든 사용자"인지 확인하세요.' + (why ? ' (' + esc(why) + ')' : '') + '</div></div>';
}
document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'pendRetry') load();
});
function load(){
  if(Q.has('demo')){ render(demo(), demoAbs(), false, demoPass()); return; }
  document.getElementById('app').innerHTML='<div class="loading">불러오는 중…</div>';
  var tok=encodeURIComponent(admTok());
  Promise.all([
    fetchJSON_(STATUS_URL+'?action=absentees&token='+tok+'&ov='+encodeURIComponent(JSON.stringify(absOv()))+'&t='+Date.now()),
    fetchJSON_(STATUS_URL+'?action=pending&token='+tok+'&t='+Date.now()),
    /* 통과 목록은 못 받아도 나머지를 막지 않는다 — 급한 것은 독촉 쪽이다. */
    fetchJSON_(STATUS_URL+'?action=passed&token='+tok+'&days=14&t='+Date.now())
  ]).then(function(res){
    var A=res[0], P=res[1], S=res[2];
    if((A&&A.error==='auth')||(P&&P.error==='auth')){ admReset(); document.getElementById('app').innerHTML='<div class="err">관리자 코드가 올바르지 않습니다. 페이지를 새로고침한 뒤 다시 입력해 주세요.</div>'; return; }
    if(!P||!P.ok||!P.pending){ document.getElementById('app').innerHTML=failBox(); return; }
    render(P.pending, (A&&A.ok&&A.absentees)?A.absentees:null, !(A&&A.ok), (S&&S.ok&&S.passed)?S.passed:null);
  }).catch(function(e){
    document.getElementById('app').innerHTML=failBox(String(e));
  });
}
/* ===== 오프라인 인쇄용 ZIP 다운로드 ===== */
var _ACTIVE=[];   // 재시 필요 목록 캐시(zipRetakePending 용)
var JSZIP_URL='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
function loadJSZip(){ if(window.JSZip) return Promise.resolve(); return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=JSZIP_URL; s.onload=res; s.onerror=function(){rej(new Error('JSZip 로드 실패'));}; document.head.appendChild(s); }); }
function safeName(s){ return String(s||'학생').replace(/[\\/:*?"<>|]/g,'').trim()||'학생'; }
function keyFromLink(link){ try{ var m=String(link||'').match(/[?&]student=([^&]+)/); if(!m) return ''; var raw=decodeURIComponent(m[1]); var li=raw.lastIndexOf('-'); if(li>0 && /^[0-9a-z]{8}$/.test(raw.slice(li+1))) return raw.slice(0,li); return raw; }catch(e){ return ''; } }
function saveBlob(blob,fname){ var u=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=u; a.download=fname; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1500); }

// 미응시(정시) 반 -> 그 회차 시험지 1부를 학생 이름별로 복사해 ZIP
async function zipExamClass(btn){
  if(btn.dataset.busy==='1') return; var orig=btn.textContent; btn.dataset.busy='1';
  var course=btn.getAttribute('data-course'), round=Number(btn.getAttribute('data-round')), label=btn.getAttribute('data-label');
  var names=[]; try{ names=JSON.parse(btn.getAttribute('data-absent')||'[]'); }catch(e){ names=[]; }
  if(!names.length){ alert('미응시자가 없습니다.'); btn.dataset.busy='0'; return; }
  try{
    btn.textContent='라이브러리\u2026'; await loadJSZip();
    btn.textContent='시험지 생성\u2026';
    var made=await DTPDF.make({course:course, round:round, kind:'exam', variant:'jeongsi', output:'blob', onstep:function(m){ btn.textContent=m||orig; }});
    var zip=new JSZip();
    names.forEach(function(nm){ zip.file(safeName(nm)+'.pdf', made.blob); });
    btn.textContent='압축\u2026';
    var out=await zip.generateAsync({type:'blob'});
    saveBlob(out, safeName(label)+'_'+round+'회_시험지.zip');
    btn.textContent='\u2713 완료';
  }catch(e){ btn.textContent=orig; alert('ZIP 생성 실패: '+(e&&e.message?e.message:e)); }
  setTimeout(function(){ btn.textContent=orig; btn.dataset.busy='0'; },1600);
}

// 학생별 개인화 재시 문제·OMR·해설 통합 PDF 다운로드 (문자탭 행 우측 버튼)
async function dlStudentPdf(btn){
  if(btn.dataset.busy==='1') return; var orig=btn.innerHTML; btn.dataset.busy='1';
  var name=btn.getAttribute('data-name')||'', course=btn.getAttribute('data-course'), round=Number(btn.getAttribute('data-round'));
  var vlab=String(btn.getAttribute('data-next')||'재시'); var key=keyFromLink(btn.getAttribute('data-link'));
  var attNo=0; for(var ci=0;ci<vlab.length;ci++){ if(vlab.charAt(ci)==='재') attNo++; } attNo=attNo+1;  // 재시=2,재재시=3...
  try{
    btn.textContent='문항 생성\u2026';
    var rr=await DTRetake.items({key:key, course:course, round:round, attemptNo:attNo});
    if(!rr || !rr.items || !rr.items.length) throw new Error('첫 응시 기록이 없어 재시지를 만들 수 없습니다');
    await DTPDF.make({items:rr.items, course:course, round:round, vlabel:vlab, kind:'full', scoring:rr.scoring,
      sname:name, fname:safeName(name)+'_'+vlab+'_문제·OMR·해설.pdf',
      onstep:function(m){ btn.textContent=m||'생성 중\u2026'; }});
    btn.textContent='\u2713 저장됨';
  }catch(e){ btn.innerHTML=orig; btn.dataset.busy='0'; alert('PDF 생성 실패: '+(e&&e.message?e.message:e)); return; }
  setTimeout(function(){ btn.innerHTML=orig; btn.dataset.busy='0'; },1600);
}

// 재시 필요 학생 -> 각자 개인화 재시지(이름.pdf) ZIP
async function zipRetakePending(btn){
  if(btn.dataset.busy==='1') return; var orig=btn.textContent; btn.dataset.busy='1';
  var list=_ACTIVE.slice();
  if(!list.length){ alert('재시 필요 학생이 없습니다.'); btn.dataset.busy='0'; return; }
  try{
    btn.textContent='라이브러리\u2026'; await loadJSZip();
    var zip=new JSZip(); var ok=0, fail=[];
    for(var i=0;i<list.length;i++){
      var s=list[i]; var key=keyFromLink(s.reportLink);
      var vlab=String(s.nextNeeded||'재시'); var attNo=0; for(var ci=0;ci<vlab.length;ci++){ if(vlab.charAt(ci)==='재') attNo++; } attNo=attNo+1;  // 재시=2,재재시=3,재재재시=4...
      btn.textContent=vlab+'지 '+(i+1)+'/'+list.length+' ('+ (s.name||'') +')';
      try{
        var rr=await DTRetake.items({key:key, course:s.course, round:s.round, attemptNo:attNo});
        if(!rr || !rr.items.length){ fail.push((s.name||key)+(isRe?' (재시 기록 없음)':'')); continue; }
        var made=await DTPDF.make({items:rr.items, course:s.course, round:Number(s.round), vlabel:vlab, kind:'exam', scoring:rr.scoring, output:'blob', fname:safeName(s.name)+'_'+vlab+'.pdf'});
        zip.file(made.fname, made.blob); ok++;
      }catch(e){ fail.push((s.name||key)+' ('+(e&&e.message?e.message:e)+')'); }
    }
    if(!ok){ btn.textContent=orig; alert('생성된 재시지가 없습니다.'+(fail.length?'\n실패: '+fail.slice(0,5).join(', '):'')); btn.dataset.busy='0'; return; }
    btn.textContent='압축\u2026';
    var out=await zip.generateAsync({type:'blob'});
    saveBlob(out, '재시·재재시지_'+ok+'명.zip');
    btn.textContent='\u2713 '+ok+'명';
    if(fail.length) alert('일부 실패('+fail.length+'명): '+fail.slice(0,6).join(', ')+'\n(첫 응시 기록이 없으면 재시지를 만들 수 없습니다.)');
  }catch(e){ btn.textContent=orig; alert('ZIP 생성 실패: '+(e&&e.message?e.message:e)); }
  setTimeout(function(){ btn.textContent=orig; btn.dataset.busy='0'; },1800);
}

load();

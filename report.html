로 결정**(계수와 다를 수 있음). 속도 결정 단계를 비추는 창이라 단일 단계에서만 계수와 같고, 분수·음수도 나온다.", "속도 상수": "**속도 상수 k = 온도·촉매에 의존**(농도와 무관). 농도는 충돌 횟수(속도)를, k는 충돌당 성공 확률을 담아, k=A·e^(−Ea/RT)로 정해진다.", "아레니우스 식": "**k = A·e^(-Ea/RT)**(온도 ↑ → k ↑, Ea ↑ → k ↓). 지수항은 문턱 넘을 확률(볼츠만), A는 충돌·배향을 담는다.", "촉매와 역반응": "**촉매는 정·역반응 모두 빠르게**(평형 위치·K 불변). 공유 봉우리를 낮춰 양방향을 함께 가속하니, 같은 평형에 더 빨리 도달할 뿐이다.", "온도와 유효 충돌": "**온도 ↑ → 활성화 에너지 넘는 입자 비율 ↑**(유효 충돌 증가). 볼츠만 분포가 높은 쪽으로 이동해 문턱 넘는 꼬리가 커지는 것이 핵심이다.", "촉매 작용": "**촉매 = 활성화 에너지 낮은 새 경로 제공.** 낮아진 문턱을 더 많이 넘어 빨라지고, ΔH와 평형은 바꾸지 않으며 반응 후 회복된다.", "시간과 속도": "**반응 진행될수록 느려짐**(반응물 농도 감소).", "전체 차수": "**전체 차수 = 각 차수의 합**(m + n, 곱 아님).", "증기압 정의": "**증기압 = 액체-증기 동적 평형 시 증기의 압력.** 증발 속도와 응축 속도가 같아진 상태의 압력이라, 액체가 남아 있어도 도달하는 고유값이다.", "증기압과 분자 간 힘": "**분자 간 힘 약할수록 증기압 큼**(반비례).", "휘발성과 증기압": "**휘발성 큼 = 증기압 큼**(비례). 분자 간 힘 약함·휘발성 큼·증기압 큼·끓는점 낮음이 한 묶음이라, 하나를 알면 나머지를 안다.", "증기압 세기 성질": "**증기압 = 세기 성질**(양·표면적 무관, 온도·종류만 의존). 증발=응축 평형값이라, 표면적은 도달 속도만 바꾸고 평형 압력은 안 바꾼다.", "동적 평형": "**동적 평형 = 증발 속도 = 응축 속도**(둘 다 계속 일어남).", "끓음 조건": "**끓음 = 증기압이 외부 압력과 같아질 때.**", "끓음 정의": "**끓음 = 내부에서도 기화**(증발은 표면만).", "끓는점 정의": "**끓는점 = 증기압이 외부 압력과 같아지는 온도.** 그 순간 내부에 기포가 버틸 수 있어 끓고, 분자 간 힘과 외부 압력 둘에 달렸다.", "정상 끓는점": "**정상 끓는점 = 1기압에서의 끓는점**(물 100°C).", "압력과 끓는점": "**외부 압력 ↓ → 끓는점 ↓**(같은 방향). 증기압이 도달할 목표가 낮아져서이고, 이를 이용한 진공 증류로 열에 약한 물질을 낮은 온도에 정제한다.", "분자 간 힘과 끓는점": "**분자 간 힘 강할수록 끓는점 높음.**", "증기압과 끓는점": "**증기압 큼 → 끓는점 낮음**(반비례).", "증기압-온도 곡선": "**증기압-온도 곡선 = 위로 볼록**(비선형 증가).", "물의 끓는점": "**물의 정상 끓는점 = 100°C**(1기압, 수소 결합).", "끓는점 조건": "**끓는점: 증기압 = 외부 압력.**", "증발 속도": "**증발 속도 ↑: 온도↑·표면적↑·바람·분자 간 힘 약함.**", "증기압 비교": "**같은 온도: 에탄올 증기압 > 물**(분자 간 힘 약함).", "증발 정의": "**증발 = 액체 표면에서의 기화**(끓는점 아래에서도).", "끓는점과 분자 간 힘": "**끓는점 높음 = 분자 간 힘 강함.**", "증발과 에너지": "**증발 = 흡열 과정**(주위가 시원해짐). 분자 간 힘을 끊는 데 열을 흡수하고, 빠른 분자가 떠나 남은 액체의 평균 운동 에너지가 낮아져 식는다.", "삼투 정의": "**삼투 = 반투막을 통해 용매가 이동.**", "반투막": "**반투막 = 용매 통과, 용질 차단.**", "삼투 방향": "**용매: 묽은 → 진한 쪽 이동**(농도 차 줄임). 용매 비율이 높은 쪽에서 낮은 쪽으로 가 섞임 엔트로피를 키우고, 이를 멈추는 압력이 삼투압이다.", "삼투압 정의": "**삼투압 = 삼투를 막는 데 필요한 압력.**", "반트호프 식": "**π = MRT**(M = 몰농도, T = 절대 온도). 용질 입자가 기체처럼 압력을 내 이상 기체 식과 같은 꼴이고, 진짜 동력은 섞임 엔트로피라 총괄성이 된다.", "총괄성": "**삼투압 = 총괄성**(용질 입자 수에 의존, 종류 무관).", "전해질 삼투압": "**전해질 삼투압: π = iMRT**(i를 곱함).", "온도 의존": "**삼투압 ∝ 절대 온도**(온도 높을수록 큼).", "농도 의존": "**삼투압 ∝ 농도**(진할수록 큼, π = MRT). 용질 입자가 많을수록 용매를 끌어 막는 압력이 커지고, 전해질은 갈라진 만큼 더 크다.", "등장액": "**등장액 = 삼투압 같음**(물 순이동 없음).", "고장액": "**고장액 = 삼투압 높음**(세포 쭈그러듦).", "저장액": "**저장액 = 삼투압 낮음**(세포 부풂).", "세포와 삼투": "**고장액 수축·저장액 팽창·등장액 변화 없음.**", "역삼투": "**역삼투 = 삼투압보다 큰 압력으로 용매를 반대로 이동.**", "역삼투 응용": "**역삼투 = 해수 담수화·정수**(순수한 물 얻기).", "분자량 측정": "**삼투압 측정 → 분자량 계산**(고분자에 유용).", "삼투압 크기": "**삼투압 = 묽은 용액에서도 크게 나타남**(측정 유리).", "삼투 현상": "**진한 용액 쪽 수면이 높아짐**(물이 진한 쪽으로 이동).", "산화 정의": "**산화 = 전자 잃음**(산화수 증가). \"산소 얻음\"에서 \"전자 잃음\"으로 넓어졌고, 전자를 받는 환원과 늘 짝으로 일어난다.", "환원 정의": "**환원 = 전자 얻음**(산화수 감소). 산화(전자 잃음)의 거울상이고 늘 짝으로 동시에 일어난다.", "동시성": "**산화와 환원은 항상 동시에 일어남**(전자를 주고받음).", "산화수 규칙": "**홑원소 0·산소 -2·수소 +1·1족 +1·F -1.** 전자를 전기음성도 큰 쪽에 몰아준 장부상 전하라, 예외도 전기음성도로 설명된다.", "산화수 합": "**중성 화합물 합 0, 다원자 이온 합 = 전하.**", "산화수 변화": "**산화수 증가 = 산화, 감소 = 환원.**", "산화제": "**산화제 = 상대 산화, 자신 환원**(전자 받음). 이름과 달리 자신이 환원되고, 표준 환원 전위가 클수록 강하다.", "환원제": "**환원제 = 상대 환원, 자신 산화**(전자 내놓음, 산화수 증가).", "산화제와 전자": "**산화제 = 전자를 받음**(자신 환원, 상대 산화). 전자는 환원제에서 산화제로 옮겨 간다.", "환원제와 전자": "**환원제 = 전자를 내놓음**(자신 산화, 상대 환원). 산화제와 짝을 이루고, 주고받은 전자 수는 같다.", "산화제 산화수": "**산화제 = 산화수 감소**(전자 받아 환원).", "환원제 산화수": "**환원제 = 산화수 증가**(전자 잃어 산화).", "전자 균형": "**잃은 전자 수 = 얻은 전자 수**(전자 보존). 두 반쪽의 전자 수를 맞춰 더하면 식이 완성되고, 원자·전하도 함께 맞춘다.", "과산화물": "**과산화물 산소 = -1**(보통 -2의 예외). 산소-산소 결합 전자를 같은 원자끼리 반씩 나눠서이다.", "금속 수소화물": "**금속 수소화물 수소 = -1**(보통 +1의 예외). 금속이 수소보다 전기음성도가 작아 수소가 전자를 가져가서이다.", "산화수 계산": "**규칙 + 합 0으로 미지 산화수 계산**(H₂O: +1, -2). 합 규칙으로 역산하고, 같은 원소도 화합물마다 산화수가 다르다.", "산화제 역할": "**산화제 = 자신 환원, 상대 산화**(전자 받음).", "돌턴 법칙": "**전체 압력 = 각 성분 분압의 합.** 이상 기체는 분자끼리 간섭하지 않아 각자의 압력이 그대로 더해진다.", "분압 정의": "**분압 = 그 기체가 혼자 전체 부피 차지할 때의 압력.**", "분압-몰분율": "**분압 = 전체 압력 × 몰분율**(P ∝ n에서 나옴). 분압/전체압력 = 몰분율이고, 이상 기체는 몰분율·부피분율·압력분율이 모두 같다.", "몰분율": "**몰분율 = 성분 몰수 / 전체 몰수**(합 = 1). 분압 = 몰분율 × 전체 압력이라, 몰분율로 분압을 바로 구한다.", "분압-몰수": "**같은 T·V: 분압 ∝ 몰수**(비례).", "분압비": "**분압비 = 몰수비**(질량비·분자량비 아님). 같은 온도면 분자 하나의 기여가 같아, 분압은 개수에만 비례한다.", "수상 치환": "**기체 분압 = 측정 압력 − 수증기압**(빼기).", "분압 계산": "**몰분율 0.5 → 분압 = 전체 압력의 0.5배.**", "실제 기체 특징": "**실제 기체 = 분자 부피 + 분자 간 인력 있음.** 이 둘을 반데르발스 식이 보정하고, 고압·저온에서 이상 기체와 크게 벗어난다.", "이상 기체 근접 조건": "**고온·저압 → 이상 기체에 가까움.**", "이상 기체 편차": "**저온(인력)·고압(부피) → 이상 기체에서 벗어남.** 저온엔 인력이 수축시키고 고압엔 분자 부피가 버텨, 두 효과의 경쟁이 Z 곡선을 만든다.", "반데르발스 식": "**반데르발스 식 = 분자 부피 + 인력 보정한 상태 방정식.**", "반데르발스 상수": "**a = 분자 간 인력(압력 보정), b = 분자 부피(부피 보정).** (P+a(n/V)²)(V−nb)=nRT이고, a가 큰 기체는 수소 결합·극성이 강하다.", "압축 인자": "**Z = PV/nRT = V_실제/V_이상**(이상은 Z=1). Z<1은 인력이 수축시킨 것, Z>1은 분자 부피가 버틴 것이고, 보일 온도에서 둘이 상쇄된다.", "압축 인자 해석": "**인력 지배 Z < 1, 분자 부피 지배 Z > 1.**", "편차 크기": "**인력·부피 클수록 이상 기체에서 더 벗어남.**", "이상 기체 근접": "**He·H₂ = 인력 작아 이상 기체에 가까움.**", "저압 근사": "**저압 → 실제 기체도 PV = nRT로 근사 가능.**", "결정성 고체": "**결정성 고체 = 규칙적 배열 + 녹는점 일정.**", "비결정성 고체": "**비결정성 고체 = 불규칙 배열 + 녹는점 일정하지 않음**(유리).", "이온 결정": "**이온 결정 = 양이온 + 음이온의 이온 결합**(NaCl).", "이온 결정 녹는점": "**이온 결정 = 녹는점 높음**(이온 결합 강함).", "이온 결정 전도성": "**이온 결정: 고체 X, 액체·수용액 O.** 전도는 움직이는 전하 운반자가 있어야 하는데, 고체에선 이온이 고정되고 녹으면 자유로워진다.", "이온 결정 성질": "**이온 결정 = 단단하지만 잘 부서짐**(취성).", "분자 결정": "**분자 결정 = 분자가 분자 간 힘으로 모임**(CO₂·I₂).", "분자 결정 녹는점": "**분자 결정 = 녹는점 낮음**(분자 간 힘만 끊음). 약한 분자 간 힘만 이기면 되어 잘 녹고 승화하며, 공유 결정과 정반대다.", "분자 결정 예": "**분자 결정 = CO₂·H₂O·I₂·설탕**(소금·다이아몬드 아님).", "공유 결정": "**공유 결정 = 원자들이 공유 결합으로 그물처럼 연결.**", "공유 결정 녹는점": "**공유 결정 = 녹는점 매우 높음**(공유 결합을 끊음). 거대한 한 분자라 강한 결합을 끊어야 하고, 분자 간 힘만 끊는 분자 결정과 정반대다.", "공유 결정 예": "**공유 결정 = 다이아몬드·흑연·석영·규소.**", "공유 결정 전도성": "**공유 결정 대부분 전기 안 통함**(흑연만 예외).", "흑연 전도성": "**흑연 = 남은 전자로 전기 통하는 공유 결정.**", "다이아몬드 전도성": "**다이아몬드 = 전기 안 통함**(4개 결합, 자유 전자 없음). 흑연은 4번째 전자가 비편재화해 통하니, 같은 탄소라도 결합 방식이 전도성을 가른다.", "금속 결정": "**금속 결정 = 금속 양이온 + 자유 전자**(금속 결합).", "녹는점 비교": "**녹는점: 공유 > 이온 > 금속 > 분자**(대체로).", "단위 세포": "**단위 세포 = 결정의 반복되는 최소 단위.**", "흑연 구조": "**흑연 = 육각형 평면 층**(3개 결합, 층 사이 약함).", "자발성 방향": "**자발적 변화 = 우주(계+주위) 엔트로피 증가 방향.**", "열역학 제2법칙": "**제2법칙 = 우주의 엔트로피 증가**(ΔS_우주 > 0). 이것이 자발성의 근본 기준이고, ΔG = −TΔS_우주라 ΔG < 0과 같은 말이다.", "깁스 자유 에너지": "**G = H − TS** (T = 절대 온도). 주위의 엔트로피(−ΔH/T)를 계의 양으로 접어 ΔG<0 하나로 2법칙을 판단하게 만든 함수다.", "ΔG 식": "**ΔG = ΔH − TΔS**. 에너지 낮추기(ΔH)와 무질서 늘리기(ΔS)의 줄다리기이고, T가 엔트로피의 가중치라 T = ΔH/ΔS에서 승부가 뒤집힌다.", "자발성 판단": "**ΔG < 0 자발, = 0 평형, > 0 비자발.** ΔG는 내놓을 수 있는 자유 에너지이고, 자발성은 방향이지 속도가 아니다.", "부호 조합": "**ΔH<0·ΔS>0 항상 자발, ΔH>0·ΔS<0 항상 비자발**. 부호 같으면 T = ΔH/ΔS에서 갈리고, 그 경계가 곧 녹는점·끓는점이다.", "자발성 결정": "**자발성 = ΔH·ΔS·온도 모두 고려**(ΔG로 결정). 에너지 낮춤과 무질서 증가라는 두 동인의 합이고, 온도가 그 균형을 정한다.", "발열과 자발성": "**발열이라도 항상 자발은 아니다**(ΔG로 판단). 발열성이 대개 맞는 건 엔탈피가 흔히 지배해서일 뿐이고, 자발적이라고 빠른 것도 아니다.", "온도와 자발성": "**온도가 자발성에 영향.** ΔG = ΔH − TΔS에서 T가 엔트로피 항에 곱해져, ΔH·ΔS 부호가 같으면 전환 온도에서 자발성이 뒤집힌다.", "ΔG 크기": "**ΔG 음수일수록 자발성 큼.**", "자발성과 속도": "**자발적이라도 속도는 느릴 수 있음.** 자발성(ΔG, 방향)과 속도(활성화 에너지)는 별개의 축이고, 촉매는 속도만 바꾼다.", "전환 온도": "**전환 온도 T = ΔH/ΔS**(ΔG = 0인 온도). ΔG = ΔH − TΔS = 0에서 유도하고, ΔH·ΔS 부호가 같을 때만 경계가 생긴다.", "중화 반응": "**중화 반응 = 산 + 염기 → 염 + 물.**", "알짜 이온 반응": "**강산-강염기 중화 알짜 식 = H⁺ + OH⁻ → H₂O.**", "중화 양적 관계": "**nMV = n'M'V'**(가수·농도·부피, H⁺ = OH⁻ 몰수).", "적정 정의": "**적정 = 표준 용액으로 미지 용액 농도 구하기.**", "당량점": "**당량점 = H⁺ 몰수 = OH⁻ 몰수**(완전 중화 지점).", "적정 곡선": "**적정 곡선 = 부피에 따른 pH 변화 그래프.**", "강산-강염기 당량점": "**강산-강염기 당량점 = pH 7**. 남은 이온이 방관자라 물을 안 건드리기 때문이고, 약산이 끼면 짝염기 가수분해로 당량점이 염기성이 된다.", "약산-강염기 당량점": "**약산-강염기 당량점 = 염기성**(짝염기 가수분해).", "강산-약염기 당량점": "**강산-약염기 당량점 = 산성**(짝산 가수분해).", "pH 도약": "**당량점 부근 = pH 급격히 도약.**", "지시약 선택": "**지시약 변색 범위 = 당량점 액성에 맞춰 선택.**", "페놀프탈레인": "**페놀프탈레인 = 염기성 분홍, 산성·중성 무색.**", "페놀프탈레인 범위": "**페놀프탈레인 변색 범위 = pH 8-10**(염기성).", "메틸 오렌지 범위": "**메틸 오렌지 변색 범위 = pH 3-4.5**(산성).", "지시약 역할": "**지시약 = 색 변화로 당량점(종말점) 확인.**", "중화 부피": "**같은 가수·농도 → 같은 부피로 중화.**", "중화 양론": "**1가 산 1몰 = 1가 염기 1몰**(가수에 따라 몰비 달라짐).", "완전 중화 조건": "**완전 중화 = H⁺ 몰수 = OH⁻ 몰수.**", "당량점 위치": "**당량점 = pH 도약 구간의 중간**(변곡점).", "완충 영역": "**완충 영역 = 당량점 전 완만 구간**(반당량점 pH = pKa).", "종말점과 당량점": "**종말점 ≈ 당량점**(일치 불필요, 가까우면 됨).", "브뢴스테드-라우리": "**산 = H⁺ 주개, 염기 = H⁺ 받개.** 산-염기는 양성자 이동이고 산화환원은 전자 이동이라, 서로 다른 통화의 거래다.", "pH·pOH 정의": "**pH = -log[H⁺], pOH = -log[OH⁻].** [H⁺]↑ → pH↓.", "완충 용액": "**완충 = 약산+짝염기(또는 약염기+짝산).** H⁺를 받을 짝염기와 OH⁻를 중화할 약산이 둘 다 있어야 하고, 강산·강염기는 안 된다.", "원자 번호": "**원자 번호 = 양성자 수 = 원소의 정체성.** 중성자·전자가 변해도 원소는 그대로.", "원자량": "원자량 = **존재비 가중 평균**(보통 소수). 한 동위원소도, 단순 평균도 아니다.", "전하 균형": "중성: 양성자=전자. **전자 잃으면 +, 얻으면 -.** 양성자는 안 변한다.", "SI 단위": "**kg · m · s · K · mol · A · cd.** 질량은 kg, 온도는 K.", "물질량 단위": "**몰 = 6.022×10²³개 묶음.** 질량÷몰질량=몰, 몰×아보가드로=개수, 1몰 기체=22.4 L(STP). 같은 질량이라고 같은 몰수 아니다.", "접두사": "**m⁻³ · μ⁻⁶ · n⁻⁹ · p⁻¹²** (세 칸씩), **k³ · M⁶**, **c⁻²**. micro는 10⁻⁶다.", "유효숫자": "**앞 0 무효, 사이·끝(소수점 有) 0 유효.** 0.0025는 2개, 1.030은 4개.", "유효숫자 연산": "**곱·나눗셈=유효숫자 개수, 덧·뺄셈=소수점 자릿수.** 반올림은 맨 끝에 한 번.", "정확한 수": "**셈한 수·정의값 = 무한 유효숫자.** 결과 자릿수는 측정값만 정한다.", "정확도·정밀도": "**정확=참값 근접, 정밀=재현성.** 치우침은 정확도(계통), 흩어짐은 정밀도(무작위). 정밀≠정확.", "밀도": "**밀도 = 질량/부피, 양과 무관한 고유 성질.** 물보다 작으면 뜬다.", "온도 환산": "**K = ℃ + 273.15**, 간격 동일(ΔT 같음), 0 K가 하한.", "차원 분석": "**환산 인자(값=1)를 곱한다. 없앨 단위는 분모로.** 단위가 떨어지면 식이 맞다.", "배위 착물": "**배위 착물 = 중심 금속 + 리간드**(배위 결합).", "중심 금속": "**중심 금속 = 전이 금속, 루이스 산**(전자쌍 받음).", "리간드": "**리간드 = 전자쌍 주는 루이스 염기.**", "배위 결합": "**배위 결합 = 리간드가 전자쌍을 통째로 제공.**", "배위수": "**배위수 = 주개 원자 수**(흔히 4·6). 분자 수와 다를 수 있음.", "한자리 리간드": "**한자리 = 주개 원자 1개**(물·암모니아·Cl⁻).", "여러자리 리간드": "**여러자리 = 주개 원자 2개 이상**(en 2, EDTA 6).", "킬레이트 효과": "**킬레이트 착물이 더 안정**(여러 점 결합 + 엔트로피↑). 여러자리 리간드가 한자리 여럿을 풀어 ΔS>0, ΔG=ΔH−TΔS에서 −TΔS가 안정성을 만든다.", "기하 이성질체": "**cis = 인접, trans = 반대편.** 배열만 다름.", "광학 이성질체": "**광학 이성질체 = 거울상, 포개지지 않음.** 배열만 다름.", "평면 사각": "**평면 사각(배위수 4)은 cis-trans 가짐**(Pt(II) 등).", "팔면체": "**팔면체 = 여섯 리간드(배위수 6).** cis-trans·fac-mer 가짐.", "결정장 이론": "**결정장 이론 = 리간드가 정전기적 반발로 d 오비탈을 분리.**", "d 오비탈 분리": "**팔면체: 낮은 셋 + 높은 둘**(리간드 향한 오비탈이 정면 반발로 높음). 사면체는 분리가 뒤집히고 더 작다.", "분리 에너지": "**Δ = 두 d 오비탈 무리의 에너지 차이.** 리간드에 따라 변함.", "강한 장": "**강한 장 → Δ 큼.** 약한 장 → Δ 작음.", "저스핀": "**Δ > 짝지음 E → 저스핀**(홀전자 적음).", "고스핀": "**Δ < 짝지음 E → 고스핀**(홀전자 많음). 올라가는 비용 Δ와 짝짓는 비용 P 중 싼 쪽을 고르는, 훈트 규칙의 확장이다.", "강한 장과 스핀": "**강한 장 → 저스핀, 약한 장 → 고스핀.**", "분광화학 계열": "**분광화학 계열 = 리간드의 Δ 크기 순 배열.** CN⁻ 강, I⁻ 약.", "착물의 색": "**d-d 전이로 흡수, 보이는 색 = 흡수색의 보색**(흡수 E = Δ). 리간드가 Δ를 바꾸면 색이 바뀌어, 색은 Δ를 읽는 눈금이 된다.", "자기성": "**자기성 = 홀전자 수로 결정.** 고스핀이 상자기성 강함.", "배위수와 구조": "**6 팔면체, 4 평면 사각/정사면체, 2 직선형.**", "파울리 원리": "**오비탈당 2개·반대 스핀**(네 양자수 안 같음). 부껍질 용량 s2·p6·d10·f14.", "배치 순서": "**1s→2s→2p→… 낮은 에너지 순(n+l 규칙).** 4s가 3d보다 먼저 채워지고, 쌓음·파울리·훈트를 함께 적용한다.", "에너지 순서": "**4s가 3d보다 먼저.** 다전자 원자 오비탈 에너지는 n과 l에 함께 의존.", "안정 배치": "**d⁵·d¹⁰이 안정 → Cr=4s¹3d⁵, Cu=4s¹3d¹⁰.** 쌓음의 대표 예외.", "원자가 전자": "원자가 전자 = **가장 바깥 껍질 전자**, 반응 결정. 같은 족끼리 수가 같다.", "평형 상수": "**Kc = 생성물/반응물(계수 거듭제곱), 평형 농도.** 순수 고체·액체는 빠지고, ΔG° = −RT ln K로 자발성과 묶인다.", "Kp": "**Kp = 부분 압력 평형 상수.** Kp = Kc(RT)^Δn이라, 기체 몰수가 안 변할 때(Δn=0)만 Kc와 같다.", "Kc-Kp 관계": "**Kp = Kc(RT)^Δn**(P = c·RT를 대입한 결과). Δn은 기체(생성물−반응물)만 세고, Δn=0이면 Kp=Kc다.", "평형 상수 의미": "**K 크면 생성물·작으면 반응물 우세.** 농도가 변하는 화학종만 들어가고(고체·액체 제외), K=e^(−ΔG°/RT)이며, 위치를 말할 뿐 속도가 아니다.", "평형 상수 의존성": "**K는 온도에만 의존.** ΔG° = ΔH° − TΔS°에 온도가 들어가서이고, 농도·압력·촉매는 K가 아니라 평형 위치만 옮긴다.", "반응지수": "**Q<K 정반응·Q>K 역반응·Q=K 평형.** 반응은 Q가 K를 향해 가고, ΔG = RT ln(Q/K)라 이 비교가 곧 자발성이다.", "르샤틀리에": "**평형은 변화를 줄이는 방향으로 이동.** 가한 변화로 Q가 K에서 벗어나면 다시 Q=K로 돌아가려 움직이는 것이고, 온도만 K를 바꾼다.", "촉매와 평형": "**촉매 = 평형 도달만 빠르게**(정·역 동시), 평형 위치·K 불변.", "불활성 기체": "**일정 부피 불활성 기체 → 이동 없음**(부분 압력·Q 불변). 일정 압력은 부피가 늘어 부분 압력이 변하므로 몰수 많은 쪽으로 이동한다.", "온도와 K": "**온도만 K를 바꿈.** 발열 온도↑ K↓, 흡열 온도↑ K↑.", "용해도곱": "**Ksp = 난용성 염 용해 평형 상수.** 같은 형태면 클수록 잘 녹고 온도에만 의존하며, 형태가 다르면 몰 용해도로 비교한다.", "침전 조건": "**Q > Ksp 침전, Q = Ksp 포화, Q < Ksp 침전 없음.** 용해 평형의 Q와 K 비교이고, 공통 이온이 있으면 이온곱이 커져 침전이 잘 생긴다.", "Ksp 식": "**Ksp = 이온 농도의 곱(계수 거듭제곱), 고체 제외.** AB₂ → [A][B]².", "촉매와 K": "**촉매는 K 불변**(속도만 영향). K는 온도만 바꿈.", "반응 속도": "**속도 = 단위 시간당 농도 변화.** 보통 진행될수록 느려짐.", "0차 반응": "**0차: v = k(농도 무관), [A]-t 직선.**", "1차 반응": "**1차: v = k[A], ln[A]-t 직선, 반감기 일정.**", "2차 반응": "**2차: v = k[A]², 1/[A]-t 직선, 반감기 초기 농도에 반비례.**", "적분 속도식": "**0차 [A]·1차 ln[A]·2차 1/[A]가 t에 대해 직선.**", "반감기": "**1차 반감기만 농도 무관(일정).** 1차는 개별 확률이 일정해서(방사성 붕괴), 0차는 비례, 2차는 반비례. 반감기 거동이 차수를 진단한다.", "아레니우스": "**k = A·e^(−Ea/RT).** 지수항은 Ea를 넘는 분자의 볼츠만 비율이라 온도가 오르면 지수적으로 커지고, ln k vs 1/T 기울기(−Ea/R)로 Ea를 잰다.", "빈도 인자": "**A = 충돌 빈도 + 배향 인자.** Ea(장벽)와 별개로 유효 충돌의 충돌·방향 조건을 담는다.", "온도와 충돌": "**온도↑ → 장벽 넘는 분자 비율↑**(Ea는 불변). 에너지 분포가 높은 쪽으로 옮겨 문턱을 넘는 비율이 급증하는 것이 주된 효과다.", "메커니즘": "**단일 단계만 계수로 속도식.** 여러 단계는 메커니즘에서 유도.", "속도 결정 단계": "**전체 속도 = 가장 느린 단계(병목)가 결정.** 빠른 단계는 앞지르지 못하고, 차수가 계수와 다른 것은 차수가 이 단계를 반영하기 때문이다.", "중간체": "**중간체 = 생성됐다 소비됨.** 전체 반응식에 안 나타남.", "이온 결합": "**금속+비금속, 전자 주고받음, 정전기 인력.** 이온성은 전기음성도 차이의 극단(공유와 연속)이고, 쿨롱 격자 에너지가 녹는점·전도성을 정한다.", "공유 결합": "**비금속끼리 전자쌍 공유.** 단·이중·삼중 가능.", "결합 세기": "**결합 에너지 클수록·짧을수록·차수 클수록 강하다.**", "루이스 구조": "**원자가 전자를 선(결합)·점(비공유)으로.** 총 전자 수 세고 옥텟 맞춤.", "옥텟 예외": "예외 셋: **붕소(미만), 3주기↑(확장), 홀수 전자(라디칼).**", "형식 전하": "**형식 전하 = 원자가 − 비공유 − 결합/2.** 합은 분자 전하이고, 결합을 반반으로 센 장부값(진짜 전하·산화수와 다름)이다. 0에 가까울수록 안정.", "공명": "공명 = **구조들의 평균(혼성체)**, 전자 위치만 다름, 분자를 안정화.", "분자 극성": "**결합 극성 + 모양.** 대칭이면 상쇄(무극성), 비대칭이면 극성.", "VSEPR": "**전자 영역 반발 최소화.** 결합쌍+비공유쌍 모두 세고, 다중 결합은 1영역.", "VSEPR 구조": "**2직선·3평면삼각·4정사면체·5삼각쌍뿔·6정팔면체.** 4는 정사면체(109.5°).", "분자 구조": "**CH₄ 정사면체·NH₃ 삼각뿔·H₂O 굽은형·CO₂ 직선·BF₃ 평면삼각.** 입체수가 같아도 비공유 수가 모양을 가르고, 그 모양이 극성을 정한다.", "시그마·파이": "**σ 정면(강)·π 옆(약).** 첫 결합은 σ. π는 밀도가 핵 사이에 덜 쌓여 약하고, 나란함이 필요해 회전을 잠가 시스-트랜스를 만든다.", "분자 오비탈": "**결합성(낮음)·반결합성(높음) 둘 생성.** 반결합성 전자는 결합을 약화.", "결합 차수": "**차수 = (결합성 − 반결합성)/2.** 반결합성은 마디로 결합을 상쇄해 뺀다. O₂는 차수 2지만 π* 홀전자로 상자기성(루이스 패배), O₂⁺은 반결합성이 줄어 O₂보다 강하다.", "방사성 붕괴": "**방사성 붕괴 = 불안정한 핵이 입자·에너지 방출(핵 변화).**", "알파 붕괴": "**α 붕괴 = 헬륨 핵 방출 → 질량수 -4, 원자 번호 -2.**", "베타 붕괴": "**β⁻ 붕괴 = 중성자→양성자+전자 → 원자 번호 +1, 질량수 불변.**", "감마 붕괴": "**γ 붕괴 = 에너지만 방출, 질량수·원자 번호 불변.**", "양전자 방출": "**β⁺ 방출 = 양성자→중성자 → 원자 번호 -1, 질량수 불변.**", "Z-N 그래프": "**Z-N 그래프 = 양성자·중성자 분포로 안정성 표시(안정성 띠).**", "안정성 비": "**가벼운 핵 N≈Z, 무거운 핵 N>Z**(중성자 더 많음).", "붕괴 속도": "**방사성 붕괴 = 1차 반응**(속도 ∝ 남은 핵 수, 반감기 일정).", "반감기 계산": "**n번 후 (1/2)ⁿ 남음**(횟수 = 경과 시간 / 반감기).", "연대 측정": "**연대 측정 = 방사성 동위 원소의 일정한 반감기 + 남은 비율.**", "질량 결손": "**질량 결손 = 핵이 구성 입자 합보다 가벼운 차이**(→ 결합 에너지).", "질량-에너지": "**E = mc²**(c = 빛의 속도). 작은 질량 → 큰 에너지.", "핵자당 결합 에너지": "**핵자당 결합 에너지 = 철 부근 최대, 클수록 안정.**", "핵분열": "**핵분열 = 무거운 핵이 쪼개짐 + 에너지 방출.**", "핵융합": "**핵융합 = 가벼운 핵이 합쳐짐 + 에너지 방출**(고온·고압).", "핵에너지": "**핵에너지 ≫ 화학 에너지**(질량이 에너지로 전환).", "안정화 경향": "**무거운 핵 분열, 가벼운 핵 융합 → 철 부근(가장 안정)으로.**", "족과 원자가 전자": "**원자가 전자 같다 = 같은 족 = 성질 닮음.** 세로가 족, 가로가 주기.", "전자 배치와 위치": "**껍질 수 → 주기, 원자가 전자 → 족.** 둘을 섞지 마라.", "방위양자수": "**l = 모양(s,p,d,f), 범위 0~n-1.** 부껍질 용량 2(2l+1) = 2·6·10·14가 주기율표 블록 너비와 같다.", "자기양자수": "**ml = 방향, -l~+l, (2l+1)개.** 각 오비탈에 파울리로 2개씩 들어가 용량 2(2l+1)이고, 네 양자수가 전자를 완전히 지정한다.", "스핀양자수": "**ms = ±1/2(두 값).** 스핀은 전자의 고유 양자 성질이고(슈테른-게를라흐로 확인), 전자가 페르미온이라 파울리로 이어져 오비탈당 반대 스핀 2개가 된다.", "양자수 범위": "**n≥1 → l: 0~n-1 → ml: -l~+l → ms: ±1/2.** 오비탈 (2l+1)·n², 전자 2n².", "오비탈 기호": "**s0 · p1 · d2 · f3.** s가 0에서 시작하고, l 하나가 모양·개수·용량을 다 정한다.", "오비탈 모양": "**s 구형, p 아령(직교 3개).** 오비탈은 확률 분포(궤도 아님)이고, 모양은 l이·방향은 ml이 정한다.", "산화·환원 정의": "**산화 = 전자 잃음·산화수↑, 환원 = 전자 얻음·산화수↓.**", "산화제·환원제": "**산화제는 자신 환원(전자 받음), 환원제는 자신 산화(전자 줌).**", "전자 보존": "**잃은 전자 = 얻은 전자**(전자 보존). 두 반쪽의 전자 수를 같게 맞춰 더하면 식이 완성되고, 원자·전하도 함께 보존된다.", "갈바니 전지": "**갈바니 전지 = 자발 반응으로 화학→전기.** 외부 전원 불필요.", "전자 흐름": "**전자: 산화전극(-) → 환원전극(+).** 전류는 반대.", "자유 에너지와 전위": "**ΔG° = -nFE°**(nF=총 전하, ×E°=일, −는 계가 일을 내줌). ΔG°=−RT ln K와 합치면 E°=(RT/nF)ln K라, E°·ΔG°·K는 같은 사실의 세 언어다.", "네른스트 식": "**E = E° - (RT/nF) ln Q**, 평형에서 E = 0. ΔG = ΔG° + RT ln Q와 같은 식이고, 평형의 E=0이 K를 준다.", "끓는점 오름·어는점 내림": "**끓는점↑·어는점↓, ΔT = K·m**(곱). 전해질이 더 큼.", "삼투압": "**π = MRT**(진할수록·온도↑ 큼). 용매는 묽은 쪽 → 진한 쪽.", "이상 기체": "**PV = nRT, 절대 온도.** 분자 부피·힘을 무시한 모델이라 저압·고온에서 맞고, R가 모든 기체에 같아 종류가 무의미하다.", "돌턴 분압": "**전체 압력 = 분압 합, 분압 = 전체 × 몰분율.**", "운동론": "**무질서 운동·탄성 충돌·부피와 힘 무시.** 평균 운동 에너지 ∝ 절대 온도.", "vrms": "**vrms = √(3RT/M).** (1/2)mv²=(3/2)kT에서 나온 식이라 3은 3차원, 제곱근은 KE∝v²에서 온다. 온도 4배 → 속력 2배.", "그레이엄": "**확산 속도 ∝ 1/√M.** 가벼울수록 빠름, M 4배 → 속도 1/2.", "실제 기체": "실제 기체: 부피·힘 있음. **고압·저온 벗어남, 저압·고온 근접.**", "반데르발스": "**a = 인력 보정, b = 부피 보정.** 실제 기체용 보정식.", "끓는점": "**증기압 = 외부 압력일 때 끓음.** 외부 압력↑ → 끓는점↑, 분자 간 힘↑ → 끓는점↑.", "점도·표면장력": "**분자 간 힘↑ → 점도·표면장력↑, 온도↑ → ↓.** 물은 수소 결합으로 큼.", "점도": "**점도 = 흐름 저항.** 클수록 안 흐름, 분자 간 힘↑·온도↓에서 큼.", "상평형 그림": "**축은 온도·압력.** 삼중점 = 세 상 공존, 임계점 너머 = 액기 구분 소멸.", "몰랄 농도": "**몰랄 = 용매 1 kg당 몰수(mol/kg), 온도 무관.** 몰 농도(용액 1 L)와 구분.", "엔트로피": "**S = 무질서도, 고체 < 액체 < 기체.** 정확히는 미시상태의 수(S = k ln W)이고, 경우의 수가 많을수록 크다.", "제2법칙": "**자발 → 우주 총 엔트로피 증가**(계는 줄 수도).", "제3법칙": "**0 K 완전 결정 S = 0**(배열 하나). 절대 엔트로피의 기준.", "엔트로피 변화": "**기체 생성·녹음·끓음·용해·온도↑ → ΔS > 0.** 반대는 감소.", "내부 에너지": "**U는 상태 함수(경로 무관), q·w는 경로 함수.**", "제1법칙": "**ΔU = q + w**(에너지 보존). 계가 받는 열·일이 +.", "부호 규약": "**계가 받으면 +, 주면 -.** 흡열 q>0, 압축 w>0.", "일의 부호": "**팽창 w < 0(일 함), 압축 w > 0(일 받음).**", "정적 과정": "**일정 부피 → w = 0 → q = ΔU.**", "정압 과정": "**일정 압력 → q = ΔH**(부피 변화·일 있음).", "팽창과 일": "**팽창 → 계가 일 함, 크기 = P·ΔV.**", "자유 에너지": "**G = H - TS.** ΔG의 부호가 자발성을 정함.", "자유 에너지와 평형": "**ΔG° = -RT ln K** (ΔG = ΔG° + RT ln Q에서 평형 조건을 넣은 것). K>1이면 ΔG°<0이고, 지수 관계라 작은 ΔG°가 평형을 크게 몰아붙인다."};
const CORE={"원소·원자·분자 정의": "**원소 = 물질을 이루는 성분(종류)**, **원자 = 물질을 이루는 가장 작은 입자**, **분자 = 물질의 성질을 나타내는 가장 작은 입자**.", "분자 종류": "분자식의 첨자가 그 분자를 이루는 원자 수를 나타낸다: **H₂O 3개(H 2 + O 1), CO₂ 3개, NH₃ 4개, CH₄ 5개, O₂ 2개.**", "원소 수 세기": "원소의 종류 수 = 화학식에 나오는 **서로 다른 원소 기호의 개수.** 원자의 총개수와 다르다.", "원자 수 세기": "한 분자의 원자 수 = 화학식 **모든 원소의 첨자(아래 숫자)를 더한 값.** 첨자가 없으면 1로 센다.", "화학식 종류": "- **실험식**: 가장 간단한 정수비.\n- **분자식**: 실제 원자의 종류와 개수.\n- **구조식**: 결합선으로 구조 표현.\n- **시성식**: 작용기를 드러냄.", "실험식 도출": "실험식 = 분자식의 첨자를 **가장 간단한 정수비로 줄인** 것. 최대공약수로 나눈다.", "원자 구조": "원자 = **원자핵((+)전하: 양성자·중성자)** + **전자((-)전하, 핵 주위 분포).** 핵은 매우 작은 공간만 차지한다.", "입자 질량비": "양성자와 중성자의 질량은 **거의 같고**, 전자의 질량은 그에 비해 **무시할 만큼 작다**(약 1840분의 1). 원자 질량은 대부분 핵에 있다.", "입자 전하비": "양성자, 중성자, 전자의 전하량비 = **1 : 0 : -1.** 중성자는 전하가 없고, 양성자와 전자의 전하량 크기는 같다(부호 반대).", "원자 중성": "원자가 중성인 까닭은 **양성자 수 = 전자 수**이기 때문이다(중성자 수와는 무관).", "원자핵 구성": "원자핵 = **양성자 + 중성자.** 전자는 핵 **바깥**에 분포한다. 원자 번호 = 양성자 수, 질량수 = 양성자 수 + 중성자 수.", "옥텟규칙": "옥텟 규칙 = 원자가 최외각 전자를 **8개** 채워 비활성 기체와 같은 안정한 배치가 되려는 경향. (단 He은 예외로 2개.)", "루이스 전자점식": "루이스 전자점식 = 원소 기호 둘레에 **원자가 전자만** 점으로 표시한 식. 점 개수 = **원자가 전자 수**(= 족 번호와 대응).", "주기율표 기초": "주기율표는 **원자 번호 순**으로 배열. **주기 = 전자껍질 수**, **족 = 원자가 전자 수**(같은 족은 성질이 비슷).", "족 판정": "현대 주기율표는 1~18족. **18족 = 비활성 기체**, 산소(O)는 **16족**(원자가 전자 6개).", "이온형성 방향": "**금속 = 전자 잃음 → 양이온.** **비금속 = 전자 얻음 → 음이온.** 둘 다 비활성 기체와 같은 안정한 배치를 향한다.", "이온 전하": "이온의 전하 = 잃거나 얻는 **전자 수와 부호**. 금속은 (+), 비금속은 (-). 보통 비활성 기체 배치가 되도록 정해진다.", "결합 기초": "- **금속 + 비금속 → 이온결합**(전자 주고받음).\n- **비금속 + 비금속 → 공유결합**(전자쌍 공유).\n- **금속 + 금속 → 금속결합**(자유 전자).", "물질 분류": "물질은 **순물질**(홑원소물질·화합물)과 **혼합물**로 나뉜다. 순물질은 한 종류의 물질, 혼합물은 두 종류 이상이 섞인 것.", "순물질·혼합물 경계": "두 종류 이상의 물질이 **화학결합 없이 섞이면 혼합물.** 순물질은 일정한 성질(녹는점·끓는점)을 갖고, 혼합물은 비율에 따라 성질이 변한다.", "물질 분류 판정": "물질은 **순물질(홑원소물질·화합물)과 혼합물**로 나뉜다. 홑원소물질은 한 종류 원소(O₂, Fe), 화합물은 두 종류 이상이 결합한 것(H₂O, NaCl), 혼합물은 여러 물질이 섞인 것(공기, 소금물)이다.", "물리·화학변화": "- **물리 변화**: 물질의 종류(화학식)는 그대로, 상태·모양만 변함.\n- **화학 변화**: 새로운 물질이 생성됨.", "물리·화학적 성질": "- **물리적 성질**: 물질을 바꾸지 않고 관찰·측정(색, 녹는점, 끓는점, 밀도).\n- **화학적 성질**: 화학반응과 관련(가연성, 산성·염기성, 반응성).", "분자 판정": "**이온결합 물질(NaCl 등)은 분자가 아니다.** 분자는 원자들이 공유결합으로 묶인 독립된 입자이고, 이온결합 물질은 양·음이온이 연속적으로 이어진 결정이다.", "물질 상태": "현재 온도를 녹는점·끓는점과 비교: **녹는점 아래 = 고체**, **녹는점~끓는점 사이 = 액체**, **끓는점 위 = 기체.**", "불의 이용": "불의 이용은 **조리·토기 제작·금속 제련·난방/조명**을 가능하게 해 인류 문명을 크게 발전시켰다.", "금속 반응성·사용시기": "**반응성이 작을수록 제련이 쉬워 먼저 사용**되었다. 그래서 사용 순서는 대체로 금·은 → 구리(청동) → 철 → 알루미늄.", "금속 사용시기": "**구리가 철보다 먼저** 사용되었다(청동기 → 철기). 반응성이 작은 금속이 제련이 쉬워 먼저 쓰였다.", "지각 구성원소": "지각에서 질량비가 가장 큰 원소는 **산소(약 46%)**, 그다음이 **규소(약 28%)**다. 규소가 1위가 아니다.", "인체 구성원소": "인체에서 **질량비 1위는 산소**(약 65%, 물·유기물의 산소), 그러나 **개수(원자 수)비 1위는 수소**다.", "질소": "질소는 **단백질·DNA를 구성하는 필수 원소**이자 식물 생장에 필요한 영양소. 공기의 약 **78%**(가장 많은 성분)가 질소다.", "질소 안정성": "질소 기체 N₂는 **삼중결합** 때문에 매우 **안정(반응성 작음)**하다. 그래서 사람도 식물도 공기 중 N₂를 **직접 이용하지 못한다**.", "하버보슈": "하버보슈법은 **질소(N₂)와 수소(H₂)로 암모니아(NH₃)를 합성**하는 방법(고온·고압, 촉매). 질소 비료 대량 생산을 가능하게 해 **식량 부족 개선**에 크게 기여했다.", "원자량 정의": "원자량 = **탄소-12(¹²C)를 기준**으로 한 **상대적 질량.** 비(比)라서 **단위가 없다.**", "원자량 단위": "원자량은 **단위가 없다**(무단위). 기준 원자에 대한 질량의 **비**이기 때문이다.", "평균 원자량": "평균 원자량 = 각 동위원소의 질량수에 **존재 비율을 곱해 더한** 가중 평균. 보통 **정수가 아닌** 값이 된다.", "동위원소": "동위원소 = **양성자수(원자 번호)는 같고 중성자수(질량수)가 다른** 원소. **화학적 성질은 거의 같고**, 질량 차이로 물리적 성질이 다를 수 있다.", "분자량·화학식량": "분자량 = 분자를 이루는 원자들의 **원자량을 모두 더한** 값. NaCl처럼 **분자가 없는** 이온결합 물질은 **화학식량**을 쓴다.", "몰 정의": "**1몰 = 입자 6.02 × 10²³개**(아보가드로수). 입자의 **종류와 관계없이** 1몰의 입자 수는 같다.", "몰질량": "물질 **1몰의 질량(g) = 화학식량과 수치가 같다**(단위 g/mol). 예: O₂ 32 g, H₂O 18 g, CO₂ 44 g, NH₃ 17 g.", "기체 몰부피": "**0°C, 1기압(표준 상태)에서 기체 1몰의 부피 = 22.4 L.** 기체의 **종류·질량과 관계없이** 같다.", "아보가드로 법칙": "아보가드로 법칙: **같은 온도·압력·부피**의 기체에는 종류와 관계없이 **같은 수의 분자**가 들어 있다. 부피는 분자 수에 비례한다.", "질량 계산": "**질량 = 몰수 × 몰질량(화학식량).** 거꾸로 몰수 = 질량 / 몰질량.", "몰-입자수": "분자 1몰에 든 **원자 몰수 = 분자 몰수 × 분자당 원자 개수.** 예: O₂ 1몰 → 산소 원자 **2몰**, H₂O 1몰 → 수소 원자 **2몰**, 산소 원자 1몰.", "몰 환산": "**몰수 = 질량 / 몰질량.** 질량을 몰질량(화학식량)으로 **나눈다.**", "기체 몰 환산": "0°C, 1기압에서 **기체 몰수 = 부피(L) / 22.4.** 부피를 몰부피(22.4)로 **나눈다.**", "몰 비교": "**같은 질량**이면 **분자량이 작을수록 몰수가 크다**(몰수 = 질량/분자량). **같은 몰수**면 **분자량이 클수록 질량이 크다**.", "원자-분자 몰": "분자 1몰에 든 **총 원자 몰수 = 분자 몰수 × 분자당 원자 개수.** 예: CO₂ 1몰 → 원자 3몰, H₂O 1몰 → 원자 3몰.", "밀도-분자량": "0°C, 1기압에서 **기체 분자량 = 밀도(g/L) × 22.4.** 밀도에 몰부피를 **곱한다.** 분자량이 클수록 밀도도 크다.", "기체 분자수-압력": "같은 온도·부피에서 **압력은 분자 수에 비례.** 분자가 많을수록 압력이 높다.", "입자수-질량": "어떤 입자 **6.02 × 10²³개 = 1몰.** 그 질량은 그 물질의 **화학식량(g)**과 같다. 예: 물 분자 6.02 × 10²³개 = 18 g, 산소 분자 6.02 × 10²³개 = 32 g.", "실험식-분자식": "**분자식 = 실험식의 정수배.** 분자식이 같으면 실험식도 같지만, **실험식이 같아도 분자식은 다를 수 있다.**", "몰-부피": "0°C, 1기압에서 **기체 부피 = 몰수 × 22.4 L.** 거꾸로 몰수 = 부피 / 22.4.", "화학반응식 형식": "화학반응식: **반응물(왼쪽) → 생성물(오른쪽).** 화살표는 **반응 방향**을 나타내고, 물질은 **화학식**으로 쓴다.", "화학반응식 계수": "반응식의 계수는 **가장 간단한 정수비**로 나타낸다. 계수 1은 **생략**하고, 계수는 **입자의 몰비**를 의미한다.", "질량 보존": "화학반응에서 **원자의 종류와 수는 보존**되며(재배열만 일어남), **반응 전후 총질량은 같다**(질량 보존).", "질량 보존 법칙": "질량 보존 법칙: **반응 전후 총질량이 같다.** 물리 변화와 화학 변화 **모두**에서 성립한다.", "일정 성분비 법칙": "일정 성분비 법칙: **한 화합물에서 성분 원소의 질량비가 항상 일정**하다. **화합물**에만 적용된다.", "일정 성분비 적용": "물 H₂O에서 **수소 : 산소 질량비 = 1 : 8.** 산소가 수소의 8배 무겁다.", "배수 비례 법칙": "배수 비례 법칙: **두 원소가 두 가지 이상의 화합물**을 만들 때, 한 원소의 일정량과 결합하는 다른 원소의 질량이 **간단한 정수비**를 이룬다. 예: CO와 CO₂.", "배수 비례 적용": "같은 질량의 탄소에 결합한 산소의 질량비: **CO : CO₂ = 1 : 2.** CO₂는 같은 탄소에 산소가 두 배 결합한다.", "기체 반응 법칙": "기체 반응 법칙: **일정 온도·압력**에서 반응하는 기체의 **부피비**가 간단한 정수비를 이룬다. 이 부피비는 **계수비(분자 수 비)**와 같다.", "계수비-분자수": "화학반응식의 **계수비 = 반응하는 분자 수의 비**(= 몰비). 예: 2H₂ + O₂ → 2H₂O는 분자 수 비 2:1:2.", "계수비-질량비": "**계수비 = 몰비(= 기체 부피비)이지, 질량비가 아니다.** 질량비를 구하려면 계수에 **각 물질의 분자량을 곱해야** 한다.", "계수비-부피비": "**기체 반응**에서 같은 온도·압력이면 **계수비 = 부피비**(= 몰비). 아보가드로 법칙 덕분이다.", "양적관계 부피": "기체 반응의 부피비 = 계수비. 예: **2H₂ + O₂ → 2H₂O(g)는 부피비 2:1:2**(H₂:O₂ = 2:1).", "양적관계 몰": "반응·생성 물질의 몰수는 **계수비**로 정해진다. 예: N₂ + 3H₂ → 2NH₃에서 N₂ 1몰 → NH₃ **2몰**.", "한계 반응물": "한계 반응물 = **먼저 모두 소모되어 반응을 멈추고 생성물의 양을 결정**하는 반응물. 나머지는 과잉 반응물로 남는다.", "몰비-계수비": "화학반응식에서 **몰비 = 계수비.** 계수가 정해지면 반응·생성 물질의 몰비가 정해진다.", "계수 맞추기": "화학반응식의 계수를 맞추면 **양변의 각 원자 수가 같아진다**(질량 보존). 이때 **첨자는 그대로 두고 계수만** 조정한다.", "양적관계 질량": "C + O₂ → CO₂에서 탄소 12 g(1몰)이 완전 연소하면 **CO₂ 44 g**(1몰)이 생성된다. 산소 32 g이 더해진다.", "계수 규칙": "화학반응식의 계수는 **양의 정수**다. **0이나 음수가 될 수 없고**, 가장 간단한 정수비로 나타낸다(1은 생략).", "분자설 도입": "**아보가드로**는 돌턴의 원자설만으로 설명하기 어려웠던 **기체 반응 법칙**을 설명하기 위해 **분자 개념**을 도입했다.", "일정 성분비 범위": "일정 성분비 법칙은 **화합물에서만** 성립한다. 혼합물은 성분의 비율이 가변적이라 적용되지 않는다.", "양적관계 몰수변화": "N₂ + 3H₂ → 2NH₃에서 반응이 진행되면 **전체 기체 몰수가 감소**한다(반응물 4몰 → 생성물 2몰). 계수 합을 비교해 판단한다.", "부피비-몰비": "같은 온도·압력에서 기체의 **부피비 = 몰비**(= 계수비). 부피는 몰수에 비례한다.", "양적관계": "화학반응식의 **계수비 = 몰비 = 분자 수 비 = 기체 부피비.** 이 양적 관계로 한 물질의 양에서 다른 물질의 양을 구한다.", "원자 구성": "원자 = **원자핵(양성자 + 중성자)** + **전자**(핵 주위). 양성자와 중성자를 합쳐 **핵자**라 한다.", "입자 전하": "**양성자 (+), 전자 (-), 중성자 0(전하 없음).** 양성자와 전자의 전하량 크기는 같다(부호만 반대).", "원자번호": "**원자번호 = 양성자 수.** 원소의 종류를 결정하며, **이온이 되어도 변하지 않는다**(양성자 수는 고정).", "원소 결정": "원소의 종류는 **양성자 수(원자번호)**로 결정된다. 중성자 수나 전자 수가 달라도 양성자 수가 같으면 같은 원소다.", "질량수": "**질량수 = 양성자 수 + 중성자 수**(= 핵자의 총수). 전자는 질량이 매우 작아 **포함하지 않는다.**", "원자 표기": "원자 표기에서 **왼쪽 위 첨자 = 질량수**, **왼쪽 아래 첨자 = 원자번호(양성자 수)**. 예: 탄소-12는 질량수 12, 원자번호 6.", "전자수": "**중성 원자: 전자 수 = 양성자 수(= 원자번호).** 양이온은 전자가 더 적고, 음이온은 더 많다.", "질량수 계산": "**질량수 = 양성자 수 + 중성자 수.** 거꾸로 중성자 수 = 질량수 - 양성자 수(원자번호).", "입자 질량": "**양성자 ≈ 중성자**(질량 거의 같음)이고, **전자는 양성자의 약 1/1840**로 매우 가볍다.", "원자 질량 분포": "원자 질량의 **대부분은 원자핵(양성자 + 중성자)**에 있다. 전자는 질량이 작아 거의 기여하지 않는다.", "원자핵 크기": "원자핵은 원자에서 **매우 작은 공간**만 차지하고, 원자의 **대부분은 전자가 분포하는 빈 공간**이다. 다만 핵은 작아도 질량의 대부분을 차지한다(밀도 큼).", "동위원소 정의": "동위원소 = **원자번호(양성자 수)는 같고 질량수(중성자 수)가 다른** 원자. 같은 원소의 서로 다른 형태다.", "동위원소 전자": "동위원소는 **전자 수가 같아 전자 배치가 같다.** 그래서 화학적 성질이 거의 같다. 차이는 **중성자 수(질량)**에 있다.", "핵전하": "원자핵은 **양성자 때문에 (+)전하**를 띠고, **핵전하량은 양성자 수**로 결정된다. 중성자는 전하가 없어 영향을 주지 않는다.", "동위원소 판정": "질량수 16인 산소와 18인 산소는 **양성자 수가 같고**(둘 다 8), **중성자 수가 다른**(8, 10) 동위원소다.", "동위원소 vs 동중원소": "- **동위원소**: 원자번호(양성자 수)가 **같고** 질량수가 다름 → **같은 원소**.\n- **동중원소(동중체)**: 질량수가 **같고** 원자번호가 다름 → **다른 원소**.", "이온 형성": "**전자를 잃으면 양이온(+), 얻으면 음이온(-).** 이온이 될 때 **양성자 수는 변하지 않는다**(전자만 변함).", "이온 전자수": "**양이온: 중성 원자보다 전자 수가 적다**(전자를 잃음). **음이온: 전자 수가 많다**(전자를 얻음). 예: Na⁺는 Na보다 전자 1개 적고, Cl⁻는 Cl보다 1개 많다.", "이온 양성자수": "이온이 되어도 **양성자 수(원자번호)는 변하지 않는다.** 이온화는 **전자만** 잃거나 얻는 것이므로, 원소의 종류도 그대로다.", "수소 동위원소": "질량수 1, 2, 3인 수소는 **모두 양성자 1개**(같은 원소)를 가지고, **중성자 수만 0, 1, 2**로 다르다.", "원자모형 변천": "원자 모형은 **돌턴 → 톰슨 → 러더퍼드 → 보어 → 현대 모형** 순으로 발전했다.", "전자 발견": "**톰슨**이 **음극선 실험**으로 **전자**를 발견했다. 음극선은 (-)전하를 띤 입자(전자)의 흐름이다.", "음극선 성질": "음극선 = **(-)전하를 띤 입자(전자)의 흐름.** 전기장에서 **(+)극 쪽으로 휜다**(끌린다). (-)극에서 (+)극으로 흐른다.", "톰슨 모형": "톰슨 모형 = **(+)전하 바탕에 전자가 박혀 있는** 모형(푸딩에 건포도 비유). **원자핵 개념이 없다.**", "원자핵 발견": "**러더퍼드**가 **알파 입자 산란 실험**으로 **원자핵**을 발견했다. 원자핵은 원자 중심의 작고 **(+)전하**를 띤 부분이다.", "알파 산란 결과": "알파 입자 산란 실험에서 **대부분의 알파 입자는 그대로 통과**했고, **극히 일부만** 크게 휘거나 되튀었다.", "알파 산란 해석": "알파 산란 실험은 ① 원자 내부가 **대부분 빈 공간**(대부분 통과), ② 중심에 **작고 (+)전하인 원자핵**(일부 되튐)이 있음을 보여 준다. 질량과 (+)전하가 핵에 집중되어 있다.", "핵의 존재": "일부 알파 입자가 크게 튕긴 것은 원자 중심에 **질량과 (+)전하가 모인 작고 무거운 원자핵**이 있기 때문이다.", "보어 모형": "보어는 전자가 **특정 에너지를 갖는 정해진 궤도(전자껍질)에만 존재**한다고 보았다. 이로써 수소 원자의 **선 스펙트럼**을 설명했다.", "전자껍질 순서": "전자껍질은 핵에서 **가까운 것부터 K, L, M, N** 순이다(K가 가장 안쪽). 각각 n=1, 2, 3, 4에 대응한다.", "에너지 준위": "전자껍질의 에너지 준위는 **핵에서 멀수록 높다.** 즉 K < L < M < N 순으로 에너지가 높아진다.", "에너지 양자화": "보어 모형에서 전자의 에너지는 **불연속적(양자화)**이다. 전자는 **정해진 에너지 값만** 가지며, 전자껍질 사이의 **중간 에너지는 가질 수 없다.**", "바닥상태": "바닥상태 = 전자가 **가장 낮은 에너지 준위**에 있는 **가장 안정한** 상태. 에너지를 흡수해 높은 준위로 가면 **들뜬상태**가 된다.", "전자 전이": "- 전자가 **낮은 → 높은 준위**로 갈 때: 에너지를 **흡수**.\n- 전자가 **높은 → 낮은 준위**로 갈 때: 빛(에너지)을 **방출**.\n- 흡수·방출하는 에너지 = **두 준위의 에너지 차이.**", "선 스펙트럼": "수소 원자의 선 스펙트럼은 **특정 파장의 빛만 나타나는 불연속적인 선**으로 보인다(몇 개의 정해진 색의 선).", "스펙트럼 해석": "선 스펙트럼이 불연속적인 것은 전자의 **에너지 준위가 양자화(불연속)**되어 있기 때문이다. 각 선은 전자가 특정 두 준위 사이를 전이할 때 나타난다.", "연속 스펙트럼": "**백색광(햇빛, 백열등)을 분광하면 연속 스펙트럼**(모든 파장이 끊김 없이 이어지는 무지개 띠)이 나타난다.", "스펙트럼선 의미": "방출 스펙트럼의 **각 선 = 특정한 두 에너지 준위의 차이**에 해당한다. 빛의 에너지가 클수록 파장이 짧다.", "보어 모형 성공": "보어 모형은 **수소 원자의 선 스펙트럼**을 양자화된 에너지로 잘 설명했고, 스펙트럼선의 위치를 예측했다.", "보어 모형 한계": "보어 모형은 전자가 **여러 개인 원자(헬륨 이상)의 스펙트럼은 잘 설명하지 못한다.** 수소처럼 전자가 하나인 경우에만 잘 맞는다.", "현대 모형": "현대 원자 모형에서 전자는 정확한 위치가 아니라 **확률 분포**로 나타낸다. 전자가 발견될 확률이 높은 공간을 **오비탈**이라 한다.", "오비탈": "오비탈 = 전자가 **발견될 확률 분포**(확률이 높은 공간). 현대 원자 모형에서 전자를 나타내는 방식이며, 정확한 위치나 궤도가 아니다.", "불확정성": "불확정성 원리: 전자의 **위치와 운동량을 동시에 정확히 알 수 없다.** 그래서 현대 모형은 전자를 **확률적**(오비탈)으로 다룬다.", "오비탈 종류": "오비탈에는 **s, p, d, f** 등의 종류가 있고, 종류마다 **모양이 다르다.** s는 공 모양(구형), p는 아령 모양이다.", "전이 에너지": "전자가 전이할 때 흡수·방출하는 빛의 에너지 = **두 준위의 에너지 차이.** 에너지가 클수록 빛의 **파장이 짧다.**", "부껍질": "같은 전자껍질도 세부 에너지 준위인 **부껍질(s, p, d, f)**로 나뉜다. 다전자 원자에서 같은 껍질의 부껍질은 에너지가 다르다(s < p < d < f).", "주양자수": "주양자수 n = **전자껍질의 번호**(K=1, L=2, M=3, ...). **1 이상의 자연수**이며, n이 커지면 에너지 준위가 높아지고 핵에서 멀어진다.", "바닥·들뜬상태": "- **바닥상태**: 전자가 가장 낮은 에너지 준위에 있는 **가장 안정한** 상태.\n- **들뜬상태**: 에너지를 **흡수해** 높은 준위로 올라간 상태(불안정).", "오비탈 전자수": "오비탈 1개에는 **최대 2개**의 전자가 들어가고, 그 두 전자는 **스핀이 서로 반대**다(파울리 배타원리).", "오비탈 수": "부껍질별 오비탈 수: **s 1개, p 3개, d 5개, f 7개**(홀수로 2씩 증가).", "부껍질 전자수": "부껍질의 최대 전자 수 = **오비탈 수 × 2**: **s 2, p 6, d 10, f 14.**", "껍질 최대 전자수": "n번째 전자껍질의 최대 전자 수 = **2n².** 안쪽부터 **2, 8, 18, 32**(K, L, M, N).", "쌓음 원리": "쌓음 원리: 전자는 **에너지가 낮은 오비탈부터** 차례로 채운다(1s부터). 이렇게 채운 것이 바닥상태다.", "오비탈 에너지 순서": "다전자 원자에서 **4s가 3d보다 에너지가 낮아 먼저 채워진다.** 같은 껍질 안에서는 **s < p < d < f** 순이다.", "파울리 배타원리": "파울리 배타원리: 한 오비탈의 두 전자는 **스핀이 서로 반대**여야 한다. 그래서 한 오비탈의 최대 전자 수가 **2개**다.", "훈트 규칙": "훈트 규칙: 같은 에너지의 오비탈에는 전자를 **하나씩 먼저** 채운 뒤 짝을 짓는다. 이때 홀전자들은 **같은 방향 스핀**을 가진다(홀전자 수 최대).", "전자 배치 표기": "바닥상태 전자 배치는 원자번호(= 전자 수)만큼 에너지 낮은 오비탈부터 채운다. 예: **탄소(6) 1s² 2s² 2p²**, **산소(8) 1s² 2s² 2p⁴**, **나트륨(11) 1s² 2s² 2p⁶ 3s¹**.", "원자가전자": "원자가전자 = 가장 **바깥 전자껍질**에 있는 전자로, **화학 결합에 참여**한다. 18족(비활성 기체)은 원자가전자 수를 **0으로 본다**.", "홀전자": "홀전자 = 오비탈에 짝 없이 혼자 있는 전자. 2주기 예: **탄소 2, 질소 3, 산소 2, 플루오린 1.**", "들뜬상태": "들뜬상태 = 전자가 더 **높은 에너지 오비탈**에 있는 배치로, 쌓음 원리를 따르지 않아 바닥상태보다 **에너지가 높고 불안정**하다.", "전자수 세기": "전자 배치의 **위 첨자(각 오비탈 전자 수)를 모두 더하면** 전자 총수다. 예: 1s² 2s² 2p⁶ 3s¹ → 2+2+6+1 = **11.**", "가려막기": "가려막기 효과 = **안쪽 전자가 바깥 전자에 작용하는 핵의 인력을 가리는(부분 상쇄)** 효과. 그래서 바깥 전자가 느끼는 핵전하가 실제보다 **작아진다**(유효핵전하 감소).", "유효핵전하": "유효핵전하 = 전자가 **실제로 느끼는 핵전하** = (실제 핵전하 − 가려막기 효과). **같은 주기에서 오른쪽으로 갈수록(원자번호 ↑) 커진다.**", "전자 반발": "다전자 원자에서 전자 사이에는 **반발력**이 작용한다(같은 (-)전하끼리 밀어냄). 이 반발이 가려막기 효과의 원인이 되고, 훈트 규칙처럼 전자가 흩어져 채워지게 한다.", "주기 구조": "주기율표의 **주기(가로줄) = 전자껍질 수가 같음.** 주기 번호는 가장 바깥 전자껍질의 주양자수와 같다.", "족 성질": "주기율표의 **족(세로줄) = 원자가전자 수가 같음** → 화학적 성질이 비슷하다. 1족 알칼리 금속, 17족 할로젠, 18족 비활성 기체.", "유효핵전하 주기성": "같은 주기에서 **오른쪽으로 갈수록(원자번호 ↑) 유효핵전하가 커진다.** 이것이 원자 반지름 감소의 원인이다.", "원자 반지름": "- **같은 주기**: 오른쪽으로 갈수록(유효핵전하 ↑) 원자 반지름 **작아짐.**\n- **같은 족**: 아래로 갈수록(껍질 수 ↑) 원자 반지름 **커짐.**", "이온 반지름": "- **양이온**: 중성 원자보다 반지름이 **작아진다**(전자를 잃음).\n- **음이온**: 중성 원자보다 반지름이 **커진다**(전자를 얻음).", "등전자 이온": "등전자 이온(전자 수가 같은 이온)은 **핵전하(양성자 수)가 클수록 반지름이 작다.** 같은 수의 전자를 더 강하게 당기기 때문이다.", "이온화 에너지": "(제1) 이온화 에너지 = **기체 상태 원자에서 전자 1개를 떼어내는 데 필요한 에너지**. 클수록 전자를 떼기 어렵다.", "이온화 에너지 주기성": "- **같은 주기**: 오른쪽으로 갈수록 이온화 에너지 **대체로 커짐**(유효핵전하 ↑).\n- **같은 족**: 아래로 갈수록 이온화 에너지 **작아짐**(반지름 ↑).", "순차 이온화 에너지": "순차 이온화 에너지는 **E₁ < E₂ < E₃ 순으로 커진다**(전자를 뗄수록 떼기 어려움). 값이 **급격히 증가하는 지점**으로 **원자가전자 수**를 알 수 있다.", "전기음성도": "전기음성도 = **공유 결합에서 공유 전자쌍을 끌어당기는 능력.** 클수록 전자쌍을 더 강하게 당긴다.", "전기음성도 주기성": "- **같은 주기**: 오른쪽으로 갈수록 전기음성도 **커짐**(유효핵전하 ↑).\n- **같은 족**: 아래로 갈수록 전기음성도 **작아짐**(원자 반지름 ↑).", "전기음성도 최대": "전기음성도가 가장 큰 원소는 **플루오린(F)**이다. 대략 **F > O > N** 순으로 큰 편이다.", "금속성": "금속성 = **전자를 잃고 양이온이 되려는 성질.** 주기율표에서 **왼쪽 아래로 갈수록 커진다**(이온화 에너지가 작음).", "비금속성": "비금속성 = **전자를 얻어 음이온이 되려는 성질.** 주기율표에서 **오른쪽 위로 갈수록 커진다**(전기음성도가 큼).", "알칼리 금속": "1족 알칼리 금속은 반응성이 크고, **아래로 갈수록 반응성이 커진다**(이온화 에너지가 작아짐). 전자 1개를 잃어 **+1 양이온**이 되기 쉽다.", "할로젠": "17족 할로젠은 반응성이 크고, **위로 갈수록 반응성이 커진다**(플루오린이 최대). 전자 1개를 얻어 **−1 음이온**이 되기 쉽다.", "비활성 기체": "18족 비활성 기체는 가장 바깥 껍질이 전자로 가득 차 **안정**해서, **반응성이 매우 작고** 이온화 에너지가 매우 크다.", "전자 친화도": "전자 친화도 = **기체 상태 원자가 전자 1개를 얻을 때 방출하는 에너지.** 클수록 전자를 얻으려는(음이온이 되려는) 경향이 크다.", "금속 이온화": "금속은 전자를 **잃기 쉬워** 이온화 에너지가 작은 편이고, **양이온**이 되기 쉽다. 주기율표 왼쪽에 주로 위치한다.", "비금속 전기음성도": "비금속은 전자를 **얻기 쉬워** 전기음성도가 큰 편이고, **음이온**이 되기 쉽다. 주기율표 오른쪽 위에 주로 위치한다.", "이온화 에너지 비교": "- **같은 주기**: 오른쪽으로 갈수록 대체로 큼 → Mg > Na, 비활성 기체가 **가장 큼.**\n- **같은 족**: 위에 있는 원소가 더 큼 → Li > Na.", "전기음성도 비교": "같은 족에서는 **위에 있는 원소**가 전기음성도가 더 크다. 예: **F > Cl, O > S, N > P.**", "원자 반지름 비교": "- **같은 족**: 아래에 있는 원소가 반지름이 더 큼 → S > O, Na > Li.\n- **같은 주기**: 왼쪽 원소가 반지름이 더 큼 → Na > Cl.", "결합 형성 이유": "원자들은 **비활성 기체와 같은 안정한 전자 배치**(옥텟)를 이루기 위해 화학결합을 형성한다. 결합으로 **더 낮은 에너지** 상태가 되어 안정해진다.", "결합과 에너지": "- 결합이 **형성**될 때: 에너지를 **방출**(발열) → 더 안정.\n- 결합이 **끊어질** 때: 에너지를 **흡수**(흡열).", "이온결합": "이온결합 = **금속 양이온과 비금속 음이온 사이의 정전기적 인력.** 금속과 비금속 사이에서 주로 형성된다(금속은 전자를 잃고 비금속은 얻음).", "공유결합": "공유결합 = **두 원자가 전자쌍을 공유**하여 형성. 주로 **두 비금속** 사이에서 만들어지며, 공유 전자쌍은 두 원자에 함께 속한다. 예: H₂O, CO₂.", "금속결합": "금속결합 = **금속 양이온과 자유전자 사이의 인력.** 금속의 원자가전자는 특정 원자에 묶이지 않고 **자유롭게 움직이는 자유전자**가 된다.", "이온결정": "이온결합 물질은 **분자가 아니라** 양이온과 음이온이 규칙적으로 배열된 **이온결정**으로 존재한다. 그래서 **실험식**으로 나타낸다.", "공유결합 종류": "공유 전자쌍 수에 따라: **단일 결합 1개, 이중 결합 2개, 삼중 결합 3개.** 예: **N₂는 삼중 결합, O₂는 이중 결합.**", "결합 에너지 곡선": "두 원자 사이에는 **인력과 반발력**이 함께 작용한다. **에너지가 가장 낮은 거리**에서 안정한 결합이 형성되며, 그 거리가 **결합 길이**다.", "결합 길이": "결합 길이 = 결합한 두 원자의 **핵 사이 거리**(에너지가 가장 낮은 거리). **결합 차수가 클수록 결합 길이가 짧다**(단일 > 이중 > 삼중).", "이온결정 성질": "이온결정은 단단하고 녹는점이 높지만, 외부 힘에 **쉽게 쪼개진다(부서짐성).** 힘을 받아 층이 밀리면 같은 전하 이온끼리 만나 반발하기 때문이다.", "이온결정 전도성": "이온결합 물질은 **고체에서는 전기가 통하지 않고**, **녹은 액체나 수용액에서는 전기가 통한다.** 전하를 운반하는 이온이 자유롭게 움직일 수 있느냐가 기준이다.", "금속 전도성": "금속은 **자유전자**가 있어 **고체와 액체 모두에서 전기가 잘 통한다.** 열도 잘 전달한다.", "금속 성질": "금속은 **전성(펴짐)과 연성(늘어남)**이 있고, 광택이 있으며, 자유전자 때문에 전기가 잘 통한다. 힘을 가해도 부서지지 않고 모양만 변한다.", "공유결정": "공유결정 = 원자들이 **공유결합으로 연속적으로 연결**된 결정. 결합이 강해 **매우 단단하고 녹는점이 매우 높다.** 예: 다이아몬드, 석영(SiO₂).", "흑연": "흑연은 **공유결정이지만 예외적으로 전기가 통한다.** 탄소 원자의 일부 전자가 자유롭게 움직이기 때문이다. 층 구조라 잘 미끄러진다.", "분자결정": "분자결정 = 분자들이 **약한 분자 사이 인력**으로 모인 결정. 인력이 약해 **녹는점이 낮고**, 대부분 전기가 통하지 않는다. 예: 드라이아이스(CO₂), 얼음.", "분자결정 비교": "분자 결정은 일반적으로 이온 결정보다 **녹는점이 낮다**(분자 사이 인력이 약함). 녹는점은 대체로 **공유결정 > 이온결정 > 분자결정** 순이다.", "이온결정 녹는점": "이온결정은 양이온과 음이온 사이의 **정전기적 인력이 강해 녹는점이 높다.** 이온의 전하가 클수록 녹는점이 더 높아진다.", "결합 극성": "- **무극성 공유결합**: 같은 원소 두 원자(전기음성도 차이 없음). 예: H₂.\n- **극성 공유결합**: 전기음성도가 다른 두 원자. 예: HCl.", "격자 에너지": "격자 에너지 = 기체 이온이 모여 **이온결정을 형성할 때 방출하는 에너지**(이온결합의 세기). **전하가 크고 이온이 작을수록** 격자 에너지가 크다.", "이온결합 판정": "**금속과 비금속이 결합하면 이온결합**이다. 예: NaCl, MgO, KCl.", "이온결정 배열": "이온결정에서는 양이온과 음이온이 **번갈아 규칙적으로** 3차원 배열된다. 각 이온은 반대 전하 이온에 둘러싸여 있다. 예: 염화 나트륨에서 Na⁺과 Cl⁻이 교대로 배열.", "공유결합 판정": "**두 비금속이 결합하면 공유결합**이다. 예: H₂O, CO₂, CH₄.", "VSEPR 원리": "전자쌍 반발 이론(VSEPR): 중심 원자 주위의 전자쌍은 서로 **반발을 최소화하도록**(최대한 멀리 떨어지게) 배치된다. 이 전자쌍 배치가 분자 모양을 결정한다.", "공유 전자쌍": "- **공유 전자쌍**: 두 원자가 공유하여 **결합에 참여**하는 전자쌍.\n- **비공유 전자쌍(고립 전자쌍)**: 결합에 참여하지 않고 **한 원자에만** 속하는 전자쌍.", "전자쌍 배치": "중심 원자 주위 전자쌍(영역) 수에 따라: **2개 직선형, 3개 평면 삼각형, 4개 정사면체.**", "전자쌍 각도": "전자쌍(영역) 수에 따른 각도: **2개 180°, 3개 120°, 4개 약 109.5°.**", "다중결합 취급": "전자쌍 반발에서 **다중 결합(이중·삼중)은 하나의 영역**으로 취급한다. 그래야 분자 모양을 바르게 예측할 수 있다.", "분자 모양": "중심 원자의 영역 수와 비공유 전자쌍으로 모양이 정해진다: **CO₂ 직선형, BF₃ 평면 삼각형, CH₄ 정사면체, NH₃ 삼각뿔, H₂O·SO₂ 굽은형.**", "분자 루이스 구조": "- **H₂O**: 공유 전자쌍 2개 + 비공유 전자쌍 2개.\n- **NH₃**: 공유 전자쌍 3개 + 비공유 전자쌍 1개.\n- **CH₄**: 공유 전자쌍 4개 + 비공유 전자쌍 0개.", "비공유 전자쌍": "중심 원자의 비공유 전자쌍 수: **H₂O의 O는 2개, NH₃의 N은 1개, CH₄의 C는 0개.** 비공유 전자쌍은 분자 모양에 영향을 준다.", "결합각": "대표 분자의 결합각: **CH₄ 약 109.5° > NH₃ 약 107° > H₂O 약 104.5°.** 비공유 전자쌍이 많을수록 결합각이 작아진다.", "비공유 전자쌍 반발": "비공유 전자쌍의 반발은 공유 전자쌍의 반발보다 **크다.** 반발 크기는 **비공유-비공유 > 비공유-공유 > 공유-공유** 순이다.", "결합각 비교": "CH₄, NH₃, H₂O의 결합각은 **CH₄ > NH₃ > H₂O** 순이다(약 109.5° > 107° > 104.5°). 비공유 전자쌍이 많을수록 결합각이 작다.", "결합각 원인": "NH₃와 H₂O의 결합각이 정사면체 각(109.5°)보다 작은 것은 **비공유 전자쌍의 반발** 때문이다. 비공유 전자쌍이 공유 전자쌍을 더 강하게 밀어낸다.", "옥텟 규칙": "옥텟 규칙: 원자가 가장 바깥 껍질에 **전자 8개**를 채워 비활성 기체와 같은 안정한 배치를 이루려는 경향. **단, 수소는 전자 2개**(헬륨과 같은 배치)로 안정해진다.", "분자 모양 결정": "분자의 모양은 중심 원자의 **공유 전자쌍과 비공유 전자쌍의 수** 모두로 결정된다. 전체 전자쌍 수(영역 수)가 기본 배치를 정하고, 비공유 전자쌍이 모양을 바꾼다.", "정사면체": "정사면체 구조에서는 **모든 결합각이 약 109.5°로 같다.** 평면이 아닌 **입체(3차원) 구조**이며, 중심 원자에 영역이 4개이고 비공유 전자쌍이 없을 때 나타난다(예: CH₄).", "다중 결합": "- **N₂**: 삼중 결합(공유 전자쌍 3개).\n- **O₂**: 이중 결합(공유 전자쌍 2개).\n결합 차수가 클수록 결합이 **강하고 짧다**(단일 < 이중 < 삼중).", "고립 전자쌍": "고립 전자쌍 = **비공유 전자쌍**과 같은 말로, **결합에 참여하지 않고** 한 원자에만 속하는 전자쌍이다. H₂O의 O에는 2개, NH₃의 N에는 1개 있다.", "부분 전하": "극성 공유결합에서 **전기음성도가 큰 원자가 부분 음전하(δ-)**, **작은 원자가 부분 양전하(δ+)**를 띤다. 예: HCl에서 Cl은 δ-, H는 δ+.", "쌍극자 모멘트": "쌍극자 모멘트는 결합(또는 분자)의 **극성 크기와 방향**을 나타내는 **벡터**다. 분자의 쌍극자 모멘트가 **0이면 무극성** 분자다.", "극성결합 vs 극성분자": "결합이 극성이어도 **분자 모양이 대칭이면 쌍극자가 상쇄되어 무극성 분자**일 수 있다. 분자의 극성은 결합 극성과 **분자 모양**을 함께 봐야 한다.", "무극성 분자": "대표 무극성 분자: **CO₂(직선형), BF₃(평면 삼각형), CH₄·CCl₄(정사면체), BeF₂(직선형), O₂·N₂(같은 원자).** 모두 쌍극자 모멘트가 0이다.", "무극성 원인": "CO₂, CCl₄ 같은 분자가 무극성인 것은 **대칭적인 분자 구조**에서 결합의 **쌍극자가 서로 상쇄**되기 때문이다(결합 자체는 극성).", "극성 분자": "대표 극성 분자: **H₂O(굽은형), NH₃(삼각뿔), HF·HCl(이원자 비대칭).** 모두 쌍극자 모멘트가 0이 아니다.", "극성 원인": "H₂O, NH₃가 극성인 것은 **비대칭 구조**(굽은형, 삼각뿔)라 결합의 **쌍극자가 상쇄되지 않기** 때문이다. 남은 쌍극자가 분자 전체에 쌍극자 모멘트를 만든다.", "분자 극성 판단": "분자의 극성 여부는 **결합의 극성**과 **분자 모양(대칭성)** 두 가지를 함께 봐야 한다. 결합이 극성이고 분자가 비대칭이면 극성, 대칭이면 무극성이다.", "대칭과 극성": "**대칭적인 분자는 극성 결합이 있어도 무극성**일 수 있다(쌍극자 상쇄). 반대로 **비대칭 분자는 쌍극자가 남아 극성**이 된다.", "혼성 오비탈": "혼성 오비탈과 구조: **sp 직선형, sp² 평면 삼각형, sp³ 정사면체.** 혼성 오비탈은 s와 p 오비탈이 섞여 만들어진다.", "혼성 적용": "중심 원자의 **영역 수**(결합 + 비공유 전자쌍)로 혼성을 정한다: **CH₄·NH₃·H₂O는 sp³**(영역 4), **BF₃는 sp²**(영역 3), **CO₂는 sp**(영역 2).", "혼성 수": "혼성 오비탈의 수 = 중심 원자의 **전자쌍(영역) 수**와 같다. 영역 2개면 2개(sp), 3개면 3개(sp²), 4개면 4개(sp³).", "극성과 용해": "**비슷한 극성끼리 잘 녹는다**(유유상종): 극성 분자는 극성 용매에, 무극성 분자는 무극성 용매에 잘 녹는다. 소금(이온 물질)은 극성 용매인 물에 잘 녹는다.", "전기장 배열": "극성 분자를 전기장에 두면 **일정한 방향으로 규칙적으로 배열**한다(부분 전하가 각 전극을 향함). 무극성 분자는 특정 방향으로 정렬되지 않는다.", "극성과 끓는점": "분자량이 비슷할 때 **극성 분자가 무극성 분자보다 끓는점이 높은** 경향이 있다. 극성 분자 사이에는 **쌍극자-쌍극자 인력**이 작용해 분자 사이 인력이 더 강하기 때문이다.", "분산력": "분산력은 **모든 분자 사이**에 작용하는 약한 인력이다. 무극성 분자 사이에도 작용하며, **분자량이 클수록 분산력이 커진다**.", "가역 반응": "가역 반응은 **정반응과 역반응이 모두 일어나는** 반응으로, 양방향 화살표(⇌)로 나타낸다. 반응물과 생성물이 함께 존재한다.", "동적 평형 개념": "동적 평형에서는 **정반응과 역반응이 같은 빠르기로 계속 일어난다.** 반응이 멈춘 것처럼 보이지만, 실제로는 반응물이 생성물로, 생성물이 반응물로 끊임없이 바뀐다.", "동적 평형 정의": "동적 평형은 **정반응 속도와 역반응 속도가 같은** 상태다. 두 속도가 같아지는 순간 평형에 도달하며, 그 속도는 **0이 아니다**(계속 일어나고 있음).", "평형 농도": "평형 상태에서 반응물과 생성물의 농도는 **일정하게 유지**된다(더 이상 변하지 않음). 단, 농도가 일정한 것이지 **반응물과 생성물의 농도가 서로 같다는 뜻은 아니다.**", "평형의 겉보기": "평형 상태에서는 **색, 농도, 압력 등 겉보기 성질이 일정**해 변화가 관찰되지 않는다. 하지만 겉보기 변화가 없어도 **반응은 계속 일어나고 있다**(동적 상태).", "평형 상수 식": "평형 상수 **K = (생성물 농도의 곱) / (반응물 농도의 곱).** 각 물질의 농도는 **반응식의 계수만큼 제곱**하고, **고체와 순수한 액체의 농도는 제외**한다.", "평형 상수 해석": "- **K가 크면 생성물이 많다**(정반응이 많이 진행, 거의 완결).\n- **K가 작으면 반응물이 많다**(반응이 거의 진행 안 됨).", "평형 상수와 온도": "평형 상수 K는 **온도가 변할 때만 값이 달라진다.** 농도, 압력, 촉매를 바꿔도 K는 **변하지 않는다**(온도가 일정하면 K도 일정).", "반응 지수": "반응 지수 Q는 평형 상수 식에 **현재(임의 시점)의 농도**를 넣어 계산한 값이다. K와 **식의 형태는 같고**, 넣는 농도만 다르다. 평형에 도달하면 Q = K가 된다.", "반응 지수 방향": "Q와 K를 비교해 반응 방향을 예측한다: **Q < K → 정반응 우세**(생성물 늘어남), **Q > K → 역반응 우세**(반응물 늘어남), **Q = K → 평형.**", "비가역 반응": "비가역 반응은 **한 방향으로만 진행**되고, 역반응이 거의 일어나지 않는다. 반응물이 거의 모두 생성물로 변하며, 한 방향 화살표로 나타낸다.", "평형 도달": "**닫힌 용기**에서 반응이 진행되면 결국 동적 평형에 도달할 수 있고, 그때 정반응 속도와 역반응 속도가 같아진다. 평형에 도달하는 **시간은 반응마다 다르다.**", "평형 상수 단위": "평형 상수 K의 단위는 **반응식의 계수에 따라 달라지며**, 보통 **단위 없는 값**으로 다룬다. 항상 mol/L인 것이 아니다.", "반응 지수 활용": "반응 지수 Q를 **평형 상수 K와 비교**하면 반응의 진행 방향을 예측할 수 있다: Q < K → 정반응, Q > K → 역반응, Q = K → 평형 유지.", "정·역반응 열": "정반응과 역반응은 **발열·흡열이 서로 반대**다. 정반응이 발열이면 역반응은 흡열, 정반응이 흡열이면 역반응은 발열이다. ΔH는 크기가 같고 부호가 반대다.", "르샤틀리에 정의": "르샤틀리에 원리: 평형에 변화를 주면, 그 **변화를 줄이는(완화하는) 방향**으로 평형이 이동한다. 농도·온도·압력 변화에 따른 평형 이동을 예측하는 기본 원리다.", "농도 변화": "- **반응물 농도↑** 또는 **생성물 제거** → **정반응** 방향 이동.\n- **생성물 농도↑** 또는 **반응물 제거** → **역반응** 방향 이동.", "온도 변화": "- **온도↑** → **흡열 반응** 방향 이동(열을 흡수해 온도 상승 완화).\n- **온도↓** → **발열 반응** 방향 이동(열을 방출해 온도 하강 완화).", "온도와 평형 상수": "평형 상수 K는 **온도 변화로만** 값이 달라진다. 발열 반응에서 온도를 높이면 K가 작아지고, 흡열 반응에서 온도를 높이면 K가 커진다. 농도·압력 변화는 K를 바꾸지 않는다.", "압력 변화": "- **압력↑(부피↓)** → **기체 분자 수가 적은 쪽**으로 이동(분자 수를 줄여 압력 상승 완화).\n- **압력↓(부피↑)** → **기체 분자 수가 많은 쪽**으로 이동.\n- 반응 전후 **기체 분자 수가 같으면** 압력을 바꿔도 평형은 **이동하지 않는다.**", "촉매": "촉매는 **평형에 더 빨리 도달**하게 할 뿐, **평형의 위치·평형 상수 K·수득률은 바꾸지 않는다.** 정반응과 역반응의 속도를 **모두** 똑같이 빠르게 한다.", "압력 적용": "N₂ + 3H₂ ⇌ 2NH₃에서 왼쪽은 기체 분자 **4개**(1+3), 오른쪽은 **2개**다. **압력을 높이면** 기체 분자 수가 적은 **NH₃ 쪽(정반응)**으로 이동해 암모니아 수득률이 높아진다.", "온도 적용": "N₂ + 3H₂ ⇌ 2NH₃는 **발열 반응**이다. **온도를 낮추면** 발열 방향인 **정반응(NH₃ 생성)** 쪽으로 이동해 암모니아가 더 많이 생성된다.", "평형 이동과 K": "**농도나 압력으로 평형을 이동시켜도 온도가 같으면 평형 상수 K는 변하지 않는다.** 평형이 이동해 농도가 바뀌어도 K 값은 일정하다.", "르샤틀리에 활용": "르샤틀리에 원리로 **평형 이동 방향을 예측**하고, 농도·온도·압력을 조절해 평형을 원하는 방향으로 이동시켜 **수득률을 높일** 수 있다. 산업 공정에서 널리 활용된다.", "평형 재도달": "조건을 바꿔 평형이 이동해도, 결국 **새로운 평형 상태에 도달**한다. 새 평형에서도 정반응 속도와 역반응 속도가 **다시 같아져** 농도가 일정해진다.", "증발·응축 평형": "밀폐 용기에서 **증발 속도와 응축 속도가 같아지면 동적 평형**에 도달한다. 처음에는 증발 속도가 더 빠르지만, 두 속도가 같아지면 겉보기 양 변화가 없어진다.", "증기압": "증기압은 일정 온도에서 **액체와 평형을 이루는 증기의 압력**으로, 액체가 증발하려는 정도를 나타낸다. 휘발성이 큰(증발이 잘 되는) 액체일수록 증기압이 크다.", "증기압과 온도": "**온도가 높을수록 증기압은 커진다.** 온도가 높아지면 입자 운동이 활발해져 증발이 잘 일어나기 때문이다.", "증기압 평형": "증기압 평형 상태에서는 증발 속도와 응축 속도가 같아 **증기의 양(압력)이 일정하게 유지**된다. 단, 증발과 응축은 계속 일어난다.", "끓음": "액체의 **증기압이 외부 압력과 같아지면 끓는다.** 끓음은 표면뿐 아니라 **액체 내부에서도 기화**가 일어나는 현상이다(증발은 표면에서만).", "끓는점과 압력": "끓는점은 외부 압력에 따라 달라진다: **외부 압력↓ → 끓는점↓**(높은 산), **외부 압력↑ → 끓는점↑**(압력솥).", "승화": "승화는 고체가 **액체를 거치지 않고 바로 기체**로 변하는 현상이다. 예: 드라이아이스가 기체로 변하는 것, 나프탈렌이 작아지는 것.", "용해·석출 평형": "용질이 **녹는 속도(용해)와 석출되는 속도가 같아지면 용해 평형**에 도달한다. 이때 녹은 용질의 양이 일정해지며, 용해 평형은 동적 평형의 한 예다.", "포화 용액": "포화 용액은 용질이 **최대로 녹아 용해 평형에 도달한 동적 평형 상태**의 용액이다. 용질을 더 넣으면 녹지 않고 가라앉으며, 겉보기 농도는 일정하게 유지된다.", "불포화 용액": "불포화 용액은 **용질을 더 녹일 수 있는** 용액으로, 아직 용해 평형에 도달하지 않았다. 이 상태에서는 **용해 속도가 석출 속도보다 크다.**", "과포화 용액": "과포화 용액은 포화 용액보다 **용질이 더 많이(용해도보다 많이) 녹아 있는 불안정한** 상태다. 충격을 주거나 작은 자극을 받으면 여분의 용질이 **석출**되어 포화 상태가 된다.", "용해도": "용해도는 일정 온도에서 **용매 100 g에 녹을 수 있는 용질의 최대 g수**다. **온도에 따라 달라지며**, 같은 온도라도 물질마다 다르다.", "고체 용해도와 온도": "**대부분의 고체는 온도가 높을수록 용해도가 커진다.** 그래서 뜨거운 물에 설탕이 더 잘 녹는다.", "기체 용해도와 온도": "**기체는 온도가 높을수록 용해도가 작아진다**(고체와 반대). 그래서 따뜻한 물보다 **찬물에 기체가 더 잘 녹는다.**", "기체 용해도와 압력": "**기체는 압력이 높을수록 용해도가 커진다**(헨리 법칙: 용해도 ∝ 압력). 탄산음료 뚜껑을 열면 압력이 낮아져 녹아 있던 기체가 빠져나온다.", "용해 평형": "용해 평형에서 용질 입자는 **녹고 석출되는 과정을 끊임없이 반복**하며, 용해 속도와 석출 속도가 같아 용액의 농도가 일정하게 유지된다.", "동적 평형 예": "동적 평형의 예: **증기압 평형, 용해 평형, 밀폐 용기의 증발·응축 평형.** 모두 반대 방향의 두 변화가 **같은 속도로 계속** 일어나 겉보기 변화가 없다.", "용액 구성": "용액 = **용질 + 용매**. **용질은 녹는 물질**, **용매는 녹이는 물질**이다. 소금물에서 소금은 용질, 물은 용매다. 용액은 균일하게 섞인 혼합물이다.", "퍼센트 농도": "퍼센트 농도 = **(용질의 질량 / 용액의 질량) × 100.** 용액 100 g에 녹아 있는 용질의 g수와 같다. 용액의 질량 = 용질 + 용매의 질량.", "몰농도 정의": "몰농도 = **용질의 몰수 / 용액의 부피(L).** 용액 1 L에 녹아 있는 용질의 몰수를 뜻한다. 기준은 **용액의 부피**다.", "몰농도 단위": "몰농도의 단위는 **mol/L**이며, **M**으로 나타낸다. 1 M = 1 mol/L다.", "몰농도 계산": "몰농도 = 용질 몰수 / 용액 부피(L). 예: **0.5 L 용액에 용질 1몰 → 2 M**(1 ÷ 0.5), **2 L 용액에 용질 1몰 → 0.5 M**(1 ÷ 2).", "용액 제조": "일정 몰농도 용액은 **부피 플라스크**로 만든다: **용질을 넣고**(소량의 용매에 녹인 뒤) 용매로 **표선까지** 채워 정해진 부피의 용액을 만든다.", "몰농도 기준 부피": "몰농도의 기준 부피는 용매가 아니라 **용액 전체의 부피**다. 용질이 녹으면 부피가 달라지므로, 용매의 부피와 용액의 부피는 다를 수 있다.", "희석": "희석은 **용매를 더해 농도를 낮추는** 과정이다. 용매만 더하므로 **용질의 몰수는 변하지 않고**, 부피가 늘어 몰농도가 작아진다. 희석 전후 농도×부피가 같다: **MV = M'V'.**", "희석 계산": "MV = M'V'를 이용한다. 예: **2 M 용액 100 mL를 물로 희석해 200 mL로 만들면 1 M**이 된다(2 × 100 = M' × 200 → M' = 1). 부피를 2배로 희석하면 농도는 **절반**이 된다.", "농도 환산": "퍼센트 농도와 몰농도를 서로 환산하려면 **용액의 밀도**와 **용질의 몰질량(분자량)**이 필요하다. 밀도는 질량과 부피를, 몰질량은 질량과 몰수를 연결한다.", "몰농도와 온도": "몰농도는 **온도가 변하면 값이 달라질 수 있다.** 온도가 변하면 **용액의 부피**가 변하기 때문이다(예: 온도↑ → 부피↑ → 몰농도↓).", "퍼센트 농도와 온도": "퍼센트 농도는 **온도가 변해도 값이 변하지 않는다.** **질량**을 기준으로 하는데, 질량은 온도에 따라 변하지 않기 때문이다.", "몰수와 부피": "같은 몰농도라도 **용액의 부피가 크면 용질의 몰수가 더 많다.** 몰수 = 몰농도 × 부피이므로, 농도가 같으면 부피와 몰수는 비례한다.", "몰수 계산": "**용질의 몰수 = 몰농도 × 용액의 부피(L).** 예: 0.1 M × 2 L = **0.2몰**, 1 M NaCl × 0.5 L = **0.5몰**.", "몰수 환산": "**몰수 = 질량 / 몰질량.** 질량을 몰질량으로 **나누면** 몰수를 얻는다(거꾸로 질량 = 몰수 × 몰질량). 예: NaOH 40 g = 1몰(몰질량 40 g/mol).", "농도 비교": "**퍼센트 농도가 같아도 용질의 몰질량이 다르면 몰농도가 다를 수 있다.** 퍼센트 농도는 질량, 몰농도는 몰수 기준이라, 몰질량이 다르면 몰수가 달라지기 때문이다.", "실험 기구": "정확한 부피의 용액은 **부피 플라스크**로 만들고, 정확한 부피를 잴 때는 **피펫이나 부피 플라스크**를 쓴다. 비커는 대략적인 부피를 잴 때 쓴다.", "용액 부피": "용액의 부피는 용질과 용매의 부피를 **단순히 더한 값과 다를 수 있다.** 용질이 녹으면서 입자들이 섞여 부피 변화가 생기기 때문이다. 그래서 몰농도는 **용액의 실제 부피**를 기준으로 한다.", "자동이온화": "물은 스스로 **아주 약간 이온화**하여 H⁺와 OH⁻를 생성한다(자동이온화). 이때 H⁺와 OH⁻는 **같은 수**로 생긴다.", "물의 이온곱": "물의 이온곱 상수 **Kw = [H⁺][OH⁻]**(두 이온 농도의 **곱**)이다. 25°C에서 Kw = 1.0 × 10⁻¹⁴이다.", "중성 농도": "25°C 중성(순수한 물)에서 **[H⁺] = [OH⁻] = 1.0 × 10⁻⁷ M**이다. 두 이온의 농도가 같고, 그 곱이 Kw = (10⁻⁷)² = 10⁻¹⁴이다.", "순수한 물": "순수한 물은 **[H⁺]와 [OH⁻]가 같아 중성**이다(25°C에서 pH = 7). 산성도 염기성도 아니다.", "Kw와 온도": "Kw는 **평형 상수이므로 온도가 변하면 값이 달라진다.** 25°C에서만 Kw = 10⁻¹⁴이고, 온도가 올라가면 자동이온화가 더 일어나 Kw가 커진다.", "pH 정의": "**pH = -log[H⁺]**(수소 이온 농도의 음의 로그)이다. [H⁺]가 **작을수록** pH가 커진다. 예: [H⁺] = 10⁻³ M이면 pH = 3.", "pOH 정의": "**pOH = -log[OH⁻]**(수산화 이온 농도의 음의 로그)이다. [OH⁻]가 **작을수록** pOH가 커진다. 예: [OH⁻] = 10⁻³ M이면 pOH = 3.", "pH+pOH": "25°C에서 **pH + pOH = 14**이다. 이는 Kw = 10⁻¹⁴에서 나온다. 따라서 pH를 알면 pOH = 14 - pH로 구할 수 있다.", "산성 판정": "25°C에서 **pH < 7이면 산성**이다. 산성 용액에서는 **[H⁺] > [OH⁻]**이며, pH가 작을수록 산성이 강하다.", "중성 판정": "25°C에서 **pH = 7이면 중성**이다. 중성 용액에서는 **[H⁺] = [OH⁻]**다. 순수한 물이 그 예다.", "염기성 판정": "25°C에서 **pH > 7이면 염기성**이다. 염기성 용액에서는 **[OH⁻] > [H⁺]**이며, pH가 클수록 염기성이 강하다.", "산성 이온 농도": "산성 용액에서는 **[H⁺] > [OH⁻]**다. 산이 녹으면 [H⁺]가 늘어 25°C에서 [H⁺] > 10⁻⁷ M이 된다.", "염기성 이온 농도": "염기성 용액에서는 **[OH⁻] > [H⁺]**다. 염기가 녹으면 [OH⁻]가 늘어 25°C에서 [OH⁻] > 10⁻⁷ M, [H⁺] < 10⁻⁷ M이 된다.", "pH-농도 관계": "pH와 [H⁺]는 **반대로** 변한다: **[H⁺]가 커지면 pH는 작아진다.** pH가 1만큼 작아지면 [H⁺]는 **10배 커지고**, pH가 1만큼 커지면 [H⁺]는 10배 작아진다.", "pH 비교": "pH가 1 차이 나면 [H⁺]는 **10배** 차이 난다(로그 척도). 예: pH 3인 용액은 pH 5인 용액보다 [H⁺]가 **100배**(pH 차이 2 = 10²) 크다.", "pH 계산": "[H⁺] = 1.0 × 10⁻ⁿ M이면 **pH = n**이다(pH = -log[H⁺]). 예: [H⁺] = 10⁻³ M → **pH = 3**, [H⁺] = 10⁻¹¹ M → **pH = 11**.", "pH-pOH 계산": "25°C에서 **pOH = 14 - pH**다(pH + pOH = 14, → CH1-319). 예: pH = 11 → pOH = **3**, pH = 5 → pOH = **9**.", "지시약": "대표 지시약의 변색: 리트머스(산성→붉음, 염기성→푸름), BTB(산성 노랑/중성 초록/염기성 파랑), **페놀프탈레인(염기성에서 붉음)**, 메틸오렌지(산성에서 붉음).", "산성 세기": "**pH가 작을수록(= [H⁺]가 클수록) 산성이 강하다.** 강한 산성일수록 pH가 0에 가깝다.", "염기성 세기": "**[OH⁻]가 클수록(= pH가 클수록) 염기성이 강하다.** 강한 염기성일수록 pH가 14에 가깝다.", "희석과 pH": "산성·염기성 용액을 물로 묽히면 **pH가 7(중성)에 가까워진다.** 산성은 pH가 커지고, 염기성은 pH가 작아진다(둘 다 중성 쪽으로).", "Kw 적용": "25°C에서 **[H⁺][OH⁻] = Kw = 10⁻¹⁴**로 일정하다. [H⁺]를 알면 [OH⁻] = Kw / [H⁺]로 구한다. 예: [H⁺] = 10⁻⁵ M → [OH⁻] = **10⁻⁹ M**.", "Kw 일정성": "**같은 온도라면 산성·중성·염기성 용액 모두 Kw 값이 같다.** Kw는 액성과 무관하게 온도에만 의존하므로, 25°C에서는 어떤 용액이든 [H⁺][OH⁻] = 10⁻¹⁴이다.", "산중염 판정": "25°C 기준: **pH < 7 → 산성, pH = 7 → 중성, pH > 7 → 염기성.** pH 7을 기준으로 작으면 산성, 크면 염기성이다.", "Kw": "25°C 순수한 물에서 **[H⁺] = [OH⁻] = 10⁻⁷ M**이고, 그 곱인 **Kw = [H⁺][OH⁻] = 10⁻¹⁴**이다.", "중화 정의": "중화 반응은 **산과 염기가 반응해 물과 염을 생성**하는 반응이다. 산의 H⁺와 염기의 OH⁻가 반응해 물(H₂O)이 생긴다.", "알짜 이온 반응식": "강산과 강염기의 중화 알짜 이온 반응식은 **H⁺ + OH⁻ → H₂O**다. 알짜 이온 반응식에는 **실제로 반응에 참여하는 이온만** 쓰고, 구경꾼 이온은 제외한다.", "구경꾼 이온": "구경꾼 이온은 **반응 전후 변하지 않고 그대로 남는 이온**이다. HCl과 NaOH의 중화에서 **Na⁺와 Cl⁻**가 구경꾼 이온이며, 알짜 이온 반응식에 나타나지 않는다.", "중화점 양적관계": "중화점(완전 중화)에서는 **산이 내놓은 H⁺의 몰수 = 염기가 내놓은 OH⁻의 몰수**다. 두 이온이 1:1로 모두 반응해 남는 H⁺나 OH⁻가 없다.", "양적관계 식": "1가 산과 1가 염기의 중화에서 **M₁V₁ = M₂V₂**가 성립한다. 농도(M) × 부피(V) = 그 용액 속 용질의 **몰수**이므로, 이 식은 H⁺ 몰수 = OH⁻ 몰수를 뜻한다.", "가수": "산의 **가수가 클수록 H⁺를 더 많이 내놓는다**. 예: 2가 산은 1몰당 H⁺를 **2몰** 내놓는다. 양적관계 계산에서 이 가수를 곱해야 한다.", "중화열": "중화 반응은 **열을 방출하는 발열 반응**이며, 이때 나는 열을 중화열이라 한다. 중화가 일어나면 용액의 온도가 올라간다.", "중화적정": "중화적정은 **농도를 아는 표준 용액**으로 농도를 모르는 산이나 염기의 농도를 알아내는 실험이다. 지시약의 색 변화로 중화점(종말점)을 확인하고, 양적관계로 미지 농도를 구한다.", "양적관계 계산": "1가 산·1가 염기는 **농도 × 부피(몰수)가 같을 때** 완전 중화된다. 예: 0.1 M HCl 100 mL(0.01몰)를 완전히 중화하려면 0.1 M NaOH **100 mL**(0.01몰)가 필요하다.", "중화점 pH": "강산과 강염기가 완전히 중화되면 중화점의 **pH는 7(중성)**이다. H⁺와 OH⁻가 모두 반응해 물이 되고, 생성된 염이 물에서 중성을 띠기 때문이다.", "염": "염은 **산의 음이온과 염기의 양이온**이 결합한 물질이다. 예: HCl + NaOH → NaCl + H₂O에서 염은 **NaCl**(Cl⁻ + Na⁺)이다.", "일상의 중화": "일상의 중화 예: **제산제로 위산(산성) 중화**, 벌 독(산성)에 **암모니아수(염기성)**, 산성화된 토양·호수에 **석회(염기성)**, 비린내(염기성)에 **레몬즙(산성)**.", "양적관계 기본": "중화에서 **H⁺와 OH⁻는 1:1 몰비**로 반응한다(H⁺ + OH⁻ → H₂O). 즉 H⁺ 1몰은 OH⁻ 1몰과, H⁺ 2몰은 OH⁻ 2몰과 반응한다.", "가수 양적관계": "2가 산은 1몰당 H⁺를 **2몰** 내놓으므로, **2가 산 0.1몰을 완전히 중화하려면 1가 염기 0.2몰**이 필요하다(H⁺ 0.2몰 = OH⁻ 0.2몰).", "중화점 전후": "- **중화점 전**: 산 또는 염기가 남아 있음(산에 염기를 넣는 중이면 산성).\n- **중화점**: 남는 산·염기 없음.\n- **중화점 후**: 더 넣은 쪽 성질을 띰(염기를 더 넣으면 염기성).", "중화 생성물": "산과 염기를 섞으면 **물과 염** 두 가지가 생성된다. 산의 H⁺와 염기의 OH⁻가 물을 만들고, 남은 이온들이 결합해 염을 만든다.", "물 생성": "중화 반응에서 물은 **H⁺ + OH⁻ → H₂O**로, 산의 H⁺와 염기의 OH⁻가 결합해 생긴다. 생기는 물의 몰수는 반응한 H⁺의 몰수와 같다.", "표준 용액": "표준 용액은 중화적정에서 **농도를 정확히 아는 용액**으로, 농도를 모르는 용액의 농도를 구하는 **기준**이 된다.", "완전 중화": "완전 중화는 **같은 몰수의 H⁺와 OH⁻가 모두 반응해 남는 것이 없는** 상태다. 완전 중화에 필요한 OH⁻의 몰수는 산의 H⁺ 몰수와 같다.", "화학식량": "화학식량은 화학식을 이루는 원소들의 **원자량을 모두 더한** 값이다. 단위가 없는 상대적인 값으로, 분자에 대한 화학식량을 분자량이라 한다.", "분자량": "분자량은 분자를 이루는 원자들의 **원자량을 모두 더한** 값이다(원자량 H=1, C=12, O=16). 예: H₂O = **18**, CO₂ = **44**, O₂ = **32**.", "질량비": "화합물의 성분 원소 질량비는 **(원자 수 × 원자량)의 비**로 구한다. 예: H₂O에서 수소:산소 = (2×1):(1×16) = 2:16 = **1:8**.", "질량 백분율": "성분 원소의 질량 백분율 = **(그 원소의 질량 / 화합물 전체 질량) × 100.** 예: H₂O에서 산소 = 16/18 × 100 ≈ **88.9%**, 수소 ≈ **11.1%**.", "실험식 정의": "실험식은 화합물을 이루는 원자의 **가장 간단한 정수비**를 나타낸 식이다. 화합물의 조성(원자 수 비)만 알려준다.", "분자식 정의": "분자식은 분자를 이루는 **실제 원자의 종류와 수**를 나타낸 식이다. 예: 포도당의 분자식은 C₆H₁₂O₆. 분자식은 실험식의 정수배다.", "실험식 구하기": "실험식은 분자식의 원자 수를 **최대공약수로 나눠** 구한다. 예: C₆H₁₂O₆ → **CH₂O**(6으로), H₂O₂ → **HO**(2로), C₆H₆ → **CH**(6으로).", "실험식·분자식 관계": "분자식은 **실험식의 정수배**다. 같은 실험식이라도 정수배가 다르면 분자식이 다를 수 있다. 분자식을 결정하려면 실험식과 **분자량**이 모두 필요하다.", "실험식→분자식": "**분자식 = 실험식 × (분자량 / 실험식량).** 분자량을 실험식량으로 **나눠** 배수를 구한다. 예: 실험식 CH₂O(실험식량 30), 분자량 180 → 180/30 = **6배** → C₆H₁₂O₆.", "조성 분석": "조성 분석: 각 원소의 **질량을 원자량으로 나눠 몰수**를 구하고, 몰수의 **가장 간단한 정수비**가 실험식의 원자 수 비다. 예: C 40%, H 6.7%, O 53.3% → 몰수비 1:2:1 → **CH₂O**.", "실험식 적용": "NaCl처럼 **분자가 없는 물질(이온 결합 물질)**은 분자식 대신 **실험식**으로 조성을 나타낸다. NaCl은 Na와 Cl의 1:1 비를 나타낸다.", "일정 성분비": "일정 성분비 법칙: 한 화합물의 **조성(성분 원소의 질량비)은 항상 일정**하다. 예: 물은 어디서 얻든 수소:산소 = 1:8이다.", "실험식량": "실험식량은 실험식을 이루는 **원자량의 합**이다. 예: CH = 12 + 1 = **13**, CH₂O = 12 + 2 + 16 = **30**. 분자량이 실험식량과 같으면 분자식 = 실험식이다.", "엔탈피 정의": "엔탈피(H)는 일정한 압력에서 **물질이 가지고 있는 고유한 에너지(열 함량)**다. 절댓값은 측정하기 어려워 보통 **변화량(ΔH)**을 다룬다.", "반응엔탈피 정의": "반응엔탈피 **ΔH = (생성물의 엔탈피 합) − (반응물의 엔탈피 합).** 일정한 압력에서 반응할 때 출입하는 열량과 같다.", "발열 ΔH 부호": "발열 반응에서는 **ΔH < 0**(음수)다. 에너지를 방출하므로 생성물의 엔탈피가 반응물보다 작다.", "흡열 ΔH 부호": "흡열 반응에서는 **ΔH > 0**(양수)다. 에너지를 흡수하므로 생성물의 엔탈피가 반응물보다 크다.", "발열 온도 변화": "발열 반응은 주위로 **열을 방출**하므로, 반응이 일어나면 **주위의 온도가 올라간다**(주위가 따뜻해짐). 연소, 중화, 손난로가 그 예다.", "흡열 온도 변화": "흡열 반응은 주위에서 **열을 흡수**하므로, 반응이 일어나면 **주위의 온도가 내려간다**(주위가 차가워짐). 냉각 팩이 그 예다.", "열화학 반응식": "열화학 반응식은 화학 반응식에 **반응엔탈피 ΔH를 함께** 나타낸 것이다(물질의 상태도 표시). ΔH 부호로 발열·흡열을 알 수 있고, **계수가 2배가 되면 ΔH도 2배**가 된다.", "열화학 반응식 상태": "열화학 반응식에서는 물질의 **상태(s, l, g, aq)를 반드시 표시**한다. 같은 물질이라도 상태에 따라 엔탈피가 달라 **ΔH 값이 달라지기** 때문이다.", "발열 반응 예": "대표 발열 반응: **연료의 연소(CH₄ 등), 산-염기 중화, 금속과 산의 반응.** 모두 열을 방출한다.", "흡열 반응 예": "대표 흡열 과정: **광합성(빛에너지 흡수), 물의 증발, 질산 암모늄의 용해.** 모두 열을 흡수해 주위가 차가워진다.", "발열과 엔탈피": "발열 반응에서는 **반응물의 엔탈피 총합 > 생성물의 엔탈피 총합.** 엔탈피가 높은 반응물이 낮은 생성물로 변하면서 줄어든 만큼 에너지를 방출한다.", "흡열과 엔탈피": "흡열 반응에서는 **생성물의 엔탈피 총합 > 반응물의 엔탈피 총합.** 엔탈피가 낮은 반응물이 높은 생성물로 변하면서 늘어난 만큼 에너지를 흡수한다.", "정·역반응": "정반응과 역반응은 **발열·흡열이 서로 반대**다. 정반응이 발열이면 역반응은 흡열, 정반응이 흡열이면 역반응은 발열이다.", "정·역반응 ΔH": "정반응과 역반응의 ΔH는 **크기는 같고 부호는 반대**다. 정반응의 ΔH가 -100 kJ이면 역반응의 ΔH는 +100 kJ이다.", "헤스 법칙": "헤스 법칙: 반응엔탈피는 **반응 경로와 관계없이 처음과 끝 상태로만 정해진다**(일정하다). 여러 단계를 거쳐도 전체 ΔH는 같다.", "헤스 법칙 적용": "전체 반응의 ΔH는 **단계별 반응 ΔH의 합**과 같다. 반응식을 조작하면 ΔH도 같이 조작한다: 더하기/빼기는 함께, **뒤집으면 부호 반대**, **상수를 곱하면 ΔH에도 곱한다**.", "결합 에너지": "- 결합을 **끊는 것**: 에너지가 **필요**(흡열).\n- 결합을 **만드는 것**: 에너지를 **방출**(발열).\n결합 에너지가 클수록 결합이 강하다.", "결합 에너지로 ΔH": "반응엔탈피 ΔH ≈ **(반응물의 결합 에너지 합) − (생성물의 결합 에너지 합).** 즉 반응물 결합을 끊는 데 든 에너지에서 생성물 결합 형성으로 방출된 에너지를 뺀 값이다.", "결합 에너지 적용": "**생성물의 결합이 반응물보다 강할수록(결합 에너지 합이 클수록) 발열 반응**이다. 생성물 결합 형성으로 방출된 에너지가 반응물 결합을 끊는 에너지보다 크면 발열이다.", "상태와 ΔH": "같은 물질이라도 **상태(액체/기체)에 따라 엔탈피가 달라** 반응엔탈피 ΔH도 달라진다. 예: H₂O(l)을 생성하는 반응과 H₂O(g)을 생성하는 반응은 ΔH가 다르다.", "흡열 과정 예": "흡열 과정(열 흡수): **물의 증발, 얼음이 녹는 것(융해), 물이 끓는 것.** 반대로 **수증기가 물로 응결하는 것은 발열**(열 방출)이다.", "발열 ΔH 표기": "발열 반응의 열화학 반응식에서 **ΔH는 음(-)의 값**으로 쓴다(ΔH = -○○ kJ). ΔH < 0이면 발열 반응이다.", "발열·흡열 판단": "- 반응 후 **주위 온도가 올라가면 발열** 반응(열 방출).\n- 반응 후 **주위 온도가 내려가면 흡열** 반응(열 흡수).", "상태 함수": "엔탈피는 **경로와 관계없이 처음과 나중 상태로만 결정되는 상태 함수**다. 그래서 어떤 경로를 거쳐도 반응엔탈피가 같고, 헤스 법칙(→ CH1-238)이 성립한다.", "흡열 ΔH 표기": "흡열 반응의 열화학 반응식에서 **ΔH는 양(+)의 값**으로 쓴다(ΔH = +○○ kJ). ΔH > 0이면 흡열 반응이다.", "아레니우스 정의": "아레니우스 정의: **산은 물에서 H⁺를 내놓는** 물질(HCl), **염기는 물에서 OH⁻를 내놓는** 물질(NaOH)이다.", "브뢴스테드 정의": "브뢴스테드-라우리 정의: **산은 양성자(H⁺)를 주는** 물질(주개), **염기는 양성자를 받는** 물질(받개)이다. 물뿐 아니라 다른 용매에서도 적용된다.", "짝산-짝염기": "**산이 H⁺를 잃으면 그 짝염기**가 되고, **염기가 H⁺를 얻으면 그 짝산**이 된다. 짝산과 짝염기는 **H⁺ 한 개**만큼 차이가 난다.", "양쪽성": "물은 **산으로도 염기로도 작용하는 양쪽성 물질**이다. 상대에 따라, 산을 만나면 염기로(H⁺를 받음), 염기를 만나면 산으로(H⁺를 줌) 작용한다.", "산 세기": "산의 세기는 물에서 **이온화가 잘 될수록 강하다.** 산의 세기는 **농도가 아니라 이온화 정도**로 결정된다. 같은 농도라도 강산이 약산보다 H⁺를 많이 내놓는다.", "강산": "강산은 물에서 **거의 완전히 이온화**한다. 대부분 H⁺로 이온화하므로, 강산 수용액에는 분자 상태로 남은 산이 거의 없다.", "강산 예": "대표적인 강산은 **염산(HCl), 질산(HNO₃), 황산(H₂SO₄)**이다. 모두 물에서 거의 완전히 이온화한다.", "약산 예": "대표적인 약산은 **플루오린화 수소산(HF), 아세트산(CH₃COOH), 탄산(H₂CO₃)**이다. 모두 물에서 일부만 이온화한다.", "약산": "약산은 물에서 **일부만 이온화**한다. 이온화 평형을 이루어 일부만 H⁺로 존재하고, 수용액에는 이온화하지 않은 분자가 많이 남아 있다.", "강염기 예": "대표적인 강염기는 **수산화나트륨(NaOH), 수산화칼륨(KOH)**이다. 물에서 거의 완전히 이온화한다.", "약염기 예": "**암모니아(NH₃)는 약염기**다. 물에서 H⁺를 받아 **일부만** 이온화해 OH⁻를 내놓는다. 약염기 수용액에는 이온화하지 않은 분자가 많다.", "이온화 상수": "산의 이온화 상수는 **Ka**, 염기의 이온화 상수는 **Kb**로 나타낸다. Ka는 산, Kb는 염기의 이온화 정도를 나타내는 평형 상수다. 이온화 상수가 클수록 이온화가 잘 된다.", "Ka와 세기": "**Ka가 클수록 강한 산**이다. Ka가 큰 산일수록 이온화가 잘 되어 H⁺를 많이 내놓고, 이온화 평형이 생성물(이온) 쪽으로 치우친다. 두 산의 세기는 Ka를 비교해 알 수 있다.", "Ka 해석": "**Ka가 클수록 산이 더 잘 이온화**한다. Ka가 크면 이온화 평형이 이온 쪽으로 많이 진행되어 수용액의 H⁺ 농도가 높다.", "Ka·Kb 관계": "짝산-짝염기 관계에서 **Ka·Kb = Kw**다(25°C에서 1×10⁻¹⁴). 짝산의 Ka와 짝염기의 Kb를 곱하면 물의 이온곱 Kw가 된다. 한쪽이 크면 다른 쪽은 작다.", "짝염기 세기": "**산이 강할수록 그 짝염기는 약하다.** 강산의 짝염기는 매우 약한 염기이고, 약산의 짝염기는 상대적으로 강한 염기다.", "강산 vs 약산": "같은 농도라면 **강산이 약산보다 H⁺ 농도가 크다.** 강산은 이온화가 잘 되어 H⁺를 많이 내놓으므로, 같은 농도에서 pH가 더 낮고 산성이 더 강하다.", "pKa": "**pKa가 작을수록 강한 산**이다. pKa는 Ka에 음의 로그를 취한 값이라, Ka가 클수록(강산) pKa는 작아진다.", "물 이온곱": "물의 자동 이온화 상수 **Kw = [H⁺][OH⁻]**이며, 25°C에서 **1×10⁻¹⁴**이다. 25°C 중성 용액에서 [H⁺] = [OH⁻] = 1×10⁻⁷이다. Kw는 온도에 따라 달라진다.", "이온화도": "이온화도는 전체 중 이온화한 비율이다. **강산은 이온화도가 1에 가깝고**(거의 완전히 이온화), **약산은 이온화도가 작다**(일부만 이온화). 이온화도가 클수록 강한 산이다.", "전기 전도성": "같은 농도라면 **강산 용액이 약산 용액보다 전기 전도성이 크다.** 강산은 이온화가 잘 되어 용액 속 이온이 많아 전류가 잘 흐르기 때문이다.", "중성 pH": "**25°C에서 중성 용액의 pH는 7**이다. 중성에서는 [H⁺] = [OH⁻]이고, pH와 pOH가 모두 7이다. 순수한 물이 대표적인 중성 용액이다.", "산성 pH": "**산성 용액은 pH가 7보다 작다.** 산성에서는 [H⁺]가 [OH⁻]보다 크고, pH가 7보다 작을수록 산성이 강하다(레몬즙 등).", "염기성 pH": "**염기성 용액은 pH가 7보다 크다.** 염기성에서는 [OH⁻]가 [H⁺]보다 크고, pH가 7보다 클수록 염기성이 강하다.", "pH와 농도": "**pH와 [H⁺]는 반대로 움직인다.** pH가 작을수록 [H⁺]가 크고, pH가 클수록 [H⁺]가 작다. pH = -log[H⁺]이기 때문이다.", "pH 척도": "pH는 **로그 척도**라 **pH가 1 작아지면 [H⁺]는 10배** 커진다(2 작아지면 100배). pH가 1 커지면 [H⁺]는 10배 작아진다.", "강산 pH": "강산은 **거의 완전히 이온화**해 **[H⁺]가 산 농도와 거의 같다.** 그래서 0.1 M 강산(1가 산)의 [H⁺]는 약 0.1 M이고, pH를 산 농도로 직접 계산할 수 있다.", "강염기 pOH": "강염기는 **거의 완전히 이온화**해 **[OH⁻]가 염기 농도와 거의 같다.** 0.1 M 강염기(1가)의 [OH⁻]는 약 0.1 M이고, pOH를 염기 농도로 직접 구할 수 있다(pH = 14 - pOH).", "약산 근사": "약산은 일부만 이온화하므로 [H⁺]가 산 농도보다 작다. 약산의 [H⁺]는 대략 **√(Ka·C)**(Ka와 농도 C의 곱의 제곱근)로 어림할 수 있다.", "약산 vs 강산 pH": "**같은 농도라면 약산이 강산보다 pH가 높다.** 약산은 일부만 이온화해 [H⁺]가 작으므로, 같은 농도에서 강산보다 산성이 약하고 pH가 더 크다.", "약산 이온화": "약산은 **이온화도가 작아 같은 농도 강산보다 H⁺를 적게 내놓는다.** 일부만 이온화해 분자가 많이 남는다.", "완충 용액 구성": "완충 용액은 **약산과 그 짝염기**(또는 약염기와 그 짝산)로 이루어진다. 짝산-짝염기 쌍이 함께 있어 가해진 산과 염기를 **모두** 중화할 수 있다. 아세트산+아세트산 나트륨, 암모니아+염화 암모늄이 대표 예다.", "완충 작용": "완충 용액은 **소량의 산이나 염기를 가해도 pH가 거의 변하지 않는다.** 소량의 산을 넣으면 짝염기가, 소량의 염기를 넣으면 약산이 중화하기 때문이다.", "헨더슨-하셀바흐": "헨더슨-하셀바흐 식: **pH = pKa + log([짝염기]/[산])**. 완충 용액에서 **[짝염기] = [산]이면 log 1 = 0이라 pH = pKa**가 된다. [짝염기]/[산] 비가 클수록 pH가 높다.", "공통 이온 효과": "**공통 이온 효과**: 약산에 그 짝염기(같은 음이온)를 넣으면 약산의 **이온화가 억제**된다. 르샤틀리에 원리에 따라 이온화 평형이 **분자 쪽**으로 이동해 이온화도가 낮아진다.", "염 가수분해": "염의 액성은 어느 쪽 이온이 가수분해하는지로 정해진다:\n\n| 염 | 예 | 액성 |\n|---|---|---|\n| 강산 + 강염기 | NaCl | 중성 |\n| 약산 + 강염기 | CH₃COONa | 염기성 |\n| 강산 + 약염기 | NH₄Cl | 산성 |", "가수분해 정의": "염의 가수분해는 **염의 이온이 물과 반응해 pH가 변하는 현상**이다. 약한 짝에서 온 이온이 물과 반응해 H⁺나 OH⁻를 만들어 수용액이 산성이나 염기성을 띤다.", "완충 응용": "완충 용액은 **pH를 일정하게 유지**해야 하는 생체나 실험에서 이용된다. 혈액은 pH를 일정하게 유지하는 완충 작용을 하고, 효소 반응처럼 pH에 민감한 과정에 완충 용액이 쓰인다.", "pH 측정": "**pH 미터, 지시약, 리트머스 종이**로 용액의 산성·염기성을 알 수 있다. pH 미터는 pH를 수치로 측정하고, 지시약과 리트머스 종이는 pH에 따라 색이 변한다.", "강염기 vs 약염기": "같은 부피·농도라면 **강염기가 약염기보다 pH가 높다.** 강염기는 거의 완전히 이온화해 [OH⁻]가 크므로 pH가 더 높다.", "물의 pH": "순수한 물은 **25°C에서 pH가 7로 중성**이다. 물은 자동 이온화로 적은 양의 H⁺와 OH⁻를 만들고, [H⁺] = [OH⁻] = 1×10⁻⁷이다.", "탄소화합물 정의": "탄소화합물은 **탄소를 중심으로(탄소 원자가 골격을 이루어) 만들어진 화합물**이다. 탄소와 수소를 기본으로 다양한 원소가 결합한다(메테인, 에탄올 등).", "탄소의 결합": "탄소 원자는 **원자가가 4**라서 **단일, 이중, 삼중 결합**을 모두 만들 수 있다. 탄소끼리 결합해 긴 사슬이나 고리를 이룰 수도 있다.", "탄소 골격": "탄소는 **사슬 모양과 고리 모양 화합물을 모두** 만들 수 있다. 탄소 골격은 직선형, 가지형, 고리형으로 다양해 화합물 종류가 매우 많다(벤젠은 고리 모양).", "작용기 정의": "작용기는 **화합물의 화학적 성질을 결정하는 원자단**이다. 같은 작용기를 가진 화합물은 비슷한 성질을 보이고, 작용기에 따라 화합물의 종류가 구분된다(하이드록시기, 카복실기 등).", "알코올": "**하이드록시기(-OH)를 가진 탄소화합물이 알코올**이다. 메탄올, 에탄올이 대표적이며, 하이드록시기 덕분에 물에 잘 녹는 경향이 있다.", "알코올 예": "**에탄올(C₂H₅OH)과 메탄올(CH₃OH)은 알코올**이다. 둘 다 하이드록시기(-OH)를 가져 알코올로 분류된다(에탄올은 술의 주성분).", "카복실산": "**카복실기(-COOH)를 가진 탄소화합물이 카복실산**이다. 아세트산이 대표적이며, 카복실기가 H⁺를 내놓아 **산성**을 띤다.", "카복실산 예": "**아세트산(CH₃COOH)과 폼산(HCOOH)은 카복실산**이다. 둘 다 카복실기(-COOH)를 가져 카복실산으로 분류된다(아세트산은 식초의 성분).", "카복실산 성질": "카복실산은 **물에 녹아 산성**을 나타낸다. 카복실기에서 H⁺를 내놓기 때문이다. 또 카복실산은 물에 잘 녹는 편이다(아세트산 수용액은 산성).", "아민": "**아미노기(-NH₂)를 가진 아민은 염기성**을 나타낸다. 아미노기는 질소 원자를 포함한 작용기로, 물에서 H⁺를 받아 염기성을 띤다.", "알데하이드": "알데하이드는 **폼일기(-CHO)**를 가진다(사슬 끝에 있는 카보닐기). 포름알데하이드가 대표적이며, 알데하이드는 산화되면 카복실산이 된다.", "케톤": "케톤은 **카보닐기(C=O)를 분자 안쪽(사슬 가운데)**에 가진다. 카보닐기가 탄소 사이에 끼어 있으며, 아세톤이 대표적인 케톤이다.", "에스터": "에스터는 **카복실산과 알코올의 반응으로 생긴다.** 작용기는 에스터 결합(-COO⁻)이며, 과일 향 같은 향기를 내는 경우가 많다.", "에스터화": "에스터화 반응에서는 **카복실산과 알코올이 반응해 에스터와 물이 생긴다.** 카복실산의 -COOH와 알코올의 -OH가 결합하며 물이 빠져나온다.", "에스터 성질": "에스터는 대체로 **향기로운 냄새**가 난다(과일 향, 꽃향기). 액성은 **중성**이며, 향료에 흔히 쓰인다.", "알코올 산화": "**1차 알코올을 산화시키면 알데하이드를 거쳐 카복실산**이 된다. 먼저 알데하이드가 되고, 더 산화시키면 카복실산이 된다(-OH가 점점 산화).", "산화 방향": "산화는 **알코올 → 알데하이드 → 카복실산** 방향으로 진행된다. 카복실산은 산화의 **마지막 단계** 산물이다. 반대 방향(환원)은 카복실산 → 알데하이드 → 알코올이다.", "작용기와 성질": "**작용기가 다르면 화학적 성질이 다르고, 같은 작용기를 가지면 성질이 비슷하다.** 화학적 성질은 작용기가 결정한다(알코올과 카복실산은 작용기가 달라 성질이 다름).", "이성질체": "이성질체는 **분자식이 같지만 구조(원자 배열)가 다른 화합물**이다. 같은 분자식이라도 원자 배열이 다르면 이성질체이며, 성질이 서로 다를 수 있다.", "같은 작용기": "메탄올과 에탄올은 **둘 다 하이드록시기(-OH)**를 가진다. 같은 작용기(알코올)를 가져 화학적 성질이 비슷하다.", "카복실산 반응": "카복실산은 산이므로 **금속과 반응해 수소 기체**를 내고, **염기와 중화 반응**을 한다. 탄산수소 나트륨과 반응하면 이산화 탄소를 낸다.", "에터": "에터는 **산소 원자가 두 탄소 사이에 결합한(-O-)** 구조다. 작용기는 에터 결합(-O-)이며, 같은 분자식의 알코올과 이성질체 관계일 수 있다.", "알코올 수소 결합": "알코올의 **하이드록시기(-OH)는 수소 결합**을 한다. 그래서 알코올은 비슷한 분자량의 탄화수소보다 **끓는점이 높고**, 물에 잘 녹는다.", "끓는점 경향": "**탄소 수가 많아질수록 사슬형 탄화수소의 끓는점은 대체로 높아진다.** 분자가 클수록 분산력(분자 사이 인력)이 커지기 때문이다.", "케톤 예": "**아세톤은 케톤**의 한 예다. 카보닐기(C=O)가 사슬 가운데 있으며, 대표적인 케톤으로 용매로 쓰인다.", "산성 비교": "**카복실산은 같은 탄소 수의 알코올보다 산성이 강하다.** 산성의 세기는 **카복실산 > 물 > 알코올** 순이다. 카복실기가 하이드록시기보다 H⁺를 잘 내놓기 때문이다.", "총괄성 정의": "총괄성은 **용질 입자의 수에만 의존하고 용질의 종류와는 무관**한 성질이다. 증기압 내림, 끓는점 오름, 어는점 내림, 삼투압이 모두 총괄성이며, 녹아 있는 입자 수가 많을수록 크다.", "증기압 내림": "비휘발성 용질을 녹이면 용매의 **증기 압력이 내려간다.** 같은 온도에서 용액의 증기압은 순용매보다 낮으며, 증기압 내림의 크기는 **용질의 몰분율에 비례**한다.", "라울 법칙": "라울 법칙: **용액의 증기압 = 용매의 몰분율 × 순용매의 증기압**이다. 용질을 많이 녹여 용매의 몰분율이 작아지면 용액의 증기압도 작아진다.", "끓는점 오름": "비휘발성 용질을 녹이면 용액의 **끓는점이 순용매보다 높아진다.** 끓는점 오름은 **ΔTb = Kb·m**(몰랄 농도)로 나타내며, 몰랄 농도에 비례한다.", "어는점 내림": "용질을 녹이면 용액의 **어는점이 순용매보다 낮아진다.** 어는점 내림은 **ΔTf = Kf·m**(몰랄 농도)로 나타내며, 몰랄 농도(입자 수)에 비례한다. 제설용 소금, 자동차 부동액이 이를 이용한다.", "몰랄 오름 상수": "몰랄 오름 상수(Kb)와 몰랄 내림 상수(Kf)는 **용매의 종류에 따라 정해지는 값**이다. 같은 용매라면 용질이 달라도 Kb, Kf는 같다.", "전해질": "전해질은 물에서 **이온화하여 입자 수가 늘어난다**(NaCl → Na⁺ + Cl⁻). 그래서 전해질 용액은 같은 몰랄 농도의 비전해질보다 총괄성이 크다. 포도당은 이온화하지 않는 **비전해질**이다.", "반트호프 인자": "반트호프 인자(i)는 **용질 1개가 물에서 내놓는 입자 수**를 반영한다. NaCl은 i≈2(Na⁺ + Cl⁻), CaCl₂는 i≈3(Ca²⁺ + 2Cl⁻), 비전해질 포도당은 i≈1이다. 총괄성 계산에서 전해질은 i를 곱한다.", "전해질 총괄성": "같은 몰랄 농도라면 **전해질 용액이 비전해질 용액보다 총괄성이 크다.** 전해질은 이온화로 입자 수가 늘어나기 때문이다. i가 클수록 총괄성이 크다.", "전해질 계산": "전해질 용액의 총괄성은 **반트호프 인자 i를 곱해** 계산한다: 끓는점 오름 ΔTb = i·Kb·m, 어는점 내림 ΔTf = i·Kf·m. 0.1 m NaCl(i≈2)의 어는점 내림은 0.1 m 포도당의 약 2배다.", "전해질 비교": "같은 몰랄 농도면 **NaCl 용액이 포도당 용액보다 어는점이 더 많이 내려가고 끓는점이 더 많이 오른다.** NaCl은 이온화로 입자 수가 약 2배라 총괄성이 더 크기 때문이다.", "응용": "겨울철 도로의 **소금(제설제)**과 **자동차 부동액**은 **어는점 내림**을 이용한 것이다. 바닷물이 민물보다 늦게 어는 것도 녹은 소금에 의한 어는점 내림 때문이다.", "총괄성 관계": "끓는점 오름과 어는점 내림은 모두 **몰랄 농도에 비례**한다. 증기압 내림이 클수록 끓는점 오름도 크다(함께 커지거나 작아짐). 모든 총괄성은 용질 입자 수가 많을수록 크다.", "총괄성 크기": "총괄성은 녹아 있는 **용질 입자 수가 많을수록 커진다.** 몰랄 농도가 클수록(진한 용액일수록) 끓는점 오름과 어는점 내림이 크다.", "비전해질 비교": "같은 몰랄 농도의 비전해질 용액은 **종류가 달라도 총괄성이 같다.** 0.1 m 포도당 용액과 0.1 m 설탕 용액의 어는점 내림(끓는점 오름)은 **같다**. 비전해질은 모두 i≈1이기 때문이다.", "몰랄 상수": "어는점 내림 상수 Kf와 끓는점 오름 상수 Kb는 **용매마다 다른 값**을 가진다. 어떤 용매는 물보다 Kf가 더 클 수도 있다.", "몰랄 농도 정의": "몰랄 농도(m)는 **용매 1 kg에 녹아 있는 용질의 몰수**다. 단위는 mol/kg이며, 분모가 **용액이 아니라 용매의 질량**이다.", "몰분율 정의": "몰분율은 **그 성분의 몰수를 전체 몰수로 나눈 값**이다. 단위가 없으며, 용질의 몰분율 = 용질 몰수 / (용질 + 용매 몰수)다.", "퍼센트 농도 정의": "퍼센트 농도(질량 퍼센트)는 **(용질의 질량 / 용액의 질량) × 100**이다. 용액 100 g 중 용질의 질량(g)을 나타낸다.", "몰랄 농도 온도": "몰랄 농도는 **온도가 변해도 일정**하다. 분모인 **용매의 질량**이 온도에 무관하기 때문이다.", "몰농도 온도": "몰농도는 **온도에 의존**한다. 분모인 **용액의 부피**가 온도에 따라 변하기 때문이다. 온도가 올라가면 용액이 팽창해 부피가 늘어나므로 몰농도가 **작아진다**.", "농도 근사": "**묽은 수용액에서는 몰농도와 몰랄 농도가 거의 비슷하다.** 물의 밀도가 약 1 g/mL라 용액의 부피(L)와 용매의 질량(kg)이 거의 같기 때문이다. 단, 진한 용액에서는 차이가 커진다.", "몰분율 합": "용액에서 **모든 성분의 몰분율의 합은 1**이다. 용질과 용매의 몰분율을 더하면 1이므로, 한 성분의 몰분율을 알면 다른 성분의 몰분율을 알 수 있다.", "몰분율 단위": "몰분율은 **단위가 없는(무차원) 양**이다. 몰수를 전체 몰수로 나누어 같은 단위(mol)끼리 상쇄되기 때문에 단위가 붙지 않는다.", "퍼센트 농도 온도": "퍼센트 농도는 **온도가 변해도 일정**하다. 분모와 분자가 모두 **질량**이라, 온도에 무관하기 때문이다.", "용질·용매": "**용질은 녹는 물질, 용매는 녹이는 물질**이다. 소금물에서 소금이 용질, 물이 용매다. 보통 양이 많은 쪽을 용매로 본다.", "몰랄 농도 의미": "1 m(몰랄) 용액은 **용매 1 kg에 용질 1몰을 녹인** 것이다. 분모가 용액이 아니라 **용매의 질량**이다. (용매 2 kg에 용질 2몰을 녹이면 1 m)", "몰랄 농도 계산": "같은 용질에서 **용매 질량이 클수록 몰랄 농도가 작다.** 용매를 더 넣으면 분모(용매 kg)가 커지므로 몰랄 농도가 **작아진다**.", "ppm": "ppm(parts per million)은 **100만분율**로, 매우 묽은(미량) 농도를 나타낼 때 쓴다. 1 ppm은 전체 100만 중 1이다.", "온도 무관 농도": "**몰랄 농도, 몰분율, 퍼센트 농도는 온도에 무관**하다. 질량이나 몰수를 기준으로 하기 때문이다. **온도에 의존하는 것은 부피 기준인 몰농도뿐**이다.", "농도 의미": "**진한 용액일수록 단위 부피당 녹아 있는 용질 입자가 많다.** 농도가 클수록 같은 부피에 용질이 더 많이 녹아 있다.", "농도 세기 성질": "농도는 **세기 성질**이라 용액의 양과 무관하다. 같은 농도의 용액은 100 mL든 1 L든 농도가 같고, 나눠 담아도 각 부분의 농도가 같다.", "몰농도 의미": "1 M 용액은 **용액의 부피가 1 L가 되도록** 만든 것이다. 즉 물에 용질을 녹인 뒤 **전체 용액 부피를 1 L로 맞춰야** 1 M이다. 몰농도가 클수록 같은 부피에 용질 몰수가 많다.", "묽힘": "용액을 **묽혀도 녹아 있는 용질의 몰수는 변하지 않는다.** 묽힘은 **용매만** 더하는 것이라 용질의 양은 그대로다. 그래서 묽힘 전후 **MV = M'V'**가 성립한다.", "몰분율 해석": "어떤 성분의 **몰분율이 클수록 그 성분의 비율이 크다.** 몰분율이 0.8인 성분은 전체의 80%를 차지한다.", "농도와 총괄성": "끓는점 오름·어는점 내림 같은 **총괄성은 용질 입자의 수(몰랄 농도)에 비례**한다. 그래서 총괄성 계산에는 온도에 무관한 **몰랄 농도**를 주로 쓴다.", "용해 정의": "용해는 **용질이 용매에 고르게 섞여 균일한 용액을 만드는 과정**이다. 용질 입자가 용매 속으로 흩어져 퍼진다(소금이 물에 녹아 소금물이 됨).", "용해 단계": "용해는 세 단계로 나뉜다: **용질 입자 떼어내기(흡열), 용매 입자 떼어내기(흡열), 용질-용매가 섞이며 끌어당기기(발열).** 이 흡수와 방출의 합으로 전체 용해 엔탈피가 정해진다.", "용해 엔탈피": "용해 엔탈피는 각 단계 에너지 변화의 합이라 **흡열일 수도 발열일 수도 있다.** 질산암모늄은 흡열(용액이 차가워짐), 수산화나트륨은 발열(용액이 뜨거워짐)이다.", "용해 자발성": "용해가 **흡열인데도 일어나는 것은 엔트로피 증가** 때문이다. 용질이 용매 속으로 흩어지면 무질서도가 커져, 엔트로피 증가가 자발성의 주된 원동력이 된다.", "용해성 규칙": "**'같은 것끼리 잘 녹는다'**: 극성 물질은 극성 용매에, 무극성 물질은 무극성 용매에 잘 녹는다. 성질이 비슷한 용질과 용매가 잘 섞인다.", "용해성": "**기름(무극성)은 물에 잘 녹지 않고**, **이온 결정과 설탕(극성)은 극성 용매인 물에 잘 녹는다.** '같은 것끼리 잘 녹는다'의 구체적 예다.", "용해도 정의": "용해도는 **일정 온도에서 용매에 최대로 녹을 수 있는 용질의 양**이다. 보통 용매 100 g에 녹는 용질의 g 수로 나타내며, **온도에 따라 달라진다**.", "헨리 법칙": "헨리 법칙: **일정 온도에서 기체의 용해도는 그 기체의 부분 압력에 비례**한다. 부분 압력이 클수록 그 기체가 더 많이 녹는다(2배 → 2배). 물에 잘 녹지 않는 기체에 잘 맞는다.", "헨리 응용": "**탄산음료 뚜껑을 열면 압력이 낮아져 CO₂ 용해도가 줄어** 기포가 생긴다. **잠수병**도 헨리 법칙과 관련 있다: 깊은 물속(고압)에서 혈액에 많이 녹은 기체가, 빠르게 올라오면(압력 급감) 거품이 되어 생긴다.", "헨리 법칙 계산": "헨리 법칙에서 기체 용해도는 부분 압력에 **정비례**한다. 부분 압력이 **2배가 되면 기체 용해도도 2배**, 절반이 되면 용해도도 절반이 된다.", "압력과 고체 용해도": "고체의 용해도는 **압력의 영향을 거의 받지 않는다.** 고체 용질의 용해도는 주로 **온도**에 의해 달라진다. 압력은 기체 용해도에만 큰 영향을 준다.", "압력과 기체 용해도": "기체의 용해도는 **부분 압력이 높을수록 커진다**(헨리 법칙). 압력을 높이면 더 많이 녹고, 낮추면 기체가 빠져나와 용해도가 작아진다.", "헨리 법칙 한계": "헨리 법칙은 **물에 잘 녹지 않는 기체에 잘 맞고**, 물과 반응하거나 매우 잘 녹는 기체(암모니아 등)에는 잘 맞지 않는다. 압력이 너무 높지 않을 때 잘 맞는다.", "온도와 기체 용해도": "같은 압력이라도 **온도가 높으면 기체의 용해도가 작다.** 기체 용해도는 온도와 압력 모두에 영향을 받으므로, 용해도를 높이려면 **압력을 높이고 온도를 낮춘다**.", "화학 전지": "화학 전지는 **자발적 산화환원 반응의 화학 에너지를 전기 에너지로** 바꾼다. 자발적인 반응이 일어나며 전류를 만든다.", "전극 반응": "화학 전지의 **산화전극에서는 산화 반응**, **환원전극에서는 환원 반응**이 일어난다. 산화전극에서 전자가 나오고 환원전극에서 전자가 소모된다(전극 이름 그대로).", "전극 극성": "화학 전지에서 **산화전극은 (-)극, 환원전극은 (+)극**이다. (-)극(산화전극)에서 전자가 나온다.", "전자 이동": "전자는 외부 도선을 따라 **산화전극((-)극)에서 환원전극((+)극)으로** 이동한다. 전류의 방향은 전자의 이동 방향과 **반대**다.", "다니엘 전지": "다니엘 전지에서 **아연(Zn)이 산화전극**, **구리(Cu)가 환원전극**이다. 아연이 산화되어 아연 이온이 되고, 구리 이온이 환원되어 구리가 된다. 아연이 구리보다 반응성이 커서 산화전극이 된다.", "염다리": "염다리는 **이온의 이동으로 양쪽 용액의 전하 균형을 유지**한다. 두 반쪽 전지를 연결해 전기적 중성을 지키며, 염다리가 없으면 전하가 한쪽에 쌓여 전류가 곧 멈춘다.", "표준 수소 전극": "표준 수소 전극의 표준 환원 전위는 **0 V로 정한다.** 이 전극을 기준으로 다른 전극의 표준 환원 전위를 **상대적으로** 정한다.", "전지 전위": "표준 전지 전위는 **E°cell = E°(환원전극) - E°(산화전극)**이다(두 전극의 표준 환원 전위 차). E°cell이 클수록 전지가 만드는 전압이 크다.", "자발성": "**E°cell이 양수이면 그 전지 반응은 자발적**이다(ΔG < 0). 화학 전지는 E°cell이 양수인 자발적 반응으로 작동한다. E°cell이 음수이면 비자발적이다.", "표준 환원 전위": "**표준 환원 전위가 클수록 환원이 잘 일어난다**(좋은 산화제). 반대로 표준 환원 전위가 작을수록 산화가 잘 된다(좋은 환원제). 두 값을 비교해 어느 쪽이 환원되는지 알 수 있다.", "전기분해": "전기분해는 **전기 에너지로 비자발적 산화환원 반응을 일으키는 것**이다. 외부 전원으로 반응을 강제하며, 전기 에너지가 화학 에너지로 전환된다(화학 전지와 반대).", "전기분해 전극": "전기분해에서 외부 전원의 **(-)극과 연결된 전극에서 환원**, **(+)극과 연결된 전극에서 산화**가 일어난다. (-)극 쪽 전극은 전자를 받아 환원, (+)극 쪽은 전자를 잃어 산화한다.", "패러데이 법칙": "패러데이 법칙에 따르면 **전극에서 석출되는 물질의 양은 흘려준 전하량에 비례**한다. 전하량이 두 배이면 석출량도 두 배다. 같은 전하량이라도 물질의 가수에 따라 석출량이 달라진다.", "전하량": "전하량은 **전류와 시간의 곱(Q = It)**이다. 전류가 셀수록, 시간이 길수록 전하량이 크다. 단위는 쿨롬(C)이다.", "패러데이 상수": "전자 1몰의 전하량은 **약 96500 C**이며, 이를 패러데이 상수라 한다(약 96500 C/mol). 패러데이 상수로 전하량과 전자 몰수를 변환한다.", "전기분해 응용": "**전기 도금, 금속 정련(전기 정련), 알루미늄 제련**은 모두 전기분해를 응용한 것이다. 전기분해는 금속을 얻거나 도금하는 데 널리 쓰인다.", "물 전기분해": "물을 전기분해하면 **수소와 산소**가 생긴다. (-)극에서 수소, (+)극에서 산소가 발생하고, **수소와 산소의 부피비는 2:1**이다.", "전지 vs 전기분해": "**화학 전지는 자발적 반응으로 전기를 만들고**(화학 → 전기), **전기분해는 비자발적 반응을 전기로 일으킨다**(전기 → 화학). 둘은 에너지 전환 방향이 정반대다.", "패러데이 계산": "같은 전하량을 흘리면 **+1가 이온이 +2가 이온보다 두 배의 몰수가 석출**된다. 가수가 클수록 같은 전하량으로 석출되는 몰수가 적다(석출 몰수 = 전하량 ÷ (가수 × 패러데이 상수)).", "전극 질량": "전지에서 금속이 녹는 **산화전극의 질량은 점점 줄어들고**, 금속이 석출되는 **환원전극의 질량은 늘어난다.** 산화전극은 가벼워지고 환원전극은 무거워진다.", "산화제 세기": "**표준 환원 전위가 큰 물질은 산화제로서 강하다**(전자를 잘 받아 환원되기 쉬움). 반대로 표준 환원 전위가 작은 물질은 강한 환원제다. 산화제의 세기는 표준 환원 전위로 비교한다.", "계와 주위": "**계는 관찰의 대상**(반응 물질), **주위는 계를 제외한 나머지** 부분이다. 발열 반응에서는 계에서 주위로 열이 나가고, 흡열 반응에서는 주위에서 계로 열이 들어온다.", "반응엔탈피": "반응엔탈피 ΔH = **(생성물의 엔탈피 합) − (반응물의 엔탈피 합)**이다. 생성물의 엔탈피가 반응물보다 낮으면 ΔH < 0(발열), 높으면 ΔH > 0(흡열)이다.", "ΔH 부호": "**발열 반응은 ΔH < 0**(열 방출, 주위 온도 ↑), **흡열 반응은 ΔH > 0**(열 흡수, 주위 온도 ↓)이다. 발열에서는 생성물의 엔탈피가 반응물보다 낮다.", "표준 상태": "표준 상태는 보통 **25°C(298 K), 1기압**을 기준으로 한다. 표준 엔탈피는 이 표준 상태에서의 엔탈피 변화이며, 물질은 가장 안정한 형태로 존재한다.", "표준 생성 엔탈피": "표준 생성 엔탈피는 **화합물 1몰을 가장 안정한 홑원소 물질로부터 만들 때의 엔탈피 변화**다. **가장 안정한 홑원소 물질**(O₂, N₂, H₂, 흑연)의 표준 생성 엔탈피는 **0**이다.", "반응엔탈피 계산": "표준 반응엔탈피 = **(생성물 ΔHf° 합) − (반응물 ΔHf° 합)**이다. 각 물질의 표준 생성 엔탈피에 **계수를 곱해** 합을 구한다.", "열량계": "열량계는 반응에서 출입한 열을 측정하는 장치다. **q = mcΔT**로 열량을 구하며, 여기서 **m은 질량, c는 비열, ΔT는 온도 변화**다. 이상적인 열량계는 외부와 열을 주고받지 않는다고 본다.", "비열": "비열은 **물질 1 g의 온도를 1°C 올리는 데 필요한 열량**이다. 비열이 클수록 같은 열을 받아도 온도가 **적게** 오른다(물은 비열이 커서 온도가 잘 변하지 않음).", "엔탈피와 열": "**일정 압력**에서 출입한 열 q는 엔탈피 변화 ΔH와 **같다**(q = ΔH). 그래서 엔탈피 변화는 일정 압력에서 측정한 반응열과 같다.", "생성 엔탈피 해석": "표준 생성 엔탈피가 **음수**이면 그 화합물이 원소보다 **안정**하고(만들어질 때 에너지 방출), **양수**이면 원소보다 **불안정**하다(만들어질 때 에너지 흡수).", "열용량": "열용량은 **어떤 물질 전체의 온도를 1°C 올리는 데 필요한 열량**이다. **열용량 = 비열 × 질량**이라, 같은 물질이라도 양이 많으면 열용량이 크다.", "엔트로피 정의": "엔트로피(S)는 계의 **무질서도**를 나타내는 양이다. 입자의 배열이 무질서할수록 엔트로피가 크다. 상태 함수다.", "상태별 엔트로피": "같은 물질의 엔트로피는 **기체 > 액체 > 고체** 순이다. 기체는 입자가 자유롭게 움직여 가장 무질서(엔트로피 큼)하고, 고체는 규칙적으로 배열되어 가장 질서 있다(엔트로피 작음).", "온도와 엔트로피": "**온도가 높을수록 엔트로피가 증가**한다. 온도가 높아지면 입자의 운동이 활발해져 무질서도가 커지기 때문이다. 절대 영도에 가까워지면 엔트로피가 작아진다.", "기체 수와 엔트로피": "반응으로 **기체 분자 수가 늘어나면 엔트로피가 증가**(ΔS > 0)하고, 줄어들면 감소한다. 기체 몰수 변화로 엔트로피 변화의 방향을 예측할 수 있다.", "상태 변화와 엔트로피": "**고체 → 액체 → 기체로 갈수록 엔트로피가 증가**한다. 고체가 녹거나 액체가 증발하면 엔트로피가 커지고, 반대로 응축·응고되면 엔트로피가 작아진다.", "ΔS 정의": "엔트로피 변화 **ΔS = S(생성물) − S(반응물)**이다. ΔS > 0이면 엔트로피가 증가한 것, ΔS < 0이면 감소한 것이다.", "기체 생성": "**기체가 생성되는 반응은 대체로 엔트로피가 증가(ΔS > 0)**한다. 고체나 액체에서 기체가 생기면 입자가 자유로워져 무질서도가 커지기 때문이다(탄산칼슘 분해 → 이산화탄소 기체 발생).", "ΔS 해석": "**ΔS가 양수이면 반응 후 무질서도가 증가**한 것이고, 음수이면 감소한 것이다. ΔS의 부호로 엔트로피의 증가·감소를 알 수 있다.", "엔트로피 감소 반응": "**계의 엔트로피가 감소해도, 주위의 엔트로피 증가가 더 크면 반응이 일어난다.** 자발성은 계와 주위를 합한 **전체(계+주위) 엔트로피**로 판단한다(열역학 2법칙).", "용해와 엔트로피": "용질이 용매에 녹으면 **일반적으로 엔트로피가 증가**한다. 고체가 녹아 입자가 용매 속으로 흩어지면 무질서도가 커지기 때문이다(설탕이 물에 녹음).", "상태 방정식": "이상 기체 상태 방정식은 **PV = nRT**다. P는 압력, V는 부피, n은 몰수, R는 기체 상수, T는 **절대 온도(K)**다. 이 식은 보일·샤를·아보가드로 법칙을 합친 것이다.", "보일 법칙": "온도가 일정할 때 기체의 **압력과 부피의 곱이 일정**하다(PV = 일정). 즉 압력과 부피는 **반비례**한다: 압력을 높이면 부피가 작아진다.", "샤를 법칙": "압력이 일정할 때 기체의 부피는 **절대 온도에 비례**한다(V/T = 일정). 절대 온도가 2배가 되면 부피도 2배가 된다.", "기체 상수": "기체 상수 **R = 0.082 L·atm/(mol·K)**다. R는 **모든 이상 기체에 같은 값**을 가지는 보편 상수이며, PV = nRT의 비례 상수 역할을 한다.", "몰부피": "표준 상태(STP, 0°C·1기압)에서 **이상 기체 1몰의 부피는 22.4 L**다. 기체 종류와 관계없이 같으며, 여기에는 아보가드로 수만큼의 분자가 들어 있다.", "이상 기체 가정": "이상 기체 모형의 가정: **(1) 분자 자체의 크기(부피)를 무시(0으로 봄), (2) 분자 사이에 인력·척력이 없음, (3) 충돌은 완전 탄성 충돌, (4) 분자는 끊임없이 무질서하게 운동.**", "운동 에너지와 온도": "기체 분자의 **평균 운동 에너지는 절대 온도에 비례**하며, 분자량과 무관하다. 따라서 온도가 같으면 기체 종류가 달라도 평균 운동 에너지가 **같다**. 단, 평균 **속력**은 √T에 비례한다.", "온도와 속력": "**온도가 높을수록 기체 분자의 평균 속력이 빠르다.** 평균 속력은 절대 온도의 **제곱근**에 비례한다(v ∝ √T).", "분자량과 속력": "**같은 온도에서 분자량이 클수록 평균 속력이 느리다.** 평균 속력은 분자량의 **제곱근에 반비례**한다(v ∝ 1/√M). 그래서 H₂는 O₂보다 평균 속력이 빠르다.", "제곱평균제곱근 속력": "기체의 제곱평균제곱근 속력은 **vrms = √(3RT/M)**다. 절대 온도 T가 클수록 커지고, 분자량 M이 클수록 작아진다.", "속력 분포": "기체 분자들은 **다양한 속력을 가지며 분포**를 이룬다. 온도가 높을수록 빠른 분자의 비율이 늘어 속력 분포가 **넓어진다**.", "그레이엄 법칙": "그레이엄 법칙: 기체의 **확산(분출) 속도는 분자량의 제곱근에 반비례**한다. 따라서 **가벼운 기체가 무거운 기체보다 빨리** 확산한다(H₂ > O₂). 두 기체의 속도 비로 분자량 비를 구할 수 있다.", "압력의 기원": "기체의 압력은 **분자가 용기 벽에 충돌하면서** 생긴다. 분자가 벽에 더 자주, 더 세게 충돌하면 압력이 커진다.", "실제 기체 편차": "실제 기체는 **고온·저압에서 이상 기체에 가깝다.** 반대로 저온·고압에서는 분자 간 힘과 분자 부피의 영향이 커져 이상 기체에서 벗어난다.", "절대 영도": "절대 영도는 **0 K = 약 -273°C**다. 이론적으로 이 온도에서 기체 분자의 운동이 멈추고 평균 운동 에너지가 0이 된다. 절대 온도는 0 K보다 낮아질 수 없다.", "분자 간 힘 정의": "분자 간 힘은 **분자와 분자 사이에 작용하는 인력**이다. 종류로 분산력, 쌍극자-쌍극자 힘, 수소 결합이 있으며, 물질의 끓는점·녹는점에 영향을 준다.", "분자 간 힘 vs 결합": "분자 간 힘은 분자 내 **화학 결합(공유 결합)보다 약해** 끊기 쉽다. 그래서 물이 끓을 때는 H-O 공유 결합이 아니라 **분자 간 힘만** 끊어진다.", "분산력 보편성": "분산력은 **모든 분자와 원자 사이에 작용**한다. 극성·무극성 분자, 비활성 기체 원자까지 **전자를 가진 모든 입자**에 작용한다.", "분산력 원리": "분산력은 **전자의 순간적인 분포 치우침으로 생긴 일시적 쌍극자**에 의해 나타난다. 한 분자의 순간 쌍극자가 이웃 분자에 쌍극자를 유발해 인력이 생긴다.", "쌍극자-쌍극자": "쌍극자-쌍극자 힘은 **영구 쌍극자를 가진 극성 분자 사이**에 작용한다. 한 분자의 δ+와 이웃 분자의 δ- 사이에 인력이 생긴다.", "수소 결합 조건": "수소 결합은 **H가 전기음성도가 매우 큰 F, O, N에 직접 결합**했을 때 나타난다. 한 분자의 H와 다른 분자의 F, O, N의 비공유 전자쌍 사이에 형성된다.", "수소 결합 본질": "수소 결합은 **쌍극자-쌍극자 힘 중 특히 강한 경우**로, 분자 간 힘의 한 종류다. 일반적인 쌍극자-쌍극자 힘보다 훨씬 강하다.", "분산력 세기": "분산력은 **분자량(전자 수)이 클수록, 분극률이 클수록 대체로 커진다.** 전자가 많을수록 순간 쌍극자가 잘 생기기 때문이다.", "할로젠 끓는점": "할로젠 분자의 끓는점은 **F₂ < Cl₂ < Br₂ < I₂** 순이다. 모두 무극성이라 분산력만 작용하는데, **분자량이 클수록 분산력이 커져** 끓는점이 높아진다.", "비활성 기체 끓는점": "비활성 기체의 끓는점은 **He < Ne < Ar < Kr** 순이다. 원자 사이에 분산력만 작용하므로, **분자량(전자 수)이 클수록 분산력이 커져** 끓는점이 높아진다.", "접촉 면적": "분자량이 비슷하면 **접촉 면적이 클수록 분산력이 크다.** 긴 사슬 모양 분자가 구형 분자보다 접촉 면적이 넓어 분산력이 크고 끓는점이 높다.", "무극성 분자 힘": "무극성 분자에서는 **분산력만** 작용한다. CH₄, CO₂ 같은 무극성 분자는 영구 쌍극자가 없어 쌍극자-쌍극자 힘이 없고, 분산력의 크기로 끓는점이 정해진다.", "수소 결합 예": "수소 결합을 하는 분자: **H₂O, HF, NH₃, 에탄올(C₂H₅OH)** 등 H가 F, O, N에 결합한 분자다. CH₄, HCl, CO₂, HBr은 수소 결합을 하지 않는다.", "수소 결합 세기": "수소 결합은 **일반적인 쌍극자-쌍극자 힘이나 분산력보다 강하지만, 공유 결합보다는 훨씬 약하다.** 분자 간 힘 중에서는 가장 강한 편이다.", "끓는점 이상": "물(H₂O)이 같은 족 H₂S보다, HF가 HCl보다, NH₃가 PH₃보다 끓는점이 높은 것은 모두 **수소 결합** 때문이다. 분자량이 더 작은데도 끓는점이 높은 이상 현상이다.", "얼음 밀도": "얼음이 물 위에 뜨는 것은 **수소 결합에 의한 규칙적 배열로 빈 공간이 많은 구조**를 이뤄 물보다 밀도가 작기 때문이다. 그래서 물이 얼면 부피가 늘어난다.", "물의 특성": "물의 **높은 표면 장력, 큰 비열, 높은 끓는점**은 모두 강한 **수소 결합** 때문이다. 물은 분자량이 작은데도 끓는점이 매우 높다.", "동족 경향": "14족 수소화합물의 끓는점은 **CH₄ < SiH₄ < GeH₄** 순이다. 이들은 수소 결합이 없어 **분산력(분자량) 순**으로 끓는점이 높아진다.", "끓는점 관계": "**분자 간 힘이 강할수록 끓는점이 높다.** 끓을 때는 분자 간 힘을 끊어 분자들을 떼어내야 하므로, 힘이 강하면 더 높은 온도가 필요하다.", "증기압 관계": "**분자 간 힘이 강할수록 증기 압력이 작다**(반비례). 힘이 강하면 분자가 잘 떨어지지 않아 증발이 어렵기 때문이다. 끓는점이 높은 액체는 증기압이 작다.", "증발 관계": "**분자 간 힘이 약할수록 같은 온도에서 더 잘 증발한다.** 휘발성이 큰(빨리 마르는) 액체는 분자 간 힘이 약하다.", "녹는점 관계": "**분자 간 힘이 강할수록 녹는점이 대체로 높다.** 녹을 때도 규칙적으로 배열된 분자들을 떼어내며 분자 간 힘을 일부 끊어야 하기 때문이다.", "끓는점 해석": "**끓는점이 높다 = 분자 간 힘이 강하다.** 두 물질의 끓는점을 비교하면 분자 간 힘의 세기를 알 수 있다. 같은 분자량에서 끓는점이 높으면 더 강한 힘이 작용한다.", "증기압 해석": "**증기 압력이 큰 액체 = 분자 간 힘이 약하다.** 증기압이 작은 액체일수록 분자 간 힘이 강하고, 증기압이 큰 액체는 끓는점이 낮은 편이다.", "점성 관계": "**분자 간 힘이 강할수록 점성도(점도)가 대체로 크다.** 힘이 강하면 분자들이 서로 잘 미끄러지지 않아 액체가 끈적해진다. 글리세롤처럼 수소 결합이 많은 액체는 점성이 크다.", "종합 비교": "끓는점은 분자 간 힘의 **종류와 세기를 모두** 고려해 비교한다. 분자량 차이가 크면 **분자량이 큰 무극성 분자가 분자량이 작은 극성 분자보다 끓는점이 높을 수 있다.**", "휘발성": "**휘발성이 큰 물질 = 분자 간 힘이 약하다.** 분자 간 힘이 약하면 증발이 잘 일어나 휘발성이 크고, 증기압이 크며 끓는점이 낮다.", "상태 결정": "분자 간 힘은 물질이 상온에서 **기체·액체·고체 중 어떤 상태인지**에 영향을 준다. 분자 간 힘이 강하면 고체나 액체, 약하면 기체이기 쉽다.", "힘의 공존": "**극성 분자에는 분산력과 쌍극자-쌍극자 힘이 함께** 작용한다. 분산력은 모든 분자에 작용하므로, 수소 결합을 하는 물 분자에도 분산력이 함께 작용한다.", "세기 순서": "분자량이 비슷할 때 분자 간 힘의 세기는 **분산력 < 쌍극자-쌍극자 < 수소 결합** 순이다. 수소 결합이 가장 강하고, 분산력이 가장 약하다.", "이온-쌍극자": "이온-쌍극자 힘은 **이온과 극성 분자 사이**에 작용하는 힘으로, 이온이 **물에 용해될 때** 나타난다. NaCl이 물에 녹을 때 이온을 물 분자가 둘러싼다.", "생체 적용": "수소 결합은 생체에서 중요한 역할을 한다: **DNA 이중 나선**의 두 가닥은 염기 사이의 수소 결합으로 이어지고, **단백질의 입체 구조**(나선·병풍)도 수소 결합으로 유지된다.", "분산력 비교": "F₂(기체), Cl₂(기체), Br₂(액체), I₂(고체)처럼 할로젠 분자의 상온 상태가 다른 것은 **분산력 차이** 때문이다. 분자량이 클수록 분산력이 커져 더 응집된 상태(고체)가 된다.", "수소 결합 효과": "수소 결합이 가능한 분자는 **비슷한 분자량의 다른 분자보다 끓는점이 높다.** 수소 결합이 추가적인 강한 인력으로 작용하기 때문이다.", "반응 속도 정의": "반응 속도는 **단위 시간당 반응물이나 생성물의 농도 변화**로 나타낸다. 반응물 감소나 생성물 증가의 빠르기를 뜻하며, 속도가 클수록 반응이 빠르게 진행된다.", "반응 속도 표현": "반응 속도는 **반응물의 농도 감소율** 또는 **생성물의 농도 증가율**로 나타낼 수 있다. 계수를 고려하면 어느 쪽으로 나타내도 속도가 같아진다.", "충돌 이론": "충돌 이론에 따르면 **입자가 서로 충돌해야 반응이 일어난다.** 충돌 빈도가 높을수록 반응이 빨라질 수 있다.", "유효 충돌": "유효 충돌은 **충분한 에너지(활성화 에너지 이상)와 올바른 방향을 모두 가진 충돌**이다. 둘 중 하나라도 빠지면 반응하지 않는다. 유효 충돌 비율이 높을수록 반응이 빠르다.", "활성화 에너지": "활성화 에너지는 **반응이 일어나기 위해 필요한 최소 에너지**(반응물이 넘어야 하는 에너지 장벽)다. 활성화 에너지가 **클수록 반응이 느리고**, 작을수록 빠르다. **반응엔탈피(ΔH)와는 다른 양**이다.", "농도와 속도": "반응물의 **농도가 커지면 충돌 빈도가 늘어 반응 속도가 빨라진다.** 농도가 높을수록 단위 부피당 입자가 많아 충돌이 잦아지기 때문이다.", "온도와 속도": "**온도가 높아지면 반응 속도가 빨라진다.** 입자의 운동이 활발해져 충돌이 잦아지고, 활성화 에너지를 넘는 입자(유효 충돌)가 많아지기 때문이다.", "표면적과 속도": "고체 반응물의 **표면적이 클수록 반응이 빠르다.** 고체를 잘게 부수면(가루로 만들면) 표면적이 커져 덩어리보다 반응이 빠르다.", "촉매와 엔탈피": "촉매는 **활성화 에너지만 낮추고 반응엔탈피 ΔH는 바꾸지 않는다.** 반응물과 생성물의 에너지 차이(ΔH)는 그대로이고, 정반응과 역반응의 ΔH도 같다. 촉매는 **화학 평형의 위치도 이동시키지 않는다**.", "촉매 종류": "**정촉매는 반응을 빠르게**(활성화 에너지 낮춤), **부촉매는 반응을 느리게**(활성화 에너지 높임) 한다. 촉매에는 이 두 종류가 있다.", "속도식": "속도식은 **v = k[A]^m[B]^n** 형태로 나타낸다. 여기서 **k는 속도 상수**, m과 n은 **반응 차수**다. 속도식은 반응 속도와 반응물 농도의 관계를 보여준다.", "반응 차수": "반응 차수는 **속도식에서 각 농도의 지수**이며 **실험으로 결정**한다. 화학 반응식의 **계수와 다를 수 있다**.", "속도 상수": "속도 상수 k는 **온도와 촉매에 의해 달라지고, 농도와는 무관**하다. 온도가 높아지면 k가 커지고, 촉매로도 k가 바뀐다. k는 반응마다 고유한 값을 가진다.", "아레니우스 식": "아레니우스 식 **k = A·e^(-Ea/RT)**: 온도(T)가 높을수록 속도 상수 k가 **커지고**, 활성화 에너지(Ea)가 클수록 같은 온도에서 k가 **작다**. 속도 상수와 온도, 활성화 에너지의 관계를 나타낸다.", "촉매와 역반응": "촉매는 **정반응과 역반응을 모두** 빠르게 한다(양방향 활성화 에너지를 모두 낮춤). 정·역반응을 **같은 비율로** 빠르게 하므로, 평형에 더 빨리 도달할 뿐 **평형의 위치(평형 상수)는 바꾸지 않는다**.", "온도와 유효 충돌": "**온도가 높으면 활성화 에너지를 넘는 입자의 비율이 커진다.** 빠른 입자가 많아져 유효 충돌의 수가 늘고, 그 결과 반응 속도가 빨라진다.", "촉매 작용": "촉매는 **더 낮은 활성화 에너지를 갖는 새로운 반응 경로를 제공**한다. 원래보다 활성화 에너지가 낮은 다른 길을 열어 반응을 빠르게 한다.", "시간과 속도": "반응이 진행되면서 **반응물 농도가 줄어 반응 속도가 점점 느려진다.** 반응 초기에 가장 빠르고, 시간이 지날수록 충돌 빈도가 줄어 느려진다.", "전체 차수": "전체 반응 차수는 **각 반응물에 대한 차수의 합**이다. 속도식 v = k[A]^m[B]^n에서 전체 차수는 **m + n**이다.", "증기압 정의": "증기 압력은 밀폐된 용기에서 **액체와 그 증기가 동적 평형을 이룰 때 증기가 나타내는 압력**이다. 이 상태의 증기압을 포화 증기압이라 한다.", "증기압과 분자 간 힘": "증기 압력은 **분자 간 힘이 약할수록 크다.** 분자 간 힘이 약하면 분자가 쉽게 증발해 증기압이 크고, 강하면 증발이 어려워 증기압이 작다.", "휘발성과 증기압": "**휘발성이 큰 액체는 증기 압력이 크다**(비례). 휘발성과 증기압은 같은 방향으로 변하며, 둘 다 분자 간 힘이 약할수록 크다.", "증기압 세기 성질": "증기 압력은 **세기 성질**이라 **액체의 양이나 표면적과 무관**하다. 같은 온도면 온도와 액체의 종류에만 의존하므로, 액체를 더 넣거나 용기를 바꿔도 증기압은 변하지 않는다.", "동적 평형": "밀폐 용기에서 **증발 속도와 응축 속도가 같아지면 동적 평형**(포화 증기압)에 도달한다. 이때 증기압이 일정하게 유지되지만, 증발과 응축은 **계속** 일어난다.", "끓음 조건": "끓음은 액체의 **증기 압력이 외부 압력과 같아질 때** 일어난다. 이때 액체 내부에서도 기화가 일어나며 끓기 시작한다.", "끓음 정의": "끓음은 액체 **표면뿐 아니라 내부에서도 기화**가 일어나는 현상이다. 액체 전체에서 기포(증기)가 생기며 끓는다.", "끓는점 정의": "끓는점은 액체의 **증기 압력이 외부 압력과 같아지는 온도**다. 외부 압력에 따라 달라지며, 분자 간 힘이 강할수록 끓는점이 높다.", "정상 끓는점": "정상 끓는점은 외부 압력이 **1기압**일 때의 끓는점이다. 물의 정상 끓는점은 **100°C**다. 1기압이 아닌 조건에서는 끓는점이 이와 다르다.", "압력과 끓는점": "**외부 압력이 낮으면 끓는점이 낮아지고, 높으면 끓는점이 높아진다**(같은 방향). 높은 산(기압 낮음)에서는 물이 100°C보다 낮은 온도에서 끓고, 압력솥(압력 높음)에서는 끓는점이 높아져 음식이 빨리 익는다.", "분자 간 힘과 끓는점": "**분자 간 힘이 강한 액체는 끓는점이 높다.** 분자 간 힘이 강하면 분자들을 떼어내기 어려워 더 높은 온도가 필요하기 때문이다.", "증기압과 끓는점": "같은 외부 압력에서 **증기 압력이 큰 액체는 끓는점이 낮다**(반비례). 증기압이 크면 외부 압력에 빨리 도달해 낮은 온도에서 끓기 때문이다.", "증기압-온도 곡선": "증기 압력은 온도가 올라가면 **점점 빠르게(비선형적으로) 증가**한다. 증기압-온도 곡선은 **위로 볼록한** 곡선이며, 이 곡선이 외부 압력과 만나는 온도가 끓는점이다.", "물의 끓는점": "물의 정상 끓는점은 **100°C**(1기압에서)다. 물의 끓는점이 비교적 높은 것은 강한 **수소 결합** 때문이다.", "끓는점 조건": "끓는점에서는 액체의 **증기 압력과 외부 압력이 같다.** 이때 액체 내부에서도 기화가 일어나며 끓기 시작한다.", "증발 속도": "증발 속도는 **온도가 높을수록, 표면적이 넓을수록, 바람이 불수록, 분자 간 힘이 약할수록** 빨라진다.", "증기압 비교": "같은 온도에서 **에탄올(C₂H₅OH)이 물보다 증기 압력이 크다.** 에탄올은 물보다 분자 간 힘이 약해 증발이 잘 일어나기 때문이다.", "증발 정의": "증발은 **액체 표면에서 일어나는 기화** 현상이다. 끓는점 아래에서도 표면의 분자가 기체로 빠져나간다(빨래가 마르는 것).", "끓는점과 분자 간 힘": "**끓는점이 높은 액체일수록 분자 간 힘이 강하다.** 분자 간 힘이 강하면 분자를 떼어내기 어려워 끓는점이 높아진다.", "증발과 에너지": "증발은 **에너지를 흡수하는 흡열 과정**이다. 액체가 기화하려면 분자 간 힘을 끊을 에너지가 필요해, 주위에서 열을 흡수한다. 그래서 증발이 일어나면 남은 액체와 주위의 온도가 내려간다.", "삼투 정의": "삼투는 **반투막을 통해 용매가 이동하는 현상**이다. 농도 차에 의해 용질이 아니라 **용매**가 반투막을 통과해 한쪽으로 이동한다.", "반투막": "반투막은 **용매는 통과시키고 용질은 통과시키지 않는** 막이다. 작은 용매 분자만 통과하고 큰 용질 입자는 막힌다. 세포막이 그 예다.", "삼투 방향": "삼투에서 용매는 **묽은 용액에서 진한 용액 쪽으로 이동**한다(용질 농도가 낮은 쪽 → 높은 쪽). 양쪽 농도를 같게 만드는 방향이다. 순수한 물과 설탕물을 반투막으로 나누면 물이 **설탕물 쪽**으로 이동한다.", "삼투압 정의": "삼투압은 **삼투를 막기 위해 가해야 하는 압력**이다. 진한 용액 쪽에 가해 용매가 더 이상 이동하지 않게 한다. 삼투압이 클수록 용매를 끌어당기는 힘(농도)이 크다.", "반트호프 식": "삼투압은 **π = MRT**로 나타낸다. **M은 몰농도(mol/L)**, R은 기체 상수, **T는 절대 온도**다. 삼투압은 몰농도와 절대 온도에 **비례**한다. πV = nRT 형태로도 쓴다.", "총괄성": "삼투압은 **총괄성의 하나**로, 용질의 종류와 무관하고 **용질 입자의 수에 의존**한다. 입자 수가 많을수록 삼투압이 크다.", "전해질 삼투압": "전해질 용액의 삼투압은 **π = iMRT**로 계산한다. 반트호프 인자 i를 곱해야 한다. 0.1 M NaCl(i≈2)의 삼투압은 0.1 M 포도당의 약 2배다.", "온도 의존": "삼투압은 **절대 온도에 비례**한다(π = MRT). 같은 농도라도 온도가 높으면 삼투압이 크다.", "농도 의존": "삼투압은 용액의 **농도가 진할수록 크다**(몰농도에 비례). 삼투압이 크면 그 용액의 농도가 진한 것이다. 같은 온도에서 몰농도가 2배면 삼투압도 2배다.", "등장액": "등장액은 **삼투압이 서로 같은 용액**이다. 등장액 사이에서는 농도(입자 수)가 같아 물의 **순이동이 일어나지 않는다.** 생리식염수는 혈액과 등장액이라 적혈구가 변형되지 않는다.", "고장액": "고장액은 비교 대상보다 **삼투압이 높은(농도가 진한)** 용액이다. 적혈구를 고장액에 넣으면 물이 세포 밖으로 빠져나가 **쭈그러든다**.", "저장액": "저장액은 비교 대상보다 **삼투압이 낮은(농도가 묽은)** 용액이다. 적혈구를 저장액에 넣으면 물이 세포 안으로 들어와 **부풀거나 터진다**.", "세포와 삼투": "적혈구를 **고장액에 넣으면 수축**(물이 빠져나감), **저장액에 넣으면 팽창하거나 터진다**(물이 들어옴). **등장액에서는 모양이 변하지 않는다.**", "역삼투": "역삼투는 진한 용액 쪽에 **삼투압보다 큰 압력**을 가해 용매를 삼투와 **반대 방향**(진한 용액 → 묽은 용액)으로 이동시키는 것이다.", "역삼투 응용": "역삼투는 **해수 담수화**(바닷물에서 순수한 물 얻기)와 **정수기**에 이용된다. 물에서 용질을 분리해 깨끗한 물을 얻는 데 쓰인다.", "분자량 측정": "삼투압 측정으로 용질의 **분자량을 구할 수 있다.** πV = nRT에서 용질의 몰수(n)를 구하면 분자량(= 질량/몰수)을 계산할 수 있다. 특히 **고분자**(큰 분자)의 분자량 측정에 유용하다.", "삼투압 크기": "삼투압은 **묽은 용액에서도 비교적 크게 나타난다.** 그래서 끓는점 오름이나 어는점 내림보다 작은 농도에서도 측정이 쉬워, 고분자 분자량 측정에 유용하다.", "삼투 현상": "반투막을 사이에 두면 삼투로 물이 진한 용액 쪽으로 이동해 **진한 용액 쪽 수면이 높아진다.** 수면 차이가 생기는 것은 물이 한쪽(진한 쪽)으로 이동하기 때문이다.", "산화 정의": "산화는 **전자를 잃는 것**이다(산화수 증가). 산소를 얻거나 수소를 잃는 것으로도 정의된다. 어떤 물질이 산화되면 전자를 내놓는다.", "환원 정의": "환원은 **전자를 얻는 것**이다(산화수 감소). 산소를 잃거나 수소를 얻는 것으로도 정의된다. 어떤 물질이 환원되면 전자를 받는다.", "동시성": "**산화와 환원은 항상 동시에 일어난다.** 한 물질이 잃은 전자를 다른 물질이 받으므로, 산화되는 물질과 환원되는 물질이 항상 함께 있다.", "산화수 규칙": "주요 산화수 규칙: 홑원소 물질의 원자는 **0**, 단원자 이온은 **그 전하와 같음**, 화합물에서 산소는 보통 **-2**, 수소는 보통 **+1**, 1족 금속은 **+1**, 플루오린은 **-1**이다.", "산화수 합": "**중성 화합물에서 모든 원자의 산화수 합은 0**이고, **다원자 이온에서 산화수의 합은 그 이온의 전하와 같다.** 이 규칙으로 미지 원자의 산화수를 구한다.", "산화수 변화": "**산화수가 증가하면 산화, 감소하면 환원**이다. 반응 전후 원자의 산화수 변화로 산화·환원을 판단한다.", "산화제": "산화제는 **다른 물질을 산화시키고 자신은 환원**된다. 상대로부터 전자를 받아 자신의 산화수가 **감소**한다.", "환원제": "환원제는 **다른 물질을 환원시키고 자신은 산화**된다. 상대에게 전자를 **내놓아** 자신의 산화수가 **증가**한다(산화제와 정확히 반대).", "산화제와 전자": "산화제는 **전자를 얻는다(받는다).** 상대로부터 전자를 받아 자신이 환원되고, 그만큼 상대가 산화된다.", "환원제와 전자": "환원제는 **전자를 내놓는다(잃는다).** 상대에게 전자를 주어 상대를 환원시키고, 자신은 전자를 잃어 산화된다. 환원제가 내놓은 전자를 산화제가 받는다.", "산화제 산화수": "산화제는 반응에서 **자신의 산화수가 감소**한다. 전자를 받아 환원되기 때문이다.", "환원제 산화수": "환원제는 반응에서 **자신의 산화수가 증가**한다. 전자를 잃어 산화되기 때문이다(산화제와 반대).", "전자 균형": "산화환원 반응에서 **잃은 전자 수와 얻은 전자 수는 같다.** 환원제가 잃은 전자를 산화제가 모두 받으므로 전자 수가 균형을 이룬다.", "과산화물": "**과산화물(예: H₂O₂)에서 산소의 산화수는 -1**이다. 산소는 보통 -2지만, 과산화물에서는 **예외**로 -1을 가진다.", "금속 수소화물": "**금속 수소화물(예: NaH)에서 수소의 산화수는 -1**이다. 수소는 보통 +1이지만, 금속 수소화물에서는 **예외**로 -1을 가

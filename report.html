진다(NaH에서 수소 -1, 나트륨 +1).", "산화수 계산": "산화수 규칙과 합 규칙으로 미지 원자의 산화수를 구한다. **H₂O는 수소 +1, 산소 -2**, NH₃는 수소 +1, 질소 -3, CO₂는 산소 -2, 탄소 +4다.", "산화제 역할": "산화제는 **자신이 환원되면서 다른 물질을 산화**시킨다. 전자를 받아 상대가 전자를 잃게(산화) 만든다. 같은 반응에서 산화제와 환원제는 서로 짝을 이룬다.", "돌턴 법칙": "돌턴의 분압 법칙: 혼합 기체의 **전체 압력은 각 성분 기체의 분압의 합**이다(전체 압력 = 분압₁ + 분압₂ + ...). 각 기체는 서로 영향을 주지 않고 독립적으로 압력을 만든다.", "분압 정의": "어떤 기체의 분압은 **그 기체가 단독으로 전체 부피를 차지할 때 나타내는 압력**이다. 즉 혼합 기체에서 한 성분 기체가 만드는 압력이다.", "분압-몰분율": "어떤 기체의 분압은 **전체 압력 × 그 기체의 몰분율**이다. 전체 압력이 일정하면 분압은 몰분율에 **비례**하므로, 몰분율이 큰 성분일수록 분압이 크다.", "몰분율": "몰분율은 **그 성분의 몰수를 전체 몰수로 나눈 값**이다. 0과 1 사이의 값이고, 모든 성분의 몰분율을 더하면 **1**이 된다.", "분압-몰수": "같은 온도·부피에서 기체의 **분압은 몰수에 비례**한다(P ∝ n). 몰수가 2배가 되면 분압도 2배가 된다.", "분압비": "같은 온도·부피에서 **분압의 비 = 몰수비 = 몰분율비**다. 질량비나 분자량비, 부피비가 아니다. 분자량이 달라도 같은 몰수면 분압이 같다.", "수상 치환": "수상 치환(물 위에서 기체 모으기)으로 모은 기체에는 수증기가 섞여 있다. 측정 압력 = **모은 기체의 분압 + 수증기압**이므로, 기체의 분압은 측정 압력에서 **수증기압을 빼서** 구한다.", "분압 계산": "분압 = 전체 압력 × 몰분율이므로, **몰분율이 0.5인 성분의 분압은 전체 압력의 0.5배**다. 예: 전체 압력 4기압, 몰분율 0.25이면 분압은 4 × 0.25 = **1기압**.", "실제 기체 특징": "실제 기체는 이상 기체와 달리 **분자 자체의 부피를 가지고, 분자 사이에 인력이 작용**한다. 이 두 가지 때문에 이상 기체 가정과 차이가 난다.", "이상 기체 근접 조건": "실제 기체는 **고온·저압**에서 이상 기체에 가까워진다. 고온·저압에서는 분자 간 인력과 분자 부피의 영향이 작아지기 때문이다.", "이상 기체 편차": "실제 기체는 **저온**(분자 간 인력의 영향)과 **고압**(분자 부피의 영향)에서 이상 기체에서 많이 벗어난다. 편차는 온도와 압력에 따라 달라진다.", "반데르발스 식": "반데르발스 식은 이상 기체 방정식(PV = nRT)에 **분자 자체 부피와 분자 간 인력을 보정**한 상태 방정식으로, 실제 기체의 거동을 더 잘 설명한다.", "반데르발스 상수": "반데르발스 상수 **a는 분자 간 인력**을, **b는 분자 자체의 부피**를 반영한다. a가 클수록 인력이 강한 기체, b가 클수록 부피가 큰 기체다.", "압축 인자": "압축 인자 **Z = PV/nRT**다. **이상 기체는 모든 조건에서 Z = 1**이다. Z가 1에서 멀어질수록 실제 기체가 이상 기체에서 많이 벗어난 것이다.", "압축 인자 해석": "**분자 간 인력이 지배적이면 Z < 1**(부피가 이상 기체보다 작아짐), **분자 부피의 영향이 지배적이면 Z > 1**(매우 높은 압력)이다.", "편차 크기": "**분자 간 인력이 클수록(분자 부피가 클수록) 이상 기체에서 더 많이 벗어난다.** 인력이 작은 기체는 이상 기체에 가깝다.", "이상 기체 근접": "**He, H₂는 분자 간 인력이 작아 이상 기체에 비교적 가깝다.** 가볍고 무극성인 기체일수록 이상 기체처럼 거동한다.", "저압 근사": "실제 기체도 **압력이 매우 낮으면 PV = nRT로 근사**할 수 있다. 저압에서는 분자가 멀리 떨어져 분자 부피와 인력의 영향이 작기 때문이다.", "결정성 고체": "결정성 고체는 입자가 **규칙적으로 배열**되어 있고, **녹는점이 일정**하다. 소금, 다이아몬드가 그 예다.", "비결정성 고체": "비결정성(무정형) 고체는 입자가 **불규칙하게 배열**되어 있고, **녹는점이 일정하지 않아** 넓은 온도 범위에서 물러진다. 유리, 고무가 그 예다.", "이온 결정": "이온 결정은 **양이온과 음이온이 이온 결합**으로 연결되어 번갈아 규칙적으로 배열된 고체다. NaCl이 대표적인 예다.", "이온 결정 녹는점": "이온 결정은 **녹는점이 높다.** 양이온과 음이온 사이의 정전기적 인력(이온 결합)이 강해 잘 녹지 않기 때문이다.", "이온 결정 전도성": "이온 결정은 **고체에서는 전기를 통하지 않고, 액체(용융)나 수용액에서는 전기를 통한다.** 전도성은 **이온이 자유롭게 움직일 수 있는지**에 달려 있다.", "이온 결정 성질": "이온 결정은 **단단하지만 외부 힘에 잘 부서진다**(취성). 힘을 가해 이온 층이 어긋나면 같은 전하의 이온이 만나 서로 밀어내기 때문이다.", "분자 결정": "분자 결정은 **분자들이 분자 간 힘으로 모여** 규칙적으로 배열된 고체다. 구성 입자는 분자이며, 드라이아이스(CO₂), 아이오딘(I₂)이 예다.", "분자 결정 녹는점": "분자 결정은 **녹는점이 낮다.** 분자들이 약한 **분자 간 힘**으로 모여 있어 적은 에너지로도 떨어지기 때문이다. 드라이아이스처럼 쉽게 승화하기도 한다.", "분자 결정 예": "분자 결정의 예: **드라이아이스(CO₂), 얼음(H₂O), 아이오딘(I₂), 설탕** 등 분자로 이루어진 고체다.", "공유 결정": "공유(원자) 결정은 **원자들이 공유 결합으로 그물처럼 연결**된 거대 분자 구조다. 모든 원자가 공유 결합으로 이어져 있어 원자 결정이라고도 한다.", "공유 결정 녹는점": "공유 결정은 **녹는점이 매우 높다.** 모든 원자가 강한 **공유 결합**으로 묶여 있어 녹이려면 이 결합을 끊어야 하기 때문이다. 다이아몬드가 대표적이다.", "공유 결정 예": "공유 결정의 예: **다이아몬드, 흑연, 석영(SiO₂), 규소(Si)** 등 원자들이 공유 결합으로 그물처럼 연결된 고체다.", "공유 결정 전도성": "**대부분의 공유 결정은 전기를 통하지 않는다.** 전자가 공유 결합에 묶여 있어 자유롭게 움직이지 못하기 때문이다(다이아몬드). 단, **흑연은 예외적으로** 전기를 통한다.", "흑연 전도성": "흑연은 **공유 결정이지만 전기 전도성이 있다.** 각 탄소가 3개의 다른 탄소와 결합하고 **남은 전자가 자유롭게 이동**하기 때문이다. 그래서 전극으로 쓰인다.", "다이아몬드 전도성": "다이아몬드는 **전기를 통하지 않는 절연체**다. 각 탄소가 **4개의 탄소와 공유 결합**해 모든 전자가 결합에 쓰여 자유 전자가 없기 때문이다.", "금속 결정": "금속 결정은 **금속 양이온과 자유 전자**로 구성되며, 양이온과 자유 전자 사이의 인력인 **금속 결합**으로 이어져 있다. 자유 전자가 양이온을 둘러싸고 있다.", "녹는점 비교": "녹는점은 대체로 **공유 결정 > 이온 결정 > 금속 결정 > 분자 결정** 순이다. 공유 결정이 가장 높고, 분자 결정이 가장 낮다.", "단위 세포": "단위 세포는 결정 구조에서 **반복되는 최소 단위**다. 단위 세포가 3차원으로 규칙적으로 쌓여 전체 결정 구조를 이룬다.", "흑연 구조": "흑연은 탄소 원자가 **육각형 평면 층을 이루며 쌓인** 구조다. 각 탄소는 **3개의 탄소와 결합**하고 남은 전자가 층 사이를 이동해 전기를 통한다. 층과 층 사이는 약한 분자 간 힘으로 미끄러지기 쉽다.", "자발성 방향": "자발적 변화는 **우주(계+주위)의 엔트로피가 증가하는 방향**으로 일어난다. 자발성은 계가 아니라 **우주 전체**의 엔트로피로 판단한다.", "열역학 제2법칙": "열역학 제2법칙은 자발적 변화에서 **우주의 엔트로피가 증가**한다는 것이다. 우주의 전체 엔트로피는 자발적 과정에서 항상 증가한다.", "깁스 자유 에너지": "깁스 자유 에너지는 **G = H − TS**로 정의된다. H는 엔탈피, S는 엔트로피, T는 **절대 온도**다. 일정 온도·압력에서 ΔG의 부호로 자발성을 판단한다.", "ΔG 식": "**ΔG = ΔH − TΔS**로 자발성을 판단한다. T는 **절대 온도**다. ΔG가 음수면 자발적이다. 온도가 ΔG에 영향을 주는 것은 **TΔS 항** 때문이다.", "자발성 판단": "**ΔG < 0이면 자발적**, **ΔG = 0이면 평형**, **ΔG > 0이면 비자발적**이다. ΔG의 부호로 반응의 자발성을 판단한다.", "부호 조합": "ΔG = ΔH − TΔS의 부호 조합:\n\n| ΔH | ΔS | 자발성 |\n|---|---|---|\n| < 0 | > 0 | 모든 온도에서 자발 |\n| < 0 | < 0 | 저온에서 자발 |\n| > 0 | > 0 | 고온에서 자발 |\n| > 0 | < 0 | 모든 온도에서 비자발 |", "자발성 결정": "반응의 자발성은 **ΔH와 ΔS를 함께 고려해 ΔG로 결정**된다(ΔG = ΔH − TΔS). ΔH만으로는 자발성을 단정할 수 없다.", "발열과 자발성": "**발열 반응이라도 항상 자발적인 것은 아니다.** 자발성은 ΔH뿐 아니라 ΔS와 온도에도 의존하므로 ΔG의 부호로 판단해야 한다. 발열(ΔH < 0)이어도 ΔS < 0이고 고온이면 비자발적일 수 있다.", "온도와 자발성": "**온도는 반응의 자발성에 영향을 줄 수 있다.** ΔH와 ΔS의 부호가 같으면, 어떤 온도에서는 자발적이던 반응이 다른 온도에서는 비자발적일 수 있다.", "ΔG 크기": "**ΔG가 음수일수록(더 작을수록) 반응의 자발성이 크다.** 자발성의 크기는 ΔG가 얼마나 음수인지로 본다. ΔG가 0에 가까울수록 평형에 가깝다.", "자발성과 속도": "**자발적인 반응이라도 반응 속도는 느릴 수 있다.** 자발성은 반응이 일어나는 **방향**을 알려줄 뿐 **속도**는 알려주지 않는다. 다이아몬드가 흑연으로 바뀌는 것은 자발적이지만 매우 느리다.", "전환 온도": "자발과 비자발의 경계가 되는 전환 온도는 **T = ΔH/ΔS**로 어림한다. 이는 **ΔG = 0**(ΔH = TΔS)이 되는 온도이며, 이 온도 위아래로 자발성이 바뀐다.", "중화 반응": "중화 반응은 **산과 염기가 반응해 염과 물을 만드는 반응**이다. 산의 H⁺와 염기의 OH⁻가 반응해 물이 생긴다.", "알짜 이온 반응": "강산-강염기 중화의 알짜 이온 반응식은 **H⁺ + OH⁻ → H₂O**다. 구경꾼 이온(Na⁺, Cl⁻)은 반응에 참여하지 않으므로 알짜 이온 반응식에 나타나지 않는다.", "중화 양적 관계": "중화 양적 관계는 **nMV = n'M'V'**로 나타낸다(n = 산·염기의 가수, M = 농도, V = 부피). 중화점에서 산이 내놓은 H⁺ 몰수와 염기가 내놓은 OH⁻ 몰수가 같다.", "적정 정의": "적정은 **농도를 아는 표준 용액으로 농도를 모르는 용액의 농도를 구하는 방법**이다. 표준 용액을 조금씩 떨어뜨리며 중화시켜 미지 용액의 농도를 정확히 구한다.", "당량점": "당량점(중화점)은 **산과 염기가 정확히 반응을 끝낸 지점**으로, 산의 H⁺ 몰수와 염기의 OH⁻ 몰수가 **같다**. 이 지점에서 가한 적정액의 부피로 미지 농도를 계산한다.", "적정 곡선": "적정 곡선은 **가한 적정액의 부피에 따른 pH 변화**를 나타낸 그래프다(가로축 부피, 세로축 pH). 당량점 부근에서 pH가 급격히 변하며, 곡선 모양으로 산·염기의 세기를 알 수 있다.", "강산-강염기 당량점": "강산-강염기 적정의 당량점은 **pH 7로 중성**이다(25°C). 중화로 생긴 염(NaCl 등)은 **가수분해하지 않아** 액성에 영향을 주지 않기 때문이다. 당량점에서 [H⁺] = [OH⁻]다.", "약산-강염기 당량점": "약산-강염기 적정의 당량점은 **염기성(pH > 7)**이다. 중화로 생긴 염의 **짝염기가 가수분해**해 OH⁻를 만들기 때문이다. 그래서 염기성에서 변색하는 페놀프탈레인이 적합하다.", "강산-약염기 당량점": "강산-약염기 적정의 당량점은 **산성(pH < 7)**이다. 중화로 생긴 염의 **짝산이 가수분해**해 H⁺를 만들기 때문이다. 그래서 산성에서 변색하는 메틸 오렌지가 적합하다.", "pH 도약": "**당량점 부근에서 pH가 급격하게 변한다**(pH 도약). 적정액을 조금만 넣어도 pH가 크게 도약하며, 적정 곡선의 수직에 가까운 부분이 이 구간이다. 지시약의 변색 범위가 이 도약 구간 안에 들어가야 한다.", "지시약 선택": "지시약은 **변색 범위가 당량점 부근의 pH 도약 구간에 들어야** 한다. 당량점의 액성에 맞춰: 강산-약염기 적정(산성 당량점) → **메틸 오렌지**, 약산-강염기 적정(염기성 당량점) → **페놀프탈레인**을 쓴다.", "페놀프탈레인": "페놀프탈레인은 **염기성에서 분홍색**, **산성과 중성에서 무색**이다. 약산-강염기 적정의 당량점(염기성)에서 분홍색으로 변색한다.", "페놀프탈레인 범위": "페놀프탈레인은 대략 **pH 8-10**에서 변색한다(염기성 영역). 약 pH 8 이상에서 분홍색을 띠므로, 당량점이 염기성인 약산-강염기 적정에 적합하다.", "메틸 오렌지 범위": "메틸 오렌지는 대략 **pH 3-4.5**에서 변색한다(산성 영역). 산성에서 붉은색, 염기성 쪽에서 노란색이며, 당량점이 산성인 강산-약염기 적정에 적합하다.", "지시약 역할": "적정에서 지시약은 **당량점(종말점)을 눈으로 확인**하는 데 쓰인다. 당량점 부근에서 색이 변해 중화 완료를 알려주며, 적절한 지시약을 쓰면 종말점이 당량점과 거의 일치한다.", "중화 부피": "**같은 가수·몰농도라면 중화에 필요한 산과 염기의 부피가 같다**(1:1). 농도가 높을수록 중화에 필요한 부피는 적다(농도 두 배 → 부피 절반).", "중화 양론": "**1가 산 1몰은 1가 염기 1몰**과 완전히 중화한다(H⁺ 1몰 = OH⁻ 1몰). 2가 산 1몰은 1가 염기 2몰과 중화한다(H⁺ 2몰). 가수가 다르면 중화 몰수도 달라진다.", "완전 중화 조건": "**산의 H⁺ 몰수와 염기의 OH⁻ 몰수가 같을 때** 완전히 중화된다. 이 지점이 당량점이고, 가수×농도×부피로 구한 몰수가 같아야 한다.", "당량점 위치": "적정 곡선에서 당량점은 **pH가 급변하는 도약 구간의 중간쯤**에 위치한다(곡선의 변곡점). 강산-강염기 적정에서는 도약 구간의 pH 7 부근이다.", "완충 영역": "약산을 강염기로 적정할 때 **당량점 전에 완충 영역**이 나타난다. 이 구간에는 약산과 그 짝염기가 함께 존재해 pH가 **천천히** 변한다. 완충 영역의 중간(반당량점)에서 **pH = pKa**다.", "종말점과 당량점": "**종말점**(지시약이 색을 바꾸는 지점)과 **당량점**(실제로 중화가 끝난 지점)은 **일치할 필요는 없고 가까우면 된다.** 적절한 지시약을 쓰면 종말점이 당량점에 충분히 가까워 적정 오차가 작다.", "브뢴스테드-라우리": "**산 = 양성자(H⁺) 주개, 염기 = 양성자 받개.** 산-염기 반응은 **H⁺의 이동**이다(전자 이동이 아님).", "pH·pOH 정의": "**pH = -log[H⁺], pOH = -log[OH⁻].** [H⁺]가 **클수록 pH는 작아진다**(음의 로그).", "완충 용액": "완충 용액 = **약산 + 그 짝염기**(또는 **약염기 + 그 짝산**). 짝산-짝염기 쌍이 핵심이다.", "원자 번호": "**원자 번호 = 양성자 수.** 이게 원소의 **주민등록번호**다. 양성자 수가 같으면 같은 원소, 다르면 다른 원소. 끝.", "원자량": "원자량은 동위원소들의 **존재비로 가중 평균**한 값이다. 그래서 보통 **소수**다(예: 염소 35.5).", "전하 균형": "중성 원자는 **양성자 수 = 전자 수.** 이온은 **전자**가 드나들어 생긴다. 전자를 **잃으면 양이온**, **얻으면 음이온**.", "SI 단위": "외울 7개: **질량 kg · 길이 m · 시간 s · 온도 K · 물질량 mol · 전류 A · 광도 cd.** 함정은 딱 둘, **질량은 g이 아니라 kg**, **온도는 ℃가 아니라 K**.", "물질량 단위": "**몰은 입자를 세는 묶음 단위**다. 1몰 = 약 **6.022×10²³개**(아보가드로 수). g은 무게를 재는 단위, mol은 개수를 세는 단위 · 둘은 차원이 다르다.", "접두사": "음수 쪽 순서를 손가락처럼 외워라: **milli(m) 10⁻³ · micro(μ) 10⁻⁶ · nano(n) 10⁻⁹ · pico(p) 10⁻¹²**. 양수 쪽: **kilo(k) 10³ · mega(M) 10⁶**. centi(c)만 예외적으로 **10⁻²**.", "유효숫자": "0이 아닌 숫자는 무조건 유효. 0은 **위치로 갈린다**: 숫자 **사이**의 0은 유효, 소수점 **뒤 끝**의 0은 유효, **앞**에 오는 0은 무효.", "유효숫자 연산": "규칙이 **두 갈래**다. **곱셈·나눗셈 → 유효숫자 \"개수\"** 가 가장 적은 것에 맞춤. **덧셈·뺄셈 → \"소수점 이하 자릿수\"** 가 가장 적은 것에 맞춤. 이 둘을 섞으면 전부 틀린다.", "정확한 수": "**셈해서 얻은 수**와 **정의로 정해진 수**는 오차가 없다. 그래서 유효숫자가 **무한대**로 취급되고, 계산 결과의 자릿수를 **제한하지 않는다**.", "정확도·정밀도": "**정확도 = 참값에 가까움. 정밀도 = 값들이 서로 모임.** 둘은 **독립**이다. 정밀해도 부정확할 수 있다.", "밀도": "**밀도 = 질량 ÷ 부피.** 그리고 밀도는 양과 무관한 **물질의 고유 성질**이다 · 덩어리가 크든 작든 같은 물질이면 밀도는 같다.", "온도 환산": "**K = ℃ + 273.15.** 더하면 켈빈, 빼면 섭씨. 그리고 **눈금 1도 간격은 둘이 같다** · 기준점만 다르다.", "차원 분석": "단위 환산은 **환산 인자를 곱하는** 일이다. 환산 인자는 **분자=분모(같은 양)** 라 값이 **1**이다. 1을 곱하니 양은 안 변하고 **단위만 바뀐다**.", "배위 착물": "배위 착물 = **중심 금속 이온 + 리간드**가 배위 결합한 화합물. 리간드가 금속에 전자쌍을 주어 결합한다.", "중심 금속": "중심 금속은 주로 **전이 금속**이고, 리간드로부터 **전자쌍을 받는 루이스 산**으로 작용한다.", "리간드": "리간드는 **비공유 전자쌍을 제공하는 루이스 염기.** 그 전자쌍으로 중심 금속과 배위 결합을 만든다.", "배위 결합": "배위 결합은 **리간드가 전자쌍을 통째로 제공**해 만드는 공유 결합의 일종이다. 두 전자 모두 리간드에서 온다.", "배위수": "배위수 = 중심 금속에 **직접 결합한 주개 원자의 수.** 가장 흔한 배위수는 **4와 6.**", "한자리 리간드": "한자리 리간드는 **하나의 주개 원자**로 금속에 결합한다(결합점 하나). 물, 암모니아, 염화 이온이 대표적이다.", "여러자리 리간드": "여러자리(킬레이트) 리간드는 **두 개 이상의 주개 원자**로 금속을 여러 점에서 붙잡아 고리를 만든다. en(2자리), EDTA(6자리)가 예다.", "킬레이트 효과": "**킬레이트 효과**: 여러자리 리간드 착물은 같은 종류의 한자리 리간드 착물보다 **더 안정**하다. 엔트로피 증가로 설명된다.", "기하 이성질체": "**cis = 같은 리간드가 인접**, **trans = 같은 리간드가 반대편**. 결합 순서는 같고 **공간 배열만** 다르다.", "광학 이성질체": "광학 이성질체는 **서로 거울상이지만 포개지지 않는** 관계다(손과 거울에 비친 손처럼). 분자식·결합 방식은 같고 **거울상 배열**만 다르다.", "평면 사각": "평면 사각 착물(배위수 4)은 네 리간드가 한 평면에 놓이며, **cis-trans 기하 이성질체를 가질 수 있다.** 백금(II) 착물이 대표적이다.", "팔면체": "팔면체 착물은 **여섯 개의 리간드**(배위수 6)가 중심 금속을 둘러싼 구조다. cis-trans, fac-mer 같은 이성질체를 가질 수 있다.", "결정장 이론": "결정장 이론: **리간드가 중심 금속의 d 오비탈 에너지를 분리시킨다.** 리간드와 d 전자 사이의 **정전기적 반발**로 설명한다.", "d 오비탈 분리": "팔면체 장에서 d 오비탈은 **낮은 세 개 + 높은 두 개**로 갈라진다. **리간드를 향한** 오비탈이 더 높은 에너지를 가진다.", "분리 에너지": "분리 에너지 **Δ = 갈라진 두 d 오비탈 무리 사이의 에너지 차이.** 리간드 종류에 따라 달라진다(고정값 아님).", "강한 장": "**강한 장 리간드 → 분리 에너지 Δ 크게.** 약한 장 리간드 → Δ 작게. CN⁻, CO가 강한 장이다.", "저스핀": "**Δ > 짝지음 에너지 → 저스핀.** 전자가 낮은 오비탈에 **먼저 짝을 지어** 채워져 홀전자가 **적다**.", "고스핀": "**Δ < 짝지음 에너지 → 고스핀.** 전자가 짝짓기 전에 **빈 오비탈을 먼저** 채워 홀전자가 **많다**.", "강한 장과 스핀": "**강한 장 리간드 → 저스핀**(Δ 큼), **약한 장 리간드 → 고스핀**(Δ 작음).", "분광화학 계열": "분광화학 계열 = 리간드를 **장의 세기(Δ 크기) 순서**로 배열한 것. CN⁻·CO는 강한 장(Δ 큼), I⁻·Br⁻는 약한 장(Δ 작음).", "착물의 색": "착물의 색은 **d-d 전이**로 빛을 흡수해 나타난다. 우리 눈에는 **흡수한 빛의 보색**이 보인다. 흡수하는 빛의 에너지 = 분리 에너지 Δ.", "자기성": "착물의 자기성은 **홀전자 수**로 결정된다. 홀전자가 있으면 **상자기성**, 모두 짝지어지면 **반자기성**. 고스핀(홀전자 많음)이 저스핀보다 상자기성이 강하다.", "배위수와 구조": "배위수가 구조를 정한다: **6 → 팔면체, 4 → 평면 사각/정사면체, 2 → 직선형.**", "파울리 원리": "**한 오비탈 = 전자 2개, 단 스핀은 반대.** 그 뿌리는 \"**한 원자에 네 양자수가 모두 같은 전자는 없다**\"는 원리다.", "배치 순서": "**1s → 2s → 2p → 3s ...** 낮은 에너지 순서로 채운다. 거꾸로(2p부터)가 아니다.", "에너지 순서": "다전자 원자에서는 **4s가 3d보다 먼저** 채워진다. 오비탈 에너지가 주양자수 n뿐 아니라 **방위 양자수 l에도** 의존하기 때문이다.", "안정 배치": "부껍질이 **절반 채워지거나(d⁵) 가득 차면(d¹⁰)** 특히 안정하다. 그래서 **크로뮴(Cr)·구리(Cu)**는 쌓음 순서를 살짝 어긴 예외 배치를 가진다.", "원자가 전자": "원자가 전자 = **가장 바깥 껍질의 전자**. 화학 결합과 반응성을 **주로 결정**하는 전자다.", "평형 상수": "**Kc = 생성물 농도 / 반응물 농도** (각 농도는 **계수만큼 거듭제곱**). **평형 농도**를 대입한다.", "Kp": "Kp는 기체의 **부분 압력**으로 나타낸 평형 상수다. 계수만큼 거듭제곱하며, 순수한 고체·액체는 제외한다.", "Kc-Kp 관계": "**Kp = Kc(RT)^Δn.** **Δn = (기체 생성물 몰수) − (기체 반응물 몰수)**, T는 **절대 온도**. **Δn = 0이면 Kp = Kc.**", "평형 상수 의미": "**K 크면 생성물 우세**(반응 거의 완결), **K 작으면 반응물 우세**(거의 안 일어남). K는 **평형의 위치**일 뿐 **속도와 무관**.", "평형 상수 의존성": "평형 상수 K는 **오직 온도에만** 의존한다. 농도, 압력, 촉매를 바꿔도 **K는 변하지 않는다**(온도가 같으면).", "반응지수": "Q는 K와 같은 형태지만 **현재(임의 시점) 농도**로 계산한다. **Q < K → 정반응**, **Q > K → 역반응**, **Q = K → 평형**.", "르샤틀리에": "르샤틀리에 원리: 평형에 변화를 주면, 평형은 그 **변화를 줄이는(완화하는) 방향**으로 이동한다.", "촉매와 평형": "촉매는 **평형의 위치를 바꾸지 않는다.** 평형 **도달을 빠르게** 할 뿐이고, 정반응·역반응 속도를 **똑같이** 높인다. K도 불변.", "불활성 기체": "**일정 부피**에서 불활성 기체를 넣어도 평형은 **이동하지 않는다**(반응 기체의 부분 압력·농도가 그대로). 단, **일정 압력**에서 넣어 부피가 늘면 몰수 많은 쪽으로 이동.", "온도와 K": "**오직 온도만 K를 바꾼다.** 발열 반응은 온도↑에 K↓, 흡열 반응은 온도↑에 K↑.", "용해도곱": "Ksp = **난용성 염의 용해 평형 상수**(이온 농도의 곱). 같은 형태 염이면 **Ksp가 클수록 더 잘 녹는다.** 온도에만 의존.", "침전 조건": "**이온곱(Q) > Ksp → 침전 생김.** Q = Ksp → 포화 평형. Q < Ksp → 침전 없음(더 녹을 수 있음).", "Ksp 식": "Ksp = **용해된 이온 농도의 \"곱\"**(각 농도는 계수만큼 거듭제곱). **녹지 않은 순수 고체는 식에서 제외.**", "촉매와 K": "촉매를 넣어도 **평형 상수 K는 변하지 않는다.** 촉매는 평형 **도달 속도**에만 영향을 줄 뿐이다.", "반응 속도": "반응 속도 = **단위 시간당 농도 변화**(반응물 감소 또는 생성물 증가). 반응이 진행될수록 **대체로 점점 느려진다**.", "0차 반응": "0차 반응의 속도는 **농도와 무관하게 일정**(v = k). [A]는 시간에 따라 **직선으로 감소**.", "1차 반응": "1차 반응의 속도는 **농도에 비례**(v = k[A]). **ln[A]-시간** 그래프가 직선, 반감기는 **초기 농도와 무관하게 일정**.", "2차 반응": "2차 반응의 속도는 **농도의 제곱에 비례**(v = k[A]²). **1/[A]-시간** 그래프가 직선, 반감기는 **초기 농도에 반비례**.", "적분 속도식": "차수별로 **직선이 되는 그래프**가 다르다:\n- **0차**: [A]-t 직선\n- **1차**: ln[A]-t 직선\n- **2차**: 1/[A]-t 직선", "반감기": "반감기(농도가 절반 되는 시간)의 농도 의존성은 **차수마다 다르다**:\n- **1차**: t½ = ln2/k → **초기 농도와 무관(일정)**\n- **0차**: 초기 농도에 **비례**\n- **2차**: 초기 농도에 **반비례**", "아레니우스": "**k = A·e^(−Ea/RT).** 온도가 높을수록 k가 **커지고**, 활성화 에너지가 클수록 같은 온도에서 k가 **작다**.", "빈도 인자": "빈도 인자 A = **충돌 빈도 + 방향(배향) 인자**를 반영하는 값. 아레니우스 식 k = A·e^(-Ea/RT)의 앞 인자다.", "온도와 충돌": "온도가 오르면 **활성화 에너지를 넘는 분자의 비율이 커져** 반응이 빨라진다. 활성화 에너지 자체는 **변하지 않는다**.", "메커니즘": "**단일 단계(소반응)**: 속도식을 반응식 **계수로 바로** 쓸 수 있다. **여러 단계 반응**: 속도식을 **메커니즘에서 유도**해야 한다(전체 계수로 바로 쓰면 틀림).", "속도 결정 단계": "여러 단계 반응의 전체 속도는 **가장 느린 단계(속도 결정 단계)**가 결정한다. 전체 속도식은 이 단계에서 유도된다.", "중간체": "반응 중간체는 한 단계에서 **생성**되었다가 이후 단계에서 **소비**된다. 전체 반응식에는 **나타나지 않는다**.", "이온 결합": "이온 결합 = **금속 + 비금속**, 전자를 **주고받아** 생긴 양이온·음이온 사이의 **정전기적 인력**. 공유가 아니다.", "공유 결합": "공유 결합 = **두 비금속**이 전자쌍을 **공유**해 생긴 결합. 공유 전자쌍이 두 핵을 동시에 묶는다.", "결합 세기": "**결합 에너지가 클수록 강하다.** 같은 원자쌍이면 **삼중 > 이중 > 단일**, 그리고 **짧을수록 강하다**.", "루이스 구조": "루이스 구조는 **원자가 전자**를 점과 선으로 그린 그림이다. **선 = 결합(공유) 전자쌍, 점 = 비공유 전자쌍.**", "옥텟 예외": "옥텟은 **만능이 아니다.** 세 종류의 예외를 챙겨라: **옥텟 미만(붕소)**, **확장 옥텟(3주기↑)**, **홀수 전자 분자**.", "형식 전하": "**형식 전하 = (원자가 전자) − (비공유 전자) − (결합 전자 ÷ 2).** 결합 전자는 **절반씩** 나눠 센다. 형식 전하의 **합 = 분자 전체 전하**.", "공명": "공명 = 한 구조로 못 그리는 분자를 **여러 구조의 평균(혼성체)**으로 나타내는 것. 분자는 실제로 그 구조들을 **오가는 게 아니라**, 항상 그 **중간** 상태다.", "분자 극성": "분자 극성 = **결합 극성 + 분자 모양**. 결합이 극성이어도 **대칭이면 상쇄**되어 분자는 무극성이 된다.", "VSEPR": "VSEPR = 중심 원자 주위 **전자 영역들이 반발을 최소화**하도록(서로 최대한 멀어지게) 배치된다. 결합쌍과 비공유 전자쌍을 **모두** 영역으로 센다.", "VSEPR 구조": "전자 영역(입체수)별 기본 배치를 외워라: **2 직선 · 3 평면 삼각 · 4 정사면체 · 5 삼각쌍뿔 · 6 정팔면체.**", "분자 구조": "다섯 개를 통째로 외워라: **CH₄ 정사면체(109.5°) · NH₃ 삼각뿔(107°) · H₂O 굽은형(104.5°) · CO₂ 직선 · BF₃ 평면 삼각.**", "시그마·파이": "**시그마(σ) = 머리를 맞댄 정면 겹침, 파이(π) = 옆으로 겹침.** 결합 분해: **단일 = σ1, 이중 = σ1+π1, 삼중 = σ1+π2.** 첫 결합은 **항상 시그마**.", "분자 오비탈": "두 원자 오비탈이 합쳐지면 **결합성(에너지 낮음)**과 **반결합성(에너지 높음)** 분자 오비탈이 **각각 하나씩** 생긴다. 반결합성에 전자가 들어가면 결합이 **약해진다**.", "결합 차수": "**결합 차수 = (결합성 전자 − 반결합성 전자) / 2.** 반결합성은 **뺀다.** 차수가 **0이면 분자는 형성되지 않는다.**", "방사성 붕괴": "방사성 붕괴 = **불안정한 원자핵**이 입자나 에너지를 방출하며 더 안정한 핵으로 변하는 현상. **핵 안에서** 일어난다.", "알파 붕괴": "알파(α) 붕괴 = **헬륨 핵(질량수 4, 양성자 2) 방출.** 결과: **질량수 -4, 원자 번호 -2**(둘 다 감소).", "베타 붕괴": "베타(β⁻) 붕괴 = **중성자가 양성자로 바뀌며 전자 방출.** 결과: **원자 번호 +1, 질량수 불변.**", "감마 붕괴": "감마(γ) 붕괴 = **고에너지 전자기파(감마선) 방출.** **질량수도 원자 번호도 변하지 않는다.**", "양전자 방출": "양전자 방출(β⁺) = **양성자가 중성자로 바뀌며 양전자 방출.** 결과: **원자 번호 -1, 질량수 불변.**", "Z-N 그래프": "Z-N 그래프 = **양성자 수(Z)와 중성자 수(N)의 관계**로 핵 안정성을 나타낸 그림. 안정한 핵들은 **좁은 안정성 띠**에 모여 있다.", "안정성 비": "**가벼운 안정한 핵: 양성자 ≈ 중성자(비 약 1:1).** **무거운 안정한 핵: 중성자 > 양성자**(비가 1보다 커짐).", "붕괴 속도": "방사성 붕괴는 **1차 반응**을 따른다. 붕괴 속도는 **남아 있는 핵 수에 비례**하고, 그 결과 **반감기가 일정**하다.", "반감기 계산": "반감기가 **n번** 지나면 처음 양의 **(1/2)ⁿ**이 남는다. 절반을 n번 거듭 적용한다.", "연대 측정": "탄소-14 같은 **방사성 동위 원소의 일정한 반감기**를 이용해, **남아 있는 비율**로 유물·화석의 연대를 측정한다.", "질량 결손": "질량 결손 = 핵의 질량이 그 **구성 입자(양성자·중성자) 질량의 합보다 작은** 것. 줄어든 질량이 **결합 에너지**로 바뀐다.", "질량-에너지": "질량과 에너지의 관계: **E = mc².** c는 빛의 속도이며, c²이 매우 커서 **작은 질량도 큰 에너지**가 된다.", "핵자당 결합 에너지": "핵자당 결합 에너지(= 결합 에너지 / 핵자 수)는 **철(Fe) 부근에서 가장 크다.** 이 값이 **클수록 핵이 안정**하다.", "핵분열": "핵분열 = **무거운 핵이 가벼운 핵으로 쪼개지며 에너지 방출.** 중성자 충돌로 일어나고, 방출된 중성자가 연쇄 반응을 일으킬 수 있다.", "핵융합": "핵융합 = **가벼운 핵이 합쳐져 무거운 핵이 되며 에너지 방출.** 매우 높은 온도·압력에서 일어난다(태양: 수소 → 헬륨).", "핵에너지": "핵반응에서 방출되는 에너지는 **화학 반응보다 훨씬 크다.** 핵의 **질량이 에너지로 바뀌기**(E = mc²) 때문이다.", "안정화 경향": "핵자당 결합 에너지가 가장 큰 **철(Fe) 부근**을 향해: **무거운 핵은 분열**, **가벼운 핵은 융합**으로 안정해진다.", "족과 원자가 전자": "원자가 전자 수가 같으면 **같은 \"족\"**이다. 주기가 아니다. 그리고 화학적 성질을 결정하는 건 원자가 전자라서, **같은 족이면 성질이 닮는다.**", "전자 배치와 위치": "**주기는 \"껍질 수\", 족은 \"원자가 전자\".** 이 둘을 따로 본다. 전자 배치 하나면 원소의 자리(주기·족)가 완전히 정해진다.", "방위양자수": "방위 양자수 **l = 부껍질(오비탈 모양)**. 범위는 **0부터 n-1까지**. l=0,1,2,3 → s,p,d,f.", "자기양자수": "자기 양자수 **ml = 오비탈의 공간적 방향**. 범위는 **-l부터 +l까지**의 정수 → 한 부껍질에 오비탈 **(2l+1)개**.", "스핀양자수": "스핀 양자수 **ms = +1/2 또는 -1/2**, 딱 두 값. 그래서 한 오비탈에는 **스핀이 반대인 전자 2개**까지만 들어간다(파울리 배타 원리).", "양자수 범위": "네 양자수의 범위를 **사슬처럼** 외워라: **n ≥ 1** → **l: 0 ~ n-1** → **ml: -l ~ +l** → **ms: ±1/2**. 각 단계가 앞 값에 묶여 있다.", "오비탈 기호": "순서 그대로 외워라: **l=0 → s, l=1 → p, l=2 → d, l=3 → f.**", "오비탈 모양": "**s = 구형, p = 아령형.** 그리고 오비탈은 전자가 도는 궤도가 아니라, 전자가 **발견될 확률이 높은 공간(전자 구름)**이다.", "산화·환원 정의": "**산화 = 전자 잃음 → 산화수 증가.** **환원 = 전자 얻음 → 산화수 감소.** (OIL RIG: Oxidation Is Loss, Reduction Is Gain)", "산화제·환원제": "**산화제 = 남을 산화 + 자신은 환원(전자 받음).** **환원제 = 남을 환원 + 자신은 산화(전자 줌).**", "전자 보존": "산화환원 반응에서 **잃은 전자 수 = 얻은 전자 수.** 전자는 생기거나 사라지지 않고 옮겨갈 뿐이다.", "갈바니 전지": "갈바니(볼타) 전지는 **자발적 산화환원 반응**으로 **화학 에너지 → 전기 에너지**를 만든다. 외부 전원이 필요 없다.", "전자 흐름": "전자는 외부 도선을 따라 **산화전극(-) → 환원전극(+)** 으로 흐른다. **전류 방향은 전자와 반대.**", "자유 에너지와 전위": "**ΔG° = -nFE°** (n = 이동한 전자의 몰수, F = 패러데이 상수). **음의 부호** 때문에 E°cell이 양수면 ΔG°가 음수가 되어 자발적이다.", "네른스트 식": "**E = E° - (RT/nF) ln Q** (비표준 조건의 전지 전위). 반응이 진행돼 **평형에 도달하면 E = 0.**", "끓는점 오름·어는점 내림": "비휘발성 용질을 녹이면 **끓는점은 오르고 어는점은 내린다.** 변화량은 **ΔTb = Kb·m, ΔTf = Kf·m**(몰랄 농도에 비례).", "삼투압": "**π = MRT.** 삼투압은 **진할수록(M ↑)·온도 높을수록(T ↑) 크다.** 삼투에서 용매는 **묽은 쪽 → 진한 쪽**으로 이동한다.", "이상 기체": "**PV = nRT.** 그리고 반드시 **절대 온도(K)**. 보일은 **반비례**(PV 일정), 샤를은 **비례**(V ∝ T).", "돌턴 분압": "혼합 기체의 **전체 압력 = 분압의 합.** 한 성분의 **분압 = 전체 압력 × 그 성분의 몰분율.**", "운동론": "기체 분자는 **끊임없이 무질서하게** 운동하고, 충돌은 **완전 탄성**이며, **절대 온도가 평균 운동 에너지에 비례**한다.", "vrms": "**vrms = √(3RT/M).** 핵심은 **제곱근**이다: 온도의 **제곱근에 비례**, 몰질량의 **제곱근에 반비례**.", "그레이엄": "확산(분출) 속도는 **몰질량의 제곱근에 반비례**한다. **가벼운 기체가 빠르게** 퍼진다.", "실제 기체": "실제 기체는 **분자 부피와 분자 간 힘이 있다.** **고압·저온에서 이상 기체를 벗어나고**, **저압·고온에서 가까워진다.**", "반데르발스": "반데르발스 방정식은 이상 기체 식을 실제 기체에 맞게 보정한다. **a = 분자 간 인력 보정, b = 분자 자체 부피 보정.**", "끓는점": "끓는점 = 액체의 **증기압이 외부 압력과 같아지는** 온도. **외부 압력이 높으면 끓는점도 높다.**", "점도·표면장력": "점도와 표면장력은 **분자 간 힘이 클수록 커지고, 온도가 오르면 작아진다.**", "점도": "점도 = 액체가 **흐름에 저항하는 정도.** 점도가 크면 **잘 안 흐른다**(꿀 > 물).", "상평형 그림": "상평형 그림은 **온도와 압력**에 따른 상을 나타낸다. **삼중점 = 세 상(고체·액체·기체) 공존**, **임계점 = 그 너머에서 액체·기체 구분이 사라지는 점**.", "몰랄 농도": "몰랄 농도 = **용매 1 kg**에 녹은 용질의 **몰수**(mol/kg). 질량 기준이라 **온도가 변해도 일정**하다.", "엔트로피": "엔트로피 S = **무질서도**(가능한 배열 방식의 수). 같은 물질이면 **고체 < 액체 < 기체** 순으로 크다.", "제2법칙": "제2법칙: 자발적 과정에서는 **우주(계 + 주위)의 총 엔트로피가 증가**한다. **계의** 엔트로피는 줄 수도 있다.", "제3법칙": "제3법칙: **0 K의 완전한 결정의 엔트로피는 0이다.** 단 하나의 배열만 가능하기 때문이다.", "엔트로피 변화": "**무질서해지면 엔트로피 증가.** 기체 생성, 녹음, 끓음, 용해, 온도 상승, 기체 분자 수 증가 → 모두 ΔS > 0.", "내부 에너지": "내부 에너지 U는 **상태 함수**다. 변화량은 **경로와 무관**하게 처음과 나중 상태로만 정해진다. 반면 **열(q)과 일(w)은 경로 함수**다.", "제1법칙": "**ΔU = q + w.** 내부 에너지 변화 = 출입한 열 + 출입한 일. 본질은 **에너지 보존**(새로 생기거나 사라지지 않음).", "부호 규약": "**계 입장에서 \"받으면 +, 주면 -\".** 열: 흡수 q > 0, 방출 q < 0. 일: 받음(압축) w > 0, 함(팽창) w < 0.", "일의 부호": "**팽창 → w < 0**(계가 일을 함). **압축 → w > 0**(계가 일을 받음).", "정적 과정": "부피가 일정하면 **팽창·압축 일이 0**(w = 0)이라, 출입한 열이 곧 **내부 에너지 변화**다: **q = ΔU.**", "정압 과정": "압력이 일정하면 출입한 열이 곧 **엔탈피 변화**다: **q = ΔH.** 이때 부피는 변할 수 있어 팽창·압축 일이 생긴다.", "팽창과 일": "일정 압력에서 기체가 **팽창하면 계가 주위에 일을 한다.** 일의 크기는 **압력 × 부피 변화**(P·ΔV).", "자유 에너지": "**G = H - TS.** 깁스 자유 에너지는 일정 온도·압력에서 **자발성을 판단하는 기준**이다(ΔG < 0이면 자발적).", "자유 에너지와 평형": "**ΔG° = -RT ln K.** 그래서 **K > 1 → ΔG° < 0**(생성물 우세), **K < 1 → ΔG° > 0**, **K = 1 → ΔG° = 0**."};

async function loadSeeds(){ try{ var r=await fetch('appdata/seeds.json',{cache:'no-store'}); if(r.ok) SEEDS=(await r.json())||{}; }catch(e){ SEEDS={}; } }
function seedSliceFor(course,round){ return (SEEDS&&SEEDS[course]&&SEEDS[course][round])||{}; }
function rEsc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rptEstRates(stats,seed){
  seed=seed||{}; var K=5, byU={}, cnt={};
  stats.forEach(function(x){ if(x.rate!=null){ (byU[x.u]=byU[x.u]||[]).push(x.rate); cnt[x.u]=(cnt[x.u]||0)+1; } });
  var um={}; Object.keys(byU).forEach(function(u){ var a=byU[u]; um[u]=a.reduce(function(s,v){return s+v;},0)/a.length; });
  var allR=stats.filter(function(x){return x.rate!=null;}).map(function(x){return x.rate;});
  var g=allR.length?(allR.reduce(function(s,v){return s+v;},0)/allR.length):0.5;
  function priorOf(x){ var s=(x.c!=null)?seed[x.c]:null; if(typeof s==='number') return s; if(x.lvl!=null && LVL_PRIOR[x.lvl]!=null) return LVL_PRIOR[x.lvl]; return (cnt[x.u]>=2?um[x.u]:g); }
  return stats.map(function(x){ var pr=priorOf(x); var est=(x.rate!=null)?((x.tot*x.rate+K*pr)/(x.tot+K)):pr; return {i:x.i,s:x.s,c:x.c,u:x.u,a:x.a,lvl:x.lvl,ok:x.ok,tot:x.tot,rate:x.rate,est:est}; });
}
function buildCohortStats(items, cohort){
  return items.map(function(it,i){ var c=(cohort.items&&cohort.items[i])||{o:0,x:0}; var o=c.o||0, x=c.x||0, tot=o+x; var ok=(it.a==='O'?o:x); return {i:i, s:it.s, c:it.c, u:it.u, a:it.a, lvl:it.lvl, ok:ok, tot:tot, rate:tot?ok/tot:null}; });
}
function rptQuadrant(answers, est){
  var ans=answers||'', b={ew:[],hw:[],mw:[],ec:[],hc:[]};
  est.forEach(function(x){ if(x.est==null)return; var a=ans.charAt(x.i); if(a!=='O'&&a!=='X')return; var ok=(a===x.a), easy=x.est>=0.7, hard=x.est<0.5;
    if(ok){ if(easy)b.ec.push(x); else if(hard)b.hc.push(x);} else { if(easy)b.ew.push(x); else if(hard)b.hw.push(x); else b.mw.push(x);} });
  function acc(f){ var ok=0,t=0; est.forEach(function(x){ if(!f(x))return; var a=ans.charAt(x.i); if(a==='O'||a==='X'){t++; if(a===x.a)ok++;} }); return t?{a:ok/t,t:t}:null; }
  return {b:b, easy:acc(function(x){return x.est!=null&&x.est>=0.7;}), hard:acc(function(x){return x.est!=null&&x.est<0.5;})};
}
async function loadRoundItems(course, round){
  var fn='round_'+course+'_'+String(round).padStart(2,'0')+'.json';
  try{ var r=await fetch('appdata/'+fn,{cache:'no-store'}); if(r.ok){ var j=await r.json(); return (j.jeongsi&&j.jeongsi.items)||null; } }catch(e){}
  if(course==='ch2'&&round===7&&typeof DEMO_ITEMS!=='undefined') return DEMO_ITEMS;
  return null;
}
async function computeQuad(isDemo){
  QUAD=null;
  try{
    if(isDemo){
      if(typeof DEMO_ITEMS==='undefined'||!DEMO_ITEMS.length) return;
      var items=DEMO_ITEMS, n=20, coh={n:n,items:[]}, ans='';
      for(var i=0;i<items.length;i++){
        var rate=0.45+0.5*(((i*7+3)%10)/9), ok=Math.round(rate*n), key=items[i].a;
        coh.items.push(key==='O'?{o:ok,x:n-ok}:{o:n-ok,x:ok});
        ans += (i%9===0)?(key==='O'?'X':'O'):key;
      }
      QUAD={q:rptQuadrant(ans, rptEstRates(buildCohortStats(items,coh))), round:latest.round, n:n, demo:true};
      return;
    }
    if(!latestRows||!latestRows[0]||!latestRows[0].answers) return;
    var it=await loadRoundItems(latest.course, latest.round);
    if(!it) return;
    var seed=seedSliceFor(latest.course, latest.round);
    var stats;
    if(COHORT){ stats=buildCohortStats(it, COHORT); }
    else { stats=it.map(function(x,i){ return {i:i, s:x.s, c:x.c, u:x.u, a:x.a, lvl:x.lvl, ok:0, tot:0, rate:null}; }); } // 응시 전: 난이도(lvl/시드)만으로 추정
    var est=rptEstRates(stats, seed);
    QUAD={q:rptQuadrant(latestRows[0].answers, est), round:latest.round, n:COHORT?COHORT.n:0, lvlOnly:!COHORT};
  }catch(e){ QUAD=null; }
}
function quadCard(){
  if(!QUAD||!QUAD.q) return '';
  var q=QUAD.q, b=q.b;
  var ewList = b.ew.length ? '<div class="qptitle">먼저 잡을 문항</div><div class="qplist">'+b.ew.slice(0,6).map(function(x){return '<div class="qprow"><span class="qpu">'+rEsc(x.u)+' · 반 정답률 '+Math.round((x.est!=null?x.est:0)*100)+'%</span>'+rEsc(x.s)+'</div>';}).join('')+'</div>' : '';
  var depth='';
  if(q.easy&&q.hard){ var ea=Math.round(q.easy.a*100), ha=Math.round(q.hard.a*100), msg;
    if(ea>=80&&ha<50) msg='쉬운 문항 '+ea+'%, 어려운 문항 '+ha+'%. 기본기는 잡혔고, <b>깊이가 필요한 문항</b>을 함께 채워 가면 됩니다.';
    else if(ea>=80&&ha>=60) msg='쉬운 '+ea+'% · 어려운 '+ha+'%. <b>깊이까지 잘 잡은</b> 안정적인 모습입니다.';
    else if(ea<70) msg='쉬운 문항부터 '+ea+'%. 지금은 <b>기본 개념을 한 번 더</b> 다지는 데 집중하면 좋습니다.';
    else msg='쉬운 '+ea+'% · 어려운 '+ha+'%. 익숙한 유형의 정확도부터 올려 가면 좋습니다.';

/* ===== 선행 개념 점검 (PREREQ DAG × 누적 단원 숙달도) ===== */
function unitDepth(P){
  var memo={};
  function d(u){ if(memo[u]!=null) return memo[u]; var ps=P[u]||[]; if(!ps.length){memo[u]=0;return 0;} var mx=0; ps.forEach(function(p){ var dp=d(p); if(dp+1>mx)mx=dp+1; }); memo[u]=mx; return mx; }
  Object.keys(P).forEach(function(u){d(u);}); return memo;
}
function prereqCard(){
  var course=latest&&latest.course; var P=PREREQ&&PREREQ[course]; if(!P) return '';
  var agg=(allRows&&allRows[0]&&allRows[0].units)?aggFromRows():{units:CU||CUM_UNITS};
  var M={}; (agg.units||[]).forEach(function(u){ if(u.t>0) M[u.u]=(u.t-u.w)/u.t; });
  var TH=0.7, weak=Object.keys(M).filter(function(u){ return M[u]<TH; });
  if(!weak.length) return '';
  var dep=unitDepth(P);
  weak.sort(function(a,b){ return ((dep[a]||0)-(dep[b]||0)) || (M[a]-M[b]); });
  function pct(u){ return Math.round((M[u]!=null?M[u]:0)*100); }
  function chip(u){ var m=M[u]; var cls=(m==null)?'pq-un':(m<0.5?'pq-lo':m<0.7?'pq-mid':'pq-hi'); return '<span class="pqchip '+cls+'">'+rEsc(u)+(m!=null?' '+pct(u)+'%':'')+'</span>'; }
  var roots=weak.filter(function(u){ var ps=P[u]||[]; return !ps.some(function(p){ return M[p]!=null && M[p]<TH; }); });
  var firstU = roots.length ? roots.slice().sort(function(a,b){return M[a]-M[b];})[0] : weak[0];
  var rows=weak.slice(0,6).map(function(u){
    var ps=(P[u]||[]), weakPs=ps.filter(function(p){ return M[p]!=null && M[p]<TH; });
    var detail = weakPs.length
      ? '먼저 다질 선행 · '+weakPs.map(function(p){return chip(p);}).join(' ')
      : (ps.length ? '선행('+ps.map(rEsc).join(', ')+')은 탄탄 · 이 단원 자체를 보강' : '기초 단원 · 여기부터 다집니다');
    return '<div class="pqrow"><div class="pqhead">'+chip(u)+(u===firstU?' <span class="pqfirst">최우선</span>':'')+'</div><div class="pqdetail">'+detail+'</div></div>';
  }).join('');
  return '<div class="card"><h2>선행 개념 점검</h2>'
    +'<p class="note" style="margin:-6px 0 10px">약한 단원이 어떤 선행 개념 위에 서는지 봅니다. 위층 단원이 약해도 그 아래 선행이 더 약하면 <b>선행부터 메우는 게 빠릅니다.</b> 빨강(50% 미만)·주황(50~70%)이 보강 대상입니다.</p>'
    +'<div class="pqlead">먼저 다질 단원 · <b>'+rEsc(firstU)+'</b> ('+pct(firstU)+'%)</div>'
    +rows+'</div>';
}

      : '이번 회차는 재시 없이 <b>첫 시도에 '+_fsD+'점</b>으로 통과했습니다.';
  } else if(latest.passed && _rec>0){
    _week = '이번 회차는 첫 시도 '+_jsD+'점에서 재시로 <b>'+_fsD+'점</b>까지 끌어올려 통과했습니다.';
  } else if(_rec>0){
    _week = '이번 회차는 '+_jsD+'점에서 <b>'+_fsD+'점</b>까지 좁혔고, 통과선까지 '+sc1(80-_fs)+'점을 남겨두고 있습니다. 강의록을 다진 뒤 재시로 채웁니다.';
  } else {
    _week = '이번 회차 첫 시도는 <b>'+_fsD+'점</b>, 통과선까지 '+sc1(80-_fs)+'점을 남겨두고 있습니다. 강의록을 다진 뒤 재시로 채웁니다.';
  }
  var _thesis, _detail='';
  if(_pre){ _thesis=_pre.trim(); _detail=_week; } else { _thesis=_week; }
  h+=`<div class="card hero">
    <div class="verdict5 ${status.c}"><span class="sig"></span>${status.k} · ${status.t}</div>
    <div class="who">${A.info.name} · ${A.info.school} · ${CRSLBL[latest.course]||'화학'} 누적 OX 진단</div>
    <div class="line">${_thesis}</div>
    ${_detail?`<div class="linesub">${_detail}</div>`:''}
    ${risk.note?`<div class="herosub">${risk.note}</div>`:''}
    <div class="herorow">
      <div class="stat">
        <div><div class="k">${A.passedRounds}/${A.trend.length}</div><div class="l">통과 회차</div></div>
        ${avgRec>0?`<div><div class="k">+${avgRec}</div><div class="l">재시로 올린 점수</div></div>`:`<div><div class="k">${A.trend.length*60}</div><div class="l">점검한 문항</div></div>`}
        <div><div class="k">1~${A.coverageRound}</div><div class="l">지금까지 다룬 회차</div></div>
      </div>
      <div class="sparkbox">${spark(finals,84,34)}<div class="sparkl">최종 점수 추이</div></div>
    </div></div>`;

  h+=hwQuickHTML();

  // 한 학기 성장 · 누적 성과 + 추세 (재등록 근거)
  if(A.trend.length>=2){
    var _dts=(allRows||[]).map(function(r){return r.date;}).filter(Boolean).sort();
    var _fmtM=function(d){var p=(d||'').split('-');return p.length>=2?(p[0].slice(2)+'.'+(+p[1])):'';};
    var _span=_dts.length?(_fmtM(_dts[0])+' ~ '+_fmtM(_dts[_dts.length-1])):'';
    var _masteredN=agg.units.filter(function(u){return u.t>0&&(u.t-u.w)/u.t>=0.85;}).length;
    var _passN=(typeof A.passedRounds==='number')?A.passedRounds:A.trend.filter(function(t){return t.passed;}).length;
    var _n=A.trend.length;
    var _js=A.trend.map(function(t){return t.jeongsiScore;}).filter(function(v){return v!=null;});
    var _half=Math.ceil(_js.length/2), _fh=_js.slice(0,_half), _lh=_js.slice(_half);
    var _fhA=_fh.reduce(function(a,v){return a+v;},0)/(_fh.length||1);
    var _lhA=_lh.length?_lh.reduce(function(a,v){return a+v;},0)/_lh.length:_fhA;
    var _jsDelta=Math.round(_lhA-_fhA);
    var _t3v,_t3l;
    if(_masteredN>0){_t3v=String(_masteredN);_t3l='탄탄한 단원';}
    else if(avgRec>0){_t3v='+'+avgRec;_t3l='재시 평균 상승';}
    else {_t3v=String(_n);_t3l='응시 회차';}
    var _gline=_jsDelta>=3
      ? '첫 응시 실력이 학기 초보다 평균 <b>+'+_jsDelta+'점</b> 올랐습니다. 재시 없이도 맞히는 문제가 늘고 있다는 뜻입니다.'
      : '매 회차 약점을 바로잡으며 실력을 다지고 있습니다. 고친 개념이 곧 다음 회차의 실력이 됩니다.';
    h+=`<div class="card growth"><h2>한 학기 성장${_span?' · '+_span:''}</h2>
      <div class="growthrow">
        <div class="gcell"><div class="gv">${ccum}</div><div class="gl">바로잡은 개념</div></div>
        <div class="gcell"><div class="gv">${_passN}<span class="gu">/${_n}</span></div><div class="gl">통과 회차</div></div>
        <div class="gcell"><div class="gv">${_t3v}</div><div class="gl">${_t3l}</div></div>
      </div>
      <p class="note" style="margin-top:11px">${_gline}</p></div>`;
  }
  if(risk.level!=='안정' && risk.reasons.length){
    h+=`<div class="card warn"><h2>지금 살펴볼 신호</h2><ul class="warnlist">${risk.reasons.map(function(r){return '<li>'+r+'</li>';}).join('')}</ul>
      <p class="note" style="margin-top:8px">무너지기 전에 미리 잡는 단계입니다. 이번 주 처방을 우선 진행해 주세요.</p></div>`;
  }

  // 이번 회차
  h+=dxDeepHTML((A.info&&A.info.name)||'학생',{wrongConcepts:(window._deepWrong||[])});
  h+=`<div class="card"><h2>이번 회차 · ${latest.round}회</h2>
    <div class="ladder">${latestRows.map(r=>`<div class="lnode ${r.pass?'p':'f'}"><div class="sc mono">${r.score}</div><div class="at">${LBL(r.attempt)}</div><div class="chip">${r.pass?'통과':'통과 전'}</div></div>`).join('')}</div>
    ${latestWrong.length?`<div style="margin-top:14px"><div class="muted" style="margin-bottom:6px">이번 회차에서 바로잡은 개념</div>${latestWrong.map(m=>`<span style="display:inline-block;font-size:12px;background:var(--teal-soft);color:var(--teal-d);border-radius:20px;padding:3px 11px;margin:2px 4px 2px 0;font-weight:600">${m}</span>`).join('')}</div>`:''}</div>`;

  // 잘하고 있는 부분 · 적응형 (부진 학생도 진짜 긍정 앵커 보장, 가짜 칭찬 금지)
  var uacc=agg.units.filter(function(u){return u.t>0;}).slice().sort(function(a,b){return (b.t-b.w)/b.t-(a.t-a.w)/a.t;});
  var mastered=uacc.filter(function(u){return (u.t-u.w)/u.t>=0.85;}).slice(0,6);
  if(mastered.length){
    h+=`<div class="card strength"><h2>잘하고 있는 부분</h2>
      <p class="note" style="margin:-6px 0 10px">이미 탄탄하게 잡은 단원입니다. 여기는 자신감을 가져도 좋아요.</p>
      <div class="strchips">${mastered.map(function(u){var p=Math.round(100*(u.t-u.w)/u.t);return '<span class="strchip">'+u.u+' <b>'+p+'%</b></span>';}).join('')}</div></div>`;
  } else {
    var nearList=uacc.slice(0,3).filter(function(u){return Math.round(100*(u.t-u.w)/u.t)>=55;});
    var sTitle, sLead;
    if(avgRec>0){
      sTitle='끌어올리는 힘';
      sLead='점수만 보면 아직이지만, 약한 곳을 만날 때마다 재시로 끌어올립니다. 재시 평균 <b>+'+avgRec+'점</b>'+(ccum>0?', 지금까지 <b>'+ccum+'개</b> 개념을 바로잡았습니다.':'.');
    } else {
      sTitle='여기서부터 채워 갑니다';
      sLead='이제 막 시작이라 점수는 낮지만, 어디를 채우면 되는지 정확히 보입니다.'+(latestWrong.length?' 이번 회차에만 <b>'+latestWrong.length+'개</b> 개념을 바로잡았어요.':'');
    }
    h+=`<div class="card strength"><h2>${sTitle}</h2>
      <p class="note" style="margin:-6px 0 ${nearList.length?'10px':'0'}">${sLead}</p>
      ${nearList.length?`<div class="strchips">${nearList.map(function(u){var p=Math.round(100*(u.t-u.w)/u.t);return '<span class="strchip">'+u.u+' <b>'+p+'%</b></span>';}).join('')}</div><p class="note" style="margin-top:7px">가장 자리 잡아가는 단원입니다. 여기부터 발판을 넓혀 갑니다.</p>`:''}</div>`;
  }

  // 이번 주 확인할 개념: 실제 문장 앵커 질문 → 막히면 설명 → 함께 읽기
  var todoMis=(A.chronicMis[0]?A.chronicMis[0].mis:(latestWrong[0]||null));
  if(todoMis){ var todoOl=ONELINE[todoMis]||''; var todoCore=CORE[todoMis]||todoOl;
    var _anchors=(window._deepWrong||[]).filter(function(x){return x.mis===todoMis&&(x.f||x.s);});
    var _a0=_anchors[0]||null;
    var _corePlain=(todoCore||'').replace(/\*\*/g,'');
    var _coreSent=''; if(_corePlain){ var _ci=_corePlain.indexOf('다. '); _coreSent=_ci>=0?_corePlain.slice(0,_ci+2):_corePlain; if(_coreSent.length>90) _coreSent=''; }
    var qline;
    if(_a0){ qline='"'+_esc(_a0.f||_a0.s)+'" 이 문장이 왜 맞는지, 네 말로 설명해 볼래?'; }
    else if(_coreSent){ qline='"'+_esc(_coreSent)+'" 이게 왜 그런지, 네 말로 설명해 볼래?'; }
    else { qline='"'+todoMis+'"에서 배운 것 중 맞는 문장을 하나 골라서, 왜 맞는지 설명해 볼래?'; }
    var _expl = todoCore? md(todoCore) : (_a0&&_a0.w? _esc(_a0.w) : '');
    var _reads=_anchors.slice(0,2);
    h+=`<div class="card todo">
      <div class="todohead"><span class="todotag">이번 주 확인할 개념</span><span class="todomis">${todoMis}</span></div>
      <div class="todointro">아이가 스스로 설명해 볼 때 개념이 진짜로 남습니다. 아래 질문을 그대로 건네고, 아이의 설명을 들어봐 주세요.</div>
      <div class="todohome"><span class="tlab">이렇게 물어봐 주세요</span>${qline}</div>
      ${_expl?`<div class="todocore"><span class="tlab">잘 대답하지 못하면, 이렇게 설명해 주세요</span>${_expl} 그런 다음 "그럼 왜 그렇게 될까?"를 한 번 더 같이 짚어 보세요.</div>`:''}
      ${_reads.length?`<div class="todoread"><span class="tlab">그래도 어려워하면, 아래 내용을 함께 읽어 주세요</span>${_reads.map(function(x){return '<div class="tritem"><div class="trf">'+_esc(x.f||x.s)+'</div>'+(x.w?'<div class="trw"><b>해설</b> '+_esc(x.w)+'</div>':'')+'</div>';}).join('')}</div>`:''}
      <div class="todoguide">한 번에 정확히 답하지 못해도 괜찮습니다. 막히는 지점을 함께 짚어 가는 과정 자체가 가장 좋은 공부입니다.${todoOl?'<br><span class="gmuted">한 줄 정리 · '+md(todoOl)+'</span>':''}</div>
    </div>`; }

  // 추이
  h+=`<div class="card"><h2>점수 추이 · 응시한 회차</h2>
    <div class="chartwrap">${svgTrend()}</div>
    <div class="legend"><span><i style="border-color:#0B6E6E"></i>최종(재시 반영)</span><span><i style="border-color:#9FC9C4;border-top-style:dashed"></i>첫 응시</span></div>
    <p class="note" style="margin-top:10px">미응시 회차는 표시하지 않고 응시한 지점만 잇습니다. ${(A.coverageRound>A.trend.length)?'1~'+A.coverageRound+'회 중 '+A.trend.length+'개 회차를 응시했고, 이 진단은 응시한 회차 기준입니다. ':''}누적 시험이라 빠진 범위도 다음 시험이 따라잡습니다.</p></div>`;

  // (교정 누적 corr/ccum은 강점 카드 앞에서 계산 · 여정 카드에서 사용)
  // A18: 통과자 심화 · 핵심 개념의 '한 겹 더' 내용을 core에서 자동 추출해 연결
  if(allPass){
    var deepSeed=(A.chronicMis.length?A.chronicMis.map(function(m){return m.mis;}):(latestWrong||[])).slice(0,4);
    var deepItems=deepSeed.map(function(c){
      var core=(CORE[c]||'').replace(/\*\*(.+?)\*\*/g,'$1');
      var parts=core.split(/[.。]/).map(function(x){return x.trim();}).filter(function(x){return x.length>6;});
      var deep=parts.slice(1).join('. '); if(deep) deep+='.';
      if(!deep){ deep=(ONELINE[c]||'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/^\s*[^.。]*[.。]/,'').replace(/^\s*[\(（][^)）]*[\)）]\s*/,'').trim(); }
      return {c:c, deep:deep};
    }).filter(function(x){return x.deep && x.deep.length>10;}).slice(0,3);
    h+=`<div class="card" style="border-left:4px solid var(--teal)"><h2>다음 단계 · 한 겹 더</h2>
      <p style="font-size:13.5px;margin:0 0 12px">모든 회차를 안정적으로 통과하고 있습니다. 이제 욕심내 볼 단계예요. 아래는 <b>아이가 더 도전하고 싶을 때</b> 한 걸음 더 들어갈 심화 내용과 문항입니다. 필수는 아닙니다.</p>
      ${deepItems.length?deepItems.map(function(x){return '<div class="rx"><div class="top"><span class="nm">'+x.c+'</span><span class="freq">심화</span></div><div class="ol"><b>한 겹 더:</b> '+md(x.deep)+'</div></div>';}).join(''):''}
      <a class="cbtn" href="challenge.html?course=${latest.course}"><span>심화 문항으로 새로운 난이도에 도전</span><span class="cgo">도전하기 →</span></a>
      <p class="cbtnnote">부모님은 "한번 해볼래?" 정도로 가볍게 권해 주시면 충분합니다.</p></div>`;
  }

  // 단원 마스터리(A13) · 누적 총계 기반 (agg는 render 상단에서 계산)
  h+=`<div class="card"><h2>단원별 정답률</h2>
    <p class="note" style="margin:-6px 0 10px">누적 단원별 정답률(맞은/전체). 초록은 이미 탄탄한 단원, 빨강은 다음에 함께 채워갈 단원입니다.</p>
    ${unitHeat(agg.units)}</div>`;
  h+=quadCard();
  h+=prereqCard();

  // 다시 볼 개념 (자주 막히는 + 복습 타이밍 통합)
  var chronicSet={}; A.chronicMis.forEach(function(m){chronicSet[m.mis]=1;});
  var review=ChemEngine.spacedReview(allRows, latest.round).filter(function(x){return !chronicSet[x.mis];}).slice(0,4);
  h+=`<div class="card"><h2>다시 볼 개념</h2>
    <div class="subhead">반복해서 막히는 곳</div>
    <p class="note" style="margin:2px 0 12px">여러 번 같은 지점에서 멈췄던 개념입니다. 반복해서 드러났다는 건 <b>정확히 어디를 도우면 되는지 보인다</b>는 뜻이고, 지금 집중해서 잡고 있는 지점입니다.</p>
    ${A.chronicMis.length?A.chronicMis.map(m=>`<div class="rx"><div class="top"><span class="nm">${m.mis}</span><span class="freq">${m.rounds}개 회차 반복</span></div>${ONELINE[m.mis]?`<div class="ol"><b>핵심:</b> ${md(ONELINE[m.mis])}</div>`:''}</div>`).join('')
      :'<p class="muted">반복해서 막히는 개념 없음. 안정적입니다.</p>'}
    ${review.length?`<div class="subhead" style="margin-top:16px">한 번씩 놓친 곳, 복습 시점</div>
    <p class="note" style="margin:2px 0 10px">이전 회차에 한 번씩 놓쳤던 개념입니다. 지금 가볍게 다시 점검하면 오래 갑니다.</p>
    ${review.map(function(x){return '<div class="rvrow"><span class="rvm">'+x.mis+'</span><span class="rvg">'+x.last+'회에서</span></div>';}).join('')}`:''}</div>`;

  // 지금까지의 여정 (바로잡은 개념 누적 + 끝까지 해낸 기록 통합)
  h+=`<div class="card"><h2>지금까지의 여정</h2>
    ${ccum>0?`<p class="note" style="margin:-6px 0 10px">점수만 보면 더뎌 보여도 고쳐낸 개념은 이렇게 쌓입니다. 이게 진짜 전진입니다.</p>
    <div class="chartwrap">${svgCum(corr)}</div>
    <p class="note" style="margin:8px 0 0">지금까지 <b>${ccum}개</b> 개념을 바로잡았습니다.</p>
    <div class="subhead" style="margin-top:16px">회차별 마무리</div>`:`<div class="subhead">회차별 마무리</div>`}
    ${(function(){
      var _ord=new Proxy({},{get:function(_o,k){k=String(k);var n=0;for(var i=0;i<k.length;i++){if(k.charAt(i)==='재')n++;}return n;}});
      function _atts(t){ return (allRows||[]).filter(function(r){return r.course===t.course&&Number(r.round)===Number(t.round);}).sort(function(a,b){return (_ord[a.attempt]||0)-(_ord[b.attempt]||0);}); }
      var allP=A.trend.every(function(t){ return _atts(t).some(function(a){return a.pass;}); });
      var rowsH=A.trend.map(function(t){
        var atts=_atts(t); var pIdx=-1; for(var i=0;i<atts.length;i++){ if(atts[i].pass){ pIdx=i; break; } }
        var n=atts.length||t.attemptsCount||1;
        var lbl=pIdx>=0?((_ord[atts[pIdx].attempt]||0)===0?'첫 응시에 통과':(_ord[atts[pIdx].attempt]||0)===1?'재시에서 통과':'재재시에서 통과'):'아직 통과 전 · '+n+'회 응시';
        var dots=Array.from({length:n}).map(function(_,i){ return '<span class="adot '+((pIdx>=0&&i===pIdx)?'p':'r')+'">'+(i+1)+'</span>'; }).join('');
        return '<div class="kv"><span>'+t.round+'회 <span class="muted">'+lbl+'</span></span><span class="dots">'+dots+'</span></div>';
      }).join('');
      return rowsH+'<p class="note" style="margin-top:10px">'+(allP?'응시한 회차를 모두 통과로 마감했습니다.':'응시한 회차의 진행 상황입니다. 아직 통과 전인 회차는 강의록을 다진 뒤 재시로 채우면 됩니다.')+'</p>';
    })()}</div>`;

  // 마감 · 서명 + 다음 점검 + 관계
  h+=roundCardsHTML();
  if(!_EMBED) h+='<div id="main-sols"></div>';
  if(!_EMBED) h+=`<div class="card closing">
    <p class="closetext"><b>한 번의 점수가 아니라, 끝까지 채워 가는 과정을 봅니다.</b> 아이가 약한 곳을 만나도 다시 잡아 통과까지 가는 이 걸음을, 다음 회차에서 또 함께 기록하겠습니다.</p>
    <div class="sign">궁금한 점은 언제든 편하게 말씀해 주세요.<div class="signname">조준모T · 다원교육 영재관 화학</div></div>
  </div>`;

  if(commit===false){return h;}
  $('#app').innerHTML=h;
}
async function boot(){
  await loadSeeds();
  try{
    var sp=new URLSearchParams(location.search), student=sp.get('student');
    if(REPORT_URL && student){
      var r=await fetch(REPORT_URL+'?student='+encodeURIComponent(student)+'&t='+Date.now(), {cache:'no-store'});
      var j=await r.json();
      if(j && j.cumulative){ A=j.cumulative; allRows=j.rows||[]; RANK=j.rank||null; COHORT=j.cohort||null; }
    }
  }catch(e){ console.warn('리포트 데이터 로드 실패, 데모로 표시', e); }
  var demoHard=(new URLSearchParams(location.search).get('demo')==='hard');
  var isDemo=!A;
  if(!A){ var src=demoHard?SYN_HARD:SYN; var c=ChemEngine.cumulative(src); A=c[Object.keys(c)[0]]; allRows=src;
    if(demoHard){ CU=CUM_UNITS_HARD; CX=CUM_AXES_HARD; } }
  if(isDemo && !demoHard) RANK=DEMO_RANK;  // 데모(SYN)일 때만 데모 석차; 실제 학생은 실제 석차(없으면 석차 카드 숨김→qualCard)
  A.info = A.info || { name:(allRows[0]||{}).name||'학생', school:(allRows[0]||{}).school||'' };
  HWROWS=(allRows||[]).filter(function(r){return r.course==='jm1';});
  var _oxTrend=(A&&A.trend?A.trend:[]).filter(function(t){return t.course!=='jm1';});
  if(HWROWS.length && !_oxTrend.length){ renderHwOnly(); return; }
  if(!A.trend || !A.trend.length){
    if(HWROWS.length){ renderHwOnly(); return; }
    document.getElementById('app').innerHTML='<div class="card"><p class="lede">아직 응시 기록이 없습니다. 첫 시험을 채점하면 리포트가 채워집니다.</p></div>'; return; }
  latest=A.trend[A.trend.length-1];
  latestRows=(allRows||[]).filter(function(r){return r.course===latest.course&&r.round===latest.round;}).sort(function(a,b){return (ORD[a.attempt]||0)-(ORD[b.attempt]||0);});
  latestWrong=Array.from(new Set(latestRows.reduce(function(acc,r){return acc.concat(r.wrongMis||[]);},[])));
  window._deepWrong=[];
  try{ var _di=await loadRoundItems(latest.course,latest.round); var _da=(latestRows[0]&&latestRows[0].answers)||''; if(_di&&_da){ _di.forEach(function(it,i){ if(_da[i]!==it.a) window._deepWrong.push({c:it.c,unit:it.u,mis:it.mis,s:it.s,f:it.f,w:it.w}); }); } }catch(e){}
  if(demoHard && !window._deepWrong.length){ window._deepWrong=[{c:'CH2-136',unit:'총괄성',mis:'총괄성 정의'},{c:'CH2-149',unit:'총괄성',mis:'총괄성 크기'},{c:'CH2-117',unit:'농도',mis:'몰농도 온도'},{c:'CH2-043',unit:'이상기체',mis:'운동 에너지와 온도'},{c:'CH2-078',unit:'액체',mis:'끓는점 정의'}]; }
  await computeQuad(isDemo);
  render();
  try{ await fillMainSolutions(); }catch(e){}
}
/* ==================== 숙제(조준모의고사 화학 I, course=jm1) 패널 ==================== */
var HWROWS=[], HWMETA=null, HWOPEN=false, HWTAB=null;
function hwLatestByRound(){
  var m={};
  (HWROWS||[]).forEach(function(r){
    var rd=Number(r.round); if(!rd) return;
    var t=new Date(r.date||0).getTime();
    if(!m[rd] || t>=m[rd]._t){ r._t=t; m[rd]=r; }
  });
  return m;
}
function hwWeeklyOn(){
  if(!HWROWS.length) return false;
  var ref=null;
  (allRows||[]).forEach(function(r){ if(r.course==='jm1') return; var t=new Date(r.date||0).getTime(); if(!ref||t>ref) ref=t; });
  if(!ref) ref=Date.now();
  return HWROWS.some(function(r){ var t=new Date(r.date||0).getTime(); return t<=ref+86400000 && (ref-t)<=8*86400000; });
}
function hwQuickHTML(){
  if(typeof _EMBED!=='undefined' && _EMBED) return '';
  if(!HWROWS || !HWROWS.length) return '';
  var by=hwLatestByRound(), rds=Object.keys(by).map(Number).sort(function(a,b){return a-b;});
  var badge=hwWeeklyOn();
  var total=(HWMETA&&HWMETA.rounds_total)||13;
  var slots=''; for(var i=1;i<=total;i++){ var row=by[i];
    slots+='<span class="hwslot'+(row?(row.pass?' done':' half'):'')+'" title="'+i+'회'+(row?(' \u00b7 '+row.score+'점'):' \u00b7 미제출')+'">'+i+'</span>'; }
  return '<div class="card hwq"><button type="button" class="hwqbtn" onclick="toggleHwPanel()">'+
    '<span class="hwqt">숙제 제출 \u00b7 피드백 보기</span>'+
    (badge?'<span class="hwbadge on">이번 주 제출</span>':'<span class="hwbadge">이번 주 미제출</span>')+
    '<span class="hwqn">'+rds.length+'/'+total+'회</span><span class="hwqarr" id="hwqarr">\u25be</span></button>'+
    '<div class="hwstrip">'+slots+'</div>'+
    '<div id="hwPanel" style="display:none"></div></div>';
}
async function loadHwMeta(){
  if(HWMETA) return HWMETA;
  try{ var res=await fetch('appdata/hw_jm1.json',{cache:'no-store'}); if(res.ok) HWMETA=await res.json(); }catch(e){}
  return HWMETA;
}
async function toggleHwPanel(force){
  var p=document.getElementById('hwPanel'); if(!p) return;
  HWOPEN=(force===true)?true:((force===false)?false:!HWOPEN);
  p.style.display=HWOPEN?'block':'none';
  var ar=document.getElementById('hwqarr'); if(ar) ar.textContent=HWOPEN?'\u25b4':'\u25be';
  if(HWOPEN && !p.innerHTML){ p.innerHTML='<div class="re-loading">불러오는 중\u2026</div>'; await hwRenderPanel(); }
}
async function hwRenderPanel(){
  var p=document.getElementById('hwPanel'); if(!p) return;
  await loadHwMeta();
  var by=hwLatestByRound(), rds=Object.keys(by).map(Number).sort(function(a,b){return a-b;});
  if(!rds.length){ p.innerHTML='<div class="re-loading">숙제 기록이 없습니다.</div>'; return; }
  if(!HWTAB || !by[HWTAB]) HWTAB=rds[rds.length-1];
  var tabs=rds.map(function(rd){ return '<button type="button" class="hwrndbtn'+(rd===HWTAB?' on':'')+'" onclick="hwPick('+rd+')">'+rd+'회</button>'; }).join('');
  p.innerHTML='<div class="hwtabs">'+tabs+'</div><div id="hwdetail">'+hwDetailHTML(by[HWTAB])+'</div>';
}
function hwPick(rd){ HWTAB=rd; hwRenderPanel(); }
function hwDetailHTML(row){
  if(!row) return '';
  var meta=HWMETA||{}, keyArr=((meta.key||{})[String(row.round)])||null;
  var ri=null; ((meta.rounds)||[]).forEach(function(o){ if(Number(o.r)===Number(row.round)) ri=o; });
  var ans=String(row.answers||'');
  var head='<div class="hwsum"><b>'+row.round+'회</b> \u00b7 <span class="hwscore">'+sc1(row.score)+'점</span> '+
    (row.pass?'<span class="hwpass on">통과</span>':'<span class="hwpass off">미달 \u00b7 80점 이상 통과</span>')+
    (row.date?'<span class="hwdt">'+new Date(row.date).toLocaleDateString('ko-KR')+'</span>':'')+'</div>';
  var solNote=ri?('<div class="hwsol">워크북 해설 p.'+ri.sol_page+'~ 에서 풀이를 확인하세요.</div>'):'';
  if(!keyArr || ans.length<20){
    var wm=(row.wrongMis||[]).filter(function(x){return String(x).trim();});
    var body=wm.length
      ? '<div class="hwlbl">오답 '+wm.length+'문항</div><div class="hwitems">'+wm.map(function(nn){return '<div class="hwitem"><div class="hwih"><span class="hwno">'+_esc(String(nn))+'번</span><span class="sol-ans">오답</span></div></div>';}).join('')+'</div>'
      : '<div class="hwok">전 문항 정답입니다. 훌륭합니다.</div>';
    return head+body+solNote;
  }
  var items=[], g0=(Number(row.round)-1)*20;
  for(var i=0;i<20;i++){
    var my=ans.charAt(i), cor=String(keyArr[i]);
    if(my===cor) continue;
    var g=g0+i+1, mm=((meta.meta)||{})[String(g)]||{};
    items.push('<div class="hwitem"><div class="hwih"><span class="hwno">'+(i+1)+'번 <i class="hwg">(전역 '+g+'번)</i></span>'+
      '<span class="sol-ans">정답 '+cor+' \u00b7 내 답 <b class="wrongpick">'+((my&&my!=='.')?_esc(my):'\u2013')+'</b></span></div>'+
      (mm.stem?'<div class="hwstem">'+_esc(mm.stem)+'</div>':'')+
      '<div class="hwsrc">'+(mm.src?_esc('['+mm.src+']')+' \u00b7 ':'')+(mm.rate?('정답률 '+mm.rate+'% \u00b7 '):'')+(ri?('해설 p.'+ri.sol_page+'~'):'')+'</div></div>');
  }
  var body2=items.length
    ? '<div class="hwlbl">오답 '+items.length+'문항 \u00b7 이번 주 안에 해설지로 복습</div><div class="hwitems">'+items.join('')+'</div>'
    : '<div class="hwok">전 문항 정답입니다. 훌륭합니다.</div>';
  return head+body2+(items.length?solNote:'');
}
function renderHwOnly(){
  var nm=(HWROWS[0]&&HWROWS[0].name)||'학생';
  var h='<div class="card hero"><div class="who">'+_esc(nm)+' \u00b7 조준모의고사 화학 I</div>'+
    '<div class="line">숙제 채점 기록을 먼저 쌓는 중입니다. 누적 OX 진단을 응시하면 전체 리포트가 함께 열립니다.</div></div>';
  h+=hwQuickHTML();
  document.getElementById('app').innerHTML=h;
  toggleHwPanel(true);
}

boot();

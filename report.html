<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성적 진단 리포트 · Chemistreal</title>
<meta property="og:title" content="성적 진단 리포트 · Chemistreal">
<meta property="og:description" content="무너지지 않는 전진 · 회차별 추이와 이번 주 처방">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chemistreal.github.io/DT/report.html">
<meta property="og:image" content="https://chemistreal.github.io/DT/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chemistreal.github.io/DT/og.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{ --paper:#FAFAF7;--surface:#FFFFFF;--ink:#16202E;--sub:#61707F;--faint:#8A95A2;--line:#E7E8E2;--line2:#EEF0EA;
  --teal:#0B6E6E;--teal-d:#0A5A5A;--teal-soft:#E4F0EF;--teal-line:#BFE0DD;--o:#1B8A4C;--o-bg:#E7F5EC;--x:#C0392B;--x-bg:#FBEBE9;
  --brass:#A9853C;--brass-soft:#F5EEDF;--shadow:0 1px 2px rgba(16,32,46,.04),0 6px 20px rgba(16,32,46,.05);}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Pretendard',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:"tnum"}
.wrap{max-width:680px;margin:0 auto;padding:0 14px calc(60px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:680px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:10px}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(150deg,var(--teal),var(--teal-d));position:relative;flex:none}
.logo:after{content:"";position:absolute;inset:6px 6px auto auto;width:6px;height:6px;border-radius:50%;background:var(--brass)}
.dawon-logo{height:30px;width:auto;display:block;flex:none}
.brand{font-weight:800;font-size:14px;letter-spacing:-.01em}.brand small{display:block;font-weight:500;color:var(--sub);font-size:10px;margin-top:-2px}
.seg{margin-left:auto;display:flex;background:var(--line2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--sub);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--teal);box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:13px 0;box-shadow:var(--shadow)}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--teal);font-weight:700;text-transform:uppercase}
h2{font-size:12px;letter-spacing:.05em;color:var(--teal);font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:7px}
h2:before{content:"";width:14px;height:2px;background:var(--teal);border-radius:2px}
.muted{color:var(--faint);font-size:11.5px}.note{color:var(--sub);font-size:11.5px}
.subhead{font-size:12px;font-weight:800;color:var(--teal-d);letter-spacing:.02em;margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.intro{font-size:12.5px;color:var(--sub);line-height:1.6;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;padding:11px 14px;margin-bottom:13px;box-shadow:var(--shadow)}
.intro b{color:var(--teal-d);font-weight:700}
.closing{background:linear-gradient(180deg,var(--teal-soft),var(--surface));border-left:4px solid var(--brass)}
.closetext{font-size:13px;color:var(--ink);line-height:1.62;margin:0 0 13px}.closetext b{color:var(--teal-d)}
.sign{font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;line-height:1.5}
.signname{font-weight:800;color:var(--ink);margin-top:4px;font-size:13.5px;letter-spacing:-.01em}
/* HERO */
.hero{background:linear-gradient(160deg,#0B6E6E,#0A5A5A);color:#fff;border:0;padding:22px 20px}
.hero .eyebrow{color:#9FD8D3}
.hero .who{font-size:13px;color:#CDE7E4;margin-bottom:3px}
.hero .line{font-size:20px;font-weight:800;line-height:1.38;letter-spacing:-.015em;margin:7px 0 0}
.hero .linesub{font-size:15px;font-weight:600;line-height:1.45;color:#CDE7E4;margin:7px 0 0}
.hero .linesub b{color:#fff;font-weight:700;border-bottom:1.5px solid rgba(169,133,60,.7);padding-bottom:1px}
.hero .line b{color:#fff;border-bottom:2px solid var(--brass);padding-bottom:1px}
.hero .sub{font-size:12.5px;color:#BFE0DD;margin-top:8px}
.hero .stat{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}
.hero .stat div .k{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;line-height:1}
.hero .stat div .l{font-size:10.5px;color:#9FD8D3;margin-top:3px}
/* 이번 회차 ladder */
.ladder{display:flex;align-items:stretch;gap:0;margin:6px 0 2px}
.lnode{flex:1;text-align:center;position:relative}
.lnode .sc{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:800}
.lnode .at{font-size:10.5px;color:var(--sub);margin-top:2px}
.lnode .chip{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;margin-top:4px}
.lnode.f .sc{color:var(--x)}.lnode.f .chip{background:var(--x-bg);color:var(--x)}
.lnode.p .sc{color:var(--o)}.lnode.p .chip{background:var(--o-bg);color:var(--o)}
.lnode:not(:last-child):after{content:"→";position:absolute;right:-7px;top:6px;color:var(--faint);font-size:13px}
/* SVG chart */
.chartwrap{margin:2px -4px 0}
svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:11px;color:var(--sub)}
.legend i{display:inline-block;width:16px;height:0;border-top-width:2px;border-top-style:solid;vertical-align:middle;margin-right:5px}
/* axis bars */
.abar{display:flex;align-items:center;gap:10px;margin:9px 0}
.abar .ax{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:12px;color:#fff;background:var(--teal);width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.abar .an{font-size:12.5px;width:120px;flex:none}
.abar .at{flex:1;height:9px;background:var(--line2);border-radius:9px;overflow:hidden}.abar .at i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-line),var(--teal));border-radius:9px}
.abar .av{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);width:24px;text-align:right;flex:none}
.abar.lead .ax{background:var(--x)}.abar.lead .at i{background:linear-gradient(90deg,#E8A99F,var(--x))}
/* prescription */
.rx{border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:11px;padding:13px 14px;margin:10px 0;background:#fff}
.rx .top{display:flex;align-items:center;gap:8px}
.rx .nm{font-weight:700;font-size:14px}.rx .freq{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--x);background:var(--x-bg);padding:2px 8px;border-radius:20px;margin-left:auto;font-weight:700}
.rx .ol{font-size:12.5px;color:#33414e;margin-top:7px;background:var(--brass-soft);border-radius:8px;padding:9px 11px}
.rx .ol b{color:var(--ink)}
/* mastery / 성실도 */
.kv{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line2)}.kv:last-child{border-bottom:0}.kv .r{color:var(--sub);font-size:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.adot{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;border:1px solid var(--line)}
.adot.p{background:var(--o-bg);color:var(--o);border-color:var(--o-bg)}
.adot.r{background:var(--brass-soft);color:var(--brass);border-color:#E9DCC0}
/* teacher only */
.t-only{display:none}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line2)}th{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.03em}
td.mono,th.mono{font-family:'JetBrains Mono',monospace}
.copy{display:flex;gap:8px;align-items:center;margin-top:8px}
.copy textarea{flex:1;font-family:'Pretendard',sans-serif;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:10px;resize:none;height:62px;color:var(--ink)}
.copy button{background:var(--teal);color:#fff;border:0;border-radius:9px;font-family:inherit;font-weight:700;font-size:12px;padding:0 14px;cursor:pointer;align-self:stretch}
.foot{text-align:center;padding:18px 0 6px;color:var(--faint);font-size:11px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:20px;padding:4px 11px;margin-top:6px}
.live .pulse{width:7px;height:7px;border-radius:50%;background:var(--o);box-shadow:0 0 0 0 rgba(27,138,76,.5);animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(27,138,76,.5)}70%{box-shadow:0 0 0 6px rgba(27,138,76,0)}100%{box-shadow:0 0 0 0 rgba(27,138,76,0)}}
.verdict5{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:#fff;margin-bottom:8px}
.verdict5 .sig{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.verdict5.st-ok .sig{background:#7CE3A6}.verdict5.st-warn .sig{background:#F2C879}.verdict5.st-no .sig{background:#F0998C}
.herorow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}
.herorow .stat{margin-top:0;padding-top:0;border-top:0}
.sparkbox{color:#BFE0DD;text-align:right;flex:none}.sparkbox .sparkl{font-size:9.5px;color:#9FD8D3;margin-top:3px}
.todo{border-left:4px solid var(--brass)}
.todohead{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.todotag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--brass);padding:3px 9px;border-radius:20px}
.todomis{font-size:15px;font-weight:700}
.todointro{font-size:12.5px;color:var(--sub);line-height:1.6;margin:0 0 11px}
.todocore{font-size:13px;color:#33414e;background:var(--brass-soft);border-radius:9px;padding:10px 12px;margin-bottom:9px}.todocore b{color:var(--ink)}
.todohome{font-size:13px;color:var(--ink);background:var(--teal-soft);border-radius:9px;padding:10px 12px}.todohome b{color:var(--teal-d)}
.tlab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.03em;margin-bottom:5px;opacity:.9}
.todocore .tlab{color:var(--brass)}.todohome .tlab{color:var(--teal-d)}
.hintq{color:var(--brass);font-weight:600}
.todoguide b{color:var(--ink)}.gmuted{color:var(--faint);font-size:11.5px}
.cbtnnote{font-size:11px;color:var(--faint);margin:9px 0 0;text-align:center;line-height:1.5}
.todoguide{font-size:12px;color:var(--sub);margin-top:9px;line-height:1.55;background:var(--line2);border-radius:9px;padding:9px 12px}
@media (prefers-reduced-motion: reduce){ .live .pulse{animation:none} html{scroll-behavior:auto} }
.printbtn{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--teal);background:var(--surface);border:1.5px solid var(--teal-line);border-radius:10px;padding:9px 16px;cursor:pointer}
.printbtn:hover{background:var(--teal-soft)} .printbtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 4px}
.quad .qcell{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.quad .qcell.alert{border-color:#E8C7C2;background:var(--x-bg)}
.quad .qcell.good{border-color:var(--teal-line);background:var(--teal-soft)}
.quad .qh{font-size:11.5px;color:var(--sub);font-weight:700}
.quad .qn{font-size:24px;font-weight:800;margin:2px 0;font-family:'JetBrains Mono',monospace}
.quad .qcell.alert .qn{color:var(--x)}.quad .qcell.good .qn{color:var(--teal-d)}
.quad .qs{font-size:11px;color:var(--faint)}
.qptitle{font-size:12px;color:var(--sub);font-weight:700;margin:12px 0 6px}
.qplist{display:flex;flex-direction:column;gap:7px}
.qprow{font-size:12.5px;color:var(--ink);line-height:1.45;padding:8px 11px;background:var(--x-bg);border:1px solid #EFD8D3;border-radius:9px}
.qprow .qpu{display:block;font-size:10.5px;color:var(--x);font-weight:700;margin-bottom:2px}
.qdepth{font-size:12.5px;color:var(--sub);margin-top:12px;padding:11px 13px;background:var(--teal-soft);border-radius:10px;line-height:1.55}
.qdepth b{color:var(--teal-d)}
.pqlead{font-size:13px;color:var(--ink);background:var(--brass-soft);border:1px solid #E9DCC0;border-radius:9px;padding:9px 12px;margin:2px 0 10px}.pqlead b{color:var(--brass)}
.pqrow{padding:9px 0;border-bottom:1px solid var(--line2)}
.pqrow:last-child{border-bottom:0}
.pqhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px}
.pqfirst{font-size:10px;font-weight:800;color:#fff;background:var(--x);border-radius:20px;padding:2px 8px}
.pqdetail{font-size:12px;color:var(--sub);line-height:1.5;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pqchip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:7px;padding:3px 9px;border:1px solid transparent}
.pqchip.pq-lo{background:var(--x-bg);color:var(--x);border-color:#EFD8D3}
.pqchip.pq-mid{background:#FBF3E2;color:#9A6B12;border-color:#ECDDBD}
.pqchip.pq-hi{background:var(--o-bg);color:#1B6B3C;border-color:#CDEBD6}
.pqchip.pq-un{background:var(--line2);color:var(--faint)}
@media print{
  @page{ margin:14mm 12mm; }
  html,body{background:#fff}
  header{position:static;border-bottom:1px solid #ccc}
  .printbtn,.live{display:none}
  .wrap{max-width:none;margin:0;padding:0}
  .card{box-shadow:none;break-inside:avoid;border-color:#ccc;margin-bottom:9px}
  .hero,.growth,.rankcard,.closing,.todo,.strength{break-inside:avoid}
  h2,.subhead{break-after:avoid}
  .rx,.heatrow,.kv,.rvrow,.gcell,.strchip,.legend,.intro{break-inside:avoid}
  .chartwrap{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.heatrow{display:flex;align-items:center;gap:10px;margin:6px 0}.heatrow .hu{font-size:12.5px;width:78px;flex:none}
.heatrow .hbar{flex:1;height:10px;background:var(--line2);border-radius:8px;overflow:hidden}.heatrow .hbar i{display:block;height:100%;border-radius:8px}
.heatrow .hv{font-size:10.5px;color:var(--sub);width:44px;text-align:right;flex:none}
.radarwrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.radarwrap svg{max-width:280px}
.radarleg{flex:1;min-width:150px}.radarleg .rl{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:3px 0}
.radarleg .rk{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:11px;color:#fff;background:var(--teal);width:24px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.radarleg .rk.off{background:#C8D0D8}
.herosub{font-size:12px;color:#CDE7E4;margin-top:8px;line-height:1.5}
.hmeta{margin-left:auto;text-align:right}.hmeta .hdate{font-size:11px;color:var(--sub);font-family:'JetBrains Mono',monospace}.hmeta .hsub{font-size:11.5px;color:var(--ink);font-weight:600}
.card.warn{border-left:4px solid #D98324;background:linear-gradient(180deg,#FFF9F2,var(--surface))}
.card.warn h2{color:#9A5A12}.warnlist{margin:6px 0 0;padding-left:18px}.warnlist li{font-size:13px;color:#5A4A38;margin:4px 0}
.rankcard{background:linear-gradient(180deg,#F2F8F7,var(--surface));border-left:4px solid var(--teal)}
.rankhead{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--teal-d);margin-bottom:12px}
.rankrow{display:flex;gap:8px}
.rcell{flex:1;text-align:center;padding:13px 6px;background:var(--surface);border-radius:12px;border:1px solid var(--line)}
.rcell.me{background:var(--teal);border-color:var(--teal)}
.rcell .rv{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800;color:var(--ink);line-height:1}
.rcell.me .rv{color:#fff}.rcell .rv .u{font-size:13px;font-weight:700;opacity:.65}.rcell .rv .pre{font-size:13px;font-weight:700;opacity:.6;margin-right:1px}
.rcell .rl{font-size:11px;color:var(--sub);margin-top:6px}.rcell.me .rl{color:#CDE7E4}
.rankmsg{font-size:13px;color:var(--ink);margin-top:12px;line-height:1.55;background:var(--teal-soft);border-radius:9px;padding:10px 12px}
.ranknote{font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.5;text-align:center}
.disthist{margin:14px 0 2px}
.dhcap{font-size:10.5px;color:var(--sub);font-weight:600;margin-bottom:7px;text-align:center}
.dhbars{display:flex;align-items:flex-end;gap:3px;height:62px;padding:0 2px}
.dhbar{flex:1;display:flex;align-items:flex-end;height:100%}
.dhbar i{width:100%;background:var(--line);border-radius:3px 3px 0 0;min-height:0}
.dhbar.avg i{background:var(--faint)}
.dhbar.me i{background:var(--teal)}
.dhaxis{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);margin-top:5px;padding:0 1px}
.dhleg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--sub);margin-top:9px;justify-content:center;flex-wrap:wrap}
.dhleg .dk{width:9px;height:9px;border-radius:2px;background:var(--line);display:inline-block;margin-left:6px}
.dhleg .dk:first-child{margin-left:0}
.dhleg .dk.me{background:var(--teal)}.dhleg .dk.avg{background:var(--faint)}
.growth{border-left:4px solid var(--teal)}
.growthrow{display:flex;gap:8px}
.gcell{flex:1;text-align:center;padding:12px 6px;background:var(--teal-soft);border-radius:11px}
.gcell .gv{font-family:'JetBrains Mono',monospace;font-size:27px;font-weight:800;color:var(--teal-d);line-height:1}
.gcell .gv .gu{font-size:13px;font-weight:700;opacity:.55}
.gcell .gl{font-size:11px;color:var(--sub);margin-top:6px}
.retakebtn{display:block;margin-top:14px;padding:13px;background:var(--o);color:#fff;text-align:center;border-radius:11px;font-weight:700;font-size:15px;text-decoration:none;letter-spacing:-.01em}
.retaken{font-size:11.5px;color:var(--sub);text-align:center;margin:8px 0 0;line-height:1.4}
.qualcard{background:linear-gradient(180deg,#FAF6EF,var(--surface));border-left:4px solid var(--brass)}
.qualrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qbadge{font-size:14px;font-weight:800;color:#fff;background:var(--brass);padding:7px 16px;border-radius:20px}
.qmetric{display:flex;align-items:baseline;gap:7px}
.qmetric .qv{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:var(--teal-d)}
.qmetric .ql{font-size:11.5px;color:var(--sub)}
.rvrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2)}
.rvrow:last-child{border-bottom:0}.rvm{font-size:13px;font-weight:600}
.rvg{font-size:11px;color:var(--faint);font-family:'JetBrains Mono',monospace}
.card.strength{border-left:4px solid var(--o)}
.strchips{display:flex;flex-wrap:wrap;gap:7px}
.strchip{font-size:12.5px;background:var(--o-bg);color:#1B6B3C;border-radius:20px;padding:5px 12px;font-weight:600}
.strchip b{color:var(--o);font-family:'JetBrains Mono',monospace;margin-left:2px}
.cbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:13px 16px;background:linear-gradient(135deg,var(--brass),#bb9651);color:#fff;border-radius:12px;text-decoration:none;font-weight:700;font-size:13.5px;transition:.15s;box-shadow:0 2px 8px rgba(169,133,60,.25)}
.cbtn:hover{filter:brightness(1.06);box-shadow:0 4px 14px rgba(169,133,60,.32)}
.cbtn .cgo{font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:nowrap;font-weight:800}
.dxroot{margin:16px 0 6px;padding:16px 0 2px;border-top:2px solid var(--brass)}
.dxeyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:9px}
.dxthesis{font-size:17.5px;line-height:1.52;color:var(--ink);margin:0 0 13px;letter-spacing:-.01em;font-weight:400}
.dxthesis b{font-weight:700}
.dxconv{margin:10px 0;padding:14px 12px 8px;background:#FCFAF6;border:1px solid var(--line);border-radius:10px}
.dxcap{display:block;font-size:12px;color:var(--sub);margin-top:8px;line-height:1.55}
.dxsub{font-size:12px;letter-spacing:.04em;color:var(--teal);font-weight:700;margin:16px 0 9px}
.dxbars{display:flex;flex-direction:column;gap:8px}
.dxbar{display:grid;grid-template-columns:132px 1fr 36px;align-items:center;gap:10px}
.dxbn{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dxbn .rt{font-style:normal;font-size:9.5px;color:var(--brass);margin-left:5px;font-weight:700}
.dxbt{height:7px;background:#EDEEE8;border-radius:4px;overflow:hidden}
.dxbt i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),#86692f);border-radius:4px}
.dxbv{font-size:11.5px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.dxnote{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.55}
@media(max-width:540px){.dxbar{grid-template-columns:100px 1fr 32px}}
.dxarc{margin:14px 0 2px;padding:13px 14px;background:var(--brass-soft);border-radius:10px}
.dxarc-h{font-size:12px;font-weight:700;color:var(--brass);letter-spacing:.02em;margin-bottom:8px}
.dxarc-r{margin:0 0 7px;font-size:12.5px;line-height:1.5;color:#3a4654}
.dxarc-r:last-child{margin-bottom:0}
.dxarc-l{display:block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--x);margin-bottom:2px}
.dxarc-l.b{color:var(--o)}


/* 회차별 기록 카드 */
.card.rounds h2{margin-bottom:5px;}
.card.rounds .rc-sub{font-weight:500;color:var(--sub);font-size:14px;}
.rc-help{color:var(--sub);font-size:13px;margin:0 0 14px;line-height:1.5;}
.rcard{border:1px solid #E7E4DC;border-radius:12px;padding:12px 15px;margin-bottom:10px;background:var(--surface);}
.rcard.now{border-color:#0B6E6E;box-shadow:0 0 0 2px rgba(11,110,110,.10);}
.rcard.unpassed{background:#FCFBF8;}
.rc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px;}
.rc-round{font-weight:800;font-size:15px;color:var(--ink);}
.rc-now{display:inline-block;font-size:11px;font-weight:800;color:#0B6E6E;border:1px solid #0B6E6E;border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:1px;}
.rc-right{display:flex;align-items:center;gap:9px;white-space:nowrap;}
.rc-date{font-size:12px;color:var(--sub);font-family:'JetBrains Mono',monospace;}
.rc-verdict{font-size:12px;font-weight:800;padding:2px 9px;border-radius:20px;}
.rc-verdict.p{color:#0B6E6E;background:rgba(11,110,110,.10);}
.rc-verdict.f{color:#B26B00;background:rgba(178,107,0,.10);}
.rc-scores{display:flex;align-items:center;flex-wrap:wrap;gap:4px 2px;}
.rc-att{font-size:13px;color:var(--sub);padding:3px 9px;border:1px solid #E7E4DC;border-radius:8px;}
.rc-att b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:700;margin-left:2px;}
.rc-att.pass{border-color:rgba(11,110,110,.35);color:#0B6E6E;}
.rc-att.pass b{color:#0B6E6E;}
.rc-arrow{color:#C9C6BE;font-size:12px;margin:0 3px;}
.rc-mis{margin-top:10px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.rc-mislab{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--sub);}
.rc-mispill{font-size:12px;color:#8A3B2E;background:rgba(178,60,46,.07);border:1px solid rgba(178,60,46,.2);border-radius:20px;padding:2px 9px;}
.rc-mis.clean{color:var(--sub);font-size:12px;font-weight:500;}
.rcard.rc-clickable{cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.rcard.rc-clickable:hover{border-color:#0B6E6E;box-shadow:0 2px 10px rgba(11,110,110,.10);}
.rc-open{font-size:12px;font-weight:700;color:#0B6E6E;white-space:nowrap;}
.backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.backbar button{background:#16202E;color:#fff;border:none;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.backbar button:hover{background:#0B6E6E;}
.backbar .bb-t{font-size:13px;color:var(--sub);font-weight:600;}
.rc-expand{display:none;}
.rc-expand.open{display:block;animation:rcFade .3s ease;}
@keyframes rcFade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.rcard.sel{border-color:#0B6E6E;box-shadow:0 0 0 2px rgba(11,110,110,.12);}
.round-embed{margin:8px 0 14px;padding:14px 14px 6px;background:#F3F0E8;border:1px solid #E3DFD4;border-left:3px solid #0B6E6E;border-radius:12px;}
.re-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;color:#16202E;margin-bottom:12px;gap:10px;}
.re-close{background:#16202E;color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.re-close:hover{background:#0B6E6E;}
.round-embed .card{box-shadow:none;border:1px solid #E7E4DC;}
.round-embed .card.hero{border:1px solid #0B6E6E;}
.re-loading{padding:14px 4px;color:var(--sub);font-size:13px;}
.card.sols h2{margin-bottom:10px;}
.sol{border:1px solid #E7E4DC;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;}
.sol.w{border-left:3px solid #B23C2E;background:#FDF7F5;}
.sol.c{border-left:3px solid #0B6E6E;}
.sol.u{border-left:3px solid #C9C6BE;}
.sol-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:5px;}
.sol-n{font-weight:800;font-size:14px;color:#16202E;min-width:20px;}
.sol-mark{font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;}
.sol-mark.w{color:#B23C2E;background:rgba(178,60,46,.10);}
.sol-mark.c{color:#0B6E6E;background:rgba(11,110,110,.10);}
.sol-ans{font-size:12px;color:var(--sub);font-weight:700;font-family:'JetBrains Mono',monospace;}
.sol-mis{font-size:11px;color:#8A3B2E;background:rgba(178,60,46,.07);border:1px solid rgba(178,60,46,.18);border-radius:20px;padding:1px 8px;margin-left:auto;}
.sol-s{font-size:13.5px;color:#16202E;line-height:1.5;}
.sol-w{margin-top:6px;font-size:12.5px;color:#4A4A4A;line-height:1.55;background:#F7F5EF;border-radius:7px;padding:7px 10px;}
.sol-w b{color:#16202E;}
.sol-none{padding:12px;color:#0B6E6E;font-size:13px;text-align:center;font-weight:700;}
.sol-toggle{margin:4px 0 12px;background:none;border:1px solid #16202E;color:#16202E;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.sol-toggle:hover{background:#16202E;color:#fff;}
.misgrp{margin-bottom:15px;}
.misgrp-h{display:flex;align-items:center;gap:8px;margin:0 0 7px;padding-bottom:5px;border-bottom:2px solid #16202E;}
.misgrp-t{font-weight:800;font-size:14px;color:#B23C2E;}
.misgrp-c{font-size:11px;font-weight:800;color:#fff;background:#B23C2E;border-radius:20px;padding:1px 9px;}
.wrongpick{color:#B23C2E;}
.oxwrap{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.oxtable{flex:1;min-width:220px;border-collapse:collapse;font-size:13px;}
.oxtable th{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.04em;padding:5px 6px;border-bottom:2px solid #16202E;text-align:center;}
.oxtable td{padding:4px 6px;text-align:center;border-bottom:1px solid #EEEBE3;font-family:'JetBrains Mono',monospace;}
.oxtable .tn{color:#16202E;font-weight:700;width:34px;}
.oxtable .tc{color:#4A4A4A;font-weight:700;}
.oxtable .tm{font-weight:800;width:56px;}
.oxtable tr.row-w{background:#FBEDEA;}
.oxtable tr.row-w .tm{color:#B23C2E;}
.oxtable tr.row-c .tm{color:#0B6E6E;}
.oxtable tr.row-u td{color:#B8B4AA;}
.oxlegend{display:flex;gap:16px;font-size:12px;color:var(--sub);margin-bottom:4px;}
.oxlegend .lg-c{color:#0B6E6E;font-weight:700;}
.oxlegend .lg-w{color:#B23C2E;font-weight:700;}
.soldiv{height:1px;background:#E3DFD4;margin:16px 0;}
.solh2{font-size:16px;font-weight:800;margin-bottom:6px;}
.todoread{margin-top:10px;}
.tritem{border:1px solid #E7E4DC;border-left:3px solid #0B6E6E;border-radius:8px;padding:8px 11px;margin-top:7px;background:#FBFAF6;}
.trf{font-size:13px;color:#16202E;font-weight:600;line-height:1.5;}
.trf::before{content:"\2714  ";color:#0B6E6E;}
.trw{margin-top:4px;font-size:12px;color:#4A4A4A;line-height:1.55;}
.trw b{color:#16202E;}

<script>/* ============================================================
   Chemistreal 채점·진단·재시 로직 엔진 (Phase 2)
   - 순수 함수만. DOM·네트워크 없음. Node와 브라우저에서 동일 동작.
   - 여기서 테스트 통과한 코드가 그대로 앱(Phase 4)에 들어간다.
   ============================================================ */
(function (root) {
  'use strict';

  // ---------- 공통 유틸 ----------
  function norm(s) {            // 문장 정규화(공백·괄호 미세차 흡수) → 중복 판별용
    return (s || '').replace(/\s+/g, '').replace(/（/g, '(').replace(/）/g, ')').trim();
  }
  function cleanName(s) { return (s || '').replace(/\s+/g, '').trim(); }
  function normSchool(s) { s = (s || '').replace(/\s+/g, '').trim(); return s.replace(/중학교$/, '중').replace(/고등학교$/, '고').replace(/초등학교$/, '초'); }

  // ---------- 1) 학생키: 이름+학교 (학년은 키에서 제외, 속성으로만) ----------
  function studentKey(name, school) {
    return normSchool(school) + '-' + cleanName(name);   // 예: 휘문중-홍길동 ('휘문중학교'도 동일 키)
  }

  // ---------- 2) 5대 통합축 매핑 (보너스 진단층; 단원·오개념 그룹이 본체) ----------
  // unit + mis 텍스트를 함께 스캔. 매칭 없으면 null (리포트는 단원/오개념으로 폴백).
  var AXES = [
    { key: 'A1', name: '에너지·자발성·평형 (ΔG=ΔH−TΔS=−nFE°=−RT ln K)',
      kw: ['열역학','자발','엔트로피','전기화학','화학평형','평형','엔탈피','깁스','헤스','전지','전기분해','반응열'] },
    { key: 'A3', name: '결합·극성·산화수 (전기음성도 장부)',
      kw: ['전기음성도','산화수','산화','환원','결합','극성','루이스','이온화에너지'] },
    { key: 'A5', name: '원자구조→주기율표 (파울리→부껍질 용량)',
      kw: ['양자','오비탈','전자배치','전자 배치','주기율','부껍질','바닥상태','들뜬','원자 모형','원자모형'] },
    { key: 'A2', name: '분자 운동·반응 속도 (볼츠만 분포)',
      kw: ['반응속도','반응 속도','속도','활성화','촉매','충돌','기체','이상기체','실제기체','분압','분자 운동','확산'] },
    { key: 'A4', name: '동적 평형·상·용액 (증발↔응축↔용해)',
      kw: ['증기압','증발','액체','고체','총괄성','용해','농도','분자간','분자 간','상평형','포화'] }
  ];
  function axisOf(unit, mis) {
    var hay = (unit || '') + ' ' + (mis || '');
    for (var i = 0; i < AXES.length; i++) {
      for (var j = 0; j < AXES[i].kw.length; j++) {
        if (hay.indexOf(AXES[i].kw[j]) !== -1) return AXES[i];
      }
    }
    return null;
  }
  function axisName(key) { for (var i=0;i<AXES.length;i++) if (AXES[i].key===key) return AXES[i].name; return key; }

  // ---------- 3) 채점 ----------
  // studentAnswers: ['O'|'X'|''] 길이 = keyItems.length (보통 60)
  // keyItems: 정시 items [{n,u,mis,a,s,f,w,lvl,c}]
  // scoring: {per, max, pass}
  function gradeAttempt(studentAnswers, keyItems, scoring) {
    var per = (scoring && scoring.per) || (100 / keyItems.length);
    var passScore = (scoring && scoring.pass) != null ? scoring.pass : 80;
    var perItem = [], correct = 0, blank = 0;
    for (var i = 0; i < keyItems.length; i++) {
      var it = keyItems[i];
      var sa = (studentAnswers[i] || '').toUpperCase();
      var isBlank = (sa !== 'O' && sa !== 'X');
      var ok = (!isBlank && sa === String(it.a).toUpperCase());
      if (ok) correct++;
      if (isBlank) blank++;
      perItem.push({
        idx: i, id: it.n, c: it.c || null, unit: it.u, mis: it.mis,
        lvl: it.lvl || 1, studentAns: isBlank ? '' : sa, correctAns: it.a,
        ok: ok, blank: isBlank, f: it.f, w: it.w
      });
    }
    var scoreRaw = correct * per;
    var score = Math.round(scoreRaw * 10) / 10;       // 표시용 소수1
    var pass = scoreRaw >= passScore - 1e-6;
    return {
      n: keyItems.length, correctCount: correct, blankCount: blank,
      wrongCount: keyItems.length - correct - blank,
      score: score, scoreInt: Math.round(scoreRaw), max: (scoring && scoring.max) || 100,
      passScore: passScore, pass: pass, perItem: perItem
    };
  }

  // 채점결과 → 교정 필요 개념(틀림 또는 미기입). cid 없으면 문항 자체 정보로 폴백.
  function notCorrectConcepts(graded) {
    var seenCid = {}, out = [];
    graded.perItem.forEach(function (p) {
      if (p.ok) return;                         // 맞은 건 제외
      var keyC = p.c || ('NOID:' + p.idx);      // cid 없으면 문항별 폴백키
      if (seenCid[keyC]) { seenCid[keyC].count++; return; }
      var rec = { c: p.c || null, unit: p.unit, mis: p.mis, lvl: p.lvl,
                  f: p.f, w: p.w, count: 1, blank: p.blank };
      seenCid[keyC] = rec; out.push(rec);
    });
    return out;
  }

  // ---------- 4) 진단 (단발 1회차) ----------
  function diagnose(graded, formsBank) {
    formsBank = formsBank || {};
    var byUnit = {}, byMis = {}, byAxis = {};
    graded.perItem.forEach(function (p) {
      // 단원별
      var u = byUnit[p.unit] || (byUnit[p.unit] = { unit: p.unit, total: 0, wrong: 0 });
      u.total++; if (!p.ok) u.wrong++;
      // 축별
      var ax = axisOf(p.unit, p.mis);
      if (ax) {
        var a = byAxis[ax.key] || (byAxis[ax.key] = { key: ax.key, name: ax.name, total: 0, wrong: 0 });
        a.total++; if (!p.ok) a.wrong++;
      }
      // 오개념별 (틀린 것만 집계)
      if (!p.ok) {
        var m = byMis[p.mis] || (byMis[p.mis] = { mis: p.mis, unit: p.unit, count: 0, cids: [] });
        m.count++; if (p.c && m.cids.indexOf(p.c) === -1) m.cids.push(p.c);
      }
    });
    // 교정 개념 + 강의록 부착
    var wrongConcepts = notCorrectConcepts(graded).map(function (w) {
      var reading = (w.c && formsBank[w.c] && formsBank[w.c].reading) ? formsBank[w.c].reading : null;
      return { c: w.c, unit: w.unit, mis: w.mis, lvl: w.lvl, blank: w.blank,
               reading: reading, fix: w.f, why: w.w,
               hasReading: !!(reading && (reading.oneline || reading.core)) };
    });
    function toSortedArr(obj, rateBase) {
      return Object.keys(obj).map(function (k) {
        var o = obj[k]; if (rateBase) o.rate = o.total ? Math.round(100 * o.wrong / o.total) : 0; return o;
      }).sort(function (a, b) { return (b.wrong||b.count) - (a.wrong||a.count); });
    }
    return {
      score: graded.score, pass: graded.pass, passScore: graded.passScore,
      correctCount: graded.correctCount, wrongCount: graded.wrongCount, blankCount: graded.blankCount,
      byUnit: toSortedArr(byUnit, true),
      byMisconception: toSortedArr(byMis, false),
      byAxis: toSortedArr(byAxis, true),
      wrongConcepts: wrongConcepts
    };
  }

  // ---------- 5) 읽음 확인 게이트 ----------
  // wrongConcepts: diagnose의 wrongConcepts
  // 각 개념: 강의록(있으면) + 확인질문(아직 안 본 다른 form O/X) 1개. 없으면 폴백(옳은문장 재확인).
  function buildGate(wrongConcepts, formsBank, seenStatements) {
    formsBank = formsBank || {}; seenStatements = seenStatements || {};
    var gates = [];
    wrongConcepts.forEach(function (w) {
      var checks = [], fallback = false;
      if (w.c && formsBank[w.c] && formsBank[w.c].forms) {
        var fresh = formsBank[w.c].forms.filter(function (fm) { return !seenStatements[norm(fm.s)]; });
        for (var i = 0; i < 2 && i < fresh.length; i++) { var p = fresh[i]; checks.push({ s: p.s, a: p.a, f: p.f, w: p.w }); seenStatements[norm(p.s)] = 1; }
        if (checks.length < 2) {          // 새 문장 부족 → 본 적 있는 form으로 2단 채움
          var more = formsBank[w.c].forms.filter(function (fm) { return !checks.some(function (c) { return norm(c.s) === norm(fm.s); }); });
          for (var j = 0; checks.length < 2 && j < more.length; j++) { checks.push({ s: more[j].s, a: more[j].a, f: more[j].f, w: more[j].w }); }
        }
      }
      if (!checks.length) {               // 폴백: cid 없거나 form 없음 → 옳은 문장 재확인(정답 O)
        fallback = true;
        var cf = { s: w.fix || w.mis, a: 'O', f: w.fix, w: w.why };
        checks.push(cf); seenStatements[norm(cf.s)] = 1;
      }
      gates.push({
        c: w.c, unit: w.unit, mis: w.mis,
        reading: w.reading || null, hasReading: w.hasReading,
        checks: checks, check: checks[0], fallback: fallback
      });
    });
    return { gates: gates, seenStatements: seenStatements };
  }

  // ---------- 6) 재시 생성 (점점 쉽게 + 개별화) ----------
  // attemptNo: 2=재시, 3=재재시  (정시=1)
  // cbandVersions: round.retakeC = [{v,items:[{c,u,a,s,f,w}]}...] (C=기본, 더 쉬움)
  // wrongCids: 직전 시도에서 틀린 개념 cid 집합(객체/배열)
  // formsBank: 개별화용 대체 form 소스
  // seenStatements: 이미 학생이 본 문장(중복 방지) · 갱신해서 반환
  function buildRetake(attemptNo, cbandVersions, wrongCids, formsBank, seenStatements, wrongStmts) {
    formsBank = formsBank || {}; seenStatements = seenStatements || {}; wrongStmts = wrongStmts || {};
    var wrong = {};
    (Array.isArray(wrongCids) ? wrongCids : Object.keys(wrongCids || {})).forEach(function (c) { if (c) wrong[c] = 1; });
    if (!cbandVersions || !cbandVersions.length) return { items: [], seenStatements: seenStatements, n: 0 };
    var base = cbandVersions[Math.min(attemptNo - 2, cbandVersions.length - 1)].items;

    var usedThis = {};                 // 이 시도에서 쓴 문장 → 한 시험 안 중복 절대 방지
    var subCids = base.map(function (it) { return it.c; }).filter(function (c, i, a) { return c && a.indexOf(c) === i; }); // 대체용 범위 내 개념
    function avail(fb, fn) { return (fb && fb.forms && fb.forms.length ? fb.forms : []).find(fn); }
    function nwFresh(fb) { return avail(fb, function (fm) { return !usedThis[norm(fm.s)] && !seenStatements[norm(fm.s)] && !wrongStmts[norm(fm.s)]; }); }
    function nwUnused(fb) { return avail(fb, function (fm) { return !usedThis[norm(fm.s)] && !wrongStmts[norm(fm.s)]; }); }
    function subForm() {                // D9: 다른 범위 내 개념에서 안 본·안 틀린 form (재노출 0 보장)
      for (var i = 0; i < subCids.length; i++) { var sfb = formsBank[subCids[i]]; var ff = nwFresh(sfb) || nwUnused(sfb);
        if (ff) return { c: subCids[i], a: ff.a, s: ff.s, f: ff.f, w: ff.w }; }
      return null;
    }
    var items = base.map(function (it) {
      var fb = formsBank[it.c];
      var orig = { c: it.c, a: it.a, s: it.s, f: it.f, w: it.w };
      var pick, subbed = false, p;
      if (wrong[it.c]) {
        // 틀린 개념: 새 문장 우선, 학생이 틀린 문장은 절대 재노출 안 함
        p = nwFresh(fb) || nwUnused(fb);
        if (p) pick = { c: it.c, a: p.a, s: p.s, f: p.f, w: p.w };
      } else {
        // 맞힌 개념: 원본 유지(form 절약), 충돌 시에만 비오답 form으로
        if (!usedThis[norm(orig.s)] && !wrongStmts[norm(orig.s)]) pick = orig;
        else { p = nwUnused(fb); if (p) pick = { c: it.c, a: p.a, s: p.s, f: p.f, w: p.w }; }
      }
      if (!pick) { var sub = subForm(); if (sub) { pick = sub; subbed = true; } }  // 소진 → 범위 내 다른 개념으로 대체
      if (!pick) pick = orig;                                                       // 최후(이론상 도달 안 함)
      usedThis[norm(pick.s)] = 1; seenStatements[norm(pick.s)] = 1;
      var pfb = formsBank[pick.c];
      var mis = (pfb && pfb.m) || (fb && fb.m) || '';
      return { c: pick.c, u: it.u, mis: mis, a: pick.a, s: pick.s, f: pick.f, w: pick.w,
               targeted: !!wrong[it.c] && !subbed, substituted: subbed,
               swapped: norm(pick.s) !== norm(it.s), reusedWrong: !!wrongStmts[norm(pick.s)] };
    });
    return { items: items, seenStatements: seenStatements, n: items.length };
  }

  // ---------- 7) 누적 (학생 단위, 미응시는 생략, null-safe) ----------
  // rows: 제출 기록 배열. 각 row:
  //   {studentKey, name, school, year, course, round, attempt('정시'|'재시'|'재재시'),
  //    score, pass(bool), date, wrongMis:[..], wrongAxes:{key:count}, isTest(bool)}
  // 반환: {studentKey: {info, trend[], chronicMis[], axisWeak[], roundsTaken[], coverageRound, attemptsTotal}}
  function cumulative(rows) {
    rows = rows || [];
    var byStu = {};
    rows.forEach(function (r) {
      var k = r.studentKey || studentKey(r.name, r.school);
      (byStu[k] || (byStu[k] = [])).push(r);
    });

    var out = {};
    Object.keys(byStu).forEach(function (k) {
      var rs = byStu[k];
      // 회차별 묶기 (course+round)
      var rounds = {};
      rs.forEach(function (r) {
        var rk = r.course + '#' + r.round;
        (rounds[rk] || (rounds[rk] = { course: r.course, round: r.round, attempts: [] })).attempts.push(r);
      });
      // trend: 실제로 본 회차만, round 순. (미응시 회차는 애초에 키가 없어 자동 생략)
      var trend = Object.keys(rounds).map(function (rk) {
        var R = rounds[rk];
        R.attempts.sort(function (a, b) { return order(a.attempt) - order(b.attempt); });
        var jeong = R.attempts.find(function (a) { return a.attempt === '정시'; });
        var last = R.attempts[R.attempts.length - 1];
        var passedAny = R.attempts.some(function (a) { return a.pass; });
        return {
          course: R.course, round: R.round,
          jeongsiScore: jeong ? jeong.score : null,
          finalScore: last ? last.score : null,
          finalAttempt: last ? last.attempt : null,
          attemptsCount: R.attempts.length,
          passed: passedAny,
          date: last ? last.date : null
        };
      }).sort(function (a, b) {
        if (a.course !== b.course) return a.course < b.course ? -1 : 1;
        return a.round - b.round;
      });

      // 고질 오개념: 서로 다른 회차에서 반복해서 틀린 것 (≥2회차)
      var misRounds = {};
      rs.forEach(function (r) {
        (r.wrongMis || []).forEach(function (m) {
          (misRounds[m] || (misRounds[m] = {}))[r.course + '#' + r.round] = 1;
        });
      });
      var chronic = Object.keys(misRounds).map(function (m) {
        return { mis: m, rounds: Object.keys(misRounds[m]).length };
      }).filter(function (x) { return x.rounds >= 2; })
        .sort(function (a, b) { return b.rounds - a.rounds; });

      // 축별 누적 약점
      var axis = {};
      rs.forEach(function (r) {
        var wa = r.wrongAxes || {};
        Object.keys(wa).forEach(function (ak) { axis[ak] = (axis[ak] || 0) + wa[ak]; });
      });
      var axisWeak = Object.keys(axis).map(function (ak) {
        return { key: ak, name: axisName(ak), wrong: axis[ak] };
      }).sort(function (a, b) { return b.wrong - a.wrong; });

      var roundsTaken = trend.map(function (t) { return t.course + t.round; });
      var coverageRound = trend.length ? trend[trend.length - 1].round : 0;  // 최근 응시 회차 = 누적 범위
      var attemptsTotal = rs.length;
      var info = { name: rs[0].name, school: rs[0].school, yearLatest: latestYear(rs) };

      out[k] = {
        info: info, trend: trend, chronicMis: chronic, axisWeak: axisWeak,
        roundsTaken: roundsTaken, roundsTakenCount: trend.length,
        coverageRound: coverageRound, attemptsTotal: attemptsTotal,
        passedRounds: trend.filter(function (t) { return t.passed; }).length
      };
    });
    return out;
  }
  function order(att) { return (att === '정시' || att === '첫번째시험' || att === '이번주 테스트' || att === '첫 응시') ? 0 : att === '재시' ? 1 : 2; }
  function latestYear(rs) {
    var y = null, d = '';
    rs.forEach(function (r) { if (r.date && r.date > d) { d = r.date; y = r.year; } });
    return y != null ? y : (rs[0] ? rs[0].year : null);
  }

  // 간격 반복(D8): 과거 회차에 틀린 개념 중 지금 다시 점검할 것. chronic할수록(자주 틀림) 우선(D10 인출강도).
  function spacedReview(rows, currentRound) {
    var ord = new Proxy({},{get:function(_o,k){k=String(k);var n=0;for(var i=0;i<k.length;i++){if(k.charAt(i)==='재')n++;}return n;}});  // 시도 순서 = 재 글자 수(무한 단계)
    var byRound = {};
    (rows || []).forEach(function (r) { (byRound[r.round] || (byRound[r.round] = [])).push(r); });
    var byConcept = {};
    Object.keys(byRound).forEach(function (rd) {
      var rs = byRound[rd].slice().sort(function (a, b) { return (ord[a.attempt] || 0) - (ord[b.attempt] || 0); });
      var first = rs[0]; if (!first) return;
      (first.wrongMis || []).forEach(function (m) {
        var o = byConcept[m] || (byConcept[m] = { rounds: {}, last: 0 });
        o.rounds[rd] = 1; o.last = Math.max(o.last, Number(rd));
      });
    });
    return Object.keys(byConcept).map(function (m) {
      var o = byConcept[m];
      return { mis: m, times: Object.keys(o.rounds).length, last: o.last, gap: (currentRound || 0) - o.last };
    }).filter(function (x) { return x.last < (currentRound || 0); })
      .sort(function (a, b) { return b.times - a.times || b.last - a.last; });
  }

  // ---------- export (Node + 브라우저) ----------
  var api = {
    norm: norm, studentKey: studentKey, axisOf: axisOf, axisName: axisName, AXES: AXES,
    gradeAttempt: gradeAttempt, notCorrectConcepts: notCorrectConcepts,
    diagnose: diagnose, buildGate: buildGate, buildRetake: buildRetake, cumulative: cumulative,
    spacedReview: spacedReview
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ChemEngine = api;
})(typeof window !== 'undefined' ? window : this);

const ONELINE={"원소·원자·분자 정의": "**원소 = 성분, 원자 = 가장 작은 입자, 분자 = 성질 단위.**", "분자 종류": "**분자 원자 수 = 첨자의 합**(H₂O 3, CH₄ 5, O₂ 2). 분자식은 개수의 설명서라, 정확히 세는 것이 모든 계산의 출발점이다.", "원소 수 세기": "**원소 종류 = 서로 다른 기호 수**(원자 총수와 다름). CH₄는 2종류.", "원자 수 세기": "**원자 수 = 모든 첨자의 합**(C₆H₁₂O₆ = 24). 괄호 밖 숫자는 안쪽 전체에 곱하고, 첨자와 계수는 구분한다.", "화학식 종류": "**실험식(간단한 비)·분자식(실제 수)·구조식(결합선)·시성식(작용기).**", "실험식 도출": "**실험식 = 첨자를 최대공약수로 나눈 가장 간단한 비.**", "원자 구조": "**원자 = 핵(+, 양성자·중성자) + 전자(-).** 핵은 작은 공간.", "입자 질량비": "**양성자 ≈ 중성자 ≫ 전자**(전자 무시). 질량은 핵에 집중.", "입자 전하비": "**전하량비 = 1 : 0 : -1**(중성자 0, 양성자·전자 크기 같음).", "원자 중성": "**중성 = 양성자 수 = 전자 수**(중성자 무관).", "원자핵 구성": "**핵 = 양성자 + 중성자**(전자는 바깥). 질량수 = 양성자 + 중성자.", "옥텟규칙": "**옥텟 = 최외각 8개로 안정**(비활성 기체 배치, He만 2개). 이 안정한 배치에 도달하려는 경향이 화학 결합의 동기다.", "루이스 전자점식": "**점 = 원자가 전자만**(O 6점, He 2점). 결합에 쓰이는 전자라 안쪽은 빼고, 이 점이 결합·모양·옥텟 분석의 출발점이다.", "주기율표 기초": "**주기 = 전자껍질 수, 족 = 원자가 전자 수**(원자 번호 순 배열).", "족 판정": "**18족 = 비활성 기체, O는 16족**(원자가 전자 6개).", "이온형성 방향": "**금속 잃어 양이온, 비금속 얻어 음이온.** 옥텟에 도달할 전자 수가 적은 쪽으로 움직여, 금속은 잃고 비금속은 얻는다.", "이온 전하": "**Na +1, Mg/Ca +2, Al +3, O −2, F −1.** 옥텟까지의 거리가 전하라 족으로 예측되고, 전이 금속만 변동 전하로 예외다.", "결합 기초": "**금속+비금속 이온, 비금속끼리 공유, 금속끼리 금속결합.** 전기음성도 차이로 전자를 넘기느냐·나누느냐·풀어놓느냐가 갈리고, 이것이 성질을 정한다.", "물질 분류": "**순물질(홑원소물질·화합물) vs 혼합물.** 공기는 혼합물.", "순물질·혼합물 경계": "**섞이면 혼합물(화학결합 없음).** 성분이 정체를 유지하고 물리적으로 분리되며 비율이 변하면 혼합물이라, 설탕물은 혼합물이다.", "물질 분류 판정": "**순물질(홑원소물질·화합물) vs 혼합물.** 조성이 일정하면 순물질, 한 원소면 홑원소물질(O₂), 결합하면 화합물, 섞였으면 혼합물(공기)이다.", "물리·화학변화": "**물리 변화 = 화학식 불변(분자 간 힘만), 화학 변화 = 새 물질 생성(분자 내 결합 재배열).** 결합을 건드렸는지가 기준이다.", "물리·화학적 성질": "**물리적(색·녹는점·밀도) vs 화학적(가연성·산염기성·반응성).**", "분자 판정": "**이온결합 물질(NaCl)은 분자 아님**(연속 격자, 실험식). 분자는 공유결합으로 묶인 독립 입자라, 금속·공유결정도 분자가 아니다.", "물질 상태": "**녹는점 아래 고체, 사이 액체, 끓는점 위 기체.**", "불의 이용": "**불 = 조리·토기·제련·난방.** 문명 발전의 토대.", "금속 반응성·사용시기": "**반응성 작을수록 먼저 사용**(산화물 덜 안정, 환원 쉬움). 금·은은 자연 상태, 구리·철은 숯 환원, 알루미늄은 전기분해를 기다렸다.", "금속 사용시기": "**구리가 철보다 먼저**(청동기 → 철기).", "지각 구성원소": "**지각 질량비 1위 = 산소(약 46%)**, 2위 규소. 광물에 산소가 많이 결합해서이고, 우주·인체와는 분포가 다르다.", "인체 구성원소": "**인체 질량비 1위 산소, 개수비 1위 수소.** 물에 수소가 2개라 개수는 많지만 가벼워, 질량은 무거운 산소가 1위다.", "질소": "**질소 = 단백질·DNA 구성, 공기의 78%**(가장 많음).", "질소 안정성": "**N₂는 삼중결합으로 안정(반응성 작음).** 약 945 kJ/mol의 강한 결합이라 활성화 에너지가 높아 느리고, 쓰려면 질소 고정이 필요하다.", "하버보슈": "**하버보슈: N₂ + 3H₂ ⇌ 2NH₃(고압·중온·촉매).** 고압은 수율, 중온은 수율과 속도의 타협, 촉매는 속도를 위한 것으로, 평형·속도·촉매가 한데 모인다.", "원자량 정의": "**원자량 = ¹²C 기준 상대 질량(단위 없음).** 실제 질량이 너무 작아 비율로 정하고, 이 상대값이 몰질량(g/mol)과 같은 수가 된다.", "원자량 단위": "**원자량은 무단위**(몰질량만 g/mol).", "평균 원자량": "**평균 원자량 = 질량수 × 존재 비율의 합**(보통 소수).", "동위원소": "**동위원소 = 양성자 같고 중성자 다름**(화학 같음, 물리 다름). 존재비 가중 평균이 원자량이라, 동위원소 때문에 원자량이 정수가 아니다.", "분자량·화학식량": "**분자량 = 원자량의 합**(곱 아님). 분자가 없는 이온결합 물질은 화학식량이라 부르고, 둘 다 몰질량(g/mol)과 같은 수다.", "몰 정의": "**1몰 = 6.02 × 10²³개**(종류 무관). 원자 세계와 저울 세계를 잇는 다리라, 1몰의 질량이 분자량과 같은 수가 된다.", "몰질량": "**1몰 질량(g) = 화학식량**(O₂ 32, H₂O 18, CO₂ 44). 몰의 정의로 amu와 그램이 일치해서이고, 질량과 몰수를 잇는 변환 인자다.", "기체 몰부피": "**0°C, 1기압에서 기체 1몰 = 22.4 L**(종류 무관). 아보가드로 법칙 덕분이고, 분자가 닿아 있는 고체·액체는 물질마다 다르다.", "아보가드로 법칙": "**같은 T·P·V = 같은 분자 수**(질량은 다를 수 있음).", "질량 계산": "**질량 = 몰수 × 화학식량**(O₂ 2몰 = 64 g). 몰질량이 질량과 몰을 잇는 변환 인자라, 모든 화학량 계산이 질량→몰→몰비→몰→질량으로 돈다.", "몰-입자수": "**원자 몰수 = 분자 몰수 × 분자당 원자 수**(O₂ 1몰 → 산소 2몰). 분자 몰과 원자 몰은 개수 단위가 달라, 무엇을 세는지 읽고 첨자를 곱해야 한다.", "몰 환산": "**몰수 = 질량 / 몰질량.** H₂O 9 g = 0.5몰.", "기체 몰 환산": "**기체 몰수 = 부피 / 22.4**(11.2 L = 0.5몰). 22.4 L가 1몰당 부피라, 부피를 그것으로 나누면 몰수가 된다.", "몰 비교": "**같은 질량이면 분자량 작을수록 몰수 큼**(몰수 ∝ 1/분자량). 가벼운 분자가 같은 질량에 더 많이 들어가고, 질량과 개수는 다른 잣대다.", "원자-분자 몰": "**총 원자 몰수 = 분자 몰수 × 분자당 원자 수.**", "밀도-분자량": "**분자량 = 밀도 × 22.4**(곱셈). 분자량 클수록 밀도 큼.", "기체 분자수-압력": "**같은 T·V에서 압력 ∝ 분자 수.**", "입자수-질량": "**6.02 × 10²³개 = 1몰 = 화학식량(g).** 물 18 g.", "실험식-분자식": "**분자식 = 실험식 정수배.** 실험식 같아도 분자식은 다를 수 있음.", "몰-부피": "**부피 = 몰수 × 22.4 L.** CO₂ 11.2 L = 0.5몰.", "화학반응식 형식": "**반응물(왼쪽) → 생성물(오른쪽).** 화학식으로 표기.", "화학반응식 계수": "**계수 = 가장 간단한 정수비(몰비).** 1은 생략.", "질량 보존": "**원자 보존 → 총질량 보존.** 반응은 원자의 재배열일 뿐이라, 빠져나간 기체까지 합치면 질량은 정확히 보존된다.", "질량 보존 법칙": "**질량 보존 = 반응 전후 총질량 같음**(화학 변화 포함).", "일정 성분비 법칙": "**일정 성분비 = 한 화합물의 성분 질량비 일정**(화합물만).", "일정 성분비 적용": "**물의 수소:산소 질량비 = 1:8**(산소가 8배). 원자 수 × 원자량(2×1 : 1×16)이고, 화학식이 고정이라 어떤 물이든 같다.", "배수 비례 법칙": "**배수 비례 = 여러 화합물에서 결합 질량이 간단한 정수비**(CO/CO₂).", "배수 비례 적용": "**같은 탄소에 대한 CO:CO₂ 산소비 = 1:2.**", "기체 반응 법칙": "**기체 반응: 부피비 = 계수비**(간단한 정수비).", "계수비-분자수": "**계수비 = 분자 수 비(몰비).** 1몰이 정해진 개수라 분자 수 비가 몰비이고, 질량비는 분자량을 곱해야 나온다.", "계수비-질량비": "**계수비 = 몰비(질량비 아님), 질량비 = 계수 × 분자량.** 계수는 개수의 언어라, 모든 계산은 몰을 거쳐 돈다.", "계수비-부피비": "**기체 반응: 계수비 = 부피비(몰비).** 같은 부피에 같은 분자 수라는 아보가드로 법칙 때문이라, 기체에서만 성립한다.", "양적관계 부피": "**2H₂ + O₂ → 2H₂O: 부피비 2:1:2.** 기체는 부피가 분자 수에 비례(아보가드로)해 부피비 = 계수비다.", "양적관계 몰": "**몰수는 계수비로 환산**(N₂ 1몰 → NH₃ 2몰). 계수가 몰비라 그렇고, 질량 문제는 질량→몰→계수비→몰→질량으로 푼다.", "한계 반응물": "**한계 반응물 = 계수 대비 가장 부족(먼저 소모, 생성물 결정).** 양이 아니라 몰수/계수가 정하므로, 더 많이 넣은 쪽이 한계일 수도 있다.", "몰비-계수비": "**몰비 = 계수비.** 질량비 아님.", "계수 맞추기": "**계수만 조정해 양변 원자 수 일치(첨자 불변).** 첨자는 물질의 정체라 못 바꾸고, 맞춘 계수가 그대로 몰비가 된다.", "양적관계 질량": "**탄소 12 g + 산소 32 g → CO₂ 44 g.**", "계수 규칙": "**계수 = 양의 정수**(0·음수·분수 아님).", "분자설 도입": "**아보가드로가 분자 개념으로 기체 반응 법칙 설명.**", "일정 성분비 범위": "**일정 성분비 법칙 = 화합물에만**(혼합물 적용 안 됨). 정해진 화학식이 조성을 고정해서이고, 화학식 없는 혼합물은 비율이 변한다.", "양적관계 몰수변화": "**계수 합 비교로 전체 몰수 변화 판단.** N₂ + 3H₂ → 2NH₃는 감소.", "부피비-몰비": "**같은 T·P: 부피비 = 몰비(계수비).** 질량비 아님.", "양적관계": "**계수비 = 몰비 = 분자 수 비 = 기체 부피비.**", "원자 구성": "**원자 = 핵(양성자 + 중성자) + 전자.**", "입자 전하": "**양성자 (+), 전자 (-), 중성자 0.** 전하량 크기가 같아 수가 같으면 중성이고, 이온은 전자가 드나들어 생긴다.", "원자번호": "**원자번호 = 양성자 수**(원소 결정, 이온돼도 불변). 주기율표를 조직하는 근본 수이고(원자량 아님), 중성 원자에선 전자 수와 같다.", "원소 결정": "**원소 = 양성자 수로 결정**(중성자·전자 무관).", "질량수": "**질량수 = 양성자 + 중성자**(전자 제외, 전자는 1/1840이라 무시). 중성자 수 = 질량수 − 원자번호이고, 평균값인 원자량과는 다르다.", "원자 표기": "**왼쪽 위 = 질량수, 왼쪽 아래 = 원자번호.**", "전자수": "**중성 원자: 전자 수 = 양성자 수.** 양이온은 적고 음이온은 많음.", "질량수 계산": "**질량수 = 양성자 + 중성자**(합). 중성자 = 질량수 - 원자번호.", "입자 질량": "**양성자 ≈ 중성자 ≫ 전자**(전자 1/1840). 전자가 워낙 가벼워 원자 질량은 사실상 핵(양성자 + 중성자)이 정한다.", "원자 질량 분포": "**원자 질량 = 대부분 원자핵에**(전자 무시). 핵은 원자의 10만분의 1 크기인데 질량의 99.9%를 가져, 질량은 핵이 크기는 전자가 정한다.", "원자핵 크기": "**핵은 매우 작음(질량 집중), 원자 대부분은 빈 공간.** 핵은 원자의 10만분의 1 크기인데 질량의 99.9%라 밀도가 극히 크다.", "동위원소 정의": "**동위원소 = 원자번호 같고 질량수 다름.**", "동위원소 전자": "**동위원소 = 전자 배치 같음**(화학적 성질 같음).", "핵전하": "**핵전하(+) = 양성자 수로 결정**(중성자 무관).", "동위원소 판정": "**¹⁶O와 ¹⁸O는 양성자 8로 같음**(중성자만 다름).", "동위원소 vs 동중원소": "**동위원소(원자번호 같음) vs 동중원소(질량수 같음, 다른 원소).**", "이온 형성": "**전자 잃음 → 양이온, 얻음 → 음이온**(양성자 불변).", "이온 전자수": "**양이온 전자 적음, 음이온 전자 많음.**", "이온 양성자수": "**이온돼도 양성자 수(원자번호) 불변**(전자만 변함). 양성자 수가 원소를 정의하므로 화학 변화로는 원소가 바뀌지 않는다.", "수소 동위원소": "**수소 동위원소 모두 양성자 1개**(중성자만 0·1·2).", "원자모형 변천": "**돌턴 → 톰슨 → 러더퍼드 → 보어 → 현대.**", "전자 발견": "**톰슨이 음극선 실험으로 전자 발견.** e/m을 재 원자보다 작은 입자임을 밝혀 불가분성을 깨고 건포도 푸딩 모형을 세웠다.", "음극선 성질": "**음극선 = (-)전하(전자), (+)극 쪽으로 휨.**", "톰슨 모형": "**톰슨 모형 = (+)바탕에 전자 박힘**(핵 없음).", "원자핵 발견": "**러더퍼드가 알파 산란으로 원자핵 발견.** 되튀는 알파 입자가 작고 무거운 (+)핵과 대부분 빈 공간을 드러내 건포도 푸딩 모형을 뒤집었다.", "알파 산란 결과": "**대부분 통과, 극히 일부만 크게 휨/되튐.**", "알파 산란 해석": "**원자 대부분 빈 공간 + 작은 (+)핵에 질량 집중.**", "핵의 존재": "**알파 입자 튕김 = 작고 무거운 (+)핵 때문.**", "보어 모형": "**보어: 전자는 정해진 궤도(전자껍질)에만 존재.**", "전자껍질 순서": "**전자껍질 = 안쪽부터 K, L, M, N**(n=1,2,3,4).", "에너지 준위": "**핵에서 멀수록 에너지 높음**(K < L < M < N). 멀수록 덜 묶여 덜 음수라 높고, 가장 안쪽이 안정해 전자가 거기부터 채워진다.", "에너지 양자화": "**전자 에너지 = 불연속(양자화)**, E_n=−13.6/n²이라 위로 갈수록 촘촘해지고 n=∞에서 이온화. 허용 준위만 있어 선 스펙트럼이 된다.", "바닥상태": "**바닥상태 = 가장 낮은 준위(가장 안정).**", "전자 전이": "**올라가면 흡수, 떨어지면 방출**(에너지 = 준위 차이). λ=hc/ΔE라 전이마다 특정 파장이 나오고(발머=가시광선), 그 집합이 원소의 지문이다.", "선 스펙트럼": "**수소 선 스펙트럼 = 불연속적인 선**(특정 파장만).", "스펙트럼 해석": "**선 스펙트럼 = 에너지 양자화(불연속)의 증거.**", "연속 스펙트럼": "**백색광 → 연속 스펙트럼**(모든 파장). 원자는 양자화로 방출 선(밝음)·흡수 선(어두움)을 같은 파장에 만들어, 별의 성분까지 읽게 한다.", "스펙트럼선 의미": "**각 스펙트럼선 = 두 준위의 에너지 차이.**", "보어 모형 성공": "**보어 모형 = 수소 선 스펙트럼을 잘 설명**(수소 한정).", "보어 모형 한계": "**보어 모형 = 다전자 원자엔 한계**(수소만 잘 맞음).", "현대 모형": "**현대 모형: 전자는 확률 분포(오비탈)**(정확한 점 아님).", "오비탈": "**오비탈 = 전자의 확률 분포**(궤도 아님). 불확정성 원리로 정해진 궤도를 그릴 수 없어, 전자가 있을 확률이 높은 공간으로 나타낸다.", "불확정성": "**위치·운동량 동시 정확 측정 불가 → 전자는 확률 분포.**", "오비탈 종류": "**s = 구형, p = 아령**(종류마다 모양 다름).", "전이 에너지": "**전이 에너지 = 준위 차이, 에너지 클수록 파장 짧음.**", "부껍질": "**전자껍질 → 부껍질(s, p, d, f)로 세분**(다전자 원자에서 에너지 갈림).", "주양자수": "**주양자수 n = 껍질 번호(1 이상), n 클수록 에너지 높음.**", "바닥·들뜬상태": "**흡수 → 들뜬상태, 방출 → 바닥상태**(바닥이 가장 안정).", "오비탈 전자수": "**한 오비탈 = 최대 2개**(스핀 반대). ms가 두 값뿐이라 2개이고, 이 기본 단위에서 부껍질·껍질 수용 수가 모두 쌓인다.", "오비탈 수": "**s 1, p 3, d 5, f 7개**(오비탈 수).", "부껍질 전자수": "**s 2, p 6, d 10, f 14**(오비탈 수 × 2, 파울리). 이 수들이 주기율표 s·p·d·f 블록의 너비이고, 그 뿌리는 양자수와 파울리다.", "껍질 최대 전자수": "**껍질 최대 전자 = 2n²**(2, 8, 18, 32). n²은 오비탈 수(1+3+5+... 합), 2는 스핀이라, 파울리에서 곧장 나온다.", "쌓음 원리": "**쌓음 원리 = 에너지 낮은 오비탈부터 채움.**", "오비탈 에너지 순서": "**4s<3d로 먼저 채움(침투 때문), 같은 껍질 s<p<d.** 단 채운 뒤엔 3d<4s라 이온화 때 4s가 먼저 빠진다.", "파울리 배타원리": "**한 오비탈 두 전자 = 스핀 반대**(→ 최대 2개). 네 양자수가 같을 수 없어서이고, 이 하나가 s·p·d·f 수용 수(2·6·10·14)와 주기율표 모양을 만든다.", "훈트 규칙": "**훈트 규칙 = 하나씩 먼저(홀전자 최대, 같은 스핀).** 반발 회피와 평행 스핀 교환 안정화 때문이고, 이것이 반쯤·꽉 찬 부껍질의 안정성과 예외를 만든다.", "전자 배치 표기": "**위 첨자 합 = 원자번호**(C 2p², O 2p⁴, Na ...3s¹). 쌓음·파울리·훈트로 채우고, 최외각 배치가 그 원소의 화학적 성질을 정한다.", "원자가전자": "**원자가전자 = 최외각 전자**(18족은 0).", "홀전자": "**홀전자: C 2, N 3, O 2, F 1.**", "들뜬상태": "**들뜬상태 = 높은 오비탈(불안정), 쌓음 원리 안 따름.**", "전자수 세기": "**전자 총수 = 위 첨자의 합**(1s²2s²2p⁶3s¹ = 11).", "가려막기": "**가려막기 = 안쪽 전자가 핵 인력을 가림**(유효핵전하 ↓).", "유효핵전하": "**유효핵전하 = 핵전하 − 가려막기**(주기 오른쪽으로 ↑). 같은 껍질끼리 가려막기를 잘 못 해서이고, 반지름·이온화 에너지·전기음성도가 전부 이 하나를 따른다.", "전자 반발": "**전자끼리 반발**(가려막기·훈트 규칙의 원인).", "주기 구조": "**같은 주기 = 전자껍질 수 같음**(원자가전자는 족).", "족 성질": "**같은 족 = 원자가전자 수 같음**(성질 비슷).", "유효핵전하 주기성": "**같은 주기 오른쪽으로 유효핵전하 ↑**(반지름 ↓).", "원자 반지름": "**주기 오른쪽 작아짐, 족 아래로 커짐.** 양이온<중성<음이온이고, 등전자 이온은 핵전하가 클수록 작다(Mg²⁺<Na⁺<F⁻<O²⁻).", "이온 반지름": "**양이온 작아짐, 음이온 커짐.**", "등전자 이온": "**등전자 이온: 핵전하 클수록 반지름 작음.**", "이온화 에너지": "**이온화 에너지 = 전자 떼는 데 필요한 에너지**(클수록 떼기 어려움).", "이온화 에너지 주기성": "**주기 오른쪽 커짐, 족 아래로 작아짐.** Be>B(2p가 높음), N>O(짝 반발)의 예외가 s/p 간격과 훈트 규칙을 드러낸다.", "순차 이온화 에너지": "**E₁ < E₂ < E₃, 급증 지점으로 원자가전자 수 판별.**", "전기음성도": "**전기음성도 = 공유 전자쌍을 당기는 능력.**", "전기음성도 주기성": "**주기 오른쪽 커짐, 족 아래로 작아짐.** 유효 핵전하와 반지름이 운전자라, 반지름과 반대로 움직이고 F가 최대다.", "전기음성도 최대": "**전기음성도 최대 = 플루오린(F)**(큰 유효핵전하 + 작은 크기). 전자 친화도(F<Cl)와는 다른 개념임에 주의.", "금속성": "**금속성 = 왼쪽 아래로 커짐**(전자 잃음).", "비금속성": "**비금속성 = 오른쪽 위로 커짐**(전자 얻음).", "알칼리 금속": "**알칼리 금속: 아래로 갈수록 반응성 ↑**(+1 양이온).", "할로젠": "**할로젠: 위로 갈수록 반응성 ↑**(−1 음이온, F 최대). 전자를 얻는 쪽이라 작을수록 잘 얻어 반응성이 크고, 알칼리 금속과 정반대다.", "비활성 기체": "**비활성 기체 = 안정(반응성 작고 이온화 에너지 큼).**", "전자 친화도": "**전자 친화도 = 전자 얻을 때 방출 에너지**(클수록 음이온화).", "금속 이온화": "**금속 = 전자 잃기 쉬움(이온화 에너지 작음, 양이온).**", "비금속 전기음성도": "**비금속 = 전자 얻기 쉬움(전기음성도 큼, 음이온).**", "이온화 에너지 비교": "**오른쪽·위가 큼**(Mg > Na, Li > Na, 18족 최대).", "전기음성도 비교": "**같은 족 위 원소가 전기음성도 큼**(F > Cl, O > S).", "원자 반지름 비교": "**아래·왼쪽이 반지름 큼**(S > O, Na > Cl).", "결합 형성 이유": "**안정한 전자 배치(낮은 에너지)를 위해 결합.**", "결합과 에너지": "**형성 = 방출(발열), 분해 = 흡수(흡열).**", "이온결합": "**이온결합 = 금속 양이온 + 비금속 음이온(정전기적 인력).**", "공유결합": "**공유결합 = 두 비금속이 전자쌍 공유.**", "금속결합": "**금속결합 = 금속 양이온 + 자유전자(음이온 아님).** 느슨한 원자가전자가 전체에 퍼진 전자 바다가 양이온을 묶고, 이것이 전도성·전성을 만든다.", "이온결정": "**이온결합 물질 = 이온결정(분자 아님), 실험식 표기.**", "공유결합 종류": "**단일 1·이중 2·삼중 3**(N₂ 삼중, O₂ 이중).", "결합 에너지 곡선": "**에너지 최저 거리 = 결합 길이**(너무 가까우면 반발).", "결합 길이": "**결합 차수 클수록 결합 길이 짧음**(삼중 < 단일).", "이온결정 성질": "**이온결정 = 단단하나 부서지기 쉬움**(녹는점 높음).", "이온결정 전도성": "**이온결합 물질: 고체 안 통함, 액체·수용액 통함.** 금속은 자유 전자로 고체도 통하고, 이온결정은 녹아야 이온이 움직여 통한다.", "금속 전도성": "**금속: 고체·액체 모두 전기 통함**(자유전자). 운반자인 전자가 어떤 상태에서도 자유로워, 녹아야 통하는 이온결정과 다르다.", "금속 성질": "**금속 = 전성·연성·광택·전도성**(자유전자 때문).", "공유결정": "**공유결정 = 원자 연속 결합(매우 단단, 녹는점 매우 높음).** 녹이려면 강한 공유결합을 끊어야 해서이고, 분자 간 힘만 끊는 분자결정과 정반대다.", "흑연": "**흑연 = 공유결정이지만 전기 통함**(다이아몬드는 안 통함).", "분자결정": "**분자결정 = 약한 분자간 인력(녹는점 낮음).**", "분자결정 비교": "**녹는점: 공유결정 > 이온결정 > 분자결정.**", "이온결정 녹는점": "**이온결정 = 녹는점 높음**(강한 정전기적 인력).", "결합 극성": "**같은 원소 = 무극성, 전기음성도 차이 = 극성.**", "격자 에너지": "**격자 에너지 ∝ (q⁺q⁻)/d**: 전하 크고 이온 작을수록 큼(MgO≫NaCl). 직접 못 재서 보른-하버 순환(헤스 법칙)으로 구한다.", "이온결합 판정": "**금속 + 비금속 = 이온결합**(NaCl, MgO).", "이온결정 배열": "**이온결정 = 반대 전하 이온이 교대로 규칙적 배열.**", "공유결합 판정": "**비금속 + 비금속 = 공유결합**(H₂O, CO₂, CH₄).", "VSEPR 원리": "**VSEPR = 전자쌍이 반발 최소화하게 배치**(최대한 멀리).", "공유 전자쌍": "**공유 전자쌍 = 결합에 참여, 비공유 = 한 원자에만.**", "전자쌍 배치": "**2 직선·3 평면 삼각형·4 정사면체.**", "전자쌍 각도": "**2개 180°·3개 120°·4개 109.5°.**", "다중결합 취급": "**다중 결합 = 하나의 영역으로 취급.**", "분자 모양": "**CO₂ 직선·CH₄ 정사면체·NH₃ 삼각뿔·H₂O 굽은형.** 전자쌍이 최대한 멀어지고(VSEPR), 비공유쌍이 더 넓은 각을 차지해 결합각을 좁힌다.", "분자 루이스 구조": "**H₂O 공유 2·비공유 2, NH₃ 공유 3·비공유 1**(O₂ 이중, N₂ 삼중).", "비공유 전자쌍": "**비공유 전자쌍: H₂O 2·NH₃ 1·CH₄ 0.**", "결합각": "**결합각 CH₄ > NH₃ > H₂O**(비공유 전자쌍 많을수록 작음). 비공유는 한 핵에만 끌려 더 넓게 퍼져 결합각을 더 세게 좁힌다.", "비공유 전자쌍 반발": "**비공유 전자쌍 반발 > 공유 전자쌍 반발.**", "결합각 비교": "**결합각 CH₄ > NH₃ > H₂O.**", "결합각 원인": "**결합각 감소 = 비공유 전자쌍 반발 때문.**", "옥텟 규칙": "**옥텟 규칙 = 최외각 8개**(수소만 2개).", "분자 모양 결정": "**분자 모양 = 공유 + 비공유 전자쌍 수로 결정.**", "정사면체": "**정사면체 = 결합각 109.5°, 입체 구조.**", "다중 결합": "**N₂ 삼중·O₂ 이중**(차수 클수록 강하고 짧음).", "고립 전자쌍": "**고립 전자쌍 = 비공유 전자쌍**(결합 참여 안 함, 모양에 영향).", "부분 전하": "**전기음성도 큰 원자 = δ-, 작은 원자 = δ+.**", "쌍극자 모멘트": "**쌍극자 모멘트 = 극성 크기 + 방향(0이면 무극성).**", "극성결합 vs 극성분자": "**극성 결합이어도 대칭이면 무극성 분자**(CO₂).", "무극성 분자": "**대칭 분자(CO₂·BF₃·CH₄·CCl₄) = 무극성**(쌍극자 상쇄). 극성은 결합 극성과 모양 둘에 달려, 같은 AB₂라도 직선이면 무극성·굽으면 극성이다.", "무극성 원인": "**무극성 원인 = 대칭 구조로 쌍극자 상쇄**(결합은 극성).", "극성 분자": "**비대칭 분자(H₂O·NH₃·HF) = 극성**(쌍극자 안 상쇄). 극성 결합이 비대칭 모양 때문에 상쇄되지 않아서이고, 대칭이면 무극성이다.", "극성 원인": "**극성 원인 = 비대칭 구조로 쌍극자 안 상쇄**(H₂O 굽은형).", "분자 극성 판단": "**분자 극성 = 결합 극성 + 분자 모양**(둘 다 봐야 함).", "대칭과 극성": "**대칭 분자 = 무극성, 비대칭 분자 = 극성.**", "혼성 오비탈": "**sp 직선·sp² 평면 삼각형·sp³ 정사면체.**", "혼성 적용": "**CH₄·NH₃·H₂O sp³, BF₃ sp², CO₂ sp.** 영역 수(비공유쌍 포함)로 정하고, 혼성은 VSEPR 기하의 사후 설명이며, s 성질이 클수록 결합각이 크다.", "혼성 수": "**혼성 오비탈 수 = 영역 수**(공유 + 비공유).", "극성과 용해": "**비슷한 극성끼리 잘 녹음**(유유상종).", "전기장 배열": "**극성 분자 = 전기장에서 규칙적 배열**(무극성은 정렬 안 됨).", "극성과 끓는점": "**분자량 비슷하면 극성 분자 끓는점 높음**(쌍극자-쌍극자 인력).", "분산력": "**분산력 = 모든 분자 사이 작용**(분자량 클수록 큼).", "가역 반응": "**가역 반응 = 정·역반응 모두 일어남(⇌).**", "동적 평형 개념": "**동적 평형 = 정·역반응이 같은 속도로 계속 일어남**(멈춘 것 아님). 두 속도가 만나 같아진 상태이고, 증기압·포화 용액도 같은 구조다.", "동적 평형 정의": "**동적 평형 = 정반응 속도 = 역반응 속도**(0 아님). 양방향이 똑같이 바빠 상쇄될 뿐 분자는 계속 전환되며, 농도 일정은 반응 정지가 아니다.", "평형 농도": "**평형 농도 = 일정**(단, 반응물과 생성물 농도가 같은 건 아님).", "평형의 겉보기": "**평형 = 겉보기 일정하나 반응은 계속**(동적 상태).", "평형 상수 식": "**K = 생성물/반응물(계수만큼 제곱, 고체·순수액체 제외).**", "평형 상수 해석": "**K 크면 생성물 많음, K 작으면 반응물 많음.** K=생성물/반응물이라 그렇고, K는 진행 정도지 속도가 아니다.", "평형 상수와 온도": "**K는 온도로만 변함.** K=e^(−ΔG°/RT)라 온도가 목표값을 옮기고, 농도·압력은 위치만, 촉매는 도달 속도만 바꾼다(발열 온도↑→K↓).", "반응 지수": "**반응 지수 Q = 현재 농도로 계산**(평형이면 Q = K).", "반응 지수 방향": "**Q < K 정반응, Q > K 역반응, Q = K 평형.** ΔG = RT ln(Q/K)라 Q와 K 비교는 곧 ΔG의 부호이고, 반응은 Q=K로 굴러간다.", "비가역 반응": "**비가역 반응 = 한 방향으로만 진행**(역반응 거의 없음).", "평형 도달": "**닫힌 용기 → 평형 도달**(도달 시간은 반응마다 다름).", "평형 상수 단위": "**K 단위 = 반응에 따라 다름**(보통 무차원).", "반응 지수 활용": "**Q와 K를 비교해 반응 방향 예측**(Q 단독으로는 불가).", "정·역반응 열": "**정·역반응 = 발열·흡열 서로 반대**(ΔH 부호 반대).", "르샤틀리에 정의": "**르샤틀리에 = 변화를 줄이는 방향으로 이동**, 정확히는 Q를 K로 되돌리는 것. 농도·압력은 Q만, 온도는 K를 바꾸고, 촉매는 이동을 안 일으킨다.", "농도 변화": "**반응물↑·생성물 제거 → 정반응, 생성물↑·반응물 제거 → 역반응.**", "온도 변화": "**온도↑ → 흡열 방향, 온도↓ → 발열 방향.** 열을 반응물·생성물로 보면 완화 방향이 보이고, 온도만이 K 자체를 바꾼다.", "온도와 평형 상수": "**K는 온도로만 변함**(발열 온도↑ → K↓, 흡열 온도↑ → K↑).", "압력 변화": "**압력↑ → 분자 수 적은 쪽, 압력↓ → 많은 쪽**(같으면 이동 없음). Q를 K로 되돌리는 것이고, 일정 부피의 비활성 기체는 이동을 안 일으킨다.", "촉매": "**촉매 = 평형에 빨리 도달**(위치·K·수득률 그대로). 공유 봉우리를 낮춰 양방향을 가속할 뿐이라, 수율은 압력·온도·생성물 제거로 얻는다.", "압력 적용": "**N₂+3H₂⇌2NH₃: 압력↑ → NH₃ 쪽**(고압 유리).", "온도 적용": "**N₂+3H₂⇌2NH₃(발열): 온도↓ → NH₃ 증가.**", "평형 이동과 K": "**농도·압력으로 평형 이동해도 K는 그대로**(온도만 K 변화).", "르샤틀리에 활용": "**르샤틀리에 원리 = 평형 이동 방향 예측·수득률 조절.**", "평형 재도달": "**평형 이동 후 새로운 평형에 도달**(속도가 다시 같아짐).", "증발·응축 평형": "**증발 속도 = 응축 속도 = 동적 평형**(둘 다 계속 일어남).", "증기압": "**증기압 = 평형 증기의 압력**(양 무관, 온도·물질에 의존).", "증기압과 온도": "**온도↑ → 증기압↑**(증발 활발).", "증기압 평형": "**증기압 평형 = 증기 양 일정**(증발·응축은 계속).", "끓음": "**증기압 = 외부 압력일 때 끓음**(내부에서도 기화).", "끓는점과 압력": "**외부 압력↑ → 끓는점↑(압력솥), 압력↓ → 끓는점↓(산).** 끓는점이 증기압=외부 압력인 온도라 같은 방향이다.", "승화": "**승화 = 고체 → 기체 직접**(액체 거치지 않음).", "용해·석출 평형": "**용해 속도 = 석출 속도 = 용해 평형**(둘 다 계속 일어남).", "포화 용액": "**포화 용액 = 용해 평형(동적)**(용해 속도 = 석출 속도). 멈춘 게 아니라 양방향이 맞물린 균형이고, 화학 평형·증기압과 같은 구조다.", "불포화 용액": "**불포화 용액 = 더 녹일 수 있음**(용해 속도 > 석출 속도).", "과포화 용액": "**과포화 용액 = 용해도 초과(불안정)**(자극 시 석출).", "용해도": "**용해도 = 용매 100 g당 최대 용질 g수**(온도·물질에 따라 다름).", "고체 용해도와 온도": "**고체: 온도↑ → 용해도↑.**", "기체 용해도와 온도": "**기체: 온도↑ → 용해도↓**(찬물에 더 녹음, 고체와 반대). 데우면 탈출할 운동 에너지를 쉽게 얻어 빠져나가고, 압력은 반대로 작용한다.", "기체 용해도와 압력": "**기체: 압력↑ → 용해도↑**(헨리 법칙).", "용해 평형": "**용해 평형 = 용해·석출 끊임없이 반복**(농도 일정, 동적).", "동적 평형 예": "**동적 평형 = 증기압·용해 평형 등**(두 변화가 같은 속도로 계속).", "용액 구성": "**용질 = 녹는 물질, 용매 = 녹이는 물질.**", "퍼센트 농도": "**퍼센트 농도 = 용질 질량 / 용액 질량 × 100.**", "몰농도 정의": "**몰농도 = 용질 몰수 / 용액 부피(L).** 표시선까지 맞춘 용액 전체의 부피가 기준이라, 부피가 변하는 온도에 따라 달라진다.", "몰농도 단위": "**몰농도 단위 = mol/L (M).**", "몰농도 계산": "**몰농도 = 몰수 ÷ 부피(L)**(0.5 L에 1몰 → 2 M).", "용액 제조": "**용질 넣고 표선까지 채움**(부피 플라스크).", "몰농도 기준 부피": "**몰농도 기준 = 용액의 부피**(용매 아님).", "희석": "**희석 = 용매 추가**(용질 몰수 불변, MV = M'V'). 보존되는 것은 용질의 몰수라, 농도와 부피가 반비례로 맞바뀐다.", "희석 계산": "**2 M 100 mL → 200 mL = 1 M**(부피 2배 → 농도 절반).", "농도 환산": "**농도 환산 = 밀도 + 몰질량 필요.**", "몰농도와 온도": "**몰농도는 온도에 따라 변함**(부피가 변하기 때문).", "퍼센트 농도와 온도": "**퍼센트 농도는 온도와 무관**(질량 기준).", "몰수와 부피": "**같은 농도: 부피 클수록 몰수 많음**(몰수 = 농도 × 부피).", "몰수 계산": "**몰수 = 농도 × 부피(L)**(1 M × 0.5 L = 0.5몰).", "몰수 환산": "**몰수 = 질량 / 몰질량**(40 g ÷ 40 g/mol = 1몰).", "농도 비교": "**퍼센트 농도 같아도 몰질량 다르면 몰농도 다름.**", "실험 기구": "**정확한 부피 = 부피 플라스크·피펫**(비커는 대략).", "용액 부피": "**용액 부피 ≠ 단순 합**(입자가 섞이며 부피 변함).", "자동이온화": "**물은 약간 자동이온화**(H⁺ = OH⁻ 같은 수).", "물의 이온곱": "**Kw = [H⁺][OH⁻] = 10⁻¹⁴(25°C).**", "중성 농도": "**중성: [H⁺] = [OH⁻] = 10⁻⁷ M**(곱이 10⁻¹⁴).", "순수한 물": "**순수한 물 = 중성**([H⁺] = [OH⁻], pH 7).", "Kw와 온도": "**Kw는 온도에 따라 변함**(25°C에서만 10⁻¹⁴).", "pH 정의": "**pH = -log[H⁺]**([H⁺] 작을수록 pH 큼).", "pOH 정의": "**pOH = -log[OH⁻]**([OH⁻] 작을수록 pOH 큼).", "pH+pOH": "**25°C: pH + pOH = 14**(Kw = 10⁻¹⁴에서).", "산성 판정": "**pH < 7 = 산성**([H⁺] > [OH⁻]).", "중성 판정": "**pH = 7 = 중성**([H⁺] = [OH⁻]).", "염기성 판정": "**pH > 7 = 염기성**([OH⁻] > [H⁺]).", "산성 이온 농도": "**산성: [H⁺] > [OH⁻]**([H⁺] > 10⁻⁷ M).", "염기성 이온 농도": "**염기성: [OH⁻] > [H⁺]**([H⁺] < 10⁻⁷ M).", "pH-농도 관계": "**[H⁺]↑ → pH↓**(pH 1 감소 = [H⁺] 10배 증가).", "pH 비교": "**pH 차이 n → [H⁺] 10ⁿ배 차이**(pH 차이 2 = 100배).", "pH 계산": "**[H⁺] = 10⁻ⁿ M → pH = n.**", "pH-pOH 계산": "**pOH = 14 - pH**(pH 11 → pOH 3).", "지시약": "**페놀프탈레인 = 염기성에서 붉음, 메틸오렌지 = 산성에서 붉음.**", "산성 세기": "**pH 작을수록 산성 강함**([H⁺] 클수록).", "염기성 세기": "**pH 클수록 염기성 강함**([OH⁻] 클수록).", "희석과 pH": "**희석 → pH가 7에 가까워짐**(산성↑, 염기성↓).", "Kw 적용": "**[H⁺][OH⁻] = 10⁻¹⁴**(10⁻⁵ → 10⁻⁹).", "Kw 일정성": "**같은 온도면 액성과 무관하게 Kw 동일**(25°C 10⁻¹⁴).", "산중염 판정": "**pH < 7 산성, = 7 중성, > 7 염기성.**", "Kw": "**농도 10⁻⁷ M, 곱(Kw) 10⁻¹⁴.**", "중화 정의": "**중화 = 산 + 염기 → 물 + 염.**", "알짜 이온 반응식": "**알짜 이온 반응식 = H⁺ + OH⁻ → H₂O**(구경꾼 제외).", "구경꾼 이온": "**구경꾼 이온 = 반응 안 하고 남는 이온**(Na⁺, Cl⁻).", "중화점 양적관계": "**중화점: H⁺ 몰수 = OH⁻ 몰수**(1:1 완전 반응).", "양적관계 식": "**M₁V₁ = M₂V₂**(MV = 몰수, V는 부피).", "가수": "**가수 클수록 H⁺(OH⁻) 많이 내놓음**(2가 산 = H⁺ 2몰).", "중화열": "**중화 = 발열 반응**(온도 올라감).", "중화적정": "**중화적정 = 표준 용액으로 미지 농도 구하기.**", "양적관계 계산": "**완전 중화 = 농도 × 부피(몰수)가 같음.**", "중화점 pH": "**강산-강염기 중화점 = pH 7(중성).**", "염": "**염 = 산의 음이온 + 염기의 양이온**(NaCl).", "일상의 중화": "**중화 = 산에 염기, 염기에 산**(석회로 산성 중화).", "양적관계 기본": "**H⁺ : OH⁻ = 1 : 1**(같은 몰수가 반응).", "가수 양적관계": "**2가 산 0.1몰 = H⁺ 0.2몰**(1가 염기 0.2몰 필요).", "중화점 전후": "**중화점 후엔 더 넣은 쪽 성질**(염기 더 넣음 → 염기성).", "중화 생성물": "**중화 생성물 = 물 + 염**(둘 다).", "물 생성": "**물 = H⁺ + OH⁻ 결합**(구경꾼 이온 아님).", "표준 용액": "**표준 용액 = 농도를 정확히 아는 기준 용액.**", "완전 중화": "**완전 중화 = H⁺ 몰수 = OH⁻ 몰수**(남는 것 없음).", "화학식량": "**화학식량 = 원자량의 합**(곱·최댓값 아님).", "분자량": "**분자량 = 원자량의 합**(H₂O=18, CO₂=44, O₂=32).", "질량비": "**질량비 = (원자 수 × 원자량)의 비**(H₂O 수소:산소 = 1:8).", "질량 백분율": "**질량% = 원소 질량 / 전체 질량 × 100**(H₂O 산소 88.9%).", "실험식 정의": "**실험식 = 원자의 가장 간단한 정수비.**", "분자식 정의": "**분자식 = 분자 속 실제 원자 수**(실험식의 정수배).", "실험식 구하기": "**실험식 = 분자식 ÷ 최대공약수**(C₆H₁₂O₆ → CH₂O).", "실험식·분자식 관계": "**분자식 = 실험식 × 정수**(분자량이 있어야 결정).", "실험식→분자식": "**배수 = 분자량 / 실험식량**(CH₂O 분자량 180 → 6배).", "조성 분석": "**질량/원자량 = 몰수, 몰수 정수비 = 실험식**(→ CH₂O).", "실험식 적용": "**분자 없는 물질(NaCl 등) = 실험식으로 표현.**", "일정 성분비": "**일정 성분비 = 화합물 조성 항상 일정**(물 H:O = 1:8).", "실험식량": "**실험식량 = 실험식의 원자량 합**(CH=13, CH₂O=30).", "엔탈피 정의": "**엔탈피 = 물질이 가진 에너지(변화량 ΔH로 다룸).**", "반응엔탈피 정의": "**ΔH = 생성물 − 반응물**(출입 열량).", "발열 ΔH 부호": "**발열 반응 = ΔH < 0**(음수). 계가 열을 내보내 엔탈피가 줄어서이고, 발열이 곧 자발은 아니다.", "흡열 ΔH 부호": "**흡열 반응 = ΔH > 0**(양수).", "발열 온도 변화": "**발열 반응 → 주위 온도 올라감**(열 방출). 계가 잃은 에너지를 주위가 받아서이고, 계의 ΔH < 0과 같은 사건이다.", "흡열 온도 변화": "**흡열 반응 → 주위 온도 내려감**(열 흡수).", "열화학 반응식": "**열화학 반응식 = 반응식 + ΔH**(계수 2배 → ΔH 2배).", "열화학 반응식 상태": "**상태(s, l, g, aq) 반드시 표시**(ΔH가 상태에 따라 다름).", "발열 반응 예": "**발열 = 연소·중화·금속+산**(증발·광합성은 흡열).", "흡열 반응 예": "**흡열 = 광합성·증발·질산 암모늄 용해**(주위 차가워짐).", "발열과 엔탈피": "**발열 반응: 반응물 엔탈피 > 생성물 엔탈피.**", "흡열과 엔탈피": "**흡열 반응: 생성물 엔탈피 > 반응물 엔탈피.**", "정·역반응": "**정·역반응 = 발열·흡열 서로 반대.**", "정·역반응 ΔH": "**정·역반응 ΔH = 크기 같고 부호 반대.**", "헤스 법칙": "**헤스 법칙 = 반응엔탈피는 경로와 무관**(처음·끝으로 정해짐).", "헤스 법칙 적용": "**전체 ΔH = 단계 ΔH의 합**(뒤집으면 부호↔, 곱하면 곱함).", "결합 에너지": "**결합 끊기 = 흡열, 만들기 = 발열**(클수록 강함).", "결합 에너지로 ΔH": "**ΔH ≈ 반응물 결합 에너지 − 생성물 결합 에너지.**", "결합 에너지 적용": "**생성물 결합 강할수록 발열**(만드는 에너지가 큼).", "상태와 ΔH": "**상태(액체/기체)에 따라 ΔH 달라짐.**", "흡열 과정 예": "**융해·증발 = 흡열, 응결 = 발열.**", "발열 ΔH 표기": "**발열 반응 ΔH = 음(-)의 값**(-○○ kJ).", "발열·흡열 판단": "**주위 온도 ↑ = 발열, ↓ = 흡열.**", "상태 함수": "**엔탈피 = 상태 함수(경로 무관)**(헤스 법칙의 근거).", "흡열 ΔH 표기": "**흡열 반응 ΔH = 양(+)의 값**(+○○ kJ).", "아레니우스 정의": "**아레니우스 산 = H⁺, 염기 = OH⁻ 내놓음.**", "브뢴스테드 정의": "**브뢴스테드 산 = 양성자 주개, 염기 = 받개.** 양성자 이동으로 정의해 아레니우스보다 넓고, 산·염기는 짝을 이뤄 상대에 따라 정해진다.", "짝산-짝염기": "**산이 H⁺ 잃으면 짝염기**(H⁺ 한 개 차이).", "양쪽성": "**물 = 양쪽성**(산·염기 모두 작용).", "산 세기": "**산의 세기 = 이온화 정도**(농도와 다름).", "강산": "**강산 = 거의 완전히 이온화.**", "강산 예": "**강산 = HCl·HNO₃·H₂SO₄**(아세트산은 약산).", "약산 예": "**약산 = HF·아세트산·탄산**(일부만 이온화).", "약산": "**약산 = 일부만 이온화**(분자 많이 남음).", "강염기 예": "**강염기 = NaOH·KOH**(암모니아는 약염기).", "약염기 예": "**암모니아 = 약염기**(일부만 이온화). 강·약은 이온화 정도이지 농도가 아니고, 약산과 거울상 대칭이다.", "이온화 상수": "**Ka = 산, Kb = 염기의 이온화 상수.**", "Ka와 세기": "**Ka 클수록 강한 산**. Ka는 이온화 평형 상수라 클수록 이온 쪽으로 치우치고, 물속 강산들은 평준화되어 같게 보인다.", "Ka 해석": "**Ka 클수록 더 잘 이온화**(H⁺ 농도 높음).", "Ka·Kb 관계": "**Ka·Kb = Kw**. 두 식을 곱하면 [HA]·[A⁻]가 약분되고 [H⁺][OH⁻]=Kw만 남는다. 짝산-짝염기 세기는 물이 묶어 둔 반비례다.", "짝염기 세기": "**강산일수록 짝염기 약함**(약산일수록 짝염기 강함).", "강산 vs 약산": "**같은 농도면 강산 H⁺ 농도 더 큼**(pH 더 낮음).", "pKa": "**pKa 작을수록 강한 산**(Ka 크면 pKa 작음).", "물 이온곱": "**Kw = [H⁺][OH⁻] = 1×10⁻¹⁴**(25°C).", "이온화도": "**강산 이온화도 ≈ 1, 약산 이온화도 작음.**", "전기 전도성": "**같은 농도면 강산 전기 전도성 큼**(이온 많음).", "중성 pH": "**25°C 중성 = pH 7**([H⁺] = [OH⁻]).", "산성 pH": "**산성 = pH < 7**([H⁺] > [OH⁻]). 25도 Kw = 10⁻¹⁴라 중성이 7이고, 본질은 [H⁺]와 [OH⁻]의 대소다.", "염기성 pH": "**염기성 = pH > 7**([OH⁻] > [H⁺]).", "pH와 농도": "**pH ↑ → [H⁺] ↓**(반대로 움직임).", "pH 척도": "**pH 1 차이 = [H⁺] 10배 차이**(로그 척도).", "강산 pH": "**강산 [H⁺] ≈ 산 농도**(거의 완전히 이온화).", "강염기 pOH": "**강염기 [OH⁻] ≈ 염기 농도**(pH = 14 - pOH).", "약산 근사": "**약산 [H⁺] ≈ √(Ka·C)**(농도보다 작음).", "약산 vs 강산 pH": "**같은 농도면 약산 pH가 강산보다 높음**([H⁺] 작음).", "약산 이온화": "**약산은 같은 농도 강산보다 H⁺ 적게 내놓음**(이온화도 작음).", "완충 용액 구성": "**완충 용액 = 약산+짝염기**. 약산은 염기를, 짝염기는 산을 막는 두 저수지다. 강산의 짝염기는 방관자라 완충이 안 된다.", "완충 작용": "**완충 용액 = 소량의 산·염기에도 pH 거의 일정.**", "헨더슨-하셀바흐": "**pH = pKa + log([짝염기]/[산])**([짝염기]=[산]이면 pH=pKa).", "공통 이온 효과": "**공통 이온 효과 = 이온화 억제**(평형 분자 쪽으로 이동).", "염 가수분해": "**강+강 중성, 약산+강염기 염기성, 강산+약염기 산성.** 약한 부모에서 온 이온만 물과 반응하며, 전부 Ka·Kb=Kw로 결정된다.", "가수분해 정의": "**가수분해 = 염 이온이 물과 반응해 pH 변함.**", "완충 응용": "**완충 용액 = pH 일정 유지**(혈액·효소 반응).", "pH 측정": "**pH 미터·지시약·리트머스로 산성·염기성 측정.**", "강염기 vs 약염기": "**같은 농도면 강염기 pH가 더 높음**([OH⁻] 큼).", "물의 pH": "**순수한 물 = pH 7**(자동 이온화, [H⁺]=[OH⁻]=1×10⁻⁷).", "탄소화합물 정의": "**탄소화합물 = 탄소를 골격으로 한 화합물**(무기 탄소 제외).", "탄소의 결합": "**탄소 = 원자가 4**(단일·이중·삼중 결합 모두).", "탄소 골격": "**탄소 골격 = 사슬·고리 모두 가능**(매우 다양).", "작용기 정의": "**작용기 = 화학적 성질을 결정하는 원자단.**", "알코올": "**알코올 = 하이드록시기(-OH)를 가진 화합물.**", "알코올 예": "**에탄올·메탄올 = 알코올**(-OH 보유).", "카복실산": "**카복실산 = 카복실기(-COOH)를 가진 화합물**(산성).", "카복실산 예": "**아세트산·폼산 = 카복실산**(-COOH 보유).", "카복실산 성질": "**카복실산 = 물에 녹아 산성**(H⁺ 내놓음).", "아민": "**아민 = 아미노기(-NH₂), 염기성**(H⁺ 받음).", "알데하이드": "**알데하이드 = 폼일기(-CHO)**(산화 시 카복실산).", "케톤": "**케톤 = 카보닐기(C=O) 가운데**(알데하이드는 끝).", "에스터": "**에스터 = 카복실산 + 알코올 결합**(-COO⁻, 향기).", "에스터화": "**에스터화: 카복실산 + 알코올 → 에스터 + 물.**", "에스터 성질": "**에스터 = 향기로운 냄새, 중성.**", "알코올 산화": "**1차 알코올 산화 → 알데하이드 → 카복실산.**", "산화 방향": "**산화: 알코올 → 카복실산**(환원은 반대).", "작용기와 성질": "**작용기가 화학적 성질을 결정**(같으면 비슷, 다르면 다름).", "이성질체": "**이성질체 = 분자식 같고 구조 다름.**", "같은 작용기": "**메탄올·에탄올 = 같은 작용기(-OH), 비슷한 성질.**", "카복실산 반응": "**카복실산 = 산**(금속과 반응해 수소 기체, 염기와 중화).", "에터": "**에터 = 산소가 두 탄소 사이(-O-).**", "알코올 수소 결합": "**알코올 -OH = 수소 결합**(끓는점 높음, 물에 잘 녹음).", "끓는점 경향": "**탄소 수 많을수록 끓는점 높아짐**(분산력 커짐).", "케톤 예": "**아세톤 = 케톤**(카보닐기 가운데).", "산성 비교": "**산성: 카복실산 > 물 > 알코올.**", "총괄성 정의": "**총괄성 = 용질 입자 수에만 의존**(종류 무관). 용매 증기압을 낮추는 정도가 입자 수에 비례해서이고, 전해질은 이온화로 i배만큼 커진다.", "증기압 내림": "**비휘발성 용질 → 증기압 내려감**(몰분율에 비례). 용질이 표면을 차지해 증발을 방해해서이고, 모든 총괄성의 뿌리다.", "라울 법칙": "**용액 증기압 = 용매 몰분율 × 순용매 증기압.**", "끓는점 오름": "**끓는점 오름: ΔTb = Kb·m**(끓는점 높아짐).", "어는점 내림": "**어는점 내림: ΔTf = Kf·m**(어는점 낮아짐). 용질이 용매의 결정화를 방해해서이고, 끓는점 오름과 한 쌍으로 부동액·제설에 쓰인다.", "몰랄 오름 상수": "**Kb, Kf = 용매 고유의 값**(용질 종류와 무관).", "전해질": "**전해질 = 이온화로 입자 수 늘어남**(포도당은 비전해질).", "반트호프 인자": "**i = 입자 수**(NaCl≈2, CaCl₂≈3, 포도당≈1). 총괄성은 입자 수만 세므로 전해질은 i배가 되고, 실제 i는 이온 쌍 탓에 정수보다 살짝 작다.", "전해질 총괄성": "**전해질 총괄성 > 비전해질**(같은 몰랄 농도, 입자 수 많음).", "전해질 계산": "**전해질 총괄성 = i·K·m**(i를 곱함).", "전해질 비교": "**NaCl > 포도당**(같은 몰랄 농도, 입자 수 2배).", "응용": "**제설·부동액 = 어는점 내림 이용**(바닷물 늦게 언다).", "총괄성 관계": "**증기압 내림 ↑ → 끓는점 오름 ↑**(함께 변함).", "총괄성 크기": "**입자 수 많을수록 총괄성 큼**(비례).", "비전해질 비교": "**같은 몰랄 농도 비전해질 = 총괄성 같음**(i≈1).", "몰랄 상수": "**Kf, Kb = 용매마다 다름**(물보다 클 수도).", "몰랄 농도 정의": "**몰랄 농도(m) = 용질 몰수 / 용매 kg**(용매 질량 기준). 질량 기준이라 온도에 무관해, 총괄성 계산에 쓰인다.", "몰분율 정의": "**몰분율 = 성분 몰수 / 전체 몰수**(몰수 기준).", "퍼센트 농도 정의": "**퍼센트 농도 = 용질 질량 / 용액 질량 × 100.**", "몰랄 농도 온도": "**몰랄 농도 = 온도 무관**(질량 기준).", "몰농도 온도": "**몰농도 = 온도 의존**(부피 기준, 온도↑ → 몰농도↓). 질량 기준 몰랄 농도는 온도에 무관해, 온도를 다루는 총괄성 계산에 쓰인다.", "농도 근사": "**묽은 수용액: 몰농도 ≈ 몰랄 농도**(물 밀도 약 1이라 부피 ≈ 질량). 진한 용액·비수용매에서는 둘을 구분해야 한다.", "몰분율 합": "**모든 성분의 몰분율 합 = 1**(100 아님).", "몰분율 단위": "**몰분율 = 무차원**(단위 없음). mol끼리 나눠 상쇄된 비율이라, 같은 차원의 비는 모두 단위를 갖지 않는다.", "퍼센트 농도 온도": "**퍼센트 농도 = 온도 무관**(질량 기준).", "용질·용매": "**용질 = 녹는 물질, 용매 = 녹이는 물질.**", "몰랄 농도 의미": "**1 m = 용매 1 kg에 용질 1몰**(용매 질량 기준).", "몰랄 농도 계산": "**용매 많을수록 몰랄 농도 작아짐**(분모 커짐).", "ppm": "**ppm = 100만분율**(매우 묽은 농도, 퍼센트 아님).", "온도 무관 농도": "**온도 무관: 몰랄·몰분율·퍼센트**(몰농도만 온도 의존).", "농도 의미": "**진한 용액 = 단위 부피당 용질 입자 많음.**", "농도 세기 성질": "**농도 = 세기 성질**(용액 양과 무관).", "몰농도 의미": "**1 M = 용액 부피 1 L**(물 1 L에 녹이면 ≠ 1 M).", "묽힘": "**묽힘 = 용매만 추가**(용질 몰수 불변, MV = M'V').", "몰분율 해석": "**몰분율 클수록 비율 큼**(같은 방향).", "농도와 총괄성": "**총괄성 ∝ 몰랄 농도**(용질 입자 수, 종류 아님).", "용해 정의": "**용해 = 용질이 용매에 균일하게 섞임**(화학 반응 아님).", "용해 단계": "**떼어내기 = 흡열, 섞임 = 발열**(합이 용해 엔탈피).", "용해 엔탈피": "**용해 엔탈피 = 흡열일 수도 발열일 수도**(항상 발열 아님).", "용해 자발성": "**흡열 용해 = 엔트로피 증가로 일어남.**", "용해성 규칙": "**같은 것끼리 잘 녹는다**(극성-극성, 무극성-무극성).", "용해성": "**기름은 물에 안 녹고, 이온 결정·설탕은 물에 녹음.**", "용해도 정의": "**용해도 = 최대 용해량**(온도에 따라 달라짐).", "헨리 법칙": "**기체 용해도 ∝ 부분 압력**(온도 일정). 압력이 높을수록 더 녹고(탄산음료·잠수병), 온도가 오르면 오히려 덜 녹는다(고체와 반대).", "헨리 응용": "**탄산음료·잠수병 = 압력과 기체 용해도(헨리 법칙).**", "헨리 법칙 계산": "**부분 압력 2배 → 용해도 2배**(정비례).", "압력과 고체 용해도": "**고체 용해도 = 압력 영향 거의 없음**(온도가 주변수).", "압력과 기체 용해도": "**기체 용해도 = 부분 압력 높을수록 커짐.**", "헨리 법칙 한계": "**헨리 법칙 = 잘 안 녹는 기체에 잘 맞음**(암모니아는 벗어남).", "온도와 기체 용해도": "**온도 높으면 기체 덜 녹음**(고압·저온이 유리).", "화학 전지": "**화학 전지 = 자발적 산화환원 → 화학 에너지를 전기로.**", "전극 반응": "**산화전극 = 산화, 환원전극 = 환원.**", "전극 극성": "**화학 전지: 산화전극 (-)극, 환원전극 (+)극.**", "전자 이동": "**전자: 산화전극 → 환원전극**((-)극 → (+)극). 산화에서 생긴 전자가 환원으로 가고, 두 전극의 전위차가 그 흐름을 만든다.", "다니엘 전지": "**다니엘 전지: 아연 산화전극, 구리 환원전극.**", "염다리": "**염다리 = 이온 이동으로 전하 균형 유지**(전자는 도선).", "표준 수소 전극": "**표준 수소 전극 = 표준 환원 전위 0 V(기준).** 전위는 회로상 차이로만 재므로 절대값이 없고, 해수면처럼 0을 약속한 것이다.", "전지 전위": "**E°cell = E°(환원전극) - E°(산화전극).**", "자발성": "**E°cell 양수 → 자발적**(ΔG < 0). E°cell은 전자를 미는 전압이라 양수면 전자가 스스로 흐르고, ΔG°=−nFE°의 음부호가 이를 자발성과 맞물린다.", "표준 환원 전위": "**표준 환원 전위 큼 = 환원 잘 됨(좋은 산화제).** 큰 쪽이 환원극이 되고, E°cell = 환원극 − 산화극으로 자발성을 정한다.", "전기분해": "**전기분해 = 전기로 비자발적 반응 일으킴**(전기 → 화학). E°cell < 0이라 외부 전원으로 강제하며, 화학 전지의 정확한 반대다.", "전기분해 전극": "**전기분해: (-)극 환원, (+)극 산화.** 환원=음극·산화=양극은 전지·전기분해 공통이고, 전원 극성 부호만 다르다.", "패러데이 법칙": "**석출량 ∝ 전하량.** 본질은 전자 세기다: 전자 몰수 = Q/F, 석출 몰수 = (Q/F)/n이라 질량 = (Q/F)(M/n).", "전하량": "**전하량 Q = It**(전류 × 시간, 단위 쿨롬).", "패러데이 상수": "**패러데이 상수 ≈ 96500 C/mol**(전자 1몰의 전하량). 아보가드로 수 × 기본 전하이고, 전하량을 전자 몰수로 바꾸는 다리다.", "전기분해 응용": "**도금·정련·제련 = 전기분해 응용.**", "물 전기분해": "**물 전기분해 → 수소 : 산소 = 2 : 1.** 같은 전자 수에서 수소 2분자, 산소 1분자가 생겨서이고, 물 속 H:O 비와 일치한다.", "전지 vs 전기분해": "**화학 전지 = 자발(화학→전기), 전기분해 = 비자발(전기→화학).** E°cell 부호로 갈리고, 환원=음극·산화=양극은 공통이다.", "패러데이 계산": "**+1가가 +2가보다 두 배 석출**(가수 클수록 적게). 한 개당 가수만큼 전자를 써서 가수가 분모(석출 몰수 = Q ÷ (가수 × F))에 온다.", "전극 질량": "**산화전극 질량 감소, 환원전극 질량 증가.** 산화는 녹음·환원은 석출이고, 변화량은 패러데이 법칙으로 전하량에 비례한다.", "산화제 세기": "**표준 환원 전위 큼 = 강한 산화제.**", "계와 주위": "**계 = 관찰 대상, 주위 = 나머지.**", "반응엔탈피": "**ΔH = 생성물 엔탈피 − 반응물 엔탈피.**", "ΔH 부호": "**발열 ΔH < 0, 흡열 ΔH > 0.** 계가 열을 내보내면 엔탈피가 줄어 음수이고, 발열은 자발에 유리하나 ΔG=ΔH−TΔS의 한 항일 뿐이다.", "표준 상태": "**표준 상태 = 25°C, 1기압.**", "표준 생성 엔탈피": "**안정한 홑원소 물질의 표준 생성 엔탈피 = 0**(측정 불가라 약속한 기준). 모든 물질을 홑원소 기준으로 적어 두면 ΔH = Σ생성물 − Σ반응물로 나온다.", "반응엔탈피 계산": "**반응엔탈피 = 생성물 ΔHf° 합 − 반응물 ΔHf° 합.**", "열량계": "**q = mcΔT**(c = 비열). 반응이 내놓은 열을 물이 그대로 받아 온도가 변하므로(에너지 보존), 외부와 차단해야 정확히 측정된다.", "비열": "**비열 클수록 온도 천천히 변함**(1 g 1°C 기준).", "엔탈피와 열": "**일정 압력에서 q = ΔH.**", "생성 엔탈피 해석": "**생성 엔탈피 음수 = 안정, 양수 = 불안정.**", "열용량": "**열용량 = 비열 × 질량**(물질 전체 기준, 비열과 다름).", "엔트로피 정의": "**엔트로피 = 무질서도, 정확히는 미시상태 수(S = k ln W).** 경우의 수가 많을수록 크고(고체<액체<기체), 자연은 경우의 수가 많은 쪽으로 간다.", "상태별 엔트로피": "**엔트로피: 기체 > 액체 > 고체.** 입자가 놓일 배열 가짓수가 많을수록 크고, 녹음·끓음은 엔트로피를 늘린다.", "온도와 엔트로피": "**온도 높을수록 엔트로피 증가.** 열에너지를 나눠 가질 경우의 수가 늘어서이고, 절대 영도에서는 0에 가까워진다.", "기체 수와 엔트로피": "**기체 몰수 늘면 엔트로피 증가**(ΔS > 0). 기체의 경우의 수가 압도적이라, 양변의 기체 계수 비교로 ΔS 부호를 판단한다.", "상태 변화와 엔트로피": "**고체 → 액체 → 기체 = 엔트로피 증가.** 경우의 수가 늘어서이고, 부피가 폭증하는 증발의 ΔS가 가장 크다.", "ΔS 정의": "**ΔS = S(생성물) − S(반응물).** 변화량은 나중에서 처음을 빼는 규칙이라 ΔH·ΔG와 같은 꼴이고, ΔS > 0은 경우의 수 증가다.", "기체 생성": "**기체 생성 반응 = 엔트로피 증가**(ΔS > 0). 기체가 경우의 수가 가장 많은 상태라, 기체 생성이 ΔS 부호의 가장 강한 단서다.", "ΔS 해석": "**ΔS > 0 = 무질서도 증가, ΔS < 0 = 감소.**", "엔트로피 감소 반응": "**계 엔트로피 감소해도 전체 증가하면 반응 일어남.**", "용해와 엔트로피": "**용해 = 엔트로피 증가**(입자가 흩어짐).", "상태 방정식": "**PV = nRT**(T는 절대 온도). 보일·샤를·아보가드로를 묶은 식이라 변수를 고정하면 각 법칙이 나오고, R는 모든 기체에 같은 보편 상수다.", "보일 법칙": "**보일 법칙: PV = 일정**(압력↑ → 부피↓). 부피를 줄이면 벽 충돌이 잦아져 압력이 커지므로 둘의 곱이 일정하다.", "샤를 법칙": "**샤를 법칙: V/T = 일정**(절대 온도에 비례).", "기체 상수": "**R = 0.082**(모든 기체 공통, 단위에 따라 수치 달라짐).", "몰부피": "**STP에서 1몰 = 22.4 L**(종류 무관). 아보가드로 법칙 덕분이고, STP·이상 기체라는 조건에서만 성립한다.", "이상 기체 가정": "**이상 기체 = 크기·분자 간 힘 무시 + 완전 탄성 충돌.** 실제로 깨지는 건 부피와 인력 둘뿐이고, 저압·고온에서 가정이 잘 맞는다.", "운동 에너지와 온도": "**평균 운동 에너지 ∝ 절대 온도**(속력은 √T). 온도는 곧 평균 운동 에너지이고(분자량 무관), 0 K에서 운동이 멈추기에 절대 온도를 쓴다.", "온도와 속력": "**온도 ↑ → 평균 속력 ↑**(v ∝ √T).", "분자량과 속력": "**분자량 클수록 평균 속력 느림**(v ∝ 1/√M). 같은 온도면 운동 에너지가 같아 무거운 분자가 느리고, 확산·분출도 같은 √M 의존성을 따른다.", "제곱평균제곱근 속력": "**vrms = √(3RT/M)**(T↑ 커짐, M↑ 작아짐).", "속력 분포": "**기체 분자는 다양한 속력 분포**(온도↑ → 분포 넓어짐).", "그레이엄 법칙": "**확산 속도 ∝ 1/√M**(가벼운 기체가 빠름). vrms=√(3RT/M)의 직접 결과이고, √M 차이가 작아 우라늄 농축엔 수천 단계가 든다.", "압력의 기원": "**압력 = 분자가 벽에 충돌**(인력 아님).", "실제 기체 편차": "**실제 기체는 고온·저압에서 이상 기체에 가까움.**", "절대 영도": "**절대 영도 = 0 K ≈ -273°C**(분자 운동 멈춤).", "분자 간 힘 정의": "**분자 간 힘 = 분자 사이의 인력**(분자 내 결합 아님).", "분자 간 힘 vs 결합": "**분자 간 힘 < 화학 결합**(10~100배 차이). 끓을 때 분자 간 힘만 끊기고, 그래서 물은 100도에 끓어도 분해는 수천 도가 필요하다.", "분산력 보편성": "**분산력 = 전자를 가진 모든 입자에 작용**(He도). 순간 쌍극자에서 생기고, 분극률이 클수록(분자가 클수록) 강해진다.", "분산력 원리": "**분산력 = 일시적(순간) 쌍극자에 의한 인력**(영구 아님).", "쌍극자-쌍극자": "**쌍극자-쌍극자 힘 = 극성 분자(영구 쌍극자) 사이.**", "수소 결합 조건": "**수소 결합 = H가 F, O, N에 결합했을 때**(HF·H₂O·NH₃). 작고 전기음성도 큰 원자라 H가 강한 δ+를 띠고, 이것이 물의 이상성을 만든다.", "수소 결합 본질": "**수소 결합 = 특히 강한 쌍극자-쌍극자 힘**(분자 간 힘).", "분산력 세기": "**분자량·전자 수·분극률 클수록 분산력 큼.** 전자가 많고 느슨할수록, 또 분자가 길쭉해 표면적이 클수록 강해진다.", "할로젠 끓는점": "**F₂ < Cl₂ < Br₂ < I₂.** 모두 무극성이라 분산력만 작용하는 통제 실험이라, 분자량(전자 수)이 클수록 끓는점이 높아진다.", "비활성 기체 끓는점": "**He < Ne < Ar < Kr**(분자량 클수록 끓는점 높음).", "접촉 면적": "**접촉 면적 클수록 분산력 큼**(긴 사슬 > 구형).", "무극성 분자 힘": "**무극성 분자 = 분산력만 작용**(CH₄, CO₂). 영구 쌍극자가 없어 쌍극자-쌍극자 힘은 없지만, 분산력은 모든 분자에 작용한다.", "수소 결합 예": "**수소 결합 = H₂O·HF·NH₃·에탄올**(H가 F·O·N에 결합). CH₄·HCl은 안 하고, 에탄올은 −OH의 H만 한다.", "수소 결합 세기": "**분산력 < 수소 결합 < 공유 결합.** 큰 δ+와 가까운 접근으로 분자 간 힘 중 가장 강하지만, 전자 공유가 아니라 결합보다는 자릿수만큼 약하다.", "끓는점 이상": "**물·HF·NH₃의 높은 끓는점 = 수소 결합**(분자량 아님).", "얼음 밀도": "**얼음 = 수소 결합 규칙 배열로 밀도 작아 뜸.**", "물의 특성": "**물의 표면 장력·비열·끓는점 = 수소 결합 덕분.**", "동족 경향": "**14족: CH₄ < SiH₄ < GeH₄**(수소 결합 없이 분산력만).", "끓는점 관계": "**분자 간 힘 강할수록 끓는점 높음**(비례). 위계는 수소 결합>쌍극자>분산력이나 큰 분자는 분산력이 세고, 끊어지는 건 분자 간 힘이지 공유 결합이 아니다.", "증기압 관계": "**분자 간 힘 강할수록 증기압 작음**(반비례). 증기압 큼↔끓는점 낮음↔분자 간 힘 약함이 한 묶음이고, 온도가 오르면 증기압이 커진다.", "증발 관계": "**분자 간 힘 약할수록 잘 증발**(휘발성 큼).", "녹는점 관계": "**분자 간 힘 강할수록 녹는점 높음**(대체로).", "끓는점 해석": "**끓는점 높음 = 분자 간 힘 강함.**", "증기압 해석": "**증기압 큼 = 분자 간 힘 약함**(반비례).", "점성 관계": "**분자 간 힘 강할수록 점성 큼**(대체로).", "종합 비교": "**끓는점 = 분자량 + 극성 함께 고려**(무극성이 높을 수도).", "휘발성": "**휘발성 큼 = 분자 간 힘 약함**(증기압 큼, 끓는점 낮음). 분자를 붙잡는 힘이 약해 쉽게 탈출하고, 증기압·끓는점과 한 묶음으로 움직인다.", "상태 결정": "**분자 간 힘 강함 → 고체·액체, 약함 → 기체.**", "힘의 공존": "**극성 분자 = 분산력 + 쌍극자-쌍극자**(분산력도 작용). 분산력은 모든 분자에 작용해, 극성 분자의 힘은 두 힘의 합이다.", "세기 순서": "**분산력 < 쌍극자-쌍극자 < 수소 결합**(비슷한 분자량).", "이온-쌍극자": "**이온-쌍극자 힘 = 이온이 물(극성)에 녹을 때 작용.**", "생체 적용": "**DNA 이중 나선·단백질 구조 = 수소 결합으로 유지.**", "분산력 비교": "**할로젠 상태 차이 = 분산력 차이**(분자량, 극성 아님).", "수소 결합 효과": "**수소 결합 가능 분자 = 끓는점 높음**(추가 인력).", "반응 속도 정의": "**반응 속도 = 단위 시간당 농도 변화.** 총량이 아니라 변화의 빠르기(순간 기울기)이고, 보통 진행될수록 느려진다.", "반응 속도 표현": "**반응물 감소율 = 생성물 증가율**(계수 보정).", "충돌 이론": "**충돌해야 반응**(단, 유효 충돌만). 충돌은 필요조건일 뿐이고, 이 이론이 농도·온도 효과를 설명한다.", "유효 충돌": "**유효 충돌 = 충분한 에너지 + 올바른 방향.** 에너지 문턱이 활성화 에너지이고, 그것을 넘는 분자는 볼츠만 꼬리의 일부다.", "활성화 에너지": "**활성화 에너지 = 봉우리−반응물(장벽), 클수록 느림.** ΔH(끝점 차이)와 독립이라, 발열이어도 Ea가 높으면 느리다.", "농도와 속도": "**농도 ↑ → 충돌 빈도 ↑ → 속도 ↑.** 농도는 충돌의 빈도를 바꾸고(에너지는 온도가 바꿈), 속도식으로 정량화된다.", "온도와 속도": "**온도 ↑ → 반응 속도 ↑.** 충돌 빈도보다 활성화 에너지를 넘는 분자 비율(볼츠만 꼬리)이 지수적으로 느는 것이 결정적이다.", "표면적과 속도": "**표면적 클수록 반응 빠름**(가루 > 덩어리).", "촉매와 엔탈피": "**촉매는 활성화 에너지만 낮춤**(ΔH·평형 불변). 더 낮은 길을 뚫을 뿐 양쪽 골짜기 높이(ΔH)는 그대로라, 속도만 올리고 어디서 멈출지는 못 바꾼다.", "촉매 종류": "**정촉매 빠르게, 부촉매 느리게.**", "속도식": "**v = k[A]^m[B]^n**(k = 속도 상수, m·n = 차수). 차수는 실험으로 정하고(메커니즘 반영), k는 온도가 정한다.", "반응 차수": "**반응 차수 = 실험으

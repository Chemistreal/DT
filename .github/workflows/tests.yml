name: regression-tests

on:
  push:
    branches: [main]
  pull_request:
  # 아무도 안 밀어도 하루 한 번 돈다. exam 저장소에서 자동 커밋이 데이터를
  # 지우고 main 이 네 시간 동안 빨간 채로 있었다 — 아무도 안 밀었기 때문이다.
  # 실패하면 깃허브가 저장소 주인에게 메일을 보낸다.
  schedule:
    - cron: '23 21 * * *'     # 매일 06:23 KST
  workflow_dispatch:

# 한 브랜치에서 앞 검사가 끝나기도 전에 다음 커밋이 오면, 앞 것은 이미 낡은
# 답이다. 그런데 끝까지 돌아 실패하면 **메일은 그대로 간다.** 취소된 검사는
# 메일을 안 보낸다 — 낡은 답을 지우면 그만큼 조용해지고 시간도 아낀다.
# main 에서는 안 지운다. 거기서 취소하면 어느 커밋도 검사받지 않은 채 남는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 통합 셸(exam/hub.html)이 이 목록을 읽어 자료 탭을 그린다. 파일이 늘었는데
      # 목록이 그대로면 셸에서는 그 회차가 없는 것처럼 보인다 — 눌러 보고 나서야 안다.
      - name: 자료 목록이 실제 파일과 일치
        run: python3 tools/gen_materials.py --check
      # "좀 흐린가?" 로는 아무것도 안 고쳐진다. 148장을 매번 기계가 잰다 —
      # 처음 재었을 때 147장이 걸렸다(viewport 128 · 대비 25 · 작은 글씨 17).
      - name: 화면 전수 검수 (대비 · 글씨 · viewport)
        run: python3 tools/audit_pages.py
      # 낭독기는 이름 없는 입력칸을 그냥 '편집' 이라고 읽는다 — 열 칸이
      # 나란히 있으면 열 번 다 '편집' 이다. 눈에 보이는 <label> 이 이미
      # 있는데 이어지지 않은 자리는 사람 판단 없이 이어 줄 수 있다.
      - name: 입력칸에 이름이 붙어 있다
        run: python3 tools/input_labels.py --check
      # kmchc/분석_v2.html 은 표 머리에 `scope="col"` 을 붙이던 손질이 큰따옴표로
      # 묶인 글자열 **안쪽**에 큰따옴표를 넣는 바람에, 화면을 열면 자바스크립트가
      # 첫 줄에서 죽어 통째로 아무 일도 안 했다. 파일만 보면 멀쩡했고 검사도 다
      # 통과했다 — 아무도 그 화면을 안 열어 봤기 때문이다. 이제 기계가 연다.
      - name: 화면 안 자바스크립트가 안 깨졌다
        run: python3 tools/js_syntax.py --check
      # 브라우저는 인쇄할 때 배경을 기본으로 안 찍는다. 그래서 어두운 띠 위의
      # 흰 글씨는 **흰 종이에 흰 글씨**가 됐다 — OMR 제목띠·표 머리 46장,
      # 문제지 지시문 46장('다음 물음에 답하시오' 가 통째로), 해설지 절 띠 35장.
      # 화면으로 보면 멀쩡해서 아무도 몰랐다.
      - name: 종이에서 사라지는 자리가 없다
        run: python3 tools/print_ink.py --check
      # 브라우저는 바깥 stylesheet 를 만나면 **그리기를 멈추고 기다린다.**
      # 구글 글꼴·Pretendard 가 늦거나 안 닿으면 화면은 아무것도 없는 흰 종이다.
      # 재어 보니 report.html(학부모가 문자로 받는 성적표)·parent_report.html·
      # index.html 셋 다 **첫 그림이 아예 없었다** — 60초를 기다려도.
      # 고친 뒤 0.6초 · 0.3초 · 2.3초.
      - name: 바깥 글꼴이 첫 화면을 막지 않는다
        run: python3 tools/font_block.py --check
      # 성적표 링크는 **암호를 묻지 않는다**(선생님 결정). 그러면 남는 보호막은
      # 주소를 남이 모른다는 것 하나뿐이라, 그 주소가 검색에 잡히면 보호막이
      # 통째로 사라진다 — 아이 이름·점수·등수가 검색되는 것이다.
      # 개인 성적이 뜨는 화면만 골라 막는다(대문·자료 화면은 그대로).
      - name: 개인 성적 화면이 검색에 열려 있지 않다
        run: python3 tools/noindex.py --check
      - name: Install playwright
        run: npm install --prefix tests
      - name: Install chromium
        run: npx --prefix tests playwright install --with-deps chromium
      # 앱스크립트 행동 검사. 여태 CI 에 안 걸려 있어서 기대값이 코드와 어긋난 채
      # 오래 굳어 있었다(옛 링크 형식·무토큰 조회). 만들어 놓고 안 돌리면 없는 것과 같다.
      - name: 앱스크립트 행동 (인증 · JSONP · 저장)
        run: node tests/test_gs.js
      # 규칙이 '있다' 는 것과 '종이에서 읽힌다' 는 것은 다르다. 실제 브라우저에
      # 인쇄 매체를 씌워 본다. 화면 매체에서는 원래대로인지도 같이 본다 —
      # 화면을 건드리면 안 된다.
      - name: 종이에서 읽힌다 (실제 브라우저)
        run: NODE_PATH=tests/node_modules REQUIRE_BROWSER=1 node tests/print-ink.js
      # 규칙이 '있다' 는 것과 '실제로 안 기다린다' 는 것은 다르다. 글꼴 창구가
      # 아예 대답하지 않는 망을 만들어 첫 그림을 재고, 대답하는 망에서는 글꼴이
      # 그대로 오는지도 본다 — 빠르기만 재면 '글꼴을 빼는 것' 이 만점이다.
      - name: 글꼴 창구가 죽어도 학부모 성적표가 뜬다
        run: NODE_PATH=tests/node_modules REQUIRE_BROWSER=1 node tests/first-paint.js
      - name: Run regression suite
        run: NODE_PATH=tests/node_modules node tests/run.js
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fail-screenshots
          path: tests/fail-*.png
          if-no-files-found: ignore

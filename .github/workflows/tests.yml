name: regression-tests

on:
  push:
    branches: [main]
  pull_request:
  # 아무도 안 밀어도 하루 한 번 돈다. exam 저장소에서 자동 커밋이 데이터를
  # 지우고 main 이 네 시간 동안 빨간 채로 있었다 — 아무도 안 밀었기 때문이다.
  # 실패하면 깃허브가 저장소 주인에게 메일을 보낸다.
  schedule:
    - cron: '23 21 * * *'     # 매일 06:23 KST
  workflow_dispatch:

# 한 브랜치에서 앞 검사가 끝나기도 전에 다음 커밋이 오면, 앞 것은 이미 낡은
# 답이다. 그런데 끝까지 돌아 실패하면 **메일은 그대로 간다.** 취소된 검사는
# 메일을 안 보낸다 — 낡은 답을 지우면 그만큼 조용해지고 시간도 아낀다.
# main 에서는 안 지운다. 거기서 취소하면 어느 커밋도 검사받지 않은 채 남는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 통합 셸(exam/hub.html)이 이 목록을 읽어 자료 탭을 그린다. 파일이 늘었는데
      # 목록이 그대로면 셸에서는 그 회차가 없는 것처럼 보인다 — 눌러 보고 나서야 안다.
      # ⚠ 이 판은 2026-08-10 에 열어 보니 **여섯 번 가운데 여섯 번이 빨간불**
      #   이었고 아무도 안 보고 있었다. 까닭은 자가 틀려서가 아니라 **자가 여기서
      #   돌 수 없어서**였다 — crop_align 의 `import fitz` 를 설치하는 줄이 없었다.
      #   즉 크롭 밀림도 문제지 답 유출도 CI 는 한 번도 막은 적이 없다.
      #   "재는 것과 막는 것은 다르다" 의 한 칸 앞 — **돌 수 있는 것과 걸어 둔 것은
      #   다르다.** 이 자를 맨 앞에 둬서 그것부터 본다.
      - name: CI 가 부르는 자가 여기서 돌 수 있다
        timeout-minutes: 5
        run: python3 tools/ci_deps.py --check
      - name: 자료 목록이 실제 파일과 일치
        run: python3 tools/gen_materials.py --check
      # 심화 도전은 **과목 접두만** 보고 문제를 뽑았다 — 회차를 아예 안 봤다.
      # 화학Ⅰ 1회를 막 통과한 학생에게 후보 54개념 중 44개(81%)가 18회까지
      # 가야 배우는 것이었다(2026-08-15). 이제 «개념이 몇 회차에 처음 나오나»
      # 표를 회차 파일에서 만들어 걸러 낸다. 손으로 적으면 반드시 어긋난다.
      - name: 심화 회차 표가 회차 파일과 일치
        run: python3 tools/challenge_scope.py --check
      # 자료 화면 132장은 위의 목록이 지킨다. 앱 화면에는 지키는 자가 없어서
      # 주소를 아는 사람만 열 수 있는 장이 여섯 장 떠 있었다(2026-08-10).
      # 셋은 선생님이 지우기로 정했고, 셋은 index.html 에 문을 냈다.
      - name: 모든 화면에 문이 있다
        run: python3 tools/page_doors.py --check
      # 같은 물음을 **자료**에는 아무도 안 던지고 있었다. 재어 보니 volumes/ 4권
      # 55MB 와 supplements/ 2종 2.6MB 를 **어느 화면도 안 건다.** 주소를 직접
      # 건네 쓰시는 것일 수도 있어 지우지 않는다 — 지금 상태를 박아 두고
      # **새로 생기는 것**을 잡는다(⚖ A7).
      - name: 모든 자료에 문이 있다
        timeout-minutes: 5
        run: python3 tools/asset_doors.py --check
      # "좀 흐린가?" 로는 아무것도 안 고쳐진다. 148장을 매번 기계가 잰다 —
      # 처음 재었을 때 147장이 걸렸다(viewport 128 · 대비 25 · 작은 글씨 17).
      # ⚠ 이 줄은 여섯 달 동안 **아무것도 막지 않았다.** `--check` 없이 불렀고,
      #   자 쪽에도 종료 코드가 없어서 152장이 걸려도 초록불이었다. 그 152장은
      #   전부 자의 거짓말이었고(상태 색을 종이로 침 · 어두운 화면을 흰 종이에
      #   얹어 잼), 아무도 안 보고 있었으니 고쳐지지도 않았다.
      #   재는 것과 막는 것은 다르다. 재면 막는다.
      - name: 화면 전수 검수 (대비 · 글씨 · viewport)
        run: python3 tools/audit_pages.py --check
      # 그 자가 다시 거짓말하지 않는지 참·거짓 예시로 본다. 자를 넓히다 보면
      # 눈먼 자가 되기 쉽다 — 넓힌 뒤에도 진짜를 잡는지 여기서 걸린다.
      - name: 자가 참·거짓 예시를 맞힌다
        run: python3 tools/lie_check.py --check
      # 성적표가 아이를 어디에 세우는 말을 할 때는 **다음 걸음을 같이** 말해야
      # 한다. 아래 두 칸에는 붙어 있었는데 위 세 칸은 비교로 시작해 비교로
      # 끝났다 — "좋은 소식만 보여 주면 못 믿게 된다" 의 거울상이다.
      - name: 석차 문구가 다음 걸음을 같이 말한다
        run: python3 tools/report_msg.py --check
      # report_msg 는 석차 문구 한 갈래만 본다. 화면이 사람에게 하는 말은
      # 18,742개이고 그중 55개가 평가 문장, 3개가 약속 문장이다. 어느 것도
      # 여태 세어진 적이 없었다. 고치지 않고 **줄어드는 것만** 막는다 —
      # 문장이 조용히 사라지면 학생이 읽던 말이 없어진 것이다.
      - name: 사람에게 하는 말이 조용히 사라지지 않았다
        run: python3 tools/msg_ledger.py --check --quiet
      # 네 앱이 다 GitHub Pages 로 나가는데 **거기에 한도가 있다는 것을 아무도
      # 안 재고 있었다**(사이트 1GB · 파일 하나 100MB). 이 한도는 벽에 닿아야
      # 알게 된다 — 어느 날 배포가 멈추고, 그때서야 무엇이 무거운지 찾는다.
      # 그래서 벽이 아니라 **문턱(700MB)** 에서 켠다. 급하면 지우면 안 될 것을
      # 지우게 되므로, 고를 시간이 남아 있을 때 알린다.
      - name: 배포 한도에 여유가 있다
        run: python3 tools/pages_budget.py --check
      # 네 앱이 같은 학생을 다루는데 이름을 맞춰 보는 방식이 갈려 있다.
      # 정하기 전까지 세기만 하고 조용하다.
      - name: 학생 이름을 맞춰 보는 규칙이 정한 대로다
        run: python3 tools/name_key.py --check
      # 이 앱은 '브라우저를 비워도 아무것도 안 잃는다' 는 성질 위에 서 있다 —
      # 성적·명단은 시트에 있고 여기엔 취향만 남는다. 그 성질은 적어 두지
      # 않으면 조용히 깨진다. 통합 셸이 다섯 칸을 적어 두고 지키는 것과 같다.
      - name: 이 브라우저에 남기는 칸이 적어 둔 것뿐이다
        run: python3 tools/store_ledger.py --check
      # 낭독기는 이름 없는 입력칸을 그냥 '편집' 이라고 읽는다 — 열 칸이
      # 나란히 있으면 열 번 다 '편집' 이다. 눈에 보이는 <label> 이 이미
      # 있는데 이어지지 않은 자리는 사람 판단 없이 이어 줄 수 있다.
      - name: 입력칸에 이름이 붙어 있다
        run: python3 tools/input_labels.py --check
      # kmchc/분석_v2.html 은 표 머리에 `scope="col"` 을 붙이던 손질이 큰따옴표로
      # 묶인 글자열 **안쪽**에 큰따옴표를 넣는 바람에, 화면을 열면 자바스크립트가
      # 첫 줄에서 죽어 통째로 아무 일도 안 했다. 파일만 보면 멀쩡했고 검사도 다
      # 통과했다 — 아무도 그 화면을 안 열어 봤기 때문이다. 이제 기계가 연다.
      - name: 화면 안 자바스크립트가 안 깨졌다
        run: python3 tools/js_syntax.py --check
      # 팔레트가 24장에 따로 적혀 있었고 값이 갈라져 있었다(--line 8가지 ·
      # --ink 7가지 · --brass 5가지). 한 곳에서 찍어 넣고 어긋난 장을 막는다.
      # ⚠ **남의 결은 안 덮는다** — roster.html 은 일부러 어두운 화면이라
      #   밝은 화면용 먹색을 씌우자 1.14:1(아무것도 안 보임)이 됐다. 밝기가
      #   크게 다른 이름표는 그 화면 것을 그대로 둔다.
      - name: 모든 화면이 같은 옷을 입고 있다
        run: python3 tools/theme.py --check
      # 색 이름표만 재면 겹쳐 깔린 그림을 못 본다. 화면을 찍어 화소를 읽는다.
      # 브라우저는 인쇄할 때 배경을 기본으로 안 찍는다. 그래서 어두운 띠 위의
      # 흰 글씨는 **흰 종이에 흰 글씨**가 됐다 — OMR 제목띠·표 머리 46장,
      # 문제지 지시문 46장('다음 물음에 답하시오' 가 통째로), 해설지 절 띠 35장.
      # 화면으로 보면 멀쩡해서 아무도 몰랐다.
      - name: 종이에서 사라지는 자리가 없다
        run: python3 tools/print_ink.py --check
      # 브라우저는 바깥 stylesheet 를 만나면 **그리기를 멈추고 기다린다.**
      # 구글 글꼴·Pretendard 가 늦거나 안 닿으면 화면은 아무것도 없는 흰 종이다.
      # 재어 보니 report.html(학부모가 문자로 받는 성적표)·parent_report.html·
      # index.html 셋 다 **첫 그림이 아예 없었다** — 60초를 기다려도.
      # 고친 뒤 0.6초 · 0.3초 · 2.3초.
      - name: 바깥 글꼴이 첫 화면을 막지 않는다
        run: python3 tools/font_block.py --check
      # 성적표 링크는 **암호를 묻지 않는다**(선생님 결정). 그러면 남는 보호막은
      # 주소를 남이 모른다는 것 하나뿐이라, 그 주소가 검색에 잡히면 보호막이
      # 통째로 사라진다 — 아이 이름·점수·등수가 검색되는 것이다.
      # 개인 성적이 뜨는 화면만 골라 막는다(대문·자료 화면은 그대로).
      - name: 개인 성적 화면이 검색에 열려 있지 않다
        run: python3 tools/noindex.py --check
      - name: Install playwright
        run: npm install --prefix tests
      - name: Install chromium
        run: npx --prefix tests playwright install --with-deps chromium
      # 앱스크립트 행동 검사. 여태 CI 에 안 걸려 있어서 기대값이 코드와 어긋난 채
      # 오래 굳어 있었다(옛 링크 형식·무토큰 조회). 만들어 놓고 안 돌리면 없는 것과 같다.
      - name: 앱스크립트 행동 (인증 · JSONP · 저장)
        run: node tests/test_gs.js
      # 규칙이 '있다' 는 것과 '종이에서 읽힌다' 는 것은 다르다. 실제 브라우저에
      # 인쇄 매체를 씌워 본다. 화면 매체에서는 원래대로인지도 같이 본다 —
      # 화면을 건드리면 안 된다.
      # ⚠ 이 단계는 한동안 **playwright 설치보다 앞**에 있었다(2026-08-10).
      #   REQUIRE_BROWSER 가 켜져 있어 건너뛰지 않고 그대로 빨간불이 났고,
      #   그래서 판마다 빨간불이었다. 브라우저가 필요한 검사는 설치 뒤에 둔다.
      #   NODE_PATH 도 같이 준다 — 없으면 playwright 를 못 찾는다.
      - name: 휴대폰 폭에서 화면이 옆으로 밀리지 않는다
        run: NODE_PATH=tests/node_modules REQUIRE_BROWSER=1 node tests/narrow.js
      # ⚠ 이 단계는 **playwright 설치보다 앞**에 있었다(2026-08-10 에 찾음).
      #   그러면 자가 '건너뜀' 으로 조용히 0 을 내고 지나간다 — 그림 위 글씨를
      #   여태 아무도 안 재고 있었다는 뜻이다. 건너뛴 것은 초록으로 세지 않는다.
      - name: 그림 위에서도 글씨가 읽힌다 (실제 브라우저)
        run: NODE_PATH=tests/node_modules REQUIRE_BROWSER=1 node tests/theme.js
      - name: 종이에서 읽힌다 (실제 브라우저)
        run: NODE_PATH=tests/node_modules REQUIRE_BROWSER=1 node tests/print-ink.js
      # 규칙이 '있다' 는 것과 '실제로 안 기다린다' 는 것은 다르다. 글꼴 창구가
      # 아예 대답하지 않는 망을 만들어 첫 그림을 재고, 대답하는 망에서는 글꼴이
      # 그대로 오는지도 본다 — 빠르기만 재면 '글꼴을 빼는 것' 이 만점이다.
      - name: 글꼴 창구가 죽어도 학부모 성적표가 뜬다
        run: NODE_PATH=tests/node_modules REQUIRE_BROWSER=1 node tests/first-paint.js
      # 선생님이 정하신 것(2026-08-11) — "인쇄규칙하지말고 워드파일로
      # 다운받을수있게 exam스타일로". 학부모가 남겨 두는 것은 종이가 아니라
      # 파일이고, exam 은 이미 그렇게 하는데 DT 에만 없었다.
      # ⚠ 이 자는 «있다/없다» 를 세지 않는다. **화면의 숫자와 종이의 숫자를
      #   한 줄씩 맞춰 본다.** 이 자를 만들면서 정답률을 거꾸로 적어, 88점으로
      #   통과한 학생의 단원이 종이에서 0% 로 찍혔다 — 둘 다 그럴듯해 보였다.
      - name: 성적표 Word 가 화면과 같은 말을 한다
        run: NODE_PATH=tests/node_modules REQUIRE_BROWSER=1 node tests/docx-report.js
      # 제출 → 리포트로 데려가는 자리(선생님 요청 2026-08-14). 여기서 재는 것은
      # «5초 뒤 넘어가나» 가 아니라 **저장이 확인되기 전에는 안 넘어가나** 다.
      # 앱스크립트는 실행을 한 줄로 세워서 왕복이 5초를 넘을 때가 있고, 그때
      # 넘어가 버리면 학생은 리포트에서 «이번 회차가 없네?» 를 보고 시험을
      # 다시 본다. 재시인 학생에게 안내가 뜨는지도 같이 본다.
      - name: 제출하면 리포트로 데려간다 (저장이 확인된 뒤에)
        run: NODE_PATH=tests/node_modules REQUIRE_BROWSER=1 node tests/handoff.js
      - name: Run regression suite
        run: NODE_PATH=tests/node_modules node tests/run.js
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fail-screenshots
          path: tests/fail-*.png
          if-no-files-found: ignore

const QS=new URLSearchParams(location.search);
const CODE=(QS.get('student')||'').trim();
function lsGet(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
const ADMIN=QS.get('admin')==='1' && lsGet('sp_admin')==='1';
function admTok(){ return lsGet('dt_admtok').trim(); }   /* admin.html 과 같은 관리자 문(전체 공개 모드) */
const esc=SurveyRender.esc;
function $(s){ return document.querySelector(s); }
function msg(h,p){ $('#pvApp').innerHTML='<div class="pv-msg"><b>'+h+'</b><br>'+p+'</div>'; $('#pvHint').textContent=''; }
async function getJSON(u){ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error(String(r.status)); return await r.json(); }
async function tryN(f,n){ let e0; for(let i=0;i<(n||3);i++){ try{ return await f(); }catch(e){ e0=e; await new Promise(z=>setTimeout(z,600*(i+1))); } } throw e0; }

let ST={ doc:null, row:null, rows:[], name:'', school:'', year:'', ext:null, ex:null, km:null, match:null, pick:{exam:null,km:null} };

async function boot(){
  if(!CODE){
    msg('개인 링크로 열어 주세요','이 화면은 선생님께 받은 학생 개인 링크(…survey_print.html?student=코드)로 엽니다.<br>선생님은 <a href="survey_print_batch.html">반 전체 일괄 인쇄</a>에서 학생별 보고서를 만들 수 있습니다.');
    return;
  }
  if(!/^[0-9A-Za-z가-힣\-_]{4,80}$/.test(CODE)){ msg('링크를 확인해 주세요','선생님께 받은 개인 링크로 열어 주세요.'); return; }
  if(QS.get('admin')==='1' && !ADMIN) $('#pvPanel').innerHTML='<div class="pv-panel">선생님 기기로 기억된 브라우저가 아니라 DT 기록만 실었습니다. 모의시험·학습진단을 붙이려면 <a href="survey_print_batch.html">반 전체 일괄 인쇄</a>를 이 기기에서 한 번 열어 주세요.</div>';
  let C;
  try{ C=await SurveyRender.loadCommon(); }catch(e){ msg('잠시 뒤 다시 열어 주세요','설문 자료를 불러오지 못했어요.'); return; }
  ST.doc=C.doc;
  /* 설문 행 */
  let one=null;
  try{ one=await tryN(()=>getJSON(SAVE_URL+'?action=surveyOne&survey='+encodeURIComponent(C.doc.id)+'&student='+encodeURIComponent(CODE)+'&t='+Date.now())); }catch(e){ one=null; }
  if(one&&one.ok===false&&one.error==='student'){ msg('링크를 확인해 주세요','선생님께 받은 개인 링크로 열어 주세요.'); return; }
  ST.row=one&&one.ok?(one.rows||[]).slice(-1)[0]||null:null;
  /* DT 기록 — 관리자 화면은 관리자 읽기(?action=survey 의 코드 → 학생키 → ?all=1)로, 아니면 성적표 조회(?student=)로 모든 과목 행 */
  let rows=null;
  if(ADMIN){
    try{
      const t=encodeURIComponent(admTok());
      const a=await tryN(()=>getJSON(SAVE_URL+'?action=survey&survey='+encodeURIComponent(C.doc.id)+'&token='+t+'&t='+Date.now()));
      const me=((a&&a.rows)||[]).filter(r=>r.code===CODE).slice(-1)[0];
      if(me){
        const b=await tryN(()=>getJSON(SAVE_URL+'?all=1&token='+t+'&t='+Date.now()));
        rows=((b&&b.rows)||[]).filter(r=>r.studentKey===me.studentKey);
        ST.school=me.school||''; ST.year=me.year||'';
      }
    }catch(e){ rows=null; }
  }
  if(!rows){
    try{ const g=await tryN(()=>getJSON(SAVE_URL+'?student='+encodeURIComponent(CODE)+'&t='+Date.now()),2); if(g&&g.ok) rows=g.rows||[]; }catch(e){ rows=null; }
  }
  if(!rows) rows=(one&&Array.isArray(one.ch1))?one.ch1:[];
  ST.rows=rows;
  const r0=rows.filter(r=>r.name)[0]||{};
  ST.name=(ST.row&&ST.row.name)||r0.name||'';
  ST.school=ST.school||(ST.row&&ST.row.school)||r0.school||'';
  ST.year=ST.year||(ST.row&&ST.row.year)||r0.year||'';
  if(!ST.row&&!rows.length){ msg('아직 기록이 없어요','설문이나 시험 기록이 이 링크와 이어지지 않았습니다. 선생님께 확인해 주세요.'); return; }
  if(ADMIN) await loadOutside();
  await draw();
}
/* 선생님 화면에서만 — exam·KMChC 불러와 이 학생과 짝짓기 */
async function loadOutside(){
  $('#pvHint').textContent='모의시험·학습진단 기록을 불러오는 중…';
  const [ex,km]=await Promise.all([SurveySources.loadExam(lsGet('sp_examtok')), SurveySources.loadKm()]);
  ST.ex=ex; ST.km=km;
  const me={key:'me',name:ST.name,school:ST.school,year:ST.year};
  ST.match=SurveySources.matchAll([me], ex.rows, km.students)['me'];
  const saved=JSON.parse(lsGet('sp_pick_'+CODE)||'null');
  ST.pick={ exam: saved&&saved.exam!==undefined?saved.exam:ST.match.exam.pick, km: saved&&saved.km!==undefined?saved.km:ST.match.km.pick };
  panel();
}
function stChip(st){ const t={sure:'확실',maybe:'애매 — 확인 필요',none:'없음',fail:'불러오지 못함',locked:'열쇠 필요',off:'꺼짐'}[st]||st; return '<span class="pv-st '+(st==='sure'?'sure':st==='maybe'?'maybe':st==='none'?'none':'fail')+'">'+t+'</span>'; }
function panel(){
  const m=ST.match; if(!m) return;
  const exOpt=['<option value="">붙이지 않음</option>'].concat(m.exam.options.map(o=>'<option value="'+esc(o.pid)+'"'+(ST.pick.exam===o.pid?' selected':'')+'>'+esc(o.name)+' · '+esc(o.school||'학교 모름')+' · '+esc(o.grade||'?')+'학년 · '+o.n+'회 ('+esc(o.why)+')</option>')).join('');
  const kmOpt=['<option value="">붙이지 않음</option>'].concat(m.km.options.map(o=>'<option value="'+esc(o.id)+'"'+(ST.pick.km===o.id?' selected':'')+'>'+esc(o.name)+' · '+esc(o.grade||'?')+'학년 · '+(o.ts?new Date(o.ts).toLocaleDateString('ko-KR'):'날짜 모름')+'</option>')).join('');
  $('#pvPanel').innerHTML='<div class="pv-panel"><b>기록 잇기(선생님 화면)</b> — 붙이기 전에 같은 학생인지 확인해 주세요.<br>'+
    '<label for="pvEx">모의시험 '+stChip(ST.ex.status==='ok'?m.exam.status:ST.ex.status)+'</label><select id="pvEx" aria-label="모의시험 짝">'+exOpt+'</select> '+
    '<label for="pvKm">KMChC 학습진단 '+stChip(ST.km.status==='ok'?m.km.status:ST.km.status)+'</label><select id="pvKm" aria-label="학습진단 짝">'+kmOpt+'</select> '+
    (ST.ex.status==='locked'?'<label for="pvTok">exam 관리 열쇠</label><input id="pvTok" type="password" aria-label="exam 관리 열쇠"> ':'')+
    '<button class="pv-btn" type="button" style="padding:6px 12px;font-size:13px" onclick="repick()">이대로 다시 그리기</button></div>';
}
async function repick(){
  const tk=$('#pvTok'); if(tk&&tk.value){ lsSet('sp_examtok',tk.value.trim()); await loadOutside(); }
  ST.pick={exam:$('#pvEx').value||null, km:$('#pvKm').value||null};
  lsSet('sp_pick_'+CODE, JSON.stringify(ST.pick));
  await draw();
}
async function draw(){
  $('#pvHint').textContent='보고서를 그리는 중…';
  const C=await SurveyRender.loadCommon();
  const rounds=await SurveyRender.loadRounds(ST.rows);
  let external={ status:{ exam:'off', kmchc:'off' } };
  if(ADMIN&&ST.ex) external=await SurveySources.externalFor(ST.pick, ST.ex, ST.km);
  $('#pvApp').innerHTML='';
  const out=SurveyRender.render({ host:$('#pvApp'), doc:C.doc, ans:ST.row?ST.row.ans:'', ms:ST.row?ST.row.ms:0, rows:ST.rows, roundsByCourse:rounds,
    bank:C.bank, link:C.link, external:external, name:ST.name, school:ST.school, year:ST.year, surveyDate:ST.row?ST.row.date:'', logo:LOGO });
  SurveyRender.fitScreen(document);
  document.title=(ST.name?ST.name+' · ':'')+'화학1 돌아보기 진단 보고서';
  $('#pvHint').textContent='화면은 A4 '+out.pages+'쪽 미리보기입니다. 학부모께 드릴 최종본은 «Word 보고서 저장»(표지·그래프·목차가 든 .docx) — 화면과 같은 계산입니다. 화면 인쇄는 «배경 그래픽»을 켜 주세요.';
  $('#pvPrint').disabled=false; $('#pvDocx').disabled=false;
  window.__SP_A=out.A; window.__SP_PAGES=out.pages; window.__SP_READY=true;
}
/* Word 보고서 — 화면이 방금 그린 계산 결과(window.__SP_A)를 그대로 넘긴다. 다시 세지 않는다. */
async function saveDocx(){
  if(!window.__SP_A) return;
  const C=await SurveyRender.loadCommon();
  await SurveyDocx.download($('#pvDocx'), [{ A:window.__SP_A, name:ST.name, school:ST.school, year:ST.year, surveyDate:ST.row?ST.row.date:'', bank:C.bank }]).catch(()=>{});
}
window.addEventListener('resize',()=>SurveyRender.fitScreen(document));
window.addEventListener('beforeprint',()=>{ document.querySelectorAll('.sp-sheets').forEach(s=>s.style.zoom=''); });
window.addEventListener('afterprint',()=>SurveyRender.fitScreen(document));
boot().catch(e=>{ window.__SP_ERR=String(e&&e.stack||e); msg('보고서를 그리지 못했습니다','잠시 뒤 다시 열어 주세요. ('+esc(String(e&&e.message||e))+')'); });
</script>
</body></html>
